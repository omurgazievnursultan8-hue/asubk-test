const QUEUE_WHY = ['досчёт','распоряжение'];
const QUEUE_KIND = {'досчёт':'manual', 'распоряжение':'manual', 'retro':'retro', 'reopen':'reopen'};

/* Соседи ЗАПИСИ — множественное число нарочно: у иерархического разреза шов может стоять на любом уровне, и `nbOfRec` (одно имя) их не различает — он и писался для другого, для колонки источника плоской записи. */
function nbsOfRec(id){
  const r = REC(id);
  if(!r) return [];
  if(r.somOf) return nbsOfRec(r.somOf);
  const out = [];
  const put = x => { if(x && out.indexOf(x) < 0) out.push(x); };
  if(r.levels) r.levels.forEach(L => { if(L.src === 'шов') put(nbOfSeam(L.seam)); });
  else if(r.src === 'шов') put(nbOfSeam(r.seam));
  return out;
}
/* Записи объекта, которые читаются У ЭТОГО соседа. */
function nbRecsOf(o, nbId){
  return o.dims.concat(o.inds).filter(id => nbsOfRec(id).indexOf(nbId) >= 0);
}
/* Разбор состава объекта — ОДИН на прогон, а не один на запись мира: кто чей, знает реестр, и от объекта к объекту это не меняется в течение ночи. */
function scanPlan(o){
  const plan = {own: [], nb: {}, money: []};
  o.dims.concat(o.inds).forEach(id => {
    const r = REC(id) || {};
    if(r.somOf) return;
    const nbs = nbsOfRec(id);
    if(!nbs.length) plan.own.push(id);
    else nbs.forEach(x => (plan.nb[x] || (plan.nb[x] = [])).push(id));
  });
  /* Критическая дата — у состояний: деньги события читаются на день события, и курс ночи их не двигает. */
  if(storageOf(o.id) === 'state')
    o.inds.forEach(id => { const r = REC(id); if(r && r.money && !r.somOf) plan.money.push(id); });
  return plan;
}
/* Значение БЕЗ ОБСТАНОВКИ. С волны 23 обстановки в значении нет: курс и дата курса лежат в строке (`fx`), клетка — одно число. */
function bareOf(v){ return v == null ? null : v; }
/* Проба записи на дату идёт ТЕМ ЖЕ читателем, что и сборка строки: заведи здесь второй — и «изменился» у поиска кандидатов значило бы не то же, что «изменился» у прогона, а объект, честно названный, писался бы в `same`. */
function probeRec(id, item, dateISO){
  if(!DIM(id)) return readInd(id, item, dateISO, null);
  /* Подпись входит в пробу: переименование в справочнике — изменение записи на дату, и объект, о котором промолчали бы все источники, иначе получил бы копию вчерашней строки со вчерашней подписью. */
  const v = readDim(id, item, dateISO, null);
  const l = lblsOf(DIM(id), v, dateISO);
  return l == null ? v : {v, l};
}
const sameVal = (a, b) => JSON.stringify(bareOf(a)) === JSON.stringify(bareOf(b));

/* ---- 1. ОПРОС: «КТО ИЗМЕНИЛСЯ ПОСЛЕ T» ---- */
function fedChanged(recs, item, sinceISO, atISO){
  for(let i = 0; i < recs.length; i++)
    if(!sameVal(probeRec(recs[i], item, sinceISO), probeRec(recs[i], item, atISO))) return true;
  return false;
}
/* ---- 2. КРИТИЧЕСКАЯ ДАТА: ВЕЛИЧИНА МЕНЯЕТСЯ ОТ ВРЕМЕНИ, БЕЗ СОБЫТИЯ ---- */
function movedCurs(sinceISO, atISO){
  const out = [];
  Object.keys(RATES).forEach(cur => {
    if(cur === 'KGS') return;
    if(RATES[cur].some(r => r[0] > worldAt(sinceISO) && r[0] <= worldAt(atISO))) out.push(cur);
  });
  return out;
}
/* В какой валюте объект стоит на дату. */
function fxCursOf(money, item, dateISO){
  const out = [];
  money.forEach(id => {
    const m = IND(id);
    const c = m ? readIndRaw(m, id, item, dateISO, null) : null;
    if(!c) return;
    (c.curs || []).forEach(x => { if(x && x !== 'KGS' && out.indexOf(x) < 0) out.push(x); });
  });
  return out;
}
/* ---- 3. СВОЙ ФАКТ ВЛАДЕЛЬЦА МНОЖЕСТВА ---- */
function ownChanged(recs, item, sinceISO, atISO){
  for(let i = 0; i < recs.length; i++)
    if(!sameVal(probeRec(recs[i], item, sinceISO), probeRec(recs[i], item, atISO))) return true;
  return false;
}

/* Последний СОСТОЯВШИЙСЯ прогон строго раньше спрошенной даты — окно для времени и для
   владельца множества. Пропуск в счёт не идёт (ИС-20): в ту ночь никто ничего не смотрел. */
function lastScan(st, dateISO){
  let hit = null;
  st.runs.forEach(r => { if(r.kind !== 'пропуск' && r.date < dateISO && (hit == null || hit < r.date)) hit = r.date; });
  return hit;
}
/* Третья находка волны, и её в тоже нет. */
function seenAfter(st, dateISO){
  return st.runs.some(r => r.kind !== 'пропуск' && r.date >= dateISO);
}

function candidatesOf(st, dateISO, silent){
  const prev = lastScan(st, dateISO);
  if(prev == null) return {full:true, from:null, set:{}, by:{}, polls:[], moved:[],
    why:'первый прогон: сравнивать не с чем, и кандидатов не из чего собрать'};
  if(seenAfter(st, dateISO)) return {full:true, from:prev, set:{}, by:{}, polls:[], moved:[],
    why:'повторный прогон за пройденную дату: он УДОСТОВЕРЯЕТ состояние, а не приращает его (довод защёлки, ADR-0221 §3)'};
  const by = {}; CAND_SRC.forEach(k => by[k] = []);
  const set = {};
  const add = (src, objId, ref, why) => {
    by[src].push({obj: objId, ref, why: why || null});
    const k = objId+'|'+ref;
    if(!set[k]) set[k] = src;                    /* Первый назвавший — для журнала. */
  };
  /* У КАЖДОГО СОСЕДА СВОЙ `T`. */
  const polls = NEIGHBOURS.map(nb => {
    const T = (st.polls[nb.id] || {}).T || null;
    const mute = (silent || {})[nb.id] || null;
    const why = !nb.asks ? 'не умеет отвечать на «кто изменился после T» — обходится полностью (ADR-0221 §5)'
      : mute ? 'не ответил в эту ночь: '+mute+' — обходится полностью'
      : T == null ? 'момент T не установлен: этого соседа ещё не спрашивали'
      : T >= dateISO ? 'окно опроса пусто: T не раньше спрашиваемой даты'
      : null;
    return {nb: nb.id, T, from: T, to: dateISO, ok: !why, why, degraded: !!why,
            named: 0, scanned: 0, asks: !!nb.asks};
  });
  const pollOf = {}; polls.forEach(p => pollOf[p.nb] = p);
  /* Очередь — способ ПОСТАВИТЬ работу, опрос — способ её НАЙТИ; одно наполняет другое и ни одно не отменяет другого. */
  const queued = {};
  st.queue.forEach(q => { if(!q.done) queued[q.obj+'|'+q.ref] = q.why; });
  /* ОЧЕРЕДЬ НЕПОЛНЫХ — САМИ СТРОКИ. Последняя строка записи с молчавшим соседом зовёт запись в ночь, пока сосед не ответит; задачи для этого нет. */
  const lastOf = {};
  st.rows.forEach(r => {
    if(r.date >= dateISO || isLegacyRow(r)) return;
    const k = r.obj+'|'+r.ref;
    if(!lastOf[k] || lastOf[k].date < r.date) lastOf[k] = r;
  });
  const moved = movedCurs(prev, dateISO);
  st.objects.forEach(o => {
    const plan = scanPlan(o);
    (WORLD[o.id] || []).forEach(item => {
      /* Нерождённый в кандидаты не попадает вовсе: состав кандидатов — счёт работы, и мёртвые души в нём завысили бы её ровно на неродившихся. */
      const bornAt = bornOn(o, item, dateISO);
      /* Рождение дня X видно срезу X+1. */
      if(bornAt == null || bornAt >= dateISO) return;
      const k = o.id+'|'+item.id;
      if(queued[k]) add('очередь', o.id, item.id, queued[k]);
      else if(lastOf[k] && silentOf(lastOf[k]).length)
        add('очередь', o.id, item.id, 'строка '+lastOf[k].date+' неполна: молчали '+silentOf(lastOf[k]).join(', '));
      if(bornAt >= prev) add('свой факт', o.id, item.id, 'рождение — '+bornAt);
      else if(ownChanged(plan.own, item, prev, dateISO)) add('свой факт', o.id, item.id, 'изменился собственный датированный факт');
      if(moved.length && plan.money.length){
        const cur = fxCursOf(plan.money, item, dateISO).filter(c => moved.indexOf(c) >= 0);
        if(cur.length) add('критическая дата', o.id, item.id, 'курс '+cur.join(', ')+' менялся после '+prev);
      }
      NEIGHBOURS.forEach(nb => {
        const recs = plan.nb[nb.id];
        if(!recs || !recs.length) return;        /* Объект к соседу не ходит. */
        const p = pollOf[nb.id];
        if(p.degraded){ p.scanned++; add('опрос', o.id, item.id, 'сосед «'+nb.id+'» '+p.why); return; }
        if(fedChanged(recs, item, p.T, dateISO)){
          p.named++; add('опрос', o.id, item.id, 'сосед «'+nb.id+'» назвал');
        }
      });
    });
  });
  return {full:false, why:null, from: prev, set, by, polls, moved};
}
/* Состав кандидатов — РЕКВИЗИТ ПРОГОНА, а не вывод из строк: иначе «кандидатов не было» неотличимо от «опрос не состоялся», а это разные ночи. */
function candSummary(c){
  if(c.full) return {scan:'полный', why: c.why, from: c.from, n: 0, by: {}, polls: [], moved: []};
  const by = {};
  CAND_SRC.forEach(k => by[k] = c.by[k].length);
  return {scan:'кандидаты', why: null, from: c.from, n: Object.keys(c.set).length,
          by, first: (() => { const f = {}; CAND_SRC.forEach(k => f[k] = 0);
                              Object.keys(c.set).forEach(k => f[c.set[k]]++); return f; })(),
          polls: c.polls.map(p => ({nb:p.nb, T:p.T, ok:p.ok, why:p.why, degraded:p.degraded,
                                    named:p.named, scanned:p.scanned, asks:p.asks})),
          moved: c.moved.slice()};
}

/* ------------- ОЧЕРЕДЬ ПЕРЕСТРОЕНИЯ ------------- */
/* Кого касается заведённая запись реестра: все живые записи мира того объекта, которым она спрашивается. */
function queueRegChange(st, rec){
  const o = OBJ(rec.obj);
  if(!o) return 0;
  let n = 0;
  (WORLD[o.id] || []).forEach(item => {
    const b = bornOn(o, item, rec.since);
    if(b == null || b >= rec.since) return;
    enq(st, o.id, item.id, 'досчёт', rec.since, st.role,
        'заведена запись реестра «'+rec.name+'» с '+rec.since);
    n++;
  });
  return n;
}
/* У ЗАПИСИ НЕ БОЛЬШЕ ОДНОЙ ОТКРЫТОЙ ЗАДАЧИ. Новая сливается с открытой: пересчитывать — с более ранней даты (`from`), закрывать — не раньше самой поздней поставленной работы (`at`), поводы и заметки копятся. */
function enq(st, objId, ref, why, atISO, by, note, fromISO){
  const from = fromISO || atISO;
  const live = st.queue.find(q => !q.done && q.obj === objId && q.ref === ref);
  if(live){
    if(from < live.from) live.from = from;
    if(atISO > live.at) live.at = atISO;
    if(live.whys.indexOf(why) < 0) live.whys.push(why);
    if(note && live.notes.indexOf(note) < 0) live.notes.push(note);
    live.merged++;
    return live;
  }
  const rec = {obj: objId, ref, kind: QUEUE_KIND[why] || 'manual', why, whys: [why], from, at: atISO,
               by: by || 'прогон', note: note || null, notes: note ? [note] : [], merged: 0, done: null};
  st.queue.push(rec);
  return rec;
}
/* ---------- ОТВЕТ СОСЕДА — КЛЮЧ И ДАТА ДЕЙСТВИЯ ---------- */
function takeFeed(st, dateISO, silent){
  const out = {n: 0, marks: {}};
  st.nbFeed.forEach(f => {
    if(f.taken || f.at > dateISO || (silent || {})[f.nb]) return;
    f.taken = dateISO;
    /* Действие дня X видно срезу X+1; день закрытого месяца не пишется — retro начинается с первого открытого дня. */
    let from = dayShift(f.from, 1);
    f.closed = ST.isClosed(from);
    if(f.closed){
      const m = markStates(st, f.obj, f.ref, f.from, dateISO);
      out.marks[f.obj] = (out.marks[f.obj] || 0) + m;
    }
    while(ST.isClosed(from) && from < dateISO) from = dayShift(from, 1);
    enq(st, f.obj, f.ref, 'retro', dateISO, 'прогон', 'сосед «'+f.nb+'»: действие с '+f.from, from);
    out.n++;
  });
  return out;
}
/* Состав retro-прогона — записи задач, и только они: кандидат — адрес работы. */
function onlyScan(keys){
  const c = {full:false, why:null, from:null, set:{}, by:{}, polls:[], moved:[]};
  CAND_SRC.forEach(k => c.by[k] = []);
  keys.forEach(k => {
    const i = k.indexOf('|');
    c.set[k] = 'очередь';
    c.by['очередь'].push({obj: k.slice(0, i), ref: k.slice(i + 1), why: 'retro'});
  });
  return c;
}
/* ПЕРЕСЧЁТ С ДАТЫ ДЕЙСТВИЯ. Открытые дни открытых задач — от `from` до кануна ночи — пересчитываются по порядку прогоном вида `retro`: только записи задач, `T` не двигается, дни закрытого месяца и удалённые дни не пишутся. */
function retroPass(st, dateISO){
  const tasks = st.queue.filter(q => !q.done && q.from < q.at && q.from < dateISO);
  const done = [];
  if(!tasks.length) return done;
  for(let d = tasks.reduce((m, q) => q.from < m ? q.from : m, dateISO); d < dateISO; d = dayShift(d, 1)){
    if(ST.isClosed(d) || preLaunch(d)) continue;
    const cal = calendarRow(st, periodOf(d));
    if(!cal || (cal.daysDropped && d !== sliceOfMonth(periodOf(d)))) continue;
    const keys = tasks.filter(q => q.from <= d).map(q => q.obj+'|'+q.ref);
    doRun(st, d, 'retro', 'планировщик', 'пересчёт с даты действия: '+keys.join(', '), null, {only: keys, keepT: true});
    done.push(d);
  }
  return done;
}
/* Способ хранения — реквизит РЕЛИЗА, а не объекта: таблицу строк объявляет миграция вместе со способом, и второго объявления рядом с объектом нет. */
function storageOf(objId){
  const rel = (ST.state && ST.state.release) || RELEASE;
  return (rel.tables[objId] || {}).storage || null;
}
ST.storageOf = objId => storageOf(objId);
/* Полный обход объявляется причиной. */
const CATCHUP_SCAN = 'догон пропущенной ночи: дата удостоверяется, а не приращается (ADR-0245 §2, ADR-0221 §3)';
const REOPEN_SCAN = 'повторное открытие: пересчитывается итог месяца, дни не восстанавливаются (ADR-0238 §5, ADR-0245 §2)';
function fullScan(why){ return {full:true, from:null, set:{}, by:{}, polls:[], moved:[], why}; }
/* Копия вчерашней строки НЕКАНДИДАТУ. Некандидат — объект, о котором ни один источник не сказал «посмотри»: соседи не назвали, курс не двигал, свой факт не менялся. */
function copyRow(y, dateISO){ return Object.assign(clone(y), {date: dateISO, fixed: null, by: 'прогон'}); }
/* ---------- ДОГОН ---------- */
const NIGHTLY = ['плановый','внеплановый','догон'];
function gapsBefore(st, dateISO){
  const done = st.runs.filter(r => NIGHTLY.indexOf(r.kind) >= 0 && r.date < dateISO).map(r => r.date).sort();
  if(!done.length) return [];
  const out = [];
  for(let d = dayShift(done[done.length - 1], 1); d < dateISO; d = dayShift(d, 1)){
    /* Месяц с удалёнными днями — не дыра и после повторного открытия: дни закрытого месяца не восстанавливаются, и догнать их значило бы собрать строки мира, которого уже не спросить. */
    const cal = calendarRow(st, periodOf(d));
    if(!latchOf(st, periodOf(d), MY_LAYER) && !(cal && cal.daysDropped)) out.push(d);
  }
  return out;
}
/* ADR-0245 §6: периода нет в календаре — это не открытый период. */
function calendarGap(st, dateISO){
  const month = periodOf(dateISO);
  return calendarRow(st, month) ? null : 'периода '+monLabel(month)+' нет в календаре учётных периодов: срезу '+
    fmt(dateISO)+' некуда лечь (ADR-0245 §6)';
}
function skipRecord(st, dateISO, why){
  const rec = {date: dateISO, kind:'пропуск', at: st.today, actor:'планировщик', reason: why, written:0};
  st.runs.push(rec);
  return rec;
}
/* Догон отвечает двумя списками: догнанные даты (`dates`) и даты вне календаря (`noCalendar`) — вторые строк не получают, а получают пропуск. */
function catchUp(st, dateISO, silent){
  const dates = [], noCalendar = [];
  gapsBefore(st, dateISO).forEach(d => {
    const why = calendarGap(st, d);
    if(why){
      if(!st.runs.some(r => r.kind === 'пропуск' && r.date === d && r.reason === why))
        skipRecord(st, d, why).before = dateISO;
      noCalendar.push(d);
      return;
    }
    doRun(st, d, 'догон', 'планировщик', 'догон пропущенной ночи '+fmt(d)+' перед ночью '+
      fmt(dateISO)+' (ИС-54, ADR-0245 §2)', silent, {full: true, keepT: true, why: CATCHUP_SCAN});
    /* Перед какой ночью шёл догон — реквизит записи: предупреждение о пропуске называет его, а `at` у демо-мира один на все ночи сида. */
    st.runs[st.runs.length - 1].before = dateISO;
    dates.push(d);
  });
  return {dates, noCalendar};
}
/* ЗАПРЕТ ЗАПИСИ В ЗАКРЫТОЕ — у ВСЕХ таблиц и в одном месте. */
/* ДВЕРЬ одна на запись и на снятие строки (правка ревью 2). */
function rowGate(st, row, opts){
  opts = opts || {};
  if(!opts.legacy && latchOf(st, periodOf(row.date), MY_LAYER))
    return {i: -1, why:'строка '+row.ref+' на '+fmt(row.date)+' не пишется: период '+
      monLabel(periodOf(row.date))+' зафиксирован, и в закрытое не пишет никто — поправка '+
      'события ложится в месяц исправления (ИС-8, ADR-0239)'};
  const i = st.rows.findIndex(r => r.obj === row.obj && r.ref === row.ref &&
                                   r.date === row.date && r.part === row.part);
  if(i >= 0 && st.rows[i].fixed) return {i, why:'строка '+row.ref+' на '+fmt(row.date)+
    ' зафиксирована (ИС-8)'};
  return {i, why: null};
}
/* ЗАКРЫТЫЙ СЛОВАРЬ СТЕРЕЖЁТ ЗАПИСЬ. CHECK — свойство таблицы, и нарушить его не может ни один писатель: прогон, доспрос, поправка события, выпуск легаси идут одной дверью. */
function checkRow(st, row){
  const t = st.release.tables[row.obj], ck = (t && t.checks) || {};
  for(const id of Object.keys(row.dims)){
    const d = DIM(id);
    if(!d || d.vtype !== 'code' || !ck[d.col]) continue;
    if(ck[d.col].indexOf(row.dims[id]) < 0) return {col: d.col, value: row.dims[id]};
  }
  return null;
}
/* ИМЕНА `now` СВЕРЯЮТСЯ С РЕЕСТРОМ. Каждое — запись реестра этого объекта, и величина с этим именем в строке лежит: молчание соседа — отсутствие, а не «текущее». */
function nowBad(row){
  const o = OBJ(row.obj), list = row.now;
  if(!Array.isArray(list)) return 'признак «текущее» — массив имён, а не «'+typeof list+'»';
  for(const id of list){
    if(!o || (o.dims.indexOf(id) < 0 && o.inds.indexOf(id) < 0)) return 'имя «'+id+'» — не величина объекта';
    if(!((row.dims && row.dims[id] != null) || (row.inds && row.inds[id] != null))) return 'величины «'+id+'» в строке нет: молчание — не «текущее»';
    if(list.indexOf(id) !== list.lastIndexOf(id)) return 'имя «'+id+'» названо дважды';
  }
  return null;
}
function writeRow(st, row, opts){
  const g = rowGate(st, row, opts);
  if(g.why) return {ok:false, why: g.why};

    const back = pairs.some(pr => { const l = lastOf(pr.f.target); return isOff(l) && !isOff(rowOf(pr)) && !wholeOff(l); });
    const setChange = born.length > 0 || gone.length > 0 || flip || back;
    const named = cand.full || !!cand.set[o.id+'|'+item.id] || setChange;
    if(!named){ t.skip++; return 0; }
    if(laterNightOf(st, o, item.id, mine, D)){ t.kept++; return 0; }
    const raws = pairs.map(pr => ({tgt: pr.f.target, raw: rowOf(pr), born: born.indexOf(pr) >= 0}))
      .concat(gone.map(tg => ({tgt: tg, raw: offRow(tg)})));
    const mute = uniq([].concat(...raws.map(x => silentOf(x.raw))));
    if(mute.length){
      if(!st.queue.some(q => !q.done && q.obj === o.id && q.ref === item.id))
        enq(st, o.id, item.id, 'досчёт', D, 'прогон', 'молчали: '+mute.join(', '));
      t.same++;
      return 0;
    }
    raws.forEach(({tgt, raw, born: isBorn}) => {
      /* Пара, родившаяся у известной меры, — смена набора: ложится на эту ночь. */
      if(isBorn){ ops.push({put: Object.assign(raw, {date: D}), tgt, born: true}); return; }
      const last = lastOf(tgt);
      if(!last) return;
      /* Строка раньше последней — исправленная поправкой (зафиксированная или из другого месяца) или прежнее состояние пары до смены набора (строка того же месяца). */
      const prev = fullAt(st, o.id, item.id, tgt, eveOf(last.date));
      /* На месте строка пары переписывается, если она не зафиксирована, лежит в периоде ночи и не раньше ночи при смене набора: смена набора ответ на прошедшую дату не меняет. */
      const here = !last.fixed && periodOf(last.date) === periodOf(D) && (last.date === D || !setChange);
      if(here && prev && !deltaDiff(prev, raw).length && (last.date === D || corrOf(prev, last))){
        ops.push({drop: last, tgt, fields: deltaDiff(last, raw)});
        return;
      }
      const diff = deltaDiff(last, raw);
      if(!diff.length) return;
      if(here){
        /* Месяц строки: строка пары переписывается на месте, перезапись — в журнал. */
        ops.push({put: Object.assign(raw, {date: last.date}), tgt,
                  sp: splitDiff(last, raw, rowDiff(last, raw)),
                  mark: corrOf(prev, last) ? {slice: prev.date, changed: deltaDiff(prev, raw)} : null});
        return;
      }
      /* На эту ночь: из другого месяца или у зафиксированной строки — поправка полного состояния и маркер с целью, исправленная строка не трогается; у строки того же месяца раньше ночи при смене набора — новая строка на D, прежняя отвечает за свои даты. */
      ops.push({put: Object.assign(raw, {date: D}), tgt, mark: corrOf(last, raw) ? {slice: last.date, changed: diff} : null});
    });
    /* Обойдена и не изменилась — «без изменений» один раз на меру, и работа из очереди сделана. */
    if(!ops.length){ dequeueSeen(st, o, item, D); t.same++; return 0; }
  }
  /* Отбитый набор работу из очереди НЕ снимает: изменение не легло, и его применит ближайшая открытая ночь (правка ревью 2). */
  if(ops.some(x => rowGate(st, x.put || x.drop).why)){ t.kept++; return 0; }
  let w = 0, muted = null, refused = false;
  ops.forEach(x => {
    if(x.drop){
      /* Снятие — перезапись строки открытого месяца, и идёт в журнал. */
      dropRow(st, x.drop);
      unmarkCorrected(st, o, item.id, x.tgt, x.drop.date);
      t.rewrote.push({ref: item.id, target: x.tgt, fields: x.fields});
      return;
    }
    if(!writeRow(st, x.put).ok){ refused = true; return; }
    t.n++; t.written++; w++;
    const m = silentOf(x.put);
    if(m.length) t.partial++;
    muted = uniq((muted || []).concat(m));
    if(x.born){ t.born++; t.created.push({ref: item.id, target: x.tgt}); }
    if(x.sp && x.sp.rewrote.length) t.rewrote.push({ref: item.id, target: x.tgt, fields: x.sp.rewrote});
    if(x.sp && x.sp.filled.length)  t.filled.push({ref: item.id, target: x.tgt, fields: x.sp.filled});
    if(x.mark){ markCorrected(st, o, item.id, x.tgt, x.mark.slice, null, x.mark.changed, x.put.date, D);
                t.marks++; t.corr++; }
  });
  /* Отбитая запись — «не тронуто» один раз на меру, как и отбитый набор; работа из очереди снимается только с легшим набором. */
  if(refused) t.kept++;
  else if(known) dequeueSeen(st, o, item, D);
  return w;
}
/* СОБЫТИЕ НА ДАТУ — одна функция на способ хранения (`stat_repay_at`, `stat_receipt_at`, `stat_measure_at`): у дельты — сумма строк не позже даты, у полного состояния — последняя строка каждой пары. */
function eventAt(st, objId, D){
  const kind = storageOf(objId);
  const refs = uniq(st.rows.filter(r => r.obj === objId && r.date <= D).map(r => r.ref));
  if(kind === 'event_delta') return refs.map(ref => deltaAt(st, objId, ref, D));
  if(kind === 'event_full') return [].concat(...refs.map(ref =>
    uniq(st.rows.filter(r => r.obj === objId && r.ref === ref && r.date <= D).map(r => r.part))
      .map(tgt => fullAt(st, objId, ref, tgt, D))));
  return null;
}
/* СВЕРКА В КОНЦЕ ПРОГОНА. Счётчики — обещание, а не отчёт: форма — по способу хранения; у события рождённых и поправок не больше написанного; у состояния строк на дату ровно столько, сколько прогон назвал написанными (строка на каждую дату). */
function reconcileRun(st, i){
  const r = st.runs[i];
  if(!r || !r.parts) return null;
  const bad = [];
  r.parts.forEach(p => {
    const ev = p.store === 'event_delta' || p.store === 'event_full';
    if(typeof p.markers !== 'number') bad.push(p.obj+': markers не назван');
    if(ev){
      if(p.copied !== null || p.new_rows == null || p.corr_rows == null)
        bad.push(p.obj+': у события «скопировано» не относится, new_rows и corr_rows обязательны');
      else if(p.new_rows + p.corr_rows > p.written)
        bad.push(p.obj+': рождённых и поправок '+(p.new_rows + p.corr_rows)+' при написанных '+p.written);
      return;
    }
    if(p.new_rows !== null || p.corr_rows !== null) bad.push(p.obj+': у состояния new_rows и corr_rows не относятся');
    if(p.store !== 'state') return;
    /* Тождество состояния: написанное — пересчитанное, «без изменений» и копии. */
    if(p.written !== p.n + p.same + p.copied)
      bad.push(p.obj+': написано '+p.written+' ≠ '+p.n+' + '+p.same+' + '+p.copied);
    const on = st.rows.filter(x => x.obj === p.obj && x.date === r.date && !x.fixed).length;
    if(on !== p.written) bad.push(p.obj+': строк на '+r.date+' — '+on+', написано '+p.written);
  });
  r.status = bad.length ? 'failed' : 'done';
  r.failed = bad;
  return r.status;
}
ST.reconcileRun = i => {
  const k = i == null ? ST.state.runs.length - 1 : i;
  const s = reconcileRun(ST.state, k);
  return {ok: s === 'done', status: s, failed: clone((ST.state.runs[k] || {}).failed || [])};
};
function doRun(st, dateISO, kind, actor, reason, silent, how){
  how = how || {};
  let written = 0;
  const parts = [];
  /* Кого берёт эта ночь. */
  const cand = how.full ? fullScan(how.why) : how.only ? onlyScan(how.only) : candidatesOf(st, dateISO, silent);
  st.objects.forEach(o => {
    const t = newTally();
    const store = storageOf(o.id);
    /* Повторное открытие пересчитывает ИТОГ — строки состояний на первое число; у событий итога на дату нет, их строки и есть месяц. */
    if(how.statesOnly && store !== 'state'){ parts.push(partOf(o, t)); return; }
    /* Событие пишется своим путём: исходная строка, правка на месте в месяце строки, поправка и маркер — из другого месяца, открыт он или закрыт. */
    if(store === 'event_delta' || store === 'event_full'){
      const night = store === 'event_delta' ? deltaNight : fullNight;
      eachAlive(o, dateISO, t, item => { written += night(st, o, item, dateISO, cand, silent, t); });
      parts.push(partOf(o, t)); return;
    }
    eachAlive(o, dateISO, t, item => {
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(!cand.full && !cand.set[o.id+'|'+item.id]){
        /* Состояние получает строку на КАЖДУЮ дату: некандидату — копию вчерашней. */
        if(i >= 0){ if(st.rows[i].fixed) t.kept++; else { t.same++; t.written++; written++; } return; }
        const y = lastRowBefore(st, o.id, item.id, dateISO);
        if(y && y.date === eveOf(dateISO)){
          /* Отбитая запись написанной не считается: она «не тронуто», как зафиксированная строка (правка ревью 1) — так у всех писателей ниже. */
          if(writeRow(st, copyRow(y, dateISO)).ok){ t.copied++; t.written++; written++; } else t.kept++;
          return;
        }
      }
      /* Поставленная работа снимается ОБХОДОМ, а не записью строки: очередь — адрес, а не обещание числа. */
      /* Работа снимается, только если строка пройдёт дверь: отбитая строка закрытого периода работу не снимает — её применит ближайшая открытая ночь, как у событий. */
      if(!rowGate(st, {obj: o.id, ref: item.id, date: dateISO, part: null}).why) dequeueSeen(st, o, item, dateISO);
      const row = buildRow(o.id, item, dateISO, silent);
      /* Неполной считается НАПИСАННАЯ строка, а не собранная. */
      const part = silentOf(row).length > 0;
      /* ADR-0208 §5: неполная строка САМА ЗОВЁТ запись в следующую ночь (`candidatesOf`) — «та же очередь с другим поводом попадания». */
      if(i >= 0){
        if(st.rows[i].fixed){ t.kept++; return; }
        const ch = rowDiff(st.rows[i], row);
        /* Повторный прогон той же даты, ничего не изменивший, — не перезапись. */
        if(!ch.length){ t.same++; t.written++; written++; return; }
        /* Перезапись строки внутри открытого периода — СОБЫТИЕ ЖУРНАЛА: что изменилось и по каким записям реестра. */
        const sp = splitDiff(st.rows[i], row, ch);
        if(!writeRow(st, row).ok){ t.kept++; return; }
        if(sp.rewrote.length) t.rewrote.push({ref: item.id, fields: sp.rewrote});
        if(sp.filled.length)  t.filled.push({ref: item.id, fields: sp.filled});
        t.n++; t.written++; written++; if(part) t.partial++; return;
      }
      const prev = lastRowBefore(st, o.id, item.id, dateISO);
      /* Дозаполнение через ДЕНЬ ловится тем же местом и той же меркой: строки на эту дату ещё нет, но предыдущая была неполна, и появление величины — изменение состояния. */
      let fill = [];
      if(prev){
        const ch = rowDiff(prev, row);
        if(!ch.length){
          /* Не менялось — и строка всё равно ложится: у состояния строка на каждую дату открытого месяца, и «не менялось» больше не выводится из её отсутствия. */
          if(!writeRow(st, row).ok){ t.kept++; return; }
          t.same++; t.written++; written++; if(part) t.partial++; return;
        }
        fill = splitDiff(prev, row, ch).filled;
      }
      /* Рождение и дозаполнение считаются и идут в журнал ПОСЛЕ удачной записи: отбитая строка не родилась и ничего не дозаполнила (правка ревью 2). */
      if(!writeRow(st, row).ok){ t.kept++; return; }
      if(!prev) t.born++;
      if(fill.length) t.filled.push({ref: item.id, fields: fill});
      t.n++; t.written++; written++; if(part) t.partial++;
    });
    parts.push(partOf(o, t));
  });
  /* Маркеры, поставленные ответом соседа этой ночи, — её счётчик `markers`. */
  if(how.marks) parts.forEach(p => { p.markers += how.marks[p.obj] || 0; });
  st.runs.push({date: dateISO, kind, at: st.today, actor, reason, written, parts,
    /* Кто молчал в ЭТУ ночь — реквизит журнала, а не вывод из строк: сосед, молчавший по объекту, у которого в ту ночь ничего не изменилось, строки не оставил вовсе, и восстановить его молчание было бы нечем (§7 — повод заданиям считается по прогонам, а не по строкам). */
    silent: silent ? clone(silent) : null,
    /* Состав кандидатов по каждому источнику, моменты `T` и деградации — ТОЖЕ реквизит прогона. */
    cand: candSummary(cand)});
  reconcileRun(st, st.runs.length - 1);
  /* `T` двигает ТОЛЬКО ночной прогон: догон и повторное открытие удостоверяют прошлую дату, и сдвинь они `T` — следующая ночь спросила бы соседа с уже съеденной даты. */
  if(!how.keepT) NEIGHBOURS.forEach(nb => {
    if(!nb.asks || (silent || {})[nb.id]) return;
    const p = st.polls[nb.id] || (st.polls[nb.id] = {T: null, at: null});
    if(p.T == null || p.T < dateISO){ p.T = dateISO; p.at = st.today; }
  });
  return written;
}
function fixMonth(st, month, who, atISO){
  let n = 0;
  /* Редакция формы проставляется ЗДЕСЬ, вместе с остальными реквизитами акта фиксации: «действующая» — потому что строку собрал прогон по сегодняшнему перечню объекта. */
  st.rows.forEach(r => { if(periodOf(r.date) === month && !r.fixed){
    r.fixed = {period: month, at: atISO, by: who, edition: FORM.NOW}; n++; } });
  return n;
}
/* Обратная сторона fixMonth, и она ОБЯЗАНА существовать: «строки пишутся заново» без снятия фиксации остаётся словом. */
function unfixMonth(st, month){
  let n = 0;
  /* Легаси-строка не расфиксируется НИКОГДА, и это не оговорка на всякий случай: снять с неё фиксацию значит объявить, что её кто-то перепишет, — а переписывать её нечем. */
  st.rows.forEach(r => { if(periodOf(r.date) === month && r.fixed && !isLegacyRow(r)){ r.fixed = null; n++; } });
  return n;
}

/* ------------- ДОСПРОС НА ЗАКРЫТИИ ------------- */
/* Состояние КАЖДОГО соседа на доспросе — реквизит записи журнала. */
function repollNbs(st, month, silent){
  return NEIGHBOURS.map(nb => {
    const mute = (silent || {})[nb.id] || null;
    const lt = nb.layer ? latchOf(st, month, nb.layer) : null;
    return {nb: nb.id, name: nb.name, layer: nb.layer || null, ok: !mute, reason: mute,
            final: !!lt,
            why: mute ? 'на доспросе не ответил: '+mute
              : nb.layer
                ? (lt ? 'колонка «'+nb.layer+'» периода '+monLabel(month)+' проставлена ('+
                        lt.by+', '+fmt(lt.at)+'): величины окончательные (ADR-0204 §3, ADR-0216 §3)'
                      : 'колонка «'+nb.layer+'» периода '+monLabel(month)+
                        ' не проставлена: величины предварительные')
                : 'учётного слоя у соседа нет: окончательности он не удостоверяет (границы ADR-0216)'};
  });
}
const LATCH_SCAN = 'защёлка удостоверяет состояние, а не приращение: обход идёт по всему охвату (ADR-0221 §3)';
function repoll(st, month, who, atISO, silent){
  /* Итог месяца — строки состояний на первое число следующего. */
  const dateISO = sliceOfMonth(month);
  const nbs = repollNbs(st, month, silent);
  let made = 0, again = 0, written = 0;
  const parts = [], mute = [];
  /* ДОСПРОС ИДЁТ ПЕРВЫМ И ВНЕ ТРАНЗАКЦИИ ЗАКРЫТИЯ. Всё, что он узнал, пишется и при отказе НЕ ОТКАТЫВАЕТСЯ: дописанное и переписанное — правда о сегодняшнем мире, и стирать её ради отказа значило бы снова спрашивать то, на что уже ответили. */
  st.objects.forEach(o => {
    const t = newTally();
    if(storageOf(o.id) !== 'state'){ parts.push(partOf(o, t)); return; }
    eachAlive(o, dateISO, t, item => {
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(i >= 0 && st.rows[i].fixed){ t.kept++; return; }
      const row = buildRow(o.id, item, dateISO, silent);
      row.by = 'защёлка';
      const nb = silentOf(row);
      if(nb.length){ mute.push({obj: o.id, ref: item.id, nbs: nb}); t.partial++; return; }
      /* Отбитая запись написанной не считается (правка ревью 1). */
      if(i < 0){ if(!writeRow(st, row).ok){ t.kept++; return; } t.n++; t.written++; made++; written++; return; }
      const ch = rowDiff(st.rows[i], row);
      if(!ch.length){ t.have++; return; }
      const sp = splitDiff(st.rows[i], row, ch);
      if(!writeRow(st, row).ok){ t.kept++; return; }
      if(sp.rewrote.length) t.rewrote.push({ref: item.id, fields: sp.rewrote});
      if(sp.filled.length)  t.filled.push({ref: item.id, fields: sp.filled});
      t.n++; t.written++; again++; written++;
    });
    parts.push(partOf(o, t));
  });
  /* Запись журнала делается всегда: доспрос СОСТОЯЛСЯ, даже если кончился отказом, — а «доспрос не отвечен» и «закрытия не пробовали» разные ночи. */
  st.runs.push({date: dateISO, kind:'защёлка', at: atISO, actor: who,
    reason: 'доспрос перед закрытием периода '+monLabel(month)+(mute.length ? ': не отвечено' : ''),
    written, parts, repoll: {nbs, made, again, mute: mute.length, done: !mute.length},
    cand: {scan:'полный', why: LATCH_SCAN, from:null, n:0, by:{}, polls:[], moved:[]}});
  return {ok: !mute.length, nbs, mute, made, again, written, parts};
}

/* ------------ КАЛЕНДАРЬ УЧЁТНЫХ ПЕРИОДОВ ---------- */
function calendarRow(st, month){ return st.periods.find(p => p.month === month) || null; }
function latchOf(st, month, layer){
  const p = calendarRow(st, month);
  return p && p.latches[layer] ? p.latches[layer] : null;
}
/* ЕДИНСТВЕННОЕ место, где колонка становится проставленной, — и порядок стережётся здесь, а не у вызывающего. */
/* ПРОВЕРКА ОТДЕЛЕНА ОТ ПРОСТАНОВКИ — не ради опрятности, а потому что между ними теперь стоит работа: доспрос. */
function closeLayerCheck(st, month, layer, who){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  if(!who) return {ok:false, why:'колонка «'+layer+'» без актора не проставляется: период закрывает человек, а не календарь (ИС-9)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: «строки нет» и «строка пуста» — разные состояния (ADR-0204, границы)'};
  /* Легаси-период ПРИШЁЛ ЗАКРЫТЫМ, и отказ говорит именно это, а не «колонка уже проставлена»: второе звало бы к перезакрытию распоряжением, которого здесь не бывает. */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: он загружен УЖЕ ЗАКРЫТЫМ ('+row.legacy.by+', '+fmt(row.legacy.at)+', '+
    row.legacy.act+') и заново не закрывается — закрывать нечего, строки пришли в состоянии '+
    'окончательной фиксации (ИС-41, ADR-0207 §3)'};
  const was = row.latches[layer];
  if(was) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+' уже проставлена ('+
    was.by+', '+fmt(was.at)+'): перезакрытие идёт распоряжением и сверху вниз (ADR-0204 §4)'};
  const expected = st.months.find(m => !latchOf(st, m, layer));
  if(month !== expected) return {ok:false, why:'периоды закрываются по порядку: следующий по слою «'+
    layer+'» — '+monLabel(expected)};
  if(sliceOfMonth(month) > st.today) return {ok:false, why:'период '+monLabel(month)+
    ' ещё не завершён: его итог — срез на начало '+fmt(sliceOfMonth(month))+
    ', закрытие возможно с этой даты (ADR-0245 §9)'};
  /* Отказ НАЗЫВАЕТ незакрытый слой: «нельзя» без имени препятствия — половина ответа (§8.4), а слоёв под тобой может быть и два. */
  const empty = LAYERS.slice(0, i).filter(L => !row.latches[L]);
  if(empty.length) return {ok:false, blockedBy: empty[0], why:'колонка «'+layer+'» периода '+
    monLabel(month)+' не проставляется: не закрыт слой «'+empty[0]+'»'+
    (empty.length > 1 ? ' (и «'+empty.slice(1).join('», «')+'»)' : '')+
    ' — колонка не ставится, пока пуста нижележащая (ИС-38, ADR-0204 §3)'};
  return null;
}
function closeLayer(st, month, layer, who, atISO){
  const bad = closeLayerCheck(st, month, layer, who);
  if(bad) return bad;
  const row = calendarRow(st, month);
  /* При ПОВТОРНОЙ простановке колонка несёт ещё и номер распоряжения. */
  const re = row.reopens && row.reopens[row.reopens.length - 1];
  row.latches[layer] = re ? {by: who, at: atISO, order: re.order} : {by: who, at: atISO};
  return {ok:true, month, layer, by: who, at: atISO, order: re ? re.order : null};
}

/* СУЖЕНА волной 17 ч.8, и сужена ровно на один случай. */
/* ЧТО ЗАПИРАЕТ ЗАКРЫТИЕ. Неполнота ИТОГА: строк состояний на последнюю хранимую дату периода — первое число следующего, а у идущего месяца последний прогон, — и строк событий месяца. */
function periodBlockers(st, month){
  const S = sliceOfMonth(month);
  const warnings = st.runs.filter(r => r.kind === 'пропуск' && periodOf(r.date) === month).map(s => {
    const cu = st.runs.find(r => r.kind === 'догон' && r.date === s.date);
    return 'прогон за '+fmt(s.date)+' не состоялся: '+s.reason+
      (cu ? ' · догнан перед ночью '+fmt(cu.before) : ' · не догнан');
  });
  const own = st.rows.filter(r => storageOf(r.obj) === 'state' && periodOf(r.date) === month && !isLegacyRow(r));
  const last = own.some(r => r.date === S) ? S : (own.map(r => r.date).sort().slice(-1)[0] || null);
  const bad = st.rows.filter(r => periodOf(r.date) === month && silentOf(r).length &&
    (storageOf(r.obj) === 'state' ? r.date === last : true));
  /* Перечень ПЕЧАТНЫЙ и сгруппирован по СОСЕДУ — единице, с которой разговаривают, — и по ЧАСТИ, потому что чинятся части разными дорогами. */
  const by = {};
  bad.forEach(r => silentOf(r).forEach(nb => {
    const part = storageOf(r.obj) === 'state' ? 'итог' : 'события';
    const key = part+'|'+nb;
    const k = by[key] || (by[key] = {nb, part, reasons:[], objs:{}, dates:[], n:0});
    k.n++;
    k.objs[r.obj] = (k.objs[r.obj] || 0) + 1;
    if(k.dates.indexOf(r.date) < 0) k.dates.push(r.date);
    const why = r.srcs[nb].detail || r.srcs[nb].state;
    if(k.reasons.indexOf(why) < 0) k.reasons.push(why);
  }));
  const blockers = Object.keys(by).map(key => {
    const k = by[key];
    const objs = Object.keys(k.objs).map(id => (OBJ(id) || {name:id}).name+' — '+k.objs[id]);
    const dates = k.dates.sort();
    return {nb: k.nb, part: k.part, dates, n: k.n, reasons: k.reasons, objs: Object.keys(k.objs),
      text: (k.part === 'события' ? 'строки событий за '+dates.map(fmt).join(', ')+': ' : '')+
            'сосед «'+k.nb+'» не ответил ('+k.reasons.join(', ')+'): строк — '+k.n+
            ' по объектам '+objs.join(' · ')};
  }).sort((a, b) => b.n - a.n);
  return {blockers, warnings, at: last};
}
/* УДАЛЕНИЕ ДНЕЙ. Закрытый месяц хранит итог — строку первого числа следующего. */
function dropDays(st, month, atISO, who){
  const S = sliceOfMonth(month);
  /* ПЕРВЫЙ ОТКРЫТЫЙ ДЕНЬ — не просто следующий за итогом (правка ревью 1): при повторном закрытии мая 02.06 лежит в закрытом июне, и задание там не выполнит ни один прогон. */
  let next = dayShift(S, 1);
  const shut = d => {
    const cal = calendarRow(st, periodOf(d));
    return !!latchOf(st, periodOf(d), MY_LAYER) ||
      !!(cal && cal.daysDropped && d !== sliceOfMonth(periodOf(d)));
  };
  while(shut(next)) next = dayShift(next, 1);
  const gone = r => storageOf(r.obj) === 'state' && periodOf(r.date) === month &&
                    r.date !== S && !isLegacyRow(r);
  const rows = st.rows.filter(gone).length;
  st.rows = st.rows.filter(r => !gone(r));
  let rewrites = 0;
  st.runs.forEach(run => {
    if(!run.parts || run.date === S || periodOf(run.date) !== month) return;
    run.parts.forEach(p => {
      if(storageOf(p.obj) !== 'state') return;
      rewrites += p.rewrote.length + p.filled.length;
      p.rewrote = []; p.filled = [];
    });
  });
  /* Задание ПЕРВОГО ЧИСЛА — задание хранимого дня: итог остаётся, остаются и его записи перезаписей (выше), и задания не трогаются ни выполненные, ни нет. */
  const dayOf = q => periodOf(q.at) === month && q.at !== S;
  const was = st.queue.length;
  st.queue = st.queue.filter(q => !(q.done && dayOf(q)));
  let shifted = 0;
  st.queue.forEach(q => { if(!q.done && dayOf(q)){ q.at = next; shifted++; } });
  const out = {at: atISO, by: who, rows, rewrites, queue: was - st.queue.length, shifted};
  /* Отметка в строке календаря — первая и единственная: повторное закрытие после повторного открытия удалять уже нечего, а «когда удалены дни» остаётся ответом первого. */
  const cal = calendarRow(st, month);
  if(!cal.daysDropped) cal.daysDropped = out;
  return out;
}
/* ЗАКРЫТИЕ МЕСЯЦА: ПРОВЕРИТЬ КАЛЕНДАРЬ · ДОСПРОСИТЬ · ПРОВЕРИТЬ ИТОГ · ПРОСТАВИТЬ, УДАЛИТЬ ДНИ, ЗАФИКСИРОВАТЬ. Последние три — один шаг: колонка в общем справочнике без удалённых дней объявила бы закрытым месяц, который хранит все дни, а удалённые дни без колонки — открытый месяц с дырами. */
function closeMonth(st, month, who, atISO, silent){
  const pre = closeLayerCheck(st, month, MY_LAYER, who);
  if(pre) return pre;
  const rp = repoll(st, month, who, atISO, silent);
  const w = periodBlockers(st, month);
  const filled = rp.parts.reduce((n, p) => n + p.filled.length, 0);
  if(rp.mute.length || w.blockers.length){
    const byNb = {};
    rp.mute.forEach(m => m.nbs.forEach(nb => (byNb[nb] = byNb[nb] || []).push(m)));
    const muteText = Object.keys(byNb).map(nb => {
      const objs = {};
      byNb[nb].forEach(m => { objs[m.obj] = (objs[m.obj] || 0) + 1; });
      return '«'+(NB(nb) || {name: nb}).name+'» ('+((silent || {})[nb] || '—')+'): строк — '+byNb[nb].length+
        ' по объектам '+Object.keys(objs).map(id => (OBJ(id) || {name: id}).name+' — '+objs[id]).join(' · ');
    }).join(' · ');
    /* Отказ называет КАЖДУЮ часть своей дорогой (правка ревью 1): молчание на доспросе — к соседу; неполный итог — к доспросу, когда сосед ответит; неполные строки событий — к повторному прогону их ночи. */
    const stB = w.blockers.filter(b => b.part === 'итог'), evB = w.blockers.filter(b => b.part === 'события');
    const evDates = uniq([].concat(...evB.map(b => b.dates))).sort();
    const S = sliceOfMonth(month);
    const said = [];
    if(rp.mute.length) said.push('на доспросе не ответил '+muteText+' — строки, собранные из молчания, не написаны');
    if(stB.length) said.push('итог '+fmt(S)+' неполон — '+stB.map(b => b.text).join(' · ')+
      ' — его дозаполнит доспрос, когда сосед ответит');
    if(evB.length) said.push(evB.map(b => b.text).join(' · ')+' — строки событий неполны и дозаполняются '+
      'повторным прогоном '+(evDates.length > 1 ? 'тех ночей' : 'той ночи')+' ('+evDates.map(fmt).join(', ')+
      '): итога на дату у события нет, доспрос его не спрашивает, а закрытие его строк не удаляет '+
      '(ADR-0208 §4, ADR-0239)');
    return {ok:false, blockers: w.blockers, mute: rp.mute, repoll: rp.nbs,
      made: rp.made, filled, refreshed: rp.again,
      why: 'период '+monLabel(month)+' не закрывается: '+said.join('; ')+
        '. Доспрос идёт первым и не откатывается: дописано '+rp.made+', дозаполнено '+filled+
        ', переписано '+rp.again+
        (rp.mute.length || stB.length ? '. Неполнота итога проверяется после него — по строкам '+fmt(S)+
          '; промежуточные дни состояний её не запирают, закрытие их удаляет (ИС-46, ADR-0245 §7, ADR-0238 §3)'
          : ' (ADR-0245 §7)')};
  }
  const r = closeLayer(st, month, MY_LAYER, who, atISO);
  if(!r.ok) return r;
  const dropped = dropDays(st, month, atISO, who);
  const n = fixMonth(st, month, who, atISO);
  return {ok:true, month, layer: MY_LAYER, fixed: n, made: rp.made, filled, refreshed: rp.again,
          dropped, repoll: rp.nbs, by: who, order: r.order};
}

/* Тот же каскад, прочитанный в обратную сторону: защёлки снимаются СВЕРХУ ВНИЗ. Снять нижнюю, оставив верхнюю, — значит объявить период открытым для записи под уже проставленной верхней колонкой: «закрыт» и «открыт» оказались бы верны одновременно, а верхний слой — подписанным под числами, которых он не видел. */
function openLayer(st, month, layer){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: снимать нечего (ADR-0204, границы)'};
  /* §4: перезакрытие к легаси НЕПРИМЕНИМО — период не открывается ВОВСЕ. Отказ не в правах и не в порядке слоёв: открыть период значит пообещать, что строки перепишут, а переписать их нечем — соседей за ту дату не спросить, формы той больше нет. */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: он НЕ ОТКРЫВАЕТСЯ ни распоряжением, ни правами. Загружен он выпуском ('+
    row.legacy.by+', '+fmt(row.legacy.at)+'), и пересчитать его нечем: '+
    'форма легаси другая, соседей за ту дату не спросишь, и «открыт» означало бы обещание '+
    'переписать строки, которого никто не выполнит. Исправление легаси-итога — НОВЫЙ ВЫПУСК '+
    'МИГРАЦИИ ('+row.legacy.act+' — предыдущий) с записью в журнал (ИС-41, ADR-0207 §4)'};
  if(!row.latches[layer]) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+
    ' и так пуста: по этому слою период не закрыт (ADR-0204, границы)'};
  /* Отказ называет слой, с которого сброс НАЧИНАЕТСЯ, — самый верхний из проставленных: «нельзя» без имени первого шага — половина ответа (§8.4). */
  const above = LAYERS.slice(i + 1).filter(L => row.latches[L]);
  if(above.length){
    const top = above[above.length - 1];
    return {ok:false, blockedBy: top, why:'колонка «'+layer+'» периода '+monLabel(month)+
      ' не снимается: над ней проставлен слой «'+top+'»'+
      (above.length > 1 ? ' (и «'+above.slice(0, -1).join('», «')+'»)' : '')+
      ' — сброс идёт СВЕРХУ ВНИЗ и начинается с «'+top+'» (ИС-50, ADR-0204 §4)'};
  }
  const was = row.latches[layer];
  delete row.latches[layer];
  return {ok:true, month, layer, was, opened: layer === BASE_LAYER};
}

/* ================== ЛЕГАСИ-ИТОГИ ================== */
const LAUNCH = '2026-05-01';
/* Сторона запуска считается по СРЕЗУ: срез 01.05 видит мир на конец 30.04 и потому ещё легаси-сторона, а первая своя строка — 02.05. */
const preLaunch = d => d <= LAUNCH;
/* Первая своя ночь: событие до запуска получает исходную строку ею. */
const FIRST_OWN = dayShift(LAUNCH, 1);
/* Редакция формы — не поле строки, а РЕКВИЗИТ ЗАПИСИ ФИКСАЦИИ: «в какой редакции собрано» — свойство того же акта, что и «кем и когда заморожено». */
const FORM = {LEGACY:'легаси', NOW:'действующая'};
const isLegacyRow = r => !!(r && r.fixed && r.fixed.edition === FORM.LEGACY);
const isLegacyMonth = (st, month) => { const p = calendarRow(st, month); return !!(p && p.legacy); };
ST.LAUNCH = () => LAUNCH;
ST.FORMS = () => [FORM.NOW, FORM.LEGACY];
ST.isLegacyRow = r => isLegacyRow(r);
ST.isLegacyMonth = m => isLegacyMonth(ST.state, m);

/* ВЫПУСК МИГРАЦИИ — один объявленный акт, и у него есть номер, дата и человек. */
const LEGACY = {
  at:'2026-04-28', by:'миграция, вып. 1', act:'акт приёмки миграции № 3 от 28.04.2026',
  /* ПЕРЕЧЕНЬ ТОГО, ЧТО ЛЕГАСИ СОБИРАЛО, объявлен ЗДЕСЬ и один раз. */
  form: {'obj-credit': {dims:['d-branch','d-cur','d-status'], inds:['m-debt','m-over','m-odays']}},
  /* Итоги, как их отдала старая система. */
  totals: {'obj-credit': [
    {ref:'КД-2019/017', cur:'KGS', dims:{'d-branch':'Ошское РП','d-cur':'KGS','d-status':'действующий'},
     v:{'2025-01-01':[1840000,0,0], '2025-04-01':[1520000,0,0], '2025-07-01':[1180000,64000,21],
        '2025-10-01':[820000,0,0], '2026-01-01':[410000,0,0]}},
    {ref:'КД-2021/044', cur:'KGS', dims:{'d-branch':'Кредитный департамент','d-cur':'KGS','d-status':'действующий'},
     v:{'2025-01-01':[2650000,118000,44], '2025-04-01':[2410000,96000,31], '2025-07-01':[2180000,0,0],
        '2025-10-01':[1940000,0,0], '2026-01-01':[1700000,52000,17], '2026-04-01':[1455000,0,0]}},
    {ref:'КД-2023/210', cur:'KGS', dims:{'d-branch':'Ошское РП','d-cur':'KGS','d-status':'действующий'},
     v:{'2025-01-01':[3180000,0,0], '2025-04-01':[3120000,74000,19], '2025-07-01':[3040000,88000,30],
        '2025-10-01':[2980000,132000,61], '2026-01-01':[2930000,168000,92], '2026-04-01':[2890000,214000,128]}},
    {ref:'КД-2022/065', cur:'KGS', dims:{'d-branch':'Кредитный департамент','d-cur':'KGS','d-status':'действующий'},
     v:{'2025-01-01':[4620000,0,0], '2025-04-01':[4480000,0,0], '2025-07-01':[4310000,96000,25],
        '2025-10-01':[4180000,148000,58], '2026-01-01':[4060000,196000,121], '2026-04-01':[3990000,208000,190]}},
    {ref:'КД-2021/012', cur:'KGS', dims:{'d-branch':'Ошское РП','d-cur':'KGS','d-status':'действующий'},
     v:{'2025-01-01':[430000,0,0], '2025-04-01':[372000,0,0], '2025-07-01':[310000,0,0],
        '2025-10-01':[248000,0,0], '2026-01-01':[186000,0,0], '2026-04-01':[124000,0,0]}},
    /* Валютный договор: величина лежит в СВОЕЙ валюте и БЕЗ курса. */
    {ref:'КД-2025/043', cur:'USD', dims:{'d-branch':'Кредитный департамент','d-cur':'USD','d-status':'действующий'},
     v:{'2025-04-01':[178000,0,0], '2025-07-01':[172000,0,0], '2025-10-01':[166000,0,0],
        '2026-01-01':[160000,0,0], '2026-04-01':[156000,0,0]}}
  ]}
};
/* §1: колонка источника у легаси-строки заполнена ПО КАЖДОМУ СОСЕДУ, которого действующая форма спросила бы ради этих же величин, и говорит «легаси». */
function legacyNbs(form){
  return uniq(form.dims.concat(form.inds).map(id => {
    const R = REC(id); return R && R.seam ? nbOfSeam(R.seam) : null;
  }).filter(Boolean));
}
function loadLegacy(st){
  const objs = Object.keys(LEGACY.totals), dates = [];
  let n = 0;
  objs.forEach(objId => {
    const form = LEGACY.form[objId], nbs = legacyNbs(form);
    LEGACY.totals[objId].forEach(t => {
      Object.keys(t.v).sort().forEach(d => {
        const vals = t.v[d], inds = {}, now = [], dims = {}, srcs = {};
        form.inds.forEach((id, i) => {
          /* §2: НЕОТСУТСТВОВАВШЕЕ ПРИХОДИТ ОТСУТСТВУЮЩИМ. Ключа нет — и «не собирали» не становится «собрали ноль»: ноль сложится в свод и никому не солжёт вслух. */
          if(vals[i] == null) return;
          const I = IND(id);
          inds[id] = {v: vals[i]};
          /* Датировка легаси-величины — «на дату» ПО ПОСТРОЕНИЮ: итог собран на отчётную дату и с тех пор не пересчитывался. */
        });
        /* Разрез датируется НАРАВНЕ с показателем и той же пометкой: на нём болезнь «текущего» и живёт. */
        form.dims.forEach(id => { if(t.dims[id] != null) dims[id] = t.dims[id]; });
        nbs.forEach(nb => { srcs[nb] = {state:'legacy'}; });
        /* Пишет ТА ЖЕ функция записи, что у прогона: выпуск миграции проходит её признаком `legacy` — легаси-месяц приходит закрытым, и пишет его он один. */
        const w = writeRow(st, {obj: objId, ref: t.ref, date: d, part: null, dims, lbls: {}, inds, fx: null, now, srcs,
          /* §3: строка приходит СРАЗУ ОКОНЧАТЕЛЬНОЙ. Незафиксированной её положить нельзя: открытая строка — обещание пересчитать, а пересчитывать нечем. */
          fixed: {period: periodOf(d), at: LEGACY.at, by: LEGACY.by, edition: FORM.LEGACY},
          by: LEGACY.by}, {legacy: true});
        /* Отбитая запись в счёт выпуска не идёт (правка ревью 1). */
        if(!w.ok) return;
        if(dates.indexOf(d) < 0) dates.push(d);
        n++;
      });
    });
  });
  /* Легаси-период получает СТРОКУ СПРАВОЧНИКА с проставленными колонками: без неё `fixationOf` сказал бы «не зафиксировано» о строке, которая зафиксирована, — два реквизита об одном состоянии разошлись бы на первом же ответе. */
  uniq(dates.map(periodOf)).forEach(m => {
    if(calendarRow(st, m)) return;
    const latches = {};
    LAYERS.forEach(L => { latches[L] = {by: LEGACY.by, at: LEGACY.at, legacy:true}; });
    st.periods.push({month: m, latches, legacy:{at: LEGACY.at, by: LEGACY.by, act: LEGACY.act}});
  });
  st.periods.sort((a,b) => a.month < b.month ? -1 : a.month > b.month ? 1 : 0);

function legacyMissing(objId, want){
  const form = LEGACY.form[objId];
  if(!form) return [];
  const has = form.dims.concat(form.inds);
  return uniq((want || []).map(id => {

    return I && I.src === 'агрегат' ? I.over : id;

/* ---------------------------- СОСТОЯНИЕ ---------------------------- */
function seed(){
  const MONTHS = ['2026-05','2026-06','2026-07','2026-08'];

      {ind:'a-sumdebt',  consumer:'отчётность',  edition:'Форма 1-К, графа 4',

      {ind:'a-sumissued', consumer:'программы',  edition:'Карточка программы · плитка «освоено»',

    /* Роль сужает мир: у аналитика и наблюдателя свой портфель. */

    q: {obj:'obj-credit', dims:['d-branch'], inds:['a-count','a-sumdebt'], date:'2026-08-22',
        mode:'slice', filter:null, levels:{}, buckets:{}, series:{step:'месяц', points:4}},
    flow: {inds:'m-repaid', from:'2026-07-16', to:'2026-08-19'},
    fEdit: null,
    drill: null,

/* КЭШ ДЕМО-МИРА. Мир строится суточными прогонами — больше сотни ночей, — и смоук, зовущий `ST.seed` перед каждым сторожем, собирал бы его заново сотни раз. */
function defineViews(st){
  Object.defineProperty(st, 'indicators', {enumerable:false, configurable:true,
    get: () => st.registry.filter(r => r.kind === KIND.IND)});
  Object.defineProperty(st, 'dims', {enumerable:false, configurable:true,
    get: () => st.registry.filter(r => r.kind === KIND.DIM)});
}
const SEED_CACHE = new Map(), SEED_STAT = {hits: 0, misses: 0};
/* ВХОД СБОРКИ — ровно те данные модуля, которые читает `seed`. */
const SEED_INPUTS = () => ({WORLD, OBJECTS, REF, RATES, LEGACY, NEIGHBOURS, REGISTRY, RELEASE, VTYPES,
  COLL_K, SURVEY_MATRIX, PAY_SPLIT, PAY_LAYER, ARTICLES, BANKRUPT_SUBGROUPS,
  'CORE.DATING': CORE.DATING, 'CORE.SOM_ROUNDING': CORE.SOM_ROUNDING,
  KIND, DATING, FORM, LAYERS, MON, NIGHTLY, CAND_SRC, FLAT_TYPES, CUR_DIM, SOURCE_STATES});
const seedPrint = () => JSON.stringify(SEED_INPUTS());
ST.seedInputs = () => Object.keys(SEED_INPUTS());
ST.seed = fresh => {
  const key = seedPrint();
  let snap = fresh ? null : SEED_CACHE.get(key);
  if(snap) SEED_STAT.hits++;
  else {
    SEED_STAT.misses++;
    snap = JSON.stringify(seed());
    SEED_CACHE.delete(key); SEED_CACHE.set(key, snap);
    while(SEED_CACHE.size > 3) SEED_CACHE.delete(SEED_CACHE.keys().next().value);
  }
  const st = JSON.parse(snap);
  defineViews(st);
  ST.state = st;
  return st;
};
ST.seedCache = () => ({size: SEED_CACHE.size, hits: SEED_STAT.hits, misses: SEED_STAT.misses});
/* Маркеры «исправлено позже»: на исправленную строку закрытого месяца — со ссылкой на срез поправки `corr_slice_date`. */
ST.markers = () => clone(ST.state.markers || []);
ST.state = ST.seed();
function log(msg){ ST.state.log.unshift({at: ST.state.today, who: ST.state.role, msg}); }

/* ------------------------- ДОСТУП И РОЛИ ---------------------------- */
ST.canAdmin = () => ST.state.role === 'Администратор статистики';
/* ST.canBuild снят вместе с экраном вопросов: собирать вопрос в этом модуле больше негде, а журнал открыт всякому, кому отдано число. */
/* Роль даёт ОДНО: чей охват применяется. */
ST.curatorOf = () => ST.state.scope[ST.state.role] || null;
/* ПРАВИЛА ОХВАТА. Форма правила проверяется у двери объекта (`scopeShapeBad`), связи правила с реестром — на загрузке (`scopeErrors`): у двери объект заводится раньше своих разрезов, и разрез охвата называет ещё не заведённую запись. */
function scopeShapeBad(rules){
  /* Список видов — внутри функции: загрузка зовёт её из `seed` раньше, чем исполнится объявление ниже по файлу. */
  const SCOPE_KINDS = ['own','via','open'];
  if(!Array.isArray(rules) || !rules.length) return 'правил охвата нет: объект без правила не загружается';
  for(let i = 0; i < rules.length; i++){
    const r = rules[i] || {};
    if(SCOPE_KINDS.indexOf(r.kind) < 0) return 'правило '+(i+1)+' без вида из '+SCOPE_KINDS.join(' · ');
    if(r.kind === 'own' && !r.dim) return 'правило '+(i+1)+' own: разрез охвата не назван';
    if(r.kind === 'via' && (!r.obj || !r.key)) return 'правило '+(i+1)+' via: таблица или ключ связи не названы';
    if(r.kind === 'open' && !(typeof r.reason === 'string' && r.reason.trim()))
      return 'правило '+(i+1)+' open: причина не названа — паспорт обязан её напечатать';
  }
  if(rules.some(r => r.kind === 'open') && rules.length > 1) return 'общий объект других правил не несёт: ИЛИ с «общим» — тот же общий';
  return null;
}
function scopeErrors(objects, registry){
  const objBy = id => objects.find(x => x.id === id), dimBy = id => registry.find(x => x.id === id);
  const out = [];
  objects.forEach(o => {
    const shape = scopeShapeBad(o.scope);
    if(shape){ out.push(o.id+': '+shape); return; }
    o.scope.forEach((r, i) => {
      if(r.kind === 'own'){
        const d = dimBy(r.dim);
        if(!d || d.obj !== o.id || o.dims.indexOf(r.dim) < 0) out.push(o.id+' правило '+(i+1)+': разрез охвата «'+r.dim+'» не свой разрез объекта');
      }
      if(r.kind === 'via'){
        const t = objBy(r.obj), k = dimBy(r.key);
        if(!t || t.id === o.id) out.push(o.id+' правило '+(i+1)+': таблицы «'+r.obj+'» для охвата нет');
        else if(r.key === 'target' ? !o.targets : !(k && (k.obj === t.id || k.obj === o.id)))
          out.push(o.id+' правило '+(i+1)+': ключ связи «'+r.key+'» не ведёт от «'+o.id+'» к «'+t.id+'»');
        else if((t.scope || []).some(x => x.kind === 'via')) out.push(o.id+' правило '+(i+1)+': охват через «'+t.id+'», который сам идёт через другую таблицу');
