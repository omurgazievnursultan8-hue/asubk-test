  },
  cell(item, value, dateISO){
    const cur = item.f.cur || 'KGS';
    const r = rateOn(cur, dateISO);
    /* Состав из одной части — тот же состав: правило клетки одно на все объекты и
       различается только мощностью множества (ADR-0184 §3). */
    const parts = [{cur, value, rate: r.rate, rateDate: r.rateDate}];
    /* Денежный ответ ядра несёт ДВЕ стороны сразу — договорную и сомовую (ИС-44,
       ADR-0214 §3): спрашивающему сомовую величину не приходится выводить её самому. */
    /* Правило округления здесь берётся из ЕДИНСТВЕННОГО объявления ядра: у шва записи
       реестра в руках нет, и ядро отвечает за себя. Второго правила от этого не заводится
       — запись ссылается на этот же идентификатор (ADR-0214 §6). */
    return {value, cur, rate: r.rate, rateDate: r.rateDate, dated: r.dated,
            parts, mixed: false, som: CORE.toSom(parts, CORE.SOM_ROUNDING.id)};
  },
  money(item, field, dateISO){ return CORE.cell(item, CORE.grow(item, field, dateISO), dateISO); },
  /* Раскладка долга по семи статьям. Зеркало держит НЕ семь независимых чисел, а функцию
     от тех же коэффициентов: тождества ядра «остаток = просрочено + срочно» и «свод =
     сумма статей» обязаны держаться ПО ПОСТРОЕНИЮ. Иначе сторож проверял бы аккуратность
     набора демонстрационных данных, а не движок (ТЗ 18 §5.1, ADR-0150 §3). */
  debtParts(item, dateISO){
    const r2 = x => Math.round(x * 100) / 100;
    const P = CORE.grow(item, 'principal', dateISO) || 0;
    const A = CORE.grow(item, 'interest', dateISO) || 0;
    const d = Math.round(CORE.grow(item, 'daysOverdue', dateISO) || 0);
    const amt = item.f.amount || 0;
    const rest = {
      collection:  d > 180 ? r2(amt * 0.004) : 0,
      charges:     r2(amt * 0.001),
      principal:   r2(P),
      accInterest: d > 0 ? r2(A * 0.20) : 0,
      interest:    r2(A * 0.45),
      accPenalty:  d > 90 ? r2(P * 0.00008 * d) : 0,
      penalty:     d > 0 ? r2(P * 0.00020 * d) : 0
    };
    /* Срочная часть НЕ выводится отдельной формулой: она разность. Тождество тогда не
       сверяется, а соблюдается — ровно то, чего E2E-09 не сделал в легаси. */
    const over = {
      collection:  rest.collection,
      charges:     d > 0 ? rest.charges : 0,
      principal:   d > 0 ? r2(rest.principal * Math.min(1, d / 360)) : 0,
      accInterest: rest.accInterest,
      interest:    d > 0 ? r2(rest.interest * Math.min(1, d / 90)) : 0,
      accPenalty:  rest.accPenalty,
      penalty:     rest.penalty
    };
    const total   = r2(ARTICLES.reduce((s, a) => s + rest[a], 0));
    const overdue = r2(ARTICLES.reduce((s, a) => s + over[a], 0));
    return {rest, over, total, overdue, current: r2(total - overdue), days: d,
      disputed:   Math.round(CORE.grow(item, 'disputedDays', dateISO) || 0),
      writtenOff: d > 180 ? r2(amt * 0.002 * ((d - 180) / 30)) : 0,
      overpaid:   r2(CORE.grow(item, 'overpaid', dateISO) || 0)};
  },
  daysToDue(dateISO, due){
    const y = Number(dateISO.slice(0,4)), m = Number(dateISO.slice(5,7)), d = Number(dateISO.slice(8,10));
    if(d < due) return due - d;
    return new Date(Date.UTC(y, m, 0)).getUTCDate() - d + due;
  },
  /* --- ADR-0135 §4: пять дверей ядра --- */
  calcDebt(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    const out = {
      daysOverdue:  {value: p.days},
      disputedDays: {value: p.disputed},
      total:      CORE.cell(item, p.total,      dateISO),
      overdue:    CORE.cell(item, p.overdue,    dateISO),
      current:    CORE.cell(item, p.current,    dateISO),
      writtenOff: CORE.cell(item, p.writtenOff, dateISO),
      overpaid:   CORE.cell(item, p.overpaid,   dateISO)
    };
    ARTICLES.forEach(a => {
      out[a] = CORE.cell(item, p.rest[a], dateISO);
      out['over_' + a] = CORE.cell(item, p.over[a], dateISO);
    });
    return out;
  },
  calcAccrual(item, dateISO){ CORE.calls++; return {interest: CORE.money(item, 'interest', dateISO)}; },
  /* «Погашено всего» — НЕ самостоятельный ряд, а сумма платежей по этому кредиту. До волны
     10 их было два: у кредита линейка `repaidTotal`, у объекта «Погашение» — свои записи, и
     ни в одном периоде они не сходились (июнь 205 000 против 86 900, июль 211 833,32 против
     665 100 — СС-Д9). Деньги там были одни и те же, а линеек две: второй вывод одной
     величины, форма E2E-09. Теперь тождество «приращение погашено за период = сумма платежей
     периода» держится ПО ПОСТРОЕНИЮ, а не аккуратностью демо-набора: это одно число, а не
     два подогнанных (ИС-1, ИС-14, ИС-17). База до якоря лежит полем repaidBase. */
  repaidOf(item, dateISO){
    const base = ((item.k || {}).repaidBase || [0])[0] || 0;
    const paid = (WORLD['obj-repay'] || []).reduce((n, p) =>
      n + (p.f.credit === item.id && p.f.rdate > ANCHOR && p.f.rdate <= dateISO ? p.f.amount : 0), 0);
    return Math.round((base + paid) * 100) / 100;
  },
  calcAllocation(item, dateISO){
    CORE.calls++;
    return {issuedTotal: CORE.money(item, 'issuedTotal', dateISO),
            repaidTotal: CORE.cell(item, CORE.repaidOf(item, dateISO), dateISO)};
  },
  /* График и прогноз отвечают ДНЯМИ от даты вопроса, а не датой: среднюю дату сложить
     не из чего, а «в среднем 12 дней до платежа» — осмысленный итог портфеля (ИС-26). */
  calcSchedule(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    /* День платежа — число месяца из даты договора: у каждого договора он свой, поэтому
       «минимум дней до платежа» по портфелю — осмысленный вопрос, а не константа. */
    const due = Math.min(28, Number((item.f.cdate || '2020-01-15').slice(8, 10)) || 15);
    const plan = Math.round((item.f.amount || 0) * 0.031 * 100) / 100;
    return {version: {value: 'действующая на ' + dateISO},
            nextAmount: CORE.cell(item, Math.min(plan, p.total), dateISO),
            nextInDays: {value: CORE.daysToDue(dateISO, due)}};
  },
  calcForecast(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    const per30 = ((item.k || {}).principal || [0, 0])[1];
    const pace = per30 < 0 ? -per30 : 0;
    /* Полное погашение считается по СВОДУ, а не по телу: остаток в 1 755 сом при нулевом
       теле — это и есть осиротевшая копейка E2E-13/14, и прогноз обязан её видеть. */
    return {expected: CORE.cell(item, p.rest.principal, dateISO),
            fullInDays: {value: pace > 0 ? Math.round(p.total / pace * 30) : null}};
  },
  /* --- Портфельный вопрос (ADR-0174, шестой шов): ядро отвечает о МНОЖЕСТВЕ договоров,
     а не о заёмщике. Множество приходит СНАРУЖИ — здесь его отдаёт зеркало владельца по
     ИНН. Статистика этот перебор не делает и делать не вправе: сложи она строки кредитов
     сама, свод считался бы второй раз и вне ядра — форма E2E-09 (ИС-28). --- */
  creditsOf(inn){ return (WORLD['obj-credit'] || []).filter(c => c.f.inn === inn); },
  /* Клетка суммы несёт СОСТАВ по валютам (ADR-0184 §3). Одна валюта — состав из одной
     части и обычный ответ; несколько — value молчит, а состав говорит: доллары с сомами
     в одно число не складываются (ADR-0151 §4). Сомовая сторона у портфельной клетки
     ЕСТЬ и приходит тем же ответом ядра (ИС-44, ADR-0214 §3): «в валюте договора» у
     разновалютного множества числа не имеет, «в сомах» — имеет, и это две РАЗНЫЕ
     величины, а не одна с оговоркой. Прежнее «эквивалент — произведение при показе»
     (ИС-15 в этой части) ОТМЕНЕНО. */
  portfolioCell(list, dateISO, get){
    const by = {};
    list.forEach(c => { const cur = c.f.cur || 'KGS';
      by[cur] = Math.round(((by[cur] || 0) + (get(c) || 0)) * 100) / 100; });
    const parts = Object.keys(by).sort().map(cur => {
      const r = rateOn(cur, dateISO);
      return {cur, value: by[cur], rate: r.rate, rateDate: r.rateDate};
    });
    const one = parts.length === 1 ? parts[0] : null;
    return {value: one ? one.value : null, cur: one ? one.cur : null,
            rate: one ? one.rate : null, rateDate: one ? one.rateDate : null,
            parts, mixed: parts.length > 1, dated: !one || one.cur === 'KGS',
            som: CORE.toSom(parts, CORE.SOM_ROUNDING.id)};
  },
  calcPortfolio(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    const stateOf = c => valueOn(c.h.status, dateISO);
    const live = all.filter(c => stateOf(c) === 'действующий');
    const closed = all.filter(c => stateOf(c) === 'погашен');
    const P = c => CORE.debtParts(c, dateISO);
    /* Свод берётся по ВСЕМ договорам, включая закрытые. Закрытый договор с ненулевым
       остатком — это осиротевшая копейка E2E-13/14; портфель обязан её видеть, а не
       прятать закрытием. Считать «нолём, потому что закрыт» — значит повторить дефект. */
    const cell = get => CORE.portfolioCell(all, dateISO, get);
    const days = all.map(c => P(c).days);
    const dues = live.map(c => CORE.daysToDue(dateISO,
      Math.min(28, Number((c.f.cdate || '2020-01-15').slice(8, 10)) || 15)));
    const dates = all.map(c => c.f.cdate).filter(Boolean).sort();
    const curs = [];
    all.forEach(c => { const u = c.f.cur || 'KGS'; if(curs.indexOf(u) < 0) curs.push(u); });
    return {
      total:      cell(c => P(c).total),
      overdue:    cell(c => P(c).overdue),
      current:    cell(c => P(c).current),
      principal:  cell(c => P(c).rest.principal),
      issuedTotal:cell(c => CORE.grow(c, 'issuedTotal', dateISO)),
      repaidTotal:cell(c => CORE.repaidOf(c, dateISO)),
      accrued:    cell(c => CORE.grow(c, 'interest', dateISO)),
      writtenOff: cell(c => P(c).writtenOff),
      credits:        {value: live.length},
      overdueCredits: {value: all.filter(c => P(c).days > 0).length},
      closedCredits:  {value: closed.length},
      /* У заёмщика без договоров худшей просрочки НЕТ — это не ноль дней. Ноль сказал бы
         «платит вовремя» о том, кому нечего платить, и посадил бы его в ступень «0 дн.». */
      worstDays:  {value: days.length ? Math.max.apply(null, days) : null},
      nextInDays: {value: dues.length ? Math.min.apply(null, dues) : null},
      /* Дата первого договора отдаётся И датой (её режет разрез корзиной год/квартал),
         И числом дней (его складывает агрегат): показателем дата не бывает — ИС-26. */
      firstDate:  {value: dates.length ? dates[0] : null},
      tenureDays: {value: dates.length ? daysBetween(dates[0], dateISO) : null},
      state:      {value: all.length ? (live.length ? 'действующий' : 'весь портфель погашен')
                                     : 'без договоров'},
      curLabel:   {value: curs.length ? (curs.length > 1 ? 'разновалютный' : curs[0]) : null}
    };
  },
  /* Шов кураторства (ТЗ 16 §11, ИУ-14): ВЕДУЩИМ считается куратор договора с наибольшим
     остатком основного долга. Не поле заёмщика: «Заёмщик — не объект закрепления», и
     хранимого «ведущего подразделения» не бывает вовсе (ТЗ 16 §3.2, P18-R16).
     Остатки разных валют сравниваются по курсу на дату вопроса — решение владельца шва,
     а не статистики; открытым вопросом записано в §15 спеки. */
  leadCurator(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    let best = null, bestSom = -1;
    all.slice().sort((a, b) => (a.f.cdate || '') < (b.f.cdate || '') ? -1 : 1).forEach(c => {
      const som = (CORE.debtParts(c, dateISO).rest.principal || 0) * rateOn(c.f.cur || 'KGS', dateISO).rate;
      if(som > bestSom){ bestSom = som; best = c; }
    });
    return {curator: {value: best ? valueOn(best.h.curator, dateISO) : null},
            branch:  {value: best ? valueOn(best.h.branch,  dateISO) : null},
            by:      {value: best ? best.id : null}};
  },
  /* Шов классификации (ADR-0124): категория приходит готовой, здесь её не выводят.
     У КРЕДИТА она своя. У ЗАЁМЩИКА собственной категории не бывает: она свёртка «худшая
     из категорий его договоров» (ADR-0125), и потому носит СВОЁ имя — «Худшая
     категория», а не «Категория риска» (ADR-0185 §2). Подгруппа — зеркало владельца:
     она принадлежит ИНН, а группа есть первая цифра подгруппы, и второй записи для
     группы не заводится (ADR-0012, ADR-0185 §1). */
  riskCategory(item, dateISO){
    CORE.calls++;
    if(item.h && item.h.category) return {category: {value: valueOn(item.h.category, dateISO)}};
    const cats = CORE.creditsOf(item.id).map(c => valueOn(c.h.category, dateISO)).filter(Boolean);
    let worst = null;
    cats.forEach(c => { if(worst == null || RISK_RANK.indexOf(c) > RISK_RANK.indexOf(worst)) worst = c; });
    return {category: {value: worst},
            subgroup: {value: valueOn((item.h || {}).subgroup, dateISO)}};
  },
  /* --- Залоговые швы (волна 8). Владелец — модуль ЗАЛОГА, не расчётное ядро: множество
     обеспечиваемых кредитов выбирает junction ОТНЕСЕНИЕ_ЗАЛОГА, и долю в нём знает только
     залог (ADR-0190 §1, ИС-31). Величины по ОДНОМУ кредиту залог берёт у ядра сам — тем же
     `debtParts`; статистика по-прежнему не складывает ничего (ИС-1). --- */
  pledgeValueOf(item){
    const k = COLL_K[item.f.kind];
    if(k == null) return null;
    const base = Math.round((item.f.value || 0) * k * 100) / 100;
    /* Фактическая залоговая правится ТОЛЬКО вниз (Р-19): вверх — это переоценка, событие. */
    return item.f.override != null ? Math.min(item.f.override, base) : base;
  },
  allocOf(item, dateISO){
    return (item.f.alloc || []).filter(a => a.from <= dateISO && (!a.till || a.till > dateISO));
  },
  shareOf(item, creditId, dateISO){
    return CORE.allocOf(item, dateISO).filter(a => a.credit === creditId)
      .reduce((s, a) => s + a.share, 0);
  },
  itemsOf(creditId, dateISO){
    return (WORLD['obj-collateral'] || [])
      .filter(z => CORE.allocOf(z, dateISO).some(a => a.credit === creditId));
  },
  securedOf(creditId, dateISO){
    return CORE.itemsOf(creditId, dateISO)
      .reduce((s, z) => s + CORE.shareOf(z, creditId, dateISO), 0);
  },
  /* Сумма под риском (ADR-0011) = остаток ОД + НЕОСВОЕННАЯ часть. Не сумма договора:
     погашенное обеспечивать нечем, а невыбранный лимит обеспечивать обязаны заранее. */
  riskOf(credit, dateISO){
    const p = CORE.debtParts(credit, dateISO).rest.principal;
    const undrawn = Math.max(0, (credit.f.amount || 0) - (CORE.grow(credit, 'issuedTotal', dateISO) || 0));
    return Math.round((p + undrawn) * 100) / 100;
  },
  calcPledge(item, dateISO){
    CORE.calls++;
    const al = CORE.allocOf(item, dateISO);
    const pv = CORE.pledgeValueOf(item);
    const allocated = Math.round(al.reduce((s, a) => s + a.share, 0) * 100) / 100;
    const creds = [], deals = [];
    al.forEach(a => {
      const c = (WORLD['obj-credit'] || []).find(x => x.id === a.credit);
      if(c && creds.indexOf(c) < 0) creds.push(c);
      if(deals.indexOf(a.deal) < 0) deals.push(a.deal);
    });
    /* Вес предмета в кредите = его доля ÷ ВСЁ отнесённое по этому кредиту. Веса предметов
       одного кредита дают единицу — поэтому обеспечиваемые требования, сложенные по
       предметам, равны сумме под риском обеспеченных кредитов, а не считают её дважды.
       Прежняя запись показателя читала calcDebt — шов ОДНОГО кредита — и делала ровно
       это: у предмета с двумя кредитами отвечала об одном, у двух предметов одного
       кредита повторяла его требование дважды (СС-73). */
    const weight = c => { const tot = CORE.securedOf(c.id, dateISO);
      return tot > 0 ? CORE.shareOf(item, c.id, dateISO) / tot : 0; };
    const subs = [];
    creds.forEach(c => {
      const b = (WORLD['obj-borrower'] || []).find(x => x.id === c.f.inn);
      const g = b ? valueOn(b.h.subgroup, dateISO) : null;
      if(g && subs.indexOf(g) < 0) subs.push(g);
    });
    /* Строжайшая из групп заёмщиков обеспечиваемых кредитов: залогодатель бывает третьим
       лицом, а периодичность контроля меряется по должникам (Р-3, worst-of). */
    subs.sort();
    const worst = subs.length ? subs[subs.length - 1] : null;
    const shape = item.f.kind === 'недвижимость' ? 'недвижимое' : 'движимое';
    const interval = worst ? ((SURVEY_MATRIX[worst.slice(0, 1)] || {})[shape] || null) : null;
    const since = item.f.lastSurvey ? daysBetween(item.f.lastSurvey, dateISO) : null;
    const bankrupt = worst != null && BANKRUPT_SUBGROUPS.indexOf(worst) >= 0;
    const next = (!bankrupt && since != null && interval) ? interval - since : null;
    const state = !creds.length ? 'отнесений нет'
      : bankrupt ? 'по договору со спецадминистратором'
      : since == null ? 'обследований не было'
      : next < 0 ? 'просрочен' : next <= 30 ? 'срок подошёл' : 'в срок';
    return {
      pledgeValue: CORE.cell(item, pv, dateISO),
      allocated:   CORE.cell(item, allocated, dateISO),
      available:   CORE.cell(item, pv == null ? null : Math.round((pv - allocated) * 100) / 100, dateISO),
      /* Клетка суммы несёт состав по валютам и здесь: предмет вправе обеспечивать кредиты
         в разных валютах, и одного числа у такого требования нет вовсе (ADR-0184 §3). */
      securedRisk: CORE.portfolioCell(creds, dateISO, c => CORE.riskOf(c, dateISO) * weight(c)),
      credits:     {value: creds.length},
      deals:       {value: deals.length},
      sinceSurvey: {value: since},
      nextSurveyInDays: {value: next},
      sinceReval:  {value: item.f.lastReval ? daysBetween(item.f.lastReval, dateISO) : null},
      ctlState:    {value: state},
      worstSubgroup: {value: worst}
    };
  },
  /* Обеспеченность КРЕДИТА (Р-1): порог — функция состава обеспечения, а не константа
     120 %. Самого индекса шов не отдаёт и отдавать не должен: в срез входят числитель и
     знаменатель, отношение считается при чтении (ИС-15, ИС-32). Здесь он выводится ради
     СОСТОЯНИЯ — величины перечислимой, которой режут, а не складывают. */
  calcCoverage(item, dateISO){
    CORE.calls++;
    const items = CORE.itemsOf(item.id, dateISO);
    const share = z => CORE.shareOf(z, item.id, dateISO);
    const liq = items.filter(z => ((REF.collkind || {}).parent || {})[z.f.kind] === 'ликвидный');
    const secured = CORE.portfolioCell(items, dateISO, share);
    const liqCell = CORE.portfolioCell(liq, dateISO, share);
    const risk = CORE.riskOf(item, dateISO);
    const req = !items.length ? null : (liq.length === items.length ? 120 : 150);
    /* Обеспечение и требование могут быть в разных валютах — тогда индекс существует только
       относительно курса, и состояние честно об этом говорит, а не считает (§15 спеки). */
    const same = items.length && !secured.mixed && secured.cur === (item.f.cur || 'KGS');
    const state = !items.length ? 'без обеспечения'
      : !same ? 'обеспечение в другой валюте'
      : (secured.value || 0) < risk * req / 100 ? 'ниже порога'
      : (req === 150 && (liqCell.value || 0) < risk * 0.8) ? 'доля ликвида ниже 80 %'
      : 'обеспечен';
    return {secured, liquid: liqCell, riskSum: CORE.cell(item, risk, dateISO),
            required: {value: req == null ? null : req + ' %'}, state: {value: state}};
  },
  /* --- Требование взыскания (ADR-0198). Долг требования — ПРОЕКЦИЯ долга кредита, а не
     его копия (ADR-0004): величина берётся у ядра и урезается ОХВАТОМ (ADR-0025). Своего
     числа у взыскания здесь нет, поля «сумма требования» не существует ни у одной сущности
     (ТЗ 13 разд. 3) — как не существует и поля «фаза»: она свёртка журнала. --- */
  creditOf(id){ return (WORLD['obj-credit'] || []).find(c => c.id === id) || null; },
  claimsOf(caseId, dateISO){
    return (WORLD['obj-claim'] || []).filter(q => q.f.case === caseId && q.f.qdate <= dateISO);
  },
  claimDebt(item, dateISO){
    CORE.calls++;
    const c = CORE.creditOf(item.f.credit);
    if(!c) return {amount: {value:null}, phaseDays: {value:null}};
    const p = CORE.debtParts(c, dateISO);
    const v = item.f.scope === 'просроченная сумма' ? p.overdue : p.total;
    const ph = (item.h.phase || []).filter(z => z[0] <= dateISO).slice(-1)[0];
    return {amount: CORE.cell(c, v, dateISO),
            phaseDays: {value: ph ? daysBetween(ph[0], dateISO) : null}};
  },
  /* --- Портфельный шов ДЕЛА. Владелец — взыскание, а не ядро (ИС-31, второй названный
     случай): множество кредитов дела выбирает связь «дело × кредит × роль», и знает её
     только оно. Но защищается взыскание от задваивания ИНАЧЕ, чем залог: залог ВЗВЕШИВАЕТ
     долей (Σ долей = 1, сторож #79), взыскание ДЕДУПИТ по кредиту — «в любом итоге считается
     один раз на кредит» (ТЗ 13 разд. 3, §12.1). Ключ здесь тот же, что объявлен у показателя
     требования, и правило представителя то же: наибольшая величина, потому что охват уже
     долга не бывает, а более широкий покрывает более узкий. --- */
  casePortfolio(item, dateISO){
    CORE.calls++;
    const qs = CORE.claimsOf(item.id, dateISO);
    const best = new Map();
    qs.forEach(q => {
      const a = CORE.claimDebt(q, dateISO).amount, cur = best.get(q.f.credit);
      if(!cur || (a.value || 0) > (cur.value || 0)) best.set(q.f.credit, a);
    });
    const creds = [...best.keys()].map(k => CORE.creditOf(k)).filter(Boolean);
    return {claimTotal: CORE.portfolioCell(creds, dateISO, c => (best.get(c.id) || {}).value || 0),
            claims:   {value: qs.length},
            credits:  {value: best.size},
            expenses: CORE.cell(item, CORE.grow(item, 'expenses', dateISO) || 0, dateISO)};
  },
  /* --- Часы меры (волна 12). Число дней ПРОИЗВОДНО от даты и даты среза: полем оно не
     лежит нигде, потому что растёт само (ADR-0001, ADR-0183 §4). Срок должника течёт от
     НАПРАВЛЕНИЯ и невручением не отменяется (ТЗ 13 §9.2) — поэтому часы заводятся от
     `sent`, а не от даты регистрации и не от вручения. У вида, которому вручать нечего,
     направления нет, и часов нет тоже: пустое — не ноль (ИС-19). --- */
  measureClock(item, dateISO){
    CORE.calls++;
    const sent = item.f.sent;
    return {sentDays: {value: sent && sent <= dateISO ? daysBetween(sent, dateISO) : null}};
  },
  /* --- Разнесение ПЛАТЕЖА (волна 11, ч. 2). Одна сумма, разрезанная дважды: пятью
     статьями очереди и двумя слоями. Ни одна проекция не является продолжением другой —
     статей ровно пять и всегда, слоёв бывает два (ТЗ 14 §5, ADR-0043). Оба тождества
     доказываются на ОДНОЙ строке среза, а не сверкой двух срезов (ADR-0183 §3). --- */
  payAlloc(item, dateISO){
    CORE.calls++;
    const r2 = x => Math.round(x * 100) / 100;
    const A = item.f.amount || 0;
    const s = PAY_SPLIT[item.f.kind] || PAY_SPLIT['плановое'];
    const coll = r2(A * s.collection), fee = r2(A * s.charges);
    const int  = r2(A * s.interest),   pen = r2(A * s.penalty);
    /* Основной долг — РАЗНОСТЬ, а не пятая формула. */
    const prin = r2(A - coll - fee - int - pen);
    const share = item.f.jud == null ? (PAY_LAYER[item.f.kind] || 0) : item.f.jud;
    const jud = r2(A * share);
    return {collection: CORE.cell(item, coll, dateISO),
            charges:    CORE.cell(item, fee,  dateISO),
            principal:  CORE.cell(item, prin, dateISO),
            interest:   CORE.cell(item, int,  dateISO),
            penalty:    CORE.cell(item, pen,  dateISO),
            judicial:   CORE.cell(item, jud,  dateISO),
            /* Свободный слой — тоже разность: второй формулы у него нет. */
            free:       CORE.cell(item, r2(A - jud), dateISO)};
  },
  /* --- Разбор ПОСТУПЛЕНИЯ (волна 11, ч. 2). Множество платежей приходит СНАРУЖИ — от
     зеркала владельца по номеру поступления; статистика этого перебора не делает и не
     вправе (ИС-28, ADR-0190 §1). Инвариант ТЗ 14 §2.2 «сумма = Σ платежей + возврат +
     нераспределённое» держится по построению: нераспределённое есть РАЗНОСТЬ. --- */
  paysOf(rid){ return (WORLD['obj-repay'] || []).filter(p => p.f.receipt === rid); },
  receiptSplit(item, dateISO){
    CORE.calls++;
    const r2 = x => Math.round(x * 100) / 100;
    const pays = CORE.paysOf(item.id).filter(p => p.f.rdate <= dateISO);
    const paid = r2(pays.reduce((n, p) => n + (p.f.amount || 0), 0));
    const ret  = r2(item.f.returned || 0);
    return {paid:        CORE.cell(item, paid, dateISO),
            returned:    CORE.cell(item, ret,  dateISO),
            unallocated: CORE.cell(item, r2((item.f.amount || 0) - paid - ret), dateISO),
            payments:    {value: pays.length},
            /* Ожидание считается ОТ ДАТЫ СРЕЗА и обнуляется опознанием (ИС-26). */
            waitDays:    {value: pays.length ? 0 : Math.max(0, daysBetween(item.f.rdate, dateISO))}};
  },
  read(seam, item, dateISO){
    const fn = CORE[seam];
    if(typeof fn !== 'function') return null;
    return fn(item, dateISO);
  }
};
ST.coreCalls = () => CORE.calls;
ST.resetCoreCalls = () => { CORE.calls = 0; };
/* ======================= РЕЕСТР: ДОСТУП ============================= */
const clone = x => JSON.parse(JSON.stringify(x));
const OBJ = id => (ST.state ? ST.state.objects : OBJECTS).find(o => o.id === id);
/* Пород ровно ДВЕ, и третьей не заводится: свод, темп, дельта и скользящее среднее
   записями реестра не становятся — одна дата есть колонка статистики, много дат есть
   работа анализа (ADR-0209, границы). */
const KIND = {IND:'показатель', DIM:'разрез'};
const KINDS = [KIND.IND, KIND.DIM];
/* ЕДИНСТВЕННОЕ чтение кладовой. `IND` и `DIM` остались дверьми — но это теперь чтение
   ОДНОГО хранилища с проверкой ОБЪЯВЛЕННОЙ породы, а не поиск по своему массиву: место
   хранения больше ничего не значит и ничего не решает (ИС-43, ADR-0209). Ровно поэтому
   переезд записи из породы в породу не трогает ни идентификатора, ни истории. */
const REC = id => (ST.state ? ST.state.registry : REGISTRY).find(r => r.id === id);
const ofKind = (id, kind) => { const r = REC(id); return r && r.kind === kind ? r : undefined; };
const IND = id => ofKind(id, KIND.IND);
const DIM = id => ofKind(id, KIND.DIM);
ST.OBJ = OBJ; ST.IND = IND; ST.DIM = DIM; ST.REC = REC;
ST.kinds = () => KINDS.slice();
ST.registry = () => clone(ST.state.registry);
/* Запись ДЕЙСТВУЕТ на дату, если заведена не позже и не прекращена раньше. Прекращение —
   дата, а не удаление (ADR-0209 §6): остаются строки, в которых её колонка заполнена, и
   стёртая запись сделала бы их нечитаемыми — в клетке было бы число без имени. */
const actsOn = (r, dateISO) => !!r && r.since <= dateISO && (!r.until || dateISO < r.until);
ST.actsOn = (id, dateISO) => actsOn(REC(id), dateISO);
/* Единица числа живёт у ПОКАЗАТЕЛЯ. Разрез-корзина своей единицы не носит — он берёт её у
   показателя-основания (ADR-0209 §5): две записи об одной величине не спорят о том, в чём
   она измеряется, потому что вторая ни о чём не спрашивается, а ссылается. */
const unitOf = r => !r ? '' :
  (r.basis ? unitOf(IND(r.basis))
   : r.unit || (r.money ? 'валюта договора' : '') ||
     (r.src === 'агрегат' ? (r.fn === 'count' ? 'объектов' : unitOf(IND(r.over))) : ''));
ST.unitOf = id => unitOf(REC(id));
/* Тип — тот же случай: у шва и поля он ОБЪЯВЛЕН, у агрегата НАСЛЕДУЕТСЯ от показателя,
   по которому агрегат считается. Наследование — не догадка о данных, а чтение реквизита
   названной записи: «сумма сумм» есть сумма, «счёт чего угодно» есть число (ADR-0209 §2). */
const typeOf = r => !r ? '' :
  (r.type || (r.src === 'агрегат' ? (r.fn === 'count' ? 'число' : typeOf(IND(r.over))) : ''));
ST.typeOf = id => typeOf(REC(id));
/* Правило округления — РЕКВИЗИТ ЗАПИСИ, а не свойство кода (ADR-0214 §6). Читается так
   же, как единица и тип: у шва и поля ОБЪЯВЛЕН, у агрегата НАСЛЕДУЕТСЯ от показателя-
   основания — «сумма сумм» округляется по тому же правилу, что слагаемые, и второго
   правила в своде взяться неоткуда. Значение реквизита есть ССЫЛКА на объявление ядра
   (`CORE.SOM_ROUNDING`), а не своё правило: объявлений по-прежнему одно. */
const roundOf = r => !r ? '' :
  (r.round || (r.src === 'агрегат' ? roundOf(IND(r.over)) : ''));
ST.roundOf = id => roundOf(REC(id));

/* --------- РЕКВИЗИТЫ ЗАПИСИ, РАСПИСАННЫЕ ПО ПОРОДАМ (ADR-0209 §1–§3) ---------- *
   Список закрыт с ОБЕИХ сторон: реквизит чужой породы — отказ, реквизит ничей — отказ.
   Пока порода не была объявлена, форма превращалась в набор необязательных полей, где у
   признака можно указать единицу измерения, а у числа — иерархию. Проверить там нечего
   не потому, что проверку забыли написать, а потому, что не объявлено, чем запись
   должна быть (ADR-0209, «Отвергнуто»).                                              */
/* `dates` — СКОЛЬКО ДАТ СРЕЗА нужно, чтобы величину вычислить (ИС-47, ADR-0220). Реквизит
   общий обеим породам, потому что колонку строки порождает всякая запись любой породы, а
   строка принадлежит ОДНОЙ дате (ADR-0147): величина о двух датах не принадлежит ни одной
   из них — положенная в майскую строку, она записывает туда факт про апрель. */
const F_COMMON = ['id','kind','name','obj','since','until','note','access','grp','dates','history'];
/* Дорога до значения ОБЩАЯ обеим породам: и число, и признак приходят швом, полем или
   (у показателя) агрегатом. Общая она потому, что это не формула, а АДРЕС: запись
   говорит, откуда взять величину, и молчит о том, как она получается (ADR-0150). */
const F_ROAD = ['src','seam','field','key'];
/* `roll` + `rollBy` — правило свода и ОБЯЗАТЕЛЬНЫЙ разрез при формульном своде (ИС-44,
   ADR-0214 §1): неаддитивность объявляется РЕКВИЗИТОМ записи, а не поведением движка.
   `somOf` — сомовая запись называет ту валютную, чьей стороной она является; своей
   формулы у неё нет, есть АДРЕС происхождения, и по нему сторож перемножает колонки. */
const F_IND  = ['type','unit','money','flow','fn','over','live','dedupBy','roll','rollBy','somOf','round'];
const F_DIM  = ['levels','buckets','edges','ref','owner','perObject','basis','order'];
const FIELDS = {};
FIELDS[KIND.IND] = F_COMMON.concat(F_ROAD, F_IND);
FIELDS[KIND.DIM] = F_COMMON.concat(F_ROAD, F_DIM);
/* Правило свода — реквизит показателя (ADR-0174). «Формульный» здесь означает правило
   ВЛАДЕЛЬЦА величины о том, как он сводит её у себя, — поля выражения в записи реестра
   от этого не появляется ни одного (ADR-0209 §4). */
const ROLLS = ['аддитивный','формульный','только-свод'];
const FLAT_TYPES = ['перечисление','булево'];
/* Порядок значений — реквизит разреза (ADR-0209 §3), и список его закрыт: «алфавит» и
   «как в отчёте» здесь не значения, а разные ответы в разных отчётах. Порядок ОБЪЯВЛЕН
   тогда, когда объявлено, что упорядочивать: корзины, уровни или справочник. */
const ORDERS = ['по значению','по справочнику','по объявленному порядку'];
/* Поля, которыми формула пробирается в реестр под разными именами. Отказ по ним — на
   ОБЕ породы: у разреза выражения тоже не бывает, а корзина исключением не является —
   она не выводит новой величины, она раскладывает существующую по границам. */
const FORMULA_FIELDS = ['formula','expr','выражение','формула'];

/* Общие реквизиты присутствуют у КАЖДОЙ записи, даже когда пусты: пустой реквизит —
   объявленное «не задано», а отсутствующий — вопрос, которого никто не задал. Здесь же
   видно, чего у показателей до ADR-0209 не спрашивали вовсе: даты заведения. */
function normRec(r){
  if(!r.since) r.since = '2020-01-01';
  if(r.until === undefined) r.until = null;
  if(r.note === undefined) r.note = '';
  if(r.access === undefined) r.access = 'по охвату объекта';
  /* Умолчание есть только у ПЕРЕНОСА: записи демо-мира заведены до ИС-47, и ответ у всех
     один — одна дата, потому что другой они и требовать не могут (поля формулы в записи
     нет, а шов, поле и агрегат читаются НА ДАТУ). При заведении умолчания нет: там вопрос
     ЗАДАЁТСЯ, и молчание ответом не считается (см. validate). Подставленная в двери
     «одна» молча превратила бы заявку на изменение остатка в колонку остатка под именем
     изменения — и имя бы врало (ИС-40, ИС-47, ADR-0220 §1). */
  if(r.dates === undefined) r.dates = 1;
  if(!r.history) r.history = [{at: r.since, what: 'заведена', kind: r.kind}];
  if(r.kind === KIND.IND){
    if(!r.roll) r.roll = FLAT_TYPES.indexOf(r.type) >= 0 ? 'только-свод' : 'аддитивный';
    if(r.src === 'агрегат' && r.live === undefined) r.live = true;
  } else if(!r.order){
    /* Порядок не угадывается по данным, а выводится из ОБЪЯВЛЕННОГО: объявлены корзины
       или уровни — порядок объявленный; назван справочник — порядок его; не названо
       ничего — по значению. Молчание записи тоже становится ответом, но названным. */
    r.order = (r.buckets || r.edges || r.levels) ? 'по объявленному порядку'
            : (r.ref || r.owner) ? 'по справочнику' : 'по значению';
  }
  return r;
}

/* ============ СОМОВАЯ ЗАПИСЬ — БЛИЗНЕЦ ВАЛЮТНОЙ (ИС-44, ADR-0214) ============= *
 *  «Сумма в валюте договора» и «сумма в сомах» — ДВА показателя реестра с двумя
 *  разными именами, а не одно число с оговоркой в примечании. Первый аддитивен
 *  только внутри разреза «валюта» и потому объявлен формульным с НАЗВАННЫМ
 *  обязательным разрезом; второй аддитивен всегда и потому обычная запись со своим
 *  именем, своей единицей и правилом свода «аддитивный» (§1, §2).
 *
 *  Порождение — МЕХАНИЧЕСКОЕ и в ОДНОМ месте: и демо-реестр, и заведение через дверь
 *  идут сюда же, а дальше — общий `normRec` и общий валидатор. Пиши близнецов руками —
 *  и первый же забытый превратился бы в денежный показатель, который нельзя сложить по
 *  портфелю и о котором никто об этом не узнает, пока не сойдутся два отчёта.
 *  Денежный АГРЕГАТ получает близнеца над близнецом: свод сомовой колонки есть свод, а
 *  не второй способ пересчёта (§3 — пересчёт делает ядро).                            */
const SOM_SUFFIX = '-som';
/* Обязательный разрез свода — разрез ВАЛЮТЫ СВОЕГО объекта. После волны 17 их несколько
   и они разные записи: валюта кредитного договора и валюта платежа складываются каждая
   внутри себя и между собой не складываются вовсе (ИС-40, ADR-0206). Таблица — часть
   ПЕРЕНОСА демо-реестра, заведённого до ИС-44; в дверь реквизит СПРАШИВАЕТСЯ, и
   умолчания у него там нет (см. `checkInd`). */
const CUR_DIM = {'obj-credit':'d-cur', 'obj-borrower':'d-bcur', 'obj-collateral':'d-ccur',
  'obj-case':'d-ocur', 'obj-claim':'d-clcur', 'obj-program':'d-pgcur', 'obj-repay':'d-pcur',
  'obj-receipt':'d-rcur', 'obj-measure':'d-mcur'};
const isSomRow = r => !!r && r.kind === KIND.IND && r.src !== 'агрегат' && !!r.money && !r.somOf;
function somTwinOf(r){
  const t = clone(r);
  t.id = r.id + SOM_SUFFIX;
  /* Имя РАЗНОЕ и различается явно, а не примечанием (ADR-0214, «Последствия»): два числа,
     которые нельзя сложить между собой, не носят одного имени (ИС-40, ADR-0206 §6). */
  t.name = r.name + ' в сомах';
  t.somOf = r.id;
  t.unit = 'сом';
  t.money = true;
  t.roll = 'аддитивный';
  delete t.rollBy;
  delete t.history;
  if(r.src === 'агрегат') t.over = r.over + SOM_SUFFIX;
  t.note = 'сомовая сторона величины «'+r.name+'»: произведение валютной колонки строки на '+
    'курс той же строки, посчитанное ядром и записанное колонкой (ИС-44, ADR-0214 §2, §5)';
  return t;
}
/* Объявление неаддитивности и порождение близнеца — ОДНО действие и одно место: запись
   становится формульной с НАЗВАННЫМ разрезом, и рядом с ней встаёт сомовая. Разъехаться
   этим двум половинам негде — их делает одна строка (ИС-44, ADR-0214 §1, §2). */
function declareTwin(rec, rollBy){
  rec.roll = 'формульный';
  rec.rollBy = rollBy;
  return somTwinOf(rec);
}
/* Сборка реестра: валютная запись объявляет свою неаддитивность, рядом встаёт сомовая.
   Близнец кладётся СРАЗУ за origin — и в реестре, и в СОСТАВЕ ОБЪЕКТА они читаются парой.
   Второе важнее первого: записи, которой нет в составе объекта, витрина не читает и не
   рисует — она существовала бы только в реестре и ничего бы не значила (ADR-0150 §5). */
function withSomTwins(list, objects){
  const by = {};
  list.forEach(r => { by[r.id] = r; });
  const twinable = r => isSomRow(r) ||
    (r.kind === KIND.IND && r.src === 'агрегат' && r.fn !== 'count' && !r.somOf && isSomRow(by[r.over]));
  const out = [];
  list.forEach(r => {
    out.push(r);
    if(!twinable(r)) return;
    /* ПЕРЕНОС демо-реестра, часть вторая: денежной записи проставляется правило
       округления — ссылкой на единственное объявление ядра, механически и в одном месте.
       В дверь реквизит СПРАШИВАЕТСЯ, и умолчания у него там нет (см. `checkInd`).
       Ставится ДО порождения близнеца: близнец копией берёт правило origin, и разъехаться
       им негде (ADR-0214 §6). Агрегату не ставится — он наследует его от основания. */
    if(r.money && !r.round) r.round = CORE.SOM_ROUNDING.id;
    /* Валютная запись ОБЪЯВЛЯЕТ свою неаддитивность реквизитом, а не примечанием: свод
       формульный, и обязательный разрез назван поимённо (ADR-0214 §1). */
    const t = declareTwin(r, CUR_DIM[r.obj]);
    out.push(t);
    const o = (objects || []).find(x => x.id === r.obj);
    if(o){ const i = o.inds.indexOf(r.id); if(i >= 0) o.inds.splice(i + 1, 0, t.id); }
  });
  return out;
}
ST.SOM_SUFFIX = SOM_SUFFIX;
ST.somIdOf = id => (REC(id + SOM_SUFFIX) ? id + SOM_SUFFIX : null);

/* ------------------ СХЕМА ВИТРИНЫ ПОРОЖДЕНА РЕЕСТРОМ (ADR-0209 §6) ------------- *
   Операция ровно ОДНА: `ADD COLUMN`, всегда nullable, всегда с записью в журнал.
   Nullable — не мягкость, а факт: строки, написанные до заведения записи, в этой
   колонке пусты, и заполнить их задним числом нечем (ADR-0147 §4). Обратного хода нет
   и быть не может: в колонке уже лежат числа, и `DROP` сделал бы прошлые строки
   нечитаемыми — в клетке осталось бы значение без имени. Поэтому запись не удаляют,
   а прекращают действие с даты. Смена породы схемы НЕ трогает: колонка хранит значение
   записи, а не её породу, — иначе рядовой переезд требовал бы `ALTER`, и в журнале
   появилась бы вторая операция.                                                     */
function colType(r){
  return r.kind === KIND.DIM ? 'значение признака' : (typeOf(r) || 'значение');
}
function martAdd(st, r, at, who, why){
  if(st.mart.some(c => c.col === r.id)) return null;
  /* `kindAt` — порода в МОМЕНТ заведения колонки, историческая отметка, а не текущее
     свойство записи: породу сегодняшнюю называет реестр, и переезд отметки не правит. */
  st.mart.push({col: r.id, kindAt: r.kind, type: colType(r), nullable: true, at});
  st.martLog.push({op:'ADD COLUMN', col: r.id, kindAt: r.kind, type: colType(r),
    nullable: true, at, who: who || '—', why: why || 'заведена запись реестра'});
  return st.mart[st.mart.length - 1];
}
/* Колонка витрины принадлежит ЗАПИСИ, а не породе: id колонки есть id записи. Поэтому
   переезд породы схемы не касается вовсе, а прекращение действия колонку не убирает —
   в ней остались числа прошлых строк (ADR-0209 §6).                                  */
ST.martCol = id => clone(ST.state.mart.find(c => c.col === id) || null);
ST.mart = () => clone(ST.state.mart);
ST.martLog = () => clone(ST.state.martLog);
ST.seams = () => SEAMS.slice();
ST.aggFns = () => Object.keys(AGG_FNS);
ST.consumers = () => clone(CONSUMERS);

/* ==================== СБОРЩИК СТРОКИ СРЕЗА ==========================
 *  НИ ОДНОГО СЛОВА ПРЕДМЕТНОЙ ОБЛАСТИ НИЖЕ. Всё, что сборщик знает, он берёт
 *  из записей реестров: разрез объявляет источник, показатель объявляет источник,
 *  объект перечисляет то и другое. Шестой объект стоит одной строки данных.
 *  Смоук проверяет это буквально — по тексту функций (ИС-18).
 * =================================================================== */
function readDim(dimId, item, dateISO){
  const d = DIM(dimId);
  if(!d) return null;
  if(d.since > dateISO) return null;                       /* разрез действует вперёд */
  return d.levels ? readPath(d, item, dateISO) : readSrc(d, item, dateISO);
}
/* Один читатель на все случаи: разрез, уровень разреза и показатель-«поле» берут значение
   одинаково — записью, а не веткой (ИС-18). */
function readSrc(spec, item, dateISO){
  if(!spec) return null;
  if(spec.src === 'история') return valueOn(item.h[spec.key], dateISO);
  if(spec.src === 'поле')    return item.f[spec.key] == null ? null : item.f[spec.key];
  if(spec.src === 'шов'){
    const a = CORE.read(spec.seam, item, dateISO);
    return a && a[spec.field] ? a[spec.field].value : null;
  }
  return null;
}
/* Дата рождения читается ТЕМ ЖЕ читателем, что разрез и показатель-поле (ИС-18):
   движок её не угадывает и не выводит из первого звена истории — она объявлена. */
function bornOn(o, item, dateISO){ return o && o.born ? readSrc(o.born, item, dateISO) : null; }

/* Иерархический разрез кладёт в строку ПУТЬ, а не листовое значение: иначе родитель
   пришлось бы доспрашивать сегодняшним справочником — и строка от 31.05 поехала бы
   вслед за сегодняшним переподчинением (ИС-4). Верхние уровни с источником «справочник»
   берутся у владельца (ADR-0176 §7). Путь обрывается на первом пустом уровне: объект
   без нижнего уровня остаётся у родителя и не исчезает (ADR-0176 §5). */
function readPath(d, item, dateISO){
  const vals = d.levels.map(L => L.src === 'справочник' ? null : readSrc(L, item, dateISO));
  for(let i = d.levels.length - 2; i >= 0; i--){
    if(d.levels[i].src === 'справочник'){
      const below = vals[i+1];
      vals[i] = below == null ? null : (((REF[d.ref] || {}).parent || {})[below] || null);
    }
  }
  const path = [];
  for(const v of vals){ if(v == null) break; path.push(v); }
  return path.length ? path : null;
}
function readInd(indId, item, dateISO){
  const m = IND(indId);
  if(!m || m.src === 'агрегат') return null;               /* агрегат в строке не лежит — ИС-3 */
  /* Сомовая запись — обычная колонка строки, читаемая ТЕМ ЖЕ читателем (ИС-18, ИС-44).
     Считает её ЯДРО одним своим пересчётом (ADR-0214 §3); витрина берёт готовое и кладёт
     рядом ОСНОВАНИЕ — применённый курс и дату курса по каждой части (`from`), чтобы
     сторож перемножил и сверил, не выходя из строки (§4, §5). Своих `parts` у сомовой
     клетки ровно одна и она сомовая: сложить её с валютной колонкой соседа нельзя, а
     сложить с сомовой колонкой соседа — можно всегда, и это вся разница между двумя
     показателями. Валютная клетка сомовой стороны в себе НЕ несёт: величина живёт в
     своей колонке под своим именем, а не приложением к чужой (ADR-0214 §2). */
  if(m.somOf){
    const src = readInd(m.somOf, item, dateISO);
    if(!src) return null;
    /* Правило округления берётся ИЗ ЗАПИСИ, а не из кода витрины (ADR-0214 §6). */
    const som = CORE.toSom(src.parts && src.parts.length ? src.parts
      : [{cur: src.cur, value: src.v, rate: src.rate, rateDate: src.rateDate}], roundOf(m));
    if(!som) return null;
    return {v: som.value, cur:'KGS', rate: 1, rateDate: som.rateDate,
            parts: [{cur:'KGS', value: som.value, rate: 1, rateDate: som.rateDate}],
            from: som.from, round: som.round};
  }
  if(m.src === 'поле'){
    const v = item.f[m.key];
    if(v == null) return null;
    if(!m.money) return {v};
    const r = rateOn(item.f.cur || 'KGS', dateISO);
    return {v, cur: item.f.cur || 'KGS', rate: r.rate, rateDate: r.rateDate};
  }
  if(m.src === 'шов'){
    const a = CORE.read(m.seam, item, dateISO);
    const cell = a && a[m.field];
    if(!cell) return null;
    /* Разновалютная клетка молчит значением и говорит составом: у неё value пуст, а
       части есть — и она НЕ пустая (ADR-0184 §3). Пустой её считает только отсутствие
       и того и другого. */
    if(cell.value == null && !(cell.parts && cell.parts.length)) return null;
    if(!m.money) return cell.value == null ? null : {v: cell.value};
    return {v: cell.value, cur: cell.cur, rate: cell.rate, rateDate: cell.rateDate,
            parts: cell.parts, mixed: !!cell.mixed};
  }
  return null;
}
function buildRow(objId, item, dateISO){
  const o = OBJ(objId);
  const dims = {}, inds = {};
  o.dims.forEach(id => { const v = readDim(id, item, dateISO); if(v != null) dims[id] = v; });
  o.inds.forEach(id => { const c = readInd(id, item, dateISO); if(c) inds[id] = c; });
  return {obj: objId, ref: item.id, date: dateISO, dims, inds, fixed: null, by: 'прогон'};
}
ST.readDim = readDim; ST.readInd = readInd; ST.buildRow = buildRow;
/* Корзина — функция от СОХРАНЁННОГО значения, применяемая при чтении (ADR-0176 §3):
   строка хранит дату как есть, поэтому смена набора корзин прошлое не переписывает
   и ИС-4 не задет. Свободной корзины не бывает — набор объявлен записью разреза. */
const QN = ['I','II','III','IV'];
function bucketOf(v, bucket, spec){
  if(v == null) return null;
  /* Границы — данные записи, а не ветка функции: новый набор ступеней заводится строкой. */
  if(spec && spec.edges){
    const n = Number(v), e = spec.edges, uu = unitOf(spec), u = uu ? ' ' + uu : '';
    if(n < e[0]) return (e[0] - 1) + u;
    for(let i = 0; i < e.length - 1; i++) if(n < e[i+1]) return e[i] + '–' + (e[i+1] - 1) + u;
    return e[e.length - 1] + '+' + u;
  }
  const t = String(v);
  if(bucket === 'год')     return t.slice(0,4);
  if(bucket === 'квартал') return t.slice(0,4)+' · '+QN[Math.floor((Number(t.slice(5,7))-1)/3)]+' кв.';
  if(bucket === 'месяц')   return monLabel(t.slice(0,7));
  return t;
}
/* Ключ группы: у иерархии — путь до запрошенного уровня, у корзины — корзина. */
function dimKey(d, val, q){
  if(val == null) return null;
  if(d && d.levels){
    const lvl = (q && q.levels && q.levels[d.id]) || d.levels.length;
    const path = (Array.isArray(val) ? val : [val]).slice(0, lvl);
    return path.length ? path.join(' / ') : null;
  }
  if(d && d.buckets) return bucketOf(val, q && q.buckets && q.buckets[d.id], d);
  return String(val);
}
ST.bucketOf = bucketOf;
/* Форма строки закрыта: ни долей, ни дельт, ни агрегатов (ИС-3, ИС-15) — всё это
   считается при показе из того, что лежит здесь. Восьмого поля рядом с `inds` волна 17 ч.6
   НЕ завела: сомовая величина вошла в строку не полем формы, а КОЛОНКОЙ внутри `inds` под
   именем своей записи реестра — поле нельзя назвать в отчёте, поставить в состав объекта и
   прекратить датой, а запись реестра можно (ИС-44, ADR-0214 §2). Прежнее «ни сомового
   эквивалента» относилось к нему как к представлению и ОТМЕНЕНО вместе с ним. */
ST.ROW_SHAPE = ['obj','ref','date','dims','inds','fixed','by'];

/* ========================= ПРОГОН И ФИКСАЦИЯ ======================== */
function doRun(st, dateISO, kind, actor, reason){
  let written = 0;
  /* Состав прогона пишется поимённо: «строк — 46» не говорит, какое множество не
     доехало. Объект, у которого владелец отдал ноль, обязан быть виден строкой с
     нулём, а не отсутствием строки (СС-Д6). */
  const parts = [];
  st.objects.forEach(o => {
    let n = 0, kept = 0, unborn = 0, noborn = 0;
    (WORLD[o.id] || []).forEach(item => {
      /* До рождения строки НЕТ — и это третье состояние, не «пусто» и не «ноль»
         (ИС-33). Строка, написанная на дату, когда объекта ещё не было, сочиняет
         прошлое: любое движение, взятое разностью двух дат, окажется придуманным,
         а состав среза на старую дату — сегодняшним. */
      const born = bornOn(o, item, dateISO);
      if(born == null){ noborn++; return; }
      if(born > dateISO){ unborn++; return; }
      const row = buildRow(o.id, item, dateISO);
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(i >= 0){ if(st.rows[i].fixed){ kept++; return; } st.rows[i] = row; } else st.rows.push(row);
      n++; written++;
    });
    /* Ненаступившее и безродное считаются ПОИМЁННО: «строк — 0» само по себе не
       отличает «ещё никого не было» от «владелец не отдал множество» (СС-Д6). */
    parts.push({obj: o.id, name: o.name, n, kept, unborn, noborn});
  });
  st.runs.push({date: dateISO, kind, at: st.today, actor, reason, written, parts});
  return written;
}
function fixMonth(st, month, who, atISO){
  let n = 0;
  st.rows.forEach(r => { if(ym(r.date) === month && !r.fixed){ r.fixed = {period: month, at: atISO, by: who}; n++; } });
  return n;
}
/* Обратная сторона fixMonth, и она ОБЯЗАНА существовать: «строки пишутся заново» без
   снятия фиксации остаётся словом. Прогон за перезакрытый период зафиксированную строку
   пропускает и считает в kept (см. doRun) — период оказался бы открыт для записи, которая
   не происходит, а числа остались бы прежними при новом основании (ИС-50, ADR-0204 §4).
   Поле обнуляется, а не удаляется: форма строки закрыта и от её судьбы не меняется (ИС-15). */
function unfixMonth(st, month){
  let n = 0;
  st.rows.forEach(r => { if(ym(r.date) === month && r.fixed){ r.fixed = null; n++; } });
  return n;
}

/* ------------ КАЛЕНДАРЬ УЧЁТНЫХ ПЕРИОДОВ (ИС-38, ADR-0204) ----------
   Справочник ОБЩИЙ и лежит НИЖЕ всех слоёв. Строка справочника — период; в ней по
   колонке-защёлке на каждый слой, а в колонке — актор и дата простановки, у каждого слоя
   свои. Пустая строка («месяц идёт») и отсутствие строки вовсе — РАЗНЫЕ состояния, и
   справочник обязан их различать (ADR-0204, границы).
   Справочник сам НЕ АКТОР: он ничего не проставляет ни по расписанию, ни за человека —
   только отказывает или пропускает (ИС-9). Ни одного числа он тоже не хранит.          */
function calendarRow(st, month){ return st.periods.find(p => p.month === month) || null; }
function latchOf(st, month, layer){
  const p = calendarRow(st, month);
  return p && p.latches[layer] ? p.latches[layer] : null;
}
/* ЕДИНСТВЕННОЕ место, где колонка становится проставленной, — и порядок стережётся здесь,
   а не у вызывающего. Каскад, собранный процедурой в чьём-то коде, делает рассогласование
   слоёв штатным состоянием вместо ошибки, и отличить «ещё не доехало» от «сломалось»
   становится нечем (ADR-0204, отвергнутое). Здесь каскад — состояние строки. */
function closeLayer(st, month, layer, who, atISO){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  if(!who) return {ok:false, why:'колонка «'+layer+'» без актора не проставляется: период закрывает человек, а не календарь (ИС-9)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: «строки нет» и «строка пуста» — разные состояния (ADR-0204, границы)'};
  const was = row.latches[layer];
  if(was) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+' уже проставлена ('+
    was.by+', '+fmt(was.at)+'): перезакрытие идёт распоряжением и сверху вниз (ADR-0204 §4)'};
  const expected = st.months.find(m => !latchOf(st, m, layer));
  if(month !== expected) return {ok:false, why:'периоды закрываются по порядку: следующий по слою «'+
    layer+'» — '+monLabel(expected)};
  if(monthEnd(month) >= st.today) return {ok:false, why:'период '+monLabel(month)+' ещё не завершён: закрытие возможно с '+fmt(first(nextM(month)))};
  /* Отказ НАЗЫВАЕТ незакрытый слой: «нельзя» без имени препятствия — половина ответа (§8.4),
     а слоёв под тобой может быть и два. */
  const empty = LAYERS.slice(0, i).filter(L => !row.latches[L]);
  if(empty.length) return {ok:false, blockedBy: empty[0], why:'колонка «'+layer+'» периода '+
    monLabel(month)+' не проставляется: не закрыт слой «'+empty[0]+'»'+
    (empty.length > 1 ? ' (и «'+empty.slice(1).join('», «')+'»)' : '')+
    ' — колонка не ставится, пока пуста нижележащая (ИС-38, ADR-0204 §3)'};
  /* При ПОВТОРНОЙ простановке колонка несёт ещё и номер распоряжения (ADR-0204 §1).
     Иначе «май закрыт 12 сентября» не отличить от опоздавшего первого закрытия, а это
     разные вещи: у второго есть основание, которое кто-то подписал, и получатель сданного
     вправе его спросить (ИС-50, ADR-0157 §6). Распоряжение берётся из СТРОКИ периода, а не
     из аргумента: простановку делает другой модуль и другим действием, и передавать номер
     через три двери значило бы надеяться, что его не забудут. */
  const re = row.reopens && row.reopens[row.reopens.length - 1];
  row.latches[layer] = re ? {by: who, at: atISO, order: re.order} : {by: who, at: atISO};
  return {ok:true, month, layer, by: who, at: atISO, order: re ? re.order : null};
}

/* Тот же каскад, прочитанный в обратную сторону: защёлки снимаются СВЕРХУ ВНИЗ. Снять
   нижнюю, оставив верхнюю, — значит объявить период открытым для записи под уже
   проставленной верхней колонкой: «закрыт» и «открыт» оказались бы верны одновременно, а
   верхний слой — подписанным под числами, которых он не видел (ИС-50, ADR-0204 §3 и §4).
   Снятие — НЕ открытие: открывается только нижний слой, верхние переспрашивают. */
function openLayer(st, month, layer){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: снимать нечего (ADR-0204, границы)'};
  if(!row.latches[layer]) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+
    ' и так пуста: по этому слою период не закрыт (ADR-0204, границы)'};
  /* Отказ называет слой, с которого сброс НАЧИНАЕТСЯ, — самый верхний из проставленных:
     «нельзя» без имени первого шага — половина ответа (§8.4). */
  const above = LAYERS.slice(i + 1).filter(L => row.latches[L]);
  if(above.length){
    const top = above[above.length - 1];
    return {ok:false, blockedBy: top, why:'колонка «'+layer+'» периода '+monLabel(month)+
      ' не снимается: над ней проставлен слой «'+top+'»'+
      (above.length > 1 ? ' (и «'+above.slice(0, -1).join('», «')+'»)' : '')+
      ' — сброс идёт СВЕРХУ ВНИЗ и начинается с «'+top+'» (ИС-50, ADR-0204 §4)'};
  }
  const was = row.latches[layer];
  delete row.latches[layer];
  return {ok:true, month, layer, was, opened: layer === BASE_LAYER};
}

/* ---------------------------- СОСТОЯНИЕ ---------------------------- */
function seed(){
  const MONTHS = ['2026-05','2026-06','2026-07','2026-08'];
  /* Состав объектов собирается ДО реестра: порождатель близнецов кладёт сомовую запись
     и в реестр, и в состав её объекта одним действием (ИС-44). */
  const objs = clone(OBJECTS);
  const st = {
    today: '2026-08-21',
    role: 'Администратор статистики',
    view: 'build',
    months: MONTHS.slice(),
    /* Календарь учётных периодов — ОБЩИЙ справочник (ИС-38, ADR-0204), а не список
       закрытых месяцев статистики: строка периода несёт колонку на каждый слой. Строка
       заводится сразу и ПУСТОЙ — пустая значит «месяц идёт», а отсутствие строки значит,
       что периода в справочнике нет вовсе, и это разные ответы. */
    periods: MONTHS.map(m => ({month: m, latches: {}})),
    objects: objs,
    /* ОДНА кладовая на обе породы (ИС-43, ADR-0209). Полей `indicators` и `dims` в
       состоянии больше нет — вместо них ниже объявлены ВИДЫ на эту же кладовую: они
       ничего не хранят и потому не могут разъехаться с ней. */
    /* Сборка реестра: валютные записи объявляют формульный свод с обязательным разрезом,
       и рядом с каждой встаёт её сомовый близнец — механически, в одном месте и по тому
       же `normRec`, что и всё остальное (ИС-44, ADR-0214 §1, §2). */
    registry: withSomTwins(clone(REGISTRY), objs).map(normRec),
    /* Схема витрины ПОРОЖДЕНА реестром (ADR-0209 §6) и собирается ниже той же дверью,
       что и при заведении записи человеком: одна запись — одна колонка, nullable,
       с записью в журнал. Операция в журнале ровно одна на весь модуль. */
    mart: [], martLog: [],
    rows: [], runs: [], log: [], exports: [],
    /* Обратный индекс ссылок — ВТОРАЯ хранимая вещь модуля (ADR-0177 §1). Ссылку
       публикует потребитель: статистика не знает, кто её читает, — в индексе лежат
       те, кто пришёл и назвался. */
    refs: [
      {ind:'a-sumdebt',  consumer:'ведомство',   edition:'Свод ведомства · плитка «портфель»',
       owner:'Отдел сводной отчётности', at:'2026-07-02'},
      {ind:'a-sumdebt',  consumer:'отчётность',  edition:'Форма 1-К, графа 4',
       owner:'Управление отчётности', at:'2026-06-11'},
      {ind:'m-odays',    consumer:'анализ',      edition:'Аналитический обзор просрочки, раздел 2',
       owner:'Аналитический отдел', at:'2026-08-03'},
      {ind:'a-sumissued', consumer:'программы',  edition:'Карточка программы · плитка «освоено»',
       owner:'Управление программ', at:'2026-08-28'}
    ],
    /* Корректировка за май, вскрывшаяся в июле: прошлое неизменно, но расхождение
       обязано быть видно строкой (ИС-11, ADR-0148 §5). */
    corrections: [{month:'2026-05', obj:'obj-credit', ref:'КД-2023/210', inds:'m-debt',
      delta: 16320.17, at:'2026-07-14', basis:'акт сверки № 41 от 14.07.2026'}],
    /* Роль сужает мир: у аналитика и наблюдателя свой портфель (ADR-0152 §3). */
    scope: {'Аналитик':'Бекова Н.', 'Наблюдатель':'Бекова Н.'},
    q: {obj:'obj-credit', dims:['d-branch'], inds:['a-count','a-sumdebt'], date:'2026-08-21',
        mode:'slice', filter:null, levels:{}, buckets:{}, series:{step:'месяц', points:4}},
    flow: {inds:'m-repaid', from:'2026-07-15', to:'2026-08-18'},
    fEdit: null,
    drill: null
  };
  ST.state = st;
  /* Виды на ОДНУ кладовую. `st.indicators` и `st.dims` ничего не хранят — они читают
     реестр и отбирают объявленную породу, и потому разъехаться с ним не могут. Положить
     запись «в dims» больше некуда: складов нет, есть реестр (ИС-43, ADR-0209). Виды
     неперечислимы нарочно — чтобы никто не принял их за хранимое поле состояния. */
  Object.defineProperty(st, 'indicators', {enumerable:false, configurable:true,
    get: () => st.registry.filter(r => r.kind === KIND.IND)});
  Object.defineProperty(st, 'dims', {enumerable:false, configurable:true,
    get: () => st.registry.filter(r => r.kind === KIND.DIM)});
  /* Схема витрины собирается ТОЙ ЖЕ дверью, которой её потом наращивает человек:
     обойди демо-мир сторожа — сторож перестал бы что-либо доказывать. */
  st.registry.forEach(r => martAdd(st, r, r.since, 'реестр', 'запись реестра заведена'));
  ['2026-05-31','2026-06-30','2026-07-31','2026-08-10','2026-08-18']
    .forEach(d => doRun(st, d, 'плановый', null, null));
  st.runs.push({date:'2026-08-19', kind:'пропуск', at:'2026-08-20', actor:'планировщик',
    reason:'сбой ночного планировщика: задание не стартовало', written:0});
  /* Прогон ПОСЛЕ пропуска: без него единственная дыра демо-мира лежала бы в хвосте, а
     хвост и пропуск — разные случаи, и волна 14 их развела. Теперь 19.08 — дыра внутри
     истории (подстановка с названным возрастом, ИС-12), а 21.08 — хвост (отказ, ИС-36). */
  doRun(st, '2026-08-20', 'плановый', null, null);
  /* Вопрос встаёт на последний прогон, а не на «сегодня» (ИС-36). Журнал читается здесь
     напрямую: помощники слоя показа к моменту сборки состояния ещё не объявлены. */
  st.q.date = st.runs.filter(r => (r.parts || []).some(p => p.obj === st.q.obj))
    .map(r => r.date).sort().slice(-1)[0];
  /* Май и июнь закрыты по ВСЕМ трём слоям — разными людьми и в разные даты. Одной общей
     колонкой «закрыт» их не описать: учёт закрывает бухгалтерия 5 июня, категории
     защёлкивает администратор классификации 7-го, статистика датирует 8-го (ИС-9,
     ADR-0204 §1). Демо-мир строится ТОЙ ЖЕ дверью, что и человеком: обойди он сторожа
     порядка — сторож перестал бы что-либо доказывать. */
  const ACTORS = {'учёт':'Осмонова Г., главный бухгалтер',
                  'классификация':'Турдубаева А., администратор классификации',
                  'статистика':'Мамбетов Э., администратор статистики'};
  [['2026-05', ['2026-06-05','2026-06-07','2026-06-08']],
   ['2026-06', ['2026-07-06','2026-07-08','2026-07-09']]].forEach(p => {
    LAYERS.forEach((L, i) => closeLayer(st, p[0], L, ACTORS[L], p[1][i]));
    /* Строки фиксирует простановка ВЕРХНЕЙ колонки: это эффект слоя, а не справочника —
       календарь стережёт порядок и не трогает ничьих чисел (ADR-0204 §6, границы). */
    fixMonth(st, p[0], ACTORS[MY_LAYER], p[1][LAYERS.length - 1]);
  });
  st.log = [];
  return st;
}
ST.seed = () => { ST.state = seed(); return ST.state; };
ST.state = seed();
function log(msg){ ST.state.log.unshift({at: ST.state.today, who: ST.state.role, msg}); }

/* ------------------------- ДОСТУП И РОЛИ ---------------------------- */
ST.canAdmin = () => ST.state.role === 'Администратор статистики';
ST.canBuild = () => ST.state.role !== 'Наблюдатель';
/* Роль даёт ОДНО: чей охват применяется. КАКИМ разрезом он режет — знает объект, а не
   роль (ИС-37, ADR-0203 §1). До волны 15 здесь стояло зашитое «d-curator», и объект,
   назвавший свой охват иначе, молча пустел (СС-Д11). */
ST.curatorOf = () => ST.state.scope[ST.state.role] || null;
/* Охват объекта: null — роль не сужает (администратор, либо объект объявлен общим),
   {dim,value} — режется разрезом, {denied} — под ролью не спрашивается (отказ с дорогой). */
ST.scopeOf = objId => {
  const c = ST.curatorOf();
  if(!c) return null;
  const o = OBJ(objId || (ST.state.q && ST.state.q.obj));
  if(!o) return null;
  const s = o.scope;
  /* Необъявленный охват сюда не доходит: его валит загрузка (проверка #132). Ветка
     оставлена ЯВНОЙ — молчаливое «значит, общий» и есть тот дефект, который волна чинит. */
  if(!s) return {denied:{why:'у объекта «'+o.name+'» охват ролей не объявлен', road:'заведите реквизит scope записью реестра (ИС-37)'}};
  if(s.open) return null;
  if(s.denied) return {denied: s.denied, obj: o};
  return {dim: s.dim, value: c};
};

/* ------------------------ ПЕРИОДЫ И ЗАЩЁЛКА ------------------------- */
/* Календарь ОДИН на все слои: «зафиксирован» для статистики значит «проставлена колонка
   СТАТИСТИКИ в той же строке общего справочника». Своего списка закрытых периодов у
   модуля нет и завести его больше негде (ИС-38, ADR-0204). */
ST.isClosed = dateISO => !!latchOf(ST.state, ym(dateISO), MY_LAYER);
ST.calendar = () => ST.state.periods;
ST.layers = () => LAYERS.slice();
ST.latch = (month, layer) => latchOf(ST.state, month, layer || MY_LAYER);
/* «Открыт» без имени слоя — вопрос без ответа: каскад у слоёв доехал до разных мест, и
   ровно на этом три календаря давали три законных ответа (ADR-0204, контекст). */
ST.openPeriod = layer => ST.state.months.find(m => !latchOf(ST.state, m, layer || MY_LAYER));
ST.closedMonths = layer =>
  ST.state.periods.filter(p => p.latches[layer || MY_LAYER]).map(p => p.month);
ST.fixationOfMonth = m => {
  const st = ST.state;
  if(!latchOf(st, m, MY_LAYER)) return null;
  const r = st.rows.find(x => ym(x.date) === m && x.fixed);
  return r ? r.fixed : null;
};

/* Дверь для простановки ЛЮБОЙ колонки: слой назван параметром, а не именем функции
   (ADR-0149 — механизм один, объект его параметр). Проставляет всегда человек, справочник
   только стережёт порядок и записывает фамилию с датой. */
ST.closeLayer = (month, layer, who, atISO) => {
  const st = ST.state;
  const r = closeLayer(st, month, layer, who, atISO || st.today);
  if(r.ok) log('колонка «'+layer+'» периода '+monLabel(month)+' проставлена: '+who+', '+fmt(r.at)+
    (r.order ? ' · ПОВТОРНО, распоряжение '+r.order : ''));
  return r;
};
/* Единственный акт модуля, у которого есть фамилия (ИС-9), — простановка колонки
   СТАТИСТИКИ. Отдельной кнопки «зафиксировать статистику» нет и календаря своего тоже:
   колонка ставится в ОБЩЕМ справочнике и упирается в незакрытые нижние слои, как всякая
   верхняя (ИС-38, ADR-0204 §3). Фиксация строк — эффект ЭТОГО слоя, а не справочника:
   календарь стережёт порядок и не трогает ничьих чисел. */
ST.closePeriod = (month, who) => {
  const st = ST.state;
  const r = ST.closeLayer(month, MY_LAYER, who, st.today);
  if(!r.ok) return r;
  const n = fixMonth(st, month, who, st.today);
  log('период '+monLabel(month)+' закрыт ('+who+'): зафиксировано строк — '+n+
      (r.order ? ' · повторно, распоряжение '+r.order : ''));
  return {ok:true, month, layer: MY_LAYER, fixed:n, by:who, order: r.order};
};

/* ------------------- ПЕРЕЗАКРЫТИЕ ПЕРИОДА (ИС-50) ------------------- *
   Переспросить · переписать · пометить. Тихой перезаписи закрытого периода не бывает:
   закрытый период уже сдан наружу, и расхождение со сданным обнаруживает ПОЛУЧАТЕЛЬ, а
   не мы (ADR-0204 §4, ADR-0157 §6). Поэтому распоряжение обязательно, сброс идёт сверху
   вниз, повторная простановка — снизу вверх обычным closeLayer, а выпуски метятся.       */

/* Распоряжение — не реквизит формы, а единственное, чем перезакрытие отличается от
   молчаливой правки. Проверка одна на обе двери: снять одну колонку и снять три —
   одинаково решение, а не факт (ИС-50). */
function orderRefusal(month, order, who){
  if(!who) return {ok:false, why:'период '+monLabel(month)+' без актора не открывается: '+
    'закрывает и открывает человек, справочник актором не является (ИС-9, ADR-0204 §6)'};
  if(!order || !order.no) return {ok:false, why:'перезакрытие периода '+monLabel(month)+
    ' без распоряжения не выполняется: период закрыт, числа за него уже ушли наружу, и '+
    'тихая перезапись разошлась бы с тем, что у получателя на руках, — расхождение '+
    'обнаружил бы он, а не мы (ИС-50, ADR-0204 §4, ADR-0157 §6). Номер распоряжения '+
    'ложится в колонку периода и в пометку выпуска'};
  if(!order.basis) return {ok:false, why:'у распоряжения '+order.no+' не названо основание: '+
    'номер без основания не отвечает, ПОЧЕМУ период открыт заново, — а отвечать придётся '+
    'получателю сданного (ИС-50, ADR-0157 §6)'};
  return null;
}

/* Выпуски, собранные на прежних числах, МЕТЯТСЯ, а не пересобираются. Числа мёрзнут один
   раз (ИО-4): паспорт заморожен внутри файла, и файл уже ушёл — пересобрать его задним
   числом значило бы завести второй экземпляр того, что подписано. Переиздавать или нет —
   решение человека (ИО-34); система лишь не даёт сделать вид, что ничего не произошло
   (ADR-0157 §5). Метится только то, где есть СНИМОК: сравнивать больше не с чем (§7). */
function markExports(st, month, order, atISO){
  const marked = [];
  st.exports.forEach(j => {
    if(ym(j.date) !== month || !j.passport) return;
    (j.marks || (j.marks = [])).push({period: month, order: order.no, basis: order.basis,
      at: atISO, why:'числа изменились после сдачи: период '+monLabel(month)+
        ' перезакрыт распоряжением '+order.no});
    marked.push(j.id);
  });
  return marked;
}

/* Дверь на ОДНУ колонку, симметричная ST.closeLayer: слой — параметр, а не имя функции
   (ADR-0149). Названа она по-разному для разных слоёв не в коде, а в журнале: у нижнего
   слоя снятие есть ОТКРЫТИЕ периода, у верхних — переспрос. Классификация и статистика не
   открываются никогда (ADR-0204 §4), и журнал обязан это произносить, иначе через год
   «сняли защёлку классификации» прочтут как «открыли период классификации». */
ST.openLayer = (month, layer, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const r = openLayer(st, month, layer);
  if(r.ok) log((r.opened
      ? 'период '+monLabel(month)+' ОТКРЫТ по слою «'+layer+'»'
      : 'снята защёлка «'+layer+'» периода '+monLabel(month)+
        ': слой переспросит и защёлкнется заново — верхние слои не открываются (ADR-0204 §4)')+
    ' · распоряжение '+order.no+' ('+order.basis+'), '+who);
  return r;
};

/* Все три шага ИС-50 разом, и ни одного лишнего. Сброс идёт ТОЙ ЖЕ дверью, что и поштучный,
   — обойди её перезакрытие, каскад снова стал бы процедурой в чьём-то коде (ADR-0204,
   отвергнутое). Повторная простановка здесь НЕ делается: она идёт снизу вверх обычным
   closeLayer, каждым слоем со своей фамилией и своей датой. Иначе перезакрытие оказалось бы
   одним нажатием, а «переспросить» — словом: переспрашивает не эта функция, а люди. */
ST.reopenPeriod = (month, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+
    ' в справочнике нет: перезакрывать нечего (ADR-0204, границы)'};
  const latched = LAYERS.filter(L => row.latches[L]);
  if(!latched.length) return {ok:false, why:'период '+monLabel(month)+
    ' не закрыт ни одним слоем — он и так открыт: перезакрытие снимает защёлки, а снимать нечего'};
  const at = st.today;
  const dropped = [];
  for(let i = LAYERS.length - 1; i >= 0; i--){
    const r = openLayer(st, month, LAYERS[i]);
    if(r.ok) dropped.push(LAYERS[i]);
  }
  /* Расфиксировать строки — эффект СВОЕГО слоя, а не справочника: календарь стережёт
     порядок и ничьих чисел не трогает (ADR-0204 §6). Ровно так же, как ST.closePeriod
     фиксирует их ПОСЛЕ простановки своей колонки, а не вместо неё. */
  const unfixed = dropped.indexOf(MY_LAYER) >= 0 ? unfixMonth(st, month) : 0;
  const marked = markExports(st, month, order, at);
  /* Распоряжение живёт в СТРОКЕ периода: простановка колонок произойдёт другим действием,
     позже и другими людьми, а номер обязан доехать до каждой колонки (ADR-0204 §1). */
  (row.reopens || (row.reopens = [])).push({order: order.no, basis: order.basis, by: who,
    at, dropped: dropped.slice(), unfixed, marked: marked.slice()});
  const reasked = dropped.filter(L => L !== BASE_LAYER);
  log('период '+monLabel(month)+' перезакрыт по распоряжению '+order.no+' ('+order.basis+'), '+
    who+': открыт слой «'+BASE_LAYER+'»'+
    (reasked.length ? '; снята защёлка — «'+reasked.join('», «')+
      '» (переспрашивают и защёлкиваются заново, не открываются)' : '')+
    '; расфиксировано строк — '+unfixed+
    '; помечено выпусков — '+(marked.length ? marked.join(', ') : 'нет'));
  return {ok:true, month, order: order.no, basis: order.basis, by: who, at,
    opened: BASE_LAYER, reasked, dropped, unfixed, marked, next: BASE_LAYER};
};

/* --------------------------- ПРОГОН --------------------------------- */
ST.run = (dateISO, opts) => {
  const st = ST.state; opts = opts || {};
  if(dateISO > st.today) return {ok:false, why:'прогон на будущую дату не запускается'};
  if(ST.isClosed(dateISO)) return {ok:false, why:'период '+monLabel(ym(dateISO))+
    ' зафиксирован: строки не перезаписываются ни при каких правах (ИС-8). Открытие закрытого '+
    'периода — общий порядок (ADR-0089) и идёт распоряжением: сброс колонок сверху вниз, '+
    'повторная простановка снизу вверх, выпуски метятся — ST.reopenPeriod (ИС-50, ADR-0204 §4)'};
  if(opts.manual){
    if(!ST.canAdmin()) return {ok:false, why:'внеплановый пересчёт запускает администратор статистики'};
    if(!opts.reason) return {ok:false, why:'внеплановый пересчёт без причины не запускается: журнал срезов — часть контракта'};
  }
  const kind = opts.manual ? 'внеплановый' : 'плановый';
  const written = doRun(st, dateISO, kind, opts.manual ? (opts.actor || st.role) : null, opts.reason || null);
  log((opts.manual ? 'внеплановый пересчёт' : 'прогон')+' за '+fmt(dateISO)+': строк — '+written);
  return {ok:true, date: dateISO, written, kind};
};
ST.skip = (dateISO, reason) => {
  const st = ST.state;
  if(!reason) return {ok:false, why:'пропуск без причины не записывается: дата просто отсутствует, и это надо объяснить (ADR-0148 §6)'};
  st.runs.push({date: dateISO, kind:'пропуск', at: st.today, actor:'планировщик', reason, written:0});
  log('пропуск прогона за '+fmt(dateISO)+': '+reason);
  return {ok:true};
};
/* Правки строки нет и не будет: её существование уничтожило бы смысл датированного
   среза (ИС-2). Отказ назван вслух, а не спрятан отсутствием кнопки. */
ST.tryEditRow = () => ({ok:false, why:'строку среза пишет только прогон: правки строк в модуле нет (ИС-2)'});

/* ===================== ВЫБОРКА, ВИДИМОСТЬ, ПАСПОРТ ================== */
const uniq = a => a.filter((x,i) => a.indexOf(x) === i);
function rowsAt(st, objId, dateISO){ return st.rows.filter(r => r.obj === objId && r.date === dateISO); }
/* Даты, на которые объект СЧИТАЛСЯ, берёт журнал прогонов, а не наличие строк: дата,
   на которую ещё никто не родился, иначе читалась бы как «прогона не было» — и пустой
   ответ молча подменился бы вчерашним (ИС-12, ИС-19, ИС-33). */
function datesOf(st, objId){
  return uniq(st.runs.filter(r => (r.parts || []).some(p => p.obj === objId)).map(r => r.date)).sort();
}

/* ИС-12: дата ВНУТРИ истории, на которую строк нет, не подменяется молча — отдаётся
   ближайшая предыдущая, и её возраст называется в паспорте. Дыра в прошлом окончательна:
   прогона за 19.08 не будет уже никогда, и лучшего ответа, чем 18.08, не существует. */
function resolveAsOf(st, objId, requested){
  const ds = datesOf(st, objId).filter(d => d <= requested);
  if(!ds.length) return null;
  const asOf = ds[ds.length-1];
  return {asOf, age: daysBetween(asOf, requested), substituted: asOf !== requested};
}
ST.resolveAsOf = requested => resolveAsOf(ST.state, ST.state.q.obj, requested);

/* ИС-36: спрашивается дата ПРОГОНА, а не «сегодня». Разница с ИС-12 не в вежливости, а в
   том, чем кончится ожидание: пропуск в прошлом не заполнится никогда, а сегодняшних
   строк ещё нет — они будут ночью. Подставить в хвосте ближайшую предыдущую значит
   ответить не на тот вопрос: тот же вопрос с теми же параметрами завтра даст другое
   число, и первое окажется не неверным, а не о том — а поймать это нечем, потому что
   оба ответа честны. «Как сейчас» — вопрос не к статистике: на него отвечает реестр
   владельца (§8.4), у которого множество живое, а не написанное ночью. */
function askDates(st, objId){ return datesOf(st, objId); }
ST.askDates = objId => askDates(ST.state, objId || ST.state.q.obj);
function dateGate(st, objId, requested){
  const o = OBJ(objId);
  const ds = askDates(st, objId);
  if(!ds.length) return 'прогон ни разу не писал строк объекта «'+(o ? o.name : objId)+
    '»: спрашивать нечего (ИС-36)';
  const last = ds[ds.length - 1];
  if(requested > last){
    /* Пропуск за спрошенную дату — событие журнала, и отказ его называет: иначе
       «прогона не было» читается как поломка модуля, а не как записанная ночь. */
    const sk = st.runs.filter(r => r.kind === 'пропуск' && r.date > last && r.date <= requested);
    return 'на '+fmt(requested)+' прогона не было'+
      (sk.length ? ' · '+sk.map(g => fmt(g.date)+' — пропуск: '+g.reason).join(' · ') : '')+
      ': последний прогон '+fmt(last)+'. Спрашивается дата прогона, а не «сегодня» — '+
      '«как сейчас» отвечает реестр «'+(o ? o.owner : '—')+'», а не срез (ИС-36)';
  }
  return null;
}
ST.dateGate = (requested, objId) => dateGate(ST.state, objId || ST.state.q.obj, requested);

/* ИС-13: роль режет СТРОКИ, а не итог. Обратный порядок дал бы закрытую сумму
   вычитанием двух доступных срезов — утечку за два запроса.
   ИС-37: КАКИМ разрезом резать — берётся из записи объекта. Объект, чей охват объявлен
   отказом, сюда не доходит: его отбивают ворота scopeGate до счёта (СС-135). */
function applyScope(rows, objId){
  const s = ST.scopeOf(objId || (rows[0] && rows[0].obj));
  if(!s || s.denied) return rows;
  return rows.filter(r => r.dims[s.dim] === s.value);
}
/* Ворота охвата — рядом с воротами даты и по той же причине (СС-130): стоят в ОБЩЕЙ
   проверке вопроса, и все двери получают их даром. Отказ называет причину и дорогу:
   отказ без дороги — половина ответа (§8.4). */
function scopeGate(objId){
  const s = ST.scopeOf(objId);
  if(!s || !s.denied) return null;
  const o = OBJ(objId);
  return 'объект «'+(o ? o.name : objId)+'» под ролью «'+ST.state.role+'» не спрашивается: '+
    s.denied.why+'. Показать его целиком нельзя — это выдало бы объём чужой работы даже '+
    'итогом (§9), а показать пусто значит соврать. '+s.denied.road+' (ИС-37, ADR-0203)';
}
ST.scopeGate = scopeGate;
/* ==================== ФИЛЬТР ВОПРОСА (ADR-0180) ====================== *
   Форма одна: ДНФ БЕЗ СКОБОК. Фильтр — наборы через ИЛИ, набор — сравнения через И,
   вложенности нет. Скобки потребовали бы разбора выражения, а вопрос статистики
   выражением не является: его печатают в паспорт и сверяют глазами.
   Операнд — разрез или МЕРА СТРОКИ среза; правая часть ВСЕГДА константа. Показатель
   против показателя — это показатель реестра, а не фильтр (ADR-0180 §3).
   Порядок применения: роль → фильтр → группировка → порог (ИС-13, ADR-0178 §3).      */
const FOPS = {
  'перечисление': ['=','≠','∈','∉'],
  'число':        ['>','≥','<','≤','=','≠'],
  'корзина':      ['=','≠','∈','∉','в диапазоне'],

   наличие корзин (значение спрашивается корзиной — ИС-23), у меры — поле type. */
function operandOf(c){
  if(!c || !c.id) return null;
  if(c.kind === 'ind'){
    const I = IND(c.id);
    if(!I) return null;
    return {kind:'ind', id:c.id, name:I.name, ind:I, money: !!I.money,
      vtype: (I.type === 'сумма' || I.type === 'число') ? 'число'

ST.operandOf = operandOf;
ST.filterOps = c => FOPS[(operandOf(c) || {}).vtype] || [];
function bucketFor(c, o){ return (c && c.bucket) || (o.dim.buckets ? o.dim.buckets[0] : null); }
/* Список ступеней строится из тех же границ, что и bucketOf: второй записи ступеней
   не заводится — иначе «31–90 дн.» в фильтре и в группировке разъехались бы. */
function stepLabels(d){
  const e = d.edges, uu = unitOf(d), u = uu ? ' '+uu : '', out = [(e[0]-1)+u];
  for(let i = 0; i < e.length - 1; i++) out.push(e[i]+'–'+(e[i+1]-1)+u);
  out.push(e[e.length-1]+'+'+u);

}
/* Порядок корзин — свойство корзины, а не алфавита: «апрель 2026» < «май 2026», но
   лексикографически наоборот. Ключ порядка выводится ИЗ ЯРЛЫКА, поэтому «в диапазоне»
   работает и над строкой среза, и над записью реестра владельца. */
function bucketOrd(d, label, bucket){
  if(label == null) return null;
  const t = String(label);
  if(d.edges){ const i = stepLabels(d).indexOf(t); return i < 0 ? null : String(i).padStart(2,'0'); }
  if(bucket === 'год')     return /^\d{4}$/.test(t) ? t : null;
  if(bucket === 'квартал'){ const m = t.match(/^(\d{4}) · (\S+) кв\.$/);
    return m && QN.indexOf(m[2]) >= 0 ? m[1]+'-'+(QN.indexOf(m[2])+1) : null; }
  if(bucket === 'месяц'){ const m = t.match(/^(\S+) (\d{4})$/); if(!m) return null;
    const k = Object.keys(MON).find(x => MON[x] === m[1]); return k ? m[2]+'-'+k : null; }
  return t;
}
ST.bucketOrd = bucketOrd;
/* Значение уровневого разреза — ПУТЬ, и константа сравнивается с ним по префиксу до
   границы уровня: «Иссык-Кульская» ловит «Иссык-Кульская / Тюпский», но не соседнюю
   область с похожим началом имени. */
function eqEnum(s, k, prefix){
  const t = String(k);
  return s === t || (prefix && s.indexOf(t+' / ') === 0);
}
function matchEnum(c, s, prefix){
  if(c.op === '=') return eqEnum(s, c.value, prefix);
  if(c.op === '≠') return !eqEnum(s, c.value, prefix);
  const hit = (c.values || []).some(k => eqEnum(s, k, prefix));
  return c.op === '∈' ? hit : !hit;
}
function matchNum(c, v){
  const k = Number(c.value);
  if(!isFinite(k) || v == null) return false;
  return c.op === '>' ? v > k : c.op === '≥' ? v >= k : c.op === '<' ? v < k
       : c.op === '≤' ? v <= k : c.op === '=' ? v === k : c.op === '≠' ? v !== k : false;
}
function matchBool(c, v){

}
function matchBucket(o, c, lab){
  if(lab == null) return false;
  if(c.op !== 'в диапазоне') return matchEnum(c, String(lab), false);
  const bk = bucketFor(c, o);
  const a = bucketOrd(o.dim, c.from, bk), b = bucketOrd(o.dim, c.to, bk), x = bucketOrd(o.dim, lab, bk);
  if(a == null || b == null || x == null) return false;
  const lo = a <= b ? a : b, hi = a <= b ? b : a;
  return x >= lo && x <= hi;
