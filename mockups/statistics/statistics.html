<!--
  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Статистика» (TO-BE).
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Прогон собирает строки на дату, закрытие учётного
  периода их фиксирует, три шва отвечают на три вопроса и каждый ответ несёт паспорт,
  детализация сходится со списком реестра, роль сужает множество ДО группировки. Ничего из
  этого не зашито кодом: все десять объектов собраны ИЗ ДАННЫХ, и в сборщике строк
  (buildRow/runFor/readDim/readInd) слова «кредит» нет ни одного.

  Волна 1 (21.08.2026) вывела модель на бумаге: ADR-0145…ADR-0152 плюс канон логики.
  Волна 2 — этот файл: та же модель, доведённая до исполняемого эталона поведения.
  Волна 3 (26.08.2026) добрала шесть механизмов, которых модель требовала, а макет не имел:
  восемь объектов реестра · дерево уровней у разреза · корзины дат · обратный индекс ссылок
  потребителей · краткая форма паспорта · двоичный отказ statRows с дорогой на выгрузку
  (ADR-0176…ADR-0179) и попутно закрыла четыре бывших дефекта макета: даты ряда стали частью
  вопроса (шаг и число точек), фильтр задаётся конструктором со значениями ИЗ СТРОК среза,
  разрез заводится формой с корзинами и владельцем уровней, прогон пишет поимённый состав
  (СС-Д1, СС-Д2, СС-Д3, СС-Д6).
  Волна 5 (27.08.2026) упразднила слово «мера»: единственное имя измеряющей записи —
  показатель (СС-57); поведение не тронуто, поле строки среза meas → inds.
  Волна 6 (27.08.2026) довела объект «Кредит» до ПОЛНОГО состава показателей по правилу
  ADR-0183: показателем становится величина, которую спрашивают о МНОЖЕСТВЕ, — 28 строчных
  и 33 агрегата (было 6 и 7), реестр модуля 37 → 85 записей, прочитаны все пять швов ядра.
  Ступени срока неплатежа заведены КОРЗИНОЙ разреза, а не семью показателями (ADR-0176 §3),
  и оба тождества ТЗ 18 §5.1 — остаток = просрочено + срочно, свод = сумма семи статей —
  держатся в зеркале ядра по построению, а не подгонкой демо-данных (проверка #64).
  Волна 7 (27.08.2026) тем же правилом довела объект «Заёмщик»: 20 строчных показателей и
  16 агрегатов вместо трёх и двух, 13 разрезов вместо шести, реестр модуля 85 → 116 записей.
  Источник у всех — ПОРТФЕЛЬНЫЙ шов ядра (ADR-0174, ADR-0184): шов одного кредита
  показателем заёмщика быть не может, иначе свод считался бы второй раз и вне ядра — форма
  дефекта E2E-09 (ИС-28). Клетка суммы теперь несёт СОСТАВ ПО ВАЛЮТАМ: у договора он из
  одной части, у портфеля — из скольких угодно (проверка #71). Сказанное здесь «и сомового
  эквивалента в строке нет по-прежнему (ИС-15)» ОТМЕНЕНО волной 17 ч.6: сомовая величина
  лежит в строке — но не приложением к валютной клетке, а СВОЕЙ колонкой под именем своей
  записи реестра (ИС-44, ADR-0214 §2). Подгруппа платёжеспособности заведена ОДНИМ разрезом с
  двумя уровнями (группа = первая цифра подгруппы, ADR-0185 §1), свёрнутая величина носит
  своё имя — «Худшая категория», а не «Категория риска» (§2), агрегат стал обязательным у
  числа и суммы и запрещённым у перечисления и булева (§3, ИС-29, проверка #73). Счёт
  объектов другого уровня — вопрос ТОМУ объекту, а не функция `count distinct` здесь
  (ADR-0186, ИС-30, проверка #76). Ведущий куратор ВЫЧИСЛЯЕТСЯ швом кураторства, хранимого
  «ведущего подразделения» не бывает вовсе (ТЗ 16 §3.2, §11, проверка #75).
  Волна 8 (27.08.2026) довела объект «Залог»: 11 строчных показателей и 12 агрегатов
  вместо двух и трёх, 11 разрезов вместо шести. Единственный шовный показатель предмета
  читал `calcDebt` — шов ОДНОГО кредита, — а предмет обеспечивает много кредитов долями:
  требование либо задваивалось по каждому предмету, либо отвечало об одном кредите из
  нескольких. Форма дефекта та же, что ИС-28 запретила заёмщику, но владелец у вопроса
  ДРУГОЙ: множество выбирает junction ОТНЕСЕНИЕ_ЗАЛОГА, долю в нём знает только залог —
  и потому портфельный шов здесь залоговый, а не ядра (ADR-0190 §1, ИС-31). Обеспечиваемые
  требования взвешены долей предмета в обеспечении кредита, и потому их сумма по предметам
  сходится с суммой под риском обеспеченных кредитов, а не удваивает её (проверка #79).
  Обеспеченность заведена у КРЕДИТА и двумя показателями — обеспечение и сумма под риском
  (ADR-0011: остаток ОД плюс неосвоенная часть); самого индекса в строке нет, отношение
  считается при чтении (ИС-32, проверка #82). Порог — функция состава: 120 % ликвидному,
  150 % и доля ликвида ≥ 80 % движимому неликвидному (Р-1, разрезы «состояние
  обеспеченности» и «требуемый порог»). Периодичность обследования — матрица «группа
  платёжеспособности × движимое/недвижимое» (Р-3), банкрот — по договору со
  спецадминистратором. У предмета своя валюта оценки (ADR-0009) и своя дата принятия:
  «валютой договора» и «датой залогового договора» вещь не режется — после перезалога
  договоров у неё много (ИС-21, проверка #81).
  Волна 9 (28.08.2026) закрыла дефект, доживший до восьмой волны: прогон обходил множество
  целиком, не спрашивая, СУЩЕСТВОВАЛ ли объект на дату. Срез от 31 мая показывал все 14
  погашений, датированных июнем–августом, «платежей за июль» разностью составов выходило
  14 − 14 = ноль, а сверка с реестром владельца сходилась — на неверном числе с обеих
  сторон. Рождение стало ОБЪЯВЛЕННЫМ реквизитом объекта (`born`), читается тем же
  читателем, что разрез и показатель-поле, и объект без него не заводится вовсе; смерть при
  этом — состояние, а не пропажа строки (ADR-0197, ИС-33, проверки #86–#90).
  Волна 10 (28.08.2026) развела дело и требование. Дело несло фазу взыскания, сумму
  требований и «дней в фазе» — три многозначные на дату величины: у дела фаза не одна,
  потому что иск к заёмщику подан, а к поручителю ещё нет. Много значений на дату означает
  не разрез, а нижележащий объект (ИС-21) — фаза и сумма переехали ТРЕБОВАНИЮ, рабочей
  единице модуля (ADR-0002, ADR-0022), а дело осталось тонким отрезком работы с расходами
  по взысканию — единственной денежной статьёй, которой оно владеет (ADR-0004, ADR-0198).
  Требований на один кредит бывает несколько — заёмщик, поручитель, залогодатель, — и они
  обслуживаются в РАЗНЫХ филиалах. Строка каждого честно показывает полную сумму: её и
  правда взыскивают с этого лица. Поэтому у показателя объявлен ДЕДУП-КЛЮЧ «Кредит
  требования», схлопывание идёт перед агрегатом на каждом узле дерева, и сумма филиалов
  итогу НЕ РАВНА — 14 713 601,96 против 8 019 786,56, — а паспорт ключ называет поимённо
  (ADR-0199, ИС-34, проверки #91–#93). Представителем ключа берётся наибольшая величина:
  солидарные требования — проекции одного долга (ADR-0004), и складывать часть с целым
  значит посчитать часть дважды. Удельная величина («в среднем на куратора») показателем
  не заводится вовсе: это пара «срез + счёт», и знаменатель, снятый со среза, занижен
  систематически — у кого ноль строк, тот в срез не попадает (ADR-0200, ИС-35, #97–#98).
  Попутно закрыт СС-Д9: платёж НАЗЫВАЕТ свой кредит, «погашено всего» стало суммой
  платежей, и приращение за период равно их сумме до копейки на каждом договоре — два ряда
  одних денег стали одним (проверка #99).
  Волна 11, часть первая (28.08.2026) сняла последнее расхождение макета с моделью — СС-Д8.
  Фильтр был ОДНОУСЛОВНЫМ: один разрез, одно значение, — а `ADR-0180` объявил его ДНФ без
  скобок: наборы через ИЛИ, сравнения внутри набора через И. «Валютные кредиты с просрочкой
  свыше 100 дней ЛИБО все чуйские» одним условием не спрашивается вовсе, и прототип отвечал
  на вопрос проще заданного. Теперь операнд — разрез ИЛИ мера СТРОКИ (агрегат отбит: у него
  нет значения в строке), правая часть всегда КОНСТАНТА (показатель против показателя — это
  показатель реестра, §3), оператор берётся от ТИПА значения, а у разреза с корзинами
  правая часть — корзина, не сырая дата. Денежная константа несёт свою валюту и меряется
  частью того же состава, без пересчёта: курса отбора нет, и он не курс показа
  (ADR-0184 §3, СС-Д4). Три отказа §8 — пустой набор, «∈» с пустым списком, «∈» во весь
  домен — все про сравнение, которое ничего не сужает, но в паспорте выглядело бы фильтром.
  Проверка формы живёт в checkQuery и достаётся всем трём швам даром, проверка домена — за
  ролью, поэтому «весь домен» у аналитика и у администратора решается по-разному. Один и
  тот же набор читают срез, ряд, строки, период и реестр владельца, а паспорт печатает его
  ЦЕЛИКОМ: «фильтр задан» и «+2 условия» — ответ без вопроса (проверки #100–#110).
  Волна 11, часть вторая (28.08.2026) впервые не дописала мер, а РАЗДЕЛИЛА объект.
  «Погашение» несло сумму поступления, возврат плательщику и нераспределённый остаток —
  величины про МНОЖЕСТВО платежей, а не про платёж. На сводном поступлении (ПП-2026/0733:
  одни деньги на два кредита в двух подразделениях) каждая сложилась бы дважды — та самая
  форма дефекта, которую волна 8 нашла у обеспечения (ИС-28, ИС-31), а многозначное на дату
  поднимает уровень, а не сплющивается в клетку (ИС-21, ADR-0198). Объектов стало десять:
  ПЛАТЁЖ — запись владельца, часть поступления, привязанная к кредиту (ТЗ 14 §2.1), и
  ПОСТУПЛЕНИЕ — деньги, пришедшие одним документом. Платёж разрезан ДВАЖДЫ одной суммой:
  пятью статьями (ADR-0087) и двумя слоями (ADR-0043) — семь именованных клеток шва, а не
  матрица 5×2 (ADR-0183 §2, §3); основной долг своей формулы не имеет, он РАЗНОСТЬ (ИС-1).
  Инвариант поступления — сумма = платежи + возврат + нераспределённое (ТЗ 14 §2.2) — держится
  на каждой из 15 строк. Разрезов «Кредит», «Подразделение», «Куратор» и «Территория» у
  поступления НЕТ: они приходят от кредита, а кредитов у сводного поступления несколько.
  «Невыясненное» заведено ФИЛЬТРОМ по мере строки, а не булевым разрезом (ADR-0185 §1); три
  оси ТЗ 14 §3.1 разведены и читаются из истории; дата платежа НАСЛЕДУЕТСЯ от поступления
  (§7.1). Решения СС-105…СС-111. Открыт СС-Д11: объект без разреза охвата молча пустеет под
  ролью вместо отказа (ИС-24, проверки #111–#120).
  Волна 12 (28.08.2026) взяла три последних ТОНКИХ объекта — тонкий не «маленький», а
  НЕДОСПРОШЕННЫЙ: реестр обещает величину, которой у владельца нет, либо сплющивает в одну
  клетку то, что владелец различает. Правило ADR-0201 дало трём записям три разных ответа.
  «Задание кураторства» СНЯТО — владельца, отдающего множество, у него не нашлось:
  кураторство отказывается от заданий дословно и держит их СОСЕДЯМИ (ТЗ 16 §1.1, §15),
  своего ТЗ и места в очереди у заданий нет, а ФО-20 — одна из пяти форм, спрос на которые
  ещё спрашивается у заказчика (каталог §9 п. 4, письмо 26.08.2026, вопрос 2). Заводить
  объект под то, чего владелец не отдаёт, значит строить второй источник — это уже решено
  про «Статью долга» (ADR-0183, «Отвергнуто»). Снятие — такая же строка реестра, как
  заведение (ИС-18), и спрос отвечает ОТКАЗОМ, а не пустотой (ИС-24).
  У «Кредитной программы» сняты ОБЕ меры строки: лимита не заводит ни один владелец — это
  заявка владельцу, а не выдуманное поле (ADR-0150 §3), — а освоение принадлежит траншу и
  кредиту (ТЗ 06). «Выдано по программе» собирается СРЕЗОМ КРЕДИТА по новому разрезу
  «Кредитная программа»; полем программы оно было бы вторым источником тех же денег
  (ИС-1, ИС-28). Разреза «Куратор» у программы нет и быть не может: «ответственные
  сотрудники» — поле lookup (multi) (ИС-21). Объект БЕЗ ЕДИНОЙ меры строки законен: правило
  запрещает недобор и набор впрок, а не малый состав — остались девять разрезов и число.
  «Мера взыскания» ДОБРАНА: три оси ТЗ 13 §9.1 были схлопнуты в один «результат», а вид
  результата, стадия исполнения и результат независимы попарно и в обе стороны; доставка и
  состояние (сторно, И-3) читаются из истории; заведён дедуп-ключ «Кредит меры» — в итоге
  долг считается один раз (§12.1), и сужение по состоянию не вычитает свою сумму, а МЕНЯЕТ
  представителя ключа (7 462 000 → 4 002 000). Срок должника течёт от НАПРАВЛЕНИЯ и
  невручением не отменяется (§9.2) — швом measureClock, потому что число дней растёт само
  (ADR-0183 §4). Десять разрезов и шесть показателей вместо шести и двух.
  Попутно закрыт СС-Д13: max/min/avg по набору, где выбирать не из чего, отвечали НУЛЁМ —
  «наибольший срок с направления 0 дн.» читается как «сегодня направили», хотя направления
  не было вовсе. Выбор из пустого — прочерк, а не ноль (ИС-19); сумма и количество нулём
  остаются. И заведён-закрыт СС-Д14: волна сама поставила «Дату начала действия программы»
  под уже занятым идентификатором «Дата платежа» — поиск отдавал первую запись, вторая
  становилась недостижимой. Форма заведения занятый идентификатор отбивала всегда (#46), а
  ЗАГРУЗКУ реестра не сторожил никто; теперь сторожит. Реестр модуля 175 → 171 запись,
  объектов 10 → 9 (проверки #121–#127).
  Волна 13 (29.08.2026) завела ДЕСЯТЫЙ объект — «Залоговый договор» — и закрыла тем самым
  единственную дыру, которую реестр носил молча: разрез «Дата залогового договора» (ТЗ #4)
  не принадлежал НИ ОДНОМУ объекту с волны 8, а §10.1 считала параметр исполненным. Сирота
  разреза — не мелочь оформления: спросить по нему было не у кого, то есть параметр ТЗ был
  закрыт на бумаге и открыт в модуле. Сторожит теперь проверка #128: разрез или показатель,
  на который не ссылается ни один объект, валит реестр на ЗАГРУЗКЕ — тот же урок, что дал
  СС-Д14 про занятые идентификаторы. Объект тонкий по составу и полный по спросу (ADR-0183):
  один разрез, одно число, ни одной меры строки — и это законно (ADR-0201 §3), потому что
  суммы по договору залог не отдаёт. Решения СС-119…СС-124, дефект СС-Д15 заведён и закрыт (проверки #6, #128).
  Волна 14 (29.08.2026) отняла у вопроса «сегодня». Список дат был КОНСТАНТОЙ файла — семь
  дат при пяти прогонах, — и умолчанием вопроса стояла сегодняшняя: модуль по умолчанию
  спрашивал дату, на которую не написано ни одной строки, а ИС-12 подставляла последний
  прогон и называла возраст. Возраст назван честно — и ответ всё равно не о том. Дыра в
  прошлом ОКОНЧАТЕЛЬНА: прогона за 19.08 не будет уже никогда, лучшего ответа, чем 18.08,
  не существует, и подстановка там — лучшее, что есть. Хвост — не дыра, а ещё не написанные
  строки: тот же вопрос с теми же параметрами завтра даст другое число, и первое окажется
  не неверным, а не о том. Поймать это нечем — оба ответа честны, и оба несут паспорт.
  Спрашиваемых дат теперь ровно столько, сколько ПРОГОНОВ написали строки объекта (ИС-36,
  ADR-0202); константы дат в файле нет вовсе — список дат вопроса ЕСТЬ журнал прогонов.
  Дата за последним прогоном — отказ, и отказ называет три вещи: последний прогон,
  записанный пропуск за спрошенную дату, если он был, и дорогу — «как сейчас» отвечает
  реестр владельца (§8.4), у которого множество живое, а не написанное ночью. «Сегодня»
  из вопроса не изгнано как день: после своего прогона оно спрашивается наравне со всеми
  (проверки #32, #131). Ворота стоят в checkQuery — их даром получают срез, ряд, строки и
  выгрузка — и отдельно у потока, который checkQuery не зовёт. Журнал у каждого объекта
  свой: смена объекта приводит дату вопроса к его последнему прогону, а не переносит чужую.
  В демо-мир добавлен прогон 20.08 — без него единственная дыра лежала бы в хвосте, и два
  разведённых волной случая было бы не на чем показать. Решения СС-125…СС-131
  (проверки #11, #20, #32, #129–#131).
  Волна 17 ч.3 (30.08.2026) дала разрезу ВОСЬМОЙ реквизит — объект определения (ИС-40,
  ADR-0206). Имя разреза называет признак и молчит о том, ЧЕЙ он: «область» у заёмщика своя
  (регистрация субъекта), у кредита своя (область выдачи), и для человека из Оша, взявшего
  кредит в бишкекском филиале, это РАЗНЫЕ значения. Пока в реестре лежала одна запись
  «Территория», система выбирала трактовку молча — и выбирала разную в разных местах: срез
  кредитов, отфильтрованный «по области», расходился со срезом заёмщиков, расхождение
  выглядело арифметической ошибкой, а было двумя разными фильтрами под одним именем. Это
  хвост §15 п. 4 канона, и закрыт он не подписью в отчёте, а реестром: шесть многообъектных
  признаков разведены на 26 записей с уточнёнными именами («Территория выдачи кредита» ·
  «Территория заёмщика» · «Территория предмета залога» и так далее), разрезов стало 61 → 81.
  Справочник значений при этом ОДИН: совпадают владелец, ref и уровни — дублируется запись
  реестра, а не иерархия (ADR-0206 §5, ADR-0176 §7). Одноимённых записей в реестре нет ни
  при каких объектах, и правило одно на обе породы (§6): показатели «Расходы по взысканию,
  итого» кредита и дела, «Ближайший платёж — минимум дней» кредита и заёмщика, а также
  «Обеспечиваемые требования» залога и поручительства получили свои имена. Сложение по
  разрезу законно только внутри его объекта, а сверка срезов по разнообъектным разрезам —
  операция ЗАПРЕЩЁННАЯ, а не подозрительная: чужой разрез отбивают все пять дверей и в
  группировке, и в фильтре, и отказ называет свою запись на спрошенном объекте. Сторож #70
  сохранён и усилен: тождество сумм по «кредиту» и по «заёмщику» держится, ПОКА фильтры
  применены к одному объекту, и теперь это видно из имён, а не выясняется из расхождения
  чисел. Проверки #148–#154; на экране «Реестры» объект определения стоит колонкой.
  Волна 17 ч.4 (30.08.2026) собрала запись реестра ЦЕЛИКОМ (ИС-43, ADR-0209): реестр ОДИН,
  запись объявляет свою ПОРОДУ — показатель или разрез, — и порода определяет набор
  обязательных реквизитов. До этой волны реквизиты прирастали поштучно и в разных решениях
  (источник — ADR-0150, свод — ADR-0174, уровни и корзины — ADR-0176, дедуп — ADR-0199,
  исчислимость — ADR-0159, объект определения — ADR-0206), и ни одно не сказало, ЧЕМ запись
  является целиком. Обязательность была свойством ДВЕРИ, а не породы: `addDim` успел спросить
  объект определения, `addIndicator` — нет, и жила эта разница до дня, когда её заметили.
  Теперь кладовая одна (`st.registry`, 369 записей: 285 показателей и 84 разреза — из
  показателей 171 своя запись и 114 сомовых близнецов, заведённых волной 17 ч.6),
  `IND`/`DIM` — чтение ОДНОГО хранилища с
  проверкой объявленной породы, а `st.indicators`/`st.dims` ничего не хранят: это виды.
  Проверка одна на обе породы, список реквизитов закрыт с обеих сторон — реквизит чужой
  породы отбивается по имени (единица у признака, иерархия у числа), формулы нет НИ У ОДНОЙ
  породы, и корзина исключением не является. «Дней просрочки» и «Срок неплатежа» — две
  записи об одной величине: разрез называет показатель своим ОСНОВАНИЕМ и держит границы в
  реестре, а не в настройке отчёта. Переезд породы стал рядовой правкой реквизита: запись та
  же, идентификатор тот же, история дописывается, реквизиты прежней породы снимаются
  поимённо. Запись не удаляется, а ПРЕКРАЩАЕТ ДЕЙСТВИЕ с даты, потому что схему витрины
  порождает реестр: колонка на запись, только `ADD COLUMN`, только nullable, всегда в
  журнал, обратного хода нет. Экран «Реестры» стал ОДНОЙ таблицей с колонкой породы и ОДНОЙ
  формой, вторая половина которой раскрывается по выбранной породе. Проверки #155–#164.
  Волна 17 ч.5 (30.08.2026) закрыла вопрос, что вообще годится в колонку (ИС-47, ADR-0220):
  запись объявляет, СКОЛЬКО ДАТ СРЕЗА нужно, чтобы величину вычислить, и вопрос этот
  проверяется до заведения. Одна дата — законная колонка; две и больше — отказ всегда,
  потому что строка принадлежит одной дате, а двухдатное число не принадлежит ни одной из
  них и вдобавок зависело бы от СОСЕДНЕЙ строки, которой при разрежённом хранении может не
  быть (ADR-0147, ADR-0215). До этой волны многодатность угадывалась списком подстрок в
  имени — он пропускал «темп роста портфеля» и «миграцию из категории в категорию» и отверг
  бы законную величину, случайно назвавшуюся похоже. Список остался, но честно назван тем,
  чем был: запретом ПРЕДСТАВЛЕНИЯ (доля и «процент от» считаются при показе на одной дате,
  ИС-15), а «дельта» и «прирост» из него ушли — они отвергаются по числу дат. Третьим в том
  списке стоял «сомовый эквивалент» — волна 17 ч.6 ОТМЕНИЛА это: он больше не представление
  вовсе, а запись реестра, и заявка «Сомовый эквивалент …» заводится наравне со всеми
  (ИС-44, ADR-0214 §2). В запрете осталось две причины из трёх.
  Отказ называет АДРЕС: одна пара дат внутри выпуска — графа изменения отчёта (ADR-0218),
  ряд по многим датам — обзор анализа (ADR-0155). Породой правило не обходится: третьей
  породы нет, а переезд породы проверяется тем же валидатором. Проверки #165–#169.
  Волна 17 ч.6 (30.08.2026) развела ДВА показателя, которые прежде считались одним с
  оговоркой (ИС-44, ADR-0214): сумма в валюте договора и сумма в сомах — разные величины с
  разными именами, и сомовая — полноправная запись реестра, материализованная колонкой
  замороженной строки. До этой волны сомовая сторона жила ПОКАЗОМ: `ST.somOf` умножал
  клетку на курс при рисовании, свод разновалютного множества молча складывал части через
  курс, и оба числа выходили под ОДНИМ именем — «Сумма остатка ОД» значила то валюту
  договора, то сом, смотря кто спросил. Из-за этого сомовую величину нельзя было ни назвать
  в отчёте, ни поставить в состав, ни прекратить датой, ни сверить: курс, по которому она
  получена, нигде рядом не лежал. Теперь пересчёт живёт в ОДНОМ месте — `CORE.toSom` в
  ядре-зеркале, — правило округления объявлено там же и ровно один раз (`CORE.SOM_ROUNDING`,
  ADR-0214 §6), а САМА ЗАПИСЬ реестра на него ССЫЛАЕТСЯ реквизитом `round`: денежная
  величина, у которой не спрошено, по какому правилу она округляется, не заводится вовсе,
  а неизвестное правило отбивается перечислением объявленных. Ядро округляет по названному
  в записи правилу и точность берёт из объявления, а не из литерала; свод, поток и
  расхождение правило НАСЛЕДУЮТ от показателя-основания, как наследуют тип и единицу, и
  своего не заводят. Не будучи закреплённым за записью, правило и оказывалось в трёх местах
  разным — копеечная разница двух отчётов об одном и том же, разбирать которую было нечем.
  Денежный ответ ядра несёт обе стороны сразу. Витрина сомовое число НЕ
  СЧИТАЕТ, она его ПИШЕТ. Близнец порождается механически и в одном месте — на сборке
  реестра и в двери заведения (`declareTwin`): те же проверки, тот же `normRec`, та же
  дверь в схему витрины; близнец кладётся сразу за своей записью и в реестр, и в состав
  объекта, а над денежным агрегатом, чей `over` получил близнеца, встаёт близнец над
  близнецом. Валютная запись при этом ОБЪЯВЛЯЕТ свою неаддитивность реквизитом:
  `roll:'формульный'` плюс обязательный `rollBy` — разрез валюты СВОЕГО объекта, — и свод
  такой записи по разновалютному множеству не число, а отказ, называющий и причину, и
  АДРЕС: сомовую запись, аддитивную всегда. По одновалютному множеству та же запись
  по-прежнему отвечает числом в его валюте. Курс и дата курса лежат в строке рядом с
  сомовым числом, и сторож перемножает их, не выходя из строки. Реестр вырос 252 → 369
  записей; трём объектам (дело, требование, мера взыскания) заведён СВОЙ разрез валюты —
  без него назвать разрез свода было нечем. Пара входит в реестр ЦЕЛИКОМ: не прошедшая
  проверку сомовая сторона отбивает и валютную — половины пары в реестре не остаётся.
  Проверки #170–#183; заодно по факту пересчитаны #1 и #120 и обновлена обстановка
  у #23–#25, #38, #40, #41, #65, #67, #69, #78, #93, #96, #111, #119, #126.
  Смоук: `node scripts/inspect/statistics-check.mjs`.

  ИС-16 Сумма отдаётся в валюте договора, с курсом и датой курса (ADR-0135 §7).
  ИС-17 Потоки хранятся нарастающим итогом, период — разность двух строк.
  ИС-18 Объект статистики — запись реестра, а не ветка кода (ADR-0149).
  ИС-19 Заёмщик — свой объект со своей строкой, а не свёртка кредитов.
  ИС-20 Статистика не запирает учётный период (ADR-0113).
  ИС-21 Если значений разреза у объекта много — это не разрез, а нижележащий объект
        (ADR-0179 §1). Разрез отвечает на «в каком множестве строка», и строка в двух
        множествах сразу не бывает.
  ИС-22 Усечения и страниц у ответа нет: список отдаётся целиком либо не отдаётся вовсе;
        уровень иерархии спрашивается в границах объявленных (ADR-0178 §1, ADR-0176 §4).
  ИС-23 Свободной корзины не бывает: набор объявлен записью разреза, новая заводится
        строкой реестра, а не приходит в запросе (ADR-0176 §2).
  ИС-24 Форм паспорта ровно две — полная и краткая, и обе объявляет производитель ответа.
  ИС-25 Вывод показателя не запрещается чужой публикацией, но обязан назвать поимённо,
        что сломается (ADR-0177 §4).
  ИС-26 Дата на срезе выражается числом дней от даты среза: показателя типа «дата» не
        бывает — среднюю дату сложить не из чего (ADR-0183 §4).
  ИС-27 Показателем именуется клетка шва, которую спрашивают о множестве; матрица величин
        целиком — сечение, а не набор показателей (ADR-0183 §1–§2).
  ИС-28 Показатель заёмщика берётся ПОРТФЕЛЬНЫМ швом; шов одного кредита показателем
        заёмщика не бывает (ADR-0184) — иначе свод считается второй раз и вне ядра.
  ИС-29 У числа и суммы агрегат обязателен, у перечисления и булева запрещён (ADR-0185 §3).
  ИС-30 Счёт объектов другого уровня — вопрос ТОМУ объекту, а не функция здесь (ADR-0186).
  ИС-31 Портфельный шов принадлежит владельцу МНОЖЕСТВА: если множество выбирает чужой
        junction, шов держит его владелец, а не расчётное ядро (ADR-0190 §1).
  ИС-32 Отношение двух величин показателем не бывает: в срез входят числитель и
        знаменатель, отношение считается при чтении (ADR-0190 §3, ИС-15).
  ИС-33 Строки нет до рождения объекта: небытие — не пустота и не ноль. Рождение объявлено
        реквизитом объекта и читается тем же читателем, что разрез; объект без него не
        заводится. Смерть — состояние, а не исчезновение строки (ADR-0197).
  ИС-34 У показателя, чьи строки пересекаются по ЧУЖОМУ ключу, объявлен дедуп-ключ —
        разрез этого же объекта, по которому величина считается один раз. Схлопывание идёт
        перед агрегатом и на каждом узле дерева; представителем берётся наибольшая
        величина. Сумма строк итогу не равна и не должна, а паспорт ключ НАЗЫВАЕТ
        (ADR-0199, оговорка к ИС-3 и ИС-14).
  ИС-35 Удельная величина показателем не бывает — это пара «срез + счёт»: числитель есть
        счёт своих строк в разрезе, знаменатель — счёт объектов другого уровня и
        спрашивается у ТОГО объекта. Знаменатель, снятый со среза, занижен систематически:
        у кого ноль строк, тот в срез не попадает вовсе (ADR-0200, композиция ИС-32 и ИС-30).
  ИС-36 Спрашивается дата ПРОГОНА: спрашиваемых дат ровно столько, сколько прогонов
        написали строки ЭТОГО объекта, и умолчанием стоит последний из них, а не
        сегодняшний день. Дата за последним прогоном — включая «сегодня» — отказ, и он
        называет последний прогон, записанный пропуск и реестр владельца, у которого
        спрашивается «как сейчас» (ADR-0202, §8.4). Внутри истории действует ИС-12.
  ИС-40 У разреза есть обязательный реквизит — ОБЪЕКТ ОПРЕДЕЛЕНИЯ, и имя разреза
        уточняется этим объектом. Величины, не складывающиеся между собой, не носят
        одного имени: не «область», а «область заёмщика» и «область выдачи кредита» —
        две записи реестра с разными объектами и разными дорогами до значения.
        Сложение по разрезу законно только внутри его объекта; сравнение срезов по
        разнообъектным разрезам — операция запрещённая, а не подозрительная. Справочник
        значений у них ОДИН: объект меняет дорогу, а не список значений. Правило
        распространяется и на показатели (ADR-0206, §§1–6; не путать с ИС-21/ADR-0179,
        где у ОДНОГО объекта значений много и признак уезжает на нижележащий объект).

  ИС-47 Величина, определяемая ОДНОЙ датой среза, может быть колонкой строки; величина,
        требующая двух и более, колонкой не становится никогда — дельта, темп, миграция,
        скользящее среднее и курсовая разница считаются анализом либо мёрзнут графой
        изменения выпуска. Критерий механический — реквизит записи «сколько дат среза
        нужно», проверяемый ДО заведения, — а не догадка по имени. Две величины на одной
        дате есть по-прежнему одна дата: удельная величина и доля остаются в прежних
        рамках (ADR-0220; ADR-0200, ADR-0150 §4, ADR-0218, ADR-0155).

  ДЕМО ПОКРЫВАЕТ: десять объектов на одном движке (кредит и заёмщик — непохожая пара:
  разные разрезы, разные показатели, разное множество) · прогон, пропуск ночи с причиной и
  внеплановый ручной пересчёт с актором · закрытие мая и июня человеком и отказ прогона
  писать в закрытое · расхождение зафиксированного мая с сегодняшним пересчётом (есть
  корректировка, учтена в июле) · запрос на дату без строк ВНУТРИ истории — отдаётся
  ближайшая предыдущая с названным возрастом, и отказ на дату за последним прогоном (в том
  числе на «сегодня»), называющий прогон, пропуск и реестр владельца · разновалютный итог, называющий состав, и курсовую разницу
  разностью двух срезов · период произвольным интервалом как разность двух нарастающих
  итогов и названную базу периода, когда строки на начало интервала нет · историчный
  разрез: смена куратора сегодня не переписывает майскую строку · роль аналитика, режущую
  множество до группировки, и отказ «всего по холдингу» · заёмщика без действующих
  кредитов, который при свёртке исчез бы · отказ завести показатель с формулой · отказ
  классификации читать шов статистики · сходимость детализации со списком реестра ·
  ряд, у которого даты — часть вопроса (шаг месяц или квартал, 4/6/8 точек, последняя всегда
  дата среза) · фильтр наборами (ДНФ без скобок): сравнения внутри набора через И, наборы
  через ИЛИ, операнд — разрез или мера строки, значения берутся из строк на дату среза, у
  разреза-даты — корзинами, а не сырой датой, и весь фильтр печатается в паспорте словами · форма заведения
  разреза, которая спрашивает число значений на объект, корзины списком и ВЛАДЕЛЬЦА уровней,
  но не даёт напечатать иерархию руками · поимённый состав прогона в журнале ·
  дерево уровней (дивизион → филиал из справочника кадров; область → район из полей) с
  колонкой «своих», где кредит без района остаётся у области и не исчезает · корзины дат
  (год · квартал · месяц) и отказ спросить разрез-дату без корзины · отказ завести
  многозначный разрез — с указанием, каким объектом он должен стать · двоичный отказ
  statRows с названным числом строк и двумя дорогами: задание на выгрузку с паспортом
  внутри файла и список в реестре владельца на сегодня · краткий паспорт под числом плитки
  и полный по действию · обратный индекс ссылок потребителей, публикация и переиздание
  редакции без ссылок · снятие показателя с поимённым списком того, что сломается ·
  состав среза, идущий за рождением объектов (погашений 0·4·10·12·14), и отказ завести
  объект без объявленного рождения · солидарную пару требований на один кредит в разных
  филиалах, где сумма филиалов почти вдвое больше итога, и паспорт называет дедуп-ключ ·
  отказ спросить у дела фазу С УКАЗАНИЕМ ДОРОГИ на требование · отказ завести удельную
  величину с разложением её на пару «срез + счёт» · сверку «погашено» с платежами по
  каждому договору в его валюте · один платёж, разрезанный ДВАЖДЫ одной суммой (пять статей
  и два слоя), и сводное поступление, разнесённое на два кредита в двух подразделениях ·
  снятие объекта строкой реестра, отвечающее отказом, а не пустым экраном · три оси
  результата меры, ни одна из которых не выводится из другой · срок, который течёт от
  направления и невручением не отменяется · сторнированную меру, которую отсекает СУЖЕНИЕ,
  а не пропажа строки, и дедуп, где сужение меняет представителя ключа · «выдано по
  программе» срезом кредита по разрезу «Кредитная программа» · объект без единой меры
  строки, у которого есть строки, ref и число · максимум по группе, где мерить нечего, —
  прочерком, а не нулём · охват ролей, ОБЪЯВЛЕННЫЙ объектом, а не зашитый именем разреза:
  заёмщик режется своим «ведущим куратором», кредитная программа объявлена общей и паспорт
  это называет, а сводное поступление и залоговый договор под ролью куратора отвечают
  отказом с дорогой — потому что показать их целиком значит выдать объём чужой работы даже
  итогом, а показать пусто — соврать.

  ГРАНИЦЫ МАКЕТА: ядро (пять швов ADR-0135) и множества соседей взяты зеркалом и здесь не
  редактируются; закрытие учётного периода — чужое действие, на экране журнала оно
  смоделировано кнопкой, помеченной как зеркало (своей кнопки «зафиксировать статистику» у

     PASS  #183  правило округления — РЕКВИЗИТ ЗАПИСИ, а не свойство кода: «правило округления» стоит в закрытом списке породы «показатель» (27 реквизитов) и несут его ВСЕ 171 денежных записей реестра — без правила 0. Правило на весь реестр ОДНО и названо: коп-2, ровно то, что объявлено ядром. Объявляют его сами 114 записей — валютные строки и их сомовые стороны; остальные 57 суть денежные своды и НАСЛЕДУЮТ его от показателя-основания, как наследуют тип и единицу: «сумма сумм» округляется по правилу слагаемых, и второму правилу в своде взяться неоткуда. У неденежных записей реквизита нет ни одного (0) — до копейки округляют сумму, а не дни. У пары стороны округляются одинаково (расхождений 0): разные правила развели бы валютную и сомовую колонки одной строки на копейку. Применённое равно объявленному не только в строке (#172), но и там, где раньше округляли по-своему: свод несёт «коп-2», поток — «коп-2», расхождение — «коп-2». Дверь СПРАШИВАЕТ и не подразумевает: молчание отбито («у денежной величины «Комиссия за выдачу» не названо правило округления: читающий реестр …»), неизвестное правило отбито с перечислением объявленных («правило округления «до рубля» не объявлено: запись на правило ССЫЛАЕТСЯ, а не заводит своё — ина…»), правило у неденежной записи отбито, а у разреза отбито ещё и по породе — реквизит чужой. Ручная половина пары с необъявленным правилом отбита сверкой с origin'ом. Та же заявка с названным правилом заводится свободно (m-q7 и m-q7-som, правило «коп-2»). И главное — ядро берёт правило ИЗ ЗАПИСИ, а не своё в обход неё: подменили правило у «Сумма остатка ОД в сомах» на необъявленное, прогнали заново — её колонка из строки ИСЧЕЗЛА (да), а у соседней записи той же строки осталась и с прежним правилом (да). Округляй ядро по своему литералу — подмена не изменила бы ничего, и «правило одно на всю систему» осталось бы надписью (ИС-44, ADR-0214 §6, ADR-0150 §5, ADR-0209 §2)

const BASE_LAYER = LAYERS[0];

};
function valueOn(hist, dateISO){
  if(!hist || !hist.length) return null;
  let out = null;
  for(const [from, v] of hist) if(from <= dateISO) out = v;
  return out;
}
function rateOn(cur, dateISO){
  const list = RATES[cur] || RATES.KGS;
  let hit = list[0];
  for(const r of list) if(r[0] <= dateISO) hit = r;
  return {rate: hit[1], rateDate: hit[0], dated: cur === 'KGS'};
}
