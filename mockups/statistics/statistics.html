<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статистика · АСУБК</title>
<!--
  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Статистика» (TO-BE).
  Логика ниже ИСПОЛНЯЕТСЯ: прогон собирает строки на дату, закрытие учётного
  периода их фиксирует, каждый ответ несёт паспорт. Все объекты собраны
  ИЗ ДАННЫХ — в сборщике строк слова «кредит» нет ни одного.

  Канон логики:  mockups/statistics/ASUBK-statistika-logika.md
  Журнал волн:   mockups/statistics/ASUBK-status-razrabotki.md
  Физсхема:      mockups/statistics/ASUBK-statistika-fizschema.md
  ТЗ:            requirements/tz/19-statistika.html
  Постановка:    docs/tasks/p22-statistika-tasks.html
  Смоук:         node scripts/inspect/statistics-check.mjs
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-green-hover:#106A36; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:290px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.sidebar-foot{ padding:12px 16px; border-top:1px solid var(--border-default);
  font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-muted); }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; max-width:1140px; }
.panel-wrap.wide{ max-width:none; }
.view{ display:none; } .view.active{ display:block; }

/* ---- sidebar toggle (burger) ---- */
.app.no-sidebar .sidebar{ display:none; }
.burger{ width:32px; height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); cursor:pointer; font-size:16px; line-height:1;
  flex:none; }
.burger:hover{ background:rgba(24,39,57,0.05); }

/* ---- headings, notes ---- */
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.page-lead{ font:var(--font-label); color:var(--text-muted); margin:2px 0 16px; max-width:900px; }
.note{ font:var(--font-label); color:var(--text-muted); margin:8px 0 0; max-width:900px; }
/* ---- «зачем так»: довод под собственным замком ---- */
.why{ margin:10px 0 0; max-width:900px; }
.why > summary{ cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px;
  font:var(--font-label); color:var(--text-placeholder); user-select:none; }
.why > summary::-webkit-details-marker{ display:none; }
.why > summary::before{ content:'▸'; font-size:10px; line-height:1; }
.why[open] > summary::before{ content:'▾'; }
.why > summary:hover{ color:var(--asubk-blue); }
.why .note{ margin:6px 0 0; padding-left:14px; border-left:2px solid var(--border-default); }
.note code, .page-lead code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); }

/* ---- banners ---- */
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }

/* ---- pills ---- */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

/* ---- tables ---- */
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); color:var(--text-muted); }
/* Подсветка ночи, о которой спросил паспорт: вход из чужого числа. */
table.cgrid tbody tr.focus td{ background:var(--asubk-nav-active); box-shadow:inset 0 0 0 1px rgba(24,39,57,0.18); }
/* Нижний уровень дерева: тише по имени, но НЕ серее по числам — это не «выпавшая» строка, а такой же ответ, только мельче зерном. */
table.cgrid tbody tr.lvl td:first-child{ color:var(--text-muted); }
/* Заголовок группы внутри таблицы: реестр читается по объектам, а не одним полотном. */
table.cgrid tbody tr.grp td{ background:var(--surface-panel); color:var(--text-body);
  border-bottom:1px solid var(--border-default); padding:8px 12px; }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }

/* ---- cards ---- */
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.cols{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.side{ flex:0 0 260px; } .body{ flex:1; min-width:460px; }
.meta{ font:var(--font-label); color:var(--text-muted); margin:0 0 10px; }
.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:190px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ height:var(--control-h); border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }
.facts .f.annul{ text-decoration:line-through; color:var(--text-placeholder); }
.frozen{ background:var(--asubk-gray-50); }

/* ---- toast ---- */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
/* ---- паспорт ответа ---- */
.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:150px; }
.pass.warn{ border-left-color:var(--asubk-amber); }
.pass.fixed{ border-left-color:var(--asubk-green); }

/* ---- конструктор среза ---- */
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
/* Подпись блока внутри самой ленты: блоки объявлены полем grp записи показателя, поэтому разметка их не перечисляет — она печатает то, что пришло из реестра. */
.chips-grp{ flex-basis:100%; margin:8px 0 -1px; font:var(--font-label); font-weight:var(--weight-medium);
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; font-size:11px; }
.chips-grp:first-child{ margin-top:0; }
/* Строк среза по кредиту 28 колонок — таблица едет вбок внутри карточки, а не тянет страницу. */
.tscroll{ overflow-x:auto; }
.tscroll table{ min-width:100%; width:max-content; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; cursor:pointer;
  border:1px solid var(--border-default); border-radius:var(--radius-pill);
  background:var(--surface-card); font:var(--font-label); color:var(--text-body); }
.chip:hover{ background:var(--surface-hover); }
.chip.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-link);
  font-weight:var(--weight-medium); }
.chip.off{ opacity:.45; cursor:not-allowed; }
.pickbar{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
.pickbar > div{ min-width:220px; }
.pickbar h4{ margin:0 0 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:.05em; }
/* Заголовок с числом и кнопкой: счётчик стоит В строке заголовка, а не под лентой чипов, иначе «выбрано 2 из 33» читается уже после того, как решение развернуть принято. */
.pickhead{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 4px; }
.pickhead h4{ margin:0; }
.pickhead .cnt{ font:var(--text-xs)/1.3 var(--asubk-font); color:var(--text-muted);
  font-variant-numeric:tabular-nums; }
/* ---- корешки конструктора ---- */
.tabs{ display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--border-default);
  margin:18px 0 14px; position:sticky; top:0; z-index:5; background:var(--surface-page); }
.tabs button{ appearance:none; border:none; background:none; cursor:pointer;
  font:var(--weight-medium) var(--text-sm)/1.4 var(--asubk-font); color:var(--text-muted);
  padding:9px 14px 8px; border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:7px; }
.tabs button:hover{ color:var(--text-heading); background:var(--surface-hover); }
.tabs button.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); }
.tabs .n{ font-variant-numeric:tabular-nums; color:var(--text-placeholder); }
.tabs button.on .n{ color:var(--asubk-blue); }
/* Свёрнутый фильтр печатает СВОЮ форму строкой, а не прячет её за словом «фильтр»: «фильтр задан» — это ответ без вопроса. */
.fold{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;
  padding-top:12px; border-top:1px solid var(--border-default); }
table.cgrid td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cgrid td.num button{ background:none; border:none; padding:0; cursor:pointer; color:var(--text-link);
  font:var(--font-label); font-variant-numeric:tabular-nums; text-decoration:underline dotted; }
table.cgrid tfoot td{ padding:9px 12px; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }

/* ---- ряд (statSeries) ---- */
.spark{ display:flex; align-items:flex-end; gap:10px; height:120px; margin:10px 0 4px; }
.spark .bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
.spark .bar i{ width:100%; background:var(--asubk-blue-tint); border-top:2px solid var(--asubk-blue); display:block; }
.spark .bar.fixed i{ background:var(--asubk-green-tint); border-top-color:var(--asubk-green); }
.spark .bar span{ font:var(--weight-regular) 11px/1.2 var(--asubk-font); color:var(--text-muted); }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Модуль «Статистика» · прототип TO-BE</small></div>
    <div class="nav">
      <div class="nav-sec">Работа</div>
      <button class="nav-item" data-v="journal" onclick="ST.go('journal')">Журнал прогонов</button>
      <div class="nav-sec">Настройка</div>
      <button class="nav-item" data-v="setup" onclick="ST.go('setup')">Реестры</button>
    </div>
    <div class="sidebar-foot" id="foot"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="ST.toggleSidebar()" title="Показать/скрыть меню">☰</button>
      <div class="crumb-title" id="title">Журнал прогонов</div>
      <div class="right">
        <span><label>Дата</label><select id="asOf" onchange="ST.setDate(this.value)"></select></span>
        <span><label>Роль</label><select id="role" onchange="ST.setRole(this.value)"></select></span>
      </div>
    </div>
    <div class="content"><div class="panel-wrap" id="panel"></div></div>
  </div>
</div>
<div id="toastWrap"></div>

<script>
/* ===================================================================== */
const ST = {};

/* ------------------------------ ДАТЫ ------------------------------- */
const MON = {'01':'январь','02':'февраль','03':'март','04':'апрель','05':'май','06':'июнь',
  '07':'июль','08':'август','09':'сентябрь','10':'октябрь','11':'ноябрь','12':'декабрь'};
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const ym  = iso => iso.slice(0,7);
const first = m => m+'-01';
const monLabel = m => m ? MON[m.slice(5,7)]+' '+m.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const nextM = m => { let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const prevM = m => { let [y,mm]=m.split('-').map(Number); mm--; if(mm<1){mm=12;y--;} return y+'-'+String(mm).padStart(2,'0'); };
const monthEnd = m => { const n = nextM(m); const d = new Date(Date.parse(first(n)) - 86400000); return d.toISOString().slice(0,10); };

/* ---- СРЕЗ НА НАЧАЛО ДНЯ ---- */
const dayShift = (d, n) => new Date(Date.parse(d) + n*86400000).toISOString().slice(0,10);
const eveOf = d => dayShift(d, -1);
const worldAt = eveOf;
const periodOf = d => ym(eveOf(d));
const sliceOfMonth = m => first(nextM(m));
ST.periodOf = periodOf; ST.sliceOfMonth = sliceOfMonth; ST.worldAt = worldAt;

const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };

/* ====== ПУБЛИЧНЫЙ ПЕРЕЧЕНЬ ПОЛЕЙ КАРТОЧКИ: ОБЪЯВЛЯЕТ ВЛАДЕЛЕЦ ====== */
const CARD = {
  'obj-credit': {owner:'Кредиты', since:'2026-08-27', fields:[
    /* Номер договора живой стороной есть, а датированной не имеет вовсе: он АДРЕСУЕТ строку, а не режет её. Реквизит без пары — законен. */

    {id:'к-cdate',    name:'дата выдачи',        f:'cdate',       twin:'d-cdate'},
    {id:'к-amount',   name:'сумма договора',     f:'amount',      twin:'m-amount'},
    {id:'к-cur',      name:'валюта договора',    f:'cur',         twin:'d-cur'},
    {id:'к-inn',      name:'ИНН заёмщика',       f:'inn',         twin:'d-binn'},
    {id:'к-region',   name:'область',            f:'region',      twin:'d-region'},
    /* Район в карточке — поле, а в реестре — ВТОРОЙ УРОВЕНЬ разреза «Территория», а не своя запись. */
    {id:'к-district', name:'район',              f:'district',    twin:null},
    {id:'к-industry', name:'отрасль',            f:'industry',    twin:'d-industry'},
    {id:'к-program',  name:'программа',          f:'program',     twin:'d-program'},
    {id:'к-line',     name:'линия кредитования', f:'line',        twin:'d-line'},
    /* Историчные реквизиты карточка отдаёт СЕГОДНЯШНИМ значением — тем, что в ней стоит сейчас. */
    {id:'к-branch',   name:'подразделение',      h:'branch',      twin:'d-branch'},
    {id:'к-curator',  name:'куратор',            h:'curator',     twin:'d-curator'},
    {id:'к-status',   name:'состояние',          h:'status',      twin:'d-status'}
  ]}
};
const CARD_F = (objId, id) => ((CARD[objId] || {fields:[]}).fields).find(f => f.id === id) || null;
/* Объект объявлен, а множества ему никто не отдаёт: отказ называет владельца, шов и
   номер заявки — ту же дорогу, что назван у «освоено по программе». */
const pendingWhy = o => 'объект «'+o.name+'» объявлен, а строк у него нет: перечень отдаёт '+
  'владелец «'+o.pending.owner+'» швом «'+o.pending.seam+'», и шва этого пока нет. Это ЗАЯВКА '+

const ARTICLES = ['collection','charges','principal','accInterest','interest','accPenalty','penalty'];

/* Периодичность ОБСЛЕДОВАНИЯ — матрица «группа платёжеспособности × движимое/недвижимое» (Положение №22, Прил.2 §2.3, Р-3), а не свойство вида: чем хуже платит должник, тем чаще смотрят на вещь. */

                       '3':{'недвижимое':90, 'движимое':60},  '4':{'недвижимое':60, 'движимое':30},

const BANKRUPT_SUBGROUPS = ['3.1','3.2'];
/* Доли разнесения ПЛАТЕЖА по статьям — зеркало очереди владельца (ТЗ 14 §5: расходы → комиссия → ОД → проценты → пеня). */
const PAY_SPLIT = {
  'плановое':                  {collection:0,     charges:0.010, interest:0.220, penalty:0    },
  'досрочное':                 {collection:0,     charges:0.005, interest:0.080, penalty:0    },
  'по решению суда':           {collection:0.060, charges:0.010, interest:0.180, penalty:0.140},
  'за счёт реализации залога': {collection:0.040, charges:0.010, interest:0.150, penalty:0.090}
};
/* Доля платежа, легшая на слой ВЗЫСКАНИЯ. «Взыскано» мерой не хранится нигде — оно свёртка платежей, разнесённых на слой, и платёж обязан зеркалить разбивку, иначе величина неисчислима. */
const PAY_LAYER = {'по решению суда': 1, 'за счёт реализации залога': 1};

const CORE = {
  calls: 0,
  grow(item, field, dateISO){
    const spec = (item.k || {})[field];
    if(!spec) return null;
    const [base, per30] = spec;
    const v = base + per30 * (daysBetween(ANCHOR, dateISO) / 30);
    return Math.round(Math.max(field === 'daysOverdue' ? 0 : 0, v) * 100) / 100;
  },
  /* ------ ПЕРЕСЧЁТ В СОМ: ОДНО МЕСТО, ОДНО ОБЪЯВЛЕННОЕ ОКРУГЛЕНИЕ ------ */
  SOM_ROUNDING: {id:'коп-2', digits: 2, name:'до копейки',
    text:'до копейки — два знака после запятой, обычное арифметическое округление; '+
         'правило одно на всю систему и на все отчёты'},
  /* Перечень объявленных правил — ПРОИЗВОДНАЯ от объявления, а не второе объявление: правило в системе одно, и перечислять в отказе больше нечего. */
  roundings(){ return [CORE.SOM_ROUNDING]; },
  rounding(id){ return CORE.roundings().find(r => r.id === id) || null; },
  /* Округляет по НАЗВАННОМУ правилу, а не по своему в обход записи. */
  somRound(x, rule){
    const R = CORE.rounding(rule);
    if(!R) return null;
    const p = Math.pow(10, R.digits);
    return Math.round(x * p) / p;
  },
  /* Сомовая сторона денежного ответа. */
  toSom(parts, rule){
    const ps = (parts || []).filter(p => p && (p.value != null || p.v != null))
      .map(p => ({cur: p.cur || 'KGS', value: p.value != null ? p.value : p.v,
                  rate: p.rate, rateDate: p.rateDate}));
    if(!ps.length) return null;
    if(ps.some(p => p.rate == null)) return null;
    /* Правило приходит ИЗ ЗАПИСИ, чью величину пересчитывают. */
    const v = CORE.somRound(ps.reduce((s, p) => s + p.value * p.rate, 0), rule);
    if(v == null) return null;
    /* ПРИМЕНЁННОЕ правило кладётся в ответ рядом с курсом и датой курса: читающий строку видит, по какому правилу округлена величина, которую он ставит в состав отчёта, — а реестр и есть контракт. */
    return {value: v, round: rule,
            rateDate: ps.map(p => p.rateDate).filter(Boolean).sort().slice(-1)[0] || null,
            from: ps};
  },
  cell(item, value, dateISO){
    const cur = item.f.cur || 'KGS';
    const r = rateOn(cur, dateISO);
    /* Состав из одной части — тот же состав: правило клетки одно на все объекты и различается только мощностью множества. */
    const parts = [{cur, value, rate: r.rate, rateDate: r.rateDate}];
    /* Денежный ответ ядра несёт ДВЕ стороны сразу — договорную и сомовую: спрашивающему сомовую величину не приходится выводить её самому. */
    /* Правило округления здесь берётся из ЕДИНСТВЕННОГО объявления ядра: у шва записи реестра в руках нет, и ядро отвечает за себя. */
    return {value, cur, rate: r.rate, rateDate: r.rateDate, dated: r.dated,
            parts, mixed: false, som: CORE.toSom(parts, CORE.SOM_ROUNDING.id)};
  },
  money(item, field, dateISO){ return CORE.cell(item, CORE.grow(item, field, dateISO), dateISO); },
  /* ПОТОК В СОМАХ — ПО КУРСУ ДНЯ КАЖДОЙ ОПЕРАЦИИ. Выдано, погашено, начислено и списано копились по курсу своего дня, и сомовая сторона потока — сумма операций, каждая по своему курсу, а не нарастающий итог, умноженный на курс сегодняшнего дня: такого числа не было. */
  flowSom(item, get, dateISO){
    const cur = item.f.cur || 'KGS';
    const at = d => get(d) || 0;
    const op = (value, d) => { const r = rateOn(cur, d); return {cur, value, rate: r.rate, rateDate: r.rateDate}; };
    /* Операции собираются СОСТАВОМ и пересчитываются одним `toSom`: умножения на курс вне него ядро не заводит, и правило округления одно. */
    const ops = [];
    if(cur === 'KGS' || dateISO <= ANCHOR) ops.push(op(at(dateISO), dateISO));
    else {
      let prev = at(ANCHOR);
      ops.push(op(prev, ANCHOR));
      for(let d = dayShift(ANCHOR, 1); d <= dateISO; d = dayShift(d, 1)){
        const now = at(d);
        if(now !== prev) ops.push(op(now - prev, d));
        prev = now;
      }
    }
    const s = CORE.toSom(ops, CORE.SOM_ROUNDING.id);
    return s ? s.value : null;
  },
  /* Денежный ответ ПОТОКА: договорная сторона — как у всякой суммы, сомовая — сумма операций по их курсам (`flowSom`), а не пересчёт итога курсом дня. */
  flowCell(item, get, dateISO){
    return Object.assign(CORE.cell(item, get(dateISO), dateISO),
      {som: {value: CORE.flowSom(item, get, dateISO), round: CORE.SOM_ROUNDING.id, flow: true}});
  },
  /* Раскладка долга по семи статьям. */
  debtParts(item, dateISO){
    const r2 = x => Math.round(x * 100) / 100;
    const P = CORE.grow(item, 'principal', dateISO) || 0;
    const A = CORE.grow(item, 'interest', dateISO) || 0;
    const d = Math.round(CORE.grow(item, 'daysOverdue', dateISO) || 0);
    const amt = item.f.amount || 0;
    const rest = {
      collection:  d > 180 ? r2(amt * 0.004) : 0,
      charges:     r2(amt * 0.001),
      principal:   r2(P),
      accInterest: d > 0 ? r2(A * 0.20) : 0,
      interest:    r2(A * 0.45),
      accPenalty:  d > 90 ? r2(P * 0.00008 * d) : 0,
      penalty:     d > 0 ? r2(P * 0.00020 * d) : 0
    };
    /* Срочная часть НЕ выводится отдельной формулой: она разность. */
    const over = {
      collection:  rest.collection,
      charges:     d > 0 ? rest.charges : 0,
      principal:   d > 0 ? r2(rest.principal * Math.min(1, d / 360)) : 0,
      accInterest: rest.accInterest,
      interest:    d > 0 ? r2(rest.interest * Math.min(1, d / 90)) : 0,
      accPenalty:  rest.accPenalty,
      penalty:     rest.penalty
    };
    const total   = r2(ARTICLES.reduce((s, a) => s + rest[a], 0));
    const overdue = r2(ARTICLES.reduce((s, a) => s + over[a], 0));
    return {rest, over, total, overdue, current: r2(total - overdue), days: d,
      disputed:   Math.round(CORE.grow(item, 'disputedDays', dateISO) || 0),
      writtenOff: d > 180 ? r2(amt * 0.002 * ((d - 180) / 30)) : 0,
      overpaid:   r2(CORE.grow(item, 'overpaid', dateISO) || 0)};
  },
  daysToDue(dateISO, due){
    const y = Number(dateISO.slice(0,4)), m = Number(dateISO.slice(5,7)), d = Number(dateISO.slice(8,10));

    return new Date(Date.UTC(y, m, 0)).getUTCDate() - d + due;

  /* ---: пять дверей ядра. */
  calcDebt(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    const out = {
      daysOverdue:  {value: p.days},
      disputedDays: {value: p.disputed},
      total:      CORE.cell(item, p.total,      dateISO),
      overdue:    CORE.cell(item, p.overdue,    dateISO),
      current:    CORE.cell(item, p.current,    dateISO),
      writtenOff: CORE.flowCell(item, d => CORE.debtParts(item, d).writtenOff, dateISO),
      overpaid:   CORE.cell(item, p.overpaid,   dateISO)
    };
    ARTICLES.forEach(a => {
      out[a] = CORE.cell(item, p.rest[a], dateISO);
      out['over_' + a] = CORE.cell(item, p.over[a], dateISO);
    });
    return out;
  },
  calcAccrual(item, dateISO){ CORE.calls++;
    return {interest: CORE.flowCell(item, d => CORE.grow(item, 'interest', d), dateISO)}; },
  /* «Погашено всего» — НЕ самостоятельный ряд, а сумма платежей по этому кредиту. */
  /* Платёж на дату: кредит и состояние берутся ДАТИРОВАННОЙ историей, если она есть, иначе полем карточки. */
  payOn(p, d){
    const h = p.h || {};
    return {credit: h.credit ? valueOn(h.credit, d) : p.f.credit,
            state:  h.pstate ? valueOn(h.pstate, d) : (p.f.pstate || 'confirmed'),
            at: [p.f.rdate, p.f.bdate].filter(Boolean).sort().slice(-1)[0]};
  },
  /* Сторнированный платёж погашением не является: кредит на дату и состояние на дату — у `payOn`, одним местом для «погашено» кредита и разнесения поступления. */
  repaidOf(item, dateISO){
    const base = ((item.k || {}).repaidBase || [0])[0] || 0;
    const paid = (WORLD['obj-repay'] || []).reduce((n, p) => {
      const x = CORE.payOn(p, dateISO);
      return n + (x.credit === item.id && x.state !== 'reversed' && x.at > ANCHOR && x.at <= dateISO ? p.f.amount : 0);
    }, 0);
    return Math.round((base + paid) * 100) / 100;
  },
  calcAllocation(item, dateISO){
    CORE.calls++;
    return {issuedTotal: CORE.flowCell(item, d => CORE.grow(item, 'issuedTotal', d), dateISO),

  calcSchedule(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    /* День платежа — число месяца из даты договора: у каждого договора он свой, поэтому «минимум дней до платежа» по портфелю — осмысленный вопрос, а не константа. */
    const due = Math.min(28, Number((item.f.cdate || '2020-01-15').slice(8, 10)) || 15);
    const plan = Math.round((item.f.amount || 0) * 0.031 * 100) / 100;
    return {version: {value: 'действующая на ' + dateISO},
            nextAmount: CORE.cell(item, Math.min(plan, p.total), dateISO),

    /* Полное погашение считается по СВОДУ, а не по телу: остаток в 1 755 сом при нулевом теле — это и есть осиротевшая копейка E2E-13/14, и прогноз обязан её видеть. */
    return {expected: CORE.cell(item, p.rest.principal, dateISO),
            fullInDays: {value: pace > 0 ? Math.round(p.total / pace * 30) : null}};
  },
  /* --- Портфельный вопрос: ядро отвечает о МНОЖЕСТВЕ договоров, а не о заёмщике. */
  creditsOf(inn){ return (WORLD['obj-credit'] || []).filter(c => c.f.inn === inn); },
  /* Клетка суммы несёт СОСТАВ по валютам. */
  portfolioCell(list, dateISO, get){
    const by = {};
    list.forEach(c => { const cur = c.f.cur || 'KGS';
      by[cur] = Math.round(((by[cur] || 0) + (get(c) || 0)) * 100) / 100; });
    const parts = Object.keys(by).sort().map(cur => {
      const r = rateOn(cur, dateISO);
      return {cur, value: by[cur], rate: r.rate, rateDate: r.rateDate};
    });
    const one = parts.length === 1 ? parts[0] : null;
    return {value: one ? one.value : null, cur: one ? one.cur : null,
            rate: one ? one.rate : null, rateDate: one ? one.rateDate : null,
            parts, mixed: parts.length > 1, dated: !one || one.cur === 'KGS',
            som: CORE.toSom(parts, CORE.SOM_ROUNDING.id)};
  },
  /* Поток по множеству: число — как у всякой портфельной клетки, сомовая сторона — сумма сомовых потоков договоров, каждый по курсам своих операций. */
  portfolioFlow(list, dateISO, get){
    const c = CORE.portfolioCell(list, dateISO, x => get(x, dateISO));
    c.som = {value: CORE.somRound(list.reduce((n, x) => n + CORE.flowSom(x, d => get(x, d), dateISO), 0),
                                  CORE.SOM_ROUNDING.id), round: CORE.SOM_ROUNDING.id, flow: true};
    return c;
  },
  calcPortfolio(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    const stateOf = c => valueOn(c.h.status, dateISO);
    const live = all.filter(c => stateOf(c) === 'действующий');
    const closed = all.filter(c => stateOf(c) === 'погашен');
    const P = c => CORE.debtParts(c, dateISO);
    /* Свод берётся по ВСЕМ договорам, включая закрытые. */
    const cell = get => CORE.portfolioCell(all, dateISO, get);
    const days = all.map(c => P(c).days);
    const dues = live.map(c => CORE.daysToDue(dateISO,
      Math.min(28, Number((c.f.cdate || '2020-01-15').slice(8, 10)) || 15)));
    const dates = all.map(c => c.f.cdate).filter(Boolean).sort();
    const curs = [];
    all.forEach(c => { const u = c.f.cur || 'KGS'; if(curs.indexOf(u) < 0) curs.push(u); });
    return {
      total:      cell(c => P(c).total),
      overdue:    cell(c => P(c).overdue),
      current:    cell(c => P(c).current),
      principal:  cell(c => P(c).rest.principal),
      issuedTotal:CORE.portfolioFlow(all, dateISO, (c, d) => CORE.grow(c, 'issuedTotal', d)),
      repaidTotal:CORE.portfolioFlow(all, dateISO, (c, d) => CORE.repaidOf(c, d)),
      accrued:    CORE.portfolioFlow(all, dateISO, (c, d) => CORE.grow(c, 'interest', d)),
      writtenOff: CORE.portfolioFlow(all, dateISO, (c, d) => CORE.debtParts(c, d).writtenOff),
      /* ВСЕ договоры заёмщика на дату, включая закрытые: колонка `i_credits` — «кредитов: всего» (схема §2.3). */
      credits:        {value: all.filter(c => stateOf(c) != null).length},
      overdueCredits: {value: all.filter(c => P(c).days > 0).length},
      closedCredits:  {value: closed.length},
      /* У заёмщика без договоров худшей просрочки НЕТ — это не ноль дней. */
      worstDays:  {value: days.length ? Math.max.apply(null, days) : null},
      nextInDays: {value: dues.length ? Math.min.apply(null, dues) : null},
      /* Дата первого договора отдаётся И датой (её режет разрез корзиной год/квартал), И числом дней (его складывает агрегат): показателем дата не бывает (ИС-26). */
      firstDate:  {value: dates.length ? dates[0] : null},
      tenureDays: {value: dates.length ? daysBetween(dates[0], dateISO) : null},
      state:      {value: all.length ? (live.length ? 'действующий' : 'весь портфель погашен')
                                     : 'без договоров'},
      curLabel:   {value: curs.length ? (curs.length > 1 ? 'разновалютный' : curs[0]) : null}
    };
  },
  /* Шов кураторства (ТЗ 16 §11, ИУ-14): ВЕДУЩИМ считается куратор договора с наибольшим остатком основного долга. */
  leadCurator(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    let best = null, bestSom = -1;
    all.slice().sort((a, b) => (a.f.cdate || '') < (b.f.cdate || '') ? -1 : 1).forEach(c => {
      const som = (CORE.debtParts(c, dateISO).rest.principal || 0) * rateOn(c.f.cur || 'KGS', dateISO).rate;
      if(som > bestSom){ bestSom = som; best = c; }
    });
    return {curator: {value: best ? valueOn(best.h.curator, dateISO) : null},
            branch:  {value: best ? valueOn(best.h.branch,  dateISO) : null},
            by:      {value: best ? best.id : null}};
  },
  /* Шов классификации: категория приходит готовой, здесь её не выводят. */
  riskCategory(item, dateISO){
    CORE.calls++;
    if(item.h && item.h.category) return {category: {value: valueOn(item.h.category, dateISO)}};
    const cats = CORE.creditsOf(item.id).map(c => valueOn(c.h.category, dateISO)).filter(Boolean);
    let worst = null;
    /* «Худшая» — по порядку значения в версии классификатора на дату. */
    cats.forEach(c => { if(worst == null || clsVal('risk', c, dateISO).ord > clsVal('risk', worst, dateISO).ord) worst = c; });
    return {category: {value: worst},
            subgroup: {value: valueOn((item.h || {}).subgroup, dateISO)}};
  },
  /* --- Залоговые швы. */
  pledgeValueOf(item){
    const k = COLL_K[item.f.kind];
    if(k == null) return null;
    const base = Math.round((item.f.value || 0) * k * 100) / 100;
    /* Фактическая залоговая правится ТОЛЬКО вниз (Р-19): вверх — это переоценка, событие. */
    return item.f.override != null ? Math.min(item.f.override, base) : base;
  },
  allocOf(item, dateISO){
    return (item.f.alloc || []).filter(a => a.from <= dateISO && (!a.till || a.till > dateISO));
  },
  shareOf(item, creditId, dateISO){
    return CORE.allocOf(item, dateISO).filter(a => a.credit === creditId)
      .reduce((s, a) => s + a.share, 0);
  },
  itemsOf(creditId, dateISO){
    return (WORLD['obj-collateral'] || [])
      .filter(z => CORE.allocOf(z, dateISO).some(a => a.credit === creditId));
  },
  securedOf(creditId, dateISO){
    return CORE.itemsOf(creditId, dateISO)
      .reduce((s, z) => s + CORE.shareOf(z, creditId, dateISO), 0);
  },
  /* Сумма под риском = остаток ОД + НЕОСВОЕННАЯ часть. */
  riskOf(credit, dateISO){
    const p = CORE.debtParts(credit, dateISO).rest.principal;
    const undrawn = Math.max(0, (credit.f.amount || 0) - (CORE.grow(credit, 'issuedTotal', dateISO) || 0));
    return Math.round((p + undrawn) * 100) / 100;
  },
  calcPledge(item, dateISO){
    CORE.calls++;
    const al = CORE.allocOf(item, dateISO);
    const pv = CORE.pledgeValueOf(item);
    const allocated = Math.round(al.reduce((s, a) => s + a.share, 0) * 100) / 100;
    const creds = [], deals = [];
    al.forEach(a => {
      const c = (WORLD['obj-credit'] || []).find(x => x.id === a.credit);
      if(c && creds.indexOf(c) < 0) creds.push(c);
      if(deals.indexOf(a.deal) < 0) deals.push(a.deal);
    });
    /* Вес предмета в кредите = его доля ÷ ВСЁ отнесённое по этому кредиту. */
    const weight = c => { const tot = CORE.securedOf(c.id, dateISO);
      return tot > 0 ? CORE.shareOf(item, c.id, dateISO) / tot : 0; };
    const subs = [];
    creds.forEach(c => {
      const b = (WORLD['obj-borrower'] || []).find(x => x.id === c.f.inn);
      const g = b ? valueOn(b.h.subgroup, dateISO) : null;
      if(g && subs.indexOf(g) < 0) subs.push(g);
    });
    /* Строжайшая из групп заёмщиков обеспечиваемых кредитов: залогодатель бывает третьим лицом, а периодичность контроля меряется по должникам (Р-3, worst-of). */
    subs.sort();
    const worst = subs.length ? subs[subs.length - 1] : null;
    const shape = item.f.kind === 'недвижимость' ? 'недвижимое' : 'движимое';
    const interval = worst ? ((SURVEY_MATRIX[worst.slice(0, 1)] || {})[shape] || null) : null;
    const since = item.f.lastSurvey ? daysBetween(item.f.lastSurvey, dateISO) : null;
    const bankrupt = worst != null && BANKRUPT_SUBGROUPS.indexOf(worst) >= 0;
    const next = (!bankrupt && since != null && interval) ? interval - since : null;
    const state = !creds.length ? 'отнесений нет'
      : bankrupt ? 'по договору со спецадминистратором'
      : since == null ? 'обследований не было'
      : next < 0 ? 'просрочен' : next <= 30 ? 'срок подошёл' : 'в срок';
    return {
      pledgeValue: CORE.cell(item, pv, dateISO),
      allocated:   CORE.cell(item, allocated, dateISO),
      available:   CORE.cell(item, pv == null ? null : Math.round((pv - allocated) * 100) / 100, dateISO),
      /* Клетка суммы несёт состав по валютам и здесь: предмет вправе обеспечивать кредиты в разных валютах, и одного числа у такого требования нет вовсе. */
      securedRisk: CORE.portfolioCell(creds, dateISO, c => CORE.riskOf(c, dateISO) * weight(c)),
      credits:     {value: creds.length},
      deals:       {value: deals.length},
      sinceSurvey: {value: since},
      nextSurveyInDays: {value: next},
      sinceReval:  {value: item.f.lastReval ? daysBetween(item.f.lastReval, dateISO) : null},
      ctlState:    {value: state},
      worstSubgroup: {value: worst}
    };
  },
  /* Обеспеченность КРЕДИТА (Р-1): порог — функция состава обеспечения, а не константа 120 %. Самого индекса шов не отдаёт и отдавать не должен: в срез входят числитель и знаменатель, отношение считается при чтении. */
  calcCoverage(item, dateISO){
    CORE.calls++;
    const items = CORE.itemsOf(item.id, dateISO);
    const share = z => CORE.shareOf(z, item.id, dateISO);
    const liq = items.filter(z => ((REF.collkind || {}).parent || {})[z.f.kind] === 'ликвидный');
    const secured = CORE.portfolioCell(items, dateISO, share);
    const liqCell = CORE.portfolioCell(liq, dateISO, share);
    const risk = CORE.riskOf(item, dateISO);
    const req = !items.length ? null : (liq.length === items.length ? 120 : 150);
    /* Обеспечение и требование могут быть в разных валютах — тогда индекс существует только относительно курса, и состояние честно об этом говорит, а не считает (§15 спеки). */
    const same = items.length && !secured.mixed && secured.cur === (item.f.cur || 'KGS');
    const state = !items.length ? 'без обеспечения'
      : !same ? 'обеспечение в другой валюте'
      : (secured.value || 0) < risk * req / 100 ? 'ниже порога'
      : (req === 150 && (liqCell.value || 0) < risk * 0.8) ? 'доля ликвида ниже 80 %'
      : 'обеспечен';
    return {secured, liquid: liqCell, riskSum: CORE.cell(item, risk, dateISO),
            required: {value: req == null ? null : req + ' %'}, state: {value: state}};
  },
  /* --- Требование взыскания. */
  creditOf(id){ return (WORLD['obj-credit'] || []).find(c => c.id === id) || null; },
  claimsOf(caseId, dateISO){
    return (WORLD['obj-claim'] || []).filter(q => q.f.case === caseId && q.f.qdate <= dateISO);
  },
  claimDebt(item, dateISO){
    CORE.calls++;
    const c = CORE.creditOf(item.f.credit);
    if(!c) return {amount: {value:null}, phaseDays: {value:null}};
    const p = CORE.debtParts(c, dateISO);
    const v = item.f.scope === 'просроченная сумма' ? p.overdue : p.total;
    const ph = (item.h.phase || []).filter(z => z[0] <= dateISO).slice(-1)[0];
    return {amount: CORE.cell(c, v, dateISO),
            phaseDays: {value: ph ? daysBetween(ph[0], dateISO) : null}};
  },
  /* --- Портфельный шов ДЕЛА. Владелец — взыскание, а не ядро: множество кредитов дела выбирает связь «дело × кредит × роль», и знает её только оно. */
  casePortfolio(item, dateISO){
    CORE.calls++;
    const qs = CORE.claimsOf(item.id, dateISO);
    const best = new Map();
    qs.forEach(q => {
      const a = CORE.claimDebt(q, dateISO).amount, cur = best.get(q.f.credit);
      if(!cur || (a.value || 0) > (cur.value || 0)) best.set(q.f.credit, a);
    });
    const creds = [...best.keys()].map(k => CORE.creditOf(k)).filter(Boolean);
    return {claimTotal: CORE.portfolioCell(creds, dateISO, c => (best.get(c.id) || {}).value || 0),
            claims:   {value: qs.length},
            credits:  {value: best.size},
            expenses: CORE.cell(item, CORE.grow(item, 'expenses', dateISO) || 0, dateISO)};
  },
  /* --- Часы меры. */
  measureClock(item, dateISO){
    CORE.calls++;
    const sent = item.f.sent;
    return {sentDays: {value: sent && sent <= dateISO ? daysBetween(sent, dateISO) : null}};
  },
  /* --- Часы ЗАЯВКИ на кредит. Дни считает владелец: назавтра число другое. */
  appClock(item, dateISO){
    CORE.calls++;
    const sub = item.f.subdate, dec = item.f.decdate;
    if(!sub || sub > dateISO) return {days: {value:null}};
    /* После решения часы ОСТАНАВЛИВАЮТСЯ: иначе «средний срок рассмотрения» растёт у решённых заявок вечно. */
    const end = dec && dec <= dateISO ? dec : dateISO;
    return {days: {value: daysBetween(sub, end)}};
  },
  /* --- Часы ЗАЯВКИ на реструктуризацию. Срок идёт от регистрации обращения (ТЗ 15 §3);
     база заявки — сумма баз её расчётов, разновалютная, потому сомовая. */
  rsCalcsOf(appId, dateISO){
    return (WORLD['obj-rscalc'] || []).filter(x => x.f.app === appId && x.f.cdate <= dateISO);
  },
  rsClock(item, dateISO){
    CORE.calls++;
    const reg = item.f.regdate, cl = item.f.closed;
    const cs = CORE.rsCalcsOf(item.id, dateISO);
    /* Пересчёт в сом живёт в одном месте (`CORE.toSom`), а не вторым умножением здесь. */
    return {days:  {value: reg && reg <= dateISO ? daysBetween(reg, cl && cl <= dateISO ? cl : dateISO) : null},
            calcs: {value: cs.length},
            base:  CORE.portfolioCell(cs, dateISO, x => x.f.base || 0)};
  },
  /* --- Часы КАДРОВ. Назначения суть периоды (ТЗ 11 §5): стаж и сумма действующих
     ставок читаются на дату. */
  hrClock(item, dateISO){
    CORE.calls++;
    const h = item.f.hired, fired = item.f.fired;
    return {tenureDays: {value: h && h <= dateISO ? daysBetween(h, fired && fired <= dateISO ? fired : dateISO) : null},
            rate: {value: valueOn((item.h || {}).rate, dateISO)}};
  },
  /* --- Разнесение ПЛАТЕЖА (волна 11, ч. 2). */
  payAlloc(item, dateISO){
    CORE.calls++;
    const r2 = x => Math.round(x * 100) / 100;
    const A = item.f.amount || 0;
    const s = PAY_SPLIT[item.f.kind] || PAY_SPLIT['плановое'];
    const coll = r2(A * s.collection), fee = r2(A * s.charges);
    const int  = r2(A * s.interest),   pen = r2(A * s.penalty);
    /* Основной долг — РАЗНОСТЬ, а не пятая формула. */
    const prin = r2(A - coll - fee - int - pen);
    const share = item.f.jud == null ? (PAY_LAYER[item.f.kind] || 0) : item.f.jud;
    const jud = r2(A * share);
    return {collection: CORE.cell(item, coll, dateISO),
            charges:    CORE.cell(item, fee,  dateISO),
            principal:  CORE.cell(item, prin, dateISO),
            interest:   CORE.cell(item, int,  dateISO),
            penalty:    CORE.cell(item, pen,  dateISO),
            judicial:   CORE.cell(item, jud,  dateISO),
            /* Свободный слой — тоже разность: второй формулы у него нет. */
            free:       CORE.cell(item, r2(A - jud), dateISO)};
  },
  /* --- Разбор ПОСТУПЛЕНИЯ (волна 11, ч. 2). */
  paysOf(rid){ return (WORLD['obj-repay'] || []).filter(p => p.f.receipt === rid); },
  receiptSplit(item, dateISO){
    CORE.calls++;
    const r2 = x => Math.round(x * 100) / 100;
    /* Платёж разнесён с дня привязки и пока не сторнирован. */
    const pays = CORE.paysOf(item.id).filter(p => {
      const x = CORE.payOn(p, dateISO); return x.at <= dateISO && x.state !== 'reversed'; });
    const paid = r2(pays.reduce((n, p) => n + (p.f.amount || 0), 0));
    const ret  = r2(item.f.returned || 0);
    return {paid:        CORE.cell(item, paid, dateISO),
            returned:    CORE.cell(item, ret,  dateISO),
            unallocated: CORE.cell(item, r2((item.f.amount || 0) - paid - ret), dateISO),
            payments:    {value: pays.length},
            /* Ожидание считается ОТ ДАТЫ СРЕЗА и обнуляется опознанием. */
            waitDays:    {value: pays.length ? 0 : Math.max(0, daysBetween(item.f.rdate, dateISO))}};
  },
  /* --- ЧТО ШОВ ОБЪЯВЛЯЕТ «НА ДАТУ» --- Таблица принадлежит СОСЕДУ, а не витрине: это его обещание о своих величинах, и статистика его только читает. */
  DATING: {
    calcDebt:      ['total','overdue','current','writtenOff','overpaid','daysOverdue','disputedDays',
                    'collection','over_collection','charges','over_charges','principal','over_principal',
                    'accInterest','over_accInterest','interest','over_interest',
                    'accPenalty','over_accPenalty','penalty','over_penalty'],
    calcPortfolio: ['total','overdue','current','principal','issuedTotal','repaidTotal','accrued',
                    'writtenOff','credits','overdueCredits','closedCredits','worstDays','nextInDays',
                    'firstDate','tenureDays','state','curLabel'],
    calcPledge:    ['pledgeValue','allocated','available','securedRisk','credits','deals','worstSubgroup'],
    calcSchedule:  ['nextAmount','nextInDays'],
    calcAllocation:['issuedTotal','repaidTotal'],
    calcCoverage:  ['secured','liquid','riskSum','required','state'],
    calcForecast:  ['expected','fullInDays'],
    calcAccrual:   ['interest'],
    riskCategory:  ['category','subgroup'],
    payAlloc:      ['collection','charges','principal','interest','penalty','judicial','free'],
    receiptSplit:  ['paid','returned','unallocated','payments','waitDays'],
    /* Кураторство слоя не закрывает вовсе (`layer:null`), а величины отдаёт на дату: состояние периода и датировка величины — РАЗНЫЕ реквизиты. */
    leadCurator:   ['curator','branch','by'],
    casePortfolio: ['claimTotal','claims','credits','expenses'],
    claimDebt:     ['amount','phaseDays'],
    measureClock:  ['sentDays'],
    appClock:      ['days'],
    rsClock:       ['days','calcs','base'],
    /* Кадры, как и кураторство, слоя не закрывают, а величины отдают на дату. */
    hrClock:       ['tenureDays','rate']
  },
  /* Признак ставится на саму КЛЕТКУ, у двери: величина уносит его с собой через шов, и читателю не приходится второй раз узнавать, откуда она пришла. */
  stamp(seam, a){
    if(!a) return a;
    const names = CORE.DATING[seam] || [];
    names.forEach(f => { if(a[f]) a[f].asof = true; });
    return a;
  },
  /* ------ ВОСЬМОЙ ШОВ: ПЕРЕЧИСЛЕНИЕ ОБЪЕКТОВ С ЖИВЫМИ РЕКВИЗИТАМИ ------ */
  rowCalls: 0,
  objectRows(objId, q){
    CORE.rowCalls++;
    const o = OBJ(objId), card = CARD[objId];
    if(!o) return {ok:false, why:'объекта «'+objId+'» нет в реестре объектов (ИС-53)'};
    if(o.pending) return {ok:false, pending:true, why: pendingWhy(o)};
    /* Владелец перечня не объявил — это не «пусто» и не «ошибка», а НЕТ АДРЕСА. Дорога называется: датированное берётся у статистики, а живое ждёт волны владельца. */
    if(!card) return {ok:false, noCard:true, why: noCardWhy(o)};
    const at = q && q.at;
    if(!at) return {ok:false, why:'ответ «сейчас» без даты снимка не отдаётся (ADR-0181 §4)'};
    const want = (q && q.fields && q.fields.length) ? q.fields.slice() : card.fields.map(f => f.id);
    const alien = want.filter(id => !CARD_F(objId, id));
    /* Необъявленное поле не показывается даже «под ответственность администратора»: иначе область видимости перестаёт быть свойством системы. */

  return {rate: r.rate, rateDate: r.rateDate};
}
/* Валюта величины в строке: у сомовой записи — сом, у валютной — разрез валюты строки. */
function rowCur(r, indId){
  const I = IND(indId);
  if(I && (I.somOf || I.vtype === 'money_som')) return 'KGS';
  const cd = curDimOf(r.obj);
  return (cd && r.dims[cd]) || 'KGS';
}
ST.rowCur = rowCur; ST.curDimOf = curDimOf;
ST.VTYPES = clone(VTYPES);
/* Релиз — СОСТОЯНИЕ, а не константа файла: `RELEASE` есть релиз на старте, копия его лежит в `st.release`, и миграция (`ST.migrate`) дописывает колонки туда. */
ST.release = () => clone((ST.state && ST.state.release) || RELEASE);
ST.physOf = id => physOf(REC(id));

/* --------- РЕКВИЗИТЫ ЗАПИСИ, РАСПИСАННЫЕ ПО ПОРОДАМ ---------- */
/* `dates` — СКОЛЬКО ДАТ СРЕЗА нужно, чтобы величину вычислить. */
/* `col` и `vtype` — основа имени колонки релиза и вид значения: реестр — каталог СУЩЕСТВУЮЩИХ колонок, и ссылается на колонку запись любой породы. */
const F_COMMON = ['id','kind','name','obj','since','until','note','access','grp','dates','history','col','vtype'];
/* Дорога до значения ОБЩАЯ обеим породам: и число, и признак приходят швом, полем или (у показателя) агрегатом. */
const F_ROAD = ['src','seam','field','key'];
/* `roll` + `rollBy` — правило свода и ОБЯЗАТЕЛЬНЫЙ разрез при формульном своде: неаддитивность объявляется РЕКВИЗИТОМ записи, а не поведением движка. */
const F_IND  = ['type','unit','money','flow','fn','over','live','dedupBy','roll','rollBy','somOf','round'];
const F_DIM  = ['levels','buckets','edges','ref','owner','perObject','basis','order','via'];
const FIELDS = {};
FIELDS[KIND.IND] = F_COMMON.concat(F_ROAD, F_IND);
FIELDS[KIND.DIM] = F_COMMON.concat(F_ROAD, F_DIM);
/* Правило свода — реквизит показателя. */
const ROLLS = ['аддитивный','формульный','только-свод'];
const FLAT_TYPES = ['перечисление','булево'];
/* Порядок значений — реквизит разреза, и список его закрыт: «алфавит» и «как в отчёте» здесь не значения, а разные ответы в разных отчётах. */
const ORDERS = ['по значению','по справочнику','по объявленному порядку'];
/* Поля, которыми формула пробирается в реестр под разными именами. */
const FORMULA_FIELDS = ['formula','expr','выражение','формула'];

/* Общие реквизиты присутствуют у КАЖДОЙ записи, даже когда пусты: пустой реквизит — объявленное «не задано», а отсутствующий — вопрос, которого никто не задал. */
function normRec(r){
  if(!r.since) r.since = '2020-01-01';
  if(r.until === undefined) r.until = null;
  if(r.note === undefined) r.note = '';
  if(r.access === undefined) r.access = 'по охвату объекта';
  /* Умолчание есть только у ПЕРЕНОСА: записи демо-мира заведены до, и ответ у всех один — одна дата, потому что другой они и требовать не могут (поля формулы в записи нет, а шов, поле и агрегат читаются НА ДАТУ). */
  if(r.dates === undefined) r.dates = 1;
  if(!r.history) r.history = [{at: r.since, what: 'заведена', kind: r.kind}];
  if(r.kind === KIND.IND){
    if(!r.roll) r.roll = FLAT_TYPES.indexOf(r.type) >= 0 ? 'только-свод' : 'аддитивный';
    if(r.src === 'агрегат' && r.live === undefined) r.live = true;
  } else if(!r.order){
    /* Порядок не угадывается по данным, а выводится из ОБЪЯВЛЕННОГО: объявлены корзины или уровни — порядок объявленный; назван справочник — порядок его; не названо ничего — по значению. */
    r.order = (r.buckets || r.edges || r.levels) ? 'по объявленному порядку'
            : (r.ref || r.owner) ? 'по справочнику' : 'по значению';
  }
  return r;
}

/* ============ СОМОВАЯ ЗАПИСЬ — БЛИЗНЕЦ ВАЛЮТНОЙ ============= */
const SOM_SUFFIX = '-som';
/* Обязательный разрез свода — разрез ВАЛЮТЫ СВОЕГО объекта. */
const CUR_DIM = {'obj-credit':'d-cur', 'obj-claim':'d-clcur', 'obj-repay':'d-pcur',
  'obj-receipt':'d-rcur', 'obj-measure':'d-mcur',
  /* Разрез валюты у каждого объекта свой: им сворачивается его же валютная величина. */
  'obj-app':'d-acur', 'obj-rscalc':'d-rccur', 'obj-odue':'d-oecur'};
ST.CUR_DIM = CUR_DIM;
/* Близнец нужен ТОЛЬКО величине, возникшей в валюте. */
const isSomRow = r => !!r && r.kind === KIND.IND && r.src !== 'агрегат' && !!r.money &&
  !r.somOf && r.vtype !== 'money_som';
function somTwinOf(r){
  const t = clone(r);
  t.id = r.id + SOM_SUFFIX;
  /* Имя РАЗНОЕ и различается явно, а не примечанием: два числа, которые нельзя сложить между собой, не носят одного имени. */
  t.name = r.name + ' в сомах';
  t.somOf = r.id;
  t.unit = 'сом';
  t.money = true;
  t.roll = 'аддитивный';
  delete t.rollBy;
  delete t.history;
  if(r.src === 'агрегат') t.over = r.over + SOM_SUFFIX;
  t.note = 'сомовая сторона величины «'+r.name+'»: произведение валютной колонки строки на '+
    'курс той же строки, посчитанное ядром и записанное колонкой (ИС-44, ADR-0214 §2, §5)';
  return t;
}
/* Объявление неаддитивности и порождение близнеца — ОДНО действие и одно место: запись становится формульной с НАЗВАННЫМ разрезом, и рядом с ней встаёт сомовая. */
function declareTwin(rec, rollBy){
  rec.roll = 'формульный';
  rec.rollBy = rollBy;
  return somTwinOf(rec);
}
/* Сборка реестра: валютная запись объявляет свою неаддитивность, рядом встаёт сомовая. */
function withSomTwins(list, objects){
  const by = {};
  list.forEach(r => { by[r.id] = r; });
  const twinable = r => isSomRow(r) ||
    (r.kind === KIND.IND && r.src === 'агрегат' && r.fn !== 'count' && !r.somOf && isSomRow(by[r.over]));
  const out = [];
  list.forEach(r => {
    out.push(r);
    /* ПЕРЕНОС демо-реестра, часть вторая: денежной записи проставляется правило округления — ссылкой на единственное объявление ядра, механически и в одном месте. */
    if(r.kind === KIND.IND && r.src !== 'агрегат' && r.money && !r.round) r.round = CORE.SOM_ROUNDING.id;
    if(!twinable(r)) return;
    /* Валютная запись ОБЪЯВЛЯЕТ свою неаддитивность реквизитом, а не примечанием: свод формульный, и обязательный разрез назван поимённо. */
    const t = declareTwin(r, CUR_DIM[r.obj]);
    out.push(t);
    const o = (objects || []).find(x => x.id === r.obj);
    if(o){ const i = o.inds.indexOf(r.id); if(i >= 0) o.inds.splice(i + 1, 0, t.id); }
  });
  return out;
}
ST.SOM_SUFFIX = SOM_SUFFIX;
ST.somIdOf = id => (REC(id + SOM_SUFFIX) ? id + SOM_SUFFIX : null);

/* ---- СХЕМА ВИТРИНЫ, ПОРОЖДАЕМАЯ РЕЕСТРОМ, СНЯТА ---- */

/* ============ СВЕРКА РЕЕСТРА С РЕЛИЗОМ ============ */
const SERVICE_COL = /^(object_id|group_id|member_id|target_id|slice_date|run_id|src_\w+|is_partial|now_cols|cur|rate|rate_date|d_corr_kind|d_corr_date)$/;
/* Пара «валютная + сомовая» — ОДНА величина с двумя колонками: ждёт она целиком и включается целиком — «у пары проверяются обе колонки» (схема §12.1). */
function pairOf(st, r){
  const o = (r.somOf && st.registry.find(x => x.id === r.somOf)) || r;
  const t = st.registry.find(x => x.somOf === o.id);
  /* Прекращённая сторона в живую единицу не входит: прекращение действует вперёд, и миграция её не вернёт (правка ревью 1). */
  return (t ? [o, t] : [o]).filter(x => !x.until);
}
/* Чего записям не хватает в релизе их объекта. */
function missingOf(st, objId, recs){
  const t = st.release.tables[objId], out = [];
  const need = c => { if((!t || t.cols.indexOf(c) < 0) && out.indexOf(c) < 0) out.push(c); };
  recs.forEach(r => {
    /* Путь колонки не заводит: он читает колонку соседа по своему ключу — ждёт он их. */
    if(r.via){
      const T = st.registry.find(x => x.id === r.via.dim), K = st.registry.find(x => x.id === r.via.by);
      if(!T || !K){ out.push('путь «'+r.name+'»: записи '+(T ? r.via.by : r.via.dim)+' в реестре нет'); return; }
      missingOf(st, T.obj, [T]).concat(missingOf(st, K.obj, [K])).forEach(m => out.push('путь: '+m));
      return;
    }
    if(r.src === 'агрегат'){
      const b = r.over && st.registry.find(x => x.id === r.over);
      if(b && st.awaiting.indexOf(b.id) >= 0 && out.indexOf('основание «'+b.name+'» ждёт колонку') < 0)
        out.push('основание «'+b.name+'» ждёт колонку');
      return;
    }
    if(r.levels) r.levels.forEach(L => {
      if(!L.col){ if(L.src !== 'справочник') out.push('уровень «'+L.name+'»: колонка не названа'); return; }
      if(!physOf(L).length) out.push('уровень «'+L.name+'»: вид значения «'+L.vtype+'» вне списка');
      physOf(L).forEach(need);
    });
    else physOf(r).forEach(need);
    if(!physOf(r).length) out.push('«'+r.name+'»: колонка не названа');
  });
  return out;
}
function dropFromObjects(st, id){
  st.objects.forEach(o => {
    let i = o.dims.indexOf(id); if(i >= 0) o.dims.splice(i, 1);
    i = o.inds.indexOf(id); if(i >= 0) o.inds.splice(i, 1);
  });
}
/* Колонки релиза без записи. */
function orphansOf(st){
  const used = {}, out = [];
  st.registry.forEach(r => physOf(r).forEach(c => { used[r.obj+'|'+c] = true; }));
  Object.keys(st.release.tables).forEach(obj => {
    const t = st.release.tables[obj];
    t.cols.forEach(c => { if(!SERVICE_COL.test(c) && !used[obj+'|'+c]) out.push({obj, table: t.table, col: c}); });
  });
  return out;
}
const orphanNote = c => 'колонка без записи: '+c.table+'.'+c.col+
  ' — выведена релизом, в реестре не названа (ADR-0237 §3)';
/* Новые сироты после выкладки — предупреждением в журнал; прежние уже названы. */
function reOrphan(st){
  const before = st.orphanCols;
  st.orphanCols = orphansOf(st);
  st.orphanCols.filter(c => !before.some(b => b.obj === c.obj && b.col === c.col))
    .forEach(c => st.relLog.push({at: st.today, who:'релиз', msg: orphanNote(c)}));
}
/* Журнал сверки — `st.relLog`, а не `st.log`: журнал действий сессии в конце `seed` обнуляется, а предупреждения старта обязаны дожить до экрана «Реестры». */
function reconcile(st){
  st.awaiting = [];
  /* Два прохода: сперва строчные записи, потом агрегаты — агрегат ждёт, если ждёт его основание, и узнать это можно только после первого прохода. */
  [r => r.src !== 'агрегат', r => r.src === 'агрегат'].forEach(pass => st.registry.forEach(r => {
    if(!pass(r) || r.until) return;
    const miss = missingOf(st, r.obj, pairOf(st, r));
    if(!miss.length) return;
    st.awaiting.push(r.id);
    dropFromObjects(st, r.id);
    st.relLog.push({at: st.today, who:'сверка при старте', msg: r.src === 'агрегат'
      ? 'ждёт основание: «'+r.name+'» — '+miss.join(', ')+' (ADR-0237 §3, §5; СС-155)'
      : 'ждёт колонку: «'+r.name+'» — в '+((st.release.tables[r.obj] || {}).table || 'таблице объекта')+
        ' нет '+miss.join(', ')+' (ADR-0237 §3)'});
  }));
  st.orphanCols = orphansOf(st);
  st.orphanCols.forEach(c => st.relLog.push({at: st.today, who:'сверка при старте', msg: orphanNote(c)}));
}
/* Включение записи, дождавшейся колонки, идёт тем же путём, что заведение записи после релиза: в состав объекта (близнец — сразу за своей записью) и в историю; досчёт в очередь ставит вызывающий — один раз на пару. */
function includeRec(st, r){
  const i = st.awaiting.indexOf(r.id); if(i >= 0) st.awaiting.splice(i, 1);
  if(r.until) return;                          /* Прекращённая не включается. */
  const o = OBJ(r.obj), box = o && (r.kind === KIND.IND ? o.inds : o.dims);
  if(box && box.indexOf(r.id) < 0){
    const at = r.somOf ? box.indexOf(r.somOf) : -1;
    if(at >= 0) box.splice(at + 1, 0, r.id); else box.push(r.id);
  }
  r.history.push({at: st.today, what:'включена: колонка заведена релизом', kind: r.kind, who:'релиз'});
}
ST.awaiting = () => ST.state.awaiting.map(id => { const r = REC(id);
  return {id, name: r.name, obj: r.obj, cols: physOf(r),
          missing: missingOf(ST.state, r.obj, pairOf(ST.state, r))}; });
ST.orphanCols = () => clone(ST.state.orphanCols);
ST.relLog = () => clone(ST.state.relLog);
ST.colOf = id => { const r = REC(id); if(!r) return null;
  const waits = ST.state.awaiting.indexOf(id) >= 0;
  if(r.src === 'агрегат') return {table: null, cols: [], state: waits ? 'ждёт колонку' : 'агрегат'};
  if(r.via){ const T = REC(r.via.dim), K = REC(r.via.by);
    return {table: (ST.state.release.tables[T.obj] || {}).table || null, cols: physOf(T), key: physOf(K)[0],
            state: waits ? 'ждёт колонку' : 'путь'}; }
  return {table: (ST.state.release.tables[r.obj] || {}).table || null, cols: physOf(r),
          state: waits ? 'ждёт колонку' : r.until ? 'прекращена' : 'включена'}; };

/* ======== МИГРАЦИЯ РЕЛИЗА — АНАЛОГ CHANGESET'А LIQUIBASE ======== */
ST.migrate = spec => {
  const st = ST.state, obj = spec && spec.obj, t = obj && st.release.tables[obj];
  if(!t) return {ok:false, why:'у объекта «'+((obj && OBJ(obj)) ? OBJ(obj).name : obj)+'» нет таблицы строк в '+
    'релизе: миграция добавляет колонки в СУЩЕСТВУЮЩУЮ таблицу, а новая таблица — это новый объект '+
    'со своей сущностью Jmix и записями реестра (ИС-53, ADR-0237 §1, §5)'};
  const cols = spec.cols || [], check = spec.check || null;
  /* Новое значение закрытого словаря — тоже выкладка: CHECK меняет changeset, и дверь у него та же, что у колонки. */
  if(check && Object.keys(check).some(c => t.cols.indexOf(c) < 0 || !Array.isArray(check[c])))
    return {ok:false, why:'список значений ставится на колонку своей таблицы — в '+t.table+' её нет (ИС-57, ADR-0241 §2)'};
  if((!cols.length && !check) || cols.some(c => !/^[a-z][a-z0-9_]*$/.test(String(c))))
    return {ok:false, why:'миграция называет колонки физическими именами — латиницей, с суффиксом вида '+
      'значения (`d_x_id`, `i_x_som`): имя колонки выбирает разработчик, человеческое название живёт '+
      'в реестре (ADR-0237 §2)'};
  const added = cols.filter((c, i) => t.cols.indexOf(c) < 0 && cols.indexOf(c) === i);
  added.forEach(c => t.cols.push(c));
  if(added.length) st.relLog.push({at: st.today, who:'релиз', msg:'миграция: '+t.table+' + '+
    added.join(', ')+(spec.note ? ' — '+spec.note : '')+' (changeset Liquibase, §6)'});
  const widened = [];
  Object.keys(check || {}).forEach(c => {
    const list = t.checks[c] || (t.checks[c] = []);
    check[c].forEach(v => { if(list.indexOf(v) < 0){ list.push(v); widened.push(c+' + «'+v+'»'); } });
  });
  if(widened.length) st.relLog.push({at: st.today, who:'релиз', msg:'миграция: '+t.table+' CHECK '+
    widened.join(', ')+(spec.note ? ' — '+spec.note : '')+' (новое значение закрытого словаря — релиз)'});
  const included = [];
  /* Строчные — раньше агрегатов: свод включается, когда включено его основание. */
  const isAgg = id => (REC(id) || {}).src === 'агрегат';
  st.awaiting.slice().sort((x, y) => isAgg(x) - isAgg(y)).forEach(id => {
    const r = REC(id);
    if(st.awaiting.indexOf(id) < 0 || !r || r.obj !== obj) return;
    /* Прекращённой ждать нечего: из ожидания она уходит, в состав не входит. */
    if(r.until){ st.awaiting.splice(st.awaiting.indexOf(id), 1); return; }
    const pair = pairOf(st, r);
    if(!pair.length || missingOf(st, obj, pair).length) return;
    pair.forEach(x => { includeRec(st, x); included.push(x.id); });
    const qn = queueRegChange(st, pair[0]);
    log('запись реестра «'+pair[0].name+'» включена: релиз завёл '+
      [].concat(...pair.map(x => physOf(x))).join(', ')+' в '+t.table+
      (qn ? '; в очередь перестроения — записей '+qn+' (заполнит прогон, ADR-0215 §7)' : '')+' (ADR-0237 §3)');
  });
  reOrphan(st);
  return {ok:true, obj, table: t.table, added, included, widened};
};
/* Новая таблица строк — новый объект, и миграция у него своя: таблица `stat_row_<объект>`, способ хранения из трёх и колонки. */
const STORAGES = ['state','event_delta','event_full'];
ST.migrateTable = spec => {
  const st = ST.state, obj = spec && spec.obj;
  if(!obj) return {ok:false, why:'миграция таблицы называет объект, чьи строки в ней лежат (ADR-0237 §1)'};
  if(st.release.tables[obj]) return {ok:false, why:'у объекта «'+obj+'» таблица строк уже есть — «'+
    st.release.tables[obj].table+'»: колонки в неё добавляет ST.migrate (ADR-0237 §2)'};
  if(!/^stat_row_[a-z][a-z0-9_]*$/.test(String(spec.table)) ||
     Object.keys(st.release.tables).some(k => st.release.tables[k].table === spec.table))
    return {ok:false, why:'таблица строк называется stat_row_<объект> и принадлежит одному объекту: '+
      'общей таблицы строк нет (ADR-0237 §1)'};
  if(STORAGES.indexOf(spec.storage) < 0) return {ok:false, why:'способ хранения — один из трёх: '+
    STORAGES.join(' · ')+' (ADR-0239)'};
  const cols = (spec.cols || []).filter((c, i, a) => a.indexOf(c) === i);
  st.release.tables[obj] = {table: spec.table, storage: spec.storage, cols};
  st.relLog.push({at: st.today, who:'релиз', msg:'миграция: CREATE TABLE '+spec.table+' ('+spec.storage+
    ', колонок '+cols.length+')'+(spec.note ? ' — '+spec.note : '')+' (changeset Liquibase, §2)'});
  reOrphan(st);
  return {ok:true, obj, table: spec.table, storage: spec.storage, cols: cols.slice()};
};
ST.seams = () => SEAMS.slice();
ST.aggFns = () => Object.keys(AGG_FNS);
ST.consumers = () => clone(CONSUMERS);

/* ==================== СБОРЩИК СТРОКИ СРЕЗА ========================== */
/* Значение разреза берётся на дату и ложится в строку: заново оно не резолвится никогда (ИС-4). */
function readDim(dimId, item, dateISO, ask){
