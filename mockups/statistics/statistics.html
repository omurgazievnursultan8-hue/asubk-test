/* ===================== ЭКРАН 2: ЖУРНАЛ СРЕЗОВ ======================= */
ST.runUI = () => act(ST.run(ST.state.today, {}), 'прогон за '+fmt(ST.state.today)+' выполнен');
ST.runClosedUI = () => act(ST.run('2026-07-01', {}));
/* Молчание соседа — не отладочный флажок, а СОСТОЯНИЕ НОЧИ, и руками оно должно быть достижимо: без этой кнопки неполная строка, отказ защёлки и дозаполнение остались бы словами в проверках, а макет отдаётся разработчику как рабочая модель. */
ST.silentRunUI = () => {
  const nb = ($('#silentNb') || {}).value || '', why = ($('#silentWhy') || {}).value || '';
  const s = {}; s[nb] = why;
  const r = ST.run(ST.state.today, {silent: s});
  act(r, 'прогон за '+fmt(ST.state.today)+' выполнен: «'+nb+'» '+why+
      ' · неполных строк — '+r.partial);
};
ST.skipUI = () => act(ST.skip(ST.state.today, ($('#skipReason') || {}).value || ''), 'пропуск записан');
/* Объект и запись выбираются ОДНИМ полем «объект|запись»: два связанных списка потребовали бы промежуточного состояния экрана, а связь у них жёсткая — запись принадлежит объекту. */
ST.enqueueUI = () => {
  const k = (($('#qKey') || {}).value || '').split('|');
  act(ST.enqueue(k[0], k[1], ($('#qWhy') || {}).value || '', ($('#qNote') || {}).value || ''),
      'работа поставлена в очередь перестроения');
};
ST.manualUI = () => act(ST.run(ST.state.q.date, {manual:true, actor: ST.state.role,
  reason: ($('#manualReason') || {}).value || ''}), 'внеплановый пересчёт выполнен');
/* Кнопка на КАЖДЫЙ слой, и все три собраны из LAYERS: слой — параметр действия, а не имя кнопки. */
ST.layerUI = layer => {
  const who = ($('#closeWho') || {}).value || '';
  const m = ST.openPeriod(layer);
  act(layer === MY_LAYER ? ST.closePeriod(m, who) : ST.closeLayer(m, layer, who),
    layer === MY_LAYER ? 'период '+monLabel(m)+' закрыт: строки зафиксированы'
                       : 'колонка «'+layer+'» периода '+monLabel(m)+' проставлена');
};
ST.closeUI = () => ST.layerUI(MY_LAYER);
/* Перезакрытие спрашивает распоряжение ФОРМОЙ, а не подразумевает его: поле, которое нельзя не заполнить, — единственный способ не дать перезакрыть период молча. */
ST.reopenUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  const m = g('reMonth');
  act(ST.reopenPeriod(m, {no: g('reOrder'), basis: g('reBasis')}, g('closeWho')),
    'период '+monLabel(m)+' перезакрыт: колонки сняты сверху вниз, строки расфиксированы, выпуски помечены');
};
ST.reopenNoOrderUI = () => act(ST.reopenPeriod((($('#reMonth') || {}).value || ''), null,
  (($('#closeWho') || {}).value || '')));
/* Кнопка ради ОТКАЗА: снять нижнюю колонку, не сняв верхнюю, невозможно — тот же каскад, прочитанный в обратную сторону. */
ST.openLowerUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  act(ST.openLayer(g('reMonth'), BASE_LAYER, {no: g('reOrder'), basis: g('reBasis')}, g('closeWho')),
    'колонка «'+BASE_LAYER+'» снята: период открыт');
};
ST.closeNoActorUI = () => act(ST.closePeriod(ST.openPeriod(), ''));
/* Молчание НА ДОСПРОСЕ достижимо руками по тому же доводу, что и молчание в ночь: без кнопки второй рубеж закрытия остался бы словом в проверке. */
ST.closeMuteUI = () => {
  const nb = ($('#silentNb') || {}).value || '', why = ($('#silentWhy') || {}).value || '';
  const s = {}; s[nb] = why;
  act(ST.closePeriod(ST.openPeriod(), ($('#closeWho') || {}).value || '', s));
};

function viewJournal(){
  const st = ST.state;
  /* ФОКУС ИЗ ПАСПОРТА: пришли по дороге «как получено» — журнал открывается на той самой ночи и говорит об этом вслух. */
  const runs = st.runs.slice().sort((a,b) => b.date.localeCompare(a.date)).map(r => '<tr'+
    (r.date === st.runFocus ? ' class="focus"' : r.kind === 'пропуск' ? ' class="out"' : '')+'>'+
    '<td>'+fmt(r.date)+'</td>'+
    '<td>'+(r.kind === 'пропуск' ? '<span class="pill err">пропуск</span>' :
      r.kind === 'внеплановый' ? '<span class="pill warn">внеплановый</span>' :
      r.kind === 'защёлка' ? '<span class="pill ok">доспрос защёлки</span>' :
      /* Догон и повторное открытие — свои виды записи, и журнал их называет, а не выдаёт за плановую ночь. */
      '<span class="pill ok">'+esc(r.kind)+'</span>')+'</td>'+
    '<td>'+esc(r.actor || '—')+'</td>'+
    /* Кто молчал в эту ночь — реквизит ПРОГОНА, и в журнале он стоит рядом с причиной внепланового: обе колонки отвечают на один вопрос «почему эта ночь такая». */
    '<td>'+esc(r.reason || '')+(r.silent ? ' <span class="pill warn">не ответил: '+
      esc(Object.keys(r.silent).map(nb => nb+' — '+r.silent[nb]).join(' · '))+'</span>' : '')+'</td>'+
    '<td class="num">'+(r.written || '—')+'</td>'+
    '<td>'+(ST.isClosed(r.date) ? '<span class="pill ok">зафиксирован</span>' : '<span class="pill neutral">открыт</span>')+'</td>'+
    /* СОСТАВ КАНДИДАТОВ — реквизит прогона, а не число в логе: без разбивки по четырём источникам «кандидатов не было» неотличимо от «опрос не состоялся», и ночь, прошедшая мимо половины портфеля, выглядела бы удачной. */
    /* ДОСПРОС стоит в ТОЙ ЖЕ колонке, что и состав кандидатов, и это не экономия места: обе строки отвечают на один вопрос — кого эта ночь спрашивала. */
    '<td class="small">'+(!r.cand ? '<span class="muted">—</span>'
      : r.cand.scan === 'полный'
        ? '<span class="pill ok">обход полный</span><br><span class="small muted">'+esc(r.cand.why || '')+'</span>'+
          (r.repoll ? '<br>'+(r.repoll.done
            ? '<span class="pill ok">доспрос: дописал '+r.repoll.made+' · переписал '+r.repoll.again+'</span>'+
              (r.repoll.nbs.filter(n => !n.final).length
                ? '<br><span class="pill neutral">предварительно ответили: '+
                  esc(r.repoll.nbs.filter(n => !n.final).map(n => n.name).join(' · '))+'</span>' : '')
            : '<span class="pill err">доспрос не отвечен: '+
              esc(r.repoll.nbs.filter(n => !n.ok).map(n => n.name+' — '+n.reason).join(' · '))+
              '</span><br><span class="small muted">строки не тронуты: опрос идёт прежде записи</span>') : '')
        : '<b>'+r.cand.n+'</b> <span class="muted">кандидатов, с '+fmt(r.cand.from)+'</span><br>'+
          CAND_SRC.filter(k => r.cand.by[k]).map(k => '<span class="pill '+
            (r.cand.first[k] ? 'ok' : 'neutral')+'">'+esc(k)+' '+r.cand.by[k]+
            (r.cand.first[k] !== r.cand.by[k] ? ' <span class="muted">(впервые '+r.cand.first[k]+')</span>' : '')+
            '</span>').join(' ')+
          ((r.cand.polls || []).filter(p => p.degraded).length
            ? '<br><span class="pill warn">обойдены полностью: '+
              esc(r.cand.polls.filter(p => p.degraded).map(p => p.nb+' — '+p.scanned).join(' · '))+'</span>'
            : '')+
          (r.cand.moved.length ? '<br><span class="pill warn">курс менялся: '+
            esc(r.cand.moved.join(', '))+'</span>' : ''))+'</td>'+
    /* Состав прогона называет и НЕИЗМЕНИВШИХСЯ: «строк — 0» при разрежённом хранении значит и «всё как вчера», и «писать не дали», и «никто ещё не родился», а это три разных события. */
    '<td class="small">'+((r.parts || []).length
      ? r.parts.map(x => esc(x.name)+' <b>'+x.n+'</b>'+
          (x.same ? ' <span class="muted">(без изм. '+x.same+')</span>' : '')+
          (x.have ? ' <span class="muted">(уже есть '+x.have+')</span>' : '')+
          ((x.rewrote || []).length ? ' <span class="pill warn">переписано '+x.rewrote.length+
            ': '+esc(uniq([].concat.apply([], x.rewrote.map(w => w.fields))).map(id =>
              (REC(id) || {}).name || id).join(', '))+'</span>' : '')+
          /* «Неполных» и «дозаполнено» стоят ПОРОЗНЬ и порознь считаются: первое — состояние ночи, второе — её работа. */
          (x.partial ? ' <span class="pill warn">неполных '+x.partial+'</span>' : '')+
          ((x.filled || []).length ? ' <span class="pill ok">дозаполнено '+x.filled.length+
            ': '+esc(uniq([].concat.apply([], x.filled.map(w => w.fields))).map(id =>
              (REC(id) || {}).name || id).join(', '))+'</span>' : '')+
          /* «Пропущено» и «без изменений» стоят ПОРОЗНЬ: первое — «не смотрели вовсе», второе — «посмотрели, и состояние прежнее». */
          (x.skip ? ' <span class="pill neutral">не обойдено '+x.skip+'</span>' : '')+
          (x.kept ? ' <span class="muted">(+'+x.kept+' зафикс.)</span>' : '')).join(' · ')
      : '<span class="muted">—</span>')+'</td>'+
    '</tr>').join('');
  /* Строка календаря показывается СТРОКОЙ С КОЛОНКАМИ: одна пилюля «зафиксирован/открыт» не отвечает на вопрос, до какого слоя доехало закрытие мая и чья фамилия в каждой колонке — а именно это и есть состояние периода. */
  const months = st.periods.map(p => {
    const w = ST.periodBlockers(p.month);
    const cells = LAYERS.map(L => {
      const l = p.latches[L];
      const who = l ? l.by.split(', ') : null;
      /* Повторная простановка ВИДНА в колонке: без номера распоряжения «май закрыт 12 сентября» читается как опоздавшее первое закрытие. */
      /* Легаси-колонку ставил ВЫПУСК, а не человек по порядку закрытия, и зелёная пилюля рядом с фамилией главбуха сказала бы, что это одно и то же действие. */
      return '<td>'+(l ? '<span class="pill '+(l.legacy ? 'neutral' : 'ok')+'">'+esc(who[0])+'</span><br>'+
        '<span class="small muted">'+esc(who.slice(1).join(', '))+' · '+fmt(l.at)+'</span>'+
        (l.order ? '<br><span class="pill warn">повторно · '+esc(l.order)+'</span>' : '')
        : '<span class="pill neutral">пусто</span>')+'</td>';
    }).join('');
    return '<tr>'+'<td>'+esc(monLabel(p.month))+
      (p.legacy ? ' <span class="pill neutral">легаси · пришёл закрытым</span>' : '')+'</td>'+cells+
      '<td class="num">'+st.rows.filter(r => periodOf(r.date) === p.month).length+'</td>'+
      '<td>'+(w.warnings.length ? '<span class="pill warn">'+esc(w.warnings.join(' · '))+'</span>' : '—')+
      ' <span class="muted">блокировок: '+w.blockers.length+'</span></td></tr>';
  }).join('');
  /* Легаси объясняется НА ТОМ ЖЕ ЭКРАНЕ, где календарь: шесть периодов, пришедших закрытыми и не закрывавшихся никем, — первая странность, которую человек встречает в этом справочнике, и без объяснения рядом она читается как чужое самоуправство. */
  const leg = ST.legacyLoad();
  const legCard = !leg ? '' : (function(){
    const lm = leg.months[leg.months.length - 1], ld = leg.dates[leg.dates.length - 1];
    const who = 'Осмонова Г., главный бухгалтер';
    const ord = {no: 'РП-118 от 12.09.2026', basis: 'акт сверки № 41 от 14.07.2026'};
    const doors = [
      ['Проставить колонку «'+BASE_LAYER+'»', ST.closeLayer(lm, BASE_LAYER, who, st.today)],
      ['Открыть период распоряжением', ST.openLayer(lm, BASE_LAYER, ord, who)],
      ['Перезакрыть период (ADR-0216)', ST.reopenPeriod(lm, ord, who)],
      ['Пересчитать прогоном за '+fmt(ld), ST.run(ld)]
    ];
    /* Перечень собранного печатается ИМЕНАМИ, а не счётом: «6 из 135» отвечает на вопрос «много ли потеряно», но не на вопрос «есть ли в истории то, что мне нужно», — а спрашивают именно второе. */
    const forms = Object.keys(leg.form).map(objId => {
      const o = OBJ(objId), f = leg.form[objId], all = f.dims.concat(f.inds);
      return '<li><b>'+esc((o || {name: objId}).name)+'</b> — форма легаси собирала <b>'+
        all.length+'</b> величин из <b>'+(o ? storedDims(o).length + o.inds.length : '?')+
        '</b>, объявленных объектом сегодня: '+
        all.map(id => '«'+esc((REC(id) || {}).name || id)+'»').join(', ')+
        '. Остальные <b>отсутствуют ключом</b>, а не лежат нулём.</li>';
    }).join('');
    return '<div class="card"><h3>Легаси-итоги: история, собранная не этим модулем</h3>'+
      '<div class="banner info"><b>'+esc(leg.by)+'</b> · '+esc(leg.act)+' · '+fmt(leg.at)+'<br>'+
      'Строк — <b>'+leg.rows+'</b> на '+leg.dates.length+' отчётных дат ('+
      esc(fmt(leg.dates[0]))+' … '+esc(fmt(ld))+'), периодов — <b>'+leg.months.length+
      '</b>, и каждая строка пришла <b>уже окончательно зафиксированной</b>. Граница — '+
      '<b>дата запуска '+fmt(leg.launch)+'</b>, объявленная один раз.</div>'+
      '<ul class="note">'+forms+'</ul>'+
      '<table class="cgrid"><thead><tr><th>Что пробуем сделать с '+esc(monLabel(lm))+
      '</th><th>Что отвечает модуль</th></tr></thead><tbody>'+
      doors.map(x => '<tr><td>'+esc(x[0])+'</td><td>'+(x[1].ok
        ? '<span class="pill ok">выполнено</span>'
        : '<span class="pill err">отказ</span> <span class="why">'+esc(x[1].why)+'</span>')+
        '</td></tr>').join('')+'</tbody></table>'+
      why('Отказов <b>четыре разных на четыре двери</b>, и это не педантизм: один '+
      'общий «нельзя» отправил бы человека искать недостающее право — и он бы его нашёл. '+
      'Дорога у трёх из четырёх одна и названа в самом отказе — <b>новый выпуск миграции</b> '+
      'с журнальной записью, актор там человек. Прогон легаси не видит <b>по построению</b>, '+
      'а не фильтром: очередь строится по <b>миру</b>, а КД-2019/017 и КД-2021/044 в мире не '+
      'существуют — они погашены до запуска. Подстановка «на дату» через границу <b>не '+
      'переносит ничего ни в одну сторону</b>.<br>'+
      'Число из легаси-строки узнаётся <b>в паспорте ответа</b>, и <b>в кратком тоже</b>: свод '+
      'по несобиравшейся величине даёт правдоподобный ноль, а плитку видят всегда. Отметка '+
      '«редакции формы разные» стоит <b>на стыке</b>, а не на всём ряде: несопоставима '+
      'конкретная пара соседних точек, и разницу между ними модуль не считает.<br>'+
      '<b>Границы.</b> Легаси-строка <b>не служит основанием заключения</b> — это правило '+
      'живёт у получателя, движком его не проверить. Область видимости на легаси-стороне '+
      'дырява по существу: форма легаси не спрашивала куратора, и аналитику там не видно ни '+
      'одной строки — дыра <b>названа</b> в паспорте, но не закрыта.',
      'почему отказов четыре')+'</div>';
  })();
  const div = ST.divergence('2026-05', 'obj-credit', 'm-debt');
  const divHtml = div.ok && div.shown
    ? '<div class="banner warn"><b>Май 2026 · остаток основного долга.</b><ul>'+
      '<li>зафиксировано <b>'+esc(money(div.fixed,'KGS'))+'</b> — '+esc(ST.fixationOfMonth('2026-05').by)+
      ', '+fmt(ST.fixationOfMonth('2026-05').at)+'</li>'+
      div.corrections.map(c => '<li>есть корректировка за '+esc(monLabel(c.month))+' по '+esc(c.ref)+
        ', учтена '+fmt(c.at)+' · основание: '+esc(c.basis)+'</li>').join('')+
      '<li>сегодняшний пересчёт дал бы <b>'+esc(money(div.today,'KGS'))+'</b></li></ul>'+
      'Прошлое не переписано ни на копейку — но расхождение названо строкой: молчащее расхождение '+
      'читается как ошибка расчёта и стоит доверия ко всему модулю.</div>'
    : '';
  /* Неполнота и здесь ЧИТАЕТСЯ ИЗ СТРОК той же меркой, что в паспорте ответа и в предусловии защёлки: три места — одна мерка, хранимый признак разошёлся бы с колонками на первом же дозаполнении. */
  const partNow = partialNote(st.rows.filter(r => !r.fixed));
  /* Перечень спрашивается у месяца ЭТИХ строк, а не у ближайшего незакрытого: закрытие идёт по порядку, и пока не закрыт июль, отказ по августовским строкам не показался бы вовсе — правило существовало бы только в коде. */
  const blNow = ST.periodBlockers(periodOf(st.today)).blockers;
  /* Экран спрашивает поводы ТОЙ ЖЕ дверью, которой их спросит модуль заданий, а не внутренним счётом: разойдись эти два пути — на экране был бы повод, которого сосед не получит, и спорить о нём стало бы не с чем. */
  const leadsAsk = ST.askLeads('задания', st.today);
  const leadsNow = leadsAsk.ok ? leadsAsk.leads : [];
  /* ---------- КОГО ВОЗЬМЁТ БЛИЖАЙШАЯ НОЧЬ ---------- */
  const cnd = ST.candidates(st.today);
  const pOf = {}; cnd.polls.forEach(p => pOf[p.nb] = p);
  const alive = st.objects.reduce((n, o) => n + (WORLD[o.id] || []).filter(it => {
    /* Рождение дня X видно срезу X+1. */
    const b = bornOn(o, it, st.today); return b != null && b < st.today;
  }).length, 0);
  const pollRows = ST.polls().map(p => {
    const q = pOf[p.nb] || {};
    return '<tr'+(q.degraded ? ' class="out"' : '')+'><td>'+esc(p.name)+'</td>'+
      '<td>'+(p.asks ? '<span class="pill ok">отвечает</span>'
                     : '<span class="pill err">не умеет</span>')+'</td>'+
      '<td>'+(p.T ? fmt(p.T) : '<span class="muted">не спрашивали</span>')+'</td>'+
      '<td>'+(q.ok ? fmt(q.from)+' → '+fmt(q.to) : '<span class="muted">—</span>')+'</td>'+
      '<td class="num">'+(q.ok ? q.named : '—')+'</td>'+
      '<td class="num">'+(q.degraded ? q.scanned : '—')+'</td>'+
      '<td class="small">'+(q.why ? esc(q.why) : '<span class="muted">ответил</span>')+'</td></tr>';
  }).join('');
  const candBody = cnd.full
    ? '<div class="banner info"><b>Обход полный, и вот почему:</b> '+esc(cnd.why)+'</div>'
    : '<table class="cgrid"><thead><tr><th>Множество</th><th>Записей</th>'+
      '<th>Пример: запись и повод попадания</th></tr></thead><tbody>'+
      CAND_SRC.map(k => '<tr><td>'+esc(k)+'</td><td class="num">'+cnd.by[k].length+'</td>'+
        '<td class="small">'+(cnd.by[k].length
          ? '<span class="mono">'+esc(cnd.by[k][0].ref)+'</span> — '+esc(cnd.by[k][0].why || '')
          : '<span class="muted">пусто</span>')+'</td></tr>').join('')+
      '</tbody></table>'+
      '<p class="note">Итого кандидатов <b>'+cnd.n+'</b> — но их '+
      'меньше суммы по множествам: одна запись приходит несколькими путями, и сложить их '+
      'значило бы посчитать её дважды. Живых записей на '+fmt(st.today)+' — <b>'+alive+'</b>: '+
      'остальных ночь не тронет вовсе.</p>';
  const qAll = ST.queue(true);
  const qRows = qAll.length ? qAll.map(x => '<tr'+(x.done ? ' class="out"' : '')+'>'+
      '<td>'+esc((OBJ(x.obj) || {name: x.obj}).name)+'</td>'+
      '<td class="mono">'+esc(x.ref)+'</td>'+
      '<td><span class="pill '+(x.done ? 'neutral' : 'warn')+'">'+esc((x.whys || [x.why]).join(' + '))+'</span></td>'+
      '<td>'+esc(x.by)+' · '+fmt(x.at)+'</td>'+
      '<td class="small">'+esc(x.note || '—')+'</td>'+
      '<td class="small">'+(x.done ? '<span class="pill ok">закрыта</span> '+esc(x.done.how)+
        ' · '+fmt(x.done.at) : '<span class="pill warn">ждёт прогона</span>')+'</td></tr>').join('')
    : '<tr><td colspan="6" class="muted">очередь пуста — и это не то же, что «работа была и сделана»: '+
      'разобранные записи остаются в ней с отметкой</td></tr>';
  const qForm = ST.canAdmin()
    ? '<div class="form-row" style="margin-top:12px">'+
      '<div class="fld"><label>Что поставить</label><select id="qKey">'+
        st.objects.map(o => '<optgroup label="'+esc(o.name)+'">'+

/* Форма ОДНА на обе породы: общая половина спрашивается всегда, вторая раскрывается по выбранной породе. */
const formKind = () => (ST.state.form && ST.state.form.kind) || KIND.IND;
ST.setFormKind = k => { ST.state.form = {kind: k}; render(); };
ST.addRecordUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  const kind = formKind(), src = g('rSrc');
  const spec = {kind, id: g('rId'), name: g('rName'), obj: g('rObj'), src};
  /* Число дат в форме — вопрос, а не галочка: у него есть ответ «не отвечено», и он кончается отказом. */
  const dates = g('rDates'); if(dates) spec.dates = Number(dates);
  if(src === 'шов'){ spec.seam = g('rSeam'); spec.field = g('rField'); }
  else if(src !== 'агрегат'){ spec.key = g('rKey'); }
  /* Колонку запись НАЗЫВАЕТ, а не заводит: основа имени и вид значения. */
  const col = g('rCol'), vt = g('rVtype');
  if(src !== 'агрегат' && !(kind === KIND.DIM && g('rRef'))){ if(col) spec.col = col; if(vt) spec.vtype = vt; }
  if(kind === KIND.IND){
    if(src === 'агрегат'){ spec.fn = g('rFn'); spec.over = g('rOver'); }
    else { spec.type = g('rType'); const u = g('rUnit'); if(u) spec.unit = u; }
    const roll = g('rRoll'); if(roll) spec.roll = roll;
  } else {
    spec.perObject = g('rPer');
    const b = g('rBuckets');
    if(b) spec.buckets = b.split(/[,·]/).map(x => x.trim()).filter(Boolean);
    const ref = g('rRef');
    if(ref && REF[ref]){ spec.ref = ref; spec.owner = REF[ref].owner; spec.levels = clone(DIM('d-branch').levels); }
    const basis = g('rBasis'); if(basis) spec.basis = basis;
    const e = g('rEdges');
    if(e) spec.edges = e.split(/[,·]/).map(x => Number(x.trim())).filter(x => !isNaN(x));
    const ord = g('rOrder'); if(ord) spec.order = ord;
  }
  act(ST.addRecord(spec), 'заведена запись реестра «'+spec.name+'» — порода «'+kind+'»');
};
