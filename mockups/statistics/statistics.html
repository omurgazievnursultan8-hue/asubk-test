<!--
  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Статистика» (TO-BE).
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Прогон собирает строки на дату, закрытие учётного
  периода их фиксирует, три шва отвечают на три вопроса и каждый ответ несёт паспорт,
  детализация сходится со списком реестра, роль сужает множество ДО группировки. Ничего из
  этого не зашито кодом: все десять объектов собраны ИЗ ДАННЫХ, и в сборщике строк
  (buildRow/runFor/readDim/readInd) слова «кредит» нет ни одного.

  Волна 1 (21.08.2026) вывела модель на бумаге: ADR-0145…ADR-0152 плюс канон логики.
  Волна 2 — этот файл: та же модель, доведённая до исполняемого эталона поведения.
  Волна 3 (26.08.2026) добрала шесть механизмов, которых модель требовала, а макет не имел:
  восемь объектов реестра · дерево уровней у разреза · корзины дат · обратный индекс ссылок
  потребителей · краткая форма паспорта · двоичный отказ statRows с дорогой на выгрузку
  (ADR-0176…ADR-0179) и попутно закрыла четыре бывших дефекта макета: даты ряда стали частью
  вопроса (шаг и число точек), фильтр задаётся конструктором со значениями ИЗ СТРОК среза,
  разрез заводится формой с корзинами и владельцем уровней, прогон пишет поимённый состав
  (СС-Д1, СС-Д2, СС-Д3, СС-Д6).
  Волна 5 (27.08.2026) упразднила слово «мера»: единственное имя измеряющей записи —
  показатель (СС-57); поведение не тронуто, поле строки среза meas → inds.
  Волна 6 (27.08.2026) довела объект «Кредит» до ПОЛНОГО состава показателей по правилу
  ADR-0183: показателем становится величина, которую спрашивают о МНОЖЕСТВЕ, — 28 строчных
  и 33 агрегата (было 6 и 7), реестр модуля 37 → 85 записей, прочитаны все пять швов ядра.
  Ступени срока неплатежа заведены КОРЗИНОЙ разреза, а не семью показателями (ADR-0176 §3),
  и оба тождества ТЗ 18 §5.1 — остаток = просрочено + срочно, свод = сумма семи статей —
  держатся в зеркале ядра по построению, а не подгонкой демо-данных (проверка #64).
  Волна 7 (27.08.2026) тем же правилом довела объект «Заёмщик»: 20 строчных показателей и
  16 агрегатов вместо трёх и двух, 13 разрезов вместо шести, реестр модуля 85 → 116 записей.
  Источник у всех — ПОРТФЕЛЬНЫЙ шов ядра (ADR-0174, ADR-0184): шов одного кредита
  показателем заёмщика быть не может, иначе свод считался бы второй раз и вне ядра — форма
  дефекта E2E-09 (ИС-28). Клетка суммы теперь несёт СОСТАВ ПО ВАЛЮТАМ: у договора он из
  одной части, у портфеля — из скольких угодно (проверка #71). Сказанное здесь «и сомового
  эквивалента в строке нет по-прежнему (ИС-15)» ОТМЕНЕНО волной 17 ч.6: сомовая величина
  лежит в строке — но не приложением к валютной клетке, а СВОЕЙ колонкой под именем своей
  записи реестра (ИС-44, ADR-0214 §2). Подгруппа платёжеспособности заведена ОДНИМ разрезом с
  двумя уровнями (группа = первая цифра подгруппы, ADR-0185 §1), свёрнутая величина носит
  своё имя — «Худшая категория», а не «Категория риска» (§2), агрегат стал обязательным у
  числа и суммы и запрещённым у перечисления и булева (§3, ИС-29, проверка #73). Счёт
  объектов другого уровня — вопрос ТОМУ объекту, а не функция `count distinct` здесь
  (ADR-0186, ИС-30, проверка #76). Ведущий куратор ВЫЧИСЛЯЕТСЯ швом кураторства, хранимого
  «ведущего подразделения» не бывает вовсе (ТЗ 16 §3.2, §11, проверка #75).
  Волна 8 (27.08.2026) довела объект «Залог»: 11 строчных показателей и 12 агрегатов
  вместо двух и трёх, 11 разрезов вместо шести. Единственный шовный показатель предмета
  читал `calcDebt` — шов ОДНОГО кредита, — а предмет обеспечивает много кредитов долями:
  требование либо задваивалось по каждому предмету, либо отвечало об одном кредите из
  нескольких. Форма дефекта та же, что ИС-28 запретила заёмщику, но владелец у вопроса
  ДРУГОЙ: множество выбирает junction ОТНЕСЕНИЕ_ЗАЛОГА, долю в нём знает только залог —
  и потому портфельный шов здесь залоговый, а не ядра (ADR-0190 §1, ИС-31). Обеспечиваемые
  требования взвешены долей предмета в обеспечении кредита, и потому их сумма по предметам
  сходится с суммой под риском обеспеченных кредитов, а не удваивает её (проверка #79).
  Обеспеченность заведена у КРЕДИТА и двумя показателями — обеспечение и сумма под риском
  (ADR-0011: остаток ОД плюс неосвоенная часть); самого индекса в строке нет, отношение
  считается при чтении (ИС-32, проверка #82). Порог — функция состава: 120 % ликвидному,
  150 % и доля ликвида ≥ 80 % движимому неликвидному (Р-1, разрезы «состояние
  обеспеченности» и «требуемый порог»). Периодичность обследования — матрица «группа
  платёжеспособности × движимое/недвижимое» (Р-3), банкрот — по договору со
  спецадминистратором. У предмета своя валюта оценки (ADR-0009) и своя дата принятия:
  «валютой договора» и «датой залогового договора» вещь не режется — после перезалога
  договоров у неё много (ИС-21, проверка #81).
  Волна 9 (28.08.2026) закрыла дефект, доживший до восьмой волны: прогон обходил множество
  целиком, не спрашивая, СУЩЕСТВОВАЛ ли объект на дату. Срез от 31 мая показывал все 14
  погашений, датированных июнем–августом, «платежей за июль» разностью составов выходило
  14 − 14 = ноль, а сверка с реестром владельца сходилась — на неверном числе с обеих
  сторон. Рождение стало ОБЪЯВЛЕННЫМ реквизитом объекта (`born`), читается тем же
  читателем, что разрез и показатель-поле, и объект без него не заводится вовсе; смерть при
  этом — состояние, а не пропажа строки (ADR-0197, ИС-33, проверки #86–#90).
  Волна 10 (28.08.2026) развела дело и требование. Дело несло фазу взыскания, сумму
  требований и «дней в фазе» — три многозначные на дату величины: у дела фаза не одна,
  потому что иск к заёмщику подан, а к поручителю ещё нет. Много значений на дату означает
  не разрез, а нижележащий объект (ИС-21) — фаза и сумма переехали ТРЕБОВАНИЮ, рабочей
  единице модуля (ADR-0002, ADR-0022), а дело осталось тонким отрезком работы с расходами
  по взысканию — единственной денежной статьёй, которой оно владеет (ADR-0004, ADR-0198).
  Требований на один кредит бывает несколько — заёмщик, поручитель, залогодатель, — и они
  обслуживаются в РАЗНЫХ филиалах. Строка каждого честно показывает полную сумму: её и
  правда взыскивают с этого лица. Поэтому у показателя объявлен ДЕДУП-КЛЮЧ «Кредит
  требования», схлопывание идёт перед агрегатом на каждом узле дерева, и сумма филиалов
  итогу НЕ РАВНА — 14 713 601,96 против 8 019 786,56, — а паспорт ключ называет поимённо
  (ADR-0199, ИС-34, проверки #91–#93). Представителем ключа берётся наибольшая величина:
  солидарные требования — проекции одного долга (ADR-0004), и складывать часть с целым
  значит посчитать часть дважды. Удельная величина («в среднем на куратора») показателем
  не заводится вовсе: это пара «срез + счёт», и знаменатель, снятый со среза, занижен
  систематически — у кого ноль строк, тот в срез не попадает (ADR-0200, ИС-35, #97–#98).
  Попутно закрыт СС-Д9: платёж НАЗЫВАЕТ свой кредит, «погашено всего» стало суммой
  платежей, и приращение за период равно их сумме до копейки на каждом договоре — два ряда
  одних денег стали одним (проверка #99).
  Волна 11, часть первая (28.08.2026) сняла последнее расхождение макета с моделью — СС-Д8.
  Фильтр был ОДНОУСЛОВНЫМ: один разрез, одно значение, — а `ADR-0180` объявил его ДНФ без
  скобок: наборы через ИЛИ, сравнения внутри набора через И. «Валютные кредиты с просрочкой
  свыше 100 дней ЛИБО все чуйские» одним условием не спрашивается вовсе, и прототип отвечал
  на вопрос проще заданного. Теперь операнд — разрез ИЛИ мера СТРОКИ (агрегат отбит: у него
  нет значения в строке), правая часть всегда КОНСТАНТА (показатель против показателя — это
  показатель реестра, §3), оператор берётся от ТИПА значения, а у разреза с корзинами
  правая часть — корзина, не сырая дата. Денежная константа несёт свою валюту и меряется
  частью того же состава, без пересчёта: курса отбора нет, и он не курс показа
  (ADR-0184 §3, СС-Д4). Три отказа §8 — пустой набор, «∈» с пустым списком, «∈» во весь
  домен — все про сравнение, которое ничего не сужает, но в паспорте выглядело бы фильтром.
  Проверка формы живёт в checkQuery и достаётся всем трём швам даром, проверка домена — за
  ролью, поэтому «весь домен» у аналитика и у администратора решается по-разному. Один и
  тот же набор читают срез, ряд, строки, период и реестр владельца, а паспорт печатает его
  ЦЕЛИКОМ: «фильтр задан» и «+2 условия» — ответ без вопроса (проверки #100–#110).
  Волна 11, часть вторая (28.08.2026) впервые не дописала мер, а РАЗДЕЛИЛА объект.
  «Погашение» несло сумму поступления, возврат плательщику и нераспределённый остаток —
  величины про МНОЖЕСТВО платежей, а не про платёж. На сводном поступлении (ПП-2026/0733:
  одни деньги на два кредита в двух подразделениях) каждая сложилась бы дважды — та самая
  форма дефекта, которую волна 8 нашла у обеспечения (ИС-28, ИС-31), а многозначное на дату
  поднимает уровень, а не сплющивается в клетку (ИС-21, ADR-0198). Объектов стало десять:
  ПЛАТЁЖ — запись владельца, часть поступления, привязанная к кредиту (ТЗ 14 §2.1), и
  ПОСТУПЛЕНИЕ — деньги, пришедшие одним документом. Платёж разрезан ДВАЖДЫ одной суммой:
  пятью статьями (ADR-0087) и двумя слоями (ADR-0043) — семь именованных клеток шва, а не
  матрица 5×2 (ADR-0183 §2, §3); основной долг своей формулы не имеет, он РАЗНОСТЬ (ИС-1).
  Инвариант поступления — сумма = платежи + возврат + нераспределённое (ТЗ 14 §2.2) — держится
  на каждой из 15 строк. Разрезов «Кредит», «Подразделение», «Куратор» и «Территория» у
  поступления НЕТ: они приходят от кредита, а кредитов у сводного поступления несколько.
  «Невыясненное» заведено ФИЛЬТРОМ по мере строки, а не булевым разрезом (ADR-0185 §1); три
  оси ТЗ 14 §3.1 разведены и читаются из истории; дата платежа НАСЛЕДУЕТСЯ от поступления
  (§7.1). Решения СС-105…СС-111. Открыт СС-Д11: объект без разреза охвата молча пустеет под
  ролью вместо отказа (ИС-24, проверки #111–#120).
  Волна 12 (28.08.2026) взяла три последних ТОНКИХ объекта — тонкий не «маленький», а
  НЕДОСПРОШЕННЫЙ: реестр обещает величину, которой у владельца нет, либо сплющивает в одну
  клетку то, что владелец различает. Правило ADR-0201 дало трём записям три разных ответа.
  «Задание кураторства» СНЯТО — владельца, отдающего множество, у него не нашлось:
  кураторство отказывается от заданий дословно и держит их СОСЕДЯМИ (ТЗ 16 §1.1, §15),
  своего ТЗ и места в очереди у заданий нет, а ФО-20 — одна из пяти форм, спрос на которые
  ещё спрашивается у заказчика (каталог §9 п. 4, письмо 26.08.2026, вопрос 2). Заводить
  объект под то, чего владелец не отдаёт, значит строить второй источник — это уже решено
  про «Статью долга» (ADR-0183, «Отвергнуто»). Снятие — такая же строка реестра, как
  заведение (ИС-18), и спрос отвечает ОТКАЗОМ, а не пустотой (ИС-24).
  У «Кредитной программы» сняты ОБЕ меры строки: лимита не заводит ни один владелец — это
  заявка владельцу, а не выдуманное поле (ADR-0150 §3), — а освоение принадлежит траншу и
  кредиту (ТЗ 06). «Выдано по программе» собирается СРЕЗОМ КРЕДИТА по новому разрезу
  «Кредитная программа»; полем программы оно было бы вторым источником тех же денег
  (ИС-1, ИС-28). Разреза «Куратор» у программы нет и быть не может: «ответственные
  сотрудники» — поле lookup (multi) (ИС-21). Объект БЕЗ ЕДИНОЙ меры строки законен: правило
  запрещает недобор и набор впрок, а не малый состав — остались девять разрезов и число.
  «Мера взыскания» ДОБРАНА: три оси ТЗ 13 §9.1 были схлопнуты в один «результат», а вид
  результата, стадия исполнения и результат независимы попарно и в обе стороны; доставка и
  состояние (сторно, И-3) читаются из истории; заведён дедуп-ключ «Кредит меры» — в итоге
  долг считается один раз (§12.1), и сужение по состоянию не вычитает свою сумму, а МЕНЯЕТ
  представителя ключа (7 462 000 → 4 002 000). Срок должника течёт от НАПРАВЛЕНИЯ и
  невручением не отменяется (§9.2) — швом measureClock, потому что число дней растёт само
  (ADR-0183 §4). Десять разрезов и шесть показателей вместо шести и двух.
  Попутно закрыт СС-Д13: max/min/avg по набору, где выбирать не из чего, отвечали НУЛЁМ —
  «наибольший срок с направления 0 дн.» читается как «сегодня направили», хотя направления
  не было вовсе. Выбор из пустого — прочерк, а не ноль (ИС-19); сумма и количество нулём
  остаются. И заведён-закрыт СС-Д14: волна сама поставила «Дату начала действия программы»
  под уже занятым идентификатором «Дата платежа» — поиск отдавал первую запись, вторая
  становилась недостижимой. Форма заведения занятый идентификатор отбивала всегда (#46), а
  ЗАГРУЗКУ реестра не сторожил никто; теперь сторожит. Реестр модуля 175 → 171 запись,
  объектов 10 → 9 (проверки #121–#127).
  Волна 13 (29.08.2026) завела ДЕСЯТЫЙ объект — «Залоговый договор» — и закрыла тем самым
  единственную дыру, которую реестр носил молча: разрез «Дата залогового договора» (ТЗ #4)
  не принадлежал НИ ОДНОМУ объекту с волны 8, а §10.1 считала параметр исполненным. Сирота
  разреза — не мелочь оформления: спросить по нему было не у кого, то есть параметр ТЗ был
  закрыт на бумаге и открыт в модуле. Сторожит теперь проверка #128: разрез или показатель,
  на который не ссылается ни один объект, валит реестр на ЗАГРУЗКЕ — тот же урок, что дал
  СС-Д14 про занятые идентификаторы. Объект тонкий по составу и полный по спросу (ADR-0183):
  один разрез, одно число, ни одной меры строки — и это законно (ADR-0201 §3), потому что
  суммы по договору залог не отдаёт. Решения СС-119…СС-124, дефект СС-Д15 заведён и закрыт (проверки #6, #128).
  Волна 14 (29.08.2026) отняла у вопроса «сегодня». Список дат был КОНСТАНТОЙ файла — семь
  дат при пяти прогонах, — и умолчанием вопроса стояла сегодняшняя: модуль по умолчанию
  спрашивал дату, на которую не написано ни одной строки, а ИС-12 подставляла последний
  прогон и называла возраст. Возраст назван честно — и ответ всё равно не о том. Дыра в
  прошлом ОКОНЧАТЕЛЬНА: прогона за 19.08 не будет уже никогда, лучшего ответа, чем 18.08,
  не существует, и подстановка там — лучшее, что есть. Хвост — не дыра, а ещё не написанные
  строки: тот же вопрос с теми же параметрами завтра даст другое число, и первое окажется
  не неверным, а не о том. Поймать это нечем — оба ответа честны, и оба несут паспорт.
  Спрашиваемых дат теперь ровно столько, сколько ПРОГОНОВ написали строки объекта (ИС-36,
  ADR-0202); константы дат в файле нет вовсе — список дат вопроса ЕСТЬ журнал прогонов.
  Дата за последним прогоном — отказ, и отказ называет три вещи: последний прогон,
  записанный пропуск за спрошенную дату, если он был, и дорогу — «как сейчас» отвечает
  реестр владельца (§8.4), у которого множество живое, а не написанное ночью. «Сегодня»
  из вопроса не изгнано как день: после своего прогона оно спрашивается наравне со всеми
  (проверки #32, #131). Ворота стоят в checkQuery — их даром получают срез, ряд, строки и
  выгрузка — и отдельно у потока, который checkQuery не зовёт. Журнал у каждого объекта
  свой: смена объекта приводит дату вопроса к его последнему прогону, а не переносит чужую.
  В демо-мир добавлен прогон 20.08 — без него единственная дыра лежала бы в хвосте, и два
  разведённых волной случая было бы не на чем показать. Решения СС-125…СС-131
  (проверки #11, #20, #32, #129–#131).
  Волна 17 ч.3 (30.08.2026) дала разрезу ВОСЬМОЙ реквизит — объект определения (ИС-40,
  ADR-0206). Имя разреза называет признак и молчит о том, ЧЕЙ он: «область» у заёмщика своя
  (регистрация субъекта), у кредита своя (область выдачи), и для человека из Оша, взявшего
  кредит в бишкекском филиале, это РАЗНЫЕ значения. Пока в реестре лежала одна запись
  «Территория», система выбирала трактовку молча — и выбирала разную в разных местах: срез
  кредитов, отфильтрованный «по области», расходился со срезом заёмщиков, расхождение
  выглядело арифметической ошибкой, а было двумя разными фильтрами под одним именем. Это
  хвост §15 п. 4 канона, и закрыт он не подписью в отчёте, а реестром: шесть многообъектных
  признаков разведены на 26 записей с уточнёнными именами («Территория выдачи кредита» ·
  «Территория заёмщика» · «Территория предмета залога» и так далее), разрезов стало 61 → 81.
  Справочник значений при этом ОДИН: совпадают владелец, ref и уровни — дублируется запись
  реестра, а не иерархия (ADR-0206 §5, ADR-0176 §7). Одноимённых записей в реестре нет ни
  при каких объектах, и правило одно на обе породы (§6): показатели «Расходы по взысканию,
  итого» кредита и дела, «Ближайший платёж — минимум дней» кредита и заёмщика, а также
  «Обеспечиваемые требования» залога и поручительства получили свои имена. Сложение по
  разрезу законно только внутри его объекта, а сверка срезов по разнообъектным разрезам —
  операция ЗАПРЕЩЁННАЯ, а не подозрительная: чужой разрез отбивают все пять дверей и в
  группировке, и в фильтре, и отказ называет свою запись на спрошенном объекте. Сторож #70
  сохранён и усилен: тождество сумм по «кредиту» и по «заёмщику» держится, ПОКА фильтры
  применены к одному объекту, и теперь это видно из имён, а не выясняется из расхождения
  чисел. Проверки #148–#154; на экране «Реестры» объект определения стоит колонкой.
  Волна 17 ч.4 (30.08.2026) собрала запись реестра ЦЕЛИКОМ (ИС-43, ADR-0209): реестр ОДИН,
  запись объявляет свою ПОРОДУ — показатель или разрез, — и порода определяет набор
  обязательных реквизитов. До этой волны реквизиты прирастали поштучно и в разных решениях
  (источник — ADR-0150, свод — ADR-0174, уровни и корзины — ADR-0176, дедуп — ADR-0199,
  исчислимость — ADR-0159, объект определения — ADR-0206), и ни одно не сказало, ЧЕМ запись
  является целиком. Обязательность была свойством ДВЕРИ, а не породы: `addDim` успел спросить
  объект определения, `addIndicator` — нет, и жила эта разница до дня, когда её заметили.
  Теперь кладовая одна (`st.registry`, 369 записей: 285 показателей и 84 разреза — из
  показателей 171 своя запись и 114 сомовых близнецов, заведённых волной 17 ч.6),
  `IND`/`DIM` — чтение ОДНОГО хранилища с
  проверкой объявленной породы, а `st.indicators`/`st.dims` ничего не хранят: это виды.
  Проверка одна на обе породы, список реквизитов закрыт с обеих сторон — реквизит чужой
  породы отбивается по имени (единица у признака, иерархия у числа), формулы нет НИ У ОДНОЙ
  породы, и корзина исключением не является. «Дней просрочки» и «Срок неплатежа» — две
  записи об одной величине: разрез называет показатель своим ОСНОВАНИЕМ и держит границы в
  реестре, а не в настройке отчёта. Переезд породы стал рядовой правкой реквизита: запись та
  же, идентификатор тот же, история дописывается, реквизиты прежней породы снимаются
  поимённо. Запись не удаляется, а ПРЕКРАЩАЕТ ДЕЙСТВИЕ с даты, потому что схему витрины
  порождает реестр: колонка на запись, только `ADD COLUMN`, только nullable, всегда в
  журнал, обратного хода нет. Экран «Реестры» стал ОДНОЙ таблицей с колонкой породы и ОДНОЙ
  формой, вторая половина которой раскрывается по выбранной породе. Проверки #155–#164.
  Волна 17 ч.5 (30.08.2026) закрыла вопрос, что вообще годится в колонку (ИС-47, ADR-0220):
  запись объявляет, СКОЛЬКО ДАТ СРЕЗА нужно, чтобы величину вычислить, и вопрос этот
  проверяется до заведения. Одна дата — законная колонка; две и больше — отказ всегда,
  потому что строка принадлежит одной дате, а двухдатное число не принадлежит ни одной из
  них и вдобавок зависело бы от СОСЕДНЕЙ строки, которой при разрежённом хранении может не
  быть (ADR-0147, ADR-0215). До этой волны многодатность угадывалась списком подстрок в
  имени — он пропускал «темп роста портфеля» и «миграцию из категории в категорию» и отверг
  бы законную величину, случайно назвавшуюся похоже. Список остался, но честно назван тем,
  чем был: запретом ПРЕДСТАВЛЕНИЯ (доля и «процент от» считаются при показе на одной дате,
  ИС-15), а «дельта» и «прирост» из него ушли — они отвергаются по числу дат. Третьим в том
  списке стоял «сомовый эквивалент» — волна 17 ч.6 ОТМЕНИЛА это: он больше не представление
  вовсе, а запись реестра, и заявка «Сомовый эквивалент …» заводится наравне со всеми
  (ИС-44, ADR-0214 §2). В запрете осталось две причины из трёх.
  Отказ называет АДРЕС: одна пара дат внутри выпуска — графа изменения отчёта (ADR-0218),
  ряд по многим датам — обзор анализа (ADR-0155). Породой правило не обходится: третьей
  породы нет, а переезд породы проверяется тем же валидатором. Проверки #165–#169.
  Волна 17 ч.6 (30.08.2026) развела ДВА показателя, которые прежде считались одним с
  оговоркой (ИС-44, ADR-0214): сумма в валюте договора и сумма в сомах — разные величины с
  разными именами, и сомовая — полноправная запись реестра, материализованная колонкой
  замороженной строки. До этой волны сомовая сторона жила ПОКАЗОМ: `ST.somOf` умножал
  клетку на курс при рисовании, свод разновалютного множества молча складывал части через
  курс, и оба числа выходили под ОДНИМ именем — «Сумма остатка ОД» значила то валюту
  договора, то сом, смотря кто спросил. Из-за этого сомовую величину нельзя было ни назвать
  в отчёте, ни поставить в состав, ни прекратить датой, ни сверить: курс, по которому она
  получена, нигде рядом не лежал. Теперь пересчёт живёт в ОДНОМ месте — `CORE.toSom` в
  ядре-зеркале, — правило округления объявлено там же и ровно один раз (`CORE.SOM_ROUNDING`,
  ADR-0214 §6), а САМА ЗАПИСЬ реестра на него ССЫЛАЕТСЯ реквизитом `round`: денежная
  величина, у которой не спрошено, по какому правилу она округляется, не заводится вовсе,
  а неизвестное правило отбивается перечислением объявленных. Ядро округляет по названному
  в записи правилу и точность берёт из объявления, а не из литерала; свод, поток и
  расхождение правило НАСЛЕДУЮТ от показателя-основания, как наследуют тип и единицу, и
  своего не заводят. Не будучи закреплённым за записью, правило и оказывалось в трёх местах
  разным — копеечная разница двух отчётов об одном и том же, разбирать которую было нечем.
  Денежный ответ ядра несёт обе стороны сразу. Витрина сомовое число НЕ
  СЧИТАЕТ, она его ПИШЕТ. Близнец порождается механически и в одном месте — на сборке
  реестра и в двери заведения (`declareTwin`): те же проверки, тот же `normRec`, та же
  дверь в схему витрины; близнец кладётся сразу за своей записью и в реестр, и в состав
  объекта, а над денежным агрегатом, чей `over` получил близнеца, встаёт близнец над
  близнецом. Валютная запись при этом ОБЪЯВЛЯЕТ свою неаддитивность реквизитом:
  `roll:'формульный'` плюс обязательный `rollBy` — разрез валюты СВОЕГО объекта, — и свод
  такой записи по разновалютному множеству не число, а отказ, называющий и причину, и
  АДРЕС: сомовую запись, аддитивную всегда. По одновалютному множеству та же запись
  по-прежнему отвечает числом в его валюте. Курс и дата курса лежат в строке рядом с
  сомовым числом, и сторож перемножает их, не выходя из строки. Реестр вырос 252 → 369
  записей; трём объектам (дело, требование, мера взыскания) заведён СВОЙ разрез валюты —
  без него назвать разрез свода было нечем. Пара входит в реестр ЦЕЛИКОМ: не прошедшая
  проверку сомовая сторона отбивает и валютную — половины пары в реестре не остаётся.
  Проверки #170–#183; заодно по факту пересчитаны #1 и #120 и обновлена обстановка
  у #23–#25, #38, #40, #41, #65, #67, #69, #78, #93, #96, #111, #119, #126.
  Смоук: `node scripts/inspect/statistics-check.mjs`.

  Волна 17 ч.7 (31.08.2026) сделала запись РАЗРЕЖЁННОЙ (ИС-45, ADR-0215). Атом хранения не
  тронут — это по-прежнему строка объекта на дату (ADR-0147 §1), — изменилась ПЛОТНОСТЬ.
  До этой волны прогон писал строку каждому живому объекту каждый день, и большинство этих
  строк были дословной копией вчерашней. Копия вчерашнего дня не удостоверяет ничего: она
  не отвечает «на такое-то число было столько», она повторяет вчерашнее теми же словами, —
  а место занимает наравне с настоящей и в журнале выглядит работой. Хуже того, она лгала
  обратной стороной: раз строка есть на каждый день, отсутствие строки читалось как
  «объекта не было», и отличить «не менялось» от «нет данных» стало нечем. Теперь строка
  появляется, КОГДА ЧТО-ТО ИЗМЕНИЛОСЬ, а ответов паспорт различает ТРИ вместо двух:
  написано на эту дату · не менялось с такой-то (строки нет, значение действует) · нет
  данных (подстановка с возрастом и причиной, ИС-12). Второй ответ НЕ красится тревогой:
  «не менялось» — полноценный ответ, а не оговорка. Читают разрежённость все швы ОДНОЙ
  дверью (`rowsAsOf`, перенос последнего состояния каждой ссылки вперёд): достаточно
  одному шву взять строки по дате, чтобы один вопрос получил два разных ответа, и оба
  «правильных», — поэтому `rowsAt` остался, но только как МЕРА ПЛОТНОСТИ, и в ответы не
  ходит. Закрытие периода МАТЕРИАЛИЗУЕТ плотный слепок на дате закрытия (§4): наружу
  уходит month-end, и он обязан быть строкой, а не выводом читателя — у получателя числа
  нашего движка нет. Порядок внутри двери обязателен: сначала слепок, потом фиксация, —
  иначе дописанные строки легли бы в закрытый период незафиксированными, а починить их
  ИС-8 уже не даст. Промежуточные дни закрытого месяца остаются разрежёнными (§5): они
  никому не сдавались. Перезапись внутри ОТКРЫТОГО периода — событие журнала, называющее
  объект, ссылку и ПОЛЯ (§6); перезаписанных ЗНАЧЕНИЙ журнал не хранит — иначе рядом с
  историей строки завелась бы вторая история. Показатель, объявленный посреди открытого
  периода, заполняет ПРОГОН, а не дверь реестра (§7): новая колонка есть изменение
  состояния строки; за закрытые периоды величина остаётся прочерком, потому что задним
  числом её не существовало. И фиксация стала свойством ПЕРИОДА ОТВЕТА, а не набора строк:
  ответ на открытую дату собирается теперь из перенесённых строк, часть которых лежит в
  закрытых периодах, и счёт по строкам объявил бы «часть этих чисел уже не изменится» над
  числом, которое перепишет сегодняшняя ночь; «смешанно» осталось там, где оно правда, —
  у РЯДА, чьи точки лежат в разных периодах. Той же меркой смерена ПОДПИСЬ: фамилия и дата
  закрытия берутся у защёлки периода, а не у первой попавшейся зафиксированной строки
  ответа, — иначе под июльским числом стояла бы дата закрытия июня (ADR-0216, границы).
  Плотность же — свойство ОДНОЙ отвеченной даты: у ряда её нет вовсе, она уехала в точки,
  а состав ряда считается МНОЖЕСТВОМ записей, а не суммой точек (перенесённая строка
  входит в каждую точку, где действует). В демо-мире стало 258 строк вместо 379 при
  том же составе: as-of-чтение восстанавливает все 379 состояний.
  ГРАНИЦА волны: разрежённой стала ЗАПИСЬ, а не ОБХОД — прогон по-прежнему берёт всех и по
  каждому решает, изменился ли он. Вход «кто изменился после момента T» у соседей — это
  ИС-48/ИС-49 (ADR-0221), отдельная задача; до неё экономится место, а не ночь.
  Проверки #184–#192; по факту пересчитаны #144 и #172, читатели строк в #133 и блоках
  Z, X переведены на `ST.rowsAsOf`.
  Волна 17 ч.8 (31.08.2026) научила прогон переживать МОЛЧАНИЕ СОСЕДА (ИС-42, ADR-0208).
  Ночь конечна, а соседей пятеро: ядро отдаёт остатки и потоки, классификация — категорию,
  погашения — оплаченное, кураторство — ведущего, взыскание — дела и требования. На
  десятках тысяч объектов отказ хотя бы одного шва не авария, а рядовое событие, и ответа
  на него у прогона не было вовсе. Из четырёх мыслимых три плохи по-разному: не писать
  строку — потерять всю ночь целиком из-за одного соседа; подставить ноль — он сложится
  в своде и не оставит следа (ADR-0175), и отличить «взыскано ноль» от «взыскание
  промолчало» станет нечем; подставить вчерашнее — строка перестанет быть снимком на дату
  и заведёт второй путь к числам, ровно устройство легаси-остатка (E2E-09). Остался
  четвёртый: писать тем, что получено, и ОБЪЯВИТЬ недостачу — не в логе, а в самой строке.
  Отсюда восьмое поле формы — `srcs`, колонка источника на каждого СПРОШЕННОГО соседа.
  Запрет волны 17 ч.6 на восьмое поле им не нарушен, потому что тот запрет был не про счёт
  полей: носителей ЗНАЧЕНИЙ в строке по-прежнему два (`dims` и `inds`), а `srcs` встал в
  ряд СУДЬБЫ строки, к `fixed` и `by`. Ряды названы порознь и различаются механически:
  ключи поля значений — имена записей реестра, ключи поля судьбы — не запись реестра ни
  один (#3). Сосед ОБЪЯВЛЕН списком, а не выведен из имени шва: «calc*» — соглашение об
  именовании, а `riskCategory` и `payAlloc` под него не подходят вовсе, тогда как
  `casePortfolio` и `calcPortfolio` похожи настолько, что разбор по имени рано или поздно
  склеил бы разных соседей. Шов без объявленного соседа не заводится дверью реестра:
  он отвечал бы молча, и в ночь его отказа строка объявила бы себя полной. Колонка
  ставится ДО ответа и независимо от него — «не спрашивали вовсе» и «спросили и не
  получили» разные состояния, и различает их НАЛИЧИЕ колонки, а не её содержимое: у
  залогового договора и кредитной программы колонок нет ни одной, у кредита две, у
  заёмщика три. Причина отказа — реквизит колонки, и словарь её закрыт четырьмя:
  недоступен · ответил ошибкой · не уложился в срок · отказал по правам. Свободный текст
  здесь читался бы человеком и не читался бы ничем больше, а повод собирается по причине,
  а не по фразе. Дозаполнение — НЕ перезапись: было отсутствие, стало значение, и различие
  механическое, а не на слово (величина не пришла от МОЛЧАВШЕГО соседа и теперь пришла от
  ответившего). Свод по неполным строкам считается и объявляет неполноту в паспорте — в
  полной форме строкой «Полнота», в краткой пометкой «НЕПОЛНО»; ADR-0178 этим не отменён,
  там правило ЧТЕНИЯ, здесь правило ЗАПИСИ, и часть за целое не выдана. Затянувшееся
  молчание (три прогона подряд) объявляется поводом с устойчивым ключом «сосед-молчит/имя»,
  и ответившая ночь счёт обнуляет.
  ИС-20 при этом СУЖЕНА, а не сломана, и сужена ровно на один случай. Чужого периода
  статистика по-прежнему не запирает: в сводку препятствий кредитного модуля (ADR-0113)
  она не добавляет ничего, и нижние слои — учёт, классификация — закрываются независимо
  от неё, что бы у неё ни случилось (#198). Речь о СВОЕЙ защёлке, верхней колонке общего
  календаря. Пропуск прогона остаётся там предупреждением: пропущенную ночь не починить
  ничем, и блокировка заморозила бы календарь навсегда. Неполная строка устроена иначе —
  она чинится дозаполнением, и пропустить её в окончательное значило бы сделать
  окончательность пустым словом. Обе беды выходят одной дверью (`periodBlockers`), но в
  РАЗНЫХ полях: пропуск — предупреждением, неполнота — блокировкой с печатным перечнем,
  кто молчал, почему, сколько строк и по каким объектам. Блокировка не тупик: починка
  идёт ОБЫЧНЫМ прогоном, и та же защёлка той же дверью проходит.
  Молчание ДОСТИЖИМО РУКАМИ, иначе неполная строка осталась бы словом в проверках: на
  экране журнала срезов стоит карточка «Ночь, в которую сосед промолчал» — сосед и причина
  выбираются списками ИЗ МОДЕЛИ, а не набираются (закрытый словарь, набираемый руками,
  закрыт только на словах), и прогон уходит с ними; дверь всё равно проверяет оба поля
  сама. Рядом кнопка дозаполнения, и это ОБЫЧНЫЙ прогон той же датой: отдельной кнопки
  «повторить неудачное» нет и не будет — она завела бы второй путь записи (§4–5). Журнал
  прогонов называет молчавшего рядом с причиной внепланового, а состав ночи считает
  порознь — «неполных» и «дозаполнено» суть состояние ночи и её работа. Неполной при этом
  считается НАПИСАННАЯ строка, а не собранная: та, которой молчание ничего не изменило, не
  пишется вовсе (колонка источника в сравнение строк не входит) и лежит в «без изменений».
  Считай иначе — журнал сказал бы «неполных 14» там, где неполных строк одиннадцать, и
  разошёлся бы с перечнем защёлки и с паспортом ответа, которые читают неполноту ИЗ СТРОК
  (ИС-15, #200). Молчание такой ночи не теряется: его помнит реквизит прогона, и повод
  «сосед молчит» считается по журналу именно поэтому.
  ГРАНИЦЫ волны. Пятый пункт ADR-0208 («неполные строки возвращаются в очередь») сюда не
  вошёл: очереди перестроения в макете нет вовсе, она заводится вместе с опросом соседей
  (ИС-48/ИС-49, ADR-0196, ADR-0221) — там же, где повод «сосед молчит» перестанет быть
  объявленным и станет отданным. ОБЕ ГРАНИЦЫ СНЯТЫ волной 17 ч.9, ниже. Защёлка соседей НЕ переспрашивает: она материализует то,
  что есть, и отказывает, если этого мало (переспрос — ИС-46). Признак «на дату/текущее»
  (ADR-0205) не заводился и с колонкой источника не путается: тот принадлежит ВЕЛИЧИНЕ и
  говорит о происхождении числа, «не ответил» принадлежит СОСЕДУ и говорит, что числа нет.
  И следствие, названное вслух: ночь молчания пишет строку, дозаполнение возвращает ей
  прежние числа, и если за ту ночь у объекта не изменилось больше ничего — строка
  останется равной предшественнице (ИС-45). В демо-мире таких нет, на статичном объекте
  случай достижим. Строка остаётся: снять её значило бы завести прогону операцию удаления
  строки, которой у него нет и заводить которую ради плотности нельзя (ИС-2).
  Проверки #193–#200; по факту пересчитаны #3 (форма строки — три ряда вместо счёта полей)
  и #17 (сужение ИС-20).

  Волна 17 ч.9 (31.08.2026) ответила на вопрос, ЧЬЮ НОЧЬ МЫ ТРАТИМ (ИС-48/ИС-49, ADR-0221).
  Легаси считал ночью ВЕСЬ портфель; разработчики новой системы предложили обратное —
  трогать только тех, у кого критическая дата. Оба ответа не на тот вопрос: первый пишет
  копию вчерашнего дня, которую ч.7 уже запретила, второй молча теряет всё, что изменилось
  от СОБЫТИЯ — платёж, категорию, реструктуризацию, переезд в другую область. Теперь внутри
  открытого периода прогон обходит КАНДИДАТОВ, на защёлке — ВСЕХ: слепок удостоверяет
  состояние, а не приращение. В демо-мире это 37 кандидатов из 76 живых записей.
  Кандидат — объединение ЧЕТЫРЁХ множеств, и ни одно не выводится из остальных: названные
  соседями в ответ на «кто изменился после T» · с критической датой в интервале · с
  изменившимся СВОИМ фактом · поставленные в очередь явно. Второе множество проверено не
  словом: уточните курс доллара задним числом — и в кандидаты придут записи, которых НЕ
  НАЗВАЛ НИ ОДИН сосед (у ядра по ним не изменилось ничего, изменилось время, ADR-0193);
  ровно поэтому курс из сравнения значений соседа ВЫЧЕРКНУТ — войди он туда, второе
  множество вывелось бы из первого, и «ни одно не выводится» стало бы неправдой.
  Момент T — реквизит ПАРЫ «прогон + сосед», а не одна дата на прогон: молчавший сосед
  оставляет своё T нетронутым, и следующая ночь спрашивает его за больший интервал.
  Опрос — PULL: потерянное уведомление необнаружимо, а несостоявшийся опрос виден сразу и
  назван в паспорте. Ответ соседа — СПИСОК КЛЮЧЕЙ, а не значений: значения прогон берёт
  швами, и второго пути к числам опрос не заводит (E2E-09). Сосед, не умеющий отвечать
  (здесь — взыскание), обходится ПОЛНОСТЬЮ: законная деградация стоит времени, но не
  порождает потерь. Три состояния разведены и в паспорте, и в глазах: «сосед назвал ноль» ·
  «не ответил этой ночью» · «не умеет отвечать никогда» — действия у них разные.
  В паспорте прогона появилась пятая колонка — «не обойдено»: слить её с «без изменений»
  значило бы отчитаться о непроверенном как о проверенном. Кандидат при этом — АДРЕС
  РАБОТЫ, а не обещание перемены: обойдённая запись законно оказывается без изменений.
  Тем же ходом закрыты две границы ч.8. Неполная строка теперь САМА встаёт в очередь на
  дозаполнение (ADR-0208 §5) и закрывается тем прогоном, который написал её полной, — без
  очереди правило висело бы на честном слове, потому что в разрежённом мире объект мог
  следующей ночью не попасть в кандидаты вовсе. А повод «сосед молчит» ОТДАЁТСЯ дверью
  `ST.askLeads` (ADR-0210 §1, ADR-0211): полное множество на дату (сверка, а не приём),
  идемпотентно, отпавший повод не исчезает молча. Ключ повода ПОЧИНЕН — «вид + объект +
  ПЕРИОД», периодом служит непрерывная полоса молчания: без периода два молчания,
  разделённые ответившей ночью, слились бы в один незакрытый повод, и разбор первого закрыл
  бы заодно второе. Отказ шва тоже уточнён: «швов ДАННЫХ три» — вопрос о поводах данными не
  является и идёт своей дверью (ADR-0152 §1 не про него).
  НАЙДЕНО ПО ХОДУ и починено не пятым множеством, а очередью: величина, объявленная посреди
  открытого периода (ч.7, ADR-0215 §7), у объекта БЕЗ СОСЕДЕЙ не заполнилась бы никогда —
  кредитная программа не попадает в кандидаты ни одним из четырёх путей. Заведение записи
  реестра само ставит живые записи объекта на досчёт: работу ставит тот, кто про неё знает.
  ГРАНИЦЫ волны. Опрос в макете НЕ ДЁШЕВ и дешёвым здесь быть не может: журнала изменений у
  зеркала нет, и «кто изменился после T» считается сравнением значений соседа на две даты —
  двойным обходом. Макет показывает СОСТАВ кандидатов, а не сэкономленное время. Ключи
  соседа считаются ключами статистики: в жизни изменившийся кредит делает кандидатами и
  своего заёмщика, и залог, и дело взыскания, но расширение принадлежит ВЛАДЕЛЬЦУ множества
  (ИС-31), и ADR-0221 о нём не говорит. Частота прогонов — вопрос эксплуатации, а не модели.
  Проверки #201–#208; по факту пересчитаны #184 (полнота обхода считается по пяти колонкам),
  #188 (очередь вместо пятого множества) и #199 (ключ повода с периодом).

  Волна 17 З-10 (31.08.2026) свела два инварианта, стоящих на одном доводе (ИС-39 + ИС-46,
  ADR-0205 × ADR-0216): величина обязана СКАЗАТЬ, как она привязана ко времени, а защёлка
  обязана спросить её В ТОТ МОМЕНТ, когда за неё расписывается.
  Датировка — реквизит ВЕЛИЧИНЫ, а не шва и не ответа. Слов ровно два, список закрыт («на
  дату» · «текущее»), и объявляются они ТАБЛИЦЕЙ по шву: `calcPledge` одним вызовом отдаёт
  15 записей реестра — 11 «на дату» и 4 «текущее», потому что залоговую стоимость её версия
  на дату восстанавливает, а «дней с последнего обследования» карточка предмета
  ПЕРЕЗАПИСЫВАЕТ, и на майскую строку сегодня придёт августовский счёт дней. Пометь мы дверь
  целиком — половина её величин получила бы чужой признак. Величина без объявления
  принимается как «текущее»: молчание шва о ретроспективе не есть доказательство
  ретроспективы. В строке под это заведено ДЕВЯТОЕ ПОЛЕ `when` и ЧЕТВЁРТЫЙ РЯД формы —
  ПРОИСХОЖДЕНИЕ: ряду судьбы его мало (`srcs` отвечает «кого спрашивали», `when` — «как
  полученное привязано ко времени»), ряду значений тем более (величины в нём нет ни одной).
  Прежний механический критерий рядов на нём сломался и заменён: ряд ЗНАЧЕНИЙ несёт величины,
  ряд ПРОИСХОЖДЕНИЯ — слова закрытого словаря, ряд СУДЬБЫ не несёт имён записей вовсе.
  Паспорт получил датировку ЧЕТВЁРТЫМ обязательным реквизитом и берёт ХУДШЕЕ по ответу: одна
  текущая величина делает ответ «смешанно» и называет виновника по имени. Датируется
  ОСНОВАНИЕ агрегата, а не агрегат (своего происхождения у суммы нет, ИС-3), а РАЗРЕЗ
  считается наравне с показателем: переписанный в карточке «вид обеспечения» отравляет
  майский срез ровно так же, как счёт дней. В сравнение строк `when` НЕ ВХОДИТ (ADR-0205 §5):
  сосед, исправивший объявление своего шва, меняет происхождение будущих величин, а не
  состояние объекта, — войди признак в `rowDiff`, одна правка объявления переписала бы
  витрину целиком и выглядела бы в журнале как изменение состояния портфеля, которого не было.
  Защёлка перестала только ДОПОЛНЯТЬ состав и теперь ПЕРЕСПРАШИВАЕТ: дописывает недостающие
  строки и ПЕРЕПИСЫВАЕТ устаревшие. Проверено не словом: уточните курс задним числом уже
  после последнего прогона — и закрытие июля допишет 19 строк и перепишет 4, а у «КД-2025/043»
  сомовый итог уйдёт с 12 920 251,35 на 13 390 613,18. Почти полмиллиона сомов, которые
  прежняя защёлка отдала бы наружу с подписью «окончательно». Дописанное и переписанное
  считаются ПОРОЗНЬ — полнота состава (ADR-0215 §4) против свежести величин (ADR-0216 §2), —
  а общее `written` остаётся их суммой: суточный итог по журналу складывается одним способом.
  Рубежа перед колонкой теперь ДВА, и отказы у них разные: вчерашняя неполнота посылает к
  ПРОГОНУ (ADR-0208 §4), молчание на ДОСПРОСЕ — к СОСЕДУ, потому что последний опрос есть
  часть закрытия и прогоном не чинится. Опрос идёт ПРЕЖДЕ записи, и молчащий сосед кончает
  закрытие ДО ЕДИНОЙ СТРОКИ: напиши защёлка сперва — на дату слепка легли бы строки,
  собранные из молчания. Журнальная запись при этом делается ВСЁ РАВНО: «доспрос не отвечен»
  и «закрытия не пробовали» — разные ночи.
  Окончательность ответа соседа берётся у КОЛОНКИ ЕГО СЛОЯ в общем календаре (ИС-38), а не у
  величины, и защёлка это ПЕЧАТАЕТ: пока нижняя колонка пуста, ответ предварителен. Кураторство
  учётного слоя не имеет вовсе — и это не пробел, а ТРЕТИЙ случай, «окончательности не
  удостоверяю»: свести его к «не закрыт» значило бы обещать, что когда-нибудь он закроется.
  Реквизита у соседа три, и ни один не выводится из остальных: слой · умение отвечать на опрос
  (ИС-49) · объявленная датировка шва. Взыскание опрос не понимает, а колонку слоя имеет;
  кураторство понимает опрос и слоя не имеет.
  После защёлки дата внутри закрытого периода отвечается ЧТЕНИЕМ строки, а не пересчётом:
  режимов ответа ровно два («расчёт, предварительно» · «запись фиксации, окончательно»), и
  ВЫВОДЯТСЯ они из признака фиксации, а не хранятся рядом с ним (ИС-15). Ровно ради этого
  доспрос и заведён: пересчёт закрытого мая в августе взял бы сегодняшние реквизиты (ИС-39) и
  дал бы другое число, не нарушив ни одного правила, — а защёлка перестала бы что-либо
  удостоверять. Спросить «кого переспросит защёлка и чей ответ она засчитает окончательным»
  можно ДО закрытия: дверь `ST.repoll` читает и не пишет, экран журнала показывает её
  карточкой, а молчание на доспросе достижимо руками той же формой, что и ночное, — рубежа
  два, и без второй кнопки второй остался бы словом в проверке.
  ГРАНИЦЫ волны. Датировка ОБЪЯВЛЯЕТСЯ таблицей, а не спрашивается у соседа: в жизни это
  реквизит договора о шве, и модель здесь описывает, а не выясняет. Версионность шва из строки
  не выводится — по строке нельзя узнать, УМЕЕТ ли сосед отдать величину на дату; известно
  лишь, что он объявил. Доспрос переписывает величины, но НЕ чинит вчерашнюю неполноту: её
  отбивает рубеж, стоящий до него.
  Проверки #209–#215, и они проверены МУТАЦИЕЙ движка: шесть правок ловятся ими поимённо.

  Волна 17 З-11 (31.08.2026) закрыла ИС-51 (ADR-0222): у величины ОДИН адрес, и адресов всего
  два. Пока потребителем была одна отчётность, «у кого спрашивать» решалось её собственным
  правилом. Волна 16 завела дашборд и задания, рядом стоял анализ — и у четырёх модулей перед
  глазами оказалось ТРИ двери к одной и той же сумме долга: шов ядра (ИЯ-17 прямо разрешает ему
  портфельный вопрос), objectRows (живые строки, из которых сумму можно сложить снаружи) и срез.
  Три двери к одному числу — это E2E-09 дословно: расхождение появится не там, где ошиблись, а
  там, где сравнили. Правило: ЧИСЛО, ПРИВЯЗАННОЕ К ДАТЕ, — ТОЛЬКО У СТАТИСТИКИ; ЖИВОЙ РЕКВИЗИТ —
  ТОЛЬКО У objectRows ВЛАДЕЛЬЦА. Даже когда то же число умеет посчитать ядро: ядро ВЫВОДИТ,
  статистика ДАТИРУЕТ (ADR-0145), и потребитель разговаривает с датирующим слоем. Шов ядра не
  отменён — у него сменился КРУГ ВЫЗЫВАЮЩИХ: им снимает срез статистика и пользуется учётный
  контур, а верхний ярус к нему не ходит.
  Восьмой шов (ADR-0181) заведён здесь же и стоит В ЯДРЕ, среди calc*: форму держит ядро, ПОЛЯ
  ПЕРЕЧИСЛЯЕТ ВЛАДЕЛЕЦ, а статистика ему ПОТРЕБИТЕЛЬ, а не хозяин. Объект в v1 объявлен ровно
  один — кредит, 13 реквизитов, — и это не заготовка: «отчётность в режиме „сейчас“ получает
  кредиты» (ADR-0181, п. 4 «Последствий»). У заёмщика живого адреса НЕТ, и шов говорит именно
  это, а не «пусто»: пустой список неотличим от «полей не осталось», а выдуманный второй путь к
  тем же полям — это второй вычислитель у каждого потребителя. Ответ шва — «сейчас»: дата снимка
  есть, период НЕ ЗАФИКСИРОВАН, и это НАЗВАНО. Всякая величина в нём «текущее» ПО ПОСТРОЕНИЮ —
  у карточки истории нет вовсе (ИС-39). Область видимости считается ВНУТРИ шва, и скрытое
  называется ЧИСЛОМ (5 видимых + 3 скрытых = 8): молча укоротить список нельзя, иначе «обзвонили
  всех» перестаёт быть проверяемым. Отказ по объёму ДВОИЧНЫЙ, тем же правилом, что у statRows.
  Необъявленное поле не отдаётся никому — даже когда имя его настоящая запись реестра статистики:
  «m-debt» владельцу не поле карточки, а число на дату по ДРУГОМУ адресу.
  У одной вещи ДВЕ стороны, и это НЕ два адреса одного числа: «в каком множестве строка БЫЛА НА
  ДАТУ» и «что в карточке СЕЙЧАС» — разные вопросы с разными ответами, и оба верны. Пар объявлено
  11 из 13 — РЕКВИЗИТОМ twin, а не догадкой по имени; без пары два, и у каждого своя причина
  (адресующий реквизит · второй уровень разреза «Территория», а не своя запись). Показано это
  делом: июль закрыт, кредит передали другому куратору в августе — и на ОДНОЙ строке КД-2024/117
  куратор среза Бекова Н. «на дату», а куратор карточки Садыков М. «текущее». Пересчитай кто-нибудь
  закрытый июль сегодня — он взял бы Садыкова и не нарушил бы ни одного правила.
  Смешивать в одной строке МОЖНО, скрывать смешение — НЕЛЬЗЯ. Спрос идёт ОДНОЙ просьбой, а
  разъезжается по адресам ВЕЛИЧИН: датированная половина закрытого июля ЧИТАЕТСЯ (обращений к
  ядру ноль), живая стоит владельцу отдельного вызова — счётчики разделены нарочно, одним этого
  не показать. Паспорт печатает ОБА источника с ОБЕИМИ датами, а по датировке берёт ХУДШЕЕ: одна
  живая величина делает ответ «смешанным» и называет виновника по имени. Отказ спроса ДВОИЧНЫЙ:
  одна неадресуемая величина отменяет ответ целиком — отдай шов адресуемую половину молча, и
  потребитель не узнал бы, что спросил не то. Отказы РАЗНЫЕ по смыслу: у шва число ЕСТЬ, и дорога
  ведёт к тому же числу другим адресом; у ненайденной величины его нет вовсе, и дорога ведёт к
  ЗАВЕДЕНИЮ ЗАПИСИ РЕЕСТРА (ADR-0150 §6), а не к обходному пути. Адрес при этом НЕ ПРОПУСК:
  круг спрашивающих у восьмого шва тот же объявленный, что у среза, — классификация отбита слоем,
  программам открыт свод и не открыт построчный ответ, а живую половину те же программы получают.
  ГРАНИЦЫ волны. Перечень полей объявляет ВЛАДЕЛЕЦ, и объявлен он в v1 по одному объекту: заёмщик,
  залог и платежи ждут своих волн, и до них живого адреса у потребителя нет. Часы приходят СНАРУЖИ
  (q.at) — шов, читающий их сам, нельзя было бы поставить в положение «вчера» ни одним сторожем.
  Агрегатов восьмой шов не считает и по периоду не сводит: всё, что требует истории, — вопрос на
  дату, то есть другой адрес.
  Проверки #216–#222, и они проверены МУТАЦИЕЙ движка: одиннадцать правок ловятся ими поимённо.

  Волна 17 З-12 (31.08.2026) закрыла ИС-41 (ADR-0207): историю старой системы грузит ВЫПУСК
  МИГРАЦИИ строками, уже окончательно зафиксированными. До этой волны инварианта не было в
  макете ни строкой, и модуль вёл себя так, будто мир начался в день запуска. В жизни он не
  начался: у кредита, выданного в 2019-м, есть шесть лет истории, собранной формой, которой
  больше нет, — и первый же отчёт «динамика портфеля за три года» упирается в неё.
  Устройство: 34 строки на 6 квартальных дат до 01.05.2026, источник «легаси», актор —
  «миграция, вып. 1» с актом приёмки, и КАЖДАЯ приходит зафиксированной. Незафиксированной
  положить нельзя: открытая строка — обещание, что её пересчитают, а пересчитывать нечем.
  Форма строки при этом НЕ ВЫРОСЛА: редакция формы уехала реквизитом в ЗАПИСЬ ФИКСАЦИИ
  (ADR-0175 §1), а не десятым полем — десятое поле было бы формой, растущей от каждого
  нового обстоятельства (ИС-15).
  Опасность тут не в отказах, а в ПРАВДОПОДОБИИ. Форма легаси собирала 6 величин из 135,
  объявленных объектом сегодня; свод по несобиравшейся величине даёт ровный ноль, и
  «обеспечения на 31.12.2025 — 0 сом» читается как факт. Отказом это не лечится: сложить
  ничего — законно (ИС-19), и запрети мы это ради легаси, сломался бы обычный ноль. Лечится
  словом, едущим ТУДА ЖЕ, КУДА ЧИСЛО: редакция формы стоит и в кратком паспорте под плиткой
  (ADR-0205 §4) — развёрнутый открывают не всегда, плитку видят всегда. В норме строка не
  длиннее ни на символ: пометка, стоящая везде, не значит ничего.
  Второе правдоподобие — РЯД ЧЕРЕЗ ЗАПУСК. «Остаток ОД в сомах» даёт 0, 0, 32 миллиона: на
  графике взрывной рост портфеля, а на деле сомового близнеца старая система не считала
  вовсе — ADR-0214 её не застал. Поэтому ряд НАЗЫВАЕТ СОСТАВ (той же фигурой, что
  разновалютная клетка, ADR-0151 §4), а пометка стоит НА СТЫКЕ, а не на всём ряде:
  несопоставима не «история», а конкретная пара соседних точек. Разницу модуль не считает —
  графа изменения живёт у отчётности (ИС-47); он отдаёт пометку, чтобы графа её напечатала.
  Граница — ДАТА ЗАПУСКА, объявленная один раз, и она не переносит ничего ни в одну сторону.
  Это не про точность, а про ВОСКРЕШЕНИЕ: КД-2021/044 живёт только в легаси-итогах, в
  сегодняшнем мире его нет — подстановка «на дату» через границу подала бы его в майском
  срезе живым договором. Внутри своей стороны подстановка работает как работала.
  Легаси-период не открывается ВОВСЕ, и отказов четыре разных на четыре двери: закрывать
  нечего · открыть нечем пересчитать · перезакрытие неприменимо · прогон сюда не ходит. Один
  общий отказ «нельзя» отправил бы человека искать недостающее право — и он бы его нашёл.
  Дорога у трёх из четырёх одна: НОВЫЙ ВЫПУСК МИГРАЦИИ с журнальной записью, актор — человек.
  Прогон легаси не видит по ПОСТРОЕНИЮ, а не фильтром: очередь строится по миру, а не по
  написанным строкам, и легаси-ссылок в мире нет. Фильтр «пропусти легаси» пришлось бы
  держать в каждом месте, где прогон трогает строки, и однажды одно место забыли бы.
  ГРАНИЦЫ волны. Дата запуска и содержимое выпуска ОБЪЯВЛЕНЫ, а не выведены: в жизни это
  реквизиты акта приёмки миграции, и модель здесь описывает, а не выясняет. Легаси-строка не
  служит основанием заключения — этого правила движком не проверить, оно живёт у получателя.
  Область видимости на легаси-стороне дырява по существу: форма легаси не собирала куратора,
  и аналитику там не видно ни одной строки — дыра НАЗВАНА в паспорте, но не закрыта, закрыть
  её может только новый выпуск (ADR-0175 §2).
  Проверки #223–#228, и они проверены МУТАЦИЕЙ движка: шесть правок ловятся ими поимённо,
  а седьмая — снятая граница у подстановки «на дату» — валит смоук ОБВАЛОМ, и обвал здесь
  честный ответ: легаси-строка доезжает до ответа на прогонную дату, и первый же сторож,
  читающий у неё величину, которой старая форма не собирала, падает на ней.

        не бывает вовсе: там отказ (ИС-36).
  ИС-13 Ролевые правила применяются к строкам ДО группировки (ADR-0152 §3).
  ИС-14 statRows сходится со списком реестра объектов один в один. Оговорка ИС-34: там,
        где объявлен дедуп-ключ, сходится СОСТАВ строк, а не сумма величин по группам.
  ИС-15 Доли и «процент от» не хранятся — это представление. Сомовый эквивалент из этого
        инварианта ИЗЪЯТ волной 17 ч.6: он не представление, а величина (ИС-44, ADR-0214).
  ИС-16 Сумма отдаётся в валюте договора, с курсом и датой курса (ADR-0135 §7).
  ИС-17 Потоки хранятся нарастающим итогом, период — разность двух строк.
  ИС-18 Объект статистики — запись реестра, а не ветка кода (ADR-0149).
  ИС-19 Заёмщик — свой объект со своей строкой, а не свёртка кредитов.
  ИС-20 Статистика не запирает ЧУЖОГО периода (ADR-0113): в сводку препятствий закрытия
        кредитного модуля она не добавляет ничего, и нижние слои — учёт, классификация —
        закрываются независимо от того, что у неё происходит. Своя ЗАЩЁЛКА — другое дело,
        и волна 17 ч.8 её ужесточила: пропуск прогона остаётся предупреждением (пропущенную
        ночь не починить ничем, и блокировка заморозила бы календарь навсегда), а НЕПОЛНАЯ
        строка верхнюю колонку не пускает — она чинится дозаполнением, и пропустить её в
        окончательное значило бы сделать окончательность пустым словом (ИС-42, ADR-0208 §3).
        Обе беды выходят одной дверью, но в разных полях: предупреждение и блокировка.
  ИС-21 Если значений разреза у объекта много — это не разрез, а нижележащий объект
        (ADR-0179 §1). Разрез отвечает на «в каком множестве строка», и строка в двух
        множествах сразу не бывает.
  ИС-22 Усечения и страниц у ответа нет: список отдаётся целиком либо не отдаётся вовсе;
        уровень иерархии спрашивается в границах объявленных (ADR-0178 §1, ADR-0176 §4).
  ИС-23 Свободной корзины не бывает: набор объявлен записью разреза, новая заводится
        строкой реестра, а не приходит в запросе (ADR-0176 §2).
  ИС-24 Форм паспорта ровно две — полная и краткая, и обе объявляет производитель ответа.
  ИС-25 Вывод показателя не запрещается чужой публикацией, но обязан назвать поимённо,
        что сломается (ADR-0177 §4).
  ИС-26 Дата на срезе выражается числом дней от даты среза: показателя типа «дата» не
        бывает — среднюю дату сложить не из чего (ADR-0183 §4).
  ИС-27 Показателем именуется клетка шва, которую спрашивают о множестве; матрица величин
        целиком — сечение, а не набор показателей (ADR-0183 §1–§2).
  ИС-28 Показатель заёмщика берётся ПОРТФЕЛЬНЫМ швом; шов одного кредита показателем
        заёмщика не бывает (ADR-0184) — иначе свод считается второй раз и вне ядра.
  ИС-29 У числа и суммы агрегат обязателен, у перечисления и булева запрещён (ADR-0185 §3).
  ИС-30 Счёт объектов другого уровня — вопрос ТОМУ объекту, а не функция здесь (ADR-0186).
  ИС-31 Портфельный шов принадлежит владельцу МНОЖЕСТВА: если множество выбирает чужой
        junction, шов держит его владелец, а не расчётное ядро (ADR-0190 §1).
  ИС-32 Отношение двух величин показателем не бывает: в срез входят числитель и
        знаменатель, отношение считается при чтении (ADR-0190 §3, ИС-15).
  ИС-33 Строки нет до рождения объекта: небытие — не пустота и не ноль. Рождение объявлено
        реквизитом объекта и читается тем же читателем, что разрез; объект без него не
        заводится. Смерть — состояние, а не исчезновение строки (ADR-0197).
  ИС-34 У показателя, чьи строки пересекаются по ЧУЖОМУ ключу, объявлен дедуп-ключ —
        разрез этого же объекта, по которому величина считается один раз. Схлопывание идёт
        перед агрегатом и на каждом узле дерева; представителем берётся наибольшая
        величина. Сумма строк итогу не равна и не должна, а паспорт ключ НАЗЫВАЕТ
        (ADR-0199, оговорка к ИС-3 и ИС-14).
  ИС-35 Удельная величина показателем не бывает — это пара «срез + счёт»: числитель есть
        счёт своих строк в разрезе, знаменатель — счёт объектов другого уровня и
        спрашивается у ТОГО объекта. Знаменатель, снятый со среза, занижен систематически:
        у кого ноль строк, тот в срез не попадает вовсе (ADR-0200, композиция ИС-32 и ИС-30).
  ИС-36 Спрашивается дата ПРОГОНА: спрашиваемых дат ровно столько, сколько прогонов
        написали строки ЭТОГО объекта, и умолчанием стоит последний из них, а не
        сегодняшний день. Дата за последним прогоном — включая «сегодня» — отказ, и он
        называет последний прогон, записанный пропуск и реестр владельца, у которого
        спрашивается «как сейчас» (ADR-0202, §8.4). Внутри истории действует ИС-12.
  ИС-40 У разреза есть обязательный реквизит — ОБЪЕКТ ОПРЕДЕЛЕНИЯ, и имя разреза
        уточняется этим объектом. Величины, не складывающиеся между собой, не носят
        одного имени: не «область», а «область заёмщика» и «область выдачи кредита» —
        две записи реестра с разными объектами и разными дорогами до значения.
        Сложение по разрезу законно только внутри его объекта; сравнение срезов по
        разнообъектным разрезам — операция запрещённая, а не подозрительная. Справочник
        значений у них ОДИН: объект меняет дорогу, а не список значений. Правило
        распространяется и на показатели (ADR-0206, §§1–6; не путать с ИС-21/ADR-0179,
        где у ОДНОГО объекта значений много и признак уезжает на нижележащий объект).

  ИС-45 Дневная строка появляется, КОГДА ЧТО-ТО ИЗМЕНИЛОСЬ — величина, значение разреза,
        признак. Неизменное состояние строки не порождает: копия вчерашнего дня ничего не
        удостоверяет и место стоит. Отсюда отсутствие строки на дату значит «НЕ МЕНЯЛОСЬ
        с такой-то», а не «нет данных», и ответов у паспорта ТРИ, а не два: написано на
        эту дату · не менялось с такой-то · нет данных (подстановка с возрастом, ИС-12).
        Читают строки все швы одной дверью — переносом последнего состояния КАЖДОЙ ссылки
        вперёд; чтение «по дате» осталось мерой плотности и в ответы не ходит. Закрытие
        периода МАТЕРИАЛИЗУЕТ плотный слепок на дате закрытия (сначала слепок, потом
        фиксация), промежуточные дни закрытого месяца остаются разрежёнными. Перезапись
        внутри открытого периода — событие журнала, называющее поля; перезаписанных
        значений журнал не хранит. Фиксация — свойство ПЕРИОДА ответа, а не набора строк,
        из которых ответ собран (ADR-0215; атом хранения не тронут — ADR-0147 §1).

  ИС-42 Строка пишется ЧАСТИЧНО. Величины ответивших соседей ложатся на место, величины
        молчавшего приходят ОТСУТСТВУЮЩИМИ — ни нуля, ни вчерашнего, ни интерполяции, —
        а его колонка источника говорит «не ответил» и называет причину. Сосед объявлен
        СПИСКОМ, а не выведен из имени шва, и шва без соседа не заводится: он отвечал бы
        молча. Колонка ставится ДО ответа: «не спрашивали» и «спросили и не получили» —
        разные состояния, и различает их наличие колонки, а не её содержимое. Причин
        ровно четыре, и словарь закрыт: недоступен · ответил ошибкой · не уложился в
        срок · отказал по правам. Неполную строку нельзя защёлкнуть окончательно — отказ
        с печатным перечнем, а не предупреждение; дозаполнение обычным прогоном — НЕ
        перезапись (было отсутствие, стало значение); свод по неполным строкам считается
        и объявляет неполноту в паспорте; молчание N прогонов подряд — повод модулю
        заданий (ADR-0208; ADR-0175, ADR-0178 не отменён — там правило чтения, здесь
        правило записи).

  ИС-47 Величина, определяемая ОДНОЙ датой среза, может быть колонкой строки; величина,
        требующая двух и более, колонкой не становится никогда — дельта, темп, миграция,
        скользящее среднее и курсовая разница считаются анализом либо мёрзнут графой
        изменения выпуска. Критерий механический — реквизит записи «сколько дат среза
        нужно», проверяемый ДО заведения, — а не догадка по имени. Две величины на одной
        дате есть по-прежнему одна дата: удельная величина и доля остаются в прежних
        рамках (ADR-0220; ADR-0200, ADR-0150 §4, ADR-0218, ADR-0155).

  ИС-39 У ВЕЛИЧИНЫ есть обязательный реквизит — ДАТИРОВКА: «на дату» или «текущее», и слов
        в списке ровно два. Объявляется она таблицей ПО ШВУ, а не дверью целиком: один
        вызов законно отдаёт величины обеих пород. Необъявленное принимается как
        «текущее» — молчание шва о ретроспективе не есть её доказательство. Паспорт несёт
        датировку ЧЕТВЁРТЫМ обязательным реквизитом и берёт ХУДШЕЕ по ответу, называя
        виновника поимённо; агрегат датируется своим ОСНОВАНИЕМ (ИС-3), а разрез считается
        наравне с показателем. В сравнение строк датировка НЕ ВХОДИТ: правка объявления
        меняет происхождение будущих величин, а не состояние объекта (ADR-0205).

  ИС-46 Защёлка ПЕРЕСПРАШИВАЕТ соседей прежде, чем записать слепок: дописывает
        недостающие строки и переписывает устаревшие, и считает то и другое ПОРОЗНЬ.
        Молчание соседа на доспросе кончает закрытие ДО ЕДИНОЙ СТРОКИ, и отказ ведёт к
        СОСЕДУ: вчерашнюю неполноту чинит прогон и свой рубеж (ADR-0208 §4), а доспрос
        прогоном не чинится — он часть закрытия. Окончательность ответа берётся у КОЛОНКИ
        СЛОЯ соседа в общем календаре (ИС-38), а не у величины; слоя может не быть вовсе —
        это третий случай, «окончательности не удостоверяю», а не «не закрыт». После
        фиксации дата внутри закрытого периода отвечается ЧТЕНИЕМ строки, а не пересчётом
        (ИС-8), и режимов ответа ровно два — они ВЫВОДЯТСЯ из признака фиксации, а не
        хранятся рядом с ним (ADR-0216).

  ИС-51 У ВЕЛИЧИНЫ ОДИН АДРЕС, и адресов всего ДВА: число, привязанное к дате, — только у
        статистики; живой реквизит — только у `objectRows` ВЛАДЕЛЬЦА объекта. Третьего
        нет даже тогда, когда то же число умеет посчитать ядро: ядро ВЫВОДИТ, статистика
        ДАТИРУЕТ (ADR-0145), и верхний ярус разговаривает с датирующим слоем — шов ядра не
        отменён, у него сменился КРУГ ВЫЗЫВАЮЩИХ. Одна вещь может иметь ДВЕ стороны —
        «в каком множестве строка была НА ДАТУ» и «что в карточке СЕЙЧАС», — и это не два
        адреса одного числа, а два вопроса с двумя ответами, оба верных; пара объявляется
        РЕКВИЗИТОМ, а не догадкой по имени. Смешивать стороны в одной строке можно,
        СКРЫВАТЬ смешение нельзя: паспорт печатает оба источника с обеими датами, а по
        датировке берёт худшее. Отказ спроса ДВОИЧНЫЙ и всегда называет АДРЕС: у шва число
        есть, и дорога ведёт к нему срезом; у ненайденной величины его нет вовсе, и дорога
        ведёт к заведению ЗАПИСИ РЕЕСТРА (ADR-0150 §6), а не к обходному пути
        (ADR-0222, ADR-0181).

  ИС-41 ИСТОРИЯ СТАРОЙ СИСТЕМЫ ВХОДИТ СТРОКАМИ, и строки приходят СРАЗУ В СОСТОЯНИИ
        ОКОНЧАТЕЛЬНОЙ ФИКСАЦИИ: незафиксированная легаси-строка была бы обещанием
        пересчитать, а пересчитывать нечем. Форма строки от этого не растёт — редакция
        формы лежит РЕКВИЗИТОМ ЗАПИСИ ФИКСАЦИИ, а не десятым полем (ИС-15, ADR-0175 §1).
        Источник назван «легаси», актор — ВЫПУСК МИГРАЦИИ с актом приёмки, датировка всех
        величин И РАЗРЕЗОВ — «на дату»: «текущего» в легаси-строке не бывает вовсе, карточки,
        из которой его брать, больше нет (ИС-39). Чего старая форма не собирала, приходит
        ОТСУТСТВУЮЩИМ — не нулём, не вчерашним и не пересчётом сегодняшним курсом; свод по
        такой величине даёт правдоподобный ноль, и потому редакция формы едет в паспорт
        ВМЕСТЕ С ЧИСЛОМ, включая краткий под плиткой. Легаси-период НЕ ОТКРЫВАЕТСЯ ни
        распоряжением, ни правами, и перезакрытие (ADR-0216) к нему НЕПРИМЕНИМО: оно обещает
        пересчёт. Исправление легаси-итога — НОВЫЙ ВЫПУСК МИГРАЦИИ с журнальной записью, и
        актор там человек. Прогон легаси не видит и не переписывает — по построению, а не
        фильтром: очередь строится по МИРУ, а не по написанным строкам. Граница — ДАТА
        ЗАПУСКА, объявленная один раз: подстановка «на дату» через неё не переносит ничего
        ни в одну сторону, смешанного периода не бывает. Ряд через запуск НАЗЫВАЕТ СОСТАВ,
        а на стык точек разных редакций ставится пометка «редакции формы разные» — разницу
        модуль не считает, это графа изменения (ИС-47). Легаси-строка не служит основанием
        заключения (ADR-0207).

  ДЕМО ПОКРЫВАЕТ: десять объектов на одном движке (кредит и заёмщик — непохожая пара:
  разные разрезы, разные показатели, разное множество) · прогон, пропуск ночи с причиной и
  внеплановый ручной пересчёт с актором · закрытие мая и июня человеком и отказ прогона
  писать в закрытое · расхождение зафиксированного мая с сегодняшним пересчётом (есть
  корректировка, учтена в июле) · запрос на дату без строк ВНУТРИ истории — отдаётся
  ближайшая предыдущая с названным возрастом, и отказ на дату за последним прогоном (в том
  числе на «сегодня»), называющий прогон, пропуск и реестр владельца · разновалютный итог, называющий состав, и курсовую разницу
  разностью двух срезов · период произвольным интервалом как разность двух нарастающих
  итогов и названную базу периода, когда строки на начало интервала нет · историчный
  разрез: смена куратора сегодня не переписывает майскую строку · роль аналитика, режущую
  множество до группировки, и отказ «всего по холдингу» · заёмщика без действующих
  кредитов, который при свёртке исчез бы · отказ завести показатель с формулой · отказ
  классификации читать шов статистики · сходимость детализации со списком реестра ·
  ряд, у которого даты — часть вопроса (шаг месяц или квартал, 4/6/8 точек, последняя всегда
  дата среза) · фильтр наборами (ДНФ без скобок): сравнения внутри набора через И, наборы
  через ИЛИ, операнд — разрез или мера строки, значения берутся из строк на дату среза, у
  разреза-даты — корзинами, а не сырой датой, и весь фильтр печатается в паспорте словами · форма заведения
  разреза, которая спрашивает число значений на объект, корзины списком и ВЛАДЕЛЬЦА уровней,
  но не даёт напечатать иерархию руками · поимённый состав прогона в журнале ·
  дерево уровней (дивизион → филиал из справочника кадров; область → район из полей) с
  колонкой «своих», где кредит без района остаётся у области и не исчезает · корзины дат
  (год · квартал · месяц) и отказ спросить разрез-дату без корзины · отказ завести
  многозначный разрез — с указанием, каким объектом он должен стать · двоичный отказ
  statRows с названным числом строк и двумя дорогами: задание на выгрузку с паспортом
  внутри файла и список в реестре владельца на сегодня · краткий паспорт под числом плитки
  и полный по действию · обратный индекс ссылок потребителей, публикация и переиздание
  редакции без ссылок · снятие показателя с поимённым списком того, что сломается ·
  состав среза, идущий за рождением объектов (погашений 0·4·10·12·14), и отказ завести
  объект без объявленного рождения · солидарную пару требований на один кредит в разных
  филиалах, где сумма филиалов почти вдвое больше итога, и паспорт называет дедуп-ключ ·

.mx-overlay-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }

/* ---- headings, notes ---- */
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.page-lead{ font:var(--font-label); color:var(--text-muted); margin:2px 0 16px; max-width:900px; }
.note{ font:var(--font-label); color:var(--text-muted); margin:8px 0 0; max-width:900px; }
.note code, .page-lead code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); }

/* ---- banners ---- */
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }

/* ---- pills ---- */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

/* ---- tables ---- */
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); color:var(--text-muted); }
/* Нижний уровень дерева: тише по имени, но НЕ серее по числам — это не «выпавшая»
   строка, а такой же ответ, только мельче зерном. */
table.cgrid tbody tr.lvl td:first-child{ color:var(--text-muted); }
/* Заголовок группы внутри таблицы: реестр читается по объектам, а не одним полотном. */
table.cgrid tbody tr.grp td{ background:var(--surface-panel); color:var(--text-body);
  border-bottom:1px solid var(--border-default); padding:8px 12px; }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }

/* ---- cards ---- */
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.cols{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.side{ flex:0 0 260px; } .body{ flex:1; min-width:460px; }
.meta{ font:var(--font-label); color:var(--text-muted); margin:0 0 10px; }
.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:190px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ height:var(--control-h); border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }
.facts .f.annul{ text-decoration:line-through; color:var(--text-placeholder); }
.frozen{ background:var(--asubk-gray-50); }

/* ---- toast ---- */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
/* ---- паспорт ответа (ADR-0152 §2) ---- */
.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:150px; }
.pass.warn{ border-left-color:var(--asubk-amber); }
.pass.fixed{ border-left-color:var(--asubk-green); }

/* ---- конструктор среза ---- */
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
/* Подпись блока внутри самой ленты: блоки объявлены полем grp записи показателя, поэтому
   разметка их не перечисляет — она печатает то, что пришло из реестра. */
.chips-grp{ flex-basis:100%; margin:8px 0 -1px; font:var(--font-label); font-weight:var(--weight-medium);
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; font-size:11px; }
.chips-grp:first-child{ margin-top:0; }
/* Строк среза по кредиту 28 колонок — таблица едет вбок внутри карточки, а не тянет страницу. */
.tscroll{ overflow-x:auto; }
.tscroll table{ min-width:100%; width:max-content; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; cursor:pointer;
  border:1px solid var(--border-default); border-radius:var(--radius-pill);
  background:var(--surface-card); font:var(--font-label); color:var(--text-body); }
.chip:hover{ background:var(--surface-hover); }
.chip.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-link);
  font-weight:var(--weight-medium); }
.chip.off{ opacity:.45; cursor:not-allowed; }
.pickbar{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
.pickbar > div{ min-width:220px; }
.pickbar h4{ margin:0 0 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:.05em; }
table.cgrid td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cgrid td.num button{ background:none; border:none; padding:0; cursor:pointer; color:var(--text-link);
  font:var(--font-label); font-variant-numeric:tabular-nums; text-decoration:underline dotted; }
table.cgrid tfoot td{ padding:9px 12px; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }

/* ---- матрица: ответ (Q21 · B — липнет имя клетки: шапка сверху, разрезы слева,
   «Итого»-строка под шапкой) ---- */
.pass-bar{ position:sticky; top:0; z-index:7; display:flex; align-items:center; gap:10px;
  height:22px; padding:6px 10px; background:var(--surface-panel); border:1px solid var(--border-default);
  border-radius:var(--radius-md); margin-bottom:8px; font:var(--font-label); }
.pass-bar .muted{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mx-scroll{ overflow:auto; max-width:100%; border:1px solid var(--border-default); border-radius:var(--radius-md); }
/* width:auto, не 100% от .cgrid (Q28): при ширине-в-проценте лишнее место таблица
   раздаёт всем колонкам поровну, включая rowdim-h — авторазметке всё равно, что
   его содержимому нужно меньше; авто-ширина отдаёт колонке ровно то, что просит. */
table.mx-grid{ border-collapse:separate; border-spacing:0; width:auto; }
table.mx-grid thead th{ position:sticky; background:var(--surface-panel); z-index:3; }
table.mx-grid thead tr.hg th{ top:44px; z-index:4; }
table.mx-grid thead tr.hm th{ top:79px; z-index:3; }
table.mx-grid th.tot-h{ background:var(--asubk-blue-tint); }
table.mx-grid tbody.mx-tot td{ position:sticky; top:113px; z-index:2; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-bottom:1px solid var(--border-default); }
table.mx-grid td:first-child, table.mx-grid th.rowdim-h{ position:sticky; left:0; z-index:2;
  background:var(--surface-card); box-shadow:1px 0 0 var(--asubk-grid-line); }
table.mx-grid thead tr.hg th.rowdim-h{ z-index:5; background:var(--surface-panel); }
/* Ширина через дочерний блок, не через max-width на самой th (Q28): в auto-layout
   таблицы max-width клетки игнорируется, если у таблицы есть запас по ширине —
   width, наоборот, распорке подчиняется. */
.rowdim-h-wrap{ width:170px; white-space:normal; word-break:break-word; line-height:1.35; }
table.mx-grid tbody.mx-tot td:first-child{ z-index:5; }
th.mx-sortable{ cursor:pointer; user-select:none; }
th.mx-sortable:hover{ color:var(--asubk-link); }
.chev{ background:none; border:none; cursor:pointer; padding:0 4px 0 0; font-size:11px; color:var(--text-muted); }
td.mx-ref-cell{ position:relative; }

/* ---- ряд (statSeries) ---- */
.spark{ display:flex; align-items:flex-end; gap:10px; height:120px; margin:10px 0 4px; }
.spark .bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
.spark .bar i{ width:100%; background:var(--asubk-blue-tint); border-top:2px solid var(--asubk-blue); display:block; }
.spark .bar.fixed i{ background:var(--asubk-green-tint); border-top-color:var(--asubk-green); }
.spark .bar span{ font:var(--weight-regular) 11px/1.2 var(--asubk-font); color:var(--text-muted); }
