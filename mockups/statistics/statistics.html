          '<td>'+esc(x.dropped.join(', '))+'</td><td class="num">'+x.unfixed+'</td>'+
          '<td class="mono">'+(x.marked.length ? esc(x.marked.join(', ')) : '—')+'</td></tr>'
        ).join('')).join('')+'</tbody></table>' : '')+
      '<p class="note">Сброс идёт <b>сверху вниз</b>, повторная простановка — <b>снизу вверх</b> и теми '+
      'же кнопками, что обычное закрытие: у каждой колонки своя фамилия и своя дата, а при повторной '+
      'ещё и номер распоряжения (ADR-0204 §1 и §4). Открывается только <b>«'+esc(BASE_LAYER)+'»</b>: '+
      'классификация и статистика не открываются <b>никогда</b> — им снимают защёлку, и они '+
      'переспрашивают и защёлкиваются заново. Строки периода расфиксируются, иначе «переписать» '+
      'осталось бы словом; выпуски, собранные на прежних числах, <b>метятся</b> — но не переиздаются: '+
      'числа мёрзнут один раз, а переиздавать решает человек (ИС-50, ИО-4, ИО-34, ADR-0157 §6).</p></div>'
    : '<div class="banner info">Прогонами и фиксацией управляет администратор статистики. '+
      'Журнал открыт всем: им объясняется всякая странность в паспорте ответа.</div>';
  return '<h2 class="section-h">Что посчитано, что пропущено и кто закрыл месяц</h2>'+
    '<p class="page-lead">Журнал срезов — <b>часть контракта</b>, а не служебный лог: он показывается '+
    'пользователю, потому что им объясняется всякая странность в паспорте ответа (ADR-0148 §6, ИС-12).</p>'+
    divHtml+
    '<div class="card"><h3>Прогоны</h3><table class="cgrid"><thead><tr>'+
    '<th>Дата среза</th><th>Что было</th><th>Кто</th><th>Причина</th><th>Строк</th><th>Период</th>'+
    '<th>Кого взяла ночь</th><th>Состав прогона</th>'+
    '</tr></thead><tbody>'+runs+'</tbody></table>'+
    '<p class="note">Пропуск — событие журнала, а не дыра: дата просто отсутствует, и на вопрос об этой '+
    'дате отдаётся ближайшая предыдущая строка с названным возрастом (ИС-12). Колонка <b>«кого взяла '+
    'ночь»</b> называет состав кандидатов по каждому из четырёх источников: без неё «кандидатов не '+
    'было» неотличимо от «опрос не состоялся», а ночь, прошедшая мимо половины портфеля, выглядела бы '+
    'удачной (ИС-48, ADR-0221).</p></div>'+nightCard+
    '<div class="card"><h3>Календарь учётных периодов — общий справочник</h3>'+
    '<table class="cgrid"><thead><tr>'+
    '<th>Период</th>'+LAYERS.map(L => '<th>'+esc(L)+'</th>').join('')+
    '<th>Строк</th><th>Препятствия закрытия</th>'+
    '</tr></thead><tbody>'+months+'</tbody></table>'+
    '<p class="note">Календарь <b>один на все слои</b> и лежит ниже каждого из них: строка — период, '+
    'в ней колонка-защёлка на слой, в колонке — <b>свой</b> актор и <b>своя</b> дата (ИС-38, ADR-0204). '+
    'Колонка не проставляется, пока пуста нижележащая, и отказ называет незакрытый слой — каскад '+
    'перестал быть процедурой в чьём-то коде и стал состоянием строки, которое видно всем. Пока '+
    'календарей было три, «что было в мае» имело три законных ответа. Справочник при этом '+
    '<b>не актор</b>: сам он не проставляет ни одной колонки (ИС-9).<br>'+
    'Статистика не запирает <b>чужого</b> периода: в сводку препятствий закрытия '+
    '(<code>creditPeriodBlockers</code>, ADR-0113) она не добавляет ничего, и нижние слои '+
    'закрываются независимо от неё. Своя защёлка — другое дело. Незасчитанный прогон — '+
    '<b>предупреждение</b>: пропущенную ночь не починить ничем, и блокировка заморозила бы '+
    'календарь навсегда. Неполная строка — <b>блокировка</b> с перечнем, кто из соседей молчал '+
    'и по каким объектам: она чинится дозаполнением, и пропустить её в окончательное значило бы '+
    'сделать окончательность пустым словом (ИС-20 сужена, ИС-42, ADR-0208 §3).</p></div>'+
    legCard+acts+
    (st.log.length ? '<div class="card"><h3>Действия в этой сессии</h3>'+
      st.log.map(l => '<div class="why">'+fmt(l.at)+' · <em>'+esc(l.who)+'</em> — '+esc(l.msg)+'</div>').join('')+
      '</div>' : '');
}

/* ======================== ЭКРАН 3: РЕЕСТРЫ =========================== */
/* Форма ОДНА на обе породы: общая половина спрашивается всегда, вторая раскрывается по
   выбранной породе (ADR-0209 §7). Двух форм здесь нет не из экономии места — две формы
   суть две модели, и они расходятся: `addDim` успел спросить объект определения, а
   `addIndicator` — нет, и жила эта разница ровно до того дня, когда её заметили.      */
const formKind = () => (ST.state.form && ST.state.form.kind) || KIND.IND;
ST.setFormKind = k => { ST.state.form = {kind: k}; render(); };
ST.addRecordUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  const kind = formKind(), src = g('rSrc');
  const spec = {kind, id: g('rId'), name: g('rName'), obj: g('rObj'), src};
  /* Число дат в форме — вопрос, а не галочка: у него есть ответ «не отвечено», и он
     кончается отказом. Умолчание здесь было бы согласием за заводящего (ИС-47). */
  const dates = g('rDates'); if(dates) spec.dates = Number(dates);
  if(src === 'шов'){ spec.seam = g('rSeam'); spec.field = g('rField'); }
  else if(src !== 'агрегат'){ spec.key = g('rKey'); }
  if(kind === KIND.IND){
    if(src === 'агрегат'){ spec.fn = g('rFn'); spec.over = g('rOver'); }
    else { spec.type = g('rType'); const u = g('rUnit'); if(u) spec.unit = u; }
    const roll = g('rRoll'); if(roll) spec.roll = roll;
  } else {
    spec.perObject = g('rPer');
    const b = g('rBuckets');
    if(b) spec.buckets = b.split(/[,·]/).map(x => x.trim()).filter(Boolean);
    const ref = g('rRef');
    if(ref && REF[ref]){ spec.ref = ref; spec.owner = REF[ref].owner; spec.levels = clone(DIM('d-branch').levels); }
    const basis = g('rBasis'); if(basis) spec.basis = basis;
    const e = g('rEdges');
    if(e) spec.edges = e.split(/[,·]/).map(x => Number(x.trim())).filter(x => !isNaN(x));
    const ord = g('rOrder'); if(ord) spec.order = ord;
  }
  act(ST.addRecord(spec), 'заведена запись реестра «'+spec.name+'» — порода «'+kind+'»');
};
ST.addDimUI = () => act(ST.addDim({id:'d-segment', name:'Сегмент портфеля', obj:'obj-credit',
  src:'поле', key:'industry', perObject:'одно', dates:1}), 'разрез заведён — действует вперёд');
ST.tryFormulaUI = () => act(ST.addIndicator({id:'m-try', name:'Доля просрочки', obj:'obj-credit',
  src:'агрегат', fn:'sum', over:'m-debt', dates:1, formula:'sum(overdue)/sum(debt)'}));
ST.tryMissingSeamUI = () => act(ST.addIndicator({id:'m-try2', name:'Ожидаемые потери', obj:'obj-credit',
  src:'шов', seam:'calcExpectedLoss', field:'ecl', money:true, dates:1}));
/* Заявка, приходящая чаще прочих: «показатель изменения остатка за месяц». Отказ ей — не
   «нельзя», а АДРЕС: графа изменения выпуска или обзор анализа (ИС-47, ADR-0220 §6). */
ST.tryTwoDatesUI = () => act(ST.addIndicator({id:'m-try3', name:'Изменение остатка за месяц',
  obj:'obj-credit', src:'поле', key:'amount', type:'сумма', unit:'сом', dates:2}));
/* Формулы нет НИ У ОДНОЙ породы, и корзина исключением не является (ADR-0209 §4):
   она не выводит новой величины, а раскладывает существующую по границам. */
ST.tryDimFormulaUI = () => act(ST.addDim({id:'d-try', name:'Корзина по формуле', obj:'obj-credit',
  src:'поле', key:'daysOverdue', perObject:'одно', dates:1, formula:'floor(daysOverdue/30)'}));
/* Реквизит чужой породы — отказ, а не необязательное поле: у признака не бывает единицы
   измерения, у числа — иерархии значений (ADR-0209, «Отвергнуто»). */
ST.tryAlienFieldUI = () => act(ST.addDim({id:'d-try2', name:'Срок неплатежа в днях', obj:'obj-credit',
  src:'поле', key:'daysOverdue', perObject:'одно', dates:1, unit:'дн.'}));
ST.tryThirdKindUI = () => act(ST.addRecord({kind:'свод', id:'x-roll', name:'Свод портфеля',
  obj:'obj-credit', src:'поле', key:'amount', dates:1}));
/* Проверка ИС-21: «вид погашения» у КРЕДИТА многозначен — значит это не разрез кредита,
   а нижележащий объект «погашение», у которого вид один (ADR-0179 §1). */
ST.tryManyDimUI = () => act(ST.addDim({id:'d-repkind2', name:'Вид погашения', obj:'obj-credit',
  src:'поле', key:'kind', perObject:'много', dates:1}));
/* Корзина, которой в записи нет, — не запрос, а заявка владельцу реестра (ИС-23). */
ST.tryFreeBucketUI = () => act(ST.statSlice({obj:'obj-credit', dims:['d-cdate'], inds:['a-count'],
  date: ST.state.q.date, buckets:{'d-cdate':'неделя'}}));
/* Вывод записи: сначала поимённый список того, что сломается, потом решение человека.
   Молчаливого отказа по чужой публикации нет (ИС-25, ADR-0177 §4). Сам вывод — ДАТА
   прекращения, а не удаление: колонка витрины остаётся, в ней числа прошлых строк. */
ST.retireUI = id => {
  const r = ST.retire(id);
  if(r.needsConfirm){ ST.state.retire = {id, breaks: r.breaks, why: r.why}; return render(); }
  ST.state.retire = null; act(r, 'запись прекращает действие с сегодня — из витрины колонка не убрана');
};
ST.retireGoUI = () => {
  const q = ST.state.retire; if(!q) return;
  const r = ST.retire(q.id, true);
  ST.state.retire = null;
  act(r, r.ok ? 'запись прекращена с '+fmt(r.until)+'; сломано ссылок — '+(r.broke || []).length : '');
};
ST.retireCancelUI = () => { ST.state.retire = null; render(); };
/* Переезд породы — рядовое событие настройки: запись та же, идентификатор тот же, история
   дописывается. Сперва он пробуется как есть — и отказ САМ называет, каких реквизитов
   новой породы не хватает; потом они спрашиваются формой (ADR-0209, контекст). */
ST.changeKindUI = id => {
  const R = REC(id); if(!R) return;
  const to = R.kind === KIND.IND ? KIND.DIM : KIND.IND;
  const r = ST.changeKind(id, to);
  if(r.ok) return act(r, 'порода сменена: «'+r.was+'» → «'+r.kind+'», идентификатор и история те же');
  ST.state.kindMove = {id, to, why: r.why}; render();
};
ST.changeKindGoUI = () => {
  const q = ST.state.kindMove; if(!q) return;
  const g = id => (($('#'+id) || {}).value || '').trim();
  const extra = {src: g('kSrc')};
  if(q.to === KIND.DIM){ extra.perObject = g('kPer'); extra.key = g('kKey'); }
  else { extra.type = g('kType'); extra.unit = g('kUnit'); extra.key = g('kKey'); }
  const r = ST.changeKind(q.id, q.to, ST.state.role, extra);
  if(r.ok){ ST.state.kindMove = null; return act(r, 'порода сменена: «'+r.was+'» → «'+r.kind+
    '»; снято реквизитов прежней породы — '+r.dropped.length); }
  ST.state.kindMove = {id: q.id, to: q.to, why: r.why}; act(r);
};
ST.changeKindCancelUI = () => { ST.state.kindMove = null; render(); };
/* Ссылку публикует ПОТРЕБИТЕЛЬ вместе со своей редакцией — реестр её не угадывает. */
ST.publishUI = () => act(ST.publishRefs({consumer:'кураторство', edition:'карточка куратора, ред. 4',
  owner:'Кураторство', uses:['a-sumdebt','a-sumover']}), 'публикация принята — индекс обновлён');
ST.unpublishUI = () => act(ST.publishRefs({consumer:'кураторство', edition:'карточка куратора, ред. 4',
  owner:'Кураторство', uses:[]}), 'редакция опубликована без ссылок — прежние сняты');
ST.liveUI = (id, val) => act(ST.setLive(id, val));
/* Одиннадцатый объект — записи реестра подряд: сам объект, его СОБСТВЕННЫЕ разрезы,
   показатель и агрегат над ним. Ни одной правки движка (ИС-18, ADR-0149).
   Порядок с волны 17 ч.6 именно такой: денежная величина обязана НАЗВАТЬ разрез, внутри
   которого складывается (ИС-44, ADR-0214 §1), а назвать можно только уже существующее —
   потому разрезы заводятся первыми, и среди них «Валюта поручительства».
   Чужих разрезов в составе нет ни одного, и это не аккуратность, а запрет: «Территория
   выдачи кредита» определена на кредите, и поручительству она не принадлежит (ИС-40,
   ADR-0206 §3). Своя запись берёт ТОТ ЖЕ справочник значений — другой остаётся дорога
   до значения (ADR-0206 §5): второго экземпляра оргструктуры здесь не заводится. */
ST.addObjUI = () => {
  const o = ST.addObject({id:'obj-guarantee', name:'Поручительство', plural:'поручительства',
    owner:'Обеспечение', refName:'номер поручительства', born:{src:'поле', key:'gdate'},
    scope:{dim:'d-gcurator'}, dims:[], inds:['a-count']});
  if(!o.ok) return act(o);
  const own = [
    {id:'d-gbranch', obj:'obj-guarantee', name:'Подразделение поручительства', src:'история',
     key:'branch', perObject:'одно', dates:1, owner:'Оргструктура (кадры)', ref:'org',
     levels: clone(DIM('d-branch').levels)},
    {id:'d-gcurator', obj:'obj-guarantee', name:'Куратор поручительства', src:'история',
     key:'curator', perObject:'одно', dates:1},
    {id:'d-gregion', obj:'obj-guarantee', name:'Территория поручительства', src:'поле',
     key:'region', perObject:'одно', dates:1, owner:'Справочник административного деления',
     levels: clone(DIM('d-region').levels)},
    {id:'d-gptype', obj:'obj-guarantee', name:'Тип лица поручителя', src:'поле',
     key:'ptype', perObject:'одно', dates:1},
    {id:'d-gcur', obj:'obj-guarantee', name:'Валюта поручительства', src:'поле',
     key:'cur', perObject:'одно', dates:1}];
  for(const spec of own){ const r = ST.addDim(spec); if(!r.ok) return act(r); }
  const a = ST.addIndicator({id:'m-gsec', name:'Требования, обеспеченные поручительством', obj:'obj-guarantee',
    src:'шов', seam:'calcDebt', field:'principal', money:true, type:'сумма', dates:1,
    roll:'формульный', rollBy:'d-gcur'});
  if(!a.ok) return act(a);
  const b = ST.addIndicator({id:'a-sumgsec', name:'Обеспечено поручительствами, итого', obj:'obj-guarantee',
    src:'агрегат', fn:'sum', over:'m-gsec', dates:1});
  if(!b.ok) return act(b);
  act({ok:true}, 'объект заведён с пятью своими разрезами; денежная величина пришла парой — '+
    'валютная «'+IND('m-gsec').name+'» и сомовая «'+IND(a.som).name+'»: строки появятся ближайшим прогоном');
};

/* ------- ЭКРАН РЕЕСТРОВ: АДРЕС ВЕЛИЧИНЫ (ИС-51, ADR-0222) ------- *
   Адрес — вещь, которую потребитель обязан УЗНАТЬ, а не угадать, поэтому дверь стоит на
   экране, а не только в смоуке. Отказ здесь показывается ЦЕЛИКОМ, вместе с дорогой:
   отказ без дороги — половина ответа (§8.4).                                          */
ST.whereUI = id => {
  const r = ST.where(id, 'obj-credit');
  toast(r.ok ? 'адрес: '+r.address+' — '+r.name : r.why + (r.road ? ' · ДОРОГА: '+r.road : ''),
    r.ok ? 'ok' : 'err');

};

  toast(r.ok ? 'владелец «'+r.owner+'» отдал '+r.rows.length+' строк на '+fmt(r.at)+
    ' · '+r.passport.scope : r.why, r.ok ? 'ok' : 'err');

/* Колонка ссылок — вторая хранимая вещь модуля после строк среза (ADR-0177 §1). */
function refCell(id){
  const rs = ST.refsTo(id);
  if(!rs.length) return '<span class="muted">—</span>';
  return '<b>'+rs.length+'</b> <span class="small">'+esc(rs.map(r => r.consumer).join(' · '))+'</span>';
}
/* Дорога до значения общая обеим породам: это АДРЕС, а не формула (ADR-0150). */
function roadCell(r){
  return r.src === 'шов' ? '<span class="pill info">шов ядра</span> <span class="mono">'+esc(r.seam)+'.'+esc(r.field)+'</span>' :
    r.src === 'агрегат' ? '<span class="pill ok">агрегат</span> <span class="mono">'+esc(r.fn)+(r.over ? '('+esc(r.over)+')' : '()')+'</span>' :
    r.src === 'история' ? '<span class="pill neutral">история</span> <span class="mono">'+esc(r.key)+'</span>' :
    '<span class="pill neutral">поле объекта</span> <span class="mono">'+esc(r.key || '')+'</span>';
}
/* Число дат стоит рядом с дорогой, потому что это про ту же величину: дорога говорит,
   ОТКУДА её взять, а этот реквизит — СКОЛЬКО СРЕЗОВ для этого нужно (ИС-47, ADR-0220). */
function datesCell(r){
  return '<div class="small">дат среза: <b>'+(r.dates || 1)+'</b></div>';
}
/* Вторая половина СТРОКИ реестра — та же, что вторая половина формы: она читается по
   породе записи, и колонка у обеих пород одна (ADR-0209 §7). */
function kindCell(r){
  if(r.kind === KIND.IND){
    const t = typeOf(r), u = unitOf(r);
    return '<b>'+esc(t || '—')+'</b>'+(u ? ' · '+esc(u) : '')+
      '<div class="small">свод: '+esc(r.roll || '—')+(ST.liveOf(r.id).live ? '' : ' · считается прогоном')+
      (r.flow ? ' · нарастающий' : '')+
      (r.dedupBy ? ' · один раз на «'+esc((DIM(r.dedupBy) || {}).name || r.dedupBy)+'»' : '')+'</div>';
  }
  return (r.levels ? '<span class="pill info">уровни</span> '+esc(r.levels.map(L => L.name).join(' → ')) :
      r.buckets ? '<span class="pill neutral">корзины: '+esc(r.buckets.join(' · '))+'</span>' : '<span class="muted">значения строк</span>')+
    '<div class="small">порядок: '+esc(r.order || '—')+

    'то же число умеет посчитать ядро: ядро <b>выводит</b>, статистика <b>датирует</b> (ADR-0145), и '+
    'потребитель разговаривает с датирующим слоем. Шов ядра при этом не отменён — у него другой '+
    '<b>круг вызывающих</b>: им снимает срез статистика и пользуется учётный контур. Три двери к '+
    'одному числу — это <code>E2E-09</code> дословно: расхождение появится не там, где ошиблись, а '+
    'там, где сравнили (ИС-51, ADR-0222).</p>'+
    '<table class="cgrid"><thead><tr><th>Спрошено</th><th>Что это</th><th>Адрес</th>'+
    '<th>Чем отвечает</th><th>Основание / дорога</th></tr></thead><tbody>'+w51+'</tbody></table>'+
    '<div class="btn-row"><button class="btn btn-secondary" onclick="ST.whereUI(\'calcDebt\')">'+
      'Спросить сумму долга у шва ядра</button>'+
    '<button class="btn btn-secondary" onclick="ST.liveRowsUI(\'obj-borrower\')">'+
      'Спросить живой реквизит у заёмщика</button>'+
    '<button class="btn btn-secondary" onclick="ST.whereUI(\'m-vydumka\')">'+
      'Спросить величину, которой нет</button>'+
    '<button class="btn btn-primary" onclick="ST.mixUI()">Смешать в одной строке</button></div>'+
    '<h3 class="section-h">Перечень полей карточки объявляет владелец</h3>'+
    '<p class="page-lead">Перечень объявлен <b>владельцем объекта</b>, а не выведен статистикой из '+
    'своих разрезов. Вывести было бы соблазнительно — имена почти совпадают, — и неверно: разрез '+
    'отвечает «в каком множестве строка <b>была на дату</b>», реквизит — «что в карточке <b>сейчас</b>». '+
    'Совпадение имён не случайность, а устройство: у одной вещи есть датированная сторона и живая, и '+
    'адреса у них <b>разные, потому что вопросы разные</b> (ADR-0222 §3). Пары объявлены '+
    '<b>реквизитом</b>, а не догадкой по имени. Объект здесь <b>один</b>, и это не заготовка: в v1 шов '+
    'отвечает по объектам ядра — «отчётность в режиме „сейчас“ получает кредиты» (ADR-0181, п. 4 '+
    '«Последствий»); перечни заёмщика, залога и платежей объявят их владельцы своими волнами. Пока не '+
    'объявили, живого адреса у потребителя <b>нет</b>, и выдумать его он не вправе.</p>'+
    '<table class="cgrid"><thead><tr><th>Поле карточки</th><th>Наименование</th>'+
    '<th>Датированная сторона — запись реестра</th></tr></thead><tbody>'+cf51+'</tbody></table>'+
    '<p class="note">Владелец перечня — <b>'+esc(ST.cardOwner('obj-credit'))+'</b>. Всякая величина '+
    'здесь «текущее» <b>по построению</b>: у карточки истории нет вовсе, и признак ей не приписывается '+
    'снаружи — она такова (ИС-39, ADR-0205 §2). Историчные реквизиты — подразделение, куратор, '+
    'состояние — карточка отдаёт <b>сегодняшним</b> значением, и именно этим они опасны в отчёте за '+
    'май: у среза они лежат майскими (ИС-4), у карточки — нынешними, и <b>оба ответа верны</b>. '+
    'Область видимости считается <b>внутри</b> шва, и скрытое называется <b>числом</b>; отказ по '+
    'объёму двоичный — половины списка не бывает (ADR-0181 §5, §6).</p>'+mixCard;
  return '<h2 class="section-h">Реестр объектов статистики</h2>'+
    '<p class="page-lead">Объект — <b>запись</b>, а не ветка кода: шестой заводится строкой, а не релизом '+
    '(ИС-18, ADR-0149). Заёмщик стоит здесь <b>самостоятельным</b> объектом, а не свёрткой строк кредитов: '+
    'заёмщик с тремя кредитами при свёртке посчитался бы трижды, а заёмщик без действующих кредитов '+
    'исчез бы вовсе (ИС-19).</p>'+
    '<table class="cgrid"><thead><tr><th>Объект</th><th>Владелец множества</th><th>Разрезы</th>'+
    '<th>Показатели</th><th>Рождение</th><th>Объектов в мире</th></tr></thead><tbody>'+objs+'</tbody></table>'+
    '<h2 class="section-h">Реестр: одна кладовая, две породы</h2>'+
    '<p class="page-lead">Реестр <b>один</b>, и запись объявляет свою <b>породу</b> — показатель или '+
    'разрез, — а порода определяет набор обязательных реквизитов (ИС-43, ADR-0209). Записей '+
    '<b>'+st.registry.length+'</b>: '+st.indicators.length+' показателей и '+st.dims.length+' разрезов, '+
    'и лежат они <b>вместе</b>: породу каждой называет она сама, а не массив, в который её положили. '+
    'Двух реестров здесь нет намеренно — общих реквизитов больше, чем различающихся (объект, права, '+
    'даты действия, журнал, порождение схемы витрины), а переезд записи из породы в породу — '+
    '<b>рядовое событие настройки</b>, которое при двух реестрах стало бы удалением и заведением '+
    'заново с потерей истории. Записи, которой здесь нет, не существует ни для кого — ни для витрины, '+
    'ни для предиката, ни для выгрузки (ИС-7). Общий контракт двух потребителей — статистики и '+
    'классификации — переехал сюда из классификации (ADR-0146 §4, врезка в ADR-0120 §2): общий '+
    'контракт не живёт внутри одного из потребителей.</p>'+
    '<table class="cgrid"><thead><tr><th>ID</th><th>Наименование</th><th>Порода</th>'+
    '<th>Дорога до значения</th><th>Реквизиты породы</th><th>Действует с</th>'+
    '<th>Ссылки потребителей</th><th>Действия</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="note">Колонка «дорога до значения» <b>общая</b> обеим породам: это адрес, а не формула — '+
    'запись говорит, откуда взять величину (ADR-0150). Колонка «реквизиты породы» и есть вторая '+
    'половина формы, прочитанная обратно. Значение разреза ложится <b>в строку</b> и больше не '+
    'резолвится никогда: строка от 31.05 несёт куратора и категорию мая, а не сегодняшние (ИС-4); '+
    'новая запись действует <b>вперёд</b> — прошлое ею не размечается. У каждой записи назван '+
    '<b>объект</b>, и имя им уточнено: не «территория», а «территория заёмщика» и «территория выдачи '+
    'кредита» — <b>две записи</b> (ИС-40, ADR-0206). «Дней просрочки» и «Срок неплатежа» — тоже две '+
    'записи разных пород об <b>одной величине</b>, и вторая называет первую своим <b>основанием</b>, '+
    'а границы держит в реестре (ADR-0209 §5). Колонка ссылок — вторая хранимая вещь модуля после '+
    'строк среза: ссылку публикует потребитель вместе со своей редакцией (ADR-0177 §1, §2). '+
    'Исчислимость налету правится только у агрегатов: у шва и поля она производна от источника '+
    '(ADR-0159, врезка). Уровни несёт <b>разрез</b>, а не отдельный реестр иерархий: иерархия '+
    'существует только как способ спросить (ADR-0176 §1, §7).</p>'+refCard+moveCard+form+martCard+addrCard+
    '<div class="card"><h3>Чего здесь завести нельзя</h3>'+
    '<div class="kv">'+
    '<div class="k">формулу — ни у одной породы</div><div class="v">формула породила бы второй способ '+
      'получить сумму — это E2E-09 с другой стороны (ИС-6, ADR-0150, ADR-0209 §4)</div>'+
    '<div class="k">третью породу</div><div class="v">свод, темп, дельта и скользящее среднее записями '+
      'реестра не становятся: одна дата — колонка статистики, много дат — работа анализа '+
      '(ADR-0209, границы)</div>'+
    '<div class="k">реквизит чужой породы</div><div class="v">единица измерения у признака и иерархия '+
      'у числа — не лишнее поле, а запись, про которую не объявлено, чем она должна быть: проверить '+
      'в ней нечего (ADR-0209 §1–§3)</div>'+
    '<div class="k">удаление записи</div><div class="v">в строках прошлого её колонка заполнена: '+
      'удалённая запись оставит число без имени. Запись <b>прекращает действие с даты</b> '+
      '(ADR-0209 §6)</div>'+
    '<div class="k">долю и «процент от»</div><div class="v">представление, а не показатель: '+
      'считаются при показе из двух чисел и не хранятся (ИС-15). Сомового эквивалента в этом ряду '+
      'больше нет — он <b>величина</b> и лежит своей колонкой (ИС-44, ADR-0214)</div>'+
    '<div class="k">хранимый агрегат</div><div class="v">агрегат рядом с детализацией разойдётся с ней, '+
      'и объяснить это будет нечем (ИС-3)</div>'+
    '<div class="k">четвёртый шов</div><div class="v">швов три, каждый назван вопросом; «дай всё» — '+
      'не вопрос (ADR-0152 §1)</div>'+
    '<div class="k">правку строки среза</div><div class="v">строку пишет только прогон: правка руками '+
      'уничтожает смысл датированного среза (ИС-2)</div>'+
    '<div class="k">свою защёлку статистики</div><div class="v">защёлка одна — закрытие учётного периода '+
      'человеком; своего «периода статистики» нет (ИС-9)</div>'+
    '<div class="k">многозначный разрез</div><div class="v">если у объекта значений разреза много, '+
      'это не разрез, а нижележащий объект: разрез отвечает на «в каком множестве строка», а строка '+
      'в двух множествах сразу не бывает (ИС-21, ADR-0179 §1)</div>'+
    '<div class="k">корзину «по неделям» мимо реестра</div><div class="v">набор корзин объявлен записью '+
      'разреза; свободной корзины в запросе не существует — новая заводится строкой (ИС-23)</div>'+
    '<div class="k">свою краткую форму паспорта</div><div class="v">форм ровно две, и обе объявила '+
      'статистика: иначе три модуля сократят по-разному (ИС-24)</div>'+
    '</div></div>';
}

/* ======================== ЭКРАН 4: ВЫГРУЗКИ ========================== *
   Сверка целиком — не «показать 20 000 строк на экране», а задание с файлом, и
   паспорт едет ВНУТРИ файла: файл живёт дольше экрана и уходит из системы, а
   число без даты расчёта за её пределами уже не восстановить (ADR-0178 §5).   */
ST.exportDemoUI = () => act(ST.exportJob({obj:'obj-repay', date: ST.state.q.date, filter: null}),
  'выгрузка оформлена');
/* Выгрузка за ЗАКРЫТЫЙ период — чтобы пометку расхождения было на чём показать: перезакройте
   май на экране «Журнал срезов», и это задание пометится, не изменившись ни числом (ИС-50). */
ST.exportClosedUI = () => act(ST.exportJob({obj:'obj-credit', date:'2026-05-31', filter: null}),
  'выгрузка за закрытый май оформлена');
function viewExports(){
  const list = ST.exportsList();
  const rows = list.map(j => '<tr><td class="mono">'+esc(j.id)+'</td>'+
    '<td>'+esc(OBJ(j.obj) ? OBJ(j.obj).name : j.obj)+'</td>'+
    '<td>'+fmt(j.date)+'</td><td class="num">'+j.n+'</td>'+
    '<td>'+esc(j.by)+'</td><td>'+fmt(j.at)+'</td>'+
    '<td><span class="pill neutral">'+esc(j.state)+'</span>'+
      ((j.marks || []).length ? ' <span class="pill warn">числа изменились после сдачи</span>' : '')+'</td>'+
    '<td class="mono small">'+esc(j.file)+'</td></tr>'+
    '<tr><td colspan="8">'+
      /* Пометка стоит НАД паспортом и произносится вслух: молчащее расхождение со сданным
         обнаруживает получатель, а не мы (ИС-50, ADR-0157 §5). Задание при этом не тронуто —
         числа мёрзнут один раз (ИО-4), переиздавать решает человек (ИО-34). */
      (j.marks || []).map(k => '<div class="banner warn"><b>Расхождение со сданным.</b> Период '+
        esc(monLabel(k.period))+' перезакрыт распоряжением '+esc(k.order)+' ('+esc(k.basis)+'), '+
        'помечено '+fmt(k.at)+'. Задание <b>не пересобрано</b>: номер, файл, число строк и паспорт '+
        'те же — метка не отзывает сданное, она не даёт молча считать его верным. Переиздавать '+
        'корректирующей выгрузкой или нет — решение человека (ИО-4, ИО-34, ADR-0157 §5).</div>').join('')+
      '<div class="small muted" style="margin-bottom:4px">Паспорт внутри файла — '+
      'первыми строками, до данных:</div>'+passportHtml(j.passport)+'</td></tr>').join('');
  return '<h2 class="section-h">Выгрузки</h2>'+
    '<p class="page-lead">Порог показа отсекает <b>экран</b>, а не работу: тому, кому нужна сверка '+
    'целиком, дорога есть — задание на выгрузку. Усечённого и постраничного ответа не бывает: '+
    'усечение молча меняет ответ на вопрос «сколько», а страница №7 — это ответ без вопроса '+
    '(ИС-22, ADR-0178 §1, §5).</p>'+
    '<div class="card"><h3>Очередь заданий</h3>'+
    (list.length ? '<table class="cgrid"><thead><tr><th>Задание</th><th>Объект</th><th>Дата среза</th>'+
      '<th>Строк</th><th>Кто</th><th>Когда</th><th>Состояние</th><th>Файл</th></tr></thead><tbody>'+
      rows+'</tbody></table>'
     : '<div class="banner info">Заданий нет. Отказ <code>statRows</code> по порогу предлагает оформить '+
       'выгрузку — оттуда задания и берутся.</div>')+
    '<div class="btn-row"><button class="btn btn-secondary" onclick="ST.exportDemoUI()">Оформить выгрузку '+
      'погашений на дату среза</button>'+
      '<button class="btn btn-secondary" onclick="ST.exportClosedUI()">Оформить выгрузку за закрытый '+
      'май (её пометит перезакрытие)</button></div>'+
    '<p class="note">Паспорт <b>внутри файла</b>, а не в письме рядом: письмо теряется, файл пересылают. '+
    'Дата расчёта, фиксация, область видимости и фильтр едут первыми строками — иначе через месяц число '+
    'в файле нечем объяснить (ИС-10, ADR-0178 §5).</p></div>'+
    '<div class="card"><h3>Чего на этом экране нет</h3><div class="kv">'+
    '<div class="k">кнопки «показать все строки»</div><div class="v">порог двоичен: полный список '+
      'или отказ с числом — третьего ответа у шва нет (ADR-0178 §1)</div>'+
    '<div class="k">страниц</div><div class="v">страница №7 — ответ без вопроса: вопрос сужается '+
      'разрезом, а не листанием (ИС-22)</div>'+
    '<div class="k">файла без паспорта</div><div class="v">число без даты расчёта за пределами '+
      'системы не восстановить (ИС-10)</div>'+
    '<div class="k">порога в модели</div><div class="v">порог — параметр эксплуатации: сегодня 12, '+
      'завтра 500, и модель от этого не меняется (ADR-0178 §2)</div>'+
    '<div class="k">переиздания по пометке</div><div class="v">пометка — не переиздание: числа мёрзнут '+
      'один раз (ИО-4), а переиздавать корректирующей выгрузкой решает человек (ИО-34). Система лишь '+
      'не даёт сделать вид, что перезакрытия периода не было (ИС-50, ADR-0157 §5)</div>'+
    '</div></div>';
}

if(typeof window !== 'undefined') window.ST = ST;
if(typeof document !== 'undefined') render();
</script>
</body>
</html>
