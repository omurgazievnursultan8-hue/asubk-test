  ['dims','inds'].forEach(k => {
    Object.keys(was[k]).concat(Object.keys(now[k])).forEach(id => {
      if(out.indexOf(id) >= 0) return;
      if(JSON.stringify(was[k][id]) !== JSON.stringify(now[k][id])) out.push(id);
    });
  });
  return out;
}
/* Колонка источника В СРАВНЕНИЕ НЕ ВХОДИТ, и это то же правило, что развело состояние с
   оболочкой в ч.7: `srcs` — судьба строки, а не состояние объекта. Ночь, в которую ядро
   молчало по другой причине, чем вчера, объект не изменила; отчитывается о ней ЖУРНАЛ, и
   двух отчётов об одном событии не заводится (ADR-0215 §3). Молчание при этом бесследным
   не остаётся: величины исчезают, а исчезновение величины — самое настоящее изменение
   состояния, и строку оно порождает (ADR-0208 §1).                                     */
/* Дозаполнение и перезапись — РАЗНЫЕ события (ADR-0208 §4), и разделяет их не догадка, а
   пара условий: сосед молчал, теперь ответил, а поле было пусто и теперь есть. «Было
   отсутствие, стало значение» — не перезапись: переписывать было нечего.
   Сливать их нельзя ни в какую сторону. Назови дозаполнение перезаписью — и утренний
   разбор ночи утонул бы в тысячах «переписано» там, где ничего не переписывали, а
   настоящая перезапись, которую и надо объяснять получателю, потерялась бы среди них.
   Назови перезапись дозаполнением — и молча изменённое число ушло бы без следа.        */
function splitDiff(was, now, ids){
  const filled = [], rewrote = [];
  ids.forEach(id => {
    const k = (was.dims[id] !== undefined || now.dims[id] !== undefined) ? 'dims' : 'inds';
    const nb = nbOfRec(id);
    const wasSilent = nb && was.srcs && was.srcs[nb] && !was.srcs[nb].ok;
    const nowOk     = nb && now.srcs && now.srcs[nb] && now.srcs[nb].ok;
    const appeared  = was[k][id] === undefined && now[k][id] !== undefined;
    (wasSilent && nowOk && appeared ? filled : rewrote).push(id);
  });
  return {filled, rewrote};
}
/* Сосед ЗАПИСИ реестра — тот, чей шов она читает. У записи-поля и записи-истории соседа
   нет вовсе: их отдаёт сам владелец множества, и промолчать тут некому. Сомовая сторона
   наследует соседа своей валютной — считает её ядро, но ЧИТАЕТ она чужой шов (ADR-0214 §3). */
function nbOfRec(id){
  const r = REC(id);
  if(!r) return null;
  if(r.somOf) return nbOfRec(r.somOf);
  return r.src === 'шов' ? nbOfSeam(r.seam) : null;
}
/* Предыдущее состояние объекта — последняя его строка СТРОГО РАНЬШЕ спрошенной даты.
   Именно с ней сравнивается новая: сравнение с «вчера» было бы неверным при разрежённом
   хранении — вчерашней строки может не быть вовсе, и объект, менявшийся месяц назад,
   каждую ночь выглядел бы изменившимся. */
function lastRowBefore(st, objId, ref, dateISO){
  let hit = null;
  for(const r of st.rows)
    /* Легаси-строка предыдущей для прогона НЕ БЫВАЕТ: `rowDiff` сравнил бы редакции формы
       и объявил бы изменением отсутствие величин, которых старая система не собирала, —
       журнал отчитался бы «дозаполнено» там, где просто другая форма (ИС-41, ADR-0207 §2, §5). */
    if(r.obj === objId && r.ref === ref && r.date < dateISO && !isLegacyRow(r) &&
       (!hit || hit.date < r.date)) hit = r;
  return hit;
}
/* Состав пишется ПОИМЁННО и ОДНИМИ И ТЕМИ ЖЕ колонками у обоих писателей строки —
   прогона и защёлки. «Строк — 46» не говорит, какое множество не доехало; объект, у
   которого владелец отдал ноль, обязан быть виден строкой с нулём, а не отсутствием
   строки (СС-Д6). Ненаступившее и безродное считаются порознь: «строк — 0» само по себе
   не отличает «ещё никого не было» от «владелец не отдал множество». Волна 17 ч.7
   добавила к ним третье — `same`, «не менялось»: строк нет и не должно быть.
   Форма части ОДНА на прогон и на защёлку. Разойдись они — читателю журнала пришлось бы
   сперва узнать, кто запись сделал, чтобы понять её колонки, а суточный итог по журналу
   пришлось бы складывать двумя разными способами. */
/* Волна 17 ч.8 добавила `partial` и `filled`: сколько строк написано неполными и сколько
   доукомплектовано в этот прогон. Первое — состояние ночи, второе — её работа, и
   складывать их в одно число нельзя: «неполных 12» после прогона, доукомплектовавшего 40,
   и «неполных 12» после прогона, не добравшего ничего, — разные ночи (ADR-0208 §4, §6). */
/* Волна 17 ч.9 добавила `skip` — «не кандидат, не обходился». Сложить его с `same`
   нельзя ни в какую сторону: «посмотрели и не изменилось» и «не смотрели вовсе» — разные
   ночи и разная цена, и ровно на их различении держится весь ИС-48. Слей их — и ночь,
   в которую опрос не состоялся, выглядела бы как ночь, в которую ничего не менялось
   (ADR-0221, последствия: «кандидатов не было» обязано отличаться от «опрос не
   состоялся»). Полнота счёта тоже требует колонки: живых столько же, сколько было, и
   без `skip` сумма перестала бы сходиться с составом (проверка #63).                   */
function newTally(){ return {n:0, kept:0, unborn:0, noborn:0, same:0, born:0, have:0,
                             partial:0, skip:0, rewrote:[], filled:[]}; }
function partOf(o, t){
  return {obj: o.id, name: o.name, n: t.n, kept: t.kept, unborn: t.unborn, noborn: t.noborn,
          same: t.same, born: t.born, have: t.have, partial: t.partial, skip: t.skip,
          rewrote: t.rewrote, filled: t.filled};
}
/* До рождения строки НЕТ — и это третье состояние, не «пусто» и не «ноль» (ИС-33).
   Строка, написанная на дату, когда объекта ещё не было, сочиняет прошлое: любое
   движение, взятое разностью двух дат, окажется придуманным, а состав среза на старую
   дату — сегодняшним. Отбор живых читается ОДНИМ местом на прогон и защёлку: разойдись
   они — «ещё не родился» у одного значило бы «пиши строку» у другого, и плотный слепок
   разошёлся бы с составом среза на ту же дату (ИС-14). */
function eachAlive(o, dateISO, t, fn){
  (WORLD[o.id] || []).forEach(item => {
    const bornAt = bornOn(o, item, dateISO);
    if(bornAt == null){ t.noborn++; return; }
    if(bornAt > dateISO){ t.unborn++; return; }
    fn(item);
  });
}

/* ========== ОПРОС СОСЕДЕЙ И СОСТАВ КАНДИДАТОВ (ИС-48, ИС-49, ADR-0221) ==========
   Ночь конечна, портфель растёт, а меняются единицы процентов объектов. Два очевидных
   ответа плохи по-разному. «Весь портфель каждую ночь» — это обход ради копии вчерашнего:
   ADR-0215 запретил такую копию ЗАПИСЫВАТЬ, но обходить её продолжали, и волна 17 ч.7
   честно назвала свою границу — «разрежённой стала ЗАПИСЬ, а не ОБХОД». «Только те, у
   кого критическая дата» (предложение разработчиков) молча теряет всё событийное: пришёл
   платёж, сменилась категория, кредит реструктурирован, заёмщик переехал в другую
   область — критической даты ни одно из этих изменений не порождает, и объект просто не
   попадёт в ночь. Дефект проявится не ночью, а через месяц расхождением свода с
   реальностью, и виноватым будет выглядеть свод.
   Поэтому обход берёт КАНДИДАТОВ, и кандидат — объединение источников, ни один из
   которых не выводится из остальных (ADR-0221 §1).
   КАНДИДАТ — НЕ ОБЕЩАНИЕ ИЗМЕНЕНИЯ, А АДРЕС РАБОТЫ. Кандидат, у которого ничего не
   изменилось, ложится в «без изменений» — и это правильный конец ночи, а не промах
   опроса: критическая дата говорит «посмотри», очередь говорит «посмотри», деградация
   соседа говорит «посмотри всех его». Поэтому колонка `same` после этой волны не
   опустела и не потеряла смысла — она стала означать ровно то, что называет.
   ЧТО ТУТ НЕ ЭКОНОМИТСЯ. Настоящий сосед отвечает из своего журнала изменений и знает
   изменившихся, не перебирая всех. Зеркала такого журнала в макете нет, и «кто изменился
   после `T`» считается сравнением его же значений на две даты — то есть двойным обходом.
   Макет платит эту цену НАРОЧНО: он показывает СОСТАВ КАНДИДАТОВ и его последствия, а не
   экономию ночи. Ночь экономится там, где у соседа есть журнал.                       */
const CAND_SRC = ['опрос','критическая дата','свой факт','очередь'];
/* Поводы попасть в очередь названы списком, как причины молчания: очередь — способ
   ПОСТАВИТЬ работу (ADR-0196), а работа, поставленная неизвестно зачем, не разбирается
   никогда и снять её нечем. Дозаполнение ставит прогон сам (ADR-0208 §5), досчёт и
   распоряжение ставит человек.                                                        */
const QUEUE_WHY = ['дозаполнение','досчёт','распоряжение'];

/* Соседи ЗАПИСИ — множественное число нарочно: у иерархического разреза шов может стоять
   на любом уровне, и `nbOfRec` (одно имя) их не различает — он и писался для другого,
   для колонки источника плоской записи. Сомовая сторона идёт за своим основанием.      */
function nbsOfRec(id){
  const r = REC(id);
  if(!r) return [];
  if(r.somOf) return nbsOfRec(r.somOf);
  const out = [];
  const put = x => { if(x && out.indexOf(x) < 0) out.push(x); };
  if(r.levels) r.levels.forEach(L => { if(L.src === 'шов') put(nbOfSeam(L.seam)); });
  else if(r.src === 'шов') put(nbOfSeam(r.seam));
  return out;
}
/* Записи объекта, которые читаются У ЭТОГО соседа. Пустой список значит, что объект к
   соседу не ходит вовсе, — и тогда ни его ответ, ни его молчание объекта не касаются. */
function nbRecsOf(o, nbId){
  return o.dims.concat(o.inds).filter(id => nbsOfRec(id).indexOf(nbId) >= 0);
}
/* Разбор состава объекта — ОДИН на прогон, а не один на запись мира: кто чей, знает
   реестр, и от объекта к объекту это не меняется в течение ночи. Своим считается то, у
   чего соседа нет вовсе (поле и история); сомовая сторона не спрашивается ни у кого —
   она пересчёт, и двигает её курс (второе множество).                                  */
function scanPlan(o){
  const plan = {own: [], nb: {}, money: []};
  o.dims.concat(o.inds).forEach(id => {
    const r = REC(id) || {};
    if(r.somOf) return;
    const nbs = nbsOfRec(id);
    if(!nbs.length) plan.own.push(id);
    else nbs.forEach(x => (plan.nb[x] || (plan.nb[x] = [])).push(id));
  });
  o.inds.forEach(id => { const r = REC(id); if(r && r.money && !r.somOf) plan.money.push(id); });
  return plan;
}
/* Значение БЕЗ ОБСТАНОВКИ: курс и дата курса выброшены, остаются число и валюта.
   Сравнивай с курсом — и в ночь его смены сосед назвал бы всех своих валютных, а второе
   множество (критическая дата) вывелось бы из первого, чего ADR-0221 §1 прямо не
   допускает: курс — факт ВРЕМЕНИ, а не факт соседа, и у соседа в ту ночь ничего не
   менялось. Основание пересчёта (`from`, `round`) выброшено по тому же доводу.         */
function bareOf(v){
  if(v == null || typeof v !== 'object') return v == null ? null : v;
  if(Array.isArray(v)) return v.map(bareOf);
  const out = {};
  Object.keys(v).forEach(k => {
    if(k !== 'rate' && k !== 'rateDate' && k !== 'from' && k !== 'round') out[k] = bareOf(v[k]);
  });
  return out;
}
/* Проба записи на дату идёт ТЕМ ЖЕ читателем, что и сборка строки (ИС-18): заведи здесь
   второй — и «изменился» у поиска кандидатов значило бы не то же, что «изменился» у
   прогона, а объект, честно названный, писался бы в `same`. Контекст спроса не
   передаётся: поиск кандидатов колонок источника НЕ СТАВИТ — колонка принадлежит
   написанной строке, а не разведке (ADR-0208 §2).                                     */
function probeRec(id, item, dateISO){
  return DIM(id) ? readDim(id, item, dateISO, null) : readInd(id, item, dateISO, null);
}
const sameVal = (a, b) => JSON.stringify(bareOf(a)) === JSON.stringify(bareOf(b));

/* ---- 1. ОПРОС: «КТО ИЗМЕНИЛСЯ ПОСЛЕ T» (ИС-49, ADR-0221 §6) ----
   Наружу уходят ТОЛЬКО КЛЮЧИ. Значения прогон возьмёт швами, как и всегда; отдай сосед
   значения — завёлся бы второй путь к числам, ровно устройство легаси-остатка (E2E-09),
   и сверять пришлось бы два ответа одного соседа.
   ВТОРАЯ ГРАНИЦА, названная вслух: сосед отвечает в СВОИХ ключах, а кандидат — объект
   СТАТИСТИКИ. В зеркале они совпадают (запись мира — она же запись реестра объекта), в
   жизни не совпадают: изменившийся кредит делает кандидатами своего заёмщика, свой
   залог, своё дело, своё требование. Разворачивает ответ соседа в ключи статистики
   ВЛАДЕЛЕЦ МНОЖЕСТВА (ИС-31), и это отдельная, ещё не сделанная работа — в ADR-0221 её
   нет ни строкой.                                                                     */
function fedChanged(recs, item, sinceISO, atISO){
  for(let i = 0; i < recs.length; i++)
    if(!sameVal(probeRec(recs[i], item, sinceISO), probeRec(recs[i], item, atISO))) return true;
  return false;
}
/* ---- 2. КРИТИЧЕСКАЯ ДАТА: ВЕЛИЧИНА МЕНЯЕТСЯ ОТ ВРЕМЕНИ, БЕЗ СОБЫТИЯ (ADR-0193) ----
   В зеркале такая дата ровно одна и она настоящая — ДАТА КУРСА. Валютная клетка несёт
   применённый курс и его дату (ADR-0214 §4), сомовая сторона из них и считается: новый
   курс меняет обе, а сосед об этом молчит, потому что у него ничего не менялось.
   Знает такие даты ЯДРО (ADR-0221 §1), и спрос идёт к нему — к `RATES`, а не к строкам:
   выведи множество из строк — и объект, у которого за месяц не было ни одного события,
   ушёл бы в свод с майским курсом на августовской дате.                                */
function movedCurs(sinceISO, atISO){
  const out = [];
  Object.keys(RATES).forEach(cur => {
    if(cur === 'KGS') return;
    if(RATES[cur].some(r => r[0] > sinceISO && r[0] <= atISO)) out.push(cur);
  });
  return out;
}
/* В какой валюте объект стоит на дату. Сомовая сторона не спрашивается: она и есть
   пересчёт, а не источник валютности. */
function fxCursOf(money, item, dateISO){
  const out = [];
  money.forEach(id => {
    const c = readInd(id, item, dateISO, null);
    if(!c) return;
    const list = (c.parts && c.parts.length) ? c.parts.map(p => p.cur) : [c.cur];
    list.forEach(x => { if(x && x !== 'KGS' && out.indexOf(x) < 0) out.push(x); });
  });
  return out;
}
/* ---- 3. СВОЙ ФАКТ ВЛАДЕЛЬЦА МНОЖЕСТВА ----
   ADR-0221 §1 называет это множество «объекты, у которых изменился разрез» (ADR-0147 §3),
   и в макете оно оказалось УЖЕ ЖИЗНИ на два случая — оба нашлись сразу, оба записаны
   волной как находки к решению:
   (а) РОЖДЕНИЕ не входит ни в одно из четырёх множеств. Залоговый договор и кредитная
       программа не ходят ни к одному соседу вовсе (`{поле, история, агрегат}`), валюты у
       них нет, в очередь их никто не ставит — и по букве §1 первой своей строки они не
       получили бы никогда. Рождение — такой же собственный ДАТИРОВАННЫЙ факт владельца,
       как разрез (ИС-33, ADR-0197: рождение ОБЪЯВЛЕНО реквизитом и читается тем же
       читателем), и множество расширено до «свой датированный факт: разрез ИЛИ рождение».
   (б) СОБСТВЕННАЯ ВЕЛИЧИНА-ПОЛЕ владельца — тоже не разрез. Сумма кредита лежит полем, а
       не швом; в демо-мире она меняется в те же ночи, что и величины ядра, и потому
       спрятана за первым множеством, но совпадение это не закон.
   Отсюда мерка: своё — то, у чего СОСЕДА НЕТ ВОВСЕ (`nbsOfRec` пуст), то есть поле и
   история; их отдаёт сам владелец множества, и промолчать тут некому.                  */
function ownChanged(recs, item, sinceISO, atISO){
  for(let i = 0; i < recs.length; i++)
    if(!sameVal(probeRec(recs[i], item, sinceISO), probeRec(recs[i], item, atISO))) return true;
  return false;
}

/* Последний СОСТОЯВШИЙСЯ прогон строго раньше спрошенной даты — окно для времени и для
   владельца множества. Пары «прогон + сосед» у них нет: у времени нет журнала, а
   владелец не опрашивается, — окно им задаёт сам прогон своей последней датой. Пропуск в
   счёт не идёт (ИС-20): в ту ночь никто ничего не смотрел, и окно обязано её накрыть. */
function lastScan(st, dateISO){
  let hit = null;
  st.runs.forEach(r => { if(r.kind !== 'пропуск' && r.date < dateISO && (hit == null || hit < r.date)) hit = r.date; });
  return hit;
}
/* Третья находка волны, и её в ADR-0221 тоже нет. ПОВТОРНЫЙ прогон за уже пройденную
   дату — не приращение, а УДОСТОВЕРЕНИЕ: у соседей `T` уже не раньше спрашиваемой даты,
   окно опроса пусто, и кандидатов не нашлось бы ни одного — внеплановый пересчёт по
   распоряжению и дозаполнение молчавшего соседа тихо не сделали бы ничего. Довод тот же,
   которым §3 требует полного обхода на защёлке: «удостоверяет состояние, а не
   приращение». Поэтому обход тут полный, и причина названа в журнале.                  */
function seenAfter(st, dateISO){
  return st.runs.some(r => r.kind !== 'пропуск' && r.date >= dateISO);
}

function candidatesOf(st, dateISO, silent){
  const prev = lastScan(st, dateISO);
  if(prev == null) return {full:true, from:null, set:{}, by:{}, polls:[], moved:[],
    why:'первый прогон: сравнивать не с чем, и кандидатов не из чего собрать'};
  if(seenAfter(st, dateISO)) return {full:true, from:prev, set:{}, by:{}, polls:[], moved:[],
    why:'повторный прогон за пройденную дату: он УДОСТОВЕРЯЕТ состояние, а не приращает его (довод защёлки, ADR-0221 §3)'};
  const by = {}; CAND_SRC.forEach(k => by[k] = []);
  const set = {};
  const add = (src, objId, ref, why) => {
    by[src].push({obj: objId, ref, why: why || null});
    const k = objId+'|'+ref;
    if(!set[k]) set[k] = src;                    /* первый назвавший — для журнала */
  };
  /* У КАЖДОГО СОСЕДА СВОЙ `T` (ADR-0221 §2). Общий сдвинулся бы и за молчавшего, и его
     изменения не вернулись бы никогда: следующая ночь спросила бы его с уже съеденной
     даты. Молчавший `T` не двигает — и следующий прогон спросит его за больший интервал. */
  const polls = NEIGHBOURS.map(nb => {
    const T = (st.polls[nb.id] || {}).T || null;
    const mute = (silent || {})[nb.id] || null;
    const why = !nb.asks ? 'не умеет отвечать на «кто изменился после T» — обходится полностью (ADR-0221 §5)'
      : mute ? 'не ответил в эту ночь: '+mute+' — обходится полностью'
      : T == null ? 'момент T не установлен: этого соседа ещё не спрашивали'
      : T >= dateISO ? 'окно опроса пусто: T не раньше спрашиваемой даты'
      : null;
    return {nb: nb.id, T, from: T, to: dateISO, ok: !why, why, degraded: !!why,
            named: 0, scanned: 0, asks: !!nb.asks};
  });
  const pollOf = {}; polls.forEach(p => pollOf[p.nb] = p);
  /* Очередь — способ ПОСТАВИТЬ работу, опрос — способ её НАЙТИ; одно наполняет другое и
     ни одно не отменяет другого (ADR-0221, границы; ADR-0196). */
  const queued = {};
  st.queue.forEach(q => { if(!q.done) queued[q.obj+'|'+q.ref] = q.why; });
  const moved = movedCurs(prev, dateISO);
  st.objects.forEach(o => {
    const plan = scanPlan(o);
    (WORLD[o.id] || []).forEach(item => {
      /* Нерождённый в кандидаты не попадает вовсе (ИС-33): состав кандидатов — счёт
         работы, и мёртвые души в нём завысили бы её ровно на неродившихся. */
      const bornAt = bornOn(o, item, dateISO);
      if(bornAt == null || bornAt > dateISO) return;
      const k = o.id+'|'+item.id;
      if(queued[k]) add('очередь', o.id, item.id, queued[k]);
      if(bornAt > prev) add('свой факт', o.id, item.id, 'рождение — '+bornAt);
      else if(ownChanged(plan.own, item, prev, dateISO)) add('свой факт', o.id, item.id, 'изменился собственный датированный факт');
      if(moved.length && plan.money.length){
        const cur = fxCursOf(plan.money, item, dateISO).filter(c => moved.indexOf(c) >= 0);
        if(cur.length) add('критическая дата', o.id, item.id, 'курс '+cur.join(', ')+' менялся после '+prev);
      }
      NEIGHBOURS.forEach(nb => {
        const recs = plan.nb[nb.id];
        if(!recs || !recs.length) return;        /* объект к соседу не ходит */
        const p = pollOf[nb.id];
        if(p.degraded){ p.scanned++; add('опрос', o.id, item.id, 'сосед «'+nb.id+'» '+p.why); return; }
        if(fedChanged(recs, item, p.T, dateISO)){
          p.named++; add('опрос', o.id, item.id, 'сосед «'+nb.id+'» назвал');
        }
      });
    });
  });
  return {full:false, why:null, from: prev, set, by, polls, moved};
}
/* Состав кандидатов — РЕКВИЗИТ ПРОГОНА, а не вывод из строк (ADR-0221, последствия):
   иначе «кандидатов не было» неотличимо от «опрос не состоялся», а это разные ночи. */
function candSummary(c){
  if(c.full) return {scan:'полный', why: c.why, from: c.from, n: 0, by: {}, polls: [], moved: []};
  const by = {};
  CAND_SRC.forEach(k => by[k] = c.by[k].length);
  return {scan:'кандидаты', why: null, from: c.from, n: Object.keys(c.set).length,
          by, first: (() => { const f = {}; CAND_SRC.forEach(k => f[k] = 0);
                              Object.keys(c.set).forEach(k => f[c.set[k]]++); return f; })(),
          polls: c.polls.map(p => ({nb:p.nb, T:p.T, ok:p.ok, why:p.why, degraded:p.degraded,
                                    named:p.named, scanned:p.scanned, asks:p.asks})),
          moved: c.moved.slice()};
}

/* ------------- ОЧЕРЕДЬ ПЕРЕСТРОЕНИЯ (ADR-0196, ADR-0208 §5) -------------
   Запись очереди не удаляется, а ЗАКРЫВАЕТСЯ отметкой: снятая молча работа не отличалась
   бы от никогда не поставленной, и вопрос «почему объект пересчитывали три ночи подряд»
   остался бы без ответа. Ключ записи устойчив — «объект + запись + повод» (ADR-0211 §1
   той же меркой): повторная постановка того же повода на тот же объект НЕ ЗАВОДИТ второй
   строки, иначе неполная строка, висящая неделю, накопила бы семь одинаковых заданий.  */
/* Кого касается заведённая запись реестра: все живые записи мира того объекта, которым
   она спрашивается. Дата рождения читается тем же читателем, что и в прогоне (ИС-18):
   ставить в очередь неродившегося значило бы заказать строку на дату, когда объекта не
   было, — ровно то, что запрещает ИС-33.                                              */
function queueRegChange(st, rec){
  const o = OBJ(rec.obj);
  if(!o) return 0;
  let n = 0;
  (WORLD[o.id] || []).forEach(item => {
    const b = bornOn(o, item, rec.since);
    if(b == null || b > rec.since) return;
    enq(st, o.id, item.id, 'досчёт', rec.since, st.role,
        'заведена запись реестра «'+rec.name+'» с '+rec.since);
    n++;
  });
  return n;
}
function enq(st, objId, ref, why, atISO, by, note){
  const live = st.queue.find(q => !q.done && q.obj === objId && q.ref === ref && q.why === why);
  if(live) return live;                                   /* идемпотентно (ADR-0211 §3) */
  const rec = {obj: objId, ref, why, at: atISO, by: by || 'прогон', note: note || null, done: null};
  st.queue.push(rec);
  return rec;
}
function deq(st, objId, ref, why, atISO, how){
  st.queue.forEach(q => {
    if(!q.done && q.obj === objId && q.ref === ref && q.why === why) q.done = {at: atISO, how};
  });
}
function doRun(st, dateISO, kind, actor, reason, silent){
  let written = 0;
  const parts = [];
  /* Кого берёт эта ночь (ИС-48). Полный обход остаётся законным ответом и НАЗЫВАЕТСЯ
     причиной: без причины «полный» и «кандидаты» отличались бы только числом строк. */
  const cand = candidatesOf(st, dateISO, silent);
  st.objects.forEach(o => {
    const t = newTally();
    eachAlive(o, dateISO, t, item => {
      if(!cand.full && !cand.set[o.id+'|'+item.id]){ t.skip++; return; }
      /* Поставленная работа снимается ОБХОДОМ, а не записью строки: очередь — адрес, а
         не обещание числа. Досчёт, ничего не изменивший, сделан ровно так же, как
         изменивший: его спрашивали и получили ответ. Дозаполнение снимается иначе —
         полнотой написанной строки (ниже): у него есть чем мериться. */
      deq(st, o.id, item.id, 'досчёт', dateISO, 'обойдён прогоном');
      deq(st, o.id, item.id, 'распоряжение', dateISO, 'обойдён прогоном');
      const row = buildRow(o.id, item, dateISO, silent);
      /* Неполной считается НАПИСАННАЯ строка, а не собранная. Строка, которой молчание
         соседа ничего не изменило, не пишется вовсе (`srcs` не входит в rowDiff — ИС-45)
         и лежит в «без изменений»; посчитай её здесь — и журнал сказал бы «неполных 14»
         там, где неполных строк одиннадцать, разойдясь и с перечнем защёлки, и с
         паспортом ответа, которые читают неполноту ИЗ СТРОК. Молчание такой ночи при
         этом не теряется: оно реквизит ПРОГОНА (`silent`), и повод «сосед молчит»
         считается по журналу прогонов именно поэтому — по строкам он выглядел бы
         короче, чем был (ADR-0208 §7). */
      const part = silentOf(row).length > 0;
      /* ADR-0208 §5: неполная строка ВОЗВРАЩАЕТСЯ В ОЧЕРЕДЬ — «та же очередь с другим
         поводом попадания». Ставит её туда прогон сам, и это не любезность: без записи
         в очереди дозаполнение зависело бы от того, изменится ли у объекта что-нибудь
         ещё, — сосед ответил бы, а строка так и осталась бы неполной, потому что в
         кандидаты объект больше не попал. Полная строка запись ЗАКРЫВАЕТ отметкой, а не
         стирает: снятая молча работа не отличалась бы от непоставленной.               */
      if(part) enq(st, o.id, item.id, 'дозаполнение', dateISO, 'прогон',
                   'молчали: '+silentOf(row).join(', '));
      else deq(st, o.id, item.id, 'дозаполнение', dateISO, 'строка написана полной');
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(i >= 0){
        if(st.rows[i].fixed){ t.kept++; return; }
        /* Повторный прогон той же даты, ничего не изменивший, — тоже НЕ ЗАПИСЬ:
           «переписал в то же самое» и «не переписывал» суть одно состояние. */
        const ch = rowDiff(st.rows[i], row);
        if(!ch.length){ t.same++; return; }
        /* Перезапись строки внутри открытого периода — СОБЫТИЕ ЖУРНАЛА: что изменилось и
           по каким записям реестра (ADR-0215 §6). Без него внеплановый пересчёт переписывал
           бы числа молча, а объяснять расхождение с уже прочитанным было бы нечем.
           Дозаполнение молчавшего соседа сюда НЕ ПОПАДАЕТ (ADR-0208 §4): оно идёт своей
           колонкой журнала — было отсутствие, стало значение, переписывать было нечего. */
        const sp = splitDiff(st.rows[i], row, ch);
        if(sp.rewrote.length) t.rewrote.push({ref: item.id, fields: sp.rewrote});
        if(sp.filled.length)  t.filled.push({ref: item.id, fields: sp.filled});
        st.rows[i] = row; t.n++; written++; if(part) t.partial++; return;
      }
      const prev = lastRowBefore(st, o.id, item.id, dateISO);
      /* ИС-45: неизменное состояние строки НЕ ПОРОЖДАЕТ. Отсутствие строки при
         состоявшемся прогоне значит «не менялось» — нормальный ответ; при
         несостоявшемся — «неизвестно», и это уже деградация (ADR-0215 §2–3).
         Дозаполнение через ДЕНЬ ловится тем же местом и той же меркой: строки на эту дату
         ещё нет, но предыдущая была неполна, и появление величины — изменение состояния
         (ADR-0208 §4). Считать его перезаписью нельзя и здесь. */
      if(prev){
        const ch = rowDiff(prev, row);
        if(!ch.length){ t.same++; return; }
        const sp = splitDiff(prev, row, ch);
        if(sp.filled.length) t.filled.push({ref: item.id, fields: sp.filled});
      } else t.born++;
      st.rows.push(row); t.n++; written++; if(part) t.partial++;
    });
    parts.push(partOf(o, t));
  });
  st.runs.push({date: dateISO, kind, at: st.today, actor, reason, written, parts,
    /* Кто молчал в ЭТУ ночь — реквизит журнала, а не вывод из строк: сосед, молчавший по
       объекту, у которого в ту ночь ничего не изменилось, строки не оставил вовсе, и
       восстановить его молчание было бы нечем (§7 — повод заданиям считается по прогонам,
       а не по строкам). */
    silent: silent ? clone(silent) : null,
    /* Состав кандидатов по каждому источнику, моменты `T` и деградации — ТОЖЕ реквизит
       прогона (ADR-0221, последствия). Без него «кандидатов не было» неотличимо от
       «опрос не состоялся», а ночь полного обхода — от ночи, когда обходить было некого. */
    cand: candSummary(cand)});
  /* `T` двигается ТОЛЬКО у ответившего и только вперёд (ADR-0221 §2). Молчавшему он
     остаётся прежним, и следующий прогон спросит его за больший интервал: сдвинь общий —
     и пропущенные изменения молчавшего не вернулись бы никогда. Соседу, который отвечать
     не умеет, `T` не заводится вовсе: пустой реквизит честнее выдуманного. */
  NEIGHBOURS.forEach(nb => {
    if(!nb.asks || (silent || {})[nb.id]) return;
    const p = st.polls[nb.id] || (st.polls[nb.id] = {T: null, at: null});
    if(p.T == null || p.T < dateISO){ p.T = dateISO; p.at = st.today; }
  });
  return written;
}
function fixMonth(st, month, who, atISO){
  let n = 0;
  /* Редакция формы проставляется ЗДЕСЬ, вместе с остальными реквизитами акта фиксации:
     «действующая» — потому что строку собрал прогон по сегодняшнему перечню объекта
     (ИС-41, ADR-0207 §2, ADR-0175 §1). Легаси-строки сюда не попадают вовсе — они уже
     зафиксированы своим выпуском, и `!r.fixed` их отсекает. */
  st.rows.forEach(r => { if(ym(r.date) === month && !r.fixed){
    r.fixed = {period: month, at: atISO, by: who, edition: FORM.NOW}; n++; } });
  return n;
}
/* Обратная сторона fixMonth, и она ОБЯЗАНА существовать: «строки пишутся заново» без
   снятия фиксации остаётся словом. Прогон за перезакрытый период зафиксированную строку
   пропускает и считает в kept (см. doRun) — период оказался бы открыт для записи, которая
   не происходит, а числа остались бы прежними при новом основании (ИС-50, ADR-0204 §4).
   Поле обнуляется, а не удаляется: форма строки закрыта и от её судьбы не меняется (ИС-15). */
function unfixMonth(st, month){
  let n = 0;
  /* Легаси-строка не расфиксируется НИКОГДА, и это не оговорка на всякий случай: снять с
     неё фиксацию значит объявить, что её кто-то перепишет, — а переписывать её нечем
     (ИС-41, ADR-0207 §4). Легаси-период сюда и не доедет: `openLayer` отказывает раньше. */
  st.rows.forEach(r => { if(ym(r.date) === month && r.fixed && !isLegacyRow(r)){ r.fixed = null; n++; } });
  return n;
}

/* ------------- ПЛОТНЫЙ СЛЕПОК НА ЗАЩЁЛКЕ (ИС-45, ADR-0215 §4) -------------
   Разрежённость дёшева ровно до тех пор, пока период открыт. На закрытии защёлка
   МАТЕРИАЛИЗУЕТ строку каждому объекту, живому на дату закрытия, — даже тем, кто не
   менялся. Сданное наружу число обязано иметь под собой строку СВОЕЙ даты: «возьмите
   последнюю раньше» — правило чтения, а его в выгрузку не положишь и в сверку с
   получателем не предъявишь. Промежуточные дни закрытого месяца остаются разрежёнными
   (§5): плотным делается СЛЕПОК, а не история.
   Дата слепка — последний день периода, а не день, когда человек нажал кнопку: слепок
   удостоверяет период, а не поступок. В будущее она не попадёт — closeLayer отказывает
   закрывать незавершённый месяц.
   Строки помечены `by:'защёлка'`: их писал не прогон, и на экране это должно быть видно
   (ИС-15 — форма строки закрыта, поле `by` в ней уже есть).

   ЗАЩЁЛКА ПЕРЕСПРАШИВАЕТ СОСЕДЕЙ (ИС-46, ADR-0216 §2), и с волны 17 З-10 это её работа,
   а не пожелание. До З-10 слепок только ДОПИСЫВАЛ недостающие строки, а найденную не
   трогал вовсе — «известное уже записано». Так оно и было бы, если бы между последним
   прогоном и закрытием ничего не происходило; но происходит всегда: правится проводка
   задним числом, приходит уточнённый курс, сосед досчитывает своё. Строка от 31.07,
   написанная прогоном 28.07 и не тронутая закрытием 5 августа, объявлялась бы
   ОКОНЧАТЕЛЬНОЙ, будучи собранной из ответов недельной давности. Поэтому последний опрос
   — ЧАСТЬ ЗАКРЫТИЯ, а не отдельная любезность: величина, которую защёлка замораживает,
   спрошена в момент замораживания.
   ЧТО ЭТО НЕ ОТМЕНЯЕТ: «плотный слепок не переписывает ПРОШЛОГО» (ADR-0215, границы)
   осталось в силе. Переспрашивается ОДНА дата — последний день закрываемого периода;
   промежуточные дни месяца остаются как были, и разрежённость истории цела.
   МОЛЧАНИЕ НА ДОСПРОСЕ НЕ СТИРАЕТ ИЗВЕСТНОГО (ADR-0208 §3), и держится это ПОРЯДКОМ, а
   не ветками записи: опрос идёт первым и на первом же молчании кончает закрытие — до
   строк дело не доходит вовсе, ни до одной. Ветки «сосед промолчал, строку не трогаем»
   здесь поэтому НЕТ и быть не должно: недостижимую ветку нечем ни проверить, ни
   опровергнуть, а стоять она будет с уверенным комментарием и читаться как работающее
   правило. Неполноту, оставленную ВЧЕРАШНЕЙ ночью, доспрос не чинит и не переписывает —
   её отбивает рубеж периода, стоящий до него (ADR-0208 §4).
   ЗАФИКСИРОВАННУЮ строку доспрос не трогает и считает в `kept` — тем же местом и той же
   меркой, что прогон (ИС-8): период, уже закрытый и перезакрываемый, открывается
   распоряжением, а не доспросом.                                                        */
/* Состояние КАЖДОГО соседа на доспросе — реквизит записи журнала (ADR-0216 §3, §4).
   Окончательность берётся не у величины, а у КОЛОНКИ ЕГО СЛОЯ в общем календаре: пока
   нижний слой не проставлен, его ответ предварителен, и защёлка это печатает, а не
   умалчивает. Кураторство слоя не имеет вовсе — и это не пробел, а третий случай:
   «окончательности не удостоверяю». Свести его к «не закрыт» значило бы обещать, что
   когда-нибудь он закроется. */
function repollNbs(st, month, silent){
  return NEIGHBOURS.map(nb => {
    const mute = (silent || {})[nb.id] || null;
    const lt = nb.layer ? latchOf(st, month, nb.layer) : null;
    return {nb: nb.id, name: nb.name, layer: nb.layer || null, ok: !mute, reason: mute,
            final: !!lt,
            why: mute ? 'на доспросе не ответил: '+mute
              : nb.layer
                ? (lt ? 'колонка «'+nb.layer+'» периода '+monLabel(month)+' проставлена ('+
                        lt.by+', '+fmt(lt.at)+'): величины окончательные (ADR-0204 §3, ADR-0216 §3)'
                      : 'колонка «'+nb.layer+'» периода '+monLabel(month)+
                        ' не проставлена: величины предварительные')
                : 'учётного слоя у соседа нет: окончательности он не удостоверяет (границы ADR-0216)'};
  });
}
const LATCH_SCAN = 'защёлка удостоверяет состояние, а не приращение: обход идёт по всему охвату (ADR-0221 §3)';
function repoll(st, month, who, atISO, silent){
  const dateISO = monthEnd(month);
  const nbs = repollNbs(st, month, silent);
  const mute = nbs.filter(n => !n.ok);
  /* ОПРОС ИДЁТ ПЕРВЫМ, ЗАПИСЬ — ВТОРОЙ, и порядок этот содержательный. Не ответивший
     сосед останавливает закрытие ДО единой строки: напиши мы сперва, а спохватись потом —
     на дату слепка легли бы строки, собранные из молчания, и чинить их пришлось бы поверх
     уже написанного. Журнальная запись при этом делается всё равно: опрос СОСТОЯЛСЯ и
     кончился ничем, а «доспрос не отвечен» и «закрытия не пробовали» — разные ночи. */
  if(mute.length){
    st.runs.push({date: dateISO, kind:'защёлка', at: atISO, actor: who,
      reason:'доспрос перед закрытием периода '+monLabel(month)+': не отвечено',
      written:0, parts:[], repoll:{nbs, made:0, again:0, done:false},
      cand:{scan:'полный', why:LATCH_SCAN, from:null, n:0, by:{}, polls:[], moved:[]}});
    return {ok:false, nbs, mute};
  }
  let made = 0, again = 0, written = 0;
  const parts = [];
  st.objects.forEach(o => {
    const t = newTally();
    eachAlive(o, dateISO, t, item => {
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      /* Молчание сюда не доходит (см. выше), и `silent` в сборщик НЕ передаётся: передай
         мы его — строка собиралась бы из ответов, которых доспрос не принял. */
      const row = buildRow(o.id, item, dateISO);
      row.by = 'защёлка';
      if(i < 0){ st.rows.push(row); t.n++; made++; written++; return; }
      if(st.rows[i].fixed){ t.kept++; return; }
      const ch = rowDiff(st.rows[i], row);
      if(!ch.length){ t.have++; return; }
      const sp = splitDiff(st.rows[i], row, ch);
      if(sp.rewrote.length) t.rewrote.push({ref: item.id, fields: sp.rewrote});
      if(sp.filled.length)  t.filled.push({ref: item.id, fields: sp.filled});
      st.rows[i] = row; t.n++; again++; written++;
    });
    parts.push(partOf(o, t));
  });
  /* Защёлка отчитывается о себе тем же журналом, что и прогон (ADR-0215 §3): иначе на
     дату слепка ответ «строки нет» нечем было бы отличить от «прогона не было».
     ДОПИСАННОЕ и ПЕРЕПИСАННОЕ считаются порознь и в одно число не складываются: первое —
     полнота состава (ADR-0215 §4), второе — свежесть величин (ADR-0216 §2), и ночь, в
     которую доспрос ничего не изменил, обязана отличаться от ночи, в которую он переписал
     половину охвата. Общее `written` при этом остаётся суммой обоих: суточный итог по
     журналу складывается одним способом (проверка #63). */
  st.runs.push({date: dateISO, kind: 'защёлка', at: atISO, actor: who,
                reason: 'закрытие периода '+monLabel(month), written, parts,
                repoll: {nbs, made, again, done:true},
    /* Обход защёлки ПОЛНЫЙ, и это объявлено, а не подразумевается (ADR-0221 §3): плотный
       слепок строится по всему охвату, а не по кандидатам, — защёлка удостоверяет
       состояние, а не приращение. Кандидатов она не спрашивает вовсе, поэтому у записи
       журнала стоит тот же реквизит `cand`, что и у прогона, но со словом «полный»:
       разойдись формы — суточный итог по журналу пришлось бы складывать двумя способами. */
                cand: {scan:'полный', why:LATCH_SCAN,
                       from:null, n:0, by:{}, polls:[], moved:[]}});
  return {ok:true, nbs, made, again, written, parts};
}

/* ------------ КАЛЕНДАРЬ УЧЁТНЫХ ПЕРИОДОВ (ИС-38, ADR-0204) ----------
   Справочник ОБЩИЙ и лежит НИЖЕ всех слоёв. Строка справочника — период; в ней по
   колонке-защёлке на каждый слой, а в колонке — актор и дата простановки, у каждого слоя
   свои. Пустая строка («месяц идёт») и отсутствие строки вовсе — РАЗНЫЕ состояния, и
   справочник обязан их различать (ADR-0204, границы).
   Справочник сам НЕ АКТОР: он ничего не проставляет ни по расписанию, ни за человека —
   только отказывает или пропускает (ИС-9). Ни одного числа он тоже не хранит.          */
function calendarRow(st, month){ return st.periods.find(p => p.month === month) || null; }
function latchOf(st, month, layer){
  const p = calendarRow(st, month);
  return p && p.latches[layer] ? p.latches[layer] : null;
}
/* ЕДИНСТВЕННОЕ место, где колонка становится проставленной, — и порядок стережётся здесь,
   а не у вызывающего. Каскад, собранный процедурой в чьём-то коде, делает рассогласование
   слоёв штатным состоянием вместо ошибки, и отличить «ещё не доехало» от «сломалось»
   становится нечем (ADR-0204, отвергнутое). Здесь каскад — состояние строки. */
/* ПРОВЕРКА ОТДЕЛЕНА ОТ ПРОСТАНОВКИ — не ради опрятности, а потому что между ними теперь
   стоит работа: доспрос (ИС-46). Верхний слой обязан узнать, что закрытие вообще возможно,
   ДО того как переспросит соседей и перепишет строки: спроси мы порядок после — отказ
   «периоды закрываются по порядку» приходил бы уже поверх переписанной витрины.
   Проверка ничего не меняет и вызывается дважды — это её свойство, а не оговорка. */
function closeLayerCheck(st, month, layer, who){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  if(!who) return {ok:false, why:'колонка «'+layer+'» без актора не проставляется: период закрывает человек, а не календарь (ИС-9)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: «строки нет» и «строка пуста» — разные состояния (ADR-0204, границы)'};
  /* Легаси-период ПРИШЁЛ ЗАКРЫТЫМ, и отказ говорит именно это, а не «колонка уже
     проставлена»: второе звало бы к перезакрытию распоряжением, которого здесь не бывает
     (ИС-41, ADR-0207 §3, §4). Отказ называет выпуск — по нему и разбираться. */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: он загружен УЖЕ ЗАКРЫТЫМ ('+row.legacy.by+', '+fmt(row.legacy.at)+', '+
    row.legacy.act+') и заново не закрывается — закрывать нечего, строки пришли в состоянии '+
    'окончательной фиксации (ИС-41, ADR-0207 §3)'};
  const was = row.latches[layer];
  if(was) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+' уже проставлена ('+
    was.by+', '+fmt(was.at)+'): перезакрытие идёт распоряжением и сверху вниз (ADR-0204 §4)'};
  const expected = st.months.find(m => !latchOf(st, m, layer));
  if(month !== expected) return {ok:false, why:'периоды закрываются по порядку: следующий по слою «'+
    layer+'» — '+monLabel(expected)};
  if(monthEnd(month) >= st.today) return {ok:false, why:'период '+monLabel(month)+' ещё не завершён: закрытие возможно с '+fmt(first(nextM(month)))};
  /* Отказ НАЗЫВАЕТ незакрытый слой: «нельзя» без имени препятствия — половина ответа (§8.4),
     а слоёв под тобой может быть и два. */
  const empty = LAYERS.slice(0, i).filter(L => !row.latches[L]);
  if(empty.length) return {ok:false, blockedBy: empty[0], why:'колонка «'+layer+'» периода '+
    monLabel(month)+' не проставляется: не закрыт слой «'+empty[0]+'»'+
    (empty.length > 1 ? ' (и «'+empty.slice(1).join('», «')+'»)' : '')+
    ' — колонка не ставится, пока пуста нижележащая (ИС-38, ADR-0204 §3)'};
  return null;
}
function closeLayer(st, month, layer, who, atISO){
  const bad = closeLayerCheck(st, month, layer, who);
  if(bad) return bad;
  const row = calendarRow(st, month);
  /* При ПОВТОРНОЙ простановке колонка несёт ещё и номер распоряжения (ADR-0204 §1).
     Иначе «май закрыт 12 сентября» не отличить от опоздавшего первого закрытия, а это
     разные вещи: у второго есть основание, которое кто-то подписал, и получатель сданного
     вправе его спросить (ИС-50, ADR-0157 §6). Распоряжение берётся из СТРОКИ периода, а не
     из аргумента: простановку делает другой модуль и другим действием, и передавать номер
     через три двери значило бы надеяться, что его не забудут. */
  const re = row.reopens && row.reopens[row.reopens.length - 1];
  row.latches[layer] = re ? {by: who, at: atISO, order: re.order} : {by: who, at: atISO};
  return {ok:true, month, layer, by: who, at: atISO, order: re ? re.order : null};
}

/* Тот же каскад, прочитанный в обратную сторону: защёлки снимаются СВЕРХУ ВНИЗ. Снять
   нижнюю, оставив верхнюю, — значит объявить период открытым для записи под уже
   проставленной верхней колонкой: «закрыт» и «открыт» оказались бы верны одновременно, а
   верхний слой — подписанным под числами, которых он не видел (ИС-50, ADR-0204 §3 и §4).
   Снятие — НЕ открытие: открывается только нижний слой, верхние переспрашивают. */
function openLayer(st, month, layer){
  const i = LAYERS.indexOf(layer);
  if(i < 0) return {ok:false, why:'слоя «'+layer+'» нет: слои объявлены списком, а не кодом (ИС-38)'};
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+' в справочнике нет: снимать нечего (ADR-0204, границы)'};
  /* §4: перезакрытие к легаси НЕПРИМЕНИМО — период не открывается ВОВСЕ. Отказ не в правах
     и не в порядке слоёв: открыть период значит пообещать, что строки перепишут, а
     переписать их нечем — соседей за ту дату не спросить, формы той больше нет. Исправление
     легаси-итога — НОВЫЙ ВЫПУСК МИГРАЦИИ с журнальной записью, и актор там человек, а не
     прогон (ИС-41, ADR-0207 §4, границы). */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: он НЕ ОТКРЫВАЕТСЯ ни распоряжением, ни правами. Загружен он выпуском ('+
    row.legacy.by+', '+fmt(row.legacy.at)+'), и пересчитать его нечем: '+
    'форма легаси другая, соседей за ту дату не спросишь, и «открыт» означало бы обещание '+
    'переписать строки, которого никто не выполнит. Исправление легаси-итога — НОВЫЙ ВЫПУСК '+
    'МИГРАЦИИ ('+row.legacy.act+' — предыдущий) с записью в журнал (ИС-41, ADR-0207 §4)'};
  if(!row.latches[layer]) return {ok:false, why:'колонка «'+layer+'» периода '+monLabel(month)+
    ' и так пуста: по этому слою период не закрыт (ADR-0204, границы)'};
  /* Отказ называет слой, с которого сброс НАЧИНАЕТСЯ, — самый верхний из проставленных:
     «нельзя» без имени первого шага — половина ответа (§8.4). */
  const above = LAYERS.slice(i + 1).filter(L => row.latches[L]);
  if(above.length){
    const top = above[above.length - 1];
    return {ok:false, blockedBy: top, why:'колонка «'+layer+'» периода '+monLabel(month)+
      ' не снимается: над ней проставлен слой «'+top+'»'+
      (above.length > 1 ? ' (и «'+above.slice(0, -1).join('», «')+'»)' : '')+
      ' — сброс идёт СВЕРХУ ВНИЗ и начинается с «'+top+'» (ИС-50, ADR-0204 §4)'};
  }
  const was = row.latches[layer];
  delete row.latches[layer];
  return {ok:true, month, layer, was, opened: layer === BASE_LAYER};
}

/* ================== ЛЕГАСИ-ИТОГИ (ИС-41, ADR-0207) ==================
   История до запуска в модуле ЕСТЬ, и приходит она не прогоном. Прогон её собрать не
   может ни при каких правах: соседей за 2024 год не спросишь — ядро считает по сегодняшним
   договорам, кураторство знает сегодняшних кураторов, а классификация категорию за
   позапрошлый квартал не восстановит. Значит, история загружается ГОТОВЫМИ ИТОГАМИ, и
   единственный честный способ их положить — СТРОКАМИ ТОЙ ЖЕ ФОРМЫ, но сразу в состоянии
   ОКОНЧАТЕЛЬНОЙ ФИКСАЦИИ (ADR-0207 §3).
   Отвергнутое здесь важнее принятого. Держать легаси ОТДЕЛЬНЫМ хранилищем — значит завести
   второй ответ на тот же вопрос и второй паспорт к нему: «остаток на 31.12.2025» приходил бы
   то из среза, то из архива, и разошлись бы они не там, где ошиблись, а там, где сравнили
   (E2E-09 дословно). Пересчитывать легаси прогоном — значит обещать то, чего не может быть:
   пересчёт дал бы СЕГОДНЯШНИЙ ответ на вчерашний вопрос, и прошлое переписывалось бы каждую
   ночь (ИС-4).
   Цена решения названа: у строк модуля появилась ВТОРАЯ РЕДАКЦИЯ ФОРМЫ. Легаси собирало
   МЕНЬШЕ, чем собирает действующая система, и это не дефект миграции, а свойство старой
   системы. Отсюда всё остальное: чего форма легаси не собирала — ОТСУТСТВУЕТ КЛЮЧОМ, а не
   лежит нулём (§2); ряд через границу называет состав редакций (§6); а граница — ДАТА
   ЗАПУСКА, объявленная ОДИН РАЗ, и смешанного периода не бывает (§7).                     */
const LAUNCH = '2026-05-01';
/* Редакция формы — не поле строки, а РЕКВИЗИТ ЗАПИСИ ФИКСАЦИИ (ADR-0175 §1): «в какой
   редакции собрано» — свойство того же акта, что и «кем и когда заморожено». Заведи её
   десятым полем строки — форма строки перестала бы быть закрытой (ИС-15), а поле оказалось
   бы заполнено у зафиксированных и пусто у живых, то есть повторяло бы `fixed` другим именем. */
const FORM = {LEGACY:'легаси', NOW:'действующая'};
const isLegacyRow = r => !!(r && r.fixed && r.fixed.edition === FORM.LEGACY);
const isLegacyMonth = (st, month) => { const p = calendarRow(st, month); return !!(p && p.legacy); };
ST.LAUNCH = () => LAUNCH;
ST.FORMS = () => [FORM.NOW, FORM.LEGACY];
ST.isLegacyRow = r => isLegacyRow(r);
ST.isLegacyMonth = m => isLegacyMonth(ST.state, m);

/* ВЫПУСК МИГРАЦИИ — один объявленный акт, и у него есть номер, дата и человек. Актор здесь
   ЧЕЛОВЕК, а не «прогон»: строку писала миграция, и на экране это обязано быть видно так же,
   как видна «защёлка» (ИС-15 — поле `by` в форме строки уже есть). Исправление легаси-итога —
   НОВЫЙ ВЫПУСК с новой журнальной записью, а не правка на месте (ADR-0207, границы).        */
const LEGACY = {
  at:'2026-04-28', by:'миграция, вып. 1', act:'акт приёмки миграции № 3 от 28.04.2026',
  /* ПЕРЕЧЕНЬ ТОГО, ЧТО ЛЕГАСИ СОБИРАЛО, объявлен ЗДЕСЬ и один раз (§2). Он короче
     действующего нарочно и по правде: старая система не знала ни куратора кредита разрезом,
     ни суммы под риском, ни сомового близнеца валютной величины (ADR-0214 завёл его в этой
     системе). Вывести перечень из данных нельзя: «величины нет в строке» и «величину не
     собирали» — разные вещи, и различить их можно только объявлением. */
  form: {'obj-credit': {dims:['d-branch','d-cur','d-status'], inds:['m-debt','m-over','m-odays']}},
  /* Итоги, как их отдала старая система. Ссылки — ТЕ, ЧТО БЫЛИ НА ДАТУ: КД-2019/017 и
     КД-2021/044 в новом мире не существуют вовсе — они погашены и закрыты до запуска, и
     договоров с такими номерами `WORLD` не содержит. Это и есть доказательство §3: строку,
     которую нечем пересчитать, можно только прочитать. Состав меняется по датам —
     КД-2019/017 после 31.12.2025 не выходит: он погашен, и строки за I квартал у него нет. */
  totals: {'obj-credit': [
    {ref:'КД-2019/017', cur:'KGS', dims:{'d-branch':'Ошский филиал','d-cur':'KGS','d-status':'действующий'},
     v:{'2024-12-31':[1840000,0,0], '2025-03-31':[1520000,0,0], '2025-06-30':[1180000,64000,21],
        '2025-09-30':[820000,0,0], '2025-12-31':[410000,0,0]}},
    {ref:'КД-2021/044', cur:'KGS', dims:{'d-branch':'Головной офис','d-cur':'KGS','d-status':'действующий'},
     v:{'2024-12-31':[2650000,118000,44], '2025-03-31':[2410000,96000,31], '2025-06-30':[2180000,0,0],
        '2025-09-30':[1940000,0,0], '2025-12-31':[1700000,52000,17], '2026-03-31':[1455000,0,0]}},

/* §1: колонка источника у легаси-строки заполнена ПО КАЖДОМУ СОСЕДУ, которого действующая
   форма спросила бы ради этих же величин, и говорит «легаси». Оставь её пустой — строка
   выглядела бы полной по недосмотру; проставь «не ответил» — легаси-месяц навсегда завис бы
   неполным и не закрылся бы ни одним слоем (ИС-42). Соседи ВЫВОДЯТСЯ из перечня, а не
   переписаны рядом с ним: второй список разъехался бы с первым на первой же правке. */
function legacyNbs(form){
  return uniq(form.dims.concat(form.inds).map(id => {
    const R = REC(id); return R && R.seam ? nbOfSeam(R.seam) : null;
  }).filter(Boolean));
}
function loadLegacy(st){
  const objs = Object.keys(LEGACY.totals), dates = [];
  let n = 0;
  objs.forEach(objId => {
    const form = LEGACY.form[objId], nbs = legacyNbs(form);
    LEGACY.totals[objId].forEach(t => {
      Object.keys(t.v).sort().forEach(d => {
        const vals = t.v[d], inds = {}, when = {}, dims = {}, srcs = {};
        form.inds.forEach((id, i) => {
          /* §2: НЕОТСУТСТВОВАВШЕЕ ПРИХОДИТ ОТСУТСТВУЮЩИМ. Ключа нет — и «не собирали» не
             становится «собрали ноль»: ноль сложится в свод и никому не солжёт вслух. */
          if(vals[i] == null) return;
          const I = IND(id);
          inds[id] = I && I.money ? {v: vals[i], cur: t.cur} : {v: vals[i]};
          /* Датировка легаси-величины — «на дату» ПО ПОСТРОЕНИЮ: итог собран на отчётную
             дату и с тех пор не пересчитывался. «Текущего» в легаси-строке не бывает вовсе
             (ИС-39): карточки, из которой его можно было бы взять, к той дате уже нет. */
          when[id] = DATING.ASOF;
        });
        /* Разрез датируется НАРАВНЕ с показателем и той же пометкой: на нём болезнь
           «текущего» и живёт (ИС-39, ADR-0205). У легаси она невозможна по построению —
           филиал и статус в итоге ТЕ, что были на отчётную дату, а не сегодняшние: карточки,
           из которой можно было бы взять сегодняшние, к той дате уже нет. Не пометь их — и
           паспорт объявил бы «ТЕКУЩЕЕ 1» о величине, которой сегодня взяться неоткуда. */
        form.dims.forEach(id => { if(t.dims[id] != null){ dims[id] = t.dims[id]; when[id] = DATING.ASOF; } });
        nbs.forEach(nb => { srcs[nb] = {ok:true, src: FORM.LEGACY}; });
        st.rows.push({obj: objId, ref: t.ref, date: d, dims, inds, when, srcs,
          /* §3: строка приходит СРАЗУ ОКОНЧАТЕЛЬНОЙ. Незафиксированной её положить нельзя:
             открытая строка — обещание пересчитать, а пересчитывать нечем. */
          fixed: {period: ym(d), at: LEGACY.at, by: LEGACY.by, edition: FORM.LEGACY},
          by: LEGACY.by});
        if(dates.indexOf(d) < 0) dates.push(d);
        n++;
      });
    });
  });
  /* Легаси-период получает СТРОКУ СПРАВОЧНИКА с проставленными колонками: без неё
     `fixationOf` сказал бы «не зафиксировано» о строке, которая зафиксирована, — два
     реквизита об одном состоянии разошлись бы на первом же ответе (ADR-0216 §1).
     Колонки проставил ВЫПУСК МИГРАЦИИ и помечены как легаси, а в `st.months` эти месяцы
     НЕ ПОПАДАЮТ: «периоды закрываются по порядку» — правило про месяцы, которые кто-то
     будет закрывать, а легаси закрывать не придётся никогда. */
  uniq(dates.map(ym)).forEach(m => {
    if(calendarRow(st, m)) return;
    const latches = {};
    LAYERS.forEach(L => { latches[L] = {by: LEGACY.by, at: LEGACY.at, legacy:true}; });
    st.periods.push({month: m, latches, legacy:{at: LEGACY.at, by: LEGACY.by, act: LEGACY.act}});
  });
  st.periods.sort((a,b) => a.month < b.month ? -1 : a.month > b.month ? 1 : 0);
  st.legacy = {launch: LAUNCH, at: LEGACY.at, by: LEGACY.by, act: LEGACY.act, rows: n,
    dates: dates.slice().sort(), months: uniq(dates.map(ym)).sort(), form: clone(LEGACY.form)};
  return st.legacy;
}

/* Что форма легаси НЕ СОБИРАЛА из спрошенного. Считается по объявленному перечню, а не по
   пустым клеткам: клетка бывает пуста и у действующей формы — сосед промолчал (ИС-42), — и
   спутать «не собирали» с «не ответили» значило бы отправить разбираться не туда. */
function legacyMissing(objId, want){
  const form = LEGACY.form[objId];
  if(!form) return [];
  const has = form.dims.concat(form.inds);
  return uniq((want || []).map(id => {
    const I = IND(id);
    return I && I.src === 'агрегат' ? I.over : id;
  }).filter(id => id && has.indexOf(id) < 0));
}

    registry: withSomTwins(clone(REGISTRY), objs).map(normRec),

/* Роль даёт ОДНО: чей охват применяется. КАКИМ разрезом он режет — знает объект, а не
   роль (ИС-37, ADR-0203 §1). До волны 15 здесь стояло зашитое «d-curator», и объект,
   назвавший свой охват иначе, молча пустел (СС-Д11). */
ST.curatorOf = () => ST.state.scope[ST.state.role] || null;
/* Охват объекта: null — роль не сужает (администратор, либо объект объявлен общим),
   {dim,value} — режется разрезом, {denied} — под ролью не спрашивается (отказ с дорогой). */
ST.scopeOf = objId => {
  const c = ST.curatorOf();
  if(!c) return null;
  const o = OBJ(objId || (ST.state.q && ST.state.q.obj));
  if(!o) return null;
  const s = o.scope;
  /* Необъявленный охват сюда не доходит: его валит загрузка (проверка #132). Ветка
     оставлена ЯВНОЙ — молчаливое «значит, общий» и есть тот дефект, который волна чинит. */
  if(!s) return {denied:{why:'у объекта «'+o.name+'» охват ролей не объявлен', road:'заведите реквизит scope записью реестра (ИС-37)'}};
  if(s.open) return null;
  if(s.denied) return {denied: s.denied, obj: o};
  return {dim: s.dim, value: c};
};
