  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Статистика» (TO-BE).
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Прогон собирает строки на дату, закрытие учётного
  периода их фиксирует, три шва отвечают на три вопроса и каждый ответ несёт паспорт,
  детализация сходится со списком реестра, роль сужает множество ДО группировки. Ничего из
  этого не зашито кодом: все восемь объектов собраны ИЗ ДАННЫХ, и в сборщике строк
  (buildRow/runFor/readDim/readMeas) слова «кредит» нет ни одного.

  РЕШЕНИЯ, НА КОТОРЫХ СТОИТ МОДУЛЬ
  ADR-0145 статистика — датированные срезы, а не второй калькулятор; граница по глаголу;
  ADR-0146 порядок слоёв ядро → классификация → статистика, стрелка одна, обратной нет;
  ADR-0147 атом хранения — строка объекта на дату; агрегатов не хранится ни одного;
  ADR-0148 защёлка одна — месяц, закрытый человеком; день и неделя — кэш без актора;
  ADR-0149 объект статистики — запись реестра, а не ветка кода;
  ADR-0150 показатель объявляет источник и не несёт формулы;
  ADR-0151 сумма — в валюте договора с курсом; потоки — нарастающим итогом;
  ADR-0152 три шва по вопросу, паспорт ответа обязателен, роли — до группировки.
  ADR-0176 разрез несёт уровни и корзины; родитель считается, а не складывается из детей;
  ADR-0177 обратный индекс ссылок потребителей — вторая хранимая вещь модуля;
  ADR-0178 statRows двоичен: полный список или отказ с числом; сверка целиком — выгрузкой;
  ADR-0179 многозначность разреза означает нижележащий объект; реестр — восемь объектов.
  Поверх: ADR-0135 (пять швов ядра), ADR-0124 (вычислитель один), ADR-0120 (реестр
  показателей), ADR-0123 (фиксация записью), ADR-0113 (препятствия закрытия периода).

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (ИС-1…ИС-25)
  ИС-1  Ни одна величина по одному объекту здесь не выводится — только берётся швом ядра
        (ADR-0145 §2, ADR-0135 §1). Второй вывод суммы — это E2E-09.
  ИС-2  Строку среза пишет только прогон; экрана и операции правки строки нет.
  ИС-3  Хранимых агрегатов нет ни одного: всякий счётчик и всякая сумма — группировка строк.
  ИС-4  Значения разрезов лежат В СТРОКЕ, а не резолвятся при чтении (ADR-0147 §3).
  ИС-5  Классификация не читает статистику ни в одной форме — кольцо ТЗ (ADR-0146 §2).
  ИС-6  В записи показателя нет поля формулы (ADR-0150).
  ИС-7  Показателя вне реестра не существует ни для кого.
  ИС-8  Зафиксированный период не перезаписывается ничем и никем (ADR-0148 §5).
  ИС-9  Защёлка одна — закрытие учётного периода человеком; у фиксации есть фамилия.
  ИС-10 Всякий ответ несёт дату расчёта, признак фиксации и область видимости.
  ИС-11 Расхождение зафиксированного с сегодняшним пересчётом показывается явно.
  ИС-12 Дата, на которую нет строк, не подменяется молча — возраст называется.
  ИС-13 Ролевые правила применяются к строкам ДО группировки (ADR-0152 §3).
  ИС-14 statRows сходится со списком реестра объектов один в один.
  ИС-15 Сомовый эквивалент, доли и дельты не хранятся — это представление.
  ИС-16 Сумма отдаётся в валюте договора, с курсом и датой курса (ADR-0135 §7).
  ИС-17 Потоки хранятся нарастающим итогом, период — разность двух строк.
  ИС-18 Объект статистики — запись реестра, а не ветка кода (ADR-0149).
  ИС-19 Заёмщик — свой объект со своей строкой, а не свёртка кредитов.
  ИС-20 Статистика не запирает учётный период (ADR-0113).
  ИС-21 Если значений разреза у объекта много — это не разрез, а нижележащий объект
        (ADR-0179 §1). Разрез отвечает на «в каком множестве строка», и строка в двух
        множествах сразу не бывает.
  ИС-22 Усечения и страниц у ответа нет: список отдаётся целиком либо не отдаётся вовсе;
        уровень иерархии спрашивается в границах объявленных (ADR-0178 §1, ADR-0176 §4).
  ИС-23 Свободной корзины не бывает: набор объявлен записью разреза, новая заводится
        строкой реестра, а не приходит в запросе (ADR-0176 §2).
  ИС-24 Форм паспорта ровно две — полная и краткая, и обе объявляет производитель ответа.
  ИС-25 Вывод показателя не запрещается чужой публикацией, но обязан назвать поимённо,
        что сломается (ADR-0177 §4).

  ДЕМО ПОКРЫВАЕТ: восемь объектов на одном движке (кредит и заёмщик — непохожая пара:
  разные разрезы, разные меры, разное множество) · прогон, пропуск ночи с причиной и
  внеплановый ручной пересчёт с актором · закрытие мая и июня человеком и отказ прогона
  писать в закрытое · расхождение зафиксированного мая с сегодняшним пересчётом (есть
  корректировка, учтена в июле) · запрос на дату без строк — отдаётся ближайшая предыдущая
  с названным возрастом · разновалютный итог, называющий состав, и курсовую разницу
  разностью двух срезов · период произвольным интервалом как разность двух нарастающих
  итогов и названную базу периода, когда строки на начало интервала нет · историчный
  разрез: смена куратора сегодня не переписывает майскую строку · роль аналитика, режущую
  множество до группировки, и отказ «всего по холдингу» · заёмщика без действующих
  кредитов, который при свёртке исчез бы · отказ завести показатель с формулой · отказ
  классификации читать шов статистики · сходимость детализации со списком реестра ·
  ряд, у которого даты — часть вопроса (шаг месяц или квартал, 4/6/8 точек, последняя всегда
  дата среза) · фильтр конструктором: значения берутся из строк на дату среза, у разреза-даты
  — корзинами, а не сырой датой, и сужение названо словами в паспорте · форма заведения
  разреза, которая спрашивает число значений на объект, корзины списком и ВЛАДЕЛЬЦА уровней,
  но не даёт напечатать иерархию руками · поимённый состав прогона в журнале ·
  дерево уровней (дивизион → филиал из справочника кадров; область → район из полей) с
  колонкой «своих», где кредит без района остаётся у области и не исчезает · корзины дат
  (год · квартал · месяц) и отказ спросить разрез-дату без корзины · отказ завести
  многозначный разрез — с указанием, каким объектом он должен стать · двоичный отказ
  statRows с названным числом строк и двумя дорогами: задание на выгрузку с паспортом
  внутри файла и список в реестре владельца на сегодня · краткий паспорт под числом плитки
  и полный по действию · обратный индекс ссылок потребителей, публикация и переиздание
  редакции без ссылок · снятие показателя с поимённым списком того, что сломается.

  ГРАНИЦЫ МАКЕТА: ядро (пять швов ADR-0135) и множества соседей взяты зеркалом и здесь не
  редактируются; закрытие учётного периода — чужое действие, на экране журнала оно
  смоделировано кнопкой, помеченной как зеркало (своей кнопки «зафиксировать статистику» у
  модуля нет и не будет — ADR-0148, отвергнутое). Унаследованные РЯ-Д1 (версия графика
  резолвится «на сегодня») и РЯ-Д2 (курс из плоской таблицы) чинятся в ядре: срез честно
  записывает то, что шов отдал, и об их неточности не знает. Порог показа строк (здесь 12)
  — параметр эксплуатации, а не модели: в бою он другой, и модель от этого не меняется.
  Выгрузка оформляется заданием, но файл не формируется — очередь показана, чтобы видеть,
  что паспорт едет ВНУТРИ файла. Разрезы «по видам документа» и «по важности документа»
  (ТЗ №19, №20) отложены до модуля документооборота — заводятся строками реестра.

<script>
/* =====================================================================
 *  МОДУЛЬ «СТАТИСТИКА» — исполняемый прототип
 *  Слои файла: даты → реестры (объекты, показатели, разрезы) → мир соседей →
 *  ядро (швы ADR-0135) → состояние и прогон → фиксация → три шва → операции → экраны.
 *
 *  Главное, что этот файл доказывает исполнением: сборщик строк не знает ни одного
 *  слова предметной области. buildRow/readDim/readMeas работают с ЗАПИСЯМИ реестров —
 *  девятый объект заводится строкой в OBJECTS, а не веткой в коде (ИС-18, ADR-0149).
 * ===================================================================== */

/* ------------------------------ ДАТЫ ------------------------------- */
const MON = {'01':'январь','02':'февраль','03':'март','04':'апрель','05':'май','06':'июнь',
  '07':'июль','08':'август','09':'сентябрь','10':'октябрь','11':'ноябрь','12':'декабрь'};
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const ym  = iso => iso.slice(0,7);
const first = m => m+'-01';
const monLabel = m => m ? MON[m.slice(5,7)]+' '+m.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const nextM = m => { let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const prevM = m => { let [y,mm]=m.split('-').map(Number); mm--; if(mm<1){mm=12;y--;} return y+'-'+String(mm).padStart(2,'0'); };
const monthEnd = m => { const n = nextM(m); const d = new Date(Date.parse(first(n)) - 86400000); return d.toISOString().slice(0,10); };
const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };
const ageWord = d => d === 0 ? 'сегодня' : d + ' ' + plural(d,'день','дня','дней') + ' назад';

/* --------------------------- КУРСЫ ВАЛЮТ ---------------------------- *
   Плоская таблица — зеркало РЯ-Д2 ядра. Шов помечает ответ dated:false; строка
   честно записывает то, что шов отдал, и о неточности не знает (границы макета). */
const RATES = {
  KGS: [['2020-01-01', 1]],
  USD: [['2026-05-31', 87.45], ['2026-06-30', 87.20], ['2026-07-31', 87.90], ['2026-08-10', 88.05],
        ['2026-08-18', 88.30]],
  EUR: [['2026-05-31', 94.80], ['2026-06-30', 94.10], ['2026-07-31', 95.60], ['2026-08-10', 95.95],
        ['2026-08-18', 96.40]]
};
function valueOn(hist, dateISO){
  if(!hist || !hist.length) return null;
  let out = null;
  for(const [from, v] of hist) if(from <= dateISO) out = v;
  return out;
}
function rateOn(cur, dateISO){
  const list = RATES[cur] || RATES.KGS;
  let hit = list[0];
  for(const r of list) if(r[0] <= dateISO) hit = r;
  return {rate: hit[1], rateDate: hit[0], dated: cur === 'KGS'};
}

/* ===================== ЯДРО РАСЧЁТА (ЗЕРКАЛО) =======================
 *  Пять швов ADR-0135. Единственный источник величин по объекту: статистика
 *  не выводит ни одной (ИС-1). Счётчик вызовов открыт наружу — смоук им
 *  доказывает, что каждая мера-«шов» действительно пришла из ядра.
 * =================================================================== */
const CORE = {
  calls: 0,
  grow(item, field, dateISO){
    const spec = (item.k || {})[field];
    if(!spec) return null;
    const [base, per30] = spec;
    const v = base + per30 * (daysBetween(ANCHOR, dateISO) / 30);
    return Math.round(Math.max(field === 'daysOverdue' ? 0 : 0, v) * 100) / 100;
  },
  money(item, field, dateISO){
    const cur = item.f.cur || 'KGS';
    const r = rateOn(cur, dateISO);
    return {value: CORE.grow(item, field, dateISO), cur, rate: r.rate, rateDate: r.rateDate, dated: r.dated};
  },
  /* --- ADR-0135 §4: пять дверей ядра --- */
  calcDebt(item, dateISO){
    CORE.calls++;
    const p = CORE.money(item, 'principal', dateISO);
    return {principal: p, daysOverdue: {value: Math.round(CORE.grow(item, 'daysOverdue', dateISO) || 0)}};
  },
  calcAccrual(item, dateISO){ CORE.calls++; return {interest: CORE.money(item, 'interest', dateISO)}; },
  calcAllocation(item, dateISO){
    CORE.calls++;
    return {issuedTotal: CORE.money(item, 'issuedTotal', dateISO),
            repaidTotal: CORE.money(item, 'repaidTotal', dateISO)};
  },
  calcSchedule(item, dateISO){ CORE.calls++; return {version: {value: 'действующая на ' + dateISO}}; },
  calcForecast(item, dateISO){ CORE.calls++; return {expected: CORE.money(item, 'principal', dateISO)}; },
  /* Шов классификации (ADR-0124): категория приходит готовой, здесь её не выводят. */
  riskCategory(item, dateISO){ CORE.calls++; return {category: {value: valueOn(item.h.category, dateISO)}}; },
  read(seam, item, dateISO){
    const fn = CORE[seam];
    if(typeof fn !== 'function') return null;
    return fn(item, dateISO);
  }
};
ST.coreCalls = () => CORE.calls;
ST.resetCoreCalls = () => { CORE.calls = 0; };
/* ======================= РЕЕСТРЫ: ДОСТУП ============================ */
const clone = x => JSON.parse(JSON.stringify(x));
const OBJ = id => (ST.state ? ST.state.objects : OBJECTS).find(o => o.id === id);
const IND = id => (ST.state ? ST.state.indicators : INDICATORS).find(i => i.id === id);
const DIM = id => (ST.state ? ST.state.dims : DIMS).find(d => d.id === id);
ST.OBJ = OBJ; ST.IND = IND; ST.DIM = DIM;
ST.seams = () => SEAMS.slice();
ST.aggFns = () => Object.keys(AGG_FNS);
ST.consumers = () => clone(CONSUMERS);

/* ==================== СБОРЩИК СТРОКИ СРЕЗА ==========================
 *  НИ ОДНОГО СЛОВА ПРЕДМЕТНОЙ ОБЛАСТИ НИЖЕ. Всё, что сборщик знает, он берёт
 *  из записей реестров: разрез объявляет источник, показатель объявляет источник,
 *  объект перечисляет то и другое. Шестой объект стоит одной строки данных.
 *  Смоук проверяет это буквально — по тексту функций (ИС-18).
 * =================================================================== */
function readDim(dimId, item, dateISO){
  const d = DIM(dimId);
  if(!d) return null;
  if(d.since > dateISO) return null;                       /* разрез действует вперёд */
  return d.levels ? readPath(d, item, dateISO) : readSrc(d, item, dateISO);
}
/* Один читатель на все случаи: разрез, уровень разреза и мера-«поле» берут значение
   одинаково — записью, а не веткой (ИС-18). */
function readSrc(spec, item, dateISO){
  if(!spec) return null;
  if(spec.src === 'история') return valueOn(item.h[spec.key], dateISO);
  if(spec.src === 'поле')    return item.f[spec.key] == null ? null : item.f[spec.key];
  if(spec.src === 'шов'){
    const a = CORE.read(spec.seam, item, dateISO);
    return a && a[spec.field] ? a[spec.field].value : null;
  }
  return null;
}
/* Иерархический разрез кладёт в строку ПУТЬ, а не листовое значение: иначе родитель
   пришлось бы доспрашивать сегодняшним справочником — и строка от 31.05 поехала бы
   вслед за сегодняшним переподчинением (ИС-4). Верхние уровни с источником «справочник»
   берутся у владельца (ADR-0176 §7). Путь обрывается на первом пустом уровне: объект
   без нижнего уровня остаётся у родителя и не исчезает (ADR-0176 §5). */
function readPath(d, item, dateISO){
  const vals = d.levels.map(L => L.src === 'справочник' ? null : readSrc(L, item, dateISO));
  for(let i = d.levels.length - 2; i >= 0; i--){
    if(d.levels[i].src === 'справочник'){
      const below = vals[i+1];
      vals[i] = below == null ? null : (((REF[d.ref] || {}).parent || {})[below] || null);
    }
  }
  const path = [];
  for(const v of vals){ if(v == null) break; path.push(v); }
  return path.length ? path : null;
}
function readMeas(indId, item, dateISO){
  const m = IND(indId);
  if(!m || m.src === 'агрегат') return null;               /* агрегат в строке не лежит — ИС-3 */
  if(m.src === 'поле'){
    const v = item.f[m.key];
    if(v == null) return null;
    if(!m.money) return {v};
    const r = rateOn(item.f.cur || 'KGS', dateISO);
    return {v, cur: item.f.cur || 'KGS', rate: r.rate, rateDate: r.rateDate};
  }
  if(m.src === 'шов'){
    const a = CORE.read(m.seam, item, dateISO);
    const cell = a && a[m.field];
    if(!cell || cell.value == null) return null;
    return m.money ? {v: cell.value, cur: cell.cur, rate: cell.rate, rateDate: cell.rateDate} : {v: cell.value};
  }
  return null;
}
function buildRow(objId, item, dateISO){
  const o = OBJ(objId);
  const dims = {}, meas = {};
  o.dims.forEach(id => { const v = readDim(id, item, dateISO); if(v != null) dims[id] = v; });
  o.meas.forEach(id => { const c = readMeas(id, item, dateISO); if(c) meas[id] = c; });
  return {obj: objId, ref: item.id, date: dateISO, dims, meas, fixed: null, by: 'прогон'};
}
ST.readDim = readDim; ST.readMeas = readMeas; ST.buildRow = buildRow;
/* Корзина — функция от СОХРАНЁННОГО значения, применяемая при чтении (ADR-0176 §3):
   строка хранит дату как есть, поэтому смена набора корзин прошлое не переписывает
   и ИС-4 не задет. Свободной корзины не бывает — набор объявлен записью разреза. */
const QN = ['I','II','III','IV'];
function bucketOf(v, bucket){
  if(v == null) return null;
  const t = String(v);
  if(bucket === 'год')     return t.slice(0,4);
  if(bucket === 'квартал') return t.slice(0,4)+' · '+QN[Math.floor((Number(t.slice(5,7))-1)/3)]+' кв.';
  if(bucket === 'месяц')   return monLabel(t.slice(0,7));
  return t;
}
/* Ключ группы: у иерархии — путь до запрошенного уровня, у корзины — корзина. */
function dimKey(d, val, q){
  if(val == null) return null;
  if(d && d.levels){
    const lvl = (q && q.levels && q.levels[d.id]) || d.levels.length;
    const path = (Array.isArray(val) ? val : [val]).slice(0, lvl);
    return path.length ? path.join(' / ') : null;
  }
  if(d && d.buckets) return bucketOf(val, q && q.buckets && q.buckets[d.id]);
  return String(val);
}
ST.bucketOf = bucketOf;
/* Форма строки закрыта: ни сомового эквивалента, ни долей, ни дельт, ни агрегатов
   (ИС-3, ИС-15) — всё это считается при показе из того, что лежит здесь. */
ST.ROW_SHAPE = ['obj','ref','date','dims','meas','fixed','by'];

/* ========================= ПРОГОН И ФИКСАЦИЯ ======================== */
function doRun(st, dateISO, kind, actor, reason){
  let written = 0;
  /* Состав прогона пишется поимённо: «строк — 46» не говорит, какое множество не
     доехало. Объект, у которого владелец отдал ноль, обязан быть виден строкой с
     нулём, а не отсутствием строки (СС-Д6). */
  const parts = [];
  st.objects.forEach(o => {
    let n = 0, kept = 0;
    (WORLD[o.id] || []).forEach(item => {
      const row = buildRow(o.id, item, dateISO);
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(i >= 0){ if(st.rows[i].fixed){ kept++; return; } st.rows[i] = row; } else st.rows.push(row);
      n++; written++;
    });
    parts.push({obj: o.id, name: o.name, n, kept});
  });
  st.runs.push({date: dateISO, kind, at: st.today, actor, reason, written, parts});
  return written;
}
function fixMonth(st, month, who, atISO){
  let n = 0;
  st.rows.forEach(r => { if(ym(r.date) === month && !r.fixed){ r.fixed = {period: month, at: atISO, by: who}; n++; } });
  return n;
}

/* ---------------------------- СОСТОЯНИЕ ---------------------------- */

    corrections: [{month:'2026-05', obj:'obj-credit', ref:'КД-2023/210', meas:'m-debt',

ST.seed = () => { ST.state = seed(); return ST.state; };
ST.state = seed();
function log(msg){ ST.state.log.unshift({at: ST.state.today, who: ST.state.role, msg}); }

/* ------------------------- ДОСТУП И РОЛИ ---------------------------- */
ST.canAdmin = () => ST.state.role === 'Администратор статистики';
ST.canBuild = () => ST.state.role !== 'Наблюдатель';
ST.scopeOf = () => {
  const c = ST.state.scope[ST.state.role];
  return c ? {dim:'d-curator', value: c} : null;
};

/* ------------------------ ПЕРИОДЫ И ЗАЩЁЛКА ------------------------- */
ST.isClosed = dateISO => ST.state.closedPeriods.includes(ym(dateISO));
ST.openPeriod = () => ST.state.months.find(m => !ST.state.closedPeriods.includes(m));
ST.fixationOfMonth = m => {
  const st = ST.state;
  if(!st.closedPeriods.includes(m)) return null;
  const r = st.rows.find(x => ym(x.date) === m && x.fixed);
  return r ? r.fixed : null;
};

/* Единственный акт модуля, у которого есть фамилия (ИС-9). Кнопки «зафиксировать
   статистику» нет: строки фиксирует закрытие учётного периода, сделанное человеком
   в учёте — здесь оно только зеркалится (ADR-0148, отвергнутое). */
ST.closePeriod = (month, who) => {
  const st = ST.state;
  if(!who) return {ok:false, why:'фиксация без актора невозможна: период закрывает человек, а не календарь (ИС-9)'};
  if(st.closedPeriods.includes(month)) return {ok:false, why:'период '+monLabel(month)+' уже закрыт'};
  const expected = ST.openPeriod();
  if(month !== expected) return {ok:false, why:'периоды закрываются по порядку: следующий — '+monLabel(expected)};
  if(monthEnd(month) >= st.today) return {ok:false, why:'период '+monLabel(month)+' ещё не завершён: закрытие возможно с '+fmt(first(nextM(month)))};
  const n = fixMonth(st, month, who, st.today);
  st.closedPeriods.push(month);
  log('период '+monLabel(month)+' закрыт ('+who+'): зафиксировано строк — '+n);
  return {ok:true, month, fixed:n, by:who};
};

/* --------------------------- ПРОГОН --------------------------------- */
ST.run = (dateISO, opts) => {
  const st = ST.state; opts = opts || {};
  if(dateISO > st.today) return {ok:false, why:'прогон на будущую дату не запускается'};
  if(ST.isClosed(dateISO)) return {ok:false, why:'период '+monLabel(ym(dateISO))+
    ' зафиксирован: строки не перезаписываются ни при каких правах (ИС-8). Открытие закрытого периода — общий порядок (ADR-0089)'};
  if(opts.manual){
    if(!ST.canAdmin()) return {ok:false, why:'внеплановый пересчёт запускает администратор статистики'};
    if(!opts.reason) return {ok:false, why:'внеплановый пересчёт без причины не запускается: журнал срезов — часть контракта'};
  }
  const kind = opts.manual ? 'внеплановый' : 'плановый';
  const written = doRun(st, dateISO, kind, opts.manual ? (opts.actor || st.role) : null, opts.reason || null);
  log((opts.manual ? 'внеплановый пересчёт' : 'прогон')+' за '+fmt(dateISO)+': строк — '+written);
  return {ok:true, date: dateISO, written, kind};
};
ST.skip = (dateISO, reason) => {
  const st = ST.state;
  if(!reason) return {ok:false, why:'пропуск без причины не записывается: дата просто отсутствует, и это надо объяснить (ADR-0148 §6)'};
  st.runs.push({date: dateISO, kind:'пропуск', at: st.today, actor:'планировщик', reason, written:0});
  log('пропуск прогона за '+fmt(dateISO)+': '+reason);
  return {ok:true};
};
/* Правки строки нет и не будет: её существование уничтожило бы смысл датированного
   среза (ИС-2). Отказ назван вслух, а не спрятан отсутствием кнопки. */
ST.tryEditRow = () => ({ok:false, why:'строку среза пишет только прогон: правки строк в модуле нет (ИС-2)'});

/* ===================== ВЫБОРКА, ВИДИМОСТЬ, ПАСПОРТ ================== */
const uniq = a => a.filter((x,i) => a.indexOf(x) === i);
function rowsAt(st, objId, dateISO){ return st.rows.filter(r => r.obj === objId && r.date === dateISO); }
function datesOf(st, objId){ return uniq(st.rows.filter(r => r.obj === objId).map(r => r.date)).sort(); }

/* ИС-12: дата без строк не подменяется молча — отдаётся ближайшая предыдущая, и её
   возраст называется в паспорте. */
function resolveAsOf(st, objId, requested){
  const ds = datesOf(st, objId).filter(d => d <= requested);
  if(!ds.length) return null;
  const asOf = ds[ds.length-1];
  return {asOf, age: daysBetween(asOf, requested), substituted: asOf !== requested};
}
ST.resolveAsOf = requested => resolveAsOf(ST.state, ST.state.q.obj, requested);

/* ИС-13: роль режет СТРОКИ, а не итог. Обратный порядок дал бы закрытую сумму
   вычитанием двух доступных срезов — утечку за два запроса. */
function applyScope(rows){
  const s = ST.scopeOf();
  if(!s) return rows;
  return rows.filter(r => r.dims[s.dim] === s.value);
}
function applyFilter(rows, filter){
  if(!filter || !filter.dim) return rows;
  const d = DIM(filter.dim);
  return rows.filter(r => {
    const v = r.dims[filter.dim];
    if(d && d.levels) return Array.isArray(v) && v.join(' / ').indexOf(String(filter.value)) === 0;
    return String(v) === String(filter.value);
  });
}
ST.applyScope = applyScope;

function scopeText(objId, n){
  const s = ST.scopeOf(), o = OBJ(objId);
  return s
    ? 'по '+n+' объектам «'+o.name+'», доступным вам: роль «'+ST.state.role+'», куратор '+s.value
    : 'по всем объектам «'+o.name+'» системы: '+n;
}
function filterText(filter){
  if(!filter || !filter.dim) return 'фильтра нет — спрошено обо всём доступном множестве';
  return 'фильтр пользователя: '+DIM(filter.dim).name+' = '+filter.value;
}
function fixationOf(rows){
  if(!rows.length) return 'не зафиксировано';
  const f = rows.filter(r => r.fixed).length;
  return f === rows.length ? 'зафиксировано' : f === 0 ? 'не зафиксировано' : 'смешанно';
}
function skipNote(st, requested, asOf){
  if(requested === asOf) return null;
  const gaps = st.runs.filter(r => r.kind === 'пропуск' && r.date > asOf && r.date <= requested);
  const parts = gaps.map(g => fmt(g.date)+' — пропуск: '+g.reason);
  const ran = uniq(st.runs.filter(r => r.kind !== 'пропуск').map(r => r.date));
  for(let d = asOf; d < requested; ){
    const nx = new Date(Date.parse(d) + 86400000).toISOString().slice(0,10);
    d = nx;
    if(d <= requested && ran.indexOf(d) < 0 && !gaps.some(g => g.date === d)) parts.push(fmt(d)+' — прогона не было');
  }
  return parts.join(' · ');
}
/* ИС-11: молчащее расхождение читается как ошибка расчёта и стоит доверия ко всему модулю. */
function divergenceNote(st, objId, asOf){
  if(!ST.isClosed(asOf)) return null;
  const c = st.corrections.filter(x => x.month === ym(asOf) && x.obj === objId);
  if(!c.length) return null;
  return c.map(x => 'есть корректировка за '+monLabel(x.month)+' по '+x.ref+', учтена '+fmt(x.at)+
    ': сегодняшний пересчёт дал бы на '+money(x.delta,'KGS')+' больше · основание: '+x.basis).join(' · ');
}
function passportFor(st, objId, requested, res, rows, filter){
  const fx = fixationOf(rows);
  const fixed = rows.find(r => r.fixed);
  return {
    requested, asOf: res.asOf, age: res.age, substituted: res.substituted,
    fixation: fx,
    fixedBy: fixed ? fixed.fixed.by : null,
    fixedAt: fixed ? fixed.fixed.at : null,
    scope: scopeText(objId, rows.length),
    filter: filterText(filter),
    n: rows.length,
    skipped: skipNote(st, requested, res.asOf),
    divergence: divergenceNote(st, objId, res.asOf)
  };
}
/* Форм паспорта ровно ДВЕ, и обе объявляет производитель (врезка ADR-0152 §2).
   Третьей, придуманной потребителем, не существует: иначе три модуля сократят
   по-разному и «числа без даты не остаётся» станет непроверяемым (ИС-24). */
function shortPassport(p){
  if(!p) return null;
  const fx = p.fixation === 'зафиксировано' ? 'зафикс.'
           : p.fixation === 'смешанно' ? 'фикс. смешанно' : 'не зафикс.';
  const seen = ST.scopeOf() ? 'вам видно ' : 'всего ';
  return 'на '+fmt(p.asOf).slice(0,5)+' ('+ageWord(p.age)+') · '+fx+' · '+seen+(p.n == null ? '—' : p.n);
}
ST.passportShort = shortPassport;
ST.passportForms = () => ['полная','краткая'];
/* Паспорт — не опция: без трёх обязательных полей ответ не отдаётся (ИС-10). */
function emit(payload, p){
  const missing = [];
  if(!p || !p.asOf) missing.push('дата расчёта');
  if(!p || !p.fixation) missing.push('признак фиксации');
  if(!p || !p.scope) missing.push('область видимости');
  if(missing.length) return {ok:false, why:'ответ без паспорта не отдаётся: не назван'+
    (missing.length > 1 ? 'ы' : '')+' '+missing.join(', ')+' (ИС-10)'};
  p.short = shortPassport(p);                              /* краткая форма — тоже паспорт */
  return Object.assign({ok:true, passport:p}, payload);
}
ST.emit = emit;

/* ------------------------- ПРЕДСТАВЛЕНИЕ ---------------------------- *
   Сомовый эквивалент, доли и дельты считаются ЗДЕСЬ, при показе, и не хранятся
   нигде (ИС-15). Доля просрочки меняется в процентных пунктах (P10-R6).        */
ST.somOf = cell => (cell && cell.v != null && cell.rate != null) ? Math.round(cell.v * cell.rate * 100)/100 : null;
ST.shareOf = (part, whole) => whole ? Math.round(part / whole * 1000)/10 : null;
ST.pointsBetween = (a, b) => Math.round((b - a) * 10)/10;

/* --------------------------- АГРЕГАТЫ ------------------------------- */
function aggValue(indId, rows){
  const I = IND(indId);
  if(!I) return null;
  if(I.src !== 'агрегат') return null;
  if(!AGG_FNS[I.fn]) return null;
  if(I.fn === 'count') return {v: rows.length, kind:'число'};
  const over = IND(I.over);
  if(!over) return null;
  const cells = rows.map(r => r.meas[I.over]).filter(c => c && c.v != null);
  if(!over.money) return {v: Math.round(AGG_FNS[I.fn].apply(cells.map(c => c.v))*10)/10, kind:'число', unit: over.unit};
  const curs = uniq(cells.map(c => c.cur));
  const rd = cells.length ? cells.map(c => c.rateDate).sort().slice(-1)[0] : null;
  if(curs.length <= 1){
    const cur = curs[0] || 'KGS';
    return {v: AGG_FNS[I.fn].apply(cells.map(c => c.v)), cur, kind:'сумма', rateDate: rd,
      som: AGG_FNS[I.fn].apply(cells.map(c => c.v * c.rate))};
  }
  /* Смешанный итог обязан называть состав (ADR-0151 §1). */
  return {v: AGG_FNS[I.fn].apply(cells.map(c => c.v * c.rate)), cur:'KGS', kind:'сумма', rateDate: rd,
    mixed: curs, note:'сведено по курсу на '+fmt(rd)+', множество разновалютное: '+curs.join(', ')};
}
ST.aggValue = aggValue;

/* ============================== ШВЫ =================================
 *  Три двери, каждая названа вопросом. Четвёртой нет (ADR-0152 §1).
 * =================================================================== */
function checkQuery(q, needAgg){
  const o = OBJ(q.obj);
  if(!o) return 'объекта «'+q.obj+'» нет в реестре объектов (ИС-18)';
  for(const d of (q.dims || [])){
    const D = DIM(d);
    if(!D) return 'разреза «'+d+'» нет в реестре разрезов';
    if(o.dims.indexOf(d) < 0) return 'разрез «'+D.name+'» объекту «'+o.name+'» не принадлежит';
    if(D.since > q.date) return 'разрез «'+D.name+'» введён '+fmt(D.since)+
      ' и действует вперёд: прошлое им не размечено (ADR-0147 §4)';
    if(D.buckets && (!q.buckets || D.buckets.indexOf(q.buckets[d]) < 0))
      return 'разрез «'+D.name+'» спрашивается корзиной из объявленных: '+D.buckets.join(' · ')+
        '. Свободной корзины, приходящей мимо реестра, не существует — новая заводится записью (ИС-23, ADR-0176 §2)';
    if(D.levels && q.levels && q.levels[d] != null &&
       (q.levels[d] < 1 || q.levels[d] > D.levels.length))
      return 'у разреза «'+D.name+'» уровней '+D.levels.length+': '+D.levels.map(L => L.name).join(' → ')+
        ' — запрошенного уровня нет (ИС-22, ADR-0176 §4)';
  }
  for(const m of (q.meas || [])){
    const I = IND(m);
    if(!I) return 'показателя «'+m+'» нет в реестре — для витрины его не существует (ИС-7)';
    if(I.obj !== '*' && I.obj !== q.obj) return 'показатель «'+I.name+'» объявлен для другого объекта';
    if(needAgg && I.src !== 'агрегат') return 'в срезе мера — агрегат: «'+I.name+
      '» строчный, спросите его швом statRows';
  }
  return null;
}

/* Сколько и на сколько, в таком-то разрезе, на такую-то дату. */
ST.statSlice = q => {
  const st = ST.state;
  const bad = checkQuery(q, true);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = rowsAt(st, q.obj, res.asOf);
  rows = applyScope(rows);                                   /* ДО группировки — ИС-13 */
  rows = applyFilter(rows, q.filter);
  const dims = q.dims || [], meas = q.meas || [];
  /* Форма ответа ОДНА — дерево (ADR-0176 §6). У плоского разреза оно вырождается в
     один уровень, поэтому потребителю не приходится знать двух форм ответа. */
  const hier = dims.length === 1 && DIM(dims[0]) && DIM(dims[0]).levels ? DIM(dims[0]) : null;
  const depth = hier ? Math.min((q.levels && q.levels[hier.id]) || hier.levels.length, hier.levels.length) : 1;
  const node = (key, parts, rws, lvl) => ({
    key, parts, level: lvl, n: rws.length, refs: rws.map(r => r.ref),
    values: meas.reduce((acc, m) => { acc[m] = aggValue(m, rws); return acc; }, {}),
    children: [], own: rws.length
  });
  /* Числа узла считаются ПО СТРОКАМ УЗЛА, а не складыванием детей (ADR-0176 §5): доля
     и среднее неаддитивны, а объект с незаполненным нижним уровнем при сложении исчез бы. */
  function branchAt(rws, lvl){
    const map = new Map();
    rws.forEach(r => {
      const v = r.dims[hier.id];
      const path = Array.isArray(v) ? v : [];
      if(path.length < lvl){ if(lvl > 1) return; }
      const key = path.length ? path.slice(0, lvl).join(' / ') : '—';
      if(!map.has(key)) map.set(key, {key, parts: path.slice(0, lvl), rows: []});
      map.get(key).rows.push(r);
    });
    return [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru')).map(g => {
      const nd = node(g.key, g.parts, g.rows, lvl);
      if(lvl < depth) nd.children = branchAt(g.rows, lvl + 1);
      nd.own = nd.n - nd.children.reduce((x,c) => x + c.n, 0);
      return nd;
    });
  }
  let groups;
  if(hier) groups = branchAt(rows, 1);
  else {
    const map = new Map();
    rows.forEach(r => {
      const parts = dims.map(d => { const k = dimKey(DIM(d), r.dims[d], q); return k == null ? '—' : k; });
      const key = parts.join(' · ') || 'всего';
      if(!map.has(key)) map.set(key, {key, parts, rows: []});
      map.get(key).rows.push(r);
    });
    groups = [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru'))
      .map(g => node(g.key, g.parts, g.rows, 1));
  }
  const total = meas.reduce((acc, m) => { acc[m] = aggValue(m, rows); return acc; }, {});
  return emit({groups, tree: groups, dims, meas, total, n: rows.length,
      hier: hier ? {dim: hier.id, levels: hier.levels.map(L => L.name), depth} : null,
      buckets: q.buckets || null},
    passportFor(st, q.obj, q.date, res, rows, q.filter));
};
/* Узел ищется по всему дереву: детализация родителя обязана открываться так же,
   как детализация листа. */
ST.findNode = (groups, key) => {
  for(const g of (groups || [])){
    if(g.key === key) return g;
    const hit = ST.findNode(g.children, key);
    if(hit) return hit;
  }
  return null;
};

/* Как это менялось. */
ST.statSeries = q => {
  const st = ST.state;
  const dates = (q.dates || []).slice().sort();
  if(!dates.length) return {ok:false, why:'ряд без дат не строится'};
  const bad = checkQuery({obj:q.obj, dims:[], meas:[q.meas], date: dates[dates.length-1]}, true);
  if(bad) return {ok:false, why: bad};
  const points = [], used = [];
  for(const d of dates){
    const res = resolveAsOf(st, q.obj, d);
    if(!res){ points.push({date:d, empty:true, why:'строк на '+fmt(d)+' и ранее нет (ИС-12)'}); continue; }
    let rows = applyFilter(applyScope(rowsAt(st, q.obj, res.asOf)), q.filter);
    used.push.apply(used, rows);
    points.push({date:d, asOf:res.asOf, age:res.age, substituted:res.substituted,
      fixation: fixationOf(rows), n: rows.length, value: aggValue(q.meas, rows)});
  }
  const last = resolveAsOf(st, q.obj, dates[dates.length-1]);
  const p = passportFor(st, q.obj, dates[dates.length-1], last, used, q.filter);
  p.fixation = fixationOf(used);
  p.range = fmt(dates[0])+' — '+fmt(dates[dates.length-1]);
  return emit({points, meas:q.meas}, p);
};

/* Порог — параметр ЭКСПЛУАТАЦИИ, а не модели (ADR-0178 §2): в системе он берётся
   замером, здесь намеренно мал, чтобы отказ был виден на четырнадцати погашениях. */
ST.rowsLimit = 12;

/* Строки вопроса, ещё без порога: одна выборка на две двери — список и выгрузку.
   Порог считается ПОСЛЕ ролевых правил (ADR-0178 §3): иначе отказ выдавал бы размер
   чужого множества, а куратор с сорока строками получал бы отказ из-за холдинга. */
function rowsFor(st, q){
  const bad = checkQuery({obj:q.obj, dims:[], meas:[], date:q.date}, false);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = applyFilter(applyScope(rowsAt(st, q.obj, res.asOf)), q.filter);
  if(q.refs) rows = rows.filter(r => q.refs.indexOf(r.ref) >= 0);
  return {ok:true, rows, res, p: passportFor(st, q.obj, q.date, res, rows, q.filter)};
}

/* Кто именно в этом числе. Карточки, документов и связей шов не отдаёт (ADR-0152 §3.3).
   Ответ ДВОИЧЕН: либо полный список, либо отказ с числом (ИС-22, ADR-0178 §1). Усечения
   и постраничности нет — усечённый список выглядит как полный и молча ломает ИС-14. */
ST.statRows = q => {
  const r = rowsFor(ST.state, q);
  if(!r.ok) return r;
  if(r.rows.length > ST.rowsLimit) return {ok:false, overLimit:true, n: r.rows.length,
    obj: q.obj, date: q.date, limit: ST.rowsLimit, passport: r.p,
    why:'в этом числе '+r.rows.length+' строк, порог показа — '+ST.rowsLimit+
      ': списком не отдаётся. Сузьте вопрос разрезом или возьмите выгрузкой — усечённого '+
      'и постраничного ответа не бывает (ИС-22, ADR-0178 §1)'};
  return emit({rows: r.rows.map(x => clone(x))}, r.p);
};

/* Сверка целиком — не экран, а ЗАДАНИЕ на выгрузку, и паспорт едет ВНУТРИ файла:
   иначе он теряется ровно там, где нужнее всего (ADR-0178 §5, ADR-0152 §граница). */
ST.exportJob = q => {
  const st = ST.state, r = rowsFor(st, q);
  if(!r.ok) return r;
  const job = {id:'ВГ-'+String(st.exports.length + 1).padStart(3,'0'), obj: q.obj, date: q.date,
    n: r.rows.length, by: st.role, at: st.today, state:'в очереди', filter: q.filter || null,
    file:'statRows-'+q.obj+'-'+q.date+'.csv', passport: clone(r.p)};
  st.exports.unshift(job);
  log('оформлена выгрузка '+job.id+': '+OBJ(q.obj).name+', строк — '+job.n);
  return {ok:true, job: clone(job)};
};
ST.exportsList = () => clone(ST.state.exports);

/* Второе действие числа, названное отдельно от первого (врезка ADR-0152 §4):
   «кто в этом числе» — строки среза на дату среза; «работать со списком» — реестр
   владельца на СЕГОДНЯ. Разные списки здесь — это сутки, а не расхождение. */
ST.workList = (objId, sliceDate) => {
  const st = ST.state;
  const o = OBJ(objId);
  if(!o) return {ok:false, why:'объекта «'+objId+'» нет в реестре объектов (ИС-18)'};
  const today = ST.registryList(objId, st.today, null);
  const res = resolveAsOf(st, objId, sliceDate || st.q.date);
  const inSlice = res ? applyScope(rowsAt(st, objId, res.asOf)).length : 0;
  return {ok:true, obj: objId, list: today, n: today.length, asOf: res ? res.asOf : null, inSlice,
    note:'в реестре «'+o.owner+'» на сегодня '+today.length+
      (res ? ', в срезе от '+fmt(res.asOf)+' было '+inSlice : '')+
      ' — это сутки, а не расхождение (ИС-14, врезка ADR-0152 §4)'};
};

/* ИС-14: тот же человек в реестре владельца обязан увидеть тот же список. Список
   строится независимо — из множества владельца, а не из строк среза. */
ST.registryList = (objId, dateISO, filter) => {
  const s = ST.scopeOf();
  return (WORLD[objId] || []).filter(item => {
    if(s && valueOn(item.h.curator, dateISO) !== s.value) return false;
    if(filter && filter.dim){
      const d = DIM(filter.dim);
      if(d && d.levels){
        const path = (readPath(d, item, dateISO) || []).join(' / ');
        if(path.indexOf(String(filter.value)) !== 0) return false;
      } else {
        const v = d.src === 'история' ? valueOn(item.h[d.key], dateISO)
                : d.src === 'поле' ? item.f[d.key]
                : ((CORE.read(d.seam, item, dateISO) || {})[d.field] || {}).value;
        if(String(v) !== String(filter.value)) return false;
      }
    }
    return true;
  }).map(item => item.id).sort();
};

/* ИС-17: период — разность двух строк нарастающего итога. База, если строки на
   начало интервала нет, НАЗЫВАЕТСЯ (ADR-0151 §2). */
ST.flowBetween = q => {
  const st = ST.state;
  const I = IND(q.meas);
  if(!I) return {ok:false, why:'показателя «'+q.meas+'» нет в реестре (ИС-7)'};
  if(!I.flow) return {ok:false, why:'«'+I.name+'» не поток: разностью двух строк считаются только нарастающие итоги (ИС-17)'};
  const a = resolveAsOf(st, q.obj, q.from), b = resolveAsOf(st, q.obj, q.to);
  if(!b) return {ok:false, why:'строк на '+fmt(q.to)+' и ранее нет (ИС-12)'};
  const endRows = applyFilter(applyScope(rowsAt(st, q.obj, b.asOf)), q.filter);
  const baseRows = a ? applyFilter(applyScope(rowsAt(st, q.obj, a.asOf)), q.filter) : [];
  let sum = 0; const born = [];
  endRows.forEach(r => {
    const end = r.meas[q.meas]; if(!end) return;
    const bs = baseRows.find(x => x.ref === r.ref);
    const base = bs && bs.meas[q.meas] ? bs.meas[q.meas].v : 0;
    if(!bs) born.push(r.ref);
    sum += (end.v - base) * (end.rate || 1);
  });
  const p = passportFor(st, q.obj, q.to, b, endRows.concat(baseRows), q.filter);
  p.base = a ? {requested: q.from, asOf: a.asOf, named: a.substituted} : null;
  p.baseNote = a
    ? (a.substituted ? 'база периода: '+fmt(a.asOf)+' вместо '+fmt(q.from) : 'база периода: '+fmt(a.asOf))
    : 'строки на начало периода нет — период считается от рождения объекта';
  return emit({value: Math.round(sum*100)/100, cur:'KGS', from:q.from, to:q.to,
    baseDate: a ? a.asOf : null, born}, p);
};

/* Кто вправе спрашивать. Классификация — не вправе (ИС-5). */
ST.callSeam = (module, seam, q) => {
  const c = CONSUMERS.find(x => x.module === module);
  if(!c) return {ok:false, why:'модуль «'+module+'» в списке потребителей не значится'};
  if(SEAMS.indexOf(seam) < 0) return {ok:false, why:'шва «'+seam+'» нет: швов три, четвёртый не заводится (ADR-0152 §1)'};
  if(c.may.indexOf(seam) < 0) return {ok:false, why: c.why || ('модулю «'+module+'» шов '+seam+' не открыт')};
  return ST[seam](q);
};

/* ИС-20: статистика период не запирает — незасчитанный прогон предупреждение, не блокировка. */
ST.periodBlockers = month => {
  const st = ST.state;
  const days = st.runs.filter(r => ym(r.date) === month);
  const skipped = days.filter(r => r.kind === 'пропуск');
  const warnings = skipped.map(s => 'прогон за '+fmt(s.date)+' не состоялся: '+s.reason);
  return {blockers: [], warnings};
};

/* ======================= ОПЕРАЦИИ НАД РЕЕСТРАМИ ===================== */
const DERIVED = ['доля','дельта','сомовый эквивалент','процент от','прирост'];
ST.addIndicator = spec => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!spec || !spec.id || IND(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!spec.name) return {ok:false, why:'наименование пусто'};
  if('formula' in spec || 'expr' in spec || 'выражение' in spec)
    return {ok:false, why:'в записи показателя нет поля формулы: запись объявляет ОТКУДА берётся величина и молчит о том, КАК (ИС-6, ADR-0150)'};
  if(DERIVED.some(d => (spec.name || '').toLowerCase().indexOf(d) >= 0))
    return {ok:false, why:'доли, дельты и сомовый эквивалент — представление, а не показатель: они считаются при показе и не хранятся (ИС-15)'};
  if(['шов','поле','агрегат'].indexOf(spec.src) < 0)
    return {ok:false, why:'источник объявляется одним из трёх: шов ядра · поле объекта · агрегат (ADR-0150 §1)'};
  if(spec.src === 'шов' && typeof CORE[spec.seam] !== 'function')
    return {ok:false, why:'шва «'+spec.seam+'» у ядра нет: нужная величина заводится В ЯДРЕ и появляется здесь полем шва — промежуточного пути нет (ADR-0150 §3)'};
  if(spec.src === 'агрегат'){
    if(!AGG_FNS[spec.fn]) return {ok:false, why:'функция «'+spec.fn+'» вне закрытого списка: '+Object.keys(AGG_FNS).join(', ')};
    if(spec.fn !== 'count' && !IND(spec.over)) return {ok:false, why:'агрегат считается по показателю реестра — «'+spec.over+'» в нём нет (ИС-7)'};
  }
  if(spec.src === 'поле' && !spec.key) return {ok:false, why:'поле объекта не названо'};
  st.indicators.push(clone(spec));
  const o = OBJ(spec.obj);
  if(o && o.meas.indexOf(spec.id) < 0) o.meas.push(spec.id);
  log('заведён показатель «'+spec.name+'» (источник: '+spec.src+')');
  return {ok:true, id: spec.id};
};
ST.retireIndicator = (id, confirm) => {
  const st = ST.state, I = IND(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!I) return {ok:false, why:'показателя нет в реестре'};
  const users = st.indicators.filter(x => x.over === id).map(x => x.name);
  if(users.length) return {ok:false, why:'показатель используется агрегатами: '+users.join(', ')};
  /* Вывод не запрещается ссылками — он обязан НАЗВАТЬ, что сломается, поимённо
     (ADR-0177 §4): запрет чужой публикацией сделал бы реестр заложником потребителей. */
  const refs = ST.refsTo(id);
  if(refs.length && !confirm) return {ok:false, needsConfirm:true, breaks: refs,
    why:'на показатель ссылаются '+refs.length+': '+refs.map(r => r.consumer+' · '+r.edition).join(' · ')+
      '. Вывод возможен — но экран обязан назвать это поимённо, а не отказать молча (ИС-25, ADR-0177 §4)'};
  st.objects.forEach(o => { const i = o.meas.indexOf(id); if(i >= 0) o.meas.splice(i,1); });
  st.indicators.splice(st.indicators.findIndex(x => x.id === id), 1);
  const broken = ST.refsTo(id);
  log('показатель «'+I.name+'» снят с реестра'+(broken.length ? ': сломано ссылок — '+broken.length : ''));
  return {ok:true, broke: broken};
};
/* ------------------- ОБРАТНЫЙ ИНДЕКС ССЫЛОК (ADR-0177) -------------------- *
   Ссылку публикует ПОТРЕБИТЕЛЬ вместе со своей редакцией; повторная публикация без
   ссылки её снимает. Индекс держит владелец реестра, потому что вопрос «что сломается,
   если снять показатель» задаётся здесь, а ответ живёт у семерых.                */
ST.publishRefs = pub => {
  const st = ST.state;
  if(!pub || !pub.consumer || !pub.edition)
    return {ok:false, why:'публикация называет потребителя и его редакцию: анонимной ссылки индекс не хранит (ADR-0177 §2)'};
  for(const id of (pub.uses || []))
    if(!IND(id)) return {ok:false, why:'показателя «'+id+'» нет в реестре — ссылаться не на что (ИС-7)'};
  st.refs = st.refs.filter(r => !(r.consumer === pub.consumer && r.edition === pub.edition));
  (pub.uses || []).forEach(id => st.refs.push({ind:id, consumer:pub.consumer, edition:pub.edition,
    owner: pub.owner || '—', at: st.today}));
  log('публикация «'+pub.edition+'» ('+pub.consumer+'): ссылок — '+(pub.uses || []).length);
  return {ok:true, n:(pub.uses || []).length};
};
ST.refsTo = id => clone(ST.state.refs.filter(r => r.ind === id));
ST.refsAll = () => clone(ST.state.refs);

/* Исчислимость налету — свойство ЗАПИСИ агрегата (ADR-0159, врезка). У шва и поля
   она производна от источника и в форме заперта: спорить с ядром реестр не вправе. */
ST.liveOf = id => {
  const I = IND(id);
  if(!I) return null;
  if(I.src !== 'агрегат') return {live:true, editable:false,
    why:'у шва и поля исчислимость — свойство источника, а не решение автора записи'};
  return {live: I.live !== false, editable:true,
    why:'у агрегата исчислимость объявляет автор записи: тяжёлый агрегат считается прогоном'};
};
ST.setLive = (id, val) => {
  const I = IND(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!I) return {ok:false, why:'показателя нет в реестре'};
  if(I.src !== 'агрегат') return {ok:false, why:'исчислимость правится только у агрегатов: у «'+
    I.name+'» источник — '+I.src+', и признак производен от него (ADR-0159, врезка)'};
  I.live = !!val;
  log('показатель «'+I.name+'»: исчислимость налету — '+(val ? 'да' : 'нет'));
  return {ok:true, live: I.live};
};

/* Новый разрез действует ВПЕРЁД: прошлое им не размечается, потому что размечать
   пришлось бы сегодняшним значением (ADR-0147 §4). */
ST.addDim = spec => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'набор разрезов ведёт администратор статистики'};
  if(!spec || !spec.id || DIM(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(['история','поле','шов'].indexOf(spec.src) < 0) return {ok:false, why:'разрез объявляет источник: история · поле · шов'};
  /* Единственный вопрос владельцу реестра — и он задаётся ЗДЕСЬ, при заведении, а не
     при разборе странного числа (ADR-0179 §2). */
  if(!spec.perObject) return {ok:false, why:'у разреза спрашивается: сколько его значений '+
    'бывает у одного объекта на одну дату — одно или много (ИС-21, ADR-0179 §2)'};
  if(spec.perObject === 'много') return {ok:false, why:'значений много — значит разрез принадлежит '+
    'не этому объекту, а нижележащему: заводится объект, а не разрез. Иначе объект попадёт в две '+
    'группы сразу, сумма групп превысит множество и объяснить это будет нечем (ИС-21, ADR-0179 §1)'};
  if(spec.buckets && (!Array.isArray(spec.buckets) || !spec.buckets.length))
    return {ok:false, why:'набор корзин объявляется списком: свободной корзины не бывает (ИС-23)'};
  if(spec.levels && !spec.owner && !spec.ref)
    return {ok:false, why:'уровни берутся у владельца справочника — владелец не назван. Второй '+
      'экземпляр иерархии дал бы второй ответ на «сколько районов в области» (ADR-0176 §7)'};
  const rec = clone(spec); rec.since = st.today;
  st.dims.push(rec);
  const o = OBJ(spec.obj);
  if(o && o.dims.indexOf(spec.id) < 0) o.dims.push(spec.id);
  log('заведён разрез «'+spec.name+'», действует с '+fmt(rec.since));
  return {ok:true, since: rec.since};
};
/* Шестой объект — строка реестра, а не релиз (ИС-18, ADR-0149). */
ST.addObject = spec => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'реестр объектов ведёт администратор статистики'};
  if(!spec || !spec.id || OBJ(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!WORLD[spec.id]) return {ok:false, why:'множества «'+spec.id+'» владелец не отдаёт: статистика объектов не заводит, она их считает'};
  for(const d of (spec.dims || [])) if(!DIM(d)) return {ok:false, why:'разреза «'+d+'» нет в реестре разрезов'};
  for(const m of (spec.meas || [])) if(!IND(m)) return {ok:false, why:'показателя «'+m+'» нет в реестре показателей (ИС-7)'};
  st.objects.push(clone(spec));
  log('заведён объект статистики «'+spec.name+'» — строки появятся ближайшим прогоном');
  return {ok:true, id: spec.id};
};
/* Явное расхождение зафиксированного с сегодняшним пересчётом (ИС-11). */
ST.divergence = (month, objId, measId) => {
  const st = ST.state;
  if(!st.closedPeriods.includes(month)) return {ok:false, why:'период '+monLabel(month)+' не закрыт: расхождению неоткуда взяться'};
  const cs = st.corrections.filter(c => c.month === month && c.obj === objId && c.meas === measId);
  const rows = st.rows.filter(r => r.obj === objId && ym(r.date) === month && r.fixed);
  const fixedSum = rows.reduce((s, r) => s + ((r.meas[measId] || {}).v || 0) * ((r.meas[measId] || {}).rate || 1), 0);
  const delta = cs.reduce((s, c) => s + c.delta, 0);
  return {ok:true, month, fixed: Math.round(fixedSum*100)/100, today: Math.round((fixedSum + delta)*100)/100,
    delta, corrections: clone(cs), shown: !!cs.length};
};
/* ===================================================================== *
 *                              ЭКРАНЫ
 *  Их три (СС-19): конструктор среза с детализацией · журнал срезов ·
 *  реестры. Экрана правки строки среза нет — он нарушил бы ИС-2.
 * ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
const DATES = ['2026-05-31','2026-06-30','2026-07-31','2026-08-10','2026-08-18','2026-08-20','2026-08-21'];
/* Даты ряда — часть ВОПРОСА, а не константа файла (СС-Д1). Точки строятся назад от
   даты среза шагом месяц или квартал; дата, на которую строк нет, не выбрасывается —
   ответ подставит ближайшую предыдущую и назовёт возраст (ИС-12). */
const SERIES_DATES = ['2026-05-31','2026-06-30','2026-07-31','2026-08-18'];
ST.seriesDates = () => {
  const st = ST.state, sq = st.q.series || {step:'месяц', points:4};
  const step = sq.step === 'квартал' ? 3 : 1;
  const out = [];
  let m = ym(st.q.date);
  for(let i = 0; i < sq.points; i++){
    out.unshift(i === 0 ? st.q.date : monthEnd(m));
    for(let k = 0; k < step; k++) m = prevM(m);
  }
  return out;
};
ST.setSeries = (k, v) => { ST.state.q.series[k] = v; render(); };

function money(v, cur){
  if(v == null) return '—';
  const parts = (Math.round(v*100)/100).toFixed(2).split('.');
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ')+','+parts[1]+(cur ? ' '+cur : '');
}
function num(v, unit){
  if(v == null) return '—';
  const r = Math.round(v*10)/10;
  return String(r).replace('.', ',')+(unit ? ' '+unit : '');
}
function cellText(val){
  if(!val) return '—';
  if(val.kind === 'сумма'){
    let s = esc(money(val.v, val.cur));
    if(val.som != null && val.cur !== 'KGS') s += ' <span class="muted">≈ '+esc(money(val.som,'KGS'))+'</span>';
    if(val.mixed) s += ' <span class="pill warn" title="'+esc(val.note)+'">сведено</span>';
    return s;
  }
  return esc(num(val.v, val.unit));
}

function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast'+(kind ? ' '+kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 5200);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(okMsg, 'ok'); }
  else toast((res && res.why) || 'отказано', 'err');
  render();
}

function passportHtml(p){

    ' — строк на эту дату нет</span>' : '')+'</div>');
  rows.push('<div class="row"><span class="k">Фиксация</span>'+
    (p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
     p.fixation === 'смешанно' ? '<span class="pill warn">смешанно</span>' :
     '<span class="pill neutral">не зафиксировано</span>')+
    (p.fixedBy ? ' <span class="muted">'+esc(p.fixedBy)+', '+fmt(p.fixedAt)+'</span>' : '')+
    (p.range ? ' <span class="muted">ряд '+esc(p.range)+'</span>' : '')+'</div>');

  rows.push('<div class="row"><span class="k">Фильтр</span><span class="muted">'+esc(p.filter)+'</span></div>');

/* ==================== ЭКРАН 1: КОНСТРУКТОР СРЕЗА ==================== */
ST.pickObj = id => { const st = ST.state; const o = OBJ(id);
  st.q.obj = id; st.q.dims = []; st.q.levels = {}; st.q.buckets = {};
  st.q.meas = o.meas.filter(m => IND(m).src === 'агрегат').slice(0,2);
  st.q.filter = null; st.drill = null; st.work = null; addDimToQ(o.dims[0]); render(); };
/* Корзина у разреза-даты не «по умолчанию любая»: вопрос без корзины не задаётся вовсе,
   поэтому при выборе разреза корзина берётся первой из объявленных (ИС-23). */
function addDimToQ(id){
  const st = ST.state, D = DIM(id);
  if(!D || st.q.dims.indexOf(id) >= 0) return;
  st.q.dims.push(id);
  if(D.buckets && !st.q.buckets[id]) st.q.buckets[id] = D.buckets[0];
}
ST.toggleDim = id => { const st = ST.state, a = st.q.dims, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else addDimToQ(id);
  st.drill = null; st.work = null; render(); };
ST.setLevel = (dimId, n) => { ST.state.q.levels[dimId] = n; ST.state.drill = null; render(); };
/* Фильтр задаётся ЯВНО, а не только кликом по числу (СС-Д2): значения берутся из строк
   на дату среза — списком чужих справочников фильтр не наполняется (ИС-4). */
ST.filterValues = dimId => {
  const st = ST.state, d = DIM(dimId);
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  if(!res || !d) return [];
  const set = new Set();
  applyScope(rowsAt(st, st.q.obj, res.asOf)).forEach(r => {
    const v = r.dims[dimId];
    if(v == null) return;
    if(Array.isArray(v)){ for(let i = 1; i <= v.length; i++) set.add(v.slice(0,i).join(' / ')); }
    else if(d.buckets){
      const q = {buckets: {}};
      q.buckets[dimId] = st.q.buckets[dimId] || d.buckets[0];
      set.add(dimKey(d, v, q));
    }
    else set.add(String(v));
  });
  return [...set].sort((a,b) => String(a).localeCompare(String(b),'ru'));
};
ST.applyFilterUI = () => {
  const st = ST.state;
  const dim = (($('#fDim') || {}).value || '');
  const val = (($('#fVal') || {}).value || '');
  if(!dim || !val) return toast('фильтр называет разрез и значение', 'err');
  st.q.filter = {dim, value: val}; st.drill = null; st.work = null; render();
};
ST.pickFilterDim = () => { ST.state.fDim = (($('#fDim') || {}).value || ''); render(); };
ST.clearFilter = () => { ST.state.q.filter = null; ST.state.drill = null; render(); };
ST.setBucket = (dimId, b) => { ST.state.q.buckets[dimId] = b; ST.state.drill = null; render(); };
ST.exportUI = () => { const st = ST.state;
  act(ST.exportJob({obj: st.q.obj, date: st.q.date, filter: st.q.filter}),
    'выгрузка оформлена — очередь на экране «Выгрузки»'); };
ST.workUI = () => { const st = ST.state; st.work = ST.workList(st.q.obj, st.q.date); render(); };
ST.closeWork = () => { ST.state.work = null; render(); };
ST.showPass = i => { ST.state.tilePass = ST.state.tilePass === i ? null : i; render(); };
ST.toggleMeas = id => { const a = ST.state.q.meas, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else a.push(id); ST.state.drill = null; render(); };
ST.setMode = m => { ST.state.q.mode = m; ST.state.drill = null; render(); };
ST.drillTo = key => { ST.state.drill = key; render(); };
ST.clearDrill = () => { ST.state.drill = null; render(); };
ST.setFlow = (k, v) => { ST.state.flow[k] = v; render(); };

function chip(on, label, onclick, off){
  return '<button class="chip'+(on ? ' on' : '')+(off ? ' off' : '')+'"'+
    (off ? ' disabled' : ' onclick="'+onclick+'"')+'>'+esc(label)+'</button>';
}
function pickBar(){
  const st = ST.state, o = OBJ(st.q.obj);
  const objs = st.objects.map(x => chip(x.id === st.q.obj, x.name, "ST.pickObj('"+x.id+"')")).join('');
  const dims = o.dims.map(d => chip(st.q.dims.indexOf(d) >= 0, DIM(d).name, "ST.toggleDim('"+d+"')",
    DIM(d).since > st.q.date)).join('');
  const meas = o.meas.filter(m => IND(m).src === 'агрегат')
    .map(m => chip(st.q.meas.indexOf(m) >= 0, IND(m).name, "ST.toggleMeas('"+m+"')")).join('');
  const modes = [['slice','Срез — сколько и на сколько'],['series','Ряд — как менялось'],['rows','Строки — кто именно']]
    .map(([k,n]) => chip(st.q.mode === k, n, "ST.setMode('"+k+"')")).join('');
  /* Уровень и корзина — не «настройки отображения», а часть вопроса: они меняют то,
     что спрошено, и потому стоят рядом с разрезом (ADR-0176 §2, §4). */
  const hierD = st.q.dims.map(DIM).filter(d => d && d.levels);
  const bktD  = st.q.dims.map(DIM).filter(d => d && d.buckets);
  const lvlBar = hierD.map(d => '<div><h4>Уровень: '+esc(d.name)+'</h4><div class="chips">'+
    d.levels.map((L,i) => chip((st.q.levels[d.id] || d.levels.length) === i+1, L.name,
      "ST.setLevel('"+d.id+"',"+(i+1)+")")).join('')+'</div></div>').join('');
  const bktBar = bktD.map(d => '<div><h4>Корзина: '+esc(d.name)+'</h4><div class="chips">'+
    d.buckets.map(b => chip(st.q.buckets[d.id] === b, b, "ST.setBucket('"+d.id+"','"+b+"')")).join('')+
    '</div></div>').join('');
  /* Фильтр — сужение ВОПРОСА, и он обязан быть виден строкой, а не остаться следом клика. */
  const fDims = o.dims.filter(d => DIM(d) && DIM(d).since <= st.q.date);
  const fCur = st.fDim && fDims.indexOf(st.fDim) >= 0 ? st.fDim : fDims[0];
  const fBar = ST.canBuild() ? '<div class="form-row" style="margin-top:12px">'+
    '<div class="fld"><label>Фильтр — разрез</label><select id="fDim" onchange="ST.pickFilterDim()">'+
      fDims.map(d => '<option value="'+d+'"'+(d === fCur ? ' selected' : '')+'>'+esc(DIM(d).name)+
        '</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Значение</label><select id="fVal">'+
      (ST.filterValues(fCur).map(v => '<option'+(st.q.filter && st.q.filter.value === v ? ' selected' : '')+
        '>'+esc(v)+'</option>').join('') || '<option value="">— значений на дату среза нет —</option>')+
      '</select></div>'+
    '<button class="btn btn-secondary" onclick="ST.applyFilterUI()">Применить фильтр</button>'+
    (st.q.filter ? '<button class="btn btn-secondary" onclick="ST.clearFilter()">Снять фильтр — сейчас «'+
      esc(st.q.filter.value)+'»</button>' : '')+'</div>' : '';
  return '<div class="card"><div class="pickbar">'+
    '<div><h4>Объект статистики</h4><div class="chips">'+objs+'</div></div>'+
    '<div><h4>Разрезы</h4><div class="chips">'+dims+'</div></div>'+lvlBar+bktBar+
    '<div><h4>Меры (агрегаты закрытого списка)</h4><div class="chips">'+meas+'</div></div>'+
    '<div><h4>Вопрос</h4><div class="chips">'+modes+'</div></div>'+
    '</div>'+fBar+'<p class="note">Объект, разрезы и меры — записи реестров: сборщик строк не знает ни одного '+
    'из этих слов (ИС-18). Меры среза — только агрегаты закрытого списка '+esc(ST.aggFns().join(' · '))+
    '(ADR-0150 §2); строчный показатель спрашивается швом <code>statRows</code>. '+
    'Разрез с уровнями спрашивается уровнем, разрез-дата — корзиной из объявленного списка: '+
    'свободной корзины («по неделям») в запросе не бывает — это заявка владельцу реестра '+
    '(ИС-22, ИС-23, ADR-0176). Фильтр — часть вопроса, а не след клика: значения берутся '+
    'из строк на дату среза, и в паспорте фильтр назван словами.</p></div>';
}

function sliceTable(res){
  const dims = res.dims, cols = res.meas.filter(m => m !== 'a-count');
  const cell = (g) => '<td class="num"><button onclick="ST.drillTo(\''+esc(g.key).replace(/'/g,"")+'\')">'+
    g.n+'</button></td>'+cols.map(m => '<td class="num">'+cellText(g.values[m])+'</td>').join('');
  let head, body, span;
  if(res.hier){
    /* Дерево: узел печатает СВОИ числа, а не сумму детей, и колонка «своих» показывает
       тех, у кого нижнего уровня нет, — они остаются у родителя (ADR-0176 §5). */
    /* Колонка «своих» появляется только там, где ниже есть уровень: на нижнем уровне
       своих и всего — одно и то же число, и колонка из одних прочерков лишь шумит. */
    const deep = res.hier.depth > 1;
    const line = g => '<tr'+(g.level > 1 ? ' class="lvl"' : '')+'>'+
      '<td style="padding-left:'+(10 + (g.level - 1) * 26)+'px">'+
        (g.level > 1 ? '<span class="muted">└ </span>' : '')+
        esc(g.parts[g.parts.length - 1] || g.key)+'</td>'+
      (deep ? '<td class="num">'+(g.level < res.hier.depth ? g.own : '—')+'</td>' : '')+
      cell(g)+'</tr>'+(g.children || []).map(line).join('');
    head = '<th>'+esc(res.hier.levels.slice(0, res.hier.depth).join(' → '))+'</th>'+
      (deep ? '<th>Своих</th>' : '')+'<th>Объектов</th>'+
      cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(line).join('');
    span = deep ? 2 : 1;
  } else {
    head = (dims.length ? dims.map(d => '<th>'+esc(DIM(d).name)+
        (res.buckets && res.buckets[d] ? ' <span class="small">('+esc(res.buckets[d])+')</span>' : '')+
        '</th>').join('') : '<th>Множество</th>')+
      '<th>Объектов</th>'+cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(g => '<tr>'+
      (dims.length ? dims.map((d,i) => '<td>'+esc(g.parts[i])+'</td>').join('') : '<td>всего</td>')+
      cell(g)+'</tr>').join('');
    span = Math.max(1, dims.length);
  }
  const foot = '<tr><td'+(span > 1 ? ' colspan="'+span+'"' : '')+'>Итого</td>'+
    '<td class="num">'+res.n+'</td>'+
    cols.map(m => '<td class="num">'+cellText(res.total[m])+'</td>').join('')+'</tr>';
  return '<table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="9" class="muted">строк нет</td></tr>')+'</tbody><tfoot>'+foot+'</tfoot></table>'+
    '<p class="note">Число объектов — ссылка: детализация открывает те самые строки, из которых '+
    'собрано число (<code>statRows</code>, ИС-14). Хранимых агрегатов нет ни одного — всё в таблице '+
    'собрано группировкой строк при показе (ИС-3).'+
    (res.hier ? ' Родитель <b>считается по своим строкам</b>, а не складывается из детей: доля и '+
      'среднее неаддитивны, а объект без нижнего уровня при сложении исчез бы — он в колонке «своих» '+
      '(ИС-22, ADR-0176 §5).' : '')+'</p>';
}

function seriesBlock(){
  const st = ST.state;
  const m = st.q.meas.find(x => IND(x).fn !== 'count') || st.q.meas[0] || 'a-count';
  const dts = ST.seriesDates();
  const res = ST.statSeries({obj: st.q.obj, meas: m, dates: dts, filter: st.q.filter});
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  const vals = res.points.map(p => p.value ? (p.value.som != null ? p.value.som : p.value.v) : 0);
  const top = Math.max.apply(null, vals.concat([1]));
  const bars = res.points.map((p,i) => '<div class="bar'+(p.fixation === 'зафиксировано' ? ' fixed' : '')+'">'+
    '<i style="height:'+Math.max(3, Math.round(vals[i]/top*96))+'px"></i>'+
    '<span>'+fmt(p.asOf || p.date).slice(0,5)+'</span></div>').join('');
  const rows = res.points.map(p => '<tr>'+
    '<td>'+fmt(p.date)+(p.substituted ? ' <span class="pill warn">строк нет, взято '+fmt(p.asOf)+'</span>' : '')+'</td>'+
    '<td>'+(p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
      '<span class="pill neutral">не зафиксировано</span>')+'</td>'+
    '<td class="num">'+p.n+'</td><td class="num">'+cellText(p.value)+'</td></tr>').join('');
  return passportHtml(res.passport)+
    '<div class="card"><h3>'+esc(IND(m).name)+' <span class="small">— ряд по '+dts.length+
      ' датам, шаг '+esc(st.q.series.step)+'</span></h3>'+
    '<div class="chips" style="margin-bottom:10px">'+
      ['месяц','квартал'].map(k => chip(st.q.series.step === k, 'шаг: '+k, "ST.setSeries('step','"+k+"')")).join('')+
      [4,6,8].map(k => chip(st.q.series.points === k, k+' '+plural(k,'точка','точки','точек'),
        "ST.setSeries('points',"+k+")")).join('')+
    '</div>'+
    '<div class="spark">'+bars+'</div>'+
    '<table class="cgrid"><thead><tr><th>Дата</th><th>Фиксация</th><th>Объектов</th><th>Значение</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    '<p class="note">Признак фиксации у ряда — <b>смешанно</b>, когда часть точек закрыта человеком, '+
    'а часть нет: ряд обязан это сказать, а не усреднить (ИС-10, ADR-0148 §4). Даты ряда — часть '+
    'вопроса: последняя точка всегда дата среза, остальные отсчитаны назад шагом. Точка, на которую '+
    'строк нет, не выбрасывается — берётся ближайшая предыдущая, и подмена помечена (ИС-12).</p></div>';
}

/* Отказ называет ЧИСЛО: «слишком много» без числа не даёт сузить вопрос (ADR-0178 §4).
   Рядом стоят обе законные дороги — сузить вопрос и взять выгрузкой. */
function refusalCard(res){
  const o = OBJ(res.obj);
  return '<div class="card"><h3>Список не отдаётся <span class="small">— в числе '+res.n+' строк</span></h3>'+
    '<div class="banner danger">'+esc(res.why)+'</div>'+passportHtml(res.passport)+
    '<div class="btn-row"><button class="btn btn-primary" onclick="ST.exportUI()">Оформить выгрузку — '+
      res.n+' строк</button>'+
    '<button class="btn btn-secondary" onclick="ST.workUI()">Работать со списком в реестре «'+
      esc(o.owner)+'»</button></div>'+
    '<p class="note">Порог — параметр эксплуатации, а не модели, и считается <b>после</b> ролевых правил: '+
    'иначе отказ выдавал бы размер чужого множества, а куратор с сорока строками получал бы отказ из-за '+
    'холдинга (ADR-0178 §2, §3). Сверка целиком идёт выгрузкой-заданием, и паспорт едет <b>внутри файла</b> '+
    '(ADR-0178 §5).</p></div>';
}
/* Второе действие числа названо отдельно от первого: реестр владельца на СЕГОДНЯ —
   законно другой список, чем строки среза от вчера (врезка ADR-0152 §4). */
function workBlock(){
  const w = ST.state.work;
  if(!w || !w.ok) return '';
  return '<div class="card"><h3>Реестр владельца на сегодня '+
    '<span class="small">— '+w.n+' шт.</span> <button class="btn btn-secondary btn-sm" '+
    'onclick="ST.closeWork()">закрыть</button></h3>'+
    '<div class="banner info">'+esc(w.note)+'</div>'+
    '<p class="mono small">'+w.list.map(esc).join(' · ')+'</p>'+
    '<p class="note">Это <b>не</b> детализация числа: детализация — <code>statRows</code> на дату среза, '+
    'а здесь список владельца на сегодня. Одно число, два разных действия, и подпись обязана назвать '+
    'разницу словами (ИС-14).</p></div>';
}
function rowsBlock(refs, title){
  const st = ST.state;
  const res = ST.statRows({obj: st.q.obj, date: st.q.date, filter: st.q.filter, refs});
  if(!res.ok && res.overLimit) return refusalCard(res);
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  const o = OBJ(st.q.obj);
  const dims = o.dims.filter(d => DIM(d).since <= st.q.date);
  const meas = o.meas.filter(m => IND(m).src !== 'агрегат');
  const head = '<th>'+esc(o.refName)+'</th>'+dims.map(d => '<th>'+esc(DIM(d).name)+'</th>').join('')+
    meas.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
  const body = res.rows.map(r => '<tr><td class="mono">'+esc(r.ref)+'</td>'+
    dims.map(d => '<td>'+esc(r.dims[d] == null ? '—' : r.dims[d])+'</td>').join('')+
    meas.map(m => { const c = r.meas[m]; const I = IND(m);
      return '<td class="num">'+(c == null ? '—' : I.money ? esc(money(c.v, c.cur)) : esc(num(c.v, I.unit)))+'</td>'; }).join('')+
    '</tr>').join('');
  const list = ST.registryList(st.q.obj, res.passport.asOf, st.q.filter)
    .filter(id => !refs || refs.indexOf(id) >= 0);
  const same = list.join('|') === res.rows.map(r => r.ref).sort().join('|');
  const rate = res.rows.map(r => Object.values(r.meas).find(c => c && c.rateDate)).filter(Boolean)[0];
  return (title ? '' : passportHtml(res.passport))+
    '<div class="card"><h3>'+esc(title || 'Строки среза')+' <span class="small">— '+res.rows.length+' шт.</span>'+
    (title ? ' <button class="btn btn-secondary btn-sm" onclick="ST.clearDrill()">закрыть детализацию</button>' : '')+'</h3>'+
    '<table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="12" class="muted">строк нет</td></tr>')+'</tbody></table>'+
    '<p class="note">'+(same
      ? '<b>Сходится с реестром «'+esc(o.owner)+'» один в один</b> ('+list.length+' из '+list.length+') — ИС-14.'
      : '<b class="pill err">расхождение с реестром</b> — это дефект, а не особенность (ИС-14).')+
    ' Значения разрезов взяты <b>из строки</b>, а не пересчитаны на сегодня (ИС-4).'+
    (rate ? ' Суммы — в валюте договора, курс на '+fmt(rate.rateDate)+' (ИС-16).' : '')+
    ' Карточек, документов и связей шов не отдаёт — это реестр владельца.</p></div>';
}

function flowBlock(){
  const st = ST.state, o = OBJ(st.q.obj);
  const flows = o.meas.filter(m => IND(m).flow);
  if(!flows.length) return '<div class="card"><h3>Поток за период</h3>'+
    '<p class="note">У объекта «'+esc(o.name)+'» нарастающих показателей нет: считать разность нечего.</p></div>';
  const meas = flows.indexOf(st.flow.meas) >= 0 ? st.flow.meas : flows[0];
  const res = ST.flowBetween({obj: st.q.obj, meas, from: st.flow.from, to: st.flow.to, filter: st.q.filter});
  const opts = (sel, k) => DATES.map(d => '<option value="'+d+'"'+(d === sel ? ' selected' : '')+'>'+fmt(d)+'</option>').join('');
  return '<div class="card"><h3>Поток за произвольный период <span class="small">— разность двух строк (ИС-17)</span></h3>'+
    '<div class="form-row">'+
    '<div class="fld"><label>Показатель</label><select onchange="ST.setFlow(\'meas\', this.value)">'+
      flows.map(m => '<option value="'+m+'"'+(m === meas ? ' selected' : '')+'>'+esc(IND(m).name)+'</option>').join('')+
    '</select></div>'+
    '<div class="fld"><label>С даты</label><select onchange="ST.setFlow(\'from\', this.value)">'+
      '<option value="2026-05-12"'+(st.flow.from === '2026-05-12' ? ' selected' : '')+'>12.05.2026</option>'+
      '<option value="2026-07-15"'+(st.flow.from === '2026-07-15' ? ' selected' : '')+'>15.07.2026</option>'+
      opts(st.flow.from)+'</select></div>'+
    '<div class="fld"><label>По дату</label><select onchange="ST.setFlow(\'to\', this.value)">'+opts(st.flow.to)+'</select></div>'+
    '</div>'+
    (res.ok
      ? passportHtml(res.passport)+'<div class="kv"><div class="k">'+esc(IND(meas).name)+' за период</div>'+
        '<div class="v"><b>'+esc(money(res.value,'KGS'))+'</b>'+
        (res.born.length ? ' <span class="muted">· объектов, родившихся внутри периода: '+res.born.length+
          ' (их база — ноль)</span>' : '')+'</div></div>'+
        '<p class="note">Произвольный интервал стоит ровно столько же, сколько стандартный месяц: '+
        'обе даты — просто две строки. Хранение по периодам не ответило бы на «за 12–27 мая» вовсе.</p>'
      : '<div class="banner danger">'+esc(res.why)+'</div>')+
    '</div>';
}

function tilesBlock(){
  const st = ST.state;
  const tiles = [
    {module:'кредиты', title:'Карточка кредита · портфель подразделения',
     q:{obj:'obj-credit', dims:['d-branch'], meas:['a-count','a-sumdebt'], date: st.q.date}},
    {module:'ведомство', title:'Свод ведомства · портфель по категориям',
     q:{obj:'obj-credit', dims:['d-category'], meas:['a-count','a-sumdebt'], date: st.q.date}},
    {module:'кураторство', title:'Карточка куратора · задания',
     q:{obj:'obj-task', dims:['d-tstate'], meas:['a-count','a-maxtover'], date: st.q.date}}
  ];
  const html = tiles.map((t, i) => {
    const r = ST.callSeam(t.module, 'statSlice', t.q);
    if(!r.ok) return '<div class="card"><h3>'+esc(t.title)+'</h3><div class="banner danger">'+esc(r.why)+'</div></div>';
    const lines = r.groups.map(g => '<div class="row"><span class="k">'+esc(g.parts[g.parts.length-1] || g.key || 'всего')+
      '</span>'+g.n+' · '+cellText(g.values[t.q.meas[1]])+'</div>').join('');
    /* Краткая форма паспорта — одна строка, и объявлена ПРОИЗВОДИТЕЛЕМ: сокращать
       по-своему потребитель не вправе, иначе три модуля сократят по-разному (ИС-24). */
    return '<div class="card"><h3>'+esc(t.title)+' <span class="small">— модуль «'+esc(t.module)+'»</span></h3>'+
      '<div class="pass '+(r.passport.substituted ? 'warn' : '')+'">'+lines+
      '<div class="row muted" style="margin-top:6px">'+esc(r.passport.short)+
      ' <button class="btn btn-secondary btn-sm" onclick="ST.showPass('+i+')">'+
      (st.tilePass === i ? 'свернуть паспорт' : 'полный паспорт')+'</button></div></div>'+
      (st.tilePass === i ? passportHtml(r.passport) : '')+'</div>';
  }).join('');
  const refused = ST.callSeam('классификация', 'statSlice', {obj:'obj-credit', dims:[], meas:['a-count'], date: st.q.date});
  return '<h2 class="section-h">Зеркальные плитки у соседей</h2>'+
    '<p class="page-lead">Плитка берёт <code>statSlice</code> и печатает паспорт рядом с числом. '+
    'Плиток «число без даты» в системе не остаётся (ИС-10). Форм паспорта <b>ровно две</b>, и обе '+
    'объявила статистика: краткая — строкой под числом, полная — действием. Третьей, придуманной '+
    'потребителем, не существует (ИС-24, врезка ADR-0152 §2).</p>'+html+
    '<div class="card"><h3>Классификация просит срез</h3>'+
    '<div class="banner danger">'+esc(refused.why)+'</div>'+
    '<p class="note">Кольцо ТЗ разрезано различением, а не порядком запуска: «статистический показатель» '+
    'в предикате классификатора — свёртка по самому объекту (это расчёт), а не срез по множеству чужих '+
    '(ИС-5, ADR-0146 §2).</p></div>';
}

function viewBuild(){
  const st = ST.state;
  if(!ST.canBuild()) return '<div class="banner warn"><b>Наблюдателю конструктор не открыт.</b> '+
    'Отказ по праву доступа говорит текстом, а не пропадающей кнопкой: наблюдателю доступны готовые '+
    'срезы и плитки (роли — §13 канона).</div>'+tilesBlock();
  let out = '<h2 class="section-h">Вопрос к статистике</h2>'+
    '<p class="page-lead">Объект → разрезы → меры → дата. Три вопроса — три шва: '+
    '<code>statSlice</code> (сколько и на сколько) · <code>statSeries</code> (как менялось) · '+
    '<code>statRows</code> (кто именно в числе). Четвёртого нет: «дай всё» — не вопрос.</p>'+pickBar();
  if(st.q.mode === 'series') return out + seriesBlock() + workBlock() + flowBlock() + tilesBlock();
  if(st.q.mode === 'rows')   return out + rowsBlock(null, null) + workBlock() + flowBlock() + tilesBlock();
  const res = ST.statSlice(st.q);
  if(!res.ok) return out + '<div class="banner danger">'+esc(res.why)+'</div>';
  out += passportHtml(res.passport)+'<div class="card"><h3>Срез</h3>'+sliceTable(res)+'</div>';
  if(st.drill){
    const g = ST.findNode(res.groups, st.drill) ||
      ST.findNode(res.groups, res.groups.map(x => x.key).find(k => k.replace(/'/g,'') === st.drill));
    if(g) out += rowsBlock(g.refs, 'Кто именно в числе '+g.n+': '+g.key);
  }
  return out + workBlock() + flowBlock() + tilesBlock();
}
