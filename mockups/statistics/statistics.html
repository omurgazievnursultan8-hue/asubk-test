ST.render = render;

function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast'+(kind ? ' '+kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 5200);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(okMsg, 'ok'); }
  else toast((res && res.why) || 'отказано', 'err');
  render();
}

/* ------------------------- ПАСПОРТ ОТВЕТА --------------------------- */
function passportHtml(p){
  const cls = p.divergence || p.substituted || p.partial ? 'warn'
            : p.fixation === 'зафиксировано' ? 'fixed' : '';
  const rows = [];
  rows.push('<div class="row"><span class="k">Дата расчёта</span><b>'+fmt(p.asOf)+'</b> · '+
    esc(ageWord(p.age))+(p.substituted ? ' <span class="pill warn">спрошено '+fmt(p.requested)+
    ' — строк на эту дату нет</span>' : '')+'</div>');
  rows.push('<div class="row"><span class="k">Фиксация</span>'+
    (p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
     p.fixation === 'смешанно' ? '<span class="pill warn">смешанно</span>' :
     '<span class="pill neutral">не зафиксировано</span>')+
    (p.fixedBy ? ' <span class="muted">'+esc(p.fixedBy)+', '+fmt(p.fixedAt)+'</span>' : '')+
    (p.range ? ' <span class="muted">ряд '+esc(p.range)+'</span>' : '')+'</div>');
  /* Состояние ответа — ОТДЕЛЬНАЯ строка, а не подпись к фиксации: «зафиксировано» говорит о
     ПЕРИОДЕ, «запись фиксации, окончательно» — о том, откуда взялось это число. Слепи их — и
     читатель решит, что закрытый период всё ещё пересчитывают (ИС-46, ADR-0216 §1). */
  rows.push('<div class="row"><span class="k">Состояние ответа</span>'+esc(p.mode || '—')+'</div>');
  /* Датировка величин печатается ВСЕГДА, а не сноской при «текущем» (ADR-0205 §4): «все на
     дату» — тоже ответ, а молчание вместо него читается как «не спрашивали». */
  if(p.dating) rows.push('<div class="row"><span class="k">Датировка величин</span>'+
    (p.dating.now.length ? '<span class="pill warn">текущее '+p.dating.now.length+'</span> ' : '')+
    '<span class="muted">'+esc(p.dating.text)+'</span></div>');
  rows.push('<div class="row"><span class="k">Область видимости</span>'+esc(p.scope)+'</div>');
  rows.push('<div class="row"><span class="k">Фильтр</span><span class="muted">'+esc(p.filter)+'</span></div>');
  if(p.composition) rows.push('<div class="row"><span class="k">Состав</span><span class="muted">'+esc(p.composition)+'</span></div>');
  if(p.baseNote) rows.push('<div class="row"><span class="k">База периода</span>'+esc(p.baseNote)+'</div>');
  /* Третий ответ печатается БЕЗ тревожного класса: «не менялось» — норма, а не деградация
     (ИС-45, ADR-0215 §2). Деградацию несёт соседняя строка «Почему не на дату». */
  if(p.density) rows.push('<div class="row"><span class="k">Плотность</span><span class="muted">'+esc(p.density)+'</span></div>');
  /* Неполнота — СТРОКА ПАСПОРТА, а не плашка над таблицей: паспорт уезжает вместе с
     ответом к потребителю, а плашка остаётся на нашем экране (ИС-10, ADR-0208 §6).
     И красится тревогой, в отличие от «не менялось»: там норма, здесь недостача. */
  if(p.partial) rows.push('<div class="row"><span class="k">Полнота</span>'+
    '<span class="pill warn">неполно</span> <span class="muted">'+esc(p.partial.text)+'</span></div>');
  if(p.skipped) rows.push('<div class="row"><span class="k">Почему не на дату</span><span class="muted">'+esc(p.skipped)+'</span></div>');
  if(p.divergence) rows.push('<div class="row"><span class="k">Расхождение</span>'+esc(p.divergence)+'</div>');
  (p.dedup || []).forEach(d => rows.push('<div class="row"><span class="k">Дедуп-ключ</span>'+esc(d.text)+'</div>'));
  return '<div class="pass '+cls+'">'+rows.join('')+'</div>';
}

/* ==================== ЭКРАН 1: КОНСТРУКТОР СРЕЗА ==================== */
ST.pickObj = id => { const st = ST.state; const o = OBJ(id);
  st.q.obj = id; st.q.dims = []; st.q.levels = {}; st.q.buckets = {};
  st.q.inds = o.inds.filter(m => IND(m).src === 'агрегат').slice(0,2);
  st.q.filter = null; st.drill = null; st.work = null; addDimToQ(o.dims[0]);
  /* У каждого объекта свой журнал прогонов: дата, которой у нового объекта нет,
     молча не переносится — вопрос встаёт на его последний прогон (ИС-36). */
  const ds = ST.askDates(id);
  if(ds.length && ds.indexOf(st.q.date) < 0) st.q.date = ds[ds.length - 1];
  render(); };
/* Корзина у разреза-даты не «по умолчанию любая»: вопрос без корзины не задаётся вовсе,
   поэтому при выборе разреза корзина берётся первой из объявленных (ИС-23). */
function addDimToQ(id){
  const st = ST.state, D = DIM(id);
  if(!D || st.q.dims.indexOf(id) >= 0) return;
  st.q.dims.push(id);
  if(D.buckets && !st.q.buckets[id]) st.q.buckets[id] = D.buckets[0];
}
ST.toggleDim = id => { const st = ST.state, a = st.q.dims, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else addDimToQ(id);
  st.drill = null; st.work = null; render(); };
ST.setLevel = (dimId, n) => { ST.state.q.levels[dimId] = n; ST.state.drill = null; render(); };
/* Фильтр задаётся ЯВНО, а не только кликом по числу (СС-Д2): значения берутся из строк
   на дату среза — списком чужих справочников фильтр не наполняется (ИС-4). Значения
   МЕРЫ берутся оттуда же: у фильтра один источник на оба вида операнда (ADR-0180 §5). */
ST.operandValues = (kind, id, bucket) => {
  const st = ST.state;
  const o = operandOf({kind, id, bucket});
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  if(!res || !o) return [];
  const bk = o.vtype === 'корзина' ? (bucket || o.dim.buckets[0]) : null;
  const set = new Set();
  applyScope(rowsAsOf(st, st.q.obj, res.asOf), st.q.obj).forEach(r => {
    if(o.kind === 'dim'){
      const v = r.dims[id];
      if(v == null) return;
      /* У иерархии в список идут ВСЕ уровни пути: «Юг» и «Юг / Ош» — разные вопросы. */
      if(Array.isArray(v)){ for(let i = 1; i <= v.length; i++) set.add(v.slice(0,i).join(' / ')); }
      else if(o.vtype === 'корзина'){ const k = bucketOf(v, bk, o.dim); if(k != null) set.add(k); }
      else set.add(String(v));
    } else {
      const c = r.inds[id];
      if(!c || c.v == null) return;
      set.add(o.vtype === 'булево' ? (c.v ? 'да' : 'нет') : String(c.v));
    }
  });
  const arr = [...set];
  /* Корзины сортируются ПОРЯДКОМ КОРЗИНЫ, а не алфавитом: «апрель» перед «маем». */
  if(o.vtype === 'корзина')
    return arr.sort((a,b) => String(bucketOrd(o.dim,a,bk)).localeCompare(String(bucketOrd(o.dim,b,bk))));
  if(o.vtype === 'число') return arr.sort((a,b) => Number(a) - Number(b));
  return arr.sort((a,b) => String(a).localeCompare(String(b),'ru'));
};
ST.filterValues = dimId => ST.operandValues('dim', dimId, (ST.state.q.buckets || {})[dimId]);
/* Черновик сравнения живёт в состоянии, а не в DOM: перерисовка не имеет права терять
   наполовину набранное сравнение — иначе набор из трёх сравнений не соберётся. */
function fDraft(){
  const st = ST.state;
  if(!st.fEdit) st.fEdit = {kind:'dim', id:'', op:'=', bucket:'', value:'', values:[],
    from:'', to:'', cur:'KGS', set:'new'};
  return st.fEdit;
}
ST.filterOperands = () => {
  const st = ST.state, o = OBJ(st.q.obj);
  if(!o) return {dims:[], inds:[]};
  return {
    dims: o.dims.filter(id => DIM(id) && DIM(id).since <= st.q.date)
               .map(id => ({kind:'dim', id, name: DIM(id).name})),
    /* Операнд — мера СТРОКИ: агрегат в фильтр не попадает даже списком (ADR-0180 §3). */
    inds: o.inds.filter(id => IND(id) && IND(id).src !== 'агрегат')
               .map(id => ({kind:'ind', id, name: IND(id).name}))
  };
};
ST.pickOperand = () => {
  const d = fDraft(), sel = String((($('#fOperand') || {}).value || '')).split(':');
  d.kind = sel[0] || 'dim'; d.id = sel[1] || '';
  d.op = (ST.filterOps(d) || [])[0] || '=';
  d.bucket = ''; d.value = ''; d.values = []; d.from = ''; d.to = '';
  render();
};
ST.pickFilterOp     = () => { fDraft().op = (($('#fOp') || {}).value) || '='; render(); };
ST.pickFilterBucket = () => { fDraft().bucket = (($('#fBucket') || {}).value) || ''; render(); };
ST.pickFilterSet    = () => { fDraft().set = (($('#fSet') || {}).value) || 'new'; };
/* Сравнение добавляется в НАБОР (И) либо новым набором (ИЛИ) — двух этих действий
   довольно, чтобы собрать любую ДНФ, и третьего в форме без скобок не бывает. */
ST.addCmp = () => {
  const st = ST.state, d = fDraft();
  const sel = String((($('#fOperand') || {}).value || d.kind+':'+d.id)).split(':');
  const c = {kind: sel[0] || 'dim', id: sel[1] || '', op: (($('#fOp') || {}).value) || d.op};
  const o = operandOf(c);
  if(!o) return toast('сравнение называет разрез или меру строки', 'err');
  if(o.vtype === 'корзина') c.bucket = (($('#fBucket') || {}).value) || o.dim.buckets[0];
  if(c.op === 'в диапазоне'){
    c.from = (($('#fFrom') || {}).value) || '';
    c.to   = (($('#fTo')   || {}).value) || '';
  } else if(LIST_OPS.indexOf(c.op) >= 0){
    const el = $('#fVals');
    c.values = el ? [].slice.call(el.selectedOptions).map(x => x.value) : [];
  } else if(o.vtype === 'число'){
    c.value = (($('#fNum') || {}).value) || '';
    if(o.money) c.cur = (($('#fCur') || {}).value) || 'KGS';
  } else c.value = (($('#fVal') || {}).value) || '';
  const target = (($('#fSet') || {}).value) || d.set || 'new';
  const sets = (st.q.filter && st.q.filter.sets) ? clone(st.q.filter.sets) : [];
  if(target === 'new' || !sets[Number(target)]) sets.push({cmps:[c]});
  else sets[Number(target)].cmps.push(c);
  const trial = {sets};
  /* Отказ показывается ДО применения и текстом: «пусто» вместо ответа — не отказ. */
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  const bad = ST.filterCheck(trial, st.q.obj,
    res ? applyScope(rowsAsOf(st, st.q.obj, res.asOf), st.q.obj) : null);
  if(bad) return toast(bad, 'err');
  st.q.filter = trial;
  d.set = String(target === 'new' ? sets.length - 1 : Number(target));
  st.drill = null; st.work = null; render();
};
ST.dropCmp = (i, j) => {
  const st = ST.state, f = st.q.filter;
  if(!f || !f.sets || !f.sets[i]) return;
  f.sets[i].cmps.splice(j, 1);
  if(!f.sets[i].cmps.length) f.sets.splice(i, 1);
  if(!f.sets.length) st.q.filter = null;
  fDraft().set = 'new';
  st.drill = null; st.work = null; render();
};
ST.clearFilter = () => { const st = ST.state;
  st.q.filter = null; fDraft().set = 'new'; st.drill = null; st.work = null; render(); };
ST.setBucket = (dimId, b) => { ST.state.q.buckets[dimId] = b; ST.state.drill = null; render(); };
ST.exportUI = () => { const st = ST.state;
  act(ST.exportJob({obj: st.q.obj, date: st.q.date, filter: st.q.filter}),
    'выгрузка оформлена — очередь на экране «Выгрузки»'); };
ST.workUI = () => { const st = ST.state; st.work = ST.workList(st.q.obj, st.q.date); render(); };
ST.closeWork = () => { ST.state.work = null; render(); };
ST.showPass = i => { ST.state.tilePass = ST.state.tilePass === i ? null : i; render(); };
ST.toggleInd = id => { const a = ST.state.q.inds, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else a.push(id); ST.state.drill = null; render(); };
ST.setMode = m => { ST.state.q.mode = m; ST.state.drill = null; render(); };
ST.drillTo = key => { ST.state.drill = key; render(); };
ST.clearDrill = () => { ST.state.drill = null; render(); };
ST.setFlow = (k, v) => { ST.state.flow[k] = v; render(); };

function chip(on, label, onclick, off){
  return '<button class="chip'+(on ? ' on' : '')+(off ? ' off' : '')+'"'+
    (off ? ' disabled' : ' onclick="'+onclick+'"')+'>'+esc(label)+'</button>';
}
/* Редактор наборов. Фильтр — сужение ВОПРОСА, и он виден строкой целиком, а не следом
   клика: сравнения набора стоят рядом через «и», наборы разделены словом «либо». Скобок
   в форме нет, поэтому и рисовать нечего — глубина ровно две (ADR-0180 §1). */
function filterBar(st){
  const d = fDraft(), ops = ST.filterOperands(), all = ops.dims.concat(ops.inds);
  if(!all.length) return '';
  const cur = all.find(x => x.kind === d.kind && x.id === d.id) || all[0];
  d.kind = cur.kind; d.id = cur.id;
  const o = operandOf(d);
  const opList = FOPS[o.vtype] || [];
  if(opList.indexOf(d.op) < 0) d.op = opList[0];
  const bk = o.vtype === 'корзина' ? (d.bucket || o.dim.buckets[0]) : null;
  if(bk) d.bucket = bk;
  const vals = (o.vtype === 'корзина' || o.vtype === 'перечисление' || o.vtype === 'булево')
    ? ST.operandValues(o.kind, o.id, bk) : [];
  const opt = (v, on) => '<option'+(on ? ' selected' : '')+'>'+esc(v)+'</option>';
  const grp = (label, list) => list.length ? '<optgroup label="'+esc(label)+'">'+
    list.map(x => '<option value="'+x.kind+':'+x.id+'"'+
      (x.kind === cur.kind && x.id === cur.id ? ' selected' : '')+'>'+esc(x.name)+'</option>').join('')+
    '</optgroup>' : '';
  const none = '<option value="">— значений на дату среза нет —</option>';
  let vBox;
  if(d.op === 'в диапазоне')
    vBox = '<div class="fld"><label>От корзины</label><select id="fFrom">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>'+
      '<div class="fld"><label>До корзины</label><select id="fTo">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  else if(LIST_OPS.indexOf(d.op) >= 0)
    vBox = '<div class="fld"><label>Значения (несколько)</label>'+
      '<select id="fVals" multiple size="4" style="height:auto">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  else if(o.vtype === 'число')
    vBox = '<div class="fld"><label>Константа'+(o.ind && o.ind.unit ? ', '+esc(o.ind.unit) : '')+
        '</label><input id="fNum" type="number" step="any" value="'+esc(d.value || '')+'"></div>'+
      /* Денежная константа НЕСЁТ ВАЛЮТУ: суммы сравниваются по валютам, и «> 1 000 000»
         без валюты — не константа, а половина константы (ADR-0184 §3). */
      (o.money ? '<div class="fld"><label>Валюта</label><select id="fCur">'+
        Object.keys(RATES).map(c => opt(c, c === (d.cur || 'KGS'))).join('')+'</select></div>' : '');
  else
    vBox = '<div class="fld"><label>Значение</label><select id="fVal">'+
      (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  const sets = (st.q.filter && st.q.filter.sets) || [];
  const setOpts = sets.map((x,i) => '<option value="'+i+'"'+(String(i) === String(d.set) ? ' selected' : '')+
      '>в набор '+(i+1)+' (И)</option>').join('')+
    '<option value="new"'+(d.set === 'new' || !sets.length ? ' selected' : '')+'>новым набором (ИЛИ)</option>';
  const shown = sets.length ? '<div><h4>Фильтр — '+sets.length+' '+
      plural(sets.length,'набор','набора','наборов')+', сравнений '+
      sets.reduce((n,x) => n + x.cmps.length, 0)+'</h4><div class="chips">'+
      sets.map((x,i) => '<span class="chips-grp">'+(i ? 'либо ' : '')+'набор '+(i+1)+'</span>'+
        x.cmps.map((c,j) => chip(true, cmpText(c)+'   ✕', 'ST.dropCmp('+i+','+j+')')).join('')).join('')+
      '</div></div>' : '';
  return shown+'<div class="form-row" style="margin-top:12px">'+
    '<div class="fld"><label>Операнд</label><select id="fOperand" onchange="ST.pickOperand()">'+
      grp('Разрезы', ops.dims)+grp('Меры строки', ops.inds)+'</select></div>'+
    '<div class="fld"><label>Оператор</label><select id="fOp" onchange="ST.pickFilterOp()">'+
      opList.map(x => opt(x, x === d.op)).join('')+'</select></div>'+
    (bk ? '<div class="fld"><label>Корзина</label><select id="fBucket" onchange="ST.pickFilterBucket()">'+
      o.dim.buckets.map(x => opt(x, x === bk)).join('')+'</select></div>' : '')+
    vBox+
    '<div class="fld"><label>Куда</label><select id="fSet" onchange="ST.pickFilterSet()">'+setOpts+'</select></div>'+
    '<button class="btn btn-secondary" onclick="ST.addCmp()">Добавить сравнение</button>'+
    (sets.length ? '<button class="btn btn-secondary" onclick="ST.clearFilter()">Снять фильтр</button>' : '')+
    '</div>';
}
function pickBar(){
  const st = ST.state, o = OBJ(st.q.obj);
  const objs = st.objects.map(x => chip(x.id === st.q.obj, x.name, "ST.pickObj('"+x.id+"')")).join('');
  const dims = o.dims.map(d => chip(st.q.dims.indexOf(d) >= 0, DIM(d).name, "ST.toggleDim('"+d+"')",
    DIM(d).since > st.q.date)).join('');
  /* 33 агрегата кредита плоской лентой нечитаемы. Блок берётся из поля grp записи —
     ни одного названия блока в разметке нет: заведут показатель с новым grp, и блок
     появится сам (ИС-18 держит сборщик строк, здесь тот же приём для экрана). */
  const aggChip = m => chip(st.q.inds.indexOf(m) >= 0, IND(m).name, "ST.toggleInd('"+m+"')");
  const aggs = o.inds.filter(m => IND(m).src === 'агрегат');
  const blocks = [];
  aggs.forEach(m => { const g = IND(m).grp || '';
    const b = blocks.find(x => x.g === g) || (blocks.push({g, ms: []}), blocks[blocks.length - 1]);
    b.ms.push(m); });
  const inds = blocks.length > 2
    ? blocks.map(b => (b.g ? '<span class="chips-grp">'+esc(b.g)+'</span>' : '')+
        b.ms.map(aggChip).join('')).join('')
    : aggs.map(aggChip).join('');
  const modes = [['slice','Срез — сколько и на сколько'],['series','Ряд — как менялось'],['rows','Строки — кто именно']]
    .map(([k,n]) => chip(st.q.mode === k, n, "ST.setMode('"+k+"')")).join('');
  /* Уровень и корзина — не «настройки отображения», а часть вопроса: они меняют то,
     что спрошено, и потому стоят рядом с разрезом (ADR-0176 §2, §4). */
  const hierD = st.q.dims.map(DIM).filter(d => d && d.levels);
  const bktD  = st.q.dims.map(DIM).filter(d => d && d.buckets);
  const lvlBar = hierD.map(d => '<div><h4>Уровень: '+esc(d.name)+'</h4><div class="chips">'+
    d.levels.map((L,i) => chip((st.q.levels[d.id] || d.levels.length) === i+1, L.name,
      "ST.setLevel('"+d.id+"',"+(i+1)+")")).join('')+'</div></div>').join('');
  const bktBar = bktD.map(d => '<div><h4>Корзина: '+esc(d.name)+'</h4><div class="chips">'+
    d.buckets.map(b => chip(st.q.buckets[d.id] === b, b, "ST.setBucket('"+d.id+"','"+b+"')")).join('')+
    '</div></div>').join('');
  const fBar = ST.canBuild() ? filterBar(st) : '';
  return '<div class="card"><div class="pickbar">'+
    '<div><h4>Объект статистики</h4><div class="chips">'+objs+'</div></div>'+
    '<div><h4>Разрезы</h4><div class="chips">'+dims+'</div></div>'+lvlBar+bktBar+
    '<div><h4>Показатели (агрегаты закрытого списка)</h4><div class="chips">'+inds+'</div></div>'+
    '<div><h4>Вопрос</h4><div class="chips">'+modes+'</div></div>'+
    '</div>'+fBar+'<p class="note">Объект, разрезы и показатели — записи реестров: сборщик строк не знает ни одного '+
    'из этих слов (ИС-18). Показатели среза — только агрегаты закрытого списка '+esc(ST.aggFns().join(' · '))+
    '(ADR-0150 §2); строчный показатель спрашивается швом <code>statRows</code>. '+
    'Разрез с уровнями спрашивается уровнем, разрез-дата — корзиной из объявленного списка: '+
    'свободной корзины («по неделям») в запросе не бывает — это заявка владельцу реестра '+
    '(ИС-22, ИС-23, ADR-0176). Фильтр — часть вопроса, а не след клика: он собирается '+
    'наборами (ДНФ без скобок, ADR-0180), сравнения внутри набора связаны «и», наборы между '+
    'собой — «либо»; операнд — разрез или мера СТРОКИ, правая часть всегда константа, а '+
    'значения берутся из строк на дату среза. В паспорте фильтр печатается целиком, всеми '+
    'наборами и сравнениями: «фильтр задан» — это ответ без вопроса.</p></div>';
}

function sliceTable(res){
  const dims = res.dims, cols = res.inds.filter(m => m !== 'a-count');
  const cell = (g) => '<td class="num"><button onclick="ST.drillTo(\''+esc(g.key).replace(/'/g,"")+'\')">'+
    g.n+'</button></td>'+cols.map(m => '<td class="num">'+cellText(g.values[m])+'</td>').join('');
  let head, body, span;
  if(res.hier){
    /* Дерево: узел печатает СВОИ числа, а не сумму детей, и колонка «своих» показывает
       тех, у кого нижнего уровня нет, — они остаются у родителя (ADR-0176 §5). */
    /* Колонка «своих» появляется только там, где ниже есть уровень: на нижнем уровне
       своих и всего — одно и то же число, и колонка из одних прочерков лишь шумит. */
    const deep = res.hier.depth > 1;
    const line = g => '<tr'+(g.level > 1 ? ' class="lvl"' : '')+'>'+
      '<td style="padding-left:'+(10 + (g.level - 1) * 26)+'px">'+
        (g.level > 1 ? '<span class="muted">└ </span>' : '')+
        esc(g.parts[g.parts.length - 1] || g.key)+'</td>'+
      (deep ? '<td class="num">'+(g.level < res.hier.depth ? g.own : '—')+'</td>' : '')+
      cell(g)+'</tr>'+(g.children || []).map(line).join('');
    head = '<th>'+esc(res.hier.levels.slice(0, res.hier.depth).join(' → '))+'</th>'+
      (deep ? '<th>Своих</th>' : '')+'<th>Объектов</th>'+
      cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(line).join('');
    span = deep ? 2 : 1;
  } else {
    head = (dims.length ? dims.map(d => '<th>'+esc(DIM(d).name)+
        (res.buckets && res.buckets[d] ? ' <span class="small">('+esc(res.buckets[d])+')</span>' : '')+
        '</th>').join('') : '<th>Множество</th>')+
      '<th>Объектов</th>'+cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(g => '<tr>'+
      (dims.length ? dims.map((d,i) => '<td>'+esc(g.parts[i])+'</td>').join('') : '<td>всего</td>')+
      cell(g)+'</tr>').join('');
    span = Math.max(1, dims.length);
  }
  const foot = '<tr><td'+(span > 1 ? ' colspan="'+span+'"' : '')+'>Итого</td>'+
    '<td class="num">'+res.n+'</td>'+
    cols.map(m => '<td class="num">'+cellText(res.total[m])+'</td>').join('')+'</tr>';
  return '<table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="9" class="muted">строк нет</td></tr>')+'</tbody><tfoot>'+foot+'</tfoot></table>'+
    '<p class="note">Число объектов — ссылка: детализация открывает те самые строки, из которых '+
    'собрано число (<code>statRows</code>, ИС-14). Хранимых агрегатов нет ни одного — всё в таблице '+
    'собрано группировкой строк при показе (ИС-3).'+
    (res.hier ? ' Родитель <b>считается по своим строкам</b>, а не складывается из детей: доля и '+
      'среднее неаддитивны, а объект без нижнего уровня при сложении исчез бы — он в колонке «своих» '+
      '(ИС-22, ADR-0176 §5).' : '')+'</p>';
}

function seriesBlock(){
  const st = ST.state;
  const m = st.q.inds.find(x => IND(x).fn !== 'count') || st.q.inds[0] || 'a-count';
  const dts = ST.seriesDates();
  const res = ST.statSeries({obj: st.q.obj, inds: m, dates: dts, filter: st.q.filter});
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  /* Столбик рисуется по СВОЕМУ числу точки. Прежде здесь подставлялся «сомовый эквивалент»
     клетки — то есть у валютного ряда рисовалась сомовая величина под валютным именем
     (ИС-40). Сомовый ряд теперь спрашивается своей записью реестра (ИС-44). */
  const vals = res.points.map(p => (p.value && p.value.v != null) ? p.value.v : 0);
  const top = Math.max.apply(null, vals.concat([1]));
  const bars = res.points.map((p,i) => '<div class="bar'+(p.fixation === 'зафиксировано' ? ' fixed' : '')+'">'+
    '<i style="height:'+Math.max(3, Math.round(vals[i]/top*96))+'px"></i>'+
    '<span>'+fmt(p.asOf || p.date).slice(0,5)+'</span></div>').join('');
  /* «Действует с …» рядом с числом (ADR-0215, последствия) — у ряда это столбик «Объектов»:
     сколько из них написаны на эту дату, а сколько перенесены как неизменившиеся. Без
     этого падение плотности выглядело бы падением состава. */
  const rows = res.points.map(p => '<tr>'+
    '<td>'+fmt(p.date)+(p.substituted ? ' <span class="pill warn">строк нет, взято '+fmt(p.asOf)+'</span>' : '')+'</td>'+
    '<td>'+(p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
      '<span class="pill neutral">не зафиксировано</span>')+'</td>'+
    '<td class="num">'+p.n+(p.carried ? ' <span class="small">не менялось — '+
      p.carried+'</span>' : '')+'</td><td class="num">'+cellText(p.value)+'</td></tr>').join('');
  return passportHtml(res.passport)+
    '<div class="card"><h3>'+esc(IND(m).name)+' <span class="small">— ряд по '+dts.length+
      ' датам, шаг '+esc(st.q.series.step)+'</span></h3>'+
    '<div class="chips" style="margin-bottom:10px">'+
      ['месяц','квартал'].map(k => chip(st.q.series.step === k, 'шаг: '+k, "ST.setSeries('step','"+k+"')")).join('')+
      [4,6,8].map(k => chip(st.q.series.points === k, k+' '+plural(k,'точка','точки','точек'),
        "ST.setSeries('points',"+k+")")).join('')+
    '</div>'+
    '<div class="spark">'+bars+'</div>'+
    '<table class="cgrid"><thead><tr><th>Дата</th><th>Фиксация</th><th>Объектов</th><th>Значение</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    '<p class="note">Признак фиксации у ряда — <b>смешанно</b>, когда часть точек закрыта человеком, '+
    'а часть нет: ряд обязан это сказать, а не усреднить (ИС-10, ADR-0148 §4). Даты ряда — часть '+
    'вопроса: последняя точка всегда дата среза, остальные отсчитаны назад шагом. Точка, на которую '+
    'строк нет, не выбрасывается — берётся ближайшая предыдущая, и подмена помечена (ИС-12).</p></div>';
}

/* Отказ называет ЧИСЛО: «слишком много» без числа не даёт сузить вопрос (ADR-0178 §4).
   Рядом стоят обе законные дороги — сузить вопрос и взять выгрузкой. */
function refusalCard(res){
  const o = OBJ(res.obj);
  return '<div class="card"><h3>Список не отдаётся <span class="small">— в числе '+res.n+' строк</span></h3>'+
    '<div class="banner danger">'+esc(res.why)+'</div>'+passportHtml(res.passport)+
    '<div class="btn-row"><button class="btn btn-primary" onclick="ST.exportUI()">Оформить выгрузку — '+
      res.n+' строк</button>'+
    '<button class="btn btn-secondary" onclick="ST.workUI()">Работать со списком в реестре «'+
      esc(o.owner)+'»</button></div>'+
    '<p class="note">Порог — параметр эксплуатации, а не модели, и считается <b>после</b> ролевых правил: '+
    'иначе отказ выдавал бы размер чужого множества, а куратор с сорока строками получал бы отказ из-за '+
    'холдинга (ADR-0178 §2, §3). Сверка целиком идёт выгрузкой-заданием, и паспорт едет <b>внутри файла</b> '+
    '(ADR-0178 §5).</p></div>';
}
/* Второе действие числа названо отдельно от первого: реестр владельца на СЕГОДНЯ —
   законно другой список, чем строки среза от вчера (врезка ADR-0152 §4). */
function workBlock(){
  const w = ST.state.work;
  if(!w || !w.ok) return '';
  return '<div class="card"><h3>Реестр владельца на сегодня '+
    '<span class="small">— '+w.n+' шт.</span> <button class="btn btn-secondary btn-sm" '+
    'onclick="ST.closeWork()">закрыть</button></h3>'+
    '<div class="banner info">'+esc(w.note)+'</div>'+
    '<p class="mono small">'+w.list.map(esc).join(' · ')+'</p>'+
    '<p class="note">Это <b>не</b> детализация числа: детализация — <code>statRows</code> на дату среза, '+
    'а здесь список владельца на сегодня. Одно число, два разных действия, и подпись обязана назвать '+
    'разницу словами (ИС-14).</p></div>';
}
function rowsBlock(refs, title, q, closeFn){
  const st = ST.state;
  q = q || st.q; closeFn = closeFn || 'ST.clearDrill()';
  const res = ST.statRows({obj: q.obj, date: q.date, filter: q.filter, refs});
  if(!res.ok && res.overLimit) return refusalCard(res);
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  const o = OBJ(q.obj);
  const dims = o.dims.filter(d => DIM(d).since <= q.date);
  const inds = o.inds.filter(m => IND(m).src !== 'агрегат');
  const head = '<th>'+esc(o.refName)+'</th>'+dims.map(d => '<th>'+esc(DIM(d).name)+'</th>').join('')+
    inds.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
  /* «Действует с …» стоит В СТРОКЕ, а не в подписи под таблицей (ИС-45, ADR-0215,
     последствия): при разрежённом хранении соседние строки одного среза написаны на
     РАЗНЫЕ даты, и одна дата в шапке заверила бы их все возрастом самой свежей. */
  const body = res.rows.map(r => '<tr><td class="mono">'+esc(r.ref)+
    (r.date < res.passport.asOf ? ' <span class="small muted">действует с '+fmt(r.date)+'</span>' : '')+
    (r.by === 'защёлка' ? ' <span class="small muted">· слепок</span>' : '')+'</td>'+
    dims.map(d => '<td>'+(r.dims[d] == null ? (silentCell(r, d) || '—') : esc(dimText(r.dims[d])))+'</td>').join('')+
    inds.map(m => { const I = IND(m);
      const cls = (I.type === 'перечисление' || I.type === 'булево') ? '' : ' class="num"';
      return '<td'+cls+'>'+indCellText(r.inds[m], I, r)+'</td>'; }).join('')+
    '</tr>').join('');
  const list = ST.registryList(q.obj, res.passport.asOf, q.filter)
    .filter(id => !refs || refs.indexOf(id) >= 0);
  const same = list.join('|') === res.rows.map(r => r.ref).sort().join('|');
  const rate = res.rows.map(r => Object.values(r.inds).find(c => c && c.rateDate)).filter(Boolean)[0];
  return (title ? '' : passportHtml(res.passport))+
    '<div class="card"><h3>'+esc(title || 'Строки среза')+' <span class="small">— '+res.rows.length+' шт.</span>'+
    (title ? ' <button class="btn btn-secondary btn-sm" onclick="'+closeFn+'">закрыть детализацию</button>' : '')+'</h3>'+
    '<div class="tscroll"><table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="12" class="muted">строк нет</td></tr>')+'</tbody></table></div>'+
    '<p class="note">'+(same
      ? '<b>Сходится с реестром «'+esc(o.owner)+'» один в один</b> ('+list.length+' из '+list.length+') — ИС-14.'
      : '<b class="pill err">расхождение с реестром</b> — это дефект, а не особенность (ИС-14).')+
    ' Значения разрезов взяты <b>из строки</b>, а не пересчитаны на сегодня (ИС-4).'+
    (res.passport.density ? ' Строка пишется <b>при изменении</b>: «действует с» значит «с тех пор не менялось», а не «данные устарели» (ИС-45).' : '')+
    (rate ? ' Суммы — в валюте договора, курс на '+fmt(rate.rateDate)+' (ИС-16).' : '')+
    ' Карточек, документов и связей шов не отдаёт — это реестр владельца.</p></div>';
}

function flowBlock(){
  const st = ST.state, o = OBJ(st.q.obj);
  const flows = o.inds.filter(m => IND(m).flow);
  if(!flows.length) return '<div class="card"><h3>Поток за период</h3>'+
    '<p class="note">У объекта «'+esc(o.name)+'» нарастающих показателей нет: считать разность нечего.</p></div>';
  const inds = flows.indexOf(st.flow.inds) >= 0 ? st.flow.inds : flows[0];
  const res = ST.flowBetween({obj: st.q.obj, inds, from: st.flow.from, to: st.flow.to, filter: st.q.filter});
  /* Конец периода — дата прогона (ИС-36); начало — любая историческая дата, и если строки
     на неё нет, база НАЗЫВАЕТСЯ подстановкой в паспорте (ИС-12, ADR-0151 §2). Поэтому у
     «с даты» в списке есть даты вне журнала, а у «по дату» их нет и быть не может. */
  const opts = (sel, k) => ST.askDates(st.q.obj).map(d => '<option value="'+d+'"'+(d === sel ? ' selected' : '')+'>'+fmt(d)+'</option>').join('');
  return '<div class="card"><h3>Поток за произвольный период <span class="small">— разность двух строк (ИС-17)</span></h3>'+
    '<div class="form-row">'+
    '<div class="fld"><label>Показатель</label><select onchange="ST.setFlow(\'inds\', this.value)">'+
      flows.map(m => '<option value="'+m+'"'+(m === inds ? ' selected' : '')+'>'+esc(IND(m).name)+'</option>').join('')+
    '</select></div>'+
    '<div class="fld"><label>С даты</label><select onchange="ST.setFlow(\'from\', this.value)">'+
      '<option value="2026-05-12"'+(st.flow.from === '2026-05-12' ? ' selected' : '')+'>12.05.2026</option>'+
      '<option value="2026-07-15"'+(st.flow.from === '2026-07-15' ? ' selected' : '')+'>15.07.2026</option>'+
      opts(st.flow.from)+'</select></div>'+
    '<div class="fld"><label>По дату</label><select onchange="ST.setFlow(\'to\', this.value)">'+opts(st.flow.to)+'</select></div>'+
    '</div>'+
    (res.ok
      ? passportHtml(res.passport)+'<div class="kv"><div class="k">'+esc(IND(inds).name)+' за период</div>'+
        '<div class="v"><b>'+esc(money(res.value,'KGS'))+'</b>'+
        (res.born.length ? ' <span class="muted">· объектов, родившихся внутри периода: '+res.born.length+
          ' (их база — ноль)</span>' : '')+'</div></div>'+
        '<p class="note">Произвольный интервал стоит ровно столько же, сколько стандартный месяц: '+
        'обе даты — просто две строки. Хранение по периодам не ответило бы на «за 12–27 мая» вовсе.</p>'

/* ============= МАТРИЦА: КОЛОНКА ВОПРОСА (Q2/Q4/Q11/Q12/Q16-Q18/Q20) ============= */
/* Один разрез — не больше — стоит в колонках (Q4); остальные включённые разрезы —
   строки, со своим порядком и вложенностью (Q17). Ось разреза — раскладка, а не
   вопрос (Q12): смена оси не трогает mAsked и не зажигает предупреждение. */
function defaultMq(objId){
  const o = OBJ(objId);
  const dims = (o.dims || []).slice(0,2);
  const axis = {}; dims.forEach((d,i) => axis[d] = i === 0 ? 'rows' : 'cols');
  const levels = {}; dims.forEach(d => { const D = DIM(d); if(D && D.levels) levels[d] = D.levels.length; });
  const buckets = {}; dims.forEach(d => { const D = DIM(d); if(D && D.buckets) buckets[d] = D.buckets[0]; });
  return {obj:objId, dims, axis, levels, buckets,
    inds: o.inds.filter(m => IND(m).src === 'агрегат').slice(0,2),
    date:null, filter:null};
}
function mxClone(mq){ return JSON.parse(JSON.stringify(mq)); }
/* Подпись ВОПРОСА, не раскладки: ось, порядок и сортировка сюда не входят — это
   ровно то же самое различение, которого потребовал Q12. */
function mxSig(mq){
  const dimsPart = mq.dims.slice().sort().map(d => d+':'+(mq.levels[d]||'')+':'+(mq.buckets[d]||'')).join('|');
  return JSON.stringify({obj:mq.obj, date:mq.date, dims:dimsPart, inds:mq.inds.slice().sort(), filter:mq.filter});
}
ST.mxChanged = () => { const st = ST.state; return !st.mAsked || mxSig(st.mq) !== mxSig(st.mAsked); };
ST.mxAsk = () => { const st = ST.state; st.mAsked = mxClone(st.mq); st.drill = null; render(); };
ST.mxPickObj = id => { const st = ST.state; st.mq = defaultMq(id);
  const ds = ST.askDates(id); st.mq.date = ds.length ? ds[ds.length - 1] : null;
  st.mAsked = mxClone(st.mq); st.drill = null; render(); };
ST.mxSetDate = d => { ST.state.mq.date = d; render(); };
ST.mxToggleDim = id => { const st = ST.state, mq = st.mq, i = mq.dims.indexOf(id);
  if(i >= 0){ mq.dims.splice(i,1); delete mq.axis[id]; delete mq.levels[id]; delete mq.buckets[id]; }
  else { mq.dims.push(id); mq.axis[id] = 'rows';
    const D = DIM(id); if(D && D.levels) mq.levels[id] = D.levels.length;
    if(D && D.buckets) mq.buckets[id] = D.buckets[0]; }
  render(); };
ST.mxSetColDim = id => { const st = ST.state, mq = st.mq;
  Object.keys(mq.axis).forEach(d => { if(mq.axis[d] === 'cols') mq.axis[d] = 'rows'; });
  if(id){
    if(mq.dims.indexOf(id) < 0){
      mq.dims.push(id);
      const D = DIM(id);
      if(D && D.levels) mq.levels[id] = D.levels.length;
      if(D && D.buckets) mq.buckets[id] = D.buckets[0];
    }
    mq.axis[id] = 'cols';
  }
  render(); };
ST.mxMoveDim = (id, dir) => { const st = ST.state, a = st.mq.dims, i = a.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; render(); };
ST.mxSetLevel = (id, n) => { ST.state.mq.levels[id] = n; render(); };
ST.mxSetBucket = (id, b) => { ST.state.mq.buckets[id] = b; render(); };

/* filterBar/fDraft читают ST.state.q напрямую (не параметр) — переиспользовать их как
   есть значило бы редактировать чужой фильтр (старого экрана) из-под новой колонки.
   Тот же редактор, но привязанный к st.mq и своему черновику st.mFEdit. */
function mfDraft(){
  const st = ST.state;
  if(!st.mFEdit) st.mFEdit = {kind:'dim', id:'', op:'=', bucket:'', value:'', values:[],
    from:'', to:'', cur:'KGS', set:'new'};
  return st.mFEdit;
}
function mxFilterOperands(){
  const mq = ST.state.mq, o = OBJ(mq.obj);
  if(!o) return {dims:[], inds:[]};
  return {
    dims: o.dims.filter(id => DIM(id) && DIM(id).since <= mq.date).map(id => ({kind:'dim', id, name: DIM(id).name})),
    inds: o.inds.filter(id => IND(id) && IND(id).src !== 'агрегат').map(id => ({kind:'ind', id, name: IND(id).name}))
  };
}
ST.mxOperandValues = (kind, id, bucket) => {
  const st = ST.state, mq = st.mq;
  const o = operandOf({kind, id, bucket});
  const res = resolveAsOf(st, mq.obj, mq.date);
  if(!res || !o) return [];
  const bk = o.vtype === 'корзина' ? (bucket || o.dim.buckets[0]) : null;
  const set = new Set();
  applyScope(rowsAsOf(st, mq.obj, res.asOf), mq.obj).forEach(r => {
    if(o.kind === 'dim'){
      const v = r.dims[id];
      if(v == null) return;
      if(Array.isArray(v)){ for(let i = 1; i <= v.length; i++) set.add(v.slice(0,i).join(' / ')); }
      else if(o.vtype === 'корзина'){ const k = bucketOf(v, bk, o.dim); if(k != null) set.add(k); }
      else set.add(String(v));
    } else {
      const c = r.inds[id];
      if(!c || c.v == null) return;
      set.add(String(c.v));
    }
  });
  return Array.from(set).sort((a,b) => a.localeCompare(b,'ru',{numeric:true}));
};
ST.mxPickOperand = () => {
  const d = mfDraft(), sel = String((($('#mfOperand') || {}).value || '')).split(':');
  d.kind = sel[0] || 'dim'; d.id = sel[1] || '';
  d.op = (ST.filterOps(d) || [])[0] || '=';
  d.bucket = ''; d.value = ''; d.values = []; d.from = ''; d.to = ''; render();
};
ST.mxPickFilterOp     = () => { mfDraft().op = (($('#mfOp') || {}).value) || '='; render(); };
ST.mxPickFilterBucket = () => { mfDraft().bucket = (($('#mfBucket') || {}).value) || ''; render(); };
ST.mxPickFilterSet    = () => { mfDraft().set = (($('#mfSet') || {}).value) || 'new'; };
ST.mxAddCmp = () => {
  const st = ST.state, mq = st.mq, d = mfDraft();
  const sel = String((($('#mfOperand') || {}).value || d.kind+':'+d.id)).split(':');
  const c = {kind: sel[0] || 'dim', id: sel[1] || '', op: (($('#mfOp') || {}).value) || d.op};
  const o = operandOf(c);
  if(!o) return toast('сравнение называет разрез или меру строки', 'err');
  if(o.vtype === 'корзина') c.bucket = (($('#mfBucket') || {}).value) || o.dim.buckets[0];
  if(c.op === 'в диапазоне'){
    c.from = (($('#mfFrom') || {}).value) || ''; c.to = (($('#mfTo') || {}).value) || '';
  } else if(LIST_OPS.indexOf(c.op) >= 0){
    const el = $('#mfVals');
    c.values = el ? [].slice.call(el.querySelectorAll('input:checked')).map(x => x.value) : [];
  } else if(o.vtype === 'число'){
    c.value = (($('#mfNum') || {}).value) || '';
    if(o.money) c.cur = (($('#mfCur') || {}).value) || 'KGS';
  } else c.value = (($('#mfVal') || {}).value) || '';
  const target = (($('#mfSet') || {}).value) || d.set || 'new';
  const sets = (mq.filter && mq.filter.sets) ? clone(mq.filter.sets) : [];
  if(target === 'new' || !sets[Number(target)]) sets.push({cmps:[c]});
  else sets[Number(target)].cmps.push(c);
  const trial = {sets};
  const res = resolveAsOf(st, mq.obj, mq.date);
  const bad = ST.filterCheck(trial, mq.obj, res ? applyScope(rowsAsOf(st, mq.obj, res.asOf), mq.obj) : null);
  if(bad) return toast(bad, 'err');
  mq.filter = trial;
  d.set = String(target === 'new' ? sets.length - 1 : Number(target));
  render();
};
ST.mxDropCmp = (i, j) => {
  const st = ST.state, f = st.mq.filter;
  if(!f || !f.sets || !f.sets[i]) return;
  f.sets[i].cmps.splice(j, 1);
  if(!f.sets[i].cmps.length) f.sets.splice(i, 1);
  if(!f.sets.length) st.mq.filter = null;
  mfDraft().set = 'new'; render();
};
ST.mxClearFilter = () => { ST.state.mq.filter = null; mfDraft().set = 'new'; render(); };
function mxFilterBar(st){
  const mq = st.mq, d = mfDraft(), ops = mxFilterOperands(), all = ops.dims.concat(ops.inds);
  if(!all.length) return '<p class="muted">на этом объекте нет операндов фильтра</p>';
  const cur = all.find(x => x.kind === d.kind && x.id === d.id) || all[0];
  d.kind = cur.kind; d.id = cur.id;
  const o = operandOf(d);
  const opList = FOPS[o.vtype] || [];
  if(opList.indexOf(d.op) < 0) d.op = opList[0];
  const bk = o.vtype === 'корзина' ? (d.bucket || o.dim.buckets[0]) : null;
  if(bk) d.bucket = bk;
  const vals = (o.vtype === 'корзина' || o.vtype === 'перечисление' || o.vtype === 'булево')
    ? ST.mxOperandValues(o.kind, o.id, bk) : [];
  const opt = (v, on) => '<option'+(on ? ' selected' : '')+'>'+esc(v)+'</option>';
  const grp = (label, list) => list.length ? '<optgroup label="'+esc(label)+'">'+
    list.map(x => '<option value="'+x.kind+':'+x.id+'"'+
      (x.kind === cur.kind && x.id === cur.id ? ' selected' : '')+'>'+esc(x.name)+'</option>').join('')+
    '</optgroup>' : '';
  const none = '<option value="">— значений на дату среза нет —</option>';
  let vBox;
  if(d.op === 'в диапазоне')
    vBox = '<div class="fld"><label>От корзины</label><select id="mfFrom">'+(vals.map(v => opt(v,false)).join('') || none)+'</select></div>'+
      '<div class="fld"><label>До корзины</label><select id="mfTo">'+(vals.map(v => opt(v,false)).join('') || none)+'</select></div>';
  else if(LIST_OPS.indexOf(d.op) >= 0)

        : '<div class="muted">— значений на дату среза нет —</div>')+
      '</div>';
  else if(o.vtype === 'число')
    vBox = '<div class="fld"><label>Константа'+(o.ind && o.ind.unit ? ', '+esc(o.ind.unit) : '')+'</label>'+
      '<input id="mfNum" type="number" step="any" value="'+esc(d.value || '')+'"></div>'+
      (o.money ? '<div class="fld"><label>Валюта</label><select id="mfCur">'+
        Object.keys(RATES).map(c => opt(c, c === (d.cur || 'KGS'))).join('')+'</select></div>' : '');
  else
    vBox = '<div class="fld"><label>Значение</label><select id="mfVal">'+(vals.map(v => opt(v,false)).join('') || none)+'</select></div>';

  const setOpts = sets.map((x,i) => '<option value="'+i+'"'+(String(i) === String(d.set) ? ' selected' : '')+

  const shown = sets.length ? '<div><h4>Фильтр — '+sets.length+' '+

      sets.reduce((n,x) => n + x.cmps.length, 0)+'</h4><div class="chips">'+

        x.cmps.map((c,j) => chip(true, cmpText(c)+'   ✕', 'ST.mxDropCmp('+i+','+j+')')).join('')).join('')+
      '</div></div>' : '';
  return shown+'<div class="form-row" style="margin-top:12px">'+
    '<div class="fld"><label>Операнд</label><select id="mfOperand" onchange="ST.mxPickOperand()">'+
      grp('Разрезы', ops.dims)+grp('Меры строки', ops.inds)+'</select></div>'+
    '<div class="fld"><label>Оператор</label><select id="mfOp" onchange="ST.mxPickFilterOp()">'+
      opList.map(x => opt(x, x === d.op)).join('')+'</select></div>'+
    (bk ? '<div class="fld"><label>Корзина</label><select id="mfBucket" onchange="ST.mxPickFilterBucket()">'+
      o.dim.buckets.map(x => opt(x, x === bk)).join('')+'</select></div>' : '')+
    vBox+
    '<div class="fld"><label>Куда</label><select id="mfSet" onchange="ST.mxPickFilterSet()">'+setOpts+'</select></div>'+
    '<button class="btn btn-secondary" onclick="ST.mxAddCmp()">Добавить сравнение</button>'+
    (sets.length ? '<button class="btn btn-secondary" onclick="ST.mxClearFilter()">Снять фильтр</button>' : '')+
    '</div>';
}

/* ============= МАТРИЦА: ОТВЕТ (Q3/Q5/Q8-Q10/Q13/Q14/Q19/Q21/Q25) =============
   Грунт Q17 закрыт: НЕСКОЛЬКО строчных разрезов ОДНОВРЕМЕННО с колоночным разрезом
   теперь настоящее k-уровневое дерево, а не схлопывание до листьев — движок ST.mxTree
   считает и собственные числа узла, и разбивку по колонке (byCol) одним проходом
   (ADR-0176 §5, ИС-13). Особый случай не тронут: ОДИН разрез с уровнями («Уровень»
   в шапке разреза) идёт старым путём — statSlice/branchAt строит дерево ПО СВОИМ
   уровням той же иерархии, а не по нескольким разным разрезам, и это другая задача. */
function mxAxisDims(mq){
  return {rowsDims: mq.dims.filter(d => mq.axis[d] === 'rows'),
          colDim: mq.dims.find(d => mq.axis[d] === 'cols') || null};
}
function mxLeaves(groups){
  const out = [];
  (groups || []).forEach(g => { if(g.children && g.children.length) out.push.apply(out, mxLeaves(g.children)); else out.push(g); });
  return out;
}
/* Хвост, а не ноль (Q25): «—» и «⊘» сортировкой не притворяются числом — уходят в
   конец СВОЕЙ группой, сохраняя между собой исходный (алфавитный) порядок. */
function mxSortKey(val){ return (!val || val.refused || val.v == null) ? null : val.v; }
function mxApplySort(list, valFn, sort){
  if(!sort || !sort.ind) return list;
  const have = [], none = [];
  list.forEach(n => { const k = mxSortKey(valFn(n)); (k == null ? none : have).push({n,k}); });
  have.sort((a,b) => sort.dir === 'asc' ? a.k - b.k : b.k - a.k);
  return have.map(x => x.n).concat(none.map(x => x.n));
}
function mxSortTree(nodes, valFn, sort){
  /* Сортировка ВНУТРИ родителя (Q25 · A): каждый уровень дерева переставляется отдельно
     от своего, а не распрямлением — родительская строка своя отвеченная величина
     (ADR-0176 §5), а не сумма детей, и распрямление стёрло бы её. */
  nodes = mxApplySort(nodes.slice(), valFn, sort);
  nodes.forEach(n => { if(n.children && n.children.length) n.children = mxSortTree(n.children, valFn, sort); });
  return nodes;
}

/* Отступы липкой шапки таблицы (top:44/79/113 в CSS) исходят из ОДНОСТРОЧНЫХ строк
   шапки — при разрезах ИЛИ показателей длиннее одной строки текст переносится, и
   вторая строка шапки, а следом строка «Итого», наезжают на выросшую первую (Q28).
   Числа не подобрать заранее — сколько строк перенесётся, знает только браузер после
   раскладки, поэтому досчитывается здесь, после каждой отрисовки матрицы. */
function mxFixStickyOffsets(){
  const table = document.querySelector('table.mx-grid');
  if(!table) return;
  const hgRow = table.querySelector('thead tr.hg'), hmRow = table.querySelector('thead tr.hm');
  if(!hgRow || !hmRow) return;
  const base = 44;                                          /* верхняя строка ни от чего не зависит */
  const hgH = hgRow.getBoundingClientRect().height, hmH = hmRow.getBoundingClientRect().height;
  Array.from(hmRow.children).forEach(c => { c.style.top = (base + hgH) + 'px'; });
  const totRow = table.querySelector('tbody.mx-tot tr');
  if(totRow) Array.from(totRow.children).forEach(c => { c.style.top = (base + hgH + hmH) + 'px'; });
}
function matrixAnswer(st){
  const mq = st.mAsked;
  if(!st.mSort) st.mSort = {};
  if(!st.mCollapsed) st.mCollapsed = {};
  if(st.mDrill === undefined) st.mDrill = null;
  if(st.mRefKey === undefined) st.mRefKey = null;
  const {rowsDims, colDim} = mxAxisDims(mq);
  const inds = mq.inds.length ? mq.inds : ['a-count'];
  /* Один разрез СО СВОИМИ уровнями («Уровень» в шапке разреза) — старый путь без
     изменений: statSlice/branchAt строит дерево ПО УРОВНЯМ ТОЙ ЖЕ иерархии, а не по
     нескольким разным разрезам. Всё остальное (0, 2+ разрезов, или один плоский) —
     через ST.mxTree, настоящее k-уровневое дерево с разбивкой по колонке в узле. */
  const singleHier = rowsDims.length === 1 && DIM(rowsDims[0]) && DIM(rowsDims[0]).levels;

  let groups, colKeys, total, totalByCol, n, pass, rowsn;
  if(singleHier){
    const base = {obj: mq.obj, date: mq.date, levels: mq.levels, buckets: mq.buckets, filter: mq.filter, inds};
    const rowsRes = ST.statSlice(Object.assign({}, base, {dims: rowsDims}));
    if(!rowsRes.ok) return '<div class="banner danger">'+esc(rowsRes.why)+'</div>';
    const colRes = colDim ? ST.statSlice(Object.assign({}, base, {dims: [colDim]})) : null;
    if(colDim && !colRes.ok) return '<div class="banner danger">'+esc(colRes.why)+'</div>';
    groups = rowsRes.groups;
    const flatCols = colDim ? mxLeaves(colRes.groups) : [];
    colKeys = flatCols.map(c => c.key);
    total = rowsRes.total;
    totalByCol = {}; flatCols.forEach(c => { totalByCol[c.key] = {n: c.n, values: c.values}; });
    n = rowsRes.n; rowsn = rowsRes.n; pass = rowsRes.passport;
    /* Клетки колонки на узле дерева одного разреза считаются как отдельный «плоский»
       вызов ПО ТЕМ ЖЕ строкам узла — тот же приём, что у ST.mxTree.byCol, но через
       уже существующий statSlice (rowsDims тут ровно один, значит псевдо-byCol не
       нужен: клетка узла = сам узел при отсутствии колонки, а с колонкой берём
       cellsRes, как раньше). */
    if(colDim){
      const cellsRes = ST.statSlice(Object.assign({}, base, {dims: rowsDims.concat([colDim]), colDim}));
      if(!cellsRes.ok) return '<div class="banner danger">'+esc(cellsRes.why)+'</div>';
      pass = cellsRes.passport;
      const cellMap = new Map();
      mxLeaves(cellsRes.groups).forEach(g => cellMap.set(g.parts[0] + '||' + g.parts[1], g));
      (function attach(nodes){
        nodes.forEach(nd => {
          const byCol = {};
          colKeys.forEach(ck => { const g = cellMap.get(nd.key + '||' + ck); if(g) byCol[ck] = {n: g.n, refs: g.refs, values: g.values}; });
          nd.byCol = byCol;
          if(nd.children && nd.children.length) attach(nd.children);
        });
      })(groups);
    }
  } else {
    const treeRes = ST.mxTree({obj: mq.obj, date: mq.date, levels: mq.levels, buckets: mq.buckets,
      filter: mq.filter, inds, dims: rowsDims, colDim});
    if(!treeRes.ok) return '<div class="banner danger">'+esc(treeRes.why)+'</div>';
    groups = treeRes.groups; colKeys = treeRes.colKeys; total = treeRes.total;
    totalByCol = treeRes.totalByCol || {}; n = treeRes.n; rowsn = treeRes.n; pass = treeRes.passport;
  }

  function valFor(node, blockKey, ind){
    if(blockKey === 'total') return node.values[ind];
    const c = node.byCol && node.byCol[blockKey];
    return c ? c.values[ind] : null;
  }
  function nFor(node, blockKey){
    if(blockKey === 'total') return node.n;
    const c = node.byCol && node.byCol[blockKey];
    return c ? c.n : 0;
  }
  function refsFor(node, blockKey){
    if(blockKey === 'total') return node.refs;
    const c = node.byCol && node.byCol[blockKey];
    return c ? c.refs : [];
  }

  /* Ширина названа числом, не заперта порогом (Q5): раскладка свободна. */
  const numBlocks = colKeys.length + 1;
  const AVAIL = 620;
  const approxW = numBlocks * (1 + inds.length) * 90;
  const widthNote = approxW > AVAIL
    ? '<div class="banner info">блоков '+numBlocks+' × колонок '+(1+inds.length)+' ≈ '+approxW+
      ' px, видимой ширины ≈ '+AVAIL+' px — таблица прокручивается вбок.</div>' : '';

  /* Пустой ответ держит форму ответа (Q14). */
  const empty = n === 0;
  const emptyCause = mq.filter ? pass.filter : pass.scope;

  const blocks = [{key:'total', label:'Итого'}].concat(colKeys.map(c => ({key:c, label:c})));
  const sortArrow = (blockKey, ind) => st.mSort.blockKey === blockKey && st.mSort.ind === ind
    ? (st.mSort.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const thead =
    '<tr class="hg"><th class="rowdim-h" rowspan="2"><div class="rowdim-h-wrap">'+
      (rowsDims.length ? rowsDims.map(d => esc(DIM(d).name)).join('<br>') : 'Всего')+'</div></th>'+
      blocks.map(b => '<th colspan="'+Math.max(1,inds.length)+'" class="'+(b.key==='total'?'tot-h':'')+'">'+esc(b.label)+'</th>').join('')+
    '</tr>'+
    '<tr class="hm">'+blocks.map(b => inds.map(m =>
      '<th class="num mx-sortable" onclick="ST.mxSort(\''+b.key+'\',\''+m+'\')" title="сортировать">'+
        esc(IND(m).name)+sortArrow(b.key, m)+'</th>').join('')).join('')+
    '</tr>';

  /* Отказ свода — клетка в ширину числа, по клику выноска с составом, датой курса и
     двумя дорогами (Q19); обе меняют st.mq и потому сами зажигают «⚠ вопрос изменён»
     через ST.mxChanged() — второй сигнал заводить не пришлось. */
  function cellHtml(node, blockKey, ind){
    if(IND(ind) && IND(ind).fn === 'count'){
      const n = nFor(node, blockKey), refs = refsFor(node, blockKey), warn = n > ST.rowsLimit;
      if(!n) return '<td class="num muted">—</td>';
      return '<td class="num"><button class="'+(warn?'pill warn':'')+'"'+
        (warn ? ' title="в числе '+n+' строк — порог показа '+ST.rowsLimit+'"' : '')+
        ' onclick=\'ST.mxDrillSet('+JSON.stringify(refs)+','+
          JSON.stringify((node.parts && node.parts.length ? node.parts.join(' · ') : node.key)+(blockKey!=='total'?' · '+blockKey:''))+
        ')\'>'+n+'</button></td>';
    }
    const val = valFor(node, blockKey, ind);
    if(val && val.refused){
      const pid = (node.key||'')+'|'+blockKey+'|'+ind, open = st.mRefKey === pid;
      const somId = ind+'-som';
      return '<td class="num mx-ref-cell"><button class="pill warn" onclick="ST.mxRefOpen('+JSON.stringify(pid)+')">свод отказан</button>'+
        (open ? '<div class="mx-overlay" onclick="if(event.target===this) ST.mxRefClose()">'+
          '<div class="mx-overlay-card" style="max-width:360px"><div class="mx-overlay-head"><h3>Свод отказан</h3>'+
          '<button class="btn btn-secondary" onclick="ST.mxRefClose()">закрыть</button></div>'+
          '<p class="note">'+esc(val.why || val.note || '')+'</p>'+
          (val.rateDate ? '<p class="small muted">курс на '+fmt(val.rateDate)+'</p>' : '')+
          '<div class="btn-row">'+
            (IND(somId) ? '<button class="btn btn-secondary btn-sm" onclick="ST.mxTakeSom('+JSON.stringify(ind)+')">взять «'+esc(IND(somId).name)+'»</button>' : '')+
            '<button class="btn btn-secondary btn-sm" onclick="ST.mxCurToCols()">валюту в колонки</button>'+
          '</div></div></div>' : '')+'</td>';
    }
    return '<td class="num">'+cellText(val)+'</td>';
  }

  function rowHtml(node, depth){
    const collapsed = !!st.mCollapsed[node.key];
    const hasKids = node.children && node.children.length;
    const chevron = hasKids ? '<button class="chev" onclick="ST.mxToggleCollapse('+JSON.stringify(node.key)+')">'+(collapsed?'▸':'▾')+'</button>' : '';
    const label = (node.parts && node.parts.length ? node.parts[node.parts.length-1] : node.key) || 'всего';
    let html = '<tr'+(depth>1?' class="lvl"':'')+'><td style="padding-left:'+(10+(depth-1)*20)+'px">'+chevron+esc(label)+'</td>'+
      blocks.map(b => inds.map(m => cellHtml(node, b.key, m)).join('')).join('')+'</tr>';
    if(hasKids && !collapsed) html += node.children.map(c => rowHtml(c, depth+1)).join('');
    return html;
  }

  let rowsList = groups;
  if(st.mSort.ind) rowsList = mxSortTree(rowsList, nd => valFor(nd, st.mSort.blockKey, st.mSort.ind), st.mSort);

  const bodyRows = empty
    ? '<tr><td colspan="'+(1+blocks.length*Math.max(1,inds.length))+'">'+esc(emptyCause)+
        (mq.filter ? ' <button class="btn btn-secondary btn-sm" onclick="ST.mxClearFilter()">снять фильтр</button>' : '')+'</td></tr>'
    : (rowsList.map(nd => rowHtml(nd, 1)).join('') || '<tr><td colspan="'+(1+blocks.length*Math.max(1,inds.length))+'" class="muted">строк нет</td></tr>');

  const totalRow = '<tr class="tot"><td>Итого</td>'+
    blocks.map(b => inds.map(m => {
      if(IND(m) && IND(m).fn === 'count'){
        const cnt = b.key === 'total' ? rowsn : ((totalByCol[b.key] || {n:0}).n);
        return '<td class="num">'+cnt+'</td>';
      }
      const val = b.key === 'total' ? total[m] : (totalByCol[b.key] || {values:{}}).values[m];
      return '<td class="num">'+cellText(val)+'</td>';
    }).join('')).join('')+'</tr>';

  /* Детализация — тот же блок, что у старого экрана (Q9/Q13), но не его вопрос: свой
     `q` (obj/date/filter из st.mAsked) и своя кнопка закрытия, чтобы не трогать st.q. */
  const drill = st.mDrill ? rowsBlock(st.mDrill.refs, 'Кто именно — '+st.mDrill.title,
    {obj: mq.obj, date: mq.date, filter: mq.filter}, 'ST.mxDrillClose()') : '';

  /* Q7 — краткая форма липкой полосой, полная по кнопке; тот же приём, что у плиток
     (ST.showPass/tilePass), своё поле состояния — st.mPassOpen, чтобы не спорить с ними. */
  const passBar = '<div class="pass-bar"><span class="muted">'+esc(pass.short)+'</span>'+
    '<button class="btn btn-secondary btn-sm" onclick="ST.mxTogglePass()">'+
    (st.mPassOpen ? 'свернуть паспорт' : 'полный паспорт')+'</button></div>'+
    (st.mPassOpen ? passportHtml(pass) : '');

  return passBar+widthNote+
    '<div class="mx-scroll"><table class="cgrid mx-grid"><thead>'+thead+'</thead>'+
    '<tbody class="mx-tot">'+totalRow+'</tbody>'+
    '<tbody>'+bodyRows+'</tbody>'+
    '</table></div>'+drill;
}
ST.mxSort = (blockKey, ind) => { const st = ST.state, s = st.mSort || {};
  if(s.blockKey === blockKey && s.ind === ind) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  else { s.blockKey = blockKey; s.ind = ind; s.dir = 'desc'; }
  st.mSort = s; render(); };
ST.mxToggleCollapse = key => { ST.state.mCollapsed[key] = !ST.state.mCollapsed[key]; render(); };
ST.mxDrillSet = (refs, title) => { ST.state.mDrill = {refs, title}; render(); };
ST.mxDrillClose = () => { ST.state.mDrill = null; render(); };
ST.mxRefOpen = key => { ST.state.mRefKey = key; render(); };
ST.mxRefClose = () => { ST.state.mRefKey = null; render(); };
ST.mxTakeSom = ind => { const st = ST.state, a = st.mq.inds, i = a.indexOf(ind), alt = ind+'-som';
  if(i >= 0 && IND(alt)) a[i] = alt; st.mRefKey = null; render(); };
ST.mxCurToCols = () => { const st = ST.state, mq = st.mq, id = 'd-cur';
  if(mq.dims.indexOf(id) < 0){ mq.dims.push(id); mq.axis[id] = 'rows';
    const D = DIM(id); if(D && D.buckets) mq.buckets[id] = D.buckets[0]; }
  Object.keys(mq.axis).forEach(d => { if(d !== id && mq.axis[d] === 'cols') mq.axis[d] = 'rows'; });
  mq.axis[id] = 'cols'; st.mRefKey = null; render(); };
ST.mxTogglePass = () => { ST.state.mPassOpen = !ST.state.mPassOpen; render(); };

function viewMatrix(){
  const st = ST.state;
  if(!st.mAsked) st.mAsked = mxClone(st.mq);   /* страницы «до первого вопроса» не бывает (Q14) */
  return '<div class="matrix-shell">'+
    '<div class="matrix-qcol'+(st.mxQColCollapsed ? ' collapsed' : '')+'" id="matrixQCol">'+matrixQuestionCol(st)+'</div>'+
    '<div class="matrix-ans" id="matrixAns">'+matrixAnswer(st)+'</div>'+
    '</div>';
}

function viewBuild(){
  const st = ST.state;
  if(!ST.canBuild()) return '<div class="banner warn"><b>Наблюдателю конструктор не открыт.</b> '+
    'Отказ по праву доступа говорит текстом, а не пропадающей кнопкой: наблюдателю доступны готовые '+
    'срезы и плитки (роли — §13 канона).</div>'+tilesBlock();
  let out = '<h2 class="section-h">Вопрос к статистике</h2>'+
    '<p class="page-lead">Объект → разрезы → показатели → дата. Три вопроса — три шва: '+
    '<code>statSlice</code> (сколько и на сколько) · <code>statSeries</code> (как менялось) · '+
    '<code>statRows</code> (кто именно в числе). Четвёртого нет: «дай всё» — не вопрос.</p>'+pickBar();
  if(st.q.mode === 'series') return out + seriesBlock() + workBlock() + flowBlock() + tilesBlock();
  if(st.q.mode === 'rows')   return out + rowsBlock(null, null) + workBlock() + flowBlock() + tilesBlock();
  const res = ST.statSlice(st.q);
  if(!res.ok) return out + '<div class="banner danger">'+esc(res.why)+'</div>';
  out += passportHtml(res.passport)+'<div class="card"><h3>Срез</h3>'+sliceTable(res)+'</div>';
  if(st.drill){
    const g = ST.findNode(res.groups, st.drill) ||
      ST.findNode(res.groups, res.groups.map(x => x.key).find(k => k.replace(/'/g,'') === st.drill));
    if(g) out += rowsBlock(g.refs, 'Кто именно в числе '+g.n+': '+g.key);
  }
  return out + workBlock() + flowBlock() + tilesBlock();
}

/* ===================== ЭКРАН 2: ЖУРНАЛ СРЕЗОВ ======================= */
ST.runUI = () => act(ST.run(ST.state.today, {}), 'прогон за '+fmt(ST.state.today)+' выполнен');
ST.runClosedUI = () => act(ST.run('2026-06-30', {}));
/* Молчание соседа — не отладочный флажок, а СОСТОЯНИЕ НОЧИ, и руками оно должно быть
   достижимо: без этой кнопки неполная строка, отказ защёлки и дозаполнение остались бы
   словами в проверках, а макет отдаётся разработчику как рабочая модель (ИС-42, ADR-0208).
   Имя соседа и причина БЕРУТСЯ ИЗ СПИСКОВ, а не набираются: форма повторяет закрытость
   словаря, а не проверяет её задним числом. Отказ двери при этом никуда не девается —
   ST.run проверяет и то и другое сам, форма лишь не даёт промахнуться (§2).
   Дозаполнение своей кнопки НЕ ИМЕЕТ и иметь не должно: его делает ОБЫЧНЫЙ «Прогон за
   сегодня» той же датой — у прогона нет отдельного механизма «повторить неудачное»
   (ADR-0208 §4–5). Отдельная кнопка «дозаполнить» завела бы второй путь записи. */
ST.silentRunUI = () => {
  const nb = ($('#silentNb') || {}).value || '', why = ($('#silentWhy') || {}).value || '';
  const s = {}; s[nb] = why;
  const r = ST.run(ST.state.today, {silent: s});
  act(r, 'прогон за '+fmt(ST.state.today)+' выполнен: «'+nb+'» '+why+
      ' · неполных строк — '+r.partial);
};
ST.skipUI = () => act(ST.skip(ST.state.today, ($('#skipReason') || {}).value || ''), 'пропуск записан');
/* Объект и запись выбираются ОДНИМ полем «объект|запись»: два связанных списка потребовали
   бы промежуточного состояния экрана, а связь у них жёсткая — запись принадлежит объекту. */
ST.enqueueUI = () => {
  const k = (($('#qKey') || {}).value || '').split('|');
  act(ST.enqueue(k[0], k[1], ($('#qWhy') || {}).value || '', ($('#qNote') || {}).value || ''),
      'работа поставлена в очередь перестроения');
};
ST.manualUI = () => act(ST.run(ST.state.q.date, {manual:true, actor: ST.state.role,
  reason: ($('#manualReason') || {}).value || ''}), 'внеплановый пересчёт выполнен');
/* Кнопка на КАЖДЫЙ слой, и все три собраны из LAYERS: слой — параметр действия, а не имя
   кнопки (ИС-38, ADR-0149). Верхнюю колонку ставит своя дверь модуля — за ней стоит
   фиксация строк, которой у нижних слоёв нет. */
ST.layerUI = layer => {
  const who = ($('#closeWho') || {}).value || '';
  const m = ST.openPeriod(layer);
  act(layer === MY_LAYER ? ST.closePeriod(m, who) : ST.closeLayer(m, layer, who),
    layer === MY_LAYER ? 'период '+monLabel(m)+' закрыт: строки зафиксированы'
                       : 'колонка «'+layer+'» периода '+monLabel(m)+' проставлена');
};
ST.closeUI = () => ST.layerUI(MY_LAYER);
/* Перезакрытие спрашивает распоряжение ФОРМОЙ, а не подразумевает его: поле, которое
   нельзя не заполнить, — единственный способ не дать перезакрыть период молча (ИС-50). */
ST.reopenUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  const m = g('reMonth');
  act(ST.reopenPeriod(m, {no: g('reOrder'), basis: g('reBasis')}, g('closeWho')),
    'период '+monLabel(m)+' перезакрыт: колонки сняты сверху вниз, строки расфиксированы, выпуски помечены');
};
ST.reopenNoOrderUI = () => act(ST.reopenPeriod((($('#reMonth') || {}).value || ''), null,
  (($('#closeWho') || {}).value || '')));
/* Кнопка ради ОТКАЗА: снять нижнюю колонку, не сняв верхнюю, невозможно — тот же каскад,
   прочитанный в обратную сторону (ИС-50, ADR-0204 §4). Отказ показывается, а не прячется:
   иначе правило существовало бы только в коде. */
ST.openLowerUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  act(ST.openLayer(g('reMonth'), BASE_LAYER, {no: g('reOrder'), basis: g('reBasis')}, g('closeWho')),
    'колонка «'+BASE_LAYER+'» снята: период открыт');
};
ST.closeNoActorUI = () => act(ST.closePeriod(ST.openPeriod(), ''));
/* Молчание НА ДОСПРОСЕ достижимо руками по тому же доводу, что и молчание в ночь (ИС-42):
   без кнопки второй рубеж закрытия остался бы словом в проверке. Сосед и причина берутся
   из тех же списков, что у ночного молчания, — словарь один, и форма его не размножает. */
ST.closeMuteUI = () => {
  const nb = ($('#silentNb') || {}).value || '', why = ($('#silentWhy') || {}).value || '';
  const s = {}; s[nb] = why;
  act(ST.closePeriod(ST.openPeriod(), ($('#closeWho') || {}).value || '', s));
};

function viewJournal(){
  const st = ST.state;
  const runs = st.runs.slice().sort((a,b) => b.date.localeCompare(a.date)).map(r => '<tr'+
    (r.kind === 'пропуск' ? ' class="out"' : '')+'>'+
    '<td>'+fmt(r.date)+'</td>'+
    '<td>'+(r.kind === 'пропуск' ? '<span class="pill err">пропуск</span>' :
      r.kind === 'внеплановый' ? '<span class="pill warn">внеплановый</span>' :
      r.kind === 'защёлка' ? '<span class="pill ok">слепок защёлки</span>' :
      '<span class="pill ok">плановый</span>')+'</td>'+
    '<td>'+esc(r.actor || '—')+'</td>'+
    /* Кто молчал в эту ночь — реквизит ПРОГОНА, и в журнале он стоит рядом с причиной
       внепланового: обе колонки отвечают на один вопрос «почему эта ночь такая» (ИС-42). */
    '<td>'+esc(r.reason || '')+(r.silent ? ' <span class="pill warn">не ответил: '+
      esc(Object.keys(r.silent).map(nb => nb+' — '+r.silent[nb]).join(' · '))+'</span>' : '')+'</td>'+
    '<td class="num">'+(r.written || '—')+'</td>'+
    '<td>'+(ST.isClosed(r.date) ? '<span class="pill ok">зафиксирован</span>' : '<span class="pill neutral">открыт</span>')+'</td>'+
    /* СОСТАВ КАНДИДАТОВ — реквизит прогона, а не число в логе (ADR-0221, «Последствия»):
       без разбивки по четырём источникам «кандидатов не было» неотличимо от «опрос не
       состоялся», и ночь, прошедшая мимо половины портфеля, выглядела бы удачной. */
    /* ДОСПРОС стоит в ТОЙ ЖЕ колонке, что и состав кандидатов, и это не экономия места:
       обе строки отвечают на один вопрос — кого эта ночь спрашивала. У прогона ответ
       «кандидатов столько-то», у защёлки — «всех, и вот что переспросила перед тем, как
       расписаться за окончательность» (ИС-46, ADR-0216 §2). Несостоявшийся доспрос виден
       здесь же и отдельной строкой: «не отвечено» — тоже состоявшаяся ночь. */
    '<td class="small">'+(!r.cand ? '<span class="muted">—</span>'
      : r.cand.scan === 'полный'
        ? '<span class="pill ok">обход полный</span><br><span class="small muted">'+esc(r.cand.why || '')+'</span>'+
          (r.repoll ? '<br>'+(r.repoll.done
            ? '<span class="pill ok">доспрос: дописал '+r.repoll.made+' · переписал '+r.repoll.again+'</span>'+
              (r.repoll.nbs.filter(n => !n.final).length
                ? '<br><span class="pill neutral">предварительно ответили: '+
                  esc(r.repoll.nbs.filter(n => !n.final).map(n => n.name).join(' · '))+'</span>' : '')
            : '<span class="pill err">доспрос не отвечен: '+
              esc(r.repoll.nbs.filter(n => !n.ok).map(n => n.name+' — '+n.reason).join(' · '))+
              '</span><br><span class="small muted">строки не тронуты: опрос идёт прежде записи</span>') : '')
        : '<b>'+r.cand.n+'</b> <span class="muted">кандидатов, с '+fmt(r.cand.from)+'</span><br>'+
          CAND_SRC.filter(k => r.cand.by[k]).map(k => '<span class="pill '+
            (r.cand.first[k] ? 'ok' : 'neutral')+'">'+esc(k)+' '+r.cand.by[k]+
            (r.cand.first[k] !== r.cand.by[k] ? ' <span class="muted">(впервые '+r.cand.first[k]+')</span>' : '')+
            '</span>').join(' ')+
          ((r.cand.polls || []).filter(p => p.degraded).length
            ? '<br><span class="pill warn">обойдены полностью: '+
              esc(r.cand.polls.filter(p => p.degraded).map(p => p.nb+' — '+p.scanned).join(' · '))+'</span>'
            : '')+
          (r.cand.moved.length ? '<br><span class="pill warn">курс менялся: '+
            esc(r.cand.moved.join(', '))+'</span>' : ''))+'</td>'+
    /* Состав прогона называет и НЕИЗМЕНИВШИХСЯ: «строк — 0» при разрежённом хранении
       значит и «всё как вчера», и «писать не дали», и «никто ещё не родился», а это три
       разных события (ИС-45, ADR-0215 §3, СС-Д6). */
    '<td class="small">'+((r.parts || []).length
      ? r.parts.map(x => esc(x.name)+' <b>'+x.n+'</b>'+
          (x.same ? ' <span class="muted">(без изм. '+x.same+')</span>' : '')+
          (x.have ? ' <span class="muted">(уже есть '+x.have+')</span>' : '')+
          ((x.rewrote || []).length ? ' <span class="pill warn">переписано '+x.rewrote.length+
            ': '+esc(uniq([].concat.apply([], x.rewrote.map(w => w.fields))).map(id =>
              (REC(id) || {}).name || id).join(', '))+'</span>' : '')+
          /* «Неполных» и «дозаполнено» стоят ПОРОЗНЬ и порознь считаются: первое — состояние
             ночи, второе — её работа (ADR-0208 §4). Дозаполнение идёт своей колонкой, а не
             в «переписано»: было отсутствие, стало значение — переписывать было нечего. */
          (x.partial ? ' <span class="pill warn">неполных '+x.partial+'</span>' : '')+
          ((x.filled || []).length ? ' <span class="pill ok">дозаполнено '+x.filled.length+
            ': '+esc(uniq([].concat.apply([], x.filled.map(w => w.fields))).map(id =>
              (REC(id) || {}).name || id).join(', '))+'</span>' : '')+
          /* «Пропущено» и «без изменений» стоят ПОРОЗНЬ: первое — «не смотрели вовсе»,
             второе — «посмотрели, и состояние прежнее». Слей их — и ночь, не дошедшая до
             объекта, отчиталась бы о нём как о проверенном (ИС-48, ADR-0221 §1). */
          (x.skip ? ' <span class="pill neutral">не обойдено '+x.skip+'</span>' : '')+
          (x.kept ? ' <span class="muted">(+'+x.kept+' зафикс.)</span>' : '')).join(' · ')
      : '<span class="muted">—</span>')+'</td>'+
    '</tr>').join('');
  /* Строка календаря показывается СТРОКОЙ С КОЛОНКАМИ: одна пилюля «зафиксирован/открыт»
     не отвечает на вопрос, до какого слоя доехало закрытие мая и чья фамилия в каждой
     колонке — а именно это и есть состояние периода (ИС-38, ADR-0204 §1 и §3). */
  const months = st.periods.map(p => {
    const w = ST.periodBlockers(p.month);
    const cells = LAYERS.map(L => {
      const l = p.latches[L];
      const who = l ? l.by.split(', ') : null;
      /* Повторная простановка ВИДНА в колонке: без номера распоряжения «май закрыт
         12 сентября» читается как опоздавшее первое закрытие (ADR-0204 §1, ИС-50). */
      /* Легаси-колонку ставил ВЫПУСК, а не человек по порядку закрытия, и зелёная пилюля
         рядом с фамилией главбуха сказала бы, что это одно и то же действие (ИС-41). */
      return '<td>'+(l ? '<span class="pill '+(l.legacy ? 'neutral' : 'ok')+'">'+esc(who[0])+'</span><br>'+
        '<span class="small muted">'+esc(who.slice(1).join(', '))+' · '+fmt(l.at)+'</span>'+
        (l.order ? '<br><span class="pill warn">повторно · '+esc(l.order)+'</span>' : '')
        : '<span class="pill neutral">пусто</span>')+'</td>';
    }).join('');
    return '<tr>'+'<td>'+esc(monLabel(p.month))+
      (p.legacy ? ' <span class="pill neutral">легаси · пришёл закрытым</span>' : '')+'</td>'+cells+
      '<td class="num">'+st.rows.filter(r => ym(r.date) === p.month).length+'</td>'+
      '<td>'+(w.warnings.length ? '<span class="pill warn">'+esc(w.warnings.join(' · '))+'</span>' : '—')+
      ' <span class="muted">блокировок: '+w.blockers.length+'</span></td></tr>';
  }).join('');
  /* Легаси объясняется НА ТОМ ЖЕ ЭКРАНЕ, где календарь: шесть периодов, пришедших
     закрытыми и не закрывавшихся никем, — первая странность, которую человек встречает в
     этом справочнике, и без объяснения рядом она читается как чужое самоуправство.
     Отказы берутся У НАСТОЯЩИХ ДВЕРЕЙ, а не переписаны сюда текстом: переписанный отказ
     разошёлся бы с тем, что человек получит нажатием, на первой же правке формулировки —
     и разошёлся бы молча. Спрашивать их на отрисовке безопасно: все четыре отбивают легаси
     ДО единой правки состояния, и это держит сторож #224. */
  const leg = ST.legacyLoad();
  const legCard = !leg ? '' : (function(){
    const lm = leg.months[leg.months.length - 1], ld = leg.dates[leg.dates.length - 1];
    const who = 'Осмонова Г., главный бухгалтер';
    const ord = {no: 'РП-118 от 12.09.2026', basis: 'акт сверки № 41 от 14.07.2026'};
    const doors = [
      ['Проставить колонку «'+BASE_LAYER+'»', ST.closeLayer(lm, BASE_LAYER, who, st.today)],
      ['Открыть период распоряжением', ST.openLayer(lm, BASE_LAYER, ord, who)],
      ['Перезакрыть период (ADR-0216)', ST.reopenPeriod(lm, ord, who)],
      ['Пересчитать прогоном за '+fmt(ld), ST.run(ld)]
    ];
    /* Перечень собранного печатается ИМЕНАМИ, а не счётом: «6 из 135» отвечает на вопрос
       «много ли потеряно», но не на вопрос «есть ли в истории то, что мне нужно», — а
       спрашивают именно второе (ADR-0207 §2). */
    const forms = Object.keys(leg.form).map(objId => {
      const o = OBJ(objId), f = leg.form[objId], all = f.dims.concat(f.inds);
      return '<li><b>'+esc((o || {name: objId}).name)+'</b> — форма легаси собирала <b>'+
        all.length+'</b> величин из <b>'+(o ? o.dims.length + o.inds.length : '?')+
        '</b>, объявленных объектом сегодня: '+
        all.map(id => '«'+esc((REC(id) || {}).name || id)+'»').join(', ')+
        '. Остальные <b>отсутствуют ключом</b>, а не лежат нулём.</li>';
    }).join('');
    return '<div class="card"><h3>Легаси-итоги: история, собранная не этим модулем</h3>'+
      '<div class="banner info"><b>'+esc(leg.by)+'</b> · '+esc(leg.act)+' · '+fmt(leg.at)+'<br>'+
      'Строк — <b>'+leg.rows+'</b> на '+leg.dates.length+' отчётных дат ('+
      esc(fmt(leg.dates[0]))+' … '+esc(fmt(ld))+'), периодов — <b>'+leg.months.length+
      '</b>, и каждая строка пришла <b>уже окончательно зафиксированной</b>. Граница — '+
      '<b>дата запуска '+fmt(leg.launch)+'</b>, объявленная один раз.</div>'+
      '<ul class="note">'+forms+'</ul>'+
      '<table class="cgrid"><thead><tr><th>Что пробуем сделать с '+esc(monLabel(lm))+
      '</th><th>Что отвечает модуль</th></tr></thead><tbody>'+
      doors.map(x => '<tr><td>'+esc(x[0])+'</td><td>'+(x[1].ok
        ? '<span class="pill ok">выполнено</span>'
        : '<span class="pill err">отказ</span> <span class="why">'+esc(x[1].why)+'</span>')+
        '</td></tr>').join('')+'</tbody></table>'+
      '<p class="note">Отказов <b>четыре разных на четыре двери</b>, и это не педантизм: один '+
      'общий «нельзя» отправил бы человека искать недостающее право — и он бы его нашёл. '+
      'Дорога у трёх из четырёх одна и названа в самом отказе — <b>новый выпуск миграции</b> с '+
      'журнальной записью, актор там человек (ИС-41, ADR-0207 §4). Прогон легаси не видит <b>по '+
      'построению</b>, а не фильтром: очередь строится по <b>миру</b>, а не по написанным '+
      'строкам, а КД-2019/017 и КД-2021/044 в мире не существуют — они погашены до запуска '+
      '(§5). Подстановка «на дату» через границу <b>не переносит ничего ни в одну сторону</b>: '+
      'перенеси она — КД-2021/044 вышел бы в майском срезе живым договором (§7).<br>'+
      'Число из легаси-строки узнаётся <b>в паспорте ответа</b>, и <b>в кратком тоже</b>: свод '+
      'по несобиравшейся величине даёт правдоподобный ноль, а плитку видят всегда, тогда как '+
      'развёрнутый паспорт открывают не всегда (§2, ADR-0205 §4). Ряд через запуск называет '+
      'состав, и отметка «редакции формы разные» стоит <b>на стыке</b>, а не на всём ряде: '+
      'несопоставима не история вообще, а конкретная пара соседних точек; разницу между ними '+
      'модуль не считает — это графа изменения (§6, ИС-47).<br>'+
      '<b>Границы.</b> Легаси-строка <b>не служит основанием заключения</b> — это правило '+
      'живёт у получателя, движком его не проверить. Область видимости на легаси-стороне '+
      'дырява по существу: форма легаси не спрашивала куратора, и аналитику там не видно ни '+
      'одной строки — дыра <b>названа</b> в паспорте, но не закрыта, и закроет её только новый '+
      'выпуск (ADR-0175 §2).</p></div>';
  })();
  const div = ST.divergence('2026-05', 'obj-credit', 'm-debt');
  const divHtml = div.ok && div.shown
    ? '<div class="banner warn"><b>Май 2026 · остаток основного долга.</b><ul>'+
