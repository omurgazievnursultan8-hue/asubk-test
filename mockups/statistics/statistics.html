/* Календарь ОДИН на все слои: «зафиксирован» для статистики значит «проставлена колонка
   СТАТИСТИКИ в той же строке общего справочника». Своего списка закрытых периодов у
   модуля нет и завести его больше негде (ИС-38, ADR-0204). */
ST.isClosed = dateISO => !!latchOf(ST.state, ym(dateISO), MY_LAYER);
ST.calendar = () => ST.state.periods;
ST.layers = () => LAYERS.slice();
ST.latch = (month, layer) => latchOf(ST.state, month, layer || MY_LAYER);
/* «Открыт» без имени слоя — вопрос без ответа: каскад у слоёв доехал до разных мест, и
   ровно на этом три календаря давали три законных ответа (ADR-0204, контекст). */
ST.openPeriod = layer => ST.state.months.find(m => !latchOf(ST.state, m, layer || MY_LAYER));
ST.closedMonths = layer =>
  ST.state.periods.filter(p => p.latches[layer || MY_LAYER]).map(p => p.month);
ST.fixationOfMonth = m => {
  const st = ST.state;
  if(!latchOf(st, m, MY_LAYER)) return null;
  const r = st.rows.find(x => ym(x.date) === m && x.fixed);
  return r ? r.fixed : null;
};

/* Дверь для простановки ЛЮБОЙ колонки: слой назван параметром, а не именем функции
   (ADR-0149 — механизм один, объект его параметр). Проставляет всегда человек, справочник
   только стережёт порядок и записывает фамилию с датой. */
ST.closeLayer = (month, layer, who, atISO) => {
  const st = ST.state;
  const r = closeLayer(st, month, layer, who, atISO || st.today);
  if(r.ok) log('колонка «'+layer+'» периода '+monLabel(month)+' проставлена: '+who+', '+fmt(r.at)+
    (r.order ? ' · ПОВТОРНО, распоряжение '+r.order : ''));
  return r;
};
/* Единственный акт модуля, у которого есть фамилия (ИС-9), — простановка колонки
   СТАТИСТИКИ. Отдельной кнопки «зафиксировать статистику» нет и календаря своего тоже:
   колонка ставится в ОБЩЕМ справочнике и упирается в незакрытые нижние слои, как всякая
   верхняя (ИС-38, ADR-0204 §3). Фиксация строк — эффект ЭТОГО слоя, а не справочника:
   календарь стережёт порядок и не трогает ничьих чисел. */
/* ПОРЯДОК ЗАКРЫТИЯ, названный вслух: ПРОВЕРИТЬ · ПЕРЕСПРОСИТЬ · ПРОВЕРИТЬ · ПРОСТАВИТЬ ·
   ЗАМОРОЗИТЬ. Проверок ДВЕ, и это не подстраховка: они про разное и чинятся разным.
   РУБЕЖ ПЕРВЫЙ — неполнота, УЖЕ ЛЕЖАЩАЯ В СТРОКАХ месяца. Её оставила ночь, и чинится она
   ОБЫЧНЫМ ПРОГОНОМ (ADR-0208 §4): у прогона нет отдельного механизма «повторить
   неудачное», и защёлка таким механизмом тоже не становится — иначе закрытие превратилось
   бы во второй путь записи, которого ADR-0208 §5 не допускает. Рубеж стоит ДО доспроса
   нарочно: доспрос не чинит вчерашнего молчания, он спрашивает про сегодня.
   РУБЕЖ ВТОРОЙ — молчание НА САМОМ ДОСПРОСЕ (ИС-46, ADR-0216 §2). Оно случилось только
   что, прогоном не лечится и означает буквально следующее: величину, за окончательность
   которой мы собираемся расписаться, спросить не удалось. Разные слова у двух отказов не
   украшение: первый посылает к прогону, второй — к соседу.
   Оба рубежа стоят ДО простановки колонки, потому что колонка — в ОБЩЕМ справочнике, и
   снять её обратно можно только распоряжением о перезакрытии (ИС-50). Откат на ровном
   месте — не ошибка кода, а поддельная бумага. */
ST.closePeriod = (month, who, silent) => {
  const st = ST.state;
  /* Предусловия календаря спрашиваются ДО доспроса: переспрашивать соседей и переписывать
     строки ради периода, который всё равно не закроется (не тот по порядку, ещё не
     завершён, под ним пустой слой), — работа впустую и витрина, тронутая без основания. */
  const pre = closeLayerCheck(st, month, MY_LAYER, who);
  if(pre) return pre;
  /* Предусловие СВОЕГО слоя, а не справочника: календарь стережёт порядок слоёв и не
     знает, из чего собраны наши строки (ADR-0204, границы).
     Это ОТКАЗ, а не предупреждение (ADR-0208 §3): «окончательно» поверх дыры с известной
     причиной — подпись под тем, чего не видел. Отказ печатает перечень: кто молчал, по
     каким объектам, сколько строк, — готовый рабочий документ для разбора ночи. */
  const w = ST.periodBlockers(month);
  if(w.blockers.length) return {ok:false, blockers: w.blockers,
    why:'период '+monLabel(month)+' не закрывается: строки неполны — '+
        w.blockers.map(b => b.text).join(' · ')+
        '. Дозаполнение идёт обычным прогоном (ADR-0208 §4): молчание чинится ответом, '+
        'а не защёлкой (ИС-42, ADR-0208 §3)'};
  /* ДОСПРОС. Он и дописывает недостающие строки, и переписывает устаревшие: величина,
     которую закрытие замораживает, спрошена в момент замораживания (ИС-46, ADR-0216 §2). */
  const rp = repoll(st, month, who, st.today, silent);
  if(!rp.ok) return {ok:false, repoll: rp.nbs, mute: rp.mute,
    why:'период '+monLabel(month)+' не закрывается: на ДОСПРОСЕ не ответил '+
        (rp.mute.length > 1 ? 'соседи' : 'сосед')+' — '+
        rp.mute.map(m => '«'+m.name+'» ('+m.reason+')').join(' · ')+
        '. Это молчание не вчерашнее и прогоном не чинится: последний опрос — ЧАСТЬ '+
        'закрытия, и расписаться за окончательность величины, которую не удалось '+
        'спросить, нельзя (ИС-46, ADR-0216 §2). Строки не тронуты: доспрос спрашивает '+
        'прежде, чем писать'};
  const r = ST.closeLayer(month, MY_LAYER, who, st.today);
  if(!r.ok) return r;
  /* Порядок обязателен: сначала слепок, потом фиксация — иначе материализованные строки
     остались бы незафиксированными внутри закрытого периода, и прогон, которому ИС-8
     запрещает писать в закрытое, не смог бы их ни дописать, ни поправить. */
  const n = fixMonth(st, month, who, st.today);
  /* Сколько строк материализовала защёлка — реквизит журнала закрытия (ADR-0215,
     последствия): разница между «строк в месяце» до и после закрытия иначе выглядит
     необъяснённой прибавкой. Переписанное считается ОТДЕЛЬНО от дописанного: это разные
     события с разной ценой (ADR-0215 §4 против ADR-0216 §2). */
  log('период '+monLabel(month)+' закрыт ('+who+'): зафиксировано строк — '+n+
      ' · слепок дописал — '+rp.made+' · доспрос переписал — '+rp.again+
      (r.order ? ' · повторно, распоряжение '+r.order : ''));
  return {ok:true, month, layer: MY_LAYER, fixed:n, dense: rp.made, refreshed: rp.again,
          repoll: rp.nbs, by:who, order: r.order};
};
/* Состояние доспроса на месяц БЕЗ ЗАКРЫТИЯ — «кого переспросит защёлка и что она из этого
   засчитает окончательным». Дверь та же по замыслу, что `ST.candidates` у ночи, и заведена
   по тому же доводу: «закрытие переписало 12 строк» не отвечает на вопрос, чей ответ при
   этом был предварителен. Спросить надо ДО, а не вывести из последствий, — тем более что
   последствий может и не быть: молчащий сосед кончает закрытие до единой строки.
   Дверь ЧИТАЕТ и не пишет: ни строки, ни записи журнала за ней не остаётся (ИС-46).      */
ST.repoll = (month, silent) => {
  const st = ST.state, m = month || ST.openPeriod();
  if(!m) return {ok:false, why:'незакрытых периодов нет: переспрашивать некого (ИС-38)'};
  const nbs = repollNbs(st, m, silent || null);
  return {ok:true, month: m, nbs, mute: nbs.filter(n => !n.ok),
          final: nbs.filter(n => n.final).length, layerless: nbs.filter(n => !n.layer).length};
};

/* ------------------- ПЕРЕЗАКРЫТИЕ ПЕРИОДА (ИС-50) ------------------- *
   Переспросить · переписать · пометить. Тихой перезаписи закрытого периода не бывает:
   закрытый период уже сдан наружу, и расхождение со сданным обнаруживает ПОЛУЧАТЕЛЬ, а
   не мы (ADR-0204 §4, ADR-0157 §6). Поэтому распоряжение обязательно, сброс идёт сверху
   вниз, повторная простановка — снизу вверх обычным closeLayer, а выпуски метятся.       */

/* Распоряжение — не реквизит формы, а единственное, чем перезакрытие отличается от
   молчаливой правки. Проверка одна на обе двери: снять одну колонку и снять три —
   одинаково решение, а не факт (ИС-50). */
function orderRefusal(month, order, who){
  if(!who) return {ok:false, why:'период '+monLabel(month)+' без актора не открывается: '+
    'закрывает и открывает человек, справочник актором не является (ИС-9, ADR-0204 §6)'};
  if(!order || !order.no) return {ok:false, why:'перезакрытие периода '+monLabel(month)+
    ' без распоряжения не выполняется: период закрыт, числа за него уже ушли наружу, и '+
    'тихая перезапись разошлась бы с тем, что у получателя на руках, — расхождение '+
    'обнаружил бы он, а не мы (ИС-50, ADR-0204 §4, ADR-0157 §6). Номер распоряжения '+
    'ложится в колонку периода и в пометку выпуска'};
  if(!order.basis) return {ok:false, why:'у распоряжения '+order.no+' не названо основание: '+
    'номер без основания не отвечает, ПОЧЕМУ период открыт заново, — а отвечать придётся '+
    'получателю сданного (ИС-50, ADR-0157 §6)'};
  return null;
}

/* Выпуски, собранные на прежних числах, МЕТЯТСЯ, а не пересобираются. Числа мёрзнут один
   раз (ИО-4): паспорт заморожен внутри файла, и файл уже ушёл — пересобрать его задним
   числом значило бы завести второй экземпляр того, что подписано. Переиздавать или нет —
   решение человека (ИО-34); система лишь не даёт сделать вид, что ничего не произошло
   (ADR-0157 §5). Метится только то, где есть СНИМОК: сравнивать больше не с чем (§7). */
function markExports(st, month, order, atISO){
  const marked = [];
  st.exports.forEach(j => {
    if(ym(j.date) !== month || !j.passport) return;
    (j.marks || (j.marks = [])).push({period: month, order: order.no, basis: order.basis,
      at: atISO, why:'числа изменились после сдачи: период '+monLabel(month)+
        ' перезакрыт распоряжением '+order.no});
    marked.push(j.id);
  });
  return marked;
}

/* Дверь на ОДНУ колонку, симметричная ST.closeLayer: слой — параметр, а не имя функции
   (ADR-0149). Названа она по-разному для разных слоёв не в коде, а в журнале: у нижнего
   слоя снятие есть ОТКРЫТИЕ периода, у верхних — переспрос. Классификация и статистика не
   открываются никогда (ADR-0204 §4), и журнал обязан это произносить, иначе через год
   «сняли защёлку классификации» прочтут как «открыли период классификации». */
ST.openLayer = (month, layer, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const r = openLayer(st, month, layer);
  if(r.ok) log((r.opened
      ? 'период '+monLabel(month)+' ОТКРЫТ по слою «'+layer+'»'
      : 'снята защёлка «'+layer+'» периода '+monLabel(month)+
        ': слой переспросит и защёлкнется заново — верхние слои не открываются (ADR-0204 §4)')+
    ' · распоряжение '+order.no+' ('+order.basis+'), '+who);
  return r;
};

/* Все три шага ИС-50 разом, и ни одного лишнего. Сброс идёт ТОЙ ЖЕ дверью, что и поштучный,
   — обойди её перезакрытие, каскад снова стал бы процедурой в чьём-то коде (ADR-0204,
   отвергнутое). Повторная простановка здесь НЕ делается: она идёт снизу вверх обычным
   closeLayer, каждым слоем со своей фамилией и своей датой. Иначе перезакрытие оказалось бы
   одним нажатием, а «переспросить» — словом: переспрашивает не эта функция, а люди. */
ST.reopenPeriod = (month, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+
    ' в справочнике нет: перезакрывать нечего (ADR-0204, границы)'};
  /* Отказ стоит ЗДЕСЬ, а не только в `openLayer`: дойди распоряжение до цикла — снятие
     отбилось бы послойно, `dropped` остался бы пуст, и журнал записал бы перезакрытие,
     которого не было (ИС-41, ADR-0207 §4). */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: перезакрытие к нему неприменимо. Он загружен выпуском миграции ('+
    row.legacy.by+', '+fmt(row.legacy.at)+') уже окончательным, и распоряжение его не '+
    'откроет: исправление легаси-итога — НОВЫЙ ВЫПУСК, а не открытие периода (ИС-41, ADR-0207 §4)'};
  const latched = LAYERS.filter(L => row.latches[L]);
  if(!latched.length) return {ok:false, why:'период '+monLabel(month)+
    ' не закрыт ни одним слоем — он и так открыт: перезакрытие снимает защёлки, а снимать нечего'};
  const at = st.today;
  const dropped = [];
  for(let i = LAYERS.length - 1; i >= 0; i--){
    const r = openLayer(st, month, LAYERS[i]);
    if(r.ok) dropped.push(LAYERS[i]);
  }
  /* Расфиксировать строки — эффект СВОЕГО слоя, а не справочника: календарь стережёт
     порядок и ничьих чисел не трогает (ADR-0204 §6). Ровно так же, как ST.closePeriod
     фиксирует их ПОСЛЕ простановки своей колонки, а не вместо неё. */
  const unfixed = dropped.indexOf(MY_LAYER) >= 0 ? unfixMonth(st, month) : 0;
  const marked = markExports(st, month, order, at);
  /* Распоряжение живёт в СТРОКЕ периода: простановка колонок произойдёт другим действием,
     позже и другими людьми, а номер обязан доехать до каждой колонки (ADR-0204 §1). */
  (row.reopens || (row.reopens = [])).push({order: order.no, basis: order.basis, by: who,
    at, dropped: dropped.slice(), unfixed, marked: marked.slice()});
  const reasked = dropped.filter(L => L !== BASE_LAYER);
  log('период '+monLabel(month)+' перезакрыт по распоряжению '+order.no+' ('+order.basis+'), '+
    who+': открыт слой «'+BASE_LAYER+'»'+
    (reasked.length ? '; снята защёлка — «'+reasked.join('», «')+
      '» (переспрашивают и защёлкиваются заново, не открываются)' : '')+
    '; расфиксировано строк — '+unfixed+
    '; помечено выпусков — '+(marked.length ? marked.join(', ') : 'нет'));
  return {ok:true, month, order: order.no, basis: order.basis, by: who, at,
    opened: BASE_LAYER, reasked, dropped, unfixed, marked, next: BASE_LAYER};
};

/* --------------------------- ПРОГОН --------------------------------- */
ST.run = (dateISO, opts) => {
  const st = ST.state; opts = opts || {};
  if(dateISO > st.today) return {ok:false, why:'прогон на будущую дату не запускается'};
  /* §5: легаси-строк прогон НЕ ВИДИТ и в легаси-период не ходит. Отказ отдельный, а не
     общий «период зафиксирован»: тот зовёт к распоряжению, а здесь звать некуда — до
     запуска считать было нечем и некому (ИС-41, ADR-0207 §5, §7). */
  if(dateISO < LAUNCH) return {ok:false, why:'прогон за '+fmt(dateISO)+' не запускается: '+
    'дата раньше запуска '+fmt(LAUNCH)+'. До запуска историю собирала другая система, и её '+
    'итоги загружены выпуском миграции ('+st.legacy.by+', '+fmt(st.legacy.at)+') — прогон их '+
    'не считает, не видит и не перепишет (ИС-41, ADR-0207 §3, §5)'};
  if(ST.isClosed(dateISO)) return {ok:false, why:'период '+monLabel(ym(dateISO))+
    ' зафиксирован: строки не перезаписываются ни при каких правах (ИС-8). Открытие закрытого '+
    'периода — общий порядок (ADR-0089) и идёт распоряжением: сброс колонок сверху вниз, '+
    'повторная простановка снизу вверх, выпуски метятся — ST.reopenPeriod (ИС-50, ADR-0204 §4)'};
  if(opts.manual){
    if(!ST.canAdmin()) return {ok:false, why:'внеплановый пересчёт запускает администратор статистики'};
    if(!opts.reason) return {ok:false, why:'внеплановый пересчёт без причины не запускается: журнал срезов — часть контракта'};
  }
  /* Молчание соседа СПРАШИВАЕТСЯ, а не подразумевается: имя из объявленного списка и
     причина из закрытого словаря четырёх (ADR-0208 §2). Свободный текст здесь читался бы
     человеком и не читался бы поводом заданий, а неизвестное имя соседа завело бы колонку
     источника, которую никто не спрашивал, — и строка объявила бы неполноту по несуществу. */
  const silent = opts.silent || null;
  if(silent) for(const nb of Object.keys(silent)){
    if(!NB(nb)) return {ok:false, why:'соседа «'+nb+'» нет: соседи объявлены списком, а не '+
      'выводятся из имени шва — объявленные: '+NEIGHBOURS.map(n => n.id).join(' · ')+' (ИС-42)'};
    if(SILENCE_REASONS.indexOf(silent[nb]) < 0) return {ok:false, why:'причина молчания «'+
      String(silent[nb])+'» не объявлена: причин четыре, и они требуют разных действий — '+
      SILENCE_REASONS.join(' · ')+' (ИС-42, ADR-0208 §2)'};
  }
  const kind = opts.manual ? 'внеплановый' : 'плановый';
  const written = doRun(st, dateISO, kind, opts.manual ? (opts.actor || st.role) : null,
                        opts.reason || null, silent);
  /* «Строк — N» при разрежённом хранении больше не описывает прогон: ноль написанных
     строк значит и «ничего не изменилось», и «писать не дали». Прогон отчитывается о
     СЕБЕ (ADR-0215 §3) — иначе на дату без строк ответ «не менялось» нечем отличить от
     «прогона не было», а это разные ответы: первый нормальный, второй деградация (§2). */
  const rec = st.runs[st.runs.length-1];
  const sum = k => rec.parts.reduce((n, p) => n + (p[k] || 0), 0);
  const same = sum('same'), kept = sum('kept'), born = sum('born'), partial = sum('partial');
  const skip = sum('skip');
  const rewrote = rec.parts.reduce((n, p) => n + p.rewrote.length, 0);
  const filled  = rec.parts.reduce((n, p) => n + p.filled.length, 0);
  /* Ночь отчитывается СОСТАВОМ КАНДИДАТОВ, а не одним их числом: «кандидатов 46» не
     отличает ночь, в которую соседи назвали сорок, от ночи, в которую сорок пришли
     деградацией неотвечающего соседа. Полный обход называет ПРИЧИНУ по той же мерке. */
  const c = rec.cand || {};
  const candLine = c.scan === 'полный'
    ? ' · обход полный ('+c.why+')'
    : ' · кандидатов — '+c.n+' ('+CAND_SRC.filter(k => c.by[k]).map(k => k+' — '+c.by[k]).join(' · ')+
      ')'+(skip ? ' · не обходилось — '+skip : '')+
      (c.polls.filter(p => p.degraded).length
        ? ' · полностью обойдены соседи: '+c.polls.filter(p => p.degraded).map(p => p.nb).join(', ')
        : '');
  log((opts.manual ? 'внеплановый пересчёт' : 'прогон')+' за '+fmt(dateISO)+': строк — '+written+
      ' · без изменений — '+same+(born ? ' · родилось — '+born : '')+
      (rewrote ? ' · переписано — '+rewrote : '')+(filled ? ' · дозаполнено — '+filled : '')+
      (partial ? ' · неполных — '+partial+' ('+Object.keys(silent || {}).join(', ')+
        ' не ответил'+(Object.keys(silent || {}).length > 1 ? 'и' : '')+')' : '')+
      (kept ? ' · зафиксировано, пропущено — '+kept : '')+candLine);
  return {ok:true, date: dateISO, written, kind, same, kept, born, rewrote, filled, partial,
          skip, cand: clone(c)};
};
ST.skip = (dateISO, reason) => {
  const st = ST.state;
  if(!reason) return {ok:false, why:'пропуск без причины не записывается: дата просто отсутствует, и это надо объяснить (ADR-0148 §6)'};
  st.runs.push({date: dateISO, kind:'пропуск', at: st.today, actor:'планировщик', reason, written:0});
  log('пропуск прогона за '+fmt(dateISO)+': '+reason);
  return {ok:true};
};
/* Момент `T` по каждому соседу — ВИДИМЫЙ реквизит, а не внутренность прогона: «сосед
   молчит третью ночь» и «сосед не спрашивался с 31 мая» — разные беды с разными
   действиями, и различает их только `T` (ИС-49, ADR-0221 §2). */
ST.polls = () => NEIGHBOURS.map(nb => {
  const p = ST.state.polls[nb.id] || {};
  return {nb: nb.id, name: nb.name, asks: !!nb.asks, T: p.T || null, at: p.at || null,
          why: nb.asks ? null : 'не умеет отвечать на «кто изменился после T»: обходится полностью (ADR-0221 §5)'};
});
/* Очередь показывается ЖИВОЙ и ЦЕЛИКОМ: закрытые записи не стираются, и «работа была и
   сделана» отличается от «работы не было» (ADR-0196). */
ST.queue = all => ST.state.queue.filter(q => all || !q.done).map(clone);
ST.queueWhy = () => QUEUE_WHY.slice();
/* Поставить работу руками. Повод — из объявленного списка: очередь без повода не
   разбирается никогда, потому что снять её нечем и объяснить нечем. */
ST.enqueue = (objId, ref, why, note) => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'работу в очередь перестроения ставит администратор статистики'};
  const o = OBJ(objId);
  if(!o) return {ok:false, why:'объекта «'+String(objId)+'» нет в реестре объектов (ИС-18)'};
  if(QUEUE_WHY.indexOf(why) < 0) return {ok:false, why:'повод «'+String(why)+'» не объявлен: поводов очереди три — '+
    QUEUE_WHY.join(' · ')+' (ADR-0196, ADR-0221 §1)'};
  if(!(WORLD[objId] || []).some(x => x.id === ref))
    return {ok:false, why:'записи «'+String(ref)+'» у объекта «'+o.name+'» нет: в очередь ставится существующая запись, а не имя'};
  const rec = enq(st, objId, ref, why, st.today, st.role, note || null);
  log('в очередь перестроения: «'+o.name+'» '+ref+' — '+why+(note ? ' ('+note+')' : ''));
  return {ok:true, obj: objId, ref, why, at: rec.at, queued: ST.queue().length};
};
/* Состав кандидатов на дату БЕЗ ЗАПИСИ — «кого возьмёт ночь». Прогон отвечает тем же
   составом постфактум (реквизит `cand` записи журнала); дверь нужна экрану и сторожу,
   чтобы спросить до, а не выводить из последствий. */
ST.candidates = (dateISO, silent) => {
  const c = candidatesOf(ST.state, dateISO || ST.state.today, silent || null);
  return {ok:true, date: dateISO || ST.state.today, full: c.full, why: c.why, from: c.from,
          by: c.full ? {} : CAND_SRC.reduce((a, k) => (a[k] = c.by[k].map(clone), a), {}),
          n: c.full ? null : Object.keys(c.set).length,
          polls: c.polls.map(clone), moved: c.moved.slice()};
};

/* Правки строки нет и не будет: её существование уничтожило бы смысл датированного
   среза (ИС-2). Отказ назван вслух, а не спрятан отсутствием кнопки. */
ST.tryEditRow = () => ({ok:false, why:'строку среза пишет только прогон: правки строк в модуле нет (ИС-2)'});

/* ===================== ВЫБОРКА, ВИДИМОСТЬ, ПАСПОРТ ================== */
/* Строки, написанные РОВНО на эту дату. Это мера ПЛОТНОСТИ, а не срез: при разрежённом
   хранении объект, не менявшийся с мая, своей строки на 20 августа не имеет (ИС-45). */
function rowsAt(st, objId, dateISO){ return st.rows.filter(r => r.obj === objId && r.date === dateISO); }
/* СРЕЗ на дату — по последней строке каждой записи не позже спрошенной даты (ИС-45,
   ADR-0215). Отсутствие строки на дату значит «не менялось», а не «нет данных». Читают
   ВСЕ двери именно так — иначе срез, ряд, движение и выгрузка на одной и той же дате
   дали бы четыре разных состава, и спорить было бы не о чем.
   ГРАНИЦА, названная вслух: перенос вперёд НИЧЕМ НЕ ОГРАНИЧЕН. У записи объявлено
   рождение (ИС-33, ADR-0197) и не объявлено выбытие — ни даты, ни признака в модели нет,
   и последняя строка действует до конца времён. Пока запись из мира не уходит, это
   верно; появится выбытие — граница понадобится ЗДЕСЬ, а не в паспорте: паспорт назовёт
   возраст, но состав он не чинит. */
function rowsAsOf(st, objId, dateISO){
  const out = [], at = new Map();
  st.rows.forEach(r => {
    if(r.obj !== objId || r.date > dateISO) return;
    /* §7: перенос вперёд идёт ТОЛЬКО ВНУТРИ своей стороны запуска. Без этой строки ответ
       на 31 мая держался бы на легаси-итоге за I квартал у кредита, по которому прогон
       ещё ничего не написал, — и вышел бы он молча, обычной подстановкой по возрасту
       (ИС-45 + ИС-12), хотя собран другой формой в другой системе (ИС-41, ADR-0207 §7). */
    if((r.date < LAUNCH) !== (dateISO < LAUNCH)) return;
    const i = at.get(r.ref);
    if(i === undefined){ at.set(r.ref, out.length); out.push(r); }
    else if(out[i].date < r.date) out[i] = r;
  });
  return out;
}
/* Даты, на которые объект СЧИТАЛСЯ, берёт журнал прогонов, а не наличие строк: дата,
   на которую ещё никто не родился, иначе читалась бы как «прогона не было» — и пустой
   ответ молча подменился бы вчерашним (ИС-12, ИС-19, ИС-33). */
function datesOf(st, objId){
  const runs = st.runs.filter(r => (r.parts || []).some(p => p.obj === objId)).map(r => r.date);
  /* ЕДИНСТВЕННОЕ исключение из «даты берёт журнал прогонов»: легаси-дат в журнале нет и
     быть не может — их писал не прогон, а выпуск миграции, и прогон их не видит (ИС-41,
     ADR-0207 §5). Читать их приходится ИЗ СТРОК, и это законно ровно потому, что легаси-
     строка окончательна по построению: «строка есть» и «на эту дату считали» у неё одно и
     то же, а вся опасность прежнего счёта по строкам была в открытых периодах. */
  const leg = st.rows.filter(r => r.obj === objId && isLegacyRow(r)).map(r => r.date);
  return uniq(runs.concat(leg)).sort();
}

/* ИС-12: дата ВНУТРИ истории, на которую строк нет, не подменяется молча — отдаётся
   ближайшая предыдущая, и её возраст называется в паспорте. Дыра в прошлом окончательна:
   прогона за 19.08 не будет уже никогда, и лучшего ответа, чем 18.08, не существует. */
function resolveAsOf(st, objId, requested){
  /* ИС-41 §7: ближайшая раньше ищется среди СВОИХ — по ту же сторону запуска. Граница
     объявлена ОДИН РАЗ (`LAUNCH`) и смешанного периода не бывает: подстановка через неё
     выдала бы легаси-итог за ответ действующей формы, и паспорт заверил бы его обычным
     возрастом — деградация, неотличимая от нормальной (ADR-0207 §7). */
  const ds = datesOf(st, objId).filter(d => d <= requested && (d < LAUNCH) === (requested < LAUNCH));
  if(!ds.length) return null;
  const asOf = ds[ds.length-1];
  return {asOf, age: daysBetween(asOf, requested), substituted: asOf !== requested,
          edition: asOf < LAUNCH ? FORM.LEGACY : FORM.NOW};
}
ST.resolveAsOf = requested => resolveAsOf(ST.state, ST.state.q.obj, requested);
/* Дверь наружу одна на обоих: читатель обязан спрашивать СРЕЗ (rowsAsOf), а плотность
   (rowsAt) — только когда речь именно о том, писалась ли строка на эту дату (ИС-45). */
ST.rowsAsOf = (objId, dateISO) => rowsAsOf(ST.state, objId || ST.state.q.obj, dateISO);
ST.rowsAt = (objId, dateISO) => rowsAt(ST.state, objId || ST.state.q.obj, dateISO);

/* ИС-36: спрашивается дата ПРОГОНА, а не «сегодня». Разница с ИС-12 не в вежливости, а в
   том, чем кончится ожидание: пропуск в прошлом не заполнится никогда, а сегодняшних
   строк ещё нет — они будут ночью. Подставить в хвосте ближайшую предыдущую значит
   ответить не на тот вопрос: тот же вопрос с теми же параметрами завтра даст другое
   число, и первое окажется не неверным, а не о том — а поймать это нечем, потому что
   оба ответа честны. «Как сейчас» — вопрос не к статистике: на него отвечает реестр
   владельца (§8.4), у которого множество живое, а не написанное ночью. */
function askDates(st, objId){ return datesOf(st, objId); }
ST.askDates = objId => askDates(ST.state, objId || ST.state.q.obj);
function dateGate(st, objId, requested){
  const o = OBJ(objId);
  const ds = askDates(st, objId);
  if(!ds.length) return 'прогон ни разу не писал строк объекта «'+(o ? o.name : objId)+
    '»: спрашивать нечего (ИС-36)';
  /* ГРАНИЦА ЗАПУСКА — тоже ворота даты, и стоят они здесь по тому же доводу, что ворота
     охвата рядом (СС-130): отказ обязан назвать ПРИЧИНУ и ДОРОГУ, а «строк нет» не говорит
     ни того, ни другого. Даты обеих редакций лежат в одном списке — ответ на модуль один, —
     но вопрос всегда стоит по ОДНУ сторону (ИС-41, ADR-0207 §7). */
  const side = ds.filter(d => (d < LAUNCH) === (requested < LAUNCH));
  if(!side.length){
    const other = ds.filter(d => (d < LAUNCH) !== (requested < LAUNCH));
    return 'на '+fmt(requested)+' строк нет: по эту сторону запуска '+fmt(LAUNCH)+
      ' их не написано ни одной'+(other.length ? ' (по ту сторону — с '+fmt(other[0])+' по '+
      fmt(other[other.length - 1])+')' : '')+'. Через границу запуска строка не переносится: '+
      'до неё форма легаси, после — действующая, и перенос выдал бы старый итог за новый '+
      '(ИС-41, ADR-0207 §7)';
  }
  /* Разрыв между последним легаси-итогом и первым прогоном — НЕ дыра истории (ИС-12): это
     та же граница, и подставлять через неё нечего. Молчаливое «строк на эту дату и ранее
     нет» было бы верно и бесполезно: спрашивающий не узнал бы, что прошлое у объекта есть. */
  if(requested < side[0] && ds[0] < side[0])
    return 'на '+fmt(requested)+' строк нет: первая строка по эту сторону запуска '+
      fmt(LAUNCH)+' написана '+fmt(side[0])+', а лежащий раньше легаси-итог на '+
      fmt(ds.filter(d => d < LAUNCH).slice(-1)[0])+' через границу не переносится '+
      '(ИС-41, ADR-0207 §7)';
  const last = side[side.length - 1];
  if(requested > last){
    /* Хвост ЛЕГАСИ-стороны кончается иначе, чем хвост прогонов: там ждут ночи, здесь ждать
       нечего — новых легаси-итогов не будет никогда (ИС-41, ADR-0207 §5). */
    if(requested < LAUNCH) return 'на '+fmt(requested)+' легаси-итога нет: последний — '+
      fmt(last)+', и новых не будет. Итоги пришли выпуском миграции ('+st.legacy.by+', '+
      fmt(st.legacy.at)+', '+st.legacy.act+'); прогон легаси не считает и не увидит, а '+
      'исправление — НОВЫЙ ВЫПУСК, а не ночь (ИС-41, ADR-0207 §3, §5)';
    /* Пропуск за спрошенную дату — событие журнала, и отказ его называет: иначе
       «прогона не было» читается как поломка модуля, а не как записанная ночь. */
    const sk = st.runs.filter(r => r.kind === 'пропуск' && r.date > last && r.date <= requested);
    return 'на '+fmt(requested)+' прогона не было'+
      (sk.length ? ' · '+sk.map(g => fmt(g.date)+' — пропуск: '+g.reason).join(' · ') : '')+
      ': последний прогон '+fmt(last)+'. Спрашивается дата прогона, а не «сегодня» — '+
      '«как сейчас» отвечает реестр «'+(o ? o.owner : '—')+'», а не срез (ИС-36)';
  }
  return null;
}
ST.dateGate = (requested, objId) => dateGate(ST.state, objId || ST.state.q.obj, requested);

/* ИС-13: роль режет СТРОКИ, а не итог. Обратный порядок дал бы закрытую сумму
   вычитанием двух доступных срезов — утечку за два запроса.
   ИС-37: КАКИМ разрезом резать — берётся из записи объекта. Объект, чей охват объявлен
   отказом, сюда не доходит: его отбивают ворота scopeGate до счёта (СС-135). */
function applyScope(rows, objId){
  const s = ST.scopeOf(objId || (rows[0] && rows[0].obj));
  if(!s || s.denied) return rows;
  return rows.filter(r => r.dims[s.dim] === s.value);
}
/* Ворота охвата — рядом с воротами даты и по той же причине (СС-130): стоят в ОБЩЕЙ
   проверке вопроса, и все двери получают их даром. Отказ называет причину и дорогу:
   отказ без дороги — половина ответа (§8.4). */
function scopeGate(objId){
  const s = ST.scopeOf(objId);
  if(!s || !s.denied) return null;
  const o = OBJ(objId);
  return 'объект «'+(o ? o.name : objId)+'» под ролью «'+ST.state.role+'» не спрашивается: '+
    s.denied.why+'. Показать его целиком нельзя — это выдало бы объём чужой работы даже '+
    'итогом (§9), а показать пусто значит соврать. '+s.denied.road+' (ИС-37, ADR-0203)';
}
ST.scopeGate = scopeGate;
/* ==================== ФИЛЬТР ВОПРОСА (ADR-0180) ====================== *
   Форма одна: ДНФ БЕЗ СКОБОК. Фильтр — наборы через ИЛИ, набор — сравнения через И,
   вложенности нет. Скобки потребовали бы разбора выражения, а вопрос статистики
   выражением не является: его печатают в паспорт и сверяют глазами.
   Операнд — разрез или МЕРА СТРОКИ среза; правая часть ВСЕГДА константа. Показатель
   против показателя — это показатель реестра, а не фильтр (ADR-0180 §3).
   Порядок применения: роль → фильтр → группировка → порог (ИС-13, ADR-0178 §3).      */
const FOPS = {
  'перечисление': ['=','≠','∈','∉'],
  'число':        ['>','≥','<','≤','=','≠'],
  'корзина':      ['=','≠','∈','∉','в диапазоне'],
  'булево':       ['=','≠']
};
const LIST_OPS = ['∈','∉'];
/* Тип значения объявлен записью реестра, а не угадан по данным: у разреза его задаёт
   наличие корзин (значение спрашивается корзиной — ИС-23), у меры — поле type. */
function operandOf(c){
  if(!c || !c.id) return null;
  if(c.kind === 'ind'){
    const I = IND(c.id);
    if(!I) return null;
    return {kind:'ind', id:c.id, name:I.name, ind:I, money: !!I.money,
      vtype: (I.type === 'сумма' || I.type === 'число') ? 'число'
           : I.type === 'булево' ? 'булево' : 'перечисление'};
  }
  const d = DIM(c.id);
  if(!d) return null;
  return {kind:'dim', id:c.id, name:d.name, dim:d, vtype: d.buckets ? 'корзина' : 'перечисление'};
}
ST.operandOf = operandOf;
ST.filterOps = c => FOPS[(operandOf(c) || {}).vtype] || [];
function bucketFor(c, o){ return (c && c.bucket) || (o.dim.buckets ? o.dim.buckets[0] : null); }
/* Список ступеней строится из тех же границ, что и bucketOf: второй записи ступеней
   не заводится — иначе «31–90 дн.» в фильтре и в группировке разъехались бы. */
function stepLabels(d){
  const e = d.edges, uu = unitOf(d), u = uu ? ' '+uu : '', out = [(e[0]-1)+u];
  for(let i = 0; i < e.length - 1; i++) out.push(e[i]+'–'+(e[i+1]-1)+u);
  out.push(e[e.length-1]+'+'+u);
  return out;
}
/* Порядок корзин — свойство корзины, а не алфавита: «апрель 2026» < «май 2026», но
   лексикографически наоборот. Ключ порядка выводится ИЗ ЯРЛЫКА, поэтому «в диапазоне»
   работает и над строкой среза, и над записью реестра владельца. */
function bucketOrd(d, label, bucket){
  if(label == null) return null;
  const t = String(label);
  if(d.edges){ const i = stepLabels(d).indexOf(t); return i < 0 ? null : String(i).padStart(2,'0'); }
  if(bucket === 'год')     return /^\d{4}$/.test(t) ? t : null;
  if(bucket === 'квартал'){ const m = t.match(/^(\d{4}) · (\S+) кв\.$/);
    return m && QN.indexOf(m[2]) >= 0 ? m[1]+'-'+(QN.indexOf(m[2])+1) : null; }
  if(bucket === 'месяц'){ const m = t.match(/^(\S+) (\d{4})$/); if(!m) return null;
    const k = Object.keys(MON).find(x => MON[x] === m[1]); return k ? m[2]+'-'+k : null; }
  return t;
}
ST.bucketOrd = bucketOrd;
/* Значение уровневого разреза — ПУТЬ, и константа сравнивается с ним по префиксу до
   границы уровня: «Иссык-Кульская» ловит «Иссык-Кульская / Тюпский», но не соседнюю
   область с похожим началом имени. */
function eqEnum(s, k, prefix){
  const t = String(k);
  return s === t || (prefix && s.indexOf(t+' / ') === 0);
}
function matchEnum(c, s, prefix){
  if(c.op === '=') return eqEnum(s, c.value, prefix);
  if(c.op === '≠') return !eqEnum(s, c.value, prefix);
  const hit = (c.values || []).some(k => eqEnum(s, k, prefix));
  return c.op === '∈' ? hit : !hit;

  const now = want.filter(id => mark[id] === DATING.NOW);
  const asof = want.filter(id => mark[id] === DATING.ASOF);
  const n = now.length + asof.length;
  /* Ответ без величин — это счёт строк: датировать в нём нечего, и признак не выдумывается.
     Слово всё же «на дату», а не пустота: строку адресует дата (ADR-0147), а пустота в
     ОБЯЗАТЕЛЬНОМ реквизите читалась бы как недоделка — тогда как случай законный. */
  const word = now.length && asof.length ? 'смешанно' : now.length ? DATING.NOW : DATING.ASOF;
  return {word, n, now: now.slice(), asof: asof.slice(), names: now.map(named),
    text: !n
      ? 'величин ответ не читает: счёт строк датируется самой строкой, адресованной датой '+
        '(ИС-3, ADR-0147)'
      : !now.length
        ? 'все величины ответа ('+n+') собраны на дату (ИС-39)'
        : 'величин в ответе — '+n+', из них ТЕКУЩИМИ собраны '+now.length+': '+
          now.map(named).join(' · ')+' — они взяты в сегодняшней редакции, а не на '+
          fmt(asOf)+'. Отчёт за один и тот же период, собранный в разные дни, по ним '+
          'разойдётся без всякой ошибки (ИС-39, ADR-0205)'};
}
function skipNote(st, requested, asOf){
  if(requested === asOf) return null;
  const gaps = st.runs.filter(r => r.kind === 'пропуск' && r.date > asOf && r.date <= requested);
  const parts = gaps.map(g => fmt(g.date)+' — пропуск: '+g.reason);
  const ran = uniq(st.runs.filter(r => r.kind !== 'пропуск').map(r => r.date));
  for(let d = asOf; d < requested; ){
    const nx = new Date(Date.parse(d) + 86400000).toISOString().slice(0,10);
    d = nx;
    if(d <= requested && ran.indexOf(d) < 0 && !gaps.some(g => g.date === d)) parts.push(fmt(d)+' — прогона не было');
  }
  return parts.join(' · ');
}
/* ИС-11: молчащее расхождение читается как ошибка расчёта и стоит доверия ко всему модулю. */
function divergenceNote(st, objId, asOf){
  if(!ST.isClosed(asOf)) return null;
  const c = st.corrections.filter(x => x.month === ym(asOf) && x.obj === objId);
  if(!c.length) return null;
  return c.map(x => 'есть корректировка за '+monLabel(x.month)+' по '+x.ref+', учтена '+fmt(x.at)+
    ': сегодняшний пересчёт дал бы на '+money(x.delta,'KGS')+' больше · основание: '+x.basis).join(' · ');
}
/* РЕДАКЦИЯ ФОРМЫ В ПАСПОРТЕ (ИС-41, ADR-0207 §6). Обязательным реквизитом она НЕ стала —
   их по-прежнему четыре (ИС-10, ADR-0205 §4): у ответа, целиком собранного действующей
   формой, говорить не о чем, и строка паспорта не удлиняется ни на символ. Зато у ответа,
   который держится на легаси-строках, названы ОБА: сколько их и чего форма легаси НЕ
   СОБИРАЛА из спрошенного. Второе важнее первого — «нет величины» здесь не молчание соседа
   (ИС-42) и не дыра прогона (ИС-12): её не собирали НИКОГДА, и ждать её неоткуда.
   Отдельной строкой — ОХВАТ: роль режет разрезом, который форма легаси могла не знать
   вовсе. Тогда легаси-строки не проходят фильтр роли ни одной, и аналитик получил бы пустое
   прошлое вместо своего — не отказ и не деградация, а НЕВЕРНЫЙ ответ с верным паспортом
   (та же болезнь, что СС-133). Исключение НАЗЫВАЕТСЯ (ADR-0175 §2), а не молчит.          */
function editionNote(st, objId, res, rows, inds, dims){
  const form = LEGACY.form[objId];
  if(!form) return null;
  const parts = [];
  const leg = (rows || []).filter(isLegacyRow);
  if(leg.length){
    /* `'*'` — список строк и выгрузка (тот же признак, что у датировки): там видна ВСЯ
       строка, и перечислять недостачу поимённо значило бы напечатать полсотни имён. Она
       называется ЧИСЛОМ — тем же приёмом, которым восьмой шов называет скрытое областью
       видимости (ADR-0181 §5): «6 из 62» проверяемо, «часть величин» — нет. */
    const o = OBJ(objId), all = dims === '*';
    const miss = all ? [] : legacyMissing(objId, (dims || []).concat(inds || []));
    parts.push('редакция формы — «'+FORM.LEGACY+'»: строк '+leg.length+' из '+rows.length+
      ' (выпуск: '+st.legacy.by+', '+fmt(st.legacy.at)+', '+st.legacy.act+')'+
      (miss.length ? '. Форма легаси НЕ СОБИРАЛА: '+
        miss.map(id => '«'+((REC(id) || {}).name || id)+'»').join(', ')+
        ' — отсутствующее пришло ОТСУТСТВУЮЩИМ, а не нулём и не вчерашним (ADR-0207 §2)' : '')+
      (all && o ? '. Форма легаси собирала '+(form.dims.length + form.inds.length)+
        ' величин из '+(o.dims.length + o.inds.length)+', объявленных объектом сегодня: '+
        'остальные ОТСУТСТВУЮТ КЛЮЧОМ, а не лежат нулём (ADR-0207 §2)' : ''));
  }
  const s = ST.scopeOf(objId);
  if(s && s.dim && form.dims.indexOf(s.dim) < 0){
    const n = st.rows.filter(r => r.obj === objId && isLegacyRow(r) && r.date === res.asOf).length;
    if(n) parts.push('под ролью «'+ST.state.role+'» легаси-строк не видно НИ ОДНОЙ (их '+n+
      ' на эту дату): охват режется разрезом «'+((REC(s.dim) || {}).name || s.dim)+
      '», а форма легаси его не собирала — исключение названо, а не скрыто (ADR-0175 §2, ADR-0207 §2)');
  }
  return parts.length ? parts.join(' · ') : null;
}
/* «Состав» — то, что было СПРОШЕНО: разрезы по порядку с их уровнем/корзиной (и осью,
   когда её имеет смысл называть — матрица), затем показатели. Печатает то, чего на
   скриншоте не прочесть; в краткую форму не входит (см. довод у shortPassport, Q6/Q24). */
function compositionText(dims, inds, meta){
  if(!Array.isArray(dims) || !dims.length) return null;
  meta = meta || {};
  const levels = meta.levels || {}, buckets = meta.buckets || {}, colDim = meta.colDim;
  const dimPart = dims.map(d => {
    const D = DIM(d); if(!D) return d;
    let label = '«'+D.name+'»';
    if(D.levels && levels[d]){ const L = D.levels[levels[d]-1]; if(L) label += ' ('+L.name+')'; }
    if(buckets[d]) label += ' ('+buckets[d]+')';
    if(colDim && d === colDim) label += ' (в колонках)';
    return label;
  }).join(' · ');
  const indPart = (inds || []).filter(id => id && id !== '*')
    .map(id => { const I = IND(id); return I ? '«'+I.name+'»' : id; }).join(', ');
  return dimPart + (indPart ? ' — '+indPart : '');
}
function passportFor(st, objId, requested, res, rows, filter, inds, dims, meta){
  /* Фамилия и дата фиксации берутся из ЗАЩЁЛКИ ПЕРИОДА ОТВЕТА, а не из строк ответа — по
     тому же доводу, что и само слово «зафиксировано» (ADR-0216, границы: «в каком
     состоянии период» — реквизит, отдельный от «кто ответил»). Прежний счёт по первой
     попавшейся строке с признаком был верен, пока ответ собирался строками своей даты;
     разрежённое хранение (ИС-45) развело их, и ответ на 31 мая, собранный апрельскими
     строками, подписался бы АПРЕЛЬСКИМ закрывающим — фамилия и дата чужого месяца под
     майским числом. У открытого периода защёлки нет, и подписи нет тоже: подписывать
     человека под числом, которое изменится сегодня ночью, нельзя (ИС-9). */
  const lt = latchFor(st, res.asOf);
  return {
    requested, asOf: res.asOf, age: res.age, substituted: res.substituted,
    fixation: fixationOf(st, res.asOf),
    fixedBy: lt ? lt.by : null,
    fixedAt: lt ? lt.at : null,
    dating: datingNote(rows, dims, inds, res.asOf),
    dense: rows.filter(r => r.date === res.asOf).length,
    carried: rows.filter(r => r.date < res.asOf).length,
    density: densityNote(rows, res.asOf),
    partial: partialNote(rows),
    scope: scopeText(objId, rows.length),
    scoped: !!(ST.scopeOf(objId) || {}).dim,
    filter: filterText(filter),
    composition: compositionText(dims, inds, meta),
    n: rows.length,
    skipped: skipNote(st, requested, res.asOf),
    divergence: divergenceNote(st, objId, res.asOf),
    edition: res.edition || FORM.NOW,
    editionNote: editionNote(st, objId, res, rows, inds, dims),
    dedup: dedupNote(inds, rows)
  };
}
/* Форм паспорта ровно ДВЕ, и обе объявляет производитель (врезка ADR-0152 §2).
   Третьей, придуманной потребителем, не существует: иначе три модуля сократят
   по-разному и «числа без даты не остаётся» станет непроверяемым (ИС-24). */
function shortPassport(p){
  if(!p) return null;
  const fx = p.fixation === 'зафиксировано' ? 'зафикс.'
           : p.fixation === 'смешанно' ? 'фикс. смешанно' : 'не зафикс.';
  /* «Вам видно» говорится про ЭТОТ ответ, а не про роль вообще: на объекте, объявленном
     общим, роль не сузила ничего, и «вам видно 5» там было бы неправдой (ИС-37). */
  const seen = p.scoped ? 'вам видно ' : 'всего ';
  /* Неполнота попадает и в КРАТКУЮ форму, и только когда она есть. Формы по-прежнему две
     (ИС-24), третьей не завелось — но потребитель, читающий краткую, иначе не узнал бы о
     недостаче вовсе, а именно он ставит число в отчёт. В норме строка не удлиняется ни на
     символ: сокращать нечего, пока сокращать нечего (ADR-0208 §6). */
  /* Датировка попадает в КРАТКУЮ форму по тому же доводу, что и неполнота, и с тем же
     условием: только когда есть о чём говорить. Именно краткая едет под числом плитки
     (ADR-0205 §4 — «плитка печатает»), и потребитель, читающий её, иначе не узнал бы, что
     половина ответа собрана сегодняшними реквизитами. В норме строка не длиннее ни на
     символ. Форм по-прежнему две (ИС-24). */
  const dt = p.dating && p.dating.now.length ? ' · ТЕКУЩЕЕ '+p.dating.now.length : '';
  /* Редакция формы — тем же условием и по тому же доводу: под числом плитки едет КРАТКАЯ
     (ADR-0205 §4), и потребитель, читающий её, иначе не узнал бы, что ответ собран формой
     старой системы. Здесь это опаснее неполноты: недостача легаси не выглядит недостачей —
     свод по несобиравшейся величине даёт РОВНЫЙ НОЛЬ, и он правдоподобен (ADR-0207 §2, §6).
     В норме строка не длиннее ни на символ, и форм по-прежнему две (ИС-24). */
  const ed = p.edition && p.edition !== FORM.NOW ? ' · ФОРМА '+p.edition.toUpperCase() : '';
  return 'на '+fmt(p.asOf).slice(0,5)+' ('+ageWord(p.age)+') · '+fx+ed+
    (p.partial ? ' · НЕПОЛНО '+p.partial.n : '')+dt+' · '+seen+(p.n == null ? '—' : p.n);
}
ST.passportShort = shortPassport;
ST.passportForms = () => ['полная','краткая'];
/* Паспорт — не опция: без ЧЕТЫРЁХ обязательных полей ответ не отдаётся (ИС-10, пополнен
   ADR-0205 §4). Четвёртый — датировка величин, и проверяется он наравне с тремя: реквизит,
   который можно не назвать, через полгода не называют нигде. */
function emit(payload, p){
  const missing = [];
  if(!p || !p.asOf) missing.push('дата расчёта');
  if(!p || !p.fixation) missing.push('признак фиксации');
  if(!p || !p.scope) missing.push('область видимости');
  if(!p || !p.dating) missing.push('датировка величин');
  if(missing.length) return {ok:false, why:'ответ без паспорта не отдаётся: не назван'+
    (missing.length > 1 ? 'ы' : '')+' '+missing.join(', ')+' (ИС-10)'};
  /* Состояние ответа выводится ЗДЕСЬ, в единственной двери ответа, а не в сборщике паспорта:
     ряд переписывает признак фиксации ПОСЛЕ сборки (`mixFixation`), и состояние, выведенное
     раньше, разъехалось бы с ним — ряд через закрытие объявил бы себя окончательным
     (ADR-0216 §1). */
  p.mode = modeOf(p.fixation);
  p.short = shortPassport(p);                              /* краткая форма — тоже паспорт */
  return Object.assign({ok:true, passport:p}, payload);
}
ST.emit = emit;

/* ------------------------- ПРЕДСТАВЛЕНИЕ ---------------------------- *
   Доли и дельты считаются ЗДЕСЬ, при показе, и не хранятся нигде (ИС-15). Доля
   просрочки меняется в процентных пунктах (P10-R6).
   Сомовая величина отсюда УШЛА и сюда больше не относится: ADR-0214 ОТМЕНИЛ её
   разбор как представления (ADR-0151 §2, ADR-0150 §4 и ADR-0147 §6 в этой части).
   Она — полноправная запись реестра со своим именем и своей колонкой замороженной
   строки (ИС-44), и считает её ядро одним объявленным пересчётом (`CORE.toSom`).
   Довод «хранимая производная разъезжается с основанием» на ней не работает:
   основание — соседние колонки ТОЙ ЖЕ замороженной строки, и разъезжаться ей не с
   чем. У доли и «процента от» основание живёт в другой строке или в другом ответе,
   и потому запрет представления на них остался целиком.                          */
/* Состав клетки в одном виде: у одновалютной он из одной части, у портфельной — из
   скольких угодно. Ниже всё считается по частям, и разновалютность перестаёт быть
   особым случаем (ADR-0184 §3). */
const partsOf = c => !c ? [] : (c.parts && c.parts.length
  ? c.parts.filter(p => p.value != null).map(p => ({cur: p.cur, v: p.value, rate: p.rate, rateDate: p.rateDate}))
  : (c.v != null ? [{cur: c.cur, v: c.v, rate: c.rate, rateDate: c.rateDate}] : []));
ST.partsOf = partsOf;
/* Сомовой величины показ больше не выводит: он её ЧИТАЕТ из колонки строки по адресу
   близнеца (ИС-44). Прежний `ST.somOf` — умножение при показе — отменён вместе с
   ADR-0151 §2: он был четвёртым местом, где округляли по-своему. */
ST.somCell = (row, indId) => {
  const t = ST.somIdOf(indId);
  return t && row && row.inds ? (row.inds[t] || null) : null;
};
ST.somValue = (row, indId) => { const c = ST.somCell(row, indId); return c ? c.v : null; };
ST.shareOf = (part, whole) => whole ? Math.round(part / whole * 1000)/10 : null;
ST.pointsBetween = (a, b) => Math.round((b - a) * 10)/10;

/* ------------------------- ДЕДУП-КЛЮЧ ПОКАЗАТЕЛЯ ---------------------
 *  ИС-34, ADR-0199. У величины, чьи строки пересекаются по ЧУЖОМУ ключу, объявлен разрез,
 *  по которому она считается один раз. Схлопывание идёт ПЕРЕД агрегатом и на КАЖДОМ узле
 *  дерева — потому сумма групп итогу не равна, и это не расхождение, а устройство: один
 *  кредит попадает и в филиал заёмщика, и в филиал поручителя, а денег вдвое не становится.
 *  Представителем ключа берётся НАИБОЛЬШАЯ величина: солидарные требования — проекции
 *  одного долга (ADR-0004), и складывать часть с целым значит посчитать часть дважды.
 *  Строка без ключа не схлопывается ни с чем и считается сама по себе: пустое — не ноль и
 *  не «тот же ключ» (ИС-19). Паспорт ответа ключ НАЗЫВАЕТ — молча расходиться нельзя.
 * =================================================================== */
function repOf(over, r){
  const som = ST.somIdOf(over.id);
  const c = som ? r.inds[som] : r.inds[over.id];
  return (c && c.v != null) ? c.v : 0;
}
function dedupRows(over, rows){
  const key = over && over.dedupBy;
  if(!key) return {rows, keys: null, dropped: 0, keyless: 0};
  const best = new Map(), loose = [];
  let dropped = 0;
  rows.forEach(r => {
    const k = r.dims[key];
    if(k == null){ loose.push(r); return; }
    const cur = best.get(k);
    if(!cur){ best.set(k, r); return; }
    dropped++;
    /* Сравниваются СОМОВЫЕ колонки, если они есть: у солидарной пары требования могут
       быть в разных валютах, и «наибольшая» без общей меры не определена вовсе (ИС-44). */
    if(repOf(over, r) > repOf(over, cur)) best.set(k, r);
  });
  return {rows: [...best.values()].concat(loose), keys: best.size + loose.length,
          dropped, keyless: loose.length};
}
ST.dedupRows = dedupRows;
/* Паспорт называет ключ поимённо: сколько строк схлопнулось в сколько ключей. Без этой
   строки ответ «сумма меньше, чем сумма строк» читался бы как ошибка счёта (ИС-10). */
function dedupNote(inds, rows){
  const out = [];
  (inds || []).forEach(id => {
    const I = IND(id);
    if(!I) return;
    const over = I.src === 'агрегат' ? IND(I.over) : I;
    if(!over || !over.dedupBy || out.some(x => x.ind === over.id)) return;
    const dd = dedupRows(over, rows), D = DIM(over.dedupBy);
    out.push({ind: over.id, by: over.dedupBy, rows: rows.length, keys: dd.keys,
      dropped: dd.dropped, keyless: dd.keyless,
      text: '«'+over.name+'» считается один раз на «'+(D ? D.name : over.dedupBy)+'»: строк '+
        rows.length+', ключей '+dd.keys+(dd.dropped ? ', схлопнуто '+dd.dropped : '')+
        (dd.keyless ? ', без ключа '+dd.keyless : '')+
        '. Сумма строк итогу не равна — и не должна (ИС-34)'});
  });
  return out.length ? out : null;
}

/* --------------------------- АГРЕГАТЫ ------------------------------- */
function aggValue(indId, rows){
  const I = IND(indId);
  if(!I) return null;
  if(I.src !== 'агрегат') return null;
  if(!AGG_FNS[I.fn]) return null;
  if(I.fn === 'count') return {v: rows.length, kind:'число'};
  const over = IND(I.over);
  if(!over) return null;
  /* Дедуп применяется здесь и только здесь: строка своей полной суммы не теряет, теряет её
     ИТОГ — ровно как требует норма (ТЗ 13 разд. 3). */
  const dd = dedupRows(over, rows);
  rows = dd.rows;
  const mark = v => (dd.keys == null || !v) ? v : Object.assign(v,
    {dedup: {by: over.dedupBy, keys: dd.keys, dropped: dd.dropped, keyless: dd.keyless}});
  /* ВЫБОР ИЗ ПУСТОГО — НЕ НОЛЬ (ИС-19, СС-Д13, волна 12). max/min/avg не складывают, а
     ВЫБИРАЮТ из набора значений; когда выбирать не из чего, ответа нет, и «0» на его месте
     — утверждение, которого никто не делал: «наибольший срок с направления 0 дн.» читается
     как «сегодня направили», хотя направления не было вовсе. Мера, которой вручать нечего
     (иск, ИЛ, реализация залога), дала первую такую группу — до волны 12 пустых наборов в
     макете не возникало. Пустая клетка рисуется прочерком, и это ответ (ИС-24). Сумма и
     количество остаются нулём: сложить ничего — законно, а сосчитать строки можно всегда. */
  const EMPTY_IS_NOT_ZERO = ['max','min','avg'];
  if(!over.money){
    const cells = rows.map(r => r.inds[I.over]).filter(c => c && c.v != null);
    if(!cells.length && EMPTY_IS_NOT_ZERO.indexOf(I.fn) >= 0) return null;
    return mark({v: Math.round(AGG_FNS[I.fn].apply(cells.map(c => c.v))*10)/10, kind:'число', unit: over.unit});
  }
  /* Деньги агрегируются ПО ЧАСТЯМ, а не по клеткам: у портфельной клетки частей
     несколько, и «сумма долларовых частей» — единственное честное слагаемое. Клетка без
     состава ведёт себя как состав из одной части, поэтому кредит считается как прежде. */
  const cells = rows.map(r => r.inds[I.over]).filter(c => partsOf(c).length);
  const parts = cells.reduce((a, c) => a.concat(partsOf(c)), []);
  if(!parts.length && EMPTY_IS_NOT_ZERO.indexOf(I.fn) >= 0) return null;
  const curs = uniq(parts.map(p => p.cur));
  const rd = parts.length ? parts.map(p => p.rateDate).sort().slice(-1)[0] : null;
  if(curs.length <= 1){
    const cur = curs[0] || 'KGS';
    /* Однородное множество валютный показатель складывает и отвечает В СВОЕЙ ВАЛЮТЕ:
       формульный свод запрещает не сложение, а сложение ЧЕРЕЗ границу разреза (§1).
       Округление — ЕДИНОЕ, ядра, объявленное один раз и одно на всю систему и на все
       отчёты (ADR-0214 §6): своего `Math.round` у витрины больше нет ни одного, а правило
       СПРАШИВАЕТСЯ У ЗАПИСИ — агрегат наследует его от показателя-основания. */
    return mark({v: CORE.somRound(AGG_FNS[I.fn].apply(parts.map(p => p.v)), roundOf(I)), cur,
      kind:'сумма', rateDate: rd, round: roundOf(I)});
  }
  /* ---- СВОД ВАЛЮТНОГО ПОКАЗАТЕЛЯ ПО РАЗНОВАЛЮТНОМУ МНОЖЕСТВУ — ОТКАЗ (ИС-44) ----
     ADR-0214 §1. До волны 17 здесь выдавалось правдоподобное число: части молча
     умножались на курс и складывались, и «Сумма остатка ОД» по портфелю оказывалась
     сомовой величиной под валютным именем — имя врало (ИС-40). Теперь отказ, и он
     называет ТРИ вещи: причину (множество разновалютное), СОСТАВ (ADR-0151 §4 в силе
     целиком — смешанный итог по-прежнему называет, из чего он) и АДРЕС — сомовый
     показатель, аддитивный всегда. Отказ ПОКЛЕТОЧНЫЙ: сгруппируй тот же вопрос по
     разрезу валюты — и каждая группа ответит числом, а итог откажет. Это не половина
     ответа, а ровно то, что объявлено реквизитом: аддитивна ВНУТРИ разреза. */
  const by = {};
  curs.forEach(c => { by[c] = CORE.somRound(AGG_FNS[I.fn].apply(parts.filter(p => p.cur === c).map(p => p.v)), roundOf(I)); });
  const RB = DIM(over.rollBy), tw = IND(I.id + SOM_SUFFIX);
  return mark({refused:true, kind:'сумма', v: undefined, cur: null, rateDate: rd, mixed: curs, by,
    note:'множество разновалютное: '+curs.map(c => money(by[c], c)).join(' + '),
    som: tw ? tw.id : null,
    why:'«'+I.name+'» складывается только внутри разреза «'+(RB ? RB.name : over.rollBy)+'»: '+
      'множество разновалютное ('+curs.map(c => money(by[c], c)).join(' + ')+'), и одно число '+
      'здесь было бы суммой долларов с сомами — не итогом, а ошибкой. '+
      (tw ? 'Спросите «'+tw.name+'» — она аддитивна всегда и по этому же множеству отвечает '+
            'одним числом; курс и дата курса лежат в каждой строке рядом с ним. '
          : '')+
      'Либо сгруппируйте по «'+(RB ? RB.name : over.rollBy)+'» — внутри группы ответ есть '+
      '(ИС-44, ADR-0214 §1, §2, ADR-0151 §4)'});
}
ST.aggValue = aggValue;

/* ============================== ШВЫ =================================
 *  Три двери, каждая названа вопросом. Четвёртой нет (ADR-0152 §1).
 * =================================================================== */
function checkQuery(q, needAgg){
  const o = OBJ(q.obj);
  if(!o) return 'объекта «'+q.obj+'» нет в реестре объектов (ИС-18)';
  /* Дата вопроса проверяется ДО разрезов: хвост — отказ, а не подстановка (ИС-36). */
  const tail = dateGate(ST.state, q.obj, q.date);
  if(tail) return tail;
  /* Охват — сразу за датой и по той же причине: спрашивающему, которому объект не
     виден вовсе, объяснять про разрезы значит вести его по двум отказам подряд (ИС-37). */
  const den = scopeGate(q.obj);
  if(den) return den;
  for(const d of (q.dims || [])){
    const D = DIM(d);
    if(!D) return 'разреза «'+d+'» нет в реестре разрезов';
    if(o.dims.indexOf(d) < 0){
      /* Причина первая и главная — ОБЪЕКТ ОПРЕДЕЛЕНИЯ: сложение по разрезу законно только
         внутри его объекта, и срез по чужому разрезу был бы суммой по другому множеству
         под тем же именем (ИС-40, ADR-0206 §3). Сравнение срезов по разнообъектным
         разрезам — операция запрещённая, а не подозрительная, и запрещается она ЗДЕСЬ,
         на входе вопроса: дальше запрещать уже поздно — число уже посчитано.
         Дальше отказ обязан назвать ДОРОГУ, и дорог ровно две, разные:
         · у спрашивающего объекта есть СВОЯ запись того же признака (ИС-40) — ошиблись
           записью, а значения двух записей между собой не складываются;
         · своей записи нет, и разрез уехал на нижележащий объект из-за многозначности
           (ИС-21, ADR-0198) — он не «исчез», он спрашивается там, где значение одно.
         Путать эти два случая нельзя: у них разные лекарства (ADR-0206 «Границы»). */
      const at = (ST.state ? ST.state.objects : OBJECTS).filter(x => x.dims.indexOf(d) >= 0);
      const home = OBJ(D.obj);
      const sib = o.dims.map(DIM).find(x => x && x.src === D.src &&
        (D.src === 'шов' ? x.seam === D.seam && x.field === D.field : x.key === D.key));
      return 'разрез «'+D.name+'» определён на объекте «'+(home ? home.name : D.obj)+
        '», а спрошен у «'+o.name+'»: складывать по разрезу законно только внутри его объекта '+
        'определения, иначе под одним именем сложатся два разных признака (ИС-40, ADR-0206 §3). '+
        (sib ? 'Тот же признак у «'+o.name+'» читается СВОЕЙ записью — «'+sib.name+
               '», и значения этих двух записей между собой не складываются и не сверяются'
             : (at.length ? 'На дату у «'+o.name+'» значений этого признака много — '+
                 'спрашивается он у «'+at.map(x => x.name).join('», «')+'» (ИС-21)' : ''));
    }
    if(D.since > q.date) return 'разрез «'+D.name+'» введён '+fmt(D.since)+
      ' и действует вперёд: прошлое им не размечено (ADR-0147 §4)';
    if(D.buckets && (!q.buckets || D.buckets.indexOf(q.buckets[d]) < 0))
      return 'разрез «'+D.name+'» спрашивается корзиной из объявленных: '+D.buckets.join(' · ')+
        '. Свободной корзины, приходящей мимо реестра, не существует — новая заводится записью (ИС-23, ADR-0176 §2)';
    if(D.levels && q.levels && q.levels[d] != null &&
       (q.levels[d] < 1 || q.levels[d] > D.levels.length))
      return 'у разреза «'+D.name+'» уровней '+D.levels.length+': '+D.levels.map(L => L.name).join(' → ')+
        ' — запрошенного уровня нет (ИС-22, ADR-0176 §4)';
  }
  for(const m of (q.inds || [])){
    const I = IND(m);
    if(!I) return 'показателя «'+m+'» нет в реестре — для витрины его не существует (ИС-7)';
    if(I.obj !== '*' && I.obj !== q.obj) return 'показатель «'+I.name+'» объявлен для другого объекта';
    if(needAgg && I.src !== 'агрегат') return 'в срезе показатель — агрегат: «'+I.name+
      '» строчный, спросите его швом statRows';
  }
  return checkFilterShape(q.filter, q.obj);
}

/* Сколько и на сколько, в таком-то разрезе, на такую-то дату. */
ST.statSlice = q => {
  const st = ST.state;
  const bad = checkQuery(q, true);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = rowsAsOf(st, q.obj, res.asOf);
  rows = applyScope(rows, q.obj);                            /* ДО группировки — ИС-13 */
  const badF = checkFilterDomain(q.filter, rows);            /* отказ ДО счёта — ADR-0180 §8 */
  if(badF) return {ok:false, why: badF};
  rows = applyFilter(rows, q.filter);
  const dims = q.dims || [], inds = q.inds || [];
  /* Форма ответа ОДНА — дерево (ADR-0176 §6). У плоского разреза оно вырождается в
     один уровень, поэтому потребителю не приходится знать двух форм ответа. */
  const hier = dims.length === 1 && DIM(dims[0]) && DIM(dims[0]).levels ? DIM(dims[0]) : null;
  const depth = hier ? Math.min((q.levels && q.levels[hier.id]) || hier.levels.length, hier.levels.length) : 1;
  const node = (key, parts, rws, lvl) => ({
    key, parts, level: lvl, n: rws.length, refs: rws.map(r => r.ref),
    values: inds.reduce((acc, m) => { acc[m] = aggValue(m, rws); return acc; }, {}),
    children: [], own: rws.length
  });
  /* Числа узла считаются ПО СТРОКАМ УЗЛА, а не складыванием детей (ADR-0176 §5): доля
     и среднее неаддитивны, а объект с незаполненным нижним уровнем при сложении исчез бы. */
  function branchAt(rws, lvl){
    const map = new Map();
    rws.forEach(r => {
      const v = r.dims[hier.id];
      const path = Array.isArray(v) ? v : [];
      if(path.length < lvl){ if(lvl > 1) return; }
      const key = path.length ? path.slice(0, lvl).join(' / ') : '—';
      if(!map.has(key)) map.set(key, {key, parts: path.slice(0, lvl), rows: []});
      map.get(key).rows.push(r);
    });
    return [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru',{numeric:true})).map(g => {
      const nd = node(g.key, g.parts, g.rows, lvl);
      if(lvl < depth) nd.children = branchAt(g.rows, lvl + 1);
      nd.own = nd.n - nd.children.reduce((x,c) => x + c.n, 0);
      return nd;
    });
  }
  let groups;
  if(hier) groups = branchAt(rows, 1);
  else {
    const map = new Map();
    rows.forEach(r => {
      const parts = dims.map(d => { const k = dimKey(DIM(d), r.dims[d], q); return k == null ? '—' : k; });
      const key = parts.join(' · ') || 'всего';
      if(!map.has(key)) map.set(key, {key, parts, rows: []});
      map.get(key).rows.push(r);
    });
    groups = [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru',{numeric:true}))
      .map(g => node(g.key, g.parts, g.rows, 1));
  }
  const total = inds.reduce((acc, m) => { acc[m] = aggValue(m, rows); return acc; }, {});
  return emit({groups, tree: groups, dims, inds, total, n: rows.length,
      hier: hier ? {dim: hier.id, levels: hier.levels.map(L => L.name), depth} : null,
      buckets: q.buckets || null},
    passportFor(st, q.obj, q.date, res, rows, q.filter, inds, dims,
      {levels: q.levels, buckets: q.buckets, colDim: q.colDim}));
};
/* Узел ищется по всему дереву: детализация родителя обязана открываться так же,
   как детализация листа. */
ST.findNode = (groups, key) => {
  for(const g of (groups || [])){
    if(g.key === key) return g;
    const hit = ST.findNode(g.children, key);
    if(hit) return hit;
  }
  return null;
};

/* Полное k-уровневое дерево НЕСКОЛЬКИХ строчных разрезов ОДНОВРЕМЕННО с колоночным
   разрезом (грунт Q17) — тот же конвейер извлечения строк, что statSlice (checkQuery/
   scope/filter, ИС-13), но узел копит не только своё totals, а ещё и разбивку по
   колонке (byCol) от СВОИХ строк, одним проходом — без «2k+1 вызовов» и без утечки
   строк наружу: наружу уходят только агрегаты (тот же контракт, что у statSlice).
   statSlice не трогается — у него много других вызывающих мест в файле. */
ST.mxTree = q => {
  const st = ST.state;
  const dims = q.dims || [], colDim = q.colDim || null, inds = q.inds || [];
  const checkDims = colDim ? dims.concat([colDim]) : dims;
  const bad = checkQuery(Object.assign({}, q, {dims: checkDims}), true);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = rowsAsOf(st, q.obj, res.asOf);
  rows = applyScope(rows, q.obj);                            /* ДО группировки — ИС-13 */
  const badF = checkFilterDomain(q.filter, rows);            /* отказ ДО счёта — ADR-0180 §8 */
  if(badF) return {ok:false, why: badF};
  rows = applyFilter(rows, q.filter);

  function agg(rws){
    return {n: rws.length, refs: rws.map(r => r.ref),
      values: inds.reduce((acc, m) => { acc[m] = aggValue(m, rws); return acc; }, {})};
  }
  function byColAt(rws){
    if(!colDim) return null;
    const map = new Map();
    rws.forEach(r => {
      const k = dimKey(DIM(colDim), r.dims[colDim], q), key = k == null ? '—' : k;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    const out = {};
    map.forEach((rs, key) => { out[key] = agg(rs); });
    return out;
  }
  /* Числа узла — по строкам узла, не суммой детей (ADR-0176 §5), как у branchAt.
     parts — путь предков (как у branchAt), нужен подписи узла и заголовку раскрытия. */
  function build(rws, ds, path){
    const map = new Map();
    rws.forEach(r => {
      const k = dimKey(DIM(ds[0]), r.dims[ds[0]], q), key = k == null ? '—' : k;
      if(!map.has(key)) map.set(key, []);
      map.get(key).push(r);
    });
    return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0],'ru',{numeric:true}))
      .map(([key, rs]) => { const parts = path.concat([key]); return Object.assign({key, parts}, agg(rs),
        {byCol: byColAt(rs), children: ds.length > 1 ? build(rs, ds.slice(1), parts) : []}); });
  }
  const groups = dims.length ? build(rows, dims, []) : [];
  const total = agg(rows);
  /* Полный домен колонок — по всем строкам объекта, не только внутри раскрытой ветки
     строк, иначе шапка «прыгала» бы при сворачивании узлов. */
  const colKeys = colDim ? [...new Set(rows.map(r => {
    const k = dimKey(DIM(colDim), r.dims[colDim], q); return k == null ? '—' : k;
  }))].sort((a,b) => a.localeCompare(b,'ru',{numeric:true})) : [];
  return emit({groups, dims, inds, colDim, colKeys, total: total.values, totalByCol: byColAt(rows), n: rows.length},
    passportFor(st, q.obj, q.date, res, rows, q.filter, inds, dims,
      {levels: q.levels, buckets: q.buckets, colDim: q.colDim}));
};

/* Как это менялось. */
ST.statSeries = q => {
  const st = ST.state;
  const dates = (q.dates || []).slice().sort();
  if(!dates.length) return {ok:false, why:'ряд без дат не строится'};
  const bad = checkQuery({obj:q.obj, dims:[], inds:[q.inds], date: dates[dates.length-1],
    filter: q.filter}, true);
  if(bad) return {ok:false, why: bad};
  /* Домен ряда меряется по ПОСЛЕДНЕЙ точке: отказ обязан быть один на ряд, иначе
     четыре точки дали бы четыре разных вердикта одному и тому же фильтру. */
  const lastAt = resolveAsOf(st, q.obj, dates[dates.length-1]);
  const badF = lastAt ? checkFilterDomain(q.filter, applyScope(rowsAsOf(st, q.obj, lastAt.asOf), q.obj)) : null;
  if(badF) return {ok:false, why: badF};
  /* СОСТАВ ряда — это МНОЖЕСТВО записей, попавших хоть в одну точку, а не сумма точек.
     Складывать точки нельзя: при переносе вперёд одна и та же июньская строка входит в
     каждую из четырёх точек, и ряд отчитался бы «по всем объектам «Платёж» системы: 40»
     там, где платежей четырнадцать. Берётся ПОСЛЕДНЯЯ строка записи по ходу ряда — та,
     что видна в самой поздней точке. */
  const points = [], seen = new Map();
  for(const d of dates){
    const res = resolveAsOf(st, q.obj, d);
    if(!res){ points.push({date:d, empty:true, why:'строк на '+fmt(d)+' и ранее нет (ИС-12)'}); continue; }
    let rows = applyFilter(applyScope(rowsAsOf(st, q.obj, res.asOf), q.obj), q.filter);
    rows.forEach(r => seen.set(r.ref, r));
    points.push({date:d, asOf:res.asOf, age:res.age, substituted:res.substituted,
      /* Редакция формы — реквизит ТОЧКИ, а не ряда: ряд через запуск состоит из точек
         разных редакций, и назвать это одним словом на весь ряд нельзя (ИС-41, ADR-0207 §6). */
      edition: res.edition,
      fixation: fixationOf(st, res.asOf), n: rows.length, value: aggValue(q.inds, rows),
      /* Плотность считается У ТОЧКИ, потому что дата ответа у неё своя (ИС-45). */
      dense: rows.filter(r => r.date === res.asOf).length,
      carried: rows.filter(r => r.date < res.asOf).length,
      density: densityNote(rows, res.asOf)});
  }
  const last = resolveAsOf(st, q.obj, dates[dates.length-1]);
  const p = passportFor(st, q.obj, dates[dates.length-1], last,
                        Array.from(seen.values()), q.filter, [q.inds]);
  /* Паспорт РЯДА собирается из точек, а не из последней даты: ряд, начатый в закрытом мае
     и кончившийся в открытом августе, зафиксирован наполовину, и сказать это обязан он. */
  p.fixation = mixFixation(points.map(pt => pt.fixation));
  p.range = fmt(dates[0])+' — '+fmt(dates[dates.length-1]);
  /* А вот ПЛОТНОСТЬ ряда не бывает: она свойство ОДНОЙ отвеченной даты, и суммировать её
     по точкам нельзя. Даже по множеству записей выше она не считается: у каждой записи
     своя дата последнего изменения, и «свежая» она или «перенесена» — вопрос К ТОЧКЕ.
     Ряд из четырёх точек отчитался бы «строк 32, не менялось — 24» там, где кредитов
     восемь и все восемь на последнюю дату свежие. Хуже, чем бесполезно: цифра выглядит
     измеренной. Плотность едет В ТОЧКАХ, каждая про свою дату (ИС-45, ADR-0215 §2), и
     экран показывает её рядом с числом точки. */
  p.dense = null; p.carried = null; p.density = null;
  /* §6: СМЕШАННЫЙ РЯД НАЗЫВАЕТ СОСТАВ — та же фигура, что у разновалютной клетки
     (ADR-0151 §4): не молчит, не отказывает, а говорит, из чего собран. Ряд, идущий через
     запуск, сравнивает числа, собранные РАЗНЫМИ ФОРМАМИ, и молчащий об этом ряд выглядит
     однородным ровно там, где он однородным не является. */
  const eds = uniq(points.filter(pt => !pt.empty).map(pt => pt.edition));
  const legMiss = eds.indexOf(FORM.LEGACY) >= 0 ? legacyMissing(q.obj, [q.inds]) : [];
  p.editions = eds.length > 1 ? {list: eds, launch: LAUNCH,
    text:'ряд идёт ЧЕРЕЗ ЗАПУСК '+fmt(LAUNCH)+': редакции формы в нём разные — '+
      eds.join(' и ')+'. Точки по разные стороны собраны разными системами и разными '+
      'перечнями величин; сопоставлять их можно, считать разницу между ними — вопрос к '+
      'получателю, а не к статистике (ИС-41, ADR-0207 §6)'} : null;
  /* Отметку на СТЫК ставит статистика, а ИЗМЕНЕНИЕ между точками не считает: графа
     изменения живёт у отчётности (ИС-47, ADR-0220 §6, ADR-0218). Модуль отдаёт ей ПОМЕТКУ,
     чтобы графа могла её напечатать, — посчитай он разницу сам, у числа завёлся бы второй
     производитель, и разошлись бы они не там, где ошиблись, а там, где сравнили. */
  for(let i = 1; i < points.length; i++){
    const a = points[i-1], b = points[i];
    if(a.edition && b.edition && a.edition !== b.edition)
      b.editionBreak = 'редакции формы разные: «'+a.edition+'» → «'+b.edition+
        '»'+(legMiss.length ? ', и форма легаси не собирала '+
          legMiss.map(id => '«'+((REC(id) || {}).name || id)+'»').join(', ') : '')+
        ' — изменение между этими точками несопоставимо (ИС-41, ADR-0207 §6)';
  }
  return emit({points, inds:q.inds, editions: eds, legacyMissing: legMiss}, p);
};

/* Порог — параметр ЭКСПЛУАТАЦИИ, а не модели (ADR-0178 §2): в системе он берётся
   замером, здесь намеренно мал, чтобы отказ был виден на четырнадцати погашениях. */
ST.rowsLimit = 12;

/* Строки вопроса, ещё без порога: одна выборка на две двери — список и выгрузку.
   Порог считается ПОСЛЕ ролевых правил (ADR-0178 §3): иначе отказ выдавал бы размер
   чужого множества, а куратор с сорока строками получал бы отказ из-за холдинга. */
function rowsFor(st, q){
  const bad = checkQuery({obj:q.obj, dims:[], inds:[], date:q.date, filter:q.filter}, false);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = applyScope(rowsAsOf(st, q.obj, res.asOf), q.obj);
  const badF = checkFilterDomain(q.filter, rows);
  if(badF) return {ok:false, why: badF};
  rows = applyFilter(rows, q.filter);
  if(q.refs) rows = rows.filter(r => q.refs.indexOf(r.ref) >= 0);
  /* Список и выгрузка отдают строку ЦЕЛИКОМ, поэтому датировка спрашивается обо всём её
     составе, а не о спрошенном: спрошенного состава здесь нет (ADR-0205 §4). */
  return {ok:true, rows, res, p: passportFor(st, q.obj, q.date, res, rows, q.filter, null, '*')};
}

/* Кто именно в этом числе. Карточки, документов и связей шов не отдаёт (ADR-0152 §3.3).
   Ответ ДВОИЧЕН: либо полный список, либо отказ с числом (ИС-22, ADR-0178 §1). Усечения
   и постраничности нет — усечённый список выглядит как полный и молча ломает ИС-14. */
ST.statRows = q => {
  const r = rowsFor(ST.state, q);
  if(!r.ok) return r;
  if(r.rows.length > ST.rowsLimit) return {ok:false, overLimit:true, n: r.rows.length,
    obj: q.obj, date: q.date, limit: ST.rowsLimit, passport: r.p,
    why:'в этом числе '+r.rows.length+' строк, порог показа — '+ST.rowsLimit+
      ': списком не отдаётся. Сузьте вопрос разрезом или возьмите выгрузкой — усечённого '+
      'и постраничного ответа не бывает (ИС-22, ADR-0178 §1)'};
  return emit({rows: r.rows.map(x => clone(x))}, r.p);
};

/* Сверка целиком — не экран, а ЗАДАНИЕ на выгрузку, и паспорт едет ВНУТРИ файла:
   иначе он теряется ровно там, где нужнее всего (ADR-0178 §5, ADR-0152 §граница). */
ST.exportJob = q => {
  const st = ST.state, r = rowsFor(st, q);
  if(!r.ok) return r;
  const job = {id:'ВГ-'+String(st.exports.length + 1).padStart(3,'0'), obj: q.obj, date: q.date,
    n: r.rows.length, by: st.role, at: st.today, state:'в очереди',
    filter: q.filter ? clone(q.filter) : null,
    file:'statRows-'+q.obj+'-'+q.date+'.csv', passport: clone(r.p)};
  st.exports.unshift(job);
  log('оформлена выгрузка '+job.id+': '+OBJ(q.obj).name+', строк — '+job.n);
  return {ok:true, job: clone(job)};
};
ST.exportsList = () => clone(ST.state.exports);

/* Второе действие числа, названное отдельно от первого (врезка ADR-0152 §4):
   «кто в этом числе» — строки среза на дату среза; «работать со списком» — реестр
   владельца на СЕГОДНЯ. Разные списки здесь — это сутки, а не расхождение. */
ST.workList = (objId, sliceDate) => {
  const st = ST.state;
  const o = OBJ(objId);
  if(!o) return {ok:false, why:'объекта «'+objId+'» нет в реестре объектов (ИС-18)'};
  /* Дверь к «как сейчас» стоит под теми же воротами, что и срез. Иначе отказ по охвату
     обходился бы за один шаг: не отдав поступления срезом, макет отдал бы их списком —
     и «нельзя показать целиком» стало бы неправдой в соседней строке (ИС-37, §9). */
  const den = scopeGate(objId);
  if(den) return {ok:false, why: den};
  const today = ST.registryList(objId, st.today, null);
  const res = resolveAsOf(st, objId, sliceDate || st.q.date);
  const inSlice = res ? applyScope(rowsAsOf(st, objId, res.asOf), objId).length : 0;
  return {ok:true, obj: objId, list: today, n: today.length, asOf: res ? res.asOf : null, inSlice,
    note:'в реестре «'+o.owner+'» на сегодня '+today.length+
      (res ? ', в срезе от '+fmt(res.asOf)+' было '+inSlice : '')+
      ' — это сутки, а не расхождение (ИС-14, врезка ADR-0152 §4)'};
};

/* ИС-14: тот же человек в реестре владельца обязан увидеть тот же список. Список
   строится независимо — из множества владельца, а не из строк среза. */
ST.registryList = (objId, dateISO, filter) => {
  const s = ST.scopeOf(objId);
  const o = OBJ(objId);
  return (WORLD[objId] || []).filter(item => {
    /* Реестр владельца НА ДАТУ не показывает того, чего на неё ещё не было: иначе
       сверка состава со срезом разошлась бы на ненаступившее (ИС-14, ИС-33). */
    const born = bornOn(o, item, dateISO);
    if(born == null || born > dateISO) return false;
    /* Охват читается ТЕМ ЖЕ читателем, что разрез (ИС-18, ИС-37). До волны 15 здесь
       стояло «item.h.curator» — второй читатель того же самого, и он не знал ни швов,
       ни полей: у заёмщика ведущий куратор приходит ШВОМ, истории «curator» у него нет
       вовсе, и дорога, которую называет отказ, отвечала спрашивающему НОЛЬ (СС-134). */
    if(s && s.denied) return false;      /* дверь — workList, и она отказывает вслух */
    if(s && readDim(s.dim, item, dateISO) !== s.value) return false;
    /* Фильтр списку и фильтр числу — ОДНО сравнение над разными источниками: у среза
       строка, у владельца запись на дату. Двух правил здесь не бывает (ИС-14, ИС-18). */
    return matchFilter(filter, {dim: id => readDim(id, item, dateISO),
                                ind: id => readInd(id, item, dateISO)});
  }).map(item => item.id).sort();
};

/* ====== АДРЕСОВ РОВНО ДВА, И ТРЕТЬЕГО НЕТ (ИС-51, ADR-0222) ====== *
   Пока потребителем была одна отчётность, «у кого спрашивать» решалось её собственным
   правилом. Волна 16 завела дашборд и задания, рядом стоял анализ — и у ЧЕТЫРЁХ модулей
   перед глазами оказалось ТРИ двери к одному и тому же числу: шов ядра (`ИЯ-17` прямо
   разрешает ему портфельный вопрос), `objectRows` (живые строки, из которых сумму можно
   сложить снаружи) и срез. Все три отдают «сумму долга по портфелю». Три двери к одному
   числу — это `E2E-09` дословно: расхождение появится не там, где ошиблись, а там, где
   сравнили.
   Правило: ЧИСЛО, ПРИВЯЗАННОЕ К ДАТЕ, — ТОЛЬКО У СТАТИСТИКИ; ЖИВОЙ РЕКВИЗИТ — ТОЛЬКО У
   `objectRows` ВЛАДЕЛЬЦА. Даже если то же число умеет посчитать ядро: ядро ВЫВОДИТ,
   статистика ДАТИРУЕТ (ADR-0145), и потребитель разговаривает с датирующим слоем.
   Шов ядра при этом никуда не девается — у него меняется КРУГ ВЫЗЫВАЮЩИХ (§4): им
   пользуется статистика, снимая срез, и учётный контур. Верхний ярус к нему не ходит не
   потому, что шов плох, а потому, что второй путь к тем же числам расходится с первым.  */
const ADDRESS = {STAT:'статистика — число на дату', ROWS:'objectRows владельца — живой реквизит'};
const ADDRESSES = [ADDRESS.STAT, ADDRESS.ROWS];
ST.ADDRESS = ADDRESS;
ST.addresses = () => ADDRESSES.slice();
/* Счётчик обращений к восьмому шву — отдельный от `CORE.calls`. Разделены они нарочно:
   весь довод ИС-51 в том, что у датированной половины ответа обращений к ядру НОЛЬ (она
   читает написанную строку), а у живой они есть, — и одним счётчиком это не показать. */
ST.objectRowCalls = () => CORE.rowCalls;
ST.resetObjectRowCalls = () => { CORE.rowCalls = 0; };
ST.cardFields = objId => clone((CARD[objId] || {fields:[]}).fields);
ST.cardOwner  = objId => (CARD[objId] || {}).owner || null;
/* Пары «датированная сторона ↔ живая»: у одной вещи их две, и это НЕ два адреса одного
   числа, а два РАЗНЫХ вопроса с разными ответами. Область в майском срезе — та, что была
   в мае (ИС-4); область в карточке — та, что сейчас. Оба ответа верны, и путать их
   нельзя (ADR-0222 §3). */
ST.twins = objId => (CARD[objId] || {fields:[]}).fields.map(f => ({
  card: f.id, name: f.name, twin: f.twin || null,
  twinName: f.twin && REC(f.twin) ? REC(f.twin).name : null,
  twinKind: f.twin && REC(f.twin) ? REC(f.twin).kind : null}));
/* Шов соседа, названный потребителем адресом. Ловится по объявленному списку швов
   (`NEIGHBOURS`), а не по виду строки: имя шва — объявленная вещь (ИС-42, ADR-0208 §2). */
const seamNamed = word => {
  const w = String(word || '').replace(/^шов:/, '').split('.')[0];
  return NEIGHBOURS.some(nb => nb.seams.indexOf(w) >= 0) ? w : null;
};
/* У КОГО ЭТО СПРАШИВАТЬ. Дверь читает и не пишет; отвечает она ОДНИМ адресом на ОДИН
   вопрос — либо отказывает, называя дорогу (§8.4). */
ST.where = (id, objId) => {
  const obj = objId || (ST.state && ST.state.q ? ST.state.q.obj : null);
  const R = REC(id);
  if(R) return {ok:true, id, address: ADDRESS.STAT, name: R.name, kind: R.kind,
    what:'число на дату',
    why:'запись реестра статистики: ядро выводит, статистика датирует, и потребитель '+
      'разговаривает с датирующим слоем (ИС-51, ADR-0222 §1, ADR-0145)'};
  const f = obj ? CARD_F(obj, id) : null;
  if(f) return {ok:true, id, address: ADDRESS.ROWS, name: f.name, kind:'реквизит карточки',
    what:'живой реквизит', owner: ST.cardOwner(obj), twin: f.twin || null,
    why:'реквизит объявленного перечня полей владельца «'+ST.cardOwner(obj)+'»: свойство '+
      'КАРТОЧКИ, а не среза — у него нет даты вовсе (ИС-51, ADR-0222 §2, ADR-0181 §2)'};
  /* Карточный реквизит у объекта, чей владелец перечня не объявил: адреса нет, и это
     говорится теми же словами, что и у шва (иначе запретов стало бы два). */
  const o = obj ? OBJ(obj) : null;
  if(o && !CARD[obj] && /^к-/.test(String(id))) return {ok:false, id, noCard:true,
    why: noCardWhy(o),
    road:'датированную сторону спросите срезом — этот адрес у объекта есть'};
  const seam = seamNamed(id);
  if(seam) return {ok:false, id, seam,
    why:'шов «'+seam+'» потребителю НЕ АДРЕС. Он не отменён и не плох: им снимает срез '+
      'статистика и пользуется учётный контур, — но второй путь к тем же числам расходится '+
      'с первым, и разойдётся он не там, где ошиблись, а там, где сравнили (ИС-51, '+
      'ADR-0222 §4, E2E-09)',
    road:'то же число спрашивается СРЕЗОМ: ядро выводит, статистика датирует (ADR-0145)'};
  return {ok:false, id,
    why:'величины «'+id+'» нет ни в реестре статистики, ни в объявленном перечне полей '+
      'карточки: показателя вне реестра не существует ни для кого (ИС-7)',
    road:'нужного числа нет — заводится ЗАПИСЬ РЕЕСТРА (ADR-0150 §6), а не обходной путь '+
      'у потребителя. Отказ называет адрес, а не «нет данных» (ADR-0222 §5)'};
};
/* Дверь статистики НА ВОСЬМОЙ ШОВ: часы модуля подставляются здесь, чтобы экран и сторож
   ходили одной дорогой. Своего перечисления объектов статистика не заводит — она тут
