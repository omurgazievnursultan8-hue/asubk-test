ST.scopeErrors = objects => scopeErrors(objects || ST.state.objects, ST.state.registry);
ST.scopeShapeBad = scopeShapeBad;
/* Охват объекта под ролью: null — роль не сужает (администратор, либо объект общий), иначе {rules, value} — правила объекта и значение роли. */
ST.scopeOf = objId => {
  const c = ST.curatorOf();
  if(!c) return null;
  const o = OBJ(objId || (ST.state.q && ST.state.q.obj));
  if(!o) return null;
  if(o.scope.some(r => r.kind === 'open')) return null;
  return {rules: o.scope, value: c, obj: o.id};
};
/* Тот же охват над ЗАПИСЬЮ владельца, а не над строкой: реестр владельца и карточка режутся теми же правилами и тем же читателем, что и срез. */
function seesItem(objId, item, dateISO, s){
  const o = OBJ(objId);
  return s.rules.some(r => {
    if(r.kind === 'own') return readDim(r.dim, item, dateISO) === s.value;
    const t = OBJ(r.obj), list = WORLD[r.obj] || [];
    const vis = x => t.scope.some(q => q.kind === 'open') || seesItem(r.obj, x, dateISO, {rules: t.scope, value: s.value});
    if(r.key === 'target') return [].concat(item.f[o.targets] || []).some(id => { const x = list.find(w => w.id === id); return !!x && vis(x); });
    if((DIM(r.key) || {}).obj === r.obj) return list.some(x => readDim(r.key, x, dateISO) === item.id && vis(x));
    const x = list.find(w => w.id === readDim(r.key, item, dateISO));
    return !!x && vis(x);
  });
}

/* ------------------------ ПЕРИОДЫ И ЗАЩЁЛКА ------------------------- */
/* Календарь ОДИН на все слои: «зафиксирован» для статистики значит «проставлена колонка СТАТИСТИКИ в той же строке общего справочника». */
ST.isClosed = dateISO => !!latchOf(ST.state, periodOf(dateISO), MY_LAYER);
ST.calendar = () => ST.state.periods;
ST.layers = () => LAYERS.slice();
ST.latch = (month, layer) => latchOf(ST.state, month, layer || MY_LAYER);
/* «Открыт» без имени слоя — вопрос без ответа: каскад у слоёв доехал до разных мест, и ровно на этом три календаря давали три законных ответа. */
ST.openPeriod = layer => ST.state.months.find(m => !latchOf(ST.state, m, layer || MY_LAYER));
ST.closedMonths = layer =>
  ST.state.periods.filter(p => p.latches[layer || MY_LAYER]).map(p => p.month);
ST.fixationOfMonth = m => {
  const st = ST.state;
  if(!latchOf(st, m, MY_LAYER)) return null;
  const r = st.rows.find(x => periodOf(x.date) === m && x.fixed);
  return r ? r.fixed : null;
};

/* Дверь для простановки ЛЮБОЙ колонки: слой назван параметром, а не именем функции. */
ST.closeLayer = (month, layer, who, atISO) => {
  const st = ST.state;
  const r = closeLayer(st, month, layer, who, atISO || st.today);
  if(r.ok) log('колонка «'+layer+'» периода '+monLabel(month)+' проставлена: '+who+', '+fmt(r.at)+
    (r.order ? ' · ПОВТОРНО, распоряжение '+r.order : ''));
  return r;
};
/* Единственный акт модуля, у которого есть фамилия, — простановка колонки СТАТИСТИКИ. Отдельной кнопки «зафиксировать статистику» нет и календаря своего тоже: колонка ставится в ОБЩЕМ справочнике и упирается в незакрытые нижние слои, как всякая верхняя. */
/* ПОРЯДОК ЗАКРЫТИЯ, названный вслух: ПРОВЕРИТЬ КАЛЕНДАРЬ · ДОСПРОСИТЬ · ПРОВЕРИТЬ ИТОГ · ПРОСТАВИТЬ, УДАЛИТЬ ДНИ, ЗАФИКСИРОВАТЬ. Рубеж неполноты ОДИН, и стоит он ПОСЛЕ доспроса. */
ST.closePeriod = (month, who, silent) => {
  const st = ST.state;
  const r = closeMonth(st, month, who, st.today, silent || null);
  if(r.ok) log('период '+monLabel(month)+' закрыт ('+who+'): колонка «'+MY_LAYER+'» проставлена'+
    (r.order ? ' · повторно, распоряжение '+r.order : '')+' · доспрос дописал — '+r.made+
    ', дозаполнил — '+r.filled+', переписал — '+r.refreshed+' · удалено строк дней — '+r.dropped.rows+
    ' · зафиксировано строк — '+r.fixed);
  else if(r.mute) log('закрытие периода '+monLabel(month)+' отбито: '+r.why);
  return r;
};
ST.periodBlockers = month => periodBlockers(ST.state, month);
/* Состояние доспроса на месяц БЕЗ ЗАКРЫТИЯ — «кого переспросит защёлка и что она из этого засчитает окончательным». */
ST.repoll = (month, silent) => {
  const st = ST.state, m = month || ST.openPeriod();
  if(!m) return {ok:false, why:'незакрытых периодов нет: переспрашивать некого (ИС-38)'};
  const nbs = repollNbs(st, m, silent || null);
  return {ok:true, month: m, nbs, mute: nbs.filter(n => !n.ok),
          final: nbs.filter(n => n.final).length, layerless: nbs.filter(n => !n.layer).length};
};

/* ------------------- ПЕРЕЗАКРЫТИЕ ПЕРИОДА ------------------- */

/* Распоряжение — не реквизит формы, а единственное, чем перезакрытие отличается от молчаливой правки. */
function orderRefusal(month, order, who){
  if(!who) return {ok:false, why:'период '+monLabel(month)+' без актора не открывается: '+
    'закрывает и открывает человек, справочник актором не является (ИС-9, ADR-0204 §6)'};
  if(!order || !order.no) return {ok:false, why:'перезакрытие периода '+monLabel(month)+
    ' без распоряжения не выполняется: период закрыт, числа за него уже ушли наружу, и '+
    'тихая перезапись разошлась бы с тем, что у получателя на руках, — расхождение '+
    'обнаружил бы он, а не мы (ИС-50, ADR-0204 §4, ADR-0157 §6). Номер распоряжения '+
    'ложится в колонку периода и в пометку выпуска'};
  if(!order.basis) return {ok:false, why:'у распоряжения '+order.no+' не названо основание: '+
    'номер без основания не отвечает, ПОЧЕМУ период открыт заново, — а отвечать придётся '+
    'получателю сданного (ИС-50, ADR-0157 §6)'};
  return null;
}

/* Выпуски, собранные на прежних числах, МЕТЯТСЯ, а не пересобираются. */
function markExports(st, month, order, atISO){
  const marked = [];
  st.exports.forEach(j => {
    if(periodOf(j.date) !== month || !j.passport) return;
    (j.marks || (j.marks = [])).push({period: month, order: order.no, basis: order.basis,
      at: atISO, why:'числа изменились после сдачи: период '+monLabel(month)+
        ' перезакрыт распоряжением '+order.no});
    marked.push(j.id);
  });
  return marked;
}

/* Дверь на ОДНУ колонку, симметричная ST.closeLayer: слой — параметр, а не имя функции. */
ST.openLayer = (month, layer, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const r = openLayer(st, month, layer);
  if(r.ok) log((r.opened
      ? 'период '+monLabel(month)+' ОТКРЫТ по слою «'+layer+'»'
      : 'снята защёлка «'+layer+'» периода '+monLabel(month)+
        ': слой переспросит и защёлкнется заново — верхние слои не открываются (ADR-0204 §4)')+
    ' · распоряжение '+order.no+' ('+order.basis+'), '+who);
  return r;
};

/* Все три шага разом, и ни одного лишнего. */
ST.reopenPeriod = (month, order, who) => {
  const st = ST.state;
  const bad = orderRefusal(month, order, who);
  if(bad) return bad;
  const row = calendarRow(st, month);
  if(!row) return {ok:false, why:'строки периода '+monLabel(month)+
    ' в справочнике нет: перезакрывать нечего (ADR-0204, границы)'};
  /* Отказ стоит ЗДЕСЬ, а не только в `openLayer`: дойди распоряжение до цикла — снятие отбилось бы послойно, `dropped` остался бы пуст, и журнал записал бы перезакрытие, которого не было. */
  if(row.legacy) return {ok:false, legacy: row.legacy, why:'период '+monLabel(month)+
    ' — легаси: перезакрытие к нему неприменимо. Он загружен выпуском миграции ('+
    row.legacy.by+', '+fmt(row.legacy.at)+') уже окончательным, и распоряжение его не '+
    'откроет: исправление легаси-итога — НОВЫЙ ВЫПУСК, а не открытие периода (ИС-41, ADR-0207 §4)'};
  const latched = LAYERS.filter(L => row.latches[L]);
  if(!latched.length) return {ok:false, why:'период '+monLabel(month)+
    ' не закрыт ни одним слоем — он и так открыт: перезакрытие снимает защёлки, а снимать нечего'};
  const at = st.today;
  const dropped = [];
  for(let i = LAYERS.length - 1; i >= 0; i--){
    const r = openLayer(st, month, LAYERS[i]);
    if(r.ok) dropped.push(LAYERS[i]);
  }
  /* Расфиксировать строки — эффект СВОЕГО слоя, а не справочника: календарь стережёт порядок и ничьих чисел не трогает. */
  const unfixed = dropped.indexOf(MY_LAYER) >= 0 ? unfixMonth(st, month) : 0;
  /* Открытый месяц переписывается прогоном: его маркеры закрываются `reopen`. */
  const reopened = closeStateMarkers(st, month, at);
  const marked = markExports(st, month, order, at);
  /* ИТОГ ПЕРЕСЧИТЫВАЕТСЯ, ДНИ НЕ ВОССТАНАВЛИВАЮТСЯ. Строку первого числа следующего месяца переписывает прогон «повторное открытие»: полный обход, только состояния, `T` соседей не двигается — он удостоверяет прошлую дату, а не приращает. */
  let recount = null;
  if(dropped.indexOf(MY_LAYER) >= 0 && row.daysDropped){
    const S = sliceOfMonth(month);
    doRun(st, S, 'повторное открытие', who, 'пересчёт итога '+monLabel(month)+' по распоряжению '+order.no,
          null, {full: true, keepT: true, statesOnly: true, why: REOPEN_SCAN});
    const rec = st.runs[st.runs.length - 1];
    recount = {date: S, written: rec.written,
      rewrote: rec.parts.reduce((a, p) => a.concat(p.rewrote.map(x => Object.assign({obj: p.obj}, x))), [])};
  }
  /* Распоряжение живёт в СТРОКЕ периода: простановка колонок произойдёт другим действием, позже и другими людьми, а номер обязан доехать до каждой колонки. */
  (row.reopens || (row.reopens = [])).push({order: order.no, basis: order.basis, by: who,
    at, dropped: dropped.slice(), unfixed, reopened, marked: marked.slice(), recount: recount ? clone(recount) : null});
  const reasked = dropped.filter(L => L !== BASE_LAYER);
  log('период '+monLabel(month)+' перезакрыт по распоряжению '+order.no+' ('+order.basis+'), '+
    who+': открыт слой «'+BASE_LAYER+'»'+
    (reasked.length ? '; снята защёлка — «'+reasked.join('», «')+
      '» (переспрашивают и защёлкиваются заново, не открываются)' : '')+
    '; расфиксировано строк — '+unfixed+
    (recount ? '; итог пересчитан на '+fmt(recount.date)+' — переписано '+recount.rewrote.length : '')+
    '; помечено выпусков — '+(marked.length ? marked.join(', ') : 'нет'));
  return {ok:true, month, order: order.no, basis: order.basis, by: who, at,
    opened: BASE_LAYER, reasked, dropped, unfixed, marked, recount, next: BASE_LAYER};
};

/* --------------------------- ПРОГОН --------------------------------- */
ST.run = (dateISO, opts) => {
  const st = ST.state; opts = opts || {};
  if(dateISO > st.today) return {ok:false, why:'прогон на будущую дату не запускается'};
  /* §5: легаси-строк прогон НЕ ВИДИТ и в легаси-период не ходит. */
  if(preLaunch(dateISO)) return {ok:false, why:'прогон за '+fmt(dateISO)+' не запускается: '+
    'срез на начало дня видит мир на конец '+fmt(eveOf(dateISO))+', а это раньше запуска '+
    fmt(LAUNCH)+'. До запуска историю собирала другая система, и её итоги загружены выпуском '+
    'миграции ('+st.legacy.by+', '+fmt(st.legacy.at)+') — прогон их не считает, не видит и не '+
    'перепишет (ИС-41, ИС-54, ADR-0207 §3, §5)'};
  if(ST.isClosed(dateISO)) return {ok:false, why:'период '+monLabel(periodOf(dateISO))+
    ' зафиксирован: строки не перезаписываются ни при каких правах (ИС-8). Открытие закрытого '+
    'периода — общий порядок (ADR-0089) и идёт распоряжением: сброс колонок сверху вниз, '+
    'повторная простановка снизу вверх, выпуски метятся — ST.reopenPeriod (ИС-50, ADR-0204 §4)'};
  /* Месяц с удалёнными днями, даже открытый повторно, дней не получает обратно: ночь за такой день собрала бы строку из сегодняшнего мира под прошлой датой. */
  const calD = calendarRow(st, periodOf(dateISO));
  if(calD && calD.daysDropped && dateISO !== sliceOfMonth(periodOf(dateISO)))
    return {ok:false, why:'дни месяца '+monLabel(periodOf(dateISO))+' удалены при закрытии ('+calD.daysDropped.by+
      ', '+fmt(calD.daysDropped.at)+') и не восстанавливаются: закрытый месяц хранит итог — срез на '+
      fmt(sliceOfMonth(periodOf(dateISO)))+', а мир за '+fmt(dateISO)+' уже не спросить. Итог '+
      'пересчитывает повторное открытие (ИС-54, ADR-0238 §5)'};
  if(opts.manual){
    if(!ST.canAdmin()) return {ok:false, why:'внеплановый пересчёт запускает администратор статистики'};
    if(!opts.reason) return {ok:false, why:'внеплановый пересчёт без причины не запускается: журнал срезов — часть контракта'};
  }
  /* Молчание соседа СПРАШИВАЕТСЯ, а не подразумевается: имя из объявленного списка и причина из закрытого словаря четырёх. */
  const silent = opts.silent || null;
  if(silent) for(const nb of Object.keys(silent)){
    if(!NB(nb)) return {ok:false, why:'соседа «'+nb+'» нет: соседи объявлены списком, а не '+
      'выводятся из имени шва — объявленные: '+NEIGHBOURS.map(n => n.id).join(' · ')+' (ИС-42)'};
    if(SILENCE_REASONS.indexOf(silent[nb]) < 0) return {ok:false, why:'причина молчания «'+
      String(silent[nb])+'» не объявлена: причин четыре, и они требуют разных действий — '+
      SILENCE_REASONS.join(' · ')+' (ИС-42, ADR-0208 §2)'};
  }
  /* Срок файлов выгрузок считает ночь: задания остаются, файлы уходят. */
  if(!opts.manual) expireExports(st, st.today);
  /* ADR-0245 §6: периода нет в календаре — срезу некуда лечь, и ночь записывается ПРОПУСКОМ с причиной (`calendarGap`, то же правило у догона). */
  const gapWhy = calendarGap(st, dateISO);
  if(gapWhy){
    skipRecord(st, dateISO, gapWhy);
    log('пропуск прогона за '+fmt(dateISO)+': '+gapWhy);
    return {ok:false, skipped:true, why: gapWhy};
  }
  /* Перед своей ночью прогон догоняет пропущенные; даты вне календаря догон не пишет, а записывает пропуском. */
  const cu = catchUp(st, dateISO, silent), caught = cu.dates;
  /* Ответы соседей с датой действия забирает НОЧЬ: задачи `retro` и их открытые дни — до своей ночи. */
  const fed = opts.manual ? {n: 0, marks: {}} : takeFeed(st, dateISO, silent);
  const retro = opts.manual ? [] : retroPass(st, dateISO);
  const kind = opts.manual ? 'внеплановый' : 'плановый';
  const written = doRun(st, dateISO, kind, opts.manual ? (opts.actor || st.role) : null,
                        opts.reason || null, silent, {marks: fed.marks});
  /* «Строк — N» при разрежённом хранении больше не описывает прогон: ноль написанных строк значит и «ничего не изменилось», и «писать не дали». */
  const rec = st.runs[st.runs.length-1];
  const sum = k => rec.parts.reduce((n, p) => n + (p[k] || 0), 0);
  const same = sum('same'), kept = sum('kept'), born = sum('born'), partial = sum('partial');
  const skip = sum('skip');
  const copied = sum('copied');
  const rewrote = rec.parts.reduce((n, p) => n + p.rewrote.length, 0);
  const filled  = rec.parts.reduce((n, p) => n + p.filled.length, 0);
  /* Ночь отчитывается СОСТАВОМ КАНДИДАТОВ, а не одним их числом: «кандидатов 46» не отличает ночь, в которую соседи назвали сорок, от ночи, в которую сорок пришли деградацией неотвечающего соседа. */
  const c = rec.cand || {};
  const candLine = c.scan === 'полный'
    ? ' · обход полный ('+c.why+')'
    : ' · кандидатов — '+c.n+' ('+CAND_SRC.filter(k => c.by[k]).map(k => k+' — '+c.by[k]).join(' · ')+
      ')'+(skip ? ' · не обходилось — '+skip : '')+
      (c.polls.filter(p => p.degraded).length
        ? ' · полностью обойдены соседи: '+c.polls.filter(p => p.degraded).map(p => p.nb).join(', ')
        : '');
  log((opts.manual ? 'внеплановый пересчёт' : 'прогон')+' за '+fmt(dateISO)+': строк — '+written+
      ' · без изменений — '+same+(born ? ' · родилось — '+born : '')+
      (rewrote ? ' · переписано — '+rewrote : '')+(filled ? ' · дозаполнено — '+filled : '')+
      (partial ? ' · неполных — '+partial+' ('+Object.keys(silent || {}).join(', ')+
        ' не ответил'+(Object.keys(silent || {}).length > 1 ? 'и' : '')+')' : '')+
      (kept ? ' · зафиксировано, пропущено — '+kept : '')+' · скопировано — '+copied+
      (caught.length ? ' · догнано — '+caught.map(fmt).join(', ') : '')+
      (cu.noCalendar.length ? ' · вне календаря, пропуск — '+cu.noCalendar.map(fmt).join(', ') : '')+candLine);
  return {ok: rec.status !== 'failed', status: rec.status, failed: clone(rec.failed || []),
          date: dateISO, written, kind, same, kept, born, rewrote, filled, partial,
          skip, copied, caught, noCalendar: cu.noCalendar, cand: clone(c), fed: fed.n, retro: retro.length};
};
/* Догон отдельной дверью: ночь начинается с него, и спросить «что догнано и тронут ли T» надо до ночи, а не выводить из её последствий. */
ST.catchUp = dateISO => {
  const st = ST.state, d = dateISO || st.today;
  if(d > st.today) return {ok:false, why:'догон на будущую дату не запускается'};
  const cu = catchUp(st, d, null);
  if(cu.dates.length) log('догон перед '+fmt(d)+': '+cu.dates.map(fmt).join(', ')+
    ' — полным обходом, T соседей не тронут (ADR-0245 §2)');
  if(cu.noCalendar.length) log('догон перед '+fmt(d)+': '+cu.noCalendar.map(fmt).join(', ')+
    ' — периода нет в календаре, строк не пишет, записан пропуск (ADR-0245 §6)');
  return {ok:true, date: d, dates: cu.dates, noCalendar: cu.noCalendar};
};
ST.skip = (dateISO, reason) => {
  const st = ST.state;
  if(!reason) return {ok:false, why:'пропуск без причины не записывается: дата просто отсутствует, и это надо объяснить (ADR-0148 §6)'};
  st.runs.push({date: dateISO, kind:'пропуск', at: st.today, actor:'планировщик', reason, written:0});
  log('пропуск прогона за '+fmt(dateISO)+': '+reason);
  return {ok:true};
};
/* Момент `T` по каждому соседу — ВИДИМЫЙ реквизит, а не внутренность прогона: «сосед молчит третью ночь» и «сосед не спрашивался с 31 мая» — разные беды с разными действиями, и различает их только `T`. */
ST.polls = () => NEIGHBOURS.map(nb => {
  const p = ST.state.polls[nb.id] || {};
  return {nb: nb.id, name: nb.name, asks: !!nb.asks, T: p.T || null, at: p.at || null,
          why: nb.asks ? null : 'не умеет отвечать на «кто изменился после T»: обходится полностью (ADR-0221 §5)'};
});
/* Очередь показывается ЖИВОЙ и ЦЕЛИКОМ: закрытые записи не стираются, и «работа была и сделана» отличается от «работы не было». */
/* ЖУРНАЛ ПЕРЕЗАПИСИ. Строка — «прогон + строка + имена изменившихся колонок + причина»; значений нет. */
const REWRITE_REASONS = ['retro','backfill','reopen','manual','closing','legacy'];
const RUN_REASON = {'плановый':'retro', 'догон':'retro', 'retro':'retro', 'внеплановый':'manual',
                    'повторное открытие':'reopen', 'защёлка':'closing'};
function rewriteLog(st){
  const out = [];
  st.runs.forEach((r, i) => (r.parts || []).forEach(p => {
    const put = (x, reason) => out.push({run: i, night: r.at, date: r.date, obj: p.obj, ref: x.ref,
      target: x.target || null, changed: (x.fields || []).slice(), reason});
    (p.rewrote || []).forEach(x => put(x, RUN_REASON[r.kind] || 'manual'));
    (p.filled || []).forEach(x => put(x, 'backfill'));
  }));
  return out.filter(e => !ST.isClosed(e.date) || e.date.slice(8) === '01');
}
ST.rewriteLog = () => clone(rewriteLog(ST.state));
ST.rewriteReasons = () => REWRITE_REASONS.slice();
ST.queueKinds = () => QUEUE_KINDS.slice();
ST.queue = all => ST.state.queue.filter(q => all || !q.done).map(clone);
ST.queueWhy = () => QUEUE_WHY.slice();
/* Поставить работу руками. */
ST.enqueue = (objId, ref, why, note) => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'работу в очередь перестроения ставит администратор статистики'};
  const o = OBJ(objId);
  if(!o) return {ok:false, why:'объекта «'+String(objId)+'» нет в реестре объектов (ИС-53)'};
  if(QUEUE_WHY.indexOf(why) < 0) return {ok:false, why:'повод «'+String(why)+'» не объявлен: поводов очереди два — '+
    QUEUE_WHY.join(' · ')+'; задачи — '+QUEUE_KINDS.join(' · ')+', у записи одна открытая (ADR-0196, ADR-0245 §4)'};
  if(!(WORLD[objId] || []).some(x => x.id === ref))
    return {ok:false, why:'записи «'+String(ref)+'» у объекта «'+o.name+'» нет: в очередь ставится существующая запись, а не имя'};
  const rec = enq(st, objId, ref, why, st.today, st.role, note || null);
  log('в очередь перестроения: «'+o.name+'» '+ref+' — '+why+(note ? ' ('+note+')' : ''));
  return {ok:true, obj: objId, ref, why, at: rec.at, queued: ST.queue().length};
};
/* МАРКЕР СОСТОЯНИЯ — ТОЛЬКО ПРИ НАСТОЯЩЕМ ОТЛИЧИИ. Дата действия в закрытом месяце: итог каждого закрытого месяца после неё (строка первого числа следующего) пересчитывается и сравнивается со строкой. */
function markStates(st, objId, ref, fromISO, night){
  const item = (WORLD[objId] || []).find(x => x.id === ref);
  if(!item || storageOf(objId) !== 'state') return 0;
  const since = periodOf(dayShift(fromISO, 1));
  let n = 0;
  st.periods.filter(p => p.month >= since && latchOf(st, p.month, MY_LAYER)).forEach(p => {
    const S = sliceOfMonth(p.month);
    const row = st.rows.find(r => r.obj === objId && r.ref === ref && r.date === S && r.part == null);
    if(!row || isLegacyRow(row)) return;
    const ch = rowDiff(row, buildRow(objId, item, S, null));
    const open = st.markers.find(m => m.obj === objId && m.ref === ref && m.slice_date === S &&
                                      m.target_id == null && m.corr_kind == null && !m.closed_how);
    if(ch.length && open){
      open.changed = ch; open.found_run = night; open.basis = 'повторная находка: действие с '+fmt(fromISO);
    } else if(ch.length){
      st.markers.push({row_table: (st.release.tables[objId] || {}).table, obj: objId, ref, slice_date: S,
        target_id: null, corr_kind: null, changed: ch, basis: 'ответ соседа: действие с '+fmt(fromISO),
        found_run: night, closed_run: null, closed_how: null, corr_slice_date: null});
      n++;
    } else if(open){ open.closed_run = night; open.closed_how = 'converged'; }
  });
  return n;
}
function closeStateMarkers(st, month, atISO){
  const S = sliceOfMonth(month);
  let n = 0;
  st.markers.forEach(m => {
    if(m.slice_date === S && m.corr_kind == null && m.target_id == null && !m.closed_how){
      m.closed_run = atISO; m.closed_how = 'reopen'; n++;
    }
  });
  return n;
}
/* Ответ соседа «запись + самая ранняя дата действия». */
ST.nbChanged = (nbId, objId, ref, fromISO) => {
  const st = ST.state, nb = NB(nbId), o = OBJ(objId);
  if(!nb) return {ok:false, why:'соседа «'+String(nbId)+'» нет: соседи объявлены списком — '+
    NEIGHBOURS.map(n => n.id).join(' · ')+' (ИС-42)'};
  if(!nb.asks) return {ok:false, why:'сосед «'+nb.id+'» не отвечает «кто изменился после T» — он обходится полностью (ADR-0221 §5)'};
  if(!o) return {ok:false, why:'объекта «'+String(objId)+'» нет в реестре объектов (ИС-53)'};
  if(!(WORLD[objId] || []).some(x => x.id === ref))
    return {ok:false, why:'записи «'+String(ref)+'» у объекта «'+o.name+'» нет: сосед называет существующую запись'};
  if(!fromISO || fromISO > st.today) return {ok:false, why:'дата действия обязательна и не позже сегодняшней: '+
    'без неё прогон не знает, с какой даты пересчитывать (ADR-0245 §3)'};
  const f = {nb: nb.id, obj: objId, ref, from: fromISO, at: st.today, taken: null, closed: null};
  st.nbFeed.push(f);
  return {ok:true, feed: clone(f)};
};
ST.nbFeed = () => clone(ST.state.nbFeed);
/* Состав кандидатов на дату БЕЗ ЗАПИСИ — «кого возьмёт ночь». */
ST.candidates = (dateISO, silent) => {
  const c = candidatesOf(ST.state, dateISO || ST.state.today, silent || null);
  return {ok:true, date: dateISO || ST.state.today, full: c.full, why: c.why, from: c.from,
          by: c.full ? {} : CAND_SRC.reduce((a, k) => (a[k] = c.by[k].map(clone), a), {}),
          n: c.full ? null : Object.keys(c.set).length,
          polls: c.polls.map(clone), moved: c.moved.slice()};
};

/* Правки строки нет и не будет: её существование уничтожило бы смысл датированного среза. */
ST.tryEditRow = () => ({ok:false, why:'строку среза пишет только прогон: правки строк в модуле нет (ИС-2)'});

/* ===================== ВЫБОРКА, ВИДИМОСТЬ, ПАСПОРТ ================== */
/* Строки, написанные РОВНО на эту дату. */
function rowsAt(st, objId, dateISO){ return st.rows.filter(r => r.obj === objId && r.date === dateISO); }
/* СРЕЗ на дату. */
function rowsAsOf(st, objId, dateISO){
  /* Состояние читается строками ровно своей даты: переносить вперёд нечего. */
  if(storageOf(objId) === 'state') return st.rows.filter(r => r.obj === objId && r.date === dateISO);
  /* Событие отвечает дверью «на дату» своего способа. */
  const rows = eventAt(st, objId, dateISO) || [];
  const o = OBJ(objId);
  return o && o.primary ? rows.filter(r => r.dims[o.primary] === true) : rows;
}
/* ХРАНИТСЯ ЛИ ДАТА. Состояние хранится на каждую дату открытого месяца, у закрытого — только на первое число следующего (его итог); до запуска — только легаси-итоги на первых числах. */
function storedOn(st, objId, d){
  if(storageOf(objId) !== 'state') return true;
  if(preLaunch(d)) return st.rows.some(r => r.obj === objId && r.date === d && isLegacyRow(r));
  const cal = calendarRow(st, periodOf(d));
  return cal && cal.daysDropped ? d === sliceOfMonth(periodOf(d)) : true;
}
function notStored(st, objId, d){
  if(storedOn(st, objId, d)) return null;
  const side = datesOf(st, objId).filter(x => preLaunch(x) === preLaunch(d));
  return {month: periodOf(d), prev: side.filter(x => x < d).slice(-1)[0] || null,
          next: side.find(x => x > d) || null, legacy: preLaunch(d)};
}
ST.notStored = (d, objId) => notStored(ST.state, objId || ST.state.q.obj, d);
/* Соседние хранимые срезы — словами, одним местом на ворота даты и на поток: у первого своего месяца предыдущего по эту сторону запуска нет, у последнего легаси-итога нет следующего, и «— и 01.06.2026» было бы не ответом. */
function nearStored(ns){
  if(ns.prev && ns.next) return 'ближайшие хранимые срезы — '+fmt(ns.prev)+' и '+fmt(ns.next);
  return 'ближайший хранимый срез — '+fmt(ns.prev || ns.next)+', '+
    (ns.prev ? 'позже' : 'раньше')+' по эту сторону запуска хранимых нет';
}
/* Даты, на которые объект СЧИТАЛСЯ, берёт журнал прогонов, а не наличие строк: дата, на которую ещё никто не родился, иначе читалась бы как «прогона не было» — и пустой ответ молча подменился бы вчерашним. */
function datesOf(st, objId){
  const runs = st.runs.filter(r => (r.parts || []).some(p => p.obj === objId)).map(r => r.date);
  /* ЕДИНСТВЕННОЕ исключение из «даты берёт журнал прогонов»: легаси-дат в журнале нет и быть не может — их писал не прогон, а выпуск миграции, и прогон их не видит. */
  const leg = st.rows.filter(r => r.obj === objId && isLegacyRow(r)).map(r => r.date);
  return uniq(runs.concat(leg)).filter(d => storedOn(st, objId, d)).sort();
}

/* СУЖЕН. Прежде дата внутри истории, на которую строк нет, отвечалась ближайшей предыдущей с возрастом в паспорте. */
function resolveAsOf(st, objId, requested){
  if(!storedOn(st, objId, requested)) return null;
  const ds = datesOf(st, objId).filter(d => d <= requested && preLaunch(d) === preLaunch(requested));
  if(!ds.length) return null;
  const asOf = ds[ds.length - 1];
  /* Состояние отвечает РОВНО своей датой: строка есть на каждую хранимую дату, и подставлять нечего. */
  if(storageOf(objId) === 'state' && asOf !== requested) return null;
  return {asOf, age: daysBetween(asOf, requested), edition: preLaunch(asOf) ? FORM.LEGACY : FORM.NOW};
}
ST.resolveAsOf = requested => resolveAsOf(ST.state, ST.state.q.obj, requested);
/* Дверь наружу одна на обоих: читатель обязан спрашивать СРЕЗ (rowsAsOf), а `rowsAt` — только когда речь именно о том, какие строки лежат на эту дату. */
ST.rowsAsOf = (objId, dateISO) => rowsAsOf(ST.state, objId || ST.state.q.obj, dateISO);
ST.rowsAt = (objId, dateISO) => rowsAt(ST.state, objId || ST.state.q.obj, dateISO);
/* СОБЫТИЕ НА ДАТУ — двери наружу: аналоги `stat_repay_at`, `stat_receipt_at`, `stat_measure_at`. */
ST.eventAt   = (objId, D) => (eventAt(ST.state, objId, D) || []).map(clone);
ST.repayAt   = D => ST.eventAt('obj-repay', D);
ST.receiptAt = D => ST.eventAt('obj-receipt', D);
ST.measureAt = D => ST.eventAt('obj-measure', D);
/* ПОТОК СОБЫТИЯМИ: «погашено за период» — сумма строк со срезом в (from, to], поправки включительно; сторнированная исходная не входит (схема §9.3). */
ST.eventFlow = (objId, indId, from, to, byDim) => {
  const st = ST.state, o = OBJ(objId);
  if(!o || storageOf(objId) !== 'event_delta') return {ok:false, why:'поток событиями считается '+
    'у событий-дельт (ИС-55): у «'+(o ? o.name : objId)+'» способ «'+(storageOf(objId) || '—')+'»'};
  const I = IND(indId);
  if(!I || I.src === 'агрегат' || o.inds.indexOf(indId) < 0) return {ok:false, why:'у объекта «'+o.name+
    '» нет величины строки «'+(I ? I.name : indId)+'»: поток складывает строки, а агрегат в строке не лежит (ИС-3)'};
  if(byDim && o.dims.indexOf(byDim) < 0) return {ok:false, why:'у объекта «'+o.name+'» нет разреза «'+byDim+'»'};
  if(from > to) return {ok:false, why:'период не считается: начало '+fmt(from)+' позже конца '+fmt(to)+
    ', а поток — строки от ранней даты к поздней (ИС-17)'};
  /* Конец потока — ДАТА ПРОГОНА, и проходит он те же ворота даты, что срез и поток итогов: «погашено за август» на 22.08 — это неполный август, а не август, и на дату, за которую ночи не было, дверь отвечает отказом с последним прогоном, а не суммой строк, какие успели лечь. */
  const tail = dateGate(st, objId, to);
  if(tail) return {ok:false, why:'конец потока '+fmt(to)+': '+tail};
  /* Начало — не раньше запуска, пока легаси-строк событий нет: до запуска у событий строк нет вовсе, а события до запуска легли одной строкой на первую свою ночь. */
  if(from < LAUNCH && !st.rows.some(r => r.obj === objId && isLegacyRow(r)))
    return {ok:false, why:'начало потока '+fmt(from)+' раньше запуска '+fmt(LAUNCH)+': строк событий '+
      'до запуска в статистике нет — миграция событий не загружается (СС-Д25), а события до '+
      'запуска легли на первую свою ночь '+fmt(FIRST_OWN)+' (СС-174). Поток через границу запуска '+
      'не считается: начните его с '+fmt(LAUNCH)+' или позже (ИС-41, ADR-0207 §7)'};
  const rows = st.rows.filter(r => r.obj === objId && r.date > from && r.date <= to && !voided(o, r));
  const by = {}, cur = {};
  let som = 0;
  for(const r of rows){
    const c = r.inds[indId];
    if(!c) continue;
    const k = byDim ? String(r.dims[byDim]) : 'всего';
    const rc = rowCur(r, indId);
    if(cur[k] && cur[k] !== rc) return {ok:false, why:'поток «'+I.name+'» по группе «'+k+
      '» не складывается: в ней строки в '+cur[k]+' и в '+rc+', а сумма разных валют числом не бывает. '+
      'Режьте поток разрезом валюты или берите сомовую сторону — поле `som` (ADR-0214 §1)'};
    cur[k] = cur[k] || rc;
    by[k] = cents((by[k] || 0) + c.v);
    const s = r.inds[indId + SOM_SUFFIX];
    if(s) som = cents(som + s.v);
  }
  return {ok:true, from, to, rows: rows.length, by, cur, som};
};

/* ADR-0202: спрашивается дата ПРОГОНА, а не «сегодня». */
function askDates(st, objId){ return datesOf(st, objId); }
ST.askDates = objId => askDates(ST.state, objId || ST.state.q.obj);
function dateGate(st, objId, requested){
  /* Дата, прогон которой разошёлся счётчиками, не публикуется. */
  const fr = st.runs.filter(r => r.date === requested && r.status).slice(-1)[0];
  if(fr && fr.status === 'failed') return 'срез на '+fmt(requested)+' не опубликован: прогон «'+fr.kind+
    '» разошёлся счётчиками — '+fr.failed.join('; ')+'. Дата вернётся с прогоном, у которого счётчики сойдутся (ADR-0245 §2)';
  const o = OBJ(objId);
  const ds = askDates(st, objId);

    '»: спрашивать нечего (ИС-36)';
  /* ГРАНИЦА ЗАПУСКА — тоже ворота даты, и стоят они здесь по тому же доводу, что ворота охвата рядом: отказ обязан назвать ПРИЧИНУ и ДОРОГУ, а «строк нет» не говорит ни того, ни другого. */
  const side = ds.filter(d => preLaunch(d) === preLaunch(requested));
  if(!side.length){
    const other = ds.filter(d => preLaunch(d) !== preLaunch(requested));
    return 'на '+fmt(requested)+' строк нет: по эту сторону запуска '+fmt(LAUNCH)+
      ' их не написано ни одной'+(other.length ? ' (по ту сторону — с '+fmt(other[0])+' по '+
      fmt(other[other.length - 1])+')' : '')+'. Через границу запуска строка не переносится: '+
      'до неё форма легаси, после — действующая, и перенос выдал бы старый итог за новый '+
      '(ИС-41, ADR-0207 §7)';
  }
  /* СУЖЕН: дата между двумя хранимыми срезами — «не хранится». */
  /* Дата закрытого месяца, раньше которой по эту сторону запуска хранимого нет (май демо-мира — первый свой месяц), — тоже «не хранится», а не «разрыв у границы запуска»: строки на неё БЫЛИ написаны и удалены закрытием, и отказ обязан назвать эту причину. */

  if(ns && ns.next && (ns.prev || !ns.legacy)) return 'на '+fmt(requested)+' строки не хранится: '+
    (ns.legacy ? 'до запуска '+fmt(LAUNCH)+' хранятся только легаси-итоги на первых числах кварталов'
      : latchOf(st, ns.month, MY_LAYER)
        ? 'месяц '+monLabel(ns.month)+' закрыт, а закрытый месяц хранит только итог — срез на первое число следующего'
        : 'дни месяца '+monLabel(ns.month)+' удалены закрытием и повторным открытием не восстанавливаются — '+
          'хранится только итог, срез на первое число следующего')+
    '. '+nearStored(ns).replace(/^б/, 'Б')+'; «как было '+fmt(requested)+
    '» отвечает живой расчёт владельца «'+(o ? o.owner : '—')+'», а не срез. Ближайшая предыдущая '+
    'не подставляется (ИС-12 сужен, ИС-54, ADR-0238 §3)';
  /* Разрыв между последним легаси-итогом и первым прогоном — НЕ дыра истории: это та же граница, и подставлять через неё нечего. */

    return 'на '+fmt(requested)+' строк нет: первая строка по эту сторону запуска '+
      fmt(LAUNCH)+' написана '+fmt(side[0])+', а лежащий раньше легаси-итог на '+
      fmt(ds.filter(preLaunch).slice(-1)[0])+' через границу не переносится '+
      '(ИС-41, ADR-0207 §7)';

  if(requested > last){
    /* Хвост ЛЕГАСИ-стороны кончается иначе, чем хвост прогонов: там ждут ночи, здесь ждать нечего — новых легаси-итогов не будет никогда. */
    if(preLaunch(requested)) return 'на '+fmt(requested)+' легаси-итога нет: последний — '+
      fmt(last)+', и новых не будет. Итоги пришли выпуском миграции ('+st.legacy.by+', '+
      fmt(st.legacy.at)+', '+st.legacy.act+'); прогон легаси не считает и не увидит, а '+
      'исправление — НОВЫЙ ВЫПУСК, а не ночь (ИС-41, ADR-0207 §3, §5)';
    /* Пропуск за спрошенную дату — событие журнала, и отказ его называет: иначе «прогона не было» читается как поломка модуля, а не как записанная ночь. */
    const sk = st.runs.filter(r => r.kind === 'пропуск' && r.date > last && r.date <= requested);
    return 'на '+fmt(requested)+' прогона не было'+
      (sk.length ? ' · '+sk.map(g => fmt(g.date)+' — пропуск: '+g.reason).join(' · ') : '')+
      ': последний прогон '+fmt(last)+'. Спрашивается дата прогона, а не «сегодня» — '+
      '«как сейчас» отвечает реестр «'+(o ? o.owner : '—')+'», а не срез (ИС-36)';

ST.dateGate = (requested, objId) => dateGate(ST.state, objId || ST.state.q.obj, requested);

/* ИС-13: роль режет СТРОКИ, а не итог. */
function scopeTest(st, rule, value, asOf){
  if(rule.kind === 'own') return r => r.dims[rule.dim] === value;
  const days = {};
  const seenOn = d => days[d] || (days[d] = applyScope(rowsAsOf(st, rule.obj, d), rule.obj, d));
  const back = rule.key !== 'target' && (DIM(rule.key) || {}).obj === rule.obj;
  const pairs = {};
  const targetsOn = (r, d) => {
    const k = r.obj+'|'+d, o = OBJ(r.obj), off = o && o.pairOff;
    const isOff = x => !!off && x.dims[off[0]] === off[1];
    if(!pairs[k]){
      const by = {};
      (eventAt(st, r.obj, d) || []).forEach(x => { (by[x.ref] || (by[x.ref] = [])).push(x); });
      pairs[k] = by;
    }
    return [r.part].concat((pairs[k][r.ref] || [])
      .filter(x => isOff(r) || !(isOff(x) && x.dims[o.primary] === false)).map(x => x.part));
  };
  return r => {
    const other = seenOn(asOf || r.date);
    if(back) return other.some(x => x.dims[rule.key] === r.ref);
    if(rule.key === 'target')
      return targetsOn(r, asOf || r.date).some(t => t != null && other.some(x => x.ref === t));
    const link = r.dims[rule.key];
    return link != null && other.some(x => x.ref === link);
  };
}
function applyScope(rows, objId, asOf){
  const s = ST.scopeOf(objId || (rows[0] && rows[0].obj));
  if(!s) return rows;
  const tests = s.rules.map(r => scopeTest(ST.state, r, s.value, asOf));
  return rows.filter(r => tests.some(t => t(r)));
}
/* ==================== ФИЛЬТР ВОПРОСА ====================== */
const FOPS = {
  'перечисление': ['=','≠','∈','∉'],
  'число':        ['>','≥','<','≤','=','≠'],
  'корзина':      ['=','≠','∈','∉','в диапазоне'],
  'булево':       ['=','≠']
};
const LIST_OPS = ['∈','∉'];

  if(!c || !c.id) return null;
  if(c.kind === 'ind'){
    const I = IND(c.id);
    if(!I) return null;
    return {kind:'ind', id:c.id, name:I.name, ind:I, money: !!I.money,
      vtype: (I.type === 'сумма' || I.type === 'число') ? 'число'
           : I.type === 'булево' ? 'булево' : 'перечисление'};

  const d = DIM(c.id);
  if(!d) return null;
  return {kind:'dim', id:c.id, name:d.name, dim:d, vtype: d.buckets ? 'корзина' : 'перечисление'};

ST.filterOps = c => FOPS[(operandOf(c) || {}).vtype] || [];
function bucketFor(c, o){ return (c && c.bucket) || (o.dim.buckets ? o.dim.buckets[0] : null); }

      const op = operandOf(c);

          'а агрегат считается уже по отобранному (ADR-0180 §3)';
      /* Тот же запрет на входе фильтра, и по той же причине: хвост §15 п. 4 канона — «срез кредитов отфильтрован по области, а срез заёмщиков нет» — рождался ровно здесь. */
      if(o && op.kind === 'dim' && o.dims.indexOf(op.id) < 0){
        const D = op.dim || DIM(op.id);
        const home = D ? OBJ(D.obj) : null;
        return 'разрез «'+op.name+'» объекту «'+o.name+'» не объявлен'+
          (home ? ': он определён на объекте «'+home.name+'», и фильтровать им этот срез значило бы '+
            'сузить множество чужим признаком под своим именем — два среза, отобранные «по одному и '+

      const ops = FOPS[op.vtype] || [];
      if(ops.indexOf(c.op) < 0)
        return 'у операнда «'+op.name+'» тип значения — '+op.vtype+', и оператора «'+
          (c.op || '—')+'» у него нет: доступны '+ops.join(' ')+' (ADR-0180 §4)';

/* Третий отказ — про домен, и потому проверяется по СТРОКАМ, уже урезанным ролью: «весь домен» у куратора и у ведомства разный, и отказ обязан считать по видимому. */
function domainOf(o, c, rows){
  const set = new Set();
  rows.forEach(r => {
    if(o.kind === 'dim'){
      const raw = r.dims[o.id];
      if(raw == null) return;
      const v = o.vtype === 'корзина' ? bucketOf(raw, bucketFor(c, o), o.dim)
              : Array.isArray(raw) ? raw.join(' / ') : String(raw);
      if(v != null) set.add(v);
    } else {
      const cell = r.inds[o.id];
      if(!cell || cell.v == null) return;
      set.add(o.vtype === 'булево' ? (cell.v ? 'да' : 'нет') : String(cell.v));
    }
  });

}

  if(!filter || !filter.sets) return null;
  for(const s of (filter.sets || [])) for(const c of (s.cmps || [])){
    if(c.op !== '∈') continue;
    const o = operandOf(c);
    if(!o) continue;
    const dom = domainOf(o, c, rows);
    if(!dom.length) continue;
    const prefix = o.kind === 'dim' && !!o.dim.levels;
    const out = dom.filter(v => !(c.values || []).some(k => eqEnum(v, k, prefix)));
    if(!out.length) return 'сравнение «'+o.name+' ∈ …» перечисляет весь домен на дату среза ('+
      dom.length+' знач.): оно ничего не сужает, а в паспорте выглядело бы заданным фильтром '+
      'там, где фильтра нет (ADR-0180 §8)';

ST.filterCheck = (filter, objId, rows) => checkFilterShape(filter, objId) ||
  (rows ? checkFilterDomain(filter, rows) : null);

/* ЗНАЧЕНИЯ ОПЕРАНДА — вопрос соседа, а не экрана. */
ST.operandValues = (kind, id, bucket) => {
  const st = ST.state;
  const o = operandOf({kind, id, bucket});
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  if(!res || !o) return [];
  const bk = o.vtype === 'корзина' ? (bucket || o.dim.buckets[0]) : null;
  const set = new Set();
  applyScope(rowsAsOf(st, st.q.obj, res.asOf), st.q.obj, res.asOf).forEach(r => {
    if(o.kind === 'dim'){
      const v = r.dims[id];
      if(v == null) return;
      /* У иерархии в список идут ВСЕ уровни пути: «Юг» и «Юг / Ош» — разные вопросы. */
      if(Array.isArray(v)){ for(let i = 1; i <= v.length; i++) set.add(v.slice(0,i).join(' / ')); }
      else if(o.vtype === 'корзина'){ const k = bucketOf(v, bk, o.dim); if(k != null) set.add(k); }
      else set.add(String(v));
    } else {
      const c = r.inds[id];
      if(!c || c.v == null) return;
      set.add(o.vtype === 'булево' ? (c.v ? 'да' : 'нет') : String(c.v));
    }
  });
  const arr = [...set];
  /* Корзины сортируются ПОРЯДКОМ КОРЗИНЫ, а не алфавитом: «апрель» перед «маем». */
  if(o.vtype === 'корзина')
    return arr.sort((a,b) => String(bucketOrd(o.dim,a,bk)).localeCompare(String(bucketOrd(o.dim,b,bk))));
  if(o.vtype === 'число') return arr.sort((a,b) => Number(a) - Number(b));
  return arr.sort((a,b) => String(a).localeCompare(String(b),'ru'));
};
ST.filterValues = dimId => ST.operandValues('dim', dimId, (ST.state.q.buckets || {})[dimId]);
ST.applyScope = applyScope;

/* Паспорт называет правила, которые сработали. */
function ruleText(r, value){
  if(r.kind === 'own') return (DIM(r.dim) ? DIM(r.dim).name.toLowerCase() : r.dim)+' — '+value;
  const t = OBJ(r.obj);
  return 'через '+(t ? t.plural : r.obj)+', видимые вам на дату вопроса';
}
function scopeText(objId, n){
  const s = ST.scopeOf(objId), o = OBJ(objId);
  const open = o && o.scope.find(r => r.kind === 'open');
  if(s) return 'по '+n+' объектам «'+o.name+'», доступным вам: роль «'+ST.state.role+'», '+
    s.rules.map(r => ruleText(r, s.value)).join(' ИЛИ ');
  if(ST.curatorOf() && open) return 'по всем '+n+' объектам «'+o.name+'»: '+open.reason+' (ИС-58)';
  return 'по всем объектам «'+o.name+'» системы: '+n;

/* Паспорт печатает фильтр ЦЕЛИКОМ. «Фильтр задан» и «+2 условия» — это ответ без вопроса: по нему нельзя ни повторить отбор, ни объяснить, почему числа разошлись. */
function cmpText(c){
  const o = operandOf(c);
  if(!o) return '«'+(c.id || '—')+'» — операнда нет в реестрах';
  const name = o.name + (o.vtype === 'корзина' ? ' ('+bucketFor(c, o)+')' : '');
  if(c.op === 'в диапазоне') return name+' в диапазоне '+c.from+' — '+c.to;
  if(LIST_OPS.indexOf(c.op) >= 0) return name+' '+c.op+' '+(c.values || []).join(', ');
  if(o.vtype === 'булево') return name+' '+c.op+' '+
    ((c.value === true || c.value === 'да' || c.value === 'true') ? 'да' : 'нет');
  if(o.kind === 'ind' && o.money) return name+' '+c.op+' '+money(Number(c.value), c.cur);
  if(o.vtype === 'число') return name+' '+c.op+' '+num(Number(c.value), o.ind && o.ind.unit);

function setText(s){ return (s.cmps || []).map(cmpText).join(' и '); }
function filterText(filter){
  const sets = filter && filter.sets ? filter.sets.filter(s => (s.cmps || []).length) : [];
  if(!sets.length) return 'фильтра нет — спрошено обо всём доступном множестве';
  if(sets.length === 1) return 'фильтр пользователя: '+setText(sets[0]);
  return 'фильтр пользователя: '+sets.map((s,i) => 'набор '+(i+1)+' — '+setText(s)).join('; либо ');
}
ST.filterText = filterText;
ST.cmpText = cmpText;
/* Фиксация — свойство ПЕРИОДА ОТВЕЧЕННОЙ ДАТЫ, а не строк, которыми ответ собран. */
function latchFor(st, dateISO){ return dateISO ? latchOf(st, periodOf(dateISO), MY_LAYER) : null; }
function fixationOf(st, dateISO){
  return latchFor(st, dateISO) ? 'зафиксировано' : 'не зафиксировано';
}
/* «Смешанно» — состояние РЯДА, а не даты: у одной даты период либо закрыт, либо нет. */
function mixFixation(list){
  const vals = list.filter(Boolean).filter((x,i,a) => a.indexOf(x) === i);
  return vals.length === 0 ? 'не зафиксировано' : vals.length === 1 ? vals[0] : 'смешанно';
}
/* Два состояния ответа, объявленные в паспорте. */
const ANSWER_MODE = {CALC:'расчёт, предварительно', READ:'запись фиксации, окончательно'};
function modeOf(fixation){
  return fixation === 'зафиксировано' ? ANSWER_MODE.READ
       : fixation === 'смешанно' ? 'смешанно: до защёлки — расчёт, после — запись фиксации'
       : ANSWER_MODE.CALC;
}
ST.answerModes = () => [ANSWER_MODE.CALC, ANSWER_MODE.READ];
/* DensityNote, skipNote — сняты волной 23: плотности и подстановки больше нет — строка на каждую хранимую дату. */
/* §6: свод по неполным строкам СЧИТАЕТСЯ и объявляет неполноту. */
function partialNote(rows){
  const by = {};
  rows.forEach(r => silentOf(r).forEach(nb => {
    const k = by[nb] || (by[nb] = {n:0, reasons:[]});
    k.n++;
    const why = r.srcs[nb].detail || r.srcs[nb].state;
    if(k.reasons.indexOf(why) < 0) k.reasons.push(why);
  }));
  const ids = Object.keys(by);
  if(!ids.length) return null;
  const n = rows.filter(r => silentOf(r).length).length;
  return {n, neighbours: ids,
    text:'неполных строк — '+n+' из '+rows.length+': '+
      ids.map(nb => 'сосед «'+nb+'» не ответил ('+by[nb].reasons.join(', ')+') — '+by[nb].n).join(' · ')+
      '. Свод посчитан по тому, что есть; отсутствующее не заменено ни нулём, ни вчерашним '+

/* ЧЕТВЁРТЫЙ обязательный реквизит паспорта. */
function datingWant(dims, inds){
  const want = [], add = id => { if(id && want.indexOf(id) < 0) want.push(id); };
  (dims || []).forEach(add);
  (inds || []).forEach(m => {
    const I = IND(m);
    if(!I) return;
    /* У агрегата датируется ОСНОВАНИЕ: сумма остатков наследует происхождение остатка, и своего у неё нет — в строке агрегата не лежит вовсе. */

  /* `'*'` — список строк и выгрузка: там видна ВСЯ строка, и спрашивать датировку надо обо всём, что в ней лежит. */
  const want = dims === '*'
    ? uniq([].concat.apply([], rows.map(r =>
        Object.keys(r.dims || {}).concat(Object.keys(r.inds || {})))))
    : datingWant(dims, inds);
  const mark = {};
  want.forEach(id => rows.forEach(r => {
    if(!hasVal(r, id) || mark[id] === DATING.NOW) return;
    mark[id] = datingOf(r, id);
  }));
  const named = id => { const R = REC(id); return '«'+(R ? R.name : id)+'»'; };
  const now = want.filter(id => mark[id] === DATING.NOW);
  const asof = want.filter(id => mark[id] === DATING.ASOF);
  const n = now.length + asof.length;
  /* Ответ без величин — это счёт строк: датировать в нём нечего, и признак не выдумывается. */
  const word = now.length && asof.length ? 'смешанно' : now.length ? DATING.NOW : DATING.ASOF;

/* ИС-11: молчащее расхождение читается как ошибка расчёта и стоит доверия ко всему модулю. */
function divergenceNote(st, objId, asOf){
  if(!ST.isClosed(asOf)) return null;
  const c = st.corrections.filter(x => x.month === periodOf(asOf) && x.obj === objId);
  if(!c.length) return null;
  return c.map(x => 'есть корректировка за '+monLabel(x.month)+' по '+x.ref+', учтена '+fmt(x.at)+
    ': сегодняшний пересчёт дал бы на '+money(x.delta,'KGS')+' больше · основание: '+x.basis).join(' · ');

/* РЕДАКЦИЯ ФОРМЫ В ПАСПОРТЕ. Обязательным реквизитом она НЕ стала — их по-прежнему четыре: у ответа, целиком собранного действующей формой, говорить не о чем, и строка паспорта не удлиняется ни на символ. */

    /* `'*'` — список строк и выгрузка (тот же признак, что у датировки): там видна ВСЯ строка, и перечислять недостачу поимённо значило бы напечатать полсотни имён. */

      ' (выпуск: '+st.legacy.by+', '+fmt(st.legacy.at)+', '+st.legacy.act+')'+
      (miss.length ? '. Форма легаси НЕ СОБИРАЛА: '+

/* «Состав» — то, что было СПРОШЕНО: разрезы по порядку с их уровнем/корзиной (и осью, когда её имеет смысл называть — матрица), затем показатели. */

  if(!Array.isArray(dims) || !dims.length) return null;
  meta = meta || {};
  const levels = meta.levels || {}, buckets = meta.buckets || {}, colDim = meta.colDim;
  const dimPart = dims.map(d => {
    const D = DIM(d); if(!D) return d;

    if(D.levels && levels[d]){ const L = D.levels[levels[d]-1]; if(L) label += ' ('+L.name+')'; }
    if(buckets[d]) label += ' ('+buckets[d]+')';
    if(colDim && d === colDim) label += ' (в колонках)';
    return label;
  }).join(' · ');
  const indPart = (inds || []).filter(id => id && id !== '*')
    .map(id => { const I = IND(id); return I ? '«'+I.name+'»' : id; }).join(', ');
  return dimPart + (indPart ? ' — '+indPart : '');

  return {
    requested, asOf: res.asOf, age: res.age,
    fixation: fixationOf(st, res.asOf),
    fixedBy: lt ? lt.by : null,
    fixedAt: lt ? lt.at : null,
    dating: datingNote(rows, dims, inds, res.asOf),
    partial: partialNote(rows),
    scope: scopeText(objId, rows.length),
    scoped: !!ST.scopeOf(objId),
    filter: filterText(filter),

}
ST.passportShort = shortPassport;
ST.passportForms = () => ['полная','краткая'];
/* Паспорт — не опция: без ЧЕТЫРЁХ обязательных полей ответ не отдаётся. */
function emit(payload, p){
  const missing = [];
  if(!p || !p.asOf) missing.push('дата расчёта');
  if(!p || !p.fixation) missing.push('признак фиксации');
  if(!p || !p.scope) missing.push('область видимости');
  if(!p || !p.dating) missing.push('датировка величин');
  if(missing.length) return {ok:false, why:'ответ без паспорта не отдаётся: не назван'+
    (missing.length > 1 ? 'ы' : '')+' '+missing.join(', ')+' (ИС-10)'};
  /* Состояние ответа выводится ЗДЕСЬ, в единственной двери ответа, а не в сборщике паспорта: ряд переписывает признак фиксации ПОСЛЕ сборки (`mixFixation`), и состояние, выведенное раньше, разъехалось бы с ним — ряд через закрытие объявил бы себя окончательным. */
  p.mode = modeOf(p.fixation);
  p.short = shortPassport(p);                              /* Краткая форма — тоже паспорт. */
  return Object.assign({ok:true, passport:p}, payload);
}
ST.emit = emit;

/* ------------------------- ПРЕДСТАВЛЕНИЕ ---------------------------- */
/* Сомовой величины показ больше не выводит: он её ЧИТАЕТ из колонки строки по адресу близнеца. */
ST.somCell = (row, indId) => {
  const t = ST.somIdOf(indId);
  return t && row && row.inds ? (row.inds[t] || null) : null;
};
ST.somValue = (row, indId) => { const c = ST.somCell(row, indId); return c ? c.v : null; };
ST.shareOf = (part, whole) => whole ? Math.round(part / whole * 1000)/10 : null;
ST.pointsBetween = (a, b) => Math.round((b - a) * 10)/10;

/* ------------------------- ДЕДУП-КЛЮЧ ПОКАЗАТЕЛЯ --------------------- */
function repOf(over, r){
  const som = ST.somIdOf(over.id);
  const c = som ? r.inds[som] : r.inds[over.id];
  return (c && c.v != null) ? c.v : 0;
}
function dedupRows(over, rows){
  const key = over && over.dedupBy;
  if(!key) return {rows, keys: null, dropped: 0, keyless: 0};
  const best = new Map(), loose = [];
  let dropped = 0;
  rows.forEach(r => {
    const k = r.dims[key];
    if(k == null){ loose.push(r); return; }
    const cur = best.get(k);
    if(!cur){ best.set(k, r); return; }
    dropped++;
    /* Сравниваются СОМОВЫЕ колонки, если они есть: у солидарной пары требования могут быть в разных валютах, и «наибольшая» без общей меры не определена вовсе. */
    if(repOf(over, r) > repOf(over, cur)) best.set(k, r);
  });
  return {rows: [...best.values()].concat(loose), keys: best.size + loose.length,
          dropped, keyless: loose.length};
}
ST.dedupRows = dedupRows;
/* Паспорт называет ключ поимённо: сколько строк схлопнулось в сколько ключей. */
function dedupNote(inds, rows){
  const out = [];
  (inds || []).forEach(id => {
    const I = IND(id);
    if(!I) return;
    const over = I.src === 'агрегат' ? IND(I.over) : I;
    if(!over || !over.dedupBy || out.some(x => x.ind === over.id)) return;
    const dd = dedupRows(over, rows), D = DIM(over.dedupBy);
    out.push({ind: over.id, by: over.dedupBy, rows: rows.length, keys: dd.keys,
      dropped: dd.dropped, keyless: dd.keyless,
      text: '«'+over.name+'» считается один раз на «'+(D ? D.name : over.dedupBy)+'»: строк '+
        rows.length+', ключей '+dd.keys+(dd.dropped ? ', схлопнуто '+dd.dropped : '')+
        (dd.keyless ? ', без ключа '+dd.keyless : '')+
        '. Сумма строк итогу не равна — и не должна (ИС-34)'});
  });
  return out.length ? out : null;
}

/* --------------------------- АГРЕГАТЫ ------------------------------- */
function aggValue(indId, rows){
  const I = IND(indId);
  if(!I) return null;
  if(I.src !== 'агрегат') return null;
  if(!AGG_FNS[I.fn]) return null;
  if(I.fn === 'count') return {v: rows.length, kind:'число'};
  const over = IND(I.over);
  if(!over) return null;
  /* Дедуп применяется здесь и только здесь: строка своей полной суммы не теряет, теряет её ИТОГ — ровно как требует норма (ТЗ 13 разд. 3). */
  const dd = dedupRows(over, rows);
  rows = dd.rows;
  const mark = v => (dd.keys == null || !v) ? v : Object.assign(v,
    {dedup: {by: over.dedupBy, keys: dd.keys, dropped: dd.dropped, keyless: dd.keyless}});
  /* ВЫБОР ИЗ ПУСТОГО — НЕ НОЛЬ. max/min/avg не складывают, а ВЫБИРАЮТ из набора значений; когда выбирать не из чего, ответа нет, и «0» на его месте — утверждение, которого никто не делал: «наибольший срок с направления 0 дн.» читается как «сегодня направили», хотя направления не было вовсе. */
  const EMPTY_IS_NOT_ZERO = ['max','min','avg'];
  if(!over.money){
    const cells = rows.map(r => r.inds[I.over]).filter(c => c && c.v != null);
    if(!cells.length && EMPTY_IS_NOT_ZERO.indexOf(I.fn) >= 0) return null;
    return mark({v: Math.round(AGG_FNS[I.fn].apply(cells.map(c => c.v))*10)/10, kind:'число', unit: over.unit});
  }
  /* Деньги агрегируются ПО СТРОКАМ: валюта величины — валюта строки, курс — курс строки. */
  const parts = rows.filter(r => r.inds[I.over] && r.inds[I.over].v != null)
    .map(r => ({cur: rowCur(r, I.over), v: r.inds[I.over].v, rateDate: r.fx ? r.fx.rateDate : null}));
  if(!parts.length && EMPTY_IS_NOT_ZERO.indexOf(I.fn) >= 0) return null;
  const curs = uniq(parts.map(p => p.cur));
  const rd = parts.map(p => p.rateDate).filter(Boolean).sort().slice(-1)[0] || null;
  if(curs.length <= 1){
    const cur = curs[0] || 'KGS';
    /* Однородное множество валютный показатель складывает и отвечает В СВОЕЙ ВАЛЮТЕ: формульный свод запрещает не сложение, а сложение ЧЕРЕЗ границу разреза. */
    return mark({v: CORE.somRound(AGG_FNS[I.fn].apply(parts.map(p => p.v)), roundOf(I)), cur,
      kind:'сумма', rateDate: rd, round: roundOf(I)});
  }
  /* ---- СВОД ВАЛЮТНОГО ПОКАЗАТЕЛЯ ПО РАЗНОВАЛЮТНОМУ МНОЖЕСТВУ — ОТКАЗ ---- */
  const by = {};
  curs.forEach(c => { by[c] = CORE.somRound(AGG_FNS[I.fn].apply(parts.filter(p => p.cur === c).map(p => p.v)), roundOf(I)); });
  const RB = DIM(over.rollBy), tw = IND(I.id + SOM_SUFFIX);
  return mark({refused:true, kind:'сумма', v: undefined, cur: null, rateDate: rd, mixed: curs, by,
    note:'множество разновалютное: '+curs.map(c => money(by[c], c)).join(' + '),
    som: tw ? tw.id : null,
    why:'«'+I.name+'» складывается только внутри разреза «'+(RB ? RB.name : over.rollBy)+'»: '+
      'множество разновалютное ('+curs.map(c => money(by[c], c)).join(' + ')+'), и одно число '+
      'здесь было бы суммой долларов с сомами — не итогом, а ошибкой. '+
      (tw ? 'Спросите «'+tw.name+'» — она аддитивна всегда и по этому же множеству отвечает '+
            'одним числом; курс и дата курса лежат в каждой строке рядом с ним. '
          : '')+
      'Либо сгруппируйте по «'+(RB ? RB.name : over.rollBy)+'» — внутри группы ответ есть '+
      '(ИС-44, ADR-0214 §1, §2, ADR-0151 §4)'});
}
ST.aggValue = aggValue;

/* ============================== ШВЫ ================================= */
/* Запись, ждущая колонку, в вопросы не входит: у разреза это ловит и состав объекта, но отказ тогда говорил бы про чужой объект определения, а у показателя состав здесь не спрашивается вовсе — и свод над ждущим основанием ответил бы нулём. */
const waitsCol = id => !!ST.state && ST.state.awaiting.indexOf(id) >= 0;
const waitsWhy = r => 'запись «'+r.name+'» ждёт колонку: релиз её ещё не завёл'+
  (r.src === 'агрегат' ? ' — у основания этого свода' : '')+', и в вопросы она не входит: ответ по ней '+
  'был бы придуманным (ИС-53, ADR-0237 §3)';
function checkQuery(q, needAgg){
  const o = OBJ(q.obj);
  if(!o) return 'объекта «'+q.obj+'» нет в реестре объектов (ИС-53)';
  /* Заявка владельцу произносится на всех дверях: молча пустеющий объект — дефект. */
  if(o.pending) return pendingWhy(o);
  /* Дата вопроса проверяется ДО разрезов: хвост — отказ, а не подстановка. */
  const tail = dateGate(ST.state, q.obj, q.date);
  if(tail) return tail;
  for(const d of (q.dims || [])){
    const D = DIM(d);
    if(!D) return 'разреза «'+d+'» нет в реестре разрезов';
    if(waitsCol(d)) return waitsWhy(D);
    if(o.dims.indexOf(d) < 0){
      /* Причина первая и главная — ОБЪЕКТ ОПРЕДЕЛЕНИЯ: сложение по разрезу законно только внутри его объекта, и срез по чужому разрезу был бы суммой по другому множеству под тем же именем. */
      const at = (ST.state ? ST.state.objects : OBJECTS).filter(x => x.dims.indexOf(d) >= 0);
      const home = OBJ(D.obj);
      const sib = o.dims.map(DIM).find(x => x && x.src === D.src &&
        (D.src === 'шов' ? x.seam === D.seam && x.field === D.field : x.key === D.key));
      return 'разрез «'+D.name+'» определён на объекте «'+(home ? home.name : D.obj)+
        '», а спрошен у «'+o.name+'»: складывать по разрезу законно только внутри его объекта '+
        'определения, иначе под одним именем сложатся два разных признака (ИС-40, ADR-0206 §3). '+
        (sib ? 'Тот же признак у «'+o.name+'» читается СВОЕЙ записью — «'+sib.name+
               '», и значения этих двух записей между собой не складываются и не сверяются'
             : (at.length ? 'На дату у «'+o.name+'» значений этого признака много — '+
                 'спрашивается он у «'+at.map(x => x.name).join('», «')+'» (ИС-21)' : ''));
    }
    if(D.since > q.date) return 'разрез «'+D.name+'» введён '+fmt(D.since)+
      ' и действует вперёд: прошлое им не размечено (ADR-0147 §4)';
    if(D.buckets && (!q.buckets || D.buckets.indexOf(q.buckets[d]) < 0))
      return 'разрез «'+D.name+'» спрашивается корзиной из объявленных: '+D.buckets.join(' · ')+
        '. Свободной корзины, приходящей мимо реестра, не существует — новая заводится записью (ИС-23, ADR-0176 §2)';
    if(D.levels && q.levels && q.levels[d] != null &&
       (q.levels[d] < 1 || q.levels[d] > D.levels.length))
      return 'у разреза «'+D.name+'» уровней '+D.levels.length+': '+D.levels.map(L => L.name).join(' → ')+
        ' — запрошенного уровня нет (ИС-22, ADR-0176 §4)';
  }
  for(const m of (q.inds || [])){
    const I = IND(m);
    if(!I) return 'показателя «'+m+'» нет в реестре — для витрины его не существует (ИС-7)';
    if(waitsCol(m)) return waitsWhy(I);
    if(I.obj !== '*' && I.obj !== q.obj) return 'показатель «'+I.name+'» объявлен для другого объекта';
    if(needAgg && I.src !== 'агрегат') return 'в срезе показатель — агрегат: «'+I.name+
      '» строчный, спросите его швом statRows';
  }
  return checkFilterShape(q.filter, q.obj);
}

/* Сколько и на сколько, в таком-то разрезе, на такую-то дату. */
/* ПУТЬ «ТАБЛИЦА + КЛЮЧ» ПРИ ЧТЕНИИ. Признак соседа в строке объекта не лежит: срез берёт его из строки соседа на ТУ ЖЕ дату среза по ключу связи — join `stat_row_credit.d_borrower → stat_row_borrower`. */
function viaIds(q){
  const ids = (q.dims || []).slice();
  ((q.filter && q.filter.sets) || []).forEach(s => (s.cmps || []).forEach(c => { if(c.kind !== 'ind') ids.push(c.id); }));
  return ids.filter((id, i) => ids.indexOf(id) === i && DIM(id) && DIM(id).via);
}
function joinVia(st, rows, ids, asOf){
  if(!ids.length) return rows;
  const idx = {};
  ids.forEach(id => {
    const T = viaTarget(DIM(id)).dim;
    if(idx[T.obj]) return;
    idx[T.obj] = new Map(rowsAsOf(st, T.obj, asOf).map(r => [r.ref, r]));
  });
  return rows.map(r => {
    const x = Object.assign({}, r, {dims: Object.assign({}, r.dims), lbls: Object.assign({}, r.lbls || {}),
                                    now: (r.now || []).slice()});
    ids.forEach(id => {
      const D = DIM(id), T = viaTarget(D).dim, key = r.dims[D.via.by];
      const nb = key == null ? null : idx[T.obj].get(key);
      if(!nb || nb.dims[T.id] == null) return;
      x.dims[id] = nb.dims[T.id];
      if(nb.lbls && nb.lbls[T.id] != null) x.lbls[id] = nb.lbls[T.id];
      /* Датировка пути — датировка строки соседа (правка ревью этапа 3): признак, собранный у заёмщика «текущим», у кредита тоже «текущий». */
      if((nb.now || []).indexOf(T.id) >= 0 && x.now.indexOf(id) < 0) x.now.push(id);
    });
    return x;
  });
}
/* ПУТЬ ВО ВСЕХ ДВЕРЯХ (правка ревью этапа 3). */
function askRows(st, objId, asOf, q){
  const rows = applyScope(rowsAsOf(st, objId, asOf), objId, asOf);    /* ДО группировки — ИС-13. */
  return joinVia(st, rows, viaIds(q || {}), asOf);                     /* Путь — после охвата, им не режется. */
}
/* Тот же путь у реестра владельца: реестр читает запись мира, а не строку, и признак пути берёт у записи соседа по ключу связи — тем же читателем на ту же дату. */
function viaOfItem(id, item, dateISO){
  const D = DIM(id), T = viaTarget(D).dim, key = readDim(D.via.by, item, dateISO);
  const nb = key == null ? null : (WORLD[T.obj] || []).find(w => w.id === key);
  return nb ? readDim(T.id, nb, dateISO) : null;
}
ST.statSlice = q => {
  const st = ST.state;
  const bad = checkQuery(q, true);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = askRows(st, q.obj, res.asOf, q);                /* Охват, затем путь. */
  const badF = checkFilterDomain(q.filter, rows);            /* Отказ ДО счёта. */
  if(badF) return {ok:false, why: badF};
  rows = applyFilter(rows, q.filter);
  const dims = q.dims || [], inds = q.inds || [];
  /* Форма ответа ОДНА — дерево. */
  const hier = dims.length === 1 && DIM(dims[0]) && DIM(dims[0]).levels ? DIM(dims[0]) : null;
  const depth = hier ? Math.min((q.levels && q.levels[hier.id]) || hier.levels.length, hier.levels.length) : 1;
  /* Группа держит КЛЮЧ, печатается ПОДПИСЬЮ на дату среза: строки одной даты несут одну подпись ключа, и берётся она из строки, а не из сегодняшнего справочника. */
  const txt = x => x == null ? null : typeof x === 'object' ? x.lbl : String(x);
  const labelsOf = (key, parts, rws, lvl) => {
    const r = rws[0] || {lbls: {}, dims: {}};
    if(hier) return parts.map((p, i) => txt(((r.lbls || {})[hier.id] || [])[i]) || p);
    return dims.map((d, i) => {
      const D = DIM(d), l = (r.lbls || {})[d];
      if(l == null || D.buckets) return parts[i];
      if(D.levels){
        const n = (q.levels && q.levels[d]) || D.levels.length;
        return l.slice(0, n).map((x, j) => txt(x) || (r.dims[d] || [])[j]).join(' / ');
      }
      return Array.isArray(l) ? l.join(', ') : txt(l);
    });
  };
  const node = (key, parts, rws, lvl) => ({
    key, parts, labels: labelsOf(key, parts, rws, lvl), level: lvl, n: rws.length, refs: rws.map(r => r.ref),
    values: inds.reduce((acc, m) => { acc[m] = aggValue(m, rws); return acc; }, {}),
    children: [], own: rws.length
  });
  /* Числа узла считаются ПО СТРОКАМ УЗЛА, а не складыванием детей: доля и среднее неаддитивны, а объект с незаполненным нижним уровнем при сложении исчез бы. */
  function branchAt(rws, lvl){
    const map = new Map();
    rws.forEach(r => {
      const v = r.dims[hier.id];
      const path = Array.isArray(v) ? v : [];
      if(path.length < lvl){ if(lvl > 1) return; }
      const key = path.length ? path.slice(0, lvl).join(' / ') : '—';
      if(!map.has(key)) map.set(key, {key, parts: path.slice(0, lvl), rows: []});
      map.get(key).rows.push(r);
    });
    return [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru',{numeric:true})).map(g => {
      const nd = node(g.key, g.parts, g.rows, lvl);
      if(lvl < depth) nd.children = branchAt(g.rows, lvl + 1);
      nd.own = nd.n - nd.children.reduce((x,c) => x + c.n, 0);
      return nd;
    });
  }
  let groups;
  if(hier) groups = branchAt(rows, 1);
  else {
    const map = new Map();
    rows.forEach(r => {
      const parts = dims.map(d => { const k = dimKey(DIM(d), r.dims[d], q); return k == null ? '—' : k; });
      const key = parts.join(' · ') || 'всего';
      if(!map.has(key)) map.set(key, {key, parts, rows: []});
      map.get(key).rows.push(r);
    });
    groups = [...map.values()].sort((a,b) => a.key.localeCompare(b.key,'ru',{numeric:true}))
      .map(g => node(g.key, g.parts, g.rows, 1));
  }
  const total = inds.reduce((acc, m) => { acc[m] = aggValue(m, rows); return acc; }, {});
  return emit({groups, tree: groups, dims, inds, total, n: rows.length,
      hier: hier ? {dim: hier.id, levels: hier.levels.map(L => L.name), depth} : null,
      buckets: q.buckets || null},
    passportFor(st, q.obj, q.date, res, rows, q.filter, inds, dims,
      {levels: q.levels, buckets: q.buckets, colDim: q.colDim}));
};
/* СУММЫ ГРУППЫ — ИЗ СТРОК ЗАЁМЩИКОВ-ЧЛЕНОВ НА ТУ ЖЕ ДАТУ. Своих сумм у группы нет: вторая копия денег, уже лежащих в строках заёмщиков, разъехалась бы с ними при первом платеже. */
ST.groupSums = q => {
  const st = ST.state;
  const bad = checkQuery({obj:'obj-gmember', date: q.date, dims:[], inds:[]}, false);
  if(bad) return {ok:false, why: bad};
  const inds = q.inds || [];
  /* Своя величина строки заёмщика и денежная: у агрегата признака денег нет — в строке он не лежит, — и отдельной ветки на него не нужно. */
  for(const m of inds){
    const I = IND(m);
    if(!I || I.obj !== 'obj-borrower' || !I.money)
      return {ok:false, why:'сумма группы берётся из денежной величины строки заёмщика: «'+m+'» ею не является (ADR-0244 §2)'};
  }
  const res = resolveAsOf(st, 'obj-gmember', q.date);
  if(!res) return {ok:false, why:'строк членства на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  const mem = applyScope(rowsAsOf(st, 'obj-gmember', res.asOf), 'obj-gmember', res.asOf);
  const bor = new Map(rowsAsOf(st, 'obj-borrower', res.asOf).map(r => [r.ref, r]));
  const sum = (refs, m) => cents(refs.reduce((a, ref) => {
    const c = (bor.get(ref) || {inds: {}}).inds[m];
    return a + (c && c.v != null ? c.v : 0);
  }, 0));
  const byG = new Map();
  mem.forEach(r => {
    const g = r.dims['d-ggroup'];
    if(!byG.has(g)) byG.set(g, {group: g, lbl: r.dims['d-glbl'] || g, members: []});
    byG.get(g).members.push(r.dims['d-gmember']);
  });
  const groups = [...byG.values()].sort((a, b) => a.group.localeCompare(b.group)).map(g => ({
    group: g.group, lbl: g.lbl, members: g.members.slice().sort(), n: g.members.length,
    noRow: g.members.filter(x => !bor.has(x)).sort(),
    values: inds.reduce((a, m) => { a[m] = sum(g.members, m); return a; }, {})}));
  const all = [...new Set(mem.map(r => r.dims['d-gmember']))].sort();
  const total = inds.reduce((a, m) => { a[m] = sum(all, m); return a; }, {});
  return {ok:true, asOf: res.asOf, groups, total, members: all, rows: mem.length,
    passport: {scope: scopeText('obj-gmember', mem.length),
      dedup: 'итог по всем группам — по различным членам: '+all.length+' на '+mem.length+' строк членства (ADR-0199)'}};
};
/* Узел ищется по всему дереву: детализация родителя обязана открываться так же, как детализация листа. */
ST.findNode = (groups, key) => {
  for(const g of (groups || [])){
    if(g.key === key) return g;
    const hit = ST.findNode(g.children, key);
    if(hit) return hit;
  }
  return null;
};

/* ЗДЕСЬ БЫЛ `ST.mxTree` — k-уровневое дерево строчных разрезов с разбивкой по колонке. */

/* Как это менялось. */
ST.statSeries = q => {
  const st = ST.state;
  const dates = (q.dates || []).slice().sort();
  if(!dates.length) return {ok:false, why:'ряд без дат не строится'};
  const bad = checkQuery({obj:q.obj, dims:[], inds:[q.inds], date: dates[dates.length-1],
    filter: q.filter}, true);
  if(bad) return {ok:false, why: bad};
  /* Домен ряда меряется по ПОСЛЕДНЕЙ точке: отказ обязан быть один на ряд, иначе четыре точки дали бы четыре разных вердикта одному и тому же фильтру. */
  const lastAt = resolveAsOf(st, q.obj, dates[dates.length-1]);
  const badF = lastAt ? checkFilterDomain(q.filter, askRows(st, q.obj, lastAt.asOf, q)) : null;
  if(badF) return {ok:false, why: badF};
  /* СОСТАВ ряда — это МНОЖЕСТВО записей, попавших хоть в одну точку, а не сумма точек. */
  const points = [], seen = new Map();
  for(const d of dates){
    const res = resolveAsOf(st, q.obj, d);
    if(!res){
      /* Точка, которая не хранится, отвечает пустотой с причиной, а не ближайшей предыдущей: ряд не подменяет дату так же, как срез. */
      const ns = notStored(st, q.obj, d);
      points.push({date:d, empty:true, why: ns ? 'на '+fmt(d)+' строки не хранится — '+nearStored(ns)+
        ' (ИС-12 сужен, ИС-54)' : 'строк на '+fmt(d)+' и ранее нет (ИС-12)'});
      continue;
    }
    let rows = applyFilter(askRows(st, q.obj, res.asOf, q), q.filter);
    rows.forEach(r => seen.set(r.ref, r));
    points.push({date:d, asOf:res.asOf, age:res.age,
      /* Редакция формы — реквизит ТОЧКИ, а не ряда: ряд через запуск состоит из точек разных редакций, и назвать это одним словом на весь ряд нельзя. */
      edition: res.edition,
      fixation: fixationOf(st, res.asOf), n: rows.length, value: aggValue(q.inds, rows)});
  }
  const last = resolveAsOf(st, q.obj, dates[dates.length-1]);
  const p = passportFor(st, q.obj, dates[dates.length-1], last,
                        Array.from(seen.values()), q.filter, [q.inds]);
  /* Паспорт РЯДА собирается из точек, а не из последней даты: ряд, начатый в закрытом мае и кончившийся в открытом августе, зафиксирован наполовину, и сказать это обязан он. */
  p.fixation = mixFixation(points.map(pt => pt.fixation));
  p.range = fmt(dates[0])+' — '+fmt(dates[dates.length-1]);
  /* §6: СМЕШАННЫЙ РЯД НАЗЫВАЕТ СОСТАВ — та же фигура, что у разновалютной клетки: не молчит, не отказывает, а говорит, из чего собран. */
  const eds = uniq(points.filter(pt => !pt.empty).map(pt => pt.edition));
  const legMiss = eds.indexOf(FORM.LEGACY) >= 0 ? legacyMissing(q.obj, [q.inds]) : [];
  p.editions = eds.length > 1 ? {list: eds, launch: LAUNCH,
    text:'ряд идёт ЧЕРЕЗ ЗАПУСК '+fmt(LAUNCH)+': редакции формы в нём разные — '+
      eds.join(' и ')+'. Точки по разные стороны собраны разными системами и разными '+
      'перечнями величин; сопоставлять их можно, считать разницу между ними — вопрос к '+
      'получателю, а не к статистике'} : null;
  /* Отметку на СТЫК ставит статистика, а ИЗМЕНЕНИЕ между точками не считает: графа изменения живёт у отчётности. */
  for(let i = 1; i < points.length; i++){
    const a = points[i-1], b = points[i];
    if(a.edition && b.edition && a.edition !== b.edition)
      b.editionBreak = 'редакции формы разные: «'+a.edition+'» → «'+b.edition+
        '»'+(legMiss.length ? ', и форма легаси не собирала '+
          legMiss.map(id => '«'+((REC(id) || {}).name || id)+'»').join(', ') : '')+
        ' — изменение между этими точками несопоставимо (ИС-41, ADR-0207 §6)';
  }
  return emit({points, inds:q.inds, editions: eds, legacyMissing: legMiss}, p);
};

/* Порог — параметр ЭКСПЛУАТАЦИИ, а не модели: в системе он берётся замером, здесь намеренно мал, чтобы отказ был виден на четырнадцати погашениях. */
ST.rowsLimit = 12;

/* Строки вопроса, ещё без порога: одна выборка на две двери — список и выгрузку. */
function rowsFor(st, q){
  const bad = checkQuery({obj:q.obj, dims:[], inds:[], date:q.date, filter:q.filter}, false);
  if(bad) return {ok:false, why: bad};
  const res = resolveAsOf(st, q.obj, q.date);
  if(!res) return {ok:false, why:'строк на '+fmt(q.date)+' и ранее нет: подстановка запрещена (ИС-12)'};
  let rows = askRows(st, q.obj, res.asOf, q);
  const badF = checkFilterDomain(q.filter, rows);
  if(badF) return {ok:false, why: badF};
  rows = applyFilter(rows, q.filter);
  if(q.refs) rows = rows.filter(r => q.refs.indexOf(r.ref) >= 0);
  /* Список и выгрузка отдают строку ЦЕЛИКОМ, поэтому датировка спрашивается обо всём её составе, а не о спрошенном: спрошенного состава здесь нет. */
  return {ok:true, rows, res, p: passportFor(st, q.obj, q.date, res, rows, q.filter, null, '*')};
}

/* Кто именно в этом числе. */
ST.statRows = q => {
  const r = rowsFor(ST.state, q);
  if(!r.ok) return r;
  if(r.rows.length > ST.rowsLimit) return {ok:false, overLimit:true, n: r.rows.length,
    obj: q.obj, date: q.date, limit: ST.rowsLimit, passport: r.p,
    why:'в этом числе '+r.rows.length+' строк, порог показа — '+ST.rowsLimit+
      ': списком не отдаётся. Сузьте вопрос разрезом или возьмите выгрузкой — усечённого '+
      'и постраничного ответа не бывает (ИС-22, ADR-0178 §1)'};
  return emit({rows: r.rows.map(x => clone(x))}, r.p);
};

/* Сверка целиком — не экран, а ЗАДАНИЕ на выгрузку, и паспорт едет ВНУТРИ файла: иначе он теряется ровно там, где нужнее всего. */
/* ВЫГРУЗКА: ФАЙЛ ЖИВЁТ N ДНЕЙ, ЗАДАНИЕ — ВСЕГДА. Задание — вопрос, заказчик, паспорт и история; файл — копия ответа в файловом хранилище, и его срок — параметр. */
const EXPORT_STATES = ['в очереди','готово','ошибка','expired'];
const EXPORT_KEEP_DAYS = 30;
function expireExports(st, todayISO){
  const out = [];
  st.exports.forEach(j => {
    if(j.state !== 'готово' || !j.ready_at || dayShift(j.ready_at, EXPORT_KEEP_DAYS) > todayISO) return;
    j.state = 'expired'; j.file = null; j.expired_at = todayISO;
    out.push(j.id);
  });
  return out;
}
ST.exportJob = q => {
  const st = ST.state, r = rowsFor(st, q);
  if(!r.ok) return r;
  const job = {id:'ВГ-'+String(st.exports.length + 1).padStart(3,'0'), obj: q.obj, date: q.date,
    n: r.rows.length, by: st.role, at: st.today, state:'в очереди',
    filter: q.filter ? clone(q.filter) : null,
    file:'statRows-'+q.obj+'-'+q.date+'.csv', passport: clone(r.p)};
  st.exports.unshift(job);
  log('оформлена выгрузка '+job.id+': '+OBJ(q.obj).name+', строк — '+job.n);
  return {ok:true, job: clone(job)};
};
ST.exportsList = () => clone(ST.state.exports);
/* Выполнение читает строки одним снимком. */
ST.exportRun = id => {
  const st = ST.state, j = st.exports.find(x => x.id === id);
  if(!j) return {ok:false, why:'выгрузки «'+String(id)+'» нет'};
  if(j.state !== 'в очереди') return {ok:false, why:'выгрузка «'+id+'» уже '+j.state};
  const r = rowsFor(st, {obj: j.obj, date: j.date, filter: j.filter});
  if(!r.ok){ j.state = 'ошибка'; j.why = r.why; j.done_at = st.today; return {ok:false, why: r.why, job: clone(j)}; }
  j.state = 'готово'; j.ready_at = st.today; j.n = r.rows.length;
  return {ok:true, job: clone(j)};
};
ST.expireExports = () => expireExports(ST.state, ST.state.today);
ST.exportStates = () => EXPORT_STATES.slice();
/* СЛОТЫ КЛАССИФИКАТОРОВ АДМИНИСТРАТОРА. У кредита, заёмщика и залога десять резервных слотов — колонки `d_clsN_code/_lbl/_ord`. */
const CLS_OBJECTS = {'obj-credit':'credit', 'obj-borrower':'borrower', 'obj-collateral':'collateral'};
const CLS_SLOTS = 10, CLS_WARN = 8;
const clsSlotCols = n => ['d_cls'+n+'_code', 'd_cls'+n+'_lbl', 'd_cls'+n+'_ord'];
ST.clsSlotCols = n => clsSlotCols(n);
ST.clsSlots = objId => clone(ST.state.clsSlots.filter(s => s.object === CLS_OBJECTS[objId]));
ST.takeSlot = (objId, clsId, sinceISO) => {
  const st = ST.state, object = CLS_OBJECTS[objId];
  if(!ST.canAdmin()) return {ok:false, why:'слот классификатора занимает администратор статистики'};
  if(!object) return {ok:false, why:'слоты классификаторов есть у кредита, заёмщика и залога; у «'+
    String(objId)+'» их нет (ADR-0241 §5)'};
  const mine = st.clsSlots.filter(s => s.object === object);
  const had = mine.find(s => s.classifier_id === clsId);
  if(had) return {ok:false, why:'классификатор «'+clsId+'» уже занимает слот '+had.slot+': один классификатор — один слот (ADR-0245 §1)'};
  if(mine.length >= CLS_SLOTS) return {ok:false, waits:true, why:'слоты объекта «'+object+'» кончились ('+
    mine.length+' из '+CLS_SLOTS+'): классификатор «'+clsId+'» ждёт релиза, добавляющего слоты (ADR-0241 §5)'};
  const slot = mine.length + 1;
  st.clsSlots.push({object, slot, classifier_id: clsId, since: sinceISO || st.today, until: null,
                    taken_by: st.role, taken_at: st.today});
  return {ok:true, object, slot, cols: clsSlotCols(slot),
          warn: slot >= CLS_WARN ? 'занято '+slot+' из '+CLS_SLOTS+' слотов: следующий релиз должен добавить слоты (ADR-0241 §5)' : null};
};
ST.releaseSlot = (objId, clsId, untilISO) => {
  const st = ST.state, object = CLS_OBJECTS[objId];
  if(!ST.canAdmin()) return {ok:false, why:'слот классификатора освобождает администратор статистики'};
  const s = st.clsSlots.find(x => x.object === object && x.classifier_id === clsId && !x.until);
  if(!s) return {ok:false, why:'классификатор «'+String(clsId)+'» слота у «'+String(objId)+'» не занимает'};
  s.until = untilISO || st.today;
  return {ok:true, object, slot: s.slot, until: s.until,
          note:'слот остаётся занятым: в нём история, и другому классификатору он не отдаётся'};
};

/* Второе действие числа, названное отдельно от первого: «кто в этом числе» — строки среза на дату среза; «работать со списком» — реестр владельца на СЕГОДНЯ. Разные списки здесь — это сутки, а не расхождение. */
ST.workList = (objId, sliceDate) => {
  const st = ST.state;
  const o = OBJ(objId);
  if(!o) return {ok:false, why:'объекта «'+objId+'» нет в реестре объектов (ИС-53)'};
  /* Дверь к «как сейчас» режется теми же правилами, что и срез: реестр владельца читает их над записью, строки среза — над строкой. */
  const today = ST.registryList(objId, st.today, null);
  const res = resolveAsOf(st, objId, sliceDate || st.q.date);
  const inSlice = res ? applyScope(rowsAsOf(st, objId, res.asOf), objId, res.asOf).length : 0;
  return {ok:true, obj: objId, list: today, n: today.length, asOf: res ? res.asOf : null, inSlice,
    note:'в реестре «'+o.owner+'» на сегодня '+today.length+
      (res ? ', в срезе от '+fmt(res.asOf)+' было '+inSlice : '')+
      ' — это сутки, а не расхождение'};
};

/* ИС-14: тот же человек в реестре владельца обязан увидеть тот же список. */
ST.registryList = (objId, dateISO, filter) => {
  const s = ST.scopeOf(objId);
  const o = OBJ(objId);
  return (WORLD[objId] || []).filter(item => {
    /* Реестр владельца НА ДАТУ не показывает того, чего на неё ещё не было: иначе сверка состава со срезом разошлась бы на ненаступившее. */
    const born = bornOn(o, item, dateISO);
    /* Рождение дня X видно срезу X+1. */
    if(born == null || born >= dateISO) return false;
    /* Охват читается ТЕМ ЖЕ читателем, что разрез. */
    if(s && !seesItem(objId, item, dateISO, s)) return false;
    /* Фильтр списку и фильтр числу — ОДНО сравнение над разными источниками: у среза строка, у владельца запись на дату. */
    const cd = curDimOf(objId);
    return matchFilter(filter, {dim: id => (DIM(id) || {}).via ? viaOfItem(id, item, dateISO) : readDim(id, item, dateISO),
                                ind: id => readInd(id, item, dateISO),
                                cur: id => rowCur({obj: objId, dims: cd ? {[cd]: readDim(cd, item, dateISO)} : {}}, id)});
  }).map(item => item.id).sort();
};

/* ====== АДРЕСОВ РОВНО ДВА, И ТРЕТЬЕГО НЕТ ====== */
const ADDRESS = {STAT:'статистика — число на дату', ROWS:'objectRows владельца — живой реквизит'};
const ADDRESSES = [ADDRESS.STAT, ADDRESS.ROWS];
ST.ADDRESS = ADDRESS;
ST.addresses = () => ADDRESSES.slice();
/* Счётчик обращений к восьмому шву — отдельный от `CORE.calls`. */
ST.objectRowCalls = () => CORE.rowCalls;
ST.resetObjectRowCalls = () => { CORE.rowCalls = 0; };
ST.cardFields = objId => clone((CARD[objId] || {fields:[]}).fields);
ST.cardOwner  = objId => (CARD[objId] || {}).owner || null;
/* Пары «датированная сторона ↔ живая»: у одной вещи их две, и это НЕ два адреса одного числа, а два РАЗНЫХ вопроса с разными ответами. */
ST.twins = objId => (CARD[objId] || {fields:[]}).fields.map(f => ({
  card: f.id, name: f.name, twin: f.twin || null,
  twinName: f.twin && REC(f.twin) ? REC(f.twin).name : null,
  twinKind: f.twin && REC(f.twin) ? REC(f.twin).kind : null}));
/* Шов соседа, названный потребителем адресом. */
const seamNamed = word => {
  const w = String(word || '').replace(/^шов:/, '').split('.')[0];
  return NEIGHBOURS.some(nb => nb.seams.indexOf(w) >= 0) ? w : null;
};
/* У КОГО ЭТО СПРАШИВАТЬ. Дверь читает и не пишет; отвечает она ОДНИМ адресом на ОДИН вопрос — либо отказывает, называя дорогу (§8.4). */
ST.where = (id, objId) => {
  const obj = objId || (ST.state && ST.state.q ? ST.state.q.obj : null);
  const R = REC(id);
  if(R) return {ok:true, id, address: ADDRESS.STAT, name: R.name, kind: R.kind,
    what:'число на дату',
