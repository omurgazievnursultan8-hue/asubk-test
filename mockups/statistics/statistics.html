   ПОТРЕБИТЕЛЬ (ИС-51, ADR-0222 §2). */
ST.objectRows = q => CORE.objectRows(q.obj, {fields: q.fields, refs: q.refs, at: ST.state.today});

/* ------- СПРОС ПОТРЕБИТЕЛЯ: ОДНА ПРОСЬБА, ДВА АДРЕСА, ОБЪЯВЛЕННОЕ СМЕШЕНИЕ ------- *
   Строка «кредит + сумма долга на 31.05 + нынешний куратор» законна: реквизиты от
   владельца, число от статистики. Но каждая величина несёт СВОЙ адрес и СВОЙ признак
   датировки, и паспорт печатает ОБА источника: смешивать можно, СКРЫВАТЬ смешение —
   нет (ADR-0222 §3, ИС-39).
   Отказ здесь ДВОИЧНЫЙ и на весь спрос: одна неадресуемая величина отменяет ответ
   целиком. Отдать остальное молча — это половина списка из ADR-0178 §1 в другом
   обличье: потребитель не узнает, что спросил не то, и поставит в отчёт неполное.     */
ST.consumerAsk = q => {
  const st = ST.state;
  const c = CONSUMERS.find(x => x.module === q.module);
  if(!c) return {ok:false, why:'модуль «'+q.module+'» потребителем статистики не объявлен: '+
    'круг спрашивающих — объявленный список, а не всякий, кто дозвонился (ADR-0152 §3)'};
  if(!c.may.length) return {ok:false, why: c.why};
  const o = OBJ(q.obj);
  if(!o) return {ok:false, why:'объекта «'+q.obj+'» нет в реестре объектов (ИС-18)'};
  const need = (q.need || []).slice();
  if(!need.length) return {ok:false, why:'спрос без состава не адресуется: адрес есть у '+
    'ВЕЛИЧИНЫ, а не у объекта (ИС-51)'};
  const routed = need.map(id => ST.where(id, q.obj));
  const bad = routed.find(x => !x.ok);
  if(bad) return {ok:false, why: bad.why, road: bad.road, id: bad.id, noCard: bad.noCard,
    seam: bad.seam};
  const statIds = routed.filter(x => x.address === ADDRESS.STAT).map(x => x.id);
  const liveIds = routed.filter(x => x.address === ADDRESS.ROWS).map(x => x.id);
  /* Построчный ответ статистики — это `statRows` по форме, и открыт он не всякому: у
     программ объявлен только свод, и построчный ответ им — не сужение вопроса, а другая
     дверь (ADR-0152 §3, ИС-13). */
  if(statIds.length && c.may.indexOf('statRows') < 0) return {ok:false,
    why:'модулю «'+q.module+'» построчный ответ статистики не открыт: ему объявлены '+
      c.may.join(', ')+' (ADR-0152 §3)',
    road:'спросите то же сводом — дверь у вас есть'};
  const r = rowsFor(st, {obj: q.obj, date: q.date, refs: q.refs, filter: null});
  if(!r.ok) return r;
  const dims = statIds.filter(id => DIM(id)), inds = statIds.filter(id => IND(id));
  const p = passportFor(st, q.obj, q.date, r.res, r.rows, null, inds, dims);
  let live = null;
  if(liveIds.length){
    live = CORE.objectRows(q.obj, {fields: liveIds, refs: r.rows.map(x => x.ref), at: st.today});
    if(!live.ok) return live;
  }
  const rows = r.rows.map(row => {
    const lr = live ? live.rows.find(x => x.ref === row.ref) : null;
    const cells = {};
    dims.forEach(id => { cells[id] = {v: row.dims[id], address: ADDRESS.STAT,
      when: (row.when || {})[id] || DATING.NOW}; });
    inds.forEach(id => { cells[id] = Object.assign({}, row.inds[id] || {v: null},
      {address: ADDRESS.STAT, when: (row.when || {})[id] || DATING.NOW}); });
    liveIds.forEach(id => { cells[id] = {v: lr ? lr.cells[id].v : null,
      address: ADDRESS.ROWS, when: DATING.NOW}; });
    return {ref: row.ref, cells};
  });
  const used = [];
  if(statIds.length) used.push({address: ADDRESS.STAT, n: statIds.length, ids: statIds.slice(),
    names: statIds.map(id => (REC(id) || {name: id}).name), asOf: r.res.asOf});
  if(liveIds.length) used.push({address: ADDRESS.ROWS, n: liveIds.length, ids: liveIds.slice(),
    names: liveIds.map(id => CARD_F(q.obj, id).name), owner: live.owner, at: live.at});
  p.addresses = used;
  p.mixed = used.length > 1;
  p.addressText = used.map(u => u.address+' — '+u.n+' ('+u.names.join(', ')+')').join(' · ')+
    (p.mixed
      ? '. Строка СМЕШАННАЯ: реквизиты от владельца «'+live.owner+'» на '+fmt(live.at)+
        ', числа от статистики на '+fmt(r.res.asOf)+'. Смешивать можно, скрывать смешение — '+
        'нет (ИС-51, ADR-0222 §3)'
      : '. Адрес один, смешения нет');
  /* Живая половина датируется ТЕКУЩИМ по построению, и в паспорт она входит наравне с
     величинами среза: иначе датировка заверила бы «на дату» ответ, половина которого
     собрана сегодняшней карточкой (ИС-39, ADR-0205 §2). */
  if(liveIds.length){
    const d = p.dating;
    liveIds.forEach(id => {
      if(d.now.indexOf(id) >= 0) return;
      d.now.push(id); d.names.push('«'+CARD_F(q.obj, id).name+'»'); d.n++;
    });
    d.word = d.now.length && d.asof.length ? 'смешанно' : d.now.length ? DATING.NOW : DATING.ASOF;
    d.text = 'величин в ответе — '+d.n+', из них ТЕКУЩИМИ собраны '+d.now.length+': '+
      d.names.join(' · ')+' — живой реквизит карточки на дату не отвечает вовсе, у него нет '+
      'даты (ИС-51, ADR-0222 §2), а взятые срезом величины лежат на '+fmt(r.res.asOf)+
      '. Отчёт за один и тот же период, собранный в разные дни, по ним разойдётся без всякой '+
      'ошибки (ИС-39, ADR-0205)';
  }
  return emit({rows, routed: routed.map(x => ({id: x.id, address: x.address, name: x.name})),
    hidden: live ? live.hidden : 0}, p);
};

/* ИС-17: период — разность двух строк нарастающего итога. База, если строки на
   начало интервала нет, НАЗЫВАЕТСЯ (ADR-0151 §2). */
ST.flowBetween = q => {
  const st = ST.state;
  const I = IND(q.inds);
  if(!I) return {ok:false, why:'показателя «'+q.inds+'» нет в реестре (ИС-7)'};
  if(!I.flow) return {ok:false, why:'«'+I.name+'» не поток: разностью двух строк считаются только нарастающие итоги (ИС-17)'};
  /* ПЕРИОД ПО СОМОВОЙ ЗАПИСИ НЕ СЧИТАЕТСЯ (ИС-44 + ADR-0151 §3, оставленный в силе
     ADR-0214 §7). Разность двух сомовых снимков — это движение ПЛЮС курсовая разница,
     слипшиеся в одно число, и разделить их потом нечем: у сомовой колонки на двух датах
     два разных курса. Курсовая разница есть разность двух срезов и отдельной величиной
     не бывает; движение спрашивается у ВАЛЮТНОЙ записи, где разность берётся внутри
     каждой валюты, а к сому приводится один раз — курсом конца периода. */
  if(I.somOf){
    const O0 = IND(I.somOf);
    return {ok:false, why:'период по сомовой записи «'+I.name+'» не считается: разность двух '+
      'сомовых снимков несёт в себе КУРСОВУЮ РАЗНИЦУ — на двух датах курс разный, — и движение '+
      'от переоценки в этом числе уже не отделить. Спрашивайте «'+(O0 ? O0.name : I.somOf)+'»: '+
      'разность там берётся внутри каждой валюты и приводится к сому один раз, курсом конца '+
      'периода. Саму курсовую разницу считайте разностью двух срезов — колонкой она не '+
      'становится (ИС-44, ADR-0151 §3, ADR-0214 §7)'};
  }
  const tail = dateGate(st, q.obj, q.to);
  if(tail) return {ok:false, why: tail};
  const a = resolveAsOf(st, q.obj, q.from), b = resolveAsOf(st, q.obj, q.to);
  if(!b) return {ok:false, why:'строк на '+fmt(q.to)+' и ранее нет (ИС-12)'};
  const badF = checkFilterShape(q.filter, q.obj);
  if(badF) return {ok:false, why: badF};
  const endScoped = applyScope(rowsAsOf(st, q.obj, b.asOf), q.obj);
  const badD = checkFilterDomain(q.filter, endScoped);
  if(badD) return {ok:false, why: badD};
  const endRows = applyFilter(endScoped, q.filter);
  const baseRows = a ? applyFilter(applyScope(rowsAsOf(st, q.obj, a.asOf), q.obj), q.filter) : [];
  let sum = 0; const born = [];
  endRows.forEach(r => {
    const end = r.inds[q.inds]; if(!end) return;
    const bs = baseRows.find(x => x.ref === r.ref);
    if(!bs) born.push(r.ref);
    /* Разность берётся ПО ВАЛЮТАМ и только потом сводится в сом: вычесть сомовую базу из
       долларового конца — та же ошибка, что сложить их (ADR-0151 §4, ADR-0184 §3). */
    const was = {};
    partsOf(bs && bs.inds[q.inds]).forEach(p => { was[p.cur] = p.v; });
    /* Пересчёт — в ядре и только там: разности по валютам собираются в состав и
       отдаются `CORE.toSom`, у которого правило округления одно на всю систему
       (ADR-0214 §3, §6). Своего умножения на курс здесь больше нет. */
    const diff = partsOf(end).map(p => ({cur: p.cur, value: p.v - (was[p.cur] || 0),
      rate: p.rate == null ? 1 : p.rate, rateDate: p.rateDate}));
    const som = CORE.toSom(diff, roundOf(I));
    if(som) sum += som.value;
  });
  const p = passportFor(st, q.obj, q.to, b, endRows.concat(baseRows), q.filter, [q.inds]);
  p.base = a ? {requested: q.from, asOf: a.asOf, named: a.substituted} : null;
  p.baseNote = a
    ? (a.substituted ? 'база периода: '+fmt(a.asOf)+' вместо '+fmt(q.from) : 'база периода: '+fmt(a.asOf))
    : 'строки на начало периода нет — период считается от рождения объекта';
  return emit({value: CORE.somRound(sum, roundOf(I)), round: roundOf(I), cur:'KGS',
    from:q.from, to:q.to, baseDate: a ? a.asOf : null, born}, p);
};

/* Кто вправе спрашивать. Классификация — не вправе (ИС-5). */
ST.callSeam = (module, seam, q) => {
  const c = CONSUMERS.find(x => x.module === module);
  if(!c) return {ok:false, why:'модуль «'+module+'» в списке потребителей не значится'};
  /* ADR-0152 §1 закрывает список вопросов О ДАННЫХ — «дай срез», «дай ряд», «дай строки».
     Вопрос о ПОВОДАХ данными не является и швом не становится: он спрашивает не числа, а
     работу для человека, и ходит своей дверью (ADR-0210 §1). Слей их в одном отказе — и
     «четвёртого шва нет» прочиталось бы как «поводов у статистики не спрашивают». */
  if(SEAMS.indexOf(seam) < 0) return {ok:false, why:'шва «'+seam+'» нет: швов ДАННЫХ три, '+
    'четвёртый не заводится (ADR-0152 §1). Вопрос о поводах данными не является и идёт '+
    'своей дверью — ST.askLeads (ADR-0210 §1)'};
  if(c.may.indexOf(seam) < 0) return {ok:false, why: c.why || ('модулю «'+module+'» шов '+seam+' не открыт')};
  return ST[seam](q);
};

/* ИС-20 СУЖЕНА волной 17 ч.8 (ADR-0208 §3), и сужена ровно на один случай.
   ЧУЖОГО периода статистика не запирает по-прежнему: в сводку препятствий кредитного
   модуля (ADR-0113) отсюда не уходит ничего, и нижние слои общего календаря — учёт,
   классификация — закрываются независимо, что бы здесь ни случилось. Речь о СВОЕЙ
   защёлке, верхней колонке. Было: не запирает и её — вообще ничем. Стало: не запирает
   своим РАСПИСАНИЕМ (пропущенный прогон — предупреждение: дыра в прошлом не заполнится,
   ждать нечего, и запирать месяц из-за неё значит держать закрытие вечно), но ЗАПИРАЕТ
   на неполной строке. Разница не в строгости, а в том, чем кончится ожидание: пропуск
   окончателен, молчание соседа — нет, оно чинится дозаполнением (§4), и ждать тут есть
   чего. Слить эти два случая в один ответ нельзя ни в какую сторону: сделай пропуск
   блокировкой — календарь встанет навсегда; сделай неполноту предупреждением —
   окончательность защёлки перестанет что-либо значить, потому что «окончательно»
   поверх дыры с известной причиной есть подпись под тем, чего не видел (ИС-9).
   Оба ответа даёт ОДНА дверь и разными полями: смешай их в один список — и вызывающему
   пришлось бы разбирать блокировку от предупреждения по тексту фразы.                  */
ST.periodBlockers = month => {
  const st = ST.state;
  const days = st.runs.filter(r => ym(r.date) === month);
  const skipped = days.filter(r => r.kind === 'пропуск');
  const warnings = skipped.map(s => 'прогон за '+fmt(s.date)+' не состоялся: '+s.reason);
  /* Перечень ПЕЧАТНЫЙ, а не счётный (ADR-0208, последствия): «неполных строк 12» не
     говорит, кого будить, а разбор ночи начинается именно с этого. Поэтому группируется
     по СОСЕДУ — единице, с которой разговаривают, — и внутри называет объекты и счёт. */
  const bad = st.rows.filter(r => ym(r.date) === month && silentOf(r).length);
  const by = {};
  bad.forEach(r => silentOf(r).forEach(nb => {
    const k = by[nb] || (by[nb] = {nb, reasons:[], objs:{}, n:0});
    k.n++;
    k.objs[r.obj] = (k.objs[r.obj] || 0) + 1;
    const why = r.srcs[nb].reason;
    if(k.reasons.indexOf(why) < 0) k.reasons.push(why);
  }));
  const blockers = Object.keys(by).map(nb => {
    const k = by[nb];
    const objs = Object.keys(k.objs).map(id => (OBJ(id) || {name:id}).name+' — '+k.objs[id]);
    return {nb, n: k.n, reasons: k.reasons, objs: Object.keys(k.objs),
      text: 'сосед «'+nb+'» не ответил ('+k.reasons.join(', ')+'): строк — '+k.n+
            ' по объектам '+objs.join(' · ')};
  }).sort((a, b) => b.n - a.n);
  return {blockers, warnings};
};
/* Затянувшееся молчание — не техническая заметка, а РАБОТА ДЛЯ ЧЕЛОВЕКА, и она идёт
   обычным поводом (ADR-0208 §7). Считается по ЖУРНАЛУ ПРОГОНОВ, а не по строкам: сосед,
   молчавший по объекту, у которого в ту ночь ничего не менялось, строки не оставил вовсе,
   и по строкам его молчание выглядело бы короче, чем было.
   Подряд — значит подряд: одна ответившая ночь обнуляет счёт, потому что повод «сосед
   недоступен» ею и закрывается.
   КЛЮЧ ПОВОДА, и волна 17 ч.9 его ИСПРАВИЛА. Было «вид + сосед» — и по букве ADR-0211 §1
   ключу недоставало третьей части, ПЕРИОДА («вид повода + объект + период»). Недостача
   не косметическая: молчание с 3-го по 5-е, ответившая ночь, молчание с 10-го по 12-е —
   это ДВА повода, а не один. Отпавший повод остаётся видимым до закрытия человеком
   (ADR-0211 §4), и второй, придя под тем же ключом, слился бы с незакрытым первым —
   заданиям он выглядел бы как никуда не девавшийся, и разбор первого молчания закрыл бы
   заодно второе, которого никто не видел. Периодом здесь работает НЕПРЕРЫВНАЯ ПОЛОСА
   молчания, названная своей первой ночью, а не учётный месяц: месяц разрезал бы одно
   молчание надвое на полуночи 31-го числа и завёл бы второй повод там, где ничего не
   произошло.
   ГРАНИЦА СНЯТА: повод больше не только объявлен — он ОТДАЁТСЯ дверью `ST.askLeads`
   (ADR-0210 §1). Самого модуля заданий в макете по-прежнему нет, и это уже другая
   граница: дверь есть и отвечает, спрашивающего нет.                                   */
ST.silenceLeads = n => {
  const st = ST.state, need = n || 3;
  const runs = st.runs.filter(r => r.kind !== 'пропуск').slice().sort((a,b) => a.date < b.date ? -1 : 1);
  return NEIGHBOURS.map(nb => {
    let streak = 0, from = null, why = [];
    runs.forEach(r => {
      const s = (r.silent || {})[nb.id];
      if(s){ if(!streak) from = r.date; streak++; if(why.indexOf(s) < 0) why.push(s); }
      else { streak = 0; from = null; why = []; }
    });
    return {nb: nb.id, streak, from, reasons: why};
  }).filter(x => x.streak >= need).map(x => ({
    kind:'сосед молчит', nb: x.nb, key:'сосед-молчит/'+x.nb+'/с-'+x.from, runs: x.streak,
    obj: x.nb, period: 'молчание с '+x.from, from: x.from, reasons: x.reasons,
    text:'сосед «'+x.nb+'» молчит '+x.streak+' '+
         plural(x.streak,'прогон','прогона','прогонов')+' подряд с '+fmt(x.from)+
         ' ('+x.reasons.join(', ')+') — повод модулю заданий (ADR-0208 §7)'}));
};

/* ------------- ДВЕРЬ ПОВОДОВ (ADR-0210 §1, ADR-0211) -------------
   У соседа заданий ровно одна обязанность к каждому модулю — уметь ответить на вопрос о
   поводах НА ДАТУ, множеством за одно обращение. Статистика эту обязанность исполняет
   здесь, и дверь устроена по ADR-0211 тремя правилами:
   1. Отдаётся ПОЛНОЕ МНОЖЕСТВО актуальных поводов на дату, а не приращение с прошлого
      раза. Это СВЕРКА, а не приём: пропущенный опрос ничего не теряет, потому что
      следующий отдаёт всё, что есть сейчас.
   2. Повторный опрос ИДЕМПОТЕНТЕН: ключ устойчив, и семь опросов одного дня дают одно
      задание, а не семь.
   3. ОТПАВШИЙ ПОВОД НЕ ИСЧЕЗАЕТ МОЛЧА — он просто не приходит в полном множестве, и
      заданиям видно, что ключа больше нет. Своего «отменяю задание» статистика не шлёт
      и слать не может: закрывает задание тот, кто его вёл.
   Видов повода у статистики сегодня ОДИН — «сосед молчит» (ADR-0208 §7); список видов
   отдаётся вместе с множеством, иначе «поводов нет» не отличить от «этот вид сюда ещё
   не завели». PULL, а не PUSH — тем же доводом, что и опрос соседей: потерянное
   уведомление необнаружимо (ADR-0210, ADR-0221 §4).                                   */
const LEAD_KINDS = ['сосед молчит'];
const LEAD_ASKERS = ['задания'];
ST.leadKinds = () => LEAD_KINDS.slice();
ST.askLeads = (module, dateISO) => {
  if(LEAD_ASKERS.indexOf(module) < 0) return {ok:false, why:'поводы спрашивает модуль заданий; '+
    'модуль «'+String(module)+'» в списке не значится (ADR-0210 §1)'};
  const st = ST.state, at = dateISO || st.today;
  if(at > st.today) return {ok:false, why:'поводы на будущую дату не спрашиваются: повод есть СОСТОЯНИЕ на дату (ADR-0211 §1)'};
  return {ok:true, module:'статистика', date: at, kinds: LEAD_KINDS.slice(), full: true,
          leads: ST.silenceLeads(3)};
};

/* ======================= ОПЕРАЦИИ НАД РЕЕСТРАМИ ===================== */
/* Список ИМЁН — запрет ПРЕДСТАВЛЕНИЯ, и ничего больше (ИС-15): доля и процент от чего-то
   считаются ПРИ ПОКАЗЕ из того, что уже лежит в строке, а хранимая доля
   разъезжается со своими частями. Критерием многодатности этот список не был и не будет:
   он пропускает «темп роста портфеля» и «миграцию из категории в категорию» — нужного слова
   в них просто нет, — и отверг бы законную величину, случайно назвавшуюся похоже. Сколько
   дат нужно, спрашивается реквизитом `dates` и проверяется ЧИСЛОМ (ИС-47, ADR-0220 §1).
   «Дельта» и «прирост» ушли отсюда именно поэтому: они отвергаются не по слову в имени, а
   по объявленным двум датам, и отказ им называет АДРЕС вместо «нельзя».
   «СОМОВЫЙ ЭКВИВАЛЕНТ» УШЁЛ ОТСЮДА ВОЛНОЙ 17 и ушёл по третьей, отдельной причине:
   он больше не представление вовсе (ИС-44, ADR-0214 отменил ADR-0151 §2, ADR-0150 §4 и
   ADR-0147 §6 в этой части). Сомовая величина — полноправная запись реестра со своим
   именем и своей колонкой замороженной строки, и заявка «Сомовый эквивалент чего-нибудь»
   теперь заводится как обычная запись, а не отбивается на входе. Довод ИС-15 против неё
   не работал никогда: хранимая производная опасна тем, что разъезжается с основанием, а у
   этой основание — соседние колонки ТОЙ ЖЕ замороженной строки, и сторож перемножает их на
   каждой записи. Запрет сузился ровно на треть и остался жив для остальных двух. */
const SHOWN = ['доля','процент от'];
/* Удельная величина — не показатель, а ПАРА «срез + счёт» (ИС-35, ADR-0200): композиция
   ИС-32 (отношение показателем не бывает) и ИС-30 (счёт чужих объектов — вопрос тому
   объекту). Загрузка куратора читается сменой уровня среза, а знаменатель спрашивается у
   своего владельца. Снятый на месте `count distinct` занижает знаменатель СИСТЕМАТИЧЕСКИ и
   в одну сторону: тот, у кого ноль строк, в срез не попадает вовсе. */
const PER_UNIT = ['на куратора','на одного','на сотрудника','на работника','на единицу',
                  'удельн','нагрузка на','в среднем на','на человека'];
/* Одноимённых записей в реестре не бывает ни при каких объектах (ИС-40, ADR-0206 §1 и §6):
   два разреза «Территория» или два показателя «Расходы по взысканию, итого» и есть тот самый
   случай «имя врёт» — два отчёта с одинаковым заголовком дают разные числа, и различить их
   читателю нечем: у него на бумаге одно слово. Уточнить имя объектом обязан ЗАВОДЯЩИЙ.
   Единственное исключение — разрез и показатель ОДНОГО объекта, читающие ОДНУ клетку:
   «Худшая категория» заёмщика и режет множество, и предъявляется предикату классификации,
   но это ОДНА величина в двух породах, а не две под одним именем (ADR-0185 §3, ADR-0209).
   Ни другой объект, ни другая дорога до значения такого исключения не получают: два числа,
   которые нельзя сложить, — два имени, а не одно с оговоркой в примечании (ADR-0206 §6). */
const nameRoad = r => [r.src, r.seam || '', r.field || '', r.key || ''].join('|');
function nameTaken(st, spec, kind){
  /* Кладовая ОДНА, и имя ищется по ней целиком (ИС-43, ADR-0209): при двух реестрах этот
     поиск шёл бы дважды и пришлось бы договариваться, чей ответ главнее. */
  const hit = st.registry.find(r => r.name === spec.name && r.id !== spec.id);
  if(!hit) return null;
  if(hit.kind !== kind && hit.obj === spec.obj && nameRoad(hit) === nameRoad(spec)) return null;
  return 'имя «'+spec.name+'» в реестре занято — оно у записи «'+hit.id+'» ('+hit.kind+
    ' объекта «'+((OBJ(hit.obj) || {}).name || hit.obj)+'»). Величины, не складывающиеся '+
    'между собой, не носят одного имени: два отчёта с одинаковым заголовком дали бы разные '+
    'числа, и различить их было бы нечем. Уточните имя объектом определения (ИС-40, ADR-0206 §1, §6)';
}

/* ============= ОДИН ВАЛИДАТОР НА ОБЕ ПОРОДЫ (ИС-43, ADR-0209 §1–§4) ============== *
   До ADR-0209 обязательность реквизита была свойством ДВЕРИ: что спрашивал `addDim`, то
   у разреза и было обязательным, а что спрашивал `addIndicator` — у показателя. Двери
   писались в разные волны, и одна успела спросить объект определения, а другая — нет.
   Теперь обязательность — свойство ПОРОДЫ: список реквизитов закрыт с обеих сторон
   (`FIELDS`), проверка одна, а двери остались дверьми и только проставляют породу.
   Порядок отказов сохранён: он сам по себе ответ — сперва «чем запись объявлена»,
   потом «о ком она», потом «откуда берётся величина», и лишь затем «как она читается».  */
const EXCL = {};
EXCL[KIND.IND] = F_IND;
EXCL[KIND.DIM] = F_DIM;
const FIELD_RU = {type:'тип', unit:'единица измерения', money:'денежность', flow:'поток',
  fn:'функция агрегата', over:'показатель-основание агрегата', live:'исчислимость налету',
  dedupBy:'дедуп-ключ', roll:'правило свода', rollBy:'обязательный разрез свода',
  somOf:'валютная запись, чьей сомовой стороной является эта',
  round:'правило округления',
  levels:'уровни (иерархия)', buckets:'корзины',
  edges:'границы корзин', ref:'справочник значений', owner:'владелец справочника',
  perObject:'значений на один объект', basis:'показатель-основание', order:'порядок значений'};
const KIND_WHY = 'порода объявляется одной из двух — показатель или разрез: третьей породы '+
  'в реестре нет, свод и темп записями не становятся (ИС-43, ADR-0209, «Границы»)';

/* Реквизит чужой породы — отказ, а не «необязательное поле». Единица измерения у признака
   и иерархия у числа — это не лишняя строка в форме: это запись, про которую не объявлено,
   чем она должна быть, и потому проверить в ней нечего (ADR-0209, «Отвергнуто»). */
function alienField(spec, kind){
  const other = kind === KIND.IND ? KIND.DIM : KIND.IND;
  const k = Object.keys(spec).find(x => EXCL[other].indexOf(x) >= 0);
  if(!k) return null;
  return 'реквизит «'+(FIELD_RU[k] || k)+'» принадлежит породе «'+other+'», а запись объявлена '+
    'породой «'+kind+'»: у признака не бывает единицы измерения, у числа — иерархии значений. '+
    'Необязательным полем это не делается — тогда в форме нечего проверять, потому что не '+
    'объявлено, чем запись должна быть (ИС-43, ADR-0209 §1–§3)';
}

/* --- реквизиты породы «показатель» (ADR-0209 §2) --- */
function checkInd(st, spec){
  /* Отказ по ПРЕДСТАВЛЕНИЮ, а не по многодатности: доля и «процент от» считаются на
     ОДНОЙ дате из того, что в строке уже лежит, и правило ИС-47 их не касается вовсе —
     две величины на одной дате есть по-прежнему одна дата (ADR-0220 §2). */
  if(SHOWN.some(d => (spec.name || '').toLowerCase().indexOf(d) >= 0))
    return 'доля и процент от чего-то — представление, а не показатель: они '+
      'считаются ПРИ ПОКАЗЕ из того, что уже лежит в строке, и не хранятся — хранимая доля '+
      'разъезжается со своими частями при первом же пересчёте (ИС-15). Дат тут по-прежнему одна, '+
      'и спор о хранении решает ADR-0150 §4, а не правило о числе дат (ADR-0220 §2). '+
      'Сомового эквивалента в этом запрете больше НЕТ: он стал записью реестра со своим именем '+
      'и своей колонкой, потому что основание пересчёта заморожено в той же строке (ИС-44, ADR-0214)';
  if(PER_UNIT.some(d => (spec.name || '').toLowerCase().indexOf(d) >= 0))
    return 'удельная величина показателем не бывает — это пара «срез + счёт»: '+
      'числитель берётся счётом СВОИХ строк в нужном разрезе, знаменатель есть счёт объектов '+
      'другого уровня и спрашивается у ТОГО объекта (ИС-30). Снятый здесь «distinct» занижает '+
      'знаменатель систематически: у кого ноль строк, тот в срез не попадает вовсе (ИС-35, ADR-0200)';
  if(['шов','поле','агрегат'].indexOf(spec.src) < 0)
    return 'источник объявляется одним из трёх: шов ядра · поле объекта · агрегат (ADR-0150 §1)';
  if(spec.src === 'шов' && typeof CORE[spec.seam] !== 'function')
    return 'шва «'+spec.seam+'» у ядра нет: нужная величина заводится В ЯДРЕ и появляется здесь полем шва — промежуточного пути нет (ADR-0150 §3)';
  /* Шов есть, а СОСЕДА за ним не объявлено — отказ такой же твёрдый. Незаявленный шов
     отвечал бы молча: колонки источника у него нет, и в ночь, когда он не ответит, строка
     объявила бы себя полной, потеряв величину без следа (ИС-42, ADR-0208 §2). */
  if(spec.src === 'шов' && !nbOfSeam(spec.seam))
    return 'шов «'+spec.seam+'» ничьим не бывает: за каждым швом объявлен СОСЕД, иначе в ночь его молчания строка не заведёт колонки источника и объявит себя полной, потеряв величину без следа. Объявленные соседи: '+NEIGHBOURS.map(n => n.id+' ('+n.seams.length+')').join(' · ')+' (ИС-42, ADR-0208 §2)';
  if(spec.src === 'агрегат'){
    /* Счёт объектов ДРУГОГО уровня функцией здесь не заводится: «сколько заёмщиков в срезе
       кредитов» — вопрос объекту «Заёмщик», у которого он и считается числом своих строк.
       Распределённый счёт по чужому ключу неаддитивен и рвёт ИС-14 на первом же statRows
       (ИС-30, ADR-0186). Отказ назван вслух и указывает дорогу. */
    if(/distinct|уникальн|различн|неповтор/i.test(String(spec.fn)))
      return 'счёт объектов другого уровня — вопрос ТОМУ объекту, а не функция здесь: спросите объект, который считаете, и он ответит числом своих строк (ИС-30, ADR-0186)';
    if(!AGG_FNS[spec.fn]) return 'функция «'+spec.fn+'» вне закрытого списка: '+Object.keys(AGG_FNS).join(', ');
    if(spec.fn !== 'count' && !IND(spec.over)) return 'агрегат считается по показателю реестра — «'+spec.over+'» в нём нет (ИС-7)';
  }
  if(spec.src === 'поле' && !spec.key) return 'поле объекта не названо';
  if(spec.dedupBy){
    /* Ключ дедупа — РАЗРЕЗ этого же объекта: он обязан лежать в строке и читаться тем же
       читателем, что всё остальное (ИС-18). Иначе схлопывать нечем, и «один раз на кредит»
       осталось бы обещанием в комментарии. */
    if(spec.src === 'агрегат')
      return 'дедуп-ключ объявляется у СТРОЧНОГО показателя, а не у агрегата: схлопываются строки, агрегат его только применяет (ИС-34)';
    const D = DIM(spec.dedupBy), o0 = OBJ(spec.obj);
    if(!D) return 'дедуп-ключ «'+spec.dedupBy+'» разрезом реестра не объявлен: ключом бывает то, что лежит в строке (ИС-18, ИС-34)';
    if(!o0 || o0.dims.indexOf(spec.dedupBy) < 0)
      return 'разрез «'+D.name+'» объекту не принадлежит: ключ дедупа обязан лежать в СТРОКЕ, иначе схлопывать нечем (ИС-34)';
  }
  const taken = nameTaken(st, spec, KIND.IND);
  if(taken) return taken;
  /* Правило свода — реквизит, а не умолчание движка (ADR-0174, ADR-0209 §2). Список
     закрыт: «своё правило» есть формула, вписанная в соседнее поле. */
  if(spec.roll && ROLLS.indexOf(spec.roll) < 0)
    return 'правило свода объявляется одним из трёх: '+ROLLS.join(' · ')+'. «'+spec.roll+'» вне '+
      'списка — а своё правило свода и есть формула, только вписанная в соседнее поле (ADR-0174, ADR-0209 §2, §4)';
  /* ------ НЕАДДИТИВНОСТЬ ОБЪЯВЛЯЕТСЯ РЕКВИЗИТОМ, А НЕ ПОВЕДЕНИЕМ (ИС-44) ------
     ADR-0214 §1. «Сумма в валюте договора» аддитивна ТОЛЬКО внутри разреза «валюта», и
     разрез этот НАЗЫВАЕТСЯ здесь, в записи: движку не с чего догадываться, по какому
     признаку величина складывается, а спрашивающему — неоткуда узнать, почему ему
     отказали. Разрез обязан существовать и принадлежать ТОМУ ЖЕ объекту: после волны 17
     разрезов валюты несколько и они разные записи, и «сложить внутри валюты платежа»
     ничего не говорит о сумме требований (ИС-40, ADR-0206 §3). */
  if(spec.roll === 'формульный'){
    if(!spec.rollBy)
      return 'свод объявлен формульным, а разрез, внутри которого величина складывается, не назван: '+
        'формульный свод и означает «аддитивна только внутри названного разреза». Не назови его — и '+
        'движку не с чего отказать в разновалютном итоге, а спрашивающему неоткуда узнать, почему '+
        'сумма долларов с сомами не считается (ИС-44, ADR-0214 §1)';
    const RB = DIM(spec.rollBy);
    if(!RB) return 'обязательный разрез свода «'+spec.rollBy+'» разрезом реестра не объявлен: '+
      'сводить внутри признака, которого нет в строке, нечем (ИС-18, ИС-44)';
    if(RB.obj !== spec.obj){
      const my = OBJ(spec.obj), own = my ? (my.dims || []).map(DIM).find(d => d && /валют/i.test(d.name || '')) : null;
      return 'обязательный разрез свода «'+RB.name+'» ('+RB.id+') определён на объекте «'+
        ((OBJ(RB.obj) || {}).name || RB.obj)+'» ('+RB.obj+') и объекту показателя «'+
        ((my && my.name) || spec.obj)+'» ('+spec.obj+') не принадлежит: складывать по разрезу законно '+
        'только внутри его объекта — признака чужого объекта в строке попросту нет, и «внутри валюты '+
        'платежа» ничего не говорит о сумме требований'+
        (own ? '. Разрез валюты ЭТОГО объекта — «'+own.name+'» ('+own.id+')'
             : '. Разреза валюты у этого объекта нет — заведите его первым')+
        ' (ИС-40, ИС-44, ADR-0206 §3, ADR-0214 §1)';
    }
  } else if(spec.rollBy)
    return 'обязательный разрез свода объявлен, а свод не формульный: разрез свода ограничивает '+
      'сложение и потому имеет смысл ровно там, где сложение ограничено. У аддитивной величины '+
      'ограничивать нечего (ИС-44, ADR-0214 §1, ADR-0209 §2)';
  /* ДВЕРЬ СПРАШИВАЕТ, а не догадывается (ИС-44, ADR-0214 §1). Денежная строчная величина
     хранится в ВАЛЮТЕ ДОГОВОРА, и складывать её через границу валют нельзя — значит
     умолчания «аддитивна» у неё нет и быть не может: молчаливое умолчание и есть та самая
     ловушка, из-за которой разновалютные итоги молча складывались. Умолчание есть только у
     ПЕРЕНОСА демо-реестра, где отвечать некому. Сомовая запись из правила изъята — она
     аддитивна всегда, и в этом весь смысл её отдельного имени (§2). */
  if(spec.money && !spec.somOf && spec.src !== 'агрегат' && spec.roll !== 'формульный'){
    const o0 = OBJ(spec.obj);
    const cd = o0 ? (o0.dims || []).map(DIM).find(d => d && /валют/i.test(d.name || '')) : null;
    return 'у денежной величины «'+(spec.name || spec.id)+'» не назван разрез, внутри которого она '+
      'складывается: сумма хранится в валюте договора, и по разновалютному множеству она не '+
      'аддитивна — умолчания «аддитивна» у денег нет. Объявите свод формульным и назовите разрез '+
      'валюты ЭТОГО объекта'+(cd ? ' — у объекта «'+o0.name+'» это «'+cd.name+'» ('+cd.id+')' :
        ': у объекта «'+((o0 && o0.name) || spec.obj)+'» разреза валюты нет, заведите его первым')+
      '. Сомовая сторона встанет рядом сама — отдельным вызовом её не заводят (ИС-44, ADR-0214 §1, §2)';
  }
  /* ------ ПРАВИЛО ОКРУГЛЕНИЯ — РЕКВИЗИТ ЗАПИСИ, А НЕ СВОЙСТВО КОДА (ADR-0214 §6) ------
     Величина, округлённая по правилу, которого нет в записи, читающему реестр не видна:
     он ставит её в состав отчёта, не зная, до чего она округлена, — а реестр и есть
     контракт (ADR-0150 §5). Пока правило жило только в коде, оно оказывалось в трёх
     местах разным, и два отчёта об одном и том же расходились на копейку, разобрать
     которую было нечем. Поэтому здесь ТРИ вопроса, и все три — проверяемые.            */
  /* Первый: правило названо и оно ОБЪЯВЛЕНО. Своего правила запись не заводит — она
     ссылается на объявление ядра, и других ссылок в системе нет. */
  if(spec.round && !CORE.rounding(spec.round))
    return 'правило округления «'+spec.round+'» не объявлено: запись на правило ССЫЛАЕТСЯ, а '+
      'не заводит своё — иначе правил стало бы два и два отчёта об одной величине разошлись '+
      'бы на копейку. Объявленные правила: '+
      CORE.roundings().map(r => '«'+r.id+'» — '+r.name).join(' · ')+
      ' (ИС-44, ADR-0214 §6)';
  /* Второй: реквизит принадлежит ДЕНЕЖНОЙ записи. У количества дней и числа объектов
     округлять до копейки нечего, и объявленное здесь правило было бы вторым ответом на
     вопрос, которого никто не задавал (ADR-0209 §2). */
  if(spec.round && !spec.money)
    return 'правило округления объявлено у неденежной записи «'+(spec.name || spec.id)+'»: '+
      'реквизит принадлежит денежной величине — до копейки округляют сумму, а не дни и не '+
      'штуки. Свод денежных наследует правило от показателя-основания и своего не объявляет '+
      '(ИС-44, ADR-0214 §6, ADR-0209 §2)';
  /* Третий: у денежной записи правило ОПРЕДЕЛЕНО — объявлено здесь или унаследовано от
     названного показателя-основания, ровно как тип и единица. Молчание — отказ: у
     денежной величины не спрошено, по какому правилу она округляется, и «как обычно»
     здесь означает «как в том месте кода, куда попадёт вопрос». */
  if(spec.money && !roundOf(spec))
    return 'у денежной величины «'+(spec.name || spec.id)+'» не названо правило округления: '+
      'читающий реестр не видит, до чего округлено число, которое он ставит в состав отчёта, '+
      'а реестр и есть контракт. Умолчания у денег нет — молчаливое «как обычно» и есть та '+
      'копеечная разница двух отчётов об одном и том же. Объявите ссылкой на правило системы: '+
      CORE.roundings().map(r => '«'+r.id+'» ('+r.text+')').join(' · ')+
      ' (ИС-44, ADR-0214 §6, ADR-0150 §5)';
  /* Сомовая запись — не формула, а АДРЕС происхождения: она называет ту валютную запись,
     чьей сомовой стороной является, и этим адресом проверяется сторожем (ADR-0214 §5). */
  if(spec.somOf){
    const O0 = IND(spec.somOf);
    if(!O0) return 'сомовая запись называет валютную «'+spec.somOf+'», а такой в реестре нет: '+
      'сомовая колонка есть произведение ВАЛЮТНОЙ колонки на курс строки, и без валютной '+
      'проверять нечего (ИС-7, ИС-44, ADR-0214 §5)';
    if(O0.obj !== spec.obj) return 'сомовая запись и её валютная заведены на разных объектах: '+
      'колонки перемножаются в ОДНОЙ строке, а строка принадлежит одному объекту (ИС-40, ADR-0214 §4)';
    if(spec.roll !== 'аддитивный') return 'сомовая величина аддитивна ВСЕГДА — в этом весь смысл '+
      'её отдельного имени: свод у неё «аддитивный» и другим не бывает (ИС-44, ADR-0214 §2)';
    if(unitOf(spec) !== 'сом') return 'у сомовой записи единица измерения — сом, и объявлена она '+
      'явно: «валюта договора» на сомовой колонке была бы именем, которое врёт (ИС-40, ADR-0214 §2)';
    /* Правило округления у пары ОДНО: сомовая колонка есть произведение валютной на курс
       той же строки, и округлять произведение по другому правилу, чем множитель, значит
       развести две стороны одной величины на копейку (ADR-0214 §5, §6). */
    if(roundOf(spec) !== roundOf(O0))
      return 'правило округления сомовой записи («'+(roundOf(spec) || 'не названо')+'») не совпало '+
        'с правилом её валютной «'+O0.name+'» («'+(roundOf(O0) || 'не названо')+'»): две стороны '+
        'одной величины округляются одинаково — иначе пара расходится на копейку внутри '+
        'ОДНОЙ строки (ИС-44, ADR-0214 §5, §6)';
  }
  /* Тип и единица обязаны быть ОПРЕДЕЛЕНЫ — объявлены в записи или унаследованы от
     названного показателя-основания. Число без единицы складывается с другим числом без
     единицы, и сумма получается всегда: сомы с процентами, дни с штуками. */
  const t = typeOf(spec);
  if(!t) return 'у показателя не определён тип: у шва и поля он объявляется в записи, у агрегата '+
    'наследуется от показателя, по которому агрегат считается (ADR-0209 §2)';
  if(FLAT_TYPES.indexOf(t) < 0 && !unitOf(spec))
    return 'у показателя типа «'+t+'» не определена единица измерения: число без единицы '+
      'складывается с любым другим числом без единицы, и сумма выйдет всегда — сомы с '+
      'процентами, дни со штуками. Объявите единицу или денежность (ADR-0209 §2)';
  /* Исчислимость налету у шва и поля ПРОИЗВОДНА от источника (ADR-0159, врезка): спорить
     с ядром реестр не вправе, и объявленный здесь признак был бы вторым ответом. */
  if(spec.live !== undefined && spec.src !== 'агрегат')
    return 'исчислимость налету у шва и поля производна от источника и в записи не объявляется: '+
      'объявленная здесь, она стала бы вторым ответом на вопрос, на который уже ответило ядро (ADR-0159)';
  return null;
}

/* --- реквизиты породы «разрез» (ADR-0209 §3) --- */
function checkDim(st, spec){
  if(['история','поле','шов'].indexOf(spec.src) < 0) return 'разрез объявляет источник: история · поле · шов';
  /* Единственный вопрос владельцу реестра — и он задаётся ЗДЕСЬ, при заведении, а не
     при разборе странного числа (ADR-0179 §2). */
  if(!spec.perObject) return 'у разреза спрашивается: сколько его значений '+
    'бывает у одного объекта на одну дату — одно или много (ИС-21, ADR-0179 §2)';
  if(spec.perObject === 'много') return 'значений много — значит разрез принадлежит '+
    'не этому объекту, а нижележащему: заводится объект, а не разрез. Иначе объект попадёт в две '+
    'группы сразу, сумма групп превысит множество и объяснить это будет нечем (ИС-21, ADR-0179 §1)';
  /* Одноимённых записей в реестре не бывает ни при каких объектах (ADR-0206 §1): два
     разреза с одним именем и есть тот самый случай «имя врёт». Уточнить имя объектом
     обязан ЗАВОДЯЩИЙ — читателю отчёта уточнять уже нечем, у него на бумаге одно слово. */
  const taken = nameTaken(st, spec, KIND.DIM);
  if(taken) return taken;
  if(spec.buckets && (!Array.isArray(spec.buckets) || !spec.buckets.length))
    return 'набор корзин объявляется списком: свободной корзины не бывает (ИС-23)';
  if(spec.levels && !spec.owner && !spec.ref)
    return 'уровни берутся у владельца справочника — владелец не назван. Второй '+
      'экземпляр иерархии дал бы второй ответ на «сколько районов в области» (ADR-0176 §7)';
  /* Справочник значений без владельца — это второй экземпляр справочника (ADR-0176 §7):
     он молча разойдётся с первым, и разошедшимися окажутся ОТЧЁТЫ, а не справочники. */
  if(spec.ref && !spec.owner)
    return 'справочник значений «'+spec.ref+'» назван, а владелец его — нет: реестр статистики '+
      'справочников не держит, он на них ссылается. Безвладельческий справочник есть второй его '+
      'экземпляр, и разойдутся не справочники, а отчёты (ADR-0176 §7, ADR-0209 §3)';
  if(spec.order && ORDERS.indexOf(spec.order) < 0)
    return 'порядок значений объявляется одним из трёх: '+ORDERS.join(' · ')+'. «'+spec.order+
      '» вне списка — а порядок, не названный в реестре, в каждом отчёте окажется своим (ADR-0209 §3)';
  if(spec.order === 'по объявленному порядку' && !spec.buckets && !spec.edges && !spec.levels)
    return 'порядок объявлен, а объявлять нечего: ни корзин, ни уровней в записи нет. '+
      'Упорядочивают названный список значений, а не обещание упорядочить (ADR-0176, ADR-0209 §3)';
  /* §5 — одна величина в двух ролях суть ДВЕ записи, связанные явно. Корзина не выводит
     новой величины: она раскладывает по границам существующую, и потому обязана назвать
     ЧЬЮ. Границы живут здесь, в реестре, а не в настройке отчёта, — иначе «просрочка
     30–90» перестала бы означать одно и то же во втором отчёте.                        */
  if(spec.basis){
    if(!IND(spec.basis)) return 'основание «'+spec.basis+'» показателем реестра не объявлено: '+
      'корзина раскладывает по границам СУЩЕСТВУЮЩУЮ величину, и величина эта — запись породы '+
      '«показатель», а не имя из настройки отчёта (ИС-7, ADR-0209 §5)';
    if(!Array.isArray(spec.edges) || !spec.edges.length)
      return 'разрез назвал показатель-основание и не назвал границ: без границ раскладывать '+
        'нечем, а границы, вписанные в отчёт, разойдутся с границами соседнего отчёта (ADR-0209 §5)';
  }
  if(spec.edges && !spec.basis)
    return 'границы объявлены, а величина, которую они делят, не названа: корзина раскладывает '+
      'ПОКАЗАТЕЛЬ, и он называется в записи основанием — иначе «просрочка 30–90» в одном отчёте '+
      'посчитана по дням просрочки, а в другом по дням с выдачи (ADR-0209 §5)';
  if(Array.isArray(spec.edges) && spec.edges.some((e, i) => i && !(e > spec.edges[i-1])))
    return 'границы корзин объявляются по возрастанию: при пересечении объект попадёт в две '+
      'корзины сразу, и сумма корзин превысит множество (ИС-23, ADR-0176)';
  return null;
}

/* Одна проверка на обе породы. `own` — идентификатор записи, которая проверяется на СЕБЯ
   же (переезд породы): занятым он считается только у чужой записи. */
function validate(st, spec, kind, own){
  if(KINDS.indexOf(kind) < 0) return KIND_WHY;
  if(!spec || !spec.id || (REC(spec.id) && spec.id !== own)) return 'идентификатор пуст или занят';
  if(!spec.name) return 'наименование пусто';
  /* §4 — формулы нет ни у одной породы. Список полей закрыт по ИМЕНАМ, которыми формула
     пробирается в запись: «выражение», «формула», `expr`. Корзина исключением не является. */
  if(FORMULA_FIELDS.some(k => k in spec))
    return 'в записи реестра нет поля формулы — ни у показателя, ни у разреза: запись объявляет '+
      'ОТКУДА берётся величина и молчит о том, КАК (ИС-6, ИС-43, ADR-0150, ADR-0209 §4). Корзина '+
      'не исключение: она не выводит новой величины, а раскладывает существующую по границам';
  /* ИС-47 — СКОЛЬКО ДАТ СРЕЗА нужно, чтобы величину вычислить. Критерий механический и
     проверяется ДО заведения: одна дата — законная колонка, две и больше — не колонка
     никогда (ADR-0220 §1). Спрашивается он раньше реквизитов породы, потому что обсуждать
     единицу измерения у величины, которой в строке вообще нет места, — значит оформлять
     отказ, а не отвечать. По ИМЕНИ такую величину не опознать ни при каком списке: «темп
     роста портфеля» и «миграция из категории в категорию» не содержат ни одного слова из
     запрета представления, а «Прирост стоимости залога по оценке» содержит и при этом
     законен. Солгавший в ответе заведёт запись, имя которой врёт, — но это ровно то же,
     чем стоит `perObject`: реестр СПРАШИВАЕТ там, где проверить по данным нельзя. */
  if(spec.dates === undefined)
    return 'у записи не спрошено, сколько ДАТ СРЕЗА нужно, чтобы величину вычислить: одна — '+
      'законная колонка, две и больше — не колонка никогда. Вопрос задаётся здесь, при заведении, '+
      'и умолчания у него нет: подставив «одну», дверь молча превратила бы заявку на изменение '+
      'остатка в колонку остатка под именем изменения, и имя бы врало (ИС-47, ИС-40, ADR-0220 §1)';
  if(!Number.isInteger(spec.dates) || spec.dates < 1)
    return 'число дат среза объявляется целым и не меньше одного: величина, которой не нужно ни '+
      'одной даты, величиной среза не является вовсе (ИС-47, ADR-0220 §1)';
  if(spec.dates > 1)
    return 'величине нужно дат среза — '+spec.dates+', и колонкой строки она не становится никогда: '+
      'строка принадлежит ОДНОЙ дате (ADR-0147), а многодатное число не принадлежит ни одной из них '+
      '— положив его в майскую строку, мы записали бы туда факт про апрель. Хуже того, колонка стала '+
      'бы производной от СОСЕДНЕЙ строки, которую ничто не обязывает существовать: внутри открытого '+
      'периода строки разрежены, и «предыдущая» неоднозначна (ADR-0215). Адрес у величины есть, и он '+
      'один из двух: ОДНА пара дат внутри выпуска — это ГРАФА ИЗМЕНЕНИЯ отчёта, она считается один '+
      'раз и мёрзнет вместе с документом (ADR-0218); ряд по многим датам — ОБЗОР АНАЛИЗА, он читает '+
      'готовые срезы и хранит снимок основания, а не колонку (ADR-0155). Дельта, темп, миграция, '+
      'скользящее среднее и курсовая разница — разность двух срезов (ADR-0151 §3) — адресуются туда '+
      'же (ИС-47, ADR-0220 §1, §3, §5, §6)';
  const alien = alienField(spec, kind);
  if(alien) return alien;
  /* §1 — объект общий реквизит ОБЕИХ пород (ADR-0149). Разрез без объекта определения и
     показатель без объекта — одна и та же беда: имя названо, а о ком оно — нет. */
  if(!spec.obj) return kind === KIND.DIM
    ? 'у разреза не назван объект определения: имя называет признак и молчит о том, ЧЕЙ он. '+
      '«Территория» заёмщика и «территория» выдачи кредита — разные значения, и под одним именем '+
      'они дают два разных фильтра и расхождение сумм, которое выглядит арифметической ошибкой. '+
      'Объяснить его нечем: имя врёт (ИС-40, ADR-0206 §2)'
    : 'у показателя не назван объект: запись реестра говорит, ЧТО считается и О КОМ, — иначе '+
      'нечем ответить, чьи строки складывать (ИС-18, ADR-0149, ADR-0209 §1)';
  if(spec.obj === '*' || spec.obj === 'любой') return kind === KIND.DIM
    ? 'общего разреза не бывает: объект определения один и названный. «Любой объект» здесь '+
      'означал бы, что признак ничей, — а признак всегда чей-то (ИС-40, ADR-0206 §2)'
    : 'общего показателя не бывает: объект один и названный. «Любой объект» означал бы, что '+
      'складывать можно всё со всем (ИС-18, ADR-0149)';
  /* Существование объекта спрашивается у разреза: он определён НА объекте и без него не
     читается. У показателя объект бывает заведён тем же пакетом — там проверку держит
     состав объекта (`addObject` не берёт показателя, которого нет в реестре).           */
  if(kind === KIND.DIM && !OBJ(spec.obj))
    return 'объекта «'+spec.obj+'» нет в реестре объектов: объект определения — ссылка на '+
      'запись реестра, а не свободное имя (ИС-18, ИС-40)';
  return kind === KIND.IND ? checkInd(st, spec) : checkDim(st, spec);
}

/* ================= ЗАВЕДЕНИЕ ЗАПИСИ — ОДНА ДВЕРЬ НА ДВЕ ПОРОДЫ ================== *
   Запись кладётся в ОДНУ кладовую и сама называет свою породу. Новая запись любой породы
   добавляет витрине колонку — только `ADD COLUMN`, только nullable, всегда с записью в
   журнал (ADR-0209 §6). Порядок здесь не случаен: сперва проверка, потом кладовая, потом
   состав объекта, и только затем схема — колонка заводится под запись, которая уже есть.
   У денежной записи проверка накрывает ВСЮ ПАРУ: сомовая сторона валидируется до того, как
   валютная попала в кладовую, и не прошедшая пара не оставляет за собой половины (ИС-44). */
ST.addRecord = spec => {
  const st = ST.state;
  const kind = spec && spec.kind;
  if(!ST.canAdmin()) return {ok:false, why: kind === KIND.DIM
    ? 'набор разрезов ведёт администратор статистики' : 'реестр показателей ведёт администратор статистики'};
  const why = validate(st, spec, kind, null);
  if(why) return {ok:false, why};
  const rec = clone(spec);
  /* Новая запись действует ВПЕРЁД: прошлое ею не размечается, потому что размечать
     пришлось бы сегодняшним значением (ADR-0147 §4). */
  rec.since = spec.since || st.today;
  normRec(rec);
  /* Денежная запись приходит в реестр ПАРОЙ: следом за валютной механически встаёт
     сомовая — тем же порождателем, что и на сборке демо-реестра, тем же валидатором и
     той же дверью в схему витрины (ИС-44, ADR-0214 §2). Заводи её отдельным вызовом —
     и первый же забытый близнец дал бы денежный показатель, который нельзя сложить по
     портфелю, и узналось бы об этом на сведении двух отчётов, а не здесь.
     ПАРА ПРОВЕРЯЕТСЯ ЦЕЛИКОМ И ДО КЛАДОВОЙ. Сомовая запись называет валютную поимённо и
     без неё не читается — поэтому на время проверки валютная кладётся в реестр ЧЕРНОВИКОМ
     и снимается, если пара не прошла: ни в журнал, ни в схему витрины черновик не попадал.
     Иначе в реестре осталась бы половина пары — денежная величина без сомовой стороны, и
     узналось бы об этом на сведении двух отчётов (ИС-44, ADR-0214 §2). */
  let twin = twinFor(st, rec);
  if(twin){
    st.registry.push(rec);
    const bad = validate(st, twin, twin.kind, null);
    st.registry.splice(st.registry.indexOf(rec), 1);
    if(bad) return {ok:false, why:'сомовая запись к «'+rec.name+'» не заводится: '+bad+
      '. Валютная тоже не заведена: в реестр денежная величина входит парой и целиком — '+
      'половина пары была бы суммой, которую нельзя сложить по портфелю (ИС-44, ADR-0214 §2)'};
    normRec(twin);
  }
  rec.history = [{at: rec.since, what:'заведена', kind: rec.kind, who: st.role}];
  st.registry.push(rec);
  const o = OBJ(rec.obj), box = o && (rec.kind === KIND.IND ? o.inds : o.dims);
  if(box && box.indexOf(rec.id) < 0) box.push(rec.id);
  const col = martAdd(st, rec, rec.since, st.role, 'заведена запись реестра');
  /* НАХОДКА ВОЛНЫ, которой в ADR-0221 нет ни строкой, и её нашёл сторож #188.
     Новая колонка ЕСТЬ изменение состояния строки (ADR-0215 §7) — но изменение это
     произошло У СТАТИСТИКИ, а не у владельца множества и не у соседа. Ни в одно из
     четырёх множеств оно не попадает: сосед ничего не менял и объекта не назовёт,
     критической даты нет, собственный датированный факт владельца прежний. Объект, не
     менявшийся с мая, в кандидаты не попал бы — и величина, заведённая сегодня, не
     заполнилась бы НИКОГДА, потому что «когда-нибудь изменится» для программы, которая
     не меняется, значит «никогда».
     Отсюда правило: ЗАВЕДЕНИЕ ЗАПИСИ СТАВИТ РАБОТУ В ОЧЕРЕДЬ (ADR-0196) — тем самым
     четвёртым множеством, которое для того и заведено. Не «пятое множество»: очередь
     уже есть, и своя работа статистики адресуется ровно ею. Ставится ДОСЧЁТ по каждой
     живой записи объекта, которым запись спрашивается; разберёт очередь ближайший
     прогон, и он же снимет её обходом. Дверь реестра при этом строк по-прежнему НЕ
     ПИШЕТ (§7): она объявляет и ставит работу, а пишет прогон.                        */
  const qn = queueRegChange(st, rec);
  log('заведена запись реестра «'+rec.name+'» — порода «'+rec.kind+'»'+
    (rec.kind === KIND.IND ? ', источник: '+rec.src : '')+', действует с '+fmt(rec.since)+
    (col ? '; витрина: ADD COLUMN '+col.col+' (nullable)' : '')+
    (qn ? '; в очередь перестроения — записей '+qn+' (заполнит прогон, ADR-0215 §7)' : ''));
  if(twin){
    twin.history = [{at: twin.since, what:'заведена', kind: twin.kind, who: st.role}];
    st.registry.push(twin);
    if(box && box.indexOf(twin.id) < 0) box.push(twin.id);
    const tcol = martAdd(st, twin, twin.since, st.role, 'сомовая сторона денежной записи (ИС-44)');
    log('заведена сомовая запись реестра «'+twin.name+'» — сторона величины «'+rec.name+'»'+
      (tcol ? '; витрина: ADD COLUMN '+tcol.col+' (nullable)' : ''));
    return {ok:true, id: rec.id, kind: rec.kind, since: rec.since, col: col && col.col,
            som: twin.id, somCol: tcol && tcol.col};
  }
  return {ok:true, id: rec.id, kind: rec.kind, since: rec.since, col: col && col.col};
};
/* Один порождатель на обе дороги в реестр: и на сборку, и на дверь. Здесь только решается,
   НУЖЕН ли близнец этой записи, — как он устроен, знает `somTwinOf` и знает в одном месте. */
function twinFor(st, rec){
  if(rec.kind !== KIND.IND || rec.somOf) return null;
  const over = rec.src === 'агрегат' ? IND(rec.over) : null;
  if(!(isSomRow(rec) || (rec.src === 'агрегат' && rec.fn !== 'count' && isSomRow(over)))) return null;
  /* Разрез свода у СТРОЧНОЙ записи спрашивает дверь — умолчания там нет; у АГРЕГАТА он
     НАСЛЕДУЕТСЯ от того, что агрегат складывает. Спросить его второй раз значило бы
     завести второй ответ на один вопрос и дать ему разъехаться с первым (ADR-0001). */
  const t = declareTwin(rec, over ? over.rollBy : rec.rollBy);
  t.since = rec.since;
  return t;
}
/* Двери по породам остались — но это ОДНА дверь с проставленной породой, а не два входа
   в два хранилища (ИС-43, ADR-0209). Форма ввода тоже одна: вторая половина полей
   раскрывается по выбранной породе (§7). */
ST.addIndicator = spec => ST.addRecord(Object.assign({}, spec, {kind: KIND.IND}));
ST.addDim = spec => ST.addRecord(Object.assign({}, spec, {kind: KIND.DIM}));

/* ================= ПЕРЕЕЗД ПОРОДЫ — РЯДОВОЕ СОБЫТИЕ НАСТРОЙКИ =================== *
   Разбор 22 разрезов ТЗ выяснил, что двое из них не разрезы вовсе. При двух реестрах
   исправление такой ошибки было бы удалением и заведением заново: новый идентификатор,
   пустая история, оборванные ссылки — и цена ошибки настройки становится ценой миграции.
   Здесь это правка реквизита: ЗАПИСЬ ТА ЖЕ, идентификатор тот же, история дописывается,
   реквизиты прежней породы снимаются поимённо, реквизиты новой спрашиваются. Схему
   витрины переезд НЕ трогает: колонка принадлежит записи, а не породе (ADR-0209 §6).   */
/* Зависимости, названные в реестре ПОИМЁННО: агрегат — по показателю, корзина — по
   показателю-основанию, дедуп — по разрезу. Все три спрашиваются одинаково и обеими
   дверьми — и прекращением, и переездом породы (ИС-7, ИС-34, ADR-0209 §5). */
function dependents(st, id, kind){
  const out = [];
  if(kind === KIND.IND){
    const aggs = st.registry.filter(x => x.kind === KIND.IND && x.over === id).map(x => x.name);
    if(aggs.length) out.push('агрегаты — '+aggs.join(', '));
    const based = st.registry.filter(x => x.basis === id).map(x => x.name);
    if(based.length) out.push('корзины разрезов — '+based.join(', '));
  } else {
    const keyed = st.registry.filter(x => x.dedupBy === id).map(x => x.name);
    if(keyed.length) out.push('дедуп-ключ показателей — '+keyed.join(', '));
  }
  return out;
}
ST.changeKind = (id, kind, who, extra) => {
  const st = ST.state, R = REC(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр ведёт администратор статистики'};
  if(!R) return {ok:false, why:'записи «'+id+'» нет в реестре'};
  if(KINDS.indexOf(kind) < 0) return {ok:false, why: KIND_WHY};
  if(R.kind === kind) return {ok:false, why:'запись уже породы «'+kind+'»: переезжать некуда'};
  if(R.until) return {ok:false, why:'запись «'+R.name+'» прекращена с '+fmt(R.until)+
    ': порода правится у действующей записи, а прекращённая уже ничего не порождает (ADR-0209 §6)'};
  /* Переезд рядовой, но не бесплатный: на запись могли сослаться ПОИМЁННО и именно как на
     запись своей породы — агрегат считается по показателю, корзина раскладывает показатель,
     дедуп-ключом бывает разрез. Такая ссылка после переезда стала бы ссылкой на запись
     чужой породы, и сломалась бы она молча — при первом же прогоне (ИС-7, ADR-0209 §5). */
  const dep = dependents(ST.state, id, R.kind);
  if(dep.length) return {ok:false, why:'на запись ссылаются как на «'+R.kind+'»: '+dep.join('; ')+
    '. Переезд оборвал бы эти ссылки молча — снимите их или заведите отдельную запись (ИС-7, ADR-0209 §5)'};
  const was = R.kind;
  /* Черновик собирается из реквизитов, ОБЩИХ с новой породой; чужие в него не попадают
     вовсе, а недостающие приносит `extra` — их и спросит форма. */
  const draft = {};
  FIELDS[kind].forEach(k => { if(k in R && k !== 'kind' && k !== 'history') draft[k] = clone(R[k]); });
  Object.assign(draft, extra || {});
  draft.kind = kind; draft.id = R.id;
  const why = validate(st, draft, kind, R.id);
  if(why) return {ok:false, why:'порода не сменена: '+why};
  const dropped = Object.keys(R).filter(k => EXCL[was].indexOf(k) >= 0);
  dropped.forEach(k => { delete R[k]; });
  Object.keys(draft).forEach(k => { if(k !== 'history') R[k] = draft[k]; });
  R.kind = kind;
  normRec(R);
  const o = OBJ(R.obj);
  if(o){
    const from = kind === KIND.IND ? o.dims : o.inds, to = kind === KIND.IND ? o.inds : o.dims;
    const i = from.indexOf(id); if(i >= 0) from.splice(i, 1);
    if(to.indexOf(id) < 0) to.push(id);
  }
  R.history.push({at: st.today, what:'смена породы', kind, from: was, who: who || st.role,
    dropped: dropped.slice()});
  log('запись реестра «'+R.name+'»: порода «'+was+'» → «'+kind+'»; снято реквизитов — '+
    dropped.length+(dropped.length ? ' ('+dropped.join(', ')+')' : '')+'; идентификатор и история те же');
  return {ok:true, id, kind, was, dropped, history: clone(R.history)};
};
/* ============ ЗАПИСЬ НЕ УДАЛЯЕТСЯ, А ПРЕКРАЩАЕТ ДЕЙСТВИЕ С ДАТЫ ================ *
   Удаление записи из реестра выглядит уборкой и является порчей прошлого: в строках,
   написанных до сегодня, её колонка ЗАПОЛНЕНА, и стёртая запись оставляет в клетке
   число без имени — прочитать его больше нечем. Поэтому обратного хода у схемы витрины
   нет вовсе: колонка остаётся, а запись получает дату прекращения и перестаёт
   действовать ВПЕРЁД (ADR-0209 §6). Вывод при этом не запрещается ссылками — он обязан
   назвать поимённо, что сломается (ИС-25, ADR-0177 §4).                              */
ST.retire = (id, confirm, who) => {
  const st = ST.state, R = REC(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!R) return {ok:false, why:'показателя нет в реестре'};
  if(R.until) return {ok:false, why:'запись «'+R.name+'» уже прекращена с '+fmt(R.until)+
    ': прекращение — дата, и вторая дата ей не назначается (ADR-0209 §6)'};
  const users = st.registry.filter(x => x.kind === KIND.IND && x.over === id).map(x => x.name);
  if(users.length) return {ok:false, why:'показатель используется агрегатами: '+users.join(', ')};
  /* Основание корзины и дедуп-ключ — такие же зависимые записи, как агрегат: обе названы
     ЯВНО и обе перестанут читаться. Отказ здесь дешевле молчаливой поломки в отчёте. */
  const based = st.registry.filter(x => x.basis === id).map(x => x.name);
  if(based.length) return {ok:false, why:'запись — основание корзин разреза: '+based.join(', ')+
    '. Корзина раскладывает по границам ЭТУ величину, и без неё раскладывать нечего (ADR-0209 §5)'};
  const keyed = st.registry.filter(x => x.dedupBy === id).map(x => x.name);
  if(keyed.length) return {ok:false, why:'запись — дедуп-ключ показателей: '+keyed.join(', ')+
    '. Без ключа схлопывать строки нечем, и «один раз на кредит» станет обещанием (ИС-34)'};
  /* ниже — ссылки потребителей: они вывод не запрещают, а обязывают назвать поимённо */
  const refs = ST.refsTo(id);
  if(refs.length && !confirm) return {ok:false, needsConfirm:true, breaks: refs,
    why:'на показатель ссылаются '+refs.length+': '+refs.map(r => r.consumer+' · '+r.edition).join(' · ')+
      '. Вывод возможен — но экран обязан назвать это поимённо, а не отказать молча (ИС-25, ADR-0177 §4)'};
  /* Из состава объекта запись уходит: спрашивать её начиная с сегодня больше нечем.
     Колонка витрины при этом НЕ трогается — в ней лежат числа прошлых строк.        */
  st.objects.forEach(o => {
    let i = o.inds.indexOf(id); if(i >= 0) o.inds.splice(i, 1);
    i = o.dims.indexOf(id); if(i >= 0) o.dims.splice(i, 1);
  });
  R.until = st.today;
  R.history.push({at: st.today, what:'прекращена', kind: R.kind, who: who || st.role});
  const broken = ST.refsTo(id);
  log('запись реестра «'+R.name+'» прекращает действие с '+fmt(R.until)+
    ' — из витрины колонка НЕ убирается: в ней числа прошлых строк'+
    (broken.length ? '; сломано ссылок — '+broken.length : ''));
  return {ok:true, broke: broken, until: R.until, id, kind: R.kind};
};
/* Прежнее имя двери сохранено: снимали с реестра показатель, и зовут её отовсюду так. */
ST.retireIndicator = (id, confirm) => ST.retire(id, confirm);
/* ------------------- ОБРАТНЫЙ ИНДЕКС ССЫЛОК (ADR-0177) -------------------- *
   Ссылку публикует ПОТРЕБИТЕЛЬ вместе со своей редакцией; повторная публикация без
   ссылки её снимает. Индекс держит владелец реестра, потому что вопрос «что сломается,
   если снять показатель» задаётся здесь, а ответ живёт у семерых.                */
ST.publishRefs = pub => {
  const st = ST.state;
  if(!pub || !pub.consumer || !pub.edition)
    return {ok:false, why:'публикация называет потребителя и его редакцию: анонимной ссылки индекс не хранит (ADR-0177 §2)'};
  for(const id of (pub.uses || []))
    if(!IND(id)) return {ok:false, why:'показателя «'+id+'» нет в реестре — ссылаться не на что (ИС-7)'};
  st.refs = st.refs.filter(r => !(r.consumer === pub.consumer && r.edition === pub.edition));
  (pub.uses || []).forEach(id => st.refs.push({ind:id, consumer:pub.consumer, edition:pub.edition,
    owner: pub.owner || '—', at: st.today}));
  log('публикация «'+pub.edition+'» ('+pub.consumer+'): ссылок — '+(pub.uses || []).length);
  return {ok:true, n:(pub.uses || []).length};
};
ST.refsTo = id => clone(ST.state.refs.filter(r => r.ind === id));
ST.refsAll = () => clone(ST.state.refs);

/* Исчислимость налету — свойство ЗАПИСИ агрегата (ADR-0159, врезка). У шва и поля
   она производна от источника и в форме заперта: спорить с ядром реестр не вправе. */
ST.liveOf = id => {
  const I = IND(id);
  if(!I) return null;
  if(I.src !== 'агрегат') return {live:true, editable:false,
    why:'у шва и поля исчислимость — свойство источника, а не решение автора записи'};
  return {live: I.live !== false, editable:true,
    why:'у агрегата исчислимость объявляет автор записи: тяжёлый агрегат считается прогоном'};
};
ST.setLive = (id, val) => {
  const I = IND(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!I) return {ok:false, why:'показателя нет в реестре'};
  if(I.src !== 'агрегат') return {ok:false, why:'исчислимость правится только у агрегатов: у «'+
    I.name+'» источник — '+I.src+', и признак производен от него (ADR-0159, врезка)'};
  I.live = !!val;
  log('показатель «'+I.name+'»: исчислимость налету — '+(val ? 'да' : 'нет'));
  return {ok:true, live: I.live};
};

/* Шестой объект — строка реестра, а не релиз (ИС-18, ADR-0149). */
ST.addObject = spec => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'реестр объектов ведёт администратор статистики'};
  if(!spec || !spec.id || OBJ(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!WORLD[spec.id]) return {ok:false, why:'множества «'+spec.id+'» владелец не отдаёт: статистика объектов не заводит, она их считает'};
  if(!spec.born || !spec.born.src) return {ok:false, why:'у объекта не объявлено рождение: без него строки появились бы задним числом на всех прошлых датах, и разность двух дат показала бы движение, которого не было (ИС-33)'};
  /* Чужой разрез объекту не прикладывается (ИС-40, ADR-0206 §3): разрез определён на
     ОДНОМ объекте, и сложение по нему законно только внутри него. Взять «Территорию
     заёмщика» в состав поручительства значило бы завести второй смысл под одним именем —
     ровно то, что ADR-0206 и закрывает. Свой разрез заводится своей записью. */
  for(const d of (spec.dims || [])){
    const D = DIM(d);
    if(!D) return {ok:false, why:'разреза «'+d+'» нет в реестре разрезов'};
    if(D.obj !== spec.id) return {ok:false, why:'разрез «'+D.name+'» определён на объекте «'+
      ((OBJ(D.obj) || {}).name || D.obj)+'» и объекту «'+spec.name+'» не принадлежит: у разреза '+
      'один объект определения, и складывать по нему законно только внутри него. Заведите свою '+
      'запись — справочник значений у неё будет тот же, дорога до значения своя (ИС-40, ADR-0206 §3, §5)'};
  }
  for(const m of (spec.inds || [])) if(!IND(m)) return {ok:false, why:'показателя «'+m+'» нет в реестре показателей (ИС-7)'};
  st.objects.push(clone(spec));
  log('заведён объект статистики «'+spec.name+'» — строки появятся ближайшим прогоном');
  return {ok:true, id: spec.id};
};
/* Явное расхождение зафиксированного с сегодняшним пересчётом (ИС-11). */
ST.divergence = (month, objId, indId) => {
  const st = ST.state;
  if(!latchOf(st, month, MY_LAYER)) return {ok:false, why:'период '+monLabel(month)+' не закрыт по статистике: расхождению неоткуда взяться'};
  const cs = st.corrections.filter(c => c.month === month && c.obj === objId && c.inds === indId);
  /* Расхождение сверяется со СЛЕПКОМ на дату закрытия, а не со всеми строками месяца
     (ИС-45, ADR-0215 §4). Складывать всё, что написано за месяц, было можно ровно пока
     строка писалась ежедневно всем: тогда «все строки месяца» и «состояние на конец
     месяца» совпадали только при одном прогоне в месяце, а при двух один и тот же кредит
     вошёл бы в сумму дважды. Слепок плотный — в нём ровно по строке на объект. */
  const rows = rowsAsOf(st, objId, monthEnd(month)).filter(r => r.fixed);
  /* ЧЕТВЁРТОЕ место, где раньше умножали на курс по-своему, — отменено (ADR-0214 §3, §6).
     Расхождение читает СОМОВУЮ КОЛОНКУ строки: она уже посчитана ядром и заморожена, и
     сложить её по месяцу законно всегда. Своего пересчёта у расхождения нет. */
  const som = ST.somIdOf(indId);
  const fixedSum = rows.reduce((s, r) => s + ((r.inds[som || indId] || {}).v || 0), 0);
  const delta = cs.reduce((s, c) => s + c.delta, 0);
  const rule = roundOf(REC(som || indId));
  return {ok:true, month, ind: som || indId, inSom: !!som, round: rule,
    fixed: CORE.somRound(fixedSum, rule), today: CORE.somRound(fixedSum + delta, rule),
    delta, corrections: clone(cs), shown: !!cs.length};
};
/* ===================================================================== *
 *                              ЭКРАНЫ
 *  Их три (СС-19): конструктор среза с детализацией · журнал срезов ·
 *  реестры. Экрана правки строки среза нет — он нарушил бы ИС-2.
 * ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
/* Спрашиваемых дат константой в файле больше нет: список дат — это ЖУРНАЛ ПРОГОНОВ
   (ИС-36, волна 14). Прежняя константа предлагала семь дат при пяти прогонах — в том
   числе «сегодня», строк на которое не было ни одной, и оно же стояло умолчанием
   вопроса: модуль по умолчанию спрашивал дату, на которую никто ничего не писал.
   Даты ряда — часть ВОПРОСА (СС-Д1): точки строятся назад от даты среза шагом месяц
   или квартал, и точка внутри истории, на которую строк нет, не выбрасывается —
   ответ подставит ближайшую предыдущую и назовёт возраст (ИС-12). */
ST.seriesDates = () => {
  const st = ST.state, sq = st.q.series || {step:'месяц', points:4};
  const step = sq.step === 'квартал' ? 3 : 1;
  const out = [];
  let m = ym(st.q.date);
  for(let i = 0; i < sq.points; i++){
    out.unshift(i === 0 ? st.q.date : monthEnd(m));
    for(let k = 0; k < step; k++) m = prevM(m);
  }
  return out;
};
ST.setSeries = (k, v) => { ST.state.q.series[k] = v; render(); };

function money(v, cur){
  if(v == null) return '—';
  const parts = (Math.round(v*100)/100).toFixed(2).split('.');
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ')+','+parts[1]+(cur ? ' '+cur : '');
}
function num(v, unit){
  if(v == null) return '—';
  const r = Math.round(v*10)/10;
  return String(r).replace('.', ',')+(unit ? ' '+unit : '');
}
/* Клетка СТРОКИ (не итога). Тип показателя объявлен записью реестра, и разметка о нём
   спрашивает, а не угадывает: перечисление, пропущенное через число, давало «NaN».
   Разновалютная сумма показывается СОСТАВОМ, а сомовая величина — СОСЕДНЕЙ КОЛОНКОЙ той
   же строки: это уже не «приблизительно», а число, которое лежит рядом и проверяется
   сторожем (ИС-44, ADR-0214 §5). Знака «≈» здесь больше нет — он говорил о прикидке. */
/* Пустая клетка отвечает на ДВА разных вопроса, и путать их нельзя (ADR-0208, границы):
   прочерк — законное отсутствие (показателя не было в этой редакции формы, ADR-0175),
   «не ответил» — отсутствие С ПРИЧИНОЙ. Нарисуй их одинаково — и молчание соседа
   растворилось бы в обычной пустоте, а разбирать ночь стало бы не по чему.
   Причина берётся из колонки источника ЭТОЙ строки, а не из сегодняшнего состояния
   соседа: строка от 18-го говорит о ночи 18-го, даже если сегодня сосед отвечает. */
function silentCell(row, id){
  const nb = nbOfRec(id), s = nb && row && row.srcs ? row.srcs[nb] : null;
  return s && !s.ok ? '<span class="pill warn" title="'+esc('сосед «'+nb+'» '+s.why+': '+
    s.reason+' — величина не подменена ни нулём, ни вчерашней (ИС-42)')+'">не ответил</span>' : null;
}
function indCellText(c, I, row){
  if(c == null) return silentCell(row, I.id) || '—';
  if(I.type === 'булево') return c.v ? 'да' : 'нет';
  if(I.type === 'перечисление') return esc(String(c.v));
  if(I.money){
    const ps = ST.partsOf(c);
    const som = row ? ST.somValue(row, I.id) : null;
    if(ps.length > 1) return esc(ps.map(p => money(p.v, p.cur)).join(' + '))+
      (som != null ? ' <span class="muted">= '+esc(money(som, 'KGS'))+'</span>' : '');
    return esc(money(c.v, c.cur))+
      (som != null && c.cur !== 'KGS' ? ' <span class="muted">= '+esc(money(som, 'KGS'))+'</span>' : '');
  }
  return esc(num(c.v, I.unit));
}
/* Значение уровневого разреза — путь, и показывается путём: «2 / 2.1», а не «2,2.1». */
function dimText(v){ return v == null ? '—' : Array.isArray(v) ? v.join(' / ') : String(v); }
function cellText(val){
  if(!val) return '—';
  /* Отказ свода рисуется ОТКАЗОМ, а не числом с оговоркой: до волны 17 здесь стояло
     правдоподобное число и рядом плашка «сведено» — читатель брал число, плашку не
     читал (ИС-44). Теперь в клетке прочерк, а довод и адрес — в подсказке. */
  if(val.refused) return '<span class="pill warn" title="'+esc(val.why || val.note)+'">свод отказан</span>';
  if(val.kind === 'сумма'){
    let s = esc(money(val.v, val.cur));
    if(val.mixed) s += ' <span class="pill warn" title="'+esc(val.note)+'">состав</span>';
    return s;
  }
  return esc(num(val.v, val.unit));
}

ST.go = v => { ST.state.view = v; ST.state.drill = null; render(); };
ST.setRole = r => { ST.state.role = r; ST.state.drill = null; render(); };
ST.setDate = d => { ST.state.q.date = d; ST.state.drill = null; render(); };
ST.toggleSidebar = () => { if(typeof document === 'undefined') return;
  const app = document.getElementById('app'); if(app) app.classList.toggle('no-sidebar'); };
const TITLES = {matrix:'Конструктор среза', build:'Швы статистики', journal:'Журнал срезов', exports:'Выгрузки', setup:'Реестры'};

function render(){
  if(typeof document === 'undefined') return;             /* без DOM рисовать нечего (смоук) */
  const st = ST.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  $('#title').textContent = TITLES[st.view];
  $('#role').innerHTML = ROLES.map(r => '<option'+(r === st.role ? ' selected' : '')+'>'+esc(r)+'</option>').join('');

  $('#asOf').innerHTML = runDates.map(d => '<option value="'+d+'"'+(d === st.q.date ? ' selected' : '')+'>'+
    fmt(d)+' · '+(ST.isClosed(d) ? 'закрытый период' : 'открытый период')+'</option>').join('');
  const lastRun = runDates.length ? runDates[runDates.length - 1] : null;
  /* Подвал говорит про РОЛЬ, а не про объект: чей охват применяется — одно на весь
     сеанс, а каким разрезом он режет и режет ли вообще — дело записи объекта (ИС-37). */
  const s = ST.curatorOf();
  $('#foot').innerHTML = 'Учётный период <b>'+monLabel(ST.openPeriod())+'</b> — открыт.<br>'+
    'Сегодня '+fmt(st.today)+'; последний прогон <b>'+(lastRun ? fmt(lastRun) : '—')+
    '</b>. Спрашивается дата прогона: «сегодня» датой вопроса не бывает — на «как сейчас» '+
    'отвечает реестр владельца.<br>'+
    'Зафиксировано: '+(ST.closedMonths().map(monLabel).join(', ') || '—')+
    ' <span class="muted">(колонка «статистика» общего календаря — ИС-38)</span>.<br>'+
    (s ? 'Ваш мир: куратор <b>'+esc(s)+'</b>; каким разрезом он режет — объявляет объект, '+
         'и объект, которому охват неприменим, отвечает отказом, а не пустым экраном.'
       : 'Ваш мир: без ограничения.');
  $('#panel').className = 'panel-wrap' + (st.view === 'matrix' ? ' wide' : '');
  $('#panel').innerHTML =
    st.view === 'matrix'  ? viewMatrix()  :
    st.view === 'build'   ? viewBuild()   :
    st.view === 'journal' ? viewJournal() :

  if(st.view === 'matrix') mxFixStickyOffsets();
