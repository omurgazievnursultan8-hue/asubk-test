   если снять показатель» задаётся здесь, а ответ живёт у семерых.                */
ST.publishRefs = pub => {
  const st = ST.state;
  if(!pub || !pub.consumer || !pub.edition)
    return {ok:false, why:'публикация называет потребителя и его редакцию: анонимной ссылки индекс не хранит (ADR-0177 §2)'};
  for(const id of (pub.uses || []))
    if(!IND(id)) return {ok:false, why:'показателя «'+id+'» нет в реестре — ссылаться не на что (ИС-7)'};
  st.refs = st.refs.filter(r => !(r.consumer === pub.consumer && r.edition === pub.edition));
  (pub.uses || []).forEach(id => st.refs.push({ind:id, consumer:pub.consumer, edition:pub.edition,
    owner: pub.owner || '—', at: st.today}));
  log('публикация «'+pub.edition+'» ('+pub.consumer+'): ссылок — '+(pub.uses || []).length);
  return {ok:true, n:(pub.uses || []).length};
};
ST.refsTo = id => clone(ST.state.refs.filter(r => r.ind === id));
ST.refsAll = () => clone(ST.state.refs);

/* Исчислимость налету — свойство ЗАПИСИ агрегата (ADR-0159, врезка). У шва и поля
   она производна от источника и в форме заперта: спорить с ядром реестр не вправе. */
ST.liveOf = id => {
  const I = IND(id);
  if(!I) return null;
  if(I.src !== 'агрегат') return {live:true, editable:false,
    why:'у шва и поля исчислимость — свойство источника, а не решение автора записи'};
  return {live: I.live !== false, editable:true,
    why:'у агрегата исчислимость объявляет автор записи: тяжёлый агрегат считается прогоном'};
};
ST.setLive = (id, val) => {
  const I = IND(id);
  if(!ST.canAdmin()) return {ok:false, why:'реестр показателей ведёт администратор статистики'};
  if(!I) return {ok:false, why:'показателя нет в реестре'};
  if(I.src !== 'агрегат') return {ok:false, why:'исчислимость правится только у агрегатов: у «'+
    I.name+'» источник — '+I.src+', и признак производен от него (ADR-0159, врезка)'};
  I.live = !!val;
  log('показатель «'+I.name+'»: исчислимость налету — '+(val ? 'да' : 'нет'));
  return {ok:true, live: I.live};
};

/* Шестой объект — строка реестра, а не релиз (ИС-18, ADR-0149). */
ST.addObject = spec => {
  const st = ST.state;
  if(!ST.canAdmin()) return {ok:false, why:'реестр объектов ведёт администратор статистики'};
  if(!spec || !spec.id || OBJ(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!WORLD[spec.id]) return {ok:false, why:'множества «'+spec.id+'» владелец не отдаёт: статистика объектов не заводит, она их считает'};
  if(!spec.born || !spec.born.src) return {ok:false, why:'у объекта не объявлено рождение: без него строки появились бы задним числом на всех прошлых датах, и разность двух дат показала бы движение, которого не было (ИС-33)'};
  /* Чужой разрез объекту не прикладывается (ИС-40, ADR-0206 §3): разрез определён на
     ОДНОМ объекте, и сложение по нему законно только внутри него. Взять «Территорию
     заёмщика» в состав поручительства значило бы завести второй смысл под одним именем —
     ровно то, что ADR-0206 и закрывает. Свой разрез заводится своей записью. */
  for(const d of (spec.dims || [])){
    const D = DIM(d);
    if(!D) return {ok:false, why:'разреза «'+d+'» нет в реестре разрезов'};
    if(D.obj !== spec.id) return {ok:false, why:'разрез «'+D.name+'» определён на объекте «'+
      ((OBJ(D.obj) || {}).name || D.obj)+'» и объекту «'+spec.name+'» не принадлежит: у разреза '+
      'один объект определения, и складывать по нему законно только внутри него. Заведите свою '+
      'запись — справочник значений у неё будет тот же, дорога до значения своя (ИС-40, ADR-0206 §3, §5)'};
  }
  for(const m of (spec.inds || [])) if(!IND(m)) return {ok:false, why:'показателя «'+m+'» нет в реестре показателей (ИС-7)'};
  st.objects.push(clone(spec));
  log('заведён объект статистики «'+spec.name+'» — строки появятся ближайшим прогоном');
  return {ok:true, id: spec.id};
};
/* Явное расхождение зафиксированного с сегодняшним пересчётом (ИС-11). */
ST.divergence = (month, objId, indId) => {
  const st = ST.state;
  if(!latchOf(st, month, MY_LAYER)) return {ok:false, why:'период '+monLabel(month)+' не закрыт по статистике: расхождению неоткуда взяться'};
  const cs = st.corrections.filter(c => c.month === month && c.obj === objId && c.inds === indId);
  const rows = st.rows.filter(r => r.obj === objId && ym(r.date) === month && r.fixed);
  /* ЧЕТВЁРТОЕ место, где раньше умножали на курс по-своему, — отменено (ADR-0214 §3, §6).
     Расхождение читает СОМОВУЮ КОЛОНКУ строки: она уже посчитана ядром и заморожена, и
     сложить её по месяцу законно всегда. Своего пересчёта у расхождения нет. */
  const som = ST.somIdOf(indId);
  const fixedSum = rows.reduce((s, r) => s + ((r.inds[som || indId] || {}).v || 0), 0);
  const delta = cs.reduce((s, c) => s + c.delta, 0);
  const rule = roundOf(REC(som || indId));
  return {ok:true, month, ind: som || indId, inSom: !!som, round: rule,
    fixed: CORE.somRound(fixedSum, rule), today: CORE.somRound(fixedSum + delta, rule),
    delta, corrections: clone(cs), shown: !!cs.length};
};
/* ===================================================================== *
 *                              ЭКРАНЫ
 *  Их три (СС-19): конструктор среза с детализацией · журнал срезов ·
 *  реестры. Экрана правки строки среза нет — он нарушил бы ИС-2.
 * ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
/* Спрашиваемых дат константой в файле больше нет: список дат — это ЖУРНАЛ ПРОГОНОВ
   (ИС-36, волна 14). Прежняя константа предлагала семь дат при пяти прогонах — в том
   числе «сегодня», строк на которое не было ни одной, и оно же стояло умолчанием
   вопроса: модуль по умолчанию спрашивал дату, на которую никто ничего не писал.
   Даты ряда — часть ВОПРОСА (СС-Д1): точки строятся назад от даты среза шагом месяц
   или квартал, и точка внутри истории, на которую строк нет, не выбрасывается —
   ответ подставит ближайшую предыдущую и назовёт возраст (ИС-12). */
ST.seriesDates = () => {
  const st = ST.state, sq = st.q.series || {step:'месяц', points:4};
  const step = sq.step === 'квартал' ? 3 : 1;
  const out = [];
  let m = ym(st.q.date);
  for(let i = 0; i < sq.points; i++){
    out.unshift(i === 0 ? st.q.date : monthEnd(m));
    for(let k = 0; k < step; k++) m = prevM(m);
  }
  return out;
};
ST.setSeries = (k, v) => { ST.state.q.series[k] = v; render(); };

function money(v, cur){
  if(v == null) return '—';
  const parts = (Math.round(v*100)/100).toFixed(2).split('.');
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ')+','+parts[1]+(cur ? ' '+cur : '');
}
function num(v, unit){
  if(v == null) return '—';
  const r = Math.round(v*10)/10;
  return String(r).replace('.', ',')+(unit ? ' '+unit : '');
}
/* Клетка СТРОКИ (не итога). Тип показателя объявлен записью реестра, и разметка о нём
   спрашивает, а не угадывает: перечисление, пропущенное через число, давало «NaN».
   Разновалютная сумма показывается СОСТАВОМ, а сомовая величина — СОСЕДНЕЙ КОЛОНКОЙ той
   же строки: это уже не «приблизительно», а число, которое лежит рядом и проверяется
   сторожем (ИС-44, ADR-0214 §5). Знака «≈» здесь больше нет — он говорил о прикидке. */
function indCellText(c, I, row){
  if(c == null) return '—';
  if(I.type === 'булево') return c.v ? 'да' : 'нет';
  if(I.type === 'перечисление') return esc(String(c.v));
  if(I.money){
    const ps = ST.partsOf(c);
    const som = row ? ST.somValue(row, I.id) : null;
    if(ps.length > 1) return esc(ps.map(p => money(p.v, p.cur)).join(' + '))+
      (som != null ? ' <span class="muted">= '+esc(money(som, 'KGS'))+'</span>' : '');
    return esc(money(c.v, c.cur))+
      (som != null && c.cur !== 'KGS' ? ' <span class="muted">= '+esc(money(som, 'KGS'))+'</span>' : '');
  }
  return esc(num(c.v, I.unit));
}
/* Значение уровневого разреза — путь, и показывается путём: «2 / 2.1», а не «2,2.1». */
function dimText(v){ return v == null ? '—' : Array.isArray(v) ? v.join(' / ') : String(v); }
function cellText(val){
  if(!val) return '—';
  /* Отказ свода рисуется ОТКАЗОМ, а не числом с оговоркой: до волны 17 здесь стояло
     правдоподобное число и рядом плашка «сведено» — читатель брал число, плашку не
     читал (ИС-44). Теперь в клетке прочерк, а довод и адрес — в подсказке. */
  if(val.refused) return '<span class="pill warn" title="'+esc(val.why || val.note)+'">свод отказан</span>';
  if(val.kind === 'сумма'){
    let s = esc(money(val.v, val.cur));
    if(val.mixed) s += ' <span class="pill warn" title="'+esc(val.note)+'">состав</span>';
    return s;
  }
  return esc(num(val.v, val.unit));
}

ST.go = v => { ST.state.view = v; ST.state.drill = null; render(); };
ST.setRole = r => { ST.state.role = r; ST.state.drill = null; render(); };
ST.setDate = d => { ST.state.q.date = d; ST.state.drill = null; render(); };
const TITLES = {build:'Конструктор среза', journal:'Журнал срезов', exports:'Выгрузки', setup:'Реестры'};

function render(){
  if(typeof document === 'undefined') return;             /* без DOM рисовать нечего (смоук) */
  const st = ST.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  $('#title').textContent = TITLES[st.view];
  $('#role').innerHTML = ROLES.map(r => '<option'+(r === st.role ? ' selected' : '')+'>'+esc(r)+'</option>').join('');
  const runDates = ST.askDates(st.q.obj);
  $('#asOf').innerHTML = runDates.map(d => '<option value="'+d+'"'+(d === st.q.date ? ' selected' : '')+'>'+
    fmt(d)+' · '+(ST.isClosed(d) ? 'закрытый период' : 'открытый период')+'</option>').join('');
  const lastRun = runDates.length ? runDates[runDates.length - 1] : null;
  /* Подвал говорит про РОЛЬ, а не про объект: чей охват применяется — одно на весь
     сеанс, а каким разрезом он режет и режет ли вообще — дело записи объекта (ИС-37). */
  const s = ST.curatorOf();
  $('#foot').innerHTML = 'Учётный период <b>'+monLabel(ST.openPeriod())+'</b> — открыт.<br>'+
    'Сегодня '+fmt(st.today)+'; последний прогон <b>'+(lastRun ? fmt(lastRun) : '—')+
    '</b>. Спрашивается дата прогона: «сегодня» датой вопроса не бывает — на «как сейчас» '+
    'отвечает реестр владельца.<br>'+
    'Зафиксировано: '+(ST.closedMonths().map(monLabel).join(', ') || '—')+
    ' <span class="muted">(колонка «статистика» общего календаря — ИС-38)</span>.<br>'+
    (s ? 'Ваш мир: куратор <b>'+esc(s)+'</b>; каким разрезом он режет — объявляет объект, '+
         'и объект, которому охват неприменим, отвечает отказом, а не пустым экраном.'
       : 'Ваш мир: без ограничения.');
  $('#panel').innerHTML =
    st.view === 'build'   ? viewBuild()   :
    st.view === 'journal' ? viewJournal() :
    st.view === 'exports' ? viewExports() : viewSetup();
}
ST.render = render;

function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast'+(kind ? ' '+kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 5200);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(okMsg, 'ok'); }
  else toast((res && res.why) || 'отказано', 'err');
  render();
}

/* ------------------------- ПАСПОРТ ОТВЕТА --------------------------- */
function passportHtml(p){
  const cls = p.divergence || p.substituted ? 'warn' : p.fixation === 'зафиксировано' ? 'fixed' : '';
  const rows = [];
  rows.push('<div class="row"><span class="k">Дата расчёта</span><b>'+fmt(p.asOf)+'</b> · '+
    esc(ageWord(p.age))+(p.substituted ? ' <span class="pill warn">спрошено '+fmt(p.requested)+
    ' — строк на эту дату нет</span>' : '')+'</div>');
  rows.push('<div class="row"><span class="k">Фиксация</span>'+
    (p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
     p.fixation === 'смешанно' ? '<span class="pill warn">смешанно</span>' :
     '<span class="pill neutral">не зафиксировано</span>')+
    (p.fixedBy ? ' <span class="muted">'+esc(p.fixedBy)+', '+fmt(p.fixedAt)+'</span>' : '')+
    (p.range ? ' <span class="muted">ряд '+esc(p.range)+'</span>' : '')+'</div>');
  rows.push('<div class="row"><span class="k">Область видимости</span>'+esc(p.scope)+'</div>');
  rows.push('<div class="row"><span class="k">Фильтр</span><span class="muted">'+esc(p.filter)+'</span></div>');
  if(p.baseNote) rows.push('<div class="row"><span class="k">База периода</span>'+esc(p.baseNote)+'</div>');
  if(p.skipped) rows.push('<div class="row"><span class="k">Почему не на дату</span><span class="muted">'+esc(p.skipped)+'</span></div>');
  if(p.divergence) rows.push('<div class="row"><span class="k">Расхождение</span>'+esc(p.divergence)+'</div>');
  (p.dedup || []).forEach(d => rows.push('<div class="row"><span class="k">Дедуп-ключ</span>'+esc(d.text)+'</div>'));
  return '<div class="pass '+cls+'">'+rows.join('')+'</div>';
}

/* ==================== ЭКРАН 1: КОНСТРУКТОР СРЕЗА ==================== */
ST.pickObj = id => { const st = ST.state; const o = OBJ(id);
  st.q.obj = id; st.q.dims = []; st.q.levels = {}; st.q.buckets = {};
  st.q.inds = o.inds.filter(m => IND(m).src === 'агрегат').slice(0,2);
  st.q.filter = null; st.drill = null; st.work = null; addDimToQ(o.dims[0]);
  /* У каждого объекта свой журнал прогонов: дата, которой у нового объекта нет,
     молча не переносится — вопрос встаёт на его последний прогон (ИС-36). */
  const ds = ST.askDates(id);
  if(ds.length && ds.indexOf(st.q.date) < 0) st.q.date = ds[ds.length - 1];
  render(); };
/* Корзина у разреза-даты не «по умолчанию любая»: вопрос без корзины не задаётся вовсе,
   поэтому при выборе разреза корзина берётся первой из объявленных (ИС-23). */
function addDimToQ(id){
  const st = ST.state, D = DIM(id);
  if(!D || st.q.dims.indexOf(id) >= 0) return;
  st.q.dims.push(id);
  if(D.buckets && !st.q.buckets[id]) st.q.buckets[id] = D.buckets[0];
}
ST.toggleDim = id => { const st = ST.state, a = st.q.dims, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else addDimToQ(id);
  st.drill = null; st.work = null; render(); };
ST.setLevel = (dimId, n) => { ST.state.q.levels[dimId] = n; ST.state.drill = null; render(); };
/* Фильтр задаётся ЯВНО, а не только кликом по числу (СС-Д2): значения берутся из строк
   на дату среза — списком чужих справочников фильтр не наполняется (ИС-4). Значения
   МЕРЫ берутся оттуда же: у фильтра один источник на оба вида операнда (ADR-0180 §5). */
ST.operandValues = (kind, id, bucket) => {
  const st = ST.state;
  const o = operandOf({kind, id, bucket});
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  if(!res || !o) return [];
  const bk = o.vtype === 'корзина' ? (bucket || o.dim.buckets[0]) : null;
  const set = new Set();
  applyScope(rowsAt(st, st.q.obj, res.asOf), st.q.obj).forEach(r => {
    if(o.kind === 'dim'){
      const v = r.dims[id];
      if(v == null) return;
      /* У иерархии в список идут ВСЕ уровни пути: «Юг» и «Юг / Ош» — разные вопросы. */
      if(Array.isArray(v)){ for(let i = 1; i <= v.length; i++) set.add(v.slice(0,i).join(' / ')); }
      else if(o.vtype === 'корзина'){ const k = bucketOf(v, bk, o.dim); if(k != null) set.add(k); }
      else set.add(String(v));
    } else {
      const c = r.inds[id];
      if(!c || c.v == null) return;
      set.add(o.vtype === 'булево' ? (c.v ? 'да' : 'нет') : String(c.v));
    }
  });
  const arr = [...set];
  /* Корзины сортируются ПОРЯДКОМ КОРЗИНЫ, а не алфавитом: «апрель» перед «маем». */
  if(o.vtype === 'корзина')
    return arr.sort((a,b) => String(bucketOrd(o.dim,a,bk)).localeCompare(String(bucketOrd(o.dim,b,bk))));
  if(o.vtype === 'число') return arr.sort((a,b) => Number(a) - Number(b));
  return arr.sort((a,b) => String(a).localeCompare(String(b),'ru'));
};
ST.filterValues = dimId => ST.operandValues('dim', dimId, (ST.state.q.buckets || {})[dimId]);
/* Черновик сравнения живёт в состоянии, а не в DOM: перерисовка не имеет права терять
   наполовину набранное сравнение — иначе набор из трёх сравнений не соберётся. */
function fDraft(){
  const st = ST.state;
  if(!st.fEdit) st.fEdit = {kind:'dim', id:'', op:'=', bucket:'', value:'', values:[],
    from:'', to:'', cur:'KGS', set:'new'};
  return st.fEdit;
}
ST.filterOperands = () => {
  const st = ST.state, o = OBJ(st.q.obj);
  if(!o) return {dims:[], inds:[]};
  return {
    dims: o.dims.filter(id => DIM(id) && DIM(id).since <= st.q.date)
               .map(id => ({kind:'dim', id, name: DIM(id).name})),
    /* Операнд — мера СТРОКИ: агрегат в фильтр не попадает даже списком (ADR-0180 §3). */
    inds: o.inds.filter(id => IND(id) && IND(id).src !== 'агрегат')
               .map(id => ({kind:'ind', id, name: IND(id).name}))
  };
};
ST.pickOperand = () => {
  const d = fDraft(), sel = String((($('#fOperand') || {}).value || '')).split(':');
  d.kind = sel[0] || 'dim'; d.id = sel[1] || '';
  d.op = (ST.filterOps(d) || [])[0] || '=';
  d.bucket = ''; d.value = ''; d.values = []; d.from = ''; d.to = '';
  render();
};
ST.pickFilterOp     = () => { fDraft().op = (($('#fOp') || {}).value) || '='; render(); };
ST.pickFilterBucket = () => { fDraft().bucket = (($('#fBucket') || {}).value) || ''; render(); };
ST.pickFilterSet    = () => { fDraft().set = (($('#fSet') || {}).value) || 'new'; };
/* Сравнение добавляется в НАБОР (И) либо новым набором (ИЛИ) — двух этих действий
   довольно, чтобы собрать любую ДНФ, и третьего в форме без скобок не бывает. */
ST.addCmp = () => {
  const st = ST.state, d = fDraft();
  const sel = String((($('#fOperand') || {}).value || d.kind+':'+d.id)).split(':');
  const c = {kind: sel[0] || 'dim', id: sel[1] || '', op: (($('#fOp') || {}).value) || d.op};
  const o = operandOf(c);
  if(!o) return toast('сравнение называет разрез или меру строки', 'err');
  if(o.vtype === 'корзина') c.bucket = (($('#fBucket') || {}).value) || o.dim.buckets[0];
  if(c.op === 'в диапазоне'){
    c.from = (($('#fFrom') || {}).value) || '';
    c.to   = (($('#fTo')   || {}).value) || '';
  } else if(LIST_OPS.indexOf(c.op) >= 0){
    const el = $('#fVals');
    c.values = el ? [].slice.call(el.selectedOptions).map(x => x.value) : [];
  } else if(o.vtype === 'число'){
    c.value = (($('#fNum') || {}).value) || '';
    if(o.money) c.cur = (($('#fCur') || {}).value) || 'KGS';
  } else c.value = (($('#fVal') || {}).value) || '';
  const target = (($('#fSet') || {}).value) || d.set || 'new';
  const sets = (st.q.filter && st.q.filter.sets) ? clone(st.q.filter.sets) : [];
  if(target === 'new' || !sets[Number(target)]) sets.push({cmps:[c]});
  else sets[Number(target)].cmps.push(c);
  const trial = {sets};
  /* Отказ показывается ДО применения и текстом: «пусто» вместо ответа — не отказ. */
  const res = resolveAsOf(st, st.q.obj, st.q.date);
  const bad = ST.filterCheck(trial, st.q.obj,
    res ? applyScope(rowsAt(st, st.q.obj, res.asOf), st.q.obj) : null);
  if(bad) return toast(bad, 'err');
  st.q.filter = trial;
  d.set = String(target === 'new' ? sets.length - 1 : Number(target));
  st.drill = null; st.work = null; render();
};
ST.dropCmp = (i, j) => {
  const st = ST.state, f = st.q.filter;
  if(!f || !f.sets || !f.sets[i]) return;
  f.sets[i].cmps.splice(j, 1);
  if(!f.sets[i].cmps.length) f.sets.splice(i, 1);
  if(!f.sets.length) st.q.filter = null;
  fDraft().set = 'new';
  st.drill = null; st.work = null; render();
};
ST.clearFilter = () => { const st = ST.state;
  st.q.filter = null; fDraft().set = 'new'; st.drill = null; st.work = null; render(); };
ST.setBucket = (dimId, b) => { ST.state.q.buckets[dimId] = b; ST.state.drill = null; render(); };
ST.exportUI = () => { const st = ST.state;
  act(ST.exportJob({obj: st.q.obj, date: st.q.date, filter: st.q.filter}),
    'выгрузка оформлена — очередь на экране «Выгрузки»'); };
ST.workUI = () => { const st = ST.state; st.work = ST.workList(st.q.obj, st.q.date); render(); };
ST.closeWork = () => { ST.state.work = null; render(); };
ST.showPass = i => { ST.state.tilePass = ST.state.tilePass === i ? null : i; render(); };
ST.toggleInd = id => { const a = ST.state.q.inds, i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else a.push(id); ST.state.drill = null; render(); };
ST.setMode = m => { ST.state.q.mode = m; ST.state.drill = null; render(); };
ST.drillTo = key => { ST.state.drill = key; render(); };
ST.clearDrill = () => { ST.state.drill = null; render(); };
ST.setFlow = (k, v) => { ST.state.flow[k] = v; render(); };

function chip(on, label, onclick, off){
  return '<button class="chip'+(on ? ' on' : '')+(off ? ' off' : '')+'"'+
    (off ? ' disabled' : ' onclick="'+onclick+'"')+'>'+esc(label)+'</button>';
}
/* Редактор наборов. Фильтр — сужение ВОПРОСА, и он виден строкой целиком, а не следом
   клика: сравнения набора стоят рядом через «и», наборы разделены словом «либо». Скобок
   в форме нет, поэтому и рисовать нечего — глубина ровно две (ADR-0180 §1). */
function filterBar(st){
  const d = fDraft(), ops = ST.filterOperands(), all = ops.dims.concat(ops.inds);
  if(!all.length) return '';
  const cur = all.find(x => x.kind === d.kind && x.id === d.id) || all[0];
  d.kind = cur.kind; d.id = cur.id;
  const o = operandOf(d);
  const opList = FOPS[o.vtype] || [];
  if(opList.indexOf(d.op) < 0) d.op = opList[0];
  const bk = o.vtype === 'корзина' ? (d.bucket || o.dim.buckets[0]) : null;
  if(bk) d.bucket = bk;
  const vals = (o.vtype === 'корзина' || o.vtype === 'перечисление' || o.vtype === 'булево')
    ? ST.operandValues(o.kind, o.id, bk) : [];
  const opt = (v, on) => '<option'+(on ? ' selected' : '')+'>'+esc(v)+'</option>';
  const grp = (label, list) => list.length ? '<optgroup label="'+esc(label)+'">'+
    list.map(x => '<option value="'+x.kind+':'+x.id+'"'+
      (x.kind === cur.kind && x.id === cur.id ? ' selected' : '')+'>'+esc(x.name)+'</option>').join('')+
    '</optgroup>' : '';
  const none = '<option value="">— значений на дату среза нет —</option>';
  let vBox;
  if(d.op === 'в диапазоне')
    vBox = '<div class="fld"><label>От корзины</label><select id="fFrom">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>'+
      '<div class="fld"><label>До корзины</label><select id="fTo">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  else if(LIST_OPS.indexOf(d.op) >= 0)
    vBox = '<div class="fld"><label>Значения (несколько)</label>'+
      '<select id="fVals" multiple size="4" style="height:auto">'+
        (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  else if(o.vtype === 'число')
    vBox = '<div class="fld"><label>Константа'+(o.ind && o.ind.unit ? ', '+esc(o.ind.unit) : '')+
        '</label><input id="fNum" type="number" step="any" value="'+esc(d.value || '')+'"></div>'+
      /* Денежная константа НЕСЁТ ВАЛЮТУ: суммы сравниваются по валютам, и «> 1 000 000»
         без валюты — не константа, а половина константы (ADR-0184 §3). */
      (o.money ? '<div class="fld"><label>Валюта</label><select id="fCur">'+
        Object.keys(RATES).map(c => opt(c, c === (d.cur || 'KGS'))).join('')+'</select></div>' : '');
  else
    vBox = '<div class="fld"><label>Значение</label><select id="fVal">'+
      (vals.map(v => opt(v, false)).join('') || none)+'</select></div>';
  const sets = (st.q.filter && st.q.filter.sets) || [];
  const setOpts = sets.map((x,i) => '<option value="'+i+'"'+(String(i) === String(d.set) ? ' selected' : '')+
      '>в набор '+(i+1)+' (И)</option>').join('')+
    '<option value="new"'+(d.set === 'new' || !sets.length ? ' selected' : '')+'>новым набором (ИЛИ)</option>';
  const shown = sets.length ? '<div><h4>Фильтр — '+sets.length+' '+
      plural(sets.length,'набор','набора','наборов')+', сравнений '+
      sets.reduce((n,x) => n + x.cmps.length, 0)+'</h4><div class="chips">'+
      sets.map((x,i) => '<span class="chips-grp">'+(i ? 'либо ' : '')+'набор '+(i+1)+'</span>'+
        x.cmps.map((c,j) => chip(true, cmpText(c)+'   ✕', 'ST.dropCmp('+i+','+j+')')).join('')).join('')+
      '</div></div>' : '';
  return shown+'<div class="form-row" style="margin-top:12px">'+
    '<div class="fld"><label>Операнд</label><select id="fOperand" onchange="ST.pickOperand()">'+
      grp('Разрезы', ops.dims)+grp('Меры строки', ops.inds)+'</select></div>'+
    '<div class="fld"><label>Оператор</label><select id="fOp" onchange="ST.pickFilterOp()">'+
      opList.map(x => opt(x, x === d.op)).join('')+'</select></div>'+
    (bk ? '<div class="fld"><label>Корзина</label><select id="fBucket" onchange="ST.pickFilterBucket()">'+
      o.dim.buckets.map(x => opt(x, x === bk)).join('')+'</select></div>' : '')+
    vBox+
    '<div class="fld"><label>Куда</label><select id="fSet" onchange="ST.pickFilterSet()">'+setOpts+'</select></div>'+
    '<button class="btn btn-secondary" onclick="ST.addCmp()">Добавить сравнение</button>'+
    (sets.length ? '<button class="btn btn-secondary" onclick="ST.clearFilter()">Снять фильтр</button>' : '')+
    '</div>';
}
function pickBar(){
  const st = ST.state, o = OBJ(st.q.obj);
  const objs = st.objects.map(x => chip(x.id === st.q.obj, x.name, "ST.pickObj('"+x.id+"')")).join('');
  const dims = o.dims.map(d => chip(st.q.dims.indexOf(d) >= 0, DIM(d).name, "ST.toggleDim('"+d+"')",
    DIM(d).since > st.q.date)).join('');
  /* 33 агрегата кредита плоской лентой нечитаемы. Блок берётся из поля grp записи —
     ни одного названия блока в разметке нет: заведут показатель с новым grp, и блок
     появится сам (ИС-18 держит сборщик строк, здесь тот же приём для экрана). */
  const aggChip = m => chip(st.q.inds.indexOf(m) >= 0, IND(m).name, "ST.toggleInd('"+m+"')");
  const aggs = o.inds.filter(m => IND(m).src === 'агрегат');
  const blocks = [];
  aggs.forEach(m => { const g = IND(m).grp || '';
    const b = blocks.find(x => x.g === g) || (blocks.push({g, ms: []}), blocks[blocks.length - 1]);
    b.ms.push(m); });
  const inds = blocks.length > 2
    ? blocks.map(b => (b.g ? '<span class="chips-grp">'+esc(b.g)+'</span>' : '')+
        b.ms.map(aggChip).join('')).join('')
    : aggs.map(aggChip).join('');
  const modes = [['slice','Срез — сколько и на сколько'],['series','Ряд — как менялось'],['rows','Строки — кто именно']]
    .map(([k,n]) => chip(st.q.mode === k, n, "ST.setMode('"+k+"')")).join('');
  /* Уровень и корзина — не «настройки отображения», а часть вопроса: они меняют то,
     что спрошено, и потому стоят рядом с разрезом (ADR-0176 §2, §4). */
  const hierD = st.q.dims.map(DIM).filter(d => d && d.levels);
  const bktD  = st.q.dims.map(DIM).filter(d => d && d.buckets);
  const lvlBar = hierD.map(d => '<div><h4>Уровень: '+esc(d.name)+'</h4><div class="chips">'+
    d.levels.map((L,i) => chip((st.q.levels[d.id] || d.levels.length) === i+1, L.name,
      "ST.setLevel('"+d.id+"',"+(i+1)+")")).join('')+'</div></div>').join('');
  const bktBar = bktD.map(d => '<div><h4>Корзина: '+esc(d.name)+'</h4><div class="chips">'+
    d.buckets.map(b => chip(st.q.buckets[d.id] === b, b, "ST.setBucket('"+d.id+"','"+b+"')")).join('')+
    '</div></div>').join('');
  const fBar = ST.canBuild() ? filterBar(st) : '';
  return '<div class="card"><div class="pickbar">'+
    '<div><h4>Объект статистики</h4><div class="chips">'+objs+'</div></div>'+
    '<div><h4>Разрезы</h4><div class="chips">'+dims+'</div></div>'+lvlBar+bktBar+
    '<div><h4>Показатели (агрегаты закрытого списка)</h4><div class="chips">'+inds+'</div></div>'+
    '<div><h4>Вопрос</h4><div class="chips">'+modes+'</div></div>'+
    '</div>'+fBar+'<p class="note">Объект, разрезы и показатели — записи реестров: сборщик строк не знает ни одного '+
    'из этих слов (ИС-18). Показатели среза — только агрегаты закрытого списка '+esc(ST.aggFns().join(' · '))+
    '(ADR-0150 §2); строчный показатель спрашивается швом <code>statRows</code>. '+
    'Разрез с уровнями спрашивается уровнем, разрез-дата — корзиной из объявленного списка: '+
    'свободной корзины («по неделям») в запросе не бывает — это заявка владельцу реестра '+
    '(ИС-22, ИС-23, ADR-0176). Фильтр — часть вопроса, а не след клика: он собирается '+
    'наборами (ДНФ без скобок, ADR-0180), сравнения внутри набора связаны «и», наборы между '+
    'собой — «либо»; операнд — разрез или мера СТРОКИ, правая часть всегда константа, а '+
    'значения берутся из строк на дату среза. В паспорте фильтр печатается целиком, всеми '+
    'наборами и сравнениями: «фильтр задан» — это ответ без вопроса.</p></div>';
}

function sliceTable(res){
  const dims = res.dims, cols = res.inds.filter(m => m !== 'a-count');
  const cell = (g) => '<td class="num"><button onclick="ST.drillTo(\''+esc(g.key).replace(/'/g,"")+'\')">'+
    g.n+'</button></td>'+cols.map(m => '<td class="num">'+cellText(g.values[m])+'</td>').join('');
  let head, body, span;
  if(res.hier){
    /* Дерево: узел печатает СВОИ числа, а не сумму детей, и колонка «своих» показывает
       тех, у кого нижнего уровня нет, — они остаются у родителя (ADR-0176 §5). */
    /* Колонка «своих» появляется только там, где ниже есть уровень: на нижнем уровне
       своих и всего — одно и то же число, и колонка из одних прочерков лишь шумит. */
    const deep = res.hier.depth > 1;
    const line = g => '<tr'+(g.level > 1 ? ' class="lvl"' : '')+'>'+
      '<td style="padding-left:'+(10 + (g.level - 1) * 26)+'px">'+
        (g.level > 1 ? '<span class="muted">└ </span>' : '')+
        esc(g.parts[g.parts.length - 1] || g.key)+'</td>'+
      (deep ? '<td class="num">'+(g.level < res.hier.depth ? g.own : '—')+'</td>' : '')+
      cell(g)+'</tr>'+(g.children || []).map(line).join('');
    head = '<th>'+esc(res.hier.levels.slice(0, res.hier.depth).join(' → '))+'</th>'+
      (deep ? '<th>Своих</th>' : '')+'<th>Объектов</th>'+
      cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(line).join('');
    span = deep ? 2 : 1;
  } else {
    head = (dims.length ? dims.map(d => '<th>'+esc(DIM(d).name)+
        (res.buckets && res.buckets[d] ? ' <span class="small">('+esc(res.buckets[d])+')</span>' : '')+
        '</th>').join('') : '<th>Множество</th>')+
      '<th>Объектов</th>'+cols.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
    body = res.groups.map(g => '<tr>'+
      (dims.length ? dims.map((d,i) => '<td>'+esc(g.parts[i])+'</td>').join('') : '<td>всего</td>')+
      cell(g)+'</tr>').join('');
    span = Math.max(1, dims.length);
  }
  const foot = '<tr><td'+(span > 1 ? ' colspan="'+span+'"' : '')+'>Итого</td>'+
    '<td class="num">'+res.n+'</td>'+
    cols.map(m => '<td class="num">'+cellText(res.total[m])+'</td>').join('')+'</tr>';
  return '<table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="9" class="muted">строк нет</td></tr>')+'</tbody><tfoot>'+foot+'</tfoot></table>'+
    '<p class="note">Число объектов — ссылка: детализация открывает те самые строки, из которых '+
    'собрано число (<code>statRows</code>, ИС-14). Хранимых агрегатов нет ни одного — всё в таблице '+
    'собрано группировкой строк при показе (ИС-3).'+
    (res.hier ? ' Родитель <b>считается по своим строкам</b>, а не складывается из детей: доля и '+
      'среднее неаддитивны, а объект без нижнего уровня при сложении исчез бы — он в колонке «своих» '+
      '(ИС-22, ADR-0176 §5).' : '')+'</p>';
}

function seriesBlock(){
  const st = ST.state;
  const m = st.q.inds.find(x => IND(x).fn !== 'count') || st.q.inds[0] || 'a-count';
  const dts = ST.seriesDates();
  const res = ST.statSeries({obj: st.q.obj, inds: m, dates: dts, filter: st.q.filter});
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  /* Столбик рисуется по СВОЕМУ числу точки. Прежде здесь подставлялся «сомовый эквивалент»
     клетки — то есть у валютного ряда рисовалась сомовая величина под валютным именем
     (ИС-40). Сомовый ряд теперь спрашивается своей записью реестра (ИС-44). */
  const vals = res.points.map(p => (p.value && p.value.v != null) ? p.value.v : 0);
  const top = Math.max.apply(null, vals.concat([1]));
  const bars = res.points.map((p,i) => '<div class="bar'+(p.fixation === 'зафиксировано' ? ' fixed' : '')+'">'+
    '<i style="height:'+Math.max(3, Math.round(vals[i]/top*96))+'px"></i>'+
    '<span>'+fmt(p.asOf || p.date).slice(0,5)+'</span></div>').join('');
  const rows = res.points.map(p => '<tr>'+
    '<td>'+fmt(p.date)+(p.substituted ? ' <span class="pill warn">строк нет, взято '+fmt(p.asOf)+'</span>' : '')+'</td>'+
    '<td>'+(p.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>' :
      '<span class="pill neutral">не зафиксировано</span>')+'</td>'+
    '<td class="num">'+p.n+'</td><td class="num">'+cellText(p.value)+'</td></tr>').join('');
  return passportHtml(res.passport)+
    '<div class="card"><h3>'+esc(IND(m).name)+' <span class="small">— ряд по '+dts.length+
      ' датам, шаг '+esc(st.q.series.step)+'</span></h3>'+
    '<div class="chips" style="margin-bottom:10px">'+
      ['месяц','квартал'].map(k => chip(st.q.series.step === k, 'шаг: '+k, "ST.setSeries('step','"+k+"')")).join('')+
      [4,6,8].map(k => chip(st.q.series.points === k, k+' '+plural(k,'точка','точки','точек'),
        "ST.setSeries('points',"+k+")")).join('')+
    '</div>'+
    '<div class="spark">'+bars+'</div>'+
    '<table class="cgrid"><thead><tr><th>Дата</th><th>Фиксация</th><th>Объектов</th><th>Значение</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    '<p class="note">Признак фиксации у ряда — <b>смешанно</b>, когда часть точек закрыта человеком, '+
    'а часть нет: ряд обязан это сказать, а не усреднить (ИС-10, ADR-0148 §4). Даты ряда — часть '+
    'вопроса: последняя точка всегда дата среза, остальные отсчитаны назад шагом. Точка, на которую '+
    'строк нет, не выбрасывается — берётся ближайшая предыдущая, и подмена помечена (ИС-12).</p></div>';
}

/* Отказ называет ЧИСЛО: «слишком много» без числа не даёт сузить вопрос (ADR-0178 §4).
   Рядом стоят обе законные дороги — сузить вопрос и взять выгрузкой. */
function refusalCard(res){
  const o = OBJ(res.obj);
  return '<div class="card"><h3>Список не отдаётся <span class="small">— в числе '+res.n+' строк</span></h3>'+
    '<div class="banner danger">'+esc(res.why)+'</div>'+passportHtml(res.passport)+
    '<div class="btn-row"><button class="btn btn-primary" onclick="ST.exportUI()">Оформить выгрузку — '+
      res.n+' строк</button>'+
    '<button class="btn btn-secondary" onclick="ST.workUI()">Работать со списком в реестре «'+
      esc(o.owner)+'»</button></div>'+
    '<p class="note">Порог — параметр эксплуатации, а не модели, и считается <b>после</b> ролевых правил: '+
    'иначе отказ выдавал бы размер чужого множества, а куратор с сорока строками получал бы отказ из-за '+
    'холдинга (ADR-0178 §2, §3). Сверка целиком идёт выгрузкой-заданием, и паспорт едет <b>внутри файла</b> '+
    '(ADR-0178 §5).</p></div>';
}
/* Второе действие числа названо отдельно от первого: реестр владельца на СЕГОДНЯ —
   законно другой список, чем строки среза от вчера (врезка ADR-0152 §4). */
function workBlock(){
  const w = ST.state.work;
  if(!w || !w.ok) return '';
  return '<div class="card"><h3>Реестр владельца на сегодня '+
    '<span class="small">— '+w.n+' шт.</span> <button class="btn btn-secondary btn-sm" '+
    'onclick="ST.closeWork()">закрыть</button></h3>'+
    '<div class="banner info">'+esc(w.note)+'</div>'+
    '<p class="mono small">'+w.list.map(esc).join(' · ')+'</p>'+
    '<p class="note">Это <b>не</b> детализация числа: детализация — <code>statRows</code> на дату среза, '+
    'а здесь список владельца на сегодня. Одно число, два разных действия, и подпись обязана назвать '+
    'разницу словами (ИС-14).</p></div>';
}
function rowsBlock(refs, title){
  const st = ST.state;
  const res = ST.statRows({obj: st.q.obj, date: st.q.date, filter: st.q.filter, refs});
  if(!res.ok && res.overLimit) return refusalCard(res);
  if(!res.ok) return '<div class="banner danger">'+esc(res.why)+'</div>';
  const o = OBJ(st.q.obj);
  const dims = o.dims.filter(d => DIM(d).since <= st.q.date);
  const inds = o.inds.filter(m => IND(m).src !== 'агрегат');
  const head = '<th>'+esc(o.refName)+'</th>'+dims.map(d => '<th>'+esc(DIM(d).name)+'</th>').join('')+
    inds.map(m => '<th>'+esc(IND(m).name)+'</th>').join('');
  const body = res.rows.map(r => '<tr><td class="mono">'+esc(r.ref)+'</td>'+
    dims.map(d => '<td>'+esc(dimText(r.dims[d]))+'</td>').join('')+
    inds.map(m => { const I = IND(m);
      const cls = (I.type === 'перечисление' || I.type === 'булево') ? '' : ' class="num"';
      return '<td'+cls+'>'+indCellText(r.inds[m], I, r)+'</td>'; }).join('')+
    '</tr>').join('');
  const list = ST.registryList(st.q.obj, res.passport.asOf, st.q.filter)
    .filter(id => !refs || refs.indexOf(id) >= 0);
  const same = list.join('|') === res.rows.map(r => r.ref).sort().join('|');
  const rate = res.rows.map(r => Object.values(r.inds).find(c => c && c.rateDate)).filter(Boolean)[0];
  return (title ? '' : passportHtml(res.passport))+
    '<div class="card"><h3>'+esc(title || 'Строки среза')+' <span class="small">— '+res.rows.length+' шт.</span>'+
    (title ? ' <button class="btn btn-secondary btn-sm" onclick="ST.clearDrill()">закрыть детализацию</button>' : '')+'</h3>'+
    '<div class="tscroll"><table class="cgrid"><thead><tr>'+head+'</tr></thead><tbody>'+
    (body || '<tr><td colspan="12" class="muted">строк нет</td></tr>')+'</tbody></table></div>'+
    '<p class="note">'+(same
      ? '<b>Сходится с реестром «'+esc(o.owner)+'» один в один</b> ('+list.length+' из '+list.length+') — ИС-14.'
      : '<b class="pill err">расхождение с реестром</b> — это дефект, а не особенность (ИС-14).')+
    ' Значения разрезов взяты <b>из строки</b>, а не пересчитаны на сегодня (ИС-4).'+
    (rate ? ' Суммы — в валюте договора, курс на '+fmt(rate.rateDate)+' (ИС-16).' : '')+
    ' Карточек, документов и связей шов не отдаёт — это реестр владельца.</p></div>';
}

function flowBlock(){
  const st = ST.state, o = OBJ(st.q.obj);
  const flows = o.inds.filter(m => IND(m).flow);
  if(!flows.length) return '<div class="card"><h3>Поток за период</h3>'+
    '<p class="note">У объекта «'+esc(o.name)+'» нарастающих показателей нет: считать разность нечего.</p></div>';
  const inds = flows.indexOf(st.flow.inds) >= 0 ? st.flow.inds : flows[0];
  const res = ST.flowBetween({obj: st.q.obj, inds, from: st.flow.from, to: st.flow.to, filter: st.q.filter});
  /* Конец периода — дата прогона (ИС-36); начало — любая историческая дата, и если строки
     на неё нет, база НАЗЫВАЕТСЯ подстановкой в паспорте (ИС-12, ADR-0151 §2). Поэтому у
     «с даты» в списке есть даты вне журнала, а у «по дату» их нет и быть не может. */
  const opts = (sel, k) => ST.askDates(st.q.obj).map(d => '<option value="'+d+'"'+(d === sel ? ' selected' : '')+'>'+fmt(d)+'</option>').join('');
  return '<div class="card"><h3>Поток за произвольный период <span class="small">— разность двух строк (ИС-17)</span></h3>'+
    '<div class="form-row">'+
    '<div class="fld"><label>Показатель</label><select onchange="ST.setFlow(\'inds\', this.value)">'+
      flows.map(m => '<option value="'+m+'"'+(m === inds ? ' selected' : '')+'>'+esc(IND(m).name)+'</option>').join('')+
    '</select></div>'+
    '<div class="fld"><label>С даты</label><select onchange="ST.setFlow(\'from\', this.value)">'+
      '<option value="2026-05-12"'+(st.flow.from === '2026-05-12' ? ' selected' : '')+'>12.05.2026</option>'+
      '<option value="2026-07-15"'+(st.flow.from === '2026-07-15' ? ' selected' : '')+'>15.07.2026</option>'+
      opts(st.flow.from)+'</select></div>'+
    '<div class="fld"><label>По дату</label><select onchange="ST.setFlow(\'to\', this.value)">'+opts(st.flow.to)+'</select></div>'+
    '</div>'+
    (res.ok
      ? passportHtml(res.passport)+'<div class="kv"><div class="k">'+esc(IND(inds).name)+' за период</div>'+
        '<div class="v"><b>'+esc(money(res.value,'KGS'))+'</b>'+
        (res.born.length ? ' <span class="muted">· объектов, родившихся внутри периода: '+res.born.length+
          ' (их база — ноль)</span>' : '')+'</div></div>'+
        '<p class="note">Произвольный интервал стоит ровно столько же, сколько стандартный месяц: '+
        'обе даты — просто две строки. Хранение по периодам не ответило бы на «за 12–27 мая» вовсе.</p>'
      : '<div class="banner danger">'+esc(res.why)+'</div>')+
    '</div>';
}

function tilesBlock(){
  const st = ST.state;
  const tiles = [
    {module:'кредиты', title:'Карточка кредита · портфель подразделения',
     q:{obj:'obj-credit', dims:['d-branch'], inds:['a-count','a-sumdebt'], date: st.q.date}},
    {module:'ведомство', title:'Свод ведомства · портфель по категориям',
     q:{obj:'obj-credit', dims:['d-category'], inds:['a-count','a-sumdebt'], date: st.q.date}},
    /* Третья плитка — про ADR-0201 §2: спрашивают ПРОГРАММЫ, а объект среза — КРЕДИТ.
       Своих величин у программы нет, и плитка от этого не пропала. */
    {module:'программы', title:'Карточка программы · освоение по программе',
     q:{obj:'obj-credit', dims:['d-program'], inds:['a-count','a-sumissued'], date: st.q.date}}
  ];
  const html = tiles.map((t, i) => {
    const r = ST.callSeam(t.module, 'statSlice', t.q);
    if(!r.ok) return '<div class="card"><h3>'+esc(t.title)+'</h3><div class="banner danger">'+esc(r.why)+'</div></div>';
    const lines = r.groups.map(g => '<div class="row"><span class="k">'+esc(g.parts[g.parts.length-1] || g.key || 'всего')+
      '</span>'+g.n+' · '+cellText(g.values[t.q.inds[1]])+'</div>').join('');
    /* Краткая форма паспорта — одна строка, и объявлена ПРОИЗВОДИТЕЛЕМ: сокращать
       по-своему потребитель не вправе, иначе три модуля сократят по-разному (ИС-24). */
    return '<div class="card"><h3>'+esc(t.title)+' <span class="small">— модуль «'+esc(t.module)+'»</span></h3>'+
      '<div class="pass '+(r.passport.substituted ? 'warn' : '')+'">'+lines+
      '<div class="row muted" style="margin-top:6px">'+esc(r.passport.short)+
      ' <button class="btn btn-secondary btn-sm" onclick="ST.showPass('+i+')">'+
      (st.tilePass === i ? 'свернуть паспорт' : 'полный паспорт')+'</button></div></div>'+
      (st.tilePass === i ? passportHtml(r.passport) : '')+'</div>';
  }).join('');
  const refused = ST.callSeam('классификация', 'statSlice', {obj:'obj-credit', dims:[], inds:['a-count'], date: st.q.date});
  return '<h2 class="section-h">Зеркальные плитки у соседей</h2>'+
    '<p class="page-lead">Плитка берёт <code>statSlice</code> и печатает паспорт рядом с числом. '+
    'Плиток «число без даты» в системе не остаётся (ИС-10). Форм паспорта <b>ровно две</b>, и обе '+
    'объявила статистика: краткая — строкой под числом, полная — действием. Третьей, придуманной '+
    'потребителем, не существует (ИС-24, врезка ADR-0152 §2).</p>'+html+
    '<div class="card"><h3>Классификация просит срез</h3>'+
    '<div class="banner danger">'+esc(refused.why)+'</div>'+
    '<p class="note">Кольцо ТЗ разрезано различением, а не порядком запуска: «статистический показатель» '+
    'в предикате классификатора — свёртка по самому объекту (это расчёт), а не срез по множеству чужих '+
    '(ИС-5, ADR-0146 §2).</p></div>';
}

function viewBuild(){
  const st = ST.state;
  if(!ST.canBuild()) return '<div class="banner warn"><b>Наблюдателю конструктор не открыт.</b> '+
    'Отказ по праву доступа говорит текстом, а не пропадающей кнопкой: наблюдателю доступны готовые '+
    'срезы и плитки (роли — §13 канона).</div>'+tilesBlock();
  let out = '<h2 class="section-h">Вопрос к статистике</h2>'+
    '<p class="page-lead">Объект → разрезы → показатели → дата. Три вопроса — три шва: '+
    '<code>statSlice</code> (сколько и на сколько) · <code>statSeries</code> (как менялось) · '+
    '<code>statRows</code> (кто именно в числе). Четвёртого нет: «дай всё» — не вопрос.</p>'+pickBar();
  if(st.q.mode === 'series') return out + seriesBlock() + workBlock() + flowBlock() + tilesBlock();
  if(st.q.mode === 'rows')   return out + rowsBlock(null, null) + workBlock() + flowBlock() + tilesBlock();
  const res = ST.statSlice(st.q);
  if(!res.ok) return out + '<div class="banner danger">'+esc(res.why)+'</div>';
  out += passportHtml(res.passport)+'<div class="card"><h3>Срез</h3>'+sliceTable(res)+'</div>';
  if(st.drill){
    const g = ST.findNode(res.groups, st.drill) ||
      ST.findNode(res.groups, res.groups.map(x => x.key).find(k => k.replace(/'/g,'') === st.drill));
    if(g) out += rowsBlock(g.refs, 'Кто именно в числе '+g.n+': '+g.key);
  }
  return out + workBlock() + flowBlock() + tilesBlock();
}

   кнопки (ИС-38, ADR-0149). Верхнюю колонку ставит своя дверь модуля — за ней стоит
   фиксация строк, которой у нижних слоёв нет. */
ST.layerUI = layer => {

/* Форма ОДНА на обе породы: общая половина спрашивается всегда, вторая раскрывается по
   выбранной породе (ADR-0209 §7). Двух форм здесь нет не из экономии места — две формы
   суть две модели, и они расходятся: `addDim` успел спросить объект определения, а
   `addIndicator` — нет, и жила эта разница ровно до того дня, когда её заметили.      */
const formKind = () => (ST.state.form && ST.state.form.kind) || KIND.IND;
ST.setFormKind = k => { ST.state.form = {kind: k}; render(); };
ST.addRecordUI = () => {
  const g = id => (($('#'+id) || {}).value || '').trim();
  const kind = formKind(), src = g('rSrc');
  const spec = {kind, id: g('rId'), name: g('rName'), obj: g('rObj'), src};
  /* Число дат в форме — вопрос, а не галочка: у него есть ответ «не отвечено», и он
     кончается отказом. Умолчание здесь было бы согласием за заводящего (ИС-47). */
  const dates = g('rDates'); if(dates) spec.dates = Number(dates);
  if(src === 'шов'){ spec.seam = g('rSeam'); spec.field = g('rField'); }
  else if(src !== 'агрегат'){ spec.key = g('rKey'); }
  if(kind === KIND.IND){
    if(src === 'агрегат'){ spec.fn = g('rFn'); spec.over = g('rOver'); }
    else { spec.type = g('rType'); const u = g('rUnit'); if(u) spec.unit = u; }
    const roll = g('rRoll'); if(roll) spec.roll = roll;
  } else {
    spec.perObject = g('rPer');
    const b = g('rBuckets');
    if(b) spec.buckets = b.split(/[,·]/).map(x => x.trim()).filter(Boolean);
    const ref = g('rRef');
    if(ref && REF[ref]){ spec.ref = ref; spec.owner = REF[ref].owner; spec.levels = clone(DIM('d-branch').levels); }
    const basis = g('rBasis'); if(basis) spec.basis = basis;
    const e = g('rEdges');
    if(e) spec.edges = e.split(/[,·]/).map(x => Number(x.trim())).filter(x => !isNaN(x));
    const ord = g('rOrder'); if(ord) spec.order = ord;
  }
  act(ST.addRecord(spec), 'заведена запись реестра «'+spec.name+'» — порода «'+kind+'»');
};
ST.addDimUI = () => act(ST.addDim({id:'d-segment', name:'Сегмент портфеля', obj:'obj-credit',

  src:'агрегат', fn:'sum', over:'m-debt', dates:1, formula:'sum(overdue)/sum(debt)'}));
ST.tryMissingSeamUI = () => act(ST.addIndicator({id:'m-try2', name:'Ожидаемые потери', obj:'obj-credit',

   «нельзя», а АДРЕС: графа изменения выпуска или обзор анализа (ИС-47, ADR-0220 §6). */
ST.tryTwoDatesUI = () => act(ST.addIndicator({id:'m-try3', name:'Изменение остатка за месяц',
  obj:'obj-credit', src:'поле', key:'amount', type:'сумма', unit:'сом', dates:2}));

ST.tryDimFormulaUI = () => act(ST.addDim({id:'d-try', name:'Корзина по формуле', obj:'obj-credit',
  src:'поле', key:'daysOverdue', perObject:'одно', dates:1, formula:'floor(daysOverdue/30)'}));

ST.tryAlienFieldUI = () => act(ST.addDim({id:'d-try2', name:'Срок неплатежа в днях', obj:'obj-credit',

/* Проверка ИС-21: «вид погашения» у КРЕДИТА многозначен — значит это не разрез кредита,
   а нижележащий объект «погашение», у которого вид один (ADR-0179 §1). */
ST.tryManyDimUI = () => act(ST.addDim({id:'d-repkind2', name:'Вид погашения', obj:'obj-credit',

/* Вывод записи: сначала поимённый список того, что сломается, потом решение человека.
   Молчаливого отказа по чужой публикации нет (ИС-25, ADR-0177 §4). Сам вывод — ДАТА
   прекращения, а не удаление: колонка витрины остаётся, в ней числа прошлых строк. */
ST.retireUI = id => {
  const r = ST.retire(id);
  if(r.needsConfirm){ ST.state.retire = {id, breaks: r.breaks, why: r.why}; return render(); }
  ST.state.retire = null; act(r, 'запись прекращает действие с сегодня — из витрины колонка не убрана');
};
ST.retireGoUI = () => {
  const q = ST.state.retire; if(!q) return;
  const r = ST.retire(q.id, true);
  ST.state.retire = null;
  act(r, r.ok ? 'запись прекращена с '+fmt(r.until)+'; сломано ссылок — '+(r.broke || []).length : '');
};
ST.retireCancelUI = () => { ST.state.retire = null; render(); };
/* Переезд породы — рядовое событие настройки: запись та же, идентификатор тот же, история
   дописывается. Сперва он пробуется как есть — и отказ САМ называет, каких реквизитов
   новой породы не хватает; потом они спрашиваются формой (ADR-0209, контекст). */
ST.changeKindUI = id => {
  const R = REC(id); if(!R) return;
  const to = R.kind === KIND.IND ? KIND.DIM : KIND.IND;
  const r = ST.changeKind(id, to);
  if(r.ok) return act(r, 'порода сменена: «'+r.was+'» → «'+r.kind+'», идентификатор и история те же');
  ST.state.kindMove = {id, to, why: r.why}; render();
};
ST.changeKindGoUI = () => {
  const q = ST.state.kindMove; if(!q) return;
  const g = id => (($('#'+id) || {}).value || '').trim();
  const extra = {src: g('kSrc')};
  if(q.to === KIND.DIM){ extra.perObject = g('kPer'); extra.key = g('kKey'); }
  else { extra.type = g('kType'); extra.unit = g('kUnit'); extra.key = g('kKey'); }
  const r = ST.changeKind(q.id, q.to, ST.state.role, extra);
  if(r.ok){ ST.state.kindMove = null; return act(r, 'порода сменена: «'+r.was+'» → «'+r.kind+
    '»; снято реквизитов прежней породы — '+r.dropped.length); }
  ST.state.kindMove = {id: q.id, to: q.to, why: r.why}; act(r);
};
ST.changeKindCancelUI = () => { ST.state.kindMove = null; render(); };
/* Ссылку публикует ПОТРЕБИТЕЛЬ вместе со своей редакцией — реестр её не угадывает. */

ST.liveUI = (id, val) => act(ST.setLive(id, val));
/* Одиннадцатый объект — записи реестра подряд: сам объект, его СОБСТВЕННЫЕ разрезы,
   показатель и агрегат над ним. Ни одной правки движка (ИС-18, ADR-0149).
   Порядок с волны 17 ч.6 именно такой: денежная величина обязана НАЗВАТЬ разрез, внутри
   которого складывается (ИС-44, ADR-0214 §1), а назвать можно только уже существующее —
   потому разрезы заводятся первыми, и среди них «Валюта поручительства».
   Чужих разрезов в составе нет ни одного, и это не аккуратность, а запрет: «Территория
   выдачи кредита» определена на кредите, и поручительству она не принадлежит (ИС-40,
   ADR-0206 §3). Своя запись берёт ТОТ ЖЕ справочник значений — другой остаётся дорога
   до значения (ADR-0206 §5): второго экземпляра оргструктуры здесь не заводится. */
ST.addObjUI = () => {
  const o = ST.addObject({id:'obj-guarantee', name:'Поручительство', plural:'поручительства',
    owner:'Обеспечение', refName:'номер поручительства', born:{src:'поле', key:'gdate'},
    scope:{dim:'d-gcurator'}, dims:[], inds:['a-count']});
  if(!o.ok) return act(o);
  const own = [
    {id:'d-gbranch', obj:'obj-guarantee', name:'Подразделение поручительства', src:'история',
     key:'branch', perObject:'одно', dates:1, owner:'Оргструктура (кадры)', ref:'org',
     levels: clone(DIM('d-branch').levels)},
    {id:'d-gcurator', obj:'obj-guarantee', name:'Куратор поручительства', src:'история',
     key:'curator', perObject:'одно', dates:1},
    {id:'d-gregion', obj:'obj-guarantee', name:'Территория поручительства', src:'поле',
     key:'region', perObject:'одно', dates:1, owner:'Справочник административного деления',
     levels: clone(DIM('d-region').levels)},
    {id:'d-gptype', obj:'obj-guarantee', name:'Тип лица поручителя', src:'поле',
     key:'ptype', perObject:'одно', dates:1},
    {id:'d-gcur', obj:'obj-guarantee', name:'Валюта поручительства', src:'поле',
     key:'cur', perObject:'одно', dates:1}];
  for(const spec of own){ const r = ST.addDim(spec); if(!r.ok) return act(r); }
  const a = ST.addIndicator({id:'m-gsec', name:'Требования, обеспеченные поручительством', obj:'obj-guarantee',
    src:'шов', seam:'calcDebt', field:'principal', money:true, type:'сумма', dates:1,
    roll:'формульный', rollBy:'d-gcur'});
  if(!a.ok) return act(a);
  const b = ST.addIndicator({id:'a-sumgsec', name:'Обеспечено поручительствами, итого', obj:'obj-guarantee',
    src:'агрегат', fn:'sum', over:'m-gsec', dates:1});
  if(!b.ok) return act(b);
  act({ok:true}, 'объект заведён с пятью своими разрезами; денежная величина пришла парой — '+
    'валютная «'+IND('m-gsec').name+'» и сомовая «'+IND(a.som).name+'»: строки появятся ближайшим прогоном');
};

/* Колонка ссылок — вторая хранимая вещь модуля после строк среза (ADR-0177 §1). */
function refCell(id){
  const rs = ST.refsTo(id);
  if(!rs.length) return '<span class="muted">—</span>';
  return '<b>'+rs.length+'</b> <span class="small">'+esc(rs.map(r => r.consumer).join(' · '))+'</span>';
}
/* Дорога до значения общая обеим породам: это АДРЕС, а не формула (ADR-0150). */
function roadCell(r){
  return r.src === 'шов' ? '<span class="pill info">шов ядра</span> <span class="mono">'+esc(r.seam)+'.'+esc(r.field)+'</span>' :
    r.src === 'агрегат' ? '<span class="pill ok">агрегат</span> <span class="mono">'+esc(r.fn)+(r.over ? '('+esc(r.over)+')' : '()')+'</span>' :
    r.src === 'история' ? '<span class="pill neutral">история</span> <span class="mono">'+esc(r.key)+'</span>' :
    '<span class="pill neutral">поле объекта</span> <span class="mono">'+esc(r.key || '')+'</span>';
}
/* Число дат стоит рядом с дорогой, потому что это про ту же величину: дорога говорит,
   ОТКУДА её взять, а этот реквизит — СКОЛЬКО СРЕЗОВ для этого нужно (ИС-47, ADR-0220). */
function datesCell(r){
  return '<div class="small">дат среза: <b>'+(r.dates || 1)+'</b></div>';
}
/* Вторая половина СТРОКИ реестра — та же, что вторая половина формы: она читается по
   породе записи, и колонка у обеих пород одна (ADR-0209 §7). */
function kindCell(r){
  if(r.kind === KIND.IND){
    const t = typeOf(r), u = unitOf(r);
    return '<b>'+esc(t || '—')+'</b>'+(u ? ' · '+esc(u) : '')+
      '<div class="small">свод: '+esc(r.roll || '—')+(ST.liveOf(r.id).live ? '' : ' · считается прогоном')+
      (r.flow ? ' · нарастающий' : '')+
      (r.dedupBy ? ' · один раз на «'+esc((DIM(r.dedupBy) || {}).name || r.dedupBy)+'»' : '')+'</div>';
  }
  return (r.levels ? '<span class="pill info">уровни</span> '+esc(r.levels.map(L => L.name).join(' → ')) :
      r.buckets ? '<span class="pill neutral">корзины: '+esc(r.buckets.join(' · '))+'</span>' : '<span class="muted">значения строк</span>')+
    '<div class="small">порядок: '+esc(r.order || '—')+
    (r.owner ? ' · справочник ведёт: '+esc(r.owner) : '')+
    (r.basis ? ' · основание: <b>'+esc((IND(r.basis) || {}).name || r.basis)+'</b>, границы '+
      esc((r.edges || []).join(' · ')) : '')+'</div>';
}

    '<button class="btn btn-secondary" onclick="ST.tryFreeBucketUI()">Спросить корзину «неделя»</button>'+
    '<button class="btn btn-secondary" onclick="ST.addObjUI()">Завести одиннадцатый объект «Поручительство»</button>'+
    '<button class="btn btn-secondary" onclick="ST.publishUI()">Опубликовать редакцию потребителя</button>'+
    '<button class="btn btn-secondary" onclick="ST.unpublishUI()">Переиздать её без ссылок</button>'+
    '</div>'+
    '<p class="note">Форма <b>одна на обе породы</b>, и вторая её половина раскрывается по выбранной '+
    'породе (ADR-0209 §7). Поля формулы в ней нет и не будет <b>ни у одной</b> породы: запись объявляет '+
    '<b>откуда</b> берётся величина и молчит о том, <b>как</b> она получается (ИС-6, ADR-0150). Корзина '+
    'исключением не является — она не выводит новой величины, а раскладывает существующую по границам, '+
    'и потому обязана назвать <b>показатель-основание</b>, а границы держать здесь, в реестре: иначе '+
    '«просрочка 30–90» в соседнем отчёте перестанет означать то же самое (ADR-0209 §4, §5). Нужной '+
    'величины ни один шов не отдаёт — это <b>задача ядру</b>, а не обход (ADR-0150 §3). Поля «уровни» '+
    'в форме тоже нет: называется <b>владелец справочника</b>, а не «дивизион → филиал» руками — '+
    'напечатанная иерархия стала бы вторым экземпляром оргструктуры (ADR-0176 §7). Корзины объявляются '+
    'списком: чего в списке нет, того в запросе не спросить (ИС-23). Спрашивается и <b>сколько дат '+
    'среза</b> нужно, чтобы величину вычислить: одна — законная колонка, две и больше — не колонка '+
    '<b>никогда</b>, и умолчания у этого вопроса нет (ИС-47, ADR-0220). Критерий механический: решает '+
    'объявленное <b>число</b>, а не слово в имени — «темп роста портфеля» и «миграция из категории в '+
    'категорию» ни одного запретного слова не содержат, и ловятся они здесь. Отказ называет <b>адрес</b>: '+
    'одна пара дат внутри выпуска — графа изменения отчёта (ADR-0218), ряд по многим датам — обзор '+
    'анализа (ADR-0155). Доля и «процент от» отвергаются <b>другим</b> основанием — они считаются '+
    'при показе на ОДНОЙ дате (ИС-15), и правило о числе дат их не касается. Сомовый эквивалент из '+
    'этого запрета <b>изъят</b>: он не представление, а запись реестра со своим именем, и заявка '+
    '«Сомовый эквивалент …» заводится обычным порядком (ИС-44, ADR-0214 §2).</p></div>'
      : '<div class="banner info">Реестр ведёт администратор статистики. Отказ по праву доступа говорит '+
      'текстом, а не пропадающей кнопкой.</div>';
  /* Схема витрины ПОРОЖДЕНА реестром, и журнал её — единственное место, где это видно
     целиком: операция в нём ровно одна (ADR-0209 §6). */
  const mart = st.mart, mlog = st.martLog;
  const adds = mlog.filter(x => x.op === 'ADD COLUMN').length;
  const martRows = mlog.slice(-8).map(x => '<tr><td class="mono">'+esc(x.op)+'</td>'+
    '<td class="mono">'+esc(x.col)+'</td><td>'+esc(x.kindAt)+'</td><td>'+esc(x.type)+'</td>'+
    '<td>'+(x.nullable ? 'да' : 'нет')+'</td><td>'+fmt(x.at)+'</td><td class="small">'+esc(x.why)+'</td></tr>').join('');
  const martCard = '<h2 class="section-h">Схема витрины порождена реестром</h2>'+
    '<p class="page-lead">Колонок в витрине <b>'+mart.length+'</b> — ровно по числу записей реестра, и '+
    'каждая заведена <b>записью в журнал</b>. Операция в журнале ровно одна: <code>ADD COLUMN</code>, '+
    'всегда nullable (<b>'+adds+'</b> из '+mlog.length+'), удалений — <b>'+(mlog.length - adds)+'</b>. '+
    'Nullable — не мягкость, а факт: строки, написанные до заведения записи, в этой колонке пусты, и '+
    'заполнить их задним числом нечем (ADR-0147 §4). Обратного хода нет и быть не может: в колонке уже '+
    'лежат числа, и <code>DROP</code> сделал бы прошлые строки нечитаемыми — в клетке осталось бы '+
    'значение без имени. Поэтому запись не удаляют, а <b>прекращают действие с даты</b> (ADR-0209 §6).</p>'+
    '<table class="cgrid"><thead><tr><th>Операция</th><th>Колонка</th><th>Порода при заведении</th>'+
    '<th>Тип</th><th>Nullable</th><th>Когда</th><th>Почему</th></tr></thead><tbody>'+martRows+
    '</tbody></table><p class="note">Показаны последние 8 записей журнала. Порода в журнале — '+
    '<b>историческая отметка</b>, а не текущее свойство: сегодняшнюю породу называет реестр, и смена '+
    'породы журнала не трогает вовсе — колонка принадлежит <b>записи</b>, а не породе.</p>';
  return '<h2 class="section-h">Реестр объектов статистики</h2>'+
    '<p class="page-lead">Объект — <b>запись</b>, а не ветка кода: шестой заводится строкой, а не релизом '+
    '(ИС-18, ADR-0149). Заёмщик стоит здесь <b>самостоятельным</b> объектом, а не свёрткой строк кредитов: '+
    'заёмщик с тремя кредитами при свёртке посчитался бы трижды, а заёмщик без действующих кредитов '+
    'исчез бы вовсе (ИС-19).</p>'+
    '<table class="cgrid"><thead><tr><th>Объект</th><th>Владелец множества</th><th>Разрезы</th>'+
    '<th>Показатели</th><th>Рождение</th><th>Объектов в мире</th></tr></thead><tbody>'+objs+'</tbody></table>'+
    '<h2 class="section-h">Реестр: одна кладовая, две породы</h2>'+
    '<p class="page-lead">Реестр <b>один</b>, и запись объявляет свою <b>породу</b> — показатель или '+
    'разрез, — а порода определяет набор обязательных реквизитов (ИС-43, ADR-0209). Записей '+
    '<b>'+st.registry.length+'</b>: '+st.indicators.length+' показателей и '+st.dims.length+' разрезов, '+
    'и лежат они <b>вместе</b>: породу каждой называет она сама, а не массив, в который её положили. '+
    'Двух реестров здесь нет намеренно — общих реквизитов больше, чем различающихся (объект, права, '+
    'даты действия, журнал, порождение схемы витрины), а переезд записи из породы в породу — '+
    '<b>рядовое событие настройки</b>, которое при двух реестрах стало бы удалением и заведением '+
    'заново с потерей истории. Записи, которой здесь нет, не существует ни для кого — ни для витрины, '+
    'ни для предиката, ни для выгрузки (ИС-7). Общий контракт двух потребителей — статистики и '+
    'классификации — переехал сюда из классификации (ADR-0146 §4, врезка в ADR-0120 §2): общий '+
    'контракт не живёт внутри одного из потребителей.</p>'+
    '<table class="cgrid"><thead><tr><th>ID</th><th>Наименование</th><th>Порода</th>'+
    '<th>Дорога до значения</th><th>Реквизиты породы</th><th>Действует с</th>'+
    '<th>Ссылки потребителей</th><th>Действия</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p class="note">Колонка «дорога до значения» <b>общая</b> обеим породам: это адрес, а не формула — '+
    'запись говорит, откуда взять величину (ADR-0150). Колонка «реквизиты породы» и есть вторая '+
    'половина формы, прочитанная обратно. Значение разреза ложится <b>в строку</b> и больше не '+
    'резолвится никогда: строка от 31.05 несёт куратора и категорию мая, а не сегодняшние (ИС-4); '+
    'новая запись действует <b>вперёд</b> — прошлое ею не размечается. У каждой записи назван '+
    '<b>объект</b>, и имя им уточнено: не «территория», а «территория заёмщика» и «территория выдачи '+
    'кредита» — <b>две записи</b> (ИС-40, ADR-0206). «Дней просрочки» и «Срок неплатежа» — тоже две '+
    'записи разных пород об <b>одной величине</b>, и вторая называет первую своим <b>основанием</b>, '+
    'а границы держит в реестре (ADR-0209 §5). Колонка ссылок — вторая хранимая вещь модуля после '+
    'строк среза: ссылку публикует потребитель вместе со своей редакцией (ADR-0177 §1, §2). '+
    'Исчислимость налету правится только у агрегатов: у шва и поля она производна от источника '+
    '(ADR-0159, врезка). Уровни несёт <b>разрез</b>, а не отдельный реестр иерархий: иерархия '+
    'существует только как способ спросить (ADR-0176 §1, §7).</p>'+refCard+moveCard+form+martCard+
    '<div class="card"><h3>Чего здесь завести нельзя</h3>'+
    '<div class="kv">'+
    '<div class="k">формулу — ни у одной породы</div><div class="v">формула породила бы второй способ '+
      'получить сумму — это E2E-09 с другой стороны (ИС-6, ADR-0150, ADR-0209 §4)</div>'+
    '<div class="k">третью породу</div><div class="v">свод, темп, дельта и скользящее среднее записями '+
      'реестра не становятся: одна дата — колонка статистики, много дат — работа анализа '+
      '(ADR-0209, границы)</div>'+
    '<div class="k">реквизит чужой породы</div><div class="v">единица измерения у признака и иерархия '+
      'у числа — не лишнее поле, а запись, про которую не объявлено, чем она должна быть: проверить '+
      'в ней нечего (ADR-0209 §1–§3)</div>'+
    '<div class="k">удаление записи</div><div class="v">в строках прошлого её колонка заполнена: '+
      'удалённая запись оставит число без имени. Запись <b>прекращает действие с даты</b> '+
      '(ADR-0209 §6)</div>'+
    '<div class="k">долю и «процент от»</div><div class="v">представление, а не показатель: '+
      'считаются при показе из двух чисел и не хранятся (ИС-15). Сомового эквивалента в этом ряду '+
      'больше нет — он <b>величина</b> и лежит своей колонкой (ИС-44, ADR-0214)</div>'+
    '<div class="k">хранимый агрегат</div><div class="v">агрегат рядом с детализацией разойдётся с ней, '+
      'и объяснить это будет нечем (ИС-3)</div>'+
    '<div class="k">четвёртый шов</div><div class="v">швов три, каждый назван вопросом; «дай всё» — '+
      'не вопрос (ADR-0152 §1)</div>'+
    '<div class="k">правку строки среза</div><div class="v">строку пишет только прогон: правка руками '+
      'уничтожает смысл датированного среза (ИС-2)</div>'+
    '<div class="k">свою защёлку статистики</div><div class="v">защёлка одна — закрытие учётного периода '+
      'человеком; своего «периода статистики» нет (ИС-9)</div>'+
    '<div class="k">многозначный разрез</div><div class="v">если у объекта значений разреза много, '+
      'это не разрез, а нижележащий объект: разрез отвечает на «в каком множестве строка», а строка '+
      'в двух множествах сразу не бывает (ИС-21, ADR-0179 §1)</div>'+
    '<div class="k">корзину «по неделям» мимо реестра</div><div class="v">набор корзин объявлен записью '+
      'разреза; свободной корзины в запросе не существует — новая заводится строкой (ИС-23)</div>'+
    '<div class="k">свою краткую форму паспорта</div><div class="v">форм ровно две, и обе объявила '+
      'статистика: иначе три модуля сократят по-разному (ИС-24)</div>'+
    '</div></div>';
}

/* ======================== ЭКРАН 4: ВЫГРУЗКИ ========================== *
   Сверка целиком — не «показать 20 000 строк на экране», а задание с файлом, и
   паспорт едет ВНУТРИ файла: файл живёт дольше экрана и уходит из системы, а
   число без даты расчёта за её пределами уже не восстановить (ADR-0178 §5).   */
ST.exportDemoUI = () => act(ST.exportJob({obj:'obj-repay', date: ST.state.q.date, filter: null}),
  'выгрузка оформлена');
/* Выгрузка за ЗАКРЫТЫЙ период — чтобы пометку расхождения было на чём показать: перезакройте
   май на экране «Журнал срезов», и это задание пометится, не изменившись ни числом (ИС-50). */
ST.exportClosedUI = () => act(ST.exportJob({obj:'obj-credit', date:'2026-05-31', filter: null}),
  'выгрузка за закрытый май оформлена');
function viewExports(){
  const list = ST.exportsList();
  const rows = list.map(j => '<tr><td class="mono">'+esc(j.id)+'</td>'+
    '<td>'+esc(OBJ(j.obj) ? OBJ(j.obj).name : j.obj)+'</td>'+
    '<td>'+fmt(j.date)+'</td><td class="num">'+j.n+'</td>'+
    '<td>'+esc(j.by)+'</td><td>'+fmt(j.at)+'</td>'+
    '<td><span class="pill neutral">'+esc(j.state)+'</span>'+
      ((j.marks || []).length ? ' <span class="pill warn">числа изменились после сдачи</span>' : '')+'</td>'+
    '<td class="mono small">'+esc(j.file)+'</td></tr>'+
    '<tr><td colspan="8">'+
      /* Пометка стоит НАД паспортом и произносится вслух: молчащее расхождение со сданным
         обнаруживает получатель, а не мы (ИС-50, ADR-0157 §5). Задание при этом не тронуто —
         числа мёрзнут один раз (ИО-4), переиздавать решает человек (ИО-34). */
      (j.marks || []).map(k => '<div class="banner warn"><b>Расхождение со сданным.</b> Период '+
        esc(monLabel(k.period))+' перезакрыт распоряжением '+esc(k.order)+' ('+esc(k.basis)+'), '+
        'помечено '+fmt(k.at)+'. Задание <b>не пересобрано</b>: номер, файл, число строк и паспорт '+
        'те же — метка не отзывает сданное, она не даёт молча считать его верным. Переиздавать '+
        'корректирующей выгрузкой или нет — решение человека (ИО-4, ИО-34, ADR-0157 §5).</div>').join('')+
      '<div class="small muted" style="margin-bottom:4px">Паспорт внутри файла — '+
      'первыми строками, до данных:</div>'+passportHtml(j.passport)+'</td></tr>').join('');
  return '<h2 class="section-h">Выгрузки</h2>'+
    '<p class="page-lead">Порог показа отсекает <b>экран</b>, а не работу: тому, кому нужна сверка '+
    'целиком, дорога есть — задание на выгрузку. Усечённого и постраничного ответа не бывает: '+
    'усечение молча меняет ответ на вопрос «сколько», а страница №7 — это ответ без вопроса '+
    '(ИС-22, ADR-0178 §1, §5).</p>'+
    '<div class="card"><h3>Очередь заданий</h3>'+
    (list.length ? '<table class="cgrid"><thead><tr><th>Задание</th><th>Объект</th><th>Дата среза</th>'+
      '<th>Строк</th><th>Кто</th><th>Когда</th><th>Состояние</th><th>Файл</th></tr></thead><tbody>'+
      rows+'</tbody></table>'
     : '<div class="banner info">Заданий нет. Отказ <code>statRows</code> по порогу предлагает оформить '+
       'выгрузку — оттуда задания и берутся.</div>')+
    '<div class="btn-row"><button class="btn btn-secondary" onclick="ST.exportDemoUI()">Оформить выгрузку '+
      'погашений на дату среза</button>'+
      '<button class="btn btn-secondary" onclick="ST.exportClosedUI()">Оформить выгрузку за закрытый '+
      'май (её пометит перезакрытие)</button></div>'+
    '<p class="note">Паспорт <b>внутри файла</b>, а не в письме рядом: письмо теряется, файл пересылают. '+
    'Дата расчёта, фиксация, область видимости и фильтр едут первыми строками — иначе через месяц число '+
    'в файле нечем объяснить (ИС-10, ADR-0178 §5).</p></div>'+
    '<div class="card"><h3>Чего на этом экране нет</h3><div class="kv">'+
    '<div class="k">кнопки «показать все строки»</div><div class="v">порог двоичен: полный список '+
      'или отказ с числом — третьего ответа у шва нет (ADR-0178 §1)</div>'+
    '<div class="k">страниц</div><div class="v">страница №7 — ответ без вопроса: вопрос сужается '+
      'разрезом, а не листанием (ИС-22)</div>'+
    '<div class="k">файла без паспорта</div><div class="v">число без даты расчёта за пределами '+
      'системы не восстановить (ИС-10)</div>'+
    '<div class="k">порога в модели</div><div class="v">порог — параметр эксплуатации: сегодня 12, '+
      'завтра 500, и модель от этого не меняется (ADR-0178 §2)</div>'+
    '<div class="k">переиздания по пометке</div><div class="v">пометка — не переиздание: числа мёрзнут '+
      'один раз (ИО-4), а переиздавать корректирующей выгрузкой решает человек (ИО-34). Система лишь '+
      'не даёт сделать вид, что перезакрытия периода не было (ИС-50, ADR-0157 §5)</div>'+
    '</div></div>';
}

if(typeof window !== 'undefined') window.ST = ST;
if(typeof document !== 'undefined') render();
</script>
</body>
</html>
