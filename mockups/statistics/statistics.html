  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Статистика» (TO-BE).
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Прогон собирает строки на дату, закрытие учётного
  периода их фиксирует, три шва отвечают на три вопроса и каждый ответ несёт паспорт,
  детализация сходится со списком реестра, роль сужает множество ДО группировки. Ничего из
  этого не зашито кодом: все восемь объектов собраны ИЗ ДАННЫХ, и в сборщике строк
  (buildRow/runFor/readDim/readInd) слова «кредит» нет ни одного.

  Волна 1 (21.08.2026) вывела модель на бумаге: ADR-0145…ADR-0152 плюс канон логики.
  Волна 2 — этот файл: та же модель, доведённая до исполняемого эталона поведения.
  Волна 3 (26.08.2026) добрала шесть механизмов, которых модель требовала, а макет не имел:
  восемь объектов реестра · дерево уровней у разреза · корзины дат · обратный индекс ссылок
  потребителей · краткая форма паспорта · двоичный отказ statRows с дорогой на выгрузку
  (ADR-0176…ADR-0179) и попутно закрыла четыре бывших дефекта макета: даты ряда стали частью
  вопроса (шаг и число точек), фильтр задаётся конструктором со значениями ИЗ СТРОК среза,
  разрез заводится формой с корзинами и владельцем уровней, прогон пишет поимённый состав
  (СС-Д1, СС-Д2, СС-Д3, СС-Д6).
  Волна 5 (27.08.2026) упразднила слово «мера»: единственное имя измеряющей записи —
  показатель (СС-57); поведение не тронуто, поле строки среза meas → inds.
  Волна 6 (27.08.2026) довела объект «Кредит» до ПОЛНОГО состава показателей по правилу
  ADR-0183: показателем становится величина, которую спрашивают о МНОЖЕСТВЕ, — 28 строчных
  и 33 агрегата (было 6 и 7), реестр модуля 37 → 85 записей, прочитаны все пять швов ядра.
  Ступени срока неплатежа заведены КОРЗИНОЙ разреза, а не семью показателями (ADR-0176 §3),
  и оба тождества ТЗ 18 §5.1 — остаток = просрочено + срочно, свод = сумма семи статей —
  держатся в зеркале ядра по построению, а не подгонкой демо-данных (проверка #64).
  Волна 7 (27.08.2026) тем же правилом довела объект «Заёмщик»: 20 строчных показателей и
  16 агрегатов вместо трёх и двух, 13 разрезов вместо шести, реестр модуля 85 → 116 записей.
  Источник у всех — ПОРТФЕЛЬНЫЙ шов ядра (ADR-0174, ADR-0184): шов одного кредита
  показателем заёмщика быть не может, иначе свод считался бы второй раз и вне ядра — форма
  дефекта E2E-09 (ИС-28). Клетка суммы теперь несёт СОСТАВ ПО ВАЛЮТАМ: у договора он из
  одной части, у портфеля — из скольких угодно, и сомового эквивалента в строке нет
  по-прежнему (ИС-15, проверка #71). Подгруппа платёжеспособности заведена ОДНИМ разрезом с
  двумя уровнями (группа = первая цифра подгруппы, ADR-0185 §1), свёрнутая величина носит
  своё имя — «Худшая категория», а не «Категория риска» (§2), агрегат стал обязательным у
  числа и суммы и запрещённым у перечисления и булева (§3, ИС-29, проверка #73). Счёт
  объектов другого уровня — вопрос ТОМУ объекту, а не функция `count distinct` здесь
  (ADR-0186, ИС-30, проверка #76). Ведущий куратор ВЫЧИСЛЯЕТСЯ швом кураторства, хранимого
  «ведущего подразделения» не бывает вовсе (ТЗ 16 §3.2, §11, проверка #75).
  Волна 8 (27.08.2026) довела объект «Залог»: 11 строчных показателей и 12 агрегатов
  вместо двух и трёх, 11 разрезов вместо шести. Единственный шовный показатель предмета
  читал `calcDebt` — шов ОДНОГО кредита, — а предмет обеспечивает много кредитов долями:
  требование либо задваивалось по каждому предмету, либо отвечало об одном кредите из
  нескольких. Форма дефекта та же, что ИС-28 запретила заёмщику, но владелец у вопроса
  ДРУГОЙ: множество выбирает junction ОТНЕСЕНИЕ_ЗАЛОГА, долю в нём знает только залог —
  и потому портфельный шов здесь залоговый, а не ядра (ADR-0190 §1, ИС-31). Обеспечиваемые
  требования взвешены долей предмета в обеспечении кредита, и потому их сумма по предметам
  сходится с суммой под риском обеспеченных кредитов, а не удваивает её (проверка #79).
  Обеспеченность заведена у КРЕДИТА и двумя показателями — обеспечение и сумма под риском
  (ADR-0011: остаток ОД плюс неосвоенная часть); самого индекса в строке нет, отношение
  считается при чтении (ИС-32, проверка #82). Порог — функция состава: 120 % ликвидному,
  150 % и доля ликвида ≥ 80 % движимому неликвидному (Р-1, разрезы «состояние
  обеспеченности» и «требуемый порог»). Периодичность обследования — матрица «группа
  платёжеспособности × движимое/недвижимое» (Р-3), банкрот — по договору со
  спецадминистратором. У предмета своя валюта оценки (ADR-0009) и своя дата принятия:
  «валютой договора» и «датой залогового договора» вещь не режется — после перезалога
  договоров у неё много (ИС-21, проверка #81).
  Смоук: `node scripts/inspect/statistics-check.mjs`.
  Канон логики — `mockups/statistics/ASUBK-statistika-logika.md` (шесть сущностей, реестр

  РЕШЕНИЯ, НА КОТОРЫХ СТОИТ МОДУЛЬ
  ADR-0145 статистика — датированные срезы, а не второй калькулятор; граница по глаголу;
  ADR-0146 порядок слоёв ядро → классификация → статистика, стрелка одна, обратной нет;
  ADR-0147 атом хранения — строка объекта на дату; агрегатов не хранится ни одного;
  ADR-0148 защёлка одна — месяц, закрытый человеком; день и неделя — кэш без актора;
  ADR-0149 объект статистики — запись реестра, а не ветка кода;
  ADR-0150 показатель объявляет источник и не несёт формулы;
  ADR-0151 сумма — в валюте договора с курсом; потоки — нарастающим итогом;
  ADR-0152 три шва по вопросу, паспорт ответа обязателен, роли — до группировки.
  ADR-0176 разрез несёт уровни и корзины; родитель считается, а не складывается из детей;
  ADR-0177 обратный индекс ссылок потребителей — вторая хранимая вещь модуля;
  ADR-0178 statRows двоичен: полный список или отказ с числом; сверка целиком — выгрузкой;
  ADR-0179 многозначность разреза означает нижележащий объект; реестр — восемь объектов;
  ADR-0180 фильтр вопроса — ДНФ без скобок: наборы через ИЛИ, сравнения через И;
  ADR-0183 показателем становится клетка шва, которую спрашивают о множестве; величина
           об одном объекте остаётся в ядре, матрица величин целиком — сечение;
  ADR-0184 показатель заёмщика приходит ПОРТФЕЛЬНЫМ швом; клетка суммы несёт состав по
           валютам, у разновалютного портфеля одного числа нет вовсе;
  ADR-0185 подгруппа — один разрез с двумя уровнями; свёртка носит своё имя; агрегат
           обязателен числу и сумме и запрещён перечислению и булеву;
  ADR-0186 счёт объектов другого уровня — вопрос ТОМУ объекту; `count distinct` не заводится;
  ADR-0190 портфельный вопрос принадлежит владельцу МНОЖЕСТВА: залоговые швы держит залог,
           а отношение двух величин показателем не бывает — в срез входят обе.
  Поверх: ADR-0135 (пять швов ядра), ADR-0124 (вычислитель один), ADR-0120 (реестр
  показателей), ADR-0123 (фиксация записью), ADR-0113 (препятствия закрытия периода).

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (ИС-1…ИС-32)
  ИС-1  Ни одна величина по одному объекту здесь не выводится — только берётся швом ядра
        (ADR-0145 §2, ADR-0135 §1). Второй вывод суммы — это E2E-09.
  ИС-2  Строку среза пишет только прогон; экрана и операции правки строки нет.
  ИС-3  Хранимых агрегатов нет ни одного: всякий счётчик и всякая сумма — группировка строк.
  ИС-4  Значения разрезов лежат В СТРОКЕ, а не резолвятся при чтении (ADR-0147 §3).
  ИС-5  Классификация не читает статистику ни в одной форме — кольцо ТЗ (ADR-0146 §2).
  ИС-6  В записи показателя нет поля формулы (ADR-0150).
  ИС-7  Показателя вне реестра не существует ни для кого.
  ИС-8  Зафиксированный период не перезаписывается ничем и никем (ADR-0148 §5).
  ИС-9  Защёлка одна — закрытие учётного периода человеком; у фиксации есть фамилия.
  ИС-10 Всякий ответ несёт дату расчёта, признак фиксации и область видимости.
  ИС-11 Расхождение зафиксированного с сегодняшним пересчётом показывается явно.
  ИС-12 Дата, на которую нет строк, не подменяется молча — возраст называется.
  ИС-13 Ролевые правила применяются к строкам ДО группировки (ADR-0152 §3).
  ИС-14 statRows сходится со списком реестра объектов один в один.
  ИС-15 Сомовый эквивалент, доли и дельты не хранятся — это представление.
  ИС-16 Сумма отдаётся в валюте договора, с курсом и датой курса (ADR-0135 §7).
  ИС-17 Потоки хранятся нарастающим итогом, период — разность двух строк.
  ИС-18 Объект статистики — запись реестра, а не ветка кода (ADR-0149).
  ИС-19 Заёмщик — свой объект со своей строкой, а не свёртка кредитов.
  ИС-20 Статистика не запирает учётный период (ADR-0113).
  ИС-21 Если значений разреза у объекта много — это не разрез, а нижележащий объект
        (ADR-0179 §1). Разрез отвечает на «в каком множестве строка», и строка в двух
        множествах сразу не бывает.
  ИС-22 Усечения и страниц у ответа нет: список отдаётся целиком либо не отдаётся вовсе;
        уровень иерархии спрашивается в границах объявленных (ADR-0178 §1, ADR-0176 §4).
  ИС-23 Свободной корзины не бывает: набор объявлен записью разреза, новая заводится
        строкой реестра, а не приходит в запросе (ADR-0176 §2).
  ИС-24 Форм паспорта ровно две — полная и краткая, и обе объявляет производитель ответа.
  ИС-25 Вывод показателя не запрещается чужой публикацией, но обязан назвать поимённо,
        что сломается (ADR-0177 §4).
  ИС-26 Дата на срезе выражается числом дней от даты среза: показателя типа «дата» не
        бывает — среднюю дату сложить не из чего (ADR-0183 §4).
  ИС-27 Показателем именуется клетка шва, которую спрашивают о множестве; матрица величин
        целиком — сечение, а не набор показателей (ADR-0183 §1–§2).
  ИС-28 Показатель заёмщика берётся ПОРТФЕЛЬНЫМ швом; шов одного кредита показателем
        заёмщика не бывает (ADR-0184) — иначе свод считается второй раз и вне ядра.
  ИС-29 У числа и суммы агрегат обязателен, у перечисления и булева запрещён (ADR-0185 §3).
  ИС-30 Счёт объектов другого уровня — вопрос ТОМУ объекту, а не функция здесь (ADR-0186).
  ИС-31 Портфельный шов принадлежит владельцу МНОЖЕСТВА: если множество выбирает чужой
        junction, шов держит его владелец, а не расчётное ядро (ADR-0190 §1).
  ИС-32 Отношение двух величин показателем не бывает: в срез входят числитель и
        знаменатель, отношение считается при чтении (ADR-0190 §3, ИС-15).

  ДЕМО ПОКРЫВАЕТ: восемь объектов на одном движке (кредит и заёмщик — непохожая пара:
  разные разрезы, разные показатели, разное множество) · прогон, пропуск ночи с причиной и
  внеплановый ручной пересчёт с актором · закрытие мая и июня человеком и отказ прогона
  писать в закрытое · расхождение зафиксированного мая с сегодняшним пересчётом (есть
  корректировка, учтена в июле) · запрос на дату без строк — отдаётся ближайшая предыдущая
  с названным возрастом · разновалютный итог, называющий состав, и курсовую разницу
  разностью двух срезов · период произвольным интервалом как разность двух нарастающих
  итогов и названную базу периода, когда строки на начало интервала нет · историчный
  разрез: смена куратора сегодня не переписывает майскую строку · роль аналитика, режущую
  множество до группировки, и отказ «всего по холдингу» · заёмщика без действующих
  кредитов, который при свёртке исчез бы · отказ завести показатель с формулой · отказ
  классификации читать шов статистики · сходимость детализации со списком реестра ·
  ряд, у которого даты — часть вопроса (шаг месяц или квартал, 4/6/8 точек, последняя всегда
  дата среза) · фильтр конструктором: значения берутся из строк на дату среза, у разреза-даты
  — корзинами, а не сырой датой, и сужение названо словами в паспорте · форма заведения
  разреза, которая спрашивает число значений на объект, корзины списком и ВЛАДЕЛЬЦА уровней,
  но не даёт напечатать иерархию руками · поимённый состав прогона в журнале ·
  дерево уровней (дивизион → филиал из справочника кадров; область → район из полей) с
  колонкой «своих», где кредит без района остаётся у области и не исчезает · корзины дат
  (год · квартал · месяц) и отказ спросить разрез-дату без корзины · отказ завести
  многозначный разрез — с указанием, каким объектом он должен стать · двоичный отказ
  statRows с названным числом строк и двумя дорогами: задание на выгрузку с паспортом
  внутри файла и список в реестре владельца на сегодня · краткий паспорт под числом плитки
  и полный по действию · обратный индекс ссылок потребителей, публикация и переиздание
  редакции без ссылок · снятие показателя с поимённым списком того, что сломается.

  ГРАНИЦЫ МАКЕТА: ядро (пять швов ADR-0135) и множества соседей взяты зеркалом и здесь не
  редактируются; закрытие учётного периода — чужое действие, на экране журнала оно
  смоделировано кнопкой, помеченной как зеркало (своей кнопки «зафиксировать статистику» у
  модуля нет и не будет — ADR-0148, отвергнутое). Унаследованные РЯ-Д1 (версия графика
  резолвится «на сегодня») и РЯ-Д2 (курс из плоской таблицы) чинятся в ядре: срез честно
  записывает то, что шов отдал, и об их неточности не знает. Порог показа строк (здесь 12)
  — параметр эксплуатации, а не модели: в бою он другой, и модель от этого не меняется.
  Выгрузка оформляется заданием, но файл не формируется — очередь показана, чтобы видеть,
  что паспорт едет ВНУТРИ файла. Разрезы «по видам документа» и «по важности документа»
  (ТЗ №19, №20) отложены до модуля документооборота — заводятся строками реестра.

  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:290px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.sidebar-foot{ padding:12px 16px; border-top:1px solid var(--border-default);
  font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-muted); }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; max-width:1140px; }
.view{ display:none; } .view.active{ display:block; }

/* ---- headings, notes ---- */
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.page-lead{ font:var(--font-label); color:var(--text-muted); margin:2px 0 16px; max-width:900px; }
.note{ font:var(--font-label); color:var(--text-muted); margin:8px 0 0; max-width:900px; }
.note code, .page-lead code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); }

/* ---- banners ---- */
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }

/* ---- pills ---- */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

/* ---- tables ---- */
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); color:var(--text-muted); }
/* Нижний уровень дерева: тише по имени, но НЕ серее по числам — это не «выпавшая»
   строка, а такой же ответ, только мельче зерном. */
table.cgrid tbody tr.lvl td:first-child{ color:var(--text-muted); }
/* Заголовок группы внутри таблицы: реестр читается по объектам, а не одним полотном. */
table.cgrid tbody tr.grp td{ background:var(--surface-panel); color:var(--text-body);
  border-bottom:1px solid var(--border-default); padding:8px 12px; }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }

/* ---- cards ---- */
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.cols{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.side{ flex:0 0 260px; } .body{ flex:1; min-width:460px; }
.meta{ font:var(--font-label); color:var(--text-muted); margin:0 0 10px; }
.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:190px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ height:var(--control-h); border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }
.facts .f.annul{ text-decoration:line-through; color:var(--text-placeholder); }
.frozen{ background:var(--asubk-gray-50); }

/* ---- toast ---- */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
/* ---- паспорт ответа (ADR-0152 §2) ---- */
.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:150px; }
.pass.warn{ border-left-color:var(--asubk-amber); }
.pass.fixed{ border-left-color:var(--asubk-green); }

/* ---- конструктор среза ---- */
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
/* Подпись блока внутри самой ленты: блоки объявлены полем grp записи показателя, поэтому
   разметка их не перечисляет — она печатает то, что пришло из реестра. */
.chips-grp{ flex-basis:100%; margin:8px 0 -1px; font:var(--font-label); font-weight:var(--weight-medium);
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; font-size:11px; }
.chips-grp:first-child{ margin-top:0; }
/* Строк среза по кредиту 28 колонок — таблица едет вбок внутри карточки, а не тянет страницу. */
.tscroll{ overflow-x:auto; }
.tscroll table{ min-width:100%; width:max-content; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; cursor:pointer;
  border:1px solid var(--border-default); border-radius:var(--radius-pill);
  background:var(--surface-card); font:var(--font-label); color:var(--text-body); }
.chip:hover{ background:var(--surface-hover); }
.chip.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-link);
  font-weight:var(--weight-medium); }
.chip.off{ opacity:.45; cursor:not-allowed; }
.pickbar{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
.pickbar > div{ min-width:220px; }
.pickbar h4{ margin:0 0 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:.05em; }
table.cgrid td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cgrid td.num button{ background:none; border:none; padding:0; cursor:pointer; color:var(--text-link);
  font:var(--font-label); font-variant-numeric:tabular-nums; text-decoration:underline dotted; }
table.cgrid tfoot td{ padding:9px 12px; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }

/* ---- ряд (statSeries) ---- */
.spark{ display:flex; align-items:flex-end; gap:10px; height:120px; margin:10px 0 4px; }
.spark .bar{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
.spark .bar i{ width:100%; background:var(--asubk-blue-tint); border-top:2px solid var(--asubk-blue); display:block; }
.spark .bar.fixed i{ background:var(--asubk-green-tint); border-top-color:var(--asubk-green); }
.spark .bar span{ font:var(--weight-regular) 11px/1.2 var(--asubk-font); color:var(--text-muted); }

        <span><label>Роль</label><select id="role" onchange="ST.setRole(this.value)"></select></span>

<script>
/* =====================================================================
 *  МОДУЛЬ «СТАТИСТИКА» — исполняемый прототип
 *  Слои файла: даты → реестры (объекты, показатели, разрезы) → мир соседей →
 *  ядро (швы ADR-0135) → состояние и прогон → фиксация → три шва → операции → экраны.
 *
 *  Главное, что этот файл доказывает исполнением: сборщик строк не знает ни одного
 *  слова предметной области. buildRow/readDim/readInd работают с ЗАПИСЯМИ реестров —
 *  девятый объект заводится строкой в OBJECTS, а не веткой в коде (ИС-18, ADR-0149).
 * ===================================================================== */
const ST = {};

/* ------------------------------ ДАТЫ ------------------------------- */
const MON = {'01':'январь','02':'февраль','03':'март','04':'апрель','05':'май','06':'июнь',
  '07':'июль','08':'август','09':'сентябрь','10':'октябрь','11':'ноябрь','12':'декабрь'};
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const ym  = iso => iso.slice(0,7);
const first = m => m+'-01';
const monLabel = m => m ? MON[m.slice(5,7)]+' '+m.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const nextM = m => { let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const prevM = m => { let [y,mm]=m.split('-').map(Number); mm--; if(mm<1){mm=12;y--;} return y+'-'+String(mm).padStart(2,'0'); };
const monthEnd = m => { const n = nextM(m); const d = new Date(Date.parse(first(n)) - 86400000); return d.toISOString().slice(0,10); };
const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };
const ageWord = d => d === 0 ? 'сегодня' : d + ' ' + plural(d,'день','дня','дней') + ' назад';

/* -------------------------- РОЛИ И ФУНКЦИИ -------------------------- */
const ROLES = ['Администратор статистики','Аналитик','Наблюдатель'];

/* Закрытый список агрегатных функций (ADR-0150 §2). Расширяется решением, а не
   вкусом автора отчёта: функция вне списка — это формула, а формулы здесь нет. */
const AGG_FNS = {
  count: {name:'количество', apply: vals => vals.length},
  sum:   {name:'сумма',      apply: vals => vals.reduce((s,v) => s+v, 0)},
  avg:   {name:'среднее',    apply: vals => vals.length ? vals.reduce((s,v) => s+v,0)/vals.length : 0},
  min:   {name:'минимум',    apply: vals => vals.length ? Math.min.apply(null, vals) : 0},
  max:   {name:'максимум',   apply: vals => vals.length ? Math.max.apply(null, vals) : 0}
};

/* Швов три, каждый назван вопросом. Четвёртого нет: «дай всё» — не вопрос (ADR-0152). */
const SEAMS = ['statSlice','statSeries','statRows'];

/* Кто вправе спрашивать. Классификация в списке есть и читать НЕ вправе — это ИС-5:
   кольцо ТЗ разрезано порядком слоёв, а не порядком запуска (ADR-0146 §2). */
const CONSUMERS = [
  {module:'кредиты',       may:['statSlice','statRows']},
  {module:'заёмщики',      may:['statSlice','statRows']},
  {module:'взыскание',     may:['statSlice','statRows']},
  {module:'кураторство',   may:['statSlice','statRows']},
  {module:'ведомство',     may:['statSlice','statSeries']},
  {module:'отчётность',    may:['statSlice','statSeries','statRows']},
  {module:'анализ',        may:['statSeries','statRows']},
  {module:'классификация', may:[], why:'классификация статистику не читает ни в одной форме: '+
    'слой ниже (ИС-5, ADR-0146 §2)'}
];

/* ------------------------ РЕЕСТР РАЗРЕЗОВ --------------------------- *
   Разрез объявляет, ОТКУДА берётся его значение на дату. Значение ляжет в строку
   и больше не будет резолвиться никогда (ИС-4, ADR-0147 §3).                     */
const DIMS = [
  /* Иерархический разрез несёт СВОИ уровни, и берутся они у владельца справочника
     (ADR-0176 §7): второй экземпляр иерархии — второй ответ на «сколько районов в
     области». Родитель либо лежит в данных владельца уровнем, либо доспрашивается
     его же справочником (источник уровня «справочник»). */
  {id:'d-branch',    name:'Подразделение',     src:'история', key:'branch',  since:'2020-01-01',
   owner:'Оргструктура (кадры)', ref:'org',
   levels:[{name:'дивизион', src:'справочник'}, {name:'филиал', src:'история', key:'branch'}]},
  {id:'d-curator',   name:'Куратор',           src:'история', key:'curator', since:'2020-01-01'},
  {id:'d-category',  name:'Категория риска',   src:'шов', seam:'riskCategory', field:'category',
   since:'2020-01-01', note:'шов классификации (ADR-0124); статистика её не выводит'},

   Плоская таблица — зеркало РЯ-Д2 ядра. Шов помечает ответ dated:false; строка
   честно записывает то, что шов отдал, и о неточности не знает (границы макета). */
const RATES = {
  KGS: [['2020-01-01', 1]],
  USD: [['2026-05-31', 87.45], ['2026-06-30', 87.20], ['2026-07-31', 87.90], ['2026-08-10', 88.05],
        ['2026-08-18', 88.30]],
  EUR: [['2026-05-31', 94.80], ['2026-06-30', 94.10], ['2026-07-31', 95.60], ['2026-08-10', 95.95],
        ['2026-08-18', 96.40]]
};
function valueOn(hist, dateISO){
  if(!hist || !hist.length) return null;
  let out = null;
  for(const [from, v] of hist) if(from <= dateISO) out = v;
  return out;
}
function rateOn(cur, dateISO){
  const list = RATES[cur] || RATES.KGS;
  let hit = list[0];
  for(const r of list) if(r[0] <= dateISO) hit = r;
  return {rate: hit[1], rateDate: hit[0], dated: cur === 'KGS'};
}

   ничего, а статистика порядок сравнения не изобретает. */
const RISK_RANK = ['Низкий кредитный риск', 'Средний кредитный риск', 'Высокий кредитный риск',

/* Залоговый коэффициент вида — справочник ВЛАДЕЛЬЦА (залог, §2 канона; демо-значения).
   Класс ликвидности здесь не дублируется: он лежит в REF.collkind и оттуда же берётся
   верхним уровнем разреза «вид обеспечения» — один источник на обе роли. */
const COLL_K = {'недвижимость':0.7, 'транспорт':0.5, 'техника':0.5,
                'оборудование':0.5, 'товары в обороте':0.4};
/* Периодичность ОБСЛЕДОВАНИЯ — матрица «группа платёжеспособности × движимое/недвижимое»
   (Положение №22, Прил.2 §2.3, Р-3), а не свойство вида: чем хуже платит должник, тем чаще
   смотрят на вещь. Демо-значения — регламент конкретных сроков не задаёт. Переоценка этой
   матрицей НЕ управляется (§8): интервал у неё внутренний, помечен «вне положения». */
const SURVEY_MATRIX = {'1':{'недвижимое':365,'движимое':180}, '2':{'недвижимое':180,'движимое':90},
                       '3':{'недвижимое':90, 'движимое':60},  '4':{'недвижимое':60, 'движимое':30},
                       '5':{'недвижимое':30, 'движимое':30}};
/* Шаги банкротства — ступени ПОДГРУППЫ у владельца (ADR-0017); здесь только зеркалятся.
   Банкрот → контроль по договору со спецадминистратором, авто-просрочка не поднимается. */
const BANKRUPT_SUBGROUPS = ['3.1','3.2'];

const CORE = {
  calls: 0,
  grow(item, field, dateISO){
    const spec = (item.k || {})[field];
    if(!spec) return null;
    const [base, per30] = spec;
    const v = base + per30 * (daysBetween(ANCHOR, dateISO) / 30);
    return Math.round(Math.max(field === 'daysOverdue' ? 0 : 0, v) * 100) / 100;
  },
  cell(item, value, dateISO){
    const cur = item.f.cur || 'KGS';
    const r = rateOn(cur, dateISO);
    /* Состав из одной части — тот же состав: правило клетки одно на все объекты и
       различается только мощностью множества (ADR-0184 §3). */
    return {value, cur, rate: r.rate, rateDate: r.rateDate, dated: r.dated,
            parts: [{cur, value, rate: r.rate, rateDate: r.rateDate}], mixed: false};
  },
  money(item, field, dateISO){ return CORE.cell(item, CORE.grow(item, field, dateISO), dateISO); },
  /* Раскладка долга по семи статьям. Зеркало держит НЕ семь независимых чисел, а функцию
     от тех же коэффициентов: тождества ядра «остаток = просрочено + срочно» и «свод =
     сумма статей» обязаны держаться ПО ПОСТРОЕНИЮ. Иначе сторож проверял бы аккуратность
     набора демонстрационных данных, а не движок (ТЗ 18 §5.1, ADR-0150 §3). */
  debtParts(item, dateISO){
    const r2 = x => Math.round(x * 100) / 100;
    const P = CORE.grow(item, 'principal', dateISO) || 0;
    const A = CORE.grow(item, 'interest', dateISO) || 0;
    const d = Math.round(CORE.grow(item, 'daysOverdue', dateISO) || 0);
    const amt = item.f.amount || 0;
    const rest = {
      collection:  d > 180 ? r2(amt * 0.004) : 0,
      charges:     r2(amt * 0.001),
      principal:   r2(P),
      accInterest: d > 0 ? r2(A * 0.20) : 0,
      interest:    r2(A * 0.45),
      accPenalty:  d > 90 ? r2(P * 0.00008 * d) : 0,
      penalty:     d > 0 ? r2(P * 0.00020 * d) : 0
    };
    /* Срочная часть НЕ выводится отдельной формулой: она разность. Тождество тогда не
       сверяется, а соблюдается — ровно то, чего E2E-09 не сделал в легаси. */
    const over = {
      collection:  rest.collection,
      charges:     d > 0 ? rest.charges : 0,
      principal:   d > 0 ? r2(rest.principal * Math.min(1, d / 360)) : 0,
      accInterest: rest.accInterest,
      interest:    d > 0 ? r2(rest.interest * Math.min(1, d / 90)) : 0,
      accPenalty:  rest.accPenalty,
      penalty:     rest.penalty
    };
    const total   = r2(ARTICLES.reduce((s, a) => s + rest[a], 0));
    const overdue = r2(ARTICLES.reduce((s, a) => s + over[a], 0));
    return {rest, over, total, overdue, current: r2(total - overdue), days: d,
      disputed:   Math.round(CORE.grow(item, 'disputedDays', dateISO) || 0),
      writtenOff: d > 180 ? r2(amt * 0.002 * ((d - 180) / 30)) : 0,
      overpaid:   r2(CORE.grow(item, 'overpaid', dateISO) || 0)};
  },
  daysToDue(dateISO, due){
    const y = Number(dateISO.slice(0,4)), m = Number(dateISO.slice(5,7)), d = Number(dateISO.slice(8,10));
    if(d < due) return due - d;
    return new Date(Date.UTC(y, m, 0)).getUTCDate() - d + due;
  },
  /* --- ADR-0135 §4: пять дверей ядра --- */
  calcDebt(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    const out = {
      daysOverdue:  {value: p.days},
      disputedDays: {value: p.disputed},
      total:      CORE.cell(item, p.total,      dateISO),
      overdue:    CORE.cell(item, p.overdue,    dateISO),
      current:    CORE.cell(item, p.current,    dateISO),
      writtenOff: CORE.cell(item, p.writtenOff, dateISO),
      overpaid:   CORE.cell(item, p.overpaid,   dateISO)
    };
    ARTICLES.forEach(a => {
      out[a] = CORE.cell(item, p.rest[a], dateISO);
      out['over_' + a] = CORE.cell(item, p.over[a], dateISO);
    });
    return out;
  },
  calcAccrual(item, dateISO){ CORE.calls++; return {interest: CORE.money(item, 'interest', dateISO)}; },
  calcAllocation(item, dateISO){
    CORE.calls++;
    return {issuedTotal: CORE.money(item, 'issuedTotal', dateISO),
            repaidTotal: CORE.money(item, 'repaidTotal', dateISO)};
  },
  /* График и прогноз отвечают ДНЯМИ от даты вопроса, а не датой: среднюю дату сложить
     не из чего, а «в среднем 12 дней до платежа» — осмысленный итог портфеля (ИС-26). */
  calcSchedule(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    /* День платежа — число месяца из даты договора: у каждого договора он свой, поэтому
       «минимум дней до платежа» по портфелю — осмысленный вопрос, а не константа. */
    const due = Math.min(28, Number((item.f.cdate || '2020-01-15').slice(8, 10)) || 15);
    const plan = Math.round((item.f.amount || 0) * 0.031 * 100) / 100;
    return {version: {value: 'действующая на ' + dateISO},
            nextAmount: CORE.cell(item, Math.min(plan, p.total), dateISO),
            nextInDays: {value: CORE.daysToDue(dateISO, due)}};
  },
  calcForecast(item, dateISO){
    CORE.calls++;
    const p = CORE.debtParts(item, dateISO);
    const per30 = ((item.k || {}).principal || [0, 0])[1];
    const pace = per30 < 0 ? -per30 : 0;
    /* Полное погашение считается по СВОДУ, а не по телу: остаток в 1 755 сом при нулевом
       теле — это и есть осиротевшая копейка E2E-13/14, и прогноз обязан её видеть. */
    return {expected: CORE.cell(item, p.rest.principal, dateISO),
            fullInDays: {value: pace > 0 ? Math.round(p.total / pace * 30) : null}};
  },
  /* --- Портфельный вопрос (ADR-0174, шестой шов): ядро отвечает о МНОЖЕСТВЕ договоров,
     а не о заёмщике. Множество приходит СНАРУЖИ — здесь его отдаёт зеркало владельца по
     ИНН. Статистика этот перебор не делает и делать не вправе: сложи она строки кредитов
     сама, свод считался бы второй раз и вне ядра — форма E2E-09 (ИС-28). --- */
  creditsOf(inn){ return (WORLD['obj-credit'] || []).filter(c => c.f.inn === inn); },
  /* Клетка суммы несёт СОСТАВ по валютам (ADR-0184 §3). Одна валюта — состав из одной
     части и обычный ответ; несколько — value молчит, а состав говорит: доллары с сомами
     в одно число не складываются (ADR-0151 §4). Сомового эквивалента в клетке нет и
     здесь: он произведение при показе (ИС-15) и берётся из этих же частей. */
  portfolioCell(list, dateISO, get){
    const by = {};
    list.forEach(c => { const cur = c.f.cur || 'KGS';
      by[cur] = Math.round(((by[cur] || 0) + (get(c) || 0)) * 100) / 100; });
    const parts = Object.keys(by).sort().map(cur => {
      const r = rateOn(cur, dateISO);
      return {cur, value: by[cur], rate: r.rate, rateDate: r.rateDate};
    });
    const one = parts.length === 1 ? parts[0] : null;
    return {value: one ? one.value : null, cur: one ? one.cur : null,
            rate: one ? one.rate : null, rateDate: one ? one.rateDate : null,
            parts, mixed: parts.length > 1, dated: !one || one.cur === 'KGS'};
  },
  calcPortfolio(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    const stateOf = c => valueOn(c.h.status, dateISO);
    const live = all.filter(c => stateOf(c) === 'действующий');
    const closed = all.filter(c => stateOf(c) === 'погашен');
    const P = c => CORE.debtParts(c, dateISO);
    /* Свод берётся по ВСЕМ договорам, включая закрытые. Закрытый договор с ненулевым
       остатком — это осиротевшая копейка E2E-13/14; портфель обязан её видеть, а не
       прятать закрытием. Считать «нолём, потому что закрыт» — значит повторить дефект. */
    const cell = get => CORE.portfolioCell(all, dateISO, get);
    const days = all.map(c => P(c).days);
    const dues = live.map(c => CORE.daysToDue(dateISO,
      Math.min(28, Number((c.f.cdate || '2020-01-15').slice(8, 10)) || 15)));
    const dates = all.map(c => c.f.cdate).filter(Boolean).sort();
    const curs = [];
    all.forEach(c => { const u = c.f.cur || 'KGS'; if(curs.indexOf(u) < 0) curs.push(u); });
    return {
      total:      cell(c => P(c).total),
      overdue:    cell(c => P(c).overdue),
      current:    cell(c => P(c).current),
      principal:  cell(c => P(c).rest.principal),
      issuedTotal:cell(c => CORE.grow(c, 'issuedTotal', dateISO)),
      repaidTotal:cell(c => CORE.grow(c, 'repaidTotal', dateISO)),
      accrued:    cell(c => CORE.grow(c, 'interest', dateISO)),
      writtenOff: cell(c => P(c).writtenOff),
      credits:        {value: live.length},
      overdueCredits: {value: all.filter(c => P(c).days > 0).length},
      closedCredits:  {value: closed.length},
      /* У заёмщика без договоров худшей просрочки НЕТ — это не ноль дней. Ноль сказал бы
         «платит вовремя» о том, кому нечего платить, и посадил бы его в ступень «0 дн.». */
      worstDays:  {value: days.length ? Math.max.apply(null, days) : null},
      nextInDays: {value: dues.length ? Math.min.apply(null, dues) : null},
      /* Дата первого договора отдаётся И датой (её режет разрез корзиной год/квартал),
         И числом дней (его складывает агрегат): показателем дата не бывает — ИС-26. */
      firstDate:  {value: dates.length ? dates[0] : null},
      tenureDays: {value: dates.length ? daysBetween(dates[0], dateISO) : null},
      state:      {value: all.length ? (live.length ? 'действующий' : 'весь портфель погашен')
                                     : 'без договоров'},
      curLabel:   {value: curs.length ? (curs.length > 1 ? 'разновалютный' : curs[0]) : null}
    };
  },
  /* Шов кураторства (ТЗ 16 §11, ИУ-14): ВЕДУЩИМ считается куратор договора с наибольшим
     остатком основного долга. Не поле заёмщика: «Заёмщик — не объект закрепления», и
     хранимого «ведущего подразделения» не бывает вовсе (ТЗ 16 §3.2, P18-R16).
     Остатки разных валют сравниваются по курсу на дату вопроса — решение владельца шва,
     а не статистики; открытым вопросом записано в §15 спеки. */
  leadCurator(item, dateISO){
    CORE.calls++;
    const all = CORE.creditsOf(item.id);
    let best = null, bestSom = -1;
    all.slice().sort((a, b) => (a.f.cdate || '') < (b.f.cdate || '') ? -1 : 1).forEach(c => {
      const som = (CORE.debtParts(c, dateISO).rest.principal || 0) * rateOn(c.f.cur || 'KGS', dateISO).rate;
      if(som > bestSom){ bestSom = som; best = c; }
    });
    return {curator: {value: best ? valueOn(best.h.curator, dateISO) : null},
            branch:  {value: best ? valueOn(best.h.branch,  dateISO) : null},
            by:      {value: best ? best.id : null}};
  },
  /* Шов классификации (ADR-0124): категория приходит готовой, здесь её не выводят.
     У КРЕДИТА она своя. У ЗАЁМЩИКА собственной категории не бывает: она свёртка «худшая
     из категорий его договоров» (ADR-0125), и потому носит СВОЁ имя — «Худшая
     категория», а не «Категория риска» (ADR-0185 §2). Подгруппа — зеркало владельца:
     она принадлежит ИНН, а группа есть первая цифра подгруппы, и второй записи для
     группы не заводится (ADR-0012, ADR-0185 §1). */
  riskCategory(item, dateISO){
    CORE.calls++;
    if(item.h && item.h.category) return {category: {value: valueOn(item.h.category, dateISO)}};
    const cats = CORE.creditsOf(item.id).map(c => valueOn(c.h.category, dateISO)).filter(Boolean);
    let worst = null;
    cats.forEach(c => { if(worst == null || RISK_RANK.indexOf(c) > RISK_RANK.indexOf(worst)) worst = c; });
    return {category: {value: worst},
            subgroup: {value: valueOn((item.h || {}).subgroup, dateISO)}};
  },
  /* --- Залоговые швы (волна 8). Владелец — модуль ЗАЛОГА, не расчётное ядро: множество
     обеспечиваемых кредитов выбирает junction ОТНЕСЕНИЕ_ЗАЛОГА, и долю в нём знает только
     залог (ADR-0190 §1, ИС-31). Величины по ОДНОМУ кредиту залог берёт у ядра сам — тем же
     `debtParts`; статистика по-прежнему не складывает ничего (ИС-1). --- */
  pledgeValueOf(item){
    const k = COLL_K[item.f.kind];
    if(k == null) return null;
    const base = Math.round((item.f.value || 0) * k * 100) / 100;
    /* Фактическая залоговая правится ТОЛЬКО вниз (Р-19): вверх — это переоценка, событие. */
    return item.f.override != null ? Math.min(item.f.override, base) : base;
  },
  allocOf(item, dateISO){
    return (item.f.alloc || []).filter(a => a.from <= dateISO && (!a.till || a.till > dateISO));
  },
  shareOf(item, creditId, dateISO){
    return CORE.allocOf(item, dateISO).filter(a => a.credit === creditId)
      .reduce((s, a) => s + a.share, 0);
  },
  itemsOf(creditId, dateISO){
    return (WORLD['obj-collateral'] || [])
      .filter(z => CORE.allocOf(z, dateISO).some(a => a.credit === creditId));
  },
  securedOf(creditId, dateISO){
    return CORE.itemsOf(creditId, dateISO)
      .reduce((s, z) => s + CORE.shareOf(z, creditId, dateISO), 0);
  },
  /* Сумма под риском (ADR-0011) = остаток ОД + НЕОСВОЕННАЯ часть. Не сумма договора:
     погашенное обеспечивать нечем, а невыбранный лимит обеспечивать обязаны заранее. */
  riskOf(credit, dateISO){
    const p = CORE.debtParts(credit, dateISO).rest.principal;
    const undrawn = Math.max(0, (credit.f.amount || 0) - (CORE.grow(credit, 'issuedTotal', dateISO) || 0));
    return Math.round((p + undrawn) * 100) / 100;
  },
  calcPledge(item, dateISO){
    CORE.calls++;
    const al = CORE.allocOf(item, dateISO);
    const pv = CORE.pledgeValueOf(item);
    const allocated = Math.round(al.reduce((s, a) => s + a.share, 0) * 100) / 100;
    const creds = [], deals = [];
    al.forEach(a => {
      const c = (WORLD['obj-credit'] || []).find(x => x.id === a.credit);
      if(c && creds.indexOf(c) < 0) creds.push(c);
      if(deals.indexOf(a.deal) < 0) deals.push(a.deal);
    });
    /* Вес предмета в кредите = его доля ÷ ВСЁ отнесённое по этому кредиту. Веса предметов
       одного кредита дают единицу — поэтому обеспечиваемые требования, сложенные по
       предметам, равны сумме под риском обеспеченных кредитов, а не считают её дважды.
       Прежняя запись показателя читала calcDebt — шов ОДНОГО кредита — и делала ровно
       это: у предмета с двумя кредитами отвечала об одном, у двух предметов одного
       кредита повторяла его требование дважды (СС-73). */
    const weight = c => { const tot = CORE.securedOf(c.id, dateISO);
      return tot > 0 ? CORE.shareOf(item, c.id, dateISO) / tot : 0; };
    const subs = [];
    creds.forEach(c => {
      const b = (WORLD['obj-borrower'] || []).find(x => x.id === c.f.inn);
      const g = b ? valueOn(b.h.subgroup, dateISO) : null;
      if(g && subs.indexOf(g) < 0) subs.push(g);
    });
    /* Строжайшая из групп заёмщиков обеспечиваемых кредитов: залогодатель бывает третьим
       лицом, а периодичность контроля меряется по должникам (Р-3, worst-of). */
    subs.sort();
    const worst = subs.length ? subs[subs.length - 1] : null;
    const shape = item.f.kind === 'недвижимость' ? 'недвижимое' : 'движимое';
    const interval = worst ? ((SURVEY_MATRIX[worst.slice(0, 1)] || {})[shape] || null) : null;
    const since = item.f.lastSurvey ? daysBetween(item.f.lastSurvey, dateISO) : null;
    const bankrupt = worst != null && BANKRUPT_SUBGROUPS.indexOf(worst) >= 0;
    const next = (!bankrupt && since != null && interval) ? interval - since : null;
    const state = !creds.length ? 'отнесений нет'
      : bankrupt ? 'по договору со спецадминистратором'
      : since == null ? 'обследований не было'
      : next < 0 ? 'просрочен' : next <= 30 ? 'срок подошёл' : 'в срок';
    return {
      pledgeValue: CORE.cell(item, pv, dateISO),
      allocated:   CORE.cell(item, allocated, dateISO),
      available:   CORE.cell(item, pv == null ? null : Math.round((pv - allocated) * 100) / 100, dateISO),
      /* Клетка суммы несёт состав по валютам и здесь: предмет вправе обеспечивать кредиты
         в разных валютах, и одного числа у такого требования нет вовсе (ADR-0184 §3). */
      securedRisk: CORE.portfolioCell(creds, dateISO, c => CORE.riskOf(c, dateISO) * weight(c)),
      credits:     {value: creds.length},
      deals:       {value: deals.length},
      sinceSurvey: {value: since},
      nextSurveyInDays: {value: next},
      sinceReval:  {value: item.f.lastReval ? daysBetween(item.f.lastReval, dateISO) : null},
      ctlState:    {value: state},
      worstSubgroup: {value: worst}
    };
  },
  /* Обеспеченность КРЕДИТА (Р-1): порог — функция состава обеспечения, а не константа
     120 %. Самого индекса шов не отдаёт и отдавать не должен: в срез входят числитель и
     знаменатель, отношение считается при чтении (ИС-15, ИС-32). Здесь он выводится ради
     СОСТОЯНИЯ — величины перечислимой, которой режут, а не складывают. */
  calcCoverage(item, dateISO){
    CORE.calls++;
    const items = CORE.itemsOf(item.id, dateISO);
    const share = z => CORE.shareOf(z, item.id, dateISO);
    const liq = items.filter(z => ((REF.collkind || {}).parent || {})[z.f.kind] === 'ликвидный');
    const secured = CORE.portfolioCell(items, dateISO, share);
    const liqCell = CORE.portfolioCell(liq, dateISO, share);
    const risk = CORE.riskOf(item, dateISO);
    const req = !items.length ? null : (liq.length === items.length ? 120 : 150);
    /* Обеспечение и требование могут быть в разных валютах — тогда индекс существует только
       относительно курса, и состояние честно об этом говорит, а не считает (§15 спеки). */
    const same = items.length && !secured.mixed && secured.cur === (item.f.cur || 'KGS');
    const state = !items.length ? 'без обеспечения'
      : !same ? 'обеспечение в другой валюте'
      : (secured.value || 0) < risk * req / 100 ? 'ниже порога'
      : (req === 150 && (liqCell.value || 0) < risk * 0.8) ? 'доля ликвида ниже 80 %'
      : 'обеспечен';
    return {secured, liquid: liqCell, riskSum: CORE.cell(item, risk, dateISO),
            required: {value: req == null ? null : req + ' %'}, state: {value: state}};
  },
  read(seam, item, dateISO){
    const fn = CORE[seam];
    if(typeof fn !== 'function') return null;
    return fn(item, dateISO);
  }
};
ST.coreCalls = () => CORE.calls;
ST.resetCoreCalls = () => { CORE.calls = 0; };
/* ======================= РЕЕСТРЫ: ДОСТУП ============================ */
const clone = x => JSON.parse(JSON.stringify(x));
const OBJ = id => (ST.state ? ST.state.objects : OBJECTS).find(o => o.id === id);
const IND = id => (ST.state ? ST.state.indicators : INDICATORS).find(i => i.id === id);
const DIM = id => (ST.state ? ST.state.dims : DIMS).find(d => d.id === id);
ST.OBJ = OBJ; ST.IND = IND; ST.DIM = DIM;
ST.seams = () => SEAMS.slice();
ST.aggFns = () => Object.keys(AGG_FNS);
ST.consumers = () => clone(CONSUMERS);

/* ==================== СБОРЩИК СТРОКИ СРЕЗА ==========================
 *  НИ ОДНОГО СЛОВА ПРЕДМЕТНОЙ ОБЛАСТИ НИЖЕ. Всё, что сборщик знает, он берёт
 *  из записей реестров: разрез объявляет источник, показатель объявляет источник,
 *  объект перечисляет то и другое. Шестой объект стоит одной строки данных.
 *  Смоук проверяет это буквально — по тексту функций (ИС-18).
 * =================================================================== */
function readDim(dimId, item, dateISO){
  const d = DIM(dimId);
  if(!d) return null;
  if(d.since > dateISO) return null;                       /* разрез действует вперёд */
  return d.levels ? readPath(d, item, dateISO) : readSrc(d, item, dateISO);
}
/* Один читатель на все случаи: разрез, уровень разреза и показатель-«поле» берут значение
   одинаково — записью, а не веткой (ИС-18). */
function readSrc(spec, item, dateISO){
  if(!spec) return null;
  if(spec.src === 'история') return valueOn(item.h[spec.key], dateISO);
  if(spec.src === 'поле')    return item.f[spec.key] == null ? null : item.f[spec.key];
  if(spec.src === 'шов'){
    const a = CORE.read(spec.seam, item, dateISO);
    return a && a[spec.field] ? a[spec.field].value : null;
  }
  return null;
}
/* Иерархический разрез кладёт в строку ПУТЬ, а не листовое значение: иначе родитель
   пришлось бы доспрашивать сегодняшним справочником — и строка от 31.05 поехала бы
   вслед за сегодняшним переподчинением (ИС-4). Верхние уровни с источником «справочник»
   берутся у владельца (ADR-0176 §7). Путь обрывается на первом пустом уровне: объект
   без нижнего уровня остаётся у родителя и не исчезает (ADR-0176 §5). */
function readPath(d, item, dateISO){
  const vals = d.levels.map(L => L.src === 'справочник' ? null : readSrc(L, item, dateISO));
  for(let i = d.levels.length - 2; i >= 0; i--){
    if(d.levels[i].src === 'справочник'){
      const below = vals[i+1];
      vals[i] = below == null ? null : (((REF[d.ref] || {}).parent || {})[below] || null);
    }
  }
  const path = [];
  for(const v of vals){ if(v == null) break; path.push(v); }
  return path.length ? path : null;
}
function readInd(indId, item, dateISO){
  const m = IND(indId);
  if(!m || m.src === 'агрегат') return null;               /* агрегат в строке не лежит — ИС-3 */
  if(m.src === 'поле'){
    const v = item.f[m.key];
    if(v == null) return null;
    if(!m.money) return {v};
    const r = rateOn(item.f.cur || 'KGS', dateISO);
    return {v, cur: item.f.cur || 'KGS', rate: r.rate, rateDate: r.rateDate};
  }
  if(m.src === 'шов'){
    const a = CORE.read(m.seam, item, dateISO);
    const cell = a && a[m.field];
    if(!cell) return null;
    /* Разновалютная клетка молчит значением и говорит составом: у неё value пуст, а
       части есть — и она НЕ пустая (ADR-0184 §3). Пустой её считает только отсутствие
       и того и другого. */
    if(cell.value == null && !(cell.parts && cell.parts.length)) return null;
    if(!m.money) return cell.value == null ? null : {v: cell.value};
    return {v: cell.value, cur: cell.cur, rate: cell.rate, rateDate: cell.rateDate,
            parts: cell.parts, mixed: !!cell.mixed};
  }
  return null;
}
function buildRow(objId, item, dateISO){
  const o = OBJ(objId);
  const dims = {}, inds = {};
  o.dims.forEach(id => { const v = readDim(id, item, dateISO); if(v != null) dims[id] = v; });
  o.inds.forEach(id => { const c = readInd(id, item, dateISO); if(c) inds[id] = c; });
  return {obj: objId, ref: item.id, date: dateISO, dims, inds, fixed: null, by: 'прогон'};
}
ST.readDim = readDim; ST.readInd = readInd; ST.buildRow = buildRow;
/* Корзина — функция от СОХРАНЁННОГО значения, применяемая при чтении (ADR-0176 §3):
   строка хранит дату как есть, поэтому смена набора корзин прошлое не переписывает
   и ИС-4 не задет. Свободной корзины не бывает — набор объявлен записью разреза. */
const QN = ['I','II','III','IV'];
function bucketOf(v, bucket, spec){
  if(v == null) return null;
  /* Границы — данные записи, а не ветка функции: новый набор ступеней заводится строкой. */
  if(spec && spec.edges){
    const n = Number(v), e = spec.edges, u = spec.unit ? ' ' + spec.unit : '';
    if(n < e[0]) return (e[0] - 1) + u;
    for(let i = 0; i < e.length - 1; i++) if(n < e[i+1]) return e[i] + '–' + (e[i+1] - 1) + u;
    return e[e.length - 1] + '+' + u;
  }
  const t = String(v);
  if(bucket === 'год')     return t.slice(0,4);
  if(bucket === 'квартал') return t.slice(0,4)+' · '+QN[Math.floor((Number(t.slice(5,7))-1)/3)]+' кв.';
  if(bucket === 'месяц')   return monLabel(t.slice(0,7));
  return t;
}
/* Ключ группы: у иерархии — путь до запрошенного уровня, у корзины — корзина. */
function dimKey(d, val, q){
  if(val == null) return null;
  if(d && d.levels){
    const lvl = (q && q.levels && q.levels[d.id]) || d.levels.length;
    const path = (Array.isArray(val) ? val : [val]).slice(0, lvl);
    return path.length ? path.join(' / ') : null;
  }
  if(d && d.buckets) return bucketOf(val, q && q.buckets && q.buckets[d.id], d);
  return String(val);
}
ST.bucketOf = bucketOf;
/* Форма строки закрыта: ни сомового эквивалента, ни долей, ни дельт, ни агрегатов
   (ИС-3, ИС-15) — всё это считается при показе из того, что лежит здесь. */
ST.ROW_SHAPE = ['obj','ref','date','dims','inds','fixed','by'];

/* ========================= ПРОГОН И ФИКСАЦИЯ ======================== */
function doRun(st, dateISO, kind, actor, reason){
  let written = 0;
  /* Состав прогона пишется поимённо: «строк — 46» не говорит, какое множество не
     доехало. Объект, у которого владелец отдал ноль, обязан быть виден строкой с
     нулём, а не отсутствием строки (СС-Д6). */
  const parts = [];
  st.objects.forEach(o => {
    let n = 0, kept = 0;
    (WORLD[o.id] || []).forEach(item => {
      const row = buildRow(o.id, item, dateISO);
      const i = st.rows.findIndex(r => r.obj === o.id && r.ref === item.id && r.date === dateISO);
      if(i >= 0){ if(st.rows[i].fixed){ kept++; return; } st.rows[i] = row; } else st.rows.push(row);
      n++; written++;
    });
    parts.push({obj: o.id, name: o.name, n, kept});
  });
  st.runs.push({date: dateISO, kind, at: st.today, actor, reason, written, parts});
  return written;
}
function fixMonth(st, month, who, atISO){
  let n = 0;
  st.rows.forEach(r => { if(ym(r.date) === month && !r.fixed){ r.fixed = {period: month, at: atISO, by: who}; n++; } });
  return n;
}
