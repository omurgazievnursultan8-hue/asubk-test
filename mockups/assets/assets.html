<title>Имущество Фонда · АСУБК</title>
<!--
  АСУБК · модуль «Имущество Фонда» · исполняемый макет TO-BE.
  Источник истины — mockups/assets/ASUBK-imushchestvo-logika.md (канон), язык — CONTEXT.md
  «## Имущество Фонда». Четыре входа по ИМ-25: Предложения · Объекты имущества · Договоры
  купли-продажи · Настройки.

  Слои скрипта: даты → справочники → seed → ДВИЖОК (производные от фактов) → операции
  (ввод факта, второй ключ) → экраны.
  Состояние предложения, позиции и объекта не хранится: каждый раз вычисляется по
  опубликованным фактам на выбранную дату (ИМ-13, ИИ-2). Кнопки «сменить статус» нет.

  Шов для смоука: window.IM (и тот же объект как window.__im). Функции движка принимают
  явные аргументы и возвращают {ok, why} — тест не зависит от вёрстки.
-->
<style>

:root{

  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong);
  --action-primary:var(--asubk-blue); --action-danger:var(--asubk-red);

/* Объект возникает только из принятой позиции актом или вводным остатком (ИИ-1). */

/* ============================ ДВИЖОК =============================== */
const live = (arr, asOf) => arr.filter(f => f.pub && f.date <= asOf);

   цена в заявлении (claimed) значения не имеет. У ПССИ и спецадминистратора — цена из документа источника. Оставление предмета залога
   за собой — только у источника «залогодатель» с предметом, по которому Залог знает торги: основание цены протокол торгов (p.value),
   отчёт не нужен. null — отчёта на дату нет. */
const voluntary = of => !!SOURCES[of.source].voluntary;

function posValue(of, p, asOf = S.asOf) { if (!voluntary(of) || retention(p, of.source)) return p.value; const r = reportOn(of, p.n, asOf); return r ? r.amount : null; }

const posVal = (of, p, asOf = S.asOf) => { const v = posValue(of, p, asOf); return v != null ? v : (p.claimed != null ? p.claimed : p.value); };
/* Оставление за собой (источник «залогодатель»): не ниже 90 % цены повторных торгов из Залога (ИМ-85). У других источников 90 % не проверяется. */
function retentionWhy(p, value, src) {
  const t = retention(p, src) && PLEDGE_TORGI[p.pledge]; if (!t) return '';
  const min = Math.round(t.price * 90) / 100;
  return value < min ? `стоимость принятия ${money(value)} ниже 90 % цены повторных торгов ${money(t.price)} по предмету залога ${p.pledge} (не ниже ${money(min)})` : '';
}
/* Срок продлён (Инструкция п. 5): пока факт действует, повод этого вида по записи не публикуется. */
const termExtActive = (owner, kind, asOf) => !!owner && live(owner.facts, asOf).some(f => f.t === 'termExt' && f.kind === kind && f.until >= asOf);
function termExtCheck(owner, d, date) {
  if (!d.kind || !SETTINGS.thr.some(t => t.id === d.kind)) return 'выберите повод, срок которого продлевается';
  if (!d.until || d.until <= date) return 'новая дата срока должна быть позже даты факта';
  return d.doc ? '' : 'укажите резолюцию курирующего заместителя Председателя Правления';
}

/* Учётная стоимость: стоимость принятия; меняется только исправлением или разделением (ИИ-4). */
function objValue(id) {
  const o = obj(id); const c = o.facts.filter(f => f.t === 'corr' && f.pub);
  return c.length ? c[c.length - 1].newValue : o.value;
}

const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
/* Сумма поровну на n частей в копейках, остаток округления — последней. */
const spread = (total, n) => { const t = Math.round(total * 100), b = Math.floor(t / n); return Array.from({ length: n }, (_, i) => (i === n - 1 ? t - b * (n - 1) : b) / 100); };
/* График рассрочки (ИМ-90): тело (цена − взнос) поровну на n платежей; проценты плоско — цена × ставка × срок в годах, поровну на n.
   С датой договора (date) первый взнос — первая строка графика, без процентов. */
function instalmentSchedule(price, down, years, n, first, rate = SETTINGS.instalment.rate.v, date = null) {
  n = Math.round(+n); if (!(n >= 1 && n <= 600) || !first) return [];
  const body = spread(+price - (+down || 0), n), pct = spread(+price * +rate / 100 * +years, n);
  const rows = body.map((a, i) => ({ date: addMonths(first, i), amount: a, interest: pct[i] }));
  return date && +down > 0 ? [{ date, amount: +down, interest: 0, down: true }, ...rows] : rows;
}

/* Договор КП на дату: тело (цена, оплачено, остаток, просрочка по телу) и проценты рассрочки (всего, уплачено); продление —
   строки графика после даты доп. соглашения заменяются его графиком (ИМ-89). */
function contractInfo(id, asOf = S.asOf) {
  const o = obj(id); const F = live(o.facts, asOf);
  const cs = F.filter(f => f.t === 'contract'); if (!cs.length) return null;
  const c = cs[cs.length - 1];
  const term = F.find(f => f.t === 'cterm' && f.contract === c.id);
  const exts = F.filter(f => f.t === 'cextend' && f.contract === c.id).sort(byDate);
  let sch = c.kind === 'inst' ? c.schedule : [{ date: c.payBy || addDays(c.date, 10), amount: c.price }];
  exts.forEach(e => { sch = [...sch.filter(s => s.date <= e.date), ...(e.schedule || [])]; });
  sch = sch.map(s => Object.assign({ interest: 0 }, s));
  const pays = F.filter(f => f.t === 'payment' && f.contract === c.id).sort((a, b) => a.date < b.date ? -1 : 1);
  let paid = 0, interestPaid = 0, completeDate = null;
  pays.forEach(p => { paid += p.amount; interestPaid += p.interest || 0; if (!completeDate && paid >= c.price - 0.005) completeDate = p.date; });
  let due = 0, cum = 0, firstUnpaid = null;
  sch.forEach(s => { cum += s.amount; if (s.date <= asOf) due = cum; if (!firstUnpaid && cum > paid + 0.005) firstUnpaid = s.date; });
  const overdue = Math.max(0, due - paid);
  const odDays = overdue > 0 && firstUnpaid && firstUnpaid < asOf ? days(firstUnpaid, asOf) : 0;
  const claims = F.filter(f => f.t === 'claim' && f.contract === c.id);
  const interestTotal = Math.round(sch.reduce((a, s) => a + s.interest, 0) * 100) / 100;
  const ext = exts[exts.length - 1];
  return { c, kind: c.kind, price: c.price, ccy: c.ccy, paid, rest: Math.max(0, c.price - paid), due, overdue, odDays,
    penalty: Math.round(overdue * (c.penalty || 0) / 100 * odDays), firstUnpaid, schedule: sch, pays, claims,
    down: c.kind === 'inst' ? c.down || 0 : 0, years: c.years || null, rate: c.rate || null,
    interestTotal, interestPaid, interestRest: Math.max(0, interestTotal - interestPaid),
    extended: ext ? { f: ext, date: ext.date, years: exts.reduce((a, e) => a + (+e.years || 0), 0), rate: ext.rate } : null,
    basis: F.find(f => f.id === c.basis) || null,
    active: !term, terminated: term || null, complete: !term && !!completeDate, completeDate };
}

/* ---------------- продажа: объявления, заявки, Комитет (ИМ-86) ---------------- */
const GONE_T = ['gift', 'loss', 'ret', 'introOut', 'split', 'terminate'];
/* Заявки на покупку с решением Комитета, итогом торгов и договором; wait — итога ещё нет (нет решения, торги без итога,
   «продать» / «торги состоялись» без договора). */
function appsOf(id, asOf = S.asOf) {
  const F = live(obj(id).facts, asOf);
  return F.filter(f => f.t === 'application').sort(byDate).map(f => {
    const dec = F.find(x => x.t === 'committee' && (x.apps || []).includes(f.id)) || null;
    const res = dec && dec.v === 'torgi' ? F.find(x => x.t === 'torgiResult' && x.committee === dec.id) || null : null;
    const base = dec && dec.v === 'sell' ? dec : res && res.v === 'sold' ? res : null;
    const ctr = base ? F.find(x => x.t === 'contract' && x.basis === base.id) || null : null;
    return { f, dec, res, ctr, wait: !dec || (dec.v === 'torgi' && !res) || (!!base && !ctr) };
  });
}
/* Объявления на дату: публикации (в объявлении и повторные), окно заявок — 30 к.д. от последней публикации, заявки.
   Действует, пока окно не кончилось или есть заявка без итога; закрывается договором, следующим объявлением, выбытием (ИИ-10). */
function announcements(id, asOf = S.asOf) {
  const F = live(obj(id).facts, asOf); const anns = F.filter(f => f.t === 'announce').sort(byDate); const apps = appsOf(id, asOf);
  const gone = F.filter(f => GONE_T.includes(f.t)).sort(byDate)[0] || null;
  return anns.map((a, i) => {
    const pubs = [...(a.pubs || []).map(p => ({ place: p.place, date: p.date })), ...F.filter(f => f.t === 'pubAdd' && f.ann === a.id).map(f => ({ place: f.place, date: f.date, fact: f.id }))]
      .filter(p => p.date && p.date <= asOf).sort(byDate);
    const lastPub = pubs.length ? pubs[pubs.length - 1].date : a.date;
    const windowEnd = addDays(lastPub, 30);
    const my = apps.filter(x => x.f.ann === a.id); const next = anns[i + 1] || null; const sold = my.find(x => x.ctr);
    const open = !sold && !next && !gone && (asOf <= windowEnd || my.some(x => x.wait));
    return { a, pubs, lastPub, windowEnd, apps: my, open, next, ctr: sold ? sold.ctr : null, gone };
  });
}
/* Основания договора КП без договора: решение Комитета «продать» или итог открытых торгов «состоялись» (ИИ-24). */
function saleBases(id, asOf = S.asOf) {
  const all = appsOf(id, asOf); const out = [];
  all.forEach(x => {
    if (x.ctr) return;
    if (x.dec && x.dec.v === 'sell') out.push({ f: x.dec, kind: 'committee', buyer: x.f.applicant, price: x.dec.price || x.f.price, terms: x.f.terms, app: x.f });
    else if (x.res && x.res.v === 'sold' && !out.some(b => b.f === x.res)) {
      const w = all.find(y => x.dec.apps.includes(y.f.id) && y.f.applicant === x.res.buyer);
      out.push({ f: x.res, kind: 'torgi', buyer: x.res.buyer, price: x.res.price, terms: w ? w.f.terms : null, app: w ? w.f : null });
    }
  });
  return out;
}
/* Преимущественное право (ИМ-92, ИМ-93): жильё — у бывшего владельца, доля в общей собственности — у сособственников.
   Открыто, пока нет письменного отказа и не истёк срок ответа; молчание до срока — отказ (refusedAt — дата срока). */
const REALTY = ['flat', 'house', 'garage', 'nonres', 'store', 'land'];
const noticeTerm = (o, date) => o.housing ? addDays(date, 30) : REALTY.includes(o.kind) ? addMonths(date, 1) : addDays(date, 10);
function preempt(id, asOf = S.asOf) {
  const o = obj(id); if (!o || !(o.housing || o.commonShare)) return null;
  const F = live(o.facts, asOf); const notice = F.filter(f => f.t === 'notice').sort(byDate).pop() || null;
  const answer = notice ? F.find(f => f.t === 'noticeAnswer' && f.date >= notice.date) || null : null;
  const until = notice ? notice.answerBy || noticeTerm(o, notice.date) : null;
  const consent = answer && answer.v === 'consent' ? answer : null;
  const refusedAt = answer ? (answer.v === 'refuse' ? answer.date : null) : until && until < asOf ? until : null;
  return { kind: o.housing ? 'housing' : 'share', open: !refusedAt, notice, answer, until, consent, refusedAt, silent: !answer && !!refusedAt };
}
function preemptWhy(pe) {
  if (pe.consent) return `${pe.kind === 'housing' ? 'бывший владелец' : 'сособственник'} согласился на выкуп ${fmt(pe.consent.date)}: продажа ему — без объявления, по решению Комитета`;
  if (!pe.notice) return pe.kind === 'housing' ? 'жильё: сначала уведомление бывшему владельцу о выкупе — до его отказа или истечения срока ответа объявление третьим лицам не открыть'
    : 'доля в общей собственности: сначала извещение сособственникам — до их отказа или истечения срока объявление третьим лицам не открыть';
  return `преимущественное право ${pe.kind === 'housing' ? 'бывшего владельца' : 'сособственников'} открыто до ${fmt(pe.until)}: объявление третьим лицам — после отказа или истечения срока ответа`;
}
/* Расходы содержания на дату в валюте объекта. */
const expensesOf = (id, asOf = S.asOf) => { const o = obj(id); return live(o.facts, asOf).filter(f => f.t === 'expense' && (f.ccy || 'KGS') === o.ccy).reduce((a, f) => a + f.amount, 0); };
/* Учётная стоимость + расходы на дату: цена объявления по умолчанию (Инструкция п. 34) и выкупная цена после погашения долга (ИМ-94). */
function buybackPrice(id, asOf = S.asOf) { return objValue(id) + expensesOf(id, asOf); }
/* Цена выкупа жилья бывшим владельцем по согласию (ИМ-92): учётная стоимость + остаток долга обязанного лица + расходы. */
function consentPrice(id, asOf = S.asOf) { return objValue(id) + debtNow(obj(id).obligor, asOf) + expensesOf(id, asOf); }
/* Остаток долга обязанного лица на дату — ответ Взыскания минус погашения из выручки всех его объектов до даты (ИМ-91). */
function debtNow(oblId, asOf = S.asOf) { if (!oblId || !obl(oblId)) return 0; const q3 = proceedsChrono(oblId, asOf).reduce((a, x) => a + x.q3, 0); return Math.max(0, r2(allocation(oblId, asOf).rest - q3)); }
/* Рассрочка (ИМ-89): не раньше minDays после перехода права и при публикациях с этой даты — pubsRep + pubsLoc в газетах,
   pubsSite на сайте Госфинхолдинга, pubsNet на интернет-площадке; предельный срок — по цене с расходами
   (price; по умолчанию учётная стоимость + расходы). extra — публикации вводимого объявления. */
const yrs = n => n + ' ' + (n % 1 ? 'года' : n % 10 === 1 && n % 100 !== 11 ? 'год' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'года' : 'лет');
const times = n => n + ' ' + ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'раза' : 'раз');
function capOf(price) {
  const c = SETTINGS.instalment.caps; const i = Math.max(0, c.findIndex(x => x.upTo == null || price < x.upTo)); const m = v => v / 1e6 + ' млн';
  const lo = i ? c[i - 1].upTo : null, hi = c[i].upTo;
  return { years: c[i].years, band: lo == null ? 'до ' + m(hi) : hi == null ? 'от ' + m(lo) : `от ${lo / 1e6} до ${m(hi)}` };
}
function instalmentRule(id, asOf = S.asOf, price = null, extra = []) {
  const cfg = SETTINGS.instalment; const st = objState(id, asOf); const since = st.transfer || null;
  const base = +price > 0 ? +price : buybackPrice(id, asOf); const cap = capOf(base);
  const out = { maxYears: cap.years, band: cap.band, base, since, pubsRep: 0, pubsLoc: 0, pubsSite: 0, pubsNet: 0, days: 0 };
  if (!since) return Object.assign(out, { ok: false, why: 'право ещё не перешло к Фонду' });
  const F = live(obj(id).facts, asOf);
  const pubs = [...F.filter(f => f.t === 'announce').flatMap(f => f.pubs || []), ...F.filter(f => f.t === 'pubAdd'), ...extra].filter(p => p.date >= since && p.date <= asOf);
  const at = i => pubs.filter(p => p.place === PUB_PLACES[i]).length, rep = at(0), loc = at(1), site = at(2), net = at(3), d = days(since, asOf);
  const why = [d < cfg.minDays.v ? `с перехода права ${fmt(since)} прошло ${d} дн., нужно не меньше ${cfg.minDays.v}` : '',
    rep < cfg.pubsRep.v ? `в республиканских газетах объявление вышло ${times(rep)} из ${cfg.pubsRep.v}` : '',
    loc < cfg.pubsLoc.v ? `в местных газетах — ${times(loc)} из ${cfg.pubsLoc.v}` : '',
    site < cfg.pubsSite.v ? `на сайте Госфинхолдинга — ${times(site)} из ${cfg.pubsSite.v}` : '',
    net < cfg.pubsNet.v ? `на интернет-площадке — ${times(net)} из ${cfg.pubsNet.v}` : ''].filter(Boolean);

/* Условия рассрочки в заявке и договоре: первый взнос, срок, правило доступности и предельный срок. */
function instWhy(id, date, d) {
  if (!(+d.down > 0)) return 'первый взнос обязателен при рассрочке';
  if (+d.down >= +d.price) return 'первый взнос должен быть меньше цены';
  if (!(+d.years > 0)) return 'укажите срок рассрочки, лет';
  const ir = instalmentRule(id, date, +d.price);
  if (!ir.ok) return 'рассрочка недоступна: ' + ir.why;
  if (+d.years > ir.maxYears) return `предельный срок рассрочки для цены ${ir.band} — ${yrs(ir.maxYears)}; ${yrs(+d.years)} не ввести`;
  return '';

/* Состояние объекта на дату — производная фактов, не поле (ИМ-13, ИИ-2). */
function objState(id, asOf = S.asOf) {

  const F = live(o.facts, asOf); const k = kindOf(o.kind);

  const rf = F.find(f => f.t === 'regRefusal' && f.final); if (rf) return { code: 'failed', label: 'принятие не состоялось', date: rf.date, reason: 'окончательный отказ регистратора' };

  else transfer = act.date;

/* ---------------- деньги: доплата (ИМ-79…ИМ-83) ---------------- */

/* Оплаты тела по действующему договору КП; у разделённого — по договорам частей, доля части — по учётной стоимости. k — доля цены. */

   Просрочку бывшего собственника проверяют на дату выплаты: действует на срок строки — строка удержана, пока просрочка длится, потом срок
   заново от её конца; кончилась до срока — срок не сдвигается. Действует на дату при невыплаченной наступившей сумме — выплата удержана.

  const t = { amount, date: r.date, distributed: r.distributed, value: r.value, to: o.alien, account: topupAccount(o.source, o.alien, of.proceedingClosed, asOf),

  const act = o && live(o.facts, asOf).find(f => f.t === 'act');
  if (!act) return dec ? dec.date : null;
  if (!kindOf(p.kind).reg) return act.date;
  const r = live(o.facts, asOf).find(f => f.t === 'reg');
  return r && r.date > act.date ? r.date : act.date;
}
/* Ожидаемая доплата нарастающим итогом (ИМ-43) — оценка, пересчитывается при каждом факте. */
function expectedTopups(ofId, asOf = S.asOf) {
  const of = offer(ofId); const debt = obl(of.obligor).debt; let rest = debt;
  const rows = of.positions.map(p => ({ p, out: posOutcome(ofId, p.n, asOf) }))
    .filter(x => x.out.code === 'accepted' || (x.out.code === 'review'))
    .map(x => ({ n: x.p.n, value: posVal(of, x.p, asOf), plan: x.out.code === 'accepted' ? planDate(of, x.p, asOf) : null, inDecision: x.out.code === 'accepted' }));
  const acc = rows.filter(r => r.inDecision).sort((a, b) => a.plan < b.plan ? -1 : a.plan > b.plan ? 1 : a.n - b.n);
  const pend = rows.filter(r => !r.inDecision).sort((a, b) => a.n - b.n);
  const out = {};
  [...acc, ...pend].forEach(r => { const used = Math.min(rest, r.value); out[r.n] = { n: r.n, plan: r.plan, before: rest, topup: r.value - used, value: r.value }; rest -= used; });
  return { debt, rows: out, order: [...acc, ...pend].map(r => r.n) };
}

/* ------------------------------ гейты ------------------------------ */
const CLOSED_WHY = {
  none: 'объект на эту дату ещё не возник', failed: 'принятие не состоялось — на учёте объекта не было',
  split: 'объект разделён — дальше живут части', removed: 'объект снят с учёта',
};
function onbookWhy(st) {
  if (CLOSED_WHY[st.code]) return CLOSED_WHY[st.code] + (st.path ? ' (' + st.path + ')' : '');
  if (st.code === 'wait') return 'право ещё не перешло: объект ждёт регистрации';
  if (st.code === 'listed') return 'действует объявление о продаже — сначала его итог';
  if (st.code === 'sold_once' || st.code === 'sold_inst') return 'действует договор купли-продажи';
  return '';
}
function canRole(t, role = S.role) { return (ROLE_OF[t] || []).includes(role); }
function gate(id, t, asOf = S.asOf) {
  const o = obj(id); if (!o) return no('нет объекта ' + id);
  const k = kindOf(o.kind), st = objState(id, asOf);
  if (o.facts.some(f => !f.pub && !f.draft && f.t === t)) return no('такой факт уже ждёт второго ключа');
  const closed = CLOSED_WHY[st.code];
  switch (t) {
    case 'reg': case 'regRefusal': case 'terminate':
      if (st.code === 'wait') return yes;
      if (closed) return no(closed);
      if (!k.reg) return no(`вид «${k.name}» не требует госрегистрации: право перешло актом ${fmt(st.transfer)}`);
      return no(`право уже перешло к Фонду ${fmt(st.transfer)}` + (t === 'terminate' ? ' — после перехода права выход только путём «возврат» по суду' : ''));
    case 'inspection':
      if (k.cls !== 'вещь') return no('у имущественного права осмотров нет');
      return closed ? no(closed) : yes;
    case 'appraisal': case 'expense': case 'encumbrance': case 'priceDecision':
      return closed ? no(closed) : yes;
    /* Продажа (ИИ-9, ИИ-10): доплата продажу не блокирует; преимущественное право закрывает объявление третьим лицам. */
    case 'announce': {
      if (closed) return no(closed);
      if (st.code === 'wait') return no('до перехода права продавать нельзя: объект ждёт регистрации');
      if (st.code === 'listed') return no('уже действует объявление — второе параллельно не открыть');
      if (st.code === 'sold_once' || st.code === 'sold_inst') return no('действует договор купли-продажи');
      const pe = preempt(id, asOf); if (pe && pe.open) return no(preemptWhy(pe));
      if (appsOf(id, asOf).some(x => !x.f.ann && x.wait)) return no('ждёт итога заявка на выкуп без объявления');
      return yes;
    }
    case 'pubAdd': {
      const a = announcements(id, asOf).pop();
      if (!a) return no('объявлений ещё не было — сначала объявление');
      if (a.ctr || a.gone || !['onbook', 'listed'].includes(st.code)) return no('повторно публикуется только последнее объявление, по которому нет договора');
      return yes;
    }
    case 'application':
      if (closed) return no(closed);
      if (st.code === 'wait') return no('до перехода права заявок нет: объект ждёт регистрации');
      if (st.code === 'sold_once' || st.code === 'sold_inst') return no('действует договор купли-продажи');
      return st.code === 'listed' ? yes : { ok: true, why: 'объявления нет — только заявка на выкуп без объявления' };
    case 'committee':
      return appsOf(id, asOf).some(x => !x.dec) ? yes : no('нет заявок без решения Комитета');
    case 'torgiResult':
      return appsOf(id, asOf).some(x => x.dec && x.dec.v === 'torgi' && !x.res) ? yes : no('нет назначенных Комитетом торгов без итога');
    case 'notice': {
      const pe = preempt(id, asOf);
      if (!pe) return no('преимущественного права нет: объект не жильё и не доля в общей собственности');
      if (closed) return no(closed);
      if (st.code === 'wait') return no('право ещё не перешло к Фонду — уведомлять о выкупе рано');
      if (pe.notice) return no(`${pe.kind === 'housing' ? 'бывший владелец уже уведомлён' : 'сособственники уже извещены'} ${fmt(pe.notice.date)}`);
      return yes;
    }
    case 'noticeAnswer': {
      const pe = preempt(id, asOf);
      if (!pe) return no('преимущественного права нет: объект не жильё и не доля в общей собственности');
      if (!pe.notice) return no('уведомления о выкупе ещё не было');
      if (pe.answer) return no('ответ уже получен ' + fmt(pe.answer.date));
      if (pe.refusedAt) return no(`срок ответа истёк ${fmt(pe.until)}: молчание — отказ`);
      return yes;
    }
    case 'contract': {
      const ci = contractInfo(id, asOf);
      if (ci && ci.active) return no('у объекта уже есть действующий договор купли-продажи');
      if (closed) return no(closed);
      return saleBases(id, asOf).length ? yes : no(CONTRACT_ONLY + ': решения «продать» или итога «торги состоялись» без договора нет');
    }
    case 'cextend': {
      const ci = contractInfo(id, asOf);
      if (!ci || !ci.active || ci.kind !== 'inst') return no('продлевается только действующая рассрочка');
      if (ci.complete) return no('договор оплачен полностью');
      if (ci.extended && ci.extended.years >= SETTINGS.instalment.maxExt.v) return no(`рассрочка уже продлена на ${yrs(ci.extended.years)} — больше нельзя`);
      return yes;
    }
    case 'payment': case 'claim': case 'cterm': {
      const ci = contractInfo(id, asOf);
      if (!ci || !ci.active) return no('нет действующего договора купли-продажи');
      if (ci.complete) return no('договор оплачен полностью');
      return yes;
    }
    /* Доплата выплачена (Возврат в Платежах): только невыплаченная сумма с наступившим основанием и без удержания (ИМ-79, ИМ-80). */
    case 'topup': { const tp = topupOf(id, asOf);
      if (!tp || !(tp.amount > 0.005)) return no(tp && tp.state === 'none' && tp.label !== TOPUP_ST.none ? tp.label : 'доплаты по объекту нет');
      if (tp.held) return no('выплата удержана: ' + tp.held.why + (tp.held.restart ? ' — срок выплаты пойдёт заново, когда просрочки не будет' : ' — выплатить можно, когда просрочки не будет'));
      if (tp.unpaid > 0.005) return yes;
      return no(tp.state === 'fixed' ? 'выручки ещё нет — доплата зафиксирована, к выплате после поступления выручки' : tp.done ? 'доплата выплачена полностью' : 'к выплате на эту дату ничего нет: следующая доля — после очередной оплаты по договору'); }
    case 'split':
      if (!k.div) return no(`вид «${k.name}» неделимый — разделения нет`);
      return st.code === 'onbook' ? yes : no(onbookWhy(st));
    case 'gift':
      return st.code === 'onbook' ? yes : no(st.code === 'wait' ? 'до перехода права вещь Фонду не принадлежит' : onbookWhy(st));
    case 'loss':
      if (st.code === 'wait') return no('до перехода права путь «выбытие» недоступен: вещь Фонду ещё не принадлежит — решение о прекращении принятия с причиной «вещь погибла или утрачена до перехода права»');
      if (st.code === 'listed') return { ok: true, why: LISTED_CLOSE };
      return st.code === 'onbook' ? yes : no(onbookWhy(st));
    case 'ret':
      if (st.code === 'sold_once' || st.code === 'sold_inst' || (st.code === 'removed' && (st.pathId === 'once' || st.pathId === 'inst'))) return no(RETURN_SOLD);
      if (st.code === 'wait') return no('право ещё не перешло — возврата нет; выход до перехода права — прекращение принятия');
      if (st.code === 'listed') return { ok: true, why: LISTED_CLOSE };
      return st.code === 'onbook' ? yes : no(onbookWhy(st));
    case 'corr':
      return st.code === 'none' ? no('нечего исправлять: опубликованного акта на эту дату нет') : yes;
    case 'realloc':
      return reallocNeeded(id, asOf) ? yes : no('пересчитывать нечего: более раннее принятие этого обязанного лица не отменялось');
    case 'claimPaid': case 'claimStop':
      return (claimOf(id, asOf) || {}).open ? yes : no('открытого требования к отчуждателю нет');
  }
  return yes;
}

/* --------------------------- ввод фактов --------------------------- */
function objCheck(id, t, d, date) {
  const o = obj(id); const act = o && o.facts.find(f => f.t === 'act' && f.pub);
  /* Регистрация бывает раньше акта: право переходит на позднюю из двух дат (§4.2) — гейт считается на дату акта. */
  const g = gate(id, t, t === 'reg' && act && act.date > date ? act.date : date); if (!g.ok) return g.why;
  const need = (...ks) => { const m = ks.find(k => d[k] == null || d[k] === ''); return m ? 'не заполнено обязательное поле' : ''; };
  switch (t) {
    case 'reg': return need('doc');
    case 'regRefusal': return need('doc');
    case 'terminate':
      if (!d.reason) return 'причина прекращения принятия обязательна';
      if (d.reason === TERM_REASONS[3] && !d.note) return 'для причины «иное» нужно пояснение';
      return need('doc');
    case 'inspection': return need('who', 'cond', 'doc');
    case 'appraisal': return +d.amount > 0 ? need('appraiser', 'doc') : 'сумма оценки должна быть больше нуля';
    case 'expense':
      if (!(+d.amount > 0)) return 'сумма расхода должна быть больше нуля';
      if (d.item === 'Иное' && !String(d.note || '').trim()) return 'для статьи «Иное» нужно пояснение';
      if (d.item === 'Страхование' && !d.committeeDoc) return 'для страхования нужен документ решения Комитета о согласовании';
      return need('item', 'doc');
    case 'termExt': return termExtCheck(o, d, date);
    case 'encumbrance': if (!d.from || !d.to || d.to < d.from) return 'нужны даты «с» и «по»'; return need('kind', 'doc');
    case 'priceDecision': return +d.amount > 0 ? need('doc') : 'укажите новую цену объявления';
    /* Объявление (ИМ-86, ИМ-53, ИМ-92, ИИ-17): цена по умолчанию — учётная стоимость + расходы; ниже — только с основанием. */
    case 'announce': {
      if (!(+d.price > 0)) return 'укажите цену объявления';
      if (!TERMS[d.terms]) return 'укажите условия: разово, в рассрочку или то и другое';
      const pubs = d.pubs || [];
      if (!pubs.length) return 'нужна хотя бы одна публикация: площадка и дата';
      if (pubs.some(p => !PUB_PLACES.includes(p.place) || !p.date)) return 'у каждой публикации — площадка из списка и дата';
      if (pubs.some(p => p.date < date)) return 'публикация не раньше даты объявления';
      const b = d.basis ? o.facts.find(f => f.id === d.basis && f.pub && f.date <= date && (f.t === 'appraisal' || f.t === 'priceDecision')) : null;
      if (d.basis && !b) return 'основание цены не найдено: нужен опубликованный отчёт оценщика или решение Комитета о цене';
      const pe = preempt(id, date), def = buybackPrice(id, date), prev = announcements(id, date).pop();
      if (pe && pe.kind === 'housing' && pe.refusedAt) {
        if (!b) return 'жильё после отказа бывшего владельца продаётся по цене оценщика — основанием цены нужен отчёт оценщика';
        if (b.t !== 'appraisal' && !announcements(id, date).some(x => x.a.date >= pe.refusedAt)) return 'первое объявление жилья после отказа бывшего владельца — по цене оценщика: основанием цены нужен отчёт оценщика, а не решение Комитета';
      }
      if (b && +d.price < b.amount - 0.005) return `цена ${money(+d.price, o.ccy)} ниже основания (${money(b.amount, b.ccy || o.ccy)}) — снижение требует решения Комитета о цене`;
      if (!b && +d.price < def - 0.005) return `цена ниже учётной стоимости с расходами (${money(def, o.ccy)}) — основание цены обязательно: отчёт оценщика или решение Комитета о цене`;
      if (!b && prev && +d.price < prev.a.price - 0.005) return `цена ниже прошлого объявления (${money(prev.a.price, o.ccy)}) — основание цены обязательно: отчёт оценщика или решение Комитета о цене`;
      if (d.realtor) {
        if (d.markup === '' || d.markup == null || isNaN(+d.markup)) return 'укажите наценку риэлтора, %';
        if (+d.markup < 0 || +d.markup > SETTINGS.realtor.v) return `вознаграждение риэлтора — наценка к цене не больше ${SETTINGS.realtor.v} %`;
      }
      const enc = live(o.facts, date).find(f => f.t === 'encumbrance' && f.from <= date && f.to >= date);
      if (enc && !d.encMark) return `на дату объявления действует обременение «${enc.kind}» по ${fmt(enc.to)} — отметьте: продаётся с обременением или после снятия`;
      if (d.terms !== 'once') { const ir = instalmentRule(id, date, +d.price, pubs.filter(p => p.date <= date)); if (!ir.ok) return 'рассрочка в условиях недоступна: ' + ir.why; }
      return '';
    }
    case 'pubAdd':
      if (!PUB_PLACES.includes(d.place)) return 'выберите площадку публикации';
      return d.ann === (announcements(id, date).pop() || { a: {} }).a.id ? '' : 'повторно публикуется только последнее объявление';
    /* Заявка (ИМ-86, ИМ-92, ИМ-94): к действующему объявлению в его условиях или выкуп без объявления. */
    case 'application': {
      if (!d.applicant) return 'укажите заявителя';
      if (!(+d.price > 0)) return 'укажите цену заявки';
      if (d.terms !== 'once' && d.terms !== 'inst') return 'укажите условия заявки: разово или в рассрочку';
      if (d.buyback) {
        if (objState(id, date).code !== 'onbook') return 'выкуп без объявления — только для объекта «на учёте» без действующего объявления и договора';
        if (appsOf(id, date).some(x => !x.f.ann && x.wait)) return 'заявка на выкуп уже ждёт итога';
        if (d.consent) {
          const pe = preempt(id, date); if (!pe || !pe.consent) return 'согласия на выкуп нет — заявка по согласию невозможна';
          if (d.applicant !== pe.consent.who) return `заявитель по согласию — тот, кто ответил на уведомление: ${pe.consent.who}`;
          const cp = consentPrice(id, date); if (+d.price < cp - 0.005) return `цена выкупа по согласию — ${money(cp, o.ccy)}: стоимость принятия, остаток долга и расходы`;
        } else {
          const pe = preempt(id, date); if (pe && pe.open) return preemptWhy(pe);   // выкуп третьим лицом — как объявление: после отказа или истечения срока (ИИ-9)
          const ob = obl(o.obligor), dn = debtNow(o.obligor, date);
          if (ob && d.applicant === ob.name && dn > 0.005) return `заявитель — обязанное лицо: выкуп только после полного погашения долга, остаток ${money(dn)}`;
          const bp = buybackPrice(id, date); if (+d.price < bp - 0.005) return `цена выкупа не ниже ${money(bp, o.ccy)}: стоимость принятия и расходы`;
        }
      } else {
        const a = announcements(id, date).find(x => x.open && (!d.ann || x.a.id === d.ann));
        if (!a) return 'заявка принимается только к действующему объявлению';
        if (date > a.windowEnd) return `окно заявок закрылось ${fmt(a.windowEnd)}`;
        if (a.a.terms !== 'both' && d.terms !== a.a.terms) return `объявление продаёт ${TERMS[a.a.terms]} — условия заявки не те`;
        if (+d.price < a.a.price - 0.005) return `цена заявки ниже цены объявления (${money(a.a.price, o.ccy)})`;
      }
      if (d.terms === 'inst') { if (!d.fin) return 'по заявке на рассрочку нужен финансовый анализ заявителя'; const w = instWhy(id, date, d); if (w) return w; }
      return need('doc');
    }
    /* Решение Комитета (ИИ-24): «продать» — по одной заявке; две и больше по объявлению — только открытые торги. */
    case 'committee': {
      const ids = [].concat(d.apps || []); if (!ids.length) return 'выберите заявки';
      const all = appsOf(id, date); const sel = ids.map(x => all.find(y => y.f.id === x));
      if (sel.some(x => !x)) return 'заявка не найдена';
      if (sel.some(x => x.dec)) return 'по заявке уже есть решение Комитета';
      if (!COMMITTEE_V[d.v]) return 'укажите решение: продать, отказать или открытые торги';
      if (d.v === 'refuse' && !String(d.reason || '').trim()) return 'при отказе нужны причины отказа — заявителю письменный ответ';
      if (sel.some(x => date < x.f.date)) return 'решение не раньше заявки';
      if (d.v === 'refuse') return String(d.reason || '').trim() ? need('doc') : 'отказ — с причинами: заявителю уходит письменный ответ';
      const anns = [...new Set(sel.map(x => x.f.ann || ''))];
      if (anns.length > 1) return 'одно решение — по заявкам одного объявления';
      const open = all.filter(x => !x.dec && (x.f.ann || '') === anns[0]);
      if (d.v === 'sell') {
        if (sel.length !== 1) return 'решение «продать» — по одной заявке';
        if (anns[0] && open.length >= 2) return `по объявлению заявок без решения: ${open.length} — при двух и больше только открытые торги`;
        if (!(+d.price > 0)) return 'укажите цену продажи';
      }
      if (d.v === 'torgi') {
        if (!anns[0]) return 'выкуп без объявления на торги не выносится';
        if (open.length < 2) return 'открытые торги назначаются, когда заявок две и больше';
        if (sel.length !== open.length) return 'торги назначаются одним решением по всем заявкам объявления без решения';
      }
      return need('doc');
    }
    case 'torgiResult': {
      const all = appsOf(id, date); const x = all.find(y => y.dec && y.dec.id === d.committee && y.dec.v === 'torgi');
      if (!x) return 'выберите решение Комитета об открытых торгах';
      if (x.res) return 'итог этих торгов уже введён';
      if (date < x.dec.date) return 'итог торгов не раньше решения Комитета';
      if (d.v !== 'sold' && d.v !== 'failed') return 'укажите итог торгов';
      if (d.v === 'sold' && (!d.buyer || !(+d.price > 0))) return 'при состоявшихся торгах нужны победитель и цена';
      return need('doc');
    }
    case 'notice': {
      if (!NOTICE_CH.includes(d.channel)) return 'укажите канал уведомления: почта, «Тундук» или вручено лично';
      if (!d.answerBy || d.answerBy < date) return 'срок ответа не раньше даты уведомления';
      if (o.housing && d.answerBy > noticeTerm(o, date)) return `срок ответа — не больше 30 к.д. от уведомления (до ${fmt(noticeTerm(o, date))})`;
      return need('doc');
    }

  const old = g.x.f, c = [...OFFERS, ...OBJECTS].find(z => z.facts.includes(old)), i = c.facts.indexOf(old);
  c.facts.splice(i, 1);

  r.fact.id = old.id; r.fact.draft = old.draft; r.fact.withdrawn = old.withdrawn; r.fact.returned = old.returned;

/* Позиция: у добровольных источников введённая сумма — цена в заявлении (claimed), стоимость принятия даст отчёт оценщика Фонда (ИМ-84). */

  if (d.pledge) p.pledge = d.pledge;
  if (d.housing === true || d.housing === 'true' || d.housing === 'on') p.housing = true;   // жильё для постоянного проживания (ИМ-92)
  if (d.commonShare === true || d.commonShare === 'true' || d.commonShare === 'on') p.commonShare = true;   // доля в общей собственности (ИМ-93)

}
function registerOffer(d, role = S.role) {
  if (!canRole('offerNew', role)) return no('регистрирует специалист по имуществу; предложение судебного исполнителя — специалист отдела по работе с проблемными кредитами');
  if (d.source === 'pssi' && role !== 'probl') return no('предложение судебного исполнителя регистрирует специалист отдела по работе с проблемными кредитами');
  if (d.source !== 'pssi' && role !== 'spec') return no('регистрирует специалист по имуществу');
  if (d.debtKind && d.debtKind !== 'budget') return no(DEBT_KIND_OFF);
  if (!d.source || !d.obligor || !d.docNo || !d.docDate) return no('не заполнены обязательные поля');
  const withPos = !!(d.name || d.value);   // позиции можно добавить позже (ИМ-46: без позиций держит заведующий отделом)
  if (withPos && (!d.name || !(+d.value > 0))) return no('у позиции нужны вещь и стоимость принятия');
  const pos = withPos ? newPos(d.source, 1, d, d.region || 'г. Бишкек') : null;
  if (pos) { const w = retentionWhy(pos, pos.value, d.source); if (w) return no(w); }
  const set = SETTINGS.deadline[d.source];
  const deadline = d.deadline || (set.unit === 'р.д.' ? addWork(d.docDate, set.v) : addDays(d.docDate, set.v));
  const id = 'П-' + (Math.max(...OFFERS.map(o => +o.id.slice(2))) + 1);
  const o = obl(d.obligor);
  OFFERS.push({ id, source: d.source, debtKind: 'budget', obligor: d.obligor, alien: d.alien || o.name, alienKind: d.alien ? SOURCES[d.source].alien : (o.role === 'поручитель' ? 'поручитель' : 'должник'),
    doc: { no: d.docNo, date: d.docDate, file: d.file || '' }, reg: d.docDate, deadline, deadlineSrc: d.deadline ? 'документ' : `настройка (${set.v} ${set.unit}, ${set.src})`,

/* Черновик позиции правится свободно до решения органа (ИМ-23). Стоимость принятия у добровольных источников руками не правится. */
function editPosition(ofId, n, patch, role = S.role) {
  if (!canRole('posEdit', role)) return no('правит специалист по имуществу');
  const of = offer(ofId); if (of.facts.some(f => f.t === 'decision')) return no('после решения органа позиция не правится — только исправлением');
  const p = of.positions.find(x => x.n === n); if (!p) return no('нет позиции');
  patch = Object.assign({}, patch);
  if (patch.value != null) patch.value = +patch.value;
  if (patch.claimed != null) patch.claimed = +patch.claimed;
  if (voluntary(of) && !retention(p, of.source)) {
    if (patch.value != null && patch.value !== p.value && patch.value !== p.claimed) return no('стоимость принятия берётся из отчёта оценщика Фонда — руками её не правят; цена из заявления правится в поле «Цена в заявлении»');
    delete patch.value; if (patch.claimed != null) patch.value = patch.claimed;
  }
  const np = Object.assign({}, p, patch); const w = retentionWhy(np, np.value, of.source); if (w) return no(w);
  Object.assign(p, patch); return yes;
}
function addPosition(ofId, d, role = S.role) {
  if (!canRole('posAdd', role)) return no('добавляет специалист по имуществу');
  const of = offer(ofId); if (of.facts.some(f => f.t === 'decision')) return no('после решения органа позиции не добавляются');
  if (!d.name || !(+d.value > 0)) return no('нужны вещь и стоимость принятия');
  const n = of.positions.length ? Math.max(...of.positions.map(p => p.n)) + 1 : 1;
  const pos = newPos(of.source, n, d, d.region || (of.positions[0] || {}).region || 'г. Бишкек');
  const w = retentionWhy(pos, pos.value, of.source); if (w) return no(w);

}

/* --------------------------- кураторство --------------------------- */
const FALLBACK_EMP = 'Абылкасымов Д.Т. (заведующий отделом)';
/* Точка рождения закрепления: предложение — регистрация; объект — акт, вводный остаток или разделение. */
function birthOf(id, date) {
  const of = offer(id); if (of) return of.reg <= date ? of.reg : null;
  const o = obj(id); const f = o && o.facts.find(x => x.pub && ['act', 'intro', 'born'].includes(x.t));
  return f && f.date <= date ? f.date : null;
}
/* Кто ведёт — только закреплением на дату (ИИ-16). Предложение — по признакам позиции с наименьшим
   номером (ИМ-46); правило молчит — держит заведующий отделом до порога (ИМ-45). */
function curatorOf(id, date = S.asOf) {
  const a = ASSIGN.find(x => x.obj === id && x.from <= date && x.to >= date);
  if (a) return { emp: a.emp, why: a.why };
  const of = offer(id); let region = null, why;
  if (of) { const p = of.positions.slice().sort((x, y) => x.n - y.n).find(x => !['withdrawn', 'rejected'].includes(posOutcome(id, x.n, date).code));
    if (p) { region = p.region; why = `по позиции ${p.n}: ${p.region}, вид «${kindOf(p.kind).name}»`; }
    else why = of.positions.length ? 'все позиции отозваны или отказаны' : 'у предложения нет позиций'; }
  else { const o = obj(id) || {}; region = o.region; why = `по местоположению объекта: ${region}`; }
  if (region && REGION_RULE[region]) return { emp: REGION_RULE[region], why: 'по правилу подразделения, ' + why };
  const birth = birthOf(id, date); const lim = SETTINGS.fallback[of ? 'offer' : 'object'];
  const deadline = birth ? addWork(birth, lim.v) : null;
  return { emp: FALLBACK_EMP, fallback: true, since: birth, deadline, limit: lim.v, over: !!deadline && date >= deadline,
    why: (region ? `правило не называет работника (${why})` : why) + ' — держит заведующий отделом' };
}

const TRIG_NAME = {

  'pk-im-claim-open': 'Требование к отчуждателю не погашено',

const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const periodLabel = p => /^\d{4}-\d{2}$/.test(p) ? MONTHS[+p.slice(5) - 1] + ' ' + p.slice(0, 4) : /^\d{4}-\d{2}-\d{2}$/.test(p) ? fmt(p) : p;
function triggers(asOf = S.asOf) {
  const out = []; const mon = asOf.slice(0, 7);
  const add = (kind, id, period, text, to) => {
    const e = id.split(' ')[0]; if (termExtActive(offer(e) || obj(e), kind, asOf)) return;   // срок продлён — повода нет (п. 5)
    out.push({ kind, name: TRIG_NAME[kind], id, key: kind + ' · ' + id + ' · ' + period,
      keyLabel: TRIG_NAME[kind] + ' · ' + id + ' · ' + periodLabel(period), text, to }); };
  OFFERS.forEach(of => {
    const st = offerState(of.id, asOf); if (st.code === 'none') return;
    if (st.overdue) add('pk-im-offer-overdue', of.id, of.deadline, `срок ответа ${fmt(of.deadline)} истёк, ответа нет`, curatorOf(of.id, asOf).emp);
    if (of.source === 'pssi' && !live(of.facts, asOf).some(f => f.t === 'ssiMemo') && thrAfter(of.reg, 'pk-im-ssi-memo') < asOf)
      add('pk-im-ssi-memo', of.id, of.reg, `предложение зарегистрировано ${fmt(of.reg)}, записки председателю Комитета нет`, 'отдел по работе с проблемными кредитами');
    of.positions.forEach(p => { const o = posOutcome(of.id, p.n, asOf);
      if (o.code === 'accepted' && !o.act && days(o.date, asOf) > thr('pk-im-act-pending'))
        add('pk-im-act-pending', of.id + ' · поз. ' + p.n, mon, `решение «принять» ${fmt(o.date)}, акта нет ${days(o.date, asOf)} к.д.`, curatorOf(of.id, asOf).emp); });
  });
  OBJECTS.forEach(o => {
    const st = objState(o.id, asOf); const fl = flags(o.id, asOf); const k = kindOf(o.kind); const F = live(o.facts, asOf); const cur = curatorOf(o.id, asOf).emp;
    if (st.code === 'wait' && days(st.since, asOf) > thr('pk-im-registration-pending')) add('pk-im-registration-pending', o.id, mon, `ждёт регистрации ${days(st.since, asOf)} к.д.`, cur);

    /* Доплата (ИМ-79, ИМ-80): доля к выплате не выплачена дольше порога со дня поступления выручки или выплата удержана — и у проданного объекта. */
    const tp = topupOf(o.id, asOf);
    if (tp && tp.held) add('pk-im-topup-due', o.id, 'удержана с ' + fmt(tp.held.since), `выплата доплаты ${money(tp.unpaid, o.ccy)} удержана: ${tp.held.why}`, cur);
    else if (tp) { const late = tp.open.filter(w => w.dueBy && thrAfter(w.from, 'pk-im-topup-due') < asOf);
      if (late.length) add('pk-im-topup-due', o.id, 'выручка от ' + fmt(late[0].base), `доплата ${money(late.reduce((a, w) => a + w.rest, 0), o.ccy)} не выплачена (отчуждатель — ${o.alien}): ${late.length > 1 ? 'долей ' + late.length + ', первая' : 'доля'} от поступления ${fmt(late[0].base)}, срок был ${fmt(late[0].dueBy)}`, cur); }
    if (['none', 'failed', 'removed', 'split'].includes(st.code)) return;
    /* Продажа (ИМ-86, ИМ-92, ИМ-94): первое и повторное объявление, объявления без заявок, заявки без решения Комитета, уведомление о выкупе. */
    if (st.transfer && (st.code === 'onbook' || st.code === 'listed')) {
      const an = announcements(o.id, asOf), apps = appsOf(o.id, asOf), pe = preempt(o.id, asOf), buyWait = apps.some(x => !x.f.ann && x.wait);
      const who = pe && pe.kind === 'housing' ? ['бывший владелец', 'не ответил', 'отказался'] : ['сособственники', 'не ответили', 'отказались'];

        add('pk-im-buyback-notice', o.id, st.transfer, `${pe.kind === 'housing' ? 'жильё: бывшему владельцу уведомление о выкупе' : 'доля: сособственникам извещение'} не отправлено, право перешло ${fmt(st.transfer)} — ${days(st.transfer, asOf)} дн.`, cur);
      if (st.code === 'onbook' && !an.length && !buyWait && !(pe && (pe.open || pe.consent))) { const from = pe ? pe.refusedAt : st.transfer;

      const last = an[an.length - 1];
      if (st.code === 'onbook' && last && !last.open && !last.gone && !buyWait) { const ci = contractInfo(o.id, asOf);
        const closedAt = last.ctr ? (ci && ci.terminated ? ci.terminated.date : null) : [last.windowEnd, ...last.apps.map(x => (x.res || x.dec || {}).date || '')].sort().pop();
        if (closedAt && thrAfter(closedAt, 'pk-im-relist') < asOf) add('pk-im-relist', o.id, closedAt, (last.ctr ? `договор по объявлению от ${fmt(last.a.date)} расторгнут ${fmt(closedAt)}` : `окно заявок по объявлению от ${fmt(last.a.date)} закрылось ${fmt(closedAt)} без договора`) + `, нового объявления нет ${days(closedAt, asOf)} к.д.`, cur); }
      let n = 0, first = null;
      for (let i = an.length - 1; i >= 0; i--) { if (an[i].apps.length) break; if (an[i].open) continue; n++; first = an[i]; }
      if (n && n >= thr('pk-im-unsold')) add('pk-im-unsold', o.id, first.a.date, `${n} ${[2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'объявления' : 'объявлений'} подряд без единой заявки, первое — ${fmt(first.a.date)}`, cur);
      apps.filter(x => !x.dec).forEach(x => { const kind = x.f.ann ? 'pk-im-application-pending' : 'pk-im-application-pending-buyback';
        if (thrAfter(x.f.date, kind) < asOf) add(kind, o.id, `заявка ${fmt(x.f.date)} · ${x.f.applicant}`, `заявка ${x.f.applicant}${x.f.ann ? '' : ' на выкуп'} от ${fmt(x.f.date)} не вынесена на Комитет: прошло больше ${thr(kind)} р.д.`, cur); });

      if (addMonths(li, inspThr(o.kind)) < asOf) add('pk-im-no-inspection', o.id, mon, `последний осмотр ${fmt(li)}, порог вида «${k.name}» ${inspThr(o.kind)} мес.`, cur); }

  });

}

/* ---------------------- результат по объекту ----------------------- */
function result(id, asOf = S.asOf) {
  const o = obj(id); const F = live(o.facts, asOf); const st = objState(id, asOf);
  const ex = F.filter(f => f.t === 'expense');
  const exp = ex.filter(f => (f.ccy || 'KGS') === o.ccy).reduce((a, f) => a + f.amount, 0);
  const expOther = ex.filter(f => (f.ccy || 'KGS') !== o.ccy).map(f => money(f.amount, f.ccy));
  const ci = contractInfo(id, asOf); const loss = F.find(f => f.t === 'loss');
  let price = null, basis = '', priceCcy = o.ccy;
  if (ci && ci.active) { price = ci.price; priceCcy = ci.ccy || 'KGS'; basis = ci.complete ? 'цена продажи' : 'цена по договору (оплата не завершена)'; }
  else if (F.find(f => f.t === 'gift')) { price = 0; basis = 'обращение в государственную собственность'; }
  else if (loss) { price = loss.insurance || 0; priceCcy = loss.ccy || o.ccy; basis = loss.insurance ? 'страховое возмещение' : 'выбытие без возмещения'; }
  const io = F.find(f => f.t === 'introOut');
  if (io) { price = io.path === 'once' ? io.price || 0 : 0; basis = io.path === 'once' ? 'цена продажи (до запуска)' : PATH[io.path]; }
  const cl = claimOf(id, asOf); const claimLoss = cl ? cl.loss : 0;
  const value = objValue(id); const pr = proceeds(id, asOf);
  /* Модуль курсов не знает (ИИ-18): при разных валютах результат не считается. */
  const mixed = priceCcy !== o.ccy;
  /* Долг меняет только погашение из выручки (ИИ-19, ИИ-25): repaid — третья очередь по оплатам на дату. */
  return { value, ccy: o.ccy, expenses: exp, expOther, price, priceCcy, basis, mixed, claimLoss, repaid: pr ? pr.total.q3 : 0, proceeds: pr ? pr.total : null,
    result: price == null || mixed ? null : price - value - exp - claimLoss, final: st.code === 'removed' };
}

/* ------------------------- что видят соседи ------------------------ */
function neighbours(id, asOf = S.asOf) {

    const cr = obl(o.obligor).credits;
    const corr = F.filter(f => f.t === 'corr').pop();
    out.payments.push(`Поступление «имущество в счёт погашения» на ${fmt(st.transfer)}: ${money(corr ? corr.oldValue : o.value, o.ccy)} — по долям кредитов ${cr.map(c => c.no + (c.ccy !== o.ccy ? ' (' + c.ccy + ', пересчёт — Платежи по курсу на ' + fmt(st.transfer) + ')' : '')).join(', ')}.`);
    if (corr) out.payments.push(`Корректировка суммы поступления ${corr.newValue - corr.oldValue > 0 ? '+' : '−'}${money(Math.abs(corr.newValue - corr.oldValue), o.ccy)} с ${fmt(st.transfer)} — не сторно; Взыскание переделит.`);
    out.collection.push(`Распределено между кредитами ${money(al.distributed)}, не вошло ${money(al.notIncluded)}.`);
    const t = topupOf(id, asOf);
    if (t && t.amount > 0.005 && !t.returned) out.payments.push(`Возврат доплаты из республиканского бюджета → ${t.account}: к выплате ${money(t.payable, o.ccy)} (доплата ${money(t.amount, o.ccy)} − расходы ${money(t.expenses, o.ccy)}) — ${t.label}${t.paid > 0.005 ? ', выплачено ' + money(t.paid, o.ccy) : ''}${t.unpaid > 0.005 ? ', не выплачено из наступившего ' + money(t.unpaid, o.ccy) : ''}${t.held ? '; удержано: ' + t.held.why : ''}.`);
    const r = F.find(f => f.t === 'ret');
    if (r) { out.payments.push(`Сторно поступления от ${fmt(st.transfer)} задним числом; пеня за разрыв ${fmt(st.transfer)} → ${fmt(r.date)} — спорная, на Комиссию по спорным начислениям.`);
      if (t && t.paid > 0.005) out.payments.push(`Требование к отчуждателю о возврате выплаченной доплаты ${money(t.paid)} — взыскивается вне модуля.`); }
    const re = F.filter(f => f.t === 'realloc').pop();
    if (re) { out.payments.push(`Корректировка суммы поступления +${money(re.distributed - re.oldDistributed)} с ${fmt(re.date)} по исправлению распределения (отменено более раннее принятие ${re.cause.join(', ')}) — не сторно; погашение у объекта по-прежнему одно.`);
      out.collection.push(`Исправлено: распределено ${money(re.oldDistributed)} → ${money(re.distributed)}, не вошло ${money(re.oldNotIncluded)} → ${money(re.notIncluded)}.`);
      if (re.claim) out.payments.push(`Требование к отчуждателю: излишек выплаченной доплаты ${money(re.claim)} — взыскивается вне модуля.`); }
    const nd = reallocNeeded(id, asOf);
    if (nd) out.collection.push(`Деление ждёт исправления: отменено более раннее принятие ${nd.cause.join(', ')}.`);
  } else if (st.code === 'wait') out.payments.push('Погашения ещё нет: долг гасится на дату перехода права (регистрации).');
  else if (st.code === 'failed') out.payments.push('Погашения не было и сторно нет: право так и не перешло.');
  if (o.obligor && obl(o.obligor).role === 'поручитель') out.collection.push(`Гасится линия поручителя ${obl(o.obligor).name} во взыскании (заёмщик ${obl(o.obligor).borrower}), с ней — в той же сумме — долг заёмщика.`);
  const ci = contractInfo(id, asOf);
  if (ci) { out.payments.push(`Оплаты по договору КП — поступления вида «оплата по договору купли-продажи», адресат — договор: получено ${money(ci.paid, ci.ccy)}.`);
    if (ci.terminated) out.payments.push(`Расторжение: Возврат покупателю ${money(ci.terminated.refund, ci.ccy)} (уплачено ${money(ci.terminated.paid, ci.ccy)} за вычетом неустойки ${money(ci.terminated.penaltyAmt, ci.ccy)}).`);
    /* Выкуп после погашения (ИМ-94): деньги должника сверх долга — оплата объекта, не Возврат. */
    const bb = ci.active && appsOf(id, asOf).find(x => x.ctr && x.ctr.id === ci.c.id && x.f.buyback);
    if (bb && o.obligor && obl(o.obligor) && ci.c.buyer === obl(o.obligor).name) out.payments.push(`Договор выкупа с обязанным лицом ${ci.c.buyer}: хвост платежа должника в кредит сверх долга переносится на договор выкупа, не в Возврат.`); }
  /* Очередь выручки (ИМ-91): раскладка каждого поступления; погашение из выручки — Взысканию, делить как принятие. */
  const pr = proceeds(id, asOf);
  pr.rows.forEach(x => out.payments.push(`Раскладка поступления ${fmt(x.date)} · ${money(x.amount, o.ccy)}: ${['q1', 'q2', 'q3', 'q4'].filter(k => x[k] > 0.005).map(k => pr.to[k] + ' ' + money(x[k], o.ccy)).join('; ')}${x.interest > 0.005 ? `; проценты рассрочки ${money(x.interest, o.ccy)} — Госфинхолдингу отдельной статьёй, вне очереди` : ''}.`));
  if (o.obligor && obl(o.obligor)) pr.rows.filter(x => x.q3 > 0.005).forEach(x => out.collection.push(`Погашение из выручки ${o.id} ${fmt(x.date)}: ${money(x.q3, o.ccy)} — делить между кредитами ${obl(o.obligor).credits.map(c => c.no).join(', ')}, как принятие; остаток долга ${money(x.debtAfter)}.`));
  if (o.pledge) out.pledge.push(TRANSFERRED.includes(st.code) ? `Предмет залога ${o.pledge} — «перешёл к Фонду» (финал, только чтение); запрет на отчуждение снят.` : `Предмет залога ${o.pledge} — в залоге до перехода права.`);
  return out;
}
/* Журнал дела во Взыскании — проекции модуля, только чтение; продажи объекта там нет (ИМ-18). */
function caseJournal(oblId, asOf = S.asOf) {
  const rows = (CASE_MEASURES[oblId] || []).map(m => ({ date: m.date, text: m.text, own: false }));
  OFFERS.filter(o => o.obligor === oblId && o.reg <= asOf).forEach(of => {
    rows.push({ date: of.reg, text: `Предложение имущества ${of.id} зарегистрировано`, own: true });
    const dec = live(of.facts, asOf).find(f => f.t === 'decision');
    if (dec) rows.push({ date: dec.date, text: `Решение органа по ${of.id}: ` + Object.entries(dec.items).map(([n, it]) => `поз. ${n} — ${it.v === 'accept' ? 'принять' : 'отказать'}`).join(', '), own: true });
  });
  OBJECTS.filter(o => o.obligor === oblId && !o.parent && !isIntro(o)).forEach(o => {
    const F = live(o.facts, asOf); const act = F.find(f => f.t === 'act'); const st = objState(o.id, asOf);
    if (act) rows.push({ date: act.date, text: `Акт приёма-передачи ${o.id}`, own: true });
    if (TRANSFERRED.includes(st.code)) rows.push({ date: st.transfer, text: `Переход права ${o.id}, ${money(objValue(o.id), o.ccy)}`, own: true });
    if (st.code === 'failed') rows.push({ date: st.date, text: `Принятие ${o.id} не состоялось`, own: true });
    const r = F.find(f => f.t === 'ret'); if (r) rows.push({ date: r.date, text: `Принятие ${o.id} отменено судом (возврат)`, own: true });
    F.filter(f => f.t === 'realloc').forEach(f => rows.push({ date: f.date, text: `Исправлено распределение ${o.id}: ${money(f.oldDistributed)} → ${money(f.distributed)}`, own: true }));
  });
  /* Погашение из выручки — единственная продажная мера в деле (ИМ-91): третья очередь по оплатам всех объектов лица. */
  proceedsChrono(oblId, asOf).filter(x => x.q3 > 0.005).forEach(x => rows.push({ date: x.date, text: `Погашение из выручки ${x.obj}: ${money(x.q3, obj(x.obj).ccy)}`, own: true }));
  return rows.sort((a, b) => a.date < b.date ? -1 : 1);
}
/* Контроль миграции: сумма мигрированных погашений = сумма стоимостей вводных объектов (§13). */
function migrationControl() {
  return MIGRATED.map(m => { const sum = OBJECTS.filter(o => o.obligor === m.obl && isIntro(o)).reduce((a, o) => a + objValue(o.id), 0);
    return { obl: m.obl, name: obl(m.obl).name, migrated: m.sum, objects: sum, ok: Math.abs(sum - m.sum) < 0.005, demo: m.demo || '' }; });
}
function addIntro(d, role = S.role) {
  if (!canRole('intro', role)) return no('вводит специалист по имуществу');
  if (!d.name || !(+d.value > 0) || !d.transfer || !d.doc || !d.obligor) return no('не заполнены обязательные поля');
  const id = 'ИО-' + (S.objSeq++);
  OBJECTS.push({ id, offer: null, pos: null, kind: d.kind || 'nonres', name: d.name, value: +d.value, ccy: 'KGS', obligor: d.obligor, source: d.source || 'debtor',
    alien: obl(d.obligor).name, region: d.region || 'г. Бишкек', district: '—', char: {}, pledge: null,
    facts: [mkFact('intro', d.transfer, Object.assign({ transfer: d.transfer, doc: d.doc, by: role }, d.docDate ? { docDate: d.docDate } : {}, d.file ? { file: d.file } : {}))] });
  return { ok: true, why: '', id };
}

/* ---------------- миграция: черновики из легаси (ИМ-59) ---------------- */
function draftState(dr) {
  if (dr.objId) return { code: 'done', label: 'вводный объект ' + dr.objId };
  if (dr.fill && dr.pendingKey) return { code: 'pending', label: 'дополнен, ждёт второго ключа' };
  return { code: 'unconfirmed', label: 'не подтверждён' };
}
/* Дополнить черновик по документам: вид, место, что с вещью сейчас. Сумма и обязанное лицо — из платежа, не правятся. */
function fillDraft(id, d, role = S.role) {
  if (!canRole('draft', role)) return no('дополняет специалист по имуществу');
  const dr = DRAFTS.find(x => x.id === id); if (!dr) return no('нет черновика ' + id);
  if (dr.objId) return no('вводный объект уже заведён');
  if (!d.name || !d.kind || !d.region || !d.now || !d.doc) return no('не заполнено обязательное поле: вещь, вид, местоположение, что с вещью сейчас, документы');
  if (d.now !== 'onbook' && !d.outDate) return no('для проданной, переданной или выбывшей вещи нужна дата выбытия');
  if (d.now !== 'onbook' && d.outDate < dr.date) return no('выбытие не раньше даты принятия');
  dr.fill = { name: d.name, kind: d.kind, region: d.region, now: d.now, outDate: d.outDate || null, outPrice: +d.outPrice || 0, doc: d.doc, docDate: d.docDate || null, file: d.file || (dr.fill && dr.fill.file) || null }; dr.by = role; dr.pendingKey = true;
  return { ok: true, why: '', pending: true };
}
/* Второй ключ: вводный объект из черновика; проданная до запуска вещь мигрирует вместе с фактом выбытия. */
function publishDraft(id, role = S.role) {
  if (role !== 'head') return no('публикует вторым ключом заведующий Сектором по работе с активами');
  const dr = DRAFTS.find(x => x.id === id); if (!dr) return no('нет черновика ' + id);
  if (dr.objId) return no('вводный объект уже заведён');
  if (!dr.fill) return no('черновик не подтверждён документами — публиковать нечего');
  if (dr.by === role) return no('второй ключ не ставит тот, кто ввёл факт');
  const f = dr.fill; const oid = 'ИО-' + (S.objSeq++);
  const o = { id: oid, offer: null, pos: null, kind: f.kind, name: f.name, value: dr.value, ccy: 'KGS', obligor: dr.obligor, source: 'debtor', alien: obl(dr.obligor).name,
    region: f.region, district: '—', char: {}, pledge: null, draft: dr.id,
    facts: [Object.assign(mkFact('intro', dr.date, Object.assign({ transfer: dr.date, doc: dr.pay + '; ' + f.doc, by: dr.by }, f.docDate ? { docDate: f.docDate } : {}, f.file ? { file: f.file } : {})), { pub: true, pubBy: role })] };
  if (f.now !== 'onbook') o.facts.push(Object.assign(mkFact('introOut', f.outDate, { path: f.now, price: f.outPrice, doc: f.doc, by: dr.by }), { pub: true, pubBy: role }));
  OBJECTS.push(o); dr.objId = oid; dr.pendingKey = false;
  return { ok: true, why: '', id: oid };
}
/* Отчёт миграции: не подтверждённый черновик или расхождение контроля §13 блокируют миграцию. */
function migrationReport() {
  const rows = DRAFTS.map(dr => ({ dr, st: draftState(dr) })); const ctl = migrationControl();
  const why = [...rows.filter(r => r.st.code === 'unconfirmed').map(r => `${r.dr.id} не подтверждён`), ...ctl.filter(c => !c.ok).map(c => `расхождение по ${c.name}`)];
  return { rows, blocked: why.length > 0, why };
}

  <table class="cgrid" data-testid="triggers"><thead><tr><th>Повод для Заданий</th><th>Где</th><th>Что</th><th>Вид · объект · период</th><th>Кому поручение</th></tr></thead><tbody>${tr.map(t => `

function viewMigration() {

function curatorCell(id) {
  const c = curatorOf(id);
  if (!c.fallback) return esc(c.emp);
  const hint = esc(c.why + (c.since ? `; с ${fmt(c.since)}, порог ${c.limit} р.д. — до ${fmt(c.deadline)}` : ''));
  return `<span class="nw1">${esc(c.emp)} ${c.over ? `<span class="pill err" data-testid="curator-over-${esc(id)}" title="${hint}">нет дольше порога</span>`
    : `<span class="pill warn" title="${hint}">куратора нет</span>`}</span>`;
}
function factLabel(f) {
  const n = FACT_NAME[f.t] || f.t;
  switch (f.t) {
    case 'act': return n + (f.pos ? ` · позиция ${f.pos}` : '') + (f.objId ? ` → ${f.objId}` : '');
    case 'terminate': return n + (f.pos ? ` · позиция ${f.pos}` : '') + ` · ${f.reason}${f.note ? ' (' + f.note + ')' : ''}`;
    case 'withdraw': return n + ` · позиция ${f.pos}`;
    case 'concl': return `${n} · поз. ${f.pos} · ${f.kind}: ${f.text}`;
    case 'decision': return `${n} · ${f.organ}${f.late ? ' · вынесено после истечения срока ответа' : ''}`;
    case 'regRefusal': return n + (f.final ? ' · окончательный' : ' · устранимый');
    case 'appraisal': return `${n} · ${f.appraiser} · ${money(f.amount, f.ccy)}`;
    case 'expense': return `${n} · ${f.item} · ${money(f.amount, f.ccy)}`;
    case 'encumbrance': return `${n} · ${f.kind} ${fmt(f.from)}–${fmt(f.to)}`;
    case 'priceDecision': return `${n} · ${money(f.amount)}`;
    case 'announce': return `${n} · ${money(f.price)} · ${TERMS[f.terms] || ''} · публикаций ${(f.pubs || []).length}${f.realtor ? ' · риэлтор +' + f.markup + ' %' : ''}${f.encMark ? ' · ' + f.encMark : ''}`;
    case 'pubAdd': return `${n} · ${f.place}`;
    case 'application': return `${n} · ${f.applicant} · ${money(f.price)} · ${f.terms === 'inst' ? 'рассрочка ' + yrs(f.years) + ', взнос ' + money(f.down) : 'разово'}${f.buyback ? ' · выкуп без объявления' + (f.consent ? ' по согласию на уведомление' : ' после погашения долга') : ''}`;
    case 'committee': return `${n} · ${COMMITTEE_V[f.v]}${f.v === 'sell' ? ' · ' + money(f.price) : ''}${f.v === 'refuse' ? ': ' + f.reason : ''} · заявок ${(f.apps || []).length}`;
    case 'torgiResult': return `${n} · ${f.v === 'sold' ? 'состоялись: ' + f.buyer + ', ' + money(f.price) : 'не состоялись' + (f.reason ? ' (' + f.reason + ')' : '')}`;
    case 'notice': return `${n} · ${f.channel} · ответ до ${fmt(f.answerBy)}`;
    case 'noticeAnswer': return `${n} · ${f.v === 'consent' ? 'согласие' + (f.who ? ': ' + f.who : '') : 'отказ'}`;
    case 'cextend': return `${n} · на ${yrs(f.years)}, ставка с ${fmt(f.date)} — ${f.rate} %`;
    case 'claimPaid': return `${n} · ${money(f.amount)}`;
    case 'claimStop': return `${n} · остаток — потеря`;
    case 'introOut': return `${n} · ${PATH[f.path]}${f.path === 'once' && f.price ? ' · ' + money(f.price) : ''}`;
    case 'contract': return `${n} · ${f.kind === 'inst' ? `рассрочка: взнос ${money(f.down, f.ccy)} + ${f.n} пл., ${f.rate} % годовых` : 'разовый'} · ${f.buyer} · ${money(f.price, f.ccy)}`;
    case 'payment': return `${n} · ${money(f.amount)}${f.interest ? ' + проценты ' + money(f.interest) : ''}`;
    case 'topup': return `${n} · ${money(f.amount)}`;
    case 'cterm': return `${n} · неустойка ${money(f.penaltyAmt)}, Возврат ${money(f.refund)}`;
    case 'split': return `${n} · ${f.parts.join(' + ')}`;
    case 'corr': return `${n} · стоимость ${money(f.oldValue)} → ${money(f.newValue)}`;
    case 'realloc': return `${n} (${(f.cause || []).join(', ')}) · распределено ${money(f.oldDistributed)} → ${money(f.distributed)}, не вошло ${money(f.oldNotIncluded)} → ${money(f.notIncluded)}${f.claim ? ' · требование к отчуждателю ' + money(f.claim) : ''}`;
    case 'loss': return `${n} · ${f.cause}`;
  }
  return n;
}

/* --------------------- ЭКРАН: реестр предложений -------------------- */
function viewOffers() {
  const f = S.f;
  const base = OFFERS.filter(o => o.reg <= S.asOf).map(o => ({ o, st: offerState(o.id), c: offerCounts(o.id) }))
    .filter(r => (!f.oSrc || r.o.source === f.oSrc) && (!f.oState || r.st.code === f.oState)
      && (!f.oObl || r.o.obligor === f.oObl)
      && (!f.oOrgan || live(r.o.facts, S.asOf).some(x => x.t === 'decision' && x.organ === f.oOrgan))
      && (!f.oDue || (f.oDue === 'over' ? r.st.overdue : f.oDue === 'late' ? live(r.o.facts, S.asOf).some(x => x.t === 'decision' && x.late) : !r.st.overdue)));
  const rows = base.filter(r => !f.oPos || r.c[f.oPos] > 0);
  const tot = base.reduce((a, r) => { Object.keys(a).forEach(k => a[k] += r.c[k]); return a; }, { accepted: 0, rejected: 0, withdrawn: 0, failed: 0, review: 0 });
  const sel = (key, opts) => `<select onchange="IM.setF('${key}',this.value)" data-testid="f-${key}"><option value="">все</option>${opts.map(([v, l]) => `<option value="${v}"${f[key] === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  /* Плитки итогов — фильтры по итогу позиций: нажатие оставляет предложения, где такие позиции есть. */
  const chip = (k, n, l, tid) => `<button class="tile${f.oPos === k ? ' on' : ''}" aria-pressed="${f.oPos === k}" onclick="IM.setF('oPos','${f.oPos === k ? '' : k}')"><span class="n"${tid ? ` data-testid="${tid}"` : ''}>${n}</span><span class="l">${l}</span></button>`;
  const seg = c => { const n = c.accepted + c.rejected + c.withdrawn + c.failed + c.review; if (!n) return '';
    return `<div class="seg" aria-hidden="true">${[['a', c.accepted], ['r', c.rejected], ['w', c.withdrawn], ['f', c.failed], ['v', c.review]].filter(x => x[1]).map(([k, x]) => `<i class="${k}" style="width:${(x / n * 100).toFixed(1)}%"></i>`).join('')}</div>`; };
  const cnt = c => [['принято', c.accepted], ['отказано', c.rejected], ['отозвано', c.withdrawn], ['не состоялось', c.failed], ['на рассмотрении', c.review]].filter(x => x[1]).map(([l, x]) => `${x} ${l}`).join(' · ');
  return `${pendingHere(x => x.owner.startsWith('П-'))}
  <div class="filters">
    <div class="fld w2"><label>Источник</label>${sel('oSrc', Object.entries(SOURCES).map(([k, s]) => [k, s.name]))}</div>
    <div class="fld"><label>Состояние</label>${sel('oState', [['registered', 'зарегистрировано'], ['review', 'на рассмотрении'], ['decided', 'решение вынесено'], ['closed', 'закрыто']])}</div>
    <div class="fld"><label>Обязанное лицо</label>${sel('oObl', [...new Set(OFFERS.map(o => o.obligor))].map(id => [id, obl(id).name]))}</div>
    <div class="fld w2"><label>Орган</label>${sel('oOrgan', ORGANS.map(x => [x, x.length > 40 ? x.slice(0, 38) + '…' : x]))}</div>
    <div class="fld"><label>Срок ответа</label>${sel('oDue', [['over', 'истёк, ответа нет'], ['late', 'решение после срока'], ['ok', 'в порядке']])}</div>
    <div class="grow">${canRole('offerNew') ? `<button class="btn btn-primary" data-testid="offer-new" onclick="IM.uiNewOffer()">Зарегистрировать предложение</button>` : ''}</div>
  </div>
  <div class="sum" data-testid="offer-totals">
    <button class="tile${!f.oPos ? ' on' : ''}" aria-pressed="${!f.oPos}" onclick="IM.setF('oPos','')"><span class="n">${base.length}</span><span class="l">предложений</span></button>
    ${chip('accepted', tot.accepted, 'позиций принято', 'tot-accepted')}
    ${chip('rejected', tot.rejected, 'отказано решением органа', 'tot-rejected')}
    ${chip('withdrawn', tot.withdrawn, 'отозвано источником', 'tot-withdrawn')}
    ${chip('failed', tot.failed, 'принятие не состоялось', 'tot-failed')}
    ${chip('review', tot.review, 'на рассмотрении')}
  </div>
  <div class="shown" data-testid="shown-offers">Показано <b>${rows.length}</b> из <b>${OFFERS.filter(o => o.reg <= S.asOf).length}</b></div>
  <table class="cgrid sticky"><thead><tr><th>№</th><th>Источник и документ</th><th>Обязанное лицо</th><th>Срок ответа</th><th>Позиции</th><th>Состояние</th><th>Куратор на дату</th></tr></thead>
  <tbody>${rows.map(({ o, st, c }) => `<tr class="click${st.overdue ? ' over' : ''}" data-testid="offer-row-${o.id}" onclick="IM.openOffer('${o.id}')">
    <td><b>${o.id}</b></td><td>${esc(SOURCES[o.source].name)}<div class="why">${esc(o.doc.no)} от ${fmt(o.doc.date)}</div></td>
    <td>${esc(obl(o.obligor).name)}<div class="why">${esc(obl(o.obligor).role)}${o.alien !== obl(o.obligor).name ? ' · отчуждатель: ' + esc(o.alien) : ''}</div></td>
    <td class="nw"><span class="mono">${fmt(o.deadline)}</span>${st.overdue ? ` <span class="flag">${ico('flag')}истёк</span>` : ''}${st.answer ? `<div class="why">ответ ${fmt(st.answer.date)}</div>` : ''}</td>
    <td>${o.positions.length} поз.${seg(c)}<div class="why">${cnt(c) || '—'}</div></td>
    <td>${pill(st)}${st.waitingAct ? `<div class="why">ждёт акта: ${st.waitingAct}</div>` : ''}</td>
    <td>${curatorCell(o.id)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">нет предложений по условиям</td></tr>'}</tbody></table>`;
}

/* --------------------- ЭКРАН: карточка предложения ------------------ */
function viewOffer(id) {
  const of = offer(id); if (!of) return '<div class="banner danger">Нет предложения</div>';
  const st = offerState(id); const o = obl(of.obligor); const F = live(of.facts, S.asOf);
  const dec = F.find(f => f.t === 'decision'); const exp = expectedTopups(id);
  /* Действия позиции — меню, как «Ввести факт» у объекта: доступные списком, недоступные свёрнуты с причиной. */
  const posMenu = (p) => {
    const out = posOutcome(id, p.n); const items = [];
    const it = (t, label, fn, ok, why) => items.push({ t, label, fn, ok, why: why || '' });
    const roleWhy = t => canRole(t) ? '' : 'доступно роли: ' + ROLE_OF[t].map(roleName).join(', ');
    const hasDec = of.facts.some(f => f.t === 'decision');
    it('edit', 'Изменить', `IM.uiEditPos('${id}',${p.n})`, !hasDec && canRole('posEdit'), hasDec ? 'после решения органа — только исправлением' : roleWhy('posEdit'));
    if (out.code === 'review') it('concl', 'Заключение', `IM.uiFact('${id}','concl',${p.n})`, canRole('concl'), roleWhy('concl'));
    if (out.code === 'review' && voluntary(of) && !retention(p, of.source)) it('appraisal', 'Отчёт оценщика Фонда', `IM.uiFact('${id}','appraisal',${p.n})`, !hasDec && canRole('appraisal'), hasDec ? 'решение органа уже вынесено' : roleWhy('appraisal'));
    const actExists = of.facts.some(f => f.t === 'act' && f.pos === p.n && !f.draft);
    const wdWhy = actExists || out.act ? WITHDRAW_AFTER_ACT : (out.code !== 'review' && out.code !== 'accepted') ? 'у позиции уже есть итог' : roleWhy('withdraw');
    if (out.code === 'review' || out.code === 'accepted') it('withdraw', 'Отзыв источником', `IM.uiFact('${id}','withdraw',${p.n})`, !wdWhy, wdWhy);
    if (out.code === 'accepted' && !out.act) {
      it('act', 'Акт приёма-передачи', `IM.uiFact('${id}','act',${p.n})`, !actExists && canRole('act'), actExists ? 'акт ждёт второго ключа' : roleWhy('act'));
      it('terminate', 'Прекращение принятия', `IM.uiFact('${id}','terminate',${p.n})`, !actExists && canRole('terminate'), actExists ? 'акт ждёт второго ключа' : roleWhy('terminate'));
    }
    const mi = i => `<button class="mi" role="menuitem" data-testid="pos-${p.n}-${i.t}" data-why="${esc(i.why)}"${i.ok ? '' : ' disabled'} onclick="IM.closeMenus();${i.fn}">${i.label}</button>${i.why ? `<div class="mi-why">${esc(i.why)}</div>` : ''}`;
    const on = items.filter(i => i.ok), off = items.filter(i => !i.ok);
    return `<div class="menu"><button class="btn btn-secondary btn-sm" aria-haspopup="menu" aria-expanded="false" data-testid="pos-${p.n}-menu" onclick="IM.toggleMenu(event)">Действия${on.length ? ' · ' + on.length : ''}${ico('down')}</button>
      <div class="menu-pop" role="menu">${on.map(mi).join('') || '<div class="mi-why" style="padding:10px 16px">Сейчас действий нет — причины ниже.</div>'}${off.length ? `<details class="mi-off"><summary>Недоступно сейчас · ${off.length}</summary>${off.map(mi).join('')}</details>` : ''}</div></div>`;
  };
  const rows = of.positions.map(p => { const out = posOutcome(id, p.n); const e = exp.rows[p.n]; const k = kindOf(p.kind);
    return `<tr data-testid="pos-row-${p.n}"><td>${p.n}</td>
      <td><b>${esc(p.name)}</b><div class="why">${esc(k.name)} · ${esc(k.cls)}${k.reg ? ' · право подлежит госрегистрации' : ''}${p.pledge ? ' · происходит из предмета залога ' + p.pledge : ''}</div>
        ${live(of.facts, S.asOf).filter(f => f.t === 'concl' && f.pos === p.n).map(f => `<div class="why">${esc(f.kind)}: ${esc(f.text)} (${fmt(f.date)})</div>`).join('')}</td>
      <td class="num" data-testid="pos-value-${p.n}">${(() => { const v = posValue(of, p, S.asOf);
        if (!voluntary(of) || retention(p, of.source)) return money(p.value, p.ccy) + (retention(p, of.source) ? `<div class="why">по протоколу торгов; не ниже 90 % от ${money(PLEDGE_TORGI[p.pledge].price)}</div>` : '');
        const r = reportOn(of, p.n, S.asOf);

          + `<div class="why" data-testid="pos-claimed-${p.n}">в заявлении ${money(p.claimed != null ? p.claimed : p.value, p.ccy)}</div>`; })()}</td>

      <td>${out.obj ? `<button class="linky" onclick="IM.openObject('${out.obj}')">${out.obj}</button>` : '—'}</td>
      <td>${posMenu(p)}</td></tr>`; }).join('');
  return `${pendingHere(x => x.owner === id)}

  <div class="card ohead">

        ${of.source === 'pssi' && canRole('ssiMemo') && !of.facts.some(f => f.t === 'ssiMemo') ? `<button class="btn btn-secondary btn-sm" data-testid="ssi-memo-btn" onclick="IM.uiFact('${id}','ssiMemo')">Записка председателю Комитета</button>` : ''}
        ${canRole('termExt') ? `<button class="btn btn-secondary btn-sm" data-testid="term-ext-btn" onclick="IM.uiFact('${id}','termExt')">Срок продлён</button>` : ''}

      </div></div>
    <div class="oprops">
      <div><div class="k">Вид долга</div><div class="v" data-testid="offer-debt-kind">${esc(debtKindName(of.debtKind))}</div></div>

      <div><div class="k">Кому доплата</div><div class="v" data-testid="offer-topup-to">${esc(topupAccount(of.source, of.alien, of.proceedingClosed))}<div class="why">${esc(topupAccountWhy(of.source, of.proceedingClosed))}</div></div></div>

/* Меню «Ввести факт» (P24-R5): одна кнопка, доступные факты — списком по группам; недоступные свёрнуты, у каждого причина.

function actionMenu(id) {
  const groups = OBJ_ACTIONS.map(([g, ts]) => ({ g, items: ts.map(t => {

  const part = f => groups.map(({ g, items }) => ({ g, items: items.filter(f) })).filter(x => x.items.length);

function closeMenus() {
  if (typeof document === 'undefined') return;

}
function toggleMenu(ev) {
  ev.stopPropagation(); const b = ev.currentTarget; const m = b.closest('.menu'); const was = m.classList.contains('open');
  closeMenus(); if (!was) { m.classList.add('open'); b.setAttribute('aria-expanded', 'true'); }
}

/* Полоса жизни: вехи этого объекта на выбранную дату. Каждая веха — производная опубликованных фактов (ИМ-13), ничего не хранится.
   Набор вех зависит от объекта: у вводного остатка и части нет акта, у вещи без госрегистрации «право перешло» — по акту,
   у непринятого — только акт и «не состоялось». */
function lifeStrip(id) {
  const o = obj(id); const st = objState(id); const k = kindOf(o.kind); const F = live(o.facts, S.asOf);
  const one = t => F.find(f => f.t === t);
  const pend = new Set(pending().filter(x => x.owner === id).map(x => x.f.t));
  const base = one('intro') || one('born'), act = one('act');
  const ci = contractInfo(id); const an = announcements(id); const apN = appsOf(id).length;
  const B = []; const add = (lbl, sub, s, extra) => B.push(Object.assign({ lbl, sub, s }, extra));
  const waitKey = (...ts) => ts.some(t => pend.has(t));
  if (base) add(base.t === 'intro' ? 'Вводный остаток' : 'Выделен из ' + (o.parent || '—'), 'право с ' + fmt(st.transfer), 'done');
  else add('Акт приёма-передачи', act ? fmt(act.date) : waitKey('act') ? 'ждёт второго ключа' : 'не было', act ? 'done' : waitKey('act') ? 'pend' : 'off');
  if (st.code === 'failed') add('Принятие не состоялось', fmt(st.date) + (st.reason ? ' · ' + st.reason : ''), 'fail');
  else {
    if (!base) {
