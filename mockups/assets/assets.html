<title>Имущество Фонда · АСУБК</title>
<!--
  АСУБК · модуль «Имущество Фонда» · исполняемый макет TO-BE.
  Источник истины — mockups/assets/ASUBK-imushchestvo-logika.md (канон), язык — CONTEXT.md
  «## Имущество Фонда». Четыре входа по ИМ-25: Предложения · Объекты имущества · Договоры
  купли-продажи · Настройки.

  Слои скрипта: даты → справочники → seed → ДВИЖОК (производные от фактов) → операции
  (ввод факта, второй ключ) → экраны.
  Состояние предложения, позиции и объекта не хранится: каждый раз вычисляется по
  опубликованным фактам на выбранную дату (ИМ-13, ИИ-2). Кнопки «сменить статус» нет.

  Шов для смоука: window.IM (и тот же объект как window.__im). Функции движка принимают
  явные аргументы и возвращают {ok, why} — тест не зависит от вёрстки.
-->
<style>

<script>
/* =====================================================================
 *  МОДУЛЬ «ИМУЩЕСТВО ФОНДА» — исполняемый макет
 * ===================================================================== */
const IM = {};

/* ------------------------------ даты -------------------------------- */
const D        = s => new Date(s + 'T00:00:00Z');
const isoOf    = dt => dt.toISOString().slice(0, 10);
const addDays  = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const addMonths= (s, n) => { const d = D(s); d.setUTCMonth(d.getUTCMonth() + n); return isoOf(d); };
const days     = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const isWork   = s => { const w = D(s).getUTCDay(); return w !== 0 && w !== 6; };
const addWork  = (s, n) => { let c = s, k = 0; while (k < n) { c = addDays(c, 1); if (isWork(c)) k++; } return c; };
const fmt      = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '—';
const TODAY    = '2028-03-15';
/* Даты в интерфейсе — ДД.ММ.ГГГГ; внутри — ISO. Возвращает ISO, '' для пустого, null для неверной даты. */
function toIso(s) {
  s = String(s == null ? '' : s).trim(); if (!s) return '';
  let m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s), iso = null;
  if (m) iso = m[3] + '-' + m[2] + '-' + m[1]; else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) iso = s;
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === iso ? iso : null;
}
const FAR      = '9999-12-31';

/* ----------------------------- деньги ------------------------------- */
const CCY = { KGS: 'сом', USD: 'USD', EUR: 'EUR' };
const CCY_OPTS = [['KGS', 'сом (KGS)'], ['USD', 'доллар США (USD)'], ['EUR', 'евро (EUR)']];
const ccyF = (value = 'KGS') => ({ id: 'ccy', label: 'Валюта документа', type: 'select', options: CCY_OPTS, value });
function money(v, ccy = 'KGS') {
  if (v == null || isNaN(v)) return '—';
  const neg = v < 0, a = Math.abs(Math.round(v * 100)) / 100;
  const int = Math.floor(a), fr = Math.round((a - int) * 100);
  const s = String(int).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (fr ? ',' + String(fr).padStart(2, '0') : '');
  return (neg ? '−' : '') + s + ' ' + (CCY[ccy] || ccy);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const yes = { ok: true, why: '' };
const no  = why => ({ ok: false, why });

/* --------------------------- справочники ---------------------------- */
/* Вид имущества — общий справочник с Залогом (ИМ-12); модулю нужны три признака (ИМ-ДС-12). */
const KINDS = [
  { id: 'flat',   name: 'Квартира',               cls: 'вещь',  reg: true,  div: false },
  { id: 'house',  name: 'Жилой дом',              cls: 'вещь',  reg: true,  div: false },
  { id: 'garage', name: 'Гараж',                  cls: 'вещь',  reg: true,  div: false },
  { id: 'nonres', name: 'Нежилое помещение',      cls: 'вещь',  reg: true,  div: false },
  { id: 'store',  name: 'Склад',                  cls: 'вещь',  reg: true,  div: false },
  { id: 'tractor',name: 'Трактор',                cls: 'вещь',  reg: false, div: false },
  { id: 'equip',  name: 'Оборудование',           cls: 'вещь',  reg: false, div: false },
  { id: 'machine',name: 'Спецтехника',            cls: 'вещь',  reg: false, div: false },
  { id: 'grain',  name: 'Зерно',                  cls: 'вещь',  reg: false, div: true, unit: 'т' },

function createFromAct(of, act) {

/* ============================ ДВИЖОК =============================== */
const live = (arr, asOf) => arr.filter(f => f.pub && f.date <= asOf);

/* Учётная стоимость: стоимость принятия; меняется только исправлением или разделением (ИИ-4). */
function objValue(id) {
  const o = obj(id); const c = o.facts.filter(f => f.t === 'corr' && f.pub);
  return c.length ? c[c.length - 1].newValue : o.value;
}

function contractInfo(id, asOf = S.asOf) {
  const o = obj(id); const F = live(o.facts, asOf);
  const cs = F.filter(f => f.t === 'contract'); if (!cs.length) return null;
  const c = cs[cs.length - 1];
  const term = F.find(f => f.t === 'cterm' && f.contract === c.id);
  const sch = c.kind === 'inst' ? c.schedule : [{ date: c.payBy || addDays(c.date, 10), amount: c.price }];
  const pays = F.filter(f => f.t === 'payment' && f.contract === c.id).sort((a, b) => a.date < b.date ? -1 : 1);
  let paid = 0, completeDate = null;
  pays.forEach(p => { paid += p.amount; if (!completeDate && paid >= c.price - 0.005) completeDate = p.date; });
  let due = 0, cum = 0, firstUnpaid = null;
  sch.forEach(s => { cum += s.amount; if (s.date <= asOf) due = cum; if (!firstUnpaid && cum > paid + 0.005) firstUnpaid = s.date; });
  const overdue = Math.max(0, due - paid);
  const odDays = overdue > 0 && firstUnpaid && firstUnpaid < asOf ? days(firstUnpaid, asOf) : 0;
  const claims = F.filter(f => f.t === 'claim' && f.contract === c.id);
  return { c, kind: c.kind, price: c.price, ccy: c.ccy, paid, rest: Math.max(0, c.price - paid), due, overdue, odDays,
    penalty: Math.round(overdue * (c.penalty || 0) / 100 * odDays), firstUnpaid, schedule: sch, pays, claims,
    active: !term, terminated: term || null, complete: !term && !!completeDate, completeDate };
}

function attempts(id, asOf = S.asOf) {
  const o = obj(id); const F = live(o.facts, asOf);
  return F.filter(f => f.t === 'attempt').map(a => {
    const res = F.find(f => f.t === 'attemptResult' && f.attempt === a.id) || null;
    const ctr = F.find(f => f.t === 'contract' && f.attempt === a.id) || null;
    return { a, res, ctr, open: !res || (res.v === 'sold' && !ctr) };
  });
}

/* Состояние объекта на дату — производная фактов, не поле (ИМ-13, ИИ-2). */
function objState(id, asOf = S.asOf) {
  const o = obj(id); if (!o) return { code: 'none', label: '—' };
  const F = live(o.facts, asOf); const k = kindOf(o.kind);
  const one = t => F.find(f => f.t === t);
  const intro = one('intro') || one('born'), act = one('act');
  if (!intro && !act) return { code: 'none', label: 'ещё не возник' };
  const term = one('terminate'); if (term) return { code: 'failed', label: 'принятие не состоялось', date: term.date, reason: term.reason };
  const rf = F.find(f => f.t === 'regRefusal' && f.final); if (rf) return { code: 'failed', label: 'принятие не состоялось', date: rf.date, reason: 'окончательный отказ регистратора' };
  let transfer;
  if (intro) transfer = intro.transfer;
  else if (k.reg) { const r = one('reg'); if (!r) return { code: 'wait', label: 'принят, ждёт регистрации', since: act.date }; transfer = r.date; }
  else transfer = act.date;
  const sp = one('split'); if (sp) return { code: 'split', label: 'разделён', date: sp.date, transfer };
  const d = F.find(f => f.t === 'gift' || f.t === 'loss' || f.t === 'ret');
  if (d) return { code: 'removed', label: 'снят с учёта', path: PATH[d.t], pathId: d.t, date: d.date, transfer };
  const ci = contractInfo(id, asOf);
  if (ci && ci.active) {
    if (ci.complete) return { code: 'removed', label: 'снят с учёта', path: PATH[ci.kind], pathId: ci.kind, date: ci.completeDate, transfer };
    return { code: ci.kind === 'inst' ? 'sold_inst' : 'sold_once', label: ci.kind === 'inst' ? 'продан в рассрочку' : 'продан разово', transfer };
  }
  if (attempts(id, asOf).some(x => x.open)) return { code: 'listed', label: 'выставлен на продажу', transfer };
  return { code: 'onbook', label: 'на учёте', transfer };
}
const isIntro = o => o.facts.some(f => f.t === 'intro');
const TRANSFERRED = ['onbook', 'listed', 'sold_once', 'sold_inst', 'removed', 'split'];

/* Ответ Взыскания: деление по долгу, уменьшенному прежними принятиями, по очереди дат
   перехода права, при равных — по номеру позиции (ИМ-4, ИМ-43, ИМ-ДС-1). Модуль только читает. */
/* Деление считается так, как оно было опубликовано на дату перехода права каждой вещи:
   отменённое позже раннее принятие само его не меняет — поздние вещи переделяются только
   опубликованным исправлением распределения (ИМ-44, ИИ-21). rest — остаток долга без отменённых. */
function allocation(oblId, asOf = S.asOf) {
  const debt = obl(oblId).debt; const rows = [];
  OBJECTS.filter(o => o.obligor === oblId && !o.parent && !isIntro(o))
    .map(o => ({ o, st: objState(o.id, asOf) })).filter(x => TRANSFERRED.includes(x.st.code))
    .sort((a, b) => a.st.transfer < b.st.transfer ? -1 : a.st.transfer > b.st.transfer ? 1 : (a.o.offer + a.o.pos < b.o.offer + b.o.pos ? -1 : 1))
    .forEach(x => {
      const v = objValue(x.o.id); const F = live(x.o.facts, asOf);
      const ret = F.find(f => f.t === 'ret'); const re = F.filter(f => f.t === 'realloc').pop();
      let dist;
      if (re) dist = re.distributed;
      else { const restAt = debt - rows.reduce((a, e) => a + (e.returned && e.returned <= x.st.transfer ? 0 : e.distributed), 0); dist = Math.max(0, Math.min(v, restAt)); }
      rows.push({ id: x.o.id, date: x.st.transfer, value: v, distributed: dist, notIncluded: v - dist, returned: ret ? ret.date : null, corrected: re ? re.id : null });
    });
  const rest = debt - rows.reduce((a, e) => a + (e.returned ? 0 : e.distributed), 0);
  return { debt, rows, rest };
}
/* Нужен ли пересчёт поздней вещи после отмены более раннего принятия (ИМ-44). */
function reallocNeeded(id, asOf = S.asOf) {
  const o = obj(id); if (!o || isIntro(o) || o.parent) return null;
  const a = allocation(o.obligor, asOf); const i = a.rows.findIndex(r => r.id === id); if (i < 0) return null;
  const row = a.rows[i]; if (row.returned) return null;
  const earlier = a.rows.slice(0, i); const cause = earlier.filter(e => e.returned);
  if (!cause.length) return null;
  const newDist = Math.max(0, Math.min(row.value, a.debt - earlier.reduce((s_, e) => s_ + (e.returned ? 0 : e.distributed), 0)));
  if (Math.abs(newDist - row.distributed) < 0.005) return null;
  const done = live(o.facts, asOf).find(f => f.t === 'topup'); const newNot = row.value - newDist;
  return { transfer: row.date, oldDistributed: row.distributed, oldNotIncluded: row.notIncluded, distributed: newDist, notIncluded: newNot,
    claim: done ? Math.max(0, done.amount - newNot) : 0, cause: cause.map(e => e.id), causeDate: cause.map(e => e.returned).sort().pop() };
}
function topupOf(id, asOf = S.asOf) {
  const o = obj(id); if (!o || isIntro(o) || o.parent) return null;
  const r = allocation(o.obligor, asOf).rows.find(x => x.id === id); if (!r) return null;
  const done = live(o.facts, asOf).find(f => f.t === 'topup');
  return { excess: done ? Math.max(0, done.amount - r.notIncluded) : 0, amount: r.notIncluded, distributed: r.distributed, date: r.date, to: topupTo(o.source, o.alien), done: done || null };
}
const topupTo = (src, alien) => src === 'pssi' ? 'депозит ПССИ' : src === 'spec' ? 'конкурсная масса — ' + alien : alien;

function flags(id, asOf = S.asOf) {
  const o = obj(id); const st = objState(id, asOf);
  let incomplete = null;
  if (TRANSFERRED.includes(st.code) && st.code !== 'split') { const t = topupOf(id, asOf); if (t && t.amount > 0 && !t.done) incomplete = t; }

/* ------------------------------ гейты ------------------------------ */
const CLOSED_WHY = {

  if (st.code === 'listed') return 'идёт попытка продажи — сначала её итог';

      return no(`право уже перешло к Фонду ${fmt(st.transfer)}` + (t === 'terminate' ? ' — после перехода права выход только путём «возврат» по суду' : ''));

      if (st.code === 'listed') return no('идёт попытка продажи — вторую параллельно не открыть');

      return attempts(id, asOf).some(x => x.res && x.res.v === 'sold' && !x.ctr) ? yes : no('договор заключается только по состоявшейся попытке продажи');

  return no('нет такого неопубликованного факта');
}
function registerOffer(d, role = S.role) {
  if (!canRole('offerNew', role)) return no('регистрирует специалист по имуществу');
  if (!d.source || !d.obligor || !d.docNo || !d.docDate) return no('не заполнены обязательные поля');
  const withPos = !!(d.name || d.value);   // позиции можно добавить позже (ИМ-46: без позиций держит заведующий отделом)
  if (withPos && (!d.name || !(+d.value > 0))) return no('у позиции нужны вещь и стоимость принятия');
  const set = SETTINGS.deadline[d.source];
  const deadline = d.deadline || (set.unit === 'р.д.' ? addWork(d.docDate, set.v) : addDays(d.docDate, set.v));
  const id = 'П-' + (Math.max(...OFFERS.map(o => +o.id.slice(2))) + 1);
  const o = obl(d.obligor);

    doc: { no: d.docNo, date: d.docDate }, reg: d.docDate, deadline, deadlineSrc: d.deadline ? 'документ' : `настройка (${set.v} ${set.unit}, ${set.src})`,
    positions: withPos ? [{ n: 1, kind: d.kind || 'flat', name: d.name, value: +d.value, ccy: d.ccy || 'KGS', region: d.region || 'г. Бишкек', district: '—', char: {} }] : [], facts: [] });

/* Черновик позиции правится свободно до решения органа (ИМ-23). */
function editPosition(ofId, n, patch, role = S.role) {
  if (!canRole('posEdit', role)) return no('правит специалист по имуществу');
  const of = offer(ofId); if (of.facts.some(f => f.t === 'decision')) return no('после решения органа позиция не правится — только исправлением');
  const p = of.positions.find(x => x.n === n); if (!p) return no('нет позиции');

}
function addPosition(ofId, d, role = S.role) {
  if (!canRole('posAdd', role)) return no('добавляет специалист по имуществу');
  const of = offer(ofId); if (of.facts.some(f => f.t === 'decision')) return no('после решения органа позиции не добавляются');
  if (!d.name || !(+d.value > 0)) return no('нужны вещь и стоимость принятия');

  return { ok: true, why: '', n };

/* --------------------------- кураторство --------------------------- */
const FALLBACK_EMP = 'Абылкасымов Д.Т. (заведующий отделом)';
/* Точка рождения закрепления: предложение — регистрация; объект — акт, вводный остаток или разделение. */
function birthOf(id, date) {
  const of = offer(id); if (of) return of.reg <= date ? of.reg : null;
  const o = obj(id); const f = o && o.facts.find(x => x.pub && ['act', 'intro', 'born'].includes(x.t));
  return f && f.date <= date ? f.date : null;
}
/* Кто ведёт — только закреплением на дату (ИИ-16). Предложение — по признакам позиции с наименьшим
   номером (ИМ-46); правило молчит — держит заведующий отделом до порога (ИМ-45). */
function curatorOf(id, date = S.asOf) {
  const a = ASSIGN.find(x => x.obj === id && x.from <= date && x.to >= date);
  if (a) return { emp: a.emp, why: a.why };
  const of = offer(id); let region = null, why;
  if (of) { const p = of.positions.slice().sort((x, y) => x.n - y.n).find(x => !['withdrawn', 'rejected'].includes(posOutcome(id, x.n, date).code));
    if (p) { region = p.region; why = `по позиции ${p.n}: ${p.region}, вид «${kindOf(p.kind).name}»`; }
    else why = of.positions.length ? 'все позиции отозваны или отказаны' : 'у предложения нет позиций'; }
  else { const o = obj(id) || {}; region = o.region; why = `по местоположению объекта: ${region}`; }
  if (region && REGION_RULE[region]) return { emp: REGION_RULE[region], why: 'по правилу подразделения, ' + why };
  const birth = birthOf(id, date); const lim = SETTINGS.fallback[of ? 'offer' : 'object'];
  const deadline = birth ? addWork(birth, lim.v) : null;
  return { emp: FALLBACK_EMP, fallback: true, since: birth, deadline, limit: lim.v, over: !!deadline && date >= deadline,
    why: (region ? `правило не называет работника (${why})` : why) + ' — держит заведующий отделом' };
}

/* ------------------------------ поводы ----------------------------- */
const TRIG_NAME = {
  'pk-im-offer-overdue': 'Срок ответа истёк', 'pk-im-act-pending': 'Принятая позиция ждёт акта',
  'pk-im-registration-pending': 'Долго ждёт регистрации', 'pk-im-topup-pending': 'Доплата долго не исполнена',
  'pk-im-no-inspection': 'Давно не осматривали', 'pk-im-not-listed': 'Долго не выставлялся на продажу',
  'pk-im-unsold': 'Много несостоявшихся попыток', 'pk-im-instalment-overdue': 'Просрочка платежа по рассрочке',
  'pk-im-encumbrance-ending': 'Обременение скоро кончается',
};
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const periodLabel = p => /^\d{4}-\d{2}$/.test(p) ? MONTHS[+p.slice(5) - 1] + ' ' + p.slice(0, 4) : /^\d{4}-\d{2}-\d{2}$/.test(p) ? fmt(p) : p;
function triggers(asOf = S.asOf) {
  const out = []; const mon = asOf.slice(0, 7);
  const add = (kind, id, period, text, to) => out.push({ kind, name: TRIG_NAME[kind], id, key: kind + ' · ' + id + ' · ' + period,
    keyLabel: TRIG_NAME[kind] + ' · ' + id + ' · ' + periodLabel(period), text, to });
  OFFERS.forEach(of => {
    const st = offerState(of.id, asOf); if (st.code === 'none') return;
    if (st.overdue) add('pk-im-offer-overdue', of.id, of.deadline, `срок ответа ${fmt(of.deadline)} истёк, ответа нет`, curatorOf(of.id, asOf).emp);
    of.positions.forEach(p => { const o = posOutcome(of.id, p.n, asOf);
      if (o.code === 'accepted' && !o.act && days(o.date, asOf) > thr('pk-im-act-pending'))
        add('pk-im-act-pending', of.id + ' · поз. ' + p.n, mon, `решение «принять» ${fmt(o.date)}, акта нет ${days(o.date, asOf)} к.д.`, curatorOf(of.id, asOf).emp); });
  });
  OBJECTS.forEach(o => {
    const st = objState(o.id, asOf); const fl = flags(o.id, asOf); const k = kindOf(o.kind); const F = live(o.facts, asOf); const cur = curatorOf(o.id, asOf).emp;
    if (st.code === 'wait' && days(st.since, asOf) > thr('pk-im-registration-pending')) add('pk-im-registration-pending', o.id, mon, `ждёт регистрации ${days(st.since, asOf)} к.д.`, cur);
    if (fl.incomplete && days(fl.incomplete.date, asOf) > thr('pk-im-topup-pending')) add('pk-im-topup-pending', o.id, mon, `доплата ${money(fl.incomplete.amount)} не исполнена ${days(fl.incomplete.date, asOf)} к.д.`, cur);
    if (['none', 'failed', 'removed', 'split'].includes(st.code)) return;
    if (k.cls === 'вещь' && st.code !== 'wait') { const li = F.filter(f => f.t === 'inspection').map(f => f.date).sort().pop() || st.transfer;
      if (addMonths(li, thr('pk-im-no-inspection')) < asOf) add('pk-im-no-inspection', o.id, mon, `последний осмотр ${fmt(li)}`, cur); }
    const at = attempts(o.id, asOf);
    if (st.code === 'onbook' && !at.length && addMonths(st.transfer, thr('pk-im-not-listed')) < asOf) add('pk-im-not-listed', o.id, mon, `на учёте с ${fmt(st.transfer)}, попыток не было`, cur);
    const failed = at.filter(x => x.res && x.res.v !== 'sold').length;
    if (failed >= thr('pk-im-unsold')) add('pk-im-unsold', o.id, mon, `несостоявшихся попыток: ${failed}`, cur);
    const ci = contractInfo(o.id, asOf);
    if (ci && ci.active && !ci.complete && ci.odDays >= thr('pk-im-instalment-overdue')) add('pk-im-instalment-overdue', o.id, 'платёж от ' + fmt(ci.firstUnpaid), `просрочено ${money(ci.overdue, ci.ccy)}, ${ci.odDays} дн.`, cur);
    if (fl.encumbered && days(asOf, fl.encumbered.to) <= thr('pk-im-encumbrance-ending')) add('pk-im-encumbrance-ending', o.id, mon, `«${fl.encumbered.kind}» кончается ${fmt(fl.encumbered.to)}`, cur);
  });
  return out;
}

/* ---------------------- результат по объекту ----------------------- */
function result(id, asOf = S.asOf) {
  const o = obj(id); const F = live(o.facts, asOf); const st = objState(id, asOf);
  const ex = F.filter(f => f.t === 'expense');
  const exp = ex.filter(f => (f.ccy || 'KGS') === o.ccy).reduce((a, f) => a + f.amount, 0);
  const expOther = ex.filter(f => (f.ccy || 'KGS') !== o.ccy).map(f => money(f.amount, f.ccy));
  const ci = contractInfo(id, asOf); const loss = F.find(f => f.t === 'loss');
  let price = null, basis = '', priceCcy = o.ccy;
  if (ci && ci.active) { price = ci.price; priceCcy = ci.ccy || 'KGS'; basis = ci.complete ? 'цена продажи' : 'цена по договору (оплата не завершена)'; }
  else if (F.find(f => f.t === 'gift')) { price = 0; basis = 'безвозмездная передача'; }
  else if (loss) { price = loss.insurance || 0; basis = loss.insurance ? 'страховое возмещение' : 'выбытие без возмещения'; }
  const value = objValue(id);
  /* Модуль курсов не знает (ИИ-18): при разных валютах результат не считается. */
  const mixed = priceCcy !== o.ccy;
  return { value, ccy: o.ccy, expenses: exp, expOther, price, priceCcy, basis, mixed,
    result: price == null || mixed ? null : price - value - exp, final: st.code === 'removed' };
}

/* ------------------------- что видят соседи ------------------------ */
function neighbours(id, asOf = S.asOf) {
  const o = obj(id); const st = objState(id, asOf); const F = live(o.facts, asOf); const out = { payments: [], collection: [], pledge: [] };
  if (isIntro(o)) out.payments.push('Погашения не порождает: оно прошло в старой системе и переносится вместе с платежами.');
  else if (TRANSFERRED.includes(st.code) && !o.parent) {
    const al = allocation(o.obligor, asOf).rows.find(r => r.id === id) || {};
    const cr = obl(o.obligor).credits;
    const corr = F.filter(f => f.t === 'corr').pop();
    out.payments.push(`Поступление «имущество в счёт погашения» на ${fmt(st.transfer)}: ${money(corr ? corr.oldValue : o.value, o.ccy)} — по долям кредитов ${cr.map(c => c.no + (c.ccy !== o.ccy ? ' (' + c.ccy + ', пересчёт — Платежи по курсу на ' + fmt(st.transfer) + ')' : '')).join(', ')}.`);
    if (corr) out.payments.push(`Корректировка суммы поступления ${corr.newValue - corr.oldValue > 0 ? '+' : '−'}${money(Math.abs(corr.newValue - corr.oldValue), o.ccy)} с ${fmt(st.transfer)} — не сторно; Взыскание переделит.`);
    out.collection.push(`Распределено между кредитами ${money(al.distributed)}, не вошло ${money(al.notIncluded)}.`);
    const t = topupOf(id, asOf);
    if (t && t.amount > 0) out.payments.push(`Распоряжение на Возврат: доплата ${money(t.amount)} → ${t.to} — ${t.done ? 'исполнен ' + fmt(t.done.date) + ' (' + t.done.doc + ')' : 'ожидает исполнения'}.`);
    const r = F.find(f => f.t === 'ret');
    if (r) { out.payments.push(`Сторно поступления от ${fmt(st.transfer)} задним числом; пеня за разрыв ${fmt(st.transfer)} → ${fmt(r.date)} — спорная, на Комиссию по спорным начислениям.`);
      if (t && t.done) out.payments.push(`Требование к отчуждателю о возврате исполненной доплаты ${money(t.amount)} — взыскивается вне модуля.`); }
    const re = F.filter(f => f.t === 'realloc').pop();
    if (re) { out.payments.push(`Корректировка суммы поступления +${money(re.distributed - re.oldDistributed)} с ${fmt(re.date)} по исправлению распределения (отменено более раннее принятие ${re.cause.join(', ')}) — не сторно; погашение у объекта по-прежнему одно.`);
      out.collection.push(`Исправлено: распределено ${money(re.oldDistributed)} → ${money(re.distributed)}, не вошло ${money(re.oldNotIncluded)} → ${money(re.notIncluded)}.`);
      if (re.claim) out.payments.push(`Требование к отчуждателю: излишек исполненной доплаты ${money(re.claim)} — взыскивается вне модуля.`); }
    const nd = reallocNeeded(id, asOf);
    if (nd) out.collection.push(`Деление ждёт исправления: отменено более раннее принятие ${nd.cause.join(', ')}.`);
  } else if (st.code === 'wait') out.payments.push('Погашения ещё нет: долг гасится на дату перехода права (регистрации).');
  else if (st.code === 'failed') out.payments.push('Погашения не было и сторно нет: право так и не перешло.');
  if (o.obligor && obl(o.obligor).role === 'поручитель') out.collection.push(`Гасится линия поручителя ${obl(o.obligor).name} во взыскании (заёмщик ${obl(o.obligor).borrower}), с ней — в той же сумме — долг заёмщика.`);
  const ci = contractInfo(id, asOf);
  if (ci) { out.payments.push(`Оплаты по договору КП — поступления вида «оплата по договору купли-продажи», адресат — договор: получено ${money(ci.paid, ci.ccy)}.`);
    if (ci.terminated) out.payments.push(`Расторжение: Возврат покупателю ${money(ci.terminated.refund, ci.ccy)} (уплачено ${money(ci.terminated.paid, ci.ccy)} за вычетом неустойки ${money(ci.terminated.penaltyAmt, ci.ccy)}).`); }
  if (o.pledge) out.pledge.push(TRANSFERRED.includes(st.code) ? `Предмет залога ${o.pledge} — «перешёл к Фонду» (финал, только чтение); запрет на отчуждение снят.` : `Предмет залога ${o.pledge} — в залоге до перехода права.`);
  return out;
}
/* Журнал дела во Взыскании — проекции модуля, только чтение; продажи объекта там нет (ИМ-18). */
function caseJournal(oblId, asOf = S.asOf) {
  const rows = (CASE_MEASURES[oblId] || []).map(m => ({ date: m.date, text: m.text, own: false }));
  OFFERS.filter(o => o.obligor === oblId && o.reg <= asOf).forEach(of => {
    rows.push({ date: of.reg, text: `Предложение имущества ${of.id} зарегистрировано`, own: true });
    const dec = live(of.facts, asOf).find(f => f.t === 'decision');
    if (dec) rows.push({ date: dec.date, text: `Решение органа по ${of.id}: ` + Object.entries(dec.items).map(([n, it]) => `поз. ${n} — ${it.v === 'accept' ? 'принять' : 'отказать'}`).join(', '), own: true });
  });
  OBJECTS.filter(o => o.obligor === oblId && !o.parent && !isIntro(o)).forEach(o => {
    const F = live(o.facts, asOf); const act = F.find(f => f.t === 'act'); const st = objState(o.id, asOf);
    if (act) rows.push({ date: act.date, text: `Акт приёма-передачи ${o.id}`, own: true });
    if (TRANSFERRED.includes(st.code)) rows.push({ date: st.transfer, text: `Переход права ${o.id}, ${money(objValue(o.id), o.ccy)}`, own: true });
    if (st.code === 'failed') rows.push({ date: st.date, text: `Принятие ${o.id} не состоялось`, own: true });
    const r = F.find(f => f.t === 'ret'); if (r) rows.push({ date: r.date, text: `Принятие ${o.id} отменено судом (возврат)`, own: true });
    F.filter(f => f.t === 'realloc').forEach(f => rows.push({ date: f.date, text: `Исправлено распределение ${o.id}: ${money(f.oldDistributed)} → ${money(f.distributed)}`, own: true }));
  });
  return rows.sort((a, b) => a.date < b.date ? -1 : 1);
}
/* Контроль миграции: сумма мигрированных погашений = сумма стоимостей вводных объектов (§13). */

function pendingCard(filter) {
  const list = pending().filter(x => !filter || filter(x));
  if (!list.length) return '';
  return `<div class="card" data-testid="pending-card"><div class="card-head"><h3>Ждут второго ключа · ${list.length}</h3>
    <span class="small">Факт не опубликован: другие модули его не видят, состояние от него не меняется.</span></div>
    <table class="cgrid"><thead><tr><th>Дата</th><th>Факт</th><th>Где</th><th>Документ</th><th>Готовил</th><th></th></tr></thead><tbody>${list.map(({ f, owner }) => `
    <tr class="pend" data-testid="pending-${f.id}"><td class="mono">${fmt(f.date)}</td><td>${esc(factLabel(f))}</td>
      <td><button class="linky" onclick="IM.open('${jsq(owner)}')">${esc(owner)}</button></td><td>${esc(f.doc || '')}</td><td>${roleMark(f.by)}</td>
      <td>${S.role === 'head' ? `<div class="btn-row"><button class="btn btn-primary btn-sm" data-testid="publish-${f.id}" onclick="IM.uiPublish('${f.id}')">Опубликовать вторым ключом</button>
        <button class="btn btn-secondary btn-sm" onclick="IM.uiReject('${f.id}')">Вернуть</button></div>` : '<span class="small">ждёт начальника Управления</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function curatorCell(id) {
  const c = curatorOf(id);
  if (!c.fallback) return esc(c.emp);
  return `${esc(c.emp)}<div>${c.over ? `<span class="pill err" data-testid="curator-over-${esc(id)}" title="${esc(c.why)}">куратора нет дольше порога</span>`
    : '<span class="pill warn" title="' + esc(c.why) + '">куратора нет</span>'}</div>${c.since ? `<div class="why">с ${fmt(c.since)}, порог ${c.limit} р.д. — до ${fmt(c.deadline)}</div>` : ''}`;
}
function factLabel(f) {
  const n = FACT_NAME[f.t] || f.t;
  switch (f.t) {
    case 'act': return n + (f.pos ? ` · позиция ${f.pos}` : '') + (f.objId ? ` → ${f.objId}` : '');
    case 'terminate': return n + (f.pos ? ` · позиция ${f.pos}` : '') + ` · ${f.reason}${f.note ? ' (' + f.note + ')' : ''}`;
    case 'withdraw': return n + ` · позиция ${f.pos}`;
    case 'concl': return `${n} · поз. ${f.pos} · ${f.kind}: ${f.text}`;
    case 'decision': return `${n} · ${f.organ}${f.late ? ' · вынесено после истечения срока ответа' : ''}`;
    case 'regRefusal': return n + (f.final ? ' · окончательный' : ' · устранимый');
    case 'appraisal': return `${n} · ${f.appraiser} · ${money(f.amount, f.ccy)}`;
    case 'expense': return `${n} · ${f.item} · ${money(f.amount, f.ccy)}`;
    case 'encumbrance': return `${n} · ${f.kind} ${fmt(f.from)}–${fmt(f.to)}`;
    case 'priceDecision': return `${n} · до ${money(f.amount)}`;
    case 'attempt': return `${n} · ${f.method} · старт ${money(f.start)}`;
    case 'attemptResult': return `${n} · ${f.v === 'sold' ? 'состоялась: ' + f.buyer + ', ' + money(f.price) : f.v === 'failed' ? 'не состоялась' : 'состоялась, договор не заключён'}`;
    case 'contract': return `${n} · ${f.kind === 'inst' ? 'рассрочка ' + f.schedule.length + ' платежей' : 'разовый'} · ${f.buyer} · ${money(f.price, f.ccy)}`;
    case 'payment': case 'topup': return `${n} · ${money(f.amount)}`;
    case 'cterm': return `${n} · неустойка ${money(f.penaltyAmt)}, Возврат ${money(f.refund)}`;
    case 'split': return `${n} · ${f.parts.join(' + ')}`;
    case 'corr': return `${n} · стоимость ${money(f.oldValue)} → ${money(f.newValue)}`;
    case 'realloc': return `${n} (${(f.cause || []).join(', ')}) · распределено ${money(f.oldDistributed)} → ${money(f.distributed)}, не вошло ${money(f.oldNotIncluded)} → ${money(f.notIncluded)}${f.claim ? ' · требование к отчуждателю ' + money(f.claim) : ''}`;
    case 'loss': return `${n} · ${f.cause}`;
  }
  return n;
}

/* --------------------- ЭКРАН: реестр предложений -------------------- */
function viewOffers() {

    <td class="mono">${fmt(o.deadline)}${st.overdue ? ' <span class="flag">⚑ истёк</span>' : ''}${st.answer ? `<div class="why">ответ ${fmt(st.answer.date)}</div>` : ''}</td>
    <td>${o.positions.length}: <span class="small">принято ${c.accepted} · отказано ${c.rejected} · отозвано ${c.withdrawn}${c.failed ? ' · не состоялось ' + c.failed : ''}</span></td>

}

/* --------------------- ЭКРАН: карточка предложения ------------------ */
function viewOffer(id) {
  const of = offer(id); if (!of) return '<div class="banner danger">Нет предложения</div>';

  const acts = (p) => {
    const out = posOutcome(id, p.n); const b = [];
    const btn = (t, label, fn, ok, why) => `<button class="btn btn-secondary btn-sm" data-testid="pos-${p.n}-${t}" data-why="${esc(why || '')}" ${ok ? '' : 'disabled'} title="${esc(why || '')}" onclick="${fn}">${label}</button>`;
    const roleWhy = t => canRole(t) ? '' : 'доступно роли: ' + ROLE_OF[t].map(roleName).join(', ');
    const hasDec = of.facts.some(f => f.t === 'decision');
    b.push(btn('edit', 'Изменить', `IM.uiEditPos('${id}',${p.n})`, !hasDec && canRole('posEdit'), hasDec ? 'после решения органа — только исправлением' : roleWhy('posEdit')));
    if (out.code === 'review') b.push(btn('concl', 'Заключение', `IM.uiFact('${id}','concl',${p.n})`, canRole('concl'), roleWhy('concl')));
    const actExists = of.facts.some(f => f.t === 'act' && f.pos === p.n);
    const wdWhy = actExists || out.act ? WITHDRAW_AFTER_ACT : (out.code !== 'review' && out.code !== 'accepted') ? 'у позиции уже есть итог' : roleWhy('withdraw');
    if (out.code === 'review' || out.code === 'accepted') b.push(btn('withdraw', 'Отзыв источником', `IM.uiFact('${id}','withdraw',${p.n})`, !wdWhy, wdWhy));
    if (out.code === 'accepted' && !out.act) {
      b.push(btn('act', 'Акт приёма-передачи', `IM.uiFact('${id}','act',${p.n})`, !actExists && canRole('act'), actExists ? 'акт ждёт второго ключа' : roleWhy('act')));
      b.push(btn('terminate', 'Прекращение принятия', `IM.uiFact('${id}','terminate',${p.n})`, !actExists && canRole('terminate'), actExists ? 'акт ждёт второго ключа' : roleWhy('terminate')));

    return `<div class="btn-row">${b.join('')}</div>${(actExists || out.act) && out.code === 'accepted' ? `<div class="why">Отзыв: ${esc(WITHDRAW_AFTER_ACT)}</div>` : ''}`;
  };
  const rows = of.positions.map(p => { const out = posOutcome(id, p.n); const e = exp.rows[p.n]; const k = kindOf(p.kind);

      <td><b>${esc(p.name)}</b><div class="why">${esc(k.name)} · ${esc(k.cls)}${k.reg ? ' · право подлежит госрегистрации' : ''}${p.pledge ? ' · происходит из предмета залога ' + p.pledge : ''}</div>
        ${live(of.facts, S.asOf).filter(f => f.t === 'concl' && f.pos === p.n).map(f => `<div class="why">${esc(f.kind)}: ${esc(f.text)} (${fmt(f.date)})</div>`).join('')}</td>
      <td class="num">${money(p.value, p.ccy)}</td>
      <td class="mono">${e && e.plan ? fmt(e.plan) : '—'}</td>
      <td class="num" data-testid="exp-topup-${p.n}">${e ? money(e.topup) : '—'}</td>
      <td>${pill(out, 'pos-out-' + p.n)}${out.sub ? `<div class="why">${esc(out.sub)}</div>` : ''}${out.reason ? `<div class="why">${esc(out.reason)}</div>` : ''}${out.date ? `<div class="why">${fmt(out.date)}</div>` : ''}</td>
      <td>${out.obj ? `<button class="linky" onclick="IM.openObject('${out.obj}')">${out.obj}</button>` : '—'}</td>
      <td>${acts(p)}</td></tr>`; }).join('');
  return `${pendingCard(x => x.owner === id)}
  ${OBJECTS.filter(x => x.offer === id && reallocNeeded(x.id)).map(x => `<div class="banner warn">Отменено более раннее принятие того же обязанного лица — деление ${x.id} нужно исправить. <button class="linky" onclick="IM.openObject('${x.id}')">Открыть ${x.id}</button></div>`).join('')}
  ${st.overdue ? `<div class="banner danger" data-testid="offer-overdue"><b>⚑ Срок ответа ${fmt(of.deadline)} истёк, ответа нет.</b> <span title="pk-im-offer-overdue">Повод для Заданий «${TRIG_NAME['pk-im-offer-overdue']}»</span> — поручение получит куратор предложения. Решение после срока не блокируется — оно вносится с пометкой.</div>` : ''}
  ${triggers().filter(t => t.kind === 'pk-im-act-pending' && t.id.startsWith(id + ' ')).map(t => `<div class="banner warn" data-testid="act-pending"><b title="pk-im-act-pending">Повод для Заданий «${esc(t.name)}» · ${esc(t.id)}:</b> ${esc(t.text)}. Адресат — куратор предложения ${esc(t.to)}. Выходы: акт, отзыв источником, прекращение принятия.</div>`).join('')}
  <div class="grid2"><div>
  <div class="card"><div class="card-head"><h3>${of.id} · ${esc(SOURCES[of.source].name)}</h3>${pill(st, 'offer-state')}

      <div class="k">Срок ответа</div><div>${fmt(of.deadline)} <span class="small">· источник: ${esc(of.deadlineSrc)}</span></div>
      <div class="k">Ответ</div><div>${st.answer ? `${fmt(st.answer.date)} · ${st.answer.t === 'letter' ? 'промежуточное письмо' : 'решение органа'}${st.answer.date > of.deadline ? ' <span class="pill warn">после срока</span>' : ''}` : '<span class="muted">нет</span>'}</div>
      <div class="k">Кредиты</div><div>${o.credits.map(c => c.no + ' (' + (CCY[c.ccy] || c.ccy) + ')').join(', ')} <span class="small">· деление — Взыскание</span></div>
      <div class="k">Остаток долга после принятий</div><div data-testid="offer-debt-rest">${money(allocation(of.obligor).rest)} <span class="small">· ответ Взыскания; долг до принятий ${money(o.debt)}</span></div>
      <div class="k">Куратор на ${fmt(S.asOf)}</div><div data-testid="offer-curator">${curatorCell(id)} <span class="small">· из Кураторства, ${esc(curatorOf(id).why)}</span></div>
    </div>
    ${st.code !== 'closed' ? `<div class="banner info" style="margin-top:10px">Пока предложение рассматривается, пени начисляются до перехода права и меры взыскания продолжаются.</div>` : ''}

  </div><div>
  <div class="card ro"><h3>Журнал дела во Взыскании <span class="small">· только чтение</span></h3>

      в порядке плановой даты перехода права, при равных датах — по номеру позиции. Окончательную сумму на дату перехода права считает Взыскание по живому долгу.</div>

  </div></div>` : ''}
  <div class="card"><h3>Журнал фактов</h3>${factTable(of.facts)}</div>

function factTable(facts) {
  const corrected = new Set(facts.filter(f => f.t === 'corr' && f.pub).map(f => f.target));
  const list = [...facts].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  return `<table class="cgrid" data-testid="fact-journal"><thead><tr><th>Дата</th><th>Факт</th><th>Документ</th><th>Ввёл</th><th>Опубликовал</th></tr></thead><tbody>${list.map(f => `
    <tr class="${!f.pub ? 'pend' : ''}"><td class="mono">${fmt(f.date)}</td><td>${esc(factLabel(f))}${corrected.has(f.id) ? ' <span class="pill warn">исправлен</span>' : ''}${f.date > S.asOf ? ' <span class="small">(после выбранной даты)</span>' : ''}</td>
    <td>${esc(f.doc || '')}</td><td>${roleMark(f.by)}</td><td>${!f.pub ? '<span class="pill warn">ждёт второго ключа</span>' : f.pubBy ? roleMark(f.pubBy) : '<span class="small">без второго ключа</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">фактов нет</td></tr>'}</tbody></table>`;
}

/* ---------------------- ЭКРАН: реестр объектов ---------------------- */

  const regions = [...new Set(OBJECTS.map(o => o.region))];
  const rows = OBJECTS.map(o => ({ o, st: objState(o.id), fl: flags(o.id) })).filter(r => r.st.code !== 'none' || f.bState === 'none')
    .filter(r => (!f.bState || r.st.code === f.bState) && (!f.bKind || r.o.kind === f.bKind) && (!f.bCls || kindOf(r.o.kind).cls === f.bCls)
      && (!f.bRegion || r.o.region === f.bRegion) && (!f.bSrc || r.o.source === f.bSrc) && (!f.bInc || r.fl.incomplete) && (!f.bEnc || r.fl.encumbered)

  const sel = (key, opts) => `<select onchange="IM.setF('${key}',this.value)" data-testid="f-${key}"><option value="">все</option>${opts.map(([v, l]) => `<option value="${v}"${f[key] === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const mc = migrationControl();

function readForm() {
  const v = {}; S.form.fields.forEach(f => { const el = document.getElementById('ff_' + f.id); if (!el) return; v[f.id] = f.type === 'check' ? el.checked : el.value; f.value = v[f.id]; });
