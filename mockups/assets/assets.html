/* Ошибка показывается у поля, к которому относится; остальное — общей строкой. */
const FIELD_ERR = [[/площадку публикации/, 'place'], [/наценк|риэлтор/, 'markup'], [/публикац/, 'pub0'], [/финансовый анализ/, 'fin'], [/первый взнос/, 'down'],
  [/срок рассрочки|предельный срок|на сколько лет|продление — не больше/, 'years'], [/основание цены|по цене оценщика|выберите основанием/, 'basis'], [/новую цену объявления/, 'amount'],
  [/цену объявления|цену заявки|ниже цены объявления|цена выкупа|цену продажи|цена — из|ниже основания/, 'price'], [/условия/, 'terms'], [/вид договора/, 'kind'],
  [/действующему объявлению|окно заявок|выкуп без объявления — только|заявка на выкуп уже|согласия на выкуп нет/, 'via'], [/заявител/, 'applicant'],
  [/выберите заявки|заявка не найдена|по заявке уже|по одной заявке|заявок без решения|одним решением|одно решение|не раньше заявки|на торги не выносится|две и больше/, 'apps'],
  [/причины отказа/, 'reason'], [/укажите (решение|итог торгов|ответ)/, 'v'], [/решение Комитета об открытых торгах|итог этих торгов/, 'committee'],
  [/победитель|покупатель — из/, 'buyer'], [/канал уведомления/, 'channel'], [/срок ответа/, 'answerBy'], [/кто выкупает/, 'who'], [/решение Комитета о продлении/, 'committeeDoc'],
  [/ниже 90 %|стоимость принятия берётся/, 'value'], [/основание обращения/, 'ground'], [/статьи «Иное»/, 'note'], [/решения Комитета о согласовании/, 'committeeDoc'], [/ниже основания/, 'start'], [/основани(е|ем) (стартовой цены|решение)|основание не найдено/, 'basis'], [/обременени/, 'encMark'], [/нужны даты/, 'from'],
  [/для причины «иное»|пояснение/, 'note'], [/причина прекращения/, 'reason'], [/сумма оценки|сумма расхода|сумма поступления|сумма погашения|сумма больше остатка|новую стартовую цену|сумма должна/, 'amount'],
  [/частей|части/, 'parts'], [/исправленную стоимость/, 'newValue'], [/нужны покупатель/, 'buyer'], [/не меньше двух платежей|платежей по графику/, 'n'], [/последний платёж графика/, 'first'], [/новая дата срока/, 'until'], [/выберите повод/, 'kind'], [/поручительств/, 'debtKind'], [/номер|документ|резолюци|основание: решение суда/, 'doc']];
function errField(why, fields) {
  const hit = FIELD_ERR.find(([re, id]) => re.test(why) && fields.some(f => f.id === id)); return hit ? hit[1] : null;
}
function pickFile(id) {
  const el = document.getElementById('ff_' + id), f = S.form && S.form.fields.find(x => x.id === id); if (!el || !f) return;
  const names = Array.from(el.files || []).map(x => x.name); f.value = f.multiple ? names : (names[0] || '');
  const h = document.getElementById('fn_' + id); if (h) h.textContent = names.length ? 'Выбрано: ' + names.join(', ') : '';
}
function syncShow() {
  if (!S.form) return;
  S.form.fields.filter(f => f.showWhen).forEach(f => {
    const el = document.getElementById('ff_' + f.showWhen[0]), box = document.getElementById('fb_' + f.id); if (el && box) box.style.display = el.value === f.showWhen[1] ? '' : 'none'; });
}
function renderModal() {
  if (typeof document === 'undefined') return;
  const ov = $('#overlay'); const fm = S.form;
  if (!fm) { ov.classList.remove('open'); $('#modal').innerHTML = ''; return; }
  const shown = f => { if (!f.showWhen) return true; const c = fm.fields.find(x => x.id === f.showWhen[0]); const cv = c.value != null ? c.value : (Array.isArray(c.options[0]) ? c.options[0][0] : c.options[0]); return String(cv) === f.showWhen[1]; };
  const ctl = f => {
    const v = f.value == null ? '' : f.value; const id = 'ff_' + f.id;
    if (f.type === 'select') return `<select id="${id}" onchange="IM.syncShow()">${(f.empty ? `<option value="">${esc(f.emptyLabel || '—')}</option>` : '') + f.options.map(o => { const [ov_, ol, dis] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov_)}"${String(ov_) === String(v) ? ' selected' : ''}${dis ? ' disabled' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
    if (f.type === 'textarea') return `<textarea id="${id}">${esc(v)}</textarea>`;
    if (f.type === 'date') return `<input id="${id}" type="text" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(v) ? fmt(v) : v)}">`;
    if (f.type === 'check') return `<label class="chk"><input type="checkbox" id="${id}"${v ? ' checked' : ''}> ${esc(f.text || '')}</label>`;
    if (f.type === 'file') { const nm = [].concat(f.value || []).filter(Boolean).join(', ');
      return `<input id="${id}" type="file"${f.multiple ? ' multiple' : ''}${f.accept ? ` accept="${f.accept}"` : ''} onchange="IM.pickFile('${f.id}')"><div class="why" id="fn_${f.id}" data-testid="file-name-${f.id}">${nm ? 'Выбрано: ' + esc(nm) : ''}</div>`; }
    return `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>`;
  };
  $('#modal').innerHTML = `<div class="modal-h"><div class="mt">${esc(fm.title)}</div><button class="modal-x" onclick="IM.closeForm()">×</button></div>
    <div class="modal-b">${fm.note ? `<div class="banner info">${fm.note}</div>` : ''}${fm.err && !fm.errField ? `<div class="banner danger" data-testid="form-err">${esc(fm.err)}</div>` : ''}
    <div class="mform">${fm.fields.map(f => `<div class="fld${f.wide ? ' wide' : ''}${fm.errField === f.id ? ' bad' : ''}" id="fb_${f.id}"${shown(f) ? '' : ' style="display:none"'}><label class="${f.req ? 'req' : ''}">${esc(f.label)}</label>${ctl(f)}${f.hint ? `<div class="why">${esc(f.hint)}</div>` : ''}${fm.errField === f.id ? `<div class="ferr" data-testid="form-err" data-field="${f.id}">${esc(fm.err)}</div>` : ''}</div>`).join('')}</div></div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="IM.closeForm()">Отмена</button><button class="btn btn-primary" data-testid="form-submit" onclick="IM.submitForm()">${esc(fm.submit || 'Ввести факт')}</button></div>`;
  ov.classList.add('open');
}
function readForm() {
  const v = {}; S.form.fields.forEach(f => { const el = document.getElementById('ff_' + f.id); if (!el) return;
    if (f.type === 'file') { const names = Array.from(el.files || []).map(x => x.name); v[f.id] = f.multiple ? (names.length ? names : [].concat(f.value || [])) : (names[0] || f.value || ''); }
    else v[f.id] = f.type === 'check' ? el.checked : el.value;
    f.value = v[f.id]; });
  return v;
}
function submitForm(vals) {
  if (!S.form) return no('форма не открыта');
  const v = vals || (typeof document !== 'undefined' ? readForm() : {});
  if (vals) S.form.fields.forEach(f => { if (vals[f.id] != null) f.value = vals[f.id]; });
  const miss = S.form.fields.find(f => f.req && (v[f.id] == null || v[f.id] === ''));
  const badDate = miss ? null : S.form.fields.find(f => f.type === 'date' && toIso(v[f.id]) === null);
  if (!miss && !badDate) S.form.fields.filter(f => f.type === 'date').forEach(f => { v[f.id] = toIso(v[f.id]); });
  const r = miss ? no('не заполнено обязательное поле: ' + miss.label) : badDate ? no(`«${badDate.label}»: дата в формате ДД.ММ.ГГГГ, например 15.03.2028`) : S.form.onSubmit(v);
  if (r && r.ok === false) { S.form.err = r.why; S.form.errField = miss ? miss.id : badDate ? badDate.id : errField(r.why, S.form.fields); renderModal(); return r; }
  S.form = null; renderModal(); toast(r && r.msg || (r && r.pending ? 'Факт подготовлен — ждёт второго ключа заведующего Сектором' : 'Факт введён'), 'ok'); render(); return r;
}
function toast(msg, kind) {
  if (typeof document === 'undefined') return;
  const d = document.createElement('div'); d.className = 'toast ' + (kind || ''); d.textContent = msg; d.setAttribute('data-testid', 'toast');
