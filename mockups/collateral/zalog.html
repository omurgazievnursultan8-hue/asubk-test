<title>Залоговое обеспечение · АСУБК</title>
<!--
  РАБОЧИЙ ПРОТОТИП (single-file, MVP) — модуль «Залоговое обеспечение» (TO-BE).
  Это не картинка-мокап: вся логика ниже ИСПОЛНЯЕТСЯ. Гейты, инварианты, производные
  величины и триггеры считаются в рантайме от состояния, а не зашиты в разметку.
  Спека: `ASUBK-zalog-logika.md` (секция 13 мастер-документа `ASUBK-analiz-mokapov.md`).
  Экрана залога в живой системе нет — модуль проектируется с нуля, as-is дефектов нет.

  ЧТО РЕАЛИЗОВАНО (и что разработчик обязан сохранить)

  1. ДВЕ СУЩНОСТИ, НЕ ОДНА.
     • ПРЕДМЕТ ЗАЛОГА — каноническая запись актива (реестр). Живёт сквозь весь ЖЦ,
       переоценивается, обследуется, на него накладывается запрет на отчуждение. Реестр — якорь модуля.
     • ЗАЛОГОВЫЙ ДОГОВОР — юридическая обёртка (номер, нотариус, свидетельство).
     Предмет ↔ активный договор = 1:N (перезалог на остаточную стоимость).
     Договор ↔ кредит = 1:N (кредиты одного заёмщика, перекрёстное обеспечение).
     Юр-поля живут НА ДОГОВОРЕ, физические и стоимостные — НА ПРЕДМЕТЕ. Не смешивать.

  2. ОТНЕСЕНИЕ_ЗАЛОГА (junction «предмет ↔ кредит», внутри договора) несёт ДОЛЮ —
     часть залоговой стоимости предмета, закреплённую за конкретным кредитом.
     ИНВАРИАНТ: Σ долей предмета по всем действующим/оформляемым договорам
     ≤ залоговая стоимость предмета. Проверяется при каждом вводе доли (saveAlloc → availableOf);
     если стоимость упала уже ПОСЛЕ ввода, доли усекаются пропорционально в расчёте покрытия
     (effShare, п. 4) и перевыделение поднимается как стоп-фактор допуска.

  3. БАЗА ПОКРЫТИЯ — ЗАЛОГОВАЯ СТОИМОСТЬ, НЕ ОЦЕНОЧНАЯ (шов №1).
     оценочная — owned (вводит человек из отчёта оценщика);
     залоговая — derived: оценочная × коэффициент[вид залога] (справочник KINDS, Прил.1 §2.1);
                 override заведующим отделом (canHeadOfUnit) — ТОЛЬКО ПОНИЖЕНИЕ
                 (overrideAllowed, ПОЛ §2.1): подъём выше расчётной новыми записями
                 невозможен; записи выше расчётной остались лишь историческими
                 (legacy, флаг isOverAbove) — см. Р-19;
     ИНДЕКС ОБЕСПЕЧЕННОСТИ (Р-11) — вычисляемый оверлей: coverage().index =
                 idxPledge (Σ эфф. долей ÷ (сумма кредита × порог покрытия)) + idxGuar
                 (сумма банковской гарантии ÷ (сумма кредита × guaranteeReq)); порог —
                 функция состава (requiredCover), не константа. Обеспечен при index ≥ 1;
                 поручительство ведётся собственным слоем ЭТОГО модуля (§14, реестр
                 поручителей + договоры поручительства), но в индекс НЕ входит — coverage()
                 данные поручительства не читает вовсе (регресс-инвариант Р-24).
     Ни одно из значений не хранится «на всякий случай» — считается из состояния.

  4. УСЕЧЕНИЕ ДОЛИ ПРИ ПАДЕНИИ СТОИМОСТИ (правило, добавленное сверх спеки —
     согласовать). Юридическая доля в нотариальном договоре СТАТИЧНА и не усыхает.
     Но если переоценка уронила залоговую стоимость ниже суммы закреплённых долей,
     экономическое покрытие не может опираться на несуществующую стоимость: доли
     усекаются ПРОПОРЦИОНАЛЬНО (effShare). Договор при этом не правится — падение
     покрытия поднимает триггер «недостаточность обеспечения» (см. п. 7).

  5. ГЕЙТ ПОКРЫТИЯ — ПЕРЕМЕННЫЙ ПОРОГ, ОДИН КОД (gateCheck). Порог — не «120% на всё»,
     а функция состава залога (requiredCover → {req, source}): ликвид ≥120% (Прил.1 §2.3),
     движимое неликвидное ≥150% при доле ликвида ≥80% (Прил.1 §2.4). Гейт стоит в ДВУХ местах:
     • Регистрация залогового договора — контрольный гейт покрытия.
     • Регистрация доп соглашения — тот же гейт по ЧИСТОМУ ЭФФЕКТУ пакета (net).
     ЧЕТВЁРТЫЙ ГЕЙТ §2.6 (Р-13, kmGateBlocked): если обеспеченность заёмщика установлена
     решением Кабинета Министров, регистрация блокируется, пока реквизиты решения (kmDecision)
     не внесены на кредит — независимо от процента покрытия.
     Провал → договор уходит в статус «На рассмотрении комиссии»
     (не «зарегистрирован с ошибкой» и не «молча пропущен»). Комиссия либо возвращает
     на доработку, либо допускает недообеспеченный кредит с ОБЯЗАТЕЛЬНЫМ обоснованием.

  6. ДОП СОГЛАШЕНИЕ — КОНВЕРТ ВЕРСИОНИРОВАНИЯ (changeset), а не набор отдельных кнопок.
     Один акт несёт ≥1 операцию (вывод предмета + ввод + правка долей + добавление
     кредита). Мини-ЖЦ: оформляется → зарегистрировано. Эффект наступает НА РЕГИСТРАЦИИ.
     Снимок before/after сохраняется на соглашении. Вывод предмета не блокируется:
     если он выводит предмет с наложенным запретом, после регистрации возникает
     задача снять запрет (мониторинг), снятие — отдельным актом в органе.

  7. ТРИ НЕЗАВИСИМЫХ ИЗМЕРЕНИЯ, НЕ СЛИВАТЬ В ОДИН «СТАТУС»:
     • залоговая ось предмета (lienStatus: свободен · резервируется — занят только черновиком ·
       в залоге · реализуется · выбыл · освобождён) — ПРОИЗВОДНАЯ от наличия долей и флагов
       lost/realizing, не хранимое поле;
     • ось ЗАПРЕТА НА ОТЧУЖДЕНИЕ (banStatus: не требуется · не наложен · просрочен · наложен ·
       подлежит снятию; поверх «наложен» — отдельный признак «отметка в оригиналах не получена»,
       banFullyRegistered) — оформительский контур, не внешнее событие. Р-20 (ПБК п.2.1): запрет НАКЛАДЫВАЕТ ЗАЛОГОДАТЕЛЬ в регистрирующем органе,
       а МЫ контролируем и ПРИНИМАЕМ ОТМЕТКУ о запрете в оригиналах правоустанавливающих
       документов (markInOriginals/confirmedBy). Наложен, но отметка не получена → триггер
       «оформление не завершено». ОДИН запрет на предмет (на вещь), при перезалоге
       дополняется основаниями — повторно не накладывается. ОТСУТСТВИЕ запрета при живом
       залоге — ДЕФЕКТ ОФОРМЛЕНИЯ (триггер), НАЛИЧИЕ с отметкой — признак защищённости.
       Снятие ПОД ГЕЙТОМ: пока по предмету живы доли, снять нельзя; при полном погашении —
       реквизит акта сверки (releaseValid, ПБК п.2.2). Срок наложения — BAN_DEADLINE_DAYS
       (внутренний параметр, в ПОЛ/Прил.1-Прил.3 отсутствует), орган — свой на каждый вид залога.
       Сторонний арест (суд, налоговая) в модуле НЕ моделируется.
     • плановый контроль (обследование / переоценка) — ВЫЧИСЛЯЕМЫЙ ОВЕРЛЕЙ по датам,
       не статус. Просрочка контроля — расчёт от сегодняшней даты.
     Триггер «недостаточность обеспечения» — тоже НЕ статус: это вычисляемое событие,
     которое уходит во взыскание (трек по причине «обеспечение», параллельный просрочке).
     Р-23 (ПОР п.12): модуль залога НЕ меняет категорию кредитного риска сам — он
     ПУБЛИКУЕТ кандидатов в факторы риска (riskFactorCandidates, напр. истёкший полис →
     «Средний») в комитет по администрированию бюджетных кредитов; решение о категории —
     за комитетом. Группу платёжеспособности модуль тоже не трогает.

  8. ВЫСВОБОЖДЕНИЕ ДОЛИ (§4.2 спеки): автоматика ТОЛЬКО при закрытии кредита/договора
     (кнопка «Отметить погашенным» на карточке договора демонстрирует правило).
     Частичное освобождение на живом кредите — ТОЛЬКО доп соглашением. Доля от платежей
     по основному долгу не усыхает.

  9. ОБСЛЕДОВАНИЕ ≠ ПЕРЕОЦЕНКА. Обследование — про физическое состояние (read-событие),
     переоценка — про стоимость. Исход обследования классифицирован и ветвит действие:
     в норме → сдвиг плановой даты; ухудшение → флаг «требуется досрочная переоценка»;
     утрата → предмет выбыл → триггер недостаточности обеспечения.

  СООТВЕТСТВИЕ «Положению о работе с залогом» № 22 от 12.12.2025 и приложениям (Р-1…Р-9):
    Р-1  ТРИ ПОРОГА обеспеченности + ДОЛЯ ЛИКВИДА (§2.3–2.4): ликвид ≥120%, движимое
         неликвидное ≥150% при доле ликвида ≥80%. Порог — функция состава (requiredCover),
         не константа; все расчётные точки и тексты берут порог оттуда.
    Р-2  СТОП-ЛИСТ §3.5 (PROHIBITED_KINDS): «Скот/поголовье» удалён из видов; «Товары в
         обороте» требуют подтверждения непопадания под §3.5; стоп-лист виден в справочнике.
    Р-3  ПЕРИОДИЧНОСТЬ ОБСЛЕДОВАНИЯ по матрице «группа платёжеспособности × движимость»
         (Прил.2 §2.3, SURVEY_MATRIX); группа — worst-of по заёмщикам; банкрот → «по договору
         со спецадминистратором», авто-просрочка не поднимается. Интервал ПЕРЕОЦЕНКИ — вне положения.
    Р-4  СОГЛАСИЕ на действия БЕЗ снятия запрета (§8, Прил.3 §4): it.ban не трогается; при
         необходимости — триггер переоценки за счёт залогодателя.
    Р-5  ПРЕДПОСЫЛКИ ОФОРМЛЕНИЯ (§5.2): согласия собственника/супруга/справка по типу
         залогодателя; гейт регистрации (отдельный от гейта покрытия) блокирует незакрытые.
    Р-6  ГЕЙТ ЗАМЕНЫ (§8, Прил.3 §3.5): нельзя понижать ликвидность (liquidityRank) — допуск
         комиссией; замена при просрочке (credit.overdue) не допускается вовсе.
    Р-7  ТЕХНИКА (§2.5, §3.4): возраст ≤15 лет (СНГ)/≤20 (дальнее зарубежье), обязательное
         страхование; истёкший полис на действующем залоге → триггер.
    Р-8  ИЗВЕЩЕНИЕ О ВОСПОЛНЕНИИ (Прил.2 §2.5): при утрате/ухудшении сперва извещение со
         сроком; взыскание — только по истечении срока или при отказе.
    Р-9  СНЯТИЕ ЗАПРЕТА (§7.2, Прил.3): классификатор из оснований + чек-лист согласования,
         гейтующий кнопку; частичное снятие с части предмета — отдельным действием.

  НОТАЦИЯ ССЫЛОК — «Прил.n» И «Пn» ЭТО РАЗНОЕ, НЕ СМЕШИВАТЬ:
    • «Прил.1 / Прил.2 / Прил.3» — ПРИЛОЖЕНИЯ 1–3 к «Положению о работе с залогом» №22
      (Прил.1 — оформление договора, Прил.2 — мониторинг, Прил.3 — снятие запрета);
      ссылка на пункт пишется «Прил.2 §2.3».
    • «П1 / П2 / П3» — ТРИ ВИДА ПОРУЧИТЕЛЬСТВА (§11 спеки `ASUBK-zalog-logika.md`):
      П1 — выданные холдингом гарантии (исходящее), П2 — личное поручительство за нашего
      заёмщика (входящее, §14 ниже), П3 — имущественный залог третьего лица.
    • «П-001 / П-044» (через дефис) — идентификаторы предметов залога, к обоим рядам не относятся.

  СООТВЕТСТВИЕ нормативным решениям Р-11…Р-23 (источник — в нотации ПОЛ/Прил.1/Прил.2/Прил.3/ПОР/ПБК):
    Р-11 ИНДЕКС ОБЕСПЕЧЕННОСТИ (Прил.1 §2.3): банковская гарантия реально входит в индекс
         (coverage().index = idxPledge + idxGuar; guaranteeReq — 100% в валюте кредита /
         120% в иной валюте); поручительство живёт собственным слоем §14, но в индекс НЕ входит.
    Р-12 ВИДЫ ЗАЛОГА + ПОЛЯ ПО ВИДУ (Прил.1 §2.1): KIND_FIELDS — обязательные атрибуты на вид;
         миграция видов прежней системы (KIND_MIGRATION) при импорте исторических договоров.
    Р-13 ПОРОГ НЕСЁТ ИСТОЧНИК + ГЕЙТ §2.6 (Прил.1 §2.3/§2.4/§2.6): requiredCover → {req, source};
         kmGateBlocked — блок регистрации, пока не внесены реквизиты решения Кабинета Министров
         (kmDecision) для заёмщиков соответствующей категории.
    Р-14 ГЕЙТ ЗАМЕНЫ (Прил.3 §3.5): равноценность (Σ вводимых ≥ Σ выводимых) + согласие отраслевого
         департамента + заключение ДАК о ликвидности + ранг (replacementGate); «Отказать в замене».
    Р-15 АКТ ОБСЛЕДОВАНИЯ (Прил.2 §2.3/§2.4): заключение и фотофиксация обязательны; подписанты —
         ГФХ + залогодатель, либо односторонний акт при подтверждённом наличии (surveyValidate).
    Р-16 ХРАНЕНИЕ И ПРАВО АРЕНДЫ (ПОЛ §6.4): custody у залогодателя/залогодержателя (custodyValid);
         срок аренды короче срока кредита → предупреждение и решение комитета (leaseCoversCredit).
    Р-17 ВОЗРАСТ ТЕХНИКИ + РОЛЬ ОБЕСПЕЧЕНИЯ (Прил.1 §2.5): лимит возраста по происхождению
         (techAgeCheck); securityRole основной/дополнительный для движимых видов.
    Р-18 СТОП-ЛИСТ КАК ВАЛИДАЦИЯ (Прил.1 §3.5, Закон КР «О залоге»): земли с/х, физ. износ ≥ предела,
         морально устаревшее, изъятое из оборота, ТМЦ-флаги — блок приёма и гейта (stopListCheck).
    Р-19 OVERRIDE ТОЛЬКО ВНИЗ + LEGACY + МАРШРУТ (ПОЛ §2.1/§9.1/§11): overrideAllowed запрещает
         подъём выше расчётной; canHeadOfUnit гейтует правку; исторические записи помечены legacy;
         движение кредитно-залоговых документов — 6 шагов ПОЛ §11 (docRouteIncomplete → триггер).
    Р-20 ЗАПРЕТ — ОТ ЗАЛОГОДАТЕЛЯ, ОТМЕТКА У НАС (ПБК п.2.1/п.2.2): banFullyRegistered требует
         регистрации + отметки в оригиналах; снятие при полном погашении — реквизит акта сверки.
    Р-21 ОСОЗНАННЫЕ ГРАНИЦЫ МОДУЛЯ (Р-11/Р-21): за модулем осталась только полная модель
         БАНКОВСКОЙ ГАРАНТИИ (свой ЖЦ, предъявление, регресс к банку); личное поручительство
         позже втянуто СЮДА волной Р-24…Р-27 (§14) — см. п. ГРАНИЦЫ. Прежний вопрос Р-10 закрыт.
    Р-22 УЖЕСТОЧЕНИЕ ПЕРИОДИЧНОСТИ ПО РИСКУ (ПОР п.10): действующий интервал = max(мин.,
         матрица × RISK_TIGHTENING[категория]) — только при согласовании зампреда (effectiveInterval).
    Р-23 ФАКТОРЫ КРЕДИТНОГО РИСКА В КОМИТЕТ (ПОР п.12 п.п.2): модуль не меняет категорию —
         публикует кандидатов в факторы (riskFactorCandidates) в комитет; решение — за комитетом.

  --asubk-ink:#192434;
  --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-disabled-fill:rgba(25,59,103,0.05); --asubk-red-tint:#FCE6E6;
  --asubk-green-tint:rgba(21,132,67,0.10); --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-input:var(--asubk-gray-200); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-primary-hover:var(--asubk-blue-hover);
  --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success:var(--asubk-green); --status-success-bg:var(--asubk-green-tint);
  --status-info:var(--asubk-blue); --status-info-bg:var(--asubk-blue-tint);
  --status-warning:var(--asubk-amber); --status-warning-bg:var(--asubk-amber-tint);
  --status-error:var(--asubk-red); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:320px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
a{ color:inherit; }

.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
/* Т-5: сайдбар сворачивается гамбургером — освобождает ширину под таблицы. */
.app.nav-collapsed .sidebar{ display:none; }
@media(max-width:1024px){ :root{ --sidebar-w:248px; } }
@media(max-width:820px){
  /* планшет: страница может расти по высоте (обследование с планшета), контент не режется 100vh */
  .app{ height:auto; min-height:100dvh; }
  .content{ overflow:visible; }
  /* сайдбар выходит из потока в выдвижную панель — таблица под ним получает всю ширину */
  .sidebar{ position:fixed; top:var(--header-h); left:0; bottom:0; z-index:40;
    box-shadow:8px 0 24px rgba(0,0,0,.18); }
}
.brand{ padding:18px 16px 14px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.nav{ flex:1; overflow-y:auto; padding-bottom:8px; }
.nav-toggle{ display:flex; align-items:center; gap:8px; width:100%; appearance:none;
  border:none; background:transparent; color:rgba(24,39,57,0.82); cursor:pointer; text-align:left; }
.nav-group > .nav-toggle{ padding:9px 16px; font:var(--weight-semibold) 15px/1.3 var(--asubk-font); }
.nav-sub > .nav-toggle{ padding:8px 16px 8px 32px; font:var(--weight-semibold) 14px/1.3 var(--asubk-font); }
.nav-toggle:hover{ background:rgba(24,39,57,0.04); }
.nav-toggle .chev{ display:inline-flex; align-items:center; color:rgba(24,39,57,0.5);
  transition:transform 120ms ease; flex:none; }
.nav-group.open > .nav-toggle .chev, .nav-sub.open > .nav-toggle .chev{ transform:rotate(90deg); }
.nav-toggle .lbl{ flex:1; }
.nav-children{ display:none; }
.nav-group.open > .nav-children, .nav-sub.open > .nav-children{ display:block; }
.nav-item{ display:block; padding:7px 16px 7px 52px; text-decoration:none; color:rgba(27,43,65,0.69);
  font:var(--weight-regular) var(--text-base)/1.625 var(--asubk-font); cursor:pointer; }
.nav-item.headerless{ padding-left:40px; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); }
.sidebar-foot{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; color:var(--text-muted); }
.sidebar-foot span{ font:var(--weight-regular) 14px/1.2 var(--asubk-font); }
.icon-btn{ border:none; background:rgba(24,39,57,0.05); color:var(--text-link); cursor:pointer;
  padding:7px; border-radius:4px; display:flex; }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ height:var(--header-h); flex:none; background:var(--surface-page);
  border-bottom:1px solid var(--border-default); display:flex; align-items:center; gap:14px; padding:0 20px; }
.topbar .menu{ color:var(--text-muted); display:flex; cursor:pointer; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .stand-wrap{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.topbar .stand-wrap label{ font:var(--font-label); color:var(--text-muted); }
.topbar .stand-wrap input[type=date]{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 8px; }
.topbar .stand-wrap.shifted input[type=date]{ border-color:var(--asubk-amber); color:var(--asubk-amber); font-weight:600; }
.topbar .role-wrap{ margin-left:16px; display:flex; align-items:center; gap:8px; }
.topbar .role-wrap label{ font:var(--font-label); color:var(--text-muted); }
.topbar .role-wrap select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 26px 0 10px;
  appearance:none; cursor:pointer; }
.topbar .role-wrap .rsel{ position:relative; display:flex; align-items:center; }
.topbar .role-wrap .rsel .caret{ position:absolute; right:8px; pointer-events:none; color:var(--text-muted); display:flex; }

.content{ flex:1; overflow:auto; display:flex; flex-direction:column; min-width:0; }
.view{ display:none; flex-direction:column; min-height:0; }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  height:var(--control-h); padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn svg{ flex:none; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--action-primary-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-sm{ height:32px; padding:0 10px; font-size:var(--text-sm); }
.btn-tint{ background:var(--asubk-disabled-fill); color:var(--text-link); border:none;
  font-weight:var(--weight-medium); }
.btn-tint:hover:not(:disabled){ background:rgba(25,59,103,0.10); color:var(--action-primary-hover); }
.btn-tint:disabled{ opacity:1; color:var(--text-disabled); cursor:not-allowed; }
.btn-tint.danger{ color:var(--action-danger); }
.btn-tint.danger:hover:not(:disabled){ background:var(--status-error-bg); }

.split{ position:relative; display:inline-flex; }
.split > .btn{ border-radius:0; }
.split > .btn:first-child{ border-top-left-radius:var(--radius-md); border-bottom-left-radius:var(--radius-md); }
.split > .btn.caret{ padding:0 7px; border-top-right-radius:var(--radius-md); border-bottom-right-radius:var(--radius-md);
  border-left:1px solid rgba(255,255,255,0.35); }
.split-menu{ display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:210px; z-index:30;
  background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--radius-md);
  box-shadow:0 10px 30px rgba(16,28,46,0.18); padding:4px; }
.split.open .split-menu{ display:block; }
.split-menu button{ display:block; width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:8px 10px; border-radius:var(--radius-sm); font:var(--font-label); color:var(--text-body); }
.split-menu button:hover{ background:var(--surface-hover); }
.gear-btn{ width:var(--control-h); height:var(--control-h); border:none;
  background:var(--asubk-tint-fill); border-radius:var(--radius-md); color:var(--text-link); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; }
.gear-btn:hover{ background:rgba(25,59,103,0.10); }

/* ---- list: filter head + toolbar ---- */
.filter-head{ display:flex; align-items:center; gap:6px; padding:12px 20px 4px; cursor:pointer;
  font:var(--weight-medium) var(--text-base)/1.25 var(--asubk-font); color:rgba(27,43,65,0.69); user-select:none; }
.filter-head .chev{ display:inline-flex; align-items:center; color:rgba(24,39,57,0.5); transition:transform 120ms ease; }
.filter-head.open .chev{ transform:rotate(90deg); }
.tb-actions{ display:flex; align-items:center; gap:10px; padding:8px 20px 12px; flex-wrap:wrap; }
.add-cond{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color:var(--text-link); font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); padding:0 4px; }
.add-cond:hover{ text-decoration:underline; }
/* ---- list: jmix-generic-filter panel (стиль стенда /loan-applicants) ---- */
.filter-head:not(.open) ~ .jf-body{ display:none; }
.jf-panel{ border:1px solid var(--border-default); border-radius:var(--radius-lg); margin:0 20px 4px;
  padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px 24px; }
.jf-row{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.jf-label{ font:var(--font-label); color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jf-ctl{ position:relative; display:flex; align-items:center; }
.jf-ctl input, .jf-ctl select{ flex:1; min-width:0; height:var(--control-h); border:none;
  border-radius:var(--radius-md); background:var(--surface-input); color:var(--text-body);
  font:var(--font-body); padding:0 8px; appearance:none; -webkit-appearance:none; }
.jf-ctl select{ padding-right:28px; background-repeat:no-repeat; background-position:right 6px center;
  background-size:20px 20px; cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='rgba(24,39,57,0.6)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); }
.jf-ctl input:focus, .jf-ctl select:focus{ outline:2px solid var(--border-focus); outline-offset:-2px; }
.jf-actions{ display:flex; align-items:center; gap:8px; padding:8px 20px 4px; }
.rowtools{ display:flex; align-items:center; gap:10px; padding:0 20px 8px; }
.rowtools .spacer{ flex:1; }
/* Р-38: общая строка поиска над реестром */
.quicksearch{ display:flex; align-items:center; gap:6px; height:32px; padding:0 10px; min-width:240px;
  border:1px solid var(--border-default); border-radius:var(--radius-sm); background:var(--surface-card);
  color:var(--text-muted); }
.quicksearch:focus-within{ border-color:var(--border-focus); box-shadow:var(--shadow-focus); }
.quicksearch input{ flex:1; border:0; outline:0; background:transparent; color:var(--text-body);
  font:var(--font-label); }
.pager{ display:flex; align-items:center; gap:6px; color:var(--text-muted);
  font:var(--weight-regular) var(--text-base)/1 var(--asubk-font); }
.pager .pager-nav{ display:flex; align-items:center; gap:6px; margin-left:8px; }
.pager .pager-pos{ font-size:var(--text-sm); white-space:nowrap; }
.pager button{ min-width:30px; height:30px; border:1px solid var(--border-default); background:var(--surface-card);
  border-radius:var(--radius-sm); cursor:pointer; color:var(--text-body); }
.pager button:disabled{ opacity:.4; cursor:not-allowed; }

/* ---- grid (list) ---- */
.grid-wrap{ padding:0 20px 20px; overflow:auto; }
/* ПЗ-Д13: `width:100%` + `table-layout:fixed` НЕ дают прокрутку при нехватке места —
   браузер молча ужимает колонки, и первой схлопывается гибкая («Наименование»).
   На 1440 (сайдбар 320 + padding 40 → 1080 полезных) фиксированные колонки реестра
   предметов занимают 1047px, гибкой оставалось ~43px. min-width считается в renderList
   из WIDTHS[reg] (Σ фикс. + GRID_FLEX_MIN на каждую гибкую) — тогда .grid-wrap реально
   прокручивается, а колонки держат заданную ширину. Реестры с узким набором колонок
   при этом не получают лишнего скролла: у каждого свой минимум. */
table.grid{ width:100%; border-collapse:collapse; font:var(--font-label); table-layout:fixed;
  border:1px solid var(--border-default); background:var(--surface-card); }
/* ПЗ-22: заголовок переносится на ДВЕ строки (56px высоты — ровно два ряда по 19px), а не
   режется многоточием. Прежний nowrap делал ширину столбца заложницей длины подписи:
   «Обеспечивает» требовало 143px под значение «2 дог.», а «Идентификатор» — 154px под «П-001».
   С переносом ширину задаёт САМОЕ ДЛИННОЕ СЛОВО подписи, и освободившиеся пиксели уходят
   туда, где есть что показывать (см. WIDTHS.items). */
table.grid thead th{ text-align:left; height:56px; padding:0 16px; background:var(--surface-card);
  border-bottom:1px solid var(--asubk-grid-line);
  font:var(--weight-medium) var(--text-sm)/1.375 var(--asubk-font); color:var(--text-body);
  white-space:normal; overflow:hidden; cursor:default; user-select:none; vertical-align:middle; }
table.grid thead th .sort{ color:var(--text-placeholder); margin-left:4px; font-size:11px; }
table.grid thead th .sort.active{ color:var(--asubk-blue); font-weight:var(--weight-bold); }
/* Р-41: колонка «Что делать» — кнопка-действие + рабочий слой (в работе / отложено) */
.mon-actions{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; white-space:normal; }
.mon-act{ color:var(--text-muted); }
table.grid tbody td{ height:35px; padding:0 16px; border-bottom:1px solid var(--asubk-grid-line);
  color:var(--text-body); vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.grid tbody tr{ cursor:pointer; }
table.grid tbody tr:hover{ background:var(--surface-hover); }
table.grid tbody tr.sel{ background:var(--asubk-nav-active); }

/* Терминальный процесс — работа завершена, строка приглушена. */
.grid tbody tr.terminal td{ color:var(--text-muted); }
.grid tbody tr.terminal td:first-child{ font-style:italic; }

/* status pills in list/cells */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.low{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.mid{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.high{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
/* ДГ-3: ДВА ТЕРМИНАЛЬНЫХ состояния договора. В палитре их не было: low/mid/high — это
   ОЦЕНКА («в норме / внимание / нарушение»), а закрытый и аннулированный договор не
   оцениваются, они завершены. Раньше оба вместе с черновиком делили один neutral, и три
   разных состояния жизненного цикла выглядели одинаково. Оба приглушены (не претендуют на
   внимание), но различимы: закрытый отработал штатно — сплошной контур; аннулированный не
   состоялся — пунктир и зачёркнутый текст. */
.pill.done{ background:transparent; color:var(--text-muted); border:1px solid var(--border-default); padding:1px 8px; }
.pill.void{ background:transparent; color:var(--text-placeholder); border:1px dashed var(--border-default);
  padding:1px 8px; text-decoration:line-through; }

/* ДГ-10: шеврон «открыть» в конце строки. Одиночный клик по номеру открывает карточку, но
   ссылка — это 60px в начале строки; шеврон даёт вторую точку входа на всю ширину реестра
   и делает открытие обнаружимым без наведения на текст. */
.rowchev{ display:inline-flex; align-items:center; justify-content:center; color:var(--text-placeholder);
  cursor:pointer; border-radius:var(--radius-sm); }
/* ДГ-20: ячейка шеврона живёт по общему правилу td (padding:0 16px) — в колонке 40px под
   сам шеврон (18px) оставалось 8px, и он обрезался на КАЖДОЙ строке. Расширять колонку
   ради паддинга незачем: это не текст, ему поля не нужны. */
table.grid tbody td:has(> .rowchev){ padding:0 4px; }
.rowchev:hover{ color:var(--asubk-blue); background:var(--surface-hover); }

/* ДГ-8: переключатель охвата «показывать аннулированные». Не поле фильтра — ОБЛАСТЬ
   выборки: у него собственная подпись со счётчиком скрытого, поэтому в счёт «активных
   условий» он не входит и resetFilter его не трогает (см. ПЗ-Д1 о единой точке счёта). */
.scope-tgl{ display:inline-flex; align-items:center; gap:6px; padding:0 4px; cursor:pointer;
  font:var(--font-label); color:var(--text-muted); white-space:nowrap; }
.scope-tgl input{ margin:0; cursor:pointer; }
.scope-tgl:hover{ color:var(--text-body); }

/* ---- view toggle: Таблица / Карточки (клон паттерна из loan-program) ---- */
.viewseg{ display:inline-flex; border:1px solid var(--border-default); border-radius:var(--radius-md);
  overflow:hidden; background:var(--surface-card); }
.viewseg-btn{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border:none;
  background:transparent; color:var(--text-muted); cursor:pointer;
  font:var(--weight-semibold) var(--text-sm)/1 var(--asubk-font); white-space:nowrap; }
.viewseg-btn + .viewseg-btn{ border-left:1px solid var(--border-default); }
.viewseg-btn svg{ flex:none; }
.viewseg-btn:hover:not(.active){ background:var(--surface-hover); color:var(--text-body); }
.viewseg-btn.active{ background:var(--action-success); color:#fff; }

/* ---- cards view (клон .pcard из loan-program) ---- */
.cards-wrap{ padding:16px 20px 20px; overflow:auto; }

  background:var(--asubk-nav-active); }

.pcard-sub{ margin-top:2px; font:var(--font-label); color:var(--text-muted);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard-chev{ flex:none; color:var(--text-placeholder); display:flex; }
/* ПЗ-23: полоса бейджей выравнивается ПО ВЕРХУ — ячейка запрета стала двухстрочной
   (пилюля + срок), и при stretch по умолчанию соседняя пилюля лиена растягивалась
   на её высоту, превращаясь в пустой овал. */
.pcard-badges{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; align-items:flex-start; }
.pcard-fields{ margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.pcard-field{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.pcard-field.span2{ grid-column:1 / -1; }
.pcard-flabel{ font:var(--weight-regular) var(--text-xs)/1.2 var(--asubk-font); color:var(--text-muted); }
.pcard-fval{ font:var(--weight-medium) var(--text-sm)/1.35 var(--asubk-font); color:var(--text-body);
  overflow:hidden; text-overflow:ellipsis; }
.cards-empty{ padding:24px; text-align:center; color:var(--text-muted); font:var(--font-label); }

/* ---- detail ---- */

  background:var(--surface-page); flex:none; }
.detail-tabbar{ display:flex; overflow-x:auto; padding:6px 44px 0 20px; scrollbar-width:none; }
.detail-tabbar::-webkit-scrollbar{ display:none; }
.dtab{ flex:none; border:none; background:transparent; padding:11px 15px;
  font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); color:var(--text-muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap; }
.dtab:hover{ color:var(--text-body); }
.dtab.active{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.tabbar-chevron{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px; height:28px;

   иначе к 18px нижнего поля шапки прибавились бы 18px верхнего поля .panel-wrap. */

.phead-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.phead-name{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.phead-name a:hover{ text-decoration:underline; }
.phead-sub{ font:var(--font-label); color:var(--text-muted); margin-top:3px; }

  padding:9px 14px; margin-bottom:12px; font:var(--font-label); }

.phead-banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }

.phead-banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.phead-banner svg{ flex:none; }
.phead-dims{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
@media(max-width:760px){ .phead-dims{ grid-template-columns:repeat(2,1fr); } }
.dim{ background:var(--surface-panel); border-radius:var(--radius-md); padding:10px 14px; }

.dim .dv{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); }

/* two-column form (label above) */
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:16px 40px; align-items:start; max-width:1500px; }

  width:28px; height:var(--control-h); }

.picker-search{ flex:1; height:34px; border:1px solid var(--border-default); border-radius:var(--radius-md);

/* collection grid */

table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label); white-space:nowrap; }

/* history rows */
.hist{ border-left:2px solid var(--border-strong); margin-left:6px; padding-left:0; }
.hrow{ position:relative; padding:10px 0 10px 22px; border-bottom:1px solid var(--asubk-grid-line); }

  background:var(--asubk-blue); }

  padding:14px 20px; display:flex; align-items:center; gap:12px; }

/* modals */

  justify-content:center; z-index:60; padding:24px; }

  display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }

/* toast */

/* ПЗ-9: идентификатор записи — не порядковый номер строки. */
.idcell{ font-variant-numeric:tabular-nums; }
/* ПЗ-10/ПЗ-12/ПЗ-13: мелкая пилюля-признак рядом со значением ячейки. */
.tagpill{ display:inline-block; margin-left:6px; padding:1px 7px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 11px/1.5 var(--asubk-font); white-space:nowrap; vertical-align:1px; }
.tagpill.liq{ background:var(--status-success-bg); color:var(--asubk-green); }
.tagpill.third{ background:var(--status-info-bg); color:var(--asubk-blue); }
.tagpill.stale{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.tagpill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.ccy{ color:var(--text-muted); font-size:12px; margin-left:3px; }
/* Пилюля-признак не должна уезжать под обрез вместе с длинным текстом: текст ужимается
   многоточием, пилюля держит свою ширину. Без этого «ликвид» и «третье лицо» были не
   видны ровно там, где колонка узкая, — то есть всегда. */
.flexcell{ display:flex; align-items:center; gap:2px; min-width:0; }
.flexcell .fc-main{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flexcell .tagpill{ flex:none; margin-left:4px; }
/* ПЗ-20/ПЗ-21: ячейка с ПЕРЕНОСОМ на две строки. Прежняя .flexcell резала длинное значение
   многоточием в один ряд, и в колонках «Вид залога» / «Залогодатель» это било по самому
   частому содержимому: «Незавершённое строительство» (203px) и «ОсОО «Иссык-Куль Ресорт»»
   (184px) не помещались НИ ПРИ КАКОЙ разумной ширине столбца — их приходилось читать
   тултипом. Значение переносится на вторую строку, признаки (подвид, пилюли) уходят
   отдельной подстрокой, поэтому ширину столбца задаёт слово, а не вся фраза.
   Клип на двух строках (-webkit-line-clamp) обязателен: без него одна аномально длинная
   запись растянула бы ряд на пол-экрана и сломала бы ритм таблицы. */
.wrapcell{ display:block; white-space:normal; line-height:1.3; padding:5px 0; min-width:0; }
.wrapcell .wc-main{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:break-word; }
.wrapcell .wc-sub{ display:flex; flex-wrap:wrap; align-items:center; gap:3px; margin-top:3px; }
.wrapcell .wc-sub .wc-sub-t{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:var(--weight-regular) 12px/1.4 var(--asubk-font); color:var(--text-muted); }
.wrapcell .wc-sub .tagpill{ margin-left:0; }
/* ПЗ-17 (паритет карточек и таблицы): в карточке подпись — ОДНА строка, поэтому та же
   ячейка там разворачивается в текст через разделитель, а не в блок. */
.pcard-sub .wrapcell, .pcard-sub .wrapcell .wc-main, .pcard-sub .wrapcell .wc-sub,
.pcard-sub .wrapcell .wc-sub-t{ display:inline; margin:0; padding:0; }
.pcard-sub .wrapcell .wc-sub-t::before{ content:' · '; }
/* Числовая ячейка с признаками: значение строкой, признаки — второй строкой под ним.
   Пилюли «оценка устарела» / «комиссия» шире, чем остаток колонки, — в одну строку
   они вытеснили бы саму сумму. */
.numcell2{ display:block; text-align:right; line-height:1.25; padding:4px 0; white-space:normal; }
.numcell2 .n2-val{ display:block; font-variant-numeric:tabular-nums; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.numcell2 .n2-flags{ display:block; margin-top:2px; }
.numcell2 .n2-flags .tagpill{ margin-left:0; margin-right:4px; }
/* ДГ-16: подстрока числовой ячейки — «N предметов» под суммой обеспечения по договору. */
.numcell2 .n2-sub{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:var(--weight-regular) 12px/1.4 var(--asubk-font); color:var(--text-muted); }
/* ПЗ-19: подвал таблицы — Σ залоговой стоимости по отфильтрованному набору. */
table.grid tfoot td{ height:40px; padding:0 16px; border-top:1px solid var(--border-strong,var(--asubk-grid-line));
  background:var(--asubk-tint-fill); font:var(--weight-semibold) var(--text-sm)/1.375 var(--asubk-font);
  color:var(--text-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.grid tfoot .sum-ccy{ margin-left:14px; font-variant-numeric:tabular-nums; }
/* ДГ-19: полоса состава отбора над таблицей договоров. Плитка узкая (не карточка сводки) —
   она называет число и его смысл, а кликом ставит соответствующее условие фильтра. */
.reg-kpi{ display:none; gap:10px; padding:0 20px 12px; flex-wrap:wrap; }
.reg-kpi.on{ display:flex; }
.reg-kpi .rk{ background:var(--surface-panel); border:1px solid transparent;
  border-radius:var(--radius-md); padding:7px 13px; cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:3px; min-width:112px; }
.reg-kpi .rk:hover{ border-color:var(--border-default); }
.reg-kpi .rk.sel{ border-color:var(--asubk-blue); background:var(--asubk-tint-fill); }
.reg-kpi .rk-v{ font:var(--weight-semibold) 17px/1.15 var(--asubk-font); color:var(--text-heading);
  font-variant-numeric:tabular-nums; }
.reg-kpi .rk-l{ font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-muted); }
.reg-kpi .rk.warn .rk-v{ color:var(--asubk-red); }
.reg-kpi .rk.zero{ opacity:.55; }
/* ПЗ-8: размер страницы живёт в пейджере (ревизия Р-39 — справочник даёт дефолт). */
.pager select{ height:30px; border:1px solid var(--border-default); background:var(--surface-card);
  border-radius:var(--radius-sm); color:var(--text-body); font:var(--font-label); padding:0 4px; }
.pager .pager-lbl{ font-size:var(--text-sm); color:var(--text-muted); }
/* ПЗ-7: управление сортировкой в карточном виде (в таблице оно на заголовках). */
.cards-sort{ display:none; align-items:center; gap:6px; padding:0 20px 10px; }
.cards-sort.on{ display:flex; }
.cards-sort select{ height:30px; border:1px solid var(--border-default); background:var(--surface-card);
  border-radius:var(--radius-sm); color:var(--text-body); font:var(--font-label); padding:0 6px; }
/* ПЗ-2: демо-скаффолд стенда — контролы, которых в проде не существует. */
.demo-scaffold{ display:flex; align-items:center; gap:10px; margin-left:auto; padding:4px 10px 4px 12px;
  border:1px dashed var(--border-default); border-radius:var(--radius-md); background:var(--asubk-tint-fill); }
.demo-scaffold > .demo-tag{ font:var(--weight-semibold) 10px/1.6 var(--asubk-font); letter-spacing:.04em;
  text-transform:uppercase; color:var(--text-placeholder); }
.demo-scaffold .stand-wrap, .demo-scaffold .role-wrap{ margin-left:0; }
/* ПЗ-18: пустое состояние с действием — два разных случая. */
.grid-empty{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:34px 12px;
  color:var(--text-muted); font:var(--font-label); text-align:center; }

/* ---- Р-47…Р-54: карточка предмета — допуск, документы, история ---- */
/* Бейдж-счётчик на вкладке: состав работы виден до открытия вкладки. */
.dtab .tb{ display:inline-block; margin-left:6px; padding:0 6px; border-radius:9px; background:var(--surface-input);
  color:var(--text-muted); font:var(--weight-semibold) 11px/17px var(--asubk-font); vertical-align:1px; }
.dtab .tb.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.dtab .tb.warn{ background:var(--status-warning-bg); color:#B26A00; }
.dtab.active .tb{ background:var(--asubk-nav-active); color:var(--asubk-blue); }

/* Дефект-строка вместо стопки баннеров (клон .defect-bar карточки заёмщика). */
.defect-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:9px 12px; margin:0 0 12px;
  border-radius:var(--radius-md); background:var(--status-error-bg); }
.defect-bar.ok{ background:var(--status-success-bg); }
.defect-bar .dl{ font:var(--weight-semibold) 11px/1.4 var(--asubk-font); letter-spacing:.04em;
  text-transform:uppercase; color:var(--text-muted); margin-right:2px; }
.defect-bar .muted{ font:var(--font-label); color:var(--text-muted); }

/* Светофор допуска: одна строка на проверку, слева — цветная риска. */
.chk-row{ display:flex; gap:12px; padding:11px 12px; border-bottom:1px solid var(--asubk-grid-line);
  border-left:3px solid transparent; }
.chk-row:last-child{ border-bottom:none; }
.chk-row.stop{ border-left-color:var(--asubk-red); background:var(--status-error-bg); }
.chk-row.warn{ border-left-color:#B26A00; background:var(--status-warning-bg); }
.chk-row.ok{ border-left-color:var(--asubk-green); }
.chk-row .cn{ width:34%; font:var(--font-label); color:var(--text-heading); font-weight:var(--weight-semibold); }
.chk-row .cr{ flex:1; font:var(--font-label); color:var(--text-body); }
.chk-row .cb{ font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-placeholder); margin-top:3px; }
.chk-list{ border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }

/* Полоса укомплектованности (досье предмета / итог допуска). */
.meter{ height:8px; border-radius:4px; background:var(--surface-hover); overflow:hidden; display:flex; margin:2px 0 6px; }
.meter > div{ height:100%; }

/* Спарклайн динамики оценочной стоимости. */
.spark{ display:block; }
.spark-wrap{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

/* Раскрываемая подстрока журнала (детали акта обследования). */
.subrow > td{ background:var(--surface-hover); }
.subrow .sub-in{ padding:6px 2px; font:var(--font-label); color:var(--text-body); }
.subrow .sub-in b{ color:var(--text-heading); }
.photo-chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; margin:3px 6px 0 0;
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card);
  font:var(--weight-regular) 12px/1.5 var(--asubk-font); color:var(--text-body); }

/* Лента истории с фильтрами и годами (клон паттерна карточки заёмщика). */
.hchips{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.hchip{ border:1px solid var(--border-default); background:var(--surface-card); border-radius:999px;
  padding:5px 12px; font:var(--font-label); color:var(--text-muted); cursor:pointer; }
.hchip:hover{ background:var(--surface-hover); }
.hchip.on{ background:var(--asubk-nav-active); border-color:var(--asubk-blue); color:var(--asubk-blue);
  font-weight:var(--weight-semibold); }
.hchip .hchip-n{ margin-left:5px; color:var(--text-placeholder); }
.hyear{ font:var(--weight-semibold) 13px/1 var(--asubk-font); color:var(--text-muted); letter-spacing:.04em;
  margin:16px 0 8px; padding-left:22px; }
.hmore{ margin-top:12px; }
.hrow .hlink{ color:var(--asubk-blue); cursor:pointer; }
.hrow .hlink:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="app">

  <nav class="sidebar">
    <div class="brand">АСУБК</div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">
      <span>[admin]</span>
      <button class="icon-btn" title="Выйти" aria-label="Выйти">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <span class="menu" title="Свернуть/развернуть меню" onclick="toggleNav()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </span>
      <span class="crumb-title" id="crumbTitle">Залоговое обеспечение</span>
      <!-- ПЗ-2: «Дата стенда» и «Роль» — ДЕМО-СКАФФОЛД, в проде их не существует:
           дата берётся системная, роль — из аутентификации. Визуально неотличимые от
           продуктовых, они читались как требование («переключатель даты в шапке»).
           Обёрнуты в пунктирную группу с подписью. Не убраны: «Дата стенда» продолжает
           двигать ось запрета (banDeadline = нотариальная + 5 раб. дней), а «Роль» —
           гейты Р-34 (кому видна кнопка создания). -->
      <div class="demo-scaffold" title="Контролы демонстрационного стенда. В рабочей системе дата берётся системная, роль — из аутентификации.">
        <span class="demo-tag">Демо-стенд</span>
        <div class="stand-wrap" title="Дата стенда — точка отсчёта для просрочек контроля и ленты триггеров">
          <label>Дата стенда:</label>
          <input type="date" id="standDate" onchange="onStandDate()">
          <button class="btn btn-secondary btn-sm" id="standReset" onclick="onStandReset()" title="Вернуть исходную дату стенда">Сброс</button>
        </div>
        <div class="role-wrap">
          <label>Роль:</label>
          <div class="rsel">
            <select id="roleSel" onchange="onRoleChange()">
              <option>Куратор отдела залогового обеспечения</option>
              <option>Заведующий отделом залогового обеспечения</option>
              <option>Начальник Департамента администрирования кредитов</option>
              <option>Комитет по администрированию бюджетных кредитов</option>
              <option>Наблюдатель</option>
            </select>
            <span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
        </div>
      </div>
    </header>

    <div class="content">

      <!-- ============ LIST VIEW (три реестра) ============ -->
      <section class="view" id="view-list" style="display:flex;">
        <div class="jf" id="jf">
          <div class="filter-head" id="jfHead" onclick="this.classList.toggle('open')">
            <span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            <span id="jfSummary">Фильтр</span>
          </div>
          <div class="jf-body">
            <div class="jf-panel" id="jfPanel"></div>
            <div class="jf-actions">
              <!-- ДГ-7: кнопка «Обновить» снята. Фильтр применяется на вводе (onFilter →
                   renderList), поэтому кнопка перерисовывала байт-в-байт тот же DOM, а тост
                   «Список обновлён» утверждал, что до нажатия список был устаревшим. Данные
                   живут в памяти страницы, устареть между двумя кадрами им негде. -->
              <button class="btn btn-secondary btn-sm" onclick="resetFilter()">Сбросить</button>
              <!-- Т-3: кнопка-заглушка «условие поиска» убрана. Она открывала не конструктор,
                   а тост про будущую интеграцию — обещание несуществующего в рабочем фильтре.
                   Произвольные условия предоставляет jmix-generic-filter на этапе интеграции;
                   фиксированный набор условий (jfPanel) закрывает демо-сценарии. -->
            </div>
          </div>
        </div>
        <div class="tb-actions">
          <button class="btn btn-primary" id="btnNew" onclick="onNew()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span id="btnNewLbl">Новый предмет залога</span>
          </button>
        </div>
        <div class="rowtools">
          <div class="quicksearch">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <!-- ПЗ-5: плейсхолдер называет то, по чему поиск реально идёт. Р-38 завёл индекс по
                 идентификаторам (кадастр/VIN/гос.№/зав.№), но в UI об этом не было сказано —
                 никто не догадывался вставить сюда VIN. Подпись перестраивается по реестру. -->
            <input type="text" id="quickSearch" placeholder="Поиск…" oninput="onQuickSearch(this.value)" aria-label="Поиск по реестру">
          </div>
          <!-- ДГ-8: аннулированные черновики (Р-31) скрыты по умолчанию, но раньше вернуть их
               можно было только через «Статус = Аннулирован», а этой опции в селекте не было:
               список опций строился из ВИДИМЫХ строк, среди которых аннулированных нет.
               Состояние было недостижимо из UI. Теперь это явный переключатель охвата со
               счётчиком скрытого в подписи. -->
          <label class="scope-tgl" id="cancelToggle" style="display:none" title="Аннулированные черновики (Р-31) не удаляются, но по умолчанию не показываются">
            <input type="checkbox" id="chkCancelled" onchange="onShowCancelled(this.checked)">
            <span id="cancelLbl">показывать аннулированные</span>
          </label>
          <div class="spacer"></div>
          <button class="btn btn-tint btn-sm" id="btnCsv" onclick="exportCsv()" title="Выгрузить текущий отфильтрованный реестр в CSV">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            Экспорт CSV
          </button>
          <div class="viewseg" id="viewSeg" role="group" aria-label="Вид списка">
            <button type="button" class="viewseg-btn active" id="segTable" onclick="setListView('table')" title="Таблица">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
              Таблица
            </button>
            <button type="button" class="viewseg-btn" id="segCards" onclick="setListView('cards')" title="Карточки">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
              Карточки
            </button>
          </div>
          <!-- ПЗ-8: размер страницы — в пейджере (ревизия Р-39: справочник даёт дефолт,
               но сам размер регламентом не задан и остаётся личным предпочтением просмотра). -->
          <div class="pager">
            <span id="pagerCount"></span>
            <span class="pager-nav" id="pagerNav"></span>
            <span class="pager-lbl">на странице:</span>
            <select id="pagerSize" onchange="onPageSize(this.value)" title="Строк на странице" aria-label="Строк на странице">
              <option>25</option><option>50</option><option>100</option><option>200</option>
            </select>
          </div>
        </div>
        <!-- ДГ-19: полоса состава отбора. Реестр договоров отвечал на «какие есть договоры»
             построчно, но не отвечал на «что у нас в целом»: сколько зарегистрировано, сколько
             стоит в очереди комитета, у скольких провален гейт. Ответ добывался сортировкой по
             статусу и подсчётом строк глазами. Полоса считает по ОТФИЛЬТРОВАННОМУ набору (та же
             база, что у подвала и пейджера), денег не дублирует — Σ обеспечения живёт в подвале
             (ДГ-16), здесь только состав. Пустых реестров и прочих реестров не касается. -->

        <!-- ПЗ-7: в карточном виде gridWrap скрывается целиком вместе с заголовками, на которых

        <div class="cards-sort" id="cardsSort">

            <thead><tr><th>Кредит</th><th>Заёмщик</th><th>Предмет</th><th>Факт</th><th>Ссылка ПОР</th><th></th></tr></thead>

            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>

        <div class="content" style="overflow:visible;">
          <!-- КП-2: шапка карточки живёт в СВОЁМ слоте, а не внутри первой панели. До волны КП
               `head` был вклеен в panels[0], поэтому чип допуска (Р-52) и дефект-строка (Р-53)
               исчезали на шести вкладках из семи: кликнул по дефекту — уехал на вкладку — список
               остальных дефектов пропал, и к следующему вернуться нечем. Слот перерисовывается
               в openCard() один раз на открытие/переключение вкладки. Прокруткой не прибит:
               развёрнутая шапка предмета — до 200px, приколотая к верху она съела бы экран
               (вариант «компактная липкая полоса» рассматривался и отклонён). -->

<script>
/* ============================================================
   SIDEBAR NAVIGATION
   ============================================================ */
const TREE = [
  { id:"k", label:"Система кредитования", subs:[
    { id:"k-app", label:"Заявки и комиссии", items:[ {label:"Заявки"}, {label:"Комиссии по заявкам"} ]},
    { id:"k-prog", label:"Программы и решения", items:[ {label:"Решение правительства"}, {label:"Кредитные программы"} ]},
    { id:"k-borr", label:"Заёмщики", items:[ {label:"Заёмщики"} ]},
    { id:"k-loan", label:"Кредиты и транши", items:[ {label:"Кредиты"}, {label:"Список траншей"} ]} ]},
  { id:"z", label:"Обеспечение", open:true, subs:[
    { id:"z-all", headerless:true, items:[
      { label:"Предметы залога", active:true },
      { label:"Залоговые договоры" },
      { label:"Поручительство" },
      { label:"Мониторинг залога" },
      { label:"Регламентные параметры залога" } ]} ]},
  { id:"debt", label:"Взыскание задолженности", subs:[
    { id:"debt-all", headerless:true, items:[ {label:"Процессы взыскания"} ]} ]},
  { id:"d", label:"Справочники", subs:[ { id:"d-all", headerless:true, items:[ {label:"Справочники"} ]} ]},
  { id:"r", label:"Отчёты", subs:[ { id:"r-all", headerless:true, items:[ {label:"Отчёты"} ]} ]},
  { id:"adm", label:"Администрирование", subs:[ { id:"adm-all", headerless:true, items:[ {label:"Администрирование"} ]} ]},
  { id:"sec", label:"Безопасность", subs:[ { id:"sec-all", headerless:true, items:[ {label:"Безопасность"} ]} ]},
];
const chev = s => `<span class="chev"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
function renderNav(){
  document.getElementById('nav').innerHTML = TREE.map(g=>{
    const subs = (g.subs||[]).map(s=>{
      const items = (s.items||[]).map(it=>`<a class="nav-item${s.headerless?' headerless':''}${it.active?' active':''}" onclick="navClick('${it.label}')">${it.label}</a>`).join('');
      if(s.headerless) return `<div class="nav-children" style="display:block">${items}</div>`;
      return `<div class="nav-sub${s.open?' open':''}"><button class="nav-toggle" onclick="this.parentNode.classList.toggle('open')">${chev(13)}<span class="lbl">${s.label}</span></button><div class="nav-children">${items}</div></div>`;
    }).join('');
    return `<div class="nav-group${g.open?' open':''}"><button class="nav-toggle" onclick="this.parentNode.classList.toggle('open')">${chev(14)}<span class="lbl">${g.label}</span></button><div class="nav-children">${subs}</div></div>`;
  }).join('');
}
function navClick(l){
  if(l==='Предметы залога'){ setReg('items'); showView('list'); renderList(); }
  else if(l==='Залоговые договоры'){ setReg('contracts'); showView('list'); renderList(); }
  else if(l==='Поручительство'){ setReg('sureties'); showView('list'); renderList(); }
  else if(l==='Мониторинг залога'){ setReg('monitor'); showView('list'); renderList(); }
  else if(l==='Регламентные параметры залога'){ showView('refbook'); renderRefbook(); }
  else toast('Демо-прототип: доступен раздел «Залоговое обеспечение»');
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', a.textContent===l));
}

/* ============================================================
   ДАТЫ И ЧИСЛА
   Сегодняшняя дата вынесена в константу: все «просрочки контроля» —
   ВЫЧИСЛЯЕМЫЙ оверлей от неё, а не хранимый флаг.
   ============================================================ */
/* Т-6: «дата стенда» — не const, а переключаемая точка отсчёта. Демонстрирует заказчику,
   как лента триггеров (просрочки контроля/переоценки/наложения запрета) живёт во времени:
   сдвинул дату — увидел, что «загорается» через месяц. Все «просрочки» — оверлей от TODAY. */
let TODAY = '11.07.2026';
const STAND_DATE_SEED = TODAY;
const d2n = s => { const [d,m,y] = String(s).split('.').map(Number); return new Date(y, m-1, d); };
const n2d = dt => `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}.${dt.getFullYear()}`;
const addMonths = (s,m) => { const dt = d2n(s); dt.setMonth(dt.getMonth()+m); return n2d(dt); };
const isOverdue = s => s && d2n(s) < d2n(TODAY);
const daysLeft  = s => Math.round((d2n(s) - d2n(TODAY)) / 86400000);
const isDate = s => /^\d{2}\.\d{2}\.\d{4}$/.test(String(s||'').trim());
/* Мост «дд.мм.гггг» ↔ ISO «гггг-мм-дд» для нативного <input type="date">.
   Хранение и вывод остаются в дд.мм.гггг — конвертация только на границе поля. */
const d2iso = s => { s = String(s||'').trim(); if(!isDate(s)) return ''; const [d,m,y] = s.split('.'); return `${y}-${m}-${d}`; };
const iso2d = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim()); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(s||'').trim(); };
const fmt  = n => Number(n||0).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
const num  = s => { const v = Number(String(s??'').replace(/\s/g,'').replace(',','.')); return isFinite(v) ? v : NaN; };
const pct  = x => (x*100).toFixed(1).replace('.',',') + '%';
const esc  = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ПЗ-Д2: русское склонение числительных. Один хелпер на весь макет — раньше счётчики
   склеивали `total + ' ' + noun` с жёстким родительным множественного («1 предметов»).
   plural(n, 'предмет','предмета','предметов'). */
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5)   return few;
  if(b === 1)          return one;
  return many;
}
/* Сырое число для выгрузки: без разделителей групп, десятичная запятая (ПЗ-Д12).
   Excel складывает такое поле; fmt() с неразрывным пробелом читается как текст. */
const fmtRaw = n => Number(n||0).toFixed(2).replace('.',',');

/* ============================================================
   СПРАВОЧНИК (регламентируемый администратором): по виду залога —
   залоговый коэффициент (дисконт ликвидности) И интервалы планового
   контроля. Один справочник, не два — обследование и переоценка имеют
   разные события, но ОДИН механизм расписания (спека §8).
   ============================================================ */
/* Признаки вида залога (Р-1/Р-2/Р-6 — Положение §2.3–2.4, §3.5, §8):
   liquid — ликвидный вид (недвижимость, кредитный портфель) → базовый порог покрытия 120%;
            неликвидные движимые → 150% + доля ликвида ≥ 80% (см. requiredCover / liquidShare).
   movable — движимое имущество (техника, ТМЦ). На этот признак смотрят: гейт возраста и
            страховки техники (Р-7), матрица периодичности обследования (Р-3), стоп-лист §3.5 (Р-2).
   liquidityRank — ранг ликвидности для гейта замены (Р-6, §8): замена ликвидного залога на
            менее ликвидный не допускается. Числовая шкала, правится администратором в справочнике.
   Периодичность ОБСЛЕДОВАНИЯ здесь НЕ хранится — она в SURVEY_MATRIX (группа
   платёжеспособности × движимость, Прил.2 §2.3). reval — интервал ПЕРЕОЦЕНКИ —
   положением НЕ регламентирован: это внутренний параметр (Р-3 п.5), не смешивать с обследованием.
   «Кредитный портфель» — ликвидный вид залога в справочнике (liquid:true, Прил.1 §2.3).
   tech — физически изнашиваемая техника (транспорт/оборудование/сельхозтехника): на этот
   признак смотрит гейт формы «Год выпуска»/«Страховой полис» (Р-7, isTech). Он у́же, чем
   movable — «Кредитный портфель», «Ценные бумаги», «Право аренды» тоже движимые (Р-6, гейт
   замены), но не физический актив, который стареет и страхуется. */
const KINDS = {
  'Недвижимое имущество':  { k:0.7, reval:24, organ:'Госрегистр (недвижимое имущество)', liquid:true,  movable:false, liquidityRank:5 },
  'Транспортное средство': { k:0.5, reval:12, organ:'ГРС (реестр транспортных средств)', liquid:false, movable:true,  liquidityRank:3, tech:true },
  'Оборудование':          { k:0.5, reval:12, organ:'Реестр залогов движимого имущества', liquid:false, movable:true,  liquidityRank:3, tech:true },
  'Сельхозтехника':        { k:0.5, reval:12, organ:'Реестр залогов движимого имущества', liquid:false, movable:true,  liquidityRank:3, tech:true },
  'Товары в обороте':      { k:0.4, reval:6,  organ:'Реестр залогов движимого имущества', liquid:false, movable:true,  liquidityRank:1 },
  /* «Скот / поголовье» удалён — §3.5 прямо запрещает приём в залог с/х животных (Р-2, PROHIBITED_KINDS). */
  'Кредитный портфель':         { k:0.7, reval:12, organ:'Единый гос. реестр прав требования на движимое имущество', liquid:true,  movable:true,  liquidityRank:5 },
  'Имущественный комплекс':     { k:0.7, reval:24, organ:'Госрегистр (недвижимое имущество)', liquid:true,  movable:false, liquidityRank:5 },
  'Незавершённое строительство':{ k:0.6, reval:24, organ:'Госрегистр (недвижимое имущество)', liquid:true,  movable:false, liquidityRank:4 },
  'Ценные бумаги':              { k:0.5, reval:12, organ:'Реестр залогов движимого имущества', liquid:false, movable:true,  liquidityRank:4 },
  'Право аренды':               { k:0.4, reval:12, organ:'по виду арендованного имущества', liquid:false, movable:true,  liquidityRank:2 },
};
const isLiquid  = it => Boolean((KINDS[it.kind]||{}).liquid);
const isMovable = it => Boolean((KINDS[it.kind]||{}).movable);
const isTech    = it => Boolean((KINDS[it.kind]||{}).tech);   // техника: возраст/страховка (Р-7)
/* Коэффициент вида (Прил.1 §2.1). Живёт рядом с KINDS, а не в вычисляемом слое ниже:
   normalizeItem выполняется РАНЬШЕ него (TDZ) и обязан фиксировать коэффициент в записи
   переоценки (КП-12/КП-Д4). Одна точка правды на весь файл. */
const coefOf = kind => (KINDS[kind]||{k:0.5}).k;

/* СТОП-ЛИСТ §3.5 (Р-2): виды/предметы, НЕ принимаемые в залог. Регламентная константа,
   показывается в справочнике read-only. «Товары в обороте» принимаются, но специалист
   подтверждает, что предмет не подпадает под ограничения (см. saveNewItem). */
const PROHIBITED_KINDS = [
  'Сельскохозяйственные животные (скот, поголовье)',
  'Земли сельскохозяйственного назначения',
  'Скоропортящиеся товары',
  'Товарно-материальные ценности, не пользующиеся спросом',
  'Физически изношенное / морально устаревшее оборудование',
  'Товары одного наименования в большом количестве',
  'Изъятое из оборота / ограниченное в обороте имущество',
];
/* Р-18 (Прил.1 §3.5): стоп-лист как ИСПОЛНЯЕМАЯ проверка — PROHIBITED_KINDS выше остаётся
   read-only справочной витриной (см. refbookInner), эта функция — рядом с каждым пунктом
   стоп-листа проставляет реализующую валидацию. Применяется дважды: при приёме предмета
   (saveNewItem) и повторно на гейте регистрации залогового договора (openRegister/doRegister),
   т.к. предмет мог быть принят до Р-18 либо его состояние могло измениться между приёмом
   и регистрацией. Земля с/х назначения и износ ≥ предела — жёсткие отказы без права
   комитета на допуск (committeeCanOverride:false); прочие пункты блокируют без этого поля. */
let WEAR_LIMIT = 70;
function stopListCheck(f){
  /* КП-4 (ADR 0008, §4.1): вещь, уже обременённая залогом в пользу третьего лица, в залог
     НЕ ПРИНИМАЕТСЯ — Холдинг всегда залогодержатель первой очереди. Раньше такое обременение
     заводилось журналом priorLiens и давало лишь `warn`, а покрытие считалось по полной
     залоговой стоимости, хотя до нас в очереди стоял чужой кредитор. Жёсткий отказ без права
     комитета на допуск: очерёдность — не тот параметр, который допускают обоснованием. */
  if (f.thirdPartyLien === true)
    return { block:true, committeeCanOverride:false, msg:'Приём отклонён (§4.1, Закон КР «О залоге»): предмет обременён залогом в пользу третьего лица. Холдинг принимает имущество только в первую очередь — обременение должно быть снято до приёма.' };
  if (f.landPurpose === 'сельскохозяйственного назначения')
    return { block:true, committeeCanOverride:false, msg:'Приём отклонён (Прил.1 §3.5, Закон КР «О залоге» п.3 ст.6): земли сельскохозяйственного назначения в залог не принимаются.' };
  if (typeof f.wearPct === 'number' && f.wearPct >= WEAR_LIMIT)
    return { block:true, committeeCanOverride:false, msg:`Приём отклонён (Прил.1 §3.5): физический износ ${f.wearPct}% при пределе ${WEAR_LIMIT}%.` };
  if (f.morallyObsolete === true) return { block:true, msg:'Приём отклонён (Прил.1 §3.5): морально устаревшее оборудование.' };
  if (f.circulable === false) return { block:true, msg:'Приём отклонён (Прил.1 §3.5): имущество изъято/ограничено в обороте.' };
  // ТМЦ — три флага; каждый снятый блокирует с цитатой пункта
  if (f.perishable === true)     return { block:true, msg:'Приём отклонён (Прил.1 §3.5): скоропортящиеся товары.' };
  if (f.lowDemand === true)      return { block:true, msg:'Приём отклонён (Прил.1 §3.5): товарно-материальные ценности, не пользующиеся спросом.' };
  if (f.singleNameBulk === true) return { block:true, msg:'Приём отклонён (Прил.1 §3.5): товары одного наименования в большом количестве.' };
  return { block:false };
}
/* Обратное отображение: сохранённый предмет реестра → форма stopListCheck. Единый источник
   истины для saveNewItem (приём) и гейта регистрации (повторная проверка). Предметы, заведённые
   до Р-18 (сид-данные), не несут этих полей — отсутствующее поле возвращается как undefined,
   а не как блокирующее значение, поэтому такие предметы гейт НЕ блокирует (см. guard'ы
   === true / === false / typeof в stopListCheck). */
function stopFieldsOf(it){
  return {
    landPurpose: it.landPurpose, wearPct: it.wearPct, morallyObsolete: it.morallyObsolete,
    circulable: it.circulable, perishable: it.perishable, lowDemand: it.lowDemand,
    singleNameBulk: it.singleNameBulk,
    /* КП-4: обременение в пользу третьего лица. Как и прочие поля стоп-листа, у записей,
       заведённых до волны КП, оно undefined — гейт такие предметы НЕ блокирует (та же
       политика, что у landPurpose/wearPct: отсутствие сведений ≠ подтверждённое нарушение). */
    thirdPartyLien: it.thirdPartyLien,
  };
}

/* Р-16 (ПОЛ §6.4 п.7): способ хранения предмета залога — обязательное поле формы
   регистрации (openRegister/doRegister). Допустимы только два значения; предмет либо
   остаётся у залогодателя (обычный режим обследования), либо передаётся залогодержателю
   (интервал обследования не применяется — см. openRegister). */
function custodyValid(v){ return v === 'у залогодателя' || v === 'у залогодержателя'; }
/* Р-16 (ПОЛ §6.4 п.6): предмет залога «Право аренды» — срок аренды должен покрывать срок
   кредита, иначе по окончании аренды обеспечение выбывает раньше погашения. Даты парсятся
   тем же d2n, что и везде в файле (единственный парсер дат в кодовой базе — своего
   parseDate здесь нет). Если хотя бы одна дата отсутствует/не парсится — сравнивать не с
   чем, предупреждение не показывается (в сидовых данных КРЕДИТ вообще не несёт срока
   погашения — см. CREDITS ниже; это осознанно, не баг). */
function leaseCoversCredit(item, credit){
  const lt = item && item.leaseTill ? d2n(item.leaseTill) : null;
  const ct = credit && credit.creditTill ? d2n(credit.creditTill) : null;
  if(!lt || isNaN(lt) || !ct || isNaN(ct)) return { warn:false };
  const covers = lt >= ct;
  return covers ? { warn:false } : { warn:true, msg:'Срок аренды истекает раньше срока кредита (ПОЛ §6.4 п.6) — требуется решение комитета' };
}

/* КЛАССИФИКАТОР ИСХОДА ОБСЛЕДОВАНИЯ (6 значений, дословно из прежней системы,
   04-collateral.md §10). effect ветвит модель: ok → плановый сдвиг; reval → досрочная
   переоценка (needReval); lost → утрата (залоговая = 0). */
const SURVEY_RESULTS = [
  { v:'Хорошее',                                effect:'ok'   },
  { v:'Удовлетворительное',                     effect:'ok'   },
  { v:'Неудовлетворительное (повреждённое)',    effect:'reval'},
  { v:'Неудовлетворительное (требует ремонта)', effect:'reval'},
  { v:'Неудовлетворительное (аварийное)',       effect:'reval'},
  { v:'Неудовлетворительное (утраченное)',      effect:'lost' },
];
/* effect по строке исхода — принимает и новые 6 значений, и старые демо-строки
   («в норме» / «ухудшение состояния» / «утрата / не найден»). */
const surveyEffect = out => {
  const hit = SURVEY_RESULTS.find(r=>r.v===out); if(hit) return hit.effect;
  if(out==='в норме') return 'ok';
  if(out==='утрата / не найден') return 'lost';
  return 'reval';
};

/* Р-15 (Прил.2 §2.4): акт обследования — валидный гейт сохранения. Заключение и
   фотофиксация (§2.3) обязательны всегда; при одностороннем акте — подтверждённое
   наличие имущества, иначе — подписи представителя ГФХ и залогодателя. */
function surveyValidate(a){
  if (!a.conclusion || !a.conclusion.trim()) return { ok:false, msg:'Заключение обязательно (Прил.2 §2.4)' };
  if (!a.photos || !a.photos.length) return { ok:false, msg:'Фотофиксация обязательна (Прил.2 §2.3)' };
  if (a.oneSided) { if (!a.presenceConfirmed) return { ok:false, msg:'Односторонний акт допустим только при подтверждённом наличии имущества (Прил.2 §2.4)' }; }
  else { const s = a.signers||[]; if (!(s.includes('ГФХ') && s.includes('залогодатель'))) return { ok:false, msg:'Требуются подписи представителя ГФХ и залогодателя (Прил.2 §2.4)' }; }
  return { ok:true };
}

/* Р-46/Р-47: синтетические дефолты демо-стенда. Полис и комплект документов — норма при
   приёме предмета в залог, поэтому сид, не несущий этих полей (записи, заведённые до
   появления осей), достраивается до нормы. Реквизиты производны от даты отчёта об оценке,
   чтобы «годен до» считался от осмысленной даты, а не от даты загрузки стенда. */
function autoPolicy(it){
  const from = it.apprDate || TODAY;
  return { present:true, policy:'ИМ-'+String(it.id).replace(/\D+/g,'')+'/'+from.slice(6), till: addMonths(from, 18) };
}
function autoFiles(it){
  const who = 'Залоговый специалист', short = String(it.id).replace(/\D+/g,'');
  /* Полис не «дорисовывается», если предмет намеренно не застрахован (П-003): досье и ось
     страхования обязаны говорить одно и то же. */
  const kindReq = (FILE_REQ_COMMON.concat(FILE_REQ_BY_KIND[it.kind] || []))
    .filter(r => r.t !== 'Страховой полис'
              || (INSURANCE_KINDS.includes(it.kind) && it.insured && it.insured.present));
  return kindReq.map((r, i) => {
    const isAppr = r.t === 'Отчёт об оценке', isPol = r.t === 'Страховой полис';
    const docDate = isAppr ? (it.apprDate || TODAY)
                  : isPol  ? ((it.insured && it.insured.till) ? addMonths(it.insured.till, -12) : (it.apprDate || TODAY))
                  : (it.apprDate || TODAY);
    const docNo = isAppr ? (it.apprReport || 'ОЦ-'+short)
                : isPol  ? ((it.insured && it.insured.policy) || 'ИМ-'+short)
                : 'ДОК-'+short+'/'+(i+1);
    return { tag:r.t, name:'scan-'+short+'-'+(i+1)+'.pdf', docNo, docDate, when:docDate, who,
             ref: isAppr ? 'reval:last' : '' };
  });
}
function normalizeItem(it){
  const d = ITEM_DEMO[it.id] || {};
  it.pledgerType   = it.pledgerType   || d.pledgerType || 'Прочее ЮЛ';
  it.consents      = it.consents      || d.consents || [];
  it.restoreNotice = it.restoreNotice ?? d.restoreNotice ?? null;
  it.qty      = it.qty      ?? d.qty ?? 1;                 // кол-во (legacy quantity)
  it.unit     = it.unit     || d.unit || 'ед.';            // ед.изм. (legacy quantityType)
  it.legalDoc = it.legalDoc || d.legalDoc || '';           // правоуст. документ (отдельно от отчёта оценщика)
  it.details  = it.details  || d.details || {};            // type-specific детали (KIND_FIELDS)
  it.files    = it.files    || d.files || [];              // вложения/сканы (Р-47: тег = тип документа комплекта)
  /* КП-4 (ADR 0008): поля priorLiens больше нет. Холдинг — залогодержатель ПЕРВОЙ очереди,
     обременённая в пользу третьего лица вещь в залог не принимается (§4.1). Обременение
     ловится стоп-листом на приёме и на гейте регистрации (stopListCheck.thirdPartyLien),
     а не журналом очерёдности. Отменённое решение — Р-49. */
  /* КП-14 (ADR 0009): ВАЛЮТА ОЦЕНКИ — реквизит вещи. Раньше выводилась из валют
     обеспечиваемых кредитов (Р-44), из-за чего одно и то же число меняло смысл при
     привязке к кредиту в другой валюте, а при нескольких валютах бралась первая
     попавшаяся из Set (КП-Д6). Теперь вводится при приёме и живёт на предмете. */
  it.ccy = it.ccy || d.ccy || 'KGS';
  /* КП-5: аннулирование ошибочной записи — пометка, не удаление (паттерн Р-31). */
  it.cancelled = it.cancelled ?? d.cancelled ?? null;
  /* КП-11: понижение залоговой — ЖУРНАЛ, как revals/surveys/consents, а не одиночный слот.
     До волны КП saveOverride перезаписывал предыдущее решение, а clearOverride его обнулял:
     обоснование, автор и дата прежнего понижения исчезали как структурные данные. Сидовый
     объект override мигрируется в первую запись журнала. */
  if(!it.overrides) it.overrides = it.override ? [{ ...it.override, voided:null }] : [];
  delete it.override;
  /* КП-12/КП-Д4: коэффициент вида фиксируется В ЗАПИСИ переоценки. Столбец «Залоговая
     (расч.)» считался сегодняшним coefOf(kind), а коэффициент правится из справочника
     (KINDS[k].k) — поменяли его, и весь исторический столбец переписывался задним числом. */
  (it.revals || []).forEach(r => { if(r.coef == null) r.coef = coefOf(it.kind); });
  /* Р-48: оценщик как реквизит отчёта (кто оценивал + лицензия), а не только номер отчёта. */
  it.appraiser   = it.appraiser   || d.appraiser   || '';
  it.apprLicense = it.apprLicense || d.apprLicense || '';
  if(isTech(it)){
    it.year   = it.year   ?? d.year ?? null;
    it.origin = it.origin || d.origin || 'СНГ';
  }
  /* Р-46: полис — у всех страхуемых видов, а не только у техники (INSURANCE_KINDS, §3.4).
     Прямая проверка по списку, а не через insuranceRequired: normalizeItem выполняется на
     верхнем уровне скрипта РАНЬШЕ, чем инициализируются const'ы вычисляемого слоя (TDZ).
     ДЕФОЛТ — полис ЕСТЬ и действует: страхование обязательно при приёме, поэтому «нет полиса»
     на стенде должно быть намеренным дефектом конкретной записи (П-003), а не фоном по всему
     реестру — иначе новая ось страхования забивает мониторинг 19 одинаковыми триггерами. */
  if(INSURANCE_KINDS.includes(it.kind))
    it.insured = it.insured || d.insured || autoPolicy(it);
  /* Р-47: тот же принцип для комплекта документов — по умолчанию комплект собран (синтетика
     от даты отчёта об оценке), незакрытые позиции задаются явно в ITEM_DEMO (П-002). */
  if(!it.files.length) it.files = autoFiles(it);
  /* Р-17: роль обеспечения (основной/дополнительный) — только для движимых видов, кроме
     «Товары в обороте» (та же граница, что и у формы приёма, см. niKindChange/saveNewItem). */
  if(isMovable(it) && it.kind !== 'Товары в обороте') it.securityRole = it.securityRole || 'основной';
  if(!it.prereqs){
    const absent = new Set(d.prereqAbsent || []);
    const mk = key => ({ present: !absent.has(key), doc: absent.has(key) ? '' : 'приложено при оформлении' });
    it.prereqs = { ownerConsent:mk('ownerConsent'), spouseConsent:mk('spouseConsent'), encumbranceCert:mk('encumbranceCert') };
  }
  return it;
}

/* Ребро M:N читается с двух сторон. Аксессоры возвращают ВСЕ договоры (любой статус);
