      <label class="chk col-span" id="svPresenceWrap" style="display:none"><input type="checkbox" id="svPresence"> Подтверждено наличие имущества по факту осмотра</label>
      <div class="field col-span" id="svSignersWrap"><span class="flabel">Подписанты (участники обследования)</span>
        <label class="chk"><input type="checkbox" id="svSignGfh"> Представитель ГФХ</label>
        <label class="chk"><input type="checkbox" id="svSignPledgor"> Залогодатель</label>
        <label class="chk"><input type="checkbox" id="svSignBorrower"> Заёмщик</label>
        <label class="chk"><input type="checkbox" id="svSignPoa"> По доверенности</label>
        <div class="control" style="margin-top:6px"><input id="svPoaReq" placeholder="Реквизиты доверенности"></div>
      </div>
      <div class="field col-span"><span class="flabel">ФИО / должность представителя ГФХ</span>
        <div class="control"><input id="svGfhName" placeholder="ФИО"></div>
        <div class="control" style="margin-top:6px"><input id="svGfhPost" placeholder="Должность"></div>
      </div>
    </div>
    </div>${mfoot('Зарегистрировать акт','saveSurvey(\''+id+'\')')}</div>`);
  const syncOneSided = () => {
    const os = (document.getElementById('svOneSided')||{}).checked;
    document.getElementById('svPresenceWrap').style.display = os ? 'flex' : 'none';
    document.getElementById('svSignersWrap').style.display = os ? 'none' : '';
  };
  document.getElementById('svOneSided').addEventListener('change', syncOneSided); syncOneSided();
}
function svSigners(){
  const s = [];
  if((document.getElementById('svSignGfh')||{}).checked) s.push('ГФХ');
  if((document.getElementById('svSignPledgor')||{}).checked) s.push('залогодатель');
  if((document.getElementById('svSignBorrower')||{}).checked) s.push('заёмщик');
  if((document.getElementById('svSignPoa')||{}).checked) s.push('по доверенности'+(val('svPoaReq').trim()?' ('+val('svPoaReq').trim()+')':''));
  return s;
}
function saveSurvey(id){
  const it = item(id), date = iso2d(val('svDate')), act = val('svAct').trim(), out = val('svOut'), note = val('svNote').trim();
  if(!act) return toast('Укажите номер акта','warn');
  { const ev = eventDateValid(date, {notBefore: lastSurveyLive(it), notBeforeLabel:'предыдущее обследование'}); if(!ev.ok) return toast(ev.msg,'warn'); }
  const conclusion = val('svConclusion').trim();
  const photosEl = document.getElementById('svPhotos');
  const photos = (photosEl && photosEl.files) ? Array.from(photosEl.files).map(f=>f.name) : [];
  const oneSided = !!(document.getElementById('svOneSided')||{}).checked;
  const presenceConfirmed = !!(document.getElementById('svPresence')||{}).checked;
  const signers = svSigners();
  const gfhName = val('svGfhName').trim(), gfhPost = val('svGfhPost').trim();
  const v = surveyValidate({conclusion, photos, oneSided, presenceConfirmed, signers});
  if(!v.ok) return toast(v.msg,'warn');
  const effect = surveyEffect(out);                 // 6-значный классификатор → эффект в модели
  it.surveys.push({date, act, outcome:out, effect, note, conclusion, photos, oneSided, presenceConfirmed, signers, gfhName, gfhPost});
  it.lastSurvey = date;
  if(effect === 'ok'){
    it.needReval = false; it.lost = false; it.restoreNotice = null;   // возврат в норму снимает извещение/утрату
    const ns = nextSurvey(it);
    hist(it, `Обследование ${act} от ${date}: ${out} (в норме). Следующее — ${ns || '(по матрице/банкрот)'}`);
    toast('Акт зарегистрирован. Следующее обследование: '+(ns||'по матрице'),'ok');
  } else if(effect === 'reval'){
    it.needReval = true; it.lost = false; it.restoreNotice = null;   // новый плохой исход → требуется новое извещение (Р-8)
    hist(it, `Обследование ${act} от ${date}: ${out} → регламентный шаг: требуется досрочная переоценка + извещение о восполнении (§2.5) до обращения во взыскание`);
    toast('Ухудшение зафиксировано → досрочная переоценка + извещение о восполнении (§2.5); взыскание — только по истечении срока/отказу','warn');
  } else {
    it.lost = true; it.restoreNotice = null;
    hist(it, `Обследование ${act} от ${date}: ${out} — УТРАТА. Предмет выбыл, залоговая = 0. Регламентный шаг: извещение о восполнении (§2.5) до обращения во взыскание`);
    toast('Утрата зафиксирована → оформите извещение о восполнении (§2.5); взыскание — только по истечении срока/отказу','warn');
  }
  closeModal(); refresh();
}

/* ---------- СТОРНИРОВАНИЕ ЖУРНАЛЬНОЙ ЗАПИСИ (Р-33) ----------
   Записи журналов (переоценка / обследование / согласие / извещение) не удаляются
   физически — помечаются voided:{by,date,reason}. Роль: заведующий отделом. Производные
   скаляры (it.appraised/apprDate/apprReport/lastReval, it.lastSurvey) не читают массивы,
   поэтому при сторно их надо пересчитать по ПОСЛЕДНЕЙ НЕсторнированной записи. У предмета
   должна остаться базовая оценка и опорный акт обследования — сторнировать единственную
   действующую переоценку/обследование нельзя. */
function voidGenitive(kind){
  return kind==='reval' ? 'переоценки' : kind==='survey' ? 'обследования'
       : kind==='consent' ? 'согласия' : 'извещения о восполнении';
}
function voidRecordOf(it, kind, idx){
  /* КП-11: журнал понижений — четвёртая сторнируемая серия наряду с revals/surveys/consents.
     Множественное число даёт `overrides`, поэтому общее правило it[kind+'s'] работает. */
  return kind==='restoreNotice' ? it.restoreNotice : ((it[kind+'s']||[])[idx]);
}
function voidBlockedReason(it, kind){
  if(kind==='reval'   && livesReval(it).length  <= 1) return 'Нельзя сторнировать единственную действующую оценку — у предмета должна остаться базовая стоимость';
  if(kind==='survey'  && livesSurvey(it).length <= 1) return 'Нельзя сторнировать единственный действующий акт — у предмета должна остаться опорная дата обследования';
  return '';
}
function openVoidRecord(itemId, kind, idx){
  if(!canHeadOfUnit()) return denyEdit();
  const it = item(itemId), rec = voidRecordOf(it, kind, idx);
  if(!rec || rec.voided) return toast('Запись не найдена или уже сторнирована','warn');
  const blocked = voidBlockedReason(it, kind);
  if(blocked) return toast(blocked,'warn');
  const desc = kind==='reval'    ? `переоценка ${rec.date}, оценочная ${fmt(rec.appraised)} (${esc(rec.report)})`
             : kind==='override' ? `понижение залоговой до ${fmt(rec.value)} от ${rec.date} (${esc(rec.doc||'без реквизита')})`
             : kind==='survey'   ? `акт ${esc(rec.act)} от ${rec.date}, исход «${esc(rec.outcome)}»`
             : kind==='consent'  ? `согласие «${esc(rec.action)}» от ${rec.date} (${esc(rec.doc||'')})`
             :                     `извещение ${esc(rec.doc||'')} от ${rec.date}`;
  modal(`<div class="modal form">${mhead('Сторнирование '+voidGenitive(kind)+' · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${ro('Сторнируемая запись', desc)}
      <div class="field req col-span"><span class="flabel">Причина сторнирования</span>
        <textarea id="vdReason" class="note-area"></textarea></div>
    </div>
    <div class="warn-inline"><span>Запись не удаляется — помечается сторнированной. Производные (оценочная стоимость / опорные даты) пересчитаются по последней действующей записи.</span></div>
    </div><div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-tint danger" onclick="saveVoidRecord('${itemId}','${kind}',${idx})">Сторнировать</button></div></div>`);
}
function saveVoidRecord(itemId, kind, idx){
  if(!canHeadOfUnit()) return denyEdit();
  const it = item(itemId), reason = val('vdReason').trim();
  if(!reason) return toast('Укажите причину сторнирования','warn');
  const rec = voidRecordOf(it, kind, idx);
  if(!rec || rec.voided) return toast('Запись не найдена или уже сторнирована','warn');
  const blocked = voidBlockedReason(it, kind);
  if(blocked) return toast(blocked,'warn');
  rec.voided = { by:role, date:TODAY, reason };
  if(kind==='reval'){
    const lives = livesReval(it), last = lives[lives.length-1];
    it.appraised = last.appraised; it.apprDate = last.date; it.apprReport = last.report; it.lastReval = last.date;
    /* КП-Д1: сторно ОТКАТЫВАЕТ и авто-приложенный отчёт. saveReval кладёт отчёт в досье
       (Р-47), а сторно раньше трогало только apprReport/apprDate — файл оставался, и
       поскольку fileOfType берёт последний по docDate, комплект закрывался документом
       ОТМЕНЁННОЙ переоценки: «Стоимость» показывала откатившийся отчёт, досье — сторнированный,
       apprStale считался от одной даты, fileStatusOf — от другой. */
    const orphan = (it.files || []).find(f => !f.detached && f.tag === 'Отчёт об оценке' && f.docNo === rec.report && f.docDate === rec.date);
    if(orphan) orphan.detached = { by:role, date:TODAY, reason:`сторнирована переоценка ${rec.date}` };
    hist(it, `Сторнирована переоценка ${rec.date} (${esc(rec.report)}): «${reason}». Оценочная откатилась к ${fmt(it.appraised)} от ${it.lastReval}. Залоговая (расч.) → ${fmt(calcPledge(it))}${orphan?`. Отчёт ${esc(rec.report)} откреплён от досье`:''}`, 'val');
    toast('Переоценка сторнирована. Оценочная: '+fmt(it.appraised),'ok');
  } else if(kind==='override'){
    /* КП-11: сторно понижения возвращает предыдущее действующее решение, а если его нет —
       расчётную залоговую. Отдельной кнопки «Отменить решение» больше не нужно. */
    const back = activeOverride(it);
    hist(it, `Сторнировано понижение залоговой ${fmt(rec.value)} от ${rec.date} (${esc(rec.doc||'без реквизита')}): «${reason}». Действующая залоговая → ${fmt(pledgeValue(it))}${back?` (предыдущее решение от ${back.date})`:' (снова расчётная)'}`, 'val');
    toast('Решение сторнировано. Залоговая: '+fmt(pledgeValue(it)),'ok');
  } else if(kind==='survey'){
    it.lastSurvey = lastSurveyLive(it);
    hist(it, `Сторнировано обследование ${esc(rec.act)} от ${rec.date}: «${reason}». Опорная дата обследования откатилась к ${it.lastSurvey||'—'}`, 'srv');
    toast('Обследование сторнировано','ok');
  } else if(kind==='consent'){
    hist(it, `Сторнировано согласие «${esc(rec.action)}» от ${rec.date}: «${reason}». Запрет на отчуждение оставался в силе — сторно согласия его не меняет`, 'ban');
    toast('Согласие сторнировано','ok');
  } else {
    hist(it, `Сторнировано извещение о восполнении ${esc(rec.doc||'')} от ${rec.date}: «${reason}»`, 'srv');
    toast('Извещение сторнировано','ok');
  }
  closeModal(); refresh();
}

/* ---------- КП-5/КП-6/КП-7: ЖИЗНЕННЫЙ ЦИКЛ ПРЕДМЕТА ----------
   До волны КП карточка умела только вести живую вещь. Три дыры:
   • Баннер orphan предлагал «Привяжите его к договору либо аннулируйте» — действия
     «аннулировать» не существовало ни кнопкой, ни функцией, ни статусом (КП-Д9).
   • `lost` ставился ТОЛЬКО актом обследования: утрату по решению суда, справке органа
     или страховому случаю зафиксировать было нечем — сгоревший склад пришлось бы
     осматривать по месту нахождения.
   • `pledger` не правился нигде, хотя CONTEXT.md прямо говорит «Залогодатель — реквизит
     предмета», а право собственности переходит (наследование, продажа с нашего согласия,
     реорганизация).
   Все три — события с основанием и следом в истории, физического удаления нет. ---------- */

/* КП-5: гейт аннулирования. Аннулировать можно ТОЛЬКО ошибку ввода — запись, за которой
   нет ни долей, ни запрета, ни следа обременения. Всё прочее — живая история, её стирают
   не аннулированием, а событиями (выбытие, освобождение). */
function cancelBlockedReason(it){
  if(allocatedLegal(it.id) + allocatedDraft(it.id) > 0) return 'По предмету закреплены доли — сперва выведите его доп соглашением';
  if(it.ban) return 'По предмету действует запрет на отчуждение — сперва снимите его актом в органе';
  if(it.everPledged) return 'Предмет уже был в залоге — история обременения не аннулируется, предмет остаётся освобождённым';
  if(it.lost) return 'Предмет отмечен утраченным — это событие, а не ошибка ввода';
  return '';
}
function openCancelItem(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  if(it.cancelled) return toast('Предмет уже аннулирован','warn');
  const blocked = cancelBlockedReason(it);
  if(blocked) return toast(blocked,'warn');
  modal(`<div class="modal form">${mhead('Аннулирование предмета · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${ro('Предмет', `${it.id} · ${it.name}`)}
      ${fsel('caReason','Причина', ['Ошибочно заведён','Дубль существующей записи','Приём отменён (стоп-лист §3.5)','Заведён не тем видом залога'], 'Ошибочно заведён', true)}
      <div class="field req col-span"><span class="flabel">Основание</span>
        <textarea id="caNote" class="note-area"></textarea></div>
    </div>
    <div class="warn-inline"><span>Запись <b>не удаляется</b> — помечается аннулированной и уходит из реестра, подбора обеспечения и расчётов. Восстановлению из интерфейса не подлежит.</span></div>
    </div><div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-tint danger" onclick="saveCancelItem('${id}')">Аннулировать</button></div></div>`);
}
function saveCancelItem(id){
  if(!canCurate()) return denyEdit();
  const it = item(id), note = val('caNote').trim(), reason = val('caReason');
  if(it.cancelled) return toast('Предмет уже аннулирован','warn');
  const blocked = cancelBlockedReason(it);
  if(blocked) return toast(blocked,'warn');
  if(!note) return toast('Укажите основание аннулирования','warn');
  it.cancelled = { by: role, date: TODAY, reason, note };
  hist(it, `Предмет аннулирован: ${reason}. Основание: «${note}»`, 'lc');
  closeModal(); toast('Предмет аннулирован','ok'); showView('list'); refresh();
}

/* КП-6: утрата по документу. Тот же эффект, что у обследования с исходом «утрата»
   (залоговая обнуляется, поднимается недостаточность обеспечения), но источник факта —
   внешний документ, а не осмотр. Извещение о восполнении (Р-8, Прил.2 §2.5) оформляется
   после этого тем же путём, что и после обследования. */
const LOST_GROUNDS = ['Решение суда','Справка регистрирующего органа','Акт страхового случая','Изъятие уполномоченным органом','Постановление о возбуждении дела','Иной документ'];
function openMarkLost(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  if(it.lost) return toast('Предмет уже отмечен утраченным','warn');
  modal(`<div class="modal form">${mhead('Утрата предмета по документу · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fsel('mlGround','Основание', LOST_GROUNDS, LOST_GROUNDS[0], true)}
      ${fin('mlDoc','Реквизит документа','', true, true)}
      ${fdate('mlDate','Дата документа', TODAY, true)}
      <div class="field req col-span"><span class="flabel">Обстоятельства утраты</span>
        <textarea id="mlNote" class="note-area"></textarea></div>
    </div>
    <div class="warn-inline"><span>Залоговая стоимость предмета обнуляется, покрытие по обеспечиваемым кредитам пересчитывается. Обследование при этом <b>не подменяется</b>: акт осмотра — отдельный документ, здесь фиксируется факт из внешнего источника.</span></div>
    </div><div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-tint danger" onclick="saveMarkLost('${id}')">Отметить утрату</button></div></div>`);
}
function saveMarkLost(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  if(it.lost) return toast('Предмет уже отмечен утраченным','warn');
  const ground = val('mlGround'), doc = val('mlDoc').trim(), date = iso2d(val('mlDate')), note = val('mlNote').trim();
  if(!doc) return toast('Укажите реквизит документа','warn');
  const dv = eventDateValid(date, {});
  if(!dv.ok) return toast(dv.msg,'warn');
  if(!note) return toast('Опишите обстоятельства утраты','warn');
  const acs0 = CONTRACTS.filter(isActive);
  const before = acs0.flatMap(c=>c.credits.map(cid=>({cid, ok:coverage(acs0, cid).ok})));
  it.lost = true;
  it.lostBy = { ground, doc, date, note, by: role, when: TODAY };
  (it.files ||= []).push({ tag:'Иное', name:`Утрата_${doc.replace(/[^\wА-Яа-я\-]+/g,'_')}.pdf`, docNo:doc, docDate:date, when:TODAY, who:role });
  hist(it, `Предмет отмечен утраченным по документу: ${ground} ${doc} от ${date}. «${note}». Залоговая стоимость исключена из покрытия`, 'lc');
  closeModal();
  const acs1 = CONTRACTS.filter(isActive);
  const dropped = acs1.flatMap(c=>c.credits.map(cid=>({cid, ok:coverage(acs1, cid).ok})))
                      .filter(a => !a.ok && (before.find(b=>b.cid===a.cid)||{ok:true}).ok);
  toast('Утрата зафиксирована. Оформите извещение о восполнении (Прил.2 §2.5)','ok');
  if(dropped.length) toast('ТРИГГЕР «недостаточность обеспечения»: покрытие упало ниже порога по '+dropped.map(d=>d.cid).join(', '),'warn');
  refresh();
}

/* ---------- ИСПРАВЛЕНИЕ РЕКВИЗИТОВ (Р-30) ----------
   Правка нестоимостных реквизитов с обязательным основанием и следом «было → стало» в
   истории. Стоимостные реквизиты (оценочная/залоговая) правятся только событиями
   (переоценка / решение комиссии), не тут. Предмет — куратор; юр-реквизиты договора —
   заведующий отделом. */
function fieldDiffs(pairs){
  return pairs.filter(p => String(p.before ?? '') !== String(p.after ?? ''))
              .map(p => `${p.label}: «${p.before || '—'}» → «${p.after || '—'}»`);
}
/* Часть деталей продублирована на верхнем уровне предмета, потому что участвует в расчётах и
   контролях, а не только в фактографии: leaseTill читает leaseCoversCredit(item, credit)
   (ПОЛ §6.4 п.6). Правка details.leaseTill без этой синхронизации оставила бы контроль на
   старой дате — поэтому зеркало обновляется единой точкой и при создании, и при исправлении. */
function syncItemDetailMirrors(it){
  if(it.kind === 'Право аренды') it.leaseTill = (it.details || {}).leaseTill || '';
  return it;
}
/* Р-30: type-specific детали предмета (KIND_FIELDS §9.2) правятся тем же диалогом и по тем же
   правилам, что и общие реквизиты — куратор, обязательное основание, след «было → стало».
   Вид залога (it.kind) здесь НЕ меняется: он задаёт коэффициент залоговой стоимости и сам
   состав KIND_FIELDS, т.е. смена вида = пересчёт стоимости, а стоимость по Р-30 правится
   только событиями (переоценка / решение комиссии). Смена вида — это замена предмета. */
function editItemDetailFields(it){
  const defs = KIND_FIELDS[it.kind] || [], d = it.details || {};
  if(!defs.length) return `<div class="infoline"><span>Для вида «${esc(it.kind)}» детальные поля схемой не заданы — править нечего.</span></div>`;
  /* req подсвечиваем только у полей, которые УЖЕ заполнены: у исторических записей прежней
     системы детали пусты (см. detailRows), и требовать их заполнение при правке чужого
     реквизита — значит заблокировать любое исправление такой записи. Очистить непустое
     обязательное поле нельзя — это проверяет saveEditItem. */
  return `<div class="mform">${defs.map(f => f.sel
    ? fsel('ed_'+f.k, f.l, f.sel, d[f.k] ?? f.sel[0])
    : fin('ed_'+f.k, f.l, d[f.k] ?? '', !!f.req && !!String(d[f.k] ?? '').trim())).join('')}</div>`;
}
function openEditItem(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  modal(`<div class="modal form wide">${mhead('Исправление реквизитов предмета · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${ro('Вид залога (в этом диалоге не меняется)', it.kind)}
      ${fin('eiName','Наименование / описание', it.name, true, true)}
      ${fin('eiIdent','Краткий идентификатор / кадастр / VIN', it.ident, true)}
      ${fin('eiLegalDoc','Правоустанавливающий документ', it.legalDoc||'')}
      ${fin('eiQty','Количество', it.qty==null?'':String(it.qty))}
      ${fin('eiUnit','Ед. изм.', it.unit||'')}
      ${fsel('eiPledgerType','Тип залогодателя (влияет на предпосылки §5.2)', PLEDGER_TYPES, it.pledgerType)}
      <div class="field req col-span"><span class="flabel">Основание исправления</span>
        <textarea id="eiReason" class="note-area"></textarea></div>
    </div>
    <p class="section-h" style="font-size:15px;margin:16px 0 2px">Детали предмета (по виду «${esc(it.kind)}»)</p>
    ${editItemDetailFields(it)}
    <div class="infoline"><span>Оценочная и залоговая стоимость правятся событиями (переоценка / решение комиссии). Смена вида залога оформляется заменой предмета.</span></div>
    </div>${mfoot('Сохранить исправление','saveEditItem(\''+id+'\')')}</div>`);
}
function saveEditItem(id){
  if(!canCurate()) return denyEdit();
  const it = item(id), reason = val('eiReason').trim();
  if(!reason) return toast('Укажите основание исправления','warn');
  const name = val('eiName').trim(), ident = val('eiIdent').trim(), legalDoc = val('eiLegalDoc').trim(),
        qtyRaw = val('eiQty').trim(), unit = val('eiUnit').trim(), pledgerType = val('eiPledgerType');
  if(!name) return toast('Наименование не может быть пустым','warn');
  if(!ident) return toast('Краткий идентификатор не может быть пустым','warn');
  const qty = qtyRaw==='' ? null : num(qtyRaw);
  if(qtyRaw!=='' && !(qty>0)) return toast('Количество — положительное число','warn');
  /* детали предмета (KIND_FIELDS): собираем новое значение и диффы по каждому полю вида.
     Обязательное поле нельзя ОЧИСТИТЬ, но и заполнять пустое (историческая запись) при
     правке не заставляем — см. editItemDetailFields. */
  const defs = KIND_FIELDS[it.kind] || [], d0 = it.details || {}, details = {}, dDiffs = [];
  for(const f of defs){
    const was = String(d0[f.k] ?? '').trim(), now = (val('ed_'+f.k) || '').trim();
    if(f.req && was && !now) return toast('Обязательное поле «'+f.l+'» нельзя очистить','warn');
    if(now) details[f.k] = now;
    if(was !== now) dDiffs.push({ label:f.l.toLowerCase(), before:was, after:now });
  }
  /* краткий идентификатор производен от PRIMARY_DETAIL (saveNewItem). Если куратор не правил
     ident вручную (он равен прежнему значению ключевого поля), тянем его за полем — иначе
     карточка и список показывали бы старый кадастр/VIN. Явно введённый ident приоритетнее. */
  const pk = PRIMARY_DETAIL[it.kind];
  let identFinal = ident;
  if(pk){
    const pkWas = String(d0[pk] ?? '').trim(), pkNow = String(details[pk] ?? '').trim();
    if(pkNow && pkWas !== pkNow && ident === it.ident && String(it.ident ?? '').trim() === pkWas) identFinal = pkNow;
  }
  const diffs = fieldDiffs([
    {label:'наименование', before:it.name, after:name},
    {label:'идентификатор', before:it.ident, after:identFinal},
    {label:'правоуст. документ', before:it.legalDoc, after:legalDoc},
    {label:'количество', before:it.qty, after:qty},
    {label:'ед. изм.', before:it.unit, after:unit},
    {label:'тип залогодателя', before:it.pledgerType, after:pledgerType},
    ...dDiffs,
  ]);
  if(!diffs.length) return toast('Изменений нет','warn');
  it.name = name; it.ident = identFinal; it.legalDoc = legalDoc; it.qty = qty; it.unit = unit; it.pledgerType = pledgerType;
  it.details = details;
  syncItemDetailMirrors(it);
  hist(it, `Исправление реквизитов предмета (основание: «${reason}»): ${diffs.join('; ')}`);
  closeModal(); toast('Реквизиты предмета исправлены','ok'); refresh();
}
function openEditContract(id){

  modal(`<div class="modal form">${mhead('Исправление юр-реквизитов договора · '+c.id)}
    <div class="modal-b"><div class="mform">

        <textarea id="ecReason" class="note-area"></textarea></div>
    </div>
    <div class="infoline"><span>Состав предметов и доли правятся через отнесение/перезалог.</span></div>
    </div>${mfoot('Сохранить исправление','saveEditContract(\''+id+'\')')}</div>`);
}
function saveEditContract(id){

}

/* ---------- НОВЫЙ ЗАЛОГОВЫЙ ДОГОВОР (черновик) ---------- */
function openNewContract(){

  modal(`<div class="modal form">${mhead('Новый залоговый договор')}
    <div class="modal-b"><div class="mform">
      <div class="field req col-span"><span class="flabel">Заёмщик</span>
        <div class="lookup">
          <span class="val ph" id="ncInnVal">Не выбран</span>

    </div>${mfoot('Создать черновик','saveNewContract()')}</div>`);
  ncCredits();
}

/* ---------- ПРИВЯЗКА ПРЕДМЕТА К ЧЕРНОВИКУ (перезалог считается здесь же) ---------- */
function openAlloc(cid, preItemId){
  if(!canCurate()) return denyEdit();
  const c = contract(cid);
  const opts = ITEMS.filter(i=>!i.lost).map(i=>({v:i.id, t:`${i.id} · ${i.name} · залогодатель ${clientName(i.pledger)} · доступно ${fmt(availableOf(i))}`}));
  modal(`<div class="modal form">${mhead('Привязать предмет · '+cid)}
    <div class="modal-b"><div class="mform">
      ${fsel('alItem','Предмет из реестра', opts, preItemId||null, true)}
      ${fsel('alCredit','Кредит договора', c.credits.map(id=>({v:id, t:id+' · '+credit(id).num+' · требуется '+fmt(credit(id).amount*requiredCover(id, ctx(c)).req)})))}
      ${fin('alShare','Обеспечивает (часть залоговой стоимости)','',true)}
    </div>
    <div class="warn-inline" id="alInfo"></div>
    </div>${mfoot('Привязать','saveAlloc(\''+cid+'\')')}</div>`);
  const sync = () => {
    const it = item(val('alItem')); if(!it) return;
    const crId = val('alCredit');
    const av = availableOf(it), leg = allocatedLegal(it.id);
    /* Порог зависит от СОСТАВА обеспечения (Р-1, Прил.1 §2.3–2.4) — учитываем гипотетически
       и предмет, выбранный в этом диалоге прямо сейчас, ещё до сохранения привязки,
       чтобы порог 120%↔150% пересчитывался на лету при смене предмета в селекторе. */
    const draftWithItem = { ...c, allocs: [...c.allocs, { item: it.id, credit: crId, share: 0 }] };
    const ctxWithDraft = ctx(draftWithItem);
    const { req } = requiredCover(crId, ctxWithDraft);
    const ls = liquidShare(crId, ctxWithDraft);
    /* КП-14 (ревизия Р-44): валюта оценки — реквизит предмета. Привязка к кредиту в иной
       валюте блокируется на сохранении: пересчёт по курсу вне модуля. */
    const tgtCcy = creditCcy(credit(crId)), curCcy = itemCcy(it);
    const ccyWarn = curCcy !== tgtCcy
      ? `<br><b style="color:var(--asubk-danger,#B4232B)">Валюта: предмет оценён в ${ccyLabel(curCcy)}, а ${crId} — в ${ccyLabel(tgtCcy)}. Привязка будет отклонена.</b>`
      : `<br>Валюта оценки предмета: ${ccyLabel(curCcy)} — совпадает с валютой кредита ${crId}.`;
    document.getElementById('alInfo').innerHTML = `<span>Залоговая ${fmt(pledgeValue(it))} · уже обременено действующими договорами ${fmt(leg)} · <b>доступно ${fmt(av)}</b>.
      ${leg > 0 ? 'Это <b>перезалог</b> на остаточную стоимость предмета.' : ''}
      ${it.ban ? `<br>По предмету уже действует запрет ${esc(it.ban.regNo)} — при регистрации будет дополнен основанием.` : ''}
      <br>Порог по текущему составу: ${pct(req)} (${req===COVER_MOVABLE?'в покрытии есть движимый неликвидный предмет — Прил.1 §2.4':'ликвидный состав — Прил.1 §2.3'}). Доля ликвида: ${pct(ls)} при минимуме 80%.${ccyWarn}</span>`;
    /* Д-3/Т3: дефолт доли = недостающее ДО ПОРОГА, а не полное требуемое покрытие. Т3 (Р-11):
       нетто считается по coverage-wide secPledge кредита — эффективные доли залога на этом
       кредите ВО ВСЕХ действующих договорах + в этом черновике (ctxWithDraft), а не только по
       долям текущего черновика, иначе дефолт завышал бы недостающую сумму для кредита, уже
       частично закрытого залогом по ДРУГОМУ договору. */
    const cr = credit(crId);
    const alreadyByCredit = coverage(ctxWithDraft, crId).secPledge;
    document.getElementById('alShare').value = document.getElementById('alShare').value || String(Math.min(av, Math.max(0, cr.amount*req - alreadyByCredit)));
  };
  document.getElementById('alItem').addEventListener('change', ()=>{ document.getElementById('alShare').value=''; sync(); });
  document.getElementById('alCredit').addEventListener('change', ()=>{ document.getElementById('alShare').value=''; sync(); });
  sync();
}
function saveAlloc(cid){
  const c = contract(cid), it = item(val('alItem')), cr = val('alCredit'), share = num(val('alShare'));
  if(!(share > 0)) return toast('Доля должна быть положительным числом','warn');
  /* КП-14 (ревизия Р-44): валютный инвариант — валюта ОЦЕНКИ предмета должна совпадать
     с валютой кредита. Раньше валюта выводилась из кредитов и потому «подстраивалась» под
     первую привязку; теперь она собственная, и несовпадение — настоящее расхождение,
     а не следствие порядка ввода. Пересчёт по курсу объявлен вне модуля. */
  const tgtCcy = creditCcy(credit(cr)), curCcy = itemCcy(it);
  if(curCcy !== tgtCcy)
    return toast(`Валютный инвариант: предмет ${it.id} оценён в ${ccyLabel(curCcy)}, а кредит ${cr} — в ${ccyLabel(tgtCcy)}. Пересчёт по курсу вне модуля залога: нужна оценка предмета в ${ccyLabel(tgtCcy)} либо кредит в ${ccyLabel(curCcy)}.`,'warn');
  const av = availableOf(it);
  if(share > av + 0.005)
    return toast('Доля '+fmt(share)+' превышает доступную залоговую стоимость '+fmt(av)+' — инвариант Σ долей ≤ залоговая нарушен','warn');
  c.allocs.push({ item: it.id, credit: cr, share });
  it.everPledged = true;
  if(it.orphan) it.orphan = false;   // Т-1: привязка состоялась — предмет больше не осиротевший
  _bornPending = null;               // Т-1: born-flow завершён привязкой
  hist(c, `Привязан предмет ${it.id} под ${cr}: доля ${fmt(share)} (доступно было ${fmt(av)})`);
  hist(it, `Отнесение к ${cr} по договору ${c.id}: доля ${fmt(share)}`);
  closeModal(); toast('Предмет привязан','ok'); refresh();
}
function dropAlloc(cid, idx){
  const c = contract(cid), a = c.allocs[idx];
  c.allocs.splice(idx,1);
  hist(c, `Отвязан предмет ${a.item} (${a.credit}, доля ${fmt(a.share)}) — правка черновика`);
  toast('Предмет отвязан от черновика','ok'); refresh();
}

/* ---------- РЕГИСТРАЦИЯ ДОГОВОРА (четыре гейта: покрытие + предпосылки оформления §5.2 +
   решение КМ §2.6 + стоп-лист §3.5, Р-18) ---------- */
function openRegister(cid){
  if(!canCurate()) return denyEdit();
  const c = contract(cid), gate = gateCheck(c);
  const rows = gate.rows.map(r=>`<tr><td>${r.id}</td><td class="numcell">${fmt(r.amount)}</td>
    <td class="numcell">${pct(r.req)}</td><td class="numcell">${fmt(r.amount*r.req)}</td><td class="numcell">${fmt(r.sum)}</td>
    <td><span class="pill ${r.ok?'low':'high'}">${pct(r.ratio)}${r.liqApplies?` · ликвид ${pct(r.liqShare)}/80%`:''}</span></td></tr>`).join('');
  /* Р-5: гейт предпосылок оформления — отдельный от гейта покрытия; для регистрации проходят оба. */
  const its = [...new Set(c.allocs.map(a=>a.item))];
  const prereqMiss = its.flatMap(iid => prereqMissing(item(iid)).map(m=>({iid, ...m})));
  /* Р-13 (Прил.1 §2.6): третий гейт — заёмщик под категорией с обеспеченностью по решению КМ,
     а решение ещё не внесено ни на один кредит договора. */
  const kmMiss = c.credits.filter(id => kmGateBlocked(credit(id)));
  /* Р-18 (Прил.1 §3.5): четвёртый гейт — повторная проверка стоп-листа на момент регистрации.
     Предмет мог быть принят до Р-18 (стоп-поля отсутствуют → stopFieldsOf возвращает undefined
     → не блокирует), либо его состояние могло измениться между приёмом и регистрацией. */
  const stopMiss = its.map(iid => ({ iid, v: stopListCheck(stopFieldsOf(item(iid))) })).filter(x => x.v.block);
  /* Р-28 (В-1=А): гейт содержания — без предметов регистрация невозможна.
     Р-29 (В-3=А): при допуске комитета (c.undercovered) гейт покрытия считается пройденным
     по решению комитета — куратор довносит нотариальные реквизиты полной формой. */
  const content = contentGate(c);
  const gateOk = gate.ok || Boolean(c.undercovered);
  /* Р-36: приоритет гейтов — стоп-лист §3.5 → предпосылки §5.2 → содержание (Р-28) →
     решение КМ §2.6 → покрытие. Первые четыре — документарные/содержательные блокираторы:
     они закрывают И регистрацию, И отправку в комитет (кнопка «Направить в комитет» не
     рендерится). Комитет вправе допустить ТОЛЬКО недообеспечение (покрытие), ничего иного.
     Плашки идут в том же порядке приоритета. */
  const docBlocked = Boolean(stopMiss.length || prereqMiss.length || !content.ok || kmMiss.length);
  const okAll = gateOk && content.ok && !prereqMiss.length && !kmMiss.length && !stopMiss.length;
  /* Р-45: вклад договора в обеспеченность — тот же diff «до→после», что в доп соглашении
     (renderDs). Индекс каждого кредита БЕЗ этого договора (ctx(null): черновик исключён) → С
     ним (ctx(c)). Догрузка обеспечения к недообеспеченному кредиту иначе визуально неотличима
     от отказа: пользователь видит «гейт покрытия НЕ пройден», не видя роста 60%→110%. */
  const covWith = ctx(c), covWithout = ctx(null);
  const diffRows = c.credits.map(id => {
    const wo = coverage(covWithout, id), wi = coverage(covWith, id);
    return { id, before: wo.index, after: wi.index, ok: wi.ok };
  });
  const contributes = diffRows.some(r => r.after > r.before + 1e-9);
  modal(`<div class="modal form">${mhead('Регистрация залогового договора · '+cid)}
    <div class="modal-b">
      <div class="cgrid-wrap" style="margin-bottom:14px"><table class="cgrid">
        <thead><tr><th>Кредит</th><th class="numcell">Сумма</th><th class="numcell">Порог</th><th class="numcell">Требуется</th><th class="numcell">Обеспечено</th><th>Покрытие</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${contributes ? `<p class="section-h" style="font-size:15px;margin:2px 0 6px">Вклад договора в обеспеченность</p>
      <div class="cgrid-wrap" style="margin-bottom:12px"><table class="cgrid">
        <thead><tr><th>Кредит</th><th>Обеспеченность до</th><th>Обеспеченность после</th><th>Вклад договора</th><th>Гейт</th></tr></thead>
        <tbody>${diffRows.map(r=>`<tr><td>${r.id}</td><td>${pct(r.before)}</td>
          <td class="${r.after>=r.before?'diff-up':'diff-dn'}">${pct(r.after)}</td>
          <td class="${r.after>r.before+1e-9?'diff-up':''}">${r.after>r.before+1e-9?'+'+pct(r.after-r.before):'—'}</td>
          <td><span class="pill ${r.ok?'low':'high'}">${r.ok?'≥100%':'<100%'}</span></td></tr>`).join('')}</tbody>
      </table></div>` : ''}
      ${stopMiss.length ? `<div class="flagline"><span>① Гейт стоп-листа Прил.1 §3.5 НЕ пройден: ${stopMiss.map(x=>`${x.iid}: ${esc(x.v.msg)}`).join('; ')}. Регистрация невозможна.</span></div>` : ''}
      ${prereqMiss.length ? `<div class="flagline" style="margin-top:10px"><span>② Гейт предпосылок §5.2 НЕ пройден: не приложены обязательные документы — ${prereqMiss.map(m=>`${m.iid}: ${esc(m.label)}`).join('; ')}. Приложите их на карточке предмета и повторите регистрацию.</span></div>`
        : (okAll ? `<div class="okline" style="margin-top:10px"><span>② Гейт предпосылок §5.2 пройден: обязательные согласия и справки приложены.</span></div>` : '')}
      ${!content.ok ? `<div class="flagline" style="margin-top:10px"><span>③ ${esc(content.msg)}</span></div>` : ''}
      ${kmMiss.length ? `<div class="flagline" style="margin-top:10px"><span>④ Гейт §2.6 НЕ пройден: заёмщик относится к категории Прил.1 §2.6 (${esc([...new Set(kmMiss.map(id=>credit(id).borrowerCategory))].join(', '))}). Обеспеченность устанавливается решением Кабинета Министров — укажите реквизиты решения.</span></div>` : ''}
      ${gate.ok ? `<div class="okline" style="margin-top:10px"><span>⑤ Гейт покрытия пройден.</span></div>`
        : (c.undercovered ? `<div class="okline" style="margin-top:10px"><span>⑤ Покрытие ниже порога, но кредит ДОПУЩЕН комитетом по администрированию бюджетных кредитов (${pct(c.undercovered.ratio)} при пороге ${pct(c.undercovered.req)}). Основание: «${esc(c.undercovered.obosn)}» (${esc(c.undercovered.by)}, ${c.undercovered.date}). Куратор довносит нотариальные реквизиты и регистрирует договор.</span></div>`
        : `<div class="flagline" style="margin-top:10px"><span>⑤ Гейт покрытия НЕ пройден: ${gate.rows.filter(r=>!r.ok).map(r=>r.id+' — '+pct(r.ratio)+' (порог '+pct(r.req)+')').join(', ')}.${docBlocked ? ' Сначала устраните документарные гейты выше — в комитет уходит только недообеспечение.' : ' Регистрация блокируется; договор уходит на рассмотрение комитета по администрированию бюджетных кредитов.'}</span></div>`)}
      ${okAll ? `<div class="mform">
        ${fin('rgNo','Номер договора','',true)}
        ${fdate('rgDate','Дата договора', TODAY, true)}
        ${fin('rgNotary','Нотариус','',true)}
        ${fin('rgNotaryNo','№ нотариальной регистрации','',true)}
        ${fdate('rgNotaryDate','Дата нотариальной регистрации', TODAY, true)}
        ${fin('rgCert','Залоговое рег. свидетельство','',true)}
        ${fsel('rgCustody','Способ хранения предмета залога (ПОЛ §6.4 п.7)', ['у залогодателя','у залогодержателя'], 'у залогодателя')}
        ${fin('rgCustodyPlace','Место хранения (если у залогодержателя)','')}
      </div>
      <div class="okline" style="margin-top:6px"><span>Если способ хранения — «у залогодержателя»: укажите место хранения; периодичность обследования не применяется, имущество у залогодержателя (ПОЛ §6.4 п.7).</span></div>` : ''}
    </div>
    ${okAll ? mfoot('Зарегистрировать','doRegister(\''+cid+'\')','btn-success')
      /* Р-36: документарные гейты (①②③④) блокируют и регистрацию, и комитет — кнопка
         «Направить в комитет» не рендерится. §2.6 куратор чинит сам («Указать решение КМ»),
         прочие — только «Закрыть». В комитет уходит ТОЛЬКО чистое недообеспечение (⑤). */
      : (stopMiss.length ? `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button></div>`
        : (prereqMiss.length ? `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button></div>`
          : (!content.ok ? `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button></div>`
            : (kmMiss.length ? `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                 <button class="btn btn-primary" onclick="openKmDecision('${cid}')">Указать решение КМ</button></div>`
              : `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                 <button class="btn btn-primary" onclick="toCommission('${cid}')">Направить в комитет по администрированию бюджетных кредитов</button></div>`))))}
    </div>`);
}
/* Постобработка запрета при переводе договора в «Зарегистрирован».
   Запрет — действие во внешнем органе; сам мы его не создаём. Если запрет по
   предмету уже есть (перезалог) — договор добавляется в основания. Если нет —
   предмет остаётся без запрета и немедленно поднимает триггер «залог без запрета»
   с дедлайном (нотар. дата + 5 раб. дней). Возвращает список предметов без запрета. */
function afterRegister(c){
  const its = [...new Set(c.allocs.map(a=>a.item))], missing = [];
  its.forEach(iid => { const it = item(iid);
    if(it.ban){
      if(!it.ban.contracts.includes(c.id)){
        it.ban.contracts.push(c.id);
        hist(it, `Перезалог: договор ${c.id} добавлен в основания действующего запрета ${it.ban.regNo} (повторное наложение не требуется)`);
        hist(c, `По предмету ${iid} действует запрет ${it.ban.regNo} — договор добавлен в его основания (повторное наложение не требуется)`);
      }
    } else missing.push(it);
  });
  return missing;
}
function doRegister(cid){
  const c = contract(cid);
  const breach = invariantBreaches(c);
  if(breach.length) return toast('Инвариант нарушен по '+breach.map(b=>b.id).join(', ')+' — Σ долей превышает залоговую стоимость','warn');
  /* Р-36: проверки в фиксированном приоритете — стоп-лист §3.5 → предпосылки §5.2 →
     содержание (Р-28) → решение КМ §2.6 → покрытие. Второй рубеж (denyEdit — первый). */
  /* ① Р-18 (Прил.1 §3.5): гейт стоп-листа — та же повторная проверка, что и в openRegister. */
  const sm = [...new Set(c.allocs.map(a=>a.item))].map(iid => ({ iid, v: stopListCheck(stopFieldsOf(item(iid))) })).filter(x => x.v.block);
  if(sm.length) return toast('Гейт стоп-листа Прил.1 §3.5 не пройден: '+sm.map(x=>x.iid+' — '+x.v.msg).join('; '),'warn');
  /* ② Р-5: гейт предпосылок оформления §5.2 — обязателен для регистрации. */
  const pm = [...new Set(c.allocs.map(a=>a.item))].flatMap(iid=>prereqMissing(item(iid)).map(m=>({iid,...m})));
  if(pm.length) return toast('Гейт предпосылок §5.2 не пройден: '+pm.map(m=>m.iid+' — '+m.label).join('; '),'warn');
  /* ③ Р-28 (В-1=А): гейт содержания — без предметов регистрация невозможна. */
  const cg = contentGate(c);
  if(!cg.ok) return toast(cg.msg,'warn');
  /* ④ Р-13 (Прил.1 §2.6): гейт решения КМ — обязателен для регистрации. */
  const km = c.credits.filter(id => kmGateBlocked(credit(id)));
  if(km.length) return toast('Гейт Прил.1 §2.6 не пройден: обеспеченность по решению КМ не установлена — '+km.join(', '),'warn');
  /* ⑤ Р-29 (В-3=А): при допуске комитета (c.undercovered) гейт покрытия пройден по решению комитета. */
  const gate = gateCheck(c);
  if(!gate.ok && !c.undercovered) return toast('Гейт покрытия не пройден','warn');
  const no = val('rgNo').trim(), date = iso2d(val('rgDate')), notary = val('rgNotary').trim(),
        nno = val('rgNotaryNo').trim(), ndate = iso2d(val('rgNotaryDate')), cert = val('rgCert').trim(),
        custody = val('rgCustody'), custodyPlace = val('rgCustodyPlace').trim();
  if(!no || !notary || !nno || !cert) return toast('Заполните все юридические реквизиты','warn');
  if(!isDate(date) || !isDate(ndate)) return toast('Даты — в формате дд.мм.гггг','warn');
  /* Р-16 (ПОЛ §6.4 п.7): способ хранения — обязательное поле регистрации. */
  if(!custodyValid(custody)) return toast('Укажите способ хранения предмета залога (ПОЛ §6.4 п.7)','warn');
  if(custody === 'у залогодержателя' && !custodyPlace) return toast('Укажите место хранения — предмет передаётся залогодержателю (ПОЛ §6.4 п.7)','warn');
  Object.assign(c, { no, date, notary, notaryNo:nno, notaryDate:ndate, cert, status:ACTIVE, custody, custodyPlace: custody === 'у залогодержателя' ? custodyPlace : '' });
  c.allocs.forEach(a => { item(a.item).everPledged = true; });
  hist(c, `Договор зарегистрирован (${no}). Обеспеченность: ${histCoverList(gate.rows)}. С этого момента предметы юридически обременены.`);
  const missing = afterRegister(c);
  closeModal(); toast(`Договор зарегистрирован. Гейт покрытия пройден: ${gate.rows.map(r=>`${r.id} — ${pct(r.ratio)} при пороге ${pct(r.req)}`).join('; ')}`,'ok');
  if(missing.length) toast(`Наложите запрет на отчуждение в «${organOf(missing[0])}» до ${banDeadline(missing[0])} — до этого залог не защищён от продажи`,'warn');
  refresh();
}
function toCommission(cid){
  const c = contract(cid), gate = gateCheck(c);
  /* Р-36: в комитет уходит ТОЛЬКО недообеспечение. Документарные гейты (стоп-лист §3.5,
     предпосылки §5.2, содержание Р-28, решение КМ §2.6) закрывают и этот маршрут —
     второй рубеж на случай обхода UI. */
  const its = [...new Set(c.allocs.map(a=>a.item))];
  if(its.map(iid => stopListCheck(stopFieldsOf(item(iid)))).some(v=>v.block)) return toast('Стоп-лист Прил.1 §3.5 не пройден — договор нельзя направить в комитет','warn');
  if(its.some(iid => prereqMissing(item(iid)).length)) return toast('Предпосылки §5.2 не собраны — договор нельзя направить в комитет','warn');
  if(!contentGate(c).ok) return toast('Договор без предметов нельзя направить в комитет','warn');
  if(c.credits.some(id => kmGateBlocked(credit(id)))) return toast('Гейт §2.6 не пройден — сначала внесите решение КМ','warn');
  if(gate.ok) return toast('Покрытие в норме — решение комитета не требуется','warn');
  c.status = 'На рассмотрении комиссии';
  c.commissionSince = TODAY;   // Р-35: старт отсчёта SLA очереди комитета
  hist(c, `Регистрация заблокирована контрольным гейтом. Обеспеченность: ${histCoverList(gate.rows.filter(r=>!r.ok))}. Направлено в комитет по администрированию бюджетных кредитов.`);
  closeModal(); toast('Договор направлен в комитет по администрированию бюджетных кредитов','warn'); refresh();
}

/* ---------- РЕШЕНИЕ КАБИНЕТА МИНИСТРОВ (Р-13, Прил.1 §2.6) — вводится на карточке ДОГОВОРА
   (не в кредитном модуле): заёмщик под категорией §2.6 не имеет собственного расчёта
   обеспеченности — её устанавливает решение КМ, applies ко ВСЕМ кредитам договора,
   у которых заполнена borrowerCategory. requiredCover() уже читает kmDecision.coverPct —
   после сохранения requiredCover/coverage у этих кредитов автоматически переходят на
   % из решения (см. requiredCover выше). ---------- */
function openKmDecision(cid){
  if(!canCurate()) return denyEdit();
  const c = contract(cid);
  modal(`<div class="modal form">${mhead('Решение Кабинета Министров · '+cid)}
    <div class="modal-b">
      <div class="mform">
        ${fin('kmNo','№ решения','',true)}
        ${fdate('kmDate','Дата решения', TODAY, true)}
        ${fin('kmPct','% обеспеченности','',true)}
      </div>
      <div class="warn-inline"><span>Реквизиты применяются ко всем кредитам договора, относящимся к категории Прил.1 §2.6 (${esc([...new Set(c.credits.filter(id=>(credit(id)||{}).borrowerCategory).map(id=>credit(id).borrowerCategory))].join(', '))}).</span></div>
    </div>${mfoot('Сохранить решение','saveKmDecision(\''+cid+'\')')}</div>`);
}
function saveKmDecision(cid){
  const c = contract(cid), no = val('kmNo').trim(), date = iso2d(val('kmDate')), coverPct = num(val('kmPct'));
  if(!no) return toast('Укажите номер решения','warn');
  if(!isDate(date)) return toast('Дата — в формате дд.мм.гггг','warn');
  if(!(coverPct > 0)) return toast('% обеспеченности должен быть положительным числом','warn');
  const decision = { no, date, coverPct };
  const applied = [];
  c.credits.forEach(id => { const cr = credit(id); if(cr && cr.borrowerCategory){ cr.kmDecision = decision; applied.push(id); } });
  hist(c, `Решение Кабинета Министров ${no} от ${date} (Прил.1 §2.6): обеспеченность ${coverPct}% — применено к кредитам ${applied.join(', ')}`);
  closeModal(); toast('Решение КМ сохранено — гейт §2.6 снят','ok');
  openRegister(cid);
}

/* ---------- РЕШЕНИЕ КОМИТЕТА ПО АДМИНИСТРИРОВАНИЮ БЮДЖЕТНЫХ КРЕДИТОВ (обоснование обязательно для допуска) ---------- */
function openCommission(cid){
  if(!canCommittee()) return denyComm();
  const c = contract(cid), gate = gateCheck(c);
  const bad = gate.rows.filter(r=>!r.ok);
  modal(`<div class="modal form">${mhead('Решение комитета по администрированию бюджетных кредитов · '+cid)}
    <div class="modal-b">
      <div class="flagline"><span>Недообеспечение: ${bad.map(r=>`${r.id} — ${pct(r.ratio)} при пороге ${pct(r.req)} (не хватает ${fmt(Math.max(0, r.amount*r.req - r.sum))}${r.liqApplies&&!r.liqOk?`; доля ликвида ${pct(r.liqShare)}<80%`:''})`).join('; ')}</span></div>
      <div class="mform one">
        ${fsel('cmDec','Решение', [
          {v:'return', t:'Вернуть на доработку — догрузить / заменить предмет'},
          {v:'admit',  t:'Допустить недообеспеченный кредит (с обоснованием)'} ], 'return')}
        ${ftxt('cmObosn','Обоснование (обязательно для допуска)','')}
      </div>
      <div class="warn-inline"><span>Обоснование фиксируется в договоре и в истории, договор помечается флагом «допуск &lt;порога».</span></div>
    </div>${mfoot('Провести решение','saveCommission(\''+cid+'\')')}</div>`);
}
function saveCommission(cid){
  const c = contract(cid), dec = val('cmDec'), ob = val('cmObosn').trim(), gate = gateCheck(c);
  if(dec === 'return'){
    c.status = 'Оформляется';
    hist(c, `Комитет по администрированию бюджетных кредитов: возврат на доработку${ob ? ' — '+ob : ''}`);
    closeModal(); toast('Возвращено на доработку','ok'); return refresh();
  }
  if(!ob) return toast('Допуск ниже порога требует обоснования','warn');
  /* Р-28 (В-1=А): комитет не допускает ПУСТОЙ договор — допуск касается только
     недообеспечения, а не отсутствия предметов. */
  const cg = contentGate(c);
  if(!cg.ok) return toast(cg.msg,'warn');
  /* Р-5: комиссия допускает недообеспечение, но предпосылки §5.2 (согласия/справки) — не в её власти. */
  const pm = [...new Set(c.allocs.map(a=>a.item))].flatMap(iid=>prereqMissing(item(iid)).map(m=>({iid,...m})));
  if(pm.length) return toast('Регистрация невозможна: гейт предпосылок §5.2 — '+pm.map(m=>m.iid+' — '+m.label).join('; '),'warn');
  /* Худший по покрытию кредит — тот же выбор, что и Math.min(...ratio) ниже, но с
     сохранением его req (Д-2): порог — функция состава, не константа 120%. */
  const worst = gate.rows.reduce((a,b)=> b.ratio<a.ratio?b:a);
  /* Р-29 (В-3=А): КОМИТЕТ РЕШАЕТ ТОЛЬКО ВОПРОС ДОПУСКА, НЕ РЕГИСТРИРУЕТ. Нотариальных
     реквизитов у комитета нет — их приносит куратор. Ставим флаг допуска и возвращаем
     статус «Оформляется»; регистрацию проводит куратор через openRegister полной формой
     (реквизиты + способ хранения), гейт покрытия у него пройден по этому допуску. */
  c.undercovered = { ratio: worst.ratio, req: worst.req, obosn: ob, by: role, date: TODAY };
  c.status = 'Оформляется';
  hist(c, `Комитет по администрированию бюджетных кредитов: ДОПУЩЕН недообеспеченный кредит. Обеспеченность: ${histCoverList(gate.rows.filter(r=>!r.ok))}. Обоснование: «${ob}». Договор возвращён куратору на регистрацию (реквизиты и способ хранения довносит куратор).`);
  closeModal(); toast(`Комитет допустил недообеспечение (порог ${pct(worst.req)}) — куратор регистрирует договор полной формой`,'ok');
  refresh();
}

/* ---------- Р-31: АННУЛИРОВАНИЕ ОШИБОЧНОГО ЧЕРНОВИКА ----------
   Ошибочно созданный черновик нельзя было закрыть — он висел в реестре, а его доли
   держали предметы в статусе «резервируется» (allocatedDraft) и урезали availableOf для
   всех прочих договоров. Аннулирование доступно только на «черновых» статусах (isDraftish),
   требует причины, снимает отнесения (освобождает доли) и оставляет запись в реестре и в
   истории. Физического удаления нет — append-only. */
function openCancelDraft(cid){
  if(!canCurate()) return denyEdit();
  const c = contract(cid);
  if(!isDraftish(c)) return toast('Аннулировать можно только черновик (статус «Оформляется» / «На рассмотрении комиссии»)','warn');
  modal(`<div class="modal form">${mhead('Аннулирование черновика договора · '+cid)}
    <div class="modal-b">
      <div class="warn-inline"><span>Отнесения предметов будут сняты (доли освобождаются), договор перейдёт в статус «Аннулирован» и останется в реестре с записью в истории. Действие необратимо.</span></div>
      <div class="mform one">${ftxt('cdReason','Причина аннулирования (обязательно)','')}</div>
    </div>${mfoot('Аннулировать черновик','saveCancelDraft(\''+cid+'\')','btn-danger')}</div>`);
}
function saveCancelDraft(cid){
  if(!canCurate()) return denyEdit();
  const c = contract(cid);
  if(!isDraftish(c)) return toast('Аннулировать можно только черновик','warn');
  const reason = val('cdReason').trim();
  if(!reason) return toast('Укажите причину аннулирования','warn');
  const freed = [...new Set(c.allocs.map(a=>a.item))];
  c.allocs = [];
  c.status = CANCELLED;
  hist(c, `Черновик аннулирован. Причина: «${reason}». Сняты отнесения по предметам: ${freed.length ? freed.join(', ') : '—'} — доли освобождены.`);
  closeModal(); toast('Черновик аннулирован — доли освобождены','ok'); refresh();
}

/* ---------- ДОП СОГЛАШЕНИЕ — CHANGESET (конверт версионирования) ---------- */
let ds = { cid:null, ops:[] };
function openDs(cid){
  if(!canDs()) return denyEdit();
  ds = { cid, ops: [] };
  renderDs();
}
function applyOps(c, ops){
  const v = JSON.parse(JSON.stringify(c));
  ops.forEach(o => {
    if(o.type==='out')    v.allocs = v.allocs.filter(a => a.item !== o.item);
    if(o.type==='in')     v.allocs.push({ item:o.item, credit:o.credit, share:o.share });
    if(o.type==='share'){ const a = v.allocs.find(a => a.item===o.item && a.credit===o.credit); if(a) a.share = o.share; }
    if(o.type==='credit' && !v.credits.includes(o.credit)) v.credits.push(o.credit);
  });
  return v;
}
/* Блокируем только те нарушения инварианта, которые пакет СОЗДАЁТ или УСУГУБЛЯЕТ.
   Уже существующее нарушение (доля закреплена нотариально, а переоценка уронила стоимость)
   блокировать нельзя — иначе доп соглашение, которое его лечит, само окажется запрещено. */
function newBreaches(c, v){
  const base = {}; invariantBreaches(c).forEach(b => base[b.id] = b.alloc);
  return invariantBreaches(v).filter(b => !(b.id in base) || b.alloc > base[b.id] + 0.005);
}
const opText = o =>
  o.type==='out'    ? `Вывод предмета ${o.item} · ${item(o.item).name} (снимаются все его доли в договоре)` :
  o.type==='in'     ? `Ввод предмета ${o.item} · ${item(o.item).name} под ${o.credit}, доля ${fmt(o.share)}` :
  o.type==='share'  ? `Правка доли ${o.item} / ${o.credit}: → ${fmt(o.share)}` :
                      `Добавление кредита ${o.credit} · ${credit(o.credit).num} в договор (перекрёстное обеспечение)`;

/* Р-6 (§8, Прил.3 §3.5): ГЕЙТ ЗАМЕНЫ. Замена = в пакете по одному кредиту есть и вывод, и ввод.
   Правила: (1) нельзя понижать суммарную ликвидность (Σ рангов ввода < Σ рангов вывода) —
   допуск только комиссией с обоснованием; (2) замена при просроченной задолженности по
   кредиту не допускается вовсе (§8: согласие даётся «при отсутствии просроченной задолженности»). */
const liqRankOf = it => (KINDS[it.kind]||{}).liquidityRank || 0;
function replacementInfo(c, ops){
  const byCredit = {};
  const ensure = id => (byCredit[id] ||= { credit:id, outRank:0, inRank:0, outItems:[], inItems:[] });
  ops.filter(o=>o.type==='out').forEach(o =>
    c.allocs.filter(a=>a.item===o.item).forEach(a => { const x = ensure(a.credit); x.outRank += liqRankOf(item(o.item)); x.outItems.push(o.item); }));
  ops.filter(o=>o.type==='in').forEach(o => { const x = ensure(o.credit); x.inRank += liqRankOf(item(o.item)); x.inItems.push(o.item); });
  return Object.values(byCredit)
    .filter(x => x.outItems.length && x.inItems.length)   // и вывод, и ввод по одному кредиту = замена
    .map(x => ({ ...x, drop: x.inRank < x.outRank, overdue: Boolean((credit(x.credit)||{}).overdue) }));
}

/* Р-14 (Прил.3 §3.5): РАВНОЦЕННОСТЬ ЗАМЕНЫ. Сравниваем эффективную стоимость выводимых
   долей (усечённую пропорционально, как и в покрытии — effShare) с залоговой стоимостью
   вводимых предметов (не больше вводимой доли — физически больше стоимости предмета не
   введёшь). Считается по ВСЕМУ пакету, не по кредиту — пакет либо равноценен целиком. */
function replacementValues(c, ops){
  const cs = ctx(c);
  const outValue = ops.filter(o=>o.type==='out')
    .flatMap(o => c.allocs.filter(a=>a.item===o.item))
    .reduce((s,a) => s + effShare(cs, a.item, a.share), 0);
  const inValue = ops.filter(o=>o.type==='in')
    .reduce((s,o) => s + Math.min(o.share, pledgeValue(item(o.item))), 0);
  return { outValue, inValue };
}
/* Р-14 (Прил.3 §3.5): ГЕЙТ ЗАМЕНЫ — четыре условия. Равноценность и согласие/заключение —
   новые жёсткие требования; rankOk (Р-6) передаётся вызывающим кодом (!reps.some(r=>r.drop)). */
function replacementGate({outValue, inValue, deptConsent, dakConclusion, rankOk}){
  const equivalenceOk = inValue >= outValue;
  const consentOk = Boolean(deptConsent && deptConsent.trim());
  const dakOk = Boolean(dakConclusion && dakConclusion.trim());
  const blocked = !(equivalenceOk && consentOk && dakOk && rankOk);
  return { equivalenceOk, consentOk, dakOk, rankOk, blocked };
}

function renderDs(){
  const c = contract(ds.cid);
  const v = applyOps(c, ds.ops);
  const before = gateCheck(c), after = gateCheck(v);
  const breach = newBreaches(c, v);
  const reps = replacementInfo(c, ds.ops);
  const repOverdue = reps.filter(r=>r.overdue);
  const repDrop = reps.some(r=>r.drop && !r.overdue);
  /* Р-14 (Прил.3 §3.5): равноценность пакета замены (Σ вводимой стоимости ≥ Σ эфф.
     выводимой). Недостача равноценности идёт по тому же пути допуска, что покрытие/
     ликвидность — комиссия с обоснованием, НЕ отдельный жёсткий блок. */
  const { outValue, inValue } = reps.length ? replacementValues(c, ds.ops) : { outValue:0, inValue:0 };
  const rankOk = !reps.some(r=>r.drop);
  const repEquivShort = reps.length && inValue < outValue;
  const needCommission = (!after.ok || repDrop || repEquivShort);   // допуск комиссией (покрытие ниже порога / понижение ликвидности / равноценность)
  /* Согласие отраслевого департамента и заключение ДАК — читаем из ПРЕДЫДУЩЕГО рендера
     (при dsAdd/dsDel renderDs() вызывается повторно ДО замены DOM — старые значения полей
     ещё доступны), чтобы не терять ввод офицера при добавлении/удалении операций пакета. */
  const prevDeptConsent = val('dsDeptConsent');
  const prevDeptChk = Boolean((document.getElementById('dsDeptConsentChk')||{}).checked);
  const prevDakConclusion = val('dsDakConclusion');
  const gate = reps.length ? replacementGate({ outValue, inValue, deptConsent: prevDeptConsent, dakConclusion: prevDakConclusion, rankOk }) : null;
  const repDeptDakMissing = reps.length && (!prevDeptConsent.trim() || !prevDeptChk || !prevDakConclusion.trim());
  const inCtr  = [...new Set(v.allocs.map(a=>a.item))];
  /* Р-?: показываем порог ДО/ПОСЛЕ — смена состава обеспечения (напр. добавили товары
     в обороте) поднимает порог 120→150%, из-за чего гейт может падать ДАЖЕ при росте
     покрытия. Без этих колонок офицер не понимает, почему «стало больше», а гейт красный. */
  let reqRose = false;
  const rows = after.rows.map(r => {
    const b = before.rows.find(x=>x.id===r.id);
    const reqUp = b && r.req > b.req + 0.0001;
    if(reqUp) reqRose = true;
    return `<tr><td>${r.id}</td><td>${b ? pct(b.ratio) : '—'}</td>
      <td class="${!b || r.ratio >= b.ratio ? 'diff-up':'diff-dn'}">${pct(r.ratio)}</td>
      <td>${b ? pct(b.req) : '—'}</td>
      <td${reqUp?' class="diff-dn" title="порог вырос — в обеспечение добавлен низколиквидный вид"':''}>${pct(r.req)}${reqUp?' ↑':''}</td>
      <td><span class="pill ${r.ok?'low':'high'}">${r.ok?`≥${pct(r.req)}`:`<${pct(r.req)}`}</span></td></tr>`; }).join('');
  /* Р-6: строка ликвидности до/после для замен + индикатор допустимости. */
  const repRows = reps.map(r=>`<tr><td>${r.credit}</td>
      <td>${r.outItems.join(', ')} (ранг Σ${r.outRank})</td>
      <td>${r.inItems.join(', ')} (ранг Σ${r.inRank})</td>
      <td><span class="pill ${r.overdue?'high':(r.drop?'high':'low')}">${r.overdue?'просрочка — замена запрещена':(r.drop?'ликвидность падает':'ликвидность не падает')}</span></td></tr>`).join('');

  const outOpts   = inCtr.map(i=>({v:i, t:`${i} · ${item(i).name}${item(i).ban?' — есть запрет на отчуждение (после вывода потребует снятия)':''}`}));
  /* Предметы пакета, которые выводятся и по которым сейчас действует запрет:
     вывод не блокируется, но породит задачу снять запрет в органе. */
  const outBanned = ds.ops.filter(o=>o.type==='out' && item(o.item).ban).map(o=>o.item);
  const inOpts    = ITEMS.filter(i=>!i.lost).map(i=>({v:i.id, t:`${i.id} · ${i.name} · доступно ${fmt(availableOf(i))}`}));
  const shareOpts = v.allocs.map((a,i)=>({v:i, t:`${a.item} / ${a.credit} · текущая доля ${fmt(a.share)}`}));
  const credOpts  = CREDITS.filter(cr=>cr.inn===c.inn && cr.status==='Действующий' && !v.credits.includes(cr.id))
                           .map(cr=>({v:cr.id, t:`${cr.id} · ${cr.num} · сумма ${fmt(cr.amount)} · порог по составу (${pct(COVER_LIQUID)}/${pct(COVER_MOVABLE)})`}));

  modal(`<div class="modal">${mhead('Доп соглашение к '+(c.no||c.id)+' — пакет изменений (changeset)')}
    <div class="modal-b">
      <div class="mform">
        ${fsel('dsType','Операция', [
          {v:'out',    t:'Вывод предмета'},
          {v:'in',     t:'Ввод предмета'},
          {v:'share',  t:'Правка доли'},
          {v:'credit', t:'Добавить кредит в договор'} ], 'in')}
        <div class="field"><span class="flabel">Параметры</span><div id="dsParams"></div></div>
      </div>
      <div class="gtoolbar" style="margin-top:10px"><button class="btn btn-tint btn-sm" onclick="dsAdd()">Добавить операцию в пакет</button></div>

      <p class="section-h" style="font-size:16px;margin-top:10px">Пакет</p>
      <div class="ops-list">${ds.ops.length ? ds.ops.map((o,i)=>`<div class="op-row"><span class="op-t">${esc(opText(o))}</span>
        <button class="btn btn-tint btn-sm danger" onclick="dsDel(${i})">Убрать</button></div>`).join('')
        : `<div class="op-empty">Пакет пуст — добавьте хотя бы одну операцию</div>`}</div>

      ${outBanned.length ? `<div class="warn-inline" style="margin-top:10px"><span>Вывод ${outBanned.map(i=>`предмета ${i}`).join(', ')} потребует СНЯТИЯ запрета на отчуждение в «${esc(organOf(item(outBanned[0])))}». После регистрации — задача «требуется снятие запрета» в мониторинге.</span></div>` : ''}

      ${reps.length ? `<p class="section-h" style="font-size:16px;margin-top:14px">Замена залога — ликвидность</p>
      <div class="cgrid-wrap"><table class="cgrid">
        <thead><tr><th>Кредит</th><th>Выводится</th><th>Вводится</th><th>Допустимость</th></tr></thead>
        <tbody>${repRows}</tbody></table></div>

      <p class="section-h" style="font-size:16px;margin-top:14px">Замена — условия (Прил.3 §3.5)</p>
      <div class="cgrid-wrap"><table class="cgrid">
        <thead><tr><th>Условие</th><th>Значение</th><th>Статус</th></tr></thead>
        <tbody>
          <tr><td>Равноценность</td><td>выводится ${fmt(outValue)} / вводится ${fmt(inValue)}</td>
            <td><span class="pill ${gate.equivalenceOk?'low':'high'}">${gate.equivalenceOk?'соблюдена':'не соблюдена'}</span></td></tr>
          <tr><td>Согласие отраслевого департамента</td><td>${esc(prevDeptConsent||'—')}</td>
            <td><span class="pill ${gate.consentOk && prevDeptChk?'low':'high'}">${gate.consentOk && prevDeptChk?'получено':'требуется'}</span></td></tr>
          <tr><td>Заключение ДАК о ликвидности</td><td>${esc(prevDakConclusion||'—')}</td>
            <td><span class="pill ${gate.dakOk?'low':'high'}">${gate.dakOk?'представлено':'требуется'}</span></td></tr>
          <tr><td>Ранг ликвидности не понижается</td><td>—</td>
            <td><span class="pill ${gate.rankOk?'low':'high'}">${gate.rankOk?'ок':'падает'}</span></td></tr>
        </tbody></table></div>
      <div class="mform" style="margin-top:10px">
        ${fin('dsDeptConsent','Реквизит согласования отраслевого департамента', prevDeptConsent, true, true)}
        <label class="chk col-span" style="margin-top:-6px"><input type="checkbox" id="dsDeptConsentChk"${prevDeptChk?' checked':''}> Отраслевой департамент согласовал замену (Прил.3 §3.5)</label>
        ${fin('dsDakConclusion','Заключение ДАК о ликвидности', prevDakConclusion, true, true)}
      </div>
      <div class="gtoolbar" style="margin-top:8px"><button class="btn btn-tint btn-sm danger" onclick="dsRefuseReplacement()">Отказать в замене</button></div>
      ${ftxt('dsRefuseReason','Причина отказа в замене (заполните перед «Отказать в замене»)','')}` : ''}

      <p class="section-h" style="font-size:16px;margin-top:14px">Сравнение «до → после» — что в итоге изменилось</p>
      <div class="cgrid-wrap"><table class="cgrid">
        <thead><tr><th>Кредит</th><th>Покрытие до</th><th>Покрытие после</th><th>Порог до</th><th>Порог после</th><th>Гейт</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${reqRose ? `<div class="infoline" style="margin-top:10px"><span>Порог вырос: в обеспечение добавлен низколиквидный вид (товары в обороте / движимое) — состав перешёл в режим 150%. Рост покрытия может не компенсировать рост порога.</span></div>` : ''}

      ${breach.length ? `<div class="flagline" style="margin-top:12px"><span>Инвариант нарушен: по ${breach.map(b=>`${b.id} (Σ долей ${fmt(b.alloc)} > залоговая ${fmt(b.pledge)})`).join('; ')}. Пакет не может быть зарегистрирован.</span></div>` : ''}
      ${repOverdue.length ? `<div class="flagline" style="margin-top:12px"><span>Замена невозможна: по кредиту ${repOverdue.map(r=>r.credit).join(', ')} есть просроченная задолженность. Погасите просрочку и повторите.</span></div>` : ''}
      ${!breach.length && !repOverdue.length && needCommission ? `<div class="flagline" style="margin-top:12px"><span>${[
          !after.ok ? `покрытие ниже порога (${after.rows.filter(r=>!r.ok).map(r=>r.id+' — '+pct(r.ratio)+' < '+pct(r.req)).join(', ')})` : '',
          repDrop ? `замена понижает ликвидность (${reps.filter(r=>r.drop&&!r.overdue).map(r=>r.credit+': Σ'+r.outRank+'→Σ'+r.inRank).join(', ')})` : '',
          repEquivShort ? `замена не равноценна (выводится ${fmt(outValue)} > вводится ${fmt(inValue)})` : ''
        ].filter(Boolean).join('; ')}. Регистрация блокируется — допуск только решением комитета по администрированию бюджетных кредитов с обоснованием.</span>
        </div>${canCommittee() ? ftxt('dsObosn','Обоснование комитета по администрированию бюджетных кредитов (для допуска: покрытие/ликвидность/равноценность)','') : '<p class="formula">Смените роль на «Комитет по администрированию бюджетных кредитов», чтобы допустить пакет с обоснованием.</p>'}` : ''}
      ${!breach.length && !repOverdue.length && !needCommission ? `<div class="okline" style="margin-top:12px"><span>Чистый эффект пакета проходит гейт по всем кредитам договора${reps.length?' (замена ликвидность не понижает)':''}.</span></div>` : ''}
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" id="dsRegBtn" ${(!ds.ops.length || breach.length || repOverdue.length || (needCommission && !canCommittee()) || repDeptDakMissing) ? 'disabled' : ''}
        onclick="dsRegister()">Зарегистрировать доп соглашение</button>
    </div></div>`);

  window.__dsOpts = { outOpts, inOpts, shareOpts, credOpts };
  document.getElementById('dsType').addEventListener('change', dsParams);
  dsParams();
  /* Р-14: два новых жёстких поля (согласие департамента / заключение ДАК) набираются
     живьём — без полного renderDs() на каждый символ. baseDisabled — все прочие причины
     блокировки кнопки, не зависящие от этих двух полей. */
  if(reps.length){
    const baseDisabled = !ds.ops.length || breach.length || repOverdue.length || (needCommission && !canCommittee());
    const btn = document.getElementById('dsRegBtn');
    const syncGate = () => {
      const missing = !val('dsDeptConsent').trim() || !document.getElementById('dsDeptConsentChk').checked || !val('dsDakConclusion').trim();
      btn.disabled = baseDisabled || missing;
    };
    document.getElementById('dsDeptConsent').addEventListener('input', syncGate);
    document.getElementById('dsDeptConsentChk').addEventListener('change', syncGate);
    document.getElementById('dsDakConclusion').addEventListener('input', syncGate);
  }
}
function dsParams(){
  const t = val('dsType'), o = window.__dsOpts, box = document.getElementById('dsParams');
  const S = (id,opts) => `<div class="control grey" style="margin-bottom:8px"><select id="${id}">${opts.length ? opts.map(x=>`<option value="${esc(x.v)}">${esc(x.t)}</option>`).join('') : '<option value="">— нет доступных —</option>'}</select>${caret()}</div>`;
  const I = (id,ph) => `<div class="control"><input id="${id}" placeholder="${ph}"></div>`;
  box.innerHTML =
    t==='out'    ? S('dsItem', o.outOpts) :
    t==='in'     ? S('dsItem', o.inOpts) + S('dsCredit', contract(ds.cid).credits.map(id=>({v:id,t:id+' · '+credit(id).num}))) + I('dsShare','Доля') :
    t==='share'  ? S('dsIdx', o.shareOpts) + I('dsShare','Новая доля') :
                   S('dsCredit', o.credOpts);
}
function dsAdd(){
  const t = val('dsType'), c = contract(ds.cid);
  if(t==='out'){
    const id = val('dsItem'); if(!id) return toast('Нет предметов для вывода','warn');
    ds.ops.push({ type:'out', item:id });
  }
  if(t==='in'){
    const id = val('dsItem'), cr = val('dsCredit'), sh = num(val('dsShare'));
    if(!id || !cr) return toast('Выберите предмет и кредит','warn');
    if(!(sh > 0)) return toast('Доля должна быть положительным числом','warn');
    /* Advisory: доступное с учётом уже добавленных в пакет вводов по этому предмету.
       Не блокируем (в пакете может быть вывод, освобождающий место) — жёсткий guard = инвариант. */
    const pkgIn = ds.ops.filter(o=>o.type==='in' && o.item===id).reduce((s,o)=>s+o.share,0);
    const avail = availableOf(item(id)) - pkgIn;
    if(sh > avail + 0.005)
      toast(`Внимание: доля ${fmt(sh)} превышает доступное по ${id} (${fmt(Math.max(0,avail))}). Без вывода другого залога это нарушит инвариант.`,'warn');
    ds.ops.push({ type:'in', item:id, credit:cr, share:sh });
  }
  if(t==='share'){
    const i = Number(val('dsIdx')), sh = num(val('dsShare'));
    const v = applyOps(c, ds.ops), a = v.allocs[i];
    if(!a) return toast('Выберите отнесение','warn');
    if(!(sh >= 0)) return toast('Доля должна быть числом ≥ 0','warn');
    ds.ops.push({ type:'share', item:a.item, credit:a.credit, share:sh });
  }
  if(t==='credit'){
    const cr = val('dsCredit'); if(!cr) return toast('Нет доступных кредитов этого заёмщика','warn');
    ds.ops.push({ type:'credit', credit:cr });
  }
  renderDs();
}
function dsDel(i){ ds.ops.splice(i,1); renderDs(); }
function dsRegister(){
  const c = contract(ds.cid), v = applyOps(c, ds.ops);
  if(newBreaches(c, v).length) return toast('Инвариант нарушен — пакет отклонён','warn');
  /* Р-6: гейт замены. Просрочка — жёсткий блок (§8); понижение ликвидности — как и покрытие,
     допускается только комиссией с обоснованием. */
  const reps = replacementInfo(c, ds.ops);
  const repOverdue = reps.filter(r=>r.overdue);
  if(repOverdue.length) return toast('Замена при просроченной задолженности не допускается (§8): кредит '+repOverdue.map(r=>r.credit).join(', '),'warn');
  /* Р-14 (Прил.3 §3.5): согласие отраслевого департамента и заключение ДАК о ликвидности —
     ДВА новых жёстких требования при замене. Не проходят через комитет — обязательны всегда. */
  let deptConsent = '', dakConclusion = '';
  if(reps.length){
    deptConsent = val('dsDeptConsent').trim();
    dakConclusion = val('dsDakConclusion').trim();
    const deptChk = Boolean((document.getElementById('dsDeptConsentChk')||{}).checked);
    if(!deptConsent || !deptChk) return toast('Замена требует согласия отраслевого департамента (Прил.3 §3.5): укажите реквизит и подтвердите чек-боксом','warn');
    if(!dakConclusion) return toast('Замена требует заключения ДАК о ликвидности (Прил.3 §3.5)','warn');
  }
  const repDrop = reps.some(r=>r.drop && !r.overdue);
  const { outValue, inValue } = reps.length ? replacementValues(c, ds.ops) : { outValue:0, inValue:0 };
  const repEquivShort = reps.length && inValue < outValue;
  const before = gateCheck(c), after = gateCheck(v);
  /* Худший по покрытию кредит пакета — тот же смысл, что и Math.min(...ratio) ниже,
     но с сохранением его req (Д-2): порог — функция состава, не константа 120%. */
  const worst = after.rows.reduce((a,b)=> b.ratio<a.ratio?b:a);
  let obosn = '';
  if(!after.ok || repDrop || repEquivShort){
    if(!canCommittee()) return toast('Гейт не пройден (покрытие/ликвидность/равноценность): допуск возможен только комитетом по администрированию бюджетных кредитов','warn');
    obosn = val('dsObosn').trim();
    if(!obosn) return toast('Допуск (покрытие ниже порога / понижение ликвидности / равноценность) требует обоснования','warn');
  }
  const no = 'ДС-' + String(c.addenda.length+1).padStart(2,'0') + '/' + TODAY.slice(6);
  const diff = after.rows.map(r => {
    const b = before.rows.find(x=>x.id===r.id);
    return { id:r.id, before: b ? pct(b.ratio) : '—', after: pct(r.ratio), up: !b || r.ratio >= (b ? b.ratio : 0) };
  });
  const opLines = ds.ops.map(opText);
  reps.forEach(r => opLines.push(`Ликвидность (замена по ${r.credit}): ранг Σ${r.outRank} → Σ${r.inRank}${r.drop?' — понижение, допущено комиссией':' — не понижается'}`));
  if(reps.length) opLines.push(`Равноценность замены: выводится ${fmt(outValue)} / вводится ${fmt(inValue)}${repEquivShort?' — не соблюдена, допущено комиссией':' — соблюдена'}. Согласие департамента: «${deptConsent}». Заключение ДАК: «${dakConclusion}».`);
  c.addenda.push({ no, date: TODAY, ops: opLines, diff, obosn, req: worst.req,
    replacement: reps.length ? { deptConsent, dakConclusion, outValue, inValue, equivalenceOk: !repEquivShort } : null });
  const touched = [...new Set(c.allocs.map(a=>a.item))];   // предметы договора ДО применения пакета
  c.allocs = v.allocs; c.credits = v.credits;
  c.allocs.forEach(a => { item(a.item).everPledged = true; });
  /* Для каждого затронутого предмета, у которого доли обнулились и есть запрет —
     он подлежит снятию. Само снятие — акт в органе, молча в коде не снимаем. */
  touched.forEach(iid => { const it = item(iid);
    if(it.ban && !it.ban.pendingRelease && allocatedLegal(iid) === 0){
      it.ban.pendingRelease = true;
      hist(it, `Предмет выведен доп соглашением ${no} — запрет на отчуждение ${it.ban.regNo} подлежит снятию в «${organOf(it)}» (снятие оформляется актом)`);
    }
  });
  if(!after.ok) c.undercovered = { ratio: worst.ratio, req: worst.req, obosn, by: role, date: TODAY };
  hist(c, `Доп соглашение ${no} зарегистрировано (${ds.ops.length} операц.): ${ds.ops.map(opText).join(' · ')}. Обеспеченность после: ${histCoverList(after.rows)}${obosn ? `. Допущено комиссией ниже порога ${pct(worst.req)}: «${obosn}»` : ''}`);
  closeModal(); toast('Доп соглашение '+no+' зарегистрировано — изменения вступили в силу','ok');
  ds = { cid:null, ops:[] }; refresh();
}
/* Р-14: «Отказать в замене» — альтернатива регистрации, когда офицер/комиссия решает НЕ
   допускать замену (равноценность/согласие/ДАК/ранг не устраивают). История — обязательна;
   реестр мониторинга не трогаем (см. бриф) — заметка всплывает на карточке договора. */
function dsRefuseReplacement(){
  const c = contract(ds.cid);
  const reps = replacementInfo(c, ds.ops);
  if(!reps.length) return;
  const reason = val('dsRefuseReason').trim();
  if(!reason) return toast('Укажите причину отказа в замене','warn');
  c.replacementRefusal = { date: TODAY, reason, by: role, credits: reps.map(r=>r.credit) };
  hist(c, `Отказано в замене залога по кредиту(ам) ${reps.map(r=>r.credit).join(', ')} (Прил.3 §3.5): «${reason}»`);
  closeModal(); toast('Отказ в замене зафиксирован — история договора обновлена','warn');
  ds = { cid:null, ops:[] }; refresh();
}

/* ---------- ПОГАШЕНИЕ КРЕДИТА → АВТОМАТИЧЕСКОЕ ВЫСВОБОЖДЕНИЕ ДОЛЕЙ (§4.2) ---------- */
function repay(cid, creditId){
  if(!canCurate()) return denyEdit();
  const cr = credit(creditId);
  modal(`<div class="modal form narrow">${mhead('Полное погашение кредита · '+creditId)}
    <div class="modal-b">
      <div class="warn-inline"><span>Частичное погашение долю не уменьшает — только доп соглашением.</span></div>
      <p class="phead-sub">Кредит ${creditId} · ${esc(cr.num)} · сумма ${fmt(cr.amount)}. Если это последний действующий кредит договора — договор будет закрыт, предметы освобождены.</p>
    </div>${mfoot('Отметить погашенным','doRepay(\''+cid+'\',\''+creditId+'\')','btn-success')}</div>`);
}
function doRepay(cid, creditId){
  const cr = credit(creditId);
  cr.status = 'Погашен';
  const touched = new Set();
  CONTRACTS.forEach(c => {
    const gone = c.allocs.filter(a=>a.credit===creditId);
    if(!gone.length) return;
    gone.forEach(a => touched.add(a.item));
    c.allocs = c.allocs.filter(a=>a.credit!==creditId);
    hist(c, `Кредит ${creditId} полностью погашен → автоматически высвобождены доли: ${gone.map(a=>a.item+' ('+fmt(a.share)+')').join(', ')}`);
    gone.forEach(a => hist(item(a.item), `Доля ${fmt(a.share)} по ${creditId} высвобождена автоматически (кредит погашен). Доступно: ${fmt(availableOf(item(a.item)))}`));
    const live = c.credits.filter(id => credit(id).status === 'Действующий');
    if(!live.length && isActive(c)){
      c.allocs.forEach(a => touched.add(a.item));
      c.status = 'Закрыт'; c.allocs = [];
      hist(c, 'Все кредиты договора погашены → договор закрыт, предметы освобождены (закрытие договора и есть правовой акт)');
    }
  });
  /* После высвобождения долей: предмет с обнулившимися долями и действующим запретом
     подлежит снятию. Само снятие — акт в органе, автоматом не выполняется. */
  let staleN = 0;
  touched.forEach(iid => { const it = item(iid);
    if(it.ban && !it.ban.pendingRelease && allocatedLegal(iid) === 0){
      it.ban.pendingRelease = true; staleN++;
      hist(it, `Доли высвобождены — запрет на отчуждение ${it.ban.regNo} подлежит снятию в «${organOf(it)}» (снятие оформляется актом)`);
    }
  });
  closeModal(); toast('Кредит погашен. Доли высвобождены автоматически','ok');
  if(staleN) toast('Запрет на отчуждение подлежит снятию: доли по предмету обнулились. Оформите акт снятия в органе','warn');
  refresh();
}
