      <tbody>${dos.extras.length ? dos.extras.map(f=>{ const fi = it.files.indexOf(f); return `<tr>
        <td>${esc(f.tag)}</td><td>${esc(f.name)}</td><td>${esc(f.docNo||'—')}</td><td>${f.docDate||f.when}</td><td>${esc(f.who)}</td>
        ${canCurate()?`<td><button class="btn btn-tint btn-sm" onclick="openEditFile('item','${it.id}',${fi})">Исправить</button>
          <button class="btn btn-tint btn-sm danger" onclick="openDetachFile('item','${it.id}',${fi})">Открепить</button></td>`:''}</tr>`;}).join('')
        : `<tr><td colspan="${canCurate()?6:5}"><div class="cgrid-empty">Вложений сверх обязательного комплекта нет</div></td></tr>`}</tbody>
    </table></div>
    ${/* КП-8: откреплённые файлы не исчезают — видны отдельным списком с основанием.
         Физического удаления в модуле нет ни у одной записи (паттерн сторно Р-33). */''}
    ${(it.files||[]).some(f=>f.detached) ? `<p class="section-h" style="margin-top:22px">Откреплённые файлы</p>
    <div class="cgrid-wrap"><table class="cgrid">
      <thead><tr><th>Тип документа</th><th>Файл</th><th>Дата документа</th><th>Открепил</th><th>Основание</th></tr></thead>
      <tbody>${(it.files||[]).filter(f=>f.detached).map(f=>`<tr class="voided-row">
        <td style="text-decoration:line-through">${esc(f.tag)}</td>
        <td style="text-decoration:line-through">${esc(f.name)}</td>
        <td style="text-decoration:line-through">${f.docDate||f.when}</td>
        <td>${esc(f.detached.by)} · ${f.detached.date}</td>
        <td>${esc(f.detached.reason)}</td></tr>`).join('')}</tbody>
    </table></div>` : ''}
    </div>`;

  /* ---- Р-58: лента с категориями, годами и порционной догрузкой (паттерн карточки заёмщика). ---- */
  const hAll = [...it.history].map(h => ({ ...h, cat: histCat(h) })).reverse();
  const hCnt = k => hAll.filter(h => h.cat === k).length;
  /* КП-Д2: чип активного фильтра показывается ДАЖЕ при нуле записей. Раньше chips
     фильтровались по c.n, и при пустой категории не подсвечивался ни один чип —
     лента выглядела просто пустой, без объяснения. */
  const chips = [{ k:'all', l:'Все', n:hAll.length }]
    .concat(Object.keys(HIST_LBL).map(k => ({ k, l:HIST_LBL[k], n:hCnt(k) })).filter(c => c.n || c.k === histFilter));
  const hFil = hAll.filter(h => histFilter === 'all' || h.cat === histFilter);
  const hShow = hFil.slice(0, histLimit);
  let lastYear = null;
  const pHist = `<div class="panel-wrap">
    <p class="section-h">История предмета</p>
    <div class="hchips">${chips.map(c=>`<button class="hchip${histFilter===c.k?' on':''}" onclick="itemHistFilter('${c.k}')">${esc(c.l)}<span class="hchip-n">${c.n}</span></button>`).join('')}</div>
    <div class="hist">${hShow.map(h=>{
      const y = (h.when||'').slice(6,10), hdr = y && y !== lastYear ? `<div class="hyear">${y}</div>` : '';
      lastYear = y || lastYear;
      return hdr + `<div class="hrow"><div class="hwhen">${h.when}</div><div class="hwhat">${esc(h.what)}</div><div class="hwho">${esc(h.who)}</div></div>`;
    }).join('') || `<div class="cgrid-empty">В категории «${esc(HIST_LBL[histFilter] || 'Все')}» записей нет — снимите фильтр, чтобы увидеть все ${hAll.length}</div>`}</div>
    ${hFil.length > hShow.length ? `<div class="hmore"><button class="btn btn-tint btn-sm" onclick="itemHistMore()">Показать ещё (осталось ${hFil.length - hShow.length})</button></div>` : ''}
    </div>`;

  return [p0, p1, p2, p3, p4, pDocs, pHist];
}

/* ---- Р-7 техническая допустимость (Прил.1 §2.5): возраст, происхождение, полис.
   Это реквизиты самой вещи, поэтому живут на вкладке «Основное» карточки предмета
   (вкладки допуска нет). Не-техника получает пустую строку — блок не рисуется. ---- */
function techPanel(it){
  if(!isTech(it)) return '';
  /* Р-17: возрастной флаг не всегда «приём не допускается» — жёсткий блок только для
     «дополнительный» залог сверх лимита; «основной» сверх лимита — допуск решением комитета. */
  const ageChk = techAge(it)!=null ? techAgeCheck({ securityRole: it.securityRole||'основной', origin: it.origin, age: techAge(it) }) : null;
  const techBlock = isTech(it) ? `<p class="section-h" style="margin-top:20px">Техническая допустимость</p>
    <div class="panel-card"><div class="f2">
      ${ro('Год выпуска', it.year||'—')}
      ${ro('Возраст', techAge(it)!=null ? techAge(it)+' лет (лимит '+techAgeLimit(it)+' — '+it.origin+')' : '—')}
      ${ro('Происхождение', it.origin||'—')}
      ${ro('Роль обеспечения', it.securityRole||'—')}
      ${/* КП-Д8: строка «Страховой полис» снята — это дубль строки «Страхование (§3.4)»
           выше на той же вкладке. Ось страхования шире техники (Р-46), поэтому единственное
           её место — общий блок паспорта, а не техблок. Флаги полиса ниже остаются. */''}
    </div>
    ${ageChk && (ageChk.block || ageChk.needCommittee) ? `<div class="flagline" style="margin-top:12px"><span>${esc(ageChk.msg)}</span></div>` : ''}
    ${!techInsuredOk(it) ? `<div class="flagline" style="margin-top:12px"><span>Техника-обеспечение не застрахована.</span></div>`
      : techPolicyExpired(it) ? `<div class="flagline" style="margin-top:12px"><span>Страховой полис ${esc(it.insured.policy)} истёк ${it.insured.till} — триггер «страхование техники истекло».</span></div>`
      : `<div class="okline" style="margin-top:12px"><span>Техническая допустимость соблюдена.</span></div>`}
    </div>` : '';
  return `<div>${techBlock}</div>`;
}
function itemFooter(it){
  // Действия предмета живут в тулбарах своих вкладок (переоценка → «Стоимость»,
  // запрет → «Запрет на отчуждение», обследование → «Обследования») — рядом со
  // своим статусом, гейтами и историей. Футер несёт только выход из карточки.
  /* Р-40: печатные формы предмета — акт обследования (Прил.2 §2.3/§2.4) и извещение о восполнении
     (Прил.2 §2.5, только если извещение оформлено). Печать доступна любой роли. */
  const prints = actionBtn(true, 'Печать акта обследования', `printForm('акт','${it.id}')`, { cls:'btn-tint btn-sm' })
    + (it.restoreNotice ? actionBtn(true, 'Печать извещения о восполнении', `printForm('извещение','${it.id}')`, { cls:'btn-tint btn-sm' }) : '');
  return `<button class="btn btn-secondary" onclick="showView('list')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Закрыть</button>${prints}`;
}

/* Р-19 (ПОЛ §11.1–11.2): движение кредитно-залоговых документов — 6 шагов, каждый несёт
   дату/исполнителя/реквизит. Шаг без даты — не пройден; последний (архивный) шаг без даты
   → маршрут НЕЗАВЕРШЁН (см. docRouteIncomplete/DOC_ROUTE_DAYS). Договоры без docRoute
   (заведены до Р-19) блок не показывают — молчим, а не ложно сигналим. */
function docRouteBlock(c){
  const route = c.docRoute;
  if(!Array.isArray(route) || !route.length) return '';
  const incomplete = docRouteIncomplete(c, DOC_ROUTE_DAYS);
  return `<p class="section-h" style="margin-top:0">Движение кредитно-залоговых документов (ПОЛ §11)</p>
    ${incomplete ? `<div class="flagline" style="margin-bottom:12px"><span>Маршрут не завершён более ${DOC_ROUTE_DAYS} дней после регистрации ${c.date} — документы не дошли до архивного шага (ПОЛ §11.1–11.2).</span></div>` : ''}
    <div class="cgrid-wrap" style="margin-bottom:22px"><table class="cgrid">
      <thead><tr><th>Шаг</th><th>Дата</th><th>Исполнитель</th><th>Реквизит</th><th>Статус</th></tr></thead>
      <tbody>${route.map(r => `<tr>
        <td>${esc(r.step)}</td>
        <td>${r.date || '—'}</td>
        <td>${r.who ? esc(r.who) : '—'}</td>
        <td>${r.req ? esc(r.req) : '—'}</td>
        <td>${r.date ? '<span class="pill low">пройден</span>' : '<span class="pill high">не завершён</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
}

/* Р-5 (§5.2): обязательный пакет документов договора — АГРЕГАТ по всем предметам.
   Каждый предмет несёт свой набор обязательных предпосылок (prereqReq зависит от
   pledgerType). Показываем только ОБЯЗАТЕЛЬНЫЕ строки (чек-лист «что должно быть»),
   красным — отсутствующие. Тот же togglePrereq, что и на карточке предмета: правка
   инлайн (refresh перерисует карточку договора и пересчитает этот блок). Это ровно
   гейт предпосылок §5.2 — тот, что блокирует регистрацию (см. openRegister/doRegister). */
function prereqBlock(c){
  const its = [...new Set(c.allocs.map(a=>a.item))].map(item);
  if(!its.length) return '';
  const rows = [];
  its.forEach(it => { const req = prereqReq(it), pr = it.prereqs || {};
    PREREQ_KEYS.filter(k => req[k].required).forEach(k => {
      const present = (pr[k]||{}).present;
      /* КП-Д10: ссылка вела на вкладку «Документы» предмета (индекс 5) — но предпосылок §5.2
         там нет: Р-52 увёл их с карточки предмета в этот самый агрегат на договоре, и ни одна
         из семи вкладок предмета их больше не показывает. Оформитель кликал и попадал в
         досье файлов, где искомого нет. Ведём на «Основное» — паспорт вещи, где виден тип
         залогодателя, от которого состав предпосылок и зависит; закрываются они кнопкой
         в этой же строке. */
      rows.push(`<tr>
        <td><span class="rowlink" title="Открыть паспорт предмета — состав предпосылок §5.2 зависит от типа залогодателя" onclick="openCard('item','${it.id}',0)">${it.id} · ${esc(it.name)}</span></td>
        <td>${esc(req[k].label)}</td>
        <td><span class="pill ${present?'low':'high'}">${present?'приложено':'обязателен, отсутствует'}</span></td>
        <td>${(pr[k]||{}).doc ? esc(pr[k].doc) : '—'}</td>
        ${canCurate()?`<td><button class="btn btn-tint btn-sm" onclick="togglePrereq('${it.id}','${k}')">${present?'Открепить':'Приложить документ'}</button></td>`:''}
      </tr>`);
    });
  });
  const miss = its.flatMap(prereqMissing);
  const head = `<p class="section-h" style="margin-top:0">Обязательный пакет документов (§5.2)</p>
    <div class="${miss.length?'flagline':'okline'}" style="margin-bottom:12px"><span>${miss.length
      ? ('Не приложено обязательных документов: '+miss.length+'. Регистрация договора заблокирована гейтом предпосылок §5.2.')
      : 'Обязательный пакет §5.2 собран полностью.'}</span></div>`;
  if(!rows.length) return head + `<div class="cgrid-empty" style="border:1px solid var(--border-default);border-radius:4px;margin-bottom:22px">По предметам договора обязательных предпосылок §5.2 нет</div>`;
  return head + `<div class="cgrid-wrap" style="margin-bottom:22px"><table class="cgrid">
    <thead><tr><th>Предмет</th><th>Что требуется</th><th>Статус</th><th>Документ</th>${canCurate()?'<th></th>':''}</tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
}

/* ---------- КАРТОЧКА ЗАЛОГОВОГО ДОГОВОРА ---------- */
/* КП-2: ШАПКА ДОГОВОРА — своя функция, рисуется в слот #detailHead и потому видна на всех
   шести вкладках. Всё, что ей нужно (gate, items), считается заново: обе функции чистые
   и дешёвые, а разделяемое состояние между рендерами было бы хуже пересчёта. */
function ctrHead(c){
  const gate = gateCheck(c);
  const items = [...new Set(c.allocs.map(a=>a.item))];
  return `<div class="phead">
    <div class="phead-top">
      <div class="phead-name"><span class="nm">${c.no || 'Залоговый договор (черновик)'}</span>
        <a onclick="toast('Переход в карточку заёмщика (модуль «Заёмщики»)')">${esc(clientName(c.inn))} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg></a>
        <div class="phead-sub" style="width:100%">${c.id} · ${c.credits.length} кредит(ов) · ${items.length} предмет(ов)</div>
      </div>
      <span class="phead-owner"><span class="pill ${isActive(c)?'low':c.status==='На рассмотрении комиссии'?'high':'neutral'}">${c.status}</span></span>
    </div>
    ${c.status==='На рассмотрении комиссии' ? `<div class="phead-banner danger">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>Контрольный гейт покрытия не пройден (${gate.rows.filter(r=>!r.ok).map(r=>`${r.id} — обеспеченность ${pct(r.index)} < 100% (залог ${pct(r.idxPledge)}${r.gReq!=null?` + гарантия ${pct(r.idxGuar)}`:''})`).join('; ')}) — регистрация ЗАБЛОКИРОВАНА до решения комитета по администрированию бюджетных кредитов. Комиссия либо возвращает на доработку (догрузить/заменить предмет), либо допускает недообеспеченный кредит с обязательным обоснованием.</span></div>` : ''}
    ${c.undercovered ? `<div class="phead-banner warn">
      <span>Допущен комиссией с покрытием ниже порога ${pct(c.undercovered.req)} (${pct(c.undercovered.ratio)}). Обоснование: «${esc(c.undercovered.obosn)}» · ${esc(c.undercovered.by)} · ${c.undercovered.date}</span></div>` : ''}
    ${c.replacementRefusal ? `<div class="phead-banner warn">
      <span>Отказано в замене залога по кредиту(ам) ${c.replacementRefusal.credits.join(', ')} (Прил.3 §3.5). Причина: «${esc(c.replacementRefusal.reason)}» · ${esc(c.replacementRefusal.by)} · ${c.replacementRefusal.date}</span></div>` : ''}
    <div class="phead-dims">
      ${kpi('Статус', contractStatusCell(c))}
      ${/* ДГ-6: карточка и строка реестра берут пилюлю из ОДНОГО источника (coverageCell) —
           раньше у карточки была своя копия, красившая черновик красным и молчавшая о доле
           ликвида ровно так же, как строка. Один договор в двух местах не должен читаться
           по-разному. */''}
      ${kpi('Обеспеченность к порогу', coverageCell(c))}
    </div></div>`;
}

function ctrPanels(c){
  const virtual = isActive(c) ? null : c;
  const cs = ctx(virtual);
  const gate = gateCheck(c);
  const items = [...new Set(c.allocs.map(a=>a.item))];
  const thirdParty = items.filter(i => item(i).pledger !== c.inn);
  /* Запреты на отчуждение — вычисляемый оверлей поверх статуса «Зарегистрирован»,
     НЕ отдельный статус договора (как «покрытие — оверлей, не статус»). Считается
     только по зарегистрированному договору: до регистрации оснований для запрета нет. */
  const banItems  = isActive(c) ? items.filter(i => banRequired(item(i))) : [];
  const banPlaced = banItems.filter(i => item(i).ban);
  const banMiss   = banItems.filter(i => !item(i).ban);

  const p0 = `<div class="panel-wrap"><div class="panel-card">
    <div class="gtoolbar" style="margin-bottom:14px">${actionBtn(canHeadOfUnit(), 'Исправить реквизиты договора', `openEditContract('${c.id}')`)}</div>
    <p class="section-h" style="font-size:16px;margin-top:0">Договор</p>
    <div class="f2">
      ${ro('Номер договора', c.no || '—')}
      ${ro('Дата договора', c.date || '—')}
      ${ro('Заёмщик (кредиты договора)', clientName(c.inn)+' · ИНН '+c.inn)}
      ${ro('Залогодатель(и)', [...new Set(items.map(i=>clientName(item(i).pledger)))].join(', ') || '—')}
    </div>
    <p class="section-h" style="font-size:16px;margin-top:18px">Регистрация</p>
    <div class="f2">
      ${ro('Нотариус', c.notary || '—')}
      ${ro('№ / дата нотариальной регистрации', c.notaryNo ? c.notaryNo+' от '+c.notaryDate : '—')}
      ${ro('Залоговое рег. свидетельство', c.cert || '—')}
    </div>
    ${banMiss.length ? `<div class="flagline" style="margin-top:14px"><span>Оформление не завершено: по предметам ${banMiss.join(', ')} не наложен запрет на отчуждение (срок до ${banDeadline(item(banMiss[0]))}). Договор зарегистрирован, но залог не защищён от продажи.</span></div>` : ''}
    ${thirdParty.length ? `<div class="infoline" style="margin-top:14px"><span>В договоре есть предметы, чей залогодатель ≠ заёмщик (${thirdParty.map(i=>i+' · '+clientName(item(i).pledger)).join('; ')}).</span></div>` : ''}
    </div></div>`;

  const editable = isDraftish(c) && canCurate();
  /* Группировка по предмету: атрибуты предмета (вид/залогодатель/залоговая/запрет)
     rowspan'ятся, под-строки — по кредитам, которые предмет обеспечивает.
     Убирает построчный дубль, когда один предмет обеспечивает несколько кредитов. */
  const itemGroups = [];
  c.allocs.forEach((a,i)=>{ let g = itemGroups.find(x=>x.item===a.item); if(!g){ g = { item:a.item, rows:[] }; itemGroups.push(g); } g.rows.push({ a, i }); });
  const totalEff = c.allocs.reduce((s,a)=>s+effShare(cs, a.item, a.share),0);
  const colCount = editable ? 9 : 8;
  const p1 = `<div class="panel-wrap">
    ${editable ? `<div class="gtoolbar">
      <button class="btn btn-tint btn-sm" onclick="openNewItem('${c.id}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Создать новый предмет</button>
      <button class="btn btn-tint btn-sm" onclick="openAlloc('${c.id}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Привязать существующий</button></div>` : ''}
    <div class="cgrid-wrap"><table class="cgrid">
      <thead><tr><th>Предмет</th><th>Вид</th><th>Залогодатель</th><th>Кредит</th><th class="numcell">Залоговая стоимость</th><th class="numcell">Обеспечивает</th><th>Запрет</th><th>Допуск</th>${editable?'<th></th>':''}</tr></thead>
      <tbody>${itemGroups.length ? itemGroups.map(g=>{ const it = item(g.item), rs = g.rows.length;
        return g.rows.map((r,ri)=>{ const a = r.a, eff = effShare(cs, it.id, a.share);
          const creditCell = `<td>${a.credit}</td>`;
          const shareCell = `<td class="numcell">${fmt(a.share)}${eff < a.share - 0.005 ? ` <span class="pill high" title="залоговая упала ниже суммы долей — фактически учтено ${fmt(eff)}">усечена → ${fmt(eff)}</span>` : ''}</td>`;
          const actionCell = editable ? `<td><button class="btn btn-tint btn-sm danger" onclick="dropAlloc('${c.id}',${r.i})">Убрать</button></td>` : '';
          if(ri>0) return `<tr>${creditCell}${shareCell}${actionCell}</tr>`;
          return `<tr>

    <div class="cgrid-wrap"><table class="cgrid">

      <tbody>${c.credits.map(id=>{ const r = gate.rows.find(x=>x.id===id), cr = credit(id);

        <td class="numcell">${fmt(cr.amount)}</td>
        <td class="numcell">${r.other ? '<span class="pill neutral">—</span>' : `${pct(r.req)} · ${fmt(need)}`}</td>
        <td class="numcell">${fmt(r.sum)}</td>
        <td class="numcell">${defCell}</td>
        <td><span class="pill ${r.ok?'low':(r.covOk?'mid':'high')}">${pct(r.ratio)}</span></td>
        <td><span class="pill ${r.index>=1?'low':'high'}" title="залог ${pct(r.idxPledge)}${r.gReq?` + гарантия ${pct(r.idxGuar)} (порог ${pct(r.gReq)})`:''} = индекс ${pct(r.index)}">${pct(r.index)}</span></td>

        <td>${cr.status}${cr.overdue?' <span class="pill high">просрочка</span>':''}</td>
        ${canCurate()&&isActive(c) ? `<td>${cr.status==='Действующий' ? `<button class="btn btn-tint btn-sm" onclick="repay('${c.id}','${id}')">Отметить погашенным</button>` : '—'}</td>` : ''}</tr>`; }).join('')}
        <tr class="total"><td colspan="2">Итого по договору</td><td class="numcell">${fmt(totAmt)}</td><td class="numcell"></td><td class="numcell">${fmt(totSec)}</td><td class="numcell"></td><td><span class="pill ${totSec>=totAmt?'low':'high'}">${pct(totAmt ? totSec/totAmt : 0)}</span></td><td></td><td></td><td></td>${canCurate()&&isActive(c)?'<td></td>':''}</tr></tbody>
    </table></div>
    ${gate.ok ? `<div class="okline" style="margin-top:14px"><span>Гейт покрытия пройден по всем кредитам договора.</span></div>`
      : `<div class="flagline" style="margin-top:14px"><span>Гейт покрытия НЕ пройден: ${gate.rows.filter(r=>!r.ok).map(r=>`${r.id} — ${pct(r.ratio)} (порог ${pct(r.req)}${r.liqApplies&&!r.liqOk?`, доля ликвида ${pct(r.liqShare)}<80%`:''})`).join(', ')}. ${isActive(c)
        ? 'Триггер «недостаточность обеспечения» во взыскание.'
        : 'Регистрация заблокирована до решения комиссии.'}</span></div>`}
    ${(()=>{ const lines = c.credits.map(id=>suretyLayerLine(id)).filter(Boolean);
      return lines.length ? `<div class="infoline" style="margin-top:14px"><span><b>Поручительство (вне индекса):</b><br>${lines.map(esc).join('<br>')}</span></div>` : ''; })()}
    </div>`;

  const p3 = `<div class="panel-wrap">
    ${isActive(c) && canDs() ? `<div class="gtoolbar"><button class="btn btn-tint btn-sm" onclick="openDs('${c.id}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Новое доп соглашение</button></div>`
      : ''}
    ${c.addenda.length ? c.addenda.map(d=>`<div class="panel-card" style="margin-bottom:14px">
      <div class="section-h" style="font-size:16px">${d.no} от ${d.date} <span class="pill low">зарегистрировано</span></div>
      <div class="cgrid-wrap" style="margin:10px 0"><table class="cgrid">
        <thead><tr><th>Операции пакета</th></tr></thead>
        <tbody>${d.ops.map(o=>`<tr><td>${esc(o)}</td></tr>`).join('')}</tbody></table></div>
      <div class="cgrid-wrap"><table class="cgrid">

        <tbody>${d.diff.map(x=>`<tr><td>${x.id}</td><td>${x.before}</td>
          <td class="${x.up?'diff-up':'diff-dn'}">${x.after}</td></tr>`).join('')}</tbody></table></div>
      ${d.obosn ? `<div class="flagline" style="margin-top:12px"><span>Допущено комиссией ниже порога ${pct(d.req)}. Обоснование: «${esc(d.obosn)}»</span></div>` : ''}
    </div>`).join('') : `<div class="cgrid-empty" style="border:1px solid var(--border-default);border-radius:4px">Доп соглашений нет</div>`}
    </div>`;

  const pDocs = `<div class="panel-wrap">
    ${prereqBlock(c)}
    ${docRouteBlock(c)}
    <p class="section-h">Документы договора</p>
    <div class="gtoolbar">${actionBtn(canCurate(), 'Прикрепить файл', `openAttach('contract','${c.id}')`)}</div>

  const p4 = `<div class="panel-wrap">
    <div class="hist">${[...c.history].reverse().map(h=>`<div class="hrow"><div class="hwhen">${h.when}</div><div class="hwhat">${esc(h.what)}</div><div class="hwho">${esc(h.who)}</div></div>`).join('')}</div></div>`;

  return [p0,p1,p2,p3,pDocs,p4];

function ctrFooter(c){
  /* Р-40: печатные формы договора — опись предметов и справка об обеспеченности (разбор
     индекса). Печать доступна любой роли (выдача наружу, не правка). */
  const prints = actionBtn(true, 'Печать описи', `printForm('опись','${c.id}')`, { cls:'btn-tint btn-sm' })
    + actionBtn(true, 'Справка об обеспеченности', `printForm('справка','${c.id}')`, { cls:'btn-tint btn-sm' });
  const back = `<button class="btn btn-secondary" onclick="showView('list')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Закрыть</button>${prints}<div style="flex:1"></div>`;
  /* Р-31/Р-34: аннулирование ошибочного черновика — только на «черновых» статусах (isDraftish),
     кнопка видна на этих статусах, но активна лишь роли-куратору. */
  const cancelBtn = isDraftish(c)
    ? actionBtn(canCurate(), 'Аннулировать черновик', `openCancelDraft('${c.id}')`, { cls:'btn-danger' }) : '';
  if(c.status==='Оформляется'){
    /* Р-29: договор, допущенный комитетом (undercovered) — куратор регистрирует полной формой. */
    const admitted = c.undercovered ? `<span class="pill mid" title="Недообеспечение допущено комитетом по администрированию бюджетных кредитов">допущен комитетом</span>` : '';
    return back + admitted + cancelBtn + actionBtn(canCurate(), 'Зарегистрировать договор', `openRegister('${c.id}')`, { cls:'btn-primary' });
  }
  if(c.status==='На рассмотрении комиссии')
    return back + cancelBtn + actionBtn(canCurate(), 'Повторить проверку гейта', `openRegister('${c.id}')`, { cls:'btn-tint' })
      + actionBtn(canCommittee(), 'Решение комитета по администрированию бюджетных кредитов', `openCommission('${c.id}')`, { cls:'btn-primary' });
  return back;
}

/* ============================================================
   КАРТОЧКА ДОГОВОРА ПОРУЧИТЕЛЬСТВА (§14, Р-25/Р-26). Вкладки TABS_SUR:
   «Основное» / «Допуск §9.1/9.2» / «История». Форма — «типовая, Приложение 7».
   ============================================================ */
/* Метаданные гейтов допуска (Р-26). person — применим только к физлицу;
   married — дополнительно только когда физлицо в браке; иначе применим всегда. */
const GATE_DEFS = [
  { code:'Г1', norm:'§9.1', text:'Возраст поручителя-физлица ∈ [18; 70] на дату договора', person:true },
  { code:'Г2', norm:'§9.1', text:'Подтверждённый стабильный ежемесячный доход (документ-подтверждение)', person:true },
  { code:'Г3', norm:'§9.1', text:'Отсутствие просроченной задолженности: перед ГФХ и иными ФКУ', both:true },
  { code:'Г4', norm:'§9.2', text:'Нотариально удостоверенное согласие супруга(и)', person:true, married:true },
  { code:'Г5', norm:'§9.2', text:'Нотариальное удостоверение самого договора поручительства', both:true },
];
function gateApplies(def, g){
  if(def.both) return true;
  if(!guarantorIsPerson(g)) return false;      // Г1/Г2/Г4 — только физлицо
  if(def.married) return Boolean(g.married);    // Г4 — только физлицо в браке
  return true;
}
/* КП-2: ШАПКА ПОРУЧИТЕЛЬСТВА — своя функция, слот #detailHead, видна на всех трёх вкладках. */
function surHead(s){
  const g = guarantor(s.guarantor) || {}, gate = guarantorGate(s.id);
  const gateBadge = gate.ok ? '<span class="pill low">допущен §9.1/9.2</span>'
    : `<span class="pill high">не пройден: ${gate.fails.map(f=>f.code).join(', ')}</span>`;
  return `<div class="phead">
    <div class="phead-top">
      <div class="phead-name"><span class="nm">${esc(g.name||s.guarantor)}</span>
        <div class="phead-sub" style="width:100%">${s.id} · ${esc(s.no||'черновик')} · ${esc(g.type||'—')} · кредит ${esc(s.credit)}</div>
      </div>
      <span class="phead-owner">${suretyStatusPill(s)}</span>
    </div>
    <div class="phead-dims">
      ${kpi('Статус ЖЦ', s.status)}
      ${kpi('Допуск §9.1/9.2', gateBadge)}
      ${kpi('Объём ответственности', 'солидарно на всю сумму')}
    </div></div>`;
}

function surPanels(s){
  const g = guarantor(s.guarantor) || {}, cr = credit(s.credit) || {}, gate = guarantorGate(s.id);
  const failByCode = {}; gate.fails.forEach(f=>failByCode[f.code]=f.text);

  const p0 = `<div class="panel-wrap"><div class="panel-card">
    <p class="section-h" style="font-size:16px;margin-top:0">Договор поручительства</p>
    <div class="f2">
      ${ro('Номер договора', s.no || '—')}
      ${ro('Дата договора', s.date || '—')}
      ${ro('Форма', s.form || '—')}
      ${ro('Объём (scope)', s.scope || '—')}
    </div>
    <p class="section-h" style="font-size:16px;margin-top:18px">Поручитель</p>
    <div class="f2">
      ${ro('Идентификатор', s.guarantor)}
      ${ro('Тип лица', g.type || '—')}
      ${ro('ФИО / наименование', g.name || '—')}
      ${ro('Персональный номер (ПИН/ИНН)', g.pin || '—')}
      ${guarantorIsPerson(g) ? ro('Дата рождения', g.birthDate || '—') : ''}
      ${ro('Контакты', g.contacts || '—')}
      ${ro('Адрес', g.address || '—')}
    </div>
    <p class="section-h" style="font-size:16px;margin-top:18px">Обеспечиваемый кредит</p>
    <div class="f2">
      ${ro('Кредит', s.credit + (cr.num ? ' · '+cr.num : ''))}
      ${ro('Заёмщик', cr.inn ? clientName(cr.inn)+' · ИНН '+cr.inn : '—')}
      ${ro('Сумма кредита', cr.amount!=null ? fmt(cr.amount) : '—')}
      ${ro('Статус кредита', cr.status || '—')}
    </div>
    <p class="section-h" style="font-size:16px;margin-top:18px">Нотариальное удостоверение (Г5, §9.2)</p>
    <div class="f2">
      ${ro('Нотариус', (s.notary||{}).name || '—')}
      ${ro('Реестровый №', (s.notary||{}).regNo || '—')}
      ${ro('Дата удостоверения', (s.notary||{}).date || '—')}
    </div>
    </div></div>`;

  const rows = GATE_DEFS.map(def=>{
    const applies = gateApplies(def, g);
    const failed = applies && (def.code in failByCode);
    const stCell = !applies ? '<span class="pill neutral">неприменимо</span>'
      : failed ? '<span class="pill high">не пройден</span>' : '<span class="pill low">пройден</span>';
    const why = !applies ? (guarantorIsPerson(g) ? '—' : 'юрлицо — гейт не применяется')
      : failed ? esc(failByCode[def.code]) : 'условие выполнено';
    return `<tr><td>${def.code}</td><td>${def.norm}</td><td>${esc(def.text)}</td><td>${stCell}</td><td>${why}</td></tr>`;
  }).join('');
  const p1 = `<div class="panel-wrap"><div class="panel-card">
    <p class="section-h" style="font-size:16px;margin-top:0">Гейты допуска §9.1 / §9.2</p>
    <div class="cgrid-wrap"><table class="cgrid">
      <thead><tr><th style="width:56px">Гейт</th><th style="width:64px">Норма</th><th>Условие</th><th style="width:130px">Статус</th><th>Причина / примечание</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${gate.ok
      ? `<div class="okline" style="margin-top:14px"><span>Все применимые гейты §9.1/9.2 пройдены — договор допустим к переводу в «действует».</span></div>`
      : `<div class="flagline" style="margin-top:14px"><span>Допуск не пройден: ${gate.fails.map(f=>f.code+' — '+esc(f.text)).join('; ')}. Договор остаётся в статусе «черновик» и в слое обеспеченности не участвует.</span></div>`}
    </div></div>`;

  const p2 = `<div class="panel-wrap"><div class="cgrid-wrap"><table class="cgrid">
    <thead><tr><th style="width:150px">Когда</th><th>Событие</th><th style="width:230px">Кто</th></tr></thead>
    <tbody>${(s.history||[]).map(h=>`<tr><td>${esc(h.when)}</td><td>${esc(h.what)}</td><td>${esc(h.who)}</td></tr>`).join('')
      || `<tr><td colspan="3"><div class="cgrid-empty">История пуста</div></td></tr>`}</tbody>
  </table></div></div>`;

  return [p0, p1, p2];
}
function surFooter(s){
  const back = `<button class="btn btn-secondary" onclick="showView('list')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Закрыть</button><div style="flex:1"></div>`;
  if(!canCurate()) return back;
  if(s.status==='черновик')
    return back + `<button class="btn btn-primary" onclick="activateSurety('${s.id}')">Перевести в «действует»</button>`;
  if(s.status==='действует')
    return back + `<button class="btn btn-tint" onclick="releaseSurety('${s.id}')">Снять (при погашении)</button>`;
  return back;
}

/* ЖЦ-действия (§14.4). Мутация → запись в history → перерисовка. Гейтит canCurate()
   (куратор / заведующий отделом залогового обеспечения, ПОЛ §9.1). */
function activateSurety(dpId){
  if(!canCurate()) return denyEdit();
  const s = surety(dpId); if(!s) return;
  if(s.status !== 'черновик') return toast('Перевод возможен только из статуса «черновик»','warn');
  const gate = guarantorGate(dpId);
  if(!gate.ok) return toast('Допуск §9.1/9.2 не пройден: '+gate.fails.map(f=>f.code).join(', ')+' — перевод заблокирован','warn');
  s.status = 'действует';
  hist(s, 'Допуск §9.1/9.2 подтверждён, договор нотариально удостоверён → переведён в «действует» (§14.4)');
  toast(dpId+' переведён в «действует»','ok'); refresh();
}
function releaseSurety(dpId){
  if(!canCurate()) return denyEdit();
  const s = surety(dpId); if(!s) return;
  if(s.status !== 'действует') return toast('Снять можно только действующий договор','warn');
  if(!suretyReleaseAllowed(dpId))
    return toast('Досрочное снятие запрещено (Прил.7 п.4.2): снятие допускается только при полном погашении кредита '+s.credit,'warn');
  s.status = 'снято';
  hist(s, 'Обеспеченный кредит '+s.credit+' полностью погашён → поручительство снято (Прил.7 п.4.2)');
  toast(dpId+' снят (кредит погашен)','ok'); refresh();
}

function openNewSurety(){

      ${fsel('nsCredit','Обеспечиваемый кредит', surCreditOpts(), null, true)}
      ${fin('nsNo','Номер договора','')}

      ${fin('nsNotaryName','Нотариус','')}

function saveNewSurety(){
  const gId = val('nsGuar'), creditId = val('nsCredit');
  if(!gId || !guarantor(gId)) return toast('Выберите поручителя','warn');
  if(!creditId) return toast('Выберите кредит','warn');
  const s = { id: nextId(SURETIES,'ДП-'), no: val('nsNo').trim(), date: iso2d(val('nsDate')),
    guarantor: gId, credit: creditId,
    notary:{ name: val('nsNotaryName').trim(), regNo: val('nsNotaryNo').trim(), date: iso2d(val('nsNotaryDate')) },
    form:'типовая, Приложение 7', status:'черновик', scope:'солидарно на всю сумму обязательства', history:[] };
  hist(s, `Договор поручительства создан (черновик). Поручитель ${gId}, кредит ${creditId}`);
  SURETIES.push(s); closeModal(); toast('Черновик '+s.id+' создан','ok');

/* ============================================================
   ДИАЛОГИ И ДЕЙСТВИЯ — здесь состояние РЕАЛЬНО меняется.
   Каждое действие: валидация → мутация → запись в историю → перерисовка.
   ============================================================ */
const host = () => document.getElementById('modalHost');
const phost = () => document.getElementById('pickHost');
function pmodal(html){ phost().innerHTML = html; phost().classList.add('open'); }
function pclose(){ phost().classList.remove('open'); phost().innerHTML = ''; }
/* Т-1: предмет рождается на карточке договора (saveNewItem → openAlloc). Если привязку
   закрыть по Esc/крестику/оверлею, предмет остаётся в реестре непривязанным и без следа.
   _bornPending держит id только что рождённого предмета на время диалога привязки;
   closeModal ловит незакрытую привязку и помечает предмет осиротевшим (баннер на карточке). */
let _bornPending = null;
const itemHasAlloc = id => CONTRACTS.some(c => (c.allocs||[]).some(a => a.item === id));
/* Т-4: несохранённые изменения формы. markDirty ставит грязь на первый ввод; tryClose
   при грязной форме требует повторного жеста (двухшаговое подтверждение без native confirm,
   которое заблокировано в браузер-автоматизации и возвращает undefined в jsdom). */
let _formDirty = false, _armDiscard = false;
function markDirty(){ _formDirty = true; _armDiscard = false; }
function tryClose(){
  if(_formDirty && !_armDiscard){
    _armDiscard = true;
    toast('Есть несохранённые изменения формы. Нажмите «Отмена»/Esc ещё раз, чтобы закрыть без сохранения','warn');
    return false;
  }
  closeModal(); return true;
}
function modal(html){
  host().innerHTML = html; host().classList.add('open');
  _formDirty = false; _armDiscard = false;
  if(/\bmodal form\b/.test(html)) host().addEventListener('input', markDirty, { once:true });
}
function closeModal(){
  host().classList.remove('open'); host().innerHTML = '';
  host().removeEventListener('input', markDirty);
  _formDirty = false; _armDiscard = false;
  if(_bornPending){
    const bp = _bornPending; _bornPending = null;
    const it = item(bp);
    if(it && !itemHasAlloc(bp)){
      it.orphan = true;
      hist(it, 'Предмет создан на карточке договора, но привязка не завершена — осиротел');
      toast('Предмет '+bp+' создан, но не привязан к договору. Привяжите его в залоговом договоре или аннулируйте.','warn');
      refresh();
    }
  }
}

const fdate = (id,l,v,req,span) => `<div class="field${req?' req':''}${span?' col-span':''}"><span class="flabel">${l}</span>

/* КП-13: категория записи — ПОЛЕ, проставляемое в точке записи, где смысл события известен
   точно. До волны КП она угадывалась регуляркой по тексту (histCat), и по всему сиду
   28 записей падали в «Прочее» — включая самое частое событие модуля «Предмет зарегистрирован
   в реестре», — а из 8 записей категории «Стоимость» три были чужими: «Наложен запрет …
   Реестр ЗАЛОГОВ движимого имущества», «доли высвобождены — запрет подлежит снятию» и
   «утрачен … ЗАЛОГОВАЯ стоимость обнулена» ловились по подстроке «залогов»/«залоговая».
   Категория по умолчанию — 'oth'; вызовы без неё видны как «Прочее» и подлежат разметке. */
const hist = (o, what, cat) => o.history.push({ when: nowStamp(), what, who: role, cat: cat || 'oth' });
function refresh(){ renderList(); if(cur) openCard(cur.type, cur.id, curTab); }
const clientOpts = () => CLIENTS.map(c=>({v:c.inn, t:c.name+' · ИНН '+c.inn}));
/* Т-7: id по МАКСИМАЛЬНОМУ занятому суффиксу с этим префиксом, не по длине массива.
   arr.length+1 давал коллизию при любом скрытии/фильтрации/пропуске номера в seed
   (напр. аннулированный черновик остаётся в массиве, но новый предмет с тем же
   pfx+length мог наложиться на seed-id с «дыркой» в нумерации). Скан всего массива. */
const nextId = (arr, pfx) => {
  const rx = new RegExp('^' + pfx.replace(/[.*+?^${}()|[\]\\-]/g,'\\$&') + '(\\d+)$');
  let max = 0;
  for(const o of arr){ const m = rx.exec(String((o&&o.id)||'')); if(m){ const n = +m[1]; if(n > max) max = n; } }
  return pfx + String(max+1).padStart(3,'0');
};

/* Р-2/Р-7: набор полей формы зависит от вида — техника требует возраст/происхождение/страховку;

function niKindChange(){

  const realEstate = kind === 'Недвижимое имущество';

  if(realEstate) html += `<div class="mform" style="margin-top:4px">
      ${fsel('niLandPurpose','Целевое назначение земли', ['—','сельскохозяйственного назначения','населённых пунктов','промышленности','иное'], '—')}

  if(tvo) html += `<label class="chk" style="margin-top:8px"><input type="checkbox" id="niNotPerishable"> Товар не относится к скоропортящимся</label>

function saveNewItem(){
  const kind = val('niKind'), name = val('niName').trim(), pledger = val('niPledger'), pledgerType = val('niPledgerType'),
        qty = num(val('niQty')), unit = val('niUnit'), legalDoc = val('niLegalDoc').trim(),
        v = num(val('niVal')), date = iso2d(val('niDate')), rep = val('niRep').trim(),
        ccy = val('niCcy') || 'KGS';
  if(!name || !rep) return toast('Заполните наименование и отчёт оценщика','warn');
  if(!legalDoc) return toast('Укажите правоустанавливающий документ (госакт / свидетельство)','warn');
  if(!(qty > 0)) return toast('Количество должно быть положительным числом','warn');
  if(!(v > 0)) return toast('Оценочная стоимость должна быть положительным числом','warn');
  if(!isDate(date)) return toast('Дата оценки — в формате дд.мм.гггг','warn');
  /* type-specific детали предмета + проверка обязательных полей вида (KIND_FIELDS) */
  const defs = KIND_FIELDS[kind] || [], details = {};
  for(const f of defs){
    const dv = (val('nd_'+f.k)||'').trim();
    if(f.req && !dv) return toast('Заполните обязательное поле «'+f.l+'»','warn');
    if(dv) details[f.k] = dv;
  }
  const ident = details[PRIMARY_DETAIL[kind]] || name;   // краткий идентификатор для шапки/списка
  const K = KINDS[kind] || {}, tech = !!K.tech, tvo = kind === 'Товары в обороте';
  const secRole = !!K.movable && !tvo;   // Р-17: та же граница, что и в niKindChange
  const realEstate = kind === 'Недвижимое имущество';
  let extra = {};
  if(secRole) extra.securityRole = val('niSecurityRole') || 'основной';
  if(realEstate) extra.landPurpose = val('niLandPurpose');   // Р-18: '—' не блокирует, см. stopListCheck
  if(tech){
    const year = Math.round(num(val('niYear'))), origin = val('niOrigin'),
          policy = val('niPolicy').trim(), till = iso2d(val('niTill'));
    if(!(year > 1900)) return toast('Укажите корректный год выпуска техники','warn');
    const techCondOk = Boolean((document.getElementById('niTechCond')||{}).checked), techAct = val('niTechAct').trim();
    if(!techCondOk || !techAct) return toast('Приём отклонён (Прил.1 §3.3): подтвердите исправное техническое состояние техники и укажите реквизит акта осмотра','warn');
    const age = CUR_YEAR - year;
    const ageChk = techAgeCheck({ securityRole: extra.securityRole, origin, age });
    if(ageChk.block) return toast(ageChk.msg,'warn');
    if(!policy) return toast('Приём отклонён (§3.4): техника-обеспечение должна быть застрахована — укажите полис','warn');
    if(till && !isDate(till)) return toast('Дата окончания полиса — в формате дд.мм.гггг','warn');
    extra = { ...extra, year, origin, insured:{ present:true, policy, till }, techCondition:{ ok:true, act:techAct } };
    if(ageChk.needCommittee) extra.committeeReq = { reason:'возраст техники сверх лимита §2.5 — допуск основного обеспечения по решению комитета §3.4', msg: ageChk.msg };
    /* Р-18 (Прил.1 §3.5): физический износ и моральное устаревание — стоп-лист, не §3.3-осмотр. */
    const wearRaw = val('niWearPct').trim();
    if(wearRaw !== '') extra.wearPct = num(wearRaw);
    extra.morallyObsolete = !((document.getElementById('niNotObsolete')||{}).checked);
  }
  if(tvo){
    /* Р-18: три раздельных подтверждения ТМЦ — снятое подтверждение выставляет блокирующий флаг */
    extra.perishable     = !((document.getElementById('niNotPerishable')||{}).checked);
    extra.lowDemand       = !((document.getElementById('niDemandOk')||{}).checked);
    extra.singleNameBulk  = !((document.getElementById('niNotBulkSingle')||{}).checked);
  }
  extra.circulable = Boolean((document.getElementById('niCirculable')||{}).checked);   // Р-18: все виды
  /* КП-4: обременение третьим лицом — такой же вход стоп-листа, как износ или оборотоспособность. */
  extra.thirdPartyLien = val('niThirdParty') === 'да';
  const stop = stopListCheck(extra);
  if(stop.block) return toast(stop.msg,'warn');
  const it = { id: nextId(ITEMS,'П-'), kind, name, pledger, pledgerType, ident, qty, unit, legalDoc, details, files:[],
    appraised:v, apprDate:date, apprReport:rep, ccy,
    overrides:[], ban:null, lost:false, realizing:false, needReval:false, everPledged:false, cancelled:null,
    lastSurvey:date, lastReval:date, consents:[], restoreNotice:null, ...extra,
    revals:[{date, appraised:v, report:rep, note:'первичная оценка', coef: coefOf(kind)}],
    surveys:[], history:[] };
  normalizeItem(it);
  syncItemDetailMirrors(it);   // leaseTill → верхний уровень (иначе leaseCoversCredit молчит)
  hist(it, `Предмет зарегистрирован в реестре. Оценочная ${fmt(v)} ${ccyLabel(ccy)} → залоговая (расч.) ${fmt(calcPledge(it))} ${ccyLabel(ccy)}`, 'lc');
  if(it.committeeReq) hist(it, `Прил.1 §3.4: ${it.committeeReq.reason}`, 'lc');
  ITEMS.push(it); closeModal(); toast('Предмет '+it.id+' создан. Залоговая: '+fmt(calcPledge(it)),'ok');
  if(it.committeeReq) toast(it.committeeReq.msg,'warn');
  const target = _newItemTarget; _newItemTarget = null;
  if(target && contract(target)){
    /* рождён с карточки договора → сразу привязка к этому договору + кредиту (доля).
       Т-1: пометим ожидание привязки — если диалог закроют без привязки, closeModal
       пометит предмет осиротевшим. */
    _bornPending = it.id;
    openAlloc(target, it.id);
  } else {
    /* ПЗ-4: после создания из реестра открываем КАРТОЧКУ предмета, а не список. Форма приёма
       не собирает обязательный комплект документов (FILE_REQ_COMMON + FILE_REQ_BY_KIND, Р-56) —
       он живёт на вкладке «Документы» карточки. Возврат в список оставлял запись висеть с
       триггером «Неполный комплект документов предмета», а пользователя — в реестре, откуда
       следующий шаг не виден. Отвергнуто: сразу предлагать привязку к договору — это возврат
       к «предмет рождается договором», что отверг Р-37. */
    setReg('items'); selected = it.id; renderList(); openCard('item', it.id);
  }
}

/* ---------- ПЕРЕОЦЕНКА (событие: меняет ОЦЕНОЧНУЮ; залоговая и покрытие — следом) ---------- */
function openReval(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  modal(`<div class="modal form">${mhead('Переоценка · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fdate('rvDate','Дата переоценки', TODAY, true)}
      ${fin('rvRep','Отчёт оценщика (номер)','',true)}
      ${/* Р-48: оценщик и его лицензия — реквизит отчёта. Без них нельзя проверить,
           кем сделана оценка, а отчёт живёт 12 мес. и попадает в комплект документов. */''}
      ${fin('rvAppraiser','Оценщик (Ф.И.О. / организация)', it.appraiser || '', true)}
      ${fin('rvLicense','Лицензия оценщика', it.apprLicense || '')}
      ${fin('rvVal','Новая оценочная стоимость', String(it.appraised), true)}
      ${fin('rvOld','Текущая оценочная', fmt(it.appraised))}
      ${ftxt('rvNote','Примечание','')}
    </div>
    <div class="warn-inline"><span>Меняется только <b>оценочная</b> — залоговая пересчитается сама (× ${coefOf(it.kind)})${activeOverride(it) ? '; действующее решение заведующего отделом её перекрывает' : ''}. Оценка ведётся в валюте предмета — ${ccyLabel(itemCcy(it))} (КП-14). Падение покрытия ниже порога поднимет триггер «недостаточность обеспечения».</span></div>
    </div>${mfoot('Сохранить переоценку','saveReval(\''+id+'\')')}</div>`);
  document.getElementById('rvOld').readOnly = true;
}
function saveReval(id){
  const it = item(id), v = num(val('rvVal')), date = iso2d(val('rvDate')), rep = val('rvRep').trim(), note = val('rvNote').trim();
  if(!(v > 0)) return toast('Оценочная стоимость должна быть положительным числом','warn');
  /* Р-32: дата не в будущем и не раньше предыдущей несторнированной переоценки. */
  const dv = eventDateValid(date, { notBefore: it.lastReval, notBeforeLabel:'предыдущая переоценка' });
  if(!dv.ok) return toast(dv.msg,'warn');
  if(!rep) return toast('Укажите номер отчёта оценщика','warn');
  const appraiser = val('rvAppraiser').trim(), license = val('rvLicense').trim();
  if(!appraiser) return toast('Укажите оценщика — Ф.И.О. или организацию','warn');
  /* Р-32: резкое падение оценочной относительно предыдущей несторнированной (it.appraised уже
     откатывается к ней при сторнировании, Р-33) требует подтверждения — обязательного примечания. */
  const prev = it.appraised;
  if(prev > 0 && v < prev * (1 - REVAL_DROP_WARN/100) && !note)
    return toast(`Оценочная падает на ${pct(1 - v/prev)} (порог предупреждения ${REVAL_DROP_WARN}%) — подтвердите снижение обязательным примечанием`,'warn');
  const acs0 = CONTRACTS.filter(isActive);
  const before = acs0.flatMap(c=>c.credits.map(cid=>({cid, ok:coverage(acs0, cid).ok})));
  const old = it.appraised;
  it.appraised = v; it.apprDate = date; it.apprReport = rep; it.lastReval = date; it.needReval = false;
  it.appraiser = appraiser; it.apprLicense = license;
  /* КП-Д4: коэффициент вида фиксируется В ЗАПИСИ — историческая строка не должна
     переписываться при правке справочника KINDS. */
  it.revals.push({date, appraised:v, report:rep, note: note || 'переоценка', appraiser, license, coef: coefOf(it.kind)});
  /* Р-47: новый отчёт об оценке кладётся в комплект документов сразу — иначе досье
     остаётся с устаревшим отчётом, хотя переоценка проведена. */
  (it.files ||= []).push({ tag:'Отчёт об оценке', name:`Отчёт_${rep.replace(/[^\wА-Яа-я\-]+/g,'_')}.pdf`,
    docNo:rep, docDate:date, when:TODAY, who:role });
  const ovNow = activeOverride(it);
  hist(it, `Переоценка: оценочная ${fmt(old)} → ${fmt(v)} (${rep}). Залоговая (расч.) → ${fmt(calcPledge(it))}${ovNow?' · перекрыта действующим решением заведующего '+fmt(ovNow.value):''}`, 'val');
  closeModal();
  const acs1 = CONTRACTS.filter(isActive);
  const dropped = acs1.flatMap(c=>c.credits.map(cid=>({cid, ok:coverage(acs1, cid).ok})))
                      .filter(a => !a.ok && (before.find(b=>b.cid===a.cid)||{ok:true}).ok);
  toast('Переоценка сохранена. Залоговая: '+fmt(pledgeValue(it)),'ok');
  if(dropped.length) toast('ТРИГГЕР «недостаточность обеспечения»: покрытие упало ниже порога по '+dropped.map(d=>d.cid).join(', ')+' → трек взыскания по обеспечению','warn');
  refresh();
}

/* ---------- ПОНИЖЕНИЕ ЗАЛОГОВОЙ СТОИМОСТИ (Р-19, ПОЛ §2.1) — только вниз, роль:
   заведующий отделом залогового обеспечения. Залоговая стоимость не может превышать
   расчётную (оценочная × коэффициент риска и спроса, §2.1) — подъём выше расчётной
   недопустим ни для одной роли, это норма самого положения, а не ограничение роли
   (гейт — overrideAllowed). Существующие «выше расчётной» записи прежней системы
   (см. П-005, legacy:true) — isOverAbove/beyondDiscount только ОТОБРАЖАЮТ их (карточка,
   реестр); новых таких записей быть не может.

   КП-11: решение — ЗАПИСЬ ЖУРНАЛА overrides[], а не одиночный слот. Прежний saveOverride
   перезаписывал предыдущее решение, а clearOverride его обнулял: обоснование, автор и дата
   исчезали как структурные данные, и аудита понижений не существовало. Действующим считается
   последнее несторнированное (activeOverride); отмена — сторно записи через общий
   openVoidRecord, тем же путём, что переоценка, акт и согласие.

   КП-Д5: «комиссия» и «комитет по администрированию бюджетных кредитов» вычищены из всех
   пяти мест, где встречались. Понижает заведующий отделом (гейт canHeadOfUnit); комитет
   в этом модуле решает гейт покрытия и замену, а роли «комиссия» нет вовсе. ---------- */
function openOverride(id){
  if(!canHeadOfUnit()) return denyEdit();
  const it = item(id), cp = calcPledge(it), cur = activeOverride(it);
  modal(`<div class="modal form">${mhead('Понижение залоговой стоимости · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fin('ovCalc','Расчётная залоговая (оценочная × '+coefOf(it.kind)+')', fmt(cp))}
      ${fin('ovVal','Залоговая стоимость (только понижение)', String(cur ? cur.value : cp), true)}
      ${fin('ovDoc','Приказ / распоряжение (реквизит)','', true)}
      ${ftxt('ovObosn','Обоснование', '')}
    </div>
    <div class="infoline"><span>Залоговую можно только понизить относительно расчётной (ПОЛ §2.1). Решение ложится <b>новой записью</b> журнала — прежнее остаётся в истории и при необходимости сторнируется отдельно.</span></div>
    ${cur ? `<div class="warn-inline"><span>Действующее решение: ${fmt(cur.value)} от ${cur.date}${cur.doc?' ('+esc(cur.doc)+')':''}. Новая запись его перекроет.</span></div>` : ''}
    </div>${mfoot('Сохранить решение','saveOverride(\''+id+'\')')}</div>`);
  document.getElementById('ovCalc').readOnly = true;
}
function saveOverride(id){
  if(!canHeadOfUnit()) return denyEdit();
  const it = item(id), cp = calcPledge(it), v = num(val('ovVal')), ob = val('ovObosn').trim(), doc = val('ovDoc').trim();
  if(!(v > 0)) return toast('Стоимость должна быть положительным числом','warn');
  const gate = overrideAllowed(it, v);
  if(!gate.ok) return toast(gate.msg,'warn');
  if(!doc) return toast('Укажите реквизит приказа или распоряжения — решение без документа не фиксируется','warn');
  if(!ob) return toast('Обоснование обязательно','warn');
  const alloc = allocatedLegal(it.id) + allocatedDraft(it.id);
  if(v < alloc) toast('Внимание: новая залоговая '+fmt(v)+' МЕНЬШЕ суммы закреплённых долей '+fmt(alloc)+' — доли будут усечены в расчёте покрытия','warn');
  const old = pledgeValue(it);
  (it.overrides ||= []).push({ value:v, obosn: ob, doc, by: role, date: TODAY, beyondDiscount:false, voided:null });
  hist(it, `Залоговая стоимость понижена решением заведующего отделом залогового обеспечения (${doc}): ${fmt(old)} → ${fmt(v)} (расчётная ${fmt(cp)}). Обоснование: «${ob}»`, 'val');
  closeModal(); toast('Решение сохранено. Залоговая: '+fmt(v),'ok'); refresh();
}

/* ---------- ЗАПРЕТ НА ОТЧУЖДЕНИЕ: НАЛОЖЕНИЕ / СНЯТИЕ (наш шаг оформления) ----------
   Наложение — только на предмет, обременённый зарегистрированным договором (есть
   основание). Снятие — под гейтом: пока живы доли, снять нельзя. Оба действия —
   роль «Залоговый специалист». Залоговую ось не трогают (оси независимы). */
function openBan(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  /* Предусловие: наложить запрет на свободный предмет нельзя — оснований нет. */
  if(!banRequired(it)) return toast('Регистрировать наложение запрета нельзя: предмет не обременён ни одним зарегистрированным договором — оснований нет','warn');
  if(it.ban) return toast('Запрет уже наложен: '+it.ban.regNo+'. При перезалоге он дополняется основанием автоматически при регистрации договора','warn');
  const grounds = banContracts(it);
  modal(`<div class="modal form">${mhead('Регистрация наложения запрета на отчуждение · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fsel('bnOrgan','Регистрирующий орган', ORG_REGISTRY, organOf(it), true)}
      ${fin('bnReg','Рег. № запрета в органе','',true)}
      ${fdate('bnDate','Дата наложения', TODAY, true)}
      ${ro('Договоры-основания', grounds.join(', '))}
    </div>
    <div class="warn-inline"><span>Запрет накладывает ЗАЛОГОДАТЕЛЬ в регистрирующем органе (ПБК п.2.1); основания (${grounds.join(', ')}) заполнятся автоматически. Срок наложения: до ${banDeadline(it)}.</span></div>
    <label class="chk col-span" style="margin-top:8px"><input type="checkbox" id="bnMark"> Отметка о запрете получена в оригиналах правоустанавливающих документов (ПБК п.2.1)</label>
    </div>${mfoot('Зарегистрировать наложение запрета залогодателем','saveBan(\''+id+'\')','btn-primary')}</div>`);
}
function saveBan(id){
  const it = item(id), organ = val('bnOrgan').trim(), regNo = val('bnReg').trim(), date = iso2d(val('bnDate')),
        markInOriginals = Boolean((document.getElementById('bnMark')||{}).checked);
  if(!banRequired(it)) return toast('Оснований для запрета нет','warn');
  if(!organ) return toast('Укажите регистрирующий орган','warn');
  if(!regNo) return toast('Укажите рег. № запрета','warn');
  /* Р-32: дата наложения не в будущем и не раньше нотариальной даты самого раннего
     договора-основания (запрет не может предшествовать удостоверению обеспечения). */
  const groundNotary = CONTRACTS.filter(c => isActive(c) && c.allocs.some(a=>a.item===it.id) && isDate(c.notaryDate))
    .map(c=>c.notaryDate).sort((a,b)=>d2n(a)-d2n(b))[0];
  const bdv = eventDateValid(date, { notBefore: groundNotary, notBeforeLabel:'нотариальная дата договора-основания' });
  if(!bdv.ok) return toast(bdv.msg,'warn');
  const grounds = banContracts(it);
  const confirmedBy = markInOriginals ? role : '';
  it.ban = { organ, regNo, date, contracts: grounds, pendingRelease:false, markInOriginals, confirmedBy };
  hist(it, `Зарегистрировано наложение запрета на отчуждение залогодателем: ${organ} · ${regNo} от ${date} (основания ${grounds.join(', ')}).${markInOriginals ? ` Отметка о запрете получена в оригиналах правоустанавливающих документов (подтвердил: ${confirmedBy}).` : ' Отметка о запрете в оригиналах правоустанавливающих документов ЕЩЁ НЕ получена.'} Предмет не может быть продан без нашего ведома.`);
  grounds.forEach(cid => hist(contract(cid), `По предмету ${it.id} зарегистрировано наложение запрета на отчуждение залогодателем: ${organ} · ${regNo} от ${date}`));
  closeModal(); toast(markInOriginals ? 'Наложение запрета зарегистрировано, отметка в оригиналах получена — залог защищён от продажи' : 'Наложение запрета зарегистрировано — отметка в оригиналах ещё не получена','ok'); refresh();
}
/* ---------- СНЯТИЕ ЗАПРЕТА (Р-9): классифицированное основание + цепочка согласования + частичное снятие ---------- */
function openBanRelease(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  if(!it.ban) return toast('Запрет не наложен','warn');
  /* ГЕЙТ ПОЛНОГО СНЯТИЯ: нельзя снять, пока по предмету живы доли (частичное — отдельным действием). */
  const alloc = allocatedLegal(it.id);
  if(alloc > 0){
    const cs = CONTRACTS.filter(c=>isActive(c) && c.allocs.some(a=>a.item===it.id)).map(c=>c.id);
    return toast(`Полное снятие невозможно: по предмету закреплены доли на ${fmt(alloc)} по договорам ${cs.join(', ')}. Сначала погасите кредит / выведите предмет доп соглашением; частичное снятие — отдельным действием`,'warn');
  }
  modal(`<div class="modal form">${mhead('Снятие запрета на отчуждение · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fsel('rbChannel','Канал оформления снятия', RELEASE_CHANNELS, 'doc', true)}
      ${fsel('rbGround','Основание снятия', RELEASE_GROUNDS, 'Полное погашение обязательства', true)}
      ${fin('rbAct','Реквизит акта / № документа снятия','',true)}
      ${fdate('rbDate','Дата снятия', TODAY, true)}
      <div id="rbReconWrap">${fin('rbReconAct','Реквизит акта сверки о погашении задолженности (ПБК п.2.2)','',true)}</div>
      ${ro('Орган', it.ban.organ)}
    </div>
    <div class="warn-inline"><span>Действующий запрет: ${esc(it.ban.organ)} · ${esc(it.ban.regNo)} от ${it.ban.date}. Доли обнулились — снятие допустимо. Пройдите цепочку согласования:</span></div>
    <div class="ops-list" style="margin-top:8px">${RELEASE_APPROVALS.map((a,i)=>`<div class="op-row"><label class="chk"><input type="checkbox" class="rbAppr" id="rbAppr${i}"> ${esc(a)}</label></div>`).join('')}</div>
    </div>${mfoot('Снять запрет','saveRelease(\''+id+'\')','btn-primary')}</div>`);
  const syncRecon = () => { document.getElementById('rbReconWrap').style.display =
    val('rbGround') === 'Полное погашение обязательства' ? '' : 'none'; };
  document.getElementById('rbGround').addEventListener('change', syncRecon); syncRecon();
}
function saveRelease(id){
  const it = item(id), ground = val('rbGround'), act = val('rbAct').trim(), date = iso2d(val('rbDate')),
        reconAct = val('rbReconAct').trim(),
        channel = val('rbChannel'), chLbl = (RELEASE_CHANNELS.find(c=>c.v===channel)||{}).t || channel;
  if(allocatedLegal(it.id) > 0) return toast('По предмету снова закреплены доли — снятие невозможно','warn');
  if(!act) return toast('Укажите реквизит акта / № документа снятия','warn');
  /* Р-32: дата снятия не в будущем и не раньше даты наложения запрета. */
  const rdv = eventDateValid(date, { notBefore: (it.ban||{}).date, notBeforeLabel:'дата наложения запрета' });
  if(!rdv.ok) return toast(rdv.msg,'warn');
  if(![...document.querySelectorAll('.rbAppr')].every(x=>x.checked))
    return toast('Пройдите всю цепочку согласования снятия (Прил.3 §3.2)','warn');
  /* Р-20/Р-9 (ПБК п.2.2): доп. гейт — снятие по «Полное погашение обязательства»
     требует реквизит акта сверки о погашении задолженности. Дополняет, а не
     заменяет цепочку согласования и требование акта снятия (act) выше. */
  const rv = releaseValid({basis:ground, reconAct});
  if(!rv.ok) return toast(rv.msg,'warn');
  const was = it.ban;
  hist(it, `Запрет на отчуждение снят (${chLbl.toLowerCase()}): основание «${ground}», акт/№ ${act} от ${date}${reconAct ? `, акт сверки ${reconAct}` : ''} (был ${was.organ} · ${was.regNo} от ${was.date}). Цепочка согласования пройдена. Предмет свободен от обременения.`);
  it.ban = null;
  closeModal(); toast('Запрет на отчуждение снят','ok'); refresh();
}
/* Частичное снятие с части предмета (Прил.3 §3.3.1): запрет на остаток сохраняется. */
function openPartialRelease(id){
  if(!canCurate()) return denyEdit();
  const it = item(id);
  if(!it.ban) return toast('Нет действующего запрета','warn');
  const overdueCr = [...new Set(CONTRACTS.filter(c=>isActive(c)&&c.allocs.some(a=>a.item===it.id)).flatMap(c=>c.credits))].filter(x=>(credit(x)||{}).overdue);
  modal(`<div class="modal form">${mhead('Частичное снятие запрета с части предмета · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fsel('prBasis','Основание', ['Продажа части предмета по решению суда','Продажа части по решению спецадминистратора','Передача части предмета ГФХ в счёт погашения','Иное (при достаточном ликвидном остатке)'], null, true)}
      ${fin('prPart','Часть предмета (описание / доля)','',true)}
      ${fin('prAct','Реквизит акта','',true)}
      ${fdate('prDate','Дата', TODAY, true)}
    </div>
    ${overdueCr.length ? `<div class="flagline"><span>По кредитам ${overdueCr.join(', ')} есть просроченная задолженность — частичное снятие не допускается. Погасите просрочку.</span></div>`
      : `<div class="warn-inline"><span>Запрет на отчуждение <b>сохраняется на оставшуюся часть</b> предмета.</span></div>`}
    </div>${overdueCr.length ? `<div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Закрыть</button></div>` : mfoot('Оформить частичное снятие','savePartialRelease(\''+id+'\')','btn-primary')}</div>`);
}
function savePartialRelease(id){
  const it = item(id), basis = val('prBasis'), part = val('prPart').trim(), act = val('prAct').trim(), date = iso2d(val('prDate'));
  if(!part) return toast('Опишите часть предмета','warn');
  if(!act) return toast('Укажите реквизит акта','warn');
  { const ev = eventDateValid(date); if(!ev.ok) return toast(ev.msg,'warn'); }
  const overdueCr = [...new Set(CONTRACTS.filter(c=>isActive(c)&&c.allocs.some(a=>a.item===it.id)).flatMap(c=>c.credits))].filter(x=>(credit(x)||{}).overdue);
  if(overdueCr.length) return toast('Частичное снятие не допускается при просроченной задолженности','warn');
  (it.ban.partial ||= []).push({ part, basis, act, date });
  hist(it, `Частичное снятие запрета с части предмета: «${part}», основание «${basis}», акт ${act} от ${date}. Запрет на оставшуюся часть сохраняется в силе.`);

}

/* ---------- СОГЛАСИЕ НА ДЕЙСТВИЯ БЕЗ СНЯТИЯ ЗАПРЕТА (Р-4, §8, Прил.3 §4) ---------- */
function openConsent(id){
  if(!canCurate()) return denyEdit();

  if(!it.ban) return toast('Согласие на действия выдаётся только по действующему запрету','warn');
  modal(`<div class="modal form">${mhead('Согласие на действия с залогом (без снятия запрета) · '+it.id)}
    <div class="modal-b"><div class="mform">
      ${fsel('cnAction','Действие', CONSENT_ACTIONS, CONSENT_ACTIONS[2], true)}
      ${fdate('cnDate','Дата', TODAY, true)}
      ${fin('cnDoc','Реквизит заявления / согласия','',true)}
      ${fsel('cnDecision','Решение', ['положительное','отрицательное'], 'положительное')}
      <label class="chk col-span"><input type="checkbox" id="cnReval"> Требуется переоценка после действия (за счёт залогодателя)</label>
      ${ftxt('cnNote','Примечание','')}
    </div>
    <div class="warn-inline"><span>Согласие на действия без снятия запрета — запрет <b>остаётся в силе</b> до полного исполнения обязательств.</span></div>
    </div>${mfoot('Зафиксировать согласие','saveConsent(\''+id+'\')')}</div>`);
}
function saveConsent(id){
  const it = item(id), action = val('cnAction'), date = iso2d(val('cnDate')), doc = val('cnDoc').trim(),
        decision = val('cnDecision'), revalReq = (document.getElementById('cnReval')||{}).checked, note = val('cnNote').trim();
  { const ev = eventDateValid(date); if(!ev.ok) return toast(ev.msg,'warn'); }

  const revalRequired = decision==='положительное' && revalReq;
  it.consents.push({ id:'СГ-'+(it.consents.length+1), action, date, doc, decision, note, revalRequired });
  /* ИНВАРИАНТ ОСИ ЗАПРЕТА: согласие НЕ снимает и НЕ ослабляет запрет — it.ban не трогается. */
  hist(it, `Выдано ${decision} согласие на «${action}»${decision==='положительное'?' без снятия запрета; запрет остаётся в силе':''} (${doc} от ${date})${revalRequired?'. Требуется переоценка за счёт залогодателя':''}`);
  closeModal(); toast('Согласие зафиксировано — запрет на отчуждение остаётся в силе','ok'); refresh();
}

/* ---------- ИЗВЕЩЕНИЕ О ВОСПОЛНЕНИИ (Р-8, Прил.2 §2.5) ---------- */
function openRestoreNotice(id){

function saveRestoreNotice(id){

  }

   имущества, иначе — подписи представителя ГФХ и залогодателя (surveyValidate). */
function openSurvey(id){

  const it = item(id);
  modal(`<div class="modal form">${mhead('Обследование предмета · '+it.id)}
    <div class="modal-b"><div class="mform">

      ${fin('svAct','Номер акта','',true)}
      ${fsel('svOut','Исход (состояние предмета)', SURVEY_RESULTS.map(r=>r.v), 'Хорошее', true)}
      <div class="field req col-span"><span class="flabel">Заключение</span>
        <textarea id="svConclusion" class="note-area"></textarea></div>
      <div class="field req col-span"><span class="flabel">Фотофиксация (файлы, минимум 1)</span>
        <div class="control"><input type="file" id="svPhotos" multiple accept="image/*"></div></div>
