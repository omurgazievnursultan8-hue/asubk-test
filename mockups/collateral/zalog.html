function renderRefbook(){
  document.getElementById('refbookPanel').innerHTML =
    `<p class="section-h" style="font-size:20px;margin:0 0 4px">Справочник: регламентные параметры залога</p>
     <p style="color:var(--text-muted);font-size:13px;margin:0 0 16px">Регламентируется администратором. Изменения пересчитывают залоговую стоимость, покрытие, интервалы контроля и валидации приёма по всему модулю.</p>`
    + refbookInner();
  document.getElementById('refbookFooter').innerHTML =
    `<div style="flex:1"></div><button class="btn btn-primary" onclick="saveRefbook()">Сохранить справочник</button>`;
  document.getElementById('crumbTitle').textContent = 'Регламентные параметры залога';
  cur = null;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', a.textContent==='Регламентные параметры залога'));
}
function saveRefbook(){
  /* §16: норматив-поля существуют в DOM (имеют id) только когда введён реквизит
     решения Правления (rb-board-req) — refbookInner() рендерит их иначе через ro()
     без id. boardOk синхронизирует это состояние на случай, если onchange поля
     rb-board-req не успел сработать до клика «Сохранить». */
  rbBoardReq = val('rb-board-req');
  const boardOk = Boolean(rbBoardReq && rbBoardReq.trim());

  // ВНУТРЕННИЕ параметры — всегда в DOM, всегда валидируются и сохраняются.
  const bd = num(val('rb-ban-days')), docRoute = num(val('rb-doc-route')), commSla = num(val('rb-committee-sla')),
        pageSz = num(val('rb-page-size'));
  if(!(bd > 0)) return toast('Срок наложения запрета — положительное число рабочих дней','warn');
  if(!(docRoute > 0)) return toast('Срок маршрута документов — положительное число дней','warn');
  if(!(commSla > 0)) return toast('SLA очереди комитета — положительное число дней','warn');
  if(!(pageSz > 0)) return toast('Размер страницы реестра — положительное число строк','warn');
  const revalDraft = {};
  for(const k of Object.keys(KINDS)){
    const r = num(val('rb-r-'+k)), o = val('rb-o-'+k).trim();
    if(!(r > 0)) return toast('Интервал переоценки «'+k+'» — положительный','warn');
    if(!o) return toast('Укажите регистрирующий орган для «'+k+'»','warn');
    revalDraft[k] = { reval:Math.round(r), organ:o };
  }

  // НОРМАТИВ-параметры — читаются/валидируются, только если решение Правления введено;
  // при boardOk===false соответствующие id отсутствуют в DOM (read-only через ro()) —
  // не трогаем их, num(val(...)) на несуществующий id сюда не вызывается вовсе.
  let cl = COVER_LIQUID, cm = COVER_MOVABLE, ls = LIQUID_SHARE_MIN, cg = COVER_GUARANTEE, cgfx = COVER_GUARANTEE_FX,
      ageS = TECH_AGE_LIMIT['СНГ'], ageF = TECH_AGE_LIMIT['Дальнее зарубежье'], wear = WEAR_LIMIT;
  const kindDraft = {};
  if(boardOk){
    const clV = num(val('rb-cov-liq')), cmV = num(val('rb-cov-mov')), lsV = num(val('rb-liqshare')),
          cgV = num(val('rb-cov-guar')), cgfxV = num(val('rb-cov-guar-fx'));
    if(!(clV >= 100)) return toast('Порог ликвидного залога — не менее 100%','warn');
    if(!(cmV >= 100)) return toast('Порог движимого неликвидного залога — не менее 100%','warn');
    if(!(lsV > 0 && lsV <= 100)) return toast('Доля ликвида — в диапазоне (0; 100]%','warn');
    if(!(cgV >= 100)) return toast('Гарантия в валюте кредита — не менее 100%','warn');
    if(!(cgfxV >= 100)) return toast('Гарантия в иной валюте — не менее 100%','warn');
    cl = clV/100; cm = cmV/100; ls = lsV/100; cg = cgV/100; cgfx = cgfxV/100;

    const ageSV = num(val('rb-age-sng')), ageFV = num(val('rb-age-far')), wearV = num(val('rb-wear'));
    if(!(ageSV > 0) || !(ageFV > 0)) return toast('Лимиты возраста техники — положительные','warn');
    if(!(wearV > 0 && wearV <= 100)) return toast('Предел износа техники — в диапазоне (0; 100]%','warn');
    ageS = ageSV; ageF = ageFV; wear = wearV;

    for(const k of Object.keys(KINDS)){
      const kf = num(val('rb-k-'+k)), lr = num(val('rb-lr-'+k));
      if(!(kf > 0 && kf <= 1)) return toast('Коэффициент «'+k+'» — в диапазоне (0; 1]','warn');
      if(!(lr >= 0)) return toast('Ранг ликвидности «'+k+'» — число ≥ 0','warn');
      kindDraft[k] = { k:kf, liquidityRank:Math.round(lr) };
    }
  }

  // применяем: KINDS мутируется точечно — норматив-поля (k/liquidityRank) только если
  // были в DOM и провалидированы, внутренние (reval/organ) — всегда.
  Object.keys(KINDS).forEach(k=>{
    if(kindDraft[k]){ KINDS[k].k = kindDraft[k].k; KINDS[k].liquidityRank = kindDraft[k].liquidityRank; }
    KINDS[k].reval = revalDraft[k].reval; KINDS[k].organ = revalDraft[k].organ;
  });
  BAN_DEADLINE_DAYS = Math.round(bd);
  DOC_ROUTE_DAYS = Math.round(docRoute);
  COMMITTEE_SLA = Math.round(commSla);
  /* ПЗ-8: справочник задаёт ДЕФОЛТ; текущий размер подтягивается за ним (иначе правка
     параметра не была бы видна на экране, ради которого её делали). */
  PAGE_SIZE_DEFAULT = Math.round(pageSz); PAGE_SIZE = PAGE_SIZE_DEFAULT; curPage = 1;
  COVER_LIQUID = cl; COVER_MOVABLE = cm; LIQUID_SHARE_MIN = ls;
  COVER_GUARANTEE = cg; COVER_GUARANTEE_FX = cgfx;
  TECH_AGE_LIMIT['СНГ'] = Math.round(ageS); TECH_AGE_LIMIT['Дальнее зарубежье'] = Math.round(ageF);
  WEAR_LIMIT = Math.round(wear);

  // ВНУТРЕННИЕ списки (свободно редактируемые всегда): каналы снятия запрета, реестр
  // регистрирующих органов — пустая правка построчно игнорируется (сохраняем прежнее).
  RELEASE_CHANNELS.forEach((c,i)=>{ const t = val('rb-relch-'+i).trim(); if(t) c.t = t; });
  ORG_REGISTRY.forEach((o,i)=>{ const t = val('rb-org-'+i).trim(); if(t) ORG_REGISTRY[i] = t; });

  toast('Справочник сохранён — параметры пересчитаны','ok'); refresh(); renderRefbook();
}

   заведены до появления этого поля — без дефолта карточка КАЖДОГО предмета показывала бы
   «способ хранения не указан», и реальный пробел утонул бы в фоне. Дефолт — «у залогодателя»
   (обычный режим, при котором действует плановое обследование). Д-004 намеренно оставлен без
   хранения: это демонстрация самого пробела (там же предмет П-005 без запрета на отчуждение). */
CONTRACTS.forEach(c => {
  if(c.status === 'Зарегистрирован' && !c.custody && c.id !== 'Д-004'){
    c.custody = 'у залогодателя'; c.custodyPlace = '';
  }
});
