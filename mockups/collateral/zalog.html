/* ДГ-4 + ДГ-5: «Отметки» — узкая колонка нетривиальных фактов о договоре. Коды устойчивы
   (по ним отбирает фильтр), подписи — производные от кода. Сюда же переехало то, ради чего
   держались две константные колонки: «Кредитов» показывала 1 на всех 39 записях, «Доп. согл.» —
   0 на всех 39; в отметку попадает только ОТКЛОНЕНИЕ от единственного кредита и наличие
   доп. соглашений, а не само число. */
const MARK_CODES = ['допуск <порога','отказ в замене','несколько кредитов','есть доп. соглашения'];
function contractMarks(c){
  const m = [];
  if(c.undercovered) m.push({ code:'допуск <порога', label:'допуск <порога', cls:'err', strip:true,
    tip:`комитет допустил обеспеченность ниже порога. Пороги по кредитам: ${reqTooltip(c)}` });
  if(c.replacementRefusal) m.push({ code:'отказ в замене', label:'отказ в замене', cls:'err', strip:true,
    tip:`отказано в замене залога (Прил.3 §3.5): ${c.replacementRefusal.reason}` });
  /* ДГ-17: `strip:false` — отметку рисовать НЕ НАДО, её показывает колонка «Кредит»
     («К-56 +1» с подстрокой «2 кредита»). Код остаётся в MARK_CODES и в sort.markCodes:
     фильтр «Отметка = несколько кредитов» продолжает отбирать, а отобранное — видно. */
  if(c.credits.length > 1) m.push({ code:'несколько кредитов', label:`кредитов ${c.credits.length}`, cls:'third', strip:false,
    tip:`договор обеспечивает несколько кредитов (${c.credits.join(', ')}); порог у каждого свой, в колонке обеспеченности — худший` });
  if(c.addenda.length) m.push({ code:'есть доп. соглашения', label:`д/с ${c.addenda.length}`, cls:'stale', strip:true,
    tip:`доп. соглашения: ${c.addenda.map(a=>`${a.no||'—'} от ${a.date||'—'}`).join('; ')}` });
  return m;
}
/* ДГ-18: отметки — не колонка, а третья строка ячейки «Договор». Пустых отметок больше не
   существует: где отметок нет, нет и строки (прежний прочерк занимал 150px, чтобы сообщить
   «ничего особенного»). */
function marksStrip(c){
  const m = contractMarks(c).filter(x => x.strip);
  if(!m.length) return '';
  return `<span class="c2-marks">` + m.map(x =>
    `<span class="tagpill ${x.cls}" title="${esc(x.tip)}">${esc(x.label)}</span>`).join('') + `</span>`;
}
/* ДГ-17: КРЕДИТ, обеспечиваемый договором. Идентификатор — главным (в разговоре и в журналах
   договор привязывают к «К-77»), человеческий номер — подстрокой. При нескольких кредитах
   главная строка сжимается до «К-56 +1», подстрока называет их число, тултип перечисляет всё
   с суммами: в колонке обеспеченности показан ХУДШИЙ из них, и знать, из скольких, важно.
   Кредитов может не быть вовсе — договор-черновик заводится до привязки. */
function contractCreditCell(c){
  const ids = c.credits || [];
  if(!ids.length) return `<span class="cell2" title="кредит не привязан — обеспеченность не оценивается">`
    + `<span class="c2-main" style="color:var(--text-placeholder)">не привязан</span></span>`;
  const tip = ids.map(id => { const k = credit(id) || {};
    return `${id}${k.num ? ' · ' + k.num : ''}${k.amount != null ? ' · сумма ' + fmt(k.amount) : ''}`; }).join(' · ');
  const main = ids.length > 1 ? `${ids[0]} <span class="tagpill third">+${ids.length-1}</span>` : esc(ids[0]);
  const sub  = ids.length > 1 ? `${ids.length} ${plural(ids.length,'кредит','кредита','кредитов')}`
                              : ((credit(ids[0]) || {}).num || '');
  return `<span class="cell2" title="${esc(tip)}">`
    + `<span class="c2-main">${main}</span>`
    + (sub ? `<span class="c2-sub">${esc(sub)}</span>` : '') + `</span>`;
}
/* ДГ-16: ОБЕСПЕЧЕНИЕ ПО ДОГОВОРУ — Σ отнесённых долей залоговой стоимости (`allocs[].share`),
   то есть сколько имущества договор реально держит. Не путать с обеспеченностью (соседняя
   колонка): та — ОТНОШЕНИЕ к порогу кредита, эта — АБСОЛЮТНАЯ сумма.
   Валюта производна от предмета (Р-44), у разных предметов может быть разной — поэтому
   суммируем ПО ВАЛЮТАМ, как в подвале реестра предметов (ПЗ-19), а не в одно число.
   ДГ-Д3 (сохранено): гейт содержания (Р-28) — договор без предметов не регистрируется.
   Ноль здесь не «мало», а НЕВОЗМОЖНОСТЬ регистрации, и выглядит он иначе — красной пилюлей.
   ДГ-Д8 (новый дефект, найден при переносе): пустой список предметов у ЗАКРЫТОГО или
   АННУЛИРОВАННОГО договора — норма, а не нарушение: при закрытии обеспечение высвобождается,
   у аннулированного черновика его и не было. Прежняя `contractItemsCell` красила красным
   ноль у всех троих терминальных договоров стенда (Д-007, Д-033, Д-044), обвиняя в
   «невозможности регистрации» то, что уже отрегистрировано и закрыто. На стенде гейт
   содержания срабатывал ТОЛЬКО ложно — ни одного живого случая. Соседняя колонка
   обеспеченности эту границу знала всегда («договор закрыт — не оценивается»), эта не знала.
   Терминальные — прочерк с объяснением, гейт остаётся только для живых. */
function contractSecuredSums(c){
  const sums = {};
  (c.allocs || []).forEach(a => { if(!(a.share > 0)) return;
    const ccy = itemCcyLabel(item(a.item)); sums[ccy] = (sums[ccy] || 0) + a.share; });
  return sums;
}
function contractSecuredCell(c){
  const ids = [...new Set((c.allocs || []).filter(a => a.share > 0).map(a => a.item))];
  if(!ids.length){
    /* ДГ-Д8: у терминального договора пустота — итог, а не дефект. */
    if(c.status === 'Закрыт' || c.status === CANCELLED)
      return `<span class="numcell2" title="договор ${esc(String(c.status).toLowerCase())} — обеспечение высвобождено">`
        + `<span class="n2-val" style="color:var(--text-placeholder)">—</span></span>`;
    return `<span class="numcell2"><span class="n2-val"><span class="tagpill err"`
      + ` title="гейт содержания (Р-28): в договоре нет ни одного предмета с долей &gt; 0 — регистрация невозможна">нет предметов</span></span></span>`;
  }
  const sums = contractSecuredSums(c), ccys = Object.keys(sums).sort();
  const tip = ids.map(id => { const it = item(id) || {};
    const share = (c.allocs || []).filter(a => a.item === id).reduce((s,a) => s + a.share, 0);
    return `${id} · ${it.name || ''} — ${fmt(share)} ${itemCcyLabel(it)}`; }).join(' · ');
  const val = ccys.map(cc => `${fmt(sums[cc])}<span class="ccy">${esc(cc)}</span>`).join(' · ');
  return `<span class="numcell2" title="${esc(tip)}">`
    + `<span class="n2-val">${val}</span>`
    + `<span class="n2-sub">${ids.length} ${plural(ids.length,'предмет','предмета','предметов')}</span></span>`;
}
/* ДГ-6 (главное расхождение реестра): ЧИСЛО и ЦВЕТ измеряли РАЗНОЕ. Число — индекс
   обеспеченности (Р-42), цвет — `gateCheck(c).ok`, то есть индекс ≥ 1 И доля ликвида ≥ 80%
   (Прил.1 §2.4). У Д-030/Д-036 индекс ровно 100,0% (covOk), а доля ликвида 0 — пилюля
   краснела при «стопроцентном» числе, и тултип о ликвиде не говорил ни слова.
   Правка: тултип разбирает КАЖДУЮ подпроверку гейта и называет провалившуюся.
   Заголовок «Обеспеченность (индекс)» → «Обеспеченность к порогу»: слово «индекс» называло
   реализацию, а не смысл (100% = порог достигнут, не «покрытие равно долгу»).
   ВЕРДИКТ ГЕЙТА — только у зарегистрированного договора. У черновика это ПРОГНОЗ: ничего ещё
   не нарушено, регистрации не было. Раньше Д-005 «Оформляется» красилось красным 81,7% —
   черновик обвинялся в нарушении порога, которого он ещё не обязан держать. */
function coverGateTip(c){
  const rows = gateCheck(c).rows;
  if(!rows.length) return 'в договоре нет кредитов';
  const head = isActive(c) ? '' : 'договор не зарегистрирован — прогноз, вердикт гейта выносится при регистрации. ';
  return head + rows.map(r => {
    /* Три числа легко перепутать, поэтому каждое названо своим именем: индекс нормирован
       к порогу (100% = порог достигнут), слагаемые — тоже к порогу, а ratio — отношение
       залоговой к СУММЕ КРЕДИТА (оно и есть «120%» из положения). */
    const bits = [`${r.id}: индекс ${pct(r.index)} — залоговая часть ${pct(r.idxPledge)}`
      + (r.gReq != null ? ` + гарантия ${pct(r.idxGuar)}` : '')
      + `, порог ${pct(r.req)} (${r.source})`];
    if(r.index < 1) bits.push(`индекс < 100% — обеспеченность ниже порога, не хватает ${fmt(Math.max(0, r.amount*r.req - r.sum))}`);
    if(r.liqApplies) bits.push(`доля ликвида ${pct(r.liqShare)} при минимуме ${pct(LIQUID_SHARE_MIN)}`
      + (r.liqOk ? '' : ' — НЕ ВЫПОЛНЕНА (Прил.1 §2.4)'));
    bits.push(`залоговая к сумме кредита ${pct(r.ratio)}`);
    bits.push(r.ok ? 'гейт пройден' : 'гейт НЕ пройден');
    return bits.join('; ');
  }).join(' · ');
}
/* Вердикт гейта одним словом — колонка фильтра и поле выгрузки (не только цвет пилюли). */
function coverVerdict(c){
  if(c.status==='Закрыт' || c.status===CANCELLED) return 'не оценивается';
  if(!c.credits.length) return 'не оценивается';
  return gateCheck(c).ok ? 'пройден' : 'не пройден';
}
function coverageCell(c){
  if(c.status==='Закрыт' || c.status===CANCELLED)
    return `<span style="color:var(--text-placeholder)" title="договор ${esc(c.status.toLowerCase())} — обеспеченность не оценивается">—</span>`;
  const rows = gateCheck(c).rows;
  if(!rows.length) return `<span class="pill neutral" title="в договоре нет кредитов">—</span>`;
  const worst = rows.reduce((a,b) => b.index < a.index ? b : a);
  /* Цвет = ВЕСЬ гейт (индекс ≥ 1 И доля ликвида), не только число. Черновик — серый. */
  const cls = !isActive(c) ? 'neutral' : (gateCheck(c).ok ? 'low' : 'high');
  return `<span class="flexcell" title="${esc(coverGateTip(c))}">`
    + `<span class="pill ${cls}">${pct(worst.index)}</span>`
    + (rows.length > 1 ? `<span class="tagpill third">худший из ${rows.length}</span>` : '')
    + `</span>`;
}
/* ДГ-10: вторая точка входа в карточку — шеврон в конце строки. */
function rowChevCell(type, id){
  return `<span class="rowchev" title="Открыть карточку" onclick="event.stopPropagation();openCard('${type}','${id}')">${_chev}</span>`;
}
/* ДГ-8: аннулированные черновики (Р-31) не удаляются, но по умолчанию не показываются.
   Раньше вернуть их можно было только фильтром «Статус = Аннулирован», а такой опции в
   селекте не существовало: список опций строился из уже отфильтрованных строк, среди которых
   аннулированных нет по построению. Состояние было недостижимо из UI. */
let showCancelledContracts = false;
function onShowCancelled(on){ showCancelledContracts = !!on; curPage = 1; renderFilterPanel(); renderList(); }
const cancelledHidden = () => showCancelledContracts ? 0 : CONTRACTS.filter(c => c.status === CANCELLED).length;
function rowsContracts(){
  return CONTRACTS.filter(c => showCancelledContracts || c.status !== CANCELLED).map(c => {
    const rows = (c.status==='Закрыт' || c.status===CANCELLED || !c.credits.length) ? [] : gateCheck(c).rows;
    const mc = rows.length ? Math.min(...rows.map(r => r.index)) : 0;
    const marks = contractMarks(c);
    const third = contractPledgers(c);
    return { id:c.id,
      /* ДГ-9: поисковый индекс. Р-38 завёл поиск по идентификаторам у ПРЕДМЕТОВ, у договоров
         индекс остался из четырёх полей — номера кредитов в него не входили (запрос «К-77»
         давал 0 строк, хотя Д-002 обеспечивает именно К-77: в индексе лежало ЧИСЛО кредитов),
         залогодатели тоже (см. ДГ-Д2). Служебные числовые ключи (dateN/stRank/marks/mc/items)
         из поиска исключены — «2» совпало бы с половиной реестра. */
      sort:{ id:c.id, no:c.no||'', dateN:dnum(ctrDate(c)), dateTxt:ctrDate(c),
        parties:clientName(c.inn), pledgers:third.map(clientName).join(' '),
        /* И идентификатор («К-77»), и человеческий номер («Дог. №77 от …») — в реестре
           договоров кредит называют и так, и так, а совпасть должно любое из двух. */
        creditNums:c.credits.map(id => `${id} ${(credit(id)||{}).num || ''}`).join(' '),
        /* ДГ-17: ключ сортировки колонки «Кредит» — ТЕКСТ идентификаторов, а не их число.
           Отдельно от creditNums: тот тащит ещё и «Дог. №56 от 10.04.2024», и сортировка по
           нему упорядочила бы реестр по дате КРЕДИТНОГО договора внутри строки. */
        creditIds:c.credits.join(' '),
        status:c.status, stRank:(CTR_RANK[c.status] ?? 9),
        markCodes:marks.map(m => m.code), marks:marks.length,
        items:new Set(c.allocs.map(a=>a.item)).size, credits:c.credits.length,
        /* ДГ-16: сортировка «Обеспечения» — по СУММЕ. При нескольких валютах ключ один и тот
           же порядок для разных валют не осмысляет (сложить их нельзя); в демо-данных валюта
           у всех предметов одна (Р-44 сделал itemCcy производной с дефолтом KGS), поэтому
           практический порядок корректен, а мультивалютный случай честнее сортировать не
           этим ключом, а фильтром по валюте — когда он появится (ПЗ-13). */
        secured:Object.values(contractSecuredSums(c)).reduce((s,v) => s+v, 0),
        mc, add:c.addenda.length, gate:coverVerdict(c) },
      cells:[ contractNoCell(c), contractDateCell(c), partiesCell(c), contractCreditCell(c),
        contractSecuredCell(c), contractStatusCell(c), coverageCell(c), rowChevCell('contract', c.id) ] };
  });
}
/* ============================================================
   Р-41: МОНИТОРИНГ — РАБОЧАЯ ОЧЕРЕДЬ (не лента)
   Триггер остаётся ВЫЧИСЛЯЕМЫМ (triggers()). Рабочий слой TRIG_WORK — надстройка над ним
   (ответственный, «принято в работу», «отложено до»), а не подмена: закрыть триггер можно
   только устранением ФАКТА. При исчезновении из triggers() запись, бывшая в работе, переезжает
   в журнал закрытых (TRIG_CLOSED) — для отчётности по мониторингу.
   ============================================================ */
const trigId = t => t.type + '|' + t.obj;   // устойчивый ключ (тип+объект) → в data-id вместо obj
const TRIG_WORK = {};      // trigId -> { taken:{who,date}, defer:{until,reason}|null, type, objLbl }
const TRIG_CLOSED = [];    // { type, objLbl, taken, closedDate }
let _deferId = null;
function findTrig(id){ return triggers().find(x => trigId(x) === id) || null; }
function reconcileTrigWork(){
  const live = new Set(triggers().map(trigId));
  Object.keys(TRIG_WORK).forEach(id => {
    if(!live.has(id)){
      const w = TRIG_WORK[id];
      TRIG_CLOSED.push({ type:w.type, objLbl:w.objLbl, taken:w.taken, closedDate:TODAY });
      delete TRIG_WORK[id];
    }
  });
}
/* «Что делать» → конкретное действие (кнопка ведёт в нужный диалог). null — прямого действия
   нет: текст остаётся пояснением. */
function trigAction(t){
  const o = t.obj;
  switch(t.type){
    case 'Залог без запрета на отчуждение':
    case 'Запрет наложен, отметка не получена':       return { label:'Открыть запрет', call:`openBan('${o}')` };
    case 'Требуется снятие запрета':                   return { label:'Снять запрет',   call:`openBanRelease('${o}')` };
    case 'Просрочен контроль: переоценка':
    case 'Требуется переоценка после согласованного действия':
    case 'Историческая запись прежней системы':        return { label:'Переоценка',     call:`openReval('${o}')` };
    case 'Просрочен контроль: обследование':           return { label:'Обследование',   call:`openSurvey('${o}')` };
    case 'Требуется извещение о восполнении предмета':
    case 'Извещение о восполнении выдано — идёт срок':  return { label:'Извещение',      call:`openRestoreNotice('${o}')` };
    case 'Ожидает решения комитета':                   return canCommittee() ? { label:'Решение комитета', call:`openCommission('${o}')` } : null;
    default: return null;
  }
}
function trigWorkCell(t){
  const id = trigId(t), w = TRIG_WORK[id], act = trigAction(t);
  const actBtn = act ? `<button class="btn btn-tint btn-sm" onclick="event.stopPropagation();${act.call}">${act.label}</button>`
                     : `<span class="mon-act">${esc(t.act)}</span>`;
  let work;
  if(!w) work = `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();takeTrig('${id}')">В работу</button>`;
  else if(w.defer) work = `<span class="pill neutral" title="${esc(w.defer.reason)}">отложено до ${esc(w.defer.until)}</span>`
                        + ` <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();undeferTrig('${id}')">Вернуть</button>`;
  else work = `<span class="pill low" title="ответственный: ${esc(w.taken.who)}">в работе с ${esc(w.taken.date)}</span>`
            + ` <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openDeferTrig('${id}')">Отложить</button>`;
  return `<div class="mon-actions">${actBtn}${work}</div>`;
}
function takeTrig(id){
  const t = findTrig(id); if(!t) return;
  TRIG_WORK[id] = { taken:{ who:role, date:TODAY }, defer:null, type:t.type, objLbl:t.objLbl };
  toast('Триггер принят в работу','ok'); renderList();
}
function undeferTrig(id){ const w = TRIG_WORK[id]; if(w){ w.defer = null; renderList(); } }
function openDeferTrig(id){
  const t = findTrig(id); if(!t) return;
  _deferId = id;
  modal(`<div class="modal form">${mhead('Отложить триггер · '+esc(t.type))}
    <div class="modal-b"><div class="mform">
      ${fdate('dfUntil','Отложить до', TODAY, true)}
      ${ftxt('dfReason','Причина отсрочки','')}
    </div></div>${mfoot('Отложить','saveDeferTrig()')}</div>`);
}
function saveDeferTrig(){
  const id = _deferId, until = iso2d(val('dfUntil')), reason = val('dfReason').trim();
  if(!isDate(until)) return toast('Дата — в формате дд.мм.гггг','warn');
  if(!reason) return toast('Укажите причину отсрочки','warn');
  const t = findTrig(id);
  const w = TRIG_WORK[id] || (TRIG_WORK[id] = { taken:{ who:role, date:TODAY }, type:t&&t.type, objLbl:t&&t.objLbl });
  w.defer = { until, reason };
  closeModal(); toast('Триггер отложен до '+until,'ok'); renderList();
}
function openMonitorObject(t){
  if(item(t.obj)) openCard('item', t.obj);
  else if(contract(t.obj)) openCard('contract', t.obj);

function renderTrigWorkPanel(){
  const wrap = document.getElementById('trigWorkPanel');
  if(!wrap) return;
  if(reg !== 'monitor'){ wrap.style.display = 'none'; return; }
  wrap.style.display = TRIG_CLOSED.length ? '' : 'none';

function rowsMonitor(){

  return triggers().map(t => ({ id: trigId(t), obj:t.obj, kind:t.type, raw:t,

      esc(t.type), esc(t.objLbl), esc(t.text), trigWorkCell(t) ] }));

/* ---- реестр «Поручительство» (§14, Р-25). Строка = договор поручительства (ребро M:N).
   Индикатор гейта §9.1/9.2 — вычисляемый (guarantorGate), не хранимый. ---- */
const SUR_ST_CLS = { 'черновик':'neutral', 'действует':'low', 'снято':'neutral', 'предъявлено':'high' };
const suretyStatusPill = s => `<span class="pill ${SUR_ST_CLS[s.status]||'neutral'}">${s.status}</span>`;
function gatePill(dpId){

/* СЛОЙ ОБЕСПЕЧЕННОСТИ (Р-24) — информационный, вне индекса coverage(). Пометка «иная
   форма» для поручительства несёт ярлык «параллельный слой, в индекс не входит»

function suretyMarkPill(creditId){

  return `Поручительство по ${creditId}: ${act.length} действующ${act.length===1?'ий':'их'} (${list}) — солидарно на всю сумму обязательства.`;

/* ---- Р-23 (ПОР п.12 п.п.2): панель «Факторы для комитета по администрированию бюджетных
   кредитов» в реестре мониторинга — витрина riskFactorCandidates() с действием «Направить
   фактор в комитет». Отправка пишет запись в историю ПРЕДМЕТА (дата/роль/реквизит, hist())
   и блокирует повтор по тому же (creditId+fact) до снятия — снятие фактора комитетом
   в этом мокапе не моделируется (за пределами модуля залога). */
const riskFactorsSent = {};
function sendRiskFactor(creditId, fact, itemId){
  if(!canCurate()) return denyEdit();
  const key = creditId+'|'+fact;
  if(riskFactorsSent[key]) return;
  riskFactorsSent[key] = { when: nowStamp(), who: role };
  const it = item(itemId);
  if(it) hist(it, `Фактор кредитного риска «${fact}» по кредиту ${creditId} направлен в Комитет по администрированию бюджетных кредитов (ПОР п.12 п.п.2)`);
  toast('Фактор направлен в комитет','ok');
  renderRiskFactorsPanel();
}
function renderRiskFactorsPanel(){
  const wrap = document.getElementById('riskFactorsPanel');
  if(!wrap) return;
  if(reg !== 'monitor'){ wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const cands = riskFactorCandidates();
  document.getElementById('riskFactorsBody').innerHTML = cands.length ? cands.map(c => {
    const key = c.creditId+'|'+c.fact, sent = riskFactorsSent[key], cr = credit(c.creditId), pit = item(c.itemId);
    const action = sent
      ? `<span class="pill neutral" title="${esc(sent.when)} · ${esc(sent.who)}">направлен</span>`
      : `<button class="btn btn-secondary btn-sm" onclick="sendRiskFactor('${c.creditId}','${esc(c.fact).replace(/'/g,"\\'")}','${c.itemId}')">Направить фактор в комитет</button>`;
    return `<tr><td>${esc(cr ? cr.num : c.creditId)}</td><td>${esc(clientName((cr||{}).inn))}</td>`
      + `<td>${c.itemId} · ${esc((pit||{}).name||'')}</td><td>${esc(c.fact)}</td><td>${esc(c.basis)}</td><td>${action}</td></tr>`;
  }).join('') : `<tr><td colspan="6"><div class="cgrid-empty">Факторов нет</div></td></tr>`;
}

/* ---- карточки реестров (вид «Карточки»). Данные/фильтр/сортировка — те же,

const cardField = (l,v,span) => `<div class="pcard-field${span?' span2':''}"><span class="pcard-flabel">${l}</span><span class="pcard-fval">${v}</span></div>`;
/* ПЗ-17: карточка описывает предмет ТЕМ ЖЕ набором признаков, что таблица — те же строители
   ячеек (kindCell/pledgerCell/pledgeCell/banCell/securesCell). Прежде решения ПЗ-10…ПЗ-15
   поменяли бы только таблицу, и один предмет в двух режимах ОДНОГО списка читался бы
   по-разному, а снятый «Контроль» остался бы жить в карточках.
   ПЗ-7: поля — Залогодатель · Идентификатор · Залоговая стоимость. Карточка это штатный

function itemCard(it){

/* ДГ-11: КАРТОЧНЫЙ ВИД У ДОГОВОРОВ СНЯТ (contractCard удалена).

function suretyCard(s){

function renderCards(rows, active){

/* ДГ-Д5: порядок по умолчанию — свойство РЕЕСТРА, а не остаток от предыдущего экрана.
   Раньше `sortKey` был глобальным индексом колонки и при смене реестра НЕ сбрасывался:
   отсортировав предметы по 4-й колонке («Залогодатель») и перейдя в договоры, пользователь
   получал их отсортированными по 4-й колонке договоров — по другому полю, без единого следа
   в UI о том, откуда взялся этот порядок. Индекс колонки не переносится между таблицами с
   разным составом колонок; переносить его было ошибкой.
   ДГ-12: у договоров дефолт — дата подписания по убыванию (свежие сверху). Реестр без
   заданного порядка показывал записи в порядке вставки в массив, и этот порядок выглядел
   хронологическим, не будучи им (Д-001 10.04.2024 · Д-002 18.09.2025 · Д-003 03.02.2025). */
const DEFAULT_SORT = {
  contracts: { key:1, dir:-1 },     // 1 = «Дата», убыв.
  items:     null, sureties: null, monitor: null,
};
function applyDefaultSort(){
  const d = DEFAULT_SORT[reg] || null;
  sortKey = d ? d.key : null;
  sortDir = d ? d.dir : 1;
}
/* ЕДИНАЯ точка смены реестра. Порядок сортировки сбрасывается ЗДЕСЬ, а не в renderList:
   в renderList эта правка затирала бы только что выбранный порядок (sortBy сначала ставит
   sortKey, потом зовёт renderList — и тот, увидев смену реестра, вернул бы дефолт). */
function setReg(r){ if(reg === r) return; reg = r; curPage = 1; applyDefaultSort(); }
function renderList(){
  if(renderList._lastReg !== reg){ curPage = 1; renderList._lastReg = reg; }   // Р-39: смена реестра → 1-я страница
  /* Р-37: у реестра «Предметы» авторитетная кнопка создания возвращена — имущество может быть
     предложено на этапе заявки, когда договора ещё нет. Кнопка на карточке договора остаётся
     контекстным ярлыком (openNewItem(cid) — предзаполняет договор и открывает привязку). */
  document.getElementById('btnNewLbl').textContent = reg==='sureties' ? 'Новый договор поручительства'
    : reg==='items' ? 'Новый предмет залога' : 'Новый залоговый договор';
  /* Р-34: реестровая «Создать» — единственное действие, которое СКРЫВАЕТСЯ (а не рендерится
     disabled): роль без права создания (Комитет, Наблюдатель) не должна видеть точку входа. */
  document.getElementById('btnNew').style.display = ((reg==='contracts' || reg==='sureties' || reg==='items') && canCurate()) ? 'inline-flex' : 'none';
  const qs = document.getElementById('quickSearch');
  if(qs){ qs.value = quickSearch[reg] || ''; qs.style.display = reg==='monitor' ? 'none' : '';
    qs.placeholder = SEARCH_HINT[reg] || 'Поиск…'; }
  /* ДГ-8: переключатель охвата — только у договоров (аннулировать можно черновик залогового
     договора, Р-31; у предметов и поручительств такого состояния нет). */
  const ct = document.getElementById('cancelToggle');
  if(ct){
    ct.style.display = reg==='contracts' ? 'inline-flex' : 'none';
    const chk = document.getElementById('chkCancelled'); if(chk) chk.checked = showCancelledContracts;
    const nCancelled = CONTRACTS.filter(c => c.status === CANCELLED).length;
    const lbl = document.getElementById('cancelLbl');
    if(lbl) lbl.textContent = showCancelledContracts
      ? `аннулированные показаны (${nCancelled})`
      : `показывать аннулированные (${nCancelled})`;
  }

  if(filterPanelReg !== reg) renderFilterPanel();

  const heads = HEADS[reg], ws = WIDTHS[reg] || [], sks = SORT_KEYS[reg] || [];
  /* ПЗ-Д13: минимум ширины таблицы — иначе width:100% + table-layout:fixed молча ужмут
     колонки вместо прокрутки .grid-wrap, и первой схлопнется гибкая «Наименование». */
  const grid = document.getElementById('listGrid');
  if(grid) grid.style.minWidth = gridMinWidth(reg) + 'px';
  /* Р-39: сортируемость и активный указатель задаются картой SORT_KEYS. Активная колонка —
     ↑/↓ по направлению; прочие сортируемые — ↕; несортируемые (null) — без стрелки и курсора. */
  document.getElementById('listHead').innerHTML = heads.map((h,i)=>{
    const sortable = sks[i] != null;
    const style = [ws[i]?`width:${ws[i]}`:'', sortable?'cursor:pointer':''].filter(Boolean).join(';');
    const arrow = !sortable ? '' : `<span class="sort${sortKey===i?' active':''}">${sortKey===i ? (sortDir>0?'↑':'↓') : '↕'}</span>`;
    /* ПЗ-22: пробел перед стрелкой — ТОЧКА ПЕРЕНОСА. Без неё «Идентификатор↕» склеен в одно
       непереносимое слово, и колонка обязана вмещать подпись ВМЕСТЕ со стрелкой (154px под
       значение «П-001»). С пробелом стрелка при нехватке уходит на вторую строку. */
    return `<th${style?` style="${style}"`:''}${sortable?` onclick="sortBy(${i})"`:''}>${h}${arrow?' '+arrow:''}</th>`;
  }).join('');
  let rows = filterRows(regRows());
  if(sortKey !== null){
    const k = sks[sortKey];
    if(k) rows = [...rows].sort((a,b)=>{
      const x=a.sort[k], y=b.sort[k];
      return (typeof x === 'number' ? (x-y) : String(x).localeCompare(String(y),'ru')) * sortDir;
    });
  }
  /* Р-39: пагинация — renderList рисует только текущую страницу отфильтрованного+
     отсортированного набора. */
  const total = rows.length, pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  const pageRows = rows.slice((curPage-1)*PAGE_SIZE, curPage*PAGE_SIZE);
  const active = activeConditions();
  document.getElementById('listBody').innerHTML = pageRows.map(r=>`
    <tr data-id="${r.id}" tabindex="0" onclick="selectRow('${r.id}')" ondblclick="openSelected()" onkeydown="onRowKey(event,'${r.id}')">
      ${r.cells.map(c=>`<td>${c}</td>`).join('')}
    </tr>`).join('') || `<tr><td colspan="${heads.length}">${emptyState(active)}</td></tr>`;
  /* ПЗ-19: подвал — Σ залоговой стоимости по ОТФИЛЬТРОВАННОМУ набору (не по странице),
     с разбивкой по валютам. Главный вопрос к картотеке — «сколько у нас обеспечения», а
     ответа на него в реестре не было; ширины подвал не стоит ничего. */
  renderGridFoot(rows, heads.length);
  /* ПЗ-Д2 + ПЗ-8: склонение и база счёта. Было «1 предметов» и «3 предметов (фильтр)» —
     из скольких отобрано, не видно. Стало «3 из 812 предметов». */
  const totalAll = active ? regRows().length : total;
  const nounOf = { items:['предмет','предмета','предметов'],
    contracts:['договор','договора','договоров'],
    sureties:['договор поручительства','договора поручительства','договоров поручительства'],
    monitor:['активный триггер','активных триггера','активных триггеров'] }[reg] || ['строка','строки','строк'];
  /* ДГ-8: скрытое пейджер НАЗЫВАЕТ. Раньше аннулированные молча выпадали из знаменателя —
     «39 договоров» при 42 записях в реестре, и разница ничем не объяснялась. */
  const hidden = reg==='contracts' ? cancelledHidden() : 0;
  document.getElementById('pagerCount').textContent =
    (active ? `${total} из ${totalAll} ` : `${total} `) + plural(active ? totalAll : total, ...nounOf)
    + (hidden ? ` · скрыто аннулированных: ${hidden}` : '');
  /* ПЗ-8: края набора — на 60 страницах перещёлкивать по одной не работа. */
  document.getElementById('pagerNav').innerHTML = pages>1
    ? `<button ${curPage<=1?'disabled':''} onclick="gotoPage(1)" title="В начало">«</button>`
      + `<button ${curPage<=1?'disabled':''} onclick="gotoPage(${curPage-1})" title="Предыдущая">‹</button>`
      + `<span class="pager-pos">стр. ${curPage} из ${pages}</span>`
      + `<button ${curPage>=pages?'disabled':''} onclick="gotoPage(${curPage+1})" title="Следующая">›</button>`
      + `<button ${curPage>=pages?'disabled':''} onclick="gotoPage(${pages})" title="В конец">»</button>`
    : '';
  const psel = document.getElementById('pagerSize'); if(psel) psel.value = String(PAGE_SIZE);
  renderFilterSummary();
  if(selected) document.querySelectorAll('#listBody tr').forEach(t=>t.classList.toggle('sel', t.dataset.id===selected));

  /* Вид Таблица ↔ Карточки: тумблер только для items/contracts, monitor — всегда таблица. */
  const view = regView(), canToggle = CARD_REGS.includes(reg);
  document.getElementById('viewSeg').style.display = canToggle ? 'inline-flex' : 'none';
  document.getElementById('segTable').classList.toggle('active', view==='table');
  document.getElementById('segCards').classList.toggle('active', view==='cards');
  document.getElementById('gridWrap').style.display  = view==='cards' ? 'none' : '';
  document.getElementById('cardsWrap').style.display = view==='cards' ? '' : 'none';
  renderCardsSort(view);                        // ПЗ-7
  renderRegKpi();                               // ДГ-19
  if(view==='cards') renderCards(pageRows, active);
  renderRiskFactorsPanel();
  renderTrigWorkPanel();
}
/* ПЗ-5: подпись поиска называет то, по чему он реально идёт. Р-38 завёл индекс по
   идентификаторам, но в UI об этом не говорилось — никто не догадывался вставить сюда VIN. */
const SEARCH_HINT = {
  items:     'Наименование, кадастр, VIN, гос. №, залогодатель…',
  contracts: 'Номер договора, Д-№, кредит, заёмщик, залогодатель…',   // ДГ-9
  sureties:  'Поручитель, договор, кредит…',
  monitor:   'Поиск…',
};
/* ПЗ-18: пустых состояния ДВА, и выходы из них противоположные. Раньше «Записей нет»
   показывалось и когда реестр пуст, и когда фильтр ничего не нашёл, — а панель фильтра
   свёрнута, и пользователь, опечатавшийся в VIN, решал, что такого имущества в системе нет. */
function emptyState(active){
  if(active) return `<div class="grid-empty"><span>По заданным условиям ничего не найдено`
    + ` (${active} ${plural(active,'условие','условия','условий')}).</span>`
    + `<button class="btn btn-secondary btn-sm" onclick="resetFilter()">Сбросить условия</button></div>`;
  const label = reg==='items' ? 'Предметов в реестре пока нет'
    : reg==='contracts' ? 'Залоговых договоров пока нет'
    : reg==='sureties' ? 'Договоров поручительства пока нет' : 'Активных триггеров нет';
  /* Р-34: кнопка создания скрыта у роли без права создания — как и в тулбаре. */
  const canNew = canCurate() && ['items','contracts','sureties'].includes(reg);
  const newLbl = reg==='items' ? 'Новый предмет залога'
    : reg==='sureties' ? 'Новый договор поручительства' : 'Новый залоговый договор';
  return `<div class="grid-empty"><span>${label}.</span>`
    + (canNew ? `<button class="btn btn-primary btn-sm" onclick="onNew()">${newLbl}</button>` : '') + `</div>`;
}
/* ПЗ-19: Σ по валютам. Валюта предмета производна (Р-44) и у разных предметов разная —
   складывать их в одно число нельзя, поэтому итог разбит по валютам, а не «всего». */
/* ДГ-16: подвал заведён и у ДОГОВОРОВ. Реестр предметов отвечал «сколько у нас обеспечения»
   с волны ПЗ-19, реестр договоров — нет, хотя вопрос к нему тот же и ответ отличается по
   смыслу: у предметов это Σ ЗАЛОГОВОЙ СТОИМОСТИ (сколько имущество стоит), у договоров —
   Σ ОТНЕСЁННЫХ ДОЛЕЙ (сколько из этой стоимости связано обязательствами). Второе ≤ первого,
   и разница — свободный остаток; складывать их между собой нельзя, поэтому подписи разные. */
function renderGridFoot(rows, cols){
  const el = document.getElementById('listFoot'); if(!el) return;
  if(!rows.length || (reg !== 'items' && reg !== 'contracts')){ el.innerHTML = ''; return; }
  const sums = {};
  if(reg === 'items'){
    rows.forEach(r => { const it = item(r.id); if(!it) return;
      const c = itemCcyLabel(it); sums[c] = (sums[c] || 0) + pledgeValue(it); });
  } else {
    rows.forEach(r => { const c = contract(r.id); if(!c) return;
      const s = contractSecuredSums(c);
      Object.keys(s).forEach(cc => { sums[cc] = (sums[cc] || 0) + s[cc]; }); });
  }
  const parts = Object.keys(sums).sort().map(c =>
    `<span class="sum-ccy">${fmt(sums[c])} ${esc(c)}</span>`).join('');
  const label = reg === 'items'
    ? `Σ залоговой стоимости по отбору (${rows.length} ${plural(rows.length,'предмет','предмета','предметов')})`
    : `Σ обеспечения по отбору (${rows.length} ${plural(rows.length,'договор','договора','договоров')})`;
  el.innerHTML = `<tr><td colspan="${cols}">${label}:${parts}</td></tr>`;
}
/* ДГ-19: СОСТАВ ОТБОРА — плитки над реестром договоров. Каждая называет число и ставит
   кликом соответствующее условие фильтра (повторный клик снимает).
   Плитки — не отчёт, а навигация: «в комитете 3» без возможности эти три открыть было бы
   сообщением, а не инструментом. */
const REG_KPI = [
  { key:'status', val:'Зарегистрирован',          label:'зарегистрировано', tip:'договоры, прошедшие государственную регистрацию обременения' },
  { key:'status', val:'Оформляется',              label:'оформляется',      tip:'черновики: номер и дата ещё не присвоены' },
  { key:'status', val:'На рассмотрении комиссии', label:'в комитете',       tip:'ожидают решения комитета по администрированию бюджетных кредитов (Р-35)' },
  { key:'gate',   val:'не пройден',               label:'гейт не пройден',  warn:true,
    tip:'контрольный гейт §2.3–2.4: индекс обеспеченности < 100% ИЛИ не выдержана доля ликвида (Прил.1 §2.4)' },
  { key:'status', val:'Закрыт',                   label:'закрыто',          tip:'обязательства исполнены, обеспечение высвобождено' },
];
/* Условия, которыми управляют САМИ плитки. База счёта их не применяет — иначе после клика по
   «зарегистрировано» остальные плитки показали бы нули, и вернуться к ним было бы нечем.
   Тот же класс дефекта, что ДГ-Д4 (опции фильтра, построенные по видимым строкам): состояние
   становится недостижимым из UI ровно тогда, когда в него уже вошли. */
const KPI_KEYS = ['status','gate'];
function kpiBase(){
  const f = activeFilter.contracts, saved = {};
  KPI_KEYS.forEach(k => { if(k in f){ saved[k] = f[k]; delete f[k]; } });
  const rows = filterRows(rowsContracts());
  Object.keys(saved).forEach(k => { f[k] = saved[k]; });
  return rows;
}
function renderRegKpi(){
  const el = document.getElementById('regKpi'); if(!el) return;
  if(reg !== 'contracts'){ el.className = 'reg-kpi'; el.innerHTML = ''; return; }
  const base = kpiBase(), f = activeFilter.contracts;
  el.className = 'reg-kpi on';
  el.innerHTML = REG_KPI.map((t,i) => {
    const n = base.filter(r => r.sort[t.key] === t.val).length;
    const sel = f[t.key] === t.val;
    const cls = ['rk', sel ? 'sel' : '', (t.warn && n) ? 'warn' : '', n ? '' : 'zero'].filter(Boolean).join(' ');
    return `<button type="button" class="${cls}" onclick="kpiPick(${i})"`
      + ` title="${esc(t.tip)} · клик — ${sel ? 'снять условие' : 'отобрать'}">`
      + `<span class="rk-v">${n}</span><span class="rk-l">${esc(t.label)}</span></button>`;
  }).join('');
}
function kpiPick(i){
  const t = REG_KPI[i], f = activeFilter.contracts;
  if(f[t.key] === t.val) delete f[t.key]; else f[t.key] = t.val;
  curPage = 1; renderFilterPanel(); renderList();
}
/* ПЗ-7: в карточном виде gridWrap скрыт целиком вместе с заголовками, на которых висит
   sortBy. Порядок продолжал применяться — тот, что был выбран в таблице, — но пользователь
   его не видел и сменить не мог. Это хуже, чем если бы сортировки не было вовсе. */
function renderCardsSort(view){
  const wrap = document.getElementById('cardsSort'); if(!wrap) return;
  const on = view === 'cards';
  wrap.classList.toggle('on', on);
  if(!on) return;
  const heads = HEADS[reg] || [], sks = SORT_KEYS[reg] || [];
  document.getElementById('cardsSortKey').innerHTML =
    `<option value="">— без сортировки —</option>`
    + heads.map((h,i) => sks[i] == null ? '' :
        `<option value="${i}"${sortKey===i?' selected':''}>${esc(h)}</option>`).join('');
  document.getElementById('cardsSortDir').textContent = sortDir > 0 ? '↑' : '↓';
}
function onCardsSort(v){
  if(v === ''){ sortKey = null; } else { sortKey = Number(v); sortDir = 1; }
  curPage = 1; renderList();
}
function toggleSortDir(){ if(sortKey === null) return; sortDir *= -1; curPage = 1; renderList(); }
/* ПЗ-16: клавиатурный путь в карточку. Двойной клик был ЕДИНСТВЕННЫМ способом открыть
   запись: в тулбаре нет «Открыть», контекстного меню в файле нет ни одного. */
function onRowKey(e, id){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault(); selectRow(id); openSelected();
}
function sortBy(i){
  if((SORT_KEYS[reg]||[])[i] == null) return;   // Р-39: несортируемая колонка — клик ничего не делает
  if(sortKey===i) sortDir*=-1; else { sortKey=i; sortDir=1; }
  curPage = 1; renderList();
}
function gotoPage(p){ curPage = p; renderList(); }

/* ============================================================
   Р-40: ЭКСПОРТ CSV + ПЕЧАТНЫЕ ФОРМЫ
   Отдел вводит в систему ровно те документы, которые обязан выдавать наружу, — но ни
   выгрузки, ни печати не было. CSV — текущий отфильтрованный+отсортированный реестр
   (не только страница). Печатные формы генерируются ИЗ СОСТОЯНИЯ, не хранятся.
   Строители (buildCsv/buildPrintForm) отделены от выдачи (exportCsv/printForm/downloadFile),
   чтобы смоук-тесты проверяли содержимое без реального скачивания/окна печати.
   ============================================================ */
/* Отфильтрованный+отсортированный полный набор строк реестра (та же логика, что в renderList,
   но без нарезки по страницам). */
function sortedRows(r){
  const prev = reg; reg = r;
  let rows = filterRows(regRows());
  reg = prev;
  if(sortKey !== null){
    const k = (SORT_KEYS[r] || [])[sortKey];
    if(k) rows = [...rows].sort((a,b)=>{ const x=a.sort[k], y=b.sort[k];
      return (typeof x === 'number' ? (x-y) : String(x).localeCompare(String(y),'ru')) * sortDir; });
  }
  return rows;
}
/* ============================================================
   ПЗ-6: ПРОФИЛЬ ВЫГРУЗКИ НА КАЖДЫЙ РЕЕСТР — не зеркало экрана.
   Прежний buildCsv выгружал те же ячейки, что и таблица, срезая теги: семь колонок из
   тридцати. Оценочная, коэффициент, дата оценки, оценщик и лицензия, кадастр/VIN,
   количество и единица, правоустанавливающий документ, страхование, рег. № запрета — ничего
   этого в файле не было. Для КАРТОТЕКИ выгрузка полного реестра — основной сценарий, а не
   вспомогательный: экран показывает восемь колонок, работать в Excel надо со всеми полями.
   ПЗ-Д12: две пилюли статуса склеивались в одну ячейку («в залоге запрет наложен») без
   разделителя — в Excel не разложить; здесь оси разведены по своим полям. fmt() вставляет
   неразрывный пробел, Excel читает такое как ТЕКСТ и не суммирует — деньги идут через
   fmtRaw() (без разделителей групп, десятичная запятая).
   Фильтр и сортировка применяются, выгружается весь отобранный набор, а не страница.
   ============================================================ */
const CSV_PROFILES = {
  items: [
    ['Идентификатор',                 it => it.id],
    ['Вид залога',                    it => it.kind],
    ['Ликвидность вида',              it => isLiquid(it) ? 'ликвидный' : 'неликвидный'],
    ['Движимость',                    it => isMovable(it) ? 'движимое' : 'недвижимое'],
    ['Наименование',                  it => it.name],
    ['Идентификатор объекта',         it => it.ident],
    ['Адрес / место нахождения',      it => (it.details||{}).address || (it.details||{}).storeAddr || ''],
    ['Количество',                    it => it.qty],
    ['Единица измерения',             it => it.unit],
    ['Залогодатель',                  it => clientName(it.pledger)],
    ['ИНН залогодателя',              it => it.pledger],

/* Худшая (по индексу) строка гейта договора — общий источник для всех полей выгрузки,
   чтобы «худший индекс» и «порог» относились к ОДНОМУ И ТОМУ ЖЕ кредиту, а не к разным. */
function worstRow(c){
  if(c.status==='Закрыт' || c.status===CANCELLED || !c.credits.length) return null;
  const rows = gateCheck(c).rows;
  return rows.length ? rows.reduce((a,b) => b.index < a.index ? b : a) : null;
}
const worstCover = (c, field) => { const w = worstRow(c); return w ? w[field] : null; };
/* Доли (0…1) → проценты числом с десятичной запятой и без знака «%» (ср. fmtRaw для денег):
   «120,0» Excel сложит и отсортирует, «120,0%» прочитает как текст. */
const csvPctRaw = x => x == null ? '' : (x*100).toFixed(1).replace('.',',');
/* Сущность реестра по id строки — профиль работает с ЗАПИСЬЮ, а не с готовой разметкой. */
const CSV_ENTITY = { items:item, contracts:contract, sureties:surety };
function buildCsv(r){
  r = r || reg;
  const strip = s => String(s ?? '').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
  const q = s => '"' + strip(s).replace(/"/g,'""') + '"';
  const rows = sortedRows(r);
  const prof = CSV_PROFILES[r], ent = CSV_ENTITY[r];
  const lines = (prof && ent)
    ? [ prof.map(([h]) => q(h)).join(';'),
        ...rows.map(row => { const o = ent(row.id);
          return prof.map(([,v]) => q(o ? v(o) : '')).join(';'); }) ]
    /* Реестры без профиля (мониторинг — вычисляемая лента, записи как таковой нет)
       выгружаются зеркалом экрана, как раньше. */
    : [ HEADS[r].map(q).join(';'), ...rows.map(row => row.cells.map(q).join(';')) ];
  return '﻿' + lines.join('\r\n');   // BOM — Excel читает кириллицу в UTF-8
}
function downloadFile(name, content, mime){
  try{
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 0);
    return true;
  }catch(e){ toast('Скачивание недоступно в этой среде','warn'); return false; }
}
function exportCsv(){
  const rows = sortedRows(reg);
  if(!downloadFile(`реестр-${reg}-${TODAY}.csv`, buildCsv(reg), 'text/csv;charset=utf-8')) return;
  toast(`Экспортировано строк: ${rows.length}`,'ok');
}
/* Печатные формы (Р-40): опись предметов по договору, справка об обеспеченности кредита
   (с разбором индекса), акт обследования (Прил.2 §2.3/§2.4), извещение о восполнении (Прил.2 §2.5).
   buildPrintForm(kind, id) возвращает готовый HTML-документ (тело); printForm открывает его в
   отдельном окне и вызывает печать. Формы не хранятся — считаются из состояния на момент печати. */
const PRINT_CSS = `body{font:13px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1A2027;margin:32px;}
h1{font-size:18px;margin:0 0 4px} .sub{color:#5B6B7E;margin:0 0 18px}
table{border-collapse:collapse;width:100%;margin:10px 0} th,td{border:1px solid #C3CCD6;padding:6px 8px;text-align:left;font-size:12px}
th{background:#EEF3F9} .r{text-align:right} .foot{margin-top:26px;color:#5B6B7E} .sign{margin-top:40px;display:flex;gap:60px}
.sign div{border-top:1px solid #1A2027;padding-top:4px;min-width:220px;font-size:12px}`;
function printDoc(title, bodyHtml){
  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${PRINT_CSS}</style></head><body>${bodyHtml}</body></html>`;
}
function buildPrintForm(kind, id){

      <td>${esc(clientName(it.pledger))}</td><td class="r">${fmt(pledgeValue(it))} ${itemCcyLabel(it)}</td>

      <p class="sub">Договор ${c.id} · заёмщик ${esc(clientName(c.inn))} · дата печати ${TODAY}</p>
      <table><thead><tr><th>№</th><th>Ид.</th><th>Наименование</th><th>Вид</th><th>Залогодатель</th><th class="r">Залоговая стоимость</th><th>Правоустан. документ</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7">Предметы не отнесены</td></tr>'}</tbody></table>

  }
  if(kind === 'справка'){
    const c = contract(id); if(!c) return '';
    const cs = ctx(isActive(c) ? null : c);
    const rows = c.credits.map(cid=>{ const r = coverage(cs, cid), cr = credit(cid);
      return `<tr><td>${cid}</td><td>${esc(cr.num)}</td><td class="r">${fmt(cr.amount)} ${ccyLabel(creditCcy(cr))}</td>
        <td class="r">${pct(r.req)}</td><td class="r">${pct(r.idxPledge)}</td>
        <td class="r">${r.gReq!=null?pct(r.idxGuar):'—'}</td><td class="r"><b>${pct(r.index)}</b></td>
        <td>${r.ok?'обеспечен':'НЕ обеспечен'}</td></tr>`; }).join('');
    return printDoc('Справка об обеспеченности · '+c.id, `
      <h1>Справка об обеспеченности кредитов по договору ${c.no ? esc(c.no) : c.id}</h1>
      <p class="sub">Договор ${c.id} · заёмщик ${esc(clientName(c.inn))} · дата печати ${TODAY}</p>
      <table><thead><tr><th>Кредит</th><th>Договор</th><th class="r">Сумма</th><th class="r">Порог</th>
        <th class="r">Индекс залога</th><th class="r">Индекс гарантии</th><th class="r">Индекс (итог)</th><th>Гейт</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <p class="foot">Индекс обеспеченности = залог + банковская гарантия, считается в валюте кредита.</p>
      <div class="sign"><div>Куратор отдела залогового обеспечения</div><div>Начальник отдела</div></div>`);
  }
  if(kind === 'акт'){
    const it = item(id); if(!it) return '';
    const s = livesSurvey(it).slice(-1)[0];
    return printDoc('Акт обследования · '+it.id, `
      <h1>Акт обследования предмета залога</h1>
      <p class="sub">Предмет ${it.id} · ${esc(it.name)} · дата печати ${TODAY}</p>
      <table><tbody>
        <tr><th>Предмет</th><td>${it.id} · ${esc(it.name)} (${esc(it.kind)})</td></tr>
        <tr><th>Залогодатель</th><td>${esc(clientName(it.pledger))}</td></tr>
        <tr><th>Дата обследования</th><td>${s ? s.date : '— (обследование не проводилось)'}</td></tr>
        <tr><th>Результат</th><td>${s ? esc(s.result || s.note || 'без замечаний') : '—'}</td></tr>
        <tr><th>Залоговая стоимость</th><td>${fmt(pledgeValue(it))} ${itemCcyLabel(it)}</td></tr>
      </tbody></table>
      <p class="foot">Основание — Прил.2 §2.3/§2.4. Сформировано из системы ${TODAY}.</p>

  if(kind === 'извещение'){

      <h1>Извещение о восполнении предмета залога</h1>

      <table><tbody>
        <tr><th>Предмет</th><td>${it.id} · ${esc(it.name)}</td></tr>
        <tr><th>Залогодатель</th><td>${esc(clientName(it.pledger))}</td></tr>
        <tr><th>Основание</th><td>${it.lost ? 'утрата предмета' : 'ухудшение состояния'} (обследование)</td></tr>

function printForm(kind, id){
  const html = buildPrintForm(kind, id);
  if(!html) return toast('Форма недоступна для этого объекта','warn');
  let w = null;
  try{ w = window.open('', '_blank'); }catch(e){ w = null; }
  if(!w) return toast('Печать недоступна в этой среде (всплывающее окно заблокировано)','warn');
  w.document.write(html); w.document.close();
  try{ w.focus(); w.print(); }catch(e){}
}

/* ПЗ-Д9: подсветка строки — переключение класса, а не перерисовка всего списка.
   renderList() ради одной строки заново считал lienStatus/banStatus/pledgeValue/itemSecures
   и тултипы покрытия на всю страницу; на 50, а после ПЗ-8 и на 200 строках это заметная
   задержка на КАЖДЫЙ клик. Карточный вид подсвечивается тем же классом .sel. */
function selectRow(id){
  selected = id;
  document.querySelectorAll('#listBody tr').forEach(t => t.classList.toggle('sel', t.dataset.id === id));
  document.querySelectorAll('#cardsWrap .pcard').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
}
function openSelected(){
  if(!selected) return;
  /* Р-41: в мониторинге selected — это trigId (тип+объект), а не id записи. Открываем карточку
     объекта, к которому относится триггер. */
  if(reg==='monitor'){ const t = findTrig(selected); if(t) openMonitorObject(t); return; }
  if(item(selected)) openCard('item', selected);
  else if(contract(selected)) openCard('contract', selected);
  else if(surety(selected)) openCard('surety', selected);
  else if(credit(selected)) toast('Переход в карточку кредита '+credit(selected).num+' (модуль «Кредиты»)');
}
/* Авторитетная кнопка «Создать»: предмет залога (реестр предметов, Р-37), договор залога
   (реестр договоров) либо договор поручительства (реестр поручительств). Кнопка на карточке
   договора — контекстный ярлык, вызывает openNewItem(cid) с предзаполнением. */
function onNew(){ if(!canCurate()) return denyEdit();
  if(reg==='contracts') openNewContract();
  else if(reg==='sureties') openNewSurety();
  else if(reg==='items') openNewItem();   // Р-37: авторитетная точка рождения предмета (договора ещё нет)
}

/* ============================================================
   КАРТОЧКИ — вкладки и панели
   ============================================================ */
/* Р-52/Р-53: вкладки предмета — только слои самой вещи. Порядок панелей = порядок вкладок.
   Отдельной вкладки допуска нет ни на предмете, ни на договоре: вердикт показывается
   чипом в шапке предмета и колонкой «Допуск» в таблице предметов договора. Сами проверки
   (admissionChecks/admissionVerdict) остаются движком чипа, дефект-строки и триггеров. */
const TABS_ITEM = ['Основное','Стоимость и переоценки','Запрет на отчуждение','Обследования','Обеспечиваемые кредиты','Документы','История'];
const TABS_CTR  = ['Общая информация','Предметы залога','Обеспеченность кредитов','Доп соглашения','Документы','История'];
const TABS_SUR  = ['Основное','Допуск §9.1/9.2','История'];
let curTab = 0;

/* Р-53: бейджи-счётчики на вкладках — состав работы виден до открытия вкладки
   (стоп-факторы, число актов, укомплектованность досье, длина истории). */
function itemTabs(it){
  const d = itemDossier(it);
  const badge = (n, cls) => n ? `<span class="tb${cls?' '+cls:''}">${n}</span>` : '';
  return TABS_ITEM.map((t,i) => {
    if(i===3) return t + badge(livesSurvey(it).length);
    if(i===4) return t + badge(CONTRACTS.filter(c => (isActive(c)||isDraftish(c)) && c.allocs.some(a=>a.item===it.id)).length);
    if(i===5) return t + `<span class="tb${d.missing.length?' err':d.exp?' warn':''}">${d.met}/${d.req}</span>`;
    if(i===6) return t + badge(it.history.length);
    return t;
  });
}

/* КП-2: шапка карточки — отдельная функция на каждый тип, а не первая строка первой панели.
   Диспетчер вызывается из openCard и рисует шапку в слот #detailHead, поэтому она одинаково
   видна на всех вкладках всех трёх карточек модуля. */
function cardHead(type, id){
  return type==='item' ? itemHead(item(id)) : type==='surety' ? surHead(surety(id)) : ctrHead(contract(id));
}
function openCard(type, id, tab){
  /* КП-Д2: histFilter/histLimit — состояние ПРЕДСТАВЛЕНИЯ одной карточки, а не приложения.
     Без сброса фильтр протекал на следующую карточку: открыл предмет с фильтром «Запрет»,
     перешёл на предмет без записей этой категории — лента пуста, чип «Запрет» не построен
     (chips фильтруются по c.n), ни один чип не подсвечен, и почему история пустая — неясно. */
  if(!(cur && cur.type === type && cur.id === id)){ histFilter = 'all'; histLimit = 20; openSubRows.clear(); }
  cur = { type, id }; curTab = tab ?? 0;
  const tabs = type==='item' ? itemTabs(item(id)) : type==='surety' ? TABS_SUR : TABS_CTR;
  document.getElementById('detailTabbar').innerHTML =
    tabs.map((t,i)=>`<button class="dtab${i===curTab?' active':''}" onclick="openCard('${type}','${id}',${i})">${t}</button>`).join('');
  const panels = type==='item' ? itemPanels(item(id)) : type==='surety' ? surPanels(surety(id)) : ctrPanels(contract(id));
  document.getElementById('detailHead').innerHTML = cardHead(type, id);
  document.getElementById('detailPanels').innerHTML = panels[curTab];
  document.getElementById('detailFooter').innerHTML = type==='item' ? itemFooter(item(id)) : type==='surety' ? surFooter(surety(id)) : ctrFooter(contract(id));
  document.getElementById('crumbTitle').textContent = type==='item'
    ? `${id} · ${item(id).name}`
    : type==='surety'
    ? `${id} · ${surety(id).no || 'черновик'} · ${(guarantor(surety(id).guarantor)||{}).name || surety(id).guarantor}`
    : `${id} · ${contract(id).no || 'черновик'} · ${clientName(contract(id).inn)}`;
  showView('detail');
}
const kpi = (l,v) => `<div class="dim"><div class="dl">${l}</div><div class="dv">${v}</div></div>`;
const ro  = (l,v)=>`<div class="field"><span class="flabel">${l}</span><div class="control ro"><input value="${esc(v??'')}" readonly></div></div>`;

/* ---------- КАРТОЧКА ПРЕДМЕТА ---------- */
/* Р-8: блок извещения о восполнении на карточке (состояние регламентного шага перед взысканием). */
function renderRestoreBlock(it){
  const rn = it.restoreNotice, reason = it.lost ? 'утрата' : 'ухудшение состояния';
  if(!rn || !rn.issued) return `<div class="warn-inline" style="margin:0 0 12px"><span>Обследование зафиксировало <b>${reason}</b>. Оформите извещение о восполнении и установите срок.</span></div>`;
  if(rn.voided) return `<div class="warn-inline" style="margin:0 0 12px"><span style="text-decoration:line-through">Извещение ${esc(rn.doc||'')} от ${rn.date}</span> — <span class="pill high" title="${esc(rn.voided.reason)}">сторнировано · ${rn.voided.date}</span> ${esc(rn.voided.reason)}</span></div>`;
  const vbtn = canHeadOfUnit() ? ` <button class="btn btn-tint btn-sm danger" onclick="openVoidRecord('${it.id}','restoreNotice',0)">Сторнировать извещение</button>` : '';
  if(rn.resolved === 'восполнено') return `<div class="okline" style="margin:0 0 12px"><span>Восполнено: ${esc(rn.doc||'')} — предмет восстановлен/заменён, взыскание не требуется.</span></div>`;
  if(rn.resolved === 'отказ' || isOverdue(rn.deadline)){
    const why = rn.resolved==='отказ' ? 'залогодатель отказался восполнить предмет' : `срок восполнения ${rn.deadline} истёк без восполнения`;
    return `<div class="flagline" style="margin:0 0 12px"><span>Извещение ${esc(rn.doc||'')} от ${rn.date}: ${why}. Замените предмет доп соглашением либо зафиксируйте отказ.</span></div>`;
  }
  return `<div class="infoline" style="margin:0 0 12px"><span>Извещение ${esc(rn.doc||'')} от ${rn.date} вручено, срок восполнения до <b>${rn.deadline}</b> (${daysLeft(rn.deadline)} дн.). До истечения срока взыскание не поднимается.${vbtn}</span></div>`;
}
/* type-specific детали предмета для чтения (KIND_FIELDS §9.2 прежней системы).
   КП-10: печатаются ВСЕ поля вида, пустые — приглушённым «не заполнено». Раньше пустые
   графы просто исчезали: у 42 предметов из 55 фактография неполная, и оформитель видел
   у транспортного средства шесть строк, считая, что у этого вида их шесть — а их восемь.
   Неполнота НЕ поднимается в допуск и не становится дефектом: «Жилая площадь» у склада
   пуста законно, и превращать это в замечание значило бы залить карточку шумом. */
function detailFillCount(it){
  const defs = KIND_FIELDS[it.kind] || [], d = it.details || {};
  return { total: defs.length, filled: defs.filter(f => String(d[f.k] ?? '').trim() !== '').length };
}
function detailRows(it){
  const defs = KIND_FIELDS[it.kind] || [], d = it.details || {};
  if(!defs.length) return `<div class="field col-span"><div class="infoline"><span>Для вида «${esc(it.kind)}» детальные поля схемой не заданы.</span></div></div>`;
  const rows = defs.map(f => {
    const v = String(d[f.k] ?? '').trim();
    return v ? ro(f.l, v)
      : `<div class="field"><span class="flabel">${esc(f.l)}${f.req?' <span class="req-mark">*</span>':''}</span>
          <div class="control ro ro-empty"><input value="не заполнено" readonly></div></div>`;
  });
  const { total, filled } = detailFillCount(it);
  const note = filled === 0
    ? `<div class="field col-span"><div class="infoline"><span>Ни одно поле вида не заполнено — запись перенесена из прежней системы (краткий идентификатор «${esc(it.ident||'—')}»).</span></div></div>`
    : '';
  return rows.join('') + note + (filled < total && filled > 0
    ? `<div class="field col-span"><div class="formula" style="margin:0">Незаполненные графы — фактография, а не гейт: в допуск и дефекты предмета они не поднимаются.</div></div>` : '');
}
/* ВЛОЖЕНИЯ (сканы): правоуст. документ, отчёт оценщика, акты обследования, согласия. */
/* Р-56: типы вложений совпадают с типами обязательного комплекта (FILE_REQ_*) — иначе
   приложенный «Отчёт оценщика» не закрывает требование «Отчёт об оценке», и досье
   вечно показывает пробел при фактически приложенном документе. */
const FILE_TAGS = [...new Set(FILE_REQ_COMMON.concat(...Object.values(FILE_REQ_BY_KIND)).map(r => r.t))]
  .concat(['Акт обследования','Согласие / решение органа','Договор / доп. соглашение','Иное']);
function fileTable(files){
  const fs = files || [];
  return `<div class="cgrid-wrap"><table class="cgrid">
    <thead><tr><th>Тип документа</th><th>Файл</th><th>№ документа</th><th>Дата документа</th><th>Прикреплён</th><th>Кто прикрепил</th></tr></thead>
    <tbody>${fs.length ? fs.map(f=>`<tr><td>${esc(f.tag)}</td><td>${esc(f.name)}</td><td>${esc(f.docNo||'—')}</td><td>${f.docDate||'—'}</td><td>${f.when}</td><td>${esc(f.who)}</td></tr>`).join('')
      : `<tr><td colspan="6"><div class="cgrid-empty">Файлы не прикреплены</div></td></tr>`}</tbody>
  </table></div>`;
}
function openAttach(scope, id){
  if(!canCurate()) return denyEdit();
  const h = scope==='item' ? item(id) : contract(id);
  /* Предзаполняем тип первым НЕДОСТАЮЩИМ документом комплекта — оформитель чаще всего
     закрывает именно пробел, а не докладывает лишнее. */
  const miss = (scope==='item' && h) ? itemDossier(h).missing[0] : null;
  modal(`<div class="modal form">${mhead('Прикрепить файл')}
    <div class="modal-b"><div class="mform">
      ${fsel('atTag','Тип документа', FILE_TAGS, miss || FILE_TAGS[0], true)}
      ${fin('atName','Имя файла','', true, true)}
      ${fin('atNo','№ документа','')}
      ${/* Р-56: срок годности документа (оценка, полис) считается от ДАТЫ ДОКУМЕНТА, а не
           от даты загрузки скана — иначе просроченный полис «омолаживается» перезаливкой. */''}
      ${fdate('atDate','Дата документа', TODAY)}
    </div>
    ${miss ? `<div class="warn-inline"><span>В комплекте не хватает: <b>${esc(miss)}</b> — тип подставлен автоматически.</span></div>` : ''}
    </div>${mfoot('Прикрепить','saveAttach(\''+scope+'\',\''+id+'\')')}</div>`);
}
function saveAttach(scope, id){
  const tag = val('atTag'), name = val('atName').trim(), docNo = val('atNo').trim(), docDate = iso2d(val('atDate'));
  if(!name) return toast('Укажите имя файла','warn');
  if(docDate && !isDate(docDate)) return toast('Дата документа — в формате дд.мм.гггг','warn');
  if(docDate && d2n(docDate) > d2n(TODAY)) return toast('Дата документа не может быть в будущем','warn');
  const h = scope==='item' ? item(id) : contract(id);
  if(!h) return;
  (h.files ||= []).push({ tag, name, docNo, docDate, when: TODAY, who: role });
  hist(h, `Прикреплён файл «${name}» (${tag}${docNo?', № '+docNo:''}${docDate?' от '+docDate:''})`, 'doc');
  closeModal(); toast('Файл прикреплён','ok'); refresh();
}

/* ---- КП-8: ОТКРЕПЛЕНИЕ И ПРАВКА РЕКВИЗИТОВ ФАЙЛА. До волны КП единственным действием
   было «Прикрепить»: колонки действий не было ни в комплекте, ни в дополнительных
   вложениях. Перевыпуск работал сам собой (берётся последний по дате), а вот ошибка —
   нет: неверный тип, чужой скан, опечатка в дате документа жили вечно и могли молча
   закрыть требование комплекта. Открепление — пометка с основанием, не удаление. ---- */
function fileHost(scope, id){ return scope==='item' ? item(id) : contract(id); }
function openDetachFile(scope, id, i){
  if(!canCurate()) return denyEdit();
  const h = fileHost(scope, id), f = (h.files || [])[i];
  if(!f || f.detached) return toast('Файл не найден или уже откреплён','warn');
  modal(`<div class="modal form">${mhead('Открепление файла · '+id)}
    <div class="modal-b"><div class="mform">
      ${ro('Файл', `${f.name} (${f.tag}${f.docNo?', № '+f.docNo:''}${f.docDate?' от '+f.docDate:''})`)}
      <div class="field req col-span"><span class="flabel">Основание открепления</span>
        <textarea id="dfReason" class="note-area"></textarea></div>
    </div>
    <div class="warn-inline"><span>Файл не удаляется — помечается откреплённым и перестаёт закрывать требование комплекта. Если это единственный документ своего типа, комплект станет неполным и регистрация договора будет заблокирована.</span></div>
    </div><div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-tint danger" onclick="saveDetachFile('${scope}','${id}',${i})">Открепить</button></div></div>`);
}
function saveDetachFile(scope, id, i){
  if(!canCurate()) return denyEdit();
  const h = fileHost(scope, id), f = (h.files || [])[i], reason = val('dfReason').trim();
  if(!f || f.detached) return toast('Файл не найден или уже откреплён','warn');
  if(!reason) return toast('Укажите основание открепления','warn');
  f.detached = { by: role, date: TODAY, reason };
  hist(h, `Откреплён файл «${f.name}» (${f.tag}): «${reason}»`, 'doc');
  closeModal(); toast('Файл откреплён','ok'); refresh();
}
function openEditFile(scope, id, i){
  if(!canCurate()) return denyEdit();
  const h = fileHost(scope, id), f = (h.files || [])[i];
  if(!f || f.detached) return toast('Файл не найден или откреплён','warn');
  modal(`<div class="modal form">${mhead('Исправление реквизитов файла · '+id)}
    <div class="modal-b"><div class="mform">
      ${fsel('efTag','Тип документа', FILE_TAGS, f.tag, true)}
      ${fin('efName','Имя файла', f.name, true, true)}
      ${fin('efNo','№ документа', f.docNo || '')}
      ${fdate('efDate','Дата документа', f.docDate || f.when)}
      <div class="field req col-span"><span class="flabel">Основание исправления</span>
        <textarea id="efReason" class="note-area"></textarea></div>
    </div>
    <div class="infoline"><span>Срок годности документа считается от <b>даты документа</b>, а не от даты загрузки скана — правка даты сразу меняет статус строки комплекта.</span></div>
    </div>${mfoot('Сохранить исправление','saveEditFile(\''+scope+'\',\''+id+'\','+i+')')}</div>`);
}
function saveEditFile(scope, id, i){
  if(!canCurate()) return denyEdit();
  const h = fileHost(scope, id), f = (h.files || [])[i], reason = val('efReason').trim();
  if(!f || f.detached) return toast('Файл не найден или откреплён','warn');
  if(!reason) return toast('Укажите основание исправления','warn');
  const tag = val('efTag'), name = val('efName').trim(), docNo = val('efNo').trim(), docDate = iso2d(val('efDate'));
  if(!name) return toast('Имя файла не может быть пустым','warn');
  if(docDate && !isDate(docDate)) return toast('Дата документа — в формате дд.мм.гггг','warn');
  if(docDate && d2n(docDate) > d2n(TODAY)) return toast('Дата документа не может быть в будущем','warn');
  const diffs = fieldDiffs([
    {label:'тип', before:f.tag, after:tag},
    {label:'имя файла', before:f.name, after:name},
    {label:'№ документа', before:f.docNo, after:docNo},
    {label:'дата документа', before:f.docDate, after:docDate},
  ]);
  if(!diffs.length) return toast('Реквизиты не изменились','warn');
  Object.assign(f, { tag, name, docNo, docDate });
  hist(h, `Исправлены реквизиты файла: ${diffs.join('; ')}. Основание: «${reason}»`, 'doc');
  closeModal(); toast('Реквизиты файла исправлены','ok'); refresh();
}

/* ---- КП-4 (ADR 0008): журнал предшествующих залогов третьих лиц УДАЛЁН вместе с формой
   ввода, снятием и чтением (openPriorLien / savePriorLien / releasePriorLien / priorLiensOf).
   Спека противоречила сама себе: §4.1 объявлял, что Холдинг всегда единственный и
   первоочередной залогодержатель, а чужие внешние залоги не принимаются и реестр внешних
   обременений НЕ вводится, — а Р-49 вводил ровно этот реестр. Победил §4.1.
   Следствие: обременение в пользу третьего лица — не предупреждение оформителю с журналом
   очерёдности, а СТОП-ФАКТОР ПРИЁМА (stopListCheck.thirdPartyLien). Чужой залог, возникший
   ПОСЛЕ нашей регистрации, — младший, и модулю безразличен: очерёдность у нас всегда первая,
   поэтому и вести её нечем. ---- */

/* Р-53: ДЕФЕКТ-СТРОКА вместо стопки баннеров. Раньше шапка могла выдать до семи баннеров
   подряд — KPI уезжали за экран, а приоритет дефектов терялся. Теперь: одна компактная строка
   со всеми дефектами (каждый — ссылка на вкладку, где он лечится) + ОДИН развёрнутый баннер
   самого тяжёлого дефекта, где нужен полный регламентный текст. Источник дефектов — тот же
   admissionChecks, что и плашка допуска: два представления одних данных, не два списка.
   tab === null — дефект лечится не в карточке предмета (предпосылки §5.2 живут агрегатом
   на договоре), такой дефект показываем без клика, а не ведём в случайную вкладку. */
function itemDefects(it){
  const out = admissionChecks(it).filter(c => c.sev !== 'ok')
    .map(c => ({ sev:c.sev, text:c.name + ': ' + c.result, tab:c.tab, basis:c.basis }));
  if(it.orphan && !itemHasAlloc(it.id))
    out.push({ sev:'stop', text:'Не привязан ни к одному договору', tab:4, basis:'предмет создан на карточке договора, привязка не завершена' });
  if(it.needReval)
    out.push({ sev:'warn', text:'Требуется досрочная переоценка', tab:1, basis:'обследование зафиксировало ухудшение состояния' });
  if(it.legacy)
    out.push({ sev:'warn', text:'Историческая запись прежней системы', tab:1, basis:'залоговая выше расчётной по нормам прежней системы — нужна переоценка по ПОЛ §2.1' });
  if(it.realizing)
    out.push({ sev:'warn', text:'Передан в реализацию (взыскание)', tab:4, basis:'статусом управляет модуль взыскания' });
  return out;
}
function defectBar(it){
  const d = itemDefects(it);
  if(!d.length) return `<div class="defect-bar ok"><span class="dl">Дефектов нет</span>
    <span class="muted">допуск подтверждён, запрет и плановый контроль в норме, комплект документов собран</span></div>`;
  return `<div class="defect-bar"><span class="dl">Дефекты предмета</span>
    ${d.map(x => x.tab == null
      ? `<span class="pill ${x.sev==='stop'?'high':'mid'}" title="${esc(x.basis||'')}">${esc(x.text)}</span>`
      : `<span class="pill ${x.sev==='stop'?'high':'mid'}" style="cursor:pointer" title="${esc(x.basis||'')}"
      onclick="openCard('item','${it.id}',${x.tab})">${esc(x.text)}</span>`).join('')}
    <span class="muted">— клик по дефекту открывает вкладку, где он устраняется</span></div>`;
}
/* Развёрнутым остаётся ОДИН баннер — самый тяжёлый по приоритету; остальные дефекты видны
   строкой выше, с основанием в title. */
function topBanner(it){
  const B = (cls, body, icon) => `<div class="phead-banner ${cls}">${icon||''}<span>${body}</span></div>`;
  const warnIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>`;
  /* КП-5: аннулирование — терминальное состояние, перекрывает любой другой баннер. */
  if(it.cancelled) return B('danger',
    `Предмет аннулирован ${it.cancelled.date}: ${esc(it.cancelled.reason)}. «${esc(it.cancelled.note)}» · ${esc(it.cancelled.by)}. Запись сохранена для истории, в реестре, подборе обеспечения и расчётах не участвует.`, warnIcon);
  /* КП-6: источник утраты — акт обследования либо внешний документ. */
  if(it.lost) return B('danger', it.lostBy
    ? `Предмет утрачен: ${esc(it.lostBy.ground)} ${esc(it.lostBy.doc)} от ${it.lostBy.date} — стоимость исключена из покрытия (залоговая = 0). «${esc(it.lostBy.note)}»`
    : 'Предмет утрачен по акту обследования — стоимость исключена из покрытия (залоговая = 0).', warnIcon);
  if(banMissing(it)) return B('danger',
    `Залог не защищён от продажи: договор(ы) ${banContracts(it).join(', ')} зарегистрированы, но запрет на отчуждение в «${esc(organOf(it))}» не наложен. Залогодатель может продать предмет без нашего ведома. Срок наложения: до ${banDeadline(it)}${banOverdue(it) ? ` — ПРОСРОЧЕН на ${Math.abs(daysLeft(banDeadline(it)))} дн.` : ''}.`, warnIcon);
  if(it.orphan && !itemHasAlloc(it.id)) return B('warn','Предмет создан на карточке договора, но привязка не была завершена — он ни в одном залоговом договоре. Привяжите его к договору или аннулируйте.', warnIcon);
  if(banStale(it)) return B('warn',
    `Доли по предмету обнулились, а запрет ${esc(it.ban.regNo)} от ${it.ban.date} продолжает действовать в «${esc(organOf(it))}». Имущество клиента заблокировано без правового основания — требуется снятие запрета отдельным актом.`);
  if(it.ban && !banFullyRegistered(it.ban)) return B('warn',
    `Запрет ${esc(it.ban.regNo)} от ${it.ban.date} наложен залогодателем в «${esc(organOf(it))}», но отметка о запрете в оригиналах правоустанавливающих документов ещё не получена (ПБК п.2.1).`);
  if(it.realizing) return B('info','Предмет передан в реализацию (обращение взыскания). Статусом управляет модуль взыскания — из залогового модуля не переключается.');
  if(it.ban) return B('ok',
    `Запрет на отчуждение наложен залогодателем: ${esc(organOf(it))} · ${esc(it.ban.regNo)} от ${it.ban.date}. Отметка получена в оригиналах правоустанавливающих документов. Предмет не может быть продан без нашего ведома.`,

  return '';
}

/* ---- КП-12 ЕДИНАЯ ЛЕНТА СОБЫТИЙ СТОИМОСТИ (развитие Р-54).
   Залоговую стоимость двигают ДВА вида событий: переоценка (меняет оценочную, залоговая
   пересчитывается коэффициентом) и решение заведующего отделом (перекрывает расчётную,
   ПОЛ §2.1). До волны КП они лежали в двух несвязанных местах — журнал переоценок и
   одиночный слот override, — и восстановить, какая залоговая действовала на конкретную
   дату, было нельзя. valueEvents сшивает обе серии в одну хронологию (новые сверху).

   КП-Д4: `coef` берётся ИЗ ЗАПИСИ, а не из справочника. Столбец «Залоговая (расч.)»
   считался сегодняшним coefOf(kind), а коэффициент правится из справочника (KINDS[k].k) —
   поменяли его, и весь исторический столбец у всех предметов переписывался задним числом.
   Записи, заведённые до волны КП, получают коэффициент при нормализации. ---- */
function valueEvents(it){
  const revals = (it.revals || []).map((r,idx) => ({
    kind:'reval', idx, date:r.date, voided:r.voided || null,
    appraised:r.appraised, coef: r.coef ?? coefOf(it.kind),
    pledge: Math.round(r.appraised * (r.coef ?? coefOf(it.kind)) * 100)/100,
    basis: r.report, who: r.appraiser || '', license: r.license || '', note: r.note || '' }));
  const overs = (it.overrides || []).map((o,idx) => ({
    kind:'override', idx, date:o.date, voided:o.voided || null,
    appraised:null, coef:null, pledge:o.value,
    basis: o.doc || 'решение заведующего отделом', who: o.by || '', license:'', note: o.obosn || '' }));
  return [...revals, ...overs].sort((a,b) => (d2n(b.date) - d2n(a.date)) || (a.kind === 'reval' ? 1 : -1));
}
/* Хронология действующих (несторнированных) значений ЗАЛОГОВОЙ стоимости — то, что реально
   входит в покрытие. Р-54 строил спарклайн по ОЦЕНОЧНОЙ, из-за чего понижение решением
   заведующего на графике не отражалось вовсе. Оценочная осталась второй, приглушённой линией. */
function valueSeries(it){
  const ev = valueEvents(it).filter(e => !e.voided).slice().reverse();   // хронология вперёд
  let appraised = null, pledge = null;
  return ev.map(e => {
    if(e.kind === 'reval'){ appraised = e.appraised; pledge = e.pledge; }
    else pledge = e.pledge;
    return { date:e.date, pledge, appraised };
  });
}
function valueSpark(it){
  const s = valueSeries(it), W = 260, H = 44;
  if(s.length < 2) return `<div class="formula" style="margin:0">Одно событие стоимости — динамики ещё нет.</div>`;
  const pv = s.map(p => p.pledge), av = s.map(p => p.appraised);
  const all = pv.concat(av.filter(v => v != null));
  const mn = Math.min(...all), mx = Math.max(...all), sp = (mx - mn) || 1;
  const x = i => i / (s.length - 1) * W;
  const y = v => H - (v - mn) / sp * H;
  const path = vals => vals.map((v,i) => v == null ? null : (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1))
    .filter(Boolean).join(' ').replace(/(?<!^)M/g, 'L');
  const first = pv[0], last = pv[pv.length-1];
  const p = first ? Math.round((last - first) / first * 1000) / 10 : 0;
  const up = last >= first, col = up ? 'var(--asubk-green)' : 'var(--asubk-red)';
  const dots = s.map((q,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(q.pledge).toFixed(1)}" r="3" fill="${col}"><title>${q.date} — залоговая ${fmt(q.pledge)}${q.appraised!=null?', оценочная '+fmt(q.appraised):''}</title></circle>`).join('');
  return `<div class="spark-wrap">
    <svg class="spark" width="${W}" height="${H+8}" viewBox="0 -4 ${W} ${H+8}" preserveAspectRatio="none">
      <path d="${path(av)}" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>
      <path d="${path(pv)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
    <div class="formula" style="margin:0">${s[0].date} → ${s[s.length-1].date} ·
      залоговая ${fmt(first)} → ${fmt(last)} · <b style="color:${col}">${up?'+':''}${String(p).replace('.',',')} %</b>
      · событий: ${s.length} · пунктиром — оценочная</div></div>`;
}

   записей переставала читаться — отсюда чипы. Но категория УГАДЫВАЛАСЬ регуляркой по

   список меток, а категория живёт полем записи. Добавлена 'lc' («Жизненный цикл») под

const histCat = h => (h && h.cat) || 'oth';
let histFilter = 'all', histLimit = 20;
function itemHistFilter(k){ histFilter = k; histLimit = 20; refresh(); }

/* КП-Д11: раскрытие подстроки акта обследования хранилось ТОЛЬКО в DOM (style.display),
   и любой refresh() — приложил файл, сторнировал запись, сменил роль — схлопывал её обратно.
   Состояние представления живёт в openSubRows и переживает перерисовку; при переходе на

        <td>${(!e.voided && canHeadOfUnit()) ? `<button class="btn btn-tint btn-sm danger" onclick="openVoidRecord('${it.id}','${e.kind==='reval'?'reval':'override'}',${e.idx})">Сторнировать</button>` : ''}</td></tr>`;}).join('')

  const canPlace = banRequired(it) && !it.ban;          // есть основание, запрета ещё нет
  const canRelease = Boolean(it.ban) && allocatedLegal(it.id) === 0;  // доли обнулились
  const consentsRows = (it.consents||[]).map((cn,i)=>`<tr${cn.voided?' class="voided-row"':''}>
    <td${cn.voided?' style="text-decoration:line-through">':'>'}${esc(cn.action)}</td>
    <td${cn.voided?' style="text-decoration:line-through">':'>'}${cn.date}</td>

      ${(it.consents&&it.consents.length) ? `<p class="section-h" style="font-size:16px;margin-top:18px">Согласия на действия (запрет сохраняется в силе)</p>

  /* КП-9/КП-Д3: ПРИОРИТЕТ — СВОЙСТВО ДОГОВОРА, А НЕ СТРОКИ. Ячейка печатала `i+1` — индекс

  const csAll = CONTRACTS.filter(c => (isActive(c)||isDraftish(c)) && c.allocs.some(a=>a.item===it.id));

  /* ---- Р-56 ДОСЬЕ ДОКУМЕНТОВ. Раньше вкладка «Документы» показывала гейты, а сами файлы
