const activeSuretiesOfCredit = creditId => suretiesOfCredit(creditId).filter(s=>s.status==='действует');

/* Возраст на дату (Г1). Единый парсер дат — d2n (как везде в файле). */
function ageAt(birth, at){
  const b = d2n(birth), a = d2n(at);
  if(!birth || !at || isNaN(b) || isNaN(a)) return null;
  let age = a.getFullYear() - b.getFullYear();
  const m = a.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && a.getDate() < b.getDate())) age--;
  return age;
}
const spouseConsentFilled = sc => Boolean(sc && sc.notary && sc.regNo && sc.date);
const notaryFilled        = n  => Boolean(n && n.name && n.regNo && n.date);

/* ГЕЙТ ДОПУСКА §9.1/§9.2 (Р-26) → { ok, fails:[{code,text}] }. Тип лица поручителя
   переключает применимость: для юрлица Г1/Г2/Г4 неприменимы, действуют Г3/Г5.
   Пройденный гейт (ok) — жёсткое условие перевода «черновик → действует» (§14.4). */
function guarantorGate(dpId){
  const s = surety(dpId); if(!s) return { ok:false, fails:[{ code:'—', text:'Договор поручительства не найден' }] };
  const g = guarantor(s.guarantor); if(!g) return { ok:false, fails:[{ code:'—', text:'Поручитель не найден' }] };
  const person = guarantorIsPerson(g), fails = [];
  if(person){
    const age = ageAt(g.birthDate, s.date);
    if(age === null || age < 18 || age > 70)
      fails.push({ code:'Г1', text:`Поручитель вне возрастного диапазона §9.1 (18–70 лет): ${age === null ? 'дата рождения не указана' : age + ' лет на дату договора'}` });
    if(!(g.incomeStable && g.incomeDoc))
      fails.push({ code:'Г2', text:'Не подтверждён стабильный ежемесячный доход §9.1 (нужен документ-подтверждение)' });
  }
  if(!(!g.overdueGFH && !g.overdueExternal))
    fails.push({ code:'Г3', text:`Есть просроченная задолженность §9.1${g.overdueGFH ? ' (перед ГФХ)' : ''}${g.overdueExternal ? ' (перед иными ФКУ)' : ''}` });
  if(person && g.married && !spouseConsentFilled(g.spouseConsent))
    fails.push({ code:'Г4', text:'Нет нотариально удостоверенного согласия супруга(и) §9.2' });
  if(!notaryFilled(s.notary))
    fails.push({ code:'Г5', text:'Договор поручительства не удостоверён нотариально §9.2 (нет реквизитов)' });
  return { ok: fails.length === 0, fails };
}

/* ЖЦ договора поручительства (§14.4). Статусы объявлены в перечне; «предъявлено» —
   hook под будущую связку со взысканием (Решение 4 отложено, §14.7), механики нет. */
const SURETY_STATUSES = ['черновик','действует','снято','предъявлено'];
/* И-14.3 (Прил.7 п.4.2): снятие договора допускается ТОЛЬКО при полном погашении
   обеспечиваемого кредита. Досрочное снятие при непогашенном кредите запрещено. */
const suretyReleaseAllowed = dpId => { const s = surety(dpId); return Boolean(s) && (credit(s.credit)||{}).status === 'Погашен'; };

/* ============================================================
   ВЫЧИСЛЯЕМЫЙ СЛОЙ — здесь живёт ВСЯ арифметика залога.
   Ничего из этого не хранится в данных: залоговая, отнесено, доступно,
   покрытие, статус предмета, просрочка контроля, триггеры — производные.
   ============================================================ */
/* coefOf определён выше, рядом с KINDS — normalizeItem нуждается в нём до этого блока. */
const calcPledge  = it => Math.round(it.appraised * coefOf(it.kind) * 100)/100;   // расчётная залоговая
/* КП-11: действующее понижение = ПОСЛЕДНЕЕ несторнированное решение журнала overrides[].
   Нет журнала или все записи сторнированы → залоговая снова расчётная. */
const livesOverride  = it => (it.overrides || []).filter(o => !o.voided);
const activeOverride = it => { const l = livesOverride(it); return l.length ? l[l.length-1] : null; };
const pledgeValue = it => { if(it.lost) return 0; const o = activeOverride(it); return o ? o.value : calcPledge(it); };
const isOverAbove = it => { const o = activeOverride(it); return Boolean(o) && o.value > calcPledge(it); }; // понижение ВЫШЕ расчётной → флаг legacy
/* КП-5: аннулированная запись не участвует ни в одной арифметике и ни в одном подборе. */
const isCancelled = it => Boolean(it && it.cancelled);

const ACTIVE = 'Зарегистрирован';
const CANCELLED = 'Аннулирован';                                    // Р-31: аннулированный черновик
const isActive  = c => c.status === ACTIVE;
const isDraftish = c => c.status === 'Оформляется' || c.status === 'На рассмотрении комиссии';

/* Р-19 (ПОЛ §2.1): override залоговой стоимости допустим ТОЛЬКО вниз — залоговая не может
   превышать расчётную (оценочная × коэффициент риска и спроса). Подъём выше расчётной больше
   недопустим ни для одной роли (см. openOverride/saveOverride); существующие «выше расчётной»
   записи (П-005) — legacy прежней системы, isOverAbove их только ОТОБРАЖАЕТ. */
function overrideAllowed(it, value){
  const calc = calcPledge(it);
  if (value > calc) return { ok:false, msg:'Залоговая стоимость не может превышать оценочную × коэффициент риска и спроса (ПОЛ §2.1). Возможно только дополнительное понижение.' };
  return { ok:true };
}

/* Р-19 (ПОЛ §11.1–11.2): маршрут кредитно-залоговых документов незавершён, когда договор
   зарегистрирован, маршрут задан, но архивный (последний) шаг ещё не датирован, а с даты
   регистрации договора прошло больше `days` дней. Нет docRoute/date у договора — не
   триггерим (fail-safe: молчим, а не ложно срабатываем на старых сидовых записях). */
function docRouteIncomplete(contract, days){
  if (!contract || contract.status !== ACTIVE || !contract.date) return false;
  const route = contract.docRoute;
  if (!Array.isArray(route) || !route.length) return false;
  const last = route[route.length - 1];
  if (last && last.date) return false;   // маршрут дошёл до архива — завершён
  return daysLeft(contract.date) <= -days;
}

/* Контекст расчёта: действующие договоры + (опционально) один виртуальный
   (проверяемый черновик либо договор с применённым пакетом доп соглашения). */
function ctx(virtual){
  const base = CONTRACTS.filter(c => isActive(c) && (!virtual || c.id !== virtual.id));
  return virtual ? [...base, virtual] : base;
}
/* Отнесено по предмету внутри контекста. */
const allocatedIn = (cs, itemId) =>
  cs.reduce((s,c)=> s + c.allocs.filter(a=>a.item===itemId).reduce((t,a)=>t+a.share,0), 0);

/* Юридически обременено (действующие) + предварительно занято черновиками —
   чтобы одну и ту же стоимость не пообещали дважды ещё на этапе оформления. */
const allocatedLegal = itemId => allocatedIn(CONTRACTS.filter(isActive), itemId);
const allocatedDraft = itemId => allocatedIn(CONTRACTS.filter(isDraftish), itemId);
const availableOf    = it => Math.max(0, pledgeValue(it) - allocatedLegal(it.id) - allocatedDraft(it.id));

/* ЭФФЕКТИВНАЯ ДОЛЯ. Юридическая доля в нотариальном договоре статична и от платежей
   не усыхает (§4.2). Но если переоценка уронила залоговую ниже суммы закреплённых
   долей — покрытие не может опираться на несуществующую стоимость: доли усекаются
   ПРОПОРЦИОНАЛЬНО. Договор при этом не правится; падение покрытия поднимает триггер.

   ОТКУДА БЕРЁТСЯ ПЕРЕВЫДЕЛЕНИЕ (Σ долей > залоговой стоимости), раз ввод его запрещает.
   На вводе доли инвариант жёсткий: saveAlloc не даёт превысить availableOf(). Поэтому
   перевыделение — это НЕ ошибка оператора, а состояние, в которое запись попадает ПОСЛЕ
   ввода: залоговая стоимость упала (переоценка вниз, override заведующего только вниз —
   Р-19, утрата части предмета), а уже закреплённые доли остались прежними. Урезание здесь
   — арифметика покрытия, а не правка договора: юридически доля прежняя, но кредит считает
   индекс от реально существующей стоимости. Само перевыделение при этом не молчит — его
   поднимает admissionChecks ⑫ «Инвариант долей» (sev 'stop') и заваливает гейт покрытия
   при регистрации. Сид кладёт такое состояние напрямую (мимо saveAlloc) на П-044/Д-041 и
   П-052/Д-042 — намеренная демонстрация этой ветки, см. пометки в сиде. */
function effShare(cs, itemId, share){
  const it = item(itemId); if(!it || it.lost) return 0;
  const pv = pledgeValue(it), tot = allocatedIn(cs, itemId);
  return tot <= pv ? share : share * (pv / tot);
}
/* ПОРОГ ПОКРЫТИЯ ЗАЛОГОМ — ФУНКЦИЯ состава обеспечения кредита (Р-1, Прил.1 §2.3–2.4), не
   константа. Если в покрытие входит хоть один движимый неликвидный предмет → 150%, иначе →
   120%. Порог банковской гарантии (100/120% по валюте) — отдельная функция guaranteeReq()
   ниже; обе величины комбинируются в coverage().index (Р-11). */
function creditItems(cs, creditId){
  const ids = new Set();
  cs.forEach(c => c.allocs.filter(a=>a.credit===creditId).forEach(a=>ids.add(a.item)));
  return [...ids].map(item);
}
function requiredCover(creditId, cs){
  const cr = credit(creditId);
  if (cr && cr.kmDecision) return { req: cr.kmDecision.coverPct/100,
    source: 'решение КМ ' + cr.kmDecision.no + ' от ' + cr.kmDecision.date + ' (Прил.1 §2.6)' };
  const hasMovableIlliquid = creditItems(cs, creditId).some(it => isMovable(it) && !isLiquid(it));
  return hasMovableIlliquid
    ? { req: COVER_MOVABLE, source: 'Прил.1 §2.4 (движимый неликвидный залог)' }
    : { req: COVER_LIQUID,  source: 'Прил.1 §2.3 (ликвидный залог)' };
}
/* Доля ЛИКВИДНОГО залога в сумме кредита (Р-1 п.3). Применяется только когда порог = 150%
   (в покрытии есть движимый неликвидный предмет): тогда доля ликвида должна быть ≥ 80%. */
const liquidShareApplies = (creditId, cs) => requiredCover(creditId, cs).req === COVER_MOVABLE;
function liquidShare(creditId, cs){
  const cr = credit(creditId);
  const liq = cs.reduce((s,c)=> s + c.allocs.filter(a=>a.credit===creditId)
                 .reduce((t,a)=> t + (isLiquid(item(a.item)) ? effShare(cs, a.item, a.share) : 0), 0), 0);
  return cr.amount ? liq/cr.amount : 1;
}
/* БАНКОВСКАЯ ГАРАНТИЯ (§9–10, Прил.1 §2.3, Р-11). Порог зависит от валюты гарантии
   относительно валюты кредита: та же валюта → 100%, иная → 120% (курсовой запас).
   Отсутствие currency на кредите/гарантии трактуется как 'KGS'. Не банковская гарантия
   (напр. поручительство) либо отсутствие otherSecurity → null (в индекс не входит). */
function guaranteeReq(cr){
  const g = cr && cr.otherSecurity;
  if(!g || g.type !== 'банковская гарантия') return null;
  const cc = cr.currency || 'KGS', gc = g.currency || 'KGS';
  return gc === cc ? COVER_GUARANTEE : COVER_GUARANTEE_FX;
}
/* Гарантия истекла — сравнение till с TODAY (мокап-дата, см. d2n/TODAY выше).
   Гарантия без till (не заполнена) не считается истёкшей. */
function guaranteeExpired(g){
  return g && g.till ? d2n(g.till) < d2n(TODAY) : false;
}
/* ВАЛЮТА — КП-14 (ADR 0009), ревизия Р-44 (развилка В-2, вариант А, 2026-07-23).
   Р-44 сделал валюту предмета ПРОИЗВОДНОЙ от валют обеспечиваемых кредитов. Это давало
   ровно то, что нужно расчёту (индекс sum/(cr.amount×req) в одной валюте, курсы не нужны),
   но ломало смысл самого числа: оценщик оценивает вещь в конкретной валюте ДО всякого
   кредита, а привязка к долларовому кредиту молча переподписывала те же 5 000 000 как
   доллары. Плюс при нескольких валютах бралась ПЕРВАЯ из Set — недетерминированно (КП-Д6).
   Теперь валюта — реквизит вещи: вводится при приёме, фиксируется в записи переоценки.
   Валютный инвариант привязки (saveAlloc) сохраняется и усиливается: валюта кредита должна
   совпасть с валютой предмета. Пересчёт по курсу по-прежнему ВНЕ модуля. */
const creditCcy = cr => (cr && cr.currency) || 'KGS';
const ccyLabel  = ccy => ccy === 'KGS' ? 'сом' : ccy;
const itemCcy      = it => (it && it.ccy) || 'KGS';
const itemCcyLabel = it => ccyLabel(itemCcy(it));
/* Валюты кредитов, которые предмет обеспечивает, отличные от валюты его оценки.
   Пустой список — расхождения нет. Служит и подписью на «Основном», и проверкой допуска. */
function ccyMismatches(it){
  const out = new Set();
  CONTRACTS.filter(c => isActive(c) || isDraftish(c)).forEach(c =>
    c.allocs.filter(a => a.item === it.id).forEach(a => {
      const cr = credit(a.credit); if(cr && creditCcy(cr) !== itemCcy(it)) out.add(creditCcy(cr)); }));
  return [...out];
}
const ccyMismatchNote = it => { const m = ccyMismatches(it);
  return m.length ? ` — <span class="pill high">кредиты в ${m.map(ccyLabel).join(', ')}</span>` : ''; };
/* Покрытие кредита = ИНДЕКС обеспеченности (Р-11, §9–10, Прил.1 §2.3–2.4):
     index = idxPledge (Σ эффективных отнесённых долей залога ÷ (сумма кредита × её порог))
           + idxGuar   (сумма действующей банковской гарантии ÷ (сумма кредита × её порог)).
   Обеспечен, когда index ≥ 1 И (если применим) доля ликвида в залоговой части ≥ 80%
   (liqOk — подпункт того же гейта, не новый статус). Просроченная гарантия (till < TODAY)
   в idxGuar не участвует (guaranteeExpired). Поручительство в индекс НЕ входит — остаётся
   справочным полем `other` на карточке. */
function coverage(cs, creditId){
  const cr = credit(creditId);
  const other = creditOther(creditId);
  const sum = cs.reduce((s,c)=> s + c.allocs.filter(a=>a.credit===creditId)
                 .reduce((t,a)=> t + effShare(cs, a.item, a.share), 0), 0);
  const { req, source } = requiredCover(creditId, cs);
  const ratio = cr.amount ? sum/cr.amount : 0;
  const covOk = cr.amount ? ratio >= req : true;
  const liqApplies = liquidShareApplies(creditId, cs);
  const liqShare = liqApplies ? liquidShare(creditId, cs) : null;
  const liqOk = liqApplies ? liqShare >= LIQUID_SHARE_MIN - 1e-9 : true;
  const secPledge = sum;
  const idxPledge = cr.amount ? secPledge / (cr.amount * req) : 0;
  let idxGuar = 0, gReq = null;
  if (other && other.type === 'банковская гарантия' && !guaranteeExpired(other)) {
    gReq = guaranteeReq(cr);
    idxGuar = cr.amount ? (other.amount || 0) / (cr.amount * gReq) : 0;
  }
  const index = idxPledge + idxGuar;
  return { sum, amount: cr.amount, ratio, req, source, covOk, liqOk, liqApplies, liqShare, other,
           secPledge, idxPledge, idxGuar, gReq, index,
           ok: (index >= 1) && liqOk };
}
/* ГЕЙТ §2.6 (Р-13, Прил.1 §2.6): заёмщик под категорией, чья обеспеченность устанавливается
   решением Кабинета Министров, — регистрация ЗАБЛОКИРОВАНА, пока решение не внесено на
   кредит (borrowerCategory задана, kmDecision — нет). Как только kmDecision внесено, гейт
   снят; requiredCover() выше уже читает kmDecision.coverPct для самого расчёта порога —
   этот предикат отвечает только за допуск к регистрации, не дублирует ту арифметику. */
function kmGateBlocked(cr){ return Boolean(cr.borrowerCategory) && !cr.kmDecision; }
/* ГЕЙТ покрытия — один код на два места: регистрация договора и регистрация доп соглашения.
   Порог у каждого кредита свой (requiredCover); доля ликвида — подпункт того же гейта. */
function gateCheck(virtual){
  const cs = ctx(virtual);
  const rows = virtual.credits.map(id => ({ id, ...coverage(cs, id) }));
  return { rows, ok: rows.every(r=>r.ok) };
}
/* ГЕЙТ СОДЕРЖАНИЯ (Р-28, В-1=А): залоговый договор не регистрируется без предметов.
   coverage(cs, creditId) считает обеспеченность КРЕДИТА по всем действующим договорам,
   поэтому пустой договор наследует чужое покрытие и проходит гейт покрытия. Отдельный
   гейт содержания требует ≥1 отнесения с долей > 0 в самом договоре. Кредит, обеспеченный
   ТОЛЬКО банковской гарантией, залогового договора не имеет вовсе — гарантия живёт на
   кредите (otherSecurity), не на договоре. */
function contentGate(c){
  const ok = Array.isArray(c.allocs) && c.allocs.some(a => a.share > 0);
  return { ok, msg: ok ? '' : 'В договоре нет ни одного предмета с долей > 0 — регистрация невозможна. Отнесите предмет залога либо аннулируйте договор.' };
}
/* ГЕЙТ ДАТЫ СОБЫТИЯ (Р-32): дата регистрируемого события (переоценка / обследование /
   наложение запрета / согласие / извещение) не может быть в будущем относительно даты
   стенда (TODAY) и не раньше предыдущего события того же рода (notBefore — дата последней
   несторнированной записи или нотариальная дата договора-основания). Возвращает {ok, msg}. */
function eventDateValid(date, opts){
  const o = opts || {};
  if(!isDate(date)) return { ok:false, msg:'Дата — в формате дд.мм.гггг' };
  if(d2n(date) > d2n(TODAY)) return { ok:false, msg:`Дата события ${date} — в будущем (дата стенда ${TODAY}). События задним числом вперёд не регистрируются.` };
  if(o.notBefore && isDate(o.notBefore) && d2n(date) < d2n(o.notBefore))
    return { ok:false, msg:`Дата события ${date} раньше предыдущей записи (${o.notBefore})${o.notBeforeLabel?' — '+o.notBeforeLabel:''}. Порядок событий не может нарушаться.` };
  return { ok:true, msg:'' };
}
/* СТОРНО (Р-33): записи журналов не удаляются физически — помечаются voided:{by,date,reason}.
   Производные скаляры (it.appraised, it.lastReval, it.lastSurvey) не читают массивы, поэтому
   при сторнировании их надо пересчитать по последней НЕсторнированной записи. Массивы
   хронологичны (push в конец), поэтому «последняя живая» = последний элемент без voided. */
const livesReval = it => (it.revals||[]).filter(r => !r.voided);
const livesSurvey = it => (it.surveys||[]).filter(s => !s.voided);
const lastRevalLive = it => { const a = livesReval(it); return a.length ? a[a.length-1].date : ''; };
const lastSurveyLive = it => { const a = livesSurvey(it); return a.length ? a[a.length-1].date : ''; };
/* ИНВАРИАНТ: Σ долей предмета ≤ залоговая стоимость. Проверяется до сохранения. */
function invariantBreaches(virtual){
  const cs = [...CONTRACTS.filter(c => (isActive(c)||isDraftish(c)) && c.id !== virtual.id), virtual];
  const ids = [...new Set(virtual.allocs.map(a=>a.item))];
  return ids.map(id => ({ id, alloc: allocatedIn(cs, id), pledge: pledgeValue(item(id)) }))
            .filter(x => x.alloc > x.pledge + 0.005);
}

/* Залоговая ось статуса предмета — ПРОИЗВОДНАЯ от наличия долей (не поле). */
/* Т-2: статус «реализуется» (it.realizing) выставляется НЕ здесь. Обращение взыскания и
   реализацию предмета ведёт модуль ВЗЫСКАНИЯ (фаза 5 жизненного цикла) — это граничный
   контракт между модулями, как resolveActor у сотрудников: залоговый модуль только ОТОБРАЖАЕТ
   флаг (статус + цвет аватара AVA_LIEN), но не переключает его — у куратора залога нет
   действия «передать в реализацию». Единая точка входа со стороны взыскания —
   collectionSetRealizing(id, on): модуль взыскания зовёт её при старте/отмене реализации.
   В seed флаг выставлен ровно на одном предмете (П-042 / Д-030 — движимый неликвид-only,
   ушедший в реализацию по просрочке К-123): статус и цвет аватара видны на демо-стенде без
   вызова шва. Сам шов проверяет тест W5 — дёргает контракт и сверяет статус/цвет. */
function collectionSetRealizing(id, on){
  const it = item(id); if(!it) return false;
  it.realizing = !!on;
  hist(it, on ? 'Передан в реализацию модулем взыскания (обращение взыскания)'
              : 'Реализация отменена модулем взыскания');
  return true;
}
function lienStatus(it){
  /* КП-5: аннулированная запись — терминальное состояние поверх всей оси. Гейт
     cancelBlockedReason гарантирует, что у неё нет ни долей, ни запрета, ни everPledged,
     поэтому проверка стоит первой и ничего не перекрывает. */
  if(it.cancelled) return 'аннулирован';
  if(it.lost) return 'выбыл';
  if(it.realizing) return 'реализуется';
  if(allocatedLegal(it.id) > 0) return 'в залоге';
  if(allocatedDraft(it.id) > 0) return 'резервируется';
  return it.everPledged ? 'освобождён' : 'свободен';
}
const lienCls = s => s==='в залоге' ? 'info' : s==='реализуется' ? 'mid' : s==='выбыл' ? 'high' : 'neutral';

/* ============================================================
   ОСЬ ЗАПРЕТА НА ОТЧУЖДЕНИЕ — НАШ ШАГ ОФОРМЛЕНИЯ, не внешнее событие.
   Порядок: договор удостоверяется у нотариуса → мы САМИ накладываем запрет
   на отчуждение предмета в регистрирующем органе, чтобы залогодатель не продал
   заложенное имущество без нашего ведома. Запрет — на ВЕЩЬ (один на предмет),
   при перезалоге дополняется основанием, а не накладывается заново. Снимается,
   когда предмет перестал обеспечивать кредит (гейт: живые доли ⇒ снять нельзя).
   Ось запрета НЕЗАВИСИМА от залоговой оси: «в залоге» + «запрет не наложен»
   — это и есть дефект оформления (дыра в обеспечении), а не норма.
   ============================================================ */
/* Дедлайн наложения: нотариальная дата САМОГО РАННЕГО зарегистрированного
   договора, обременяющего предмет, + BAN_DEADLINE_DAYS рабочих дней. */
function banDeadline(it){
  const cs = CONTRACTS.filter(c => isActive(c) && c.allocs.some(a=>a.item===it.id) && isDate(c.notaryDate));
  if(!cs.length) return null;
  const earliest = cs.map(c=>c.notaryDate).sort((a,b)=>d2n(a)-d2n(b))[0];
  return addBusinessDays(earliest, BAN_DEADLINE_DAYS);
}
/* Зарегистрированные договоры, обременяющие предмет — основания запрета. */
const banContracts = it => CONTRACTS.filter(c => isActive(c) && c.allocs.some(a=>a.item===it.id)).map(c=>c.id);
const banRequired = it => allocatedLegal(it.id) > 0;                 // запрет обязан быть
const banMissing  = it => banRequired(it) && !it.ban;               // ДЕФЕКТ ОФОРМЛЕНИЯ
const banOverdue  = it => banMissing(it) && isOverdue(banDeadline(it));
const banStale    = it => Boolean(it.ban) && allocatedLegal(it.id) === 0;  // подлежит снятию
/* Р-20 (ПБК п.2.1): запрет на отчуждение накладывает ЗАЛОГОДАТЕЛЬ в регистрирующем
   органе; мы контролируем наложение и принимаем ОТМЕТКУ о запрете в оригиналах
   правоустанавливающих документов. Запрет зарегистрирован (regNo), но пока не
   получена и не зафиксирована отметка в оригиналах — оформление НЕ завершено. */
function banFullyRegistered(b){ return Boolean(b && b.regNo && b.markInOriginals); }
/* Р-9/Р-20 (ПБК п.2.2): при снятии по основанию «Полное погашение обязательства»
   обязателен реквизит акта сверки о погашении задолженности. Доп. гейт к
   существующей цепочке согласования (RELEASE_APPROVALS) — не замена. */
function releaseValid({basis, reconAct}){
  if (basis === 'Полное погашение обязательства' && !(reconAct && reconAct.trim()))
    return { ok:false, msg:'Требуется реквизит акта сверки о погашении задолженности (ПБК п.2.2)' };
  return { ok:true };
}
function banStatus(it){
  if(it.ban) return allocatedLegal(it.id) === 0 ? 'подлежит снятию' : 'наложен';
  if(!banRequired(it)) return 'не требуется';
  return banOverdue(it) ? 'просрочен' : 'не наложен';
}
/* Единственный источник пилюли запрета в списках и карточках. */
/* ПЗ-23: `short` — пилюля БЕЗ срока наложения. В реестре срок вынесен подстрокой (banCell),
   и пилюля «запрет не наложен · до 12.05.2026» (192px) там всегда обрезалась. Прочие точки
   вывода (шапка карточки, таблица предметов договора) читают полную форму — параметр
   опциональный, поведение по умолчанию не менялось. */
function banPill(it, short){
  const s = banStatus(it);
  if(s==='наложен')          return '<span class="pill low">запрет наложен</span>';
  if(s==='не наложен')       return `<span class="pill mid">запрет не наложен${short ? '' : ` · до ${banDeadline(it)}`}</span>`;
  if(s==='просрочен')        return '<span class="pill high">ЗАПРЕТ НЕ НАЛОЖЕН</span>';
  if(s==='подлежит снятию')  return '<span class="pill mid">подлежит снятию</span>';
  /* ПЗ-14: после выделения оси в собственную колонку прочерк читался как «данных нет».
     Называем состояние: предмет не обременён, запрет накладывать не с чего. */
  return '<span class="pill neutral">не требуется</span>';
}

/* ПЛАНОВЫЙ КОНТРОЛЬ — вычисляемый оверлей по датам, не статус.
   Периодичность ОБСЛЕДОВАНИЯ (Р-3, Прил.2 §2.3) — по матрице «группа платёжеспособности ×
   движимость», где группа резолвится ОТ ЗАЁМЩИКОВ обеспечиваемых кредитов (залогодатель
   может быть третьим лицом). При нескольких группах — строжайшая (наименьший интервал, worst-of).
   Переоценка (nextReval) — интервал НЕ из положения: внутренний параметр (Р-3 п.5). */
const movableOf = it => isMovable(it);
const surveyInterval = (group, movable) => { const r = SURVEY_MATRIX[group]; if(!r) return undefined;
  return movable ? r.movable : r.immovable; };
/* Группа платёжеспособности предмета: worst-of по заёмщикам зарегистрированных договоров.
   → { group, interval, bankrupt } либо null, если предмет никого не обеспечивает. */
function borrowerSolvency(it){
  const inns = new Set();
  CONTRACTS.filter(c => isActive(c) && c.allocs.some(a=>a.item===it.id))
           .forEach(c => c.credits.forEach(id => inns.add(credit(id).inn)));
  const groups = [...new Set([...inns].map(solvencyOf).filter(Boolean))];
  if(!groups.length) return null;
  const mv = movableOf(it);
  const numeric = groups.filter(g => surveyInterval(g, mv) != null);
  if(!numeric.length) return { group: groups[0], interval: null, bankrupt: true };  // все заёмщики — банкроты
  let best = numeric[0];
  numeric.forEach(g => { if(surveyInterval(g, mv) < surveyInterval(best, mv)) best = g; });
  return { group: best, interval: surveyInterval(best, mv), bankrupt: false };
}

/* Р-22 (ПОР п.10): ужесточение периодичности обследования по категории риска — слой
   ПОВЕРХ матрицы платёжеспособности (Прил.2 §2.3), а не замена ей. Действует только
   при согласовании зампреда (RISK_TIGHTENING_APPROVAL.approved) — иначе используется
   чистая матрица. Нижний предел SURVEY_MIN_MONTHS не даёт ужесточению уйти в абсурд
   (напр. банкрот исключён отдельно: effectiveInterval возвращает undefined). */
let RISK_TIGHTENING   = { 'Низкий':1.0, 'Средний':0.5, 'Высокий':0.25 }; // ПОР п.10 — ужесточение периодичности по категории риска
let SURVEY_MIN_MONTHS = 3;                                               // нижний предел интервала после ужесточения
let RISK_TIGHTENING_APPROVAL = { approved:true, req:'СЗ зампреда №СЗ-2026/07 от 09.07.2026', date:'09.07.2026' }; // ПОР п.10: ужесточение — с согласования зампреда
function effectiveInterval(group, movable, riskCat, approval){
  const base = surveyInterval(group, movable);
  if (base == null) return undefined;               // банкрот (null) / неизвестная группа (undefined) — оба через `==`
  if (!approval || !approval.approved || !riskCat) return base;
  const k = RISK_TIGHTENING[riskCat] ?? 1.0;
  return Math.max(SURVEY_MIN_MONTHS, Math.round(base * k));
}
/* Категория риска предмета: worst-of по кредитам АКТИВНЫХ договоров, отнёсших предмет
   (параллельно borrowerSolvency, но по риску, не по платёжеспособности заёмщика).
   riskCategory — ЗЕРКАЛО из кредитного модуля (см. комментарий у CREDITS); отсутствие
   поля трактуется как 'Низкий' (коэф. 1.0, без ужесточения). Худший риск = наименьший
   коэффициент RISK_TIGHTENING (Высокий 0.25 < Средний 0.5 < Низкий 1.0). */
function itemRiskCategory(it){
  const cats = [];
  CONTRACTS.filter(c => isActive(c) && c.allocs.some(a=>a.item===it.id))
           .forEach(c => c.credits.forEach(id => cats.push(credit(id).riskCategory || 'Низкий')));
  if(!cats.length) return 'Низкий';
  let worst = cats[0];
  cats.forEach(c => { if((RISK_TIGHTENING[c] ?? 1.0) < (RISK_TIGHTENING[worst] ?? 1.0)) worst = c; });
  return worst;
}
/* Дата следующего обследования: null, если предмет никого не обеспечивает или заёмщик —
   банкрот (обследование «по договору со спецадминистратором», авто-просрочка не поднимается).
   Интервал — ДЕЙСТВУЮЩИЙ (effectiveInterval, Р-22/ПОР п.10), не базовый матричный: при
   риске «Низкий» либо отсутствии согласования зампреда effectiveInterval вернёт базовый
   интервал без изменений — поведение для нетронутых ужесточением предметов сохраняется. */
function nextSurvey(it){
  const s = borrowerSolvency(it);
  if(!s || s.interval == null) return null;
  const eff = effectiveInterval(s.group, movableOf(it), itemRiskCategory(it), RISK_TIGHTENING_APPROVAL);
  if(eff == null) return null;
  return addMonths(it.lastSurvey, eff);
}
const nextReval = it => addMonths(it.lastReval, (KINDS[it.kind]||{reval:24}).reval);
/* ПЗ-Д8: ПРОСРОЧКА переоценки существует только у обременённого предмета — та же охрана,
   что у обследования (nextSurvey возвращает null, когда предмет никого не обеспечивает) и
   у соседних триггеров Р-47/Р-48/Р-49. Плановая дата считается всегда и показывается всегда;
   просроченной она объявляется, только когда предмет что-то обеспечивает — иначе освобождённый
   три года назад предмет висел бы просроченным вечно, хотя его залоговая ни на что не влияет.
   Единственный источник признака: триггер, карточка «Основное», карточка «Обследования». */
const revalOverdue = it => banRequired(it) && isOverdue(nextReval(it));

/* ---- ПРЕДПОСЫЛКИ ОФОРМЛЕНИЯ (Р-5, Прил.1 §5.2). required — производно от pledgerType. */
function prereqReq(it){
  const t = it.pledgerType;
  return {
    ownerConsent:  { required: ['Муниципальное','Госпредприятие','АО / хоз. общество'].includes(t),
      label: t==='Муниципальное' ? 'согласие ОМСУ'
           : t==='Госпредприятие' ? 'согласие Госимущества (уполномоченного органа)'
           : t==='АО / хоз. общество' ? 'решение исполнительного органа / совета директоров / общего собрания'
           : 'согласие собственника' },
    spouseConsent: { required: t==='Физлицо (имущество в браке)', label:'нотариальное согласие супруга(и)' },
    encumbranceCert:{ required: true, label:'справка регистрационного органа об отсутствии ограничений на отчуждение' },
  };
}
const PREREQ_KEYS = ['ownerConsent','spouseConsent','encumbranceCert'];
function prereqMissing(it){
  const req = prereqReq(it), pr = it.prereqs || {};
  return PREREQ_KEYS.filter(k => req[k].required && !((pr[k]||{}).present))
                    .map(k => ({ key:k, label:req[k].label }));
}

/* ---- Р-46 СТРАХОВАНИЕ ПРЕДМЕТА (§3.4) — ось шире техники (см. INSURANCE_KINDS).
   Техника-специфичные обёртки ниже выражены через эти функции, чтобы правило страхования
   жило в одном месте, а не в двух параллельных. ---- */
const insuranceRequired = it => INSURANCE_KINDS.includes(it.kind);
const insuredPresent    = it => Boolean(it.insured && it.insured.present);
const insuredMissing    = it => insuranceRequired(it) && !insuredPresent(it);
const policyExpired     = it => insuranceRequired(it) && insuredPresent(it)
                                && Boolean(it.insured.till) && isOverdue(it.insured.till);

/* ---- Р-47 АКТУАЛЬНОСТЬ ОЦЕНКИ. Отчёт об оценке годен APPRAISAL_VALID_MONTHS от даты
   отчёта; просроченный отчёт означает, что залоговая стоимость в расчёте покрытия опирается
   на устаревшую оценочную. Это не то же самое, что nextReval (плановый интервал переоценки
   по виду залога): интервал — «когда переоценивать», годность — «можно ли ещё верить цифре». */
const apprValidTill = it => it.apprDate ? addMonths(it.apprDate, APPRAISAL_VALID_MONTHS) : null;
const apprStale     = it => { const t = apprValidTill(it); return Boolean(t) && isOverdue(t); };

/* ---- Р-56 ДОСЬЕ ПРЕДМЕТА: обязательный комплект + фактические вложения.
   reqFilesOf — состав комплекта для конкретного предмета (общий базис + вид залога).
   fileOfType — ПОСЛЕДНИЙ по дате документ этого типа (перевыпуск полиса не должен
   вычитаться из комплекта из-за старой записи, лежащей раньше в массиве). */
function reqFilesOf(it){
  return FILE_REQ_COMMON.concat(FILE_REQ_BY_KIND[it.kind] || [])
    .filter(r => r.t !== 'Страховой полис' || insuranceRequired(it));
}
/* КП-8: откреплённые файлы (f.detached) в комплекте не участвуют. Раньше приложенный файл
   был неудаляем и неисправим: скан не того объекта, неверный тип или опечатка в дате
   оставались навсегда — а поскольку берётся ПОСЛЕДНИЙ по дате, мусорный файл со свежей
   датой молча закрывал требование комплекта. Физического удаления по-прежнему нет:
   открепление — пометка с основанием, как сторно (Р-33). */
const liveFiles = it => (it.files || []).filter(f => !f.detached);
function fileOfType(it, type){
  const fs = liveFiles(it).filter(f => f.tag === type);
  if(!fs.length) return null;
  return fs.slice().sort((a,b) => (d2n(b.docDate || b.when) - d2n(a.docDate || a.when)))[0];
}
/* Прежние версии документа того же типа — всё, что не действующая запись. Показываются
   свёрткой в строке комплекта, чтобы перевыпуск полиса не выглядел как единственный факт. */
function filePrevVersions(it, type){
  const cur = fileOfType(it, type);
  return (it.files || []).filter(f => f.tag === type && f !== cur);
}
/* Статус документа комплекта: нет / истёк ДД.ММ.ГГГГ / есть. Срок считается от ДАТЫ
   ДОКУМЕНТА (docDate), а не от даты прикрепления файла — иначе просроченный полис
   «омолаживается» повторной загрузкой скана. */
function fileStatusOf(req, doc){
  if(!doc) return { code:'missing', label:'нет', cls:'high' };
  if(req.validMonths){
    const till = addMonths(doc.docDate || doc.when, req.validMonths);
    if(till && isOverdue(till)) return { code:'expired', label:'истёк '+till, cls:'mid', till };
    return { code:'ok', label:'есть', cls:'low', till };
  }
  return { code:'ok', label:'есть', cls:'low' };
}
/* Укомплектованность досье предмета — одна точка правды: её читают вкладка «Документы»,
   бейдж вкладки, плашка допуска и триггер неполного комплекта. */
function itemDossier(it){
  const rows = reqFilesOf(it).map(req => {
    const doc = fileOfType(it, req.t);
    return { req, doc, st: fileStatusOf(req, doc) };
  });
  const extras = liveFiles(it).filter(f => !reqFilesOf(it).some(r => r.t === f.tag));
  const met = rows.filter(r => r.st.code === 'ok').length;
  const exp = rows.filter(r => r.st.code === 'expired').length;
  return { rows, extras, req: rows.length, met, exp,
           pct: rows.length ? Math.round(met / rows.length * 100) : 100,
           missing: rows.filter(r => r.st.code === 'missing').map(r => r.req.t) };
}

/* ---- Р-50 СРОК АРЕНДЫ vs СРОК КРЕДИТА (ПОЛ §6.4 п.6). leaseCoversCredit существовал, но
   не вызывался ни из одного места UI — контроль был мёртвым. Здесь он поднимается по
   КАЖДОМУ кредиту, который предмет обеспечивает действующим договором. ---- */
function leaseWarnings(it){
  if(it.kind !== 'Право аренды') return [];
  const cids = [...new Set(CONTRACTS.filter(c => isActive(c) && c.allocs.some(a => a.item === it.id))
                                    .flatMap(c => c.allocs.filter(a => a.item === it.id).map(a => a.credit)))];
  return cids.map(cid => ({ creditId:cid, ...leaseCoversCredit(it, credit(cid)) })).filter(w => w.warn);
}

/* ---- Р-51 СПОСОБ И МЕСТО ХРАНЕНИЯ (ПОЛ §6.4 п.7). custody вводится при РЕГИСТРАЦИИ
   ДОГОВОРА и хранится на договоре, поэтому карточка предмета его не показывала — оформитель
   не видел, где вещь физически. Читаем с зарегистрированных договоров, обременяющих предмет;
   расхождение между договорами (редкий, но возможный случай перезалога) не скрываем. ---- */
function custodyOf(it){
  const cs = CONTRACTS.filter(c => isActive(c) && c.custody && c.allocs.some(a => a.item === it.id));
  if(!cs.length) return null;
  const uniq = [...new Set(cs.map(c => c.custody))];
  return { modes: uniq, conflict: uniq.length > 1,
           rows: cs.map(c => ({ cid:c.id, no:c.no, custody:c.custody, place:c.custodyPlace || '' })) };
}

/* ---- Р-52 СВЕТОФОР ДОПУСКА. Раньше гейты приёма/регистрации всплывали ТОСТАМИ в момент
   регистрации договора (doRegister) — на карточке предмета их не было видно вовсе, а
   предпосылки §5.2 и техдопуск были спрятаны на вкладке, названной «Документы».
   Здесь все проверки собраны в один читаемый список: sev 'stop' блокирует регистрацию
   договора, 'warn' — замечание оформления, 'ok' — пройдено. Чистая функция. ---- */
function admissionChecks(it){
  const C = [];
  const push = (sev, name, result, basis, tab) => C.push({ sev, name, result, basis, tab });

  /* ① Стоп-лист §3.5 (Р-18) — та же функция, что гейтит приём и регистрацию. */
  const sl = stopListCheck(stopFieldsOf(it));
  push(sl.block ? 'stop' : 'ok', 'Стоп-лист Прил.1 §3.5',
    sl.block ? 'приём не допускается' : 'ограничений нет',
    sl.block ? sl.msg : 'вид и состояние предмета под запреты §3.5 не подпадают', 0);

  /* ② Предпосылки оформления §5.2 (Р-5) — состав зависит от типа залогодателя. */
  const miss = prereqMissing(it);
  /* tab:null — предпосылки §5.2 сведены агрегатом на договоре (вкладка «Документы»),
     в карточке предмета вкладки для них нет — дефект показываем без ссылки */
  push(miss.length ? 'stop' : 'ok', 'Предпосылки оформления §5.2',
    miss.length ? 'не приложено: ' + miss.length : 'комплект закрыт',
    miss.length ? miss.map(m => m.label).join('; ') : 'тип залогодателя «' + it.pledgerType + '» — все обязательные согласия приложены', null);

  /* ③ Комплект документов досье (Р-47). */
  const d = itemDossier(it);
  push(d.missing.length ? 'stop' : (d.exp ? 'warn' : 'ok'), 'Комплект документов',
    d.met + ' из ' + d.req + (d.exp ? ' · ' + d.exp + ' истёк' : ''),
    d.missing.length ? 'отсутствуют: ' + d.missing.join('; ')
      : (d.exp ? 'документ с истёкшим сроком годности требует перевыпуска' : 'обязательный комплект по виду «' + it.kind + '» приложен полностью'), 5);

  /* ④ Актуальность отчёта об оценке (Р-48). */
  const till = apprValidTill(it);
  push(apprStale(it) ? 'warn' : 'ok', 'Актуальность оценки',
    apprStale(it) ? 'отчёт устарел ' + till : 'годен до ' + (till || '—'),
    'отчёт ' + (it.apprReport || '—') + ' от ' + (it.apprDate || '—') + ' · срок годности ' + APPRAISAL_VALID_MONTHS + ' мес.'
      + (it.appraiser ? ' · оценщик: ' + it.appraiser + (it.apprLicense ? ' (лиц. ' + it.apprLicense + ')' : '') : ' · оценщик не указан'), 1);

  /* ⑤ Страхование (Р-46) — по всем видам из INSURANCE_KINDS, не только по технике. */
  if(insuranceRequired(it)){
    const ins = it.insured || {};
    push(insuredMissing(it) ? 'stop' : policyExpired(it) ? 'warn' : 'ok', 'Страхование предмета',
      insuredMissing(it) ? 'полиса нет' : policyExpired(it) ? 'полис истёк ' + ins.till : 'полис действует',
      insuredMissing(it) ? 'вид «' + it.kind + '» подлежит страхованию (§3.4)'
        : 'полис ' + (ins.policy || '—') + (ins.till ? ' · до ' + ins.till : ''), 0);
  }

  /* ⑥ Возраст техники (Р-17). */
  const age = techAge(it);
  if(age != null){
    const chk = techAgeCheck({ securityRole: it.securityRole || 'основной', origin: it.origin, age });
    push(chk.block ? 'stop' : chk.needCommittee ? 'warn' : 'ok', 'Срок эксплуатации техники',
      age + ' лет при лимите ' + techAgeLimit(it), chk.msg || 'в пределах лимита для «' + it.origin + '»', 0);
  }

  /* ⑦ Срок аренды vs срок кредита (Р-50, ПОЛ §6.4 п.6) — оживший контроль. */
  if(it.kind === 'Право аренды'){
    const lw = leaseWarnings(it);
    push(lw.length ? 'warn' : 'ok', 'Срок аренды покрывает срок кредита',
      lw.length ? 'короче по ' + lw.map(w => w.creditId).join(', ') : 'покрывает',
      lw.length ? lw[0].msg + ' · срок аренды до ' + (it.leaseTill || '—')
        : 'срок аренды до ' + (it.leaseTill || '—'), 4);
  }

  /* ⑧ Способ хранения (Р-51, ПОЛ §6.4 п.7). */
  const cu = custodyOf(it);
  if(banRequired(it) || cu){
    push(!cu ? 'warn' : cu.conflict ? 'warn' : 'ok', 'Способ хранения',
      !cu ? 'не указан' : cu.modes.join(' / '),
      !cu ? 'предмет обременён зарегистрированным договором, но способ хранения на договоре не заполнен (ПОЛ §6.4 п.7)'
        : cu.rows.map(r => (r.no || r.cid) + ': ' + r.custody + (r.place ? ' · ' + r.place : '')).join(' · '), 0);
  }

  /* ⑨ Запрет на отчуждение. */
  if(banMissing(it))
    push('stop', 'Запрет на отчуждение', 'не наложен',
      'договор(ы) ' + banContracts(it).join(', ') + ' зарегистрированы, запрет в «' + organOf(it) + '» отсутствует — предмет можно продать без нашего ведома', 2);
  else if(it.ban && banStale(it))
    push('warn', 'Запрет на отчуждение', 'подлежит снятию',
      'доли обнулились, запрет ' + it.ban.regNo + ' продолжает действовать в «' + organOf(it) + '»', 2);
  else if(it.ban && !banFullyRegistered(it.ban))
    push('warn', 'Запрет на отчуждение', 'отметка не получена',
      'запрет ' + it.ban.regNo + ' наложен, отметка в оригиналах правоустанавливающих документов не получена (ПБК п.2.1)', 2);
  else if(it.ban)
    push('ok', 'Запрет на отчуждение', 'наложен',
      organOf(it) + ' · ' + it.ban.regNo + ' от ' + it.ban.date, 2);

  /* ⑩ Плановый контроль: обследование и переоценка. */
  const ns = nextSurvey(it);
  push(ns && isOverdue(ns) ? 'warn' : 'ok', 'Обследование в сроке',
    ns ? (isOverdue(ns) ? 'просрочено на ' + Math.abs(daysLeft(ns)) + ' дн.' : 'до ' + ns) : 'не планируется',
    ns ? 'последнее — ' + (it.lastSurvey || '—') : 'предмет не обеспечивает ни одного кредита', 3);
  const nr = nextReval(it);
  push(isOverdue(nr) ? 'warn' : 'ok', 'Переоценка в сроке',
    isOverdue(nr) ? 'просрочена на ' + Math.abs(daysLeft(nr)) + ' дн.' : 'до ' + nr,
    'интервал по виду «' + it.kind + '» — ' + ((KINDS[it.kind] || {}).reval || '—') + ' мес.', 1);

  /* ⑪ КП-14: валюта оценки предмета против валюты обеспечиваемых кредитов. Раньше вопрос
     не мог возникнуть — валюта предмета ВЫВОДИЛАСЬ из кредитов и совпадала по построению.
     Теперь она собственная, и расхождение — настоящее: индекс обеспеченности считается
     делением на сумму кредита, пересчёт по курсу объявлен вне модуля. */
  const ccyBad = ccyMismatches(it);
  if(ccyBad.length)
    push('stop', 'Валюта оценки', 'оценка в ' + ccyLabel(itemCcy(it)) + ', кредиты в ' + ccyBad.map(ccyLabel).join(', '),
      'индекс обеспеченности считается в одной валюте; пересчёт по курсу вне модуля залога — нужна оценка в валюте кредита либо кредит в валюте оценки', 0);

  /* ⑫ Инвариант Σ долей ≤ залоговая. */
  const pv = pledgeValue(it), tot = allocatedLegal(it.id) + allocatedDraft(it.id);
  push(tot > pv + 0.005 ? 'stop' : 'ok', 'Инвариант долей',
    'Σ ' + fmt(tot) + (tot > pv + 0.005 ? ' > ' : ' ≤ ') + fmt(pv),
    tot > pv + 0.005 ? 'доли усечены пропорционально в расчёте покрытия — кредиты уходят в триггер недостаточности'
      : 'доступно для перезалога: ' + fmt(availableOf(it)), 4);

  /* ⑬ Утрата предмета — терминальный дефект обеспечения. */
  if(it.lost) push('stop', 'Наличие предмета', 'утрачен',
    'зафиксировано актом обследования — залоговая стоимость исключена из покрытия', 3);

  return C;
}
function admissionVerdict(it){
  const C = admissionChecks(it);
  const stop = C.filter(c => c.sev === 'stop').length;
  const warn = C.filter(c => c.sev === 'warn').length;
  return { checks:C, stop, warn, pass: C.length - stop - warn,
           word: stop ? 'Есть стоп-факторы' : warn ? 'Требует внимания' : 'Допуск подтверждён' };
}
/* Вердикт одной плашкой — для таблицы предметов договора и для шапки карточки предмета.
   Отдельной панели с разбором проверок нет; расшифровка счётчиков — в title плашки,
   а конкретные нарушения — в дефект-строке предмета (itemDefects/defectBar). */
const admissionPill = it => { const v = admissionVerdict(it);
  return `<span class="pill ${v.stop?'high':v.warn?'mid':'low'}" title="стоп-факторов: ${v.stop} · замечаний: ${v.warn} · пройдено: ${v.pass}">${
    v.stop ? 'стоп-факторы: '+v.stop : v.warn ? 'замечания: '+v.warn : 'допуск подтверждён'}</span>`; };
/* Договор, в рамках которого решается допуск предмета: действующий приоритетнее черновика. */
const admissionContract = it => CONTRACTS.filter(c => (isActive(c)||isDraftish(c)) && c.allocs.some(a=>a.item===it.id))
  .sort((a,b)=>(isActive(b)?1:0)-(isActive(a)?1:0))[0] || null;

/* ---- ТЕХНИКА (Р-7, Прил.1 §2.5, §3.4). Возраст и страховка — производные проверки.
   Страхование выражено через общую ось Р-46 (INSURANCE_KINDS), техника — её подмножество. */
const techAge       = it => (isTech(it) && it.year) ? CUR_YEAR - it.year : null;
const techAgeLimit  = it => TECH_AGE_LIMIT[it.origin] ?? TECH_AGE_LIMIT['СНГ'];
const techInsuredOk = it => !isTech(it) || insuredPresent(it);
const techPolicyExpired = it => isTech(it) && policyExpired(it);
/* Р-23 (ПОР п.12 п.п.2): модуль залога НЕ трогает категорию кредитного риска — он лишь
   ПУБЛИКУЕТ кандидатов на факторы риска в комитет по администрированию бюджетных
   кредитов; решение о фактическом изменении категории — за комитетом (кредитный модуль).
   Чистая функция: только читает ITEMS/CONTRACTS/CREDITS, ничего не мутирует.
   Сейчас заведён один фактор (истёкший полис страхования техники) — таблица §15 промпта
   (покрытие ниже / утрата предмета → снимает основание «Низкий») пока не populated. */
function riskFactorCandidates(){
  const out = [];
  ITEMS.forEach(it => {
    if(!techPolicyExpired(it)) return;
    const cids = [...new Set(CONTRACTS.filter(c=>isActive(c)&&c.allocs.some(a=>a.item===it.id)).flatMap(c=>c.credits))];
    cids.forEach(cid => out.push({ creditId:cid, category:'Средний', basis:'ПОР п.12 п.п.2',
      fact:`Полис страхования техники ${it.id} истёк`, itemId:it.id, needsCommittee:true }));
  });
  return out;
}
/* Р-17 (Прил.1 §2.5, §3.4): возраст сверх лимита блокирует ЖЁСТКО только «дополнительный» залог;
   «основной» залог сверх лимита не блокируется на приёме — уходит на решение комитета. */
function techAgeCheck({securityRole, origin, age}){
  const lim = TECH_AGE_LIMIT[origin] ?? 15;
  if (age <= lim) return { block:false, needCommittee:false };
  if (securityRole === 'дополнительный')
    return { block:true, needCommittee:false, msg:`Приём отклонён (Прил.1 §2.5): срок эксплуатации ${age} лет превышает лимит ${lim} лет для «${origin}»` };
  return { block:false, needCommittee:true, msg:`Прил.1 §2.5 устанавливает лимит для дополнительного залога. Приём техники такого возраста в качестве основного обеспечения требует решения комитета с обоснованием по Прил.1 §3.4.` };
}

/* Р-19 (ПОЛ §11): срок, после которого незавершённый маршрут кредитно-залоговых документов
   поднимает контрольный триггер (см. triggers() / docRouteIncomplete). ВНУТРЕННИЙ параметр
   модуля — в ПОЛ/Прил.1-Прил.3 конкретный срок не задан, правится администратором в справочнике. */
let DOC_ROUTE_DAYS = 30;

/* Р-35 (ПОР): срок, после которого договор, ожидающий решения комитета по
   администрированию бюджетных кредитов («На рассмотрении комиссии»), поднимает
   критичность триггера очереди со средней на высокую. ВНУТРЕННИЙ параметр —
   в положениях конкретный SLA не задан, правится администратором в справочнике. */
let COMMITTEE_SLA = 10;

/* ТРИГГЕРЫ. Собираются из состояния; не хранятся. Триггер «недостаточность
   обеспечения» уходит во взыскание отдельным треком по причине «обеспечение» —
   он НЕ трогает риск-категорию и НЕ трогает группу платёжеспособности. */
function triggers(){
  const out = [], cs = CONTRACTS.filter(isActive);
  const seen = new Set();
  /* Один код на кредит: недостаточность обеспечения + жизненный цикл банковской гарантии.
     ctrId — договор-носитель (для кредитов без договора, обеспеченных только гарантией
     (Р-28/В-1=А), равен null: гарантия живёт на кредите, залогового договора нет). */
  const emitCredit = (id, ctrId) => {
    if(seen.has(id)) return; seen.add(id);
    const cov = coverage(cs, id);
    /* Кредит с банковской гарантией реально учтён в index (idxGuar, Р-11) — ложный триггер
       недостаточности не поднимается, если гарантия+залог фактически покрывают порог. */
    if(!cov.ok){
      const parts = [];
      /* Р-43: текст триггера разбирает ИНДЕКС на слагаемые (залог + гарантия) — раньше показывал
         только ratio (залог) и молчал про гарантию, из-за чего противоречил карточке (К-95: индекс
         ≈0,55 из гарантии, а триггер писал «покрытие 0,0%»). Слагаемые показываются всегда, даже
         нулевые; порог гарантии в иной валюте (120%) помечается. */
      if(cov.index < 1 - 1e-9){
        const seg = [`залог ${pct(cov.idxPledge)}`];
        if(cov.gReq != null) seg.push(`банковская гарантия ${pct(cov.idxGuar)} (порог гарантии ${pct(cov.gReq)}${cov.gReq > COVER_GUARANTEE + 1e-9 ? ' — иная валюта' : ''})`);
        parts.push(`обеспеченность ${pct(cov.index)} < 100% (${seg.join(' + ')})`);
      }
      if(cov.liqApplies && !cov.liqOk) parts.push(`доля ликвидного залога ${pct(cov.liqShare)} < ${pct(LIQUID_SHARE_MIN)} — движимый неликвидный залог (§2.4)`);
      out.push({ type:'Недостаточность обеспечения', crit:'high', obj:id,
        objLbl:`${id} · ${credit(id).num}`, ctr:ctrId, text: parts.join('; '),
        act:'Открыть трек взыскания по обеспечению / догрузить или заменить предмет' });
    }
    /* Р-11: истечение банковской гарантии — самостоятельный триггер (§9–10), не зависит от
       того, покрывает ли гарантия порог. */
    const g = cov.other;
    if(g && g.type === 'банковская гарантия'){
      if(guaranteeExpired(g)){
        out.push({ type:'Срок банковской гарантии истёк', crit:'high', obj:id,
          objLbl:`${id} · ${credit(id).num}`, ctr:ctrId,
          text:`Банковская гарантия${g.docNo?' '+g.docNo:''} истекла ${g.till}`,
          act:'Обновить/продлить банковскую гарантию либо перекрыть залогом' });
      } else if(g.till && daysLeft(g.till) <= GUAR_WARN_DAYS){
        out.push({ type:'Гарантия истекает', crit:'mid', obj:id,
          objLbl:`${id} · ${credit(id).num}`, ctr:ctrId,
          text:`Банковская гарантия${g.docNo?' '+g.docNo:''} истекает ${g.till} (через ${daysLeft(g.till)} дн.)`,
          act:'Инициировать продление гарантии заблаговременно' });
      }
    }
  };
  cs.forEach(c => c.credits.forEach(id => emitCredit(id, c.id)));
  /* Р-28 (В-1=А): кредиты, обеспеченные ТОЛЬКО банковской гарантией (залогового договора
     нет — гарантия на кредите), не попали бы в мониторинг через обход договоров. Сканируем
     их со стороны кредита, чтобы недообеспеченность/истечение гарантии оставались видны. */
  CREDITS.forEach(cr => {
    const g = cr.otherSecurity;
    if(cr.status === 'Действующий' && g && g.type === 'банковская гарантия') emitCredit(cr.id, null);
  });
  ITEMS.forEach(it => {
    /* Р-8: утрата/ухудшение — сначала регламентный шаг «извещение о восполнении» (§2.5),
       взыскание поднимается только по истечении срока восполнения либо при отказе. */
    if(it.lost || it.needReval){
      const reason = it.lost ? 'утрата' : 'ухудшение состояния';
      const rn = it.restoreNotice;
      if(!rn || !rn.issued){
        out.push({ type:'Требуется извещение о восполнении предмета', crit:'mid', obj:it.id, objLbl:`${it.id} · ${it.name}`,
          text:`Обследование зафиксировало: ${reason}. До обращения во взыскание залогодателю вручается извещение о восстановлении/замене предмета или досрочном исполнении (§2.5)`,
          act:'Оформить извещение о восполнении (установить срок восполнения)' });
      } else if(rn.resolved === 'восполнено'){
        /* ветка закрыта — триггеры сняты производно */
      } else if(rn.resolved === 'отказ' || isOverdue(rn.deadline)){
        const why = rn.resolved === 'отказ' ? 'залогодатель отказался восполнить предмет'
                                            : `срок восполнения ${rn.deadline} истёк без восполнения`;
        out.push({ type:'Недостаточность обеспечения → взыскание (обеспечение)', crit:'high', obj:it.id, objLbl:`${it.id} · ${it.name}`,
          text:`${reason[0].toUpperCase()+reason.slice(1)}: ${why}. Материалы — в Департамент правового обеспечения (понуждение) и отраслевые (принудительное взыскание, §2.5)`,
          act:'Замена предмета доп соглашением либо трек взыскания по обеспечению' });
      } else {
        out.push({ type:'Извещение о восполнении выдано — идёт срок', crit:'mid', obj:it.id, objLbl:`${it.id} · ${it.name}`,
          text:`${reason[0].toUpperCase()+reason.slice(1)}. Извещение ${rn.doc||''} от ${rn.date}, срок восполнения до ${rn.deadline}. До истечения срока взыскание не поднимается`,
          act:'Дождаться восполнения либо заменить предмет доп соглашением' });
      }
    }
    /* Р-4: по согласованному действию требуется переоценка за счёт залогодателя. */
    (it.consents||[]).filter(cn => cn.revalRequired && cn.decision==='положительное' && !cn.revalDone).forEach(cn =>
      out.push({ type:'Требуется переоценка после согласованного действия', crit:'mid', obj:it.id, objLbl:`${it.id} · ${it.name}`,
        text:`Выдано согласие на «${cn.action}»${cn.doc?` (${cn.doc})`:''}; после действия требуется переоценка предмета за счёт залогодателя (§8)`,
        act:'Провести переоценку (за счёт залогодателя)' }));
    /* Р-7: страховой полис техники-обеспечения истёк. */
    if(techPolicyExpired(it) && banRequired(it)) out.push({ type:'Страхование техники истекло', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Полис ${it.insured.policy} истёк ${it.insured.till} — техника-обеспечение должна быть застрахована (§3.4)`, act:'Направить фактор среднего кредитного риска в комитет (ПОР п.12 п.п.2)' });
    /* Р-46: страхование НЕтехнических страхуемых видов (недвижимость, имущественный комплекс,
       незавершённое строительство, товары в обороте). Прежде эта ось молчала: полис проверялся
       только у tech-видов, и незастрахованный склад/квартира уходили в обеспечение без сигнала. */
    if(!isTech(it) && banRequired(it)){
      if(insuredMissing(it)) out.push({ type:'Предмет залога не застрахован', crit:'mid',
        obj:it.id, objLbl:`${it.id} · ${it.name}`,
        text:`Вид «${it.kind}» подлежит страхованию (§3.4), полис не приложен`, act:'Истребовать страховой полис у залогодателя' });
      else if(policyExpired(it)) out.push({ type:'Страхование предмета залога истекло', crit:'mid',
        obj:it.id, objLbl:`${it.id} · ${it.name}`,
        text:`Полис ${it.insured.policy} истёк ${it.insured.till} — предмет обеспечения должен быть застрахован (§3.4)`,
        act:'Истребовать перевыпуск полиса у залогодателя' });
    }
    /* Р-48: отчёт об оценке старше APPRAISAL_VALID_MONTHS — залоговая стоимость в расчёте
       покрытия опирается на неактуальную оценочную. Поднимается только по обременённым
       предметам: свободный предмет никого не обеспечивает, и цифра ни на что не влияет. */
    if(apprStale(it) && banRequired(it)) out.push({ type:'Отчёт об оценке устарел', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Отчёт ${it.apprReport||'—'} от ${it.apprDate||'—'} годен до ${apprValidTill(it)} — залоговая стоимость считается по устаревшей оценке`,
      act:'Провести переоценку с новым отчётом оценщика' });
    /* Р-47: неполный обязательный комплект документов предмета (досье п.97). */
    const dsr = itemDossier(it);
    if(dsr.missing.length && banRequired(it)) out.push({ type:'Неполный комплект документов предмета', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Приложено ${dsr.met} из ${dsr.req}; отсутствуют: ${dsr.missing.join('; ')}`,
      act:'Догрузить недостающие документы во вкладке «Документы»' });
    /* Р-50 (ПОЛ §6.4 п.6): срок аренды истекает раньше срока кредита. Контроль существовал
       функцией (leaseCoversCredit), но не вызывался ниоткуда — обеспечение выбывало раньше
       погашения молча. */
    leaseWarnings(it).forEach(w => out.push({ type:'Срок аренды короче срока кредита', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`${w.msg}: аренда до ${it.leaseTill}, кредит ${w.creditId} до ${(credit(w.creditId)||{}).creditTill||'—'}`,
      act:'Решение комитета либо замена предмета доп соглашением' }));
    /* КП-4: триггер «Предшествующий залог третьего лица» снят вместе с журналом priorLiens.
       Обременённая в пользу третьего лица вещь в залог не принимается (§4.1, стоп-лист),
       поэтому в реестре её быть не может — сигналить не о чем. */
    /* КП-14: валюта оценки разошлась с валютой обеспечиваемого кредита. */
    if(ccyMismatches(it).length && banRequired(it)) out.push({ type:'Валюта оценки не совпадает с валютой кредита', crit:'high',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Предмет оценён в ${ccyLabel(itemCcy(it))}, обеспечивает кредиты в ${ccyMismatches(it).map(ccyLabel).join(', ')} — индекс обеспеченности по нему недостоверен`,
      act:'Переоценить предмет в валюте кредита либо заменить обеспечение' });
    /* ЗАЛОГ БЕЗ ЗАПРЕТА — дыра в обеспечении: залогодатель может продать предмет
       без нашего ведома. Это дефект оформления, а не формальность. */
    if(banMissing(it)) out.push({ type:'Залог без запрета на отчуждение', crit: banOverdue(it) ? 'high' : 'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Договор(ы) ${banContracts(it).join(', ')} зарегистрированы, запрет в «${organOf(it)}» не наложен. Срок: до ${banDeadline(it)}${banOverdue(it) ? ` · ПРОСРОЧЕН на ${Math.abs(daysLeft(banDeadline(it)))} дн.` : ''}`,
      act:`Наложить запрет на отчуждение в «${organOf(it)}»` });
    /* ЗАПРЕТ ЖИВ, а доли обнулились — имущество клиента заблокировано без основания. */
    if(banStale(it)) out.push({ type:'Требуется снятие запрета', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Доли по предмету обнулились (кредит погашен / предмет выведен), запрет ${it.ban.regNo} от ${it.ban.date} продолжает действовать в «${organOf(it)}»`,
      act:`Снять запрет в «${organOf(it)}»` });
    /* Р-20 (ПБК п.2.1): запрет наложен залогодателем и зарегистрирован (regNo есть),
       но отметка о запрете в оригиналах правоустанавливающих документов ещё не
       получена и не зафиксирована — оформление не завершено, риск не закрыт. */
    if(it.ban && !banFullyRegistered(it.ban)) out.push({ type:'Запрет наложен, отметка не получена', crit:'mid',
      obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Запрет ${it.ban.regNo} от ${it.ban.date} наложен залогодателем в «${organOf(it)}», но отметка о запрете в оригиналах правоустанавливающих документов не получена и не зафиксирована (ПБК п.2.1)`,
      act:'Получить и зафиксировать отметку о запрете в оригиналах правоустанавливающих документов' });
    /* Р-3: обследование планируется по матрице; банкрот / не-обеспечивающий предмет → nextSurvey=null, авто-просрочка не поднимается.
       Р-22 (ПОР п.10): интервал в триггере — ДЕЙСТВУЮЩИЙ (может быть ужесточён категорией
       риска); если он отличается от нормативного матричного, показываем оба. */
    const ns = nextSurvey(it);
    if(ns && isOverdue(ns)){ const s = borrowerSolvency(it);
      const rc = itemRiskCategory(it), eff = effectiveInterval(s.group, movableOf(it), rc, RISK_TIGHTENING_APPROVAL);
      const intervalTxt = (eff != null && eff !== s.interval)
        ? `${s.interval} мес. по матрице §2.3, действующий — ${eff} мес. (ПОР п.10, категория риска «${rc}»)`
        : `${s.interval} мес.`;
      out.push({ type:'Просрочен контроль: обследование', crit:'mid', obj:it.id, objLbl:`${it.id} · ${it.name}`,
        text:`Плановая дата ${ns} (просрочка ${Math.abs(daysLeft(ns))} дн.). Интервал ${intervalTxt} — группа «${s.group}» × ${movableOf(it)?'движимое':'недвижимое'}`,
        act:'Провести обследование' });
    }
    /* ПЗ-Д8: переоценка поднимается ТОЛЬКО по обременённым предметам — та же охрана
       banRequired, что у соседей выше (Р-47, Р-48, Р-49) и внутри nextSurvey. Без неё
       предмет, освобождённый три года назад, оставался просрочен вечно: он никого не
       обеспечивает, его залоговая ни на что не влияет, а лента мониторинга и рабочий
       слой TRIG_WORK засорялись строками, которые нельзя закрыть работой. */
    if(revalOverdue(it)) out.push({ type:'Просрочен контроль: переоценка', crit:'mid', obj:it.id,
      objLbl:`${it.id} · ${it.name}`, text:`Плановая дата ${nextReval(it)} (просрочка ${Math.abs(daysLeft(nextReval(it)))} дн. · интервал вне положения)`, act:'Провести переоценку' });
    /* Р-19 (ПОЛ §2.1): историческая запись прежней системы — залоговая была установлена выше
       расчётной по нормам ПРЕЖНЕЙ системы (см. П-005). По действующему положению такой override
       больше недопустим ни для одной роли (overrideAllowed) — запись требует переоценки. */
    if(it.legacy) out.push({ type:'Историческая запись прежней системы', crit:'mid', obj:it.id, objLbl:`${it.id} · ${it.name}`,
      text:`Залоговая стоимость (${fmt(pledgeValue(it))}) установлена выше расчётной (${fmt(calcPledge(it))}) по нормам прежней системы — по действующему положению (ПОЛ §2.1) такой override недопустим`,
      act:'Провести переоценку по действующему положению' });
  });
  /* Р-35 (ПОР): входящая очередь комитета по администрированию бюджетных кредитов —
     договоры «На рассмотрении комиссии» ждут решения. Критичность средняя, после
     COMMITTEE_SLA дней ожидания (от commissionSince) — высокая. Так комитет видит
     свою очередь и просроченные заявки, не зная номера договора наизусть. */
  CONTRACTS.filter(c=>c.status==='На рассмотрении комиссии').forEach(c => {
    const bad = gateCheck(c).rows.filter(r=>!r.ok);
    const waited = c.commissionSince ? Math.max(0, -daysLeft(c.commissionSince)) : null;
    const overSla = waited != null && waited > COMMITTEE_SLA;
    out.push({
      type:'Ожидает решения комитета', crit: overSla ? 'high' : 'mid', obj:c.id, objLbl:`${c.id} · ${clientName(c.inn)}`,
      text:`Недообеспечение (${bad.map(r=>`${r.id} — ${pct(r.ratio)} при пороге ${pct(r.req)} (${r.source})`).join('; ')}) — договор ждёт решения комитета${c.commissionSince ? ` с ${c.commissionSince}` : ''}${waited != null ? ` (${waited} дн.${overSla ? `, просрочен SLA ${COMMITTEE_SLA} дн.` : ''})` : ''}`,
      act:'Решение комитета: вернуть на доработку либо допустить недообеспечение с обоснованием' }); });
  /* Р-19 (ПОЛ §11): маршрут кредитно-залоговых документов не дошёл до архива дольше
     DOC_ROUTE_DAYS дней после регистрации договора. */
  CONTRACTS.filter(c => docRouteIncomplete(c, DOC_ROUTE_DAYS)).forEach(c => out.push({
    type:'Маршрут кредитно-залоговых документов не завершён', crit:'mid', obj:c.id, objLbl:`${c.id} · ${clientName(c.inn)}`,
    text:`Договор зарегистрирован ${c.date}, маршрут (ПОЛ §11.1–11.2) не дошёл до архивного шага более ${DOC_ROUTE_DAYS} дней`,
    act:'Завершить движение кредитно-залоговых документов до архивного шага' }));
  return out;
}

   вычисляемый оверлей просрочек: обновляем реестр, открытую карточку и ленту триггеров. */
function setStandDate(dmy){
  if(!isDate(dmy)) return false;

  if(inp) inp.value = d2iso(dmy);

/* Р-34: единое правило видимости действий. Реестровая «Создать» при отсутствии права
   не рендерится (btnNew скрывается в renderList); карточное действие — рендерится disabled
   с title, чтобы состав действий оставался виден роли-наблюдателю. `blocked` — вторая ось:
   право есть, но гейт/статус не пускает (тогда свой blockedTitle). */
function actionBtn(permOk, label, handler, opts){
  opts = opts || {};
  const cls = opts.cls || 'btn-tint btn-sm';
  const blocked = Boolean(opts.blocked);
  const disabled = !permOk || blocked;
  const title = !permOk ? `Роль «${role}» не имеет права на это действие`
              : (blocked ? (opts.blockedTitle || '') : '');
  return `<button class="btn ${cls}"${disabled ? '' : ` onclick="${handler}"`}${disabled ? ' disabled' : ''}${title ? ` title="${esc(title)}"` : ''}>${label}</button>`;
}

   момент расчёта) продолжают строить опции из строк. */
const FILTER_OPTS = {
  contracts: {
    /* Порядок — жизненного цикла (CTR_RANK), не алфавита. «Аннулирован» появляется в списке
       только при включённом переключателе охвата (ДГ-8): иначе выбор этой опции давал бы
       гарантированные ноль строк — условие есть, показать по нему нечего. */
    status: () => ['Оформляется','На рассмотрении комиссии','Зарегистрирован','Закрыт']
      .concat(showCancelledContracts ? [CANCELLED] : []),
    markCodes: () => MARK_CODES,
    gate: () => ['пройден','не пройден','не оценивается'],
  },
};
const filterOpts = (r, key) => { const f = (FILTER_OPTS[r] || {})[key]; return f ? f() : null; };

function regRows(){
  return reg==='items' ? rowsItems() : reg==='contracts' ? rowsContracts()
       : reg==='sureties' ? rowsSureties() : rowsMonitor();
}
/* ПЗ-5: денежные поля из поискового индекса исключены. Пользователь видит в колонке
   `400 000,00` (с неразрывным пробелом из fmt), вводит `400 000` — и не находит: в
   индексе лежит сырое `400000`. Поиск по сумме и по существу сомнителен — это диапазон,
   а не подстрока (фильтр «от/до» отложен до появления валюты, ПЗ-13).
   Заодно исключены СЛУЖЕБНЫЕ ключи сортировки (idn/banRank/secures): это голые числа,
   по которым запрос «2» совпал бы с половиной реестра. Текстовые дубли этих полей
   (id, ban) в индексе остаются — по «П-005» и по «не наложен» поиск работает. */
const SEARCH_SKIP = { items:['pledge','idn','banRank','secures'],
  /* ДГ-9: у договоров те же служебные числа — ранг статуса, нормализованная дата, счётчики
     предметов/кредитов/отметок/доп. соглашений и сам индекс обеспеченности. Запрос «2»
     совпал бы с половиной реестра. Текстовые дубли (dateTxt, markCodes, status) остаются —
     по «18.09.2025» и по «отказ в замене» поиск работает. Вердикт гейта (`gate`) исключён:
     значения «пройден»/«не пройден» — подстроки друг друга, поиск «пройден» вернул бы всё.
     ДГ-16: `secured` (сумма обеспечения) исключена по правилу ПЗ-5 — пользователь видит
     `348 000` с неразрывным пробелом из fmt, вводит `348 000` и не находит: в индексе лежит
     сырое `348000`. Поиск по сумме — это диапазон, а не подстрока. */
  contracts:['dateN','stRank','marks','mc','items','credits','add','gate','secured'],
  monitor:[], sureties:[] };
function filterRows(rows){
  const f = activeFilter[reg] || {};
  /* Р-38: общая строка поиска — по всем текстовым значениям строки (объединённый сорт-индекс).
     Применяется до структурных фильтров, независимо от них. */
  const q = (quickSearch[reg] || '').trim().toLowerCase();
  const skip = SEARCH_SKIP[reg] || [];
  return rows.filter(r => {
    if(q){
      const hay = Object.entries(r.sort).filter(([k]) => !skip.includes(k))
        .map(([,v]) => String(v ?? '')).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return (FILTERS[reg]||[]).every(fld => {
      const fq = f[fld.key]; if(!fq) return true;
      /* ДГ-7: диапазон дат. Значение хранится в ISO (как его отдаёт input[type=date]),
         сравнивается с нормализованным числовым ключом строки (`on`), а не со строкой
         `дд.мм.гггг`. Строка без даты в диапазон не попадает ни при какой границе —
         «не подписан» это не «раньше всех». */
      if(fld.type === 'date'){
        const bound = dnum(iso2d(fq)); if(!bound) return true;
        const v = r.sort[fld.on]; if(!v) return false;
        return fld.cmp === 'gte' ? v >= bound : v <= bound;
      }
      /* ДГ-4: отметки — МНОЖЕСТВО на строке, отбор идёт по вхождению кода в него. */
      if(fld.type === 'in') return (r.sort[fld.key] || []).includes(fq);
      const v = String(r.sort[fld.key] ?? '');
      return fld.type==='select' ? v===fq : v.toLowerCase().includes(fq.toLowerCase());
    });
  });
}
/* ДГ-7: поиск живой, но с задержкой. Перерисовка идёт на КАЖДОЕ нажатие и пересчитывает
   производные всей выборки (gateCheck → coverage по каждому кредиту каждого договора);
   на 39 записях это незаметно, на реальном объёме — нет. Дебаунс держит отзывчивость ввода
   и снимает вопрос «нужна ли кнопка Применить» (ДГ-7: не нужна, см. снятую «Обновить»).
   quickSearchNow — синхронный путь для тестов и для resetFilter. */
let _qsTimer = null;
function quickSearchNow(v){ quickSearch[reg] = v; curPage = 1; renderList(); }
function onQuickSearch(v){
  clearTimeout(_qsTimer);
  const r = reg;                                  // реестр мог смениться, пока ждали
  _qsTimer = setTimeout(() => { if(reg === r) quickSearchNow(v); }, 200);
}
function onFilter(key, val){
  const f = activeFilter[reg];
  if(val && val.trim()) f[key] = val.trim(); else delete f[key];
  curPage = 1;
  renderList();
}
/* ДГ-8: переключатель охвата «показывать аннулированные» здесь НЕ сбрасывается — и по той же
   причине не входит в счёт активных условий (ПЗ-Д1): это не условие отбора, а граница
   выборки, у которой есть собственная подпись со счётчиком скрытого. Сбросить условия и
   потерять при этом видимость аннулированных — не то, о чём просит кнопка «Сбросить». */
function resetFilter(){ clearTimeout(_qsTimer); activeFilter[reg] = {}; quickSearch[reg] = ''; curPage = 1; renderFilterPanel(); renderList(); }
function renderFilterPanel(){
  filterPanelReg = reg;
  const cfg = FILTERS[reg] || [], f = activeFilter[reg] || {}, all = regRows();
  document.getElementById('jfPanel').innerHTML = cfg.map(fld => {
    let ctl;
    if(fld.type === 'date'){
      ctl = `<input type="date" value="${esc(f[fld.key]||'')}" onchange="onFilter('${fld.key}',this.value)">`;
    } else if(fld.type === 'select' || fld.type === 'in'){
      /* ДГ-Д4: сначала объявленный домен, и только при его отсутствии — значения из строк.
         Для множественного поля (`in`) строки дают МАССИВЫ — их надо расплющить, иначе в
         опцию попадёт склейка «допуск <порога,отказ в замене». */
      const opts = filterOpts(reg, fld.key) || [...new Set(all.flatMap(r => {
          const v = r.sort[fld.key];
          return (Array.isArray(v) ? v : [v]).map(x => String(x ?? ''));
        }).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));
      ctl = `<select onchange="onFilter('${fld.key}',this.value)"><option value=""></option>`
        + opts.map(o=>`<option${f[fld.key]===o?' selected':''}>${esc(o)}</option>`).join('') + `</select>`;
    } else {
      ctl = `<input type="text" value="${f[fld.key]?esc(f[fld.key]):''}" oninput="onFilter('${fld.key}',this.value)">`;
    }
    return `<div class="jf-row"><span class="jf-label" title="${esc(fld.label)}">${esc(fld.label)}</span>`
      + `<span class="jf-ctl">${ctl}</span></div>`;
  }).join('');
  renderFilterSummary();
}
/* ПЗ-Д1: ОДНА точка счёта активных условий. Раньше renderFilterPanel считал только
   структурные поля, renderList прибавлял быстрый поиск и перетирал подпись последним —
   два разных ответа на один вопрос, побеждал тот, что нарисован позже. Поиск считаем:
   resetFilter чистит его вместе с полями, значит для пользователя это одно «сбросить». */
const activeConditions = () =>
  Object.keys(activeFilter[reg] || {}).length + ((quickSearch[reg] || '').trim() ? 1 : 0);
function renderFilterSummary(){
  const n = activeConditions(), el = document.getElementById('jfSummary');
  if(el) el.textContent = n ? `Фильтр · ${n} ${plural(n,'условие','условия','условий')}` : 'Фильтр';
}

function rowsItems(){

    const idx = [it.ident, it.legalDoc, ...Object.values(it.details||{})].filter(Boolean).join(' ');

      cells:[ `<span class="idcell">${esc(it.id)}</span>`,

        securesCell(it) ] };

/* ============================================================
   ДГ-1…ДГ-14: ЯЧЕЙКИ РЕЕСТРА ЗАЛОГОВЫХ ДОГОВОРОВ.
   Строители вынесены из rowsContracts по образцу волны ПЗ: у каждого признака ровно один
   источник, а профиль выгрузки (CSV_PROFILES.contracts) работает с ЗАПИСЬЮ и читает те же
   производные, а не срезает теги с готовой разметки.
   РАМКА: реестр «Залоговые договоры» — СПРАВОЧНИК. Отвечает на «какие у нас договоры, с кем,
   когда подписаны, в каком состоянии и держат ли они порог обеспечения». Рабочая очередь
   просрочек живёт только в «Мониторинге» (Р-41), очередь комитета — там же (Р-35).
   ============================================================ */
/* ДГ-3: ранг жизненного цикла. Алфавит по строке статуса давал порядок «Аннулирован ·
   Зарегистрирован · Закрыт · На рассмотрении комиссии · Оформляется» — к жизни договора
   отношения не имеющий: терминальное состояние вставало первым, действующее — вторым. */
const CTR_RANK = { 'Оформляется':0, 'На рассмотрении комиссии':1, 'Зарегистрирован':2, 'Закрыт':3, 'Аннулирован':4 };
/* ДГ-3: пять состояний — пять различимых пилюль. Было три цвета на пять состояний, причём

   (штатный шаг маршрута, Р-35) читалась как нарушение. */
const CTR_PILL = { 'Оформляется':'neutral', 'На рассмотрении комиссии':'info',
                   'Зарегистрирован':'low', 'Закрыт':'done', 'Аннулирован':'void' };
/* ДГ-Д1: нормализованный ключ даты. Строковый `дд.мм.гггг` сортируется посимвольно и ставит

   создания (createdAt), чтобы черновики упорядочивались между собой, а не порядком вставки. */
const ctrDate = c => c.date || c.createdAt || '';
const dnum = s => isDate(s) ? +d2n(s) : 0;
/* ДГ-2: номер — ССЫЛКА (одиночный клик открывает карточку). Раньше единственным путём внутрь
   был двойной клик по строке. `id` ушёл подстрокой: как колонка «№» он дублировал соседний
   «Договор», но сам по себе нужен — на него ссылаются журналы, триггеры и печатные формы.
   Черновик называется черновиком, а не прочерком: прочерк читался как «данных нет».
   ДГ-18: третьей строкой — полоса отметок (см. marksStrip). Своей колонки они не заслуживали
   (150px под «—» на большинстве строк), но и молча пропасть не могли: «допуск <порога» и
   «отказ в замене» — единственные следы решений комитета в реестре. Строка появляется только

function contractNoCell(c){
  const tip = c.no ? `${c.no} · ${c.id}` : `${c.id} · номер и дата присваиваются при регистрации`;
  return `<span class="cell2" title="${esc(tip)}">`
    + `<span class="c2-main"><span class="rowlink" onclick="event.stopPropagation();openCard('contract','${c.id}')">`

function contractDateCell(c){

/* ДГ-Д2: залогодатель живёт на ПРЕДМЕТЕ (ITEMS[].pledger), не на договоре, поэтому колонка
   «Заёмщик» была единственной стороной в реестре — а имущественный залог третьего лица (§5)
   штатная конструкция. Договор Д-003 заключён с КФХ «Ак-Дан», предмет П-004 принадлежит
   Осмонову Б.Т.: по «Осмонов» реестр договоров не находил ничего. Число залогодателей у
   договора = число РАЗНЫХ собственников среди отнесённых предметов. */
function contractPledgers(c){
  return [...new Set(c.allocs.map(a => (item(a.item)||{}).pledger).filter(Boolean))]
    .filter(inn => inn !== c.inn);
}
function partiesCell(c){
  const third = contractPledgers(c);
  const tip = [`заёмщик: ${clientName(c.inn)}`,
    third.length ? `залогодател${third.length>1?'и':'ь'} — третье лицо (§5): ${third.map(clientName).join(', ')}`
                 : 'залогодатель — сам заёмщик'].join(' · ');
  return `<span class="cell2" title="${esc(tip)}">`
    + `<span class="c2-main">${esc(clientName(c.inn))}</span>`
    + (third.length ? `<span class="c2-sub">залогодатель: ${esc(third.map(clientName).join(', '))}</span>` : '')
    + `</span>`;
}
/* ДГ-4: в «Статусе» остаётся ТОЛЬКО жизненный цикл. Пилюли «допуск <порога» и «отказ в замене»
   стояли в той же ячейке и читались как продолжение статуса, хотя это перпендикулярная ось:
   договор может быть зарегистрирован И допущен ниже порога одновременно. */
function contractStatusCell(c){
  const tip = c.status==='На рассмотрении комиссии' && c.commissionSince
    ? `в очереди комитета по администрированию бюджетных кредитов с ${c.commissionSince}` : '';
  return `<span class="pill ${CTR_PILL[c.status]||'neutral'}"${tip?` title="${esc(tip)}"`:''}>${esc(c.status)}</span>`;
