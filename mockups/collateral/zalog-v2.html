<title>Обеспечение по бюджетным кредитам · АСУБК (v2)</title>
<!--
  ПРОТОТИП v2 (single-file). Модуль «Обеспечение по бюджетным кредитам».
  Спека: ASUBK-zalog-model-v2.md. Прототип v1 (zalog.html) выведен из обращения —
  его дефекты перечислены в §12 спеки и здесь не воспроизводятся.

  ЧТО ЗДЕСЬ ПРИНЦИПИАЛЬНО ДРУГОЕ, ЧЕМ В v1

  1. «Обеспечение» — надсущность (§2.1). Залог, гарантия и поручительство — подтипы
     одной сущности AGREEMENTS с полем type. Предметы есть только у залога;
     гарантия и поручительство несут сумму/лимит на самом договоре.

  2. Вещь — три слоя (§2.2): ASSETS (физика) · TITLES (право) · ENCUMBRANCES (обременения).
     Способ хранения — реквизит АКТИВА, не договора.

  3. Реестр активов общий (§2.3). Актив живёт вне договора, договор его привязывает.

  4. Два уровня связи с кредитом (§3.1): юридическое обременение (ENCUMBRANCES, меняется
     только документом) и расчётное распределение (ALLOC, веса). Никогда не смешиваются.

  5. Веса, не суммы (§3.2). Σ весов по активу ≤ 1. Вклад = вес × стоимость на дату.
     Переоценка вниз роняет ВКЛАД, но не трогает веса. Обрезки типа effShare нет.

  6. Две базы покрытия (§4.1): coverage(credit,'origination') против суммы кредита —
     это гейт; coverage(credit,'current') против остатка долга — это мониторинг.
     Одна формула на два вопроса — дефект v1 (Д-8).

  7. Один индекс, коэффициент по подтипу (§4.2). Поручительство входит через
     PARAMS.k.поручительство; значение 0 = «не считается покрытием». Это настройка.

  8. Индекс не хранится (§4.3). SNAPSHOTS — архив, движок его не читает.

  9. Четыре ортогональные оси состояния (§5.1), все выводятся: стадия договора ·
     правовое состояние актива · физическое состояние · расчётная задействованность.

 10. Правила — данные (§6.1). RULES: условие · уровень · кто вправе допустить ·
     пункт норматива. Ни одного порога в коде, ни одного текста правила в разметке.
     Гейт — свёртка gate(). UI печатает формулировку из той же записи.

 11. Единый журнал допусков ADMISSIONS (§6.3) — один формат на весь контур.

 12. Версии параметров PARAMS_VERSIONS + снимок применённого на решении (§6.2).

 13. Внешние факты не хранятся (§9): остаток долга берётся через EXT.debtBalance(),
     категория риска и группа платёжеспособности — read-only зеркала.

  Нормативные константы — только в PARAMS/RULES, каждая со ссылкой на пункт (§1 спеки).
  Оговорка Н-21: тексты ПОЛ №22 / ПОР / ПБК в репозитории отсутствуют, числа подлежат
  разовой сверке с бумагой (О-1) до реализации.
-->

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
/* ==========================================================================
   ЧАСТЬ 1. ПАРАМЕТРЫ И ПРАВИЛА — ДАННЫЕ, НЕ КОД (§6.1, §6.2 спеки)
   ========================================================================== */
/* Версии параметров (§6.2). Решение хранит id версии — изменение норматива
   в будущем не переписывает историю уже принятых решений. */
const PARAMS_VERSIONS = [
  { id:'v2025-12', from:'2025-12-12', note:'ПОЛ №22 от 12.12.2025, ред. 1',
    p:{
      /* Н-1 — пороги. Порог не константа: выбирается по составу обеспечения. */
      coverLiquid:1.20, coverMovableIlliquid:1.50, liquidShareMin:0.80,
      /* Н-3 — банковская гарантия. */
      guaranteeSameCcy:1.00, guaranteeOtherCcy:1.20,
      /* Н-5 — возраст техники. */
      techAgeCIS:15, techAgeFar:20,
      /* Н-4 — предел физического износа. */
      wearLimit:70,
      /* §4.2 — коэффициенты вклада по подтипу обеспечения.
         k.поручительство = 0 → поручительство не считается покрытием. Это НАСТРОЙКА. */
      k:{ 'залог':1.0, 'гарантия':1.0, 'поручительство':0 },
      /* Н-17 — возрастные границы поручителя. */
      guarantorAgeMin:18, guarantorAgeMax:70,
      /* Н-6 — матрица периодичности обследования, месяцев. */
      survey:{ 'Платёжеспособная':{ 'Недвижимое':36, 'Движимое':24 },
               'Неплатёжеспособная':{ 'Недвижимое':24, 'Движимое':12 },
               'Банкрот':{ 'Недвижимое':null, 'Движимое':null } },
      /* Н-7 — ужесточение по категории риска, только с согласованием зампреда. */
      riskTighten:{ 'Стандартный':1, 'Средний':0.75, 'Высокий':0.5 },
      /* Внутренний срок, в положении отсутствует — источник помечен как внутренний. */
      banDeadlineDays:30, appraisalValidMonths:12,
    } },
];
const PV = PARAMS_VERSIONS[PARAMS_VERSIONS.length-1];   // действующая версия
const P  = PV.p;

/* --- Справочник видов активов со схемой деталей (§2.4).
   Схема задаёт СОСТАВ полей вида. Поисковые реквизиты (search) вынесены отдельно —
   они типизированы и индексируются, по ним же ловятся дубли при миграции (§11). */
const KINDS = [
  { id:'realty',   name:'Недвижимость',          movable:false, liquid:true,  k:0.70,
    search:['Кадастровый номер'], schema:[['area','Площадь, м²','num'],['floors','Этажность','num'],['built','Год постройки','num']],
    insurance:true },
  { id:'complex',  name:'Имущественный комплекс', movable:false, liquid:true,  k:0.65,
    search:['Кадастровый номер'], schema:[['area','Площадь, м²','num'],['objects','Кол-во объектов','num']],
    insurance:true },
  { id:'vehicle',  name:'Транспортное средство',  movable:true,  liquid:true,  k:0.50,
    search:['VIN','Госномер'], schema:[['year','Год выпуска','num'],['origin','Происхождение','enum:СНГ|Дальнее зарубежье'],['mileage','Пробег, км','num']],
    tech:true, insurance:true },
  { id:'equip',    name:'Оборудование',           movable:true,  liquid:false, k:0.50,
    search:['Инвентарный номер'], schema:[['year','Год выпуска','num'],['origin','Происхождение','enum:СНГ|Дальнее зарубежье'],['wear','Физический износ, %','num']],
    tech:true, insurance:true },
  { id:'goods',    name:'Товары в обороте',       movable:true,  liquid:false, k:0.40,
    search:[], schema:[['nomen','Номенклатура','str'],['store','Место хранения','str']], insurance:true },
  { id:'livestock',name:'Скот / поголовье',       movable:true,  liquid:false, k:0.30,
    search:[], schema:[['head','Голов','num']], prohibited:'Н-4', legacyOnly:true },
  { id:'agroland', name:'Земли с/х назначения',   movable:false, liquid:false, k:0.30,
    search:['Кадастровый номер'], schema:[['area','Площадь, га','num']], prohibited:'Н-4', hardBlock:true, legacyOnly:true },
  { id:'other',    name:'Прочее (вид не определён)', movable:true, liquid:false, k:0.30,
    search:[], schema:[], legacyOnly:true, undefinedKind:true },
];
const kindById = id => KINDS.find(k=>k.id===id) || KINDS[KINDS.length-1];

/* --- Классификатор оснований снятия запрета (Н-10, 11 позиций). */
const RELEASE_GROUNDS = [
  { id:'r1',  name:'Полное погашение кредита', needsRecon:true },

/* Дата в локальных компонентах: toISOString() сдвигает дату на часовой пояс
   и превращает 26-е в 25-е — для дат сроков и актов это недопустимо. */
const ISO = d => { const x = (d instanceof Date ? d : new Date(d));
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

const money = (v,ccy) => (v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(v)) + (ccy?' '+ccy:''));
const pct   = v => (v==null?'—':(v*100).toFixed(1).replace('.',',')+'%');
const monthsBetween = (a,b)=>{ const x=new Date(a),y=new Date(b); return (y.getFullYear()-x.getFullYear())*12 + (y.getMonth()-x.getMonth()); };

  if(y.getMonth()<x.getMonth() || (y.getMonth()===x.getMonth() && y.getDate()<x.getDate())) n--; return n; };

/* --- стоимость. Залоговая = оценочная × k вида. Только понижение (Н-12). --- */
function lastVal(assetId, onDate){
  const d = onDate || ISO(TODAY);
  return VALUATIONS.filter(v=>v.assetId===assetId && v.date<=d).sort((a,b)=>a.date<b.date?1:-1)[0] || null;
}
function pledgeValue(assetId, onDate){
  const v = lastVal(assetId,onDate); if(!v) return 0;
  const k = kindById(assetById(assetId).kindId).k;
  const calc = v.appraisal * k;
  return v.override != null ? Math.min(v.override, calc) : calc;   // подъём выше расчётной невозможен
}
const weightSum = assetId => allocOf(assetId).filter(a=>!closed(a)).reduce((s,a)=>s+a.weight,0);

/* --- вклад в покрытие. Вклад = вес × стоимость на дату (§3.2).
       Переоценка вниз роняет ВКЛАД, веса не трогает — обрезки effShare нет. --- */
function pledgeParts(creditId, onDate){
  return allocOfCredit(creditId).map(a=>{
    const asset = assetById(a.assetId);
    const agr   = agrById(a.agreementId);
    const val   = pledgeValue(a.assetId, onDate);
    return { alloc:a, asset, agr, value:val, contrib: a.weight * val,
             liquid: kindById(asset.kindId).liquid,
             legalSum: a.legalSum != null ? a.legalSum : a.weight * (a.baseValue || val),
             counted: agr && agr.stage==='зарегистрирован' && asset.phys!=='утрачен' && a.weight>0 };
  });
}
function guaranteeParts(creditId){
  return AGREEMENTS.filter(g=>g.type==='гарантия' && g.creditId===creditId).map(g=>{
    const c = creditById(creditId);
    const need = g.ccy===c.ccy ? P.guaranteeSameCcy : P.guaranteeOtherCcy;   // Н-3
    const rate = g.ccy==='USD' ? 89.5 : 1;                                    // курс — реквизит, §10
    const kgs  = g.sum * rate;
    return { agr:g, need, rate, kgs, effective: kgs / need,
             counted: g.stage==='зарегистрирован' };
  });
}
function suretyParts(creditId){
  return AGREEMENTS.filter(g=>g.type==='поручительство' && g.creditId===creditId).map(g=>({
    agr:g, limit:g.sum, counted: g.stage==='зарегистрирован' }));
}

/* --- требуемый порог. Функция состава, перебивается решением КМ (Н-1, Н-2). --- */
function requiredCover(creditId, onDate){
  const c = creditById(creditId);
  if(c.kmRequired && c.kmDecision) return { req:c.kmDecision.ratio, source:'решение Кабинета Министров '+c.kmDecision.no+' (Н-2)' };
  const parts = pledgeParts(creditId,onDate).filter(p=>p.counted);
  const anyMovableIlliquid = parts.some(p=>{ const k=kindById(p.asset.kindId); return k.movable && !k.liquid; });
  if(anyMovableIlliquid) return { req:P.coverMovableIlliquid, source:'движимое неликвидное в составе — порог '+pct(P.coverMovableIlliquid)+' (Н-1 · Прил.1 §2.4)' };
  return { req:P.coverLiquid, source:'ликвидное обеспечение — порог '+pct(P.coverLiquid)+' (Н-1 · Прил.1 §2.3)' };
}

/* --- ДВЕ БАЗЫ (§4.1). base:'origination' — гейт; base:'current' — мониторинг. --- */
function coverage(creditId, base, onDate){
  const c = creditById(creditId);
  const date = onDate || ISO(TODAY);
  const denom = base==='current' ? EXT.debtBalance(creditId,date) : c.amount;
  const pp = pledgeParts(creditId,date).filter(p=>p.counted);
  const gp = guaranteeParts(creditId).filter(p=>p.counted);
  const sp = suretyParts(creditId).filter(p=>p.counted);

  /* Один индекс, коэффициент по подтипу (§4.2). Слагаемые считаются одинаково:
     каждое даёт вклад в числителе, знаменатель общий — см. denom выше. */
  const numPledge = pp.reduce((s,p)=>s+p.contrib,0)   * P.k['залог'];
  const numGuar   = gp.reduce((s,p)=>s+p.effective,0) * P.k['гарантия'];      // effective = сумма ÷ требуемый запас (Н-3)
  const numSurety = sp.reduce((s,p)=>s+p.limit,0)     * P.k['поручительство']; // k=0 → не покрывает
  const num = numPledge + numGuar + numSurety;

  const { req, source } = requiredCover(creditId,date);
  const liquidVal = pp.filter(p=>p.liquid).reduce((s,p)=>s+p.contrib,0);
  const liquidRuleApplies = req === P.coverMovableIlliquid;

  return {
    base, denom, index: denom? num/denom : 0, num, req, source,
    parts:{ pledge:pp, guarantee:gp, surety:sp },
    numPledge, numGuar, numSurety,
    liquidShare: denom? liquidVal/denom : 0, liquidRuleApplies,
    ok: denom ? (num/denom) >= req && !(liquidRuleApplies && (liquidVal/denom) < P.liquidShareMin) : false,
  };
}

/* --- ГЕЙТ — свёртка правил (§6.1). Один и тот же вызов питает и UI, и запись. --- */
function admissionFor(ruleId, objectId){
  return ADMISSIONS.filter(a=>a.ruleId===ruleId && a.object===objectId)
                   .sort((a,b)=>a.date<b.date?1:-1)[0] || null;
}
function gate(scope, ctx, objectId){
  const res = rulesFor(scope).map(r=>{
    let fired=false, detail='';
    try{ fired = !!r.when(ctx); if(fired && r.detail) detail = r.detail(ctx); }
    catch(e){ fired=false; }
    const adm = fired && r.admit ? admissionFor(r.id, objectId) : null;
    return { rule:r, fired, detail, admission:adm,
             blocking: fired && r.level==='block' && !adm };
  });
  const blocked = res.filter(x=>x.blocking);
  return { results:res, blocked, verdict: blocked.length? 'нельзя'
           : res.some(x=>x.fired && x.admission) ? 'допущено'
           : res.some(x=>x.fired) ? 'с предупреждениями' : 'можно' };
}

/* --- ЧЕТЫРЕ ОРТОГОНАЛЬНЫЕ ОСИ (§5.1). Все выводятся, ни одна не редактируется. --- */
function axesOf(assetId){
  const a = assetById(assetId);
  const enc = encOf(assetId).filter(active);
  const ours = enc.filter(e=>e.type==='наш залог').length>0;
  const ban  = enc.filter(e=>e.type==='наш запрет')[0];
  const third= enc.filter(e=>['арест суда','налоговый арест','чужой залог'].includes(e.type));
  let legal = 'свободен';
  if(third.length) legal = 'обременён третьими: '+third.map(e=>e.type).join(', ');
  else if(ours && ban) legal = ban.markInOriginals ? 'обременён нами, запрет с отметкой' : 'обременён нами, отметка не получена';
  else if(ours) legal = 'обременён нами, запрета нет';
  const w = weightSum(assetId);
  const alloc = w<=0 ? 'не отнесён' : w>=0.999 ? 'отнесён полностью' : 'отнесён частично ('+pct(w)+')';
  return {
    'Стадия договоров': AGREEMENTS.filter(g=>(g.items||[]).includes(assetId)).map(g=>g.no+': '+g.stage).join('; ') || '—',
    'Правовое состояние': legal,
    'Физическое состояние': a.phys,
    'Расчётная задействованность': alloc,
  };
}

/* --- периодичность обследования (Н-6 + Н-7) --- */
function surveyInterval(assetId){
  const al = allocOf(assetId).filter(a=>!closed(a));
  if(!al.length) return { months:null, note:'предмет не отнесён ни к одному кредиту' };
  const borrowers = al.map(a=>creditById(a.creditId).borrowerId);
  const groups = borrowers.map(EXT.payGroup);
  const worst = groups.includes('Банкрот') ? 'Банкрот'
              : groups.includes('Неплатёжеспособная') ? 'Неплатёжеспособная' : 'Платёжеспособная';
  const movable = kindById(assetById(assetId).kindId).movable ? 'Движимое' : 'Недвижимое';
  const base = P.survey[worst][movable];
  if(base==null) return { months:null, note:'банкрот — по договору со спецадминистратором (Н-6)' };
  const risks = al.map(a=>EXT.riskCat(a.creditId));
  const worstRisk = risks.includes('Высокий')?'Высокий':risks.includes('Средний')?'Средний':'Стандартный';
  const tight = P.riskTighten[worstRisk];
  return { months:base, tightened: tight<1 ? Math.round(base*tight) : null, worstRisk, worst, movable,
    note: tight<1 ? 'ужесточение до '+Math.round(base*tight)+' мес. применяется ТОЛЬКО при согласовании зампреда (Н-7)' : '' };
}
function surveyDue(assetId){
  const iv = surveyInterval(assetId); if(!iv.months) return null;
  const last = SURVEYS.filter(s=>s.assetId===assetId && s.outcome!=='не состоялось')
                      .sort((a,b)=>a.date<b.date?1:-1)[0];
  const from = last ? last.date : (AGREEMENTS.find(g=>(g.items||[]).includes(assetId))||{}).date;
  if(!from) return null;
  const d = new Date(from); d.setMonth(d.getMonth()+iv.months);
  return { due:ISO(d), overdue: ISO(d) < ISO(TODAY), from, lastOutcome: last? last.outcome : 'не проводилось' };
}

/* --- дефекты: вычисляемый список, не хранимые флаги (§5.1) --- */
function defects(){
  const out = [];
  ASSETS.forEach(a=>{
    const enc = encOf(a.id).filter(active);
    const ours = enc.some(e=>e.type==='наш залог');
    const ban  = enc.find(e=>e.type==='наш запрет');
    if(ours && !ban) out.push({ sev:'err', obj:a.id, t:'Залог без запрета на отчуждение', d:a.name, src:'Н-11 · ПБК п.2.1' });
    if(ban && !ban.markInOriginals) out.push({ sev:'warn', obj:a.id, t:'Запрет наложен, отметка в оригиналах не получена', d:a.name, src:'Н-11 · ПБК п.2.1' });
    if(weightSum(a.id) > 1.0000001) out.push({ sev:'err', obj:a.id, t:'Σ весов по предмету > 1', d:a.name+' — '+weightSum(a.id).toFixed(2), src:'§3.2' });
    const sd = surveyDue(a.id);
    if(sd && sd.overdue) out.push({ sev:'warn', obj:a.id, t:'Плановое обследование просрочено', d:a.name+' — с '+sd.due, src:'Н-6 · Прил.2 §2.3' });
    if(kindById(a.kindId).undefinedKind) out.push({ sev:'warn', obj:a.id, t:'Вид предмета не определён (миграция)', d:a.name, src:'§11' });
    if(kindById(a.kindId).prohibited) out.push({ sev:'err', obj:a.id, t:'Действующая запись по запрещённому виду', d:a.name, src:'Н-4' });
  });
  CREDITS.forEach(c=>{
    const cv = coverage(c.id,'origination');
    if(!cv.ok) out.push({ sev:'err', obj:c.id, t:'Покрытие при оформлении ниже порога', d:c.no+' — '+pct(cv.index)+' при '+pct(cv.req), src:'Н-1' });
    if(c.kmRequired && !c.kmDecision) out.push({ sev:'err', obj:c.id, t:'Не внесены реквизиты решения Кабинета Министров', d:c.no, src:'Н-2 · Прил.1 §2.6' });
  });
  AGREEMENTS.forEach(g=>{
    if(g.stage==='зарегистрирован' && DOC_ROUTE.some(s=>!(g.route||{})[s.id]))
      out.push({ sev:'warn', obj:g.id, t:'Маршрут документов не завершён при зарегистрированном договоре', d:g.no, src:'Н-14' });
  });
  DEADLINES.forEach(d=>{ if(d.due < ISO(TODAY))
    out.push({ sev:'warn', obj:d.object, t:'Просрочен срок: '+d.kind, d:'до '+d.due+' ('+d.source.type+')', src:d.source.ref }); });
  return out;
}

/* ---------- общие фрагменты ---------- */
function gateBlock(g, objectId, scopeLabel){
  const fired = g.results.filter(r=>r.fired);
  if(!fired.length) return `<div class="gate pass"><div class="t">Препятствий нет</div>
    <div class="src">проверено правил: ${g.results.length} · ${esc(scopeLabel||'')}</div></div>`;
  return fired.map(r=>{
    const cls = r.blocking ? 'block' : (r.admission ? 'pass' : (r.rule.level==='block'?'block':'warnl'));
    const admitLbl = r.rule.admit ? roleName(r.rule.admit) : 'без права допуска';
    const canAdmit = r.rule.admit && CURRENT_ROLE===r.rule.admit && !r.admission;
    return `<div class="gate ${cls}">
      <div class="t">${r.rule.id} · ${esc(r.rule.title)}</div>
      ${r.detail?`<div class="m">${esc(r.detail)}</div>`:''}
      <div class="src">${esc(r.rule.src)} · уровень: ${r.rule.level==='block'?'блок':'предупреждение'} · допускает: ${esc(admitLbl)}
      ${r.admission?` · <b>допущено</b> ${esc(roleName(r.admission.by))}, ${r.admission.date}: ${esc(r.admission.basis)}`:''}</div>
      ${canAdmit?`<div class="btn-row"><button class="sm" data-act="admit" data-arg="${r.rule.id}" data-arg2="${objectId}">Допустить с обоснованием</button></div>`:''}
    </div>`;
  }).join('');
}
const verdictChip = v => `<span class="chip ${v==='нельзя'?'err':v==='можно'?'ok':v==='допущено'?'info':'warn'}">${esc(v)}</span>`;

      <div class="n">k=${P.k['поручительство']}${P.k['поручительство']===0?' — настройкой отключено (§4.2)':''}</div></div>

      <div class="axes">${Object.entries(ax).map(([k2,v])=>`<div class="axis"><div class="k">${esc(k2)}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    </div>
    <div class="card"><h2>Общая часть</h2>
      <dl class="kv">
        <dt>Вид</dt><dd>${esc(k.name)} · коэффициент ${k.k} · ${k.movable?'движимое':'недвижимое'} · ${k.liquid?'ликвидное':'неликвидное'}</dd>
        <dt>Количество</dt><dd>${a.qty} ${esc(a.unit)}</dd>
        <dt>Местонахождение</dt><dd>${esc(a.location)}</dd>
        <dt>Способ хранения</dt><dd>${a.custody?esc(a.custody):'<span class="chip err">не указан</span>'} <span class="small muted">реквизит АКТИВА, не договора (§2.2)</span></dd>
        <dt>Страхование</dt><dd>${a.insurance?esc(a.insurance.no)+' до '+a.insurance.till:'<span class="chip warn">нет полиса</span>'}</dd>
        ${a.leaseTill?`<dt>Право аренды до</dt><dd>${a.leaseTill}</dd>`:''}
        <dt>Валюта</dt><dd>${esc(a.ccy)} <span class="small muted">одна валюта по умолчанию (§10)</span></dd>
      </dl>
      <div class="sep"></div>
      <h2>Детали по схеме вида</h2>
      <p class="hint">Состав полей задаёт справочник видов (§2.4). Поисковые реквизиты вынесены отдельно и типизированы.</p>
      <dl class="kv">
        ${k.schema.length?k.schema.map(([f,l])=>`<dt>${esc(l)}</dt><dd>${esc(a.props[f]!=null?a.props[f]:'—')}</dd>`).join(''):'<dt>—</dt><dd>схема вида пуста</dd>'}
      </dl>
      <div class="sep"></div>
      <h2>Поисковые реквизиты</h2>
      <dl class="kv">${k.search.length?k.search.map(s=>`<dt>${esc(s)}</dt><dd class="mono">${esc(a.search[s]||'—')}</dd>`).join(''):'<dt>—</dt><dd>для вида не предусмотрены</dd>'}</dl>
      ${a.legacy?`<div class="sep"></div><div class="gate warnl"><div class="t">Унаследованная запись</div>
        <div class="m">Исходная форма: <span class="mono">${esc(a.legacy)}</span></div>
        <div class="src">§11 · перенос с реконструкцией тождества вещи</div></div>`:''}
    </div>`;
  }
  if(tab==='title'){
    const t = TITLES.filter(x=>x.assetId===a.id);
    body = `<div class="card"><h2>Титул — слой 2</h2>
      <p class="hint">Право отделено от физики и от обременений (§2.2).</p>
      <div class="tbl-wrap"><table><thead><tr><th>Правообладатель</th><th>Вид права</th><th>Документ</th><th>С даты</th></tr></thead><tbody>
      ${t.map(x=>`<tr><td>${esc(subj(x.holderId).name)}</td><td>${esc(x.right)}</td><td>${esc(x.doc)}</td><td>${x.from}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  if(tab==='enc'){
    const e = encOf(a.id);
    body = `<div class="card"><h2>Журнал обременений — слой 3</h2>
      <p class="hint">Наш залог, наш запрет, арест суда, налоговый арест, чужой залог — записи ОДНОЙ сущности с типом (§5.2). Проверка «есть ли чужое обременение» — один запрос.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Тип</th><th>Основание</th><th>Орган</th><th>Реквизит</th><th>Период</th><th>Отметка в оригиналах</th><th></th></tr></thead><tbody>
      ${e.map(x=>`<tr><td><span class="chip ${x.type.startsWith('наш')?'info':'err'}">${esc(x.type)}</span></td>
        <td>${esc(x.basis)}</td><td>${esc(x.org)}</td><td class="mono small">${esc(x.doc||'—')}</td>
        <td>${x.from} — ${x.to||'действует'}</td>
        <td>${x.type==='наш запрет'?(x.markInOriginals?'<span class="chip ok">принята</span>':'<span class="chip warn">не получена</span>'):'—'}</td>
        <td>${x.type==='наш запрет'&&active(x)?`<button class="sm" data-act="release" data-arg="${a.id}">Снять запрет</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="btn-row">${!encOf(a.id).some(x=>x.type==='наш запрет'&&active(x))?`<button data-act="ban" data-arg="${a.id}">Зарегистрировать наложение запрета</button>`:''}</div>
      <p class="hint" style="margin-top:12px">Н-11: запрет накладывает залогодатель в регистрирующем органе, холдинг контролирует и принимает отметку в оригиналах правоустанавливающих документов.</p>
    </div>`;
  }
  if(tab==='val'){
    const vs = VALUATIONS.filter(v=>v.assetId===a.id).sort((x,y)=>x.date<y.date?1:-1);
    body = `<div class="card"><h2>Журнал оценок</h2>
      <p class="hint">Отдельный журнал, не редакция договора (§9 модели: редакции договора и журнал оценок — разные шкалы времени). Залоговая = оценочная × ${k.k}; подъём выше расчётной невозможен (Н-12).</p>
      <div class="tbl-wrap"><table><thead><tr><th>Дата</th><th class="num">Оценочная</th><th class="num">Расчётная залоговая</th>
        <th class="num">Применённая</th><th>Оценщик</th><th>Отчёт</th><th>Примечание</th></tr></thead><tbody>
      ${vs.map(v=>`<tr><td>${v.date}</td><td class="num">${money(v.appraisal)}</td>
        <td class="num">${money(v.appraisal*k.k)}</td>
        <td class="num">${money(v.override!=null?Math.min(v.override,v.appraisal*k.k):v.appraisal*k.k)}</td>
        <td>${esc(v.appraiser)}<div class="small muted">лиц. ${esc(v.lic)}</div></td>
        <td class="small mono">${esc(v.report)}</td><td class="small muted">${esc(v.note||'')}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="btn-row"><button data-act="reval" data-arg="${a.id}">Внести переоценку</button></div>
    </div>`;
  }
  if(tab==='alloc'){
    const al = allocOf(a.id);
    body = `<div class="card"><h2>Два уровня связи с кредитом</h2>
      <p class="hint">Юридическое обременение меняется только документом; расчётное распределение — весами. Не смешиваются (§3.1).</p>
      <div class="tbl-wrap"><table><thead><tr><th>Кредит</th><th>Договор</th><th class="num">Вес</th>
        <th class="num">Вклад на ${ISO(TODAY)}</th><th class="num">Занято под текущий долг</th></tr></thead><tbody>
      ${al.map(x=>{ const cr=creditById(x.creditId); const val=pledgeValue(a.id);
        const busy = Math.min(x.weight*val, EXT.debtBalance(cr.id));
        return `<tr><td><span class="link" data-open="credit:${cr.id}">${esc(cr.no)}</span></td>
          <td>${esc(agrById(x.agreementId).no)}</td><td class="num">${x.weight.toFixed(2)}</td>
          <td class="num">${money(x.weight*val)}</td><td class="num">${money(busy)}</td></tr>`; }).join('')}
      <tr><td colspan="2"><b>Σ весов</b></td><td class="num"><b>${weightSum(a.id).toFixed(2)}</b>${weightSum(a.id)>1.0000001?' <span class="chip err">> 1</span>':''}</td>
        <td class="num" colspan="2" class="small muted">инвариант Σ ≤ 1 (§3.2)</td></tr>
      </tbody></table></div>
      <p class="hint" style="margin-top:12px">Обременено по договору и занято под текущий долг печатаются рядом — юридический объём неизменен, занятость следует за остатком (§3.3).</p>
      <div class="btn-row"><button data-act="replace" data-arg="${a.id}">Замена предмета</button></div>
    </div>`;
  }
  if(tab==='survey'){
    const ss = SURVEYS.filter(s=>s.assetId===a.id).sort((x,y)=>x.date<y.date?1:-1);
    const iv = surveyInterval(a.id), due = surveyDue(a.id);
    body = `<div class="card"><h2>Периодичность</h2>
      <p class="hint">Матрица «группа платёжеспособности × движимость» (Н-6). Не по виду залога — это была ошибка прежней модели.</p>
      <dl class="kv">
        <dt>Группа платёжеспособности</dt><dd>${esc(iv.worst||'—')} (худшая по отнесённым кредитам)</dd>
        <dt>Движимость</dt><dd>${esc(iv.movable||'—')}</dd>
        <dt>Интервал</dt><dd>${iv.months?iv.months+' мес.':'—'} ${iv.tightened?`<span class="chip warn">возможно ужесточение до ${iv.tightened} мес.</span>`:''}</dd>
        <dt>Плановая дата</dt><dd>${due? (due.due + (due.overdue?' — <span class="chip err">просрочено</span>':'')) : '—'}</dd>
      </dl>
      ${iv.note?`<div class="gate warnl"><div class="m">${esc(iv.note)}</div><div class="src">Н-6 / Н-7</div></div>`:''}
    </div>
    <div class="card"><h2>Акты обследования</h2>
      <p class="hint">Исход «не состоялось» — полноценный результат наряду с «проведено», плюс журнал попыток доступа (§7.5).</p>
      ${ss.map(s=>`<div class="gate ${s.outcome==='проведено'?'pass':s.outcome==='не состоялось'?'warnl':'block'}">
        <div class="t">${s.date} · ${esc(s.outcome)}</div>
        <div class="m">${esc(s.conclusion)}</div>
        <div class="src">фотофиксация: ${s.photos?'есть':'нет'} · подписи: ${s.oneSided?'односторонний акт':(s.signGfh?esc(s.signGfh)+' / '+esc(s.signPledgor):'—')}</div>
        ${s.notice?`<div class="src">извещение о восполнении ${esc(s.notice.no)} от ${s.notice.date}, срок до ${s.notice.till} (Н-9)</div>`:''}
        ${s.attempts?`<div class="src">попытки доступа: ${s.attempts.map(t=>t.date+' — '+esc(t.reason)).join(' · ')}</div>`:''}
      </div>`).join('') || '<p class="muted">актов нет</p>'}
      <div class="btn-row"><button data-act="survey" data-arg="${a.id}">Составить акт обследования</button></div>
    </div>`;
  }
  if(tab==='gate'){
    body = `<div class="card"><h2>Допуск предмета ${verdictChip(g.verdict)}</h2>
      <p class="hint">Свёртка правил области «asset». Правила с пометкой «без права допуска» не пропускаются ни при какой роли (Н-4).</p>
      ${gateBlock(g,a.id,'область: предмет')}</div>`;
  }
  return `<div class="tabs">${tabs.map(([id,l])=>`<div class="tab ${tab===id?'active':''}" data-open="asset:${a.id}:${id}">${l}</div>`).join('')}</div>${body}`;
}

function viewAgreements(){
  return `<div class="card"><h2>Договоры обеспечения</h2>
  <p class="hint">Одна сущность, три подтипа (§2.1). Предметы есть только у залога; гарантия и поручительство несут сумму на договоре.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Договор</th><th>Тип</th><th>Стадия</th><th>Заёмщик</th>
    <th>Предоставил</th><th class="num">Предметов / сумма</th><th>Маршрут</th></tr></thead><tbody>
  ${AGREEMENTS.map(g=>{ const done=DOC_ROUTE.filter(s=>(g.route||{})[s.id]).length;
    return `<tr class="clickable" data-open="agreement:${g.id}">
      <td><b>${esc(g.no)}</b></td><td>${esc(g.type)}</td>
      <td><span class="chip ${g.stage==='зарегистрирован'?'ok':'mute'}">${esc(g.stage)}</span></td>
      <td>${esc(subj(g.borrowerId).name)}</td><td>${esc(subj(g.providerId).name)}</td>
      <td class="num">${g.type==='залог'?(g.items||[]).length+' предм.':money(g.sum,g.ccy)}</td>
      <td>${done}/6 ${done<6?'<span class="chip warn">не завершён</span>':'<span class="chip ok">пройден</span>'}</td></tr>`; }).join('')}

}

function viewAgreement(){
  const g = agrById(VIEW.id);
  const ctx = { agr:g };
  const gt = gate('agreement',ctx,g.id);
  return `
  <div class="card"><h2>Маршрут кредитно-залоговых документов</h2>
    <p class="hint">Ровно 6 шагов (Н-14), каждый с датой и исполнителем. Дополнительные соглашения идут этим же маршрутом (§7.2).</p>
    <div class="route">${DOC_ROUTE.map((s,i)=>{ const d=(g.route||{})[s.id];
      return `<div class="step ${d?'done':''}"><div class="n">${i+1}. ${esc(s.name)}</div>
        <div class="d">${d?d:'не пройдено'} · ${esc(roleName(s.role))}</div></div>`; }).join('')}</div>
  </div>
  <div class="card"><h2>Реквизиты</h2>
    <dl class="kv">
      <dt>Тип обеспечения</dt><dd>${esc(g.type)} <span class="small muted">подтип надсущности (§2.1)</span></dd>
      <dt>Стадия</dt><dd>${esc(g.stage)} <span class="small muted">один договор, стадия меняется — отдельной сущности «предложение на заявке» нет (§7.1)</span></dd>
      <dt>Заёмщик</dt><dd>${esc(subj(g.borrowerId).name)}</dd>
      <dt>Предоставил обеспечение</dt><dd>${esc(subj(g.providerId).name)} ${g.providerId!==g.borrowerId?'<span class="chip info">третье лицо</span>':''}
        <div class="small muted">роль субъекта, не отдельный реестр (§2.5)</div></dd>
      <dt>Дата</dt><dd>${g.date}</dd>
      ${g.sum?`<dt>${g.type==='гарантия'?'Сумма гарантии':'Лимит ответственности'}</dt><dd>${money(g.sum,g.ccy)}</dd>`:''}
      ${g.creditId?`<dt>Кредит</dt><dd><span class="link" data-open="credit:${g.creditId}">${esc(creditById(g.creditId).no)}</span></dd>`:''}
      <dt>Нотариальное удостоверение</dt><dd>${g.notary?esc(g.notary):'<span class="chip warn">нет</span>'}</dd>
      ${g.type==='поручительство'?`<dt>Согласие супруга</dt><dd>${g.spouseConsent?esc(g.spouseConsent):'<span class="chip err">нет</span>'}</dd>
        <dt>Возраст поручителя на дату договора</dt><dd>${subj(g.providerId).birth?yearsBetween(subj(g.providerId).birth,g.date)+' лет (границы '+P.guarantorAgeMin+'–'+P.guarantorAgeMax+', Н-17)':'—'}</dd>`:''}
    </dl>
  </div>
  ${g.type==='залог'?`<div class="card"><h2>Предметы</h2>
    <p class="hint">Договор ПРИВЯЗЫВАЕТ активы из общего реестра, а не создаёт их (§2.3, §7.1).</p>
    <div class="tbl-wrap"><table><thead><tr><th>Предмет</th><th>Вид</th><th class="num">Залоговая стоимость</th><th class="num">Σ весов</th></tr></thead><tbody>
    ${(g.items||[]).map(id=>{ const a=assetById(id); return `<tr class="clickable" data-open="asset:${id}">
      <td>${esc(a.name)}</td><td>${esc(kindById(a.kindId).name)}</td>
      <td class="num">${money(pledgeValue(id))}</td><td class="num">${weightSum(id).toFixed(2)}</td></tr>`; }).join('')}
    </tbody></table></div></div>`:''}
  <div class="card"><h2>Гейт регистрации ${verdictChip(gt.verdict)}</h2>
    ${gateBlock(gt,g.id,'область: договор')}
    ${g.stage!=='зарегистрирован'?`<div class="btn-row">
      <button class="primary" data-act="register" data-arg="${g.id}" ${gt.blocked.length?'disabled':''}>Зарегистрировать договор</button>
      ${gt.blocked.length?'<span class="small muted" style="align-self:center">кнопка выключена свёрткой — светофор и запись используют один вызов gate() (§6.1)</span>':''}
    </div>`:''}
  </div>`;
}

  return `<div class="card"><h2>Правила</h2>
  <p class="hint">Каждое правило — запись: условие · уровень · кто вправе допустить · пункт норматива · период. Ни одного порога в коде, ни одной формулировки в разметке (§6.1). Правило «без права допуска» не пропускается ни при какой роли.</p>
  ${scopes.map(s=>`<h3 style="font-size:14px;margin:16px 0 6px">Область: ${esc(s)}</h3>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Формулировка</th><th>Уровень</th><th>Кто вправе допустить</th><th>Пункт норматива</th></tr></thead><tbody>
    ${RULES.filter(r=>r.scope===s).map(r=>`<tr><td class="mono">${r.id}</td><td>${esc(r.title)}</td>

      <td>${r.admit?esc(roleName(r.admit)):'<span class="chip err">без права допуска</span>'}</td>
      <td class="small muted">${esc(r.src)}</td></tr>`).join('')}
    </tbody></table></div>`).join('')}
  </div>`;
}

/* ==========================================================================
   ЧАСТЬ 5. ДЕЙСТВИЯ. Каждое пишет типизированное событие (§8.1) и, где нужно,
   снимок применённых параметров (§6.2). Гейт вызывается ТЕМ ЖЕ gate(), что и UI.
   ========================================================================== */
function modalHtml(){
  return `<div class="modal-bg" id="mbg"><div class="modal">
    <h3>${esc(MODAL.title)}</h3>
    ${MODAL.hint?`<p class="hint">${MODAL.hint}</p>`:''}
    <form id="mform">${MODAL.body()}
      <div class="btn-row"><button type="submit" class="primary">${esc(MODAL.ok||'Сохранить')}</button>
        <button type="button" id="mcancel">Отмена</button></div>
    </form></div></div>`;
}
function openModal(m){ MODAL=m; MODAL.onMount = root=>{
    root.querySelector('#mcancel').onclick = ()=>{ MODAL=null; render(); };
    root.querySelector('#mbg').onclick = e=>{ if(e.target.id==='mbg'){ MODAL=null; render(); } };
    root.querySelector('#mform').onsubmit = e=>{ e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target).entries());
      e.target.querySelectorAll('input[type=checkbox]').forEach(cb=>f[cb.name]=cb.checked);
      const err = MODAL.submit(f);
      if(err){ toast(err,'err'); return; }
      MODAL=null; render(); };
  }; render(); }

const fText  = (n,l,v)=>`<label class="f"><span>${esc(l)}</span><input name="${n}" value="${esc(v||'')}"></label>`;
const fNum   = (n,l,v)=>`<label class="f"><span>${esc(l)}</span><input name="${n}" type="number" step="any" value="${v!=null?v:''}"></label>`;
const fArea  = (n,l,v)=>`<label class="f"><span>${esc(l)}</span><textarea name="${n}">${esc(v||'')}</textarea></label>`;
const fSel   = (n,l,opts,v)=>`<label class="f"><span>${esc(l)}</span><select name="${n}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===v?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
const fChk   = (n,l,v)=>`<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${n}" ${v?'checked':''} style="width:auto;height:auto"><span style="margin:0">${esc(l)}</span></label>`;

const ACT = {
  /* --- допуск: единый формат на весь контур (§6.3) --- */
  admit(ruleId, objectId){
    const r = RULES.find(x=>x.id===ruleId);
    if(CURRENT_ROLE !== r.admit) return toast('Допуск вправе дать только: '+roleName(r.admit),'err');
    openModal({ title:'Допуск по правилу '+r.id, ok:'Допустить',
      hint:esc(r.title)+' · '+esc(r.src)+'<br>Обоснование обязательно (Н-13: допуски комитета — только с обоснованием).',
      body:()=>fArea('basis','Обоснование')+fText('who','ФИО принявшего решение'),
      submit:f=>{ if(!f.basis || f.basis.trim().length<10) return 'Обоснование обязательно и должно быть содержательным';
        ADMISSIONS.unshift({ id:uid('AD'), ruleId, object:objectId, by:CURRENT_ROLE, who:f.who,
          date:ISO(TODAY), basis:f.basis.trim(), pv:PV.id });
        logEvent('допуск по правилу', [ruleId, objectId], { основание:f.basis.trim() });
        toast('Допуск зафиксирован в журнале','ok'); } });
  },

  /* --- регистрация договора: гейт и кнопка используют один вызов (§6.1) --- */
  register(agrId){
    const g = agrById(agrId);
    const gt = gate('agreement',{agr:g},g.id);
    if(gt.blocked.length) return toast('Регистрация невозможна: '+gt.blocked.map(x=>x.rule.id).join(', '),'err');
    if(g.type==='залог'){
      /* залоговый договор регистрируется только если по кредитам состава закрыт гейт покрытия */
      const credits = [...new Set(ALLOC.filter(a=>a.agreementId===g.id).map(a=>a.creditId))];
      const bad = credits.filter(cid=>gate('credit',{credit:creditById(cid)},cid).blocked.length);
      if(bad.length) return toast('Не закрыт гейт по кредитам: '+bad.map(c=>creditById(c).no).join(', '),'err');
    }
    g.stage = 'зарегистрирован';
    SNAPSHOTS.push({ id:uid('SN'), at:ISO(TODAY), what:'регистрация договора', object:g.id, pv:PV.id,
      params:JSON.parse(JSON.stringify(P)) });   // архив, движок его не читает (§4.3)
    logEvent('регистрация договора обеспечения', [g.id], { тип:g.type, номер:g.no });
    toast('Договор зарегистрирован; снимок применённых параметров сохранён','ok');
  },

  km(creditId){
    const c = creditById(creditId);
    openModal({ title:'Реквизиты решения Кабинета Министров', ok:'Внести',
      hint:'Н-2 · Прил.1 §2.6 — решение перебивает нормативные пороги; порог берётся из его реквизитов.',
      body:()=>fText('no','Номер и дата решения')+fNum('ratio','Установленный порог покрытия, доля (напр. 1,0)'),
      submit:f=>{ if(!f.no) return 'Номер решения обязателен';
        const r = parseFloat(String(f.ratio).replace(',','.'));
        if(!(r>0)) return 'Порог должен быть положительным';
        c.kmDecision = { no:f.no, ratio:r };
        logEvent('внесены реквизиты решения КМ', [c.id], { решение:f.no, порог:pct(r) });
        toast('Порог теперь берётся из решения, а не из Н-1','ok'); } });
  },

  /* --- наложение запрета: Н-11, отметка в оригиналах принимается отдельно --- */
  ban(assetId){
    openModal({ title:'Регистрация наложения запрета на отчуждение', ok:'Зарегистрировать',
      hint:'Н-11 · ПБК п.2.1 — запрет накладывает залогодатель в регистрирующем органе; холдинг контролирует наложение и принимает отметку в оригиналах правоустанавливающих документов.',
      body:()=>fText('org','Регистрирующий орган')+fText('doc','Реквизит регистрации')+
              fText('basis','Основание (договор)')+fChk('mark','Отметка в оригиналах принята'),
      submit:f=>{ if(!f.org||!f.basis) return 'Орган и основание обязательны';
        ENCUMBRANCES.push({ id:uid('E'), assetId, type:'наш запрет', basis:f.basis, from:ISO(TODAY), to:null,
          org:f.org, doc:f.doc||null, markInOriginals:!!f.mark });
        if(!f.mark) DEADLINES.push({ id:uid('DL'), object:assetId,
          kind:'Наложение запрета: получение отметки в оригиналах',
          due:ISO(new Date(TODAY.getTime()+P.banDeadlineDays*864e5)),
          source:{ type:'внутренний', ref:'внутренний срок banDeadlineDays='+P.banDeadlineDays } });
        logEvent('наложение запрета зарегистрировано', [assetId], { орган:f.org, отметка:f.mark?'принята':'не получена' });
        toast('Запись запрета добавлена в журнал обременений','ok'); } });
  },

  /* --- снятие запрета: основание из классификатора + цепочка 4 согласований (Н-10) --- */
  release(assetId){
    const a = assetById(assetId);
    openModal({ title:'Снятие запрета на отчуждение', ok:'Снять запрет',
      hint:'Н-10 — основание только из классификатора (11 позиций), обязательна цепочка из 4 согласований. Каждое согласование подписывается под своей ролью (§7.3).',
      body:()=>fSel('groundId','Основание',RELEASE_GROUNDS.map(g=>[g.id,g.name]))+
        fText('reconAct','Реквизит акта сверки задолженности (для основания «полное погашение»)')+
        '<div class="small muted" style="margin:4px 0 8px">Цепочка согласований:</div>'+
        RELEASE_CHAIN.map(s=>fChk('ch_'+s.id, s.name+' — '+roleName(s.role))).join(''),
      submit:f=>{
        const chain = {}; RELEASE_CHAIN.forEach(s=>chain[s.id]=!!f['ch_'+s.id]);
        const ctx = { asset:a, form:{ groundId:f.groundId, reconAct:f.reconAct, chain } };
        const gt = gate('release',ctx,assetId);
        if(gt.blocked.length) return gt.blocked.map(x=>x.rule.title).join('; ');
        const ground = RELEASE_GROUNDS.find(g=>g.id===f.groundId);
        const ban = ENCUMBRANCES.find(e=>e.assetId===assetId && e.type==='наш запрет' && active(e));
        if(!ban) return 'Действующего запрета нет';
        if(ground.partial){
          logEvent('частичное снятие запрета', [assetId], { основание:ground.name,
            примечание:'запрет на остаток предмета сохранён (Н-10)' });
          toast('Частичное снятие оформлено; запрет на остаток сохранён','ok'); return;
        }
        ban.to = ISO(TODAY);
        logEvent('снятие запрета', [assetId], { основание:ground.name,
          'акт сверки': f.reconAct||'—', согласования:'4/4' });
        toast('Запрет снят, запись закрыта датой','ok'); } });
  },

  /* --- акт обследования: исход «не состоялось» равноправен (§7.5) --- */
  survey(assetId){
    openModal({ title:'Акт обследования', ok:'Составить акт',
      hint:'Н-8 — заключение и фотофиксация обязательны; односторонний акт допустим только при подтверждённом присутствии/наличии.',
      body:()=>fSel('outcome','Исход',[['проведено','проведено'],['ухудшение','ухудшение'],
          ['утрата','утрата'],['не состоялось','не состоялось']])+
        fArea('conclusion','Заключение')+
        fChk('photos','Фотофиксация приложена')+
        fChk('oneSided','Односторонний акт')+
        fChk('presenceConfirmed','Присутствие/наличие подтверждено')+
        fText('signGfh','Подпись ГФХ')+fText('signPledgor','Подпись залогодателя')+
        fText('attemptReason','Причина недопуска (для исхода «не состоялось»)'),
      submit:f=>{
        const gt = gate('survey',{ asset:assetById(assetId), form:f }, assetId);
        if(gt.blocked.length) return gt.blocked.map(x=>x.rule.title).join('; ');
        const s = { id:uid('U'), assetId, date:ISO(TODAY), outcome:f.outcome, conclusion:f.conclusion,
          photos:!!f.photos, oneSided:!!f.oneSided, signGfh:f.signGfh, signPledgor:f.signPledgor };
        if(f.outcome==='не состоялось')
          s.attempts = [{ date:ISO(TODAY), who:roleName(CURRENT_ROLE), reason:f.attemptReason||'причина не указана' }];
        SURVEYS.push(s);
        const a = assetById(assetId);
        if(f.outcome==='ухудшение' || f.outcome==='утрата'){
          a.phys = f.outcome==='утрата' ? 'утрачен' : 'ухудшен';
          const till = new Date(TODAY); till.setMonth(till.getMonth()+2);
          s.notice = { no:'ИЗВ-'+ISO(TODAY).slice(0,4)+'/'+uid('').slice(-3), date:ISO(TODAY), till:ISO(till) };
          DEADLINES.push({ id:uid('DL'), object:assetId, kind:'Срок восполнения по извещению',
            due:ISO(till), source:{ type:'нормативный', ref:'Н-9 · Прил.1' } });
          logEvent('извещение о восполнении направлено', [assetId], { срок:ISO(till),
            примечание:'взыскание — только по истечении срока или при отказе (Н-9)' });
        }
        logEvent('акт обследования', [assetId], { исход:f.outcome });
        toast(f.outcome==='не состоялось'
          ? 'Акт с исходом «не состоялось» сохранён; попытка доступа записана'
          : 'Акт сохранён','ok'); } });
  },

  reval(assetId){
    const a = assetById(assetId), k = kindById(a.kindId);
    openModal({ title:'Переоценка', ok:'Внести',
      hint:'Н-12 — залоговая = оценочная × '+k.k+'. Применённая может быть только НИЖЕ расчётной; подъём выше невозможен ни для какой роли. Веса распределения при этом не меняются (§3.2).',
      body:()=>fNum('appraisal','Оценочная стоимость')+fText('appraiser','Оценщик')+fText('lic','Лицензия')+
              fText('report','Номер отчёта')+fNum('override','Применённая залоговая (необязательно, только вниз)')+
              fArea('note','Примечание'),
      submit:f=>{ const ap=parseFloat(f.appraisal); if(!(ap>0)) return 'Оценочная стоимость обязательна';
        if(!f.appraiser || !f.report) return 'Оценщик и номер отчёта обязательны (Н-12)';
        const calc = ap*k.k; let ov = f.override? parseFloat(f.override) : null;
        if(ov!=null && ov>calc) return 'Подъём выше расчётной невозможен: расчётная '+money(calc);
        if(ov!=null && CURRENT_ROLE!=='head') return 'Понижение — полномочие заведующего отделом (Н-12)';
        VALUATIONS.push({ id:uid('V'), assetId, date:ISO(TODAY), appraisal:ap, appraiser:f.appraiser,
          lic:f.lic, report:f.report, override:ov, note:f.note });
        logEvent('переоценка', [assetId], { оценочная:money(ap), 'расчётная залоговая':money(calc),
          применённая:money(ov!=null?ov:calc) });
        toast('Переоценка внесена; веса распределения не изменились','ok'); } });
  },

  /* --- замена: ОДНА транзакция, а не раздельные ввод и вывод (§7.7, дефект Д-1 v1) --- */
  replace(assetId){
    const a = assetById(assetId);
    const al = allocOf(assetId).filter(x=>!closed(x));
    if(!al.length) return toast('Предмет не отнесён ни к одному кредиту — замена не требуется','err');
    const credit = creditById(al[0].creditId);
    const cands = ASSETS.filter(x=>x.id!==assetId && weightSum(x.id)<1);
    openModal({ title:'Замена предмета обеспечения', ok:'Провести замену',
      hint:'Н-16 — при просроченной задолженности замена запрещена без права допуска. Ввод и вывод выполняются одной транзакцией: раздельные операции под разные кредиты одного договора позволяли обойти гейт (дефект Д-1 прототипа v1).',
      body:()=>`<dl class="kv"><dt>Выводится</dt><dd>${esc(a.name)} — ${money(pledgeValue(assetId))}</dd>
        <dt>Кредит</dt><dd>${esc(credit.no)} · просрочка: ${EXT.overdue(credit.id)?'есть':'нет'}</dd></dl><div class="sep"></div>`+
        fSel('inAsset','Вводится взамен', cands.map(x=>[x.id, x.name+' — '+money(pledgeValue(x.id))]))+
        fChk('deptConsent','Согласие отраслевого департамента получено')+
        fChk('dakOpinion','Заключение ДАК о ликвидности получено'),
      submit:f=>{
        const inA = assetById(f.inAsset); if(!inA) return 'Выберите вводимый предмет';
        const form = { deptConsent:!!f.deptConsent, dakOpinion:!!f.dakOpinion,
          inValue:pledgeValue(inA.id), outValue:pledgeValue(assetId),
          inLiquid:kindById(inA.kindId).liquid, outLiquid:kindById(a.kindId).liquid };
        const gt = gate('replace',{ credit, form, asset:a },assetId);
        if(gt.blocked.length) return gt.blocked.map(x=>x.rule.title+(x.detail?' ('+x.detail+')':'')).join('; ');
        al.forEach(x=>{ x.assetId = inA.id;
          const agr = agrById(x.agreementId);
          agr.items = (agr.items||[]).filter(i=>i!==assetId); if(!agr.items.includes(inA.id)) agr.items.push(inA.id); });
        logEvent('замена предмета обеспечения', [assetId, inA.id], { кредит:credit.no,
          выведен:a.name, введён:inA.name, транзакция:'одна' });
        toast('Замена проведена одной транзакцией','ok'); } });
  },
};

/* ==========================================================================
   Тестовый шов: движок доступен снаружи для автотестов (harness).
   ========================================================================== */
window.__zt = { PARAMS:P, RULES, coverage, requiredCover, gate, pledgeValue, weightSum,
  axesOf, surveyInterval, surveyDue, defects, ASSETS, CREDITS, AGREEMENTS, ALLOC,
  VALUATIONS, ENCUMBRANCES, ADMISSIONS, EVENTS, DEADLINES, ACT,
  setRole:r=>{ CURRENT_ROLE=r; }, render };

render();
</script>
