<title>Документооборот · АСУБК</title>
<!--
  АСУБК · модуль «Документооборот» · исполняемый макет TO-BE · волна 2 (поверх ядра волны 1).
  Источник истины — mockups/docflow/ASUBK-dokumentooborot-logika.md (канон; копия —
  docs/logika/26-dokumentooborot.md), решения — ADR-0265…ADR-0272 (при расхождении канона с ADR
  побеждает ADR), раздел ТЗ 23 — справочно. Журнал волн и расхождения ДО-Д* —
  mockups/docflow/ASUBK-status-razrabotki.md. Смоук — node scripts/inspect/docflow-check.mjs.

  ЧТО ПОКАЗЫВАЕТ МАКЕТ
    Журналы: Входящие · Исходящие · Внутренние · Мои (§9.1, ДО-33): поиск одной строкой,
      фильтры (тип, этап, исполнение, период регистрации), группировка с итогами, наборы
      фильтров (в памяти страницы), печатная форма журнала (журнал по шаблону = фильтр по типу,
      ДО-21, §3.2; согласие заказчика — ДО-ВЗ-6). «Мои» → «Ждут моей подписи» — подпись пачкой
      одним действием, запись в журнал каждого документа (ДО-41, С-32; волна 2).
    Карточка документа: Реквизиты · Файлы · Маршрут · Резолюции · Отправка · Ознакомление ·
      Привязки · Журнал · Комментарии; в шапке — этап, номер, сводки и кнопки доступных действий.
      Волна 2: печать РКК и листа ознакомления; «Направить на ознакомление» с файлом (ДО-30);
      «Зарегистрировать меру» — заглушка шва во «Взыскание» (§10.3, ДО-39, ADR-0270).
    Архив (§7): номенклатура дел (ведёт архивариус: завести, изменить, скопировать на год —
      волна 2), «ждут сдачи в дело», журнал выдачи оригиналов, печать описи дела.
    Показатели (§9.2, ADR-0272): предпросмотр того, что шов отдаёт «Статистике».
    Настройки (§1.2, §1.11): справочники — правка администратором документооборота с журналом
      (волна 2); производственный календарь (общий, только чтение); «Шаги для заданий» — ответ на
      опрос, вал-задания, сигналы просрочки «Заданий», порог свёртки, журнал закрытия шагов;
      «Перенос» — отчёт прогона переноса и повторный прогон (§11, С-29).

  ПРАВИЛА, ЗАШИТЫЕ В ДВИЖОК (экраны их не поясняют — только показывают и запрещают)
    ADR-0265 · ДО-15/16/17 — этап хранится (Черновик · Согласование · Подпись ·
      Зарегистрирован · В деле · Аннулирован); исполнение, отправка и ознакомление ВЫВОДЯТСЯ
      (execInfo / dispatchInfo / acqInfo), поля «статус исполнения» нет (ИД-12). «Отправлен» и
      «Исполнен» — не этапы. Зарегистрированный не удаляется (ИД-3): «Исправить» (было/стало) или
      «Аннулировать» (номер остаётся занятым; нельзя после отправки, ИД-9).
    ADR-0267 · ДО-8/21/32/38 — три ряда (ВХ «1234», ИСХ «<код отдела>/<n>», ВН
      «<код отдела>/ВН-<n>»), номер при регистрации, с 1 каждый год по правилу (нет счётчика
      года — ряд начинается с 1). Перенос: счётчики 2026 года поставлены на максимум прежней
      системы (ВХ 4870, ИСХ 2172), ряд ВН — с 1. Номер исходящего/внутреннего — после подписи,
      скан «подписанный» прикладывается после выдачи номера; без него нет отправки и сдачи в дело.
    ADR-0266 · ДО-18/19/20/24 — резолюция: один ответственный (ИД-11), каскад, срок нижней не
      позже действующего срока верхней на момент выдачи (ИД-10), исход «Исполнено»/«Отказать».
      «Требует ответа» — гаснет ответным исходящим, отправленным отправителю; «Исполнено»
      недоступно. «На контроле» — подтверждает контролёр, возврат даёт повтор.
      Срочность → срок по умолчанию 10 / 3 / 1 р.д. от регистрации (ДО-23; ДО-ВЗ-2).
    ADR-0269 · ДО-24/36 — право подписи по справочнику «сотрудник × типы × основание × срок»;
      проверка при выборе подписанта и ещё раз на дату подписи; истекло — документ возвращается
      автору. Замещающий подписывает только по приказу «с правом подписи» (ДО-ДС-8).
      Все проверки прав — в движке (стенд «сервера»): скрытая кнопка правом не считается (ИД-20);
      чтение карточки тоже проверяется (openDoc).
    §8.3 · ДО-12 — видимость: участники, руководитель по цепочке, замещающий на срок,
      Регистратор и руководство — всё.
    ADR-0270 · ДО-6/22/31 — привязки к объектам; обязательность из типа (ИД-13), кредит
      подставляет заёмщика; мера взыскания ЧИТАЕТ номер и даты из документа (заглушка шва).
    ADR-0271 · ДО-29/34…37/44 — каждый ждущий шаг — повод для «Заданий»; адресат из повода,
      «подписать» — лично (замещающего подставляет документооборот), регистрация/отправка/сдача
      в дело — очередь роли; закрытие — отпадением с атрибуцией («исполнено», «выполнил другой»,
      «снято» с причиной). Очереди «на мне» у модуля нет. Сверка с «Заданиями» (волна 2):
      у названного адресата шага «Взять в работу» нет (ЗН-17); замещение после выдачи задание не
      переносит — замещающий действует «Б за А» (ЗН-22); свёртка по паре «вид × адресат», порог
      по умолчанию 10, вал — больше порога за один прогон (ЗН-23, ЗН-25); просрочка: никем не
      взятая очередь — сразу «никто не взял» руководителю подразделения роли и «срок истёк»
      носителям, на 5-й р.д. — администратору документооборота (ЗН-19); взятое и названное —
      общее правило: «срок истёк» исполнителю, на 5-й р.д. «Просрочено задание» руководителю (ЗН-16).
      Сигналы — вывод «Заданий» на дату, документооборот их не шлёт.
    ADR-0268 · ДО-11 — бланк «Отчётности» с получателем → черновик исходящего (заглушка шва).
    ADR-0272 · ДО-26/43 — показатели считает «Статистика»; здесь только предпросмотр.
    Инварианты ИД-1…ИД-20 проверяет смоук (ИД-19 — перенесённые только для чтения).

  ДЕМО-ДАННЫЕ ВМЕСТО НЕОТВЕЧЕННЫХ ВОПРОСОВ (заменяются строкой справочника, модель не меняется)
    • Справочник права подписи заполнен демо-строками: ДО-ВЗ-4 (список лиц с правом подписи,
      доверенности, сроки) не отвечен; в бою, пока справочник пуст, подписать не может никто.
    • Номенклатура дел 2026 — демо (ДО-ВЗ-1).
    • Фразы резолюций — демо (долг 2); перечень «руководство» для видимости — демо (долг 3).
    • Сроки 10/3/1 р.д. — до ответа на ДО-ВЗ-2. Рабочие дни — по общему производственному календарю
      системы (§4.2; РС-30 / ЗН-24): постоянные праздники КР + переносы 2026 года записью (демо-даты,
      те же, что в макете «Реструктуризация»). Год, которого нет в календаре, считается по сб/вс
      с ВИДИМОЙ отметкой «календарь года не заведён» (ДО-Д27), а не молча.
    • Ограниченной видимости нет (ДО-ВЗ-5). Общего чата нет (ДО-ВЗ-3) — только лента комментариев.

  ШВЫ — ЗАГЛУШКИ ВНУТРИ МАКЕТА (соседние макеты не правятся)
    Сотрудники/Оргструктура (коды отделов, руководитель, замещение с признаком права подписи) ·
    Задания (опрос поводов, взятие из очереди, утверждённые продления — EXT) · Заёмщик/Кредит/
    Взыскание (объекты привязки, чтение мерой, виды мер с реквизитом «документ документооборота»,
    регистрация меры из карточки) · Отчётность (два демо-выпуска бланков и пачка из 12 уведомлений) ·
    Справочник органов-адресатов (ДО-ДС-10) · Производственный календарь (РС-30, только чтение) ·
    Старая система (источник переноса с одним «паспортом» прогона).

  НЕ МОДЕЛИРУЕТСЯ: открытые вопросы ДО-Д16 (переназначение исполнителя резолюции) и ДО-Д17 (отзыв
  резолюции); частота опроса 5 минут (С-15) — опрос после каждого действия; транспорт (С-27).

  «Сегодня» заморожено: TODAY = 2026-10-15; системные штампы берутся из S.clock (смоук сдвигает
  его, чтобы проверить новый год). Шов для смоука — window.DF; действия возвращают {ok, why}.
-->

<script>
/* =====================================================================
 *  МОДУЛЬ «ДОКУМЕНТООБОРОТ» — исполняемый макет, волна 2

const DF = {};

/* ------------------------------ даты -------------------------------- */
const D        = s => new Date(s + 'T00:00:00Z');
const isoOf    = dt => dt.toISOString().slice(0, 10);
const addDays  = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
/* Производственный календарь системы (§4.2; РС-30, в «Заданиях» ЗН-24) — заглушка общего шва, тот же
   справочник, что в макете «Реструктуризация»: постоянные праздники КР — ММ-ДД на любой год;
   переносы, религиозные праздники и рабочие субботы — записью на год (демо-даты 2026). Своего
   календаря у документооборота нет. Года нет в справочнике — счёт по сб/вс с видимой отметкой. */
const CALENDAR_FIXED = ['01-01', '01-07', '02-23', '03-08', '03-21', '04-07', '05-01', '05-05', '05-08', '05-09', '08-31', '11-07', '11-08'];
const CALENDAR_YEARS = {
  2026: { holidays: ['2026-03-20', '2026-03-23', '2026-05-27', '2026-05-28', '2026-08-03', '2026-11-09'], workdays: ['2026-03-28', '2026-11-14'] },
};
const calendarYearKnown = y => Object.prototype.hasOwnProperty.call(CALENDAR_YEARS, Number(y));
const isWork   = s => {
  const rec = CALENDAR_YEARS[+s.slice(0, 4)] || { holidays: [], workdays: [] };
  if (rec.workdays.includes(s)) return true;
  if (CALENDAR_FIXED.includes(s.slice(5)) || rec.holidays.includes(s)) return false;
  const w = D(s).getUTCDay(); return w !== 0 && w !== 6;
};
const addWork  = (s, n) => { let c = s, k = 0; while (k < n) { c = addDays(c, 1); if (isWork(c)) k++; } return c; };
/* Годы промежутка, которых нет в календаре, — для видимой отметки рядом со сроком. */
function calGap(from, to) { const out = []; if (!from || !to) return out; for (let y = +from.slice(0, 4); y <= +to.slice(0, 4); y++) if (!calendarYearKnown(y)) out.push(y); return out; }
const calNote = (from, to) => { const g = calGap(from, to); return g.length ? 'календарь ' + g.join(', ') + ' года не заведён — рабочие дни по сб/вс' : ''; };
/* Рабочих дней после даты по дату включительно. */
function workBetween(a, b) { let c = a, k = 0; while (c < b) { c = addDays(c, 1); if (isWork(c)) k++; } return k; }

  s = String(s == null ? '' : s).trim(); if (!s) return '';

  if (m) iso = m[3] + '-' + m[2] + '-' + m[1]; else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) iso = s;
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === iso ? iso : null;

  RES.filter(r => r.doc === d.id).forEach(r => { P.add(r.author); P.add(r.resp); r.co.forEach(c => P.add(c)); });

  });
  /* проверка «есть ли открытое задание» смотрит и на поштучные, и на списки валов */
  const openKeys = new Set();
  TASKS.filter(t => t.open).forEach(t => { if (t.val) t.items.filter(i => i.live).forEach(i => openKeys.add(i.key)); else openKeys.add(t.key); });
  const fresh = cur.filter(p => !openKeys.has(p.key));
  const prevOf = key => TASKS.filter(t => t.key === key || (t.val && t.items.some(i => i.key === key))).slice(-1)[0];
  const groups = new Map();
  fresh.forEach(p => { const g = p.kind + '|' + addrKey(p.addr); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); });
  groups.forEach(list => {
    const p0 = list[0];
    if (list.length > thresholdOf(p0.kind)) {
      const id = 'З-' + (++SEQ.task);
      TASKS.push({ id, val: true, key: 'вал|' + id, kind: p0.kind, addr: p0.addr, due: list.map(p => p.due).sort()[0], base: p0.base, doc: null, at: S.clock, open: true, taken: null,
        inWork: !p0.addr.role, items: list.map(p => { const prev = prevOf(p.key); return { key: p.key, doc: p.doc, due: p.due, live: true, repeatOf: prev ? prev.id : null }; }) });
    } else list.forEach(p => {
      const prev = prevOf(p.key);
      TASKS.push({ id: 'З-' + (++SEQ.task), key: p.key, kind: p.kind, addr: p.addr, due: p.due, base: p.base, doc: p.doc, at: S.clock, open: true, taken: null,
        inWork: !p.addr.role, repeatOf: prev ? prev.id : null });
    });
  });
  STEPBY = {};
}
/* «Взять в работу» — только у очереди роли (ЗН-17): у названного адресата задание сразу в работе. */
function takeTask(taskId, actor) {
  const t = TASKS.find(x => x.id === taskId); if (!t || !t.open) return no('задание не открыто');
  if (!t.addr.role) return no('у названного адресата шага «Взять в работу» нет — задание сразу в работе');
  if (!hasRole(actor, t.addr.role)) return no('взять можно задание очереди своей роли');
  if (t.taken) return no('задание уже взял ' + empName(t.taken));
  t.taken = actor; t.inWork = true; return yes;
}
/* Кто видит задание на дату: адресат или взявший; очередь, пока не взята, — все носители роли;
   замещающий адресата — видит и действует за него, задание не переезжает (ЗН-22). */
function taskViewers(t, date = S.clock) {
  const exec = t.taken || t.addr.emp;
  const base = exec ? [exec] : EMP.filter(e => hasRole(e.id, t.addr.role)).map(e => e.id);
  const subs = exec ? SUBST.filter(s => s.for === exec && s.from <= date && date <= s.to && !(t.addr.personal && !s.signRight))
    .map(s => ({ emp: s.who, for: exec, afterIssue: s.from > t.at })) : [];
  return { exec: exec || null, base, subs };
}
/* Сигналы просрочки «Заданий» на дату (§10.1 пп. 2 и 7) — вывод, документооборот их не шлёт. */
const roleHolders = r => EMP.filter(e => hasRole(e.id, r)).map(e => e.id);
function taskSignals(date = S.clock) {
  const out = [];
  TASKS.filter(t => t.open && t.due && t.due < date).forEach(t => {
    const late = workBetween(t.due, date), esc5 = late >= 5;
    if (t.addr.role && !t.taken) {
      const head = (DEPTS.find(x => x.id === ROLE_DEPT[t.addr.role]) || {}).head;
      out.push({ task: t, kind: 'nobody', to: head ? [head] : roleHolders('admin'), text: 'задание «никто не взял» руководителю подразделения роли' });
      out.push({ task: t, kind: 'expired', to: roleHolders(t.addr.role), text: 'уведомление «срок истёк» носителям роли' });
      if (esc5) out.push({ task: t, kind: 'escalation', to: roleHolders('admin'), text: 'эскалация администратору документооборота (5-й р.д.)' });
    } else {
      const ex = t.taken || t.addr.emp;
      out.push({ task: t, kind: 'expired', to: [ex], text: 'уведомление «срок истёк» исполнителю' });
      if (esc5) { const m = (emp(ex) || {}).mgr; out.push({ task: t, kind: 'overdue', to: m ? [m] : roleHolders('admin'), text: 'задание «Просрочено задание» руководителю исполнителя (5-й р.д.)' }); }
    }
  });
  return out;
}

/* ================== действия волны 2 (ДО-30, §10.3, печать) ================== */
/* «Направить на ознакомление» с файлом (§4.5, ДО-30, P25-R23): любой зарегистрированный или сданный
   документ; направляет участник или регистратор (ДО-Д21); новый файл — ролью «приложение» и только
   тем, кто вправе добавлять файлы после регистрации (ДО-Д7), остальные выбирают файл документа. */
function sendForAcq(docId, actor, o = {}) {
  const [d, e] = guard(docId, actor); if (e) return e;
  if (!['registered', 'filed'].includes(d.stage)) return no('направить на ознакомление можно зарегистрированный документ');
  if (!(isReg(actor) || participants(d).has(actor))) return no('направляет участник документа или регистратор');
  const emps = [...new Set((o.emps || []).filter(x => emp(x)))]; if (!emps.length) return no('не выбрано, кому направить');
  const busy = emps.filter(x => d.recipients.some(r => r.mode === 'acq' && r.emp === x && !r.acqAt));
  if (busy.length) return no('уже направлено и не ознакомлен: ' + busy.map(empName).join(', '));
  if (!o.fileId && !String(o.file || '').trim()) return no('нужен файл: новый или из файлов документа');
  if (o.fileId && !d.files.some(f => f.id === o.fileId)) return no('файл не найден у документа');
  return oneRun(() => {
    let f = o.fileId ? d.files.find(x => x.id === o.fileId) : null;
    if (!f) { const r = attach(d.id, actor, 'appendix', o.file, { size: o.size }); if (!r.ok) return r; f = r.file; }
    emps.forEach(x => d.recipients.push({ emp: x, mode: 'acq', reviewed: null, acqAt: null, sent: { at: S.clock, by: actor, fileId: f.id } }));
    log(d, actor, 'Направлен на ознакомление', emps.map(empName).join(', ') + ' · файл ' + fileName(d, f));
    return { ok: true, why: '', file: f, msg: 'Направлено на ознакомление: ' + emps.length };
  });
}
/* Цели меры — обязанные лица по документу: заёмщик кредита и заёмщики-привязки, адресаты-субъекты
   (заёмщик, поручитель). */
function measureTargets(d) {
  const T_ = [];
  d.links.forEach(l => { if (l.k === 'loan') T_.push((linkObj('loan', l.id) || {}).borrower); if (l.k === 'borrower') T_.push(l.id); });
  d.addressees.forEach(a => { const s = SUBJ.find(x => x.id === a.subj); if (s && ['Заёмщик', 'Поручитель'].includes(s.kind)) T_.push(s.id); });
  if (d.kind === 'in' && d.sender.subj && (SUBJ.find(x => x.id === d.sender.subj) || {}).kind === 'Заёмщик') T_.push(d.sender.subj);
  return [...new Set(T_.filter(Boolean))];
}
function preMeasure(d, actor) {
  if (d.legacy) return no('меры по перенесённым документам ведутся как прежде');
  if (d.stage === 'annulled') return no('документ аннулирован');
  if (!['registered', 'filed'].includes(d.stage)) return no('мера регистрируется из зарегистрированного документа');
  if (!d.links.some(l => l.k === 'phase')) return no('у документа нет привязки к фазе взыскания');
  if (!participants(d).has(actor)) return no('меру из документа регистрирует участник документа');
  if (!measureTargets(d).length) return no('у документа нет обязанного лица для цели меры');
  return yes;
}
/* «Зарегистрировать меру» (§10.3, ДО-39, ADR-0270; ДО-Д22) — заглушка шва «Взыскания»: мера хранит
   вид, документ, фазу, цель и штамп своей регистрации; номера и дат у неё нет — их читает measureView. */
function registerMeasure(docId, actor, o = {}) {
  const [d, e] = guard(docId, actor); if (e) return e;
  const p = preMeasure(d, actor); if (!p.ok) return p;
  const mk = MEASURE_KINDS.find(k => k.id === o.kind); if (!mk) return no('вид меры не выбран');
  if (mk.doc === 'none') return no('вид меры не требует документа — ведётся во «Взыскании»');
  if (mk.doc !== (d.kind === 'in' ? 'in' : 'our')) return no(d.kind === 'in' ? 'вид меры ждёт наш документ, а это входящий' : 'вид меры ждёт входящий документ');
  const targets = measureTargets(d), target = o.target || targets[0];
  if (!targets.includes(target)) return no('цель меры — обязанное лицо по документу');
  if (MEASURES.some(m => m.doc === d.id && m.target === target)) return no('мера по этому документу и цели уже зарегистрирована');
  const m = { id: 'М-' + (++SEQ.meas), kind: mk.id, doc: d.id, phase: d.links.find(l => l.k === 'phase').id, target, at: S.clock, by: actor };
  MEASURES.push(m);
  log(d, actor, 'Зарегистрирована мера взыскания', `${mk.name} · цель ${subjName(target)} · номер и даты мера читает из документа`);
  return { ok: true, why: '', id: m.id, measure: m, view: measureView(d.id, target), msg: 'Мера зарегистрирована во «Взыскании»' };
}

/* ========== справочники: правка с журналом (§1.2, §1.6, §1.11, §1.12; §8.1; ДО-Д18, ДО-Д23) ========== */
const DSEQ = { type: 0, method: 0 };
function dlog(by, dict, act, text) { DICTLOG.push({ at: S.clock, by, dict, act, text }); }
const adminGate = actor => isAdmin(actor) ? null : no('справочник ведёт администратор документооборота');
const diffText = (was, now) => Object.keys(now).filter(k => String(was[k]) !== String(now[k])).map(k => `${k}: было «${was[k]}», стало «${now[k]}»`).join('; ');
function typeView(t) {
  return { 'Наименование': t.name, 'Цель': PURPOSE[t.purpose], 'Требует ответа': t.kind === 'in' ? (t.reply ? 'да' : 'нет') : '—',
    'Обязательная привязка': t.links.map(k => LINK_KINDS[k].toLowerCase()).join(' + ') || '—', 'Дело по умолчанию': t.caseId ? caseOf(t.caseId).idx : '—',
    'Срочность': URG[t.urgency].name, 'Действует': t.active ? 'да' : 'нет' };
}
function typeSave(actor, o = {}) {
  const g = adminGate(actor); if (g) return g;
  const name = String(o.name || '').trim(); if (!name) return no('нет наименования');
  const links = o.links || []; if (links.some(k => !LINK_KINDS[k])) return no('вид объекта привязки не из списка');
  if (o.urgency && !URG[o.urgency]) return no('срочность не из шкалы');
  if (o.purpose && !PURPOSE[o.purpose]) return no('цель не из шкалы');
  if (o.caseId) { const c = caseOf(o.caseId); if (!c || c.year !== clockYear()) return no('дело по умолчанию — из номенклатуры текущего года'); }
  const kind = o.id ? (typeOf(o.id) || {}).kind : o.kind;
  if (TYPES.some(x => x.id !== o.id && x.kind === kind && x.name.toLowerCase() === name.toLowerCase())) return no('тип с таким наименованием у этого вида уже есть');
  if (o.id) {
    const t = typeOf(o.id); if (!t) return no('тип не найден');
    if (t.legacyOnly) return no('тип для перенесённых документов не правится');
    if (o.kind && o.kind !== t.kind) return no('вид типа не меняется — новый вид означает новый тип');
    const was = typeView(t);
    Object.assign(t, { name, links: [...links], caseId: o.caseId || null, urgency: o.urgency || t.urgency, purpose: o.purpose || t.purpose,
      reply: t.kind === 'in' ? !!o.reply : false, active: o.active !== false });
    const ch = diffText(was, typeView(t)); if (!ch) return no('изменений нет');
    dlog(actor, 'Типы документов', 'Изменён тип', `${KINDS[t.kind].short} · ${ch}`); return { ok: true, why: '', id: t.id };
  }
  if (!KINDS[kind]) return no('вид не выбран');
  const t = T('t-n' + (++DSEQ.type), kind, name, { reply: kind === 'in' && !!o.reply, links: [...links], caseId: o.caseId || null, urgency: o.urgency, purpose: o.purpose });
  TYPES.push(t); dlog(actor, 'Типы документов', 'Добавлен тип', `${KINDS[kind].short} · ${name}`); return { ok: true, why: '', id: t.id };
}
function phraseSave(actor, o = {}) {
  const g = adminGate(actor); if (g) return g;
  const text = String(o.text || '').trim(); if (!text) return no('пустая фраза');
  if (PHRASES.some((p, i) => i !== o.idx && p.toLowerCase() === text.toLowerCase())) return no('такая фраза уже есть');
  if (o.idx != null) { if (!PHRASES[o.idx]) return no('фраза не найдена'); const was = PHRASES[o.idx]; PHRASES[o.idx] = text; dlog(actor, 'Фразы резолюций', 'Изменена фраза', `было «${was}», стало «${text}»`); }
  else { PHRASES.push(text); dlog(actor, 'Фразы резолюций', 'Добавлена фраза', text); }
  return yes;
}
function phraseRemove(actor, idx) {
  const g = adminGate(actor); if (g) return g;
  if (!PHRASES[idx]) return no('фраза не найдена');
  if (PHRASES.length === 1) return no('справочник фраз не остаётся пустым');
  const [p] = PHRASES.splice(idx, 1); dlog(actor, 'Фразы резолюций', 'Удалена фраза', `${p} (в выданных резолюциях текст сохранён)`); return yes;
}
/* Право подписи не правится задним числом (ДО-Д23): у действующей строки меняются срок окончания (не
   раньше сегодняшнего) и основание; истёкшая не продлевается, другой набор типов — новой строкой;
   строки не удаляются. */
function signRightSave(actor, o = {}) {
  const g = adminGate(actor); if (g) return g;
  if (o.id) {
    const row = SIGN.find(x => x.id === o.id); if (!row) return no('строка не найдена');
    if (o.emp && o.emp !== row.emp) return no('сотрудник в строке не меняется');
    if (o.types && [...o.types].sort().join() !== [...row.types].sort().join()) return no('набор типов не меняется — заведите новую строку');
    if (o.from && toIso(o.from) !== row.from) return no('начало действия не меняется задним числом');
    const to = o.to != null ? toIso(o.to) : row.to; if (!to) return no('неверная дата окончания');
    if (to !== row.to && row.to < S.clock) return no('строка истекла — новое право заводится новой строкой');
    if (to !== row.to && to < S.clock) return no('право не закрывается задним числом: окончание не раньше сегодняшнего дня');
    if (to < row.from) return no('окончание раньше начала');
    const basis = o.basis != null ? String(o.basis).trim() : row.basis; if (!basis) return no('нужно основание');
    const was = { 'Основание': row.basis, 'По': fmt(row.to) }; Object.assign(row, { to, basis });
    const ch = diffText(was, { 'Основание': row.basis, 'По': fmt(row.to) }); if (!ch) return no('изменений нет');
    dlog(actor, 'Право подписи', 'Изменена строка', `${row.id} · ${empName(row.emp)} · ${ch}`); return { ok: true, why: '', id: row.id };
  }
  if (!emp(o.emp)) return no('сотрудник не выбран');
  const types = [...new Set(o.types || [])]; if (!types.length) return no('типы документов не выбраны');
  if (types.some(id => { const t = typeOf(id); return !t || t.kind === 'in' || t.legacyOnly; })) return no('право подписи — на типы исходящих и внутренних');
  const basis = String(o.basis || '').trim(); if (!basis) return no('нужно основание: доверенность или должность');
  const from = toIso(o.from), to = toIso(o.to); if (!from || !to) return no('нужен срок «с — по»'); if (from > to) return no('начало позже окончания');
  const id = 'ПП-' + (Math.max(0, ...SIGN.map(x => +x.id.split('-')[1])) + 1);
  SIGN.push({ id, emp: o.emp, types, basis, from, to });
  dlog(actor, 'Право подписи', 'Добавлена строка', `${id} · ${empName(o.emp)} · ${types.map(t => typeOf(t).name).join(', ')} · ${basis} · ${fmt(from)}–${fmt(to)}`); return { ok: true, why: '', id };
}
/* Способы отправки (§1.6, ДО-40): ключ устойчив, способ не удаляется; изменение подтверждения действует на следующие отметки. */
function methodSave(actor, o = {}) {
  const g = adminGate(actor); if (g) return g;
  const name = String(o.name || '').trim(); if (!name) return no('нет наименования');
  if (Object.entries(METHODS).some(([k, m]) => k !== o.key && m.name.toLowerCase() === name.toLowerCase())) return no('способ с таким наименованием уже есть');
  const view = m => ({ 'Наименование': m.name, 'Почтовый идентификатор': m.track ? 'обязателен' : 'нет', 'Подтверждение': m.proof || '—' });
  if (o.key) {
    const m = METHODS[o.key]; if (!m) return no('способ не найден'); const was = view(m);
    Object.assign(m, { name, track: !!o.track, proof: String(o.proof || '').trim() });
    const ch = diffText(was, view(m)); if (!ch) return no('изменений нет');
    dlog(actor, 'Способы отправки', 'Изменён способ', ch); return { ok: true, why: '', key: o.key };
  }
  const key = 'm' + (++DSEQ.method); METHODS[key] = { name, track: !!o.track, proof: String(o.proof || '').trim() };
  dlog(actor, 'Способы отправки', 'Добавлен способ', `${name} · подтверждение: ${METHODS[key].proof || '—'}`); return { ok: true, why: '', key };
}
/* Номенклатура дел (§1.12) — ведёт архивариус (ТЗ 23, P25-R25; расхождение с §8.1 канона — ДО-Д18). */
const archGate = actor => isArch(actor) ? null : no('номенклатуру дел ведёт архивариус');
function caseSave(actor, o = {}) {
  const g = archGate(actor); if (g) return g;
  const name = String(o.name || '').trim(); if (!name) return no('нет названия дела');
  if (!DEPTS.some(x => x.id === o.dept)) return no('подразделение не выбрано');
  const keep = String(o.keep || '').trim(); if (!keep) return no('нужен срок хранения');
  const place = String(o.place || '').trim();
  const view = c => ({ 'Название': c.name, 'Подразделение': (DEPTS.find(x => x.id === c.dept) || {}).name, 'Срок хранения': c.keep, 'Место хранения': c.place || '—' });
  if (o.id) {
    const c = caseOf(o.id); if (!c) return no('дело не найдено');
    if (o.idx && o.idx !== c.idx) return no('индекс дела не меняется');
    if (o.year && +o.year !== c.year) return no('год дела не меняется');
    const was = view(c); Object.assign(c, { name, dept: o.dept, keep, place });
    const ch = diffText(was, view(c)); if (!ch) return no('изменений нет');
    dlog(actor, 'Номенклатура дел', 'Изменено дело', `${c.year} · ${c.idx} · ${ch}`); return { ok: true, why: '', id: c.id };
  }
  const year = +o.year || clockYear(); if (year < clockYear()) return no('номенклатура прошлого года закрыта');
  const idx = String(o.idx || '').trim(); if (!/^\d{2}-\d{2}$/.test(idx)) return no('индекс дела — в виде 00-00');
  if (CASES.some(c => c.year === year && c.idx === idx)) return no(`дело ${idx} в ${year} году уже есть`);
  const c = { id: 'c' + year + '-' + idx, year, idx, name, dept: o.dept, keep, place }; CASES.push(c);
  dlog(actor, 'Номенклатура дел', 'Заведено дело', `${year} · ${idx} ${name}`); return { ok: true, why: '', id: c.id };
}
function casesCopy(actor, from, to) {
  const g = archGate(actor); if (g) return g;
  from = +from; to = +to;
  if (!(to > from)) return no('копируется на следующий год');
  if (to < clockYear()) return no('номенклатура прошлого года закрыта');
  const src = CASES.filter(c => c.year === from); if (!src.length) return no(`номенклатуры ${from} года нет`);
  const made = [];
  src.forEach(c => { if (!CASES.some(x => x.year === to && x.idx === c.idx)) { const n = { ...c, id: 'c' + to + '-' + c.idx, year: to }; CASES.push(n); made.push(n.idx); } });
  dlog(actor, 'Номенклатура дел', 'Номенклатура скопирована', `${from} → ${to}: заведено ${made.length}, уже были ${src.length - made.length}`);
  return { ok: true, why: '', created: made.length, skipped: src.length - made.length, msg: `Заведено дел: ${made.length}, уже были: ${src.length - made.length}` };
}
/* Порог свёртки вида шага (§10.1 п. 6, ЗН-25): объявляет документооборот как владелец вида (ДО-Д19). */
function thresholdSave(actor, kind, n) {
  const g = adminGate(actor); if (g) return g;
  if (!POVOD_NAME[kind]) return no('вид шага не найден');
  const v = Number(n); if (!Number.isInteger(v) || v < 1) return no('порог — целое число от 1');
  const was = thresholdOf(kind); if (was === v) return no('изменений нет');
  BATCH_THRESHOLD[kind] = v; dlog(actor, 'Порог свёртки', 'Изменён порог', `${POVOD_NAME[kind]}: было ${was}, стало ${v}`); return yes;
}

/* ==================== перенос из старой системы (§11, С-29) ==================== */
/* Прогон повторяемый (P25-R39): ключ — id старой системы, второй прогон новых документов не создаёт;
   счётчик года ставится на максимум старой системы и никогда не понижается (ДО-Д26). */
function migrationRun(actor) {
  if (!isAdmin(actor)) return no('перенос запускает администратор документооборота');
  const R = { n: MIGRATIONS.length + 1, at: S.clock, by: actor, found: LEGACY_SRC.docs.length, created: 0, skipped: 0, files: 0, logs: 0, tasks: 0, tasksClosed: 0, dubious: 0, counters: [] };
  LEGACY_SRC.docs.forEach(x => {
    if (DOCS.some(d => d.legacySrc === x.src)) { R.skipped++; return; }
    const docDate = x.docDate || x.regDate;
    const d = { id: 'D-' + (++SEQ.doc), kind: x.kind, type: x.type, subject: x.subject, stage: 'filed', deleted: null, no: null, regDate: x.regDate, regBy: null, docDate,
      receivedDate: x.kind === 'in' ? x.regDate : null, corrNo: '', corrDate: null, senderKind: x.senderKind || '', sender: { subj: '', text: x.sender || '' }, recipients: [],
      addressees: (x.addr || []).map(a => ({ id: 'A-' + (++SEQ.addr), subj: a.subj || '', text: a.text || '', method: 'post', sentDate: x.regDate, track: '', outcome: null, outcomeDate: null, proof: null })),
      author: null, approvers: [], signer: null, rounds: [], signed: null, urgency: 'normal', purpose: 'exec', needsReply: false, control: false, controller: null, basis: [],
      links: x.links || [], caseId: null, filedAt: null, legacy: true, legacySrc: x.src, legacyNo: x.no, legacyYear: x.year,
      dubious: docDate < '2000-01-01' ? 'дата сомнительна: ' + fmt(docDate) + ' — заглушка старой системы' : '',
      legacyTasks: x.tasks.map(t => ({ text: t.text, who: t.who, state: t.open ? 'закрыта при переносе' : 'выполнена в старой системе' })),
      files: x.files.map((fn, k) => ({ id: 'F-' + (++SEQ.file), role: x.kind === 'in' ? 'scan' : 'signed', idx: k + 1, ver: 1, ext: fn.split('.').pop().toLowerCase(), size: 340000,
        sha: fakeSha(x.src + k), at: x.regDate, by: null, hist: [] })),
      comments: [], log: [{ at: x.regDate, by: null, act: 'Перенесён из старой системы', text: 'номер ' + x.no + ' · прогон ' + R.n }]
        .concat(Array.from({ length: x.log }, (_, k) => ({ at: x.regDate, by: null, act: 'Из журнала старой системы', text: 'запись ' + (k + 1) }))),
      returned: null, annul: null, createdAt: x.regDate, fromBlank: null };
    DOCS.push(d);
    R.created++; R.files += x.files.length; R.logs += x.log; R.tasks += x.tasks.length; R.tasksClosed += x.tasks.filter(t => t.open).length; if (d.dubious) R.dubious++;
  });
  Object.entries(LEGACY_SRC.counters).forEach(([k, ys]) => Object.entries(ys).forEach(([y, mx]) => {
    COUNTERS[k] = COUNTERS[k] || {}; const before = COUNTERS[k][y] || 0, after = Math.max(before, mx);
    COUNTERS[k][y] = after; R.counters.push({ kind: k, year: +y, src: mx, before, after });
  }));
  const L = DOCS.filter(d => d.legacy), dupKeys = new Set(L.filter(d => L.filter(z => z.kind === d.kind && z.legacyNo === d.legacyNo && z.legacyYear === d.legacyYear).length > 1).map(d => d.kind + d.legacyNo + d.legacyYear));
  R.dupNumbers = dupKeys.size; R.legacyTotal = L.length;
  MIGRATIONS.push(R); sync();
  return { ok: true, why: '', report: R, msg: `Прогон ${R.n}: новых документов ${R.created}, уже перенесены ${R.skipped}` };
}

/* Пачка выпусков «Отчётности» → пачка черновиков с общим маршрутом (§10.2, ДО-41); с submit — сразу по
   маршруту одним действием, то есть одним прогоном опроса: у подписанта один вал-задание (С-32). */
function fromBlankPack(packId, actor, o = {}) {
  const pk = PACKS.find(x => x.id === packId); if (!pk) return no('пачка не найдена');
  if (pk.docIds.length) return no('по пачке уже созданы черновики');
  const t = typeOf(pk.type);
  if (o.submit) { if (!emp(o.signer)) return no('для отправки по маршруту нужен подписант'); if (!hasSignRight(o.signer, t.id, S.clock)) return no('у подписанта нет права подписи на этот тип на сегодня'); }
  return oneRun(() => {
    const ids = [];
    for (const it of pk.items) {
      const r = create(actor, t.kind, { type: t.id, subject: it.subject, links: it.links, addressees: [{ subj: it.recipient }], signer: o.signer || null, approvers: o.approvers || [] });
      if (!r.ok) return r;
      r.doc.fromBlank = it.id; ids.push(r.id);
      r.doc.files.push({ id: 'F-' + (++SEQ.file), role: 'project', idx: 1, ver: 1, ext: 'pdf', size: 160000, sha: fakeSha(it.id), at: S.clock, by: actor, hist: [] });
      log(r.doc, actor, 'Создан из выпуска «Отчётности»', `${it.id} · ${pk.template} · пачка ${pk.id}`);
    }
    if (o.submit) for (const id of ids) { const s = submit(id, actor); if (!s.ok) return s; }
    pk.docIds = ids;
    return { ok: true, why: '', ids, msg: `Создано черновиков: ${ids.length}` + (o.submit ? ' · отправлены по маршруту' : '') };
  });
}

/* ====================== журналы и поиск (§9.1) ====================== */
function roleIn(d, e) {
  const r = [];
  if (d.author === e && d.kind !== 'in') r.push('автор');
  if (d.rounds.some(x => x.steps.some(s => s.emp === e)) || d.approvers.includes(e)) r.push('согласующий');
  if (d.signer === e) r.push('подписант');
  if (d.regBy === e || (d.kind === 'in' && d.author === e)) r.push('регистратор');
  const rec = d.recipients.find(x => x.emp === e); if (rec) r.push(rec.mode === 'acq' ? 'получатель (ознакомление)' : 'получатель');
  if (RES.some(x => x.doc === d.id && x.resp === e)) r.push('ответственный');
  if (RES.some(x => x.doc === d.id && x.co.includes(e))) r.push('соисполнитель');
  if (d.controller === e) r.push('контролёр');
  return r;
}
function searchText(d) {
  const L = d.links.map(l => { const o = linkObj(l.k, l.id) || {}; const s = SUBJ.find(x => x.id === l.id); return [o.label, s && s.inn].join(' '); });
  return [noText(d), d.legacyNo, d.corrNo, d.subject, senderName(d), ...d.addressees.map(addrName), ...L, (typeOf(d.type) || {}).name].join(' ').toLowerCase();
}
function execCode(d) { const x = execInfo(d); return x ? x.code : ''; }
function journal(view, actor = S.user, o = {}) {
  let L = DOCS.filter(d => !d.deleted && canSee(d, actor));
  if (view === 'mine') L = L.filter(d => participants(d).has(actor));
  else L = L.filter(d => d.kind === view);
  const q = String(o.q || '').trim().toLowerCase();
  if (q) L = L.filter(d => searchText(d).includes(q));
  if (o.type) L = L.filter(d => d.type === o.type);
  if (o.stage) L = L.filter(d => d.stage === o.stage);
  if (o.exec) L = L.filter(d => execCode(d) === o.exec);
  if (o.from) L = L.filter(d => (d.regDate || '') >= o.from);
  if (o.to) L = L.filter(d => d.regDate && d.regDate <= o.to);
  const k = d => (d.regDate || d.createdAt) + ' ' + (d.no ? String(d.no.n).padStart(6, '0') : '') + d.id.padStart(6, '0');
  return L.sort((a, b) => k(b).localeCompare(k(a)));
}
const GROUPS = { type: 'Тип', stage: 'Этап', party: 'Отправитель / адресат', exec: 'Исполнитель', dept: 'Отдел', month: 'Месяц регистрации' };
function groupKey(d, g) {
  if (g === 'type') return typeOf(d.type).name;
  if (g === 'stage') return STAGES[d.stage];
  if (g === 'party') return d.kind === 'in' ? senderName(d) || '—' : d.addressees.map(addrName).join(', ') || '—';
  if (g === 'exec') { const t = topRes(d); return t.length ? [...new Set(t.map(r => empName(r.resp)))].join(', ') : '—'; }
  if (g === 'dept') return d.kind === 'in' ? 'Канцелярия (входящие)' : deptOf(d.author).name;
  if (g === 'month') return d.regDate ? d.regDate.slice(5, 7) + '.' + d.regDate.slice(0, 4) : 'без регистрации';
  return '';
}
function grouped(list, g) { const m = new Map(); list.forEach(d => { const k = groupKey(d, g); if (!m.has(k)) m.set(k, []); m.get(k).push(d); }); return [...m.entries()]; }

/* ===================== показатели (§9.2, предпросмотр) ================ */
function indicators(from, to) {
  const inP = x => x && x >= from && x <= to;
  const N = DOCS.filter(d => !d.legacy && !d.deleted);
  const reg = N.filter(d => d.no && inP(d.regDate));
  const row = {};
  ['in', 'out', 'int'].forEach(k => { row[k] = reg.filter(d => d.kind === k && d.stage !== 'annulled').length; });
  row.annulled = reg.filter(d => d.stage === 'annulled').length;
  const live = N.filter(d => ['registered', 'filed'].includes(d.stage));
  const X = live.map(d => [d, execInfo(d)]);
  row.inWork = X.filter(([, x]) => !x.done).length;
  row.overdue = X.filter(([, x]) => !x.done && x.code === 'overdue').length;
  const ex = X.filter(([, x]) => x.done && inP(x.date));
  row.executed = ex.length;
  const timed = ex.filter(([, x]) => x.deadline);
  row.onTime = timed.filter(([, x]) => x.date <= x.deadline).length;
  row.onTimeExt = timed.filter(([, x]) => x.date <= x.deadline && x.ext).length;
  row.late = timed.filter(([, x]) => x.date > x.deadline).length;
  row.refused = X.filter(([d]) => topRes(d).some(r => r.outcome && r.outcome.kind === 'refused' && inP(r.outcome.at))).length
    + DOCS.filter(d => d.deleted && d.deleted.afterSignerRefusal && inP(d.deleted.at)).length;
  row.pct = (row.onTime + row.late) ? Math.round(100 * row.onTime / (row.onTime + row.late)) : null;
  return row;
}

const $ = s => document.querySelector(s);
const TITLES = { in: 'Входящие', out: 'Исходящие', int: 'Внутренние', mine: 'Мои документы', archive: 'Архив', indicators: 'Показатели', settings: 'Настройки' };
const pill = (cls, t) => `<span class="pill ${cls}">${esc(t)}</span>`;
const stagePill = d => d.legacy ? pill('neutral', 'из старой системы') : pill(STAGE_PILL[d.stage], STAGES[d.stage]) + (d.stage === 'signing' && d.signed ? ' ' + pill('ok', 'подписан') : '');
const dueCell = due => due ? `<span class="${due < S.clock ? 'red' : ''}">${fmt(due)}</span>` : '—';
function execPill(d) {
  const x = execInfo(d); if (!x) return '—';
  const cls = { done: 'ok', overdue: 'err', work: 'info', await: 'warn' }[x.code];
  return pill(cls, d.kind === 'out' ? (x.done ? 'отправлен' : 'не отправлен') : EXEC_NAME[x.code]);
}
function nearestDue(d) { const open = topRes(d).filter(r => !resClosed(r)); return open.length ? open.map(effDue).sort()[0] : null; }
const openLink = (d, label) => `<button class="linky" data-testid="open-${d.id}" onclick="DF.openDoc('${d.id}')">${esc(label)}</button>`;
function cols(view) {
  const num = d => openLink(d, noText(d) || 'черновик');
  const C = {
    in: [['Номер', num], ['Дата рег.', d => fmt(d.regDate)], ['Отправитель', d => esc(senderName(d))], ['№ и дата отправителя', d => esc((d.corrNo || '—') + (d.corrDate ? ' от ' + fmt(d.corrDate) : ''))],
      ['Тема', d => esc(d.subject)], ['Тип', d => esc(typeOf(d.type).name)], ['Этап', stagePill], ['Исполнение', execPill], ['Срок', d => dueCell(nearestDue(d))]],
    out: [['Номер', num], ['Дата', d => fmt(d.regDate || d.docDate)], ['Адресаты', d => esc(d.addressees.map(addrName).join(', '))], ['Тема', d => esc(d.subject)], ['Тип', d => esc(typeOf(d.type).name)],
      ['Подписант', d => esc(d.signer ? empName(d.signer) : '—')], ['Этап', stagePill], ['Отправка', d => d.no ? esc(execText(d)) : '—']],
    int: [['Номер', num], ['Дата', d => fmt(d.regDate || d.docDate)], ['Автор', d => esc(empName(d.author))], ['Тема', d => esc(d.subject)], ['Тип', d => esc(typeOf(d.type).name)], ['Этап', stagePill],
      ['Ознакомление / исполнение', d => d.no ? esc(execText(d)) : '—']],
    mine: [['Вид', d => KINDS[d.kind].short], ['Номер', num], ['Дата', d => fmt(d.regDate || d.createdAt)], ['Тема', d => esc(d.subject)], ['Моя роль', d => esc(roleIn(d, S.user).join(', '))], ['Этап', stagePill], ['Исполнение', execPill]],
  };
  return C[view];
}

    <div class="btn-row"><button class="btn btn-secondary" data-testid="print" onclick="DF.uiPrint()">Печатная форма журнала</button></div></div>

    <div class="fld" style="flex:1;min-width:260px"><label>Поиск</label><input data-testid="search" value="${esc(S.q)}" placeholder="номер, тема, отправитель, ИНН, кредит" onchange="DF.search(this.value)"></div>
    <div class="fld"><label>Тип</label>${sel('type', typeOpts.map(t => [t.id, (kind ? '' : KINDS[t.kind].short + ' · ') + t.name]), S.f.type, 'все типы')}</div>

  <table class="cgrid" data-testid="journal"><thead><tr>${C.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${C.length}" class="muted">Документов нет</td></tr>`}</tbody></table>`;

/* «Ждут моей подписи» (P25-R14): выбор нескольких и подпись пачкой одним действием (ДО-41, С-32). */
function waitingSign(u) { return DOCS.filter(d => !d.deleted && !d.legacy && d.stage === 'signing' && !d.signed && actsFor(u, d.signer) && canSee(d, u)); }
function signQueue(u) {
  const L = waitingSign(u); if (!L.length) return '';
  return `<div class="card" data-testid="sign-queue"><div class="card-head"><h3>Ждут моей подписи · ${L.length}</h3><div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="DF.pickAll(true)">Выбрать все</button>
      <button class="btn btn-primary btn-sm" data-testid="sign-batch" onclick="DF.uiSignBatch()">Подписать пачкой</button></div></div>
    <table class="cgrid"><thead><tr><th></th><th>Тема</th><th>Тип</th><th>Адресат</th><th>Автор</th><th>Право подписи</th></tr></thead><tbody>
    ${L.map(d => { const c = canSign(d, u); return `<tr><td><input type="checkbox" class="pick" data-id="${d.id}" data-testid="pick-${d.id}"></td><td>${openLink(d, d.subject)}</td><td>${esc(typeOf(d.type).name)}</td>
      <td>${esc(d.addressees.map(addrName).join(', ') || '—')}</td><td>${esc(empName(d.author))}</td><td>${c.ok ? (c.onBehalf ? 'за ' + esc(empName(c.onBehalf)) : 'есть') : '<span class="red">' + esc(c.why) + '</span>'}</td></tr>`; }).join('')}</tbody></table>
    <div class="small" style="margin-top:6px">Подпись пачкой — одно действие; в журнал каждого документа пишется своя запись. Отказ — только по одному документу, с комментарием.</div></div>`;
}

function renderModal() {

function submitForm(vals) {
  if (!S.form) return no('форма не открыта');
  const v = {};
  S.form.fields.forEach(f => {
    if (vals && vals[f.id] !== undefined) { v[f.id] = vals[f.id]; return; }
    const el = typeof document !== 'undefined' && document.getElementById('ff_' + f.id);
    if (!el) { v[f.id] = f.value; return; }
    v[f.id] = f.type === 'check' ? el.checked : f.type === 'multi' ? [...el.selectedOptions].map(o => o.value) : el.value;
  });
  S.form.fields.forEach(f => { f.value = v[f.id]; });
  const miss = S.form.fields.find(f => f.req && (v[f.id] == null || v[f.id] === '' || (Array.isArray(v[f.id]) && !v[f.id].length)));
  const bad = S.form.fields.find(f => f.type === 'date' && v[f.id] && toIso(v[f.id]) === null);
  const r = miss ? no('не заполнено: ' + miss.label) : bad ? no(`«${bad.label}»: дата в формате ДД.ММ.ГГГГ`) : S.form.run(v);
  if (r && r.ok === false) { if (S.form) { S.form.err = r.why; renderModal(); } render(); return r; }
  const msg = S.form.msg; S.form = null; renderModal(); toast(r && r.msg || msg || 'Сохранено', 'ok'); render(); return r;
