<title>Документооборот · АСУБК</title>
<!--
  АСУБК · модуль «Документооборот» · исполняемый макет TO-BE · волна 1 (ядро).
  Источник истины — mockups/docflow/ASUBK-dokumentooborot-logika.md (канон; копия —
  docs/logika/26-dokumentooborot.md), решения — ADR-0265…ADR-0272 (при расхождении канона с ADR
  побеждает ADR), раздел ТЗ 23 — справочно. Журнал волн и расхождения ДО-Д* —
  mockups/docflow/ASUBK-status-razrabotki.md. Смоук — node scripts/inspect/docflow-check.mjs.

  ЧТО ПОКАЗЫВАЕТ ВОЛНА 1
    Журналы: Входящие · Исходящие · Внутренние · Мои (§9.1, ДО-33): поиск одной строкой,
      фильтры (тип, этап, исполнение, период регистрации), группировка с итогами, наборы
      фильтров (в памяти страницы), печатная форма журнала (журнал по шаблону = фильтр по типу,
      ДО-21, §3.2; согласие заказчика — ДО-ВЗ-6).
    Карточка документа: Реквизиты · Файлы · Маршрут · Резолюции · Отправка · Ознакомление ·
      Привязки · Журнал · Комментарии; в шапке — этап, номер, сводки и кнопки доступных действий.
    Архив (§7): номенклатура дел, «ждут сдачи в дело», журнал выдачи оригиналов.
    Показатели (§9.2, ADR-0272): предпросмотр того, что шов отдаёт «Статистике».
    Настройки (§1.2, §1.11): справочники только на чтение; вкладка «Шаги для заданий» —
      ответ на опрос «Заданий» (§10.1, ИД-18) и журнал закрытия шагов.

  ПРАВИЛА, ЗАШИТЫЕ В ДВИЖОК (экраны их не поясняют — только показывают и запрещают)
    ADR-0265 · ДО-15/16/17 — этап хранится (Черновик · Согласование · Подпись ·
      Зарегистрирован · В деле · Аннулирован); исполнение, отправка и ознакомление ВЫВОДЯТСЯ
      (execInfo / dispatchInfo / acqInfo), поля «статус исполнения» нет (ИД-12). «Отправлен» и
      «Исполнен» — не этапы. Зарегистрированный не удаляется (ИД-3): «Исправить» (было/стало) или
      «Аннулировать» (номер остаётся занятым; нельзя после отправки, ИД-9).
    ADR-0267 · ДО-8/21/32/38 — три ряда (ВХ «1234», ИСХ «<код отдела>/<n>», ВН
      «<код отдела>/ВН-<n>»), номер при регистрации, с 1 каждый год по правилу (нет счётчика
      года — ряд начинается с 1). Перенос: счётчики 2026 года поставлены на максимум прежней
      системы (ВХ 4870, ИСХ 2172), ряд ВН — с 1. Номер исходящего/внутреннего — после подписи,
      скан «подписанный» прикладывается после выдачи номера; без него нет отправки и сдачи в дело.
    ADR-0266 · ДО-18/19/20/24 — резолюция: один ответственный (ИД-11), каскад, срок нижней не
      позже действующего срока верхней на момент выдачи (ИД-10), исход «Исполнено»/«Отказать».
      «Требует ответа» — гаснет ответным исходящим, отправленным отправителю; «Исполнено»
      недоступно. «На контроле» — подтверждает контролёр, возврат даёт повтор.
      Срочность → срок по умолчанию 10 / 3 / 1 р.д. от регистрации (ДО-23; ДО-ВЗ-2).
    ADR-0269 · ДО-24/36 — право подписи по справочнику «сотрудник × типы × основание × срок»;
      проверка при выборе подписанта и ещё раз на дату подписи; истекло — документ возвращается
      автору. Замещающий подписывает только по приказу «с правом подписи» (ДО-ДС-8).
      Все проверки прав — в движке (стенд «сервера»): скрытая кнопка правом не считается (ИД-20);
      чтение карточки тоже проверяется (openDoc).
    §8.3 · ДО-12 — видимость: участники, руководитель по цепочке, замещающий на срок,
      Регистратор и руководство — всё.
    ADR-0270 · ДО-6/22/31 — привязки к объектам; обязательность из типа (ИД-13), кредит
      подставляет заёмщика; мера взыскания ЧИТАЕТ номер и даты из документа (заглушка шва).
    ADR-0271 · ДО-29/34…37/44 — каждый ждущий шаг — повод для «Заданий»; адресат из повода,
      «подписать» — лично (замещающего подставляет документооборот), регистрация/отправка/сдача
      в дело — очередь роли; закрытие — отпадением с атрибуцией («исполнено», «выполнил другой»,
      «снято» с причиной). Очереди «на мне» у модуля нет.
    ADR-0268 · ДО-11 — бланк «Отчётности» с получателем → черновик исходящего (заглушка шва).
    ADR-0272 · ДО-26/43 — показатели считает «Статистика»; здесь только предпросмотр.
    Инварианты ИД-1…ИД-20 проверяет смоук (ИД-19 — перенесённые только для чтения).

  ДЕМО-ДАННЫЕ ВМЕСТО НЕОТВЕЧЕННЫХ ВОПРОСОВ (заменяются строкой справочника, модель не меняется)
    • Справочник права подписи заполнен демо-строками: ДО-ВЗ-4 (список лиц с правом подписи,
      доверенности, сроки) не отвечен; в бою, пока справочник пуст, подписать не может никто.
    • Номенклатура дел 2026 — демо (ДО-ВЗ-1).
    • Фразы резолюций — демо (долг 2); перечень «руководство» для видимости — демо (долг 3).
    • Сроки 10/3/1 р.д. — до ответа на ДО-ВЗ-2. Рабочий день = пн–пт, праздники не учтены (ДО-Д6).
    • Ограниченной видимости нет (ДО-ВЗ-5). Общего чата нет (ДО-ВЗ-3) — только лента комментариев.

  ШВЫ — ЗАГЛУШКИ ВНУТРИ МАКЕТА (соседние макеты не правятся)
    Сотрудники/Оргструктура (коды отделов, руководитель, замещение с признаком права подписи) ·
    Задания (опрос поводов, взятие из очереди, утверждённые продления — EXT) · Заёмщик/Кредит/
    Взыскание (объекты привязки, чтение мерой) · Отчётность (два демо-выпуска бланков) ·
    Справочник органов-адресатов (ДО-ДС-10).

  «Сегодня» заморожено: TODAY = 2026-10-15; системные штампы берутся из S.clock (смоук сдвигает
  его, чтобы проверить новый год). Шов для смоука — window.DF; действия возвращают {ok, why}.
-->

const POVOD_NAME = { 'doc-revise': 'доработать черновик', 'doc-approve': 'согласовать', 'doc-sign': 'подписать', 'doc-register': 'зарегистрировать',
  'doc-dispatch': 'отправить', 'doc-review': 'рассмотреть входящий', 'doc-execute': 'исполнить резолюцию', 'doc-control': 'подтвердить на контроле',
  'doc-acquaint': 'ознакомиться', 'doc-file': 'сдать в дело', 'doc-return': 'вернуть оригинал' };
function povods() {
  const out = [];
  const P = (kind, obj, addr, due, docId) => out.push({ key: kind + '|' + obj, kind, obj, addr, due, doc: docId });
  DOCS.filter(d => !d.legacy && !d.deleted).forEach(d => {
    const r = curRound(d);
    if (d.stage === 'draft' && d.returned) P('doc-revise', d.id, { emp: d.author }, addWork(d.returned.at, 3), d.id);
    if (d.stage === 'approval') r.steps.filter(s => !s.res).forEach(s => P('doc-approve', d.id + '×' + s.emp, { emp: s.emp }, addWork(r.at, 2), d.id));
    if (d.stage === 'signing' && !d.signed) P('doc-sign', d.id, { emp: d.signer, personal: true }, addWork(r.at, 2), d.id);
    if (d.stage === 'signing' && d.signed) P('doc-register', d.id, { role: 'registrar' }, addWork(d.signed.at, 1), d.id);
    if (d.stage !== 'registered') return;
    if (d.kind === 'out' && d.addressees.some(a => !a.sentDate)) P('doc-dispatch', d.id, { role: 'registrar' }, addWork(d.regDate, 2), d.id);
    if (d.kind !== 'out') {
      d.recipients.filter(x => (d.kind === 'in' || x.mode === 'exec') && !x.reviewed).forEach(x => P('doc-review', d.id + '×' + x.emp, { emp: x.emp }, addWork(d.regDate, 2), d.id));
      d.recipients.filter(x => x.mode === 'acq' && !x.acqAt).forEach(x => P('doc-acquaint', d.id + '×' + x.emp, { emp: x.emp }, addWork(d.regDate, 3), d.id));
      RES.filter(x => x.doc === d.id).forEach(x => {
        const st = resState(x).code; if (['done', 'refused', 'withdrawn'].includes(st)) return;
        if (!x.claim) P('doc-execute', x.id + '×' + x.resp, { emp: x.resp }, effDue(x), d.id);
        x.co.forEach(c => P('doc-execute', x.id + '×' + c, { emp: c }, effDue(x), d.id));
        if (x.claim) P('doc-control', x.id, { emp: d.controller }, addWork(x.claim.at, 2), d.id);
      });
    }
    if (fileReady(d).ok) P('doc-file', d.id, { role: 'archivist' }, addWork(S.clock, 5), d.id);
  });
  ISSUES.filter(i => !i.returned && i.until < S.clock).forEach(i => P('doc-return', i.id, { emp: i.to }, i.until, i.doc));
  return out;
}
/* Модель «Заданий» в миниатюре: открыть задание на новый повод, закрыть отпадением с атрибуцией. */
function sync() {
  const cur = povods(), keys = new Set(cur.map(p => p.key));
  TASKS.filter(t => t.open && !keys.has(t.key)).forEach(t => {
    const d = doc(t.doc), s = STEPBY[t.key];
    let outcome = 'исполнено', note = '';
    if (d && d.stage === 'annulled') { outcome = 'снято'; note = 'документ аннулирован'; }
    else if (d && d.deleted) { outcome = 'снято'; note = 'черновик удалён'; }
    else if (s && s.cancel) { outcome = 'снято'; note = s.cancel; }
    else if (s && s.by) {
      const own = t.taken ? actsFor(s.by, t.taken) : t.addr.role ? hasRole(s.by, t.addr.role) : actsFor(s.by, t.addr.emp);
      if (!own) note = 'выполнил другой: ' + empName(s.by); else if (t.addr.emp && s.by !== t.addr.emp) note = 'за ' + empName(t.addr.emp) + ': ' + empName(s.by);
    } else if (t.kind === 'doc-execute' || t.kind === 'doc-review') note = 'шаг закрыт документом';
    Object.assign(t, { open: false, outcome, note, closedAt: S.clock });
  });
  cur.forEach(p => {
    if (TASKS.some(t => t.open && t.key === p.key)) return;
    const prev = TASKS.filter(t => t.key === p.key).slice(-1)[0];
    TASKS.push({ id: 'З-' + (++SEQ.task), key: p.key, kind: p.kind, addr: p.addr, due: p.due, doc: p.doc, at: S.clock, open: true, taken: null, repeatOf: prev ? prev.id : null });
  });
  STEPBY = {};
}

  if (!t.addr.role || !hasRole(actor, t.addr.role)) return no('взять можно задание очереди своей роли');

function indicators(from, to) {
  const inP = x => x && x >= from && x <= to;
  const N = DOCS.filter(d => !d.legacy && !d.deleted);
  const reg = N.filter(d => d.no && inP(d.regDate));
  const row = {};
  ['in', 'out', 'int'].forEach(k => { row[k] = reg.filter(d => d.kind === k && d.stage !== 'annulled').length; });
  row.annulled = reg.filter(d => d.stage === 'annulled').length;
  const live = N.filter(d => ['registered', 'filed'].includes(d.stage));
  const X = live.map(d => [d, execInfo(d)]);
  row.inWork = X.filter(([, x]) => !x.done).length;
  row.overdue = X.filter(([, x]) => !x.done && x.code === 'overdue').length;
  const ex = X.filter(([, x]) => x.done && inP(x.date));
  row.executed = ex.length;
  const timed = ex.filter(([, x]) => x.deadline);
  row.onTime = timed.filter(([, x]) => x.date <= x.deadline).length;
  row.onTimeExt = timed.filter(([, x]) => x.date <= x.deadline && x.ext).length;
  row.late = timed.filter(([, x]) => x.date > x.deadline).length;
  row.refused = X.filter(([d]) => topRes(d).some(r => r.outcome && r.outcome.kind === 'refused' && inP(r.outcome.at))).length

  row.pct = (row.onTime + row.late) ? Math.round(100 * row.onTime / (row.onTime + row.late)) : null;

  const bad = S.form.fields.find(f => f.type === 'date' && v[f.id] && toIso(v[f.id]) === null);

    run: v => { const r = fromBlank(v.blank, S.user); if (r.ok) { S.view = 'doc'; S.docId = r.id; S.back = r.doc.kind; } return r; } });
}
function uiPrint() {
  const view = S.view, list = journal(view, S.user, Object.assign({ q: S.q }, S.f));
  const t = S.f.type ? typeOf(S.f.type).name : 'все типы';
  const html = `<div><b>Журнал регистрации · ${esc(TITLES[view])}</b> · тип: ${esc(t)} · период: ${S.f.from ? fmt(S.f.from) : 'с начала'} — ${S.f.to ? fmt(S.f.to) : fmt(S.clock)}</div>
    <table class="cgrid" style="margin-top:8px"><thead><tr><th>Номер</th><th>Дата рег.</th><th>Корреспондент</th><th>Тема</th><th>Этап</th></tr></thead><tbody>
    ${list.filter(d => d.no || d.legacy).map(d => `<tr><td>${esc(noText(d))}</td><td>${fmt(d.regDate)}</td><td>${esc(d.kind === 'in' ? senderName(d) : d.kind === 'out' ? d.addressees.map(addrName).join(', ') : empName(d.author))}</td><td>${esc(d.subject)}</td><td>${esc(STAGES[d.stage])}${d.annul ? ': ' + esc(d.annul.reason) : ''}</td></tr>`).join('')}</tbody></table>`;
  openForm({ title: 'Печатная форма журнала', noSubmit: true, fields: [{ id: 'p', label: '', type: 'html', html, wide: true }], run: () => yes });
}
function uiSaveSet() { S.saved.push({ name: 'Набор ' + (S.saved.length + 1) + (S.f.type ? ' · ' + typeOf(S.f.type).name : ''), view: S.view, q: S.q, f: Object.assign({}, S.f) }); render(); }
function applySet(i) { const s = S.saved[i]; if (!s) return; S.view = s.view; S.q = s.q; S.f = Object.assign({}, s.f); render(); }
function uiComment(id) { const el = document.getElementById('newCom'); const r = comment(id, S.user, el ? el.value : ''); toast(r.ok ? 'Комментарий добавлен' : r.why, r.ok ? 'ok' : 'err'); render(); return r; }

/* ============================ шов для смоука ========================== */
Object.assign(DF, {
  S, TODAY, KINDS, STAGES, URG, TYPES, EMP, SUBST, SIGN, METHODS, CASES, BLANKS, LINK_OBJ, LEADERSHIP,
  seed, doc, res, noText, fileName, typeOf, setClock: d => { S.clock = d; }, clock: () => S.clock, addWork,
  create, update, del, attach, removeFile, submit, approve, reject, sign, signBatch, register, correct, annul, markSent, markDelivered,
  giveRes, markInfo, resDone, resRefuse, ctrlConfirm, ctrlReturn, acquaint, fileToCase, issueOriginal, returnOriginal, comment, fromBlank, measureView, extendFromTasks,
  canSee, openDoc, participants, hasSignRight, signers, canSign, preSubmit, preRegister, preAnnul, fileReady, missingLinks,
  execInfo, execText, dispatchInfo, acqInfo, replyInfo, resState, effDue, defaultDue, povods, sync, takeTask, journal, grouped, indicators, roleIn,
  go(v) { S.view = v; S.docId = null; render(); },
  openCard(id, tab) { S.back = ['in', 'out', 'int', 'mine'].includes(S.view) ? S.view : (S.back || 'in'); S.view = 'doc'; S.docId = id; S.tab = tab || 'req'; render(); },
  tab(t) { S.tab = t; render(); }, setUser(u) { S.user = u; render(); }, search(q) { S.q = q; render(); },
  setF(k, v) { S.f[k] = (k === 'from' || k === 'to') ? (toIso(v) || '') : v; render(); }, setInd(k, v) { const x = toIso(v); if (x) S[k] = x; render(); },
  archTab(t) { S.archTab = t; render(); }, openCase(id) { S.caseOpen = id; render(); }, setTab(t) { S.setTab = t; render(); },
  uiDraft, uiDo, uiReject, uiAnnul, uiResDone, uiResRefuse, uiCtrlReturn, uiRes, uiAttach, uiSent, uiDeliv, uiCorrect, uiFile, uiIssue, uiBlank, uiPrint, uiSaveSet, applySet, uiComment,
  submitForm, closeForm, render,
});
[['DOCS', () => DOCS], ['RES', () => RES], ['ISSUES', () => ISSUES], ['TASKS', () => TASKS], ['COUNTERS', () => COUNTERS], ['EXT', () => EXT]]
  .forEach(([k, g]) => Object.defineProperty(DF, k, { get: g, enumerable: true }));
DF.openDoc = function (id, actor) { if (actor !== undefined) return openDoc(id, actor); DF.openCard(id); };
DF.SEEDED = seed();
if (typeof window !== 'undefined') { window.DF = DF; }
render();
