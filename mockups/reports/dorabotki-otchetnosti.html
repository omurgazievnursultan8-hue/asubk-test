<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Макет доработок отчётности</title>
<style>
/* Макет повторяет вид стенда (Jmix: тёмно-зелёное меню, белая шапка, серые поля, тёмные кнопки) —
   поэтому одна светлая тема, как у самой системы. Пометки поверх — четыре цвета по смыслу. */
:root{
  --side:#00533d; --side-fg:#e8f1ed; --side-muted:#9fc2b4; --side-sel-bg:#e3eee9; --side-sel-fg:#00533d; --side-line:#1d6a55;
  --page:#f7f8fa; --card:#ffffff; --line:#dde2e7; --field:#e8ebef; --hdr:#eff1f0;
  --fg:#1c2723; --muted:#5f6b66; --btn:#183727; --btn2:#eef1f3; --focus:#2f6fe0;
  --keep:#2f7d4e; --keep-bg:#e1f1e6; --chg:#a35f06; --chg-bg:#fbeed6; --add:#1d64c8; --add-bg:#e1ebfb; --later:#69707a; --later-bg:#eceef1;
  --bar:#22272b; --bar-fg:#f2f4f6; --bar-muted:#a7b0b9; --bar-on:#3a4249;
  --pdf-bar:#3c3c3c; --pdf-bg:#525659; --xl:#1d6f42; --xl-grid:#d5d8dc; --xl-hdr:#f2f3f5; --err:#b42318; --err-bg:#fde8e6;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font:14px/1.45 var(--font)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:#0b5cad}

/* полоса макета */
.bar{background:var(--bar);color:var(--bar-fg);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px}
.bar b{font-weight:600;white-space:nowrap}
.bar nav{display:flex;flex-wrap:wrap;gap:4px}
.bar nav button{background:none;border:0;color:var(--bar-muted);padding:5px 9px;border-radius:5px;cursor:pointer;font-size:13px}
.bar nav button.on{background:var(--bar-on);color:var(--bar-fg)}
.bar .ctl{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--bar-muted)}
.bar select{background:var(--bar-on);color:var(--bar-fg);border:0;border-radius:5px;padding:4px 6px;font:inherit}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* каркас как на стенде */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 46px)}
.side{background:var(--side);color:var(--side-fg);padding:14px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.logo{display:flex;gap:10px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid var(--side-line);margin-bottom:10px}
.logo .ring{width:34px;height:34px;border-radius:50%;border:2px solid #c9a961;flex:none}
.logo small{display:block;color:#d9bf7f;font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
.side .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:default;color:var(--side-fg);background:none;border:0;text-align:left;width:100%}
.side .it .chev{margin-left:auto;opacity:.7}
.side .it.grp-open{background:var(--side-sel-bg);color:var(--side-sel-fg);font-weight:600}
.side .sub{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 12px;border-left:1px solid var(--side-line);padding-left:8px}
.side .sub button{background:none;border:0;color:var(--side-fg);text-align:left;padding:6px 8px;border-radius:5px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:13.5px}
.side .sub button.on{background:#e8f1ed;color:var(--side-sel-fg);font-weight:600}
.side .sub button:hover:not(.on){background:#0e6650}
.side .badge{font-size:10px;border-radius:9px;padding:0 6px;font-weight:600;white-space:nowrap}
.side .badge.new{background:var(--add-bg);color:var(--add)}
.side .badge.adm{background:#f3e3c3;color:#7a4b05}
.side .who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side-line);color:var(--side-muted);font-size:13px}
.main{display:flex;flex-direction:column;min-width:0}
.top{background:var(--card);border-bottom:1px solid var(--line);min-height:56px;display:flex;align-items:center;gap:14px;padding:0 20px}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .ham{border:0;background:none;font-size:20px;cursor:pointer;padding:4px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;flex:1}
.scr{padding:20px 24px 40px;min-width:0}
.scr.has-dlg{display:grid}
.scr.has-dlg > *{grid-area:1/1;min-width:0}
.notes{background:var(--card);border-left:1px solid var(--line);padding:18px 18px 40px;min-width:0}
body.nomarks .notes, body.nomarks .mk, body.nomarks .badge.new{display:none}
body.nomarks .work{grid-template-columns:minmax(0,1fr)}
@media (max-width:1180px){.work{grid-template-columns:minmax(0,1fr)}.notes{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.side.open{display:flex}.scr{padding:16px}.dlg-wrap{margin:-16px !important;padding:12px 8px 30px !important}.dlg-h,.dlg-b,.dlg-f{padding-left:14px !important;padding-right:14px !important}}

/* пометки */
.mk{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font:700 11px/1 var(--font);color:#fff;vertical-align:middle;margin:0 4px;flex:none;cursor:help}
.mk.keep{background:var(--keep)}.mk.chg{background:var(--chg)}.mk.add{background:var(--add)}.mk.later{background:var(--later)}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;letter-spacing:.02em}
.tg.keep{background:var(--keep-bg);color:var(--keep)}.tg.chg{background:var(--chg-bg);color:var(--chg)}.tg.add{background:var(--add-bg);color:var(--add)}.tg.later{background:var(--later-bg);color:var(--later)}
.notes h2{font-size:15px;margin:0 0 4px}
.notes .lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.notes ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.notes li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.notes li .mk{margin:1px 0 0}

/* общие элементы стенда */
.btn{background:var(--btn);color:#fff;border:0;border-radius:4px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--btn2);color:var(--fg);box-shadow:inset 0 0 0 1px #c9d0d6}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.new{box-shadow:0 0 0 2px var(--add)}
body.nomarks .btn.new{box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.in{background:var(--field);border-radius:4px;padding:8px 10px;min-height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--fg)}
.in.ph{color:var(--muted)}
.in.lock{background:#eef0f2;color:var(--muted)}
input.txt{background:var(--field);border:0;border-radius:4px;padding:8px 10px;min-height:36px;font:inherit;width:100%}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tblwrap{overflow-x:auto}
table.g{border-collapse:collapse;width:100%;font-size:13.5px}
table.g th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
table.g td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.g td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.g tr.sel td{background:#eef6f2}
table.g tr.click{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2a25;color:#fff;padding:10px 16px;border-radius:6px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
.banner{border-radius:6px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--add-bg);color:#123a73}
.banner.err{background:var(--err-bg);color:var(--err)}

/* каталог */
.search{max-width:560px;margin-bottom:18px}
.search .box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--focus);border-radius:5px;padding:7px 10px}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:none}
.grp{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;overflow:hidden}
.grp-h{background:var(--hdr);padding:11px 16px;display:flex;align-items:center;gap:8px;font-weight:600}
.grp-h .cnt{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 8px;font-size:12px;font-weight:700}
.rrow{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
.rrow .ic{color:var(--muted);flex:none}
.rrow .tx{min-width:0;flex:1}
.rrow .ttl{font-weight:600}
.rrow .rlink{color:inherit;text-decoration:none}
.rrow .rlink:hover{text-decoration:underline}
.rrow .code{font-weight:700;margin-right:6px}
.rrow .vid{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.rrow .sub{color:var(--muted);font-size:13px;margin-top:1px}
.rrow.miss{background:#f4f8ff}
.rrow .who{font-size:12px;color:var(--muted)}

/* окно отчёта */
.dlg-wrap{background:rgba(24,34,30,.42);margin:-20px -24px -40px;padding:20px 16px 40px;z-index:3;display:flex;justify-content:center;align-items:flex-start}
.dlg{background:#fff;border-radius:8px;width:min(1180px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25);min-width:0}
.dlg-h{display:flex;align-items:center;gap:8px;padding:16px 22px 6px;font-size:19px;font-weight:700}
.dlg-h .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer}
.dlg-b{padding:0 22px 14px}
div.sec{font-weight:600;font-size:13px;border-bottom:1px solid var(--line);padding:12px 0 6px;margin-bottom:10px;display:flex;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.fgrid,.fgrid.two{grid-template-columns:minmax(0,1fr)}}
.dlg-f{border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:0 0 8px 8px}
.wlform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--add-bg);border-radius:6px;padding:8px 10px;margin:0 22px 12px}
.wlform input{min-width:220px;flex:1}
.pdf{background:var(--pdf-bg);border-radius:4px;overflow:hidden;margin-top:14px}
.pdf-bar{background:var(--pdf-bar);color:#e8e8e8;min-height:40px;display:flex;align-items:center;gap:14px;padding:4px 14px;font-size:12px;flex-wrap:wrap}
.seg{display:inline-flex;border-radius:5px;overflow:hidden;border:1px solid #6b6b6b}
.seg button{background:none;border:0;color:#ddd;padding:3px 9px;font-size:12px;cursor:pointer}
.seg button.on{background:#e8e8e8;color:#222}
.pdf-wrap{overflow:auto;padding:16px;max-height:640px}
.page{background:#fff;margin:0 auto;width:1100px;padding:26px 30px 18px;font-size:9.5px;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.page .ph{display:flex;justify-content:space-between;font-size:10px}
.page h3{text-align:center;font-size:13px;margin:6px 0 2px}
.page .pd{text-align:center;margin-bottom:8px}
.page .pf{text-align:center;margin-top:10px;color:#444}
.page .empty{padding:10px 4px;font-size:11px}
table.rt{border-collapse:collapse;width:100%}
table.rt th,table.rt td{border:1px solid #8a8a8a;padding:2px 4px;vertical-align:top}
table.rt th{background:#e7e7e7;font-weight:600;text-align:center}
table.rt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rt tr.g1 td{font-weight:700;background:#eef2f7}
table.rt tr.g2 td{font-weight:600}
table.rt tr.fx td{font-style:italic;color:#555}
table.rt td.ind1{padding-left:12px}table.rt td.ind2{padding-left:20px}

/* Excel */
.xl{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.xl-top{background:var(--xl);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.xl-fx{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--xl-grid);padding:4px 10px;font-size:12.5px;color:var(--muted)}
.xl-wrap{overflow:auto;max-height:620px}
table.xg{border-collapse:collapse;font-size:12px;font-family:Calibri, Carlito, var(--font)}
table.xg th{background:var(--xl-hdr);color:#555;font-weight:400;border:1px solid var(--xl-grid);padding:1px 6px;position:sticky;top:0;z-index:1}
table.xg td{border:1px solid var(--xl-grid);padding:2px 6px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.xg td.rn{background:var(--xl-hdr);color:#555;text-align:center;position:sticky;left:0}
table.xg td.n{text-align:right;font-variant-numeric:tabular-nums}
table.xg tr.h td{background:#eef1f4;font-weight:600;text-align:center;white-space:normal}
table.xg tr.frz td{border-bottom:2px solid #7d8a96}
table.xg tr.par td{background:#f0f6ff;color:#123a73}
table.xg tr.b1 td{font-weight:700}
table.xg tr.bad td{background:var(--err-bg);color:var(--err)}
.xl-tabs{display:flex;gap:2px;border-top:1px solid var(--xl-grid);background:var(--xl-hdr);padding:0 8px}
.xl-tabs button{border:0;background:none;padding:6px 14px;font-size:12.5px;cursor:pointer;border-bottom:2px solid transparent}
.xl-tabs button.on{background:#fff;border-bottom-color:var(--xl);color:var(--xl);font-weight:600}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
.box{padding:12px 14px}
.box h3{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:4px}

/* конструктор и шаблоны */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.lst button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer}
.lst button.on{background:#eef6f2}
.lst button:first-child{border-top:0}
.ed{padding:4px 18px 18px}
.ed .sec{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;gap:6px;align-items:center;background:var(--field);border-radius:4px;padding:5px 9px;font-size:13px;cursor:pointer}
.chk input{margin:0}
.ord{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.ord div{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:13px}
.ord span.u{color:var(--muted);font-size:12px}
.ord .ctl{margin-left:auto;display:flex;gap:2px}
.ord .ctl button{border:0;background:none;cursor:pointer;padding:0 5px;color:var(--muted)}
.fields{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.fields .fg{background:var(--hdr);padding:5px 10px;font-weight:600;font-size:12.5px;position:sticky;top:0}
.fields .fr{display:flex;align-items:center;gap:8px;padding:4px 10px;border-top:1px solid var(--line);font-size:13px}
.fields code{font-family:var(--mono);font-size:12px;background:#f3f5f7;border-radius:3px;padding:1px 5px}
.fields .fr button{margin-left:auto}

/* карточка кредита */
.kh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.kh h2{margin:0;font-size:18px}
.st{background:var(--keep-bg);color:var(--keep);border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;padding:14px 16px}
@media (max-width:900px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kgrid .v{font-weight:600;font-variant-numeric:tabular-nums}
.ktabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;flex-wrap:wrap}
.ktabs span{padding:8px 10px;color:var(--muted);font-size:13.5px}
.ktabs span.on{color:var(--fg);border-bottom:2px solid var(--btn);font-weight:600}
.dd{position:relative;display:inline-block}
.dd .menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:320px;z-index:4;padding:4px 0}
.dd .menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 14px;cursor:pointer;font-size:13.5px}
.dd .menu button:hover{background:#f2f5f4}
.dd .menu .off{padding:7px 14px;color:var(--muted);font-size:13px;text-decoration:line-through}
.doc{background:#fff;width:min(760px,100%);margin:0 auto;padding:34px 40px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-family:"Times New Roman", Tinos, serif;font-size:14px;color:#111}
.doc h3{text-align:center;font-size:16px;margin:18px 0 4px}
.doc table{border-collapse:collapse;width:100%;margin:12px 0}
.doc td{border:1px solid #444;padding:4px 8px}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums}
.doc .sign{display:flex;justify-content:space-between;margin-top:28px}
.prevbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.prevbar > span{align-items:center}

/* экран отчёта: настройки слева, результат справа */
.rp.collapsed{grid-template-columns:44px minmax(0,1fr)}
.panel.pcol{align-items:center;padding:8px 0;gap:10px}
.pexp,.pcolb{border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;width:28px;height:28px;font-size:16px;line-height:1;color:var(--fg);flex:none}
.pcolb{margin-left:auto}
.pvert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.rp{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;position:sticky;top:12px;max-height:calc(100vh - 130px);display:flex;flex-direction:column;min-width:0}
.panel .pscroll{overflow:auto;flex:1;min-height:0}
.panel .ph2{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.panel .back{font-size:12.5px;text-decoration:none}
.panel .pt{font-weight:700;font-size:15px;margin:4px 0 2px;line-height:1.3;display:flex;align-items:flex-start;gap:2px}
.ps{padding:10px 14px 12px;border-bottom:1px solid var(--line)}
.ps h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:2px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pgrid .full{grid-column:1/-1}
.panel input[type=text],.panel input[type=number],.panel select{background:var(--field);border:0;border-radius:4px;padding:6px 8px;font:inherit;width:100%;min-height:34px;color:var(--fg)}
.dims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.dims li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:13.5px;cursor:grab}
.dims li.off{background:var(--page);color:var(--muted)}

/* ---------- отрисовка ---------- */
let rendering = false;
function renderScreen(keepFocus){
  if(rendering){ setTimeout(() => renderScreen(keepFocus)); return; } rendering = true;
  try{ renderScreen0(keepFocus); } finally { rendering = false; }
}
function renderScreen0(keepFocus){
  curScr = S.r === 'otchet' ? 'otchet' : S.r;
  const el = document.getElementById('scr'); let h = '';
  el.className = 'scr';
  if(S.r === 'katalog') h = '<div>'+catalogHTML(true)+'</div>';
  else if(S.r === 'otchet') h = reportHTML();
  else if(S.r === 'excel') h = excelHTML();
  else if(S.r === 'spiski') h = spiskiHTML();
  else if(S.r === 'konstruktor') h = konstruktorHTML();
  else if(S.r === 'shablony') h = shablonyHTML();
  else if(S.r === 'kredit') h = kreditHTML();
  else h = svodkaHTML();
  const ps = document.getElementById('pscroll'), pst = ps ? ps.scrollTop : 0, tt = document.getElementById('tt'), tts = tt ? [tt.scrollTop, tt.scrollLeft] : null;
  el.innerHTML = h;
  const ps2 = document.getElementById('pscroll'); if(ps2) ps2.scrollTop = pst; const tt2 = document.getElementById('tt'); if(tt2 && tts){ tt2.scrollTop = tts[0]; tt2.scrollLeft = tts[1]; }
  fixSticky();
  const fq2 = document.getElementById('fsq'); if(fq2 && S.fsqFocus){ fq2.focus(); fq2.setSelectionRange(fq2.value.length, fq2.value.length); S.fsqFocus = false; }
  if(S.r === 'otchet' && S.back){ const b = S.back; S.back = null; S.fromRep = false; const t3 = document.getElementById('tt'); if(t3 && b.tt){ t3.scrollTop = b.tt[0]; t3.scrollLeft = b.tt[1]; } S.keepY = b.y || 0; }
  if(keepFocus === true){ const q = document.getElementById('q'); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
}
function render(){
  document.body.classList.toggle('nomarks', !S.marks);
  document.getElementById('ttl').textContent = TITLES[S.r];
  renderBar(); renderSide(); renderScreen(); renderNotes();
}
function route(){ const h = (location.hash || '').slice(1); S.r = SCREENS.some(s => s[0] === h) ? h : 'katalog'; S.sideOpen = false;
  if((S.r === 'otchet' || S.r === 'excel') && !S.cfg){ S.rep = S.rep || 'ФО-01'; S.repName = S.repName || 'Просроченная задолженность по состоянию на дату'; initRep(); }
