<script>
/* ======================================================================
   УПРОЩЁННЫЙ ПРОТОТИП: страница пользователя «Конструктор — личный черновик».
   Ниже три слоя, и границу между ними держит текст:
     1. ЗАГЛУШКИ СОСЕДЕЙ — реестр показателей и разрезов (статистика), публичные
        перечни полей (ядро), строки среза на даты (ночной прогон), живое состояние
        (ядро). В жизни всё это приходит швами, здесь — константы и генератор.
     2. ШВЫ — statSlice · statRows · objectRows: единственный вход в данные
        (ИО-3). Ответ statSlice — всегда ДЕРЕВО уровней (ADR-0176 §6).
     3. СТРАНИЦА (KB) — состав вопроса, отказы словами, действия, след.
   Формул у страницы нет: величину узла считает заглушка статистики (ИО-2).
   ====================================================================== */
const TODAY = '2026-09-05', NOW = '14:32';
const SNAPSHOTS = ['2026-07-31', '2026-08-31'];       // даты, на которые прогон ходил
const FIXED = {'2026-07-31': true, '2026-08-31': false}; // фиксация = закрытие периода человеком
const FILE_DAYS = 90;                                  // срок жизни файла предварительного выпуска

/* ---------- утилиты ---------- */
const clone = x => JSON.parse(JSON.stringify(x));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq = a => a.filter((x, i) => a.indexOf(x) === i);
const pad2 = n => (n < 10 ? '0' : '') + n;
const fmt = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '—';
const fmtShort = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) : '—';
const MONTHS_N = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const toDate = s => new Date(s + 'T00:00:00Z');
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); };
const monthsBetween = (a, b) => { const A = toDate(a), B = toDate(b);
  return Math.max(0, (B.getUTCFullYear() - A.getUTCFullYear()) * 12 + (B.getUTCMonth() - A.getUTCMonth())); };
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one; if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; };
const money = n => n == null ? '—' : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const num1 = n => n == null ? '—' : (Math.round(n * 10) / 10).toString().replace('.', ',');
const ageText = d => { const n = daysBetween(d, TODAY);
  return n === 0 ? 'сегодня' : n === 1 ? 'вчера' : n + ' ' + plural(n, 'день', 'дня', 'дней') + ' назад'; };
const objWord = n => n + ' ' + plural(n, 'кредит', 'кредита', 'кредитов');
const brWord = n => n + ' ' + plural(n, 'заёмщик', 'заёмщика', 'заёмщиков');

/* Операторы отбора — перечень на систему, по типу величины (§3 п. 5, ОЧ-29). */

const BORROWERS = BORROWERS_SRC.map((b, i) => ({id:b[0], name:b[1], dept:b[2], curator:b[3],
  inn: String(10000000000 + i * 7919 * 1013).slice(0, 12)}));
const BR = id => BORROWERS.find(b => b.id === id);

/* 50 кредитов: 47 в департаменте Осмоновой, 3 в чужих. Дни просрочки на 31.08 заданы
   списком, чтобы ступени были заполнены; на 31.07 они на 31 меньше, на 05.09 — на 5 больше. */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const LATE_ON_0831 = [4, 9, 15, 22, 27, 30,  35, 48, 61, 77, 88,  95, 120, 140, 166, 179,  214, 233, 290, 402, 611];
const CREDITS = (() => {
  const rnd = mulberry32(20260905);
  const out = [];
  const owners = [];
  BORROWERS.filter(b => b.dept === 'dep-prom').forEach((b, i) => { const k = 2 + (i % 3); for(let j = 0; j < k; j++) owners.push(b.id); });
  while(owners.length < 47) owners.push('b0' + (1 + Math.floor(rnd() * 9)));
  owners.length = 47;
  owners.push('b17', 'b17', 'b18');
  const lateIdx = [];
  for(let i = 0; i < 21; i++) lateIdx.push(i * 2 + 1);            // 21 просроченный среди первых 47
  const hiddenLate = {48: 12, 49: 240};                             // из скрытых: один 1–30, один 181+
  const seqByYear = {};
  owners.forEach((bid, i) => {
    const b = BR(bid);
    const year = i < 45 ? 2022 + Math.floor(rnd() * 4) : 2026;     // два последних видимых рождены в августе 2026
    const month = i >= 45 && i < 47 ? 8 : 1 + Math.floor(rnd() * (year === 2026 ? 7 : 12));
    const day = i >= 45 && i < 47 ? (i === 45 ? 10 : 20) : 1 + Math.floor(rnd() * 27);
    const date = year + '-' + pad2(month) + '-' + pad2(day);
    seqByYear[year] = (seqByYear[year] || 0) + 1;
    const no = 'КД-' + year + '-' + String(seqByYear[year] * 7 + 3).padStart(3, '0');
    const sum = Math.round((500000 + rnd() * 24500000) / 100000) * 100000;
    const li = lateIdx.indexOf(i);
    const late0831 = li !== -1 ? LATE_ON_0831[li] : (hiddenLate[i] || 0);
    const missAt = late0831 ? addDays('2026-08-31', -late0831) : null;
    const closedAt = (i === 6 || i === 20) ? '2026-06-15' : null;    // два закрытых: строка остаётся
    const paidAt = (i === 3 || i === 21) ? '2026-09-03' : null;       // погасили просрочку после 31.08
    const program = DICTS.program[Math.floor(rnd() * 4)];
    out.push({id:'c' + pad2(i + 1), no, borrowerId: bid, borrower: b.name, dept: b.dept,
      program, sum, date, missAt, closedAt, paidAt});
  });
  return out;
})();

/* Состояние кредита на дату D — то, что положил бы в строку среза ночной прогон
   (или отдало бы ядро живым запросом). Величины — заглушка ядра; отчётность их не выводит. */
function creditAt(c, D){
  if(c.date > D) return null;                                        // рождение объекта ещё не наступило
  const closed = c.closedAt && c.closedAt <= D;
  let days = 0;
  if(!closed && c.missAt && c.missAt <= D && !(c.paidAt && c.paidAt <= D)) days = daysBetween(c.missAt, D);
  const stopAt = c.missAt && c.missAt <= D ? c.missAt : D;
  const m = monthsBetween(c.date, stopAt);
  const debt = closed ? 0 : Math.round(c.sum * Math.max(0.08, 1 - m * 0.03) / 100) * 100;
  const overdue = days > 0 ? Math.round(debt * Math.min(0.85, 0.06 + days / 365 * 0.5) / 100) * 100 : 0;
  const status = closed ? 'закрыт' : days > 180 ? 'на взыскании' : days > 0 ? 'просроченный' : 'действующий';
  return {id:c.id, no:c.no, borrower:c.borrower, borrowerId:c.borrowerId, dept:c.dept, program:c.program,
    sum:c.sum, date:c.date, debt_main:debt, days, overdue, status};
}
function borrowerAt(b, D){
  const cs = CREDITS.filter(c => c.borrowerId === b.id).map(c => creditAt(c, D)).filter(Boolean);
  if(!cs.length) return null;                                        // рождение заёмщика = первый договор
  const worst = Math.max.apply(null, cs.map(c => c.days));
  const risk = worst === 0 ? 'низкий' : worst <= 90 ? 'средний' : 'высокий';
  return {id:b.id, name:b.name, inn:b.inn, dept:b.dept, curator:b.curator, risk,
    portfolio: cs.reduce((s, c) => s + c.debt_main, 0), contracts: cs.length, worst};
}
/* Строки среза, собранные «прогоном» на объявленные даты. */
const HIST = {};
SNAPSHOTS.forEach(D => { HIST[D] = {
  credit:   CREDITS.map(c => creditAt(c, D)).filter(Boolean),
  borrower: BORROWERS.map(b => borrowerAt(b, D)).filter(Boolean) }; });
const LIVE = () => ({ credit: CREDITS.map(c => creditAt(c, TODAY)).filter(Boolean) });

/* ======================================================================
   2. ШВЫ — единственный вход в данные (ИО-3)
   ====================================================================== */
const nearestSnapshot = asOf => { const ok = SNAPSHOTS.filter(d => d <= asOf); return ok.length ? ok[ok.length - 1] : null; };
const fieldOf = (obj, fid) => FIELDS[obj].fields.find(f => f.id === fid);

/* Отбор применяется у отвечающего: фильтр сужает вопрос, роль сужает мир. */
function applyFilters(obj, rows, filters){
  return (filters || []).reduce((rs, f) => {
    const fd = fieldOf(obj, f.field); if(!fd || f.value === '' || f.value == null) return rs;
    const v = String(f.value).trim();
    return rs.filter(r => { const x = r[f.field];
      switch(fd.type){
        case 'число': { const n = Number(String(v).replace(/\s/g, '')); if(isNaN(n)) return true;
          return f.op === '=' ? x === n : f.op === '≠' ? x !== n : f.op === '>' ? x > n : f.op === '≥' ? x >= n :
                 f.op === '<' ? x < n : x <= n; }
        case 'дата': return f.op === 'до' ? x < v : f.op === 'на' ? x === v : x > v;
        case 'текст': { const a = String(x).toLowerCase(), b = v.toLowerCase();
          return f.op === 'содержит' ? a.indexOf(b) !== -1 : a.indexOf(b) === 0; }
        case 'словарь': { const val = fd.dict === 'dept' ? deptName(String(x)) : String(x);
          if(f.op === 'равно') return val === v;
          return v.split(',').map(s => s.trim()).filter(Boolean).indexOf(val) !== -1; }
      }
      return true; });
  }, rows);
}
/* Значение разреза у строки — с корзиной, применённой при чтении. */
function cutValue(cut, bucket, r){
  const x = r[cut.field];
  if(cut.id === 'late'){ return x === 0 ? '0 дней' : x <= 30 ? '1–30 дней' : x <= 90 ? '31–90 дней' : x <= 180 ? '91–180 дней' : '181+ дней'; }
  if(cut.id === 'cdate'){ const y = x.slice(0, 4), m = Number(x.slice(5, 7));
    return bucket === 'год' ? y : bucket === 'квартал' ? y + ' · ' + ['I','II','III','IV'][Math.floor((m - 1) / 3)] + ' кв.'
         : MONTHS_N[m - 1] + ' ' + y; }
  if(cut.field === 'dept') return deptName(x);
  return String(x);
}
function cutOrder(cut, bucket, keys){
  if(cut.id === 'late') return CUT('late').buckets['ступени'].filter(k => keys.indexOf(k) !== -1);
  if(cut.id === 'cdate'){ if(bucket === 'месяц') return keys.slice().sort((a, b) => {
      const pa = a.split(' '), pb = b.split(' ');
      return (pa[1] + pad2(MONTHS_N.indexOf(pa[0]))).localeCompare(pb[1] + pad2(MONTHS_N.indexOf(pb[0]))); });
    return keys.slice().sort(); }
  if(cut.field === 'dept') return DEPTS.map(d => d.name).filter(k => keys.indexOf(k) !== -1);
  if(cut.field === 'risk') return DICTS.risk.filter(k => keys.indexOf(k) !== -1);
  if(cut.field === 'status') return DICTS.status.filter(k => keys.indexOf(k) !== -1);
  return keys.slice().sort((a, b) => a.localeCompare(b, 'ru'));
}
/* Величина показателя по множеству строк — считает СТАТИСТИКА (заглушка), не страница. */
function statValue(statId, rows){
  const sum = f => rows.reduce((s, r) => s + (r[f] || 0), 0);
  switch(statId){
    case 's-overdue-sum': return sum('overdue');
    case 's-overdue-cnt': return rows.filter(r => r.days > 0).length;
    case 's-portfolio':   return sum('debt_main');
    case 's-count':       return rows.length;
    case 's-avg-late':    { const l = rows.filter(r => r.days > 0); return l.length ? l.reduce((s, r) => s + r.days, 0) / l.length : null; }
    case 's-b-debt':      return sum('portfolio');
    case 's-b-cnt':       return sum('contracts');
    case 's-b-worst':     return rows.length ? Math.max.apply(null, rows.map(r => r.worst)) : null;
  }
  return null;
}

const SEAM = {
  /* ЯДРО. Живые строки объекта с полями перечня и исчислимыми налету показателями. */
  objectRows(obj, filters, scope){
    if(LIVE_OBJECTS.indexOf(obj) === -1) return {rows:[], hidden:0, refused:true,
      why:'ядро в v1 отвечает objectRows только по объекту «кредит» (ИО-30, ADR-0181 §4)'};
    const all = applyFilters(obj, LIVE()[obj], filters);
    const vis = all.filter(r => scope.indexOf(r.dept) !== -1);
    return {rows: clone(vis), hidden: all.length - vis.length, substituted:null,
      passport:{seam:'objectRows', owner:'ядро', asOf:null, mode:'сейчас', at: fmt(TODAY) + ' ' + NOW,
        scope: scope.slice(), depth:'живое состояние на момент вопроса'}};
  },
  /* СТАТИСТИКА. Строки объекта на дату — из снимка, не из живой базы. Снимок — это
     и СОСТАВ: заведённого позже в нём нет, закрытый после даты — есть. */
  statRows(obj, asOf, filters, scope){
    const real = nearestSnapshot(asOf);
    if(!real) return {rows:[], hidden:0, missing:true, why:'снимка на ' + fmt(asOf) + ' у статистики нет'};
    const all = applyFilters(obj, HIST[real][obj], filters);
    const vis = all.filter(r => scope.indexOf(r.dept) !== -1);
    return {rows: clone(vis), hidden: all.length - vis.length, substituted: real === asOf ? null : real,
      passport:{seam:'statRows', owner:'статистика', asOf: real, asked: asOf, mode:'на дату',
        fixed: FIXED[real] ? 'зафиксировано' : 'не зафиксировано', scope: scope.slice(),
        depth:'снимок статистики на ' + fmt(real)}};
  },
  /* СТАТИСТИКА, одна дверь: ответ всегда ДЕРЕВО уровней. Число узла — по строкам узла,
     не из детей (ИС-24, ИО-17). asOf == null → источник живой (objectRows). */
  statSlice(obj, statIds, levels, filters, asOf, scope){
    const src = asOf ? SEAM.statRows(obj, asOf, filters, scope) : SEAM.objectRows(obj, filters, scope);
    if(src.missing || src.refused) return {ok:false, why: src.why};
    const stats = statIds.filter(id => STAT(id) && !STAT(id).withdrawn);
    const values = rows => { const o = {}; stats.forEach(id => { o[id] = statValue(id, rows); }); return o; };
    const build = (rows, li, path) => {
      if(li >= levels.length) return null;
      const lv = levels[li], cut = CUT(lv.id);
      const keys = cutOrder(cut, lv.bucket, uniq(rows.map(r => cutValue(cut, lv.bucket, r))));
      return keys.map(k => { const part = rows.filter(r => cutValue(cut, lv.bucket, r) === k);
        const p = path.concat(k);
        return {by: lv.id, key: k, path: p, count: part.length, values: values(part),
          total: !!lv.total, children: build(part, li + 1, p), rows: li === levels.length - 1 ? part : null}; });
    };
    const root = {by:null, key:'всего', path:[], count: src.rows.length, values: values(src.rows),
      children: build(src.rows, 0, []), rows: levels.length ? null : src.rows};
    return {ok:true, root, stats, levels: clone(levels), hidden: src.hidden, substituted: src.substituted || null,
      passport: Object.assign({}, src.passport, {seams: [asOf ? 'statSlice' : 'objectRows'],
        form:'дерево', by: levels.map(l => CUT(l.id).name + (l.bucket ? ' (' + l.bucket + ')' : ''))})};
  },
  /* Контракты, не данные: перечень полей, реестр показателей, перечень разрезов. */
  fieldList(obj){ const o = FIELDS[obj]; return o ? {object: obj, name: o.name, owner: o.owner, fields: clone(o.fields)} : null; },
  statList(obj){ return clone(STATS.filter(s => s.object === obj)); },
  cutList(obj){ return clone(CUTS.filter(c => c.object === obj)); }
};

/* ======================================================================
   3. СТРАНИЦА — состав вопроса, отказы словами, действия, след
   ====================================================================== */
const KB = { state:null };
const hasDOM = typeof document !== 'undefined';
const log = [];
const note = (kind, text) => { log.push({at: TODAY, kind, text}); if(hasDOM) toast(text, kind); };

KB.seed = () => {
  KB.state = {
    name:'Просрочка по ступеням',
    object:'credit', mode:'на дату', asOf:'2026-08-31',
    stats:['s-overdue-sum', 's-overdue-cnt'],
    cuts:[{id:'late', bucket:'ступени', total:true}, {id:'status', bucket:null, total:false}],
    filters:[],
    drill:{on:false, fields:['no', 'borrower', 'debt_main', 'days']},
    live:null,                 // {hash, answer} — «сейчас» считается по кнопке
    notices:[],                // баннеры до следующего действия
    drafts:[], issues:[], worklists:[], asked:null,
    seq:{draft:0, issue:0, list:0}
  };
  log.length = 0;
  return KB.state;
};
const S = () => KB.state;
const composition = () => { const s = S(); return {object:s.object, mode:s.mode, asOf: s.mode === 'на дату' ? s.asOf : null,
  stats: s.stats.slice(), cuts: clone(s.cuts), filters: clone(s.filters), drill: clone(s.drill)}; };
const hashOf = () => JSON.stringify(composition());
const notice = (kind, text) => { S().notices.push({kind, text}); };
const clearNotices = () => { S().notices = []; };

/* ---------- состав: объект, режим, дата ---------- */
KB.setObject = obj => {
  const s = S(); if(!FIELDS[obj]) return {ok:false, why:'объекта «' + obj + '» никто не объявил: публичного перечня полей у него нет'};
  if(obj === s.object) return {ok:true, switched:false};
  clearNotices();
  s.object = obj; s.stats = []; s.cuts = []; s.filters = []; s.live = null;
  s.drill = {on:false, fields: obj === 'credit' ? ['no', 'borrower', 'debt_main', 'days'] : ['name', 'curator', 'risk']};
  let switched = false, why = null;
  if(s.mode === 'сейчас' && LIVE_OBJECTS.indexOf(obj) === -1){
    s.mode = 'на дату'; switched = true;
    why = 'объекту «' + FIELDS[obj].name + '» режим «сейчас» в v1 недоступен: живые строки отдаёт objectRows, а ядро ' +
      'отвечает им только по кредиту (ИО-30). Переключено на «на дату» — строки даёт снимок статистики';
    notice('warn', why);
  }
  /* Стартовый состав нового объекта — первые два показателя реестра и первый разрез. */
  const st = SEAM.statList(obj).filter(x => !x.withdrawn && (s.mode === 'на дату' || x.live));
  s.stats = st.slice(0, 2).map(x => x.id);
  const c0 = SEAM.cutList(obj).filter(c => c.declared)[0];
  if(c0) s.cuts = [{id: c0.id, bucket: c0.buckets ? Object.keys(c0.buckets)[0] : null, total: true}];
  return {ok:true, switched, why};
};
KB.setMode = mode => {
  const s = S(); if(['на дату', 'сейчас'].indexOf(mode) === -1) return {ok:false, why:'режима «' + mode + '» нет: их два'};
  if(mode === s.mode) return {ok:true, dropped:[]};
  clearNotices();
  if(mode === 'сейчас' && LIVE_OBJECTS.indexOf(s.object) === -1)
    return {ok:false, why:'объекту «' + FIELDS[s.object].name + '» режим «сейчас» в v1 недоступен: ядро отвечает objectRows ' +
      'только по кредиту (ИО-30). Спросите его «на дату» — или выберите кредит'};
  s.mode = mode; s.live = null;
  const dropped = [];
  if(mode === 'сейчас'){
    /* Режим — часть вопроса. Что в новом режиме спросить нельзя, отваливается С ПОМЕТКОЙ, а не молча. */
    s.stats = s.stats.filter(id => { const m = STAT(id); if(m && !m.live){ dropped.push({kind:'показатель', name: m.name,
      why:'налету не берётся — ' + m.why}); return false; } return true; });
  } else {
    s.cuts = s.cuts.filter(c => { const m = CUT(c.id); if(m && !m.declared){ dropped.push({kind:'разрез', name: m.name,
      why:'в реестре статистики не объявлен: прогон по нему строк не собирает, в срезе на дату его физически нет'}); return false; } return true; });
  }
  dropped.forEach(d => notice('warn', d.kind + ' «' + d.name + '» снят из состава: ' + d.why));
  return {ok:true, dropped};
};
KB.setAsOf = d => { const s = S(); clearNotices(); s.asOf = d; s.live = null;
  if(!nearestSnapshot(d)) return {ok:false, why:'снимков раньше ' + fmt(d) + ' у статистики нет'};
  if(nearestSnapshot(d) !== d) notice('warn', 'За ' + fmt(d) + ' снимка нет: ночной прогон до этой даты не доходил. Числа посчитаны по ближайшему ' +
    'более раннему состоянию — ' + fmt(nearestSnapshot(d)) + ', и паспорт назовёт подставленную дату (ИО-26). Сдавать такой показ окончательно нельзя');
  return {ok:true, substituted: nearestSnapshot(d) === d ? null : nearestSnapshot(d)}; };
KB.setName = n => { S().name = String(n || '').trim(); return {ok:true}; };

/* ---------- состав: показатели, разрезы, фильтры, строки ---------- */
KB.statAvail = id => { const s = S(), m = STAT(id);
  if(!m || m.object !== s.object) return {ok:false, why:'показателя «' + id + '» в реестре по объекту «' + FIELDS[s.object].name + '» нет'};
  if(m.withdrawn) return {ok:false, why:'выведен ' + fmtShort(m.withdrawn) + ' — ' + m.why + '. Показателя вне реестра не существует (ADR-0150)'};
  if(s.mode === 'сейчас' && !m.live) return {ok:false, why:'налету не берётся — ' + m.why + '. В режиме «сейчас» спросить нельзя (ADR-0159)'};
  return {ok:true}; };
KB.toggleStat = id => { const s = S(); clearNotices();
  const i = s.stats.indexOf(id); if(i !== -1){ s.stats.splice(i, 1); s.live = null; return {ok:true, on:false}; }
  const a = KB.statAvail(id); if(!a.ok) return a;
  s.stats.push(id); s.live = null; return {ok:true, on:true}; };
KB.cutAvail = id => { const s = S(), c = CUT(id);
  if(!c || c.object !== s.object) return {ok:false, why:'разреза «' + id + '» у объекта «' + FIELDS[s.object].name + '» нет'};
  if(s.cuts.some(x => x.id === id)) return {ok:false, why:'разрез «' + c.name + '» уже стоит уровнем'};
  if(s.mode === 'на дату' && !c.declared) return {ok:false, why:'в реестре статистики не объявлен: прогон по нему строк ' +
    'не собирает, и в срезе на дату его физически нет. В режиме «сейчас» доступен как поле перечня'};
  return {ok:true}; };
KB.addCut = id => { const s = S(); clearNotices(); const a = KB.cutAvail(id); if(!a.ok) return a;
  const c = CUT(id); s.cuts.push({id, bucket: c.buckets ? Object.keys(c.buckets)[0] : null, total:false}); s.live = null; return {ok:true}; };
KB.removeCut = id => { const s = S(); clearNotices(); s.cuts = s.cuts.filter(c => c.id !== id); s.live = null; return {ok:true}; };
KB.moveCut = (id, dir) => { const s = S(); clearNotices(); const i = s.cuts.findIndex(c => c.id === id); const j = i + dir;
  if(i === -1 || j < 0 || j >= s.cuts.length) return {ok:false, why:'двигать некуда'};
  const t = s.cuts[i]; s.cuts[i] = s.cuts[j]; s.cuts[j] = t; s.live = null; return {ok:true}; };
KB.setBucket = (id, b) => { const s = S(); clearNotices(); const c = s.cuts.find(x => x.id === id), m = CUT(id);
  if(!c || !m.buckets) return {ok:false, why:'у разреза корзины не объявлено'};
  if(!(b in m.buckets)) return {ok:false, why:'корзины «' + b + '» у разреза «' + m.name + '» не объявлено'};
  c.bucket = b; s.live = null; return {ok:true}; };
KB.toggleTotal = id => { const s = S(); clearNotices(); const c = s.cuts.find(x => x.id === id); if(!c) return {ok:false, why:'уровня нет'};
  c.total = !c.total; return {ok:true, total: c.total}; };
KB.addFilter = (field, op, value) => { const s = S(); clearNotices(); const fd = fieldOf(s.object, field || FIELDS[s.object].fields[0].id);
  if(!fd) return {ok:false, why:'поля «' + field + '» в публичном перечне объекта нет'};
  const ops = OPS[fd.type]; const o = ops.indexOf(op) !== -1 ? op : ops[0];
  s.filters.push({field: fd.id, op: o, value: value == null ? '' : String(value)}); s.live = null; return {ok:true, i: s.filters.length - 1}; };
KB.setFilter = (i, patch) => { const s = S(); clearNotices(); const f = s.filters[i]; if(!f) return {ok:false, why:'фильтра нет'};
  if(patch.field && patch.field !== f.field){ const fd = fieldOf(s.object, patch.field); if(!fd) return {ok:false, why:'поля нет'};
    f.field = fd.id; f.op = OPS[fd.type][0]; f.value = ''; }
  if(patch.op){ const fd = fieldOf(s.object, f.field); if(OPS[fd.type].indexOf(patch.op) === -1) return {ok:false,
    why:'оператор «' + patch.op + '» типу «' + fd.type + '» не положен: перечень операторов задан на систему по типу величины'}; f.op = patch.op; }
  if(patch.value != null) f.value = String(patch.value);
  s.live = null; return {ok:true}; };
KB.removeFilter = i => { const s = S(); clearNotices(); s.filters.splice(i, 1); s.live = null; return {ok:true}; };
KB.setDrill = on => { const s = S(); clearNotices(); s.drill.on = !!on; return {ok:true}; };
KB.toggleField = fid => { const s = S(); clearNotices(); if(!fieldOf(s.object, fid)) return {ok:false, why:'поля нет в перечне'};
  const i = s.drill.fields.indexOf(fid); if(i !== -1) s.drill.fields.splice(i, 1); else s.drill.fields.push(fid); return {ok:true}; };

/* ---------- ответ ---------- */
function computeNow(){
  const s = S(), c = composition();
  const r = SEAM.statSlice(c.object, c.stats, c.cuts, c.filters, c.asOf, ME.scope);
  if(!r.ok) return r;
  const visible = r.root.count;
  const p = r.passport;
  p.visible = visible; p.hidden = r.hidden;
  p.scopeText = ME.scope.map(deptName).join('; ');
  if(s.drill.on) p.seams = p.seams.concat([c.asOf ? 'statRows' : 'objectRows']);
  p.shown = {stats: c.stats.map(id => STAT(id).name),
    cuts: c.cuts.map(x => CUT(x.id).name + (x.bucket ? ' · ' + x.bucket : '') + (x.total ? ' · с итогом' : '')),
    filters: c.filters.filter(f => f.value !== '').map(f => fieldOf(c.object, f.field).name + ' ' + f.op + ' ' + f.value),
    drill: s.drill.on ? s.drill.fields.map(f => fieldOf(c.object, f).name) : null};
  if(c.asOf){ p.age = ageText(p.asOf);
    p.short = 'на ' + fmtShort(p.asOf) + ' (' + p.age + ') · ' + (p.fixed === 'зафиксировано' ? 'зафикс.' : 'не зафикс.') + ' · вам видно ' + visible; }
  else { p.fixed = 'не зафиксировано'; p.short = 'живое ' + fmtShort(TODAY) + ' ' + NOW + ' · не зафикс. · вам видно ' + visible; }
  return r;
}
/* «На дату» считается сразу; «сейчас» — по кнопке: живой запрос к ядру не гоняют оттого,
   что кто-то поставил галочку (§14 п. 4). */
KB.answer = () => { const s = S();
  if(s.mode === 'на дату') return Object.assign(computeNow(), {stale:false});
  if(s.live && s.live.hash === hashOf()) return Object.assign(clone(s.live.answer), {stale:false});
  return {ok:false, stale:true, answer: s.live ? clone(s.live.answer) : null,
    why: s.live ? 'состав изменился после последнего расчёта — нажмите «посчитать»' : 'режим «сейчас» считается по кнопке «посчитать»: это живой запрос к ядру'}; };
KB.compute = () => { const s = S(); const r = computeNow(); if(!r.ok) return r;
  s.live = {hash: hashOf(), answer: clone(r)}; return Object.assign(clone(r), {stale:false}); };
KB.rowsShown = () => { const a = KB.answer(); if(!a.ok) return [];
  const out = []; const walk = n => { if(n.rows) out.push.apply(out, n.rows); (n.children || []).forEach(walk); }; walk(a.root); return out; };

/* ---------- действия ---------- */
KB.saveDraft = name => { const s = S(); clearNotices(); const nm = String(name == null ? s.name : name).trim();
  if(!nm) return {ok:false, why:'у черновика должно быть имя: безымянный состав — это состояние экрана, а не черновик'};
  const id = 'ЧР-' + (++s.seq.draft);
  s.drafts.push({id, name: nm, author: ME.who, at: TODAY, comp: composition()});
  s.name = nm; note('ok', 'черновик «' + nm + '» сохранён · виден только вам');
  return {ok:true, id, note:'личный черновик: виден автору; шаблоном станет только публикацией (ИО-1)'}; };
KB.draftsOf = who => S().drafts.filter(d => d.author === who).map(clone);
KB.openDraft = id => { const s = S(); const d = s.drafts.find(x => x.id === id); if(!d) return {ok:false, why:'черновика нет'};
  if(d.author !== ME.who) return {ok:false, why:'черновик чужой: он личный'};
  clearNotices(); const c = clone(d.comp);
  s.object = c.object; s.mode = c.mode; if(c.asOf) s.asOf = c.asOf; s.stats = c.stats; s.cuts = c.cuts; s.filters = c.filters; s.drill = c.drill;
  s.name = d.name; s.live = null; return {ok:true}; };

KB.exportIssue = fmtName => { const s = S(); clearNotices();
  const fmts = ['xlsx', 'csv', 'pdf']; if(fmts.indexOf(fmtName) === -1) return {ok:false, why:'формат «' + fmtName + '» отчёту не положен: ' + fmts.join(' · ')};
  const a = KB.answer(); if(!a.ok) return {ok:false, why:'выгружать нечего: ' + a.why};
  const id = 'В-Л-' + (++s.seq.issue);
  const it = {id, kind:'предварительный', personal:true, fmt: fmtName, at: fmt(TODAY) + ' ' + NOW, by: ME.who, draft: s.name,
    passport: clone(a.passport), fileUntil: addDays(TODAY, FILE_DAYS)};
  s.issues.push(it); note('ok', 'выпуск ' + id + ' (' + fmtName + ') · предварительный, личный');
  return {ok:true, id, issue: clone(it), note:'предварительный выпуск: строка в журнале навсегда, файл живёт до ' + fmt(it.fileUntil) +
    ' (' + FILE_DAYS + ' дней, ИО-11); паспорт вшит в файл (ИО-6)'}; };
KB.finalIssue = () => ({ok:false, why:'окончательный выпуск у личного черновика невозможен: числа морозит НАЗВАННЫЙ ПОЛУЧАТЕЛЬ (ИО-4), ' +
  'а получатель и обязательство бывают только у опубликованной редакции, и то составом по умолчанию (ИО-21)'});
KB.toDashboard = () => ({ok:false, why:'плиткой на дашборд встаёт только объявленный отчёт: за плиткой всегда стоит шаблон отчётности, ' +
  'а личный черновик шаблоном не является (ИО-1, §10)'});
KB.publish = () => ({ok:false, why:'публикует уполномоченный по отчётности (' + AUTH.who + '), а не автор: шаблоном состав становится публикацией, ' +
  'не сборкой (ИО-1, ADR-0156 §2). Вам доступно «попросить публикации»'});
KB.setBasis = () => ({ok:false, why:'сослаться на пункт нормы из личного черновика нельзя: нормативное основание называет только публикующий (§4)'});
KB.askPublish = () => { const s = S(); clearNotices();
  if(s.asked) return {ok:false, why:'просьба уже передана ' + fmt(s.asked.at) + ' — ' + AUTH.who + ' ещё не ответил'};
  s.asked = {to: AUTH.who, at: TODAY, draft: s.name, comp: composition()};
  note('ok', 'черновик «' + s.name + '» передан на публикацию: ' + AUTH.who);
  return {ok:true, note:'до публикации состав остаётся личным черновиком: круг подразделений, расписание и основание назовёт публикующий'}; };

KB.makeWorklist = name => { const s = S(); clearNotices();
  if(!s.drill.on) return {ok:false, why:'сначала покажите строки объектов: рабочий список замораживает ОБЪЕКТЫ, а не числа (ИО-14). ' +
    'Пока видно только дерево — замораживать нечего'};
  const a = KB.answer(); if(!a.ok) return {ok:false, why:'списка не будет: ' + a.why};
  const rows = KB.rowsShown(); if(!rows.length) return {ok:false, why:'в ответе ни одной строки: список из пустоты не заводится'};
  const nm = String(name || '').trim(); if(!nm) return {ok:false, why:'у рабочего списка должно быть имя: по нему будут звонить'};
  /* Список заводится ЧЕРЕЗ предварительный выпуск: морозить нечего, пока у ответа нет паспорта (§14 п. 4). */
  const iss = KB.exportIssue('xlsx'); if(!iss.ok) return iss;
  const id = 'РС-' + (++s.seq.list);
  const wl = {id, name: nm, issue: iss.id, owner: ME.who, dept: null, at: TODAY, closed:false,
    object: s.object, ids: rows.map(r => r.id), count: rows.length, asOf: a.passport.asOf || TODAY};
  s.worklists.push(wl); note('ok', 'рабочий список ' + id + ' «' + nm + '»: ' + rows.length + ' объектов, состав заморожен');
  return {ok:true, id, count: rows.length, issue: iss.id, note:'состав заморожен на выпуске ' + iss.id + '; числа не хранит, величины всегда текущие; ' +
    'выбывший объект остаётся в списке с пометкой (ИО-14)'}; };
KB.passWorklist = id => { const s = S(); const wl = s.worklists.find(x => x.id === id); if(!wl) return {ok:false, why:'списка нет'};
  if(wl.dept) return {ok:false, why:'список уже передан: ' + deptName(wl.dept)};
  wl.dept = ME.dept; note('ok', 'список ' + id + ' передан подразделению'); return {ok:true, dept: wl.dept}; };
KB.closeWorklist = id => { const s = S(); const wl = s.worklists.find(x => x.id === id); if(!wl) return {ok:false, why:'списка нет'};
  wl.closed = true; note('ok', 'список ' + id + ' закрыт: работа окончена, список читается, но не пополняется'); return {ok:true}; };

/* Справочно для экрана и смоука. */
KB.me = () => clone(ME);
KB.fields = () => SEAM.fieldList(S().object);
KB.statsAvail = () => SEAM.statList(S().object).map(m => Object.assign(m, {on: S().stats.indexOf(m.id) !== -1}, KB.statAvail(m.id)));
KB.cutsAvail = () => SEAM.cutList(S().object).filter(c => !S().cuts.some(x => x.id === c.id)).map(c => Object.assign(c, KB.cutAvail(c.id)));
KB.log = () => clone(log);
KB.seed();

/* ======================================================================
   4. РЕНДЕР — только при наличии DOM; логика выше от него не зависит
   ====================================================================== */
function toast(text, kind){ if(!hasDOM) return; const w = document.getElementById('toastWrap'); if(!w) return;
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : ''); el.textContent = text;
  w.appendChild(el); setTimeout(() => el.remove(), 4800); }
function act(r, okText){ if(!r.ok){ toast(r.why, 'err'); } else if(okText || r.note){ toast(okText || r.note, 'ok'); } render(); }
const val = (id, v) => { if(v == null) return '—'; const m = STAT(id);
  return (m.unit === 'сом' || m.unit === 'ед.') ? money(v) : num1(v); };

function scCompose(){
  const s = S(), fl = KB.fields();
  let h = '';
  /* --- вопрос --- */
  h += '<div class="card"><h3>Вопрос</h3>' +
    '<div class="form-row"><div class="fld" style="flex:1"><label>Имя черновика</label>' +
    '<input value="' + esc(s.name) + '" onchange="KB.setName(this.value);render()"></div></div>' +
    '<div class="form-row" style="margin-top:8px"><div class="fld" style="flex:1"><label>Основной объект</label>' +
    '<select onchange="KB.ui.obj(this.value)">' + Object.keys(FIELDS).map(o => '<option value="' + o + '"' + (o === s.object ? ' selected' : '') + '>' +
      esc(FIELDS[o].name) + ' — перечень: ' + esc(FIELDS[o].owner) + '</option>').join('') + '</select></div></div>' +
    '<div class="form-row" style="margin-top:8px"><div class="fld"><label>Режим времени</label><div class="seg">' +
    ['на дату', 'сейчас'].map(m => '<button class="' + (s.mode === m ? 'on' : '') + '" onclick="KB.ui.mode(\'' + m + '\')">' + m + '</button>').join('') +
    '</div></div>';
  if(s.mode === 'на дату') h += '<div class="fld" style="flex:1"><label>Дата состояния</label><select onchange="KB.ui.asOf(this.value)">' +
    SNAPSHOTS.map(d => '<option value="' + d + '"' + (d === s.asOf ? ' selected' : '') + '>' + fmt(d) + ' · снимок · ' + (FIXED[d] ? 'зафиксировано' : 'не зафиксировано') + '</option>').join('') +
    '<option value="' + TODAY + '"' + (s.asOf === TODAY ? ' selected' : '') + '>' + fmt(TODAY) + ' · снимка нет</option></select></div>';
  else h += '<div class="fld"><label>Живой запрос к ядру</label><button class="btn btn-primary" style="height:32px" onclick="act(KB.compute(),\'посчитано по живому состоянию\')">Посчитать</button></div>';
  h += '</div><div class="why">' + (s.mode === 'на дату' ? 'Отвечает статистика по строкам ночного прогона; дата состояния одна на весь ответ.'
    : 'Отвечает ядро живым запросом objectRows; считается по кнопке, чтобы не гонять ядро на каждую галочку.') + '</div></div>';

  /* --- показатели --- */
  const st = KB.statsAvail();
  h += '<div class="card"><h3>Показатели <span class="small">· реестр статистики · ' + st.filter(x => x.on).length + ' из ' + st.length + '</span></h3>';
  h += st.map(m => '<label class="opt' + (m.ok || m.on ? '' : ' off') + '"><input type="checkbox"' + (m.on ? ' checked' : '') + (m.ok || m.on ? '' : ' disabled') +
    ' onchange="act(KB.toggleStat(\'' + m.id + '\'))"><span class="t">' + esc(m.name) +
    (m.ok || m.on ? '<small>' + esc(m.agg) + (m.live ? '' : ' · налету не берётся') + '</small>' : '<small class="no">' + esc(m.why) + '</small>') +
    '</span><span class="u">' + esc(m.unit) + '</span></label>').join('');
  h += '<div class="why">Показатель — величина с объявленным источником и без формулы; своих величин страница не считает (ИО-2).</div></div>';

  /* --- разрезы --- */
  h += '<div class="card"><h3>Разрезы <span class="small">· уровни дерева сверху вниз</span></h3>';
  if(!s.cuts.length) h += '<div class="why">Без разреза ответ — один корень «всего». Добавьте уровень.</div>';
  h += s.cuts.map((c, i) => { const m = CUT(c.id);
    return '<div class="cutrow"><span class="lvl">' + (i + 1) + '</span><span class="nm">' + esc(m.name) + '</span>' +
      (m.buckets ? '<select onchange="act(KB.setBucket(\'' + c.id + '\',this.value))">' + Object.keys(m.buckets).map(b =>
        '<option' + (b === c.bucket ? ' selected' : '') + '>' + esc(b) + '</option>').join('') + '</select>' : '') +
      '<label class="tot"><input type="checkbox"' + (c.total ? ' checked' : '') + ' onchange="act(KB.toggleTotal(\'' + c.id + '\'))"> итог</label>' +
      '<span class="ctl"><button class="btn btn-secondary btn-xs" title="выше" onclick="act(KB.moveCut(\'' + c.id + '\',-1))">↑</button>' +
      '<button class="btn btn-secondary btn-xs" title="ниже" onclick="act(KB.moveCut(\'' + c.id + '\',1))">↓</button>' +
      '<button class="btn btn-secondary btn-xs" title="убрать" onclick="act(KB.removeCut(\'' + c.id + '\'))">×</button></span></div>'; }).join('');
  const ca = KB.cutsAvail();
  h += '<div class="addrow"><select id="addCut">' + ca.map(c => '<option value="' + c.id + '"' + (c.ok ? '' : ' disabled') + '>' + esc(c.name) +
    (c.ok ? (c.buckets ? ' · корзины: ' + Object.keys(c.buckets).join(' / ') : '') : ' — недоступен в режиме «' + s.mode + '»') + '</option>').join('') +
    '</select><button class="btn btn-secondary btn-sm" onclick="act(KB.addCut(document.getElementById(\'addCut\').value))">+ добавить разрез</button></div>';
  ca.filter(c => !c.ok).forEach(c => { h += '<div class="why amb">«' + esc(c.name) + '» ' + esc(c.why) + '</div>'; });
  h += '<div class="why">Корзина огрубляет значение при чтении, строка хранит его как есть. Итог уровня приходит узлом дерева, страница его не складывает (ИО-17).</div></div>';

  /* --- фильтры --- */
  h += '<div class="card"><h3>Фильтры <span class="small">· сужают вопрос; разрез делит ответ</span></h3>';
  h += s.filters.map((f, i) => { const fd = fieldOf(s.object, f.field);
    const ops = OPS[fd.type];
    let vin;
    if(fd.type === 'словарь' && f.op === 'равно') vin = '<select onchange="act(KB.setFilter(' + i + ',{value:this.value}))"><option value="">—</option>' +
      DICTS[fd.dict].map(v => '<option' + (v === f.value ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>';
    else vin = '<input type="' + (fd.type === 'дата' ? 'date' : 'text') + '" value="' + esc(f.value) + '" placeholder="' +
      (fd.type === 'число' ? (fd.unit || 'число') : fd.type === 'словарь' ? 'через запятую' : fd.type) + '" onchange="act(KB.setFilter(' + i + ',{value:this.value}))">';
    return '<div class="fltrow"><select onchange="act(KB.setFilter(' + i + ',{field:this.value}))">' + fl.fields.map(x =>
        '<option value="' + x.id + '"' + (x.id === f.field ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>' +
      '<select onchange="act(KB.setFilter(' + i + ',{op:this.value}))">' + ops.map(o => '<option' + (o === f.op ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
      vin + '<button class="btn btn-secondary btn-xs" onclick="act(KB.removeFilter(' + i + '))">×</button></div>'; }).join('');
  h += '<div class="addrow"><button class="btn btn-secondary btn-sm" onclick="act(KB.addFilter())">+ добавить фильтр</button>' +
    '<span class="small">операторы — по типу величины: число · дата · текст · словарь</span></div></div>';

  /* --- строки объектов --- */
  h += '<div class="card"><h3>Строки объектов <span class="small">· углубление</span></h3>' +
    '<label class="opt"><input type="checkbox"' + (s.drill.on ? ' checked' : '') + ' onchange="act(KB.setDrill(this.checked))"><span class="t">Показывать строки под последним уровнем' +
    '<small>другой шов (' + (s.mode === 'на дату' ? 'statRows' : 'objectRows') + '), другой объём, поля из публичного перечня</small></span></label>';
  if(s.drill.on) h += '<div style="margin-top:6px">' + fl.fields.map(x => '<label class="opt" style="padding:3px 0"><input type="checkbox"' +
    (s.drill.fields.indexOf(x.id) !== -1 ? ' checked' : '') + ' onchange="act(KB.toggleField(\'' + x.id + '\'))"><span class="t">' + esc(x.name) +
    '</span><span class="u">' + esc(x.type) + '</span></label>').join('') + '</div>';
  h += '</div>';
  return h;
}

function treeRows(a, node, depth){
  const s = S(), cols = a.stats;
  let h = '';
  const ind = '<span class="ind" style="width:' + ((depth - 1) * 18) + 'px"></span>';
  h += '<tr class="grp g' + Math.min(depth, 3) + '"><td>' + ind + esc(node.key) + '<span class="cnt">' + esc(FIELDS[s.object].word(node.count)) + '</span></td>' +
    cols.map(id => '<td class="num">' + val(id, node.values[id]) + '</td>').join('') + '</tr>';
  if(node.children) node.children.forEach(ch => { h += treeRows(a, ch, depth + 1); });
  else if(s.drill.on && node.rows){
    node.rows.forEach(r => { h += '<tr class="obj"><td>' + s.drill.fields.map(f => { const fd = fieldOf(s.object, f); const x = r[f];
      const t = fd.type === 'число' ? money(x) : fd.type === 'дата' ? fmt(x) : fd.dict === 'dept' ? deptName(x) : String(x);
      return '<span class="f" title="' + esc(fd.name) + '">' + esc(t) + '</span>'; }).join('<span class="sep">·</span>') + '</td>' +
      cols.map(() => '<td class="num muted">·</td>').join('') + '</tr>'; });
  }
  if(node.total) h += '<tr class="gtot"><td>' + ind + 'Итог по «' + esc(node.key) + '»</td>' +
    cols.map(id => '<td class="num"><b>' + val(id, node.values[id]) + '</b></td>').join('') + '</tr>';
  return h;
}

function scAnswer(){
  const s = S();
  let h = '';
  s.notices.forEach(n => { h += '<div class="banner ' + n.kind + '">' + esc(n.text) + '</div>'; });
  const a = KB.answer();
  if(!a.ok && !a.answer){
    h += '<div class="banner info"><b>Ответа пока нет.</b> ' + esc(a.why) + '</div>';
    return h + scActions();
  }
  const ans = a.ok ? a : a.answer;
  if(a.stale) h += '<div class="banner warn"><b>Показан прежний расчёт.</b> ' + esc(a.why) + '</div>';
  if(ans.substituted) h += '<div class="banner warn"><b>Дата подставлена.</b> Спрошено ' + esc(fmt(ans.passport.asked)) + ', снимка на эту дату нет; показано состояние на ' +
    esc(fmt(ans.substituted)) + '. Паспорт называет обе даты.</div>';
  const p = ans.passport;
  /* --- шапка показа: отвечает сама за себя (ИО-6) --- */
  h += '<div class="snap"><div class="hd"><b>Личный черновик ' + esc(ME.who) + ' · «' + esc(s.name || 'без имени') + '»</b>' +
    '<span class="pill warn">НЕ ВЫПУСК</span><span class="pill neutral">' + esc(p.short) + '</span></div>' +
    '<div class="row"><span class="k">объект · режим</span>' + esc(FIELDS[s.object].name) + ' · ' + esc(s.mode) + '</div>' +
    '<div class="row"><span class="k">дата состояния</span>' + (p.asOf ? esc(fmt(p.asOf)) + ' — ' + esc(p.age) + (p.asked && p.asked !== p.asOf ? ' <span style="color:var(--asubk-amber)">(спрошено ' + esc(fmt(p.asked)) + ')</span>' : '')
      : 'живое состояние на ' + esc(p.at)) + '</div>' +
    '<div class="row"><span class="k">фиксация</span>' + esc(p.fixed) + '</div>' +
    '<div class="row"><span class="k">область видимости</span>' + esc(p.scopeText) + ' — вам видно ' + esc(FIELDS[s.object].word(p.visible)) +
      (p.hidden ? ', <b>' + p.hidden + ' ' + plural(p.hidden, 'скрыт', 'скрыты', 'скрыты') + ' областью видимости</b>' : '') + '</div>' +
    '<div class="row"><span class="k">показанный состав</span>' + esc(p.shown.stats.join('; ') || '—') + ' · уровни: ' + esc(p.shown.cuts.join(' → ') || 'нет') +
      (p.shown.filters.length ? ' · отбор: ' + esc(p.shown.filters.join('; ')) : '') + (p.shown.drill ? ' · строки: ' + esc(p.shown.drill.join(', ')) : '') + '</div>' +
    '<div class="row"><span class="k">кто отвечает</span>' + esc(p.owner) + ' · швы ' + esc(p.seams.join(' + ')) + '</div></div>';
  /* --- дерево --- */
  h += '<div class="tblwrap"><table class="cgrid"><thead><tr><th>' + esc(ans.levels.map(l => CUT(l.id).name).join(' → ') || 'всего') +
    '<span class="th-sub">дерево уровней · число узла — по строкам узла</span></th>' +
    ans.stats.map(id => '<th class="num">' + esc(STAT(id).name) + '<span class="th-sub">' + esc(STAT(id).unit) + '</span></th>').join('') + '</tr></thead><tbody>';
  if(!ans.stats.length) h += '<tr><td colspan="9" class="empty">Выберите хотя бы один показатель: без него дерево считает только строки.</td></tr>';
  if(ans.root.children) ans.root.children.forEach(n => { h += treeRows(ans, n, 1); });
  else if(s.drill.on && ans.root.rows) h += treeRows(ans, ans.root, 1);
  h += '<tr class="root"><td>Всего<span class="cnt" style="font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px">' + esc(FIELDS[s.object].word(ans.root.count)) + '</span></td>' +
    ans.stats.map(id => '<td class="num">' + val(id, ans.root.values[id]) + '</td>').join('') + '</tr>';
  h += '</tbody></table></div>';
  if(s.cuts.some(c => c.id === 'dept' || c.id === 'b-dept') && ans.root.children && ans.root.children.length === 1)
    h += '<div class="why">Уровень «подразделение» дал один узел: область видимости сузила мир до вашего департамента. У уполномоченного узлов было бы ' + DEPTS.length + '.</div>';
  return h + scActions();
}

function scActions(){
  const s = S();
  let h = '<div class="card"><h3>Действия с ответом</h3><div class="btn-row">' +
    '<button class="btn btn-secondary btn-sm" onclick="act(KB.saveDraft())">Сохранить черновик</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="act(KB.exportIssue(\'xlsx\'))">Выгрузить xlsx</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="act(KB.exportIssue(\'pdf\'))">Выгрузить pdf</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="act(KB.makeWorklist(S().drill.on ? prompt(\'Имя рабочего списка\', S().name) : \'\'))">Завести рабочий список</button>' +
    '<button class="btn btn-primary btn-sm" onclick="act(KB.askPublish())">Попросить публикации</button></div>' +
    '<div style="margin-top:10px">' +
    '<div class="refuse"><b>Выпустить окончательно</b><span class="no">нельзя:</span><span>у черновика нет получателя и обязательства — окончательный выпуск делается по опубликованной редакции составом по умолчанию (ИО-4, ИО-21)</span></div>' +
    '<div class="refuse"><b>Поставить на дашборд</b><span class="no">нельзя:</span><span>плитка бывает только из объявленного отчёта (ИО-1)</span></div>' +
    '<div class="refuse"><b>Опубликовать</b><span class="no">не вам:</span><span>публикует ' + esc(AUTH.who) + '; шаблоном состав становится публикацией, не сборкой (ADR-0156 §2)</span></div>' +
    '</div></div>';
  /* --- след --- */
  const n = s.drafts.length + s.issues.length + s.worklists.length + (s.asked ? 1 : 0);
  h += '<div class="card"><h3>След <span class="small">· ' + (n ? n + ' ' + plural(n, 'запись', 'записи', 'записей') : 'пока пусто') + '</span></h3><div class="trace">';
  if(s.asked) h += '<div class="it"><span class="id">→</span>черновик «' + esc(s.asked.draft) + '» передан на публикацию: ' + esc(s.asked.to) + ', ' + esc(fmt(s.asked.at)) +
    '<small>до публикации — личный; круг, расписание и основание назовёт публикующий</small></div>';
  s.drafts.forEach(d => { h += '<div class="it"><span class="id">' + esc(d.id) + '</span>черновик «' + esc(d.name) + '» · ' + esc(fmt(d.at)) +
    ' · <a href="#" onclick="act(KB.openDraft(\'' + d.id + '\'));return false">открыть</a><small>виден только вам · ' + esc(FIELDS[d.comp.object].name) + ' · ' + esc(d.comp.mode) + '</small></div>'; });
  s.issues.forEach(it => { h += '<div class="it"><span class="id">' + esc(it.id) + '</span>предварительный выпуск · ' + esc(it.fmt) + ' · ' + esc(it.at) + ' <span class="pill neutral">личный</span>' +
    '<small>паспорт: ' + esc(it.passport.short) + ' · файл до ' + esc(fmt(it.fileUntil)) + ', строка навсегда</small></div>'; });
  s.worklists.forEach(w => { h += '<div class="it"><span class="id">' + esc(w.id) + '</span>рабочий список «' + esc(w.name) + '» · ' + w.count + ' объектов · заморожен выпуском ' + esc(w.issue) +
    (w.closed ? ' <span class="pill neutral">закрыт</span>' : w.dept ? ' <span class="pill info">передан: ' + esc(deptName(w.dept)) + '</span>' : ' <span class="pill ok">мой</span>') +
    '<small>' + (w.closed ? 'читается, не пополняется' : '<a href="#" onclick="act(KB.passWorklist(\'' + w.id + '\'));return false">передать подразделению</a> · <a href="#" onclick="act(KB.closeWorklist(\'' + w.id + '\'));return false">закрыть</a>') + '</small></div>'; });
  if(!n) h += '<div class="small">Сохранённые черновики, личные выпуски и рабочие списки появятся здесь.</div>';
  h += '</div></div>';
  return h;
}

KB.ui = {
  obj: v => { const r = KB.setObject(v); if(r.switched) toast(r.why, 'err'); render(); },
  mode: v => { const r = KB.setMode(v); if(!r.ok) toast(r.why, 'err'); else r.dropped.forEach(d => toast(d.kind + ' «' + d.name + '» снят: ' + d.why, 'err')); render(); },
  asOf: v => { const r = KB.setAsOf(v); if(!r.ok) toast(r.why, 'err'); render(); }
};
function render(){
  if(!hasDOM) return;
  const app = document.getElementById('app'); if(!app) return;
  app.innerHTML = '<div class="two"><aside class="compose">' + scCompose() + '</aside><main class="answer">' + scAnswer() + '</main></div>';
  const f = document.getElementById('foot'); if(f) f.innerHTML =
    '<b>Заглушки соседей в этом файле:</b> реестр показателей и разрезов (статистика) · публичные перечни полей (ядро) · строки среза на ' +
    SNAPSHOTS.map(fmt).join(' и ') + ' (ночной прогон) · живое состояние на ' + fmt(TODAY) + ' (ядро). В жизни всё это приходит швами ' +
    '<span class="mono">statSlice · statRows · objectRows</span>; своих запросов к базе и своих формул у страницы нет (ИО-2, ИО-3). ' +
    'Данные: ' + CREDITS.length + ' кредитов, ' + BORROWERS.length + ' заёмщиков, сгенерированы детерминированно.';
}
if(hasDOM) render();
window.KB = KB; window.SEAM = SEAM; window.S = S; window.act = act; window.render = render;
</script>
</body>
</html>
