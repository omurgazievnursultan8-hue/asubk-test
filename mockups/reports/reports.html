/* Вид привязан к ШАБЛОНУ и сверяется при каждом показе: ставшая недопустимой
   часть отваливается С ПОМЕТКОЙ, остальное работает. Ни молчаливой подмены,
   ни блокировки всего вида из-за чужой правки соседнего столбца.           */
RP.applyView = id => {
  const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  if(vw.owner !== RP.who()) return {ok:false, why:'вид «'+vw.name+'» принадлежит '+vw.owner+
    ': вид личный, чужим способом смотреть не пользуются (ADR-0162 §3)'};
  const t = TPL(vw.tpl); if(!t) return {ok:false, why:'шаблона нет'};
  const ed = pubEd(t);
  if(!ed) return {ok:false, why:'у шаблона «'+t.name+'» нет опубликованной редакции'};
  const base = baseOf(ed), B = boundsOf(ed), dropped = [];
  const okCut = c => base.cuts.indexOf(c) !== -1 || B.cuts.indexOf(c) !== -1;
  vw.twist.cuts.filter(c => !okCut(c)).forEach(c => dropped.push('разрез «'+cutName(c)+
    '» редакция '+ed.n+' допустимым отклонением больше не объявляет — отвалился'));
  const cuts = reconcile(base.cuts, B.cuts, vw.twist.cuts.filter(okCut));
  cuts.filter(c => vw.twist.cuts.indexOf(c) === -1).forEach(c => dropped.push('уровень «'+
    cutName(c)+'» редакция '+ed.n+' объявила составом — вернулся в показ'));
  const okStat = s => { const m = SEAM.statMeta(s);
    return !!m && !m.withdrawn && (base.stats.indexOf(s) !== -1 || B.stats.indexOf(s) !== -1); };
  vw.twist.stats.filter(s => !okStat(s)).forEach(s => { const m = SEAM.statMeta(s);
    dropped.push('показатель «'+(m ? m.name : s)+'» '+(m && m.withdrawn
      ? 'выведен из реестра '+fmt(m.withdrawn)
      : 'редакцией '+ed.n+' отклонением больше не объявлен')+' — отвалился'); });
  const stats = reconcile(base.stats, B.stats, vw.twist.stats.filter(okStat));
  stats.filter(s => vw.twist.stats.indexOf(s) === -1).forEach(s => dropped.push('показатель «'+
    statName(s)+'» редакция '+ed.n+' объявила составом — вернулся в показ'));
  let drill = vw.twist.drill;
  if(drill !== base.drill && !B.drill){ drill = base.drill;
    dropped.push('углубление до строк объектов редакция '+ed.n+' отклонением больше не '+
      'объявляет — вернулось как объявлено'); }
  let chk = twistCheck(ed, {cuts, stats, drill, layout: vw.twist.layout});
  if(!chk.ok){ dropped.push('остаток вида редакции '+ed.n+' не годится ('+chk.why+
    ') — показан состав по умолчанию'); chk = twistCheck(ed, null); }
  return {ok:true, view: clone(vw), ed: ed.n, dropped, deviated: chk.deviated,
    twist: Object.assign({}, chk.twist, {view: vw.name, dropped}),
    note: dropped.length
      ? 'вид «'+vw.name+'» сверен с редакцией '+ed.n+': отвалилось пунктов — '+dropped.length+
        ', остальное работает'
      : 'вид «'+vw.name+'» сверен с редакцией '+ed.n+' целиком'};
};
RP.showView = (id, params) => { const a = RP.applyView(id); if(!a.ok) return a;
  const r = RP.show(a.view.tpl, params, a.twist);
  if(!r.ok) return r;
  return Object.assign({}, r, {view: a.view, dropped: a.dropped, note: a.note}); };

/* Перечень допустимых отклонений — часть РЕДАКЦИИ, а не настройка экрана:
   границы объявляются там же, где состав, и задним числом не расширяются.  */
RP.setFree = (tid, patch) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'перечень допустимых отклонений объявляет '+
    'уполномоченный по отчётности: границы крутилки — часть состава, а не настройка экрана '+
    '(ИО-20, §13.1)'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'редакция «'+t.name+'» опубликована: границы крутилки объявлены '+
    'ею и задним числом не расширяются — иначе вчерашний показ и сегодняшний спорят о том, что '+
    'было можно. Нужна НОВАЯ РЕДАКЦИЯ (ИО-2, ИО-20)'};
  const f = Object.assign({}, boundsOf(ed), patch || {});
  const badCut = (f.cuts || []).filter(c => !CUT_NAMES[c]);
  if(badCut.length) return {ok:false, why:'разрезом «'+badCut[0]+'» отчётность не разрезает: '+
    'отклонения берутся из того же перечня, что и состав (ADR-0162 §1)'};
  const badStat = (f.stats || []).filter(s => !SEAM.statMeta(s));
  if(badStat.length) return {ok:false, why:'показателя «'+badStat[0]+'» в реестре статистики '+
    'нет: перечень отклонений — не список пожеланий'};
  const dead = (f.stats || []).map(s => SEAM.statMeta(s)).filter(m => m.withdrawn);
  if(dead.length) return {ok:false, why:'показатель «'+dead[0].name+'» выведен '+
    fmt(dead[0].withdrawn)+': разрешать экрану выведенное нечего — его не покажет и состав'};
  if(ed.mode === 'сейчас'){
    const slow = (f.stats || []).map(s => SEAM.statMeta(s)).filter(m => !m.live);
    if(slow.length) return {ok:false, why:'показатель «'+slow[0].name+'» налету не берётся: '+
      slow[0].why+' — разрешить его экрану значит пообещать невыполнимое (ADR-0159)'};
  }
  ed.free = {cuts:(f.cuts || []).slice(), stats:(f.stats || []).slice(), drill: !!f.drill};
  log('границы крутилки «'+t.name+'» объявлены в черновике ред. '+ed.n);
  return {ok:true, note:'отклонения объявлены в черновике: разрезов — '+ed.free.cuts.length+
    ', показателей — '+ed.free.stats.length+', углубление '+(ed.free.drill ? 'крутится' : 'жёсткое')};
};
/* ======================= ВЫПУСК — ЗАКАЗ, А НЕ НАЖАТИЕ ==================
   Легаси считает синхронно: 90–107 с на портфеле в 51 268 субъектов, окно
   висит, отмены нет (ОЧ-30). Здесь заказ и счёт разведены. Дешёвые проверки —
   при ЗАКАЗЕ; счёт, снимок, номер и получатель — в шаге «считается». Строка
   журнала и паспорт заводятся в момент заказа: кто, чем, на какую дату и каким
   охватом — известно сразу, неизвестны только числа (§5).                   */
const JOB_STATES = ['заказан','считается','готов','ошибка'];
RP.jobStates = () => JOB_STATES.slice();

function orderPassport(t, ed, params, v, edEff){
  const sheet = sheetOfEd(ed);
  const e = edEff || ed;
  return {asOf: ed.mode === 'на дату' ? params.asOf : null, mode: ed.mode, frozen:false,
    scope: v.scope.map(deptName), edition: ed.n, template: t.name, params: clone(params),
    hidden: 0, ordered: true,
    sheet:{orient: sheet.orient, bands: sheet.bands.slice(), formats: sheet.formats.slice()},
    levels: (e.cuts || []).map(by => cutName(by) +
      ((e.levelTotals || []).indexOf(by) !== -1 ? ' (с итогом)' : '')),
    /* Показанный состав известен уже при заказе: числа неизвестны, а чем
       спрошено — известно (ИО-22).                                          */
    shown: t.kind === 'бланк' ? null : shownOf(e, e.drill !== false),
    rounding: [], seams: []};
}

/* ============ ПРАВО ОКОНЧАТЕЛЬНОГО ВЫПУСКА (§13.6, ИО-25) =============
   Выводится, а не объявляется: окончательно выпускает ТОТ, ЗА КЕМ
   ОБЯЗАТЕЛЬСТВО; где обязательства нет — всякий в круге. «За кем» бывает
   подразделением, а не человеком, — иначе сдача встанет на отпуске.
   Отдельного права на роли не заводится: это был бы второй источник ответа
   на вопрос «кто сдаёт», и он разошёлся бы с обязательствами (ОЧ-45).
   Крутилка при этом не спрашивается вовсе: она ничего не тратит
   (ADR-0162 §9), а окончательный выпуск тратит номер и закрывает срок.     */
RP.finalRight = (tid, coverage) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const v = RP.viewer();
  const cov = (coverage && coverage.length ? coverage
    : v.scope.filter(dp => t.circle.indexOf(dp) !== -1));
  if(!t.schedule) return {ok:true, who:null, free:true,
    note:'обязательства у шаблона нет — окончательно выпускает всякий в круге'};
  /* Свод по ВСЕМУ кругу — обязательство не подразделения, а того, кто ведёт
     шаблон и сдаёт получателю: он и есть «тот, за кем». Выпуск по одному
     подразделению — обязательство этого подразделения.                      */
  const whole = t.circle.every(dp => cov.indexOf(dp) !== -1);
  if(whole && t.owner === RP.who()) return {ok:true, free:false, whole:true, who:[t.owner],
    note:'свод по всему кругу сдаёт тот, кто ведёт шаблон, — обязательство перед получателем его'};
  const mine = dep => dep === v.dept || RESPONSIBLE[dep] === RP.who();
  const alien = cov.filter(dep => !mine(dep));
  if(!alien.length) return {ok:true, free:false,
    who: cov.map(dep => (RESPONSIBLE[dep] || '—')+' ('+deptName(dep)+')'),
    note:'обязательство за вами: '+cov.map(deptName).join('; ')};
  return {ok:false, free:false,
    who: alien.map(dep => (RESPONSIBLE[dep] || '—')+' ('+deptName(dep)+')'),
    why:'окончательно выпускает тот, за кем обязательство: по охвату «'+
      alien.map(deptName).join('; ')+'» отвечает '+
      alien.map(dep => (RESPONSIBLE[dep] || '—')).join('; ')+', а не '+RP.who()+
      '. Посмотреть и выгрузить предварительно вы вправе — смотреть волен всякий в круге, '+
      'крутилка ничего не тратит; окончательный выпуск тратит номер серии и закрывает срок, '+
      'и спрашивать за него надо с того, с кого и так спросят (ИО-25, §13.6)'};
};
RP.whoSubmits = tid => { const t = TPL(tid);
  if(!t || !t.schedule) return null;
  return t.circle.map(dep => ({dept:dep, deptName: deptName(dep), who: RESPONSIBLE[dep] || '—'}));
};

RP.order = (tid, spec) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const v = RP.viewer();
  const ed = pubEd(t);
  if(!ed) return {ok:false, why:'выпускать можно только опубликованную редакцию: «'+t.name+
    '» — личный черновик (ИО-1)'};
  if(t.circle.indexOf(v.dept) === -1) return {ok:false, why:'шаблон «'+t.name+'» не в круге '+
    'подразделения «'+deptName(v.dept)+'»: круг ведёт уполномоченный (§13.1)'};
  const br = brokenBy(t, ed);
  if(br) return {ok:false, why:'шаблон неисполним: '+br};
  if(typeof spec.recipient === 'string' && spec.recipient && !ADDR(spec.recipient))
    return {ok:false, why:'получатель — ссылка на справочник адресатов, а не строка: '+
      '«'+spec.recipient+'» и «Минфин КР» станут в журнале двумя разными адресатами (ИО-5)'};
  const at = spec.at || RP.state.today;
  const params = clone(spec.params || {});
  const asked = spec.kind === 'окончательный' ? 'окончательный' : 'предварительный';

  /* Накрученный показ выпускается — но НИКОГДА окончательным: обязательство
     берётся на объявленной форме, а не на той, что человек сложил себе под
     задачу. Получатель сравнивает присланное с прошлым разом, а не с
     паспортом (ИО-21, ADR-0162 §6). Раскладка в выпуск не уходит вовсе:
     лист принадлежит редакции (ИО-18).                                      */
  let twist = null, edEff = ed;
  if(t.kind === 'отчёт'){
    const chk = twistCheck(ed, spec.twist || null);
    if(!chk.ok) return chk;
    if(chk.deviated && asked === 'окончательный') return {ok:false, why:'окончательный выпуск '+
      'идёт только составом по умолчанию: накрученное сдать нельзя — получатель сравнивает '+
      'присланное с прошлым разом, а не с паспортом (ИО-21, ADR-0162 §6)'};
    twist = Object.assign({}, chk.twist, {layout: baseOf(ed).layout});
    edEff = withTwist(ed, twist);
  }

  /* Бланк проверяется целиком при заказе: он об ОДНОМ объекте, счёт дешёвый. */
  if(t.kind === 'бланк'){
    const o = OBJ(params.obj);
    if(!o) return {ok:false, why:'объект для бланка не назван'};
    if(ed.mode === 'на дату' && !params.asOf) return {ok:false, why:'бланк «'+t.name+'» говорит '+
      'о состоянии НА ДАТУ: без даты состояния печатать нечего — она вопрос, а не отбор ('+
      (t.schedule ? t.schedule.asOfRule : 'дата состояния')+')'};
    const data = composeBlank(t, ed, params.obj, v, params.asOf);
    if(data.missing) return {ok:false, why:'снимка статистики на '+fmt(params.asOf)+
      ' нет вовсе: спросить нечего (ИО-6)'};
    if(!data.row && ed.mode === 'на дату' && v.scope.indexOf(o.dept) !== -1)
      return {ok:false, why:'на '+fmt(params.asOf)+' объекта «'+o.no+'» в снимке нет: он заведён '+
        'позже даты состояния, и говорить о нём на эту дату не о чем (ИО-27)'};
    if(!data.row) return {ok:false, why:'объект «'+o.no+'» вне области видимости роли «'+
      RP.state.role+'»: бланк печатает тот, у кого шаблон в круге И объект видим — два замка (§13.3)'};
    const lost = data.subs.filter(s => s.lost);
    if(lost.length) return {ok:false, why:'в макете {{'+lost[0].id+'}}, объект «'+
      SEAM.fieldList(ed.object).name+'» такого поля не объявляет'};
  }
  /* Охват бланка — подразделение ЕГО объекта, а не весь круг смотрящего: бумага
     об одном кредите закрывает долг одного подразделения, и приписывать ей
     остальные значило бы закрыть чужой срок чужой бумагой (волна 9).          */
  const coverage = t.kind === 'бланк' ? [OBJ(params.obj).dept]
    : (params.dept ? [params.dept] : v.scope.filter(dp => t.circle.indexOf(dp) !== -1));

  /* Что можно отклонить, не считая, — отклоняется при заказе: незачем занимать
     очередь заданием, которое всё равно кончится отказом.                    */
  if(asked === 'окончательный'){
    const right = RP.finalRight(tid, coverage);
    if(!right.ok) return right;
    if(t.kind === 'бланк'){
      if(spec.recipient) return {ok:false, why:'у бланка получатель не выбирается из справочника '+
        'адресатов сдачи: его объявляет редакция видом — лицо в роли, подразделение, подразделение '+
        'своего объекта или должность, — а значение берётся у соседа (ИО-5, ADR-0168 §1)'};
      /* Получателя объявила РЕДАКЦИЯ, и невозможность его назвать — отказ с
         именем, а не молчаливая подстановка заёмщика (ADR-0167 §2, ADR-0168 §2). */
      const who = resolveAddressee(ed.addressee, params.obj);
      if(!who.ok) return {ok:false, why:'бланк «'+t.name+'» '+who.why};
    } else if(!spec.recipient) return {ok:false, why:'окончательный выпуск бывает только с названным '+
      'получателем: числа морозит получатель, а не кнопка (ИО-4, ADR-0157 §2)'};
    if(spec.format && spec.format !== 'pdf') return {ok:false, why:'наружу с получателем уходит '+
      'только pdf: снимок в редактируемом формате — не снимок ('+spec.format+' отклонён, ИО-10)'};
    if(t.kind === 'бланк' && t.series && t.series.manual){
      if(!spec.number) return {ok:false, why:'серия «'+t.series.prefix+'» ручная: журнал '+
        'исходящих ведёт канцелярия, номер вводится рукой — система его не выдаёт'};
      if(t.series.used.indexOf(spec.number) !== -1) return {ok:false, why:'номер «'+spec.number+
        '» в серии уже занят: система номера не выдаёт, но дубль ловит'};
    }
  }

  const id = 'ВП-' + (++RP.state.seq);
  const rec = {
    id, tpl: t.id, tplName: t.name, kindTpl: t.kind, ed: ed.n,
    kind:'заказан', asked, state:'заказан', at, by: RP.who(),
    recipient: null, params, coverage, passport: orderPassport(t, ed, params, v, edEff),
    twist: twist && twistCheck(ed, twist).deviated ? twist : null,
    deviated: !!(twist && twistCheck(ed, twist).deviated), number: null,
    period: t.kind === 'отчёт' ? periodOfAsOf(params.asOf) : null,
    obj: t.kind === 'бланк' ? params.obj : null,
    formats: null, snapshot: null,
    ask:{recipient: spec.recipient || null, format: spec.format || null, number: spec.number || null},
    fileAlive: true, fileUntil: null, fileDeadAt: null,
    diverged: false, divergedAt: null, correctionOf: null, correctedBy: null,
    note: null, error: null
  };
  RP.state.issues.push(rec);
  log('заказан выпуск '+id+' по шаблону «'+t.name+'», ступень при заказе — '+asked);
  return {ok:true, id, state:'заказан', done:false,
    note:'заказ принят: строка журнала и паспорт есть, чисел ещё нет'};
};

/* Шаг задания. Отдельным вызовом, а не таймером: макет показывает состояния,
   а не изображает медленность.                                              */
RP.step = id => {
  const rec = ISS(id); if(!rec) return {ok:false, why:'выпуска нет'};
  const t = TPL(rec.tpl), ed = t.editions.find(e => e.n === rec.ed);
  if(rec.state === 'готов')  return doneResult(rec);
  if(rec.state === 'ошибка') return {ok:false, id, state:'ошибка', done:true, why: rec.error};
  if(rec.state === 'заказан'){
    rec.state = 'считается';
    return {ok:true, id, state:'считается', done:false, note:'задание считает — окно свободно'};
  }

  let data, soft = [];
  if(rec.kindTpl === 'бланк'){
    data = composeBlank(t, ed, rec.params.obj, RP.viewer(), rec.params.asOf);
    soft = data.soft.slice();
  } else {
    data = compose(t, rec.twist ? withTwist(ed, rec.twist) : ed, rec.params, RP.viewer());
    soft = data.soft.slice();
    if(data.missing){
      rec.state = 'ошибка';
      rec.error = 'снимка статистики на '+fmt(rec.params.asOf)+' нет вовсе: спросить нечего (ИО-6)';
      log('выпуск '+id+' кончился ошибкой: снимка на '+fmt(rec.params.asOf)+' нет');
      return {ok:false, id, state:'ошибка', done:true, why: rec.error};
    }
  }

  /* Ступень. Непроверяемое заранее не запрещает выпуск — оно делает его
     предварительным (ИО-8). На шаблоне с обязательным полным охватом это
     ещё и запрещает называть получателя (§13.4).                          */
  let kind = rec.asked, note = null, recipient = null;
  if(kind === 'окончательный'){
    if(soft.length){
      kind = 'предварительный';
      note = t.fullCoverage
        ? 'шаблон требует полного охвата: '+soft[0]+'; назвать получателя нельзя, выпуск '+
          'остался предварительным (§13.4)'
        : 'выпуск сделан предварительным: '+soft[0]+' (ИО-8)';
    } else if(t.kind === 'бланк'){
      /* Получатель бланка — всегда ССЫЛКА: на лицо, на подразделение или на
         должность. Вид назвала редакция, значение взято у соседа, объект
         остаётся ПУТЁМ (ADR-0167 §1–§2, ADR-0168 §2, ИО-28, ИО-29).          */
      recipient = resolveAddressee(ed.addressee, rec.params.obj).rec;
    } else {
      recipient = {kind:'адресат сдачи', ref: rec.ask.recipient,
        name: ADDR(rec.ask.recipient).name, role: null};
    }
  }

  /* Номер серии тратится ВМЕСТЕ СО СНИМКОМ, то есть в этом шаге, а не при
     заказе: заказ, кончившийся отказом, номера не жжёт (ИО-9).             */
  let number = null;
  if(rec.kindTpl === 'бланк' && kind === 'окончательный'){
    if(t.series.manual){
      if(t.series.used.indexOf(rec.ask.number) !== -1){
        rec.state = 'ошибка';
        rec.error = 'номер «'+rec.ask.number+'» в серии уже занят: система номера не выдаёт, но дубль ловит';
        return {ok:false, id, state:'ошибка', done:true, why: rec.error};
      }
      number = rec.ask.number; t.series.used.push(number);
    } else {
      number = t.series.prefix + String(t.series.next).padStart(3,'0');
      t.series.next += 1; t.series.used.push(number);
    }
  }

  const passport = clone(data.passport);
  passport.frozen = kind === 'окончательный';
  passport.deviated = !!rec.deviated;
  passport.issuedAt = rec.at; passport.by = rec.by; passport.ordered = false;
  rec.kind = kind; rec.state = 'готов'; rec.note = note; rec.recipient = recipient;
  rec.number = number; rec.passport = passport;
  rec.formats = kind === 'окончательный' ? ['pdf']
    : (rec.kindTpl === 'бланк' ? ['docx','pdf'] : sheetOfEd(ed).formats.slice());
  /* В снимок ложится ПОКАЗАННАЯ величина: сдано то, что напечатано, иначе
     расхождение срабатывает на копейках ниже объявленной разрядности (ОЧ-32). */
  rec.snapshot = kind === 'окончательный'
    ? (rec.kindTpl === 'бланк'
        ? {at: rec.at, subs: clone(data.subs)}
        : {at: rec.at, rows: clone(data.rows), totals: data.totals.map(x =>
            ({id:x.id, name:x.name, unit:x.unit, dp:x.dp,
              value: x.shown != null ? x.shown : x.value}))})
    : null;
  rec.fileUntil = kind === 'окончательный' ? null : addDays(rec.at, FILE_DAYS);
  log((kind === 'окончательный' ? 'окончательный выпуск ' : 'предварительный выпуск ')+id+
    ' готов по шаблону «'+t.name+'»'+(recipient ? ', получатель '+recipient.name : ''));
  return doneResult(rec);
};
function doneResult(rec){
  return {ok:true, id: rec.id, kind: rec.kind, state:'готов', done:true,
    note: rec.note || (rec.kind === 'окончательный'
      ? 'числа и файл заморожены снимком'+(rec.number ? ', номер '+rec.number : '')
      : 'обязательства не закрывает, снимка не даёт, номера не тратит'),
    rec: clone(rec)};
}
/* Синхронная обёртка: заказ + шаги до конца. Экран так не делает — так делает
   тот, кому нужен ответ здесь и сейчас (перепечатка, демонстрация, смоук).  */
RP.issue = (tid, spec) => {
  const o = RP.order(tid, spec);
  if(!o.ok) return o;
  let r = o;
  for(let i = 0; i < 8 && !r.done; i++) r = RP.step(o.id);
  return r;
};
RP.reprint = tid => RP.issue(tid, {params: clone(RP.state.sel.params), kind:'предварительный'});

/* Факт выпуска вечен; расходник — только файл предварительного (ИО-11).    */
RP.deleteIssue = id => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  return {ok:false, why:'выпуск '+id+' не удаляется: журнал заведён ради вопроса «что мы отдали '+
    'наружу» — стёртая строка отвечает на него неправдой (ИО-11). Гаснет только файл '+
    'предварительного выпуска, по сроку'};
};
RP.gcFiles = () => {
  let n = 0;
  RP.state.issues.forEach(i => { if(i.kind === 'предварительный' && i.fileAlive &&
    i.fileUntil && i.fileUntil.localeCompare(RP.state.today) === -1){
      i.fileAlive = false; i.fileDeadAt = i.fileUntil; n++; } });
  return {ok:true, n, note:'файлов погашено: '+n+'; строки журнала на месте'};
};

/* ================== РАСХОЖДЕНИЕ СО СДАННЫМ (§6) =======================
   Метка не отзывает выпуск: сданное остаётся сданным, но перестаёт молча
   считаться верным.                                                        */
RP.recompute = id => {
  const i = ISS(id); if(!i || !i.snapshot || !i.snapshot.totals) return null;
  const t = TPL(i.tpl), ed = t.editions.find(e => e.n === i.ed);
  const now = compose(t, ed, i.params, {scope: i.coverage.slice()});
  const diffs = i.snapshot.totals.map(s => {
    const n = now.totals.find(x => x.id === s.id);
    /* Сравнивается ПОКАЗАННОЕ с ПОКАЗАННЫМ — в той же разрядности, в какой
       сдавали, иначе метка загорится на шуме ниже неё (ОЧ-32).              */
    const nv = n ? (n.shown != null ? n.shown : n.value) : null;
    return {name: s.name, unit: s.unit, was: s.value, now: nv};
  }).filter(d => d.was !== d.now);
  return {diffs, changed: diffs.length > 0};
};
RP.reopenPeriod = (period, why) => {
  const asOf = asOfOfPeriod(period);
  if(!asOf) return {ok:false, why:'период «'+period+'» снимком не закрыт: открывать нечего'};
  if(RP.viewer().id !== 'buh' && !RP.isAuth()) return {ok:false,
    why:'закрытый период открывает главный бухгалтер: правка чисел задним числом — его решение (ADR-0089)'};
  RP.state.periods[period] = {state:'открыт заново', why, at: RP.state.today};
  /* Правка приходит из ядра и меняет снимок статистики — расхождение
     ЗАРАБОТАНО пересчётом, а не проставлено флагом.                        */
  HIST[asOf]['kr-8'].debt_main = 9950000;
  HIST[asOf]['kr-8'].days = 22;
  HIST[asOf]['kr-8'].status = 'просрочен';
  let marked = 0;
  RP.state.issues.forEach(i => {
    if(!i.snapshot || i.period !== period) return;
    const r = RP.recompute(i.id);
    if(r && r.changed){ i.diverged = true; i.divergedAt = RP.state.today; marked++; }
  });
  log('период «'+period+'» открыт заново: '+why);
  return {ok:true, marked, note:'выпусков со снимком помечено: '+marked+
    '; предварительные выпуски метки не получают — метить нечего (§6)'};
};
RP.whatWentOut = period => RP.state.issues
  .filter(i => i.period === period && i.recipient)
  .map(i => ({id:i.id, at:i.at, to:i.recipient.name, tpl:i.tplName, number:i.number,
              diverged:i.diverged, coverage:i.coverage.map(deptName)}));
RP.corrective = id => {
  const prev = ISS(id); if(!prev) return {ok:false, why:'выпуска нет'};
  if(!prev.recipient) return {ok:false, why:'уточнять нечего: предварительный выпуск наружу не уходил'};
  if(prev.correctedBy) return {ok:false, why:'выпуск '+id+' уже уточнён выпуском '+prev.correctedBy};
  const res = RP.issue(prev.tpl, {params: clone(prev.params), kind:'окончательный',
    recipient: prev.recipient.ref});
  if(!res.ok) return res;
  const next = ISS(res.id);
  next.correctionOf = id; prev.correctedBy = res.id;
  log('корректирующий выпуск '+res.id+' уточняет '+id);
  return {ok:true, id: res.id, note:'прежний выпуск '+id+' не погашен: он остаётся сданным, '+
    'связь видна с обеих сторон'};
};

/* ================= КАЛЕНДАРЬ И ОБЯЗАТЕЛЬСТВА (§7) =====================
   Обязательства ПОРОЖДАЮТСЯ правилом расписания, а не ведутся списком дат
   (решение открытого вопроса §19 п.2). Состояние считается из выпусков.     */
/* Периоды расписания — календарным правилом и только им (ADR-0164 §2). Годовое
   правило отличается от месячного не природой, а шагом: дата состояния и срок
   считаются из тех же полей, поэтому второй сущности «годовое обязательство»
   не заводится.                                                              */
function schedulePeriods(sch, today){
  const out = [];
  if(sch.freq === 'ежегодно'){
    for(let y = +sch.since.slice(0,4); y <= +today.slice(0,4); y++){
      const asOf = y+'-01-01';
      if(asOf.localeCompare(today) === 1) break;
      out.push({asOf, due: y+'-'+String(sch.dueMonth).padStart(2,'0')+'-'+
        String(sch.dueDay).padStart(2,'0'), period:'состояние на '+fmt(asOf)});
    }
    return out;
  }
  let m = sch.since;
  for(let guard = 0; guard < 60; guard++){
    const asOf = firstOfNext(m);
    if(asOf.localeCompare(today) === 1) break;
    out.push({asOf, due: dayOfMonth(asOf, sch.dueDay), period: periodOfAsOf(asOf)});
    m = asOf;
  }
  return out;
}
/* Знаменатель полного охвата у бланка — ОБЪЕКТЫ на дату состояния, и берутся
   они из снимка, а не из живого перечня: кредит, закрытый после даты, из живого
   выпал бы, хотя акт с ним подписывать обязаны, а заведённый позже — попал бы,
   хотя сверяться на ту дату не с кем (ИО-27, волна 9). Область видимости здесь
   не спрашивается: обязательство — факт об организации, а не о смотрящем.    */
function coverObjects(t, ed, asOf, dep){
  const src = SEAM.statRows(ed.object, asOf, {dept:dep}, ALL_DEPTS.slice());
  return src.rows.filter(r => r.status !== 'закрыт').map(r => { const s = subjectInRole(r.id, 'заёмщик');
    return {id:r.id, no:r.no, borrower:r.borrower, subj: s ? s.id : null}; });
}
/* Знаменатель нормы и знаменатель охвата — разные величины, и это говорится вслух.
   П. 9 требует акт «со всеми действующими заёмщиками» — считает ЛИЦ. Охват считает
   ОБЪЕКТЫ, потому что акт печатается по договору. У лица договоров бывает несколько,
   тогда объектов больше, чем лиц. Счёт по объектам строже: закрыться раньше нормы он
   не может. Расхождение показывается, а не прячется (ОЧ-61, ADR-0167 §4).        */
const subjCount = list => uniq(list.map(o => o.subj).filter(Boolean)).length;
RP.obligations = () => {
  const out = [];
  RP.state.templates.forEach(t => {
    const ed = pubEd(t); if(!t.schedule || !ed) return;
    const byObject = t.coverBy === 'объект';
    schedulePeriods(t.schedule, RP.state.today).forEach(p => {
      t.circle.forEach(dep => {
        const fin = RP.state.issues.filter(i => i.tpl === t.id && i.kind === 'окончательный' &&
          i.recipient && i.params.asOf === p.asOf && i.coverage.indexOf(dep) !== -1);
        let done = fin[0] || null, cover = null, closed = !!done, lastAt = done ? done.at : null;
        if(byObject){
          const need = coverObjects(t, ed, p.asOf, dep);
          const got = need.filter(o => fin.some(i => i.obj === o.id));
          cover = {need: need.length, got: got.length,
            needSubj: subjCount(need), gotSubj: subjCount(got),
            missing: need.filter(o => !fin.some(i => i.obj === o.id))};
          closed = need.length > 0 && cover.missing.length === 0;
          lastAt = closed ? fin.map(i => i.at).sort().pop() : null;
          done = closed ? fin[fin.length-1] : null;
        }
        const state = closed ? (lastAt.localeCompare(p.due) === 1 ? 'сдано с опозданием' : 'сдано')
          : (RP.state.today.localeCompare(p.due) === 1 ? 'просрочено' : 'ожидается');
        out.push({id: t.id+'/'+p.asOf+'/'+dep, tpl:t.id, tplName:t.name, tplKind:t.kind, dept:dep,
          deptName: deptName(dep), period: p.period, asOf: p.asOf, due: p.due, state,
          who: RESPONSIBLE[dep] || '—', issue: done ? done.id : null, cover,
          issues: byObject ? fin.map(i => i.id) : (done ? [done.id] : []),
          late: state === 'просрочено' ? daysBetween(p.due, RP.state.today) : 0});
      });
    });
  });
  return out;
};
/* Охват обязательства поимённо: кем закрыт и кем нет. Отдельный вызов, потому
   что спрашивают его двое — календарь и рабочий список «кого досверить».     */
RP.coverageOf = oblId => { const o = RP.obligations().find(x => x.id === oblId);
  return o && o.cover ? clone(o.cover) : null; };
/* Подпись заёмщика модуль не наблюдает: это событие контрагента, а не выпуск.
   Обязательство закрывает то, что модуль ПРОИЗВОДИТ, — выпуск акта каждому
   заёмщику; «подписан ли» знает сопровождение на объекте (ОЧ-59, ADR-0160).  */
RP.markSigned = oblId => ({ok:false, why:'отметки «подписан» в отчётности нет: подпись заёмщика — '+
  'событие контрагента, а не выпуск. Обязательство меряется тем, что модуль производит: акт '+
  'выпущен и ушёл каждому действующему заёмщику. Ход подписания ведёт сопровождение на '+
  'объекте, и оттуда же берётся уклонение от сверки как основание взыскания (ОЧ-59)'});
RP.markDelivered = oblId => ({ok:false, why:'отметки «сдано» в модуле нет: обязательство '+
  'закрывает ВЫПУСК с названным получателем, а не отметка — сданное без выпуска — это несданное '+
  'с отметкой (ИО-12, ADR-0160 §2)'});
RP.autoTask = oblId => ({ok:false, why:'задачу по просроченному обязательству отчётность не '+
  'ставит: у поручения должен быть автор, отвечающий за нагрузку. Модуль показывает, но не '+
  'поручает (ИО-13, ADR-0160)'});
RP.taskBasis = oblId => {
  const o = RP.obligations().find(x => x.id === oblId);
  if(!o) return null;
  return {kind:'обязательство по отчётности', ref:o.id, text:'«'+o.tplName+'» за '+o.period+
    ', '+o.deptName+', срок '+fmt(o.due), state:o.state,
    note:'это ОСНОВАНИЕ задачи; саму задачу заводит человек в модуле задач (ADR-0160 §4)'};
};

/* ======================= МУТАЦИИ СОСЕДЕЙ (демо) ======================= */
RP.renameField = (objType, fid, newId, newName) => {
  const o = FIELDS[objType]; if(!o) return {ok:false, why:'объекта нет'};
  const f = o.fields.find(x => x.id === fid); if(!f) return {ok:false, why:'поля нет'};
  f.id = newId; f.name = newName || f.name;
  log('ядро переименовало поле «'+fid+'» → «'+newId+'» в перечне объекта «'+o.name+'»');
  const broken = RP.brokenTemplates();
  return {ok:true, broken, note:'публичный перечень — шов: переименование ломает публикацию '+
    'и называет виновника ('+o.owner+'), сломано шаблонов: '+broken.length+' (ADR-0158 §4)'};
};
RP.withdrawStat = sid => {
  const s = STAT(sid); if(!s) return {ok:false, why:'показателя нет'};
  s.withdrawn = RP.state.today;
  const list = RP.breakingTemplates(sid);
  log('статистика вывела показатель «'+s.name+'» из реестра');
  return {ok:true, breaking:list, note:'владельцу реестра показан список шаблонов, которые '+
    'сломаются: '+list.length+' (§16)'};
};
RP.breakingTemplates = sid => RP.state.templates
  .filter(t => t.editions.some(e => e.stats.indexOf(sid) !== -1))
  .map(t => ({id:t.id, name:t.name,
    where: t.editions.filter(e => e.stats.indexOf(sid) !== -1).map(e => 'ред. '+e.n+' ('+e.state+')')}));

/* ========================= ШВЫ НАРУЖУ (§12) =========================== */
const SEAMS_OUT = [
  {id:'reportIssues',      q:'что предъявлялось по этому объекту или этому лицу',
    to:'карточка объекта зеркалом, классификация и взыскание — по лицу',
    keys:['объект','лицо']},
  {id:'reportObligations', q:'что за подразделением к сроку',           to:'задачи и руководитель'},
  {id:'reportTemplate',    q:'пригоден ли шаблон для обзора, какая редакция текущая', to:'анализ'}
];
const NO_SEAM_OUT = {
  reportRows:    'строк ответа шов не отдаёт: за строками ходят в выпуск, где рядом стоит его '+
                 'паспорт — число без паспорта не показывается (ИО-6)',
  reportDraft:   'черновиков шов не отдаёт: незаконченный состав, показанный как шаблон, '+
                 'читается как шаблон (ИО-1)',
  reportQuery:   'произвольного запроса отчётность не отдаёт и не имеет: у неё самой своих '+
                 'запросов к базе нет, только четыре шва (ИО-3)'
};
const CONSUMERS = [
  {module:'карточка объекта (ядро)', may:['reportIssues'], by:['объект'],
    note:'зеркало «какие бумаги уходили»'},
  {module:'классификация', may:['reportIssues'], by:['лицо'],
    note:'уклонение от подписания акта сверки — признак лица, а не договора (п. 11 п.п. 2)'},
  {module:'взыскание',     may:['reportIssues'], by:['лицо','объект'],
    note:'мера спрашивает, ушёл ли бланк; требование поручителю адресовано лицу (ADR-0166 §5)'},
  {module:'задачи',        may:['reportObligations'], note:'обязательство — основание задачи; '+
    'поручает человек (ИО-13)'},
  {module:'руководитель',  may:['reportObligations'], note:'календарь своего подразделения'},
  {module:'анализ',        may:['reportTemplate'],    note:'обзор ссылается на шаблон и на выпуск, '+
    'своего снимка не заводит (ИО-16)'},
  {module:'статистика',    may:[], why:'отчётность статистике не отдаёт ничего швом: список '+
    'шаблонов, ломающихся при выводе показателя, — экран владельца реестра, а не контракт'}
];
RP.seamsOut = () => clone(SEAMS_OUT);
RP.noSeamOut = () => clone(NO_SEAM_OUT);
RP.consumers = () => clone(CONSUMERS);
/* Шов «что предъявлялось» спрашивается двумя ключами — по объекту и по лицу.
   Ключ второй, а не шов пятый: отвечает тот же выпуск теми же полями. Классификации
   (п. 11 п.п. 2, «уклонение от подписания акта сверки») и взысканию нужен разрез
   по лицу: у одного заёмщика договоров несколько, а уклоняется он один (ADR-0167 §5). */
const issueRow = i => ({id:i.id, kind:i.kind, at:i.at, tpl:i.tplName,
  to: i.recipient ? i.recipient.name : null, toRef: i.recipient ? (i.recipient.ref || null) : null,
  toKind: i.recipient ? (i.recipient.kind || null) : null,
  role: i.recipient ? (i.recipient.role || null) : null,
  obj: i.obj, objNo: OBJ(i.obj) ? OBJ(i.obj).no : null, number:i.number});
RP.reportIssues = objId => RP.state.issues.filter(i => i.obj === objId).map(issueRow);
/* Ключ «лицо» отбирает по ВИДУ получателя, а не по совпадению ссылки: служебная
   записка ушла подразделению, и попасть в историю лица она не должна, даже если
   идентификаторы когда-нибудь окажутся похожи (ADR-0168 §4).                  */
RP.issuesToSubject = subjId => RP.state.issues
  .filter(i => i.recipient && i.recipient.kind === 'роль' && i.recipient.ref === subjId)
  .map(issueRow);
RP.reportObligations = dep => RP.obligations().filter(o => o.dept === dep)
  .map(o => ({tpl:o.tplName, period:o.period, due:o.due, state:o.state, who:o.who}));
RP.reportTemplate = tid => { const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t);
  return {id:t.id, name:t.name, forReview: t.forReview, edition: ed ? ed.n : null,
    basis: t.basis, kind: t.kind,
    note:'обзор ссылается на выпуск как на снимок основания и своего снимка не заводит (ИО-16)'}; };
RP.callSeamOut = (module, seam, arg) => {
  const c = CONSUMERS.find(x => x.module === module);
  if(!c) return {ok:false, why:'такого потребителя нет'};
  if(NO_SEAM_OUT[seam]) return {ok:false, why: NO_SEAM_OUT[seam]};
  if(!SEAMS_OUT.some(s => s.id === seam)) return {ok:false, why:'шва «'+seam+'» у отчётности нет'};
  if(c.may.indexOf(seam) === -1) return {ok:false, why: c.why ||
    ('модуль «'+module+'» шов «'+seam+'» не спрашивает')};
  if(seam === 'reportIssues'){
    const bySubj = arg && typeof arg === 'object' && arg.subject;
    const key = bySubj ? 'лицо' : 'объект';
    if((c.by || ['объект']).indexOf(key) === -1) return {ok:false,
      why:'модуль «'+module+'» спрашивает «что предъявлялось» ключом «'+key+'», а ему нужен '+
        'ключ «'+(c.by || ['объект']).join('» или «')+'»'};
    return {ok:true, key, data: bySubj ? RP.issuesToSubject(arg.subject) : RP.reportIssues(arg)};
  }
  const data = seam === 'reportObligations' ? RP.reportObligations(arg) : RP.reportTemplate(arg);
  return {ok:true, data};
};
RP.ownQuery = () => ({ok:false, why:'своего запроса к базе у отчётности нет: четыре шва — '+
  'единственный вход, и потому обойти область видимости она не может физически (ИО-3, ADR-0158 §2)'});
RP.ownFormula = () => ({ok:false, why:'своей формулы у отчётности нет: показатель берётся из '+
  'реестра статистики, поле — из публичного перечня объекта. Вторая формула той же величины '+
  'разошлась бы с первой (ИО-2, ADR-0150)'});
/* ==================== ВЁРСТКА МАКЕТА БЛАНКА (§8) ======================
   Подстановки не ведутся списком — они ЕСТЬ текст макета: список выводится
   разбором. Список рядом с текстом со временем разошёлся бы с ним, и тогда
   проверка на публикации проверяла бы не то, что напечатается.              */
function parseSubs(text){
  const out = [], re = /\{\{([^{}]+)\}\}/g;
  let m2;
  while((m2 = re.exec(String(text || '')))) out.push(m2[1].trim());
  return uniq(out);
}
RP.parseSubs = parseSubs;
RP.layoutOf = tid => { const t = TPL(tid); if(!t) return null;
  const ed = draftEd(t) || pubEd(t);
  return ed ? {n: ed.n, state: ed.state, text: ed.layoutText || '', subs: parseSubs(ed.layoutText)} : null; };

RP.setLayout = (tid, text) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(t.kind !== 'бланк') return {ok:false, why:'макет верстается у бланка: у отчёта состав — это '+
    'колонки и показатели, а не текст (§2.2)'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'текст опубликованного макета не правится: другой текст насовсем — '+
    'это новая редакция, а не правка на месте (§8). Заведите редакцию '+(pubEd(t).n + 1)};
  if(!RP.isAuth() && !RP.isClerk() && t.owner !== RP.who())
    return {ok:false, why:'макет чужого бланка не правится: черновик личный, пока автор ('+t.owner+
      ') не попросил публикации'};
  ed.layoutText = text; ed.subs = parseSubs(text);
  return {ok:true, note:'подстановок в тексте: '+ed.subs.length+' — список выведен разбором, а не введён руками'};
};
RP.newEdition = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'новую редакцию заводит уполномоченный по отчётности'};
  if(draftEd(t)) return {ok:false, why:'у шаблона уже есть черновая редакция '+draftEd(t).n+
    ': двух незаконченных составов у одного шаблона не бывает'};
  const base = pubEd(t);
  if(!base) return {ok:false, why:'копировать нечего: опубликованной редакции нет'};
  const ed = clone(base);
  ed.n = base.n + 1; ed.state = 'черновик'; ed.since = null; ed.at = RP.state.today; ed.by = RP.who();
  t.editions.push(ed);
  log('заведена редакция '+ed.n+' шаблона «'+t.name+'»');
  return {ok:true, n: ed.n, note:'редакция '+ed.n+' скопирована с '+base.n+
    '; прежняя продолжает работать, пока новая не опубликована'};
};
RP.insertToken = (tid, kind, id) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(kind === 'stat') { const m = SEAM.statMeta(id);
    return {ok:false, why:'показатель «'+(m ? m.name : id)+'» — величина о МНОЖЕСТВЕ объектов; '+
      'бланк говорит об одном, и места ей в нём нет (§2.2). Такой вопрос задаётся отчётом'}; }
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'текст опубликованного макета не правится: заведите новую редакцию (§8)'};
  return RP.setLayout(tid, (ed.layoutText || '') + '{{' + id + '}}');
};
/* ================= МАКЕТ ВЫГРУЗКИ И УРОВНИ (§3 пп. 4, 8) ===============
   Лист — часть редакции: «как было напечатано» предъявлено вместе с числами
   (ИО-18). Правится он там же, где состав, — в черновике и уполномоченным.  */
RP.sheetOf = tid => { const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t) || draftEd(t); if(!ed) return null;
  const s = sheetOfEd(ed);
  return {ed: ed.n, state: ed.state, orient: s.orient, repeatHeader: s.repeatHeader,
    footer: s.footer, bands: s.bands.slice(), formats: s.formats.slice(), widths: s.widths,
    levels: (ed.cuts || []).map(by => ({by, name: cutName(by),
      total: (ed.levelTotals || []).indexOf(by) !== -1})),
    rounding: (ed.stats || []).map(sid => ({id: sid,
      name: (SEAM.statMeta(sid) || {name: sid}).name, dp: dpOf(ed, sid)}))};
};
function draftForEdit(tid){
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'лист выгрузки правит уполномоченный по отчётности: '+
    'печатное представление предъявляется вместе с числами и потому принадлежит редакции, '+
    'а не экрану пользователя (ИО-18, §13.1)'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'редакция «'+t.name+'» опубликована: печатное представление '+
    'объявлено ею и задним числом не меняется — сданное печатается так, как было сдано. '+
    'Нужен другой лист — нужна НОВАЯ РЕДАКЦИЯ (ИО-18, ИО-2)'};
  return {ok:true, t, ed};
}
RP.setSheet = (tid, patch) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const cur = sheetOfEd(g.ed);
  if(patch.formats){
    const bad = patch.formats.filter(f => ['xlsx','csv','pdf','docx'].indexOf(f) === -1);
    if(bad.length) return {ok:false, why:'формата «'+bad[0]+'» модуль не отдаёт: xlsx · csv · pdf '+
      'для отчёта, docx (черновик) и pdf для бланка (§2.2)'};
  }
  if(patch.bands) return RP.setBands(tid, patch.bands);
  g.ed.sheet = Object.assign({}, cur, patch);
  log('лист выгрузки «'+g.t.name+'» правлен в черновике ред. '+g.ed.n);
  return {ok:true, note:'лист правлен в черновике: наружу уйдёт при публикации редакции'};
};
/* Порядок полос ОБЪЯВЛЕН, а не выведен из положения ячеек: в легаси ИТОГО
   печатается ПЕРЕД группами, потому что порядок там — побочный результат
   номеров строк макета (ОЧ-26, ОЧ-33).                                      */
RP.setBands = (tid, bands) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const miss = BANDS.filter(b => bands.indexOf(b) === -1);
  if(miss.length) return {ok:false, why:'полоса «'+miss[0]+'» из листа выброшена: полосы '+
    'переставляются, но не пропадают — лист состоит из '+BANDS.join(' · ')};
  const bad = bands.filter(b => BANDS.indexOf(b) === -1);
  if(bad.length) return {ok:false, why:'полосы «'+bad[0]+'» в листе не бывает'};
  if(bands.indexOf('итог') < bands.indexOf('уровни')) return {ok:false,
    why:'итог поставлен ПЕРЕД уровнями: так печатает легаси, и читающий видит общую сумму '+
    'раньше слагаемых, из которых она якобы сложена. Итог — последняя полоса тела листа (ОЧ-26)'};
  if(bands.indexOf('шапка') > bands.indexOf('уровни')) return {ok:false,
    why:'шапка таблицы поставлена после строк: столбцы называются до того, как их читают'};
  const cur = sheetOfEd(g.ed);
  g.ed.sheet = Object.assign({}, cur, {bands: bands.slice()});
  log('порядок полос листа «'+g.t.name+'» изменён: '+bands.join(' → '));
  return {ok:true, note:'порядок полос: '+bands.join(' → ')};
};
RP.setLevelTotals = (tid, arr) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const out = (arr || []).filter(by => (g.ed.cuts || []).indexOf(by) === -1);
  if(out.length) return {ok:false, why:'итог просят по «'+cutName(out[0])+'», а такого уровня '+
    'разреза в редакции нет: итог печатается по уровню, а не сам по себе'};
  g.ed.levelTotals = (arr || []).slice();
  log('итоги по уровням «'+g.t.name+'»: '+((arr || []).map(cutName).join(', ') || 'нет'));
  return {ok:true, note:'итог печатается по уровням: '+((arr || []).map(cutName).join(', ') || '—')+
    '; величина спрашивается швом, модуль её не складывает (ИО-17)'};
};
/* Отказы, которыми модуль отвечает на привычки легаси. */
RP.setSheetOnIssue = (id, patch) => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  return {ok:false, why:'лист выгрузки у выпуска ВП-'+i.id.replace('ВП-','')+' не правится: '+
    'печатное представление объявлено редакцией '+i.ed+' и предъявлено вместе с числами. '+
    'Иначе один и тот же сданный отчёт у двух людей печатается по-разному (ИО-18)'};
};
RP.exportIssue = (id, fmt) => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  if(i.state !== 'готов') return {ok:false, why:'выпуск ещё '+i.state+': выгружать нечего'};
  if(i.kind === 'окончательный' && fmt !== 'pdf') return {ok:false,
    why:'наружу с получателем уходит только pdf: снимок в редактируемом формате — не снимок '+
    '('+fmt+' отклонён, ИО-10)'};
  if((i.formats || []).indexOf(fmt) === -1) return {ok:false,
    why:'формата «'+fmt+'» этот шаблон не объявляет: перечень форматов — часть листа выгрузки '+
    'в редакции '+i.ed+', а не набор кнопок экрана ('+(i.formats || []).join(' · ')+')'};
  log('выпуск '+i.id+' выгружен в '+fmt);
  return {ok:true, note:'файл '+fmt+' отдан; лист — '+i.passport.sheet.orient+', полосы: '+
    i.passport.sheet.bands.join(' → ')};
};
/* ========== ВЫГРУЗКА ПОКАЗАННОГО — ЭТО ВЫПУСК (ОЧ-49, §14.4) ==========
   «Выгрузить в Excel» выглядит безобидной кнопкой, а по канону выпуском
   становится ровно то, что вышло за пределы экрана. Поэтому выгрузка показа —
   ПРЕДВАРИТЕЛЬНЫЙ ВЫПУСК со строкой в журнале и паспортом; иначе Excel снова
   станет дырой, через которую числа уходят без даты, автора и состава.
   Для человека это по-прежнему одна кнопка: заказ он не заказывает.         */
RP.exportShown = (tid, params, twist, fmt) => {
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const i = ISS(res.id);
  const f = fmt || (i.formats || []).filter(x => x !== 'pdf')[0] || (i.formats || [])[0];
  const ex = RP.exportIssue(res.id, f);
  if(!ex.ok) return ex;
  return {ok:true, id: res.id, fmt: f, note:'выгрузка — это выпуск '+res.id+
    ' (предварительный): строка в журнале, паспорт и показанный состав целиком. Файл живёт '+
    dayWord(FILE_DAYS)+' и гаснет, строка остаётся (ИО-11, ОЧ-49)'};
};
/* Рабочий список тоже идёт через предварительный выпуск: список по определению
   ЗАМОРОЖЕННЫЙ состав, а морозить нечего, пока у ответа нет паспорта (ИО-14). */
RP.worklistShown = (tid, params, twist, name) => {
  if(!String(name || '').trim()) return {ok:false, why:'список называется при создании: '+
    'безымянный список нельзя передать и нельзя спросить «чем кончилось» (ИО-14)'};
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const wl = RP.makeWorklist(res.id, String(name).trim());
  if(!wl.ok) return wl;
  return {ok:true, id: wl.id, issue: res.id, note:'список '+wl.id+' отобран выпуском '+res.id+
    ': состав заморожен паспортом, а не кнопкой. '+wl.note};
};

/* Легаси даёт «На дату» КАЖДОЙ ячейке: один лист может смешать остаток на
   01.07 со ставкой на 01.08, и ответ перестаёт быть ответом на одну дату.   */
RP.setColumnDate = (tid, fid, date) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const list = SEAM.fieldList((pubEd(t) || draftEd(t)).object);
  const f = list.fields.find(x => x.id === fid);
  return {ok:false, why:'дата состояния у ответа ОДНА: «'+(f ? f.name : fid)+'» нельзя взять '+
    'на '+fmt(date)+', пока остальные столбцы стоят на другой дате — иначе лист перестаёт быть '+
    'ответом на один вопрос, а паспорт перестаёт быть проверяемым (ИО-19). Нужна вторая дата — '+
    'это сравнение двух состояний, отдельный вопрос (§19 п. 6)'};
};
/* Итог по уровню НЕ складывается модулем. Доказательство — числами.
   Волна 13: сторож остаётся, но довод у него теперь другой. Раньше он звучал
   «нам нельзя складывать»; теперь — «складывать НЕЧЕГО»: statSlice отдаёт
   дерево, и число уровня в нём уже посчитано статистикой по строкам уровня
   (ИС-24, ADR-0176 §6). Сторож показывает, во что обошлась бы самодеятельность,
   если бы модуль всё-таки сложил детей вместо того, чтобы прочитать узел.   */
RP.foldLevelsSelf = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const ed = pubEd(t) || draftEd(t);
  const sid = (ed.stats || [])[0];
  if(!sid) return {ok:false, why:'показателей у редакции нет — складывать нечего'};
  const v = RP.viewer();
  const cut = {dept:null, ids:null};
  const asOf = ed.mode === 'на дату' ? RP.state.sel.params.asOf : null;
  const tree = SEAM.statSlice(sid, 'dept', cut, asOf, v.scope.slice());
  const sum = tree.groups.reduce((a, g) => a + (g.value || 0), 0);
  const meta = SEAM.statMeta(sid);
  /* Округлять доказательство нельзя: разница видна как раз в десятых.       */
  const exact = v => v == null ? '—' : String(Math.round(v * 10) / 10).replace('.', ',');
  return {ok:false, sum, real: tree.value, stat: meta ? meta.name : sid,
    unit: meta ? meta.unit : '', parts: tree.groups.length,
    why:'модуль не складывает уровни сам: «'+(meta ? meta.name : sid)+'» по '+
      tree.groups.length+' подразделениям в сумме даёт '+exact(sum)+' '+(meta ? meta.unit : '')+
      ', а корень того же дерева равен '+exact(tree.value)+' '+(meta ? meta.unit : '')+
      '. Доля и средняя не аддитивны — число уровня приходит узлом дерева, ' +
      'посчитанным статистикой по строкам уровня (ИО-17, ИС-24)'};
};
/* Легаси хранит отбор внутри «шаблона» списком объектов — состав и правило
   слиты, и «почему объект здесь» ответить нечем (ОЧ-28).                    */
RP.ruleAsWorklist = (name, rule) => ({ok:false, why:'правило отбора «'+(rule || 'остаток > 100 млн')+
  '» — не рабочий список: список это ЗАМОРОЖЕННЫЙ СОСТАВ, отобранный выпуском в момент времени, '+
  'и он отвечает «чем кончилось» по каждому объекту (ИО-14). Правило же живёт параметром '+
  'редакции и каждый раз даёт новый состав. Слить их — потерять и то и другое (§9)'});

RP.docxNote = () => ({ok:false, why:'docx — формат черновика: наружу с получателем уходит только '+
  'pdf (ИО-10). Другой текст насовсем делается правкой макета и новой редакцией, а не правкой '+
  'выпущенного файла (§8)'});

/* ===================== РАБОЧИЕ СПИСКИ (§9, ИО-14) =====================
   Список отбирается ВЫПУСКОМ, называется и замораживается. Чисел не хранит —
   только объекты; их величины всегда текущие и берутся швом заново.          */
RP.makeWorklist = (issueId, name) => {
  const i = ISS(issueId); if(!i) return {ok:false, why:'выпуска нет'};
  if(i.kindTpl !== 'отчёт') return {ok:false, why:'список отбирается отчётом о множестве объектов: '+
    'бланк говорит об одном, отбирать из него нечего'};
  if(!name) return {ok:false, why:'список называется при создании: безымянный список нельзя передать '+
    'и нельзя спросить «чем кончилось»'};
  const rows = i.snapshot && i.snapshot.rows ? i.snapshot.rows
    : compose(TPL(i.tpl), TPL(i.tpl).editions.find(e => e.n === i.ed), i.params, RP.viewer()).rows;
  if(!rows.length) return {ok:false, why:'в выпуске нет строк: замораживать нечего'};
  const id = 'РС-' + (++RP.state.wseq);
  RP.state.worklists.push({id, name, from: i.id, fromName: i.tplName,
    at: RP.state.today, by: RP.who(), dept: null, state:'открыт', closed:null, why:null,
    objects: rows.map(r => r.id)});
  log('рабочий список «'+name+'» отобран выпуском '+i.id+', объектов: '+rows.length);
  return {ok:true, id, note:'состав заморожен: '+objWord(rows.length)+
    '; чисел список не хранит — величины всегда текущие'};
};
RP.worklistRows = id => {
  const w = WL(id); if(!w) return null;
  const v = RP.viewer();
  const src = SEAM.objectRows('credit', {ids: w.objects.slice()}, v.scope.slice());
  const seen = {}; src.rows.forEach(r => { seen[r.id] = r; });
  return {
    rows: w.objects.map(oid => seen[oid] || null),
    hidden: w.objects.length - src.rows.length,
    gone: src.rows.filter(r => r.closed).length
  };
};
RP.handWorklist = (id, dept) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, но не передаётся: '+
    'работа по нему окончена ('+fmt(w.closed)+')'};
  w.dept = dept;
  log('список «'+w.name+'» передан подразделению «'+deptName(dept)+'»');
  return {ok:true, note:'список видят все, кто в круге подразделения; поручений он не несёт (ИО-13)'};
};
RP.addToWorklist = (id, objId) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, не пополняется'};
  return {ok:false, why:'состав рабочего списка заморожен: он отобран выпуском '+w.from+
    ' и после названия не пополняется — иначе «обзвонили всех» перестаёт быть проверяемым (ИО-14). '+
    'Нужен другой состав — отберите новым выпуском'};
};
RP.closeWorklist = (id, why) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'список уже закрыт '+fmt(w.closed)};
  w.state = 'закрыт'; w.closed = RP.state.today; w.why = why || 'работа окончена';
  log('список «'+w.name+'» закрыт: '+w.why);
  return {ok:true, note:'закрытый список читается, но не пополняется; строки остаются на месте'};
};
RP.doRuleList = () => act(RP.ruleAsWorklist('крупные кредиты', 'остаток > 100 млн'));
RP.deleteWorklist = id => ({ok:false, why:'рабочий список не стирается — он кончается ЗАКРЫТИЕМ: '+
  'стёртый список отвечает неправдой на вопрос «кого обзванивали» (ИО-14, §9)'});
RP.worklistTask = id => ({ok:false, why:'рабочий список никому ничего не поручает: у поручения '+
  'должен быть автор, отвечающий за нагрузку (ИО-13, ADR-0160)'});
const WL = id => RP.state.worklists.find(w => w.id === id);
RP.WL = WL;
RP.visibleWorklists = () => {
  const v = RP.viewer();
  return RP.state.worklists.filter(w => w.by === RP.who() ||
    (w.dept && v.scope.indexOf(w.dept) !== -1));
};
/* Список — законный параметр отбора следующего выпуска. Пятого шва он не
   потребовал: перечень объектов уходит в РАЗРЕЗ и спрашивается тем же швом. */
RP.issueByWorklist = (tid, wlId, spec) => {
  const w = WL(wlId); if(!w) return {ok:false, why:'списка нет'};
  const sp = clone(spec || {});
  sp.params = sp.params || {};
  sp.params.ids = w.objects.slice(); sp.params.worklist = w.id;
  return RP.issue(tid, sp);
};
/* Демонстрация выбытия: ядро закрыло кредит уже ПОСЛЕ заморозки состава.    */
RP.demoCloseObject = objId => {
  const o = OBJ(objId); if(!o) return {ok:false, why:'объекта нет'};
  o.closed = RP.state.today; o.status = 'закрыт'; o.debt_main = 0; o.days = 0;
  log('ядро закрыло кредит '+o.no);
  return {ok:true, note:'в рабочих списках он останется строкой «закрыт '+fmt(RP.state.today)+
    '» — выбывший показан выбывшим, а не исчезает (§9)'};
};

/* ========================= ДАШБОРДЫ (§10) ============================
   Плитка — способ показать ОБЪЯВЛЕННЫЙ отчёт; своего состава у неё нет.
   Раскладка объявлена на роль, поверх живёт личная перекладка с возвратом.  */
const DASH_ROLE = {
  auth:  [{tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:''}},
          {tpl:'t-portfolio', params:{dept:''}}],
  head:  [{tpl:'t-portfolio', params:{dept:'dep-admin'}},
          {tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:'dep-admin'}}],
  user:  [{tpl:'t-portfolio', params:{dept:'dep-prom'}}],
  clerk: [],
  buh:   [{tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:''}}]
};
RP.declaredTiles = () => clone(DASH_ROLE[RP.viewer().id] || []);
RP.dashTiles = () => { const p = RP.state.dash.personal[RP.viewer().id];
  return p ? clone(p) : RP.declaredTiles(); };
RP.dashPersonal = () => !!RP.state.dash.personal[RP.viewer().id];
function personalTiles(){ const id = RP.viewer().id;
  if(!RP.state.dash.personal[id]) RP.state.dash.personal[id] = RP.declaredTiles();
  return RP.state.dash.personal[id]; }
RP.addTile = (tid, params) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.maySee(tid)) return {ok:false, why:'этого шаблона вам не видно: личная раскладка — не '+
    'личный отчёт, добавить можно только доступное (§10)'};
  if(!pubEd(t)) return {ok:false, why:'на дашборд ставится ОБЪЯВЛЕННЫЙ отчёт: «'+t.name+'» — '+
    'личный черновик, плитки из него не бывает (ИО-1, §10)'};
  if(t.kind !== 'отчёт') return {ok:false, why:'плитка показывает отчёт о множестве объектов: '+
    'бланк говорит об одном и на дашборде ничего не сообщает'};
  personalTiles().push({tpl:tid, params: clone(params || {})});
  return {ok:true, note:'плитка добавлена в личную раскладку; объявленная на роль не тронута'};
};
RP.removeTile = i => { const p = personalTiles();
  if(i < 0 || i >= p.length) return {ok:false, why:'плитки нет'};
  const t = p.splice(i, 1)[0];
  return {ok:true, note:'плитка «'+TPL(t.tpl).name+'» убрана из личной раскладки'}; };
RP.resetDash = () => { const id = RP.viewer().id;
  if(!RP.state.dash.personal[id]) return {ok:false, why:'личной перекладки нет: раскладка и так '+
    'та, что объявлена на роль'};
  delete RP.state.dash.personal[id];
  return {ok:true, note:'вернулась раскладка, объявленная на роль — первый день не начинается '+
    'с пустого экрана (§10)'}; };
RP.addExternalTile = url => ({ok:false, why:'внешние источники на дашборде запрещены: плитка '+
  'своего состава не имеет — она показывает объявленный отчёт, и клик раскрывает его целиком (§10)'});
RP.dashPassport = () => ({ok:false, why:'общего паспорта у дашборда нет и быть не может: рядом '+
  'стоят плитки «на дату» и «сейчас», и один паспорт сверху создавал бы вид единой даты, '+
  'которого нет (ИО-15, §10)'});
RP.tileData = tile => {
  const t = TPL(tile.tpl); if(!t) return null;
  const ed = pubEd(t); if(!ed) return null;
  const br = brokenBy(t, ed);
  if(br) return {broken: br, name: t.name};
  const d = compose(t, ed, tile.params, RP.viewer());
  return {name: t.name, tpl: t.id, totals: d.totals, rows: d.rows.length,
    passport: d.passport, soft: d.soft};
};

/* ============================== ЭКРАНЫ =============================== */
const pill = (t, c) => '<span class="pill'+(c?' '+c:'')+'">'+esc(t)+'</span>';
const kv = rows => '<div class="kv">'+rows.map(r =>
  '<div class="k">'+esc(r[0])+'</div><div class="v">'+(r[2] ? r[1] : esc(r[1]))+'</div>').join('')+'</div>';
const stateCls = s => s === 'опубликован' ? 'ok' : s === 'неисполним' ? 'err' : 'neutral';
const oblCls = s => s === 'сдано' ? 'ok' : s === 'сдано с опозданием' ? 'warn'
  : s === 'просрочено' ? 'err' : 'info';

function passportBox(p, frozen){
  const rows = [];
  rows.push(['режим', p.mode]);
  if(p.mode === 'на дату') rows.push(['состояние на', fmt(p.asOf)]);
  rows.push(['редакция шаблона', 'ред. '+p.edition]);
  rows.push(['область видимости', p.scope.join(', ')]);
  if(p.hidden) rows.push(['скрыто видимостью', objWord(p.hidden)+' — охват ответа неполный']);
  if(p.levels && p.levels.length) rows.push(['уровни разрезов', p.levels.join('; ')]);
  if(p.rounding && p.rounding.length) rows.push(['разрядность', p.rounding.join('; ')]);
  if(p.sheet) rows.push(['лист выгрузки', p.sheet.orient+'; полосы: '+p.sheet.bands.join(' → ')+
    '; форматы: '+p.sheet.formats.join(' · ')]);
  rows.push(['спрошенные швы', p.seams && p.seams.length ? p.seams.join(', ')
    : (p.ordered ? 'ещё ни одного — заказ принят, числа не спрошены' : 'objectRows')]);
  rows.push(['числа', frozen ? 'заморожены снимком' : 'живые, пересчитываются при каждом показе']);
  return '<div class="snap'+(frozen?'':' prelim')+'">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
}

/* Шапка ПОКАЗА: то же обещание, что у паспорта, распространённое на экран —
   скриншот уходит в переписку и обязан отвечать за себя сам (ADR-0162 §5). */
function showBox(head){
  if(!head) return '';
  const rows = [['показ', 'НЕ ВЫПУСК — '+head.note]];
  rows.push(['отчёт', head.template+' · ред. '+head.edition+
    (head.editionState === 'черновик' ? ' (черновик: личный состав)' : '')]);
  rows.push(['режим', head.mode]);
  if(head.asOf) rows.push(['состояние на', fmt(head.asOf)]);
  rows.push(['область видимости', head.scope.join(', ')]);
  rows.push(['смотрит', head.who]);
  if(head.composition) rows.push(['показанный состав',
    'разрезы: '+(head.composition.cuts.join(' → ') || 'нет')+
    '; показатели: '+(head.composition.stats.join('; ') || 'нет')+
    '; строки объектов: '+(head.composition.drill ? 'печатаются' : 'не печатаются — спрошены '+
      'только итоги разрезов')+'; раскладка: '+head.composition.layout]);
  rows.push(['состав', head.deviated
    ? 'НАКРУЧЕН на экране в границах, объявленных редакцией (ИО-20)'
    : 'по умолчанию, как объявила редакция']);
  if(head.view) rows.push(['вид', head.view+' — личный: передают не его, а выпуск']);
  let h = '<div class="snap prelim">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
  if(head.dropped && head.dropped.length) h += '<div class="banner warn"><b>Вид сверен с '+
    'редакцией.</b> '+head.dropped.map(esc).join('; ')+'. Отвалившееся названо, остальное '+
    'работает — молчаливой подмены не бывает (ADR-0162 §4).</div>';
  return h;
}

/* ===================== ВИТРИНА «ОТЧЁТНОСТЬ» (§14.1) ===================
   Стол ПОТРЕБИТЕЛЯ. Перечисляет то же, что реестр шаблонов, — и потому
   соблазн обойтись одним списком был силён (ОЧ-41). Не обошлись: реестр
   ОБЯЗАН показывать то, что витрине показывать вредно — «неисполним»,
   «личный черновик Осмоновой», «публикации не просили». Это кухня объявления
   состава, и потребителю она мешает.

   Группировка — по ОБЯЗАТЕЛЬНОСТИ, а не по объекту: на данных каталога
   объектная разбивка разваливается (кредит 13 форм, остальные четырнадцать
   объектов по одной — оглавление, где половина пунктов сама себе раздел,
   ОЧ-42). Объект не выброшен, а стал чипом.                                */
/* Основание отдаётся разобранным: пункт и документ живут в разных местах
   строки, а склеенная строка нужна тем, кто печатает основание целиком.   */
const basisOf = b => b && ({
  point: b.point ? 'п. '+b.point+(b.sub ? ' '+b.sub : '') : null, doc: b.doc,
  text: (b.point ? 'п. '+b.point+(b.sub ? ' '+b.sub : '')+' ' : '')+b.doc });
RP.showcase = () => {
  const v = RP.viewer(), obl = RP.obligations(), rows = [];
  RP.state.templates.forEach(t => {
    const ed = pubEd(t);
    if(!ed) return;                    /* черновик — кухня реестра, не витрина (ИО-1) */
    const f = t.form ? FORM(t.form) : null;
    const st = RP.tplState(t.id);
    const inCircle = t.circle.indexOf(v.dept) !== -1 || v.scope.length === ALL_DEPTS.length;
    const mine = obl.filter(o => o.tpl === t.id &&
      (t.circle.indexOf(v.dept) !== -1 ? o.dept === v.dept : true));
    const cur = mine.length ? mine[mine.length - 1] : null;
    const fin = RP.state.issues.filter(i => i.tpl === t.id && i.kind === 'окончательный' &&
      i.recipient).slice(-1)[0] || null;
    rows.push({
      kind:'шаблон', id: t.id, form: t.form || null, name: t.name, tplKind: t.kind,
      object: SEAM.fieldList(ed.object).name,
      basis: basisOf(t.basis), to: f ? f.to : null,
      obligatory: !!(f && f.obligatory), state: st.state, why: st.why,
      schedule: t.schedule ? t.schedule.text : null,
      obligation: cur ? {period: cur.period, due: cur.due, state: cur.state, who: cur.who} : null,
      lastFinal: fin ? {id: fin.id, at: fin.at, to: fin.recipient.name, number: fin.number} : null,
      submits: RP.whoSubmits(t.id),
      access: inCircle ? {ok:true} : {ok:false,
        why:'шаблон не в круге подразделения «'+deptName(v.dept)+'»: круг ведёт уполномоченный',
        who: t.circle.map(deptName).join('; ')}
    });
  });
  /* Незаведённые ОБЯЗАТЕЛЬНЫЕ формы — строкой без кнопки. Круга у них нет,
     потому что нет шаблона, а основание публично: оно в норме (§13.7).      */
  RP.formGaps().forEach(g => rows.push({
    kind:'норма', id: g.id, form: g.id, name: g.name, tplKind: g.kind, object: g.object,
    basis: basisOf(g.basis),
    obligatory:true, state:'шаблон не заведён', why: g.why, schedule:null,
    obligation:null, lastFinal:null, submits:null, nowhere: g.nowhere, to: g.to,
    access:{ok:true}, goTo: g.who
  }));
  const key = r => r.obligation && r.obligation.due ? r.obligation.due : '9999-99-99';
  const grp = ob => rows.filter(r => r.obligatory === ob)
    .sort((a, b) => (a.access.ok === b.access.ok ? 0 : (a.access.ok ? -1 : 1)) ||
                    key(a).localeCompare(key(b)) || a.name.localeCompare(b.name));
  return {must: grp(true), rest: grp(false)};
};
RP.scSet = (k, val) => { RP.state.sel[k] = val; render(); };
RP.openForm = tid => { const t = TPL(tid);
  if(!t) return act({ok:false, why:'шаблона нет'});
  if(t.kind === 'бланк') return RP.whereBlank(tid);
  RP.state.sel.tpl = tid; RP.state.sel.twist = null; RP.state.sel.view = null;
  RP.state.sel.dropped = null; RP.state.sel.live = false;
  RP.state.view = 'issue'; render(); };
/* Бланк в витрине — тупик: у него нет ни фильтров, ни параметров, есть один
   вопрос «о ком». На трёх тестовых записях выпадашка работает, на живых
   двенадцати тысячах — нет (ОЧ-43). Потому кнопка ведёт не на формирование,
   а на «где печатается»: перечень объектов держит сосед, а не отчётность.  */
RP.whereBlank = tid => { const t = TPL(tid); if(!t) return act({ok:false, why:'шаблона нет'});
  return act({ok:true, note:'«'+t.name+'» печатается из КАРТОЧКИ объекта или из рабочего '+
    'списка — там объект уже назван. Своего перечня объектов витрина не держит: сосед '+
    'спрашивает отчётность швом «какие бланки применимы к объекту этого вида и видны '+
    'смотрящему», а не наоборот (§16, ОЧ-43)'}); };
RP.openViewOf = vid => { const vw = RP.state.views.find(x => x.id === vid);
  if(!vw) return act({ok:false, why:'вида нет'});
  RP.state.sel.live = false; RP.state.view = 'issue';
  RP.useView(vid); };                /* один прогон: вид применяется на входе (ОЧ-48) */

function oblPill(o){
  if(!o) return '<span class="muted small">по требованию</span>';
  const cls = o.state === 'просрочено' ? 'err' : (o.state === 'ожидается' ? 'warn' :
    (o.state === 'сдано с опозданием' ? 'warn' : 'ok'));
  return pill(o.state, cls)+'<div class="small">'+esc(o.period)+' · срок '+fmt(o.due)+'</div>';
}
/* Редакция Порядка одна на все строки витрины — повторённая одиннадцать раз, она
   шум; её место в карточке формы, где решают, по какой редакции выпускать.    */
const docShort = d => String(d).replace(/\s*\(ред\.[^)]*\)/, '');
/* Первичное деление витрины — ВИД ФОРМЫ, а не обязательность: у отчёта и бланка
   разные глаголы (отчёт смотрят, бланк печатают адресату), и деление по
   обязательности на живом каталоге вырождается — обязательных 12 из 41, всё
   прочее валится в одну кучу. Вид формы режет и на затравке, и на бою (ОЧ-75). */
function scShowcase(){
  const sel = RP.state.sel, sc = RP.showcase();
  const all = sc.must.concat(sc.rest), mine = RP.myViews(null);

  /* Вкладка по умолчанию — свои виды, если они есть, иначе отчёты. Не «последняя
     открытая» и не «та, где горит»: вкладка решает, ЧТО показано, но не то, КАК
     оно посчитано, и витрина должна открываться у двоих одинаково (ОЧ-48).    */
  const tab = sel.scTab || (mine.length ? 'виды' : 'отчёт');
  const cnt  = k => all.filter(r => r.tplKind === k).length;
  const burn = k => all.filter(r => r.tplKind === k && r.obligation &&
    r.obligation.state === 'просрочено').length;

  /* Счётчик на корешке несёт срочность, чтобы не открывать вкладку ради проверки. */
  let h = '<div class="tabs">'+
    [['виды', 'Мои виды', mine.length, 0],
     ['отчёт', 'Отчёты', cnt('отчёт'), burn('отчёт')],
     ['бланк', 'Бланки', cnt('бланк'), burn('бланк')]]
    .map(t => '<button class="'+(tab === t[0] ? 'on' : '')+'" onclick="RP.scSet(\'scTab\',\''+
      t[0]+'\')">'+esc(t[1])+'<span class="n">'+t[2]+'</span>'+
      (t[3] ? '<span class="burn">'+t[3]+'</span>' : '')+'</button>').join('')+'</div>';

  if(tab === 'виды'){
    return h + (mine.length
      ? '<div class="tblwrap"><table class="cgrid">'+
        '<colgroup><col style="width:40%"><col style="width:33%"><col style="width:13%">'+
        '<col style="width:14%"></colgroup>'+
        '<thead><tr><th>Вид</th><th>Форма</th><th>Сохранён</th><th></th></tr></thead><tbody>'+
        mine.map(vw => '<tr><td><div class="fname">'+esc(vw.name)+'</div>'+
          '<div class="fmeta"><span class="code">'+esc(vw.id)+'</span></div></td>'+
          '<td class="small">'+esc(TPL(vw.tpl) ? TPL(vw.tpl).name : vw.tpl)+'</td>'+
          '<td class="small">'+fmt(vw.at)+'</td>'+
          '<td class="act"><button class="btn btn-secondary btn-sm" onclick="RP.openViewOf(\''+
          vw.id+'\')">Открыть видом</button></td></tr>').join('')+'</tbody></table></div>'
      /* Пустой экран говорит, чем он заполняется, и называет кнопку, а не себя. */
      : '<div class="banner ok">Сохранённых видов нет. Вид заводится на показе '+
        'кнопкой «Сохранить вид».</div>');
  }

  /* Отбор считается по строкам ОТКРЫТОЙ вкладки: объекты у отчётов и бланков
     разные, и общий список чипов половину времени вёл бы в пустоту.          */
  const kin = all.filter(r => r.tplKind === tab);
  const q = String(sel.scQ || '').trim().toLowerCase();
  const objs = uniq(kin.map(r => r.object)).sort();
  const obj = objs.indexOf(sel.scObj) === -1 ? '' : sel.scObj;
  const pass = r => (!q || r.name.toLowerCase().indexOf(q) !== -1) &&
    (!obj || r.object === obj);

  h += '<div class="form-row"><div class="fld"><label>Поиск по названию</label>'+
    '<input class="wide" value="'+esc(sel.scQ || '')+'" onchange="RP.scSet(\'scQ\', this.value)" '+
    'placeholder="просрочка, претензия, акт…"></div>'+
    /* Чипы объекта появляются, только когда есть из чего выбирать: единственный
       объект — не отбор, а мёртвый переключатель, занимающий строку. */
    (objs.length > 1
      ? '<div class="fld"><label>Объект</label><div class="btn-row" style="margin:0">'+
        [''].concat(objs).map(o => '<button class="btn btn-sm '+
          (obj === o ? 'btn-primary' : 'btn-secondary')+'" onclick="RP.scSet(\'scObj\',\''+
          esc(o)+'\')">'+esc(o || 'все')+'</button>').join('')+'</div></div>'
      : '')+'</div>';

  /* Обязательность делит строки ВНУТРИ одной таблицы, а не двумя таблицами:
     столбцы и действия у групп одни и те же, и вторая шапка ради одной-двух
     строк ничего не объясняет. Пустой группы не бывает вовсе — её нет в
     разметке, а не «0 строк» карточкой с выдуманной причиной.               */
  /* В строке оставлено то, что РАЗЛИЧАЕТ формы. Объект показан, только когда во
     вкладке их несколько; адресат — на бланках, потому что бланк тем и определён,
     кому он уходит. Вид формы из строки убран: он теперь корешок вкладки.      */
  const many = uniq(kin.map(r => r.object)).length > 1;
  /* Документ основания печатается в строке, только если он НЕ тот, что у
     большинства форм вкладки: одиннадцать одинаковых «Порядок №41» — фон, а не
     сведения. Преобладающий назван один раз, в шапке столбца; при равенстве
     документов преобладающего нет, и каждая строка называет свой.            */
  const docs = kin.filter(r => r.basis).map(r => docShort(r.basis.doc));
  const dcnt = d => docs.filter(x => x === d).length;
  const top = docs.length ? uniq(docs).sort((a, b) => dcnt(b) - dcnt(a))[0] : null;
  const prevail = top && dcnt(top) * 2 > kin.length ? top : null;
  const row = r => {
      const gap = r.kind === 'норма';
      const late = !!(r.obligation && r.obligation.state === 'просрочено');
      return '<tr'+(gap ? ' class="out gap"'
                  : (!r.access.ok ? ' class="out"' : (late ? ' class="late"' : '')))+'>'+
        '<td><div class="fname">'+esc(r.name)+'</div>'+
          '<div class="fmeta"><span class="code">'+esc(r.form || r.id)+'</span>'+
          (many ? '<span class="tag">'+esc(r.object)+'</span>' : '')+
          (tab === 'бланк' && r.to ? '<span class="to">→ '+esc(r.to)+'</span>' : '')+'</div>'+
          (gap
            ? '<div class="why">шаблон не заведён · Завести — '+esc(r.goTo)+'</div>'
            : (r.access.ok ? '' : '<div class="why">не в круге. Доступ у: '+
                esc(r.access.who)+'</div>'))+'</td>'+
        '<td>'+(r.basis
          ? (r.basis.point ? '<div class="pt">'+esc(r.basis.point)+'</div>' : '')+
            (docShort(r.basis.doc) === prevail ? ''
              : '<div class="small">'+esc(docShort(r.basis.doc))+'</div>')
          : '<span class="muted small">не названо</span>')+'</td>'+
        '<td class="small">'+(gap
          ? '<span class="muted">срока нет</span>'
          : oblPill(r.obligation)+(r.obligation && r.obligation.who
              ? '<div class="muted">сдаёт: '+esc(r.obligation.who)+'</div>' : ''))+'</td>'+
        '<td class="small">'+(r.lastFinal
          ? '<b>'+esc(r.lastFinal.id)+'</b> · '+fmt(r.lastFinal.at)+'<div class="muted">'+
            esc(r.lastFinal.to)+(r.lastFinal.number ? ' · '+esc(r.lastFinal.number) : '')+'</div>'
          : '<span class="dash">—</span>')+'</td>'+
        '<td class="act">'+(gap || !r.access.ok ? '<span class="dash">—</span>'
            : '<button class="btn '+(r.tplKind === 'бланк' ? 'btn-secondary' : 'btn-primary')+
              ' btn-sm" onclick="RP.openForm(\''+r.id+'\')">'+
              (r.tplKind === 'бланк' ? 'Где печатается' : 'Открыть')+'</button>')+
        '</td></tr>';
  };

  const secs = [['Обязательные', sc.must], ['По запросу', sc.rest]]
    .map(s => { const inTab = s[1].filter(r => r.tplKind === tab);
      return {title: s[0], inTab: inTab, shown: inTab.filter(pass)}; })
    .filter(s => s.inTab.length);
  if(!secs.length) return h+'<div class="banner ok">Форм этого вида вам не предъявлено.</div>';
  /* Отбор, не пропустивший ничего, говорит это ОДИН раз, а не по разу на группу. */
  if(!secs.some(s => s.shown.length))
    return h+'<div class="banner warn">Под отбор не попало ничего.</div>';

  /* Доли столбцов заданы явно: без них «Форма» ломалась в три строки, а справа
     от «Последнего выпуска» пустовала треть ширины. */
  h += '<div class="tblwrap"><table class="cgrid">'+
    '<colgroup><col style="width:35%"><col style="width:12%"><col style="width:20%">'+
    '<col style="width:21%"><col style="width:12%"></colgroup>'+
    '<thead><tr><th>Форма</th><th>Основание'+
    (prevail ? '<span class="th-sub">'+esc(prevail)+'</span>' : '')+
    '</th><th>Срок и обязательство</th>'+
    '<th>Последний окончательный выпуск</th><th></th></tr></thead><tbody>';
  secs.forEach(s => {
    h += '<tr class="sect"><td colspan="5">'+esc(s.title)+
      ' <span class="n">· '+s.shown.length+
      (s.shown.length === s.inTab.length ? '' : ' из '+s.inTab.length)+'</span></td></tr>';
    h += s.shown.map(row).join('');    /* «0 из 12» сказано самим разделителем */
  });
  return h+'</tbody></table></div>';
}

/* ------------------------------ РЕЕСТР ------------------------------- */
function scRegistry(){
  const v = RP.viewer(), vis = RP.visibleTemplates();
  const hiddenDrafts = RP.state.templates.filter(t => vis.indexOf(t.id) === -1);
  let h = '<table class="cgrid"><thead><tr><th>Шаблон</th><th>Вид</th><th>Состояние</th>'+
    '<th>Ред.</th><th>Основание</th><th>Круг</th><th>Расписание</th><th></th></tr></thead><tbody>';
  vis.forEach(tid => {
    const t = TPL(tid), st = RP.tplState(tid);
    h += '<tr'+(st.state === 'неисполним' ? ' class="out"' : '')+'>'+
      '<td><b>'+esc(t.name)+'</b><div class="small mono">'+esc(t.id)+'</div>'+
        (st.why ? '<div class="why">'+esc(st.why)+'</div>' : '')+'</td>'+
      '<td><span class="tmpl-kind">'+esc(t.kind)+'</span>'+
        (t.series ? '<div class="small mono">'+esc(t.series.prefix)+
          (t.series.manual ? ' · ручная' : ' · сквозная')+'</div>' : '')+'</td>'+
      '<td>'+pill(st.state, stateCls(st.state))+'</td>'+
      '<td>'+(RP.pubEd(tid) ? 'ред. '+RP.pubEd(tid).n : '—')+'</td>'+
      '<td class="small">'+(t.basis ? esc((t.basis.point ? 'п. '+t.basis.point+' ' : '')+t.basis.doc)
        : '<span class="muted">не названо</span>')+'</td>'+
      '<td class="small">'+esc(t.circle.map(deptName).join('; '))+'</td>'+
      '<td class="small">'+(t.schedule ? esc(t.schedule.text) : '<span class="muted">по требованию</span>')+'</td>'+
      '<td><div class="btn-row" style="margin:0">'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.openBuilder(\''+t.id+'\')">Состав</button>'+
        (st.state === 'опубликован'
          ? '<button class="btn btn-primary btn-sm" onclick="RP.openIssue(\''+t.id+'\')">Выпустить</button>' : '')+
      '</div></td></tr>';
  });
  h += '</tbody></table>';

  h += '<div class="card" style="margin-top:14px"><h3>Не видно этой роли</h3>'+
    '<div class="small">Роль «'+esc(v.title)+'», область видимости: '+
      esc(v.scope.map(deptName).join('; '))+'.</div>'+
    (hiddenDrafts.length
      ? '<div class="facts">'+hiddenDrafts.map(t => '<div class="f no">'+esc(t.name)+' — личный '+
          'черновик '+esc(t.owner)+(t.asked ? ', передан на публикацию (виден уполномоченному)'
            : ', публикации не просили: не видит никто, кроме автора')+'</div>').join('')+'</div>'
      : '<div class="facts"><div class="f yes"><em>всё, что есть в системе, вам видно</em></div></div>')+
    '</div>';

  const broken = RP.brokenTemplates();
  if(broken.length) h += '<div class="banner danger"><b>Неисполнимые шаблоны: '+broken.length+'.</b> '+
    broken.map(b => esc(b.name)+' — '+esc(b.why)).join('<br>')+'</div>';

  h += '<div class="card"><h3>Правка у соседей</h3><div class="btn-row">'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoRename()">Ядро переименовало «Дней просрочки» → days_overdue</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoWithdraw()">Статистика выводит «Сумма просроченной задолженности»</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.reset()">Вернуть исходное состояние</button>'+
    '</div></div>';
  return h;
}
