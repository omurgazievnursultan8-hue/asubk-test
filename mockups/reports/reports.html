<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчётность · АСУБК</title>
<!--
  Рабочий прототип (single-file) — модуль «Отчётность» (TO-BE). Логика исполняется.
  Канон логики — ASUBK-otchetnost-logika.md; журнал волн — ASUBK-status-razrabotki.md.
  Смоук: node scripts/inspect/reports-check.mjs
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-green-hover:#106A36; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:290px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:14px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-sec:first-child{ padding-top:2px; }
.nav-sec small{ display:block; margin-top:3px; text-transform:none; letter-spacing:0;
  font:var(--weight-regular) 11px/1.4 var(--asubk-font); color:var(--text-placeholder); }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.nav-item.locked{ color:var(--text-placeholder); }
.sidebar-foot{ padding:12px 16px; border-top:1px solid var(--border-default);
  font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-muted); }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; }

/* ---- headings, notes ---- */
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.page-lead{ font:var(--font-label); color:var(--text-muted); margin:2px 0 16px; max-width:900px; }
.note{ font:var(--font-label); color:var(--text-muted); margin:8px 0 0; max-width:900px; }
.note code, .page-lead code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); }

/* ---- banners ---- */
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }

/* ---- pills ---- */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

/* ---- tables ---- */
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); color:var(--text-muted); }
table.cgrid tbody tr.hl td{ background:var(--asubk-blue-tint); }
/* Разделитель групп набран как рубрика (та же манера, что у разделов меню), а не
   как вторая серая шапка: двух одинаковых полос подряд глаз не различает. */
table.cgrid tbody tr.sect td{ background:var(--surface-card); padding:11px 12px 5px;
  border-top:1px solid var(--border-strong); border-bottom:1px solid var(--asubk-grid-line);
  font:var(--weight-semibold) 11.5px/1.4 var(--asubk-font); color:var(--text-muted);
  text-transform:uppercase; letter-spacing:0.05em; }
table.cgrid tbody tr.sect:first-child td{ border-top:none; }
table.cgrid tbody tr.sect .n{ font-weight:var(--weight-regular); color:var(--text-muted); }
table.cgrid td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cgrid tfoot td{ padding:9px 12px; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }

/* ---- cards ---- */
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.card.frozen{ background:var(--asubk-gray-50); border-color:var(--border-strong); }
.cols{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.side{ flex:0 0 260px; } .body{ flex:1; min-width:460px; }
.meta{ font:var(--font-label); color:var(--text-muted); margin:0 0 10px; }
.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:230px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input, .fld textarea{ border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.fld select, .fld input{ height:var(--control-h); }
.fld textarea{ min-height:92px; padding:8px 10px; min-width:100%; resize:vertical; font:var(--font-label); }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
.form-row.tight{ gap:10px; }

/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }

/* ---- toast ---- */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
    .cgrid tr.grp td{background:var(--asubk-tint-fill);border-top:1px solid var(--border-strong)}
.cgrid tr.grp.g2 td{background:var(--surface-hover);padding-left:22px}
.cgrid tr.gtot td{background:var(--asubk-green-tint);font-size:12px}
.bands{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px}
    .band{display:inline-block;padding:4px 10px;border:1px solid var(--border-default);border-radius:6px;
      background:#fff;font-size:12px}
    .band.lv{border-color:var(--asubk-blue);color:var(--asubk-blue)}
    .band.tot{border-color:var(--asubk-green);color:var(--asubk-green);font-weight:600}
    .bands .arr{color:var(--text-muted);font-size:12px}
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }

/* ---- зеркало чужого поля (ИА-9, ADR-0155 §1) ---- */
.mirror{ border:1px dashed var(--border-strong); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-panel); padding:10px 14px; margin-bottom:12px; }
.mirror .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.mirror .row:last-child{ margin-bottom:0; }
.mirror .k{ color:var(--text-muted); display:inline-block; min-width:190px; }
.mirror.err{ border-left-color:var(--asubk-red); }
.mirror.none{ border-left-color:var(--asubk-amber); }

/* ---- паспорт снимка (ADR-0153 §1) ---- */
.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-green);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:190px; }
.pass.warn{ border-left-color:var(--asubk-amber); }

/* ---- документ ---- */
.doc-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
.doc-head h2{ margin:0; font:var(--weight-semibold) 18px/1.2 var(--asubk-font); color:var(--text-heading); }
.verdict{ font:var(--weight-semibold) 15px/1.3 var(--asubk-font); color:var(--text-heading); }
.concl{ font:var(--font-label); color:var(--text-body); white-space:pre-wrap; margin:6px 0 0; }
.thr{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.lineform{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px 16px; }

/* ---- отчётность: снимок, паспорт выпуска, шов ---- */
.snap{ border:1px solid var(--border-strong); border-left:3px solid var(--asubk-green);
  border-radius:var(--radius-md); background:var(--asubk-gray-50); padding:10px 14px; margin-bottom:12px; }
.snap.prelim{ border-left-color:var(--asubk-amber); background:var(--surface-card); }
.snap .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.snap .row:last-child{ margin-bottom:0; }
.snap .k{ color:var(--text-muted); display:inline-block; min-width:200px; }
.seam{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-panel); padding:8px 12px; margin-bottom:10px;
  font:var(--font-label); color:var(--text-body); }
.seam .q{ color:var(--text-muted); }
.sheet{ border:1px solid var(--border-strong); border-radius:var(--radius-md);
  background:var(--surface-card); padding:16px 18px; margin-bottom:12px; }
.sheet .sheet-h{ font:var(--weight-semibold) 15px/1.3 var(--asubk-font); color:var(--text-heading); margin-bottom:2px; }
.sheet .sheet-sub{ font:var(--font-label); color:var(--text-muted); margin-bottom:12px; }
.foot-pass{ margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-default);
  font:var(--weight-regular) 12px/1.5 var(--asubk-font); color:var(--text-muted); }
.foot-pass b{ color:var(--text-body); font-weight:var(--weight-medium); }
.totals{ display:flex; gap:20px; flex-wrap:wrap; margin:10px 0 2px; }
.tot{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:9px 14px; background:var(--surface-panel); min-width:210px; }
.tot .tn{ font:var(--font-label); color:var(--text-muted); }
.tot .tv{ font:var(--weight-semibold) 18px/1.25 var(--asubk-font); color:var(--text-heading);
  font-variant-numeric:tabular-nums; }
.tot .tp{ font:var(--weight-regular) 11.5px/1.4 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0; }
.step{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
.step .num{ flex:none; width:22px; height:22px; border-radius:50%; background:var(--asubk-blue-tint);
  color:var(--asubk-blue); font:var(--weight-semibold) 12px/22px var(--asubk-font); text-align:center; }
.tmpl-kind{ font:var(--weight-medium) 12px/1.5 var(--asubk-font); }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin:0 0 14px; }
.tabs button{ appearance:none; border:none; background:none; cursor:pointer;
  font:var(--weight-medium) var(--text-sm)/1.4 var(--asubk-font); color:var(--text-muted);
  padding:9px 14px 8px; border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:7px; }
.tabs button:hover{ color:var(--text-heading); background:var(--surface-hover); }
.tabs button.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); }
.tabs .n{ font-variant-numeric:tabular-nums; color:var(--text-placeholder); }
.tabs button.on .n{ color:var(--asubk-blue); }
.tabs .burn{ background:var(--asubk-red); color:var(--asubk-white); border-radius:var(--radius-pill);
  font:var(--weight-semibold) 11px/1 var(--asubk-font); padding:3px 6px; }

/* ---- витрина ---- */
/* Таблица сама себе рамка: карточка вокруг неё давала рамку в рамке и отступ,
   из-за которого шапка столбцов висела в воздухе. */
.tblwrap{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  overflow:hidden; background:var(--surface-card); margin-bottom:14px; }
.tblwrap > table.cgrid{ border:none; }
.tblwrap table.cgrid tbody tr:not(.sect):hover td{ background:var(--surface-hover); }
.fname{ font:var(--weight-medium) var(--text-sm)/1.35 var(--asubk-font); color:var(--text-heading); }
.fmeta{ margin-top:4px; display:flex; flex-wrap:wrap; gap:5px 8px; align-items:center;
  font:var(--weight-regular) 12px/1.4 var(--asubk-font); color:var(--text-muted); }
.fmeta .code{ font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--text-placeholder); }
.fmeta .tag{ background:var(--asubk-tint-fill); border-radius:3px; padding:1px 6px; }
.fmeta .to{ color:var(--text-body); }
/* Состояние строки названо словом и держится полосой на срезе, а не заливкой
   всей строки: заливка гасила и название формы — единственное, что ищут глазами. */
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); }
table.cgrid tbody tr.out td:first-child{ box-shadow:inset 3px 0 var(--asubk-gray-200); }

<script>
/* =====================================================================
 *  МОДУЛЬ «ОТЧЁТНОСТЬ» — исполняемый прототип, волна 2
 *  Слои файла: даты → мир соседей зеркалом (подразделения, адресаты, публичные
 *  перечни полей ядра, реестр показателей статистики, объекты и их снимки по датам)
 *  → ЧЕТЫРЕ ШВА → движок состава → состояние → операции (публикация, выпуск,
 *  открытие периода, обязательства, серии) → швы наружу → экраны.
 *
 *  Главное, что этот файл доказывает исполнением: движок состава не знает базы.
 *  Он умеет спросить четыре вопроса и напечатать ответ с паспортом — ни одного
 *  обращения к массиву объектов и ни одной своей формулы в нём нет (ИО-2, ИО-3).
 * ===================================================================== */
const RP = {};

/* ------------------------------ ДАТЫ И СТРОКИ ----------------------- */
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const addDays = (iso,n) => new Date(Date.parse(iso)+n*86400000).toISOString().slice(0,10);
const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };
const dayWord = d => d + ' ' + plural(d,'день','дня','дней');
const objWord = n => n + ' ' + plural(n,'объект','объекта','объектов');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = sel => (typeof document === 'undefined' ? null : document.querySelector(sel));
const uniq = a => a.filter((x,i) => a.indexOf(x) === i);
const money = v => v == null ? '—' : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const MONTHS_N = ['январь','февраль','март','апрель','май','июнь','июль','август',
                  'сентябрь','октябрь','ноябрь','декабрь'];
const monthLabel = iso => MONTHS_N[+iso.slice(5,7)-1] + ' ' + iso.slice(0,4);
/* Первое число месяца, следующего за месяцем даты. */
const firstOfNext = iso => { const y=+iso.slice(0,4), m=+iso.slice(5,7);
  return (m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'))+'-01'; };
const dayOfMonth = (iso, d) => iso.slice(0,7)+'-'+String(d).padStart(2,'0');

/* ================== МИР СОСЕДЕЙ — ЗЕРКАЛО, НЕ ЭТАЛОН =================
   Всё в этом блоке принадлежит другим модулям и заведено ровно на ширину шва.
   Эталон подразделений — оргструктура, показателей — статистика, полей и
   объектов — ядро, адресатов — справочники (ADR-0157 §3).                    */

/* Подразделения — зеркало ОРГСТРУКТУРЫ. `credits` различает не право, а факт:
   кредиты ведут три подразделения, а Департамент правового обеспечения их не
   ведёт — и потому в области видимости отчётности его нет. Получателем бумаги
   он при этом бывает: служебная записка об инициировании принудительного
   взыскания уходит именно туда (Порядок №41, п. 19 п.п. 2; волна 12).        */
const DEPTS = [
  {id:'dep-admin', name:'Департамент администрирования кредитов', credits:true},
  {id:'dep-prom',  name:'Отраслевой департамент промышленности',  credits:true},
  {id:'rep-osh',   name:'Региональное представительство «Ош»',    credits:true},
  {id:'dep-legal', name:'Департамент правового обеспечения',      credits:false}
];
const DEPT = id => DEPTS.find(d => d.id === id);
const deptName = id => (DEPT(id) || {name:id}).name;

/* Должности — то же зеркало оргструктуры, другой вопрос. Служебная записка о
   судебном взыскании уходит ДОЛЖНОСТИ, а не человеку (п. 21): председатель
   сменится, а адресат бумаги останется тем же. Перечень ведёт оргструктура,
   отчётность его читает и своего не заводит (ИО-2).                          */
const POSTS = [
  {id:'p-chair', name:'Председатель Правления'}
];
const POST = id => POSTS.find(p => p.id === id);

/* Справочник адресатов сдачи. Получатель — ссылка сюда, а не строка: «Минфин»
   и «МФ КР» иначе станут двумя разными адресатами в журнале (ИО-5).          */
const ADDRESSEES = [
  {id:'a-mf',  name:'Министерство финансов Кыргызской Республики', short:'Минфин КР'},
  {id:'a-kab', name:'Комитет по администрированию бюджетных кредитов', short:'Комитет'},
  {id:'a-me',  name:'Министерство экономики и коммерции Кыргызской Республики', short:'Минэконом'}
];
const ADDR = id => ADDRESSEES.find(a => a.id === id);

/* Публичные перечни полей — владелец ЯДРО (ADR-0158 §4). Отчётность их читает
   и своих не заводит. Переименование поля здесь ломает публикацию шаблона и
   называет виновником ядро, а не автора шаблона.                             */
const FIELDS = {
  credit: {name:'кредит', owner:'ядро · кредиты', fields:[
    {id:'no',        name:'Номер договора'},
    {id:'borrower',  name:'Заёмщик'},
    {id:'dept',      name:'Подразделение'},
    {id:'sum',       name:'Сумма договора'},
    {id:'debt_main', name:'Остаток основного долга'},
    {id:'days',      name:'Дней просрочки'},
    {id:'status',    name:'Состояние'}
  ]},
  borrower: {name:'заёмщик', owner:'ядро · заёмщики', fields:[
    {id:'name',   name:'Наименование'},
    {id:'inn',    name:'ИНН'},
    {id:'dept',   name:'Подразделение'},
    {id:'status', name:'Состояние'}
  ]}
};
const FIELD = (obj, fid) => (FIELDS[obj] ? FIELDS[obj].fields.find(f => f.id === fid) : null);

/* Реестр показателей — владелец СТАТИСТИКА (ADR-0150). `live` — объявленная
   владельцем исчислимость налету (ADR-0159): без неё режим «сейчас» обещает
   то, чего нет. `withdrawn` — дата вывода показателя из реестра.             */
const STATS = [
  {id:'s-overdue-sum', name:'Сумма просроченной задолженности', unit:'сом', live:true},
  {id:'s-overdue-cnt', name:'Кредитов с просрочкой',            unit:'ед.', live:true},
  {id:'s-portfolio',   name:'Остаток основного долга, всего',   unit:'сом', live:true},
  {id:'s-avg-late',    name:'Средняя просрочка',                unit:'дн.', live:false,
   why:'считается ночным прогоном по живой базе: налету средняя не берётся'},
  {id:'s-recovery',    name:'Собираемость за период',           unit:'%',   live:false,
   why:'нужен закрытый период и сверка платежей — до конца периода величины нет'},
  {id:'s-npl',         name:'Доля проблемных кредитов',         unit:'%',   live:true,
   withdrawn:'2026-08-12', why:'выведен владельцем реестра: методика заменена классификацией'}
];
const STAT = id => STATS.find(s => s.id === id);

/* Объекты ядра — живое состояние («сейчас»). Два типа, и оба ЯДРА: кредит и
   лицо. Лицо заведено не для красоты — на него ссылается получатель бланка
   (ADR-0157 §3: «субъект ядра — должник, поручитель»). До волны 11 получателем
   стояло ИМЯ из поля кредита: одно лицо с двумя договорами было в журнале двумя
   получателями, а требование поручителю адресовать было некому (ОЧ-Д1).
   Поля лица берутся тем же публичным перечнем (FIELDS.borrower) — своих у
   отчётности нет (ИО-2).                                                      */
const OBJECTS = [
  /* --- лица --- */
  {id:'su-1', type:'borrower', name:'ОсОО «Ак-Дан»',          inn:'02508199410119', dept:'dep-prom',  status:'действующий'},
  {id:'su-2', type:'borrower', name:'ОсОО «Нарын-Агро»',      inn:'01703199510072', dept:'dep-prom',  status:'действующий'},
  {id:'su-3', type:'borrower', name:'ИП Садыков А. Т.',       inn:'22206198500531', dept:'rep-osh',   status:'действующий'},
  {id:'su-4', type:'borrower', name:'ОсОО «Тянь-Шань Строй»', inn:'00912200210148', dept:'dep-admin', status:'действующий'},
  {id:'su-5', type:'borrower', name:'ОсОО «Кара-Балта Мел»',  inn:'01204199810217', dept:'dep-admin', status:'действующий'},
  {id:'su-6', type:'borrower', name:'ОсОО «Ош-Текстиль»',     inn:'03011200710093', dept:'rep-osh',   status:'действующий'},
  {id:'su-7', type:'borrower', name:'КФХ «Жайыл»',            inn:'11508197400264', dept:'dep-prom',  status:'действующий'},
  {id:'su-8', type:'borrower', name:'Асанов Т. К.',           inn:'20107198200419', dept:'rep-osh',   status:'действующий'},
  /* --- кредиты. `subjects` — ссылки на лица С РОЛЬЮ: «контрагент объекта» у
         кредита не один, и какой из них получатель — знает не объект, а бланк
         (ADR-0167 §2). КД-2025/088 и КД-2024/259 — ДВА договора одного лица:
         без этой пары расхождение «договоров больше, чем заёмщиков» в зеркале
         не видно, а норма п. 9 считает заёмщиками (ОЧ-61).                    */

const OBJ  = id => OBJECTS.find(o => o.id === id);
const SUBJ = id => OBJECTS.find(o => o.id === id && o.type === 'borrower');
const CREDITS = () => OBJECTS.filter(o => o.type === 'credit');
/* Кто получатель бумаги об объекте — вопрос РОЛИ, а не объекта: уведомление
   уходит заёмщику, требование — поручителю, и оба они контрагенты одного
   кредита. Роль объявляет редакция бланка (ADR-0167 §2).                     */
const subjectInRole = (objId, role) => { const o = OBJ(objId);
  const link = o && (o.subjects || []).find(s => s.role === role);
  return link ? SUBJ(link.ref) : null; };
const SUBJ_ROLES = ['заёмщик','поручитель','залогодатель'];

/* ================ ВИДЫ ПОЛУЧАТЕЛЯ БЛАНКА (ADR-0168) ==================
   Волна 11 научила бланк адресоваться ЛИЦУ в объявленной роли и на том
   остановилась — потому что все пять заведённых бланков уходили наружу.
   Порядок №41 требует одиннадцать, и три из них — служебные записки ВНУТРЬ
   организации: в ДПО (п. 19 п.п. 2), Председателю Правления (п. 21) и
   отраслевому подразделению на доработку (п. 20 п.п. 1). Лица у них нет
   вовсе, и роль ядра им не подходит.

   Поэтому редакция объявляет не роль, а ВИД получателя и его значение.
   Видов четыре, и значение каждого берётся из чужого перечня — своего
   справочника адресатов у отчётности по-прежнему нет (ИО-2):

     роль                  → лицо ядра в роли у объекта (заёмщик · поручитель · залогодатель)
     подразделение         → постоянное подразделение оргструктуры (ДПО)
     подразделение объекта → то, которое ведёт этот кредит: адресат разный у каждой бумаги
     должность             → должность оргструктуры (Председатель Правления), не человек     */
const ADDRESSEE_KINDS = ['роль','подразделение','подразделение объекта','должность'];

/* Проверка объявления — при публикации, а не на выпуске: к моменту выпуска за
   экраном человек с задачей (ИО-7). Возвращает причину отказа или null.      */
function addresseeCheck(a){
  if(!a || !a.kind) return 'редакция не объявила, кому уходит бумага: у бланка есть адресат, '+
    'и вид адресата — часть вопроса, а не настройка минуты (ИО-28, ADR-0168 §1)';
  if(ADDRESSEE_KINDS.indexOf(a.kind) === -1) return 'вида получателя «'+a.kind+'» не бывает: '+
    'бланк уходит лицу в роли, подразделению, подразделению своего объекта или должности '+
    '(ADR-0168 §1)';
  if(a.kind === 'роль'){
    if(SUBJ_ROLES.indexOf(a.role) === -1) return 'роли «'+a.role+'» у лица относительно объекта '+
      'не бывает: роли ведёт ядро, отчётность своего перечня не заводит (ИО-2)';
  } else if(a.kind === 'подразделение'){
    if(!DEPT(a.unit)) return 'подразделения «'+a.unit+'» в оргструктуре нет: перечень ведёт '+
      'оргструктура, отчётность его читает и не пополняет (ИО-2, ИО-29)';
  } else if(a.kind === 'должность'){
    if(!POST(a.post)) return 'должности «'+a.post+'» в оргструктуре нет: перечень ведёт '+
      'оргструктура, отчётность его читает и не пополняет (ИО-2, ИО-29)';
  }
  return null;
}

/* Как объявление читается человеком — одной строкой, в витрине и в редакции. */
function addresseeText(a){
  if(!a || !a.kind) return '—';
  if(a.kind === 'роль') return 'лицо в роли «'+a.role+'»';
  if(a.kind === 'подразделение') return 'подразделение «'+deptName(a.unit)+'»';
  if(a.kind === 'подразделение объекта') return 'подразделение, ведущее объект';
  if(a.kind === 'должность') return 'должность «'+((POST(a.post) || {}).name || a.post)+'»';
  return a.kind;
}

/* Кого назовёт бумага по этому объекту. Объект остаётся ДОРОГОЙ к получателю
   при любом виде: у служебной записки он тоже назван — записка не «вообще», а
   по конкретному кредиту (ADR-0168 §2).                                      */
function resolveAddressee(a, objId){
  const o = OBJ(objId);
  const why = addresseeCheck(a);
  if(why) return {ok:false, why};
  const via = o ? {viaObject: o.id, viaNo: o.no} : {viaObject: objId, viaNo: null};
  if(a.kind === 'роль'){
    const s = subjectInRole(objId, a.role);
    if(!s) return {ok:false, why:'уходит лицу в роли «'+a.role+'», а у объекта «'+
      (o ? o.no : objId)+'» такого лица нет: получателя назвать некем. Роль объявляет '+
      'редакция, а не человек на выпуске (ИО-28, ADR-0167 §2)'};
    return {ok:true, rec: Object.assign({kind:'роль', ref:s.id, name:s.name, role:a.role,
      inn:s.inn}, via)};
  }
  if(a.kind === 'подразделение')
    return {ok:true, rec: Object.assign({kind:'подразделение', ref:a.unit,
      name: deptName(a.unit), role:null}, via)};
  if(a.kind === 'подразделение объекта'){
    if(!o || !o.dept) return {ok:false, why:'уходит подразделению, ведущему объект, а у объекта '+
      'подразделение не названо: адресата назвать некем'};
    return {ok:true, rec: Object.assign({kind:'подразделение', ref:o.dept, name: deptName(o.dept),
      role:null, byObject:true}, via)};
  }
  return {ok:true, rec: Object.assign({kind:'должность', ref:a.post,
    name:(POST(a.post) || {}).name || a.post, role:null}, via)};
}

const HIST_DATES = Object.keys(HIST);

/* ===================== ЧЕТЫРЕ ШВА — ЕДИНСТВЕННЫЙ ВХОД =================
   Три шва статистики (ADR-0152) обслуживают «на дату»; четвёртый, objectRows
   у ядра, добавлен решением ADR-0158 ради режима «сейчас». Своих запросов к
   базе у отчётности нет вовсе: всё, что ниже, принадлежит СОСЕДЯМ и здесь
   стоит заглушкой ровно на ширину вопроса. Область видимости применяется
   ВНУТРИ шва — поэтому обойти её отчётность не может физически (ИО-3).

   Вопрос шву задаётся вместе с разрезом (cut): скрытым считается то, что
   разрезу подходит, а области видимости — нет. Это и есть «усечение,
   произнесённое вслух» (§13.4).
   ==ШВЫ==                                                                    */
const SEAMS_IN = [
  {id:'statSlice',  owner:'статистика', q:'значение показателя в разрезе на дату; ответ ВСЕГДА ' +
    'дерево уровней — плоский разрез вырождается в один уровень (ADR-0176 §6)'},
  {id:'statSeries', owner:'статистика', q:'ряд значений показателя по датам'},
  {id:'statRows',   owner:'статистика', q:'строки объектов на дату; полный список или отказ (ADR-0178)'},
  {id:'objectRows', owner:'ядро',       q:'перечисление живых объектов: поля и показатели налету; ' +
    'в v1 отвечает по объектам ядра — по кредиту (ADR-0181 §4)'}
];

/* Числа считает СТАТИСТИКА. Этот кусок — её зеркало, а не формула отчётности:
   в модуле отчётности своей формулы нет ни одной (ИО-2, ADR-0150).           */
function statValue(statId, rows){
  const late = rows.filter(r => r.days > 0);
  if(statId === 's-overdue-sum') return rows.reduce((a,r) => a + (r.days > 0 ? r.debt_main : 0), 0);
  if(statId === 's-overdue-cnt') return late.length;
  if(statId === 's-portfolio')   return rows.reduce((a,r) => a + r.debt_main, 0);
  if(statId === 's-avg-late')    return late.length ? Math.round(late.reduce((a,r) => a + r.days, 0)/late.length) : 0;
  if(statId === 's-npl')         return rows.length ? Math.round(late.length/rows.length*1000)/10 : 0;
  if(statId === 's-recovery')    return 87.4;
  return null;
}
/* Ближайший снимок не позже спрошенной даты. Подстановка соседней даты
   называется в паспорте и делает выпуск предварительным (ADR-0152 §5).       */
function nearestSnapshot(asOf){
  const before = HIST_DATES.filter(d => d.localeCompare(asOf) !== 1).sort();
  return before.length ? before[before.length-1] : null;
}
function applyCut(rows, cut){
  if(!cut) return rows;
  let r = rows;
  if(cut.dept) r = r.filter(x => x.dept === cut.dept);
  if(cut.obj)  r = r.filter(x => x.id === cut.obj);
  if(cut.ids)  r = r.filter(x => cut.ids.indexOf(x.id) !== -1);
  /* Значение уровня разреза — такой же отбор, как подразделение: второй уровень
     спрашивается внутри значения первого (ОЧ-25).                             */
  if(cut.at)   r = r.filter(x => x[cut.at.by] === cut.at.key);
  return r;
}
/* Округление объявлено составом редакции (§3 п. 2): величина уходит в файл уже
   округлённой, иначе сданное и пересчитанное расходятся в копейках (ОЧ-32).   */
const roundTo = (v, dp) => v == null ? null :
  (dp == null ? v : Math.round(v * Math.pow(10, dp)) / Math.pow(10, dp));
const CUT_NAMES = {dept:'подразделение', status:'состояние кредита', borrower:'заёмщик'};
const cutName = by => CUT_NAMES[by] || by;
const SEAM = {
  /* ЯДРО. Живые объекты: поля перечня + показатели, объявленные исчислимыми. */
  objectRows(objType, cut, scope){
    const all = applyCut(OBJECTS.filter(o => o.type === objType), cut);
    const vis = all.filter(o => scope.indexOf(o.dept) !== -1);
    return {rows: clone(vis), hidden: all.length - vis.length, substituted:null,
      passport:{seam:'objectRows', owner:'ядро', asOf:null, mode:'сейчас',
        scope: scope.slice(), depth:'живое состояние на момент вопроса'}};
  },
  /* СТАТИСТИКА. Строки объектов на дату — из её снимков, не из живой базы.   */
  statRows(objType, asOf, cut, scope){
    const real = nearestSnapshot(asOf);
    if(!real) return {rows:[], hidden:0, substituted:null, missing:true,
      passport:{seam:'statRows', owner:'статистика', asOf, mode:'на дату', scope: scope.slice()}};
    const snap = HIST[real];
    /* Снимок — не только величины, но и СОСТАВ: чего в нём нет, того на дату не
       было. Объект, заведённый позже, в ответ «на дату» не попадает вовсе, а
       закрытый после даты — попадает (ИО-27).                                  */
    const all = applyCut(OBJECTS.filter(o => o.type === objType && snap[o.id]).map(o => {
      const s = snap[o.id] || {};
      return {id:o.id, no:o.no, borrower:o.borrower, dept:o.dept, sum:o.sum,
              debt_main:s.debt_main, days:s.days, status:s.status, closed:o.closed};
    }), cut);
    const vis = all.filter(o => scope.indexOf(o.dept) !== -1);
    return {rows: clone(vis), hidden: all.length - vis.length,
      substituted: real === asOf ? null : real,
      passport:{seam:'statRows', owner:'статистика', asOf: real, asked: asOf, mode:'на дату',
        scope: scope.slice(), depth:'снимок статистики на '+fmt(real)}};
  },
  /* СТАТИСТИКА, ОДНА дверь. Ответ ВСЕГДА дерево уровней (ADR-0176 §6): плоский
     разрез вырождается в один уровень, отсутствие разреза — в один корень.
     Двух форм у одного шва нет намеренно — потребитель, написанный под
     таблицу, сломался бы на первом же иерархическом разрезе.
     Числа родительского уровня считает СТАТИСТИКА, отдельной группировкой тех
     же строк, а не сложением детей (ИС-24): доля области не есть сумма долей
     районов, а объект с незаполненным нижним уровнем при сворачивании детей
     просто исчез бы. Отчётности складывать больше нечего — и не из запрета,
     а потому, что уровни приходят посчитанными (волна 13).
     Агрегат считается только по видимым строкам (§13.2): иначе итог рассказал
     бы то, чего в строках нет.                                               */
  statSlice(statId, by, cut, asOf, scope){
    const meta = STAT(statId);
    const levels = by == null ? [] : (Array.isArray(by) ? by.slice() : [by]);
    if(!meta) return {levels, value:null, groups:[],
      why:'показателя «'+statId+'» в реестре нет', passport:null};
    const src = asOf ? SEAM.statRows('credit', asOf, cut, scope) : SEAM.objectRows('credit', cut, scope);
    if(src.missing) return {levels, value:null, groups:[],
      why:'снимка на '+fmt(asOf)+' у статистики нет', passport:null};
    const build = (rows, li) => li >= levels.length ? null
      : uniq(rows.map(r => r[levels[li]])).map(k => {
          const part = rows.filter(r => r[levels[li]] === k);
          return {by: levels[li], key:k, count: part.length,
            /* Значение уровня — по строкам уровня, не из детей (ИС-24).      */
            value: statValue(statId, part), children: build(part, li + 1)};
        });
    return {levels, value: statValue(statId, src.rows), unit: meta.unit,
      groups: build(src.rows, 0) || [], hidden: src.hidden, substituted: src.substituted,
      passport:{seam:'statSlice', owner:'статистика', form:'дерево', by: levels.slice(),
        asOf: asOf ? src.passport.asOf : null, mode: asOf ? 'на дату' : 'сейчас',
        scope: scope.slice(),
        cut: cut && cut.dept ? deptName(cut.dept) : 'без разреза'}};
  },
  /* СТАТИСТИКА. Ряд значений по датам — для плиток и динамики.               */
  statSeries(statId, dates, cut, scope){
    return {points: dates.map(d => ({at:d, value: SEAM.statSlice(statId, null, cut, d, scope).value})),
      passport:{seam:'statSeries', owner:'статистика', mode:'на дату', scope: scope.slice()}};
  },
  /* КОНТРАКТЫ, а не данные (ADR-0158 §4): публичный перечень полей объекта и
     паспорт показателя. Их отчётность тоже не заводит у себя.                */
  fieldList(objType){ const o = FIELDS[objType];
    return o ? {object:objType, name:o.name, owner:o.owner, fields: clone(o.fields)} : null; },
  statMeta(statId){ const s = STAT(statId); return s ? clone(s) : null; },
  objectTypes(){ return Object.keys(FIELDS); }
};
/* ==/ШВЫ== */

/* ================== ДВИЖОК СОСТАВА — ОТВЕТ ПО ОБЪЯВЛЕНИЮ ==============
   Всё, что он умеет: спросить швы о том, что объявила редакция, и собрать
   ответ с паспортом. Ниже нет ни одного обращения к базе и ни одной формулы —
   имён OBJECTS, HIST, STATS, FIELDS в этом блоке не встречается (ИО-2, ИО-3).
   ==ДВИЖОК==                                                                 */
/* ==================== МАКЕТ ВЫГРУЗКИ (§3 п. 8) ========================
   Печатное представление принадлежит РЕДАКЦИИ, а не экрану: сданное печатается
   одинаково у всех, и «как было напечатано» — часть предъявленного (ИО-18).
   Полосы объявлены списком, а не выведены из положения ячеек, как в легаси —
   оттуда лист, где ИТОГО стоит перед группами (ОЧ-26, ОЧ-33).                */
const BANDS = ['заголовок','шапка','уровни','итог','подвал'];
const SHEET0 = {orient:'альбомная', repeatHeader:true, footer:'паспорт',
  bands: BANDS.slice(), formats:['xlsx','csv','pdf'], widths:'по содержимому'};
const sheetOfEd = ed => Object.assign({}, SHEET0, ed.sheet || {});
const dpOf = (ed, sid) => (ed.dp && ed.dp[sid] != null) ? ed.dp[sid] : null;
const levelName = (by, key) => by === 'dept' ? deptName(key) : String(key == null ? '—' : key);

/* Итог по значению уровня НЕ складывается модулем: доля и средняя не аддитивны
   (ИО-17). Он приходит УРОВНЕМ ДЕРЕВА statSlice — одним вопросом на показатель,
   а не по вопросу на группу; числа уровня считает статистика (ИС-24).
   Счёта уникальных в доводе больше нет: `count distinct` статистика из списка
   показателей выкинула (ADR-0186, ИС-30) — довод стоял бы на несуществующем.  */
function levelTotals(ed, by, cut, asOf, scope){
  const packs = {};
  ed.stats.forEach(sid => { packs[sid] = SEAM.statSlice(sid, by, cut, asOf, scope); });
  return key => ed.stats.map(sid => {
    const meta = SEAM.statMeta(sid), p = packs[sid];
    const g = (p.groups || []).find(x => x.key === key);
    const dp = dpOf(ed, sid);
    return {id:sid, name: meta ? meta.name : sid, unit: meta ? meta.unit : '',
      value: g ? g.value : null, shown: roundTo(g ? g.value : null, dp), dp,
      why: p.why || null, seam:'statSlice (дерево)'};
  });
}
/* ============ ГРАНИЦЫ КРУТИЛКИ И НАКРУТКА (§3 п. 9, ADR-0162) =========
   Редакция объявляет ДВА списка: состав по умолчанию и перечень допустимых
   отклонений. Экран крутится только внутри второго; вышел за него — это уже
   другой вопрос, то есть личный черновик, а не показ (ИО-20).
   Перечень РАЗРЕШЁННОГО, а не признак «жёсткий/свободный» на весь отчёт и не
   флаг на каждой ячейке: по второй дороге легаси пришло к 928 ячейкам с
   личным position (ОЧ-33).                                                  */
const LAYOUTS = ['показатели в колонках','показатели в строках'];
const boundsOf = ed => { const f = ed.free || {};
  return {cuts:(f.cuts || []).slice(), stats:(f.stats || []).slice(), drill: !!f.drill}; };
const baseOf = ed => ({cuts:(ed.cuts || []).slice(), stats:(ed.stats || []).slice(),
  drill: ed.drill !== false, layout: LAYOUTS[0]});
const statName = sid => (SEAM.statMeta(sid) || {name:sid}).name;
const sameOrder = (a, b) => a.join('|') === b.join('|');

function twistCheck(ed, twist){
  const base = baseOf(ed), B = boundsOf(ed);
  if(!twist) return {ok:true, twist:base, deviated:false, dev:null};
  const w = {cuts:  twist.cuts  ? twist.cuts.slice()  : base.cuts.slice(),
             stats: twist.stats ? twist.stats.slice() : base.stats.slice(),
             drill: twist.drill == null ? base.drill : !!twist.drill,
             layout: twist.layout || base.layout};
  if(LAYOUTS.indexOf(w.layout) === -1) return {ok:false,
    why:'раскладки «'+w.layout+'» не бывает: '+LAYOUTS.join(' · ')};
  if(uniq(w.cuts).length !== w.cuts.length) return {ok:false,
    why:'разрез назван дважды: уровень бывает один'};
  if(uniq(w.stats).length !== w.stats.length) return {ok:false,
    why:'показатель назван дважды: второй такой же колонки не бывает'};
  const addC = w.cuts.filter(c => base.cuts.indexOf(c) === -1);
  const hidC = base.cuts.filter(c => w.cuts.indexOf(c) === -1);
  const badAddC = addC.filter(c => B.cuts.indexOf(c) === -1);
  if(badAddC.length) return {ok:false, why:'разрез «'+cutName(badAddC[0])+'» редакция '+ed.n+
    ' допустимым отклонением не объявила: добавить его — задать другой вопрос. Такой состав '+
    'собирается ЛИЧНЫМ ЧЕРНОВИКОМ, а не крутилкой показа (ИО-20)'};
  const badHidC = hidC.filter(c => B.cuts.indexOf(c) === -1);
  if(badHidC.length) return {ok:false, why:'разрез «'+cutName(badHidC[0])+'» объявлен составом '+
    'редакции '+ed.n+' и отклонением не назван: убрать его — уже другой отчёт (ИО-20)'};
  const hardC = base.cuts.filter(c => B.cuts.indexOf(c) === -1);
  if(!sameOrder(w.cuts.filter(c => hardC.indexOf(c) !== -1), hardC)) return {ok:false,
    why:'жёсткие уровни переставлены: редакция '+ed.n+' объявила порядок «'+
    hardC.map(cutName).join(' → ')+'», переставляются только объявленные отклонения (ИО-20)'};
  const addS = w.stats.filter(s => base.stats.indexOf(s) === -1);
  const hidS = base.stats.filter(s => w.stats.indexOf(s) === -1);
  const badAddS = addS.filter(s => B.stats.indexOf(s) === -1);
  if(badAddS.length) return {ok:false, why:'показатель «'+statName(badAddS[0])+'» редакция '+ed.n+
    ' допустимым отклонением не объявила: перечень отклонений — список разрешённого, а не всё, '+
    'что есть в реестре (ИО-20)'};
  const badHidS = hidS.filter(s => B.stats.indexOf(s) === -1);
  if(badHidS.length) return {ok:false, why:'показатель «'+statName(badHidS[0])+'» объявлен '+
    'составом редакции '+ed.n+' и отклонением не назван: спрятать его — уже другой отчёт (ИО-20)'};
  const hardS = base.stats.filter(s => B.stats.indexOf(s) === -1);
  if(!sameOrder(w.stats.filter(s => hardS.indexOf(s) !== -1), hardS)) return {ok:false,
    why:'жёсткие показатели переставлены: их порядок объявлен редакцией '+ed.n};
  const nometa = w.stats.filter(s => !SEAM.statMeta(s));
  if(nometa.length) return {ok:false, why:'показателя «'+nometa[0]+'» в реестре статистики нет'};
  const dead = w.stats.map(s => SEAM.statMeta(s)).filter(m => m && m.withdrawn);
  if(dead.length) return {ok:false, why:'показатель «'+dead[0].name+'» выведен из реестра '+
    fmt(dead[0].withdrawn)+': показать его нельзя ни составом, ни отклонением'};
  /* Углубление до строк объектов — ОТКЛОНЕНИЕ, требующее объявления: это
     другой шов, другой объём ответа и другая видимость полей (ADR-0162 §8). */
  if(w.drill !== base.drill && !B.drill) return {ok:false, why:'углубление до строк объектов '+
    'редакция '+ed.n+' отклонением не объявила: это другой шов — statRows вместо дерева '+
    'statSlice, другой объём ответа и другая видимость полей объекта (ADR-0162 §8)'};
  if(!w.drill && !w.stats.length) return {ok:false, why:'без строк объектов и без показателей '+
    'смотреть нечего: углубление снимают тогда, когда остаются итоги разрезов'};
  const dev = {addedCuts:addC, hiddenCuts:hidC, addedStats:addS, hiddenStats:hidS,
    movedCuts: !addC.length && !hidC.length && !sameOrder(w.cuts, base.cuts),
    movedStats: !addS.length && !hidS.length && !sameOrder(w.stats, base.stats),
    drill: w.drill !== base.drill, layout: w.layout !== base.layout};
  /* Раскладка в отклонение НЕ засчитывается: клетки те же, вопрос тот же —
     и в выпуск она не уходит вовсе, лист принадлежит редакции (ИО-18).      */
  const deviated = !!(addC.length || hidC.length || addS.length || hidS.length || dev.drill ||
    !sameOrder(w.cuts, base.cuts) || !sameOrder(w.stats, base.stats));
  return {ok:true, twist:w, deviated, dev};
}
/* Накрутка живёт ПОВЕРХ опубликованной редакции и ничего в ней не меняет:
   отсюда копия, а не правка (ИО-2).                                        */
const withTwist = (ed, w) => Object.assign({}, ed, {cuts: w.cuts.slice(), stats: w.stats.slice(),
  levelTotals: (ed.levelTotals || []).filter(c => w.cuts.indexOf(c) !== -1),
  drill: w.drill, layout: w.layout});
/* Показанный состав — целиком, а не дельтой от умолчания: снимок должен
   восстанавливаться из паспорта, не полагаясь на вычитание (ИО-22).        */
const shownOf = (ed, drill) => ({cuts:(ed.cuts || []).map(cutName),
  stats:(ed.stats || []).map(statName), drill: !!drill,
  layout: LAYOUTS.indexOf(ed.layout) !== -1 ? ed.layout : LAYOUTS[0]});

/* Ответ БЕЗ строк объектов: спрошено только дерево statSlice, statRows не
   спрашивался вовсе. Дата состояния, охват и подстановка снимка приходят из
   его же паспорта — своих запросов к базе нет и здесь (ИО-2).              */
function sliceOnly(ed, cut, asOf, scope){
  const by = (ed.cuts || [])[0] || 'dept';
  const p = SEAM.statSlice(ed.stats[0], by, cut, asOf, scope);
  if(!p.passport) return {rows:[], hidden:0, substituted:null, missing:true,
    passport:{seam:'statSlice (дерево)', owner:'статистика', asOf,
      mode: asOf ? 'на дату' : 'сейчас', scope: scope.slice()}};
  return {rows:[], hidden: p.hidden || 0, substituted: p.substituted || null, missing:false,
    passport:{seam:'statSlice (дерево)', owner:'статистика', asOf: p.passport.asOf,
      mode: p.passport.mode, scope: scope.slice(),
      depth:'без строк объектов: спрошены уровни разрезов'}};
}
function bandsNoRows(ed, levels, li, cut, asOf, scope){
  const lv = levels[li];
  const ask = lv.total ? levelTotals(ed, lv.by, cut, asOf, scope) : null;
  const probe = SEAM.statSlice(ed.stats[0], lv.by, cut, asOf, scope);
  return (probe.groups || []).map(g => {
    const inner = Object.assign({}, cut, {at:{by: lv.by, key: g.key}});
    return {level: lv.level, by: lv.by, key: g.key, name: levelName(lv.by, g.key), count: g.count,
      totals: ask ? ask(g.key) : null,
      children: li + 1 < levels.length ? bandsNoRows(ed, levels, li + 1, inner, asOf, scope) : null,
      rows: null};
  });
}
function bandsFor(ed, levels, li, rows, cut, asOf, scope){
  const lv = levels[li];
  const ask = lv.total ? levelTotals(ed, lv.by, cut, asOf, scope) : null;
  return uniq(rows.map(r => r[lv.by])).map(key => {
    const part = rows.filter(r => r[lv.by] === key);
    const inner = Object.assign({}, cut, {at:{by: lv.by, key}});
    return {level: lv.level, by: lv.by, key, name: levelName(lv.by, key), count: part.length,
      totals: ask ? ask(key) : null,
      children: li + 1 < levels.length
        ? bandsFor(ed, levels, li + 1, part, inner, asOf, scope) : null,
      rows: li + 1 < levels.length ? null : part};
  });
}

function compose(tpl, ed, params, viewer){
  const scope = viewer.scope.slice();
  const cut = {dept: params.dept || null, ids: params.ids || null};
  const asOf = ed.mode === 'на дату' ? params.asOf : null;
  /* Углубление до строк объектов — ДРУГОЙ ШОВ: снятое углубление значит, что
     statRows не спрашивается вовсе, а ответ собирается деревом statSlice.
     Потому оно и объявляется редакцией, а не крутится молча (ADR-0162 §8).  */
  const drill = ed.drill !== false || !ed.stats.length;
  const src = drill ? (asOf ? SEAM.statRows(ed.object, asOf, cut, scope)
                            : SEAM.objectRows(ed.object, cut, scope))
                    : sliceOnly(ed, cut, asOf, scope);
  const list = SEAM.fieldList(ed.object);
  const cols = ed.fields.map(fid => {
    const f = list.fields.find(x => x.id === fid);
    return {id:fid, name: f ? f.name : null, lost: !f};
  });
  const rows = drill ? src.rows.slice().sort((a,b) =>
    ed.order === 'по просрочке' ? (b.days - a.days) || String(a.no).localeCompare(String(b.no))
                                : String(a.no).localeCompare(String(b.no))) : [];
  const totals = ed.stats.map(sid => {
    const meta = SEAM.statMeta(sid);
    const r = SEAM.statSlice(sid, null, cut, asOf, scope);
    const dp = dpOf(ed, sid);
    return {id:sid, name: meta ? meta.name : sid, unit: meta ? meta.unit : '',
            value:r.value, shown: roundTo(r.value, dp), dp, why:r.why, passport:r.passport};
  });
  /* Уровни разрезов объявлены редакцией вместе с тем, печатается ли по уровню
     итог (§3 п. 4). Итоги приходят швом; модуль их не складывает (ИО-17).     */
  const levels = (ed.cuts || []).map((by, i) => ({by, level: i + 1, name: cutName(by),
    total: (ed.levelTotals || []).indexOf(by) !== -1}));
  const groups = levels.length
    ? (drill ? bandsFor(ed, levels, 0, rows, cut, asOf, scope)
             : bandsNoRows(ed, levels, 0, cut, asOf, scope)) : null;
  const sheet = sheetOfEd(ed);
  /* Что нельзя проверить на публикации — делает выпуск предварительным (ИО-8). */
  const soft = [];
  if(src.hidden > 0) soft.push('область видимости скрыла '+objWord(src.hidden)+
    ' — охват ответа неполный');
  if(src.substituted) soft.push('снимка на '+fmt(asOf)+' нет, подставлен ближайший на '+
    fmt(src.substituted));
  if(src.missing) soft.push('снимка статистики на '+fmt(asOf)+' нет вовсе');
  return {
    cols, rows, totals, levels, groups, sheet,
    hidden: src.hidden, substituted: src.substituted, missing: !!src.missing,
    soft,
    passport:{
      asOf: asOf ? src.passport.asOf : null,
      mode: ed.mode,
      frozen: false,
      scope: scope.map(deptName),
      edition: ed.n,
      template: tpl.name,
      params: clone(params),
      hidden: src.hidden,
      /* «Как было напечатано» — часть предъявленного, поэтому лист попадает в
         паспорт, а не остаётся настройкой экрана (ИО-18).                      */
      sheet:{orient: sheet.orient, bands: sheet.bands.slice(), formats: sheet.formats.slice()},
      levels: levels.map(l => l.name + (l.total ? ' (с итогом)' : '')),
      /* Показанный состав целиком: два выпуска по одной редакции могут
         показывать разное, и паспорт обязан это помнить (ИО-22).            */
      shown: shownOf(ed, drill),
      rounding: ed.stats.map(sid => { const dp = dpOf(ed, sid);
        return dp == null ? null : (SEAM.statMeta(sid) || {name:sid}).name + ' → ' +
          (dp === 0 ? 'целых' : dp + ' зн.'); }).filter(Boolean),
      seams: uniq([src.passport.seam].concat(totals.map(t => t.passport ? t.passport.seam : null)
        .filter(Boolean)))
    }
  };
}
/* ==/ДВИЖОК== */

/* ============================ РОЛИ (§17) =============================
   Область видимости — не право модуля, а свойство человека: она приезжает
   вместе с ролью и применяется внутри шва. Публикует только уполномоченный;
   печатает бланк — делопроизводитель; отметки «сдано» нет ни у кого.        */

   бумаги (волна 12, ОЧ-63).                                                  */

const RESPONSIBLE = {'dep-admin':'Асанов А.', 'dep-prom':'Осмонова Г.', 'rep-osh':'Мамытов Э.'};

/* ===================== ШАБЛОНЫ ОТЧЁТНОСТИ (§2.1–2.3) ==================
   Вид — один из двух и только: отчёт о множестве объектов, бланк об одном

const KINDS = ['отчёт','бланк'];
function templatesSeed(){ return [

   editions:[{n:1, state:'опубликована', since:'2026-05-20', by:'Тентимишев К.', at:'2026-05-20',
     object:'credit', mode:'на дату', order:'по просрочке',
     fields:['no','borrower','dept','debt_main','days'],
     stats:['s-overdue-sum','s-overdue-cnt'], cuts:['dept','status'], levelTotals:['dept'],
     /* Границы крутилки объявлены редакцией: состояние кредита можно снимать
        и переставлять, остаток — добавлять; уровень «подразделение» и оба

     free:{cuts:['status'], stats:['s-portfolio'], drill:false},

     params:[{id:'period', role:'вопроса', name:'Отчётный месяц'},

   circle:ALL_DEPTS.slice(), forReview:true, fullCoverage:false, series:null, schedule:null,
   editions:[{n:1, state:'опубликована', since:'2026-04-01', by:'Тентимишев К.', at:'2026-04-01',
     object:'credit', mode:'сейчас', order:'по номеру',
     fields:['no','borrower','dept','debt_main','days','status'],
     stats:['s-portfolio','s-overdue-cnt'], cuts:['dept','status'], levelTotals:['dept'],
     /* Обратный случай: оба уровня жёсткие, зато разрешено углубление снимать

     free:{cuts:['borrower'], stats:['s-overdue-sum'], drill:true},

/* ================== СПРАВОЧНИК ФОРМ (ADR-0163, ИО-23) ==================
   Форма — предметная единица отчётности: вопрос, который организация обязана
   или хочет уметь задать. Существует ДО системы и вне её: у формы есть
   основание и адресат, но нет ни редакции, ни круга, ни выпусков — всё это
   заводит ШАБЛОН, которым форма в системе реализуется.

   Справочник заведён ради ОДНОГО состояния — «шаблон не заведён». Срок по
   норме идёт независимо от того, завели мы шаблон или нет, и пустой экран в
   этом месте не нейтрален: он утверждает «всё в порядке». Тот, кому писать
   повторную претензию, не находит её и пишет в Word — так легаси и нажило
   12 шаблонов-дублей (ОЧ-39, ОЧ-46).

const FIELDS0 = clone(FIELDS), STATS0 = clone(STATS), HIST0 = clone(HIST),
      OBJECTS0 = clone(OBJECTS);
function restoreMirrors(){
  Object.keys(FIELDS0).forEach(k => { FIELDS[k] = clone(FIELDS0[k]); });

  Object.keys(HIST0).forEach(k => { HIST[k] = clone(HIST0[k]); });
  OBJECTS.length = 0; clone(OBJECTS0).forEach(o => OBJECTS.push(o));
}

function seed(){

    worklists: [], wseq: 0,
    views: [], vseq: 0,                /* личные виды — восьмая сущность (§2.8) */
    dash: {personal:{}},              /* личная перекладка поверх объявленной на роль (§10) */
    log: [],

          /* Период умолчанием — последний СО СНИМКОМ, а не сегодняшний (ИО-26). */
          params:{asOf: RP.defaultAsOf(), dept:''}, recipient:'a-mf', kind:'предварительный',
          twist:null, view:null, viewName:'', dropped:null,
          /* Режим «сейчас» — живой запрос к ядру: считается по кнопке (ОЧ-44). */
          live:false, wlName:'',
          /* Витрина: отбор чипами и поиском, «мои виды» свёрнуты (§14.1, ОЧ-48). */

     разбором (§8). Иначе список и текст со временем разошлись бы.           */
  st.templates.forEach(t => t.editions.forEach(e => {
    if(e.layoutText) e.subs = parseSubs(e.layoutText); }));
  RP.state = st;
  /* Затравочные выпуски делаются НАСТОЯЩЕЙ операцией: снимок в журнале —
     тот, что произвёл движок, а не выписанный литералом.                    */
  const was = st.role;
  st.role = ROLES[1].title;                                   /* уполномоченный */
  RP.issue('t-overdue', {params:{asOf:'2026-06-01', dept:''}, kind:'окончательный',

  RP.issue('t-overdue', {params:{asOf:'2026-07-01', dept:''}, kind:'окончательный',

}

/* Лицо спрашивается отдельно от кредита, потому что вопросы разные: «по какому
   договору бумага» и «кому она ушла». Зеркало одно и то же (ADR-0167 §1).    */
RP.subjects = () => clone(OBJECTS.filter(o => o.type === 'borrower'));
RP.subjectsOf = objId => { const o = OBJ(objId); if(!o) return [];
  return (o.subjects || []).map(s => { const p = SUBJ(s.ref);
    return {ref:s.ref, role:s.role, name: p ? p.name : null, inn: p ? p.inn : null}; }); };
/* Кого назовёт бланк, видно ДО заказа: роль объявлена редакцией, лицо ищется по
   роли у объекта. Если такого лица нет — отказ виден на экране, а не на выпуске. */
RP.blankRecipient = (tid, objId) => { const t = TPL(tid); if(!t || t.kind !== 'бланк') return null;
  const ed = pubEd(t) || draftEd(t); const a = ed ? (ed.addressee || null) : null;
  const r = resolveAddressee(a, objId);
  return {kind: a ? a.kind : null, text: addresseeText(a),
    ok: r.ok, rec: r.ok ? clone(r.rec) : null, why: r.ok ? null : r.why}; };
function log(msg){ RP.state.log.unshift({at: RP.state.today, who: RP.who(), msg}); }
RP.log = () => clone(RP.state.log);

const TPL = id => RP.state.templates.find(t => t.id === id);
const ISS = id => RP.state.issues.find(i => i.id === id);
RP.TPL = TPL; RP.ISS = ISS;
const pubEd = t => t.editions.filter(e => e.state === 'опубликована').slice(-1)[0] || null;
const draftEd = t => t.editions.filter(e => e.state === 'черновик').slice(-1)[0] || null;

RP.draftEd = tid => { const t = TPL(tid); return t ? clone(draftEd(t)) : null; };

/* Период отчёта — месяц, ПРЕДШЕСТВУЮЩИЙ дате состояния: снимок на 1 июля
   отвечает за июнь. Обязательство и метка расхождения говорят периодом.      */
function periodOfAsOf(asOf){
  if(!asOf) return null;
  const y = +asOf.slice(0,4), m = +asOf.slice(5,7);
  const d = asOf.slice(8,10) === '01' ? (m === 1 ? (y-1)+'-12' : y+'-'+String(m-1).padStart(2,'0'))
                                      : asOf.slice(0,7);
  return MONTHS_N[+d.slice(5,7)-1]+' '+d.slice(0,4);
}
function asOfOfPeriod(period){
  return HIST_DATES.filter(d => periodOfAsOf(d) === period)[0] || null;
}
RP.periodOfAsOf = periodOfAsOf; RP.asOfOfPeriod = asOfOfPeriod;
RP.periods = () => clone(RP.state.periods);

/* Умолчание периода выведено, а не выбрано: последняя дата, у которой ЕСТЬ
   снимок. Иначе экран по умолчанию показывает числа, которыми нельзя
   отчитаться, и разница «посмотрел / сдал» размывается (ИО-26, ОЧ-44).      */
RP.hasSnapshot = asOf => !!asOf && HIST_DATES.indexOf(asOf) !== -1;
RP.defaultAsOf = () => HIST_DATES.slice().sort()[HIST_DATES.length - 1] || null;

/* ================== СПРАВОЧНИК ФОРМ: ОПЕРАЦИИ (ADR-0163) ==============
   Справочник ничего не считает и не выпускает: ни одного шва он не трогает.
   Всё, что он умеет, — ответить «шаблон заведён или нет» и назвать, к кому
   идти, если нет.                                                          */
RP.forms = () => clone(FORMS);
RP.formsOwner = () => FORMS_OWNER;
/* Реализующий шаблон ищется ПО ШАБЛОНАМ, а не хранится у формы: связь
   объявлена на шаблоне, и второго источника правды заводить незачем.       */
RP.formTpl = fid => (RP.state.templates.filter(t => t.form === fid)[0] || null);
RP.formOf = tid => { const t = TPL(tid); return t && t.form ? clone(FORM(t.form)) : null; };
/* ИО-24: одна форма — не более одного шаблона. Отказ НАЗЫВАЕТ первый вслух:
   это защита от легаси-копирования устройством, а не дисциплиной (ОЧ-39).  */
RP.linkForm = (tid, fid) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const f = FORM(fid);
  if(!f) return {ok:false, why:'формы «'+fid+'» в справочнике нет: справочник наполняется '+
    'согласованным перечнем, а не всеми строками каталога (ADR-0163)'};
  if(t.kind !== f.kind) return {ok:false, why:'форма «'+f.name+'» — '+f.kind+', а шаблон «'+
    t.name+'» — '+t.kind+': вид объявляет форма, шаблон её реализует'};
  const busy = RP.formTpl(fid);
  if(busy && busy.id !== tid) return {ok:false, why:'форму «'+f.name+'» уже реализует шаблон '+
    '«'+busy.name+'» ('+busy.id+', автор '+busy.owner+'). Одна форма — не более одного шаблона '+
    '(ИО-24): либо отказаться, либо признать, что вопрос ДРУГОЙ, и завести другую форму. '+
    'Разрез, который некуда положить, в название не кладут — он кладётся параметром редакции '+
    '(ОЧ-39, ADR-0163 §3)'};
  t.form = fid;
  log('шаблон «'+t.name+'» объявлен реализацией формы '+fid);
  return {ok:true, note:'связь объявлена на шаблоне: форма о том, чего у неё нет, не знает'};
};
/* Пробелы: обязательные формы, у которых шаблона нет. Только они и попадают
   на рабочие экраны — рабочая форма без шаблона остаётся пожеланием каталога,
   а показывать несогласованное на рабочем экране значит обещать (§4 ADR).   */
RP.formGaps = () => FORMS.filter(f => f.obligatory && !RP.formTpl(f.id)).map(f =>
  ({id:f.id, name:f.name, kind:f.kind, object:f.object, basis:clone(f.basis), to:f.to,
    nowhere: !!f.nowhere, who: FORMS_OWNER,
    why:'шаблон не заведён: выпускать нечего — выпуск предъявляет редакцию, а редакции нет '+
      '(ADR-0163 §5)'}));

/* ==================== ВИДИМОСТЬ ШАБЛОНОВ (§13.1) =====================
   Опубликованный шаблон виден тем, кто в круге. Черновик — ЛИЧНЫЙ: пока
   автор не попросил публикации, его не видит даже уполномоченный (ИО-1).    */
RP.visibleTemplates = () => {
  const v = RP.viewer();
  return RP.state.templates.filter(t => {
    const pub = pubEd(t);
    if(pub) return t.circle.indexOf(v.dept) !== -1 || v.scope.length === ALL_DEPTS.length;
    if(t.owner === v.who) return true;
    return !!t.asked && RP.isAuth();
  }).map(t => t.id);
};
RP.maySee = tid => RP.visibleTemplates().indexOf(tid) !== -1;

/* Состояние шаблона СЧИТАЕТСЯ, а не хранится: «неисполним» — это ответ на
   вопрос «что сейчас с перечнем и реестром», а не поле в записи.            */
RP.tplState = tid => {
  const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t);
  if(!ed) return {state:'черновик', why:'состав собран, но не опубликован: шаблоном его делает публикация (ИО-1)'};
  const b = brokenBy(t, ed);
  return b ? {state:'неисполним', why:b} : {state:'опубликован', why:null};
};
function brokenBy(t, ed){
  const list = SEAM.fieldList(ed.object);
  const lost = ed.fields.concat(ed.subs || []).filter(fid => !list.fields.some(f => f.id === fid));
  if(lost.length) return 'поле «'+lost[0]+'» объект «'+list.name+'» больше не объявляет — '+
    'перечень изменил его владелец ('+list.owner+'), шаблону нужна новая редакция';
  const gone = ed.stats.map(SEAM.statMeta).filter(s => s && s.withdrawn);
  if(gone.length) return 'показатель «'+gone[0].name+'» выведен '+fmt(gone[0].withdrawn)+
    ' — шаблону нужна новая редакция';
  /* Бланк без объявленного адресата неисполним: получателя пришлось бы выбирать
     на выпуске, а он часть вопроса, а не настройки минуты (ИО-28). Вид адресата
     проверяется тем же вызовом, что и при публикации (ADR-0168 §1).           */
  if(t.kind === 'бланк'){ const bad = addresseeCheck(ed.addressee); if(bad) return bad; }
  return null;
}
RP.brokenTemplates = () => RP.state.templates.filter(t => {
  const ed = pubEd(t); return ed && brokenBy(t, ed); })
  .map(t => ({id:t.id, name:t.name, why: brokenBy(t, pubEd(t))}));

/* ================= ПУБЛИКАЦИЯ: ГДЕ ЛОВЯТСЯ ОШИБКИ (§4) ================
   Всё проверяемое заранее проверяется ЗДЕСЬ, а не на выпуске: к моменту
   выпуска за экраном человек с задачей, а не с настройкой (ИО-7).           */
RP.publishChecks = tid => {
  const t = TPL(tid); if(!t) return [{ok:false, why:'шаблона нет'}];
  const ed = draftEd(t);
  if(!ed) return [{ok:false, why:'у шаблона нет черновой редакции: публиковать нечего'}];
  const list = SEAM.fieldList(ed.object);
  const out = [];
  /* 1. подстановка не из публичного перечня */
  (ed.subs || []).forEach(s => { if(!list.fields.some(f => f.id === s))
    out.push({check:'подстановка', ok:false,
      why:'в макете {{'+s+'}}, объект «'+list.name+'» такого поля не объявляет'}); });
  /* 2. показатель выведен из реестра */
  ed.stats.forEach(sid => { const m = SEAM.statMeta(sid);
    if(m && m.withdrawn) out.push({check:'показатель выведен', ok:false,
      why:'показатель «'+m.name+'» выведен '+fmt(m.withdrawn)+', шаблону нужна новая редакция'}); });
  /* 3. показатель неисчислим налету при режиме «сейчас» */
  if(ed.mode === 'сейчас') ed.stats.forEach(sid => { const m = SEAM.statMeta(sid);
    if(m && !m.live) out.push({check:'исчислимость налету', ok:false,
      why:'показатель «'+m.name+'» налету не берётся: '+m.why}); });
  /* 3а. бланк без объявленного адресата — или с видом/значением, которого не
     бывает. Проверяются оба: вид объявляет редакция, значение ведёт сосед. */
  if(t.kind === 'бланк'){ const badAddr = addresseeCheck(ed.addressee);
    if(badAddr) out.push({check:'адресат бланка', ok:false, why: badAddr}); }
  /* 4. нормативное основание, названное не публикующим */
  if(t.basisAsk) out.push({check:'основание', ok:false,
    why:'сослаться на пункт нормы может только публикующий: в личном черновике вписано «'+
      'п. '+t.basisAsk.point+' '+t.basisAsk.doc+'», уполномоченный называет основание сам'});
  /* 5. поле ядра переименовано или снято */
  ed.fields.forEach(fid => { if(!list.fields.some(f => f.id === fid))
    out.push({check:'поле ядра', ok:false,
      why:'поле «'+fid+'» объект «'+list.name+'» больше не объявляет: перечень изменил его '+
        'владелец ('+list.owner+') — виноват не шаблон'}); });
  /* 6. допустимое отклонение, которого не может быть: перечень отклонений —
     подмножество доступного, а не список пожеланий (ADR-0162 §1).          */
  const B = boundsOf(ed);
  B.cuts.forEach(c => { if(!CUT_NAMES[c]) out.push({check:'допустимое отклонение', ok:false,
    why:'разрезом «'+c+'» отчётность не разрезает: отклонения берутся из того же перечня, '+
      'что и состав'}); });
  B.stats.forEach(sid => { const m = SEAM.statMeta(sid);
    if(!m) out.push({check:'допустимое отклонение', ok:false,
      why:'показателя «'+sid+'» в реестре статистики нет: перечень отклонений — не список пожеланий'});
    else if(m.withdrawn) out.push({check:'допустимое отклонение', ok:false,
      why:'показатель «'+m.name+'» выведен '+fmt(m.withdrawn)+': разрешать экрану выведенное нечего'});
    else if(ed.mode === 'сейчас' && !m.live) out.push({check:'допустимое отклонение', ok:false,
      why:'показатель «'+m.name+'» налету не берётся: '+m.why+' — разрешить его экрану значит '+
        'пообещать невыполнимое'}); });
  return out;
};
RP.publish = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'публикует уполномоченный по отчётности: роль «'+
    RP.state.role+'» собирает личный черновик, но шаблоном его не делает (ИО-1, ADR-0156 §2)'};
  if(!RP.maySee(tid)) return {ok:false, why:'черновик «'+t.name+'» личный: пока автор ('+t.owner+
    ') не попросил публикации, его состав не виден никому'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'у шаблона нет черновой редакции: публиковать нечего'};
  const bad = RP.publishChecks(tid);
  if(bad.length) return {ok:false, why: bad[0].why, all: bad};
  ed.state = 'опубликована'; ed.since = RP.state.today; ed.at = RP.state.today; ed.by = RP.who();
  t.asked = false;
  log('опубликована редакция '+ed.n+' шаблона «'+t.name+'»');
  return {ok:true, note:'редакция '+ed.n+' опубликована '+fmt(RP.state.today)};
};
RP.askPublish = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(t.owner !== RP.who()) return {ok:false, why:'черновик чужой: попросить публикации может автор'};
  t.asked = true; log('черновик «'+t.name+'» передан на публикацию');
  return {ok:true, note:'уполномоченный увидит состав и проверит его §4'};
};
RP.setBasis = (tid, basis) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) { t.basisAsk = basis;
    return {ok:false, why:'сослаться на пункт нормы может только публикующий: основание «'+
      'п. '+basis.point+' '+basis.doc+'» записано в черновик как просьба, а не как основание'}; }
  t.basis = basis; t.basisAsk = null; log('основание шаблона «'+t.name+'» — п. '+basis.point);
  return {ok:true, note:'основание названо уполномоченным'};
};
/* Круг, расписание, «пригоден для обзора» и серия живут ВНЕ редакции: их
   правка не порождает новой редакции, потому что не меняет вопроса (§2.1).  */
RP.setCircle = (tid, depts) => { const t = TPL(tid);
  if(!RP.isAuth()) return {ok:false, why:'круг подразделений ведёт уполномоченный по отчётности'};
  t.circle = depts.slice(); log('круг шаблона «'+t.name+'» изменён');
  return {ok:true, note:'новой редакции не понадобилось: круг — не часть вопроса'}; };
RP.setSchedule = (tid, sch) => { const t = TPL(tid);
  if(!RP.isAuth()) return {ok:false, why:'расписание сдачи ведёт уполномоченный по отчётности'};
  t.schedule = sch; log('расписание шаблона «'+t.name+'» изменено');
  return {ok:true, note:'обязательства перечитаются из правила — календарь дат руками не ведётся'}; };

/* ==================== ДВИЖОК БЛАНКА (§8) ==============================
   Тот же закон: подстановки берутся из публичного перечня швом, своих полей
   у бланка нет. ==ДВИЖОК-БЛАНК==                                           */
function composeBlank(tpl, ed, objId, viewer, asOf){
  /* Бланк тоже бывает «на дату»: акт сверки говорит о состоянии на 1 января, и
     брать его из живого ядра значило бы напечатать сегодняшние числа под чужой
     датой. Тогда вход — тот же шов статистики, что у отчёта (волна 9).        */
  const dated = ed.mode === 'на дату';
  const src = dated ? SEAM.statRows(ed.object, asOf, {obj:objId}, viewer.scope.slice())
                    : SEAM.objectRows(ed.object, {obj:objId}, viewer.scope.slice());
  const list = SEAM.fieldList(ed.object);
  const row = src.rows[0] || null;
  const subs = (ed.subs || []).map(sid => {
    const f = list.fields.find(x => x.id === sid);
    return {id:sid, name: f ? f.name : null, lost: !f, value: row && f ? row[sid] : null};
  });
  /* Подставленный соседний снимок — та же мягкая помеха, что у отчёта: выпуск
     не запрещён, но окончательным не бывает (ADR-0152 §5, ИО-8).              */
  const soft = [];
  if(src.substituted) soft.push('снимка на '+fmt(asOf)+' у статистики нет: подставлен ближайший '+
    'на '+fmt(src.substituted)+' — акт на подпись по подставленной дате не уходит');
  return {row, subs, hidden: src.hidden, missing: !!src.missing, soft,
    substituted: src.substituted || null,
    passport:{asOf: dated ? src.passport.asOf : null, asked: dated ? asOf : null,
      mode:ed.mode, frozen:false, scope: viewer.scope.map(deptName),
      edition: ed.n, template: tpl.name, params: dated ? {obj:objId, asOf} : {obj:objId},
      hidden: src.hidden, seams:[dated ? 'statRows' : 'objectRows']}};
}
/* ==/ДВИЖОК-БЛАНК== */

/* ========================= ПОКАЗ (§5, ADR-0162) =======================
   Показ — не выпуск, но и не пустое место: снимка не морозит, номера не
   тратит, следа в журнале не оставляет, — и потому несёт ШАПКУ. Скриншот
   уходит в переписку и обязан отвечать за себя сам (ИО-6, ADR-0162 §5).    */
function showHead(t, ed, params, v, chk, viewName, dropped){
  return {kind:'показ', label:'не выпуск', template: t.name, edition: ed.n, editionState: ed.state,
    mode: ed.mode, asOf: ed.mode === 'на дату' ? (params.asOf || null) : null,
    params: clone(params), scope: v.scope.map(deptName), who: v.who,
    view: viewName || null, dropped: (dropped || []).slice(),
    composition: chk ? shownOf(withTwist(ed, chk.twist), chk.twist.drill) : null,
    deviated: chk ? chk.deviated : false,
    note:'снимка не морозит, номера не тратит, следа в журнале не оставляет'};
}
RP.show = (tid, params, twist) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const ed = pubEd(t) || draftEd(t);
  if(!ed) return {ok:false, why:'у шаблона нет ни опубликованной редакции, ни черновой'};
  const v = RP.viewer();
  const pr = params || {};
  if(t.kind === 'бланк'){
    if(twist && (twist.cuts || twist.stats || twist.drill != null)) return {ok:false,
      why:'бланк не крутится: он говорит об ОДНОМ объекте — ни разрезов, ни показателей у него '+
        'нет вовсе (§2.2)'};
    return {ok:true, kind:'бланк', data: composeBlank(t, ed, pr.obj, v, pr.asOf), deviated:false,
      twist:null, head: showHead(t, ed, pr, v, null, null, null)};
  }
  const chk = twistCheck(ed, twist || null);
  if(!chk.ok) return chk;
  const edEff = withTwist(ed, chk.twist);
  return {ok:true, kind:'отчёт', data: compose(t, edEff, pr, v), twist: chk.twist,
    deviated: chk.deviated, dev: chk.dev,
    head: showHead(t, ed, pr, v, chk, twist && twist.view, twist && twist.dropped)};
};
/* Показ по умолчанию — тот же вызов без накрутки. */
RP.preview = (tid, params) => RP.show(tid, params, null);

/* ======================= ВИД — ВОСЬМАЯ СУЩНОСТЬ (§2.8) ================
   Личная именованная накрутка: «как я привык смотреть этот отчёт». Не
   черновик и не редакция — живёт ПОВЕРХ чужой опубликованной редакции,
   чисел не хранит и на публикацию не идёт никогда (ADR-0162 §3).          */
RP.bounds = tid => { const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t) || draftEd(t); if(!ed) return null;
  const B = boundsOf(ed), b = baseOf(ed);
  return {ed: ed.n, cuts: B.cuts.slice(), stats: B.stats.slice(), drill: B.drill,
    cutNames: B.cuts.map(cutName), statNames: B.stats.map(statName),
    base:{cuts: b.cuts.slice(), stats: b.stats.slice(), drill: b.drill, layout: b.layout},
    layouts: LAYOUTS.slice()}; };
RP.defaultOf = tid => { const b = RP.bounds(tid); return b ? b.base : null; };
RP.layouts = () => LAYOUTS.slice();

RP.saveView = (tid, name, twist) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(t.kind === 'бланк') return {ok:false, why:'у бланка вида не бывает: крутить нечего (§2.2)'};
  const ed = pubEd(t);
  if(!ed) return {ok:false, why:'вид живёт ПОВЕРХ опубликованной редакции, а у «'+t.name+
    '» её нет: пока состав личный черновик, вид ему не нужен (ИО-1)'};
  const nm = String(name || '').trim();
  if(!nm) return {ok:false, why:'у вида должно быть имя: безымянный вид — это состояние экрана, '+
    'а не способ смотреть'};
  const chk = twistCheck(ed, twist || null);
  if(!chk.ok) return {ok:false, why: chk.why};
  if(RP.state.views.some(x => x.owner === RP.who() && x.tpl === tid && x.name === nm))
    return {ok:false, why:'вид «'+nm+'» у вас уже есть: имя различает ваши способы смотреть'};
  const id = 'ВД-' + (++RP.state.vseq);
  RP.state.views.push({id, name: nm, tpl: tid, owner: RP.who(), at: RP.state.today,
    twist:{cuts: chk.twist.cuts.slice(), stats: chk.twist.stats.slice(),
           drill: chk.twist.drill, layout: chk.twist.layout}});
  log('сохранён вид «'+nm+'» для шаблона «'+t.name+'»');
  return {ok:true, id, note:'вид личный: передают не его, а выпуск (ADR-0162 §3)'};
};
RP.myViews = tid => RP.state.views
  .filter(x => x.owner === RP.who() && (!tid || x.tpl === tid)).map(clone);
RP.deleteView = id => { const i = RP.state.views.findIndex(x => x.id === id);
  if(i === -1) return {ok:false, why:'вида нет'};
  if(RP.state.views[i].owner !== RP.who()) return {ok:false, why:'вид чужой: он личный'};
  const nm = RP.state.views[i].name; RP.state.views.splice(i, 1);
  log('вид «'+nm+'» удалён');
  return {ok:true, note:'вид удалён; ни один выпуск от этого не изменился — паспорт хранит '+
    'показанный состав целиком, а не ссылку на вид (ИО-22)'}; };
RP.shareView = (id, who) => { const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  return {ok:false, why:'вид «'+vw.name+'» не передаётся '+(who ? '('+who+') ' : '')+
    '— он личный. Общим состав становится ровно одним способом — публикацией редакции '+
    '(ADR-0156); передают ВЫПУСК: у него есть паспорт, дата состояния и показанный состав'}; };
RP.publishView = id => { const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  return {ok:false, why:'вид «'+vw.name+'» на публикацию не идёт: он живёт поверх чужой '+
    'опубликованной редакции, а не вместо неё. Нужен общий состав — нужна новая редакция '+
    'шаблона (ИО-1, ADR-0162 §3)'}; };

/* Жёсткая часть состава возвращается в показ В ОБЪЯВЛЕННОМ ПОРЯДКЕ: вид
   переживает правку редакции, но не отменяет её (ADR-0162 §4).            */
function reconcile(baseList, freeList, kept){
  const hard = baseList.filter(x => freeList.indexOf(x) === -1);
  const res = kept.slice();
  hard.filter(x => res.indexOf(x) === -1).forEach(x => {
    const prev = hard[hard.indexOf(x) - 1];
    const at = prev ? res.indexOf(prev) + 1 : 0;
    res.splice(at < 0 ? res.length : at, 0, x);
  });
  return res;
}
