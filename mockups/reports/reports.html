  if((i.formats || []).indexOf(fmt) === -1) return {ok:false,
    why:'формата «'+fmt+'» этот отчёт не объявляет: перечень форматов — часть листа выгрузки '+
    'в редакции '+i.ed+', а не набор кнопок экрана ('+(i.formats || []).join(' · ')+')'};
  log('выпуск '+i.id+' выгружен в '+fmt);
  return {ok:true, note:'файл '+fmt+' отдан; лист — '+i.passport.sheet.orient+', полосы: '+
    i.passport.sheet.bands.join(' → ')};
};
/* ========== ВЫГРУЗКА ПОКАЗАННОГО — ЭТО ВЫПУСК (ОЧ-49, §14.4) ==========
   «Выгрузить в Excel» выглядит безобидной кнопкой, а по канону выпуском
   становится ровно то, что вышло за пределы экрана. Поэтому выгрузка показа —
   ПРЕДВАРИТЕЛЬНЫЙ ВЫПУСК со строкой в журнале и паспортом; иначе Excel снова
   станет дырой, через которую числа уходят без даты, автора и состава.
   Для человека это по-прежнему одна кнопка: заказ он не заказывает.         */
RP.exportShown = (tid, params, twist, fmt) => {
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const i = ISS(res.id);
  const f = fmt || (i.formats || []).filter(x => x !== 'pdf')[0] || (i.formats || [])[0];
  const ex = RP.exportIssue(res.id, f);
  if(!ex.ok) return ex;
  return {ok:true, id: res.id, fmt: f, label: i.passport.label, note:'выгрузка — это выпуск '+res.id+
    ' (предварительный): строка в журнале, паспорт и показанный состав целиком, в файле — «'+
    i.passport.label+'». Файл живёт '+dayWord(FILE_DAYS)+' и гаснет, строка остаётся'};
};
/* Рабочий список тоже идёт через предварительный выпуск: список по определению
   ЗАМОРОЖЕННЫЙ состав, а морозить нечего, пока у ответа нет паспорта (ИО-14). */
RP.worklistShown = (tid, params, twist, name) => {
  if(!String(name || '').trim()) return {ok:false, why:'список называется при создании: '+
    'безымянный список нельзя передать и нельзя спросить «чем кончилось» (ИО-14)'};
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const wl = RP.makeWorklist(res.id, String(name).trim());
  if(!wl.ok) return wl;
  return {ok:true, id: wl.id, issue: res.id, note:'список '+wl.id+' отобран выпуском '+res.id+
    ': состав заморожен паспортом, а не кнопкой. '+wl.note};
};

/* ======================= ПРОВАЛ ИЗ ЛЮБОЙ ЦИФРЫ =========================
   Клик по итогу, подытогу или ячейке даёт объекты, из которых число
   сложилось, — на ту же дату и из того же снимка. Узел спрашивается тем же
   деревом statSlice, только на уровень глубже — до объекта: вклад каждого
   объекта считает статистика, а не отчётность, поэтому сумма списка равна
   ячейке по устройству. У денежного показателя и счёта в список идут только
   объекты с ненулевым вкладом: у «Просрочено» — кредиты с просрочкой, а не
   все по фильтру отчёта. Доля и средняя не складываются — у них список
   объектов узла без суммы.                                                  */
RP.drill = (tid, params, twist, node) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'провал бывает у числа отчёта: бланк говорит об одном объекте'};
  const ed = liveEd(t) || draftEd(t); if(!ed) return {ok:false, why:'у отчёта нет действующей редакции'};
  const chk = twistCheck(ed, twist || null); if(!chk.ok) return chk;
  const sid = node && node.stat, meta = SEAM.statMeta(sid);
  if(!meta) return {ok:false, why:'провал спрашивают у числа показателя, а показатель не назван'};
  if(chk.twist.stats.indexOf(sid) === -1) return {ok:false, why:'«'+meta.name+'» в показе нет: '+
    'проваливаются в то число, которое видно'};
  const path = (node.path || []).slice();
  const v = RP.viewer(), scope = v.scope.slice(), pr = params || {};
  const asOf = ed.mode === 'на дату' ? pr.asOf : null;
  const cut = {dept: pr.dept || null, ids: pr.ids || null};
  const tree = SEAM.statSlice(sid, path.map(p => p.by).concat('id'), cut, asOf, scope);
  if(tree.why) return {ok:false, why: tree.why};
  let level = tree.groups, cell = tree.value;
  for(const p of path){ const g = (level || []).find(x => x.key === p.key);
    if(!g) return {ok:false, why:'узла «'+levelName(p.by, p.key)+'» в ответе нет'};
    cell = g.value; level = g.children || []; }
  const src = asOf ? SEAM.statRows(ed.object, asOf, cut, scope) : SEAM.objectRows(ed.object, cut, scope);
  const additive = meta.unit === 'сом' || meta.unit === 'ед.';
  let items = (level || []).map(g => { const r = src.rows.find(x => x.id === g.key) || {};
    return {id: g.key, no: r.no, borrower: r.borrower, dept: r.dept, part: g.value}; });
  if(additive) items = items.filter(x => x.part !== 0);
  const sum = additive ? items.reduce((a, x) => a + x.part, 0) : null;
  return {ok:true, tpl: tid, stat: sid, statName: meta.name, unit: meta.unit, additive,
    node: path.map(p => levelName(p.by, p.key)).join(' → ') || 'итог',
    path, asOf: tree.passport ? tree.passport.asOf : null, mode: ed.mode,
    cell, sum, equal: additive ? sum === cell : null, items,
    hidden: tree.hidden || 0, params: clone(pr), twist: twist ? clone(twist) : null};
};
/* Рабочий список из провала: тот же замороженный состав, отобранный не
   выпуском, а щелчком по числу. Объекты — те, что в списке провала. */
RP.worklistFromDrill = (tid, params, twist, node, name) => {
  const nm = String(name || '').trim();
  if(!nm) return {ok:false, why:'список называется при создании: безымянный список нельзя передать '+
    'и нельзя спросить «чем кончилось»'};
  const d = RP.drill(tid, params, twist, node); if(!d.ok) return d;
  if(!d.items.length) return {ok:false, why:'в провале нет объектов: замораживать нечего'};
  const id = 'РС-' + (++RP.state.wseq);
  RP.state.worklists.push({id, name: nm, from:'провал', fromName: TPL(tid).name+' · '+d.statName+
    ' · '+d.node+(d.asOf ? ' на '+fmt(d.asOf) : ''),
    at: RP.state.today, by: RP.who(), dept: null, state:'открыт', closed:null, why:null,
    objects: d.items.map(x => x.id), marks:{}});
  log('рабочий список «'+nm+'» заведён провалом, объектов: '+d.items.length);
  return {ok:true, id, note:'список «'+nm+'» заведён из провала: '+objWord(d.items.length)+
    ', состав заморожен; отметки «отработан» ставятся у каждого объекта'};
};
/* Отметка «отработан» — пометка «по этому прошёлся», а не факт работы: звонок
   и претензия записываются в модуле-владельце, список на них ссылается.    */
RP.markWorked = (wlId, objId, comment) => {
  const w = WL(wlId); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'список закрыт '+fmt(w.closed)+': отметки больше не ставятся'};
  if(w.objects.indexOf(objId) === -1) return {ok:false, why:'объекта в составе списка нет: состав заморожен'};
  w.marks = w.marks || {};
  w.marks[objId] = {by: RP.who(), at: RP.state.today, comment: String(comment || '').trim()};
  const pr = RP.worklistProgress(wlId);
  return {ok:true, note:'отмечен отработанным — '+pr.done+' из '+pr.total};
};
RP.unmarkWorked = (wlId, objId) => {
  const w = WL(wlId); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'список закрыт: отметки не снимаются'};
  if(!w.marks || !w.marks[objId]) return {ok:false, why:'отметки нет'};
  delete w.marks[objId];
  return {ok:true, note:'отметка снята'};
};
RP.worklistProgress = wlId => { const w = WL(wlId); if(!w) return null;
  const done = w.objects.filter(o => w.marks && w.marks[o]).length;
  return {done, total: w.objects.length}; };

/* «📌 на дашборд» — только ссылка. Плитка хранит, на какой отчёт или вид она
   смотрит и с какими значениями параметров; раскладку, вид показа и
   светофор ведёт модуль дашборда, своего экрана плиток у отчётности нет.   */
RP.pinToDashboard = (tid, viewId, params) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'бланк говорит об одном объекте: на дашборд ставят '+
    'отчёт или вид'};
  if(!RP.maySee(tid)) return {ok:false, why:'этого отчёта вам не видно'};
  const vw = viewId ? RP.state.views.find(x => x.id === viewId) : null;
  if(viewId && !vw) return {ok:false, why:'вида нет'};
  const what = vw ? 'вид «'+vw.name+'»' : 'отчёт «'+t.name+'»';
  return {ok:true, ref:{tpl: tid, view: vw ? vw.id : null, params: clone(params || {})},
    note:'плитка ссылается на '+(vw ? 'этот вид' : 'этот отчёт')+' ('+what+'); раскладка — в модуле дашборда'};
};

/* Легаси даёт «На дату» КАЖДОЙ ячейке: один лист может смешать остаток на
   01.07 со ставкой на 01.08, и ответ перестаёт быть ответом на одну дату.   */
RP.setColumnDate = (tid, fid, date) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  const list = SEAM.fieldList((liveEd(t) || draftEd(t)).object);
  const f = list.fields.find(x => x.id === fid);
  return {ok:false, why:'дата состояния у ответа ОДНА: «'+(f ? f.name : fid)+'» нельзя взять '+
    'на '+fmt(date)+', пока остальные столбцы стоят на другой дате — иначе лист перестаёт быть '+
    'ответом на один вопрос, а паспорт перестаёт быть проверяемым (ИО-19). Нужна вторая дата — '+
    'это сравнение двух состояний, отдельный вопрос (§19 п. 6)'};
};
/* Итог по уровню НЕ складывается модулем. Доказательство — числами.
   Волна 13: сторож остаётся, но довод у него теперь другой. Раньше он звучал
   «нам нельзя складывать»; теперь — «складывать НЕЧЕГО»: statSlice отдаёт
   дерево, и число уровня в нём уже посчитано статистикой по строкам уровня
   (ИС-24, ADR-0176 §6). Сторож показывает, во что обошлась бы самодеятельность,
   если бы модуль всё-таки сложил детей вместо того, чтобы прочитать узел.   */
RP.foldLevelsSelf = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  const ed = liveEd(t) || draftEd(t);
  const sid = (ed.stats || [])[0];
  if(!sid) return {ok:false, why:'показателей у редакции нет — складывать нечего'};
  const v = RP.viewer();
  const cut = {dept:null, ids:null};
  const asOf = ed.mode === 'на дату' ? RP.state.sel.params.asOf : null;
  const tree = SEAM.statSlice(sid, 'dept', cut, asOf, v.scope.slice());
  const sum = tree.groups.reduce((a, g) => a + (g.value || 0), 0);
  const meta = SEAM.statMeta(sid);
  /* Округлять доказательство нельзя: разница видна как раз в десятых.       */
  const exact = v => v == null ? '—' : String(Math.round(v * 10) / 10).replace('.', ',');
  return {ok:false, sum, real: tree.value, stat: meta ? meta.name : sid,
    unit: meta ? meta.unit : '', parts: tree.groups.length,
    why:'модуль не складывает уровни сам: «'+(meta ? meta.name : sid)+'» по '+
      tree.groups.length+' подразделениям в сумме даёт '+exact(sum)+' '+(meta ? meta.unit : '')+
      ', а корень того же дерева равен '+exact(tree.value)+' '+(meta ? meta.unit : '')+
      '. Доля и средняя не аддитивны — число уровня приходит узлом дерева, ' +
      'посчитанным статистикой по строкам уровня (ИО-17, ИС-24)'};
};
/* Легаси хранит отбор внутри «шаблона» списком объектов — состав и правило
   слиты, и «почему объект здесь» ответить нечем (ОЧ-28).                    */
RP.ruleAsWorklist = (name, rule) => ({ok:false, why:'правило отбора «'+(rule || 'остаток > 100 млн')+
  '» — не рабочий список: список это ЗАМОРОЖЕННЫЙ СОСТАВ, отобранный выпуском в момент времени, '+
  'и он отвечает «чем кончилось» по каждому объекту (ИО-14). Правило же живёт параметром '+
  'редакции и каждый раз даёт новый состав. Слить их — потерять и то и другое (§9)'});

RP.docxNote = () => ({ok:false, why:'docx — формат черновика: наружу с получателем уходит только '+
  'pdf (ИО-10). Другой текст насовсем делается правкой макета и новой редакцией, а не правкой '+
  'выпущенного файла (§8)'});

/* ===================== РАБОЧИЕ СПИСКИ (§9, ИО-14) =====================
   Список отбирается ВЫПУСКОМ, называется и замораживается. Чисел не хранит —
   только объекты; их величины всегда текущие и берутся швом заново.          */
RP.makeWorklist = (issueId, name) => {
  const i = ISS(issueId); if(!i) return {ok:false, why:'выпуска нет'};
  if(i.kindTpl !== 'отчёт') return {ok:false, why:'список отбирается отчётом о множестве объектов: '+
    'бланк говорит об одном, отбирать из него нечего'};
  if(!name) return {ok:false, why:'список называется при создании: безымянный список нельзя передать '+
    'и нельзя спросить «чем кончилось»'};
  const rows = i.snapshot && i.snapshot.rows ? i.snapshot.rows
    : compose(TPL(i.tpl), TPL(i.tpl).editions.find(e => e.n === i.ed), i.params, RP.viewer()).rows;
  if(!rows.length) return {ok:false, why:'в выпуске нет строк: замораживать нечего'};
  const id = 'РС-' + (++RP.state.wseq);
  RP.state.worklists.push({id, name, from: i.id, fromName: i.tplName,
    at: RP.state.today, by: RP.who(), dept: null, state:'открыт', closed:null, why:null,
    objects: rows.map(r => r.id), marks:{}});
  log('рабочий список «'+name+'» отобран выпуском '+i.id+', объектов: '+rows.length);
  return {ok:true, id, note:'состав заморожен: '+objWord(rows.length)+
    '; чисел список не хранит — величины всегда текущие'};
};
RP.worklistRows = id => {
  const w = WL(id); if(!w) return null;
  const v = RP.viewer();
  const src = SEAM.objectRows('credit', {ids: w.objects.slice()}, v.scope.slice());
  const seen = {}; src.rows.forEach(r => { seen[r.id] = r; });
  return {
    rows: w.objects.map(oid => seen[oid] || null),
    hidden: w.objects.length - src.rows.length,
    gone: src.rows.filter(r => r.closed).length
  };
};
RP.handWorklist = (id, dept) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, но не передаётся: '+
    'работа по нему окончена ('+fmt(w.closed)+')'};
  w.dept = dept;
  log('список «'+w.name+'» передан подразделению «'+deptName(dept)+'»');
  return {ok:true, note:'список видят все, кто в круге подразделения; поручений он не несёт (ИО-13)'};
};
RP.addToWorklist = (id, objId) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, не пополняется'};
  return {ok:false, why:'состав рабочего списка заморожен: он отобран выпуском '+w.from+
    ' и после названия не пополняется — иначе «обзвонили всех» перестаёт быть проверяемым (ИО-14). '+
    'Нужен другой состав — отберите новым выпуском'};
};
RP.closeWorklist = (id, why) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'список уже закрыт '+fmt(w.closed)};
  w.state = 'закрыт'; w.closed = RP.state.today; w.why = why || 'работа окончена';
  log('список «'+w.name+'» закрыт: '+w.why);
  return {ok:true, note:'закрытый список читается, но не пополняется; строки остаются на месте'};
};
RP.doRuleList = () => act(RP.ruleAsWorklist('крупные кредиты', 'остаток > 100 млн'));
RP.deleteWorklist = id => ({ok:false, why:'рабочий список не стирается — он кончается ЗАКРЫТИЕМ: '+
  'стёртый список отвечает неправдой на вопрос «кого обзванивали» (ИО-14, §9)'});
RP.worklistTask = id => ({ok:false, why:'рабочий список никому ничего не поручает: у поручения '+
  'должен быть автор, отвечающий за нагрузку (ИО-13, ADR-0160)'});
const WL = id => RP.state.worklists.find(w => w.id === id);
RP.WL = WL;
RP.visibleWorklists = () => {
  const v = RP.viewer();
  return RP.state.worklists.filter(w => w.by === RP.who() ||
    (w.dept && v.scope.indexOf(w.dept) !== -1));
};
/* Список — законный параметр отбора следующего выпуска. Пятого шва он не
   потребовал: перечень объектов уходит в РАЗРЕЗ и спрашивается тем же швом. */
RP.issueByWorklist = (tid, wlId, spec) => {
  const w = WL(wlId); if(!w) return {ok:false, why:'списка нет'};
  const sp = clone(spec || {});
  sp.params = sp.params || {};
  sp.params.ids = w.objects.slice(); sp.params.worklist = w.id;
  return RP.issue(tid, sp);
};
/* Демонстрация выбытия: ядро закрыло кредит уже ПОСЛЕ заморозки состава.    */
RP.demoCloseObject = objId => {
  const o = OBJ(objId); if(!o) return {ok:false, why:'объекта нет'};
  o.closed = RP.state.today; o.status = 'закрыт'; o.debt_main = 0; o.days = 0;
  log('ядро закрыло кредит '+o.no);
  return {ok:true, note:'в рабочих списках он останется строкой «закрыт '+fmt(RP.state.today)+
    '» — выбывший показан выбывшим, а не исчезает (§9)'};
};

/* ============================== ЭКРАНЫ =============================== */
const pill = (t, c) => '<span class="pill'+(c?' '+c:'')+'">'+esc(t)+'</span>';
const kv = rows => '<div class="kv">'+rows.map(r =>
  '<div class="k">'+esc(r[0])+'</div><div class="v">'+(r[2] ? r[1] : esc(r[1]))+'</div>').join('')+'</div>';
const stateCls = s => s === 'утверждён' ? 'ok' : s === 'неисполним' ? 'err' : 'neutral';
const oblCls = s => s === 'сдано' ? 'ok' : s === 'сдано с опозданием' ? 'warn'
  : s === 'просрочено' ? 'err' : 'info';

function passportBox(p, frozen){
  const rows = [];
  if(p.label) rows.push(['метка в файле', p.label]);
  rows.push(['режим', p.mode]);
  if(p.mode === 'на дату') rows.push(['состояние на', fmt(p.asOf)]);
  if(p.dates && p.dates.length) rows.push(['колонки-даты', p.dates.join('; ')]);
  if(p.sources && p.sources.length) rows.push(['источник колонок', p.sources.join('; ')]);
  if(p.legacyGaps && p.legacyGaps.length) rows.push(['нет в легаси', p.legacyGaps.join('; ')]);
  rows.push(['редакция', 'ред. '+p.edition]);
  rows.push(['область видимости', p.scope.join(', ')]);
  if(p.hidden) rows.push(['скрыто видимостью', objWord(p.hidden)+' — охват ответа неполный']);
  if(p.levels && p.levels.length) rows.push(['уровни разрезов', p.levels.join('; ')]);
  if(p.rounding && p.rounding.length) rows.push(['разрядность', p.rounding.join('; ')]);
  if(p.sheet) rows.push(['лист выгрузки', p.sheet.orient+'; полосы: '+p.sheet.bands.join(' → ')+
    '; форматы: '+p.sheet.formats.join(' · ')]);
  rows.push(['спрошенные швы', p.seams && p.seams.length ? p.seams.join(', ')
    : (p.ordered ? 'ещё ни одного — заказ принят, числа не спрошены' : 'objectRows')]);
  rows.push(['числа', frozen ? 'заморожены снимком' : 'живые, пересчитываются при каждом показе']);
  return '<div class="snap'+(frozen?'':' prelim')+'">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
}

/* Шапка ПОКАЗА: то же обещание, что у паспорта, распространённое на экран —
   скриншот уходит в переписку и обязан отвечать за себя сам (ADR-0162 §5). */
function showBox(head){
  if(!head) return '';
  const rows = [['показ', 'НЕ ВЫПУСК — '+head.note]];
  rows.push(['отчёт', head.template+' · '+
    (head.level === 'общий' ? 'общий, не официальный · версия '+head.version
      : (head.level === 'личный' ? 'личный' : 'официальный · ред. '+head.edition))+
    (head.editionState === 'черновик' ? ' (черновик: личный состав)' : '')]);
  if(head.changed) rows.push(['изменён', head.changed]);
  rows.push(['режим', head.mode]);
  if(head.asOf) rows.push(['состояние на', fmt(head.asOf)]);
  rows.push(['область видимости', head.scope.join(', ')]);
  rows.push(['смотрит', head.who]);
  if(head.composition) rows.push(['показанный состав',
    'разрезы: '+(head.composition.cuts.join(' → ') || 'нет')+
    '; показатели: '+(head.composition.stats.join('; ') || 'нет')+
    '; строки объектов: '+(head.composition.drill ? 'печатаются' : 'не печатаются — спрошены '+
      'только итоги разрезов')+'; раскладка: '+head.composition.layout+
    ((head.composition.formulas || []).length ? '; своя формула: '+head.composition.formulas.join('; ') : '')]);
  rows.push(['состав', head.deviated ? head.deviatedLabel
    : (head.level === 'официальный' ? 'утверждённый' : 'как сохранён')]);
  if(head.view) rows.push(['вид', head.view+' — личный: передают не его, а выпуск']);
  let h = '';
  if(head.deviated && head.level === 'официальный') h += '<div class="banner warn devmark"><b>'+
    esc(DEVIATED)+'.</b> Смотреть и выгружать так можно — выгрузка напечатает ту же пометку; '+
    'сдаётся только утверждённый состав.<div class="btn-row"><button class="btn btn-primary btn-sm" '+
    'onclick="RP.twistReset()">Вернуть утверждённый</button></div></div>';
  h += '<div class="snap prelim">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
  if(head.dropped && head.dropped.length) h += '<div class="banner warn"><b>Вид сверен с '+
    'отчётом.</b> '+head.dropped.map(esc).join('; ')+'. Отвалившееся названо, остальное '+
    'работает — молчаливой подмены не бывает.</div>';
  return h;
}

/* ===================== ВИТРИНА «ОТЧЁТНОСТЬ» (§14.1) ===================
   Стол ПОТРЕБИТЕЛЯ. Перечисляет то же, что реестр шаблонов, — и потому
   соблазн обойтись одним списком был силён (ОЧ-41). Не обошлись: реестр
   ОБЯЗАН показывать то, что витрине показывать вредно — «неисполним»,
   «личный черновик Осмоновой», «публикации не просили». Это кухня объявления
   состава, и потребителю она мешает.

   Группировка — по ОБЯЗАТЕЛЬНОСТИ, а не по объекту: на данных каталога
   объектная разбивка разваливается (кредит 13 форм, остальные четырнадцать
   объектов по одной — оглавление, где половина пунктов сама себе раздел,
   ОЧ-42). Объект не выброшен, а стал чипом.                                */
/* Основание отдаётся разобранным: пункт и документ живут в разных местах
   строки, а склеенная строка нужна тем, кто печатает основание целиком.   */
const basisOf = b => b && ({
  point: b.point ? 'п. '+b.point+(b.sub ? ' '+b.sub : '') : null, doc: b.doc,
  text: (b.point ? 'п. '+b.point+(b.sub ? ' '+b.sub : '')+' ' : '')+b.doc });
RP.showcase = () => {
  const v = RP.viewer(), obl = RP.obligations(), rows = [];
  RP.state.templates.forEach(t => {
    const ed = pubEd(t);
    if(!ed) return;                    /* черновик — кухня реестра, не витрина (ИО-1) */
    const f = t.form ? FORM(t.form) : null;
    const st = RP.tplState(t.id);
    const inCircle = t.circle.indexOf(v.dept) !== -1 || v.scope.length === ALL_DEPTS.length;
    const mine = obl.filter(o => o.tpl === t.id &&
      (t.circle.indexOf(v.dept) !== -1 ? o.dept === v.dept : true));
    const cur = mine.length ? mine[mine.length - 1] : null;
    const fin = RP.state.issues.filter(i => i.tpl === t.id && i.kind === 'окончательный' &&
      i.recipient).slice(-1)[0] || null;
    rows.push({
      kind:'шаблон', id: t.id, form: t.form || null, name: t.name, tplKind: t.kind, compo: compoText(t),
      object: SEAM.fieldList(ed.object).name,
      basis: basisOf(t.basis), to: f ? f.to : null,
      obligatory: !!(f && f.obligatory), state: st.state, why: st.why,
      schedule: t.schedule ? t.schedule.text : null,
      obligation: cur ? {period: cur.period, due: cur.due, state: cur.state, who: cur.who, to: cur.toName} : null,
      lastFinal: fin ? {id: fin.id, at: fin.at, to: fin.recipient.name, number: issueNumber(fin)} : null,
      submits: RP.whoSubmits(t.id),
      access: inCircle ? {ok:true} : {ok:false,
        why:'не в круге подразделения «'+deptName(v.dept)+'»: круг ведёт уполномоченный',
        who: t.circle.map(deptName).join('; ')}
    });
  });
  /* Незаведённые ОБЯЗАТЕЛЬНЫЕ формы — строкой без кнопки. Круга у них нет,
     потому что нет шаблона, а основание публично: оно в норме (§13.7).      */
  RP.formGaps().forEach(g => rows.push({
    kind:'норма', id: g.id, form: g.id, name: g.name, tplKind: g.kind, object: g.object, compo: g.object,
    basis: basisOf(g.basis),
    obligatory:true, state:'не заведён', why: g.why, schedule:null,
    obligation:null, lastFinal:null, submits:null, nowhere: g.nowhere, to: g.to,
    access:{ok:true}, goTo: g.who
  }));
  const key = r => r.obligation && r.obligation.due ? r.obligation.due : '9999-99-99';
  const grp = ob => rows.filter(r => r.obligatory === ob)
    .sort((a, b) => (a.access.ok === b.access.ok ? 0 : (a.access.ok ? -1 : 1)) ||
                    key(a).localeCompare(key(b)) || a.name.localeCompare(b.name));
  return {must: grp(true), rest: grp(false)};
};
RP.scSet = (k, val) => { RP.state.sel[k] = val; render(); };
RP.openForm = tid => { const t = TPL(tid);
  if(!t) return act({ok:false, why:'отчёта или бланка нет'});
  if(t.kind === 'бланк') return RP.whereBlank(tid);
  RP.state.sel.tpl = tid; RP.state.sel.twist = null; RP.state.sel.view = null;
  RP.state.sel.dropped = null; RP.state.sel.live = false;
  RP.state.view = 'issue'; render(); };
/* Бланк в витрине — тупик: у него нет ни фильтров, ни параметров, есть один
   вопрос «о ком». На трёх тестовых записях выпадашка работает, на живых
   двенадцати тысячах — нет (ОЧ-43). Потому кнопка ведёт не на формирование,
   а на «где печатается»: перечень объектов держит сосед, а не отчётность.  */
RP.whereBlank = tid => { const t = TPL(tid); if(!t) return act({ok:false, why:'отчёта или бланка нет'});
  return act({ok:true, note:'«'+t.name+'» печатается из КАРТОЧКИ объекта или из рабочего '+
    'списка — там объект уже назван. Своего перечня объектов витрина не держит: сосед '+
    'спрашивает отчётность швом «какие бланки применимы к объекту этого вида и видны '+
    'смотрящему», а не наоборот (§16, ОЧ-43)'}); };
RP.openViewOf = vid => { const vw = RP.state.views.find(x => x.id === vid);
  if(!vw) return act({ok:false, why:'вида нет'});
  RP.state.sel.live = false; RP.state.view = 'issue';
  RP.useView(vid); };                /* один прогон: вид применяется на входе (ОЧ-48) */

function oblPill(o){
  if(!o) return '<span class="muted small">по требованию</span>';
  const cls = o.state === 'просрочено' ? 'err' : (o.state === 'ожидается' ? 'warn' :
    (o.state === 'сдано с опозданием' ? 'warn' : 'ok'));
  return pill(o.state, cls)+'<div class="small">'+esc(o.period)+' · срок '+fmt(o.due)+'</div>';
}
/* Редакция Порядка одна на все строки витрины — повторённая одиннадцать раз, она
   шум; её место в карточке формы, где решают, по какой редакции выпускать.    */
const docShort = d => String(d).replace(/\s*\(ред\.[^)]*\)/, '');
/* Первичное деление витрины — ВИД ФОРМЫ, а не обязательность: у отчёта и бланка
   разные глаголы (отчёт смотрят, бланк печатают адресату), и деление по
   обязательности на живом каталоге вырождается — обязательных 12 из 41, всё
   прочее валится в одну кучу. Вид формы режет и на затравке, и на бою (ОЧ-75). */
/* ======================= ТРИ ПОЛКИ ВИТРИНЫ ============================
   «Мои» — личные отчёты и виды смотрящего; «Общие» — отчёты, открытые кругу
   их владельцем, с числом пользователей и последним открытием, популярные
   сверху; «Официальные» — формы организации: обязательные по сроку и
   остальные. Поиск ищет и по названию, и по составу — основному объекту,
   показателям, разрезам, реквизитам: «где у нас просрочка по заёмщикам»
   спрашивают составом, а не названием.                                     */
const compoText = t => { const ed = liveEd(t) || draftEd(t); if(!ed) return '';
  const list = SEAM.fieldList(ed.object);
  return [list ? list.name : ed.object].concat((ed.stats || []).map(statName),
    (ed.cuts || []).map(cutName),
    (ed.fields || []).map(f => { const x = list && list.fields.find(y => y.id === f); return x ? x.name : f; }))
    .join(' · '); };
RP.compoText = tid => { const t = TPL(tid); return t ? compoText(t) : ''; };
const matchQ = (q, name, compo) => { q = String(q || '').trim().toLowerCase();
  return !q || String(name).toLowerCase().indexOf(q) !== -1 || String(compo || '').toLowerCase().indexOf(q) !== -1; };
RP.shelves = q => {
  const v = RP.viewer(), vis = RP.visibleTemplates();
  const mine = vis.map(TPL).filter(t => t.kind === 'отчёт' && t.owner === v.who && levelOf(t) === 'личный')
    .map(t => ({kind:'отчёт', id:t.id, name:t.name, compo: compoText(t), at:(draftEd(t) || {}).at}))
    .concat(RP.myViews(null).map(vw => ({kind:'вид', id:vw.id, tpl:vw.tpl, name:vw.name,
      compo: (TPL(vw.tpl) ? 'вид поверх «'+TPL(vw.tpl).name+'» · '+compoText(TPL(vw.tpl)) : ''), at:vw.at})))
    .filter(r => matchQ(q, r.name, r.compo));
  const shared = vis.map(TPL).filter(t => levelOf(t) === 'общий')
    .map(t => ({id:t.id, name:t.name, owner:t.owner, coauthors:(t.coauthors || []).slice(),
      users:t.users || 0, lastOpen:t.lastOpen || null, version: verEd(t).n, changed: verEd(t).changed || null,
      circle: t.circle.map(deptName).concat((t.share && t.share.people) || []), compo: compoText(t)}))
    .filter(r => matchQ(q, r.name, r.compo))
    .sort((a, b) => b.users - a.users || a.name.localeCompare(b.name));
  return {mine, shared};
};
/* «Похожий уже есть»: тот же основной объект и хотя бы один общий показатель
   среди общих и официальных отчётов, видимых автору. Подсказка, а не запрет:
   отчёт растёт по уровням, и второй такой же общий — шум на чужих полках.  */
RP.similarTo = tid => { const t = TPL(tid); if(!t) return [];
  const ed = draftEd(t) || liveEd(t); if(!ed) return [];
  return RP.visibleTemplates().map(TPL).filter(o => o.id !== tid && o.kind === 'отчёт' &&
      levelOf(o) !== 'личный')
    .map(o => { const e = liveEd(o);
      const st = (e.stats || []).filter(x => (ed.stats || []).indexOf(x) !== -1).length;
      const ct = (e.cuts || []).filter(x => (ed.cuts || []).indexOf(x) !== -1).length;
      return {id:o.id, name:o.name, level: levelOf(o), owner:o.owner, same: e.object === ed.object,
        score: st * 2 + ct}; })
    .filter(x => x.same && x.score >= 2)
    .sort((a, b) => b.score - a.score || (a.level === 'общий' ? -1 : 1));
};
RP.openToCircle = (tid, opts) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  const o = opts || {}, v = RP.viewer();
  if(t.kind !== 'отчёт') return {ok:false, why:'бланки бывают только официальными: их ведут '+
    'делопроизводитель и уполномоченный'};
  if(t.owner !== v.who) return {ok:false, why:'открыть кругу может автор отчёта ('+t.owner+')'};
  if(levelOf(t) !== 'личный') return {ok:false, why:'«'+t.name+'» уже '+levelOf(t)};
  const sim = RP.similarTo(tid);
  if(sim.length && !o.force) return {ok:false, hint:true, similar: sim,
    why:'похожий уже есть: «'+sim[0].name+'» ('+sim[0].level+', '+sim[0].owner+') — откройте его '+
      'или сохраните свой вид поверх него'};
  const depts = (o.depts && o.depts.length) ? o.depts.slice() : [v.dept];
  const ed = draftEd(t);
  ed.state = 'версия'; ed.changed = 'открыт кругу '+fmt(RP.state.today)+' ('+v.who+')';
  t.level = 'общий'; t.circle = depts; t.share = {depts, people:(o.people || []).slice()};
  t.coauthors = []; t.users = 1; t.lastOpen = RP.state.today; t.asked = false;
  log('отчёт «'+t.name+'» открыт кругу: '+depts.map(deptName).join('; '));
  return {ok:true, note:'«'+t.name+'» стал общим: видят '+depts.map(deptName).join('; ')+
    '; каждое сохранение — версия; сдавать его нельзя — сдаётся официальный'};
};
RP.uiOpenToCircle = (tid, force) => { const r = RP.openToCircle(tid, {force: !!force});
  RP.state.sel.similar = r.hint ? {tid, list: r.similar} : null;
  if(r.hint){ render(); return; }
  act(r); };
RP.uiOpenShared = tid => { const sel = RP.state.sel;
  sel.tpl = tid; sel.twist = null; sel.view = null; sel.dropped = null; sel.live = false;
  sel.drillRes = null; RP.state.view = 'issue'; render(); };
RP.uiViewOver = tid => { const sel = RP.state.sel, src = sel.similar ? TPL(sel.similar.tid) : null;
  sel.similar = null; RP.uiOpenShared(tid);
  sel.viewName = src ? src.name : ''; render(); };
RP.uiOpenPersonal = tid => { RP.state.sel.draft = tid; RP.state.view = 'builder'; render(); };

function scShowcase(){
  const sel = RP.state.sel, sc = RP.showcase();
  const all = sc.must.concat(sc.rest);
  const q = String(sel.scQ || '').trim().toLowerCase();
  const sh = RP.shelves(q), shAll = RP.shelves('');

  /* Полка по умолчанию — «Мои», если там что-то есть, иначе официальные отчёты.
     Не «последняя открытая»: витрина открывается у двоих одинаково.          */
  const tab = sel.scTab || (shAll.mine.length ? 'мои' : 'отчёт');
  const official = tab === 'отчёт' || tab === 'бланк';
  const cnt  = k => all.filter(r => r.tplKind === k).length;
  const burn = k => all.filter(r => r.tplKind === k && r.obligation &&
    r.obligation.state === 'просрочено').length;

  let h = '<div class="tabs shelves">'+
    [['мои', 'Мои', shAll.mine.length, 0, tab === 'мои'],
     ['общие', 'Общие', shAll.shared.length, 0, tab === 'общие'],
     ['отчёт', 'Официальные', all.length, burn('отчёт') + burn('бланк'), official]]
    .map(t => '<button class="'+(t[4] ? 'on' : '')+'" onclick="RP.scSet(\'scTab\',\''+
      t[0]+'\')">'+esc(t[1])+'<span class="n">'+t[2]+'</span>'+
      (t[3] ? '<span class="burn shelf">'+t[3]+'</span>' : '')+'</button>').join('')+'</div>';

  h += '<div class="form-row"><div class="fld"><label>Поиск по названию и составу</label>'+
    '<input class="wide" value="'+esc(sel.scQ || '')+'" onchange="RP.scSet(\'scQ\', this.value)" '+
    'placeholder="просрочка, заёмщик, остаток, претензия…"></div></div>';

  if(tab === 'мои'){
    if(sel.similar){ const s0 = sel.similar.list[0];
      h += '<div class="banner info"><b>Похожий уже есть:</b> «'+esc(s0.name)+'» — '+esc(s0.level)+
        ', владелец '+esc(s0.owner)+'<div class="btn-row">'+
        '<button class="btn btn-primary btn-sm" onclick="RP.uiOpenShared(\''+s0.id+'\')">Открыть его</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.uiViewOver(\''+s0.id+'\')">Свой вид поверх него</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.uiOpenToCircle(\''+sel.similar.tid+'\', true)">'+
        'Всё равно открыть кругу</button></div></div>'; }
    if(!shAll.mine.length) return h + '<div class="banner ok">Своих отчётов и видов нет. Отчёт '+
      'собирается в «Конструкторе», вид сохраняется на показе.</div>';
    if(!sh.mine.length) return h + '<div class="banner warn">Под отбор не попало ничего.</div>';
    return h + '<div class="tblwrap"><table class="cgrid">'+
      '<colgroup><col style="width:34%"><col style="width:36%"><col style="width:10%"><col style="width:20%"></colgroup>'+
      '<thead><tr><th>Название</th><th>Состав</th><th>Изменён</th><th></th></tr></thead><tbody>'+
      sh.mine.map(r => '<tr><td><div class="fname">'+esc(r.name)+'</div>'+
        '<div class="fmeta"><span class="tag">'+(r.kind === 'вид' ? 'вид' : 'личный отчёт')+'</span></div></td>'+
        '<td class="small">'+esc(r.compo)+'</td><td class="small">'+fmt(r.at)+'</td>'+
        '<td class="act">'+(r.kind === 'вид'
          ? '<button class="btn btn-secondary btn-sm" onclick="RP.openViewOf(\''+r.id+'\')">Открыть видом</button>'
          : '<button class="btn btn-secondary btn-sm" onclick="RP.uiOpenPersonal(\''+r.id+'\')">Открыть</button> '+
            '<button class="btn btn-secondary btn-sm" onclick="RP.uiOpenToCircle(\''+r.id+'\')">Открыть кругу</button>')+
        '</td></tr>').join('')+'</tbody></table></div>';
  }

  if(tab === 'общие'){
    if(!shAll.shared.length) return h + '<div class="banner ok">Общих отчётов в вашем круге нет.</div>';
    if(!sh.shared.length) return h + '<div class="banner warn">Под отбор не попало ничего.</div>';
    return h + '<div class="tblwrap"><table class="cgrid">'+
      '<colgroup><col style="width:36%"><col style="width:24%"><col style="width:10%"><col style="width:16%"><col style="width:14%"></colgroup>'+
      '<thead><tr><th>Отчёт</th><th>Круг</th><th>Пользуются</th><th>Последнее открытие</th><th></th></tr></thead><tbody>'+
      sh.shared.map(r => '<tr><td><div class="fname">'+esc(r.name)+'</div>'+
        '<div class="fmeta"><span class="tag">общий, не официальный</span><span class="to">'+esc(r.owner)+
          (r.coauthors.length ? ' · соавторы: '+esc(r.coauthors.join(', ')) : '')+'</span></div>'+
        '<div class="small muted">версия '+r.version+(r.changed ? ' · '+esc(r.changed) : '')+'</div></td>'+
        '<td class="small">'+esc(r.circle.join('; '))+'</td>'+
        '<td class="num">'+r.users+'</td><td class="small">'+fmt(r.lastOpen)+'</td>'+
        '<td class="act"><button class="btn btn-primary btn-sm" onclick="RP.uiOpenShared(\''+r.id+'\')">Открыть</button></td>'+
        '</tr>').join('')+'</tbody></table></div>';
  }

  /* Официальные: вид формы — второй корешок. У отчёта и бланка разные глаголы
     (отчёт смотрят, бланк печатают адресату); счётчик несёт срочность.      */
  h += '<div class="tabs sub">'+
    [['отчёт', 'Отчёты', cnt('отчёт'), burn('отчёт')],
     ['бланк', 'Бланки', cnt('бланк'), burn('бланк')]]
    .map(t => '<button class="'+(tab === t[0] ? 'on' : '')+'" onclick="RP.scSet(\'scTab\',\''+
      t[0]+'\')">'+esc(t[1])+'<span class="n">'+t[2]+'</span>'+
      (t[3] ? '<span class="burn">'+t[3]+'</span>' : '')+'</button>').join('')+'</div>';

  /* Отбор считается по строкам ОТКРЫТОЙ вкладки: объекты у отчётов и бланков
     разные, и общий список чипов половину времени вёл бы в пустоту.          */
  const kin = all.filter(r => r.tplKind === tab);
  const objs = uniq(kin.map(r => r.object)).sort();
  const obj = objs.indexOf(sel.scObj) === -1 ? '' : sel.scObj;
  const pass = r => matchQ(q, r.name, r.compo) && (!obj || r.object === obj);
  /* Чипы объекта появляются, только когда есть из чего выбирать. */
  if(objs.length > 1) h += '<div class="form-row"><div class="fld"><label>Объект</label>'+
    '<div class="btn-row" style="margin:0">'+
    [''].concat(objs).map(o => '<button class="btn btn-sm '+
      (obj === o ? 'btn-primary' : 'btn-secondary')+'" onclick="RP.scSet(\'scObj\',\''+
      esc(o)+'\')">'+esc(o || 'все')+'</button>').join('')+'</div></div></div>';
  /* Обязательность делит строки ВНУТРИ одной таблицы, а не двумя таблицами:
     столбцы и действия у групп одни и те же, и вторая шапка ради одной-двух
     строк ничего не объясняет. Пустой группы не бывает вовсе — её нет в
     разметке, а не «0 строк» карточкой с выдуманной причиной.               */
  /* В строке оставлено то, что РАЗЛИЧАЕТ формы. Объект показан, только когда во
     вкладке их несколько; адресат — на бланках, потому что бланк тем и определён,
     кому он уходит. Вид формы из строки убран: он теперь корешок вкладки.      */
  const many = uniq(kin.map(r => r.object)).length > 1;
  /* Документ основания печатается в строке, только если он НЕ тот, что у
     большинства форм вкладки: одиннадцать одинаковых «Порядок №41» — фон, а не
     сведения. Преобладающий назван один раз, в шапке столбца; при равенстве
     документов преобладающего нет, и каждая строка называет свой.            */
  const docs = kin.filter(r => r.basis).map(r => docShort(r.basis.doc));
  const dcnt = d => docs.filter(x => x === d).length;
  const top = docs.length ? uniq(docs).sort((a, b) => dcnt(b) - dcnt(a))[0] : null;
  const prevail = top && dcnt(top) * 2 > kin.length ? top : null;
  const row = r => {
      const gap = r.kind === 'норма';
      const late = !!(r.obligation && r.obligation.state === 'просрочено');
      return '<tr'+(gap ? ' class="out gap"'
                  : (!r.access.ok ? ' class="out"' : (late ? ' class="late"' : '')))+'>'+
        '<td><div class="fname">'+esc(r.name)+'</div>'+
          '<div class="fmeta"><span class="code">'+esc(r.form || r.id)+'</span>'+
          (many ? '<span class="tag">'+esc(r.object)+'</span>' : '')+
          (tab === 'бланк' && r.to ? '<span class="to">→ '+esc(r.to)+'</span>' : '')+'</div>'+
          (gap
            ? '<div class="why">не заведён · Завести — '+esc(r.goTo)+'</div>'
            : (r.access.ok ? '' : '<div class="why">не в круге. Доступ у: '+
                esc(r.access.who)+'</div>'))+'</td>'+
        '<td>'+(r.basis
          ? (r.basis.point ? '<div class="pt">'+esc(r.basis.point)+'</div>' : '')+
            (docShort(r.basis.doc) === prevail ? ''
              : '<div class="small">'+esc(docShort(r.basis.doc))+'</div>')
          : '<span class="muted small">не названо</span>')+'</td>'+
        '<td class="small">'+(gap
          ? '<span class="muted">срока нет</span>'
          : oblPill(r.obligation)+(r.obligation && r.obligation.who
              ? '<div class="muted">сдаёт: '+esc(r.obligation.who)+'</div>' : ''))+'</td>'+
        '<td class="small">'+(r.lastFinal
          ? '<b>'+esc(r.lastFinal.id)+'</b> · '+fmt(r.lastFinal.at)+'<div class="muted">'+
            esc(r.lastFinal.to)+(r.lastFinal.number ? ' · '+esc(r.lastFinal.number) : '')+'</div>'
          : '<span class="dash">—</span>')+'</td>'+
        '<td class="act">'+(gap || !r.access.ok ? '<span class="dash">—</span>'
            : '<button class="btn '+(r.tplKind === 'бланк' ? 'btn-secondary' : 'btn-primary')+
              ' btn-sm" onclick="RP.openForm(\''+r.id+'\')">'+
              (r.tplKind === 'бланк' ? 'Где печатается' : 'Открыть')+'</button>')+
        '</td></tr>';
  };

  const secs = [['Обязательные', sc.must], ['По запросу', sc.rest]]
    .map(s => { const inTab = s[1].filter(r => r.tplKind === tab);
      return {title: s[0], inTab: inTab, shown: inTab.filter(pass)}; })
    .filter(s => s.inTab.length);
  if(!secs.length) return h+'<div class="banner ok">Форм этого вида вам не предъявлено.</div>';
  /* Отбор, не пропустивший ничего, говорит это ОДИН раз, а не по разу на группу. */
  if(!secs.some(s => s.shown.length))
    return h+'<div class="banner warn">Под отбор не попало ничего.</div>';

  /* Доли столбцов заданы явно: без них «Форма» ломалась в три строки, а справа
     от «Последнего выпуска» пустовала треть ширины. */
  h += '<div class="tblwrap"><table class="cgrid">'+
    '<colgroup><col style="width:35%"><col style="width:12%"><col style="width:20%">'+
    '<col style="width:21%"><col style="width:12%"></colgroup>'+
    '<thead><tr><th>Форма</th><th>Основание'+
    (prevail ? '<span class="th-sub">'+esc(prevail)+'</span>' : '')+
    '</th><th>Срок и обязательство</th>'+
    '<th>Последний окончательный выпуск</th><th></th></tr></thead><tbody>';
  secs.forEach(s => {
    h += '<tr class="sect"><td colspan="5">'+esc(s.title)+
      ' <span class="n">· '+s.shown.length+
      (s.shown.length === s.inTab.length ? '' : ' из '+s.inTab.length)+'</span></td></tr>';
    h += s.shown.map(row).join('');    /* «0 из 12» сказано самим разделителем */
  });
  return h+'</tbody></table></div>';
}

/* ------------------------------ РЕЕСТР ------------------------------- */
/* Откуда у бумаги номер — одной строкой: у договора это номер его объекта, у
   рабочей бумаги номера нет, у остального — журнал документооборота.       */
const numberRule = t => t.numberIsObject ? 'реквизит кредита — номер договора'
  : (t.workPaper ? 'рабочая бумага — без номера'
  : 'документооборот: '+(t.docType || 'документ')+' — номер при регистрации после подписи');
function scRegistry(){
  /* Реестр — официальные отчёты, бланки и черновики к утверждению; общие живут на витрине. */
  const v = RP.viewer(), vis = RP.visibleTemplates().filter(id => levelOf(TPL(id)) !== 'общий');
  const hiddenDrafts = RP.state.templates.filter(t => vis.indexOf(t.id) === -1 && levelOf(t) !== 'общий');

  const cnt  = k => vis.filter(tid => TPL(tid).kind === k).length;
  const burn = k => vis.filter(tid => TPL(tid).kind === k && RP.tplState(tid).state === 'неисполним').length;
  /* Тот же приём, что на витрине (scShowcase): у бланка есть тип документа
     для документооборота и откуда берётся номер, у отчёта колонка пустовала
     бы — вид формы стал корешком вкладки, а не колонкой строки. */
  const tab = RP.state.sel.regTab || 'отчёт';

  let h = '<div class="tabs">'+
    [['отчёт', 'Отчёты', cnt('отчёт'), burn('отчёт')],
     ['бланк', 'Бланки', cnt('бланк'), burn('бланк')]]
    .map(t => '<button class="'+(tab === t[0] ? 'on' : '')+'" onclick="RP.scSet(\'regTab\',\''+
      t[0]+'\')">'+esc(t[1])+'<span class="n">'+t[2]+'</span>'+
      (t[3] ? '<span class="burn">'+t[3]+'</span>' : '')+'</button>').join('')+'</div>';

  const kin = vis.filter(tid => TPL(tid).kind === tab), isBlank = tab === 'бланк';
  h += '<table class="cgrid"><thead><tr><th>Отчёт / бланк</th>'+
    (isBlank ? '<th>Номер</th>' : '')+
    '<th>Состояние</th><th>Ред.</th><th>Основание</th><th>Круг</th><th>Расписание</th><th></th></tr></thead><tbody>';
  if(!kin.length) h += '<tr><td colspan="'+(isBlank ? 8 : 7)+'">'+
    '<div class="banner ok">Этого вида вам не видно ни одного.</div></td></tr>';
  kin.forEach(tid => {
    const t = TPL(tid), st = RP.tplState(tid);
    h += '<tr'+(st.state === 'неисполним' ? ' class="out"' : '')+'>'+
      '<td><b>'+esc(t.name)+'</b><div class="small mono">'+esc(t.id)+'</div>'+
        (st.why ? '<div class="why">'+esc(st.why)+'</div>' : '')+'</td>'+
      (isBlank ? '<td class="small">'+numberRule(t)+'</td>' : '')+
      '<td>'+pill(st.state, stateCls(st.state))+'</td>'+
      '<td>'+(RP.pubEd(tid) ? 'ред. '+RP.pubEd(tid).n : '—')+'</td>'+
      '<td class="small">'+(t.basis ? esc((t.basis.point ? 'п. '+t.basis.point+' ' : '')+t.basis.doc)
        : '<span class="muted">не названо</span>')+'</td>'+
      '<td class="small">'+esc(t.circle.map(deptName).join('; '))+'</td>'+
      '<td class="small">'+(t.schedule ? esc(t.schedule.text) : '<span class="muted">по требованию</span>')+'</td>'+
      '<td><div class="btn-row" style="margin:0">'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.openBuilder(\''+t.id+'\')">Состав</button>'+
        (st.state === 'утверждён'
          ? '<button class="btn btn-primary btn-sm" onclick="RP.'+
            (t.kind === 'бланк' ? 'openBlank' : 'openIssue')+'(\''+t.id+'\')">Выпустить</button>' : '')+
      '</div></td></tr>';
  });
  h += '</tbody></table>';

  h += '<div class="card" style="margin-top:14px"><h3>Не видно этой роли</h3>'+
    '<div class="small">Роль «'+esc(v.title)+'», область видимости: '+
      esc(v.scope.map(deptName).join('; '))+'.</div>'+
    (hiddenDrafts.length
      ? '<div class="facts">'+hiddenDrafts.map(t => '<div class="f no">'+esc(t.name)+' — личный '+
          'черновик '+esc(t.owner)+(t.asked ? ', отправлен на утверждение (виден уполномоченному)'
            : ', на утверждение не отправлен: не видит никто, кроме автора')+'</div>').join('')+'</div>'
      : '<div class="facts"><div class="f yes"><em>всё, что есть в системе, вам видно</em></div></div>')+
    '</div>';

  const broken = RP.brokenTemplates();
  if(broken.length) h += '<div class="banner danger"><b>Неисполнимые отчёты и бланки: '+broken.length+'.</b> '+
    broken.map(b => esc(b.name)+' — '+esc(b.why)).join('<br>')+'</div>';

  h += '<div class="card"><h3>Правка у соседей</h3><div class="btn-row">'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoRename()">Ядро переименовало «Дней просрочки» → days_overdue</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoWithdraw()">Статистика выводит «Сумма просроченной задолженности»</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.reset()">Вернуть исходное состояние</button>'+
    '</div></div>';
  return h;
}
RP.openBuilder = tid => { RP.state.sel.draft = tid; RP.state.view = 'builder'; render(); };
RP.openIssue   = tid => { RP.state.sel.tpl = tid; RP.state.view = 'issue'; render(); };
RP.openBlank   = tid => { RP.state.sel.blank = tid; RP.state.view = 'blank'; render(); };
RP.demoRename = () => { const r = RP.renameField('credit','days','days_overdue','Дней просрочки');
  toast(r.note, r.broken.length ? 'err' : 'ok'); render(); };
RP.demoWithdraw = () => { const r = RP.withdrawStat('s-overdue-sum');
  toast(r.note, 'err'); render(); };
RP.reset = () => { const view = RP.state.view; RP.seed(); RP.state.view = view;
  toast('исходное состояние восстановлено','ok'); render(); };

/* ---------------------------- КОНСТРУКТОР ---------------------------- */
function scBuilder(){
  const vis = RP.visibleTemplates().filter(id => levelOf(TPL(id)) !== 'общий');
  let tid = RP.state.sel.draft;
  if(vis.indexOf(tid) === -1) tid = vis[0];
  const t = TPL(tid), ed = draftEd(t) || pubEd(t), list = SEAM.fieldList(ed.object);
  const checks = draftEd(t) ? RP.publishChecks(tid) : [];
  let h = '<div class="form-row"><div class="fld"><label>Отчёт / бланк</label><select onchange="RP.selDraft(this.value)">'+
    vis.map(id => '<option value="'+id+'"'+(id===tid?' selected':'')+'>'+esc(TPL(id).name)+'</option>').join('')+
    '</select></div></div>';

  h += '<div class="cols" style="margin-top:14px"><div class="body"><div class="card"><h3>Состав редакции '+
    ed.n+' <span class="small">· '+esc(ed.state)+'</span></h3>'+
    kv([
      ['Вид', t.kind],
      ['Объект', list.name+' (владелец перечня — '+list.owner+')'],
      ['Режим', ed.mode],
      ['Поля', ed.fields.length ? ed.fields.map(f => { const x = list.fields.find(y => y.id === f);
        return x ? esc(x.name) : '<span style="color:var(--asubk-red)">'+esc(f)+' — нет в перечне</span>'; }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Подстановки бланка', (ed.subs||[]).length ? (ed.subs||[]).map(s => { const x = list.fields.find(y => y.id === s);
        return '${'+esc(x && x.ru ? x.ru : s)+'}' + (x ? '' : ' <span style="color:var(--asubk-red)">— нет в перечне</span>'); }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Показатели', ed.stats.length ? ed.stats.map(s => { const m = SEAM.statMeta(s);
        return m ? esc(m.name)+(m.withdrawn ? ' <span style="color:var(--asubk-red)">— выведен '+fmt(m.withdrawn)+'</span>'
          : (m.live ? '' : ' <span style="color:var(--asubk-amber)">— налету не берётся</span>')) : esc(s); }).join('; ')
        : '<span class="muted">—</span>', true],
      ['Параметры', ed.params.map(p => p.name+' ('+p.role+')').join('; ')],
      ['Разрезы и уровни', ed.cuts.length ? ed.cuts.map((c, i) => (i+1)+'-й уровень — '+cutName(c)+
        ((ed.levelTotals || []).indexOf(c) !== -1 ? ' <b>с итоговой строкой</b>' : '')).join('; ') : '—', true],
      ['Разрядность', (ed.stats || []).map(s => { const dp = dpOf(ed, s);
        return dp == null ? null : (SEAM.statMeta(s) || {name:s}).name+' → '+
          (dp === 0 ? 'целых' : dp+' зн.'); }).filter(Boolean).join('; ') || '<span class="muted">не объявлена</span>', true]
    ])+'</div>';

  h += '<div class="card"><h3>Проверки утверждения</h3>';
  if(!draftEd(t)) h += '<div class="banner info">У '+(t.kind === 'бланк' ? 'бланка' : 'отчёта')+' нет черновой редакции — утверждать нечего.</div>';
  else if(!checks.length) h += '<div class="banner ok">Все проверки пройдены. '+
    'Утверждение сделает личный черновик официальным '+(t.kind === 'бланк' ? 'бланком' : 'отчётом')+' организации.</div>';
  else h += '<div class="facts">'+checks.map(c => '<div class="f no"><b>'+esc(c.check)+':</b> '+
    esc(c.why)+'</div>').join('')+'</div>';
  h += '<div class="btn-row">'+
    '<button class="btn btn-primary btn-sm" onclick="RP.doPublish(\''+t.id+'\')">Утвердить редакцию</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doAsk(\''+t.id+'\')">Отправить на утверждение</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doBasis(\''+t.id+'\')">Сослаться на п. 12 Порядка №41</button>'+
    '</div></div>';

  /* Границ показа редакция не объявляет: на экране доступно всё, что доступно
     отчёту, а замок стоит на сдаче.                                          */
  h += '<div class="card"><h3>Показ</h3>'+
    kv([['На экране', 'любые разрезы, реквизиты и показатели реестра, строки объектов, раскладка — '+
          'перечня допустимых отклонений нет'],
        ['Накрутка', 'видна: в шапке показа и в файле выгрузки — «'+DEVIATED+'» и кнопка «вернуть утверждённый»'],
        ['Окончательный выпуск', 'только утверждённым составом и только тем, за кем обязательство']])+
    '</div>';

  h += '<div class="card"><h3>Что правится без новой редакции</h3>'+
    kv([['Круг подразделений', t.circle.map(deptName).join('; ')],
        ['Расписание сдачи', t.schedule ? t.schedule.text : 'по требованию'],
        ['Пригоден для обзора', t.forReview ? 'да' : 'нет'],
        ['Полный охват обязателен', t.fullCoverage ? 'да — получателя нельзя назвать при усечённом охвате' : 'нет']])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doCircle(\''+t.id+'\')">Сузить круг до департамента промышленности</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doSchedule(\''+t.id+'\')">Назначить ежемесячную сдачу к 15-му</button>'+
    '</div></div></div>';

  /* Лист выгрузки и итоги уровней — состав редакции, а не настройка экрана
     (§3 пп. 4, 8; ИО-17, ИО-18). Карточка показывает и то и другое вместе,
     потому что порядок полос без итогов уровней бессмыслен.                  */
  const sh = RP.sheetOf(t.id);
  h += '<div class="card"><h3>Итоги уровней и лист выгрузки</h3>'+
    '<div class="bands">'+sh.bands.map((b, i) => '<span class="band'+(b === 'итог' ? ' tot' :
      (b === 'уровни' ? ' lv' : ''))+'">'+(i+1)+'. '+esc(b)+'</span>').join('<span class="arr">→</span>')+
    '</div>'+
    kv([['Ориентация листа', sh.orient],
        ['Шапка на каждой странице', sh.repeatHeader ? 'да' : 'нет'],
        ['Подвал', sh.footer === 'паспорт' ? 'паспорт ответа (кто, чем, на какую дату, каким охватом)' : sh.footer],
        ['Форматы выгрузки', sh.formats.join(' · ')],
        ['Итоги по уровням', sh.levels.filter(l => l.total).map(l => l.name).join('; ') ||
          '<span class="muted">нет</span>', true]])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doBands(\''+t.id+'\')">Поставить итог перед уровнями</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFold(\''+t.id+'\')">Сложить итоги уровней самим</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doLandscape(\''+t.id+'\')">Развернуть лист альбомно</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doColDate(\''+t.id+'\')">Взять один столбец на другую дату</button>'+
    '</div></div></div>';

  h += '<div class="side"><div class="mirror"><div class="row"><span class="k">публичный перечень</span>'+
    esc(list.name)+'</div><div class="row"><span class="k">владелец</span>'+esc(list.owner)+'</div>'+

/* Полосы уровней. Итог печатается ПОСЛЕ строк своей группы и приходит швом:
   складывать частные итоги модуль не вправе (ИО-17, ОЧ-25).                 */
/* Заметки к строке и ячейке показа (волна 36): значок у строки или клетки. */
let NOTE_MARKS = {};
function cellRow(r, cols){
  const mk = NOTE_MARKS[r.id] || null;
  return '<tr'+(mk && mk.row ? ' class="noted" title="'+esc(mk.row)+'"' : '')+'>'+cols.map((c, i) => { const val = c.id === 'dept' && r.dept ? deptName(r.dept) : r[c.id];
    const cm = mk && mk.cells[c.id];
    return '<td'+(typeof val === 'number' ? ' class="num"' : '')+(cm ? ' title="'+esc(cm)+'"' : '')+'>'+
      (i === 0 && mk && mk.row ? '<span class="note-mk" aria-label="заметка к строке">✎</span> ' : '')+
      esc(typeof val === 'number' ? money(val) : (val == null ? '—' : val))+
      (cm ? ' <span class="note-mk" aria-label="заметка к ячейке">✎</span>' : '')+'</td>'; }).join('')+'</tr>';
}
function bandRows(gs, cols, depth, path){
  const lvl = depth || 1;
  return gs.map(g => {
    const here = (path || []).concat({by: g.by, key: g.key});
    let out = '<tr class="grp g'+lvl+'"><td colspan="'+cols.length+'">'+
      '<b>'+esc(g.name)+'</b> <span class="small">'+esc(objWord(g.count))+'</span></td></tr>';
    out += g.children ? bandRows(g.children, cols, lvl + 1, here)
                      : (g.rows || []).map(r => cellRow(r, cols)).join('');
    /* Число итога уровня — ссылка на провал, если экран просил провал (path). */
    if(g.totals) out += '<tr class="gtot"><td colspan="'+cols.length+'">Итог по «'+esc(g.name)+'»: '+
      g.totals.map(x => esc(x.name)+(x.own ? ' <span class="own" title="'+esc(x.expr)+'">ƒ</span>' : '')+' — <b>'+(x.shown == null ? '—'
        : (x.own ? esc(ownNum(x)) : (path ? drillLink(esc(money(x.shown)), {path: here, stat: x.id}) : esc(money(x.shown)))))+'</b> '+
        esc(x.unit)).join(' · ')+
      '</td></tr>';
    return out;
  }).join('');
}

/* -------------------- ВЕРСТАЛЬЩИК МАКЕТА БЛАНКА -------------------------
   Макет верстают в Word или LibreOffice у себя: файл ходит «скачать →
   поправить → загрузить», проверка идёт на каждой загрузке. Загрузка с
   ошибками сохраняется черновиком редакции — ошибки закрывают только
   отправку на утверждение, а не работу. Проверка — документ, а не список:
   поля подсвечены зелёным (найдено) или красным, повтор обведён зелёной
   рамкой, условие — жёлтой; рядом список ошибок с местом. В макете файл
   docx изображён его текстом — поле «Загружаемый файл».                     */
RP.selBlank = tid => { RP.state.sel.blank = tid; render(); };
RP.downloadLayout = tid => { const t = TPL(tid); if(!t || t.kind !== 'бланк') return {ok:false, why:'бланка нет'};
  const ed = draftEd(t) || pubEd(t);
  return {ok:true, file: t.id+'-ред'+ed.n+'.docx', note:'макет «'+t.name+'» ред. '+ed.n+' скачан ('+
    t.id+'-ред'+ed.n+'.docx) — правьте в Word или LibreOffice и загрузите обратно'}; };
RP.uploadLayout = (tid, text) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'бланка нет'};
  if(t.kind !== 'бланк') return {ok:false, why:'макет загружается у бланка: у отчёта состав — колонки и показатели'};
  if(!RP.isAuth() && !RP.isClerk()) return {ok:false, why:'бланки ведут делопроизводитель и уполномоченный'};
  let ed = draftEd(t);
  if(!ed){ const base = pubEd(t); ed = clone(base);
    ed.n = base.n + 1; ed.state = 'черновик'; ed.since = null; ed.at = RP.state.today; ed.by = RP.who();
    t.editions.push(ed); }
  ed.layoutText = String(text || ''); ed.subs = parseSubs(ed.layoutText);
  const errs = parseLayout(ed.layoutText, ed.object, ed.mode).errors;
  log('загружен макет бланка «'+t.name+'», черновик ред. '+ed.n+', ошибок: '+errs.length);
  return {ok:true, n: ed.n, errors: errs.length, note: errs.length
    ? 'загружено черновиком ред. '+ed.n+': ошибок '+errs.length+' — работа сохранена, отправка на утверждение закрыта до исправления'
    : 'загружено черновиком ред. '+ed.n+': проверка пройдена, можно отправлять на утверждение'};
};
RP.checkLayout = tid => { const t = TPL(tid); if(!t) return null;
  const ed = draftEd(t) || pubEd(t); return parseLayout(ed.layoutText, ed.object, ed.mode); };
RP.sendForApproval = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'бланка нет'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'черновика нет: сначала загрузите исправленный макет'};
  if(ed.pdfForm){ const pe = pdfFormCheck(ed);
    if(pe.length) return {ok:false, errors: pe.length, why:'сопоставление формы не прошло проверку — ошибок '+
      pe.length+'; первая: поле «'+pe[0].field+'» — '+pe[0].why}; }
  const errs = parseLayout(ed.layoutText, ed.object, ed.mode).errors;
  if(errs.length) return {ok:false, errors: errs.length, why:'макет не прошёл проверку — ошибок '+errs.length+
    '; первая: стр. '+errs[0].line+' — '+errs[0].why};
  t.asked = true; log('черновик ред. '+ed.n+' бланка «'+t.name+'» отправлен на утверждение');
  return {ok:true, note:'ред. '+ed.n+' отправлена на утверждение: уполномоченный увидит изменённые места '+
    'и бумагу «до и после» на тех же примерах'};
};
/* Утверждение по сравнению (ADR-0297 п. 12–13): уполномоченный видит не
   файл целиком, а изменённые места, изменения полей, условий, повторов и
   фрагментов и бумагу «до и после» на тех же примерах.                     */
function lineDiff(a, b){
  const n = a.length, m = b.length, L = [];
  for(let i = 0; i <= n; i++){ L.push(new Array(m + 1).fill(0)); }
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while(i < n && j < m){
    if(a[i] === b[j]){ out.push({op:'=', txt:a[i], was:i + 1, now:j + 1}); i++; j++; }
    else if(L[i + 1][j] >= L[i][j + 1]){ out.push({op:'−', txt:a[i], was:i + 1}); i++; }
    else { out.push({op:'+', txt:b[j], now:j + 1}); j++; } }
  while(i < n){ out.push({op:'−', txt:a[i], was:i + 1}); i++; }
  while(j < m){ out.push({op:'+', txt:b[j], now:j + 1}); j++; }
  return out;
}
RP.compareEditions = tid => {
  const t = TPL(tid); if(!t || t.kind !== 'бланк') return {ok:false, why:'сравниваются редакции бланка'};
  const was = pubEd(t), now = draftEd(t);
  if(!was || !now) return {ok:false, why:'сравнивать не с чем: нужна утверждённая редакция и черновик новой'};
  const pa = parseLayout(was.layoutText, was.object, was.mode), pb = parseLayout(now.layoutText, now.object, now.mode);
  const fr = p => uniq(p.items.filter(x => x.kind === 'фрагмент').map(x => x.fragment));
  const rp = p => p.repeats.map(r => SEAM.fieldList(r.obj).name);
  const delta = (x, y) => ({added: y.filter(v => x.indexOf(v) === -1), removed: x.filter(v => y.indexOf(v) === -1)});
  const lines = lineDiff(String(was.layoutText || '').split('\n'), String(now.layoutText || '').split('\n'));
  const samples = RP.samples(tid).map(x => x.obj).filter((x, k, a) => a.indexOf(x) === k);
  /* у PDF-формы сравнивается сопоставление «поле формы → поле объекта» */
  const mp = ed => ed.pdfForm ? ed.pdfForm.fields.concat(ed.pdfForm.table ? ed.pdfForm.table.cols : [])
    .map(fd => fd.name+' → '+(fd.empty ? 'пусто' : (fd.check ? 'флажок: '+fd.check : (fd.map ? '${'+fd.map+'}'+(fd.view ? ' | '+fd.view : '') : '—')))) : [];
  if(was.pdfForm || now.pdfForm) return {ok:true, was: was.n, now: now.n, pdf:true,
    mapping: delta(mp(was), mp(now)), file:{was: was.pdfForm ? was.pdfForm.file : null, now: now.pdfForm ? now.pdfForm.file : null},
    errors: now.pdfForm ? pdfFormCheck(now).length : 0};
  return {ok:true, was: was.n, now: now.n, changed: lines.filter(x => x.op !== '=').length, lines,
    fields: delta(pa.fields.map(f => ruOf(was.object, f)), pb.fields.map(f => ruOf(now.object, f))),
    conds: delta(pa.conds, pb.conds), repeats: delta(rp(pa), rp(pb)), fragments: delta(fr(pa), fr(pb)),
    errors: pb.errors.length, samples,
    paper: samples.map(obj => ({obj, before: layoutCheckDoc(t, was, obj, true).html,
      after: layoutCheckDoc(t, now, obj, true).html}))};
};
/* PDF-ФОРМА С ПОЛЯМИ (ADR-0297 п. 6–8) — бланк, но мимо движка. Сопоставление
   «поле формы → поле объекта» проверяется тем же разбором, что и макет docx:
   поле из публичного перечня, вид значения и условие флажка — из закрытых
   списков, не сопоставленное поле — ошибка («оставить пустым» — явный выбор).
   Повтор таблицы формы подчиняется режиму бланка, как и повтор docx.        */
function pdfFormCheck(ed){
  const f = ed.pdfForm, out = [];
  const one = (fd, objWanted) => {
    if(fd.empty) return;
    if(fd.check){ if(CONDITIONS.indexOf(fd.check) === -1) out.push({field: fd.name,
      why:'флажок ставится условием из списка, «'+fd.check+'» в нём нет'}); return; }
    if(!fd.map){ out.push({field: fd.name, why:'не сопоставлено: выберите поле объекта или «оставить пустым» — '+
      'пропуск не считается выбором'}); return; }
    const hit = fieldByRu(fd.map);
    if(!hit || (objWanted && hit.obj !== objWanted) || (!objWanted && hit.obj !== ed.object))
      out.push({field: fd.name, why:'${'+fd.map+'} — объект «'+SEAM.fieldList(objWanted || ed.object).name+
        '» такого поля не объявляет'});
    if(fd.view && VALUE_VIEWS.indexOf(fd.view) === -1) out.push({field: fd.name,
      why:'вид значения «'+fd.view+'» неизвестен'}); };
  f.fields.forEach(fd => one(fd, null));
  if(f.table){
    if(ed.mode === 'на дату' && STAT_OBJECTS.indexOf(f.table.repeat) === -1) out.push({field: f.table.first,
      why:'строки «'+SEAM.fieldList(f.table.repeat).name+'» на дату не хранятся — повтор у бланка «на дату» невозможен'});
    f.table.cols.forEach(c => one(c, f.table.repeat)); }
  (f.unmatched || []).forEach(n => out.push({field: n, why:'в новой версии формы поля с этим именем нет — '+

}
/* Заполняет СВОЙ код модуля: данные — тем же швом и с той же видимостью, что
   у docx; поля запекаются в текст страницы со шрифтом, где есть ң, ө, ү.
   Строк больше, чем в таблице формы, — лист продолжения в тот же PDF: один
   выпуск, один снимок; у формы с признаком «отказать» — отказ с причиной.   */
RP.pdfFill = (tid, objId) => { const t = TPL(tid);
  return pdfFillEd(t ? (draftEd(t) || pubEd(t)) : null, objId); };
function pdfFillEd(ed, objId){
  if(!ed || !ed.pdfForm) return {ok:false, why:'у бланка нет PDF-формы'};
  const f = ed.pdfForm, v = RP.viewer();
  const row = SEAM.objectRows(ed.object, {obj: objId}, v.scope.slice()).rows[0];
  if(!row) return {ok:false, why:'объект вне области видимости роли — заполнять нечем (§13.3)'};
  const errs = pdfFormCheck(ed);
  if(errs.length) return {ok:false, why:'сопоставление с ошибкой — поле «'+errs[0].field+'»: '+errs[0].why};
  const val = (fd, r) => viewValue(r[fieldByRu(fd.map).f.id], fd.view);
  const fields = f.fields.map(fd => ({name: fd.name, label: fd.label,
    value: fd.empty ? '' : (fd.check ? (condHolds(fd.check, row, objId) ? '☒' : '☐') : val(fd, row)),
    how: fd.empty ? 'оставлено пустым' : (fd.check ? 'флажок по условию' : '${'+fd.map+'}')}));
  const rows = f.table ? SEAM.objectRows(f.table.repeat, {of: objId}, v.scope.slice()).rows : [];
  const over = f.table ? Math.max(0, rows.length - f.table.rows) : 0;
  if(over && f.overflow === 'отказать') return {ok:false, why:'строк '+rows.length+' — в таблице формы '+
    f.table.rows+', а лист продолжения эта форма не принимает (признак «при переполнении отказать»)'};
  return {ok:true, file: f.file, baked:true, font:'встроен, с кириллицей и ң, ө, ү',
    fields, table: f.table ? rows.map(r => f.table.cols.map(c => val(c, r))) : [],
    inForm: Math.min(rows.length, f.table ? f.table.rows : 0), continuation: over,
    pages: f.pages + (over ? 1 : 0),
    note:'заполнено своим кодом модуля: полей '+fields.length+', поля запечены в текст'+
      (over ? '; строк '+rows.length+' — '+f.table.rows+' в форме, '+over+' на листе продолжения в том же PDF' : '')};
}
/* Новая версия той же формы переносит сопоставление по ИМЕНАМ полей формы;
   не совпавшее — ошибка проверки, а не молчаливая потеря (ADR-0297 п. 6).  */
RP.uploadPdfForm = (tid, file, names) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'бланка нет'};
  const base = draftEd(t) || pubEd(t);
  if(!base || !base.pdfForm) return {ok:false, why:'у бланка нет PDF-формы: макет docx грузится как макет'};
  if(!RP.isAuth() && !RP.isClerk()) return {ok:false, why:'бланки ведут делопроизводитель и уполномоченный'};
  let ed = draftEd(t);
  if(!ed){ ed = clone(base); ed.n = base.n + 1; ed.state = 'черновик'; ed.since = null; ed.at = RP.state.today;
    ed.by = RP.who(); t.editions.push(ed); }
  const f = ed.pdfForm, keep = fd => names.indexOf(fd.name) !== -1;
  const lost = f.fields.filter(fd => !keep(fd)).map(fd => fd.name)
    .concat(f.table && names.indexOf(f.table.first) === -1 ? [f.table.first] : []);
  const old = f.fields.map(fd => fd.name).concat(f.table ? [f.table.first] : []);
  const fresh = names.filter(n => old.indexOf(n) === -1);
  f.file = file; f.fields = f.fields.filter(keep).concat(fresh.map(n => ({name: n, label: n})));
  f.unmatched = lost;
  const errs = pdfFormCheck(ed);
  log('загружена новая версия формы «'+t.name+'» ('+file+'), черновик ред. '+ed.n+', ошибок: '+errs.length);
  return {ok:true, n: ed.n, carried: old.length - lost.length, lost, fresh, errors: errs.length,
    note:'сопоставление перенесено по именам полей: '+(old.length - lost.length)+' из '+old.length+
      (lost.length ? '; не нашлось в новой форме — '+lost.join(', ') : '')+
      (fresh.length ? '; новые поля формы без сопоставления — '+fresh.join(', ') : '')};
};
/* Палитра полей — по ролям, с поиском и примером значения на живом объекте. */
RP.palette = (tid, q, objId) => {
  const t = TPL(tid); if(!t) return [];
  const ed = draftEd(t) || pubEd(t), v = RP.viewer();
  const row = SEAM.objectRows(ed.object, {obj: objId}, v.scope.slice()).rows[0] || {};
  const qq = String(q || '').trim().toLowerCase();
  const groups = {};
  SEAM.fieldList(ed.object).fields.forEach(f => { const role = f.ru.split('.')[0];
    (groups[role] = groups[role] || []).push({ru: f.ru, name: f.name,
      example: f.id === 'dept' && row.dept ? deptName(row.dept) : row[f.id]}); });
  /* Объекты повтора — только те, что повторяются в режиме бланка: у «на дату»
     строки графика палитра не предлагает (ADR-0305 п. 4).                   */
  repeatObjects(ed.mode).forEach(ro => {
    const ex = SEAM.objectRows(ro, {of: objId}, v.scope.slice()).rows[0] || {};
    const nm = SEAM.fieldList(ro).name;
    groups[nm.charAt(0).toUpperCase() + nm.slice(1)+' — в повторе'] = SEAM.fieldList(ro).fields.map(f =>
      ({ru: f.ru, name: f.name, example: ex[f.id]})); });
  return Object.keys(groups).map(role => ({role, items: groups[role].filter(x => !qq ||
    x.ru.toLowerCase().indexOf(qq) !== -1 || x.name.toLowerCase().indexOf(qq) !== -1)}))
    .filter(g => g.items.length);
};
const repeatObjects = mode => uniq(Object.values(REPEATS))
  .filter(ro => mode !== 'на дату' || STAT_OBJECTS.indexOf(ro) !== -1);
/* Дата состояния, на которой верстальщик проверяет бланк «на дату»: правило
   расписания, если оно её называет («1 января»), иначе последний снимок.    */
function checkAsOf(t){
  const sel = RP.state.sel;
  if(sel.blankAsOf && HIST_DATES.indexOf(sel.blankAsOf) !== -1) return sel.blankAsOf;
  const jan = RP.state.today.slice(0, 4)+'-01-01';
  if(t.schedule && /1 января/.test(t.schedule.asOfRule || '') && HIST[jan]) return jan;
  return RP.defaultAsOf();
}
RP.copyToken = (ru, view) => { const tok = '${'+ru+(view ? ' | '+view : '')+'}';
  RP.state.sel.copied = tok;
  return {ok:true, token: tok, note:'скопировано: '+tok+' — вставьте в макет в Word'}; };
/* Набор примеров: трудные объекты подбирает АСУБК — где условие не
   выполнено, где повтор длинный или пустой; бланк рисуется на них с
   водяным знаком «ОБРАЗЕЦ» и без номера.                                    */
RP.samples = tid => { const t = TPL(tid); if(!t) return [];
  const ed = draftEd(t) || pubEd(t), p = parseLayout(ed.layoutText, ed.object, ed.mode);
  const out = [];
  if(p.conds.indexOf('есть Поручитель') !== -1){
    out.push({obj:'kr-6', why:'условие выполнено — поручитель есть'});
    out.push({obj:'kr-2', why:'условие не выполнено — поручителя нет'}); }
  if(p.repeats.length){
    const dated = ed.mode === 'на дату', at = dated ? checkAsOf(t) : null, ro = p.repeats[0].obj;
    const n = (dated ? SEAM.statRows(ro, at, {of:'kr-2'}, ALL_DEPTS.slice())
                     : SEAM.objectRows(ro, {of:'kr-2'}, ALL_DEPTS.slice())).rows.length;
    out.push({obj:'kr-2', why:'повтор длинный — строк '+n+(dated ? ' на '+fmt(at) : '')});
    out.push({obj:'kr-4', why:'повтор пустой — строк нет'}); }
  if(!out.length) out.push({obj:'kr-2', why:'обычный объект'});
  return out;
};

/* --- отрисовка проверки: тем же разбором, что и проверка утверждения --- */
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа',
  'сентября','октября','ноября','декабря'];
const ONES = ['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять',
  'одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать',
  'семнадцать','восемнадцать','девятнадцать'];
const TENS = ['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
const HUNDS = ['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
function triad(n, fem){ const w = [];
  w.push(HUNDS[Math.floor(n / 100)]); const r = n % 100;
  if(r < 20) w.push(fem && r === 1 ? 'одна' : (fem && r === 2 ? 'две' : ONES[r]));
  else { w.push(TENS[Math.floor(r / 10)]); const o = r % 10;
    w.push(fem && o === 1 ? 'одна' : (fem && o === 2 ? 'две' : ONES[o])); }
  return w.filter(Boolean).join(' '); }
function inWords(n){ n = Math.round(n || 0); if(!n) return 'ноль';
  const m = Math.floor(n / 1e6), th = Math.floor(n / 1e3) % 1000, rest = n % 1000, w = [];
  if(m) w.push(triad(m) + ' ' + plural(m, 'миллион', 'миллиона', 'миллионов'));
  if(th) w.push(triad(th, true) + ' ' + plural(th, 'тысяча', 'тысячи', 'тысяч'));
  if(rest) w.push(triad(rest));
  return w.join(' '); }
/* Склонение — у отчётности, а не у автора макета: здесь — достаточная
   имитация для фамилии с инициалами; наименование организации не склоняется. */
function declined(v, view){ const m = String(v || '').match(/^([А-ЯЁ][а-яё]+ов)(\s.*)$/);
  if(!m) return v;
  const end = {'род.':'а','дат.':'у','вин.':'а','тв.':'ым'}[view];
  return end ? m[1] + end + m[2] : v; }
function viewValue(v, view){
  if(v == null || v === '') return '';
  if(!view) return typeof v === 'number' ? money(v) : String(v);
  if(view === 'число и прописью') return money(v) + ' (' + inWords(v) + ')';
  if(view === 'прописью') return inWords(v);
  if(view === 'ДД.ММ.ГГГГ') return fmt(v);
  if(view === '«15» октября 2026 г.') return '«' + String(v).slice(8, 10) + '» ' +
    MONTHS_G[+String(v).slice(5, 7) - 1] + ' ' + String(v).slice(0, 4) + ' г.';
  return declined(v, view);
}
function condHolds(c, row, objId){
  if(c === 'есть Поручитель') return !!row.guarantor;
  if(c === 'есть Залогодатель') return !!subjectInRole(objId, 'залогодатель');
  const m = c.match(/^Кредит\.Состояние = (.+)$/); return m ? row.status === m[1] : false;
}
function layoutCheckDoc(t, ed, objId, showVals){
  const p = parseLayout(ed.layoutText, ed.object, ed.mode), v = RP.viewer();
  /* Проверка документом читает тем же швом, что выпуск: бланк «на дату» —
     шапку и строки повтора из одного снимка на дату проверки (ADR-0305 п. 3). */
  const dated = ed.mode === 'на дату', at = dated ? checkAsOf(t) : null;
  const ask = (obj, cut) => dated ? SEAM.statRows(obj, at, cut, v.scope.slice()) : SEAM.objectRows(obj, cut, v.scope.slice());
  const row = ask(ed.object, {obj: objId}).rows[0] || {};
  const rep0 = p.repeats[0] || null;
  const pays = rep0 ? ask(rep0.obj, {of: objId}).rows : [];
  const repName = rep0 ? SEAM.fieldList(rep0.obj).name : 'платёж';
  const bad = {}; p.errors.forEach(e => { bad[e.line + '|' + e.raw] = e.why; });
  const tok = (raw, line, kind, item) => {
    const why = bad[line + '|' + raw];
    if(why) return '<span class="tk bad" title="'+esc(why)+'">'+esc(raw)+'</span>';
    if(kind === 'поле' && showVals && !item.inRepeat){ const val = viewValue(row[item.id], item.view);
      return '<span class="tk ok" title="'+esc(raw)+'">'+(val ? esc(val) : '<i>пусто</i>')+'</span>'; }
    if(kind === 'фрагмент' && showVals) return '<span class="tk frag">'+esc(FRAGMENTS[item.fragment] || '')+'</span>';
    return '<span class="tk '+(kind === 'поле' ? 'ok' : 'mark')+'">'+esc(raw)+'</span>'; };
  const lines = String(ed.layoutText || '').split('\n');
  /* одна метка на строке может стоять дважды — заменяется один раз */
  const itemsAt = ln => p.items.filter((x, k, a) => x.line === ln &&
    a.findIndex(y => y.line === ln && y.raw === x.raw) === k);
  let out = '', i = 0, inRep = false, repBuf = [], inCond = null, condBuf = [];
  const renderLine = (txt, ln) => { let s = esc(txt);
    itemsAt(ln).forEach(it => { s = s.split(esc(it.raw)).join(tok(it.raw, ln, it.kind, it)); });
    return '<div class="ln" id="ln-'+ln+'"><span class="no">'+ln+'</span><span class="tx">'+(s || '&nbsp;')+'</span></div>'; };
  lines.forEach((txt, k) => { const ln = k + 1;
    const its = itemsAt(ln);
    const opensRep = its.some(x => x.kind === 'повтор' && x.ok), closesRep = its.some(x => x.kind === 'конец повтора' && x.ok);
    const opensCond = its.find(x => x.kind === 'условие' && x.ok), closesCond = its.some(x => x.kind === 'конец условия' && x.ok);
    if(opensRep){ inRep = true; repBuf = [renderLine(txt, ln)]; return; }
    if(inRep && !closesRep){ repBuf.push({txt, ln}); return; }
    if(inRep && closesRep){ inRep = false;
      const body = repBuf.slice(1);
      let inner = repBuf[0];
      if(showVals){
        inner = pays.length ? pays.map(pm => body.map(b => { let s = esc(b.txt);
          itemsAt(b.ln).forEach(it => { s = s.split(esc(it.raw)).join(it.kind === 'поле' && it.inRepeat && !bad[b.ln+'|'+it.raw]
            ? '<span class="tk ok">'+esc(viewValue(pm[it.id], it.view))+'</span>' : tok(it.raw, b.ln, it.kind, it)); });
          return '<div class="ln"><span class="no"></span><span class="tx">'+s+'</span></div>'; }).join('')).join('')
          : '<div class="ln"><span class="no"></span><span class="tx muted">строк нет — '+(dated ? 'в снимке на '+fmt(at)+' ' : '')+
            'у объекта строк «'+esc(repName)+'» нет</span></div>';
      } else inner += body.map(b => renderLine(b.txt, b.ln)).join('') + renderLine(txt, ln);
      out += '<div class="blk rep"><span class="blk-h">повтор · каждый '+esc(repName)+(showVals ? ' · строк '+pays.length+
        (dated ? ' · statRows на '+fmt(at) : ' · objectRows') : '')+'</span>'+inner+'</div>';
      return; }
    if(opensCond){ inCond = opensCond; condBuf = [renderLine(txt, ln)]; return; }
    if(inCond && !closesCond){ condBuf.push(renderLine(txt, ln)); return; }
    if(inCond && closesCond){ condBuf.push(renderLine(txt, ln));
      const holds = condHolds(inCond.cond, row, objId);
      out += '<div class="blk cond'+(showVals && !holds ? ' off' : '')+'"><span class="blk-h">условие · '+
        esc(inCond.cond)+(showVals ? (holds ? ' — выполнено, раздел войдёт' : ' — не выполнено, раздела не будет') : '')+
        '</span>'+(showVals ? condBuf.slice(1, -1).join('') : condBuf.join(''))+'</div>';
      inCond = null; return; }
    out += renderLine(txt, ln);
  });
  if(inRep) out += '<div class="blk rep bad">'+repBuf.map(b => typeof b === 'string' ? b : renderLine(b.txt, b.ln)).join('')+'</div>';
  if(inCond) out += '<div class="blk cond">'+condBuf.join('')+'</div>';
  return {html: out, parse: p, asOf: at};
}
