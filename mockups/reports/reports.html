  }
  if(f.formula){ const bad = formulaCheck(f.formula, ed.mode); if(bad) return 'условие по формуле: '+bad;
    if(['больше', 'меньше'].indexOf(f.formula.cmp) === -1) return 'условие по формуле сравнивает «больше» или «меньше»'; }
  if(f.top){ if(!(f.top.n > 0)) return 'топ-N: N — целое больше нуля';
    if(fieldType(f.top.by) !== 'число') return 'топ-N упорядочивает по числу: «'+f.top.by+'» — не число'; }
  return null;
}
const filterText = f => [ (f.groups || []).length ? (f.groups.map(g => g.map(condText).join(' И ')).join(' ИЛИ ')) : null,
  f.formula ? f.formula.name+' '+f.formula.cmp+' '+f.formula.value : null,
  f.top ? (f.top.dir === 'последние' ? 'последние ' : 'топ ')+f.top.n+' по «'+(FIELD('credit', f.top.by) || {name:f.top.by}).name+'»' : null
].filter(Boolean).join('; ');
/* Группы исполняет статистика, условие по своей формуле и топ-N отчётность
   досчитывает на полученных строках (§3 п. 12). Итоги после отбора — снова
   швом, по перечню отобранных строк, а не сложением на экране (ИО-17).      */
RP.filterAnswer = (tid, params, f, twist) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  const ed = liveEd(t) || draftEd(t);
  const bad = filterCheck(ed, f); if(bad) return {ok:false, why: bad};
  const base = RP.show(tid, params, Object.assign({}, twist || {}, {drill:true}));
  if(!base.ok) return base;
  let rows = base.data.rows.filter(r => !(f.groups || []).length || f.groups.some(g => g.every(c => condTest(c, r))));
  if(f.formula) rows = rows.filter(r => { const x = formulaOf(f.formula, sid => statValue(sid, [r]));
    return x != null && (f.formula.cmp === 'больше' ? x > f.formula.value : x < f.formula.value); });
  if(f.top) rows = rows.slice().sort((a, b) => f.top.dir === 'последние' ? a[f.top.by] - b[f.top.by]
    : b[f.top.by] - a[f.top.by]).slice(0, f.top.n);
  const ids = rows.map(r => r.id);
  const res = RP.show(tid, Object.assign({}, params, {ids: ids.length ? ids : ['—']}), Object.assign({}, twist || {}, {drill:true}));
  if(!res.ok) return res;
  res.data.passport.filter = filterText(f);
  if(f.top) res.data.rows = ids.map(id => res.data.rows.find(r => r.id === id)).filter(Boolean);
  return Object.assign(res, {filter: filterText(f), matched: ids.length,
    from: base.data.rows.length, executedBy: (f.groups || []).length ? 'статистика (группы)' : null});
};

/* ---- График рядом с таблицей (ОГ-10): та же клетка, другая раскладка ---- */
RP.chartOf = (tid, params, twist, opt) => {
  if(opt && opt.kind === 'линия') return lineOf(tid, opt.time || {}, params);
  if(opt && opt.kind && opt.kind !== 'столбцы') return {ok:false, why:'графиков два: столбцы — по разрезу, линия — динамика'};
  const r = RP.show(tid, params, twist); if(!r.ok) return r;
  const sid = r.data.totals[0] ? r.data.totals[0].id : null;
  if(!sid) return {ok:false, why:'графику нужен показатель: без показателя рисовать нечего'};
  const by = (r.data.levels[0] || {}).by;
  const bars = by ? (r.data.groups || []).map(g => ({key:g.key, name:g.name,
      value: (g.totals || []).find(x => x.id === sid) ? g.totals.find(x => x.id === sid).value
        : statValue(sid, g.rows || [])}))
    : [{key:'итог', name:'итог', value: r.data.totals[0].value}];
  return {ok:true, stat: statName(sid), unit: r.data.totals[0].unit, by: by ? cutName(by) : null, bars,
    note:'график рисуется по тем же клеткам, что таблица рядом: другого вопроса у него нет'};
};
function chartSvg(bars, unit){
  const w = 320, bh = 22, gap = 8, max = Math.max.apply(null, bars.map(b => b.value || 0).concat([1]));
  const h = bars.length * (bh + gap);
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:420px" role="img" aria-label="график">'+
    bars.map((b, i) => { const len = Math.round((b.value || 0) / max * (w - 150));
      return '<text x="0" y="'+(i * (bh + gap) + 15)+'" font-size="11" fill="currentColor">'+esc(String(b.name).slice(0, 18))+'</text>'+
        '<rect x="120" y="'+(i * (bh + gap) + 2)+'" width="'+len+'" height="'+(bh - 4)+'" rx="3" fill="var(--asubk-blue)"></rect>'+
        '<text x="'+(124 + len)+'" y="'+(i * (bh + gap) + 15)+'" font-size="10" fill="currentColor">'+
          esc(unit === 'сом' ? money(b.value) : String(b.value))+'</text>'; }).join('')+'</svg>';
}

/* ---- Подписка и сигнал (§2.9, ADR-0287) ---------------------------------
   Подписка — доставка по расписанию, посчитанная заранее С ПРАВАМИ
   ПОДПИСЧИКА; результат — уведомлением в АСУБК, на почту — только ссылка.
   Сигнал — условие на отчёте; проверяется после ночного снимка и приходит
   ОДИН раз, когда условие стало выполняться. Сигнал — «посмотри»: задач
   отчётность не порождает (ИО-13).                                          */
const SUB_FREQ = ['ежедневно', 'еженедельно', 'ежемесячно'];
const roleOfWho = who => ROLES.find(r => r.who === who);
function asRole(who, fn){ const was = RP.state.role, r = roleOfWho(who);
  if(r) RP.state.role = r.title; try { return fn(); } finally { RP.state.role = was; } }
RP.subscribe = (tid, opt) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'подписываются на отчёт или вид; бланк печатается по объекту'};
  if(!RP.maySee(tid)) return {ok:false, why:'отчёт «'+t.name+'» вам не виден: подписка не шире видимости'};
  const o = opt || {};
  if(SUB_FREQ.indexOf(o.freq) === -1) return {ok:false, why:'частота — '+SUB_FREQ.join(' · ')};
  if(o.mail === 'файл') return {ok:false, why:'файла на почту нет: на почту уходит только ссылка, '+
    'числа живут в АСУБК под правами того, кто открыл (ОГ-18)'};
  const s = {id:'sub-'+(++RP.state.subSeq), kind:'подписка', tpl:tid, view:o.view || null, freq:o.freq,
    owner: RP.who(), at: RP.state.today, history:[]};
  RP.state.subs.push(s); log('подписка на «'+t.name+'» ('+o.freq+')');
  return {ok:true, id:s.id, note:'результат придёт уведомлением в АСУБК; на почту — ссылка'};
};
RP.addSignal = (tid, cond) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(!RP.maySee(tid)) return {ok:false, why:'отчёт «'+t.name+'» вам не виден'};
  const c = cond || {};
  if(!SEAM.statMeta(c.stat)) return {ok:false, why:'условие сигнала — над показателем реестра'};
  if(['больше', 'меньше'].indexOf(c.cmp) === -1) return {ok:false, why:'условие сравнивает «больше» или «меньше»'};
  if(c.task) return {ok:false, why:'сигнал — «посмотри», а не «сделай»: задачу по нему ставит человек, '+
    'отчётность задач не порождает (ИО-13, ADR-0287)'};
  const s = {id:'sig-'+(++RP.state.subSeq), kind:'сигнал', tpl:tid, stat:c.stat, cmp:c.cmp, value:+c.value,
    dept: c.dept || null, owner: RP.who(), at: RP.state.today, was:null, history:[]};
  RP.state.subs.push(s); log('сигнал на «'+t.name+'»: '+statName(c.stat)+' '+c.cmp+' '+c.value);
  return {ok:true, id:s.id, note:'проверяется после каждого ночного снимка; придёт один раз — на переходе'};
};
RP.mySubs = () => clone(RP.state.subs.filter(s => s.owner === RP.who()));
RP.notices = () => clone(RP.state.notices.filter(n => n.to === RP.who()));
/* Ночной прогон после снимка: подписки, чей день настал, считаются с правами
   подписчика; сигналы проверяются и срабатывают только на переходе.          */
const legacySnap = d => !!d && preLaunch(periodOfAsOf(d));
RP.nightRun = asOf => {
  if(HIST_DATES.indexOf(asOf) === -1) return {ok:false, why:'снимка на '+fmt(asOf)+' нет: прогон идёт после снимка'};
  if(legacySnap(asOf)) return {ok:false, why:'снимок на '+fmt(asOf)+' загружен переносом из легаси: своего прогона '+
    'по месяцу до запуска система не делает (ADR-0307 п. 4)'};
  const sent = [], fired = [];
  RP.state.subs.forEach(s => asRole(s.owner, () => {
    const t = TPL(s.tpl); if(!t || !RP.maySee(s.tpl)) return;
    if(s.kind === 'подписка'){
      if(s.freq === 'ежемесячно' && asOf.slice(8) !== '01') return;
      const r = RP.show(s.tpl, {asOf, dept:''}, null); if(!r.ok) return;
      const n = {id:'n-'+(++RP.state.subSeq), to:s.owner, kind:'подписка', at:asOf, sub:s.id,
        text:'«'+t.name+'» на '+fmt(asOf)+': '+r.data.totals.map(x => x.name+' — '+
          (x.unit === 'сом' ? money(x.value) : x.value)).join('; '),
        scope: r.data.passport.scope.slice(), mail:'ссылка на отчёт в АСУБК (без чисел)'};
      RP.state.notices.push(n); s.history.push({at:asOf, notice:n.id}); sent.push(n.id);
      return;
    }
    const v = SEAM.statSlice(s.stat, null, {dept:s.dept}, asOf, RP.viewer().scope).value;
    const now = v != null && (s.cmp === 'больше' ? v > s.value : v < s.value);
    s.history.push({at:asOf, value:v, met:now});
    if(now && s.was !== true){
      const n = {id:'n-'+(++RP.state.subSeq), to:s.owner, kind:'сигнал', at:asOf, sub:s.id,
        text:'«'+t.name+'»: '+statName(s.stat)+' '+s.cmp+' '+money(s.value)+' — стало выполняться на '+fmt(asOf)+
          ' ('+money(v)+')', mail:'ссылка на отчёт в АСУБК (без чисел)'};
      RP.state.notices.push(n); fired.push(n.id);
    }
    s.was = now;
  }));
  return {ok:true, sent, fired, note:'подписок разослано '+sent.length+', сигналов сработало '+fired.length};
};

/* ---- Рабочая заметка (§2.10, ОГ-31) -------------------------------------
   Привязана к дате данных; на другой дате видна с пометкой «к прошлой дате».
   В личном отчёте её видит автор, в общем и официальном — все, кто видит
   отчёт, с ответами. Вывода заметка не заменяет: вывод — обзор анализа.    */
RP.addNote = (tid, n) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(!RP.maySee(tid)) return {ok:false, why:'отчёт вам не виден'};
  const o = n || {};
  if(!String(o.text || '').trim()) return {ok:false, why:'заметка без текста'};
  if(!o.asOf) return {ok:false, why:'заметка привязана к дате данных: «к данным на …» — без даты её не прочесть'};
  if(o.conclusion) return {ok:false, why:'заметка — не вывод: формальный вывод — аналитический обзор модуля '+
    'анализа, подписанный и ссылающийся на выпуск (ADR-0153)'};
  const target = clone(o.target || {kind:'отчёт'});
  if(['отчёт', 'строка', 'ячейка'].indexOf(target.kind) === -1) return {ok:false, why:'заметка ставится на отчёт, строку или ячейку'};
  /* Строка — объект ответа, ячейка — объект × колонка состава (волна 36):
     заметка к тому, чего в отчёте нет, никому не прочесть.                  */
  if(target.kind !== 'отчёт'){
    const ed = liveEd(t) || draftEd(t), ob = OBJ(target.row);
    if(!ob || ob.type !== ed.object) return {ok:false, why:'строки «'+target.row+'» в отчёте нет: заметка к строке ставится на объект ответа'};
    if(RP.viewer().scope.indexOf(ob.dept) === -1) return {ok:false, why:'объект «'+ob.no+'» вам не виден: заметку к нему не поставить'};
    target.no = ob.no;
    if(target.kind === 'ячейка'){
      if(ed.fields.indexOf(target.col) === -1) return {ok:false, why:'колонки «'+target.col+'» в составе отчёта нет: ячейка — строка × колонка'};
      target.colName = (FIELD(ed.object, target.col) || {name: target.col}).name;
    }
  }
  const note = {id:'nt-'+(++RP.state.subSeq), tpl:tid, asOf:o.asOf, target, text:o.text, by: RP.who(),
    at: RP.state.today, replies:[]};
  RP.state.notes.push(note);
  return {ok:true, id:note.id};
};
const noteVisible = (note, who) => { const t = TPL(note.tpl);
  return levelOf(t) === 'личный' ? note.by === who : RP.maySee(note.tpl); };
RP.notesFor = (tid, asOf) => RP.state.notes.filter(n => n.tpl === tid && noteVisible(n, RP.who()))
  .map(n => Object.assign(clone(n), {past: n.asOf !== asOf,
    label: n.asOf === asOf ? 'к данным на '+fmt(n.asOf) : 'к прошлой дате — данным на '+fmt(n.asOf),
    at: n.target.kind === 'строка' ? 'к строке '+n.target.no : n.target.kind === 'ячейка' ? 'к ячейке '+n.target.no+' · '+n.target.colName : 'к отчёту'}));
RP.replyNote = (id, text) => { const n = RP.state.notes.find(x => x.id === id);
  if(!n || !noteVisible(n, RP.who())) return {ok:false, why:'заметки нет или она вам не видна'};
  if(levelOf(TPL(n.tpl)) === 'личный') return {ok:false, why:'в личном отчёте отвечать некому: заметку видит только автор'};
  if(!String(text || '').trim()) return {ok:false, why:'ответ без текста'};
  n.replies.push({by: RP.who(), at: RP.state.today, text}); return {ok:true}; };

/* ---- Колонки-даты официальной формы (ОГ-35, ADR-0282 п. 4, волна 36) ----
   Даты — часть утверждённого состава и объявлены ОТ ОТЧЁТНОЙ ДАТЫ выпуска
   (относительными значениями §3 п. 5): «на начало года», «за отчётный месяц»,
   «с начала года», «тот же период прошлого года». Выпуск разворачивает их в
   конкретные даты и печатает каждую в паспорте. Строки формы двух сортов:
   остаток берётся на дату (statSlice), поток — за период из событий платежа
   (statRows) с их датами; остаток за период и поток на дату — пустая клетка
   с причиной, а не ноль. Окончательно форма сдаётся, только когда закрыт
   КАЖДЫЙ месяц, которого касается хоть одна колонка.                        */
const TIME_COL_KINDS = {
  'на дату':            {key:'at',   vals:['отчётная дата', 'начало месяца', 'начало квартала', 'начало года']},
  'за период':          {key:'span', vals:['отчётный месяц']},
  'нарастающий итог':   {key:'from', vals:['с начала квартала', 'с начала года']},
  'аналогичный период': {key:'of',   vals:null}
};
const FLOWS = {'pay-sum':{name:'Поступило платежей', unit:'сом'}, 'pay-cnt':{name:'Платежей', unit:'ед.'}};
const shiftYear = (d, n) => (+d.slice(0, 4) + n) + d.slice(4);
/* Начало отчётного месяца: снимок на 1-е отвечает за предыдущий месяц. */
function repStart(asOf){ const y = +asOf.slice(0, 4), m = +asOf.slice(5, 7);
  if(asOf.slice(8) !== '01') return asOf.slice(0, 7)+'-01';
  return m === 1 ? (y - 1)+'-12-01' : y+'-'+String(m - 1).padStart(2, '0')+'-01'; }
const quarterStart = d => d.slice(0, 5)+String(Math.floor((+d.slice(5, 7) - 1) / 3) * 3 + 1).padStart(2, '0')+'-01';
/* Месяцы, которых касается колонка: дата — месяц, за который она отвечает;
   период [с, по) — каждый месяц внутри.                                      */
function monthsOf(c){
  if(c.at) return [periodOfAsOf(c.at)];
  const out = []; let d = c.from;
  for(let g = 0; g < 60 && d.localeCompare(c.to) === -1; g++){ out.push(monthLabel(d)); d = firstOfNext(d); }
  return out;
}
function timeColsCheck(ed){
  const cols = ed.timeCols || []; if(!cols.length) return null;
  if(ed.mode !== 'на дату') return 'колонки-даты бывают у формы «на дату»: у «сейчас» дата одна — момент вопроса';
  const ids = cols.map(c => c.id);
  if(uniq(ids).length !== ids.length) return 'колонка-дата названа дважды';
  for(const c of cols){
    const k = TIME_COL_KINDS[c.kind];
    if(!k) return 'колонки «'+c.kind+'» не бывает: '+Object.keys(TIME_COL_KINDS).join(' · ');
    if(!String(c.name || '').trim()) return 'у колонки-даты должно быть имя: оно печатается в форме и в паспорте';
    if(k.vals && k.vals.indexOf(c[k.key]) === -1) return 'колонка «'+c.name+'»: «'+c[k.key]+'» — не из набора: '+k.vals.join(' · ');
    if(c.kind === 'аналогичный период'){
      const base = cols.find(x => x.id === c.of);
      if(!base) return 'колонка «'+c.name+'» — аналогичный период какой колонки? «'+c.of+'» в форме нет';
      if(base.kind === 'аналогичный период') return 'колонка «'+c.name+'»: аналогичный период от аналогичного не берётся';
    }
  }
  if(!(ed.stats || []).length && !(ed.flows || []).length) return 'у колонок-дат нет строк: форма объявляет показатели или потоки';
  return null;
}
function resolveCol(c, asOf, cols){
  const rs = repStart(asOf);
  if(c.kind === 'на дату'){
    const at = {'отчётная дата':asOf, 'начало месяца':rs, 'начало квартала':quarterStart(rs), 'начало года':rs.slice(0, 4)+'-01-01'}[c.at];
    return {id:c.id, name:c.name, kind:c.kind, sort:'остаток', at, text:'на '+fmt(at)};
  }
  if(c.kind === 'аналогичный период'){
    const b = resolveCol(cols.find(x => x.id === c.of), asOf, cols);
    return b.at ? {id:c.id, name:c.name, kind:c.kind, sort:'остаток', at: shiftYear(b.at, -1), of:c.of, text:'на '+fmt(shiftYear(b.at, -1))}
      : {id:c.id, name:c.name, kind:c.kind, sort:'поток', from: shiftYear(b.from, -1), to: shiftYear(b.to, -1), of:c.of,
         text:fmt(shiftYear(b.from, -1))+' — '+fmt(addDays(shiftYear(b.to, -1), -1))};
  }
  const from = c.kind === 'за период' ? rs : (c.from === 'с начала года' ? rs.slice(0, 4)+'-01-01' : quarterStart(rs));
  return {id:c.id, name:c.name, kind:c.kind, sort:'поток', from, to: asOf, text: fmt(from)+' — '+fmt(addDays(asOf, -1))};
}
/* Таблица формы на отчётную дату: строки × колонки-даты. Своего счёта нет:
   остаток — statSlice на дату колонки, поток — события платежа из statRows,
   отобранные датой события (обороты — по событийным объектам, ADR-0282 п. 3). */
function timeTable(ed, asOf, cut, scope){
  const cols = (ed.timeCols || []).map(c => resolveCol(c, asOf, ed.timeCols));
  cols.forEach(c => { c.months = monthsOf(c);
    c.open = c.months.filter(m => { const p = RP.state.periods[m]; return !p || p.state !== 'закрыт'; });
    /* Источник — свойство месяца, а значит, колонки (ADR-0307 п. 5): месяцы,
       закрытые переносом, называются в паспорте и сноской формы.             */
    c.legacy = c.months.filter(m => { const p = RP.state.periods[m]; return p && p.origin === 'легаси'; });
    const own = c.months.filter(m => c.legacy.indexOf(m) === -1 && !preLaunch(m)),
      lost = c.months.filter(m => c.legacy.indexOf(m) === -1 && preLaunch(m));
    c.source = !c.legacy.length ? null
      : c.legacy.length === c.months.length ? 'из легаси — перенос, '+MIGRATION.text
      : 'состав: из легаси ('+monthSpan(c.legacy)+') — перенос, '+MIGRATION.text+
        (own.length ? '; свои — '+monthSpan(own) : '')+(lost.length ? '; до запуска, переносом не закрыты — '+monthSpan(lost) : '');
    /* Поток за месяц, по которому перенос событий не дал, — не ноль. */
    c.noEvents = c.months.filter(m => { const ps = SEAM.periodSource(m); return ps && !ps.events; });
    /* Остаток на конец месяца, который перенос дал одними событиями, без итога. */
    c.noTotal = c.sort === 'остаток' && c.legacy.length ? legacyNoTotal(c.at) : null; });
  /* Платёж режется подразделением; отбор строк отчёта (перечень кредитов) —
     по кредиту платежа, а не по id самого платежа.                          */
  const pays = SEAM.statRows('payment', asOf, {dept: (cut || {}).dept || null}, scope);
  if(cut && cut.ids) pays.rows = pays.rows.filter(p => cut.ids.indexOf(p.credit) !== -1);
  const flowVal = (fid, c) => { const ev = pays.rows.filter(p => p.date.localeCompare(c.from) !== -1 && p.date.localeCompare(c.to) === -1);
    return fid === 'pay-sum' ? ev.reduce((a, p) => a + p.amount, 0) : ev.length; };
  const rows = ed.stats.map(sid => ({id:sid, name: statName(sid), unit:(SEAM.statMeta(sid) || {}).unit || '', sort:'остаток',
      cells: cols.map(c => { if(c.sort !== 'остаток') return {col:c.id, value:null, gap:'остаток за период не складывается'};
        /* Конец месяца из легаси без итога — «нет навсегда»: клетка пустая с
           причиной, выпуск не предварительный; «снимка нет» (ИО-8) — только у
           месяца, у которого снимок ещё может появиться (ADR-0309 п. 1–2).    */
        if(c.noTotal) return {col:c.id, value:null, gap:'в легаси не собиралось', note:'итог месяца не перенесён ('+c.noTotal+')'};
        if(HIST_DATES.indexOf(c.at) === -1) return {col:c.id, value:null, gap:'снимка на '+fmt(c.at)+' нет'};
        const sl = SEAM.statSlice(sid, null, cut, c.at, scope);
        if(sl.value == null) return {col:c.id, value:null, gap: sl.why || 'величины нет'};
        return {col:c.id, value: roundTo(sl.value, dpOf(ed, sid))}; })}))
    .concat((ed.flows || []).map(fid => ({id:fid, name: FLOWS[fid].name, unit: FLOWS[fid].unit, sort:'поток',
      cells: cols.map(c => c.sort !== 'поток' ? {col:c.id, value:null, gap:'поток берётся за период, а не на дату'}
        : c.noEvents.length ? {col:c.id, value:null, gap:'события в легаси не перенесены ('+c.noEvents.join(', ')+')'}
        : {col:c.id, value: flowVal(fid, c)})})));
  const open = [];
  cols.forEach(c => c.open.forEach(m => { if(open.indexOf(m) === -1) open.push(m); }));
  return {anchor: asOf, cols, rows, open,
    gaps: rows.reduce((a, r) => a.concat(r.cells.filter(x => x.gap && x.gap.indexOf('снимка') === 0)
      .map(x => '«'+cols.find(c => c.id === x.col).name+'»: '+x.gap)), []).filter((x, i, a) => a.indexOf(x) === i),
    dates: cols.map(c => c.name+' — '+c.text),
    /* Паспорт: источник у каждой колонки, касающейся месяцев до запуска, и
       клетки, которых в легаси нет, — поимённо (ADR-0307 п. 5, 7).          */
    sources: cols.filter(c => c.source).map(c => '«'+c.name+'»: '+c.source),
    legacyGaps: rows.reduce((a, r) => a.concat(r.cells.filter(x => x.gap && /в легаси/.test(x.gap))
      .map(x => r.name+' × «'+cols.find(c => c.id === x.col).name+'» — '+x.gap+(x.note ? ': '+x.note : ''))), []),
    seams: ['statSlice ×'+cols.filter(c => c.sort === 'остаток').length, 'statRows (платёж)']};
}
/* Месяцы подряд — диапазоном: «январь 2025 — июль 2025». */
function monthSpan(ms){ return !ms.length ? '—' : ms.length === 1 ? ms[0] : ms[0]+' — '+ms[ms.length - 1]; }
/* Месяц до запуска системы: закрыть его может только перенос. */
function monthIso(label){ const p = String(label).split(' ');
  return p[1]+'-'+String(MONTHS_N.indexOf(p[0]) + 1).padStart(2, '0')+'-01'; }
const preLaunch = m => monthIso(m).localeCompare(LAUNCH) === -1;
/* Почему форму нельзя сдать окончательно на эту дату: каждый незакрытый месяц
   назван вместе с колонкой, которая его касается.                           */
function timeColsOpenWhy(tt){
  if(!tt || !tt.open.length) return null;
  /* Месяц до запуска, который перенос не дал, назван с причиной: закрыть его
     потом нечем — по такой колонке только предварительный выпуск (ADR-0307 п. 7). */
  return 'окончательная сдача — только когда закрыты все периоды формы (ОГ-35): не закрыты '+
    tt.cols.filter(c => c.open.length).map(c => { const own = c.open.filter(m => !preLaunch(m)), pre = c.open.filter(preLaunch);
      return [own.length ? own.join(', ') : null,
              pre.length ? pre.join(', ')+' — до запуска системы, переносом не закрыт' : null].filter(Boolean).join('; ')+
        ' (колонка «'+c.name+'»)'; }).join('; ');
}
RP.formColumns = (tid, asOf, dept) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  const ed = liveEd(t) || draftEd(t);
  if(!(ed.timeCols || []).length) return {ok:false, why:'колонок-дат в составе «'+t.name+'» нет: дата у ответа одна'};
  if(!asOf) return {ok:false, why:'колонки-даты считаются от отчётной даты: она не названа'};
  const tt = timeTable(ed, asOf, {dept: dept || null}, RP.viewer().scope.slice());
  return Object.assign({ok:true, why: timeColsOpenWhy(tt)}, tt);
};
/* Колонки-даты объявляет черновая редакция: это состав вопроса, он идёт на
   утверждение вместе с остальным (ИО-21). У официального — новой редакцией. */
RP.setTimeCols = (tid, cols) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'у бланка колонок-дат нет: он говорит об одном объекте на одну дату'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'колонки-даты объявляет черновая редакция: у «'+t.name+'» черновика нет — '+
    'заведите новую редакцию, она пойдёт на утверждение'};
  if(!RP.isAuth() && t.owner !== RP.who()) return {ok:false, why:'черновик правит его автор или уполномоченный'};
  const bad = timeColsCheck(Object.assign({}, ed, {timeCols: cols || []}));
  if(bad) return {ok:false, why: bad};
  ed.timeCols = clone(cols || []);
  log('колонки-даты в черновике «'+t.name+'»: '+(cols || []).map(c => c.name).join(', '));
  return {ok:true, note:'колонок-дат '+(cols || []).length+': войдут в утверждённый состав и в паспорт каждого выпуска'};
};

/* ---- Режим времени и фильтр сохраняются (ADR-0282, ADR-0281, волна 36) ----
   В виде — отличием от отчёта, в личном и общем отчёте — его умолчанием.
   В официальный не входят: у него даты — колонки формы, отбор — параметры. */
function flexCheck(t, ed, flex){
  const f = flex || {};
  if(f.time){ const r = RP.timeAnswer(t.id, f.time, {asOf: RP.defaultAsOf(), dept:''});
    if(!r.ok) return 'режим времени: '+r.why; }
  if(f.filter){ const bad = filterCheck(ed, f.filter); if(bad) return 'фильтр: '+bad; }
  return null;
}
const timeText = s => !s ? null : (s.mode === 'сравнение' ? 'сравнение '+fmt(s.a)+' → '+fmt(s.b)
  : s.mode === 'динамика' ? 'динамика '+fmt(s.from)+' — '+fmt(s.to)+' по '+(s.step === 'квартал' ? 'кварталам' : 'месяцам')
  : s.mode === 'за период' ? 'за период '+fmt(s.from)+' — '+fmt(s.to) : s.mode);
RP.setReportFlex = (tid, flex) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'у бланка режима времени и фильтра нет'};
  const lv = levelOf(t);
  if(lv === 'официальный') return {ok:false, why:'в официальном режим времени — его колонки-даты, а отбор — параметры '+
    'утверждённой редакции: свой режим и фильтр держат в виде поверх него'};
  const ed = lv === 'общий' ? verEd(t) : draftEd(t);
  if(lv === 'личный' && t.owner !== RP.who()) return {ok:false, why:'личный отчёт правит его автор'};
  if(lv === 'общий' && t.owner !== RP.who() && (t.coauthors || []).indexOf(RP.who()) === -1)
    return {ok:false, why:'общий отчёт правят владелец и соавторы'};
  const bad = flexCheck(t, ed, flex); if(bad) return {ok:false, why: bad};
  ed.flex = {time: clone((flex || {}).time || null), filter: clone((flex || {}).filter || null)};
  const what = [timeText(ed.flex.time), ed.flex.filter ? 'фильтр «'+filterText(ed.flex.filter)+'»' : null].filter(Boolean).join(', ') || 'сняты';
  if(lv === 'общий') ed.changed = 'изменён '+fmt(RP.state.today)+' ('+RP.who()+'): режим и фильтр — '+what;
  log('режим и фильтр отчёта «'+t.name+'»: '+what);
  return {ok:true, note:'сохранено в отчёте: '+what+' — так он и открывается'};
};
/* Что показывает экран по умолчанию: вид перекрывает отчёт, отчёт — ничего. */
RP.flexOf = (tid, viewId) => {
  const t = TPL(tid); if(!t) return null;
  const ed = liveEd(t) || draftEd(t), own = ed.flex || {};
  const vw = viewId ? RP.state.views.find(x => x.id === viewId && x.tpl === tid) : null;
  const d = vw ? vw.diff || {} : {};
  const pick = k => d[k] !== undefined ? {v: d[k], from:'вид «'+vw.name+'»'} : (own[k] ? {v: own[k], from:'отчёт'} : {v:null, from:null});
  const tm = pick('time'), fl = pick('filter');
  let dropped = null;
  if(fl.v){ const bad = filterCheck(ed, fl.v);
    if(bad){ dropped = 'фильтр «'+filterText(fl.v)+'» больше не годится ('+bad+') — снят'; fl.v = null; fl.from = null; } }
  return {time: tm.v ? {spec: clone(tm.v), text: timeText(tm.v), from: tm.from} : null,
    filter: fl.v ? {f: clone(fl.v), text: filterText(fl.v), from: fl.from} : null, dropped};
};

/* ---- Линейный график динамики (ОГ-10): тот же ряд statSeries, что в таблице ---- */
function lineOf(tid, spec, params){
  const r = RP.timeAnswer(tid, Object.assign({}, spec, {mode:'динамика'}), params);
  if(!r.ok) return r;
  const tr = r.tracks[0];
  /* Месяц без снимка рвёт линию: нуля там нет, есть «снимка нет». */
  const segs = []; let cur = [];
  tr.points.forEach(p => { if(p.value == null){ if(cur.length) segs.push(cur); cur = []; } else cur.push(p); });
  if(cur.length) segs.push(cur);
  return {ok:true, kind:'линия', stat: tr.name, unit: tr.unit, points: tr.points, segments: segs,
    gaps: tr.points.filter(p => p.gap).map(p => p.at), passport: r.passport,
    note:'линия рисуется по тому же ряду statSeries, что таблица динамики; месяц без снимка — разрыв, а не ноль'};
}
function lineSvg(c){
  const w = 360, h = 140, padL = 8, padR = 8, padT = 14, padB = 22, n = c.points.length;
  const vals = c.points.filter(p => p.value != null).map(p => p.value), max = Math.max.apply(null, vals.concat([1]));
  const x = i => padL + (n > 1 ? i * (w - padL - padR) / (n - 1) : 0), y = v => padT + (1 - v / max) * (h - padT - padB);
  const idx = p => c.points.indexOf(p);
  return '<svg class="chart line" viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:460px" role="img" aria-label="линейный график">'+
    c.segments.map(sg => '<polyline fill="none" stroke="var(--asubk-blue)" stroke-width="2" points="'+
      sg.map(p => x(idx(p)).toFixed(1)+','+y(p.value).toFixed(1)).join(' ')+'"></polyline>'+
      sg.map(p => '<circle cx="'+x(idx(p)).toFixed(1)+'" cy="'+y(p.value).toFixed(1)+'" r="3" fill="var(--asubk-blue)"><title>'+
        esc(monthLabel(p.at)+': '+(c.unit === 'сом' ? money(p.value) : p.value))+'</title></circle>').join('')).join('')+
    c.points.map((p, i) => '<text x="'+x(i).toFixed(1)+'" y="'+(h - 6)+'" font-size="9" text-anchor="middle" fill="currentColor">'+
      esc(p.at.slice(5, 7))+'</text>'+(p.gap ? '<text x="'+x(i).toFixed(1)+'" y="'+(h - padB - 2)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">—</text>' : '')).join('')+
    '</svg>';
}

/* ======================= МУТАЦИИ СОСЕДЕЙ (демо) ======================= */
RP.renameField = (objType, fid, newId, newName) => {
  const o = FIELDS[objType]; if(!o) return {ok:false, why:'объекта нет'};
  const f = o.fields.find(x => x.id === fid); if(!f) return {ok:false, why:'поля нет'};
  f.id = newId; f.name = newName || f.name;
  log('ядро переименовало поле «'+fid+'» → «'+newId+'» в перечне объекта «'+o.name+'»');
  const broken = RP.brokenTemplates();
  return {ok:true, broken, note:'публичный перечень — шов: переименование ломает утверждённую редакцию '+
    'и называет виновника ('+o.owner+'), сломано отчётов и бланков: '+broken.length+' (ADR-0158 §4)'};
};
RP.withdrawStat = sid => {
  const s = STAT(sid); if(!s) return {ok:false, why:'показателя нет'};
  s.withdrawn = RP.state.today;
  const list = RP.breakingTemplates(sid);
  log('статистика вывела показатель «'+s.name+'» из реестра');
  return {ok:true, breaking:list, note:'владельцу реестра показан список отчётов и бланков, которые '+
    'сломаются: '+list.length+' (§16)'};
};
RP.breakingTemplates = sid => RP.state.templates
  .filter(t => t.editions.some(e => e.stats.indexOf(sid) !== -1))
  .map(t => ({id:t.id, name:t.name,
    where: t.editions.filter(e => e.stats.indexOf(sid) !== -1).map(e => 'ред. '+e.n+' ('+e.state+')')}));

/* ========================= ШВЫ НАРУЖУ (§12) =========================== */
const SEAMS_OUT = [
  {id:'reportIssues',      q:'что предъявлялось по этому объекту или этому лицу',
    to:'карточка объекта зеркалом, классификация и взыскание — по лицу',
    keys:['объект','лицо']},
  {id:'reportObligations', q:'что за подразделением к сроку',           to:'задачи и руководитель'},
  {id:'reportTemplate',    q:'пригоден ли отчёт для обзора, какая редакция текущая', to:'анализ'},
  {id:'reportForms',       q:'что я вообще могу отсюда напечатать',
    to:'карточка объекта', keys:['объект']}
];
const NO_SEAM_OUT = {
  reportRows:    'строк ответа шов не отдаёт: за строками ходят в выпуск, где рядом стоит его '+
                 'паспорт — число без паспорта не показывается (ИО-6)',
  reportDraft:   'черновиков шов не отдаёт: незаконченный состав, показанный как отчёт, '+
                 'читается как отчёт (ИО-1)',
  reportQuery:   'произвольного запроса отчётность не отдаёт и не имеет: у неё самой своих '+
                 'запросов к базе нет, только четыре шва (ИО-3)'
};
const CONSUMERS = [
  {module:'карточка объекта (ядро)', may:['reportIssues','reportForms'], by:['объект'],
    note:'зеркало «какие бумаги уходили», и — швом «reportForms» — что вообще можно '+
      'напечатать (единая витрина печатных форм, а не своя у карточки, ADR-0224)'},
  {module:'классификация', may:['reportIssues'], by:['лицо'],
    note:'уклонение от подписания акта сверки — признак лица, а не договора (п. 11 п.п. 2)'},
  {module:'взыскание',     may:['reportIssues'], by:['лицо','объект'],
    note:'мера спрашивает, ушёл ли бланк; требование поручителю адресовано лицу (ADR-0166 §5)'},
  {module:'задачи',        may:['reportObligations'], note:'обязательство — основание задачи; '+
    'поручает человек (ИО-13)'},
  {module:'руководитель',  may:['reportObligations'], note:'календарь своего подразделения'},
  {module:'анализ',        may:['reportTemplate'],    note:'обзор ссылается на отчёт и на выпуск, '+
    'своего снимка не заводит (ИО-16)'},
  {module:'статистика',    may:[], why:'отчётность статистике не отдаёт ничего швом: список '+
    'отчётов и бланков, ломающихся при выводе показателя, — экран владельца реестра, а не контракт'}
];
RP.seamsOut = () => clone(SEAMS_OUT);
RP.noSeamOut = () => clone(NO_SEAM_OUT);
RP.consumers = () => clone(CONSUMERS);
/* Шов «что предъявлялось» спрашивается двумя ключами — по объекту и по лицу.
   Ключ второй, а не шов пятый: отвечает тот же выпуск теми же полями. Классификации
   (п. 11 п.п. 2, «уклонение от подписания акта сверки») и взысканию нужен разрез
   по лицу: у одного заёмщика договоров несколько, а уклоняется он один (ADR-0167 §5). */
const issueRow = i => ({id:i.id, kind:i.kind, at:i.at, tpl:i.tplName,
  to: i.recipient ? i.recipient.name : null, toRef: i.recipient ? (i.recipient.ref || null) : null,
  toKind: i.recipient ? (i.recipient.kind || null) : null,
  role: i.recipient ? (i.recipient.role || null) : null,
  obj: i.obj, objNo: OBJ(i.obj) ? OBJ(i.obj).no : null, doc: i.doc || null, number: issueNumber(i)});
/* Номер выпуска — не его поле: у договора это номер кредита, у остального —
   номер, который журнал документооборота дал документу при регистрации.     */
function issueNumber(i){ if(i.number) return i.number;
  const d = i.doc ? DOC(i.doc) : null; return d ? d.number : null; }
RP.issueNumber = id => { const i = ISS(id); return i ? issueNumber(i) : null; };
RP.reportIssues = objId => RP.state.issues.filter(i => i.obj === objId).map(issueRow);
/* Ключ «лицо» отбирает по ВИДУ получателя, а не по совпадению ссылки: служебная
   записка ушла подразделению, и попасть в историю лица она не должна, даже если
   идентификаторы когда-нибудь окажутся похожи (ADR-0168 §4).                  */
RP.issuesToSubject = subjId => RP.state.issues
  .filter(i => i.recipient && i.recipient.kind === 'роль' && i.recipient.ref === subjId)
  .map(issueRow);
/* Шов «что я вообще могу отсюда напечатать» (ADR-0224, ИО-37): единственная витрина
   печатных форм — здесь, а не в карточке. В v1 все объекты — «кредит» (ADR-0181 §4),
   так что фильтра по виду объекта не требуется; когда видов станет больше, добавится
   сверка ed.object с видом objId. Пустой список — тоже ответ, и с причиной.        */
RP.reportForms = objId => { const items = RP.state.templates
    .filter(t => t.kind === 'бланк' && pubEd(t) && RP.maySee(t.id))
    .map(t => ({id:t.id, name:t.name, edition: pubEd(t).n}));
  if(!items.length) return {ok:true, items:[], why:'бланков, применимых к этому виду объекта '+
    'и видных спрашивающему, нет — либо не заведены, либо круг бланка сюда не дотягивается (ИО-23)'};
  return {ok:true, items}; };
/* Ключ обязательства несёт объявленного получателя: у формы, которую к одному
   сроку сдают двоим, два ключа и два состояния. Фактический получатель — рядом:
   «кто выпустил окончательно и с каким получателем» (ADR-0306 п. 5).        */
RP.reportObligations = dep => RP.obligations().filter(o => o.dept === dep)
  .map(o => { const i = o.issue ? ISS(o.issue) : null;

RP.callSeamOut = (module, seam, arg) => {

  if(!SEAMS_OUT.some(s => s.id === seam)) return {ok:false, why:'шва «'+seam+'» у отчётности нет'};

RP.addFormula = (tid, f) => {

  if(t.kind !== 'отчёт') return {ok:false, why:'у бланка формул нет: он печатает поля одного объекта'};
  const lv = levelOf(t);
  if(lv === 'официальный') return {ok:false, why:'своя формула в официальный отчёт не входит: в сдачу '+
    'не уходит формула, которую автор поправил в прошлом месяце. Посчитать её на экране можно накруткой '+
    'или в своём виде; нужна в сдаче — передайте владельцу реестра статистики, она станет показателем, '+
    'или уполномоченный объявит производную колонку (ADR-0281 п. 2, ОГ-В1)'};
  const ed = lv === 'общий' ? verEd(t) : draftEd(t);
  if(lv === 'личный' && t.owner !== RP.who()) return {ok:false, why:'личный отчёт правит его автор'};
  if(lv === 'общий' && t.owner !== RP.who() && (t.coauthors || []).indexOf(RP.who()) === -1)
    return {ok:false, why:'общий отчёт правят владелец и соавторы'};
  const bad = formulaCheck(f, ed.mode); if(bad) return {ok:false, why: bad};
  const nf = Object.assign({id:'ф-'+(++RP.state.fseq)}, clone(f));
  ed.formulas = (ed.formulas || []).concat([nf]);
  if(lv === 'общий') ed.changed = 'изменён '+fmt(RP.state.today)+' ('+RP.who()+'): добавлена своя формула «'+nf.name+'»';
  log('своя формула «'+nf.name+'» = '+formulaExpr(nf)+' в отчёте «'+t.name+'»');
  return {ok:true, id: nf.id, note:'своя формула «'+nf.name+'» = '+formulaExpr(nf)+': считается на каждом '+
    'уровне заново из величин уровня, помечена и в паспорте; в официальный отчёт не входит'};
};
RP.ownFormula = () => ({ok:false, why:'своя формула — в личном и общем отчёте и в виде, а в официальный '+

/* ==================== ВЁРСТКА МАКЕТА БЛАНКА (§8) ======================

   проверка на публикации проверяла бы не то, что напечатается.              */
/* Синтаксис один — ${…}. Поле пишется русским именем из публичного перечня:
   ${Заёмщик.ФИО}; вид значения — после черты, из закрытого набора:
   ${Заёмщик.ФИО | род.}. Повтор и условие — парами русских меток; условие —
   из закрытого списка; общая часть — фрагментом. Языка шаблонов нет: ни
   вложенных повторов, ни арифметики, ни выражений в условии. Запись {{…}}
   проверка отклоняет.                                                      */
const VALUE_VIEWS = ['род.','дат.','вин.','тв.','прописью','число и прописью',
  '«15» октября 2026 г.','ДД.ММ.ГГГГ'];
const REPEATS = {'каждый Платёж':'payment', 'каждая СтрокаГрафика':'schedule'};
const CONDITIONS = ['есть Поручитель','есть Залогодатель',
  'Кредит.Состояние = действует','Кредит.Состояние = просрочен','Кредит.Состояние = закрыт'];
const FRAGMENTS = {
  'Шапка': 'ОАО «Государственный фонд кредитования» · 720040, г. Бишкек',
  'Подпись председателя': 'Председатель Правления ______________ / подпись, печать',
  'Реквизиты': 'Реквизиты фонда: р/с 1280016000000000 · БИК 128001'};
RP.valueViews = () => VALUE_VIEWS.slice();
RP.conditions = () => CONDITIONS.slice();
RP.fragments = () => Object.keys(FRAGMENTS);
const fieldByRu = path => { for(const obj of SEAM.objectTypes()){
    const f = SEAM.fieldList(obj).fields.find(x => x.ru === path);
    if(f) return {obj, f}; }
  return null; };
function parseLayout(text, objType, mode){
  const obj = objType || 'credit', list = SEAM.fieldList(obj);
  const items = [], errors = [], fields = [], repeats = [], conds = [];
  let rep = null, cond = null;
  const err = (line, raw, why) => { errors.push({line, raw, why}); return false; };
  String(text || '').split('\n').forEach((ln, i) => {
    const line = i + 1;
    for(const m of ln.matchAll(/\{\{([^{}]+)\}\}/g))
      items.push({line, raw:m[0], kind:'старая запись', ok: err(line, m[0], 'запись '+m[0]+
        ' не принимается: поле пишется ${…} русским именем — например ${Заёмщик.ФИО}')});
    for(const m of ln.matchAll(/\$\{([^{}]+)\}/g)){
      const inner = m[1].trim(), raw = m[0];
      let mm;
      if((mm = inner.match(/^Повтор:\s*(.+)$/))){
        const ro = REPEATS[mm[1].trim()];
        let ok = true;
        if(rep) ok = err(line, raw, 'повтор внутри повтора не бывает: закройте ${Конец повтора}');
        else if(!ro) ok = err(line, raw, 'повтора «'+mm[1].trim()+'» нет: повторяются '+
          Object.keys(REPEATS).join(' · '));
        /* Повтор работает в режиме бланка: у «на дату» строки повтора отвечает
           статистика, и объект строки обязан быть её объектом (ADR-0305 п. 4). */
        else if(mode === 'на дату' && STAT_OBJECTS.indexOf(ro) === -1){
          /* блок открыт, чтобы его конец и поля не дали ложных ошибок; в
             повторы выпуска отклонённый блок не попадает                     */
          ok = err(line, raw, 'строки '+(ro === 'schedule' ? 'графика' : '«'+FIELDS[ro].name+'»')+
            ' на дату не хранятся — повтор у бланка «на дату» невозможен: на дату повторяется только '+
            STAT_OBJECTS.filter(o => Object.values(REPEATS).indexOf(o) !== -1).map(o => FIELDS[o].name).join(', '));
          rep = {obj: ro, line, fields: [], rejected: true}; }
        else rep = {obj: ro, line, fields: []};
        items.push({line, raw, kind:'повтор', ok});
      } else if(inner === 'Конец повтора'){
        let ok = true;
        if(!rep) ok = err(line, raw, '${Конец повтора} без начала повтора');
        else { if(!rep.rejected) repeats.push(rep); rep = null; }
        items.push({line, raw, kind:'конец повтора', ok});
      } else if((mm = inner.match(/^Если:\s*(.+)$/))){
        const c = mm[1].trim();
        let ok = true;
        if(cond) ok = err(line, raw, 'условие внутри условия не бывает: закройте ${Конец условия}');
        else if(CONDITIONS.indexOf(c) === -1) ok = err(line, raw, 'условие «'+c+'» не из списка: '+
          CONDITIONS.join(' · '));
        else { cond = {text: c, line}; conds.push(c); }
        items.push({line, raw, kind:'условие', ok, cond: c});
      } else if(inner === 'Конец условия'){
        let ok = true;
        if(!cond) ok = err(line, raw, '${Конец условия} без начала условия');
        else cond = null;
        items.push({line, raw, kind:'конец условия', ok});
      } else if((mm = inner.match(/^Фрагмент:\s*(.+)$/))){
        const fr = mm[1].trim();
        const ok = !!FRAGMENTS[fr] || err(line, raw, 'фрагмента «'+fr+'» нет: '+Object.keys(FRAGMENTS).join(' · '));
        items.push({line, raw, kind:'фрагмент', ok, fragment: fr});
      } else {
        const parts = inner.split('|').map(x => x.trim());
        const path = parts[0], view = parts[1] || null;
        const hit = fieldByRu(path);
        let ok = true;
        if(rep && hit && hit.obj === rep.obj){ rep.fields.push(hit.f.id); }
        else if(hit && hit.obj === obj){ fields.push(hit.f.id); }
        else { fields.push(path);
          ok = err(line, raw, 'в макете ${'+path+'} — объект «'+list.name+'» такого поля не объявляет'+
            (rep && hit ? '' : '')); }
        if(view && VALUE_VIEWS.indexOf(view) === -1) ok = err(line, raw, 'вид значения «'+view+
          '» неизвестен: '+VALUE_VIEWS.join(' · '));
        items.push({line, raw, kind:'поле', ok, path, view, id: hit ? hit.f.id : null,
          obj: hit ? hit.obj : null, inRepeat: !!rep});
      }
    }
  });
  if(rep) err(rep.line, '${Повтор: …}', 'повтор не закрыт: нет ${Конец повтора}');
  if(cond) err(cond.line, '${Если: '+cond.text+'}', 'условие не закрыто: нет ${Конец условия}');
  return {fields: uniq(fields), items, errors, repeats, conds};
}
function parseSubs(text){ return parseLayout(text, 'credit').fields; }
RP.parseLayout = parseLayout;
RP.parseSubs = parseSubs;
/* Русское имя поля по техническому ключу — для палитры и подсказок. */

RP.setLayout = (tid, text) => {

  if(t.kind !== 'бланк') return {ok:false, why:'макет верстается у бланка: у отчёта состав — это '+

RP.newEdition = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  if(!RP.isAuth()) return {ok:false, why:'новую редакцию заводит уполномоченный по отчётности'};
  if(draftEd(t)) return {ok:false, why:'черновая редакция уже есть — '+draftEd(t).n+
    ': двух незаконченных составов у одного отчёта или бланка не бывает'};
  const base = pubEd(t);
  if(!base) return {ok:false, why:'копировать нечего: утверждённой редакции нет'};

  t.editions.push(ed);
  log('заведена редакция '+ed.n+' «'+t.name+'»');

RP.insertToken = (tid, kind, id) => {

RP.setBands = (tid, bands) => {
  const g = draftForEdit(tid); if(!g.ok) return g;

  if(miss.length) return {ok:false, why:'полоса «'+miss[0]+'» из листа выброшена: полосы '+
    'переставляются, но не пропадают — лист состоит из '+BANDS.join(' · ')};
  const bad = bands.filter(b => BANDS.indexOf(b) === -1);
  if(bad.length) return {ok:false, why:'полосы «'+bad[0]+'» в листе не бывает'};

    why:'итог поставлен ПЕРЕД уровнями: так печатает легаси, и читающий видит общую сумму '+
    'раньше слагаемых, из которых она якобы сложена. Итог — последняя полоса тела листа (ОЧ-26)'};
  if(bands.indexOf('шапка') > bands.indexOf('уровни')) return {ok:false,
