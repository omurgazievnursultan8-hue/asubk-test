    '<div class="fld"><label>Причина закрытия</label><input id="wlWhy" placeholder="обзвон окончен"></div>'+
    '</div><div class="btn-row">'+
      '<button class="btn btn-primary btn-sm" onclick="RP.uiHand(\''+w.id+'\')">Передать</button>'+
      '<button class="btn btn-success btn-sm" onclick="act(RP.issueByWorklist(\'t-portfolio\',\''+w.id+
        '\',{kind:\'предварительный\'}))">Выпустить отчёт по списку</button>'+
      '<button class="btn btn-danger btn-sm" onclick="RP.uiCloseWL(\''+w.id+'\')">Закрыть список</button>'+
    '</div><div class="foot-pass">Список — <b>законный параметр отбора</b> следующего выпуска: '+
      'перечень объектов уходит в разрез и спрашивается тем же швом. Пятого шва это не потребовало.</div></div>';
  h += '</div><div class="side">';
  h += '<div class="card"><h3 class="small">Чего список не делает</h3><div class="btn-row">'+
    '<button class="btn btn-secondary btn-sm" onclick="act(RP.addToWorklist(\''+w.id+'\',\'kr-1\'))">Добавить объект</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="act(RP.deleteWorklist(\''+w.id+'\'))">Удалить список</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="act(RP.worklistTask(\''+w.id+'\'))">Поручить обзвон</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="act(RP.demoCloseObject(\''+w.objects[0]+'\'))">Ядро закрывает кредит</button>'+
    '</div></div>';
  h += '</div></div>';
  return h;
}

/* ---------------------------- ДАШБОРД (§10) -------------------------- */
RP.uiAddTile = () => { const s = $('#dashTpl');
  act(RP.addTile(s ? s.value : null, {asOf:'2026-08-01', dept:''})); };
function scDash(){
  const tiles = RP.dashTiles(), personal = RP.dashPersonal();
  const vis = RP.visibleTemplates();
  let h = '<div class="page-lead">Плитка — способ показать <em>объявленный отчёт</em>: своего '+
    'состава у неё нет, внешних источников не бывает, клик раскрывает отчёт целиком (§10). '+
    'Раскладка <b>объявлена на роль</b> — первый день не начинается с пустого экрана; поверх живёт '+
    'личная перекладка со «вернуть как объявлено». Личная раскладка — не личный отчёт.</div>';

  h += '<div class="banner '+(personal ? 'warn' : 'info')+'">Раскладка: <b>'+
    (personal ? 'личная перекладка' : 'как объявлено на роль «'+esc(RP.viewer().title)+'»')+
    '</b> · плиток '+tiles.length+
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="act(RP.resetDash())">'+
      'Вернуть как объявлено</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="act(RP.dashPassport())">Паспорт дашборда</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="act(RP.addExternalTile(\'https://bi.example/kpi\'))">'+
      'Плитка из внешнего источника</button></div></div>';

  if(!tiles.length) h += '<div class="banner info">На эту роль плиток не объявлено.</div>';
  tiles.forEach((tile, i) => {
    const d = RP.tileData(tile);
    h += '<div class="card"><h3>'+esc(d ? d.name : tile.tpl)+'</h3>';
    if(!d) h += '<div class="banner danger">Шаблона нет.</div>';
    else if(d.broken) h += '<div class="banner danger"><b>Отчёт неисполним:</b> '+esc(d.broken)+
      '. Плитка это говорит, а не показывает пустое место.</div>';
    else {
      h += '<div class="totals">'+d.totals.map(x => '<div class="tot"><div class="tn">'+esc(x.name)+
        '</div><div class="tv">'+(x.value == null ? '—' : esc(money(x.value)))+' <span class="small">'+
        esc(x.unit)+'</span></div><div class="tp">'+esc(x.why || 'по видимым строкам (§13.2)')+
        '</div></div>').join('')+'</div>';
      h += '<div class="small muted">строк в ответе: '+d.rows+'</div>';
      h += passportBox(d.passport, false);
      if(d.soft.length) h += '<div class="banner warn">'+esc(d.soft.join('; '))+'</div>';
    }
    h += '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="RP.openIssue(\''+
      tile.tpl+'\')">Раскрыть целиком</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="act(RP.removeTile('+i+'))">Убрать плитку</button>'+
      '</div></div>';
  });

  h += '<div class="card"><h3>Добавить плитку</h3><div class="form-row"><div class="fld">'+
    '<label>Шаблон (только видимый)</label><select id="dashTpl">'+vis.map(id =>
      '<option value="'+id+'">'+esc(TPL(id).name)+' · '+esc(TPL(id).kind)+
      (pubEd(TPL(id)) ? '' : ' · черновик')+'</option>').join('')+'</select></div></div>'+
    '<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="RP.uiAddTile()">Добавить</button></div>'+
    '<div class="foot-pass">Паспорт — <b>у каждой плитки</b>, не у экрана: рядом стоят «на дату» и '+
      '«сейчас», и один паспорт сверху создавал бы вид единой даты, которого нет (ИО-15).</div></div>';
  return h;
}

/* --------------------------- ГРАНИЦЫ МАКЕТА -------------------------- */
function scBounds(){
  return '<div class="page-lead">Макет — <em>исполняемый стандарт поведения</em>, а не приложение. '+
    'Он доказывает исполнением закон отчётности: объявленный состав, две ступени выпуска, снимок и '+
    'расхождение, обязательства из правила, бланк с подстановками из перечня, рабочий список и '+
    'дашборд. Ниже — то, чего в нём сознательно нет.</div>'+
  '<div class="card"><h3>Чего в макете нет и почему</h3><div class="facts">'+
    '<div class="f no"><b>ЭЦП и штамп подписи.</b> Открытый вопрос §19 п. 4: пока не решено, '+
      'подписывается ли выпуск в модуле или файл уходит на подпись наружу. Рисовать кнопку раньше '+
      'решения — значит решить его молча.</div>'+
    '<div class="f no"><b>Настоящие файлы xls/pdf/docx.</b> Форматы названы и различены по ступеням '+
      '(наружу с получателем — только pdf, ИО-10), но генерация файла — работа реализации, не закона.</div>'+
    '<div class="f no"><b>Соседи.</b> Подразделения, показатели, поля, объекты и адресаты заведены '+
      'зеркалом ровно на ширину шва: эталон у оргструктуры, статистики, ядра и справочников '+
      '(ADR-0157 §3). Свои запросы к базе и свои формулы в модуле запрещены (ИО-2, ИО-3) — '+
      'проверяется смоуком по отмеченному блоку движка.</div>'+
    '<div class="f no"><b>Вторая дата у ответа.</b> Дата состояния одна (ИО-19). Сравнение двух '+
      'состояний — отдельный вопрос: чей это разрез, что печатается в столбцах и как называется '+
      'отклонение, ещё не решено (§19 п. 6). В легаси вторая дата приделана к КАЖДОЙ ячейке, и '+
      'лист смешивает остаток на 01.07 со ставкой на 01.08.</div>'+
    '<div class="f no"><b>Настоящая очередь заданий.</b> Состояния выпуска ('+
      RP.jobStates().join(' → ')+') показаны и проверяются, но шаг делается кнопкой, а не '+
      'исполнителем: макет показывает состояния, а не изображает медленность.</div>'+
    '<div class="f no"><b>Хранилище.</b> Состояние живёт в памяти страницы: «Сбросить макет» '+
      'возвращает начальную сцену вместе с зеркалами соседей.</div>'+
    '</div></div>'+
  '<div class="card"><h3>Отказы, вычитанные из легаси (сверка 24.08.2026)</h3>'+
    '<div class="small">Старая система умеет всё это — и каждый раз ценой того, что ответ '+
    'перестаёт быть проверяемым. Кнопки ниже показывают отказы вслух, а не прячут их за '+
    'отсутствием кнопки.</div>'+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFold(\'t-npl\')">Сложить доли по подразделениям</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doBands(\'t-avg\')">Итог перед группами</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doColDate(\'t-overdue\')">Столбец на свою дату</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doRuleList()">Правило отбора рабочим списком</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doSheetLast()">Поправить лист у сданного выпуска</button>'+
    '</div>'+
    '<div class="foot-pass">Источник: <span class="mono">requirements/legacy/10-reports.md</span> — '+
    'метамодель отчётности старой системы и два прогона на живых данных (51 268 субъектов, '+
    '90–107 с синхронного счёта).</div></div>'+
  '<div class="card"><h3>Что доказано исполнением</h3><div class="facts">'+
    '<div class="f yes"><em>Движок не знает базы.</em> В отмеченном блоке нет имён OBJECTS, HIST, '+
      'STATS, FIELDS — только четыре шва.</div>'+
    '<div class="f yes"><em>Затравочные выпуски настоящие.</em> Снимки в журнале произвёл сам '+
      'RP.issue, а не литерал в коде.</div>'+
    '<div class="f yes"><em>Расхождение заработано.</em> Период переоткрыт, снимок статистики изменён, '+
      'пересчёт разошёлся со сданным — и выпуск помечен расхождением сам.</div>'+
    '<div class="f yes"><em>Подстановки выведены разбором.</em> Список подстановок бланка нигде не '+
      'хранится: единственный источник правды — текст макета.</div>'+
    '</div></div>';
}

RP.doSheetLast = () => { const done = RP.state.issues.filter(i => i.state === 'готов');
  const last = done[done.length - 1];
  act(last ? RP.setSheetOnIssue(last.id, {orient:'альбомная'})
           : {ok:false, why:'готовых выпусков нет — править нечего'}); };

/* --------------------------- КАРКАС ЭКРАНА --------------------------- */
const VIEWS = {
  showcase:{title:'Отчётность', fn:scShowcase},
  registry:{title:'Реестр шаблонов', fn:scRegistry},
  builder: {title:'Конструктор',     fn:scBuilder},
  issue:   {title:'Показ и выпуск отчёта', fn:scIssue},
  journal: {title:'Журнал выпусков', fn:scJournal},
  calendar:{title:'Календарь сдачи', fn:scCalendar},
  blank:   {title:'Верстальщик макета бланка', fn:scBlank},
  worklists:{title:'Рабочие списки',  fn:scWorklists},
  dash:    {title:'Дашборд',          fn:scDash},
  seams:   {title:'Швы и соседи',    fn:scSeams},
  bounds:  {title:'Границы макета',  fn:scBounds}
};
function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const el = document.createElement('div');
  el.className = 'toast'+(kind ? ' '+kind : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 7000);
}
function act(res, okMsg){
  if(res && res.ok) toast(okMsg || res.note || 'готово','ok');
  else toast((res && res.why) || 'отказано','err');
  render();
}
RP.go = v => { RP.state.view = v; render(); };
RP.setRole = title => { RP.state.role = title;
  toast('роль: '+title+'; область видимости — '+ROLE(title).scope.map(deptName).join('; '),'ok');
  render(); };
function render(){
  if(typeof document === 'undefined') return;
  const st = RP.state, view = VIEWS[st.view] ? st.view : 'registry';
  document.getElementById('title').textContent = VIEWS[view].title;
  document.getElementById('panel').innerHTML = VIEWS[view].fn();
  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.v === view));
  const sel = document.getElementById('role');
  if(sel.options.length !== ROLE_TITLES.length){
    sel.innerHTML = ROLE_TITLES.map(t => '<option>'+esc(t)+'</option>').join(''); }
  sel.value = st.role;
  const v = RP.viewer(), obl = RP.obligations();
  document.getElementById('foot').innerHTML =
    '<div class="row"><b>'+fmt(st.today)+'</b> — сегодня в макете</div>'+
    '<div class="row">видно: '+esc(v.scope.map(deptName).join('; '))+'</div>'+
    '<div class="row">шаблонов видно: '+RP.visibleTemplates().length+' из '+st.templates.length+'</div>'+
    '<div class="row">выпусков: '+st.issues.length+', просрочено обязательств: '+
      obl.filter(o => o.state === 'просрочено').length+'</div>';
}
RP.seed();
if(typeof window !== 'undefined'){ window.RP = RP; window.SEAM = SEAM; window.act = act;
  window.VIEWS = VIEWS; }
render();
</script>
