<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-green-hover:#106A36; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:290px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.app.nav-off .sidebar{ width:0; border-right:none; overflow:hidden; }
.app.nav-off .sidebar *{ visibility:hidden; }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:14px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-sec:first-child{ padding-top:2px; }
.nav-sec small{ display:block; margin-top:3px; text-transform:none; letter-spacing:0;
  font:var(--weight-regular) 11px/1.4 var(--asubk-font); color:var(--text-placeholder); }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.nav-item.locked{ color:var(--text-placeholder); }
.sidebar-foot{ padding:12px 16px; border-top:1px solid var(--border-default);
  font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-muted); }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.topbar .menu{ display:flex; color:var(--text-muted); cursor:pointer; flex:none; }
.topbar .menu:hover{ color:var(--text-heading); }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; }

/* ---- headings, notes ---- */
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.page-lead{ font:var(--font-label); color:var(--text-muted); margin:2px 0 16px; max-width:900px; }
.note{ font:var(--font-label); color:var(--text-muted); margin:8px 0 0; max-width:900px; }
.note code, .page-lead code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); }

/* ---- banners ---- */
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }

/* ---- pills ---- */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

/* ---- tables ---- */
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); color:var(--text-muted); }
table.cgrid tbody tr.hl td{ background:var(--asubk-blue-tint); }
/* Разделитель групп набран как рубрика (та же манера, что у разделов меню), а не
   как вторая серая шапка: двух одинаковых полос подряд глаз не различает. */
table.cgrid tbody tr.sect td{ background:var(--surface-card); padding:11px 12px 5px;
  border-top:1px solid var(--border-strong); border-bottom:1px solid var(--asubk-grid-line);
  font:var(--weight-semibold) 11.5px/1.4 var(--asubk-font); color:var(--text-muted);
  text-transform:uppercase; letter-spacing:0.05em; }
table.cgrid tbody tr.sect:first-child td{ border-top:none; }
table.cgrid tbody tr.sect .n{ font-weight:var(--weight-regular); color:var(--text-muted); }
table.cgrid td.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.cgrid tfoot td{ padding:9px 12px; background:var(--surface-panel);
  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }

/* ---- cards ---- */
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.card.frozen{ background:var(--asubk-gray-50); border-color:var(--border-strong); }
.cols{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.side{ flex:0 0 260px; } .body{ flex:1; min-width:460px; }
.meta{ font:var(--font-label); color:var(--text-muted); margin:0 0 10px; }
.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:230px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input, .fld textarea{ border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.fld select, .fld input{ height:var(--control-h); }
.fld textarea{ min-height:92px; padding:8px 10px; min-width:100%; resize:vertical; font:var(--font-label); }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
.form-row.tight{ gap:10px; }

/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }

/* ---- toast ---- */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
    .cgrid tr.grp td{background:var(--asubk-tint-fill);border-top:1px solid var(--border-strong)}
.cgrid tr.grp.g2 td{background:var(--surface-hover);padding-left:22px}
.cgrid tr.gtot td{background:var(--asubk-green-tint);font-size:12px}
.bands{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px}
    .band{display:inline-block;padding:4px 10px;border:1px solid var(--border-default);border-radius:6px;
      background:#fff;font-size:12px}
    .band.lv{border-color:var(--asubk-blue);color:var(--asubk-blue)}
    .band.tot{border-color:var(--asubk-green);color:var(--asubk-green);font-weight:600}
    .bands .arr{color:var(--text-muted);font-size:12px}
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }

/* ---- зеркало чужого поля (ИА-9, ADR-0155 §1) ---- */
.mirror{ border:1px dashed var(--border-strong); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-panel); padding:10px 14px; margin-bottom:12px; }
.mirror .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.mirror .row:last-child{ margin-bottom:0; }
.mirror .k{ color:var(--text-muted); display:inline-block; min-width:190px; }
.mirror.err{ border-left-color:var(--asubk-red); }
.mirror.none{ border-left-color:var(--asubk-amber); }

/* ---- паспорт снимка (ADR-0153 §1) ---- */
.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-green);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:190px; }
.pass.warn{ border-left-color:var(--asubk-amber); }

/* ---- документ ---- */
.doc-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
.doc-head h2{ margin:0; font:var(--weight-semibold) 18px/1.2 var(--asubk-font); color:var(--text-heading); }
.verdict{ font:var(--weight-semibold) 15px/1.3 var(--asubk-font); color:var(--text-heading); }
.concl{ font:var(--font-label); color:var(--text-body); white-space:pre-wrap; margin:6px 0 0; }
.thr{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.lineform{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px 16px; }

/* ---- отчётность: снимок, паспорт выпуска, шов ---- */
.snap{ border:1px solid var(--border-strong); border-left:3px solid var(--asubk-green);
  border-radius:var(--radius-md); background:var(--asubk-gray-50); padding:10px 14px; margin-bottom:12px; }
.snap.prelim{ border-left-color:var(--asubk-amber); background:var(--surface-card); }
.snap .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.snap .row:last-child{ margin-bottom:0; }
.snap .k{ color:var(--text-muted); display:inline-block; min-width:200px; }
.seam{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-blue);
  border-radius:var(--radius-md); background:var(--surface-panel); padding:8px 12px; margin-bottom:10px;
  font:var(--font-label); color:var(--text-body); }
.seam .q{ color:var(--text-muted); }
.sheet{ border:1px solid var(--border-strong); border-radius:var(--radius-md);
  background:var(--surface-card); padding:16px 18px; margin-bottom:12px; }
.sheet .sheet-h{ font:var(--weight-semibold) 15px/1.3 var(--asubk-font); color:var(--text-heading); margin-bottom:2px; }
.sheet .sheet-sub{ font:var(--font-label); color:var(--text-muted); margin-bottom:12px; }
.foot-pass{ margin-top:10px; padding-top:8px; border-top:1px dashed var(--border-default);
  font:var(--weight-regular) 12px/1.5 var(--asubk-font); color:var(--text-muted); }
.foot-pass b{ color:var(--text-body); font-weight:var(--weight-medium); }
.totals{ display:flex; gap:20px; flex-wrap:wrap; margin:10px 0 2px; }
a.drill{ color:var(--text-link); text-decoration:none; border-bottom:1px dashed currentColor; }
a.drill:hover{ border-bottom-style:solid; }
.prog{ display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.prog .bar{ display:inline-block; width:90px; height:6px; border-radius:3px; background:var(--asubk-gray-200); overflow:hidden; }
.prog .bar span{ display:block; height:100%; background:var(--asubk-green); }
.wlprog{ margin:6px 0 10px; font:var(--font-label); }
/* ---- верстальщик: проверка документом ---- */
.lcheck{ position:relative; border:1px solid var(--border-default); border-radius:var(--radius-md);
  background:var(--surface-card); padding:10px 12px; font-family:'Times New Roman',Georgia,serif; font-size:14px;
  line-height:1.55; overflow-x:auto; }
.lcheck.sample::after{ content:'ОБРАЗЕЦ'; position:absolute; right:14px; top:8px; font:600 22px/1 var(--font-family, sans-serif);
  letter-spacing:4px; color:rgba(224,58,58,0.18); transform:rotate(-8deg); pointer-events:none; }
.lcheck .ln{ display:flex; gap:10px; min-height:20px; }
.lcheck .ln .no{ flex:0 0 22px; color:var(--text-placeholder); font:11px/22px ui-monospace,Menlo,Consolas,monospace; text-align:right; }
.lcheck .ln .tx{ flex:1; min-width:0; overflow-wrap:anywhere; }
.tk{ border-radius:3px; padding:0 2px; }
.tk.ok{ background:rgba(21,132,67,0.14); box-shadow:inset 0 -1px 0 var(--asubk-green); }
.tk.bad{ background:var(--asubk-red-tint); color:var(--asubk-red); box-shadow:inset 0 -2px 0 var(--asubk-red); cursor:help; }
.tk.mark{ color:var(--text-muted); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
.tk.frag{ background:var(--asubk-tint-fill); color:var(--text-muted); font-style:italic; }
.blk{ border:2px solid var(--asubk-green); border-radius:var(--radius-md); padding:2px 6px 4px; margin:4px 0; }
.blk.cond{ border-color:var(--asubk-amber); }
.blk.cond.off{ opacity:.45; border-style:dashed; }
.blk.bad{ border-color:var(--asubk-red); }
.blk-h{ display:block; font:11px/18px var(--font-family, sans-serif); color:var(--text-muted); }
.legend{ margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.blk-l{ border:2px solid var(--asubk-green); border-radius:4px; padding:0 6px; }
.blk-l.cond{ border-color:var(--asubk-amber); }
/* своя формула — помечена везде, где показана */
.note-mk{ color:var(--asubk-amber, #b7791f); font-size:12px; cursor:help; }
tr.noted td:first-child{ box-shadow: inset 3px 0 0 var(--asubk-amber, #b7791f); }
.tcols th .small{ font-weight:400; }
.own{ display:inline-block; padding:0 5px; border-radius:3px; background:var(--asubk-amber-tint); color:var(--text-body);
  font:var(--font-label); cursor:help; }
.tot.own-f{ border-style:dashed; }
/* PDF-форма: страница с полями */
.pf-page{ border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-panel);
  padding:12px; display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
.pf-f{ border:1px dashed var(--asubk-green); border-radius:4px; padding:4px 6px; background:var(--surface-card); min-width:0; }
.pf-f.bad{ border-color:var(--asubk-red); background:var(--asubk-red-tint); }
.pf-f .mono{ display:block; font-size:12px; overflow-wrap:anywhere; }
.pf-n{ display:block; font:var(--font-label); color:var(--text-muted); }
.pf-t{ grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px;
  border-top:1px solid var(--asubk-grid-line); padding-top:8px; }
.pf-t > .pf-n{ grid-column:1 / -1; }
/* сравнение редакций: изменённые строки и бумага «до и после» рядом */
.lcheck.diff .ln.add{ background:var(--asubk-green-tint); }
.lcheck.diff .ln.del{ background:var(--asubk-red-tint); text-decoration:line-through; color:var(--text-muted); }
.lcheck.diff .ln .no{ flex-basis:54px; }
.cmp2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:720px){ .cmp2{ grid-template-columns:1fr; } }
/* Телефон (ОГ-Д1): меню не занимает экран — свёрнуто по умолчанию и
   открывается поверх содержимого кнопкой ☰; выбор пункта его закрывает.
   Широкие таблицы листаются внутри себя, страница вбок не едет.           */
@media (max-width:760px){
  .app:not(.nav-open) .sidebar{ display:none; }
  .app.nav-open .sidebar{ position:fixed; z-index:60; left:0; top:0; height:100vh; width:min(290px, 86vw);
    box-shadow:0 0 0 100vmax rgba(15,25,40,0.35); }
  .panel-wrap{ padding:14px 16px 48px; }
  .topbar{ padding:8px 16px; }
  .topbar .right{ margin-left:0; width:100%; min-width:0; }
  .topbar .right > span{ display:flex; align-items:center; width:100%; min-width:0; }
  .topbar select{ flex:1; min-width:0; width:100%; }
  table.cgrid{ display:block; overflow-x:auto; max-width:100%; }
  .content{ overflow-x:hidden; }
}
.errlist .er{ padding:5px 0; border-bottom:1px dashed var(--asubk-grid-line); font:var(--font-label); color:var(--asubk-red); }
.errlist .er a{ color:var(--text-link); margin-right:6px; }
.pal{ display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--asubk-grid-line); flex-wrap:wrap; }
.pal .mono{ font-size:12px; overflow-wrap:anywhere; }
.pal .ex{ flex:1; min-width:80px; color:var(--text-muted); font:var(--font-label); }
.cols > .side.wide{ flex-basis:320px; }
.pal-g{ margin:10px 0 2px; font:var(--font-label); font-weight:var(--weight-semibold); color:var(--text-heading); }
.tot{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:9px 14px; background:var(--surface-panel); min-width:210px; }
.tot .tn{ font:var(--font-label); color:var(--text-muted); }
.tot .tv{ font:var(--weight-semibold) 18px/1.25 var(--asubk-font); color:var(--text-heading);
  font-variant-numeric:tabular-nums; }
.tot .tp{ font:var(--weight-regular) 11.5px/1.4 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0; }
.step{ display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; }
.step .num{ flex:none; width:22px; height:22px; border-radius:50%; background:var(--asubk-blue-tint);
  color:var(--asubk-blue); font:var(--weight-semibold) 12px/22px var(--asubk-font); text-align:center; }
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin:0 0 14px; }
.tabs button{ appearance:none; border:none; background:none; cursor:pointer;
  font:var(--weight-medium) var(--text-sm)/1.4 var(--asubk-font); color:var(--text-muted);
  padding:9px 14px 8px; border-bottom:2px solid transparent;
  display:flex; align-items:center; gap:7px; }
.tabs button:hover{ color:var(--text-heading); background:var(--surface-hover); }
.tabs button.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); }
.tabs .n{ font-variant-numeric:tabular-nums; color:var(--text-placeholder); }
.tabs.sub{ border-bottom:none; margin-top:-6px; }
.tabs.sub button{ font-size:13px; padding-top:4px; padding-bottom:4px; }
.tabs button.on .n{ color:var(--asubk-blue); }
.tabs .burn{ background:var(--asubk-red); color:var(--asubk-white); border-radius:var(--radius-pill);
  font:var(--weight-semibold) 11px/1 var(--asubk-font); padding:3px 6px; }

/* ---- витрина ---- */
/* Таблица сама себе рамка: карточка вокруг неё давала рамку в рамке и отступ,
   из-за которого шапка столбцов висела в воздухе. */
.tblwrap{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  overflow:hidden; background:var(--surface-card); margin-bottom:14px; }
.tblwrap > table.cgrid{ border:none; }
.tblwrap table.cgrid tbody tr:not(.sect):hover td{ background:var(--surface-hover); }
.fname{ font:var(--weight-medium) var(--text-sm)/1.35 var(--asubk-font); color:var(--text-heading); }
.fmeta{ margin-top:4px; display:flex; flex-wrap:wrap; gap:5px 8px; align-items:center;
  font:var(--weight-regular) 12px/1.4 var(--asubk-font); color:var(--text-muted); }
.fmeta .code{ font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--text-placeholder); }
.fmeta .tag{ background:var(--asubk-tint-fill); border-radius:3px; padding:1px 6px; }
.fmeta .to{ color:var(--text-body); }
/* Состояние строки названо словом и держится полосой на срезе, а не заливкой
   всей строки: заливка гасила и название формы — единственное, что ищут глазами. */
table.cgrid tbody tr.out td{ background:var(--asubk-gray-50); }
table.cgrid tbody tr.out td:first-child{ box-shadow:inset 3px 0 var(--asubk-gray-200); }
table.cgrid tbody tr.gap td:first-child{ box-shadow:inset 3px 0 var(--asubk-amber); }
/* Полоса на срезе строки — то же красное, что и на корешке вкладки: счётчик
   говорит, где горит, полоса — какая именно строка. */
table.cgrid tbody tr.late td:first-child{ box-shadow:inset 3px 0 var(--asubk-red); }
table.cgrid tbody tr.out .fname{ color:var(--text-body); }
.pt{ font:var(--weight-medium) 13px/1.35 var(--asubk-font); color:var(--text-body);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.dash{ color:var(--text-placeholder); }
table.cgrid thead th .th-sub{ display:block; margin-top:2px;
  font:var(--weight-regular) 11.5px/1.3 var(--asubk-font); color:var(--text-muted); }
.form-row .fld input.wide{ min-width:320px; }
td.act{ text-align:right; white-space:nowrap; }

/* ============================================================================
   КОНСТРУКТОР: ЛИЧНЫЙ ЧЕРНОВИК — классы, которых нет у остальных экранов.
   Портировано волной 24 из бывшего отдельного файла konstruktor.html (удалён, слит сюда);
   общие с остальными экранами классы
   (.card, .banner, .pill, .btn, .fld, .chip, .topbar, table.cgrid и т.п.) не
   дублируются — экран использует уже объявленные выше. Мелкие расхождения в
   отступах между двумя макетами (были: .form-row 10px/14px, .fld 4px/5px и т.п.)
   не тянутся — экран использует те же числа, что и остальные экраны.
   ============================================================================ */
.kb a{ color:var(--text-link); }

/* ---- две колонки: состав слева, ответ справа ---- */
.two{ display:flex; gap:20px; align-items:flex-start; padding:18px 24px 40px; }
.compose{ flex:0 0 420px; min-width:360px; }
.answer{ flex:1; min-width:520px; }
@media (max-width:1100px){ .two{ flex-direction:column; } .compose,.answer{ flex:none; width:100%; min-width:0; } }

/* ---- шапка страницы (крошка/чип «кто вы» внутри экрана) ---- */
.crumb b{ color:var(--text-body); font-weight:var(--weight-medium); }
.chip .who{ color:var(--asubk-blue); }
.chip small{ font-weight:var(--weight-regular); color:var(--text-muted); }

/* ---- баннеры, пилюли ---- */
.why.no{ color:var(--asubk-red); }
.why.amb{ color:var(--asubk-amber); }

/* ---- кнопки, поля ---- */
.btn-xs{ height:24px; padding:0 7px; font-size:12px; font-weight:var(--weight-medium); }
.seg{ display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius-md); overflow:hidden; }
.seg button{ appearance:none; border:none; background:var(--surface-card); color:var(--text-body);
  font:var(--weight-medium) 13px/1 var(--asubk-font); padding:0 12px; height:32px; cursor:pointer; }
.seg button.on{ background:var(--asubk-blue); color:#fff; }
.seg button + button{ border-left:1px solid var(--border-strong); }

/* ---- строки состава ---- */
.opt{ display:flex; align-items:flex-start; gap:8px; padding:5px 0; border-bottom:1px dashed var(--asubk-grid-line); cursor:pointer; }
.opt:last-child{ border-bottom:none; }
.opt input[type=checkbox]{ margin-top:4px; }
.opt .t{ flex:1; font:var(--font-label); color:var(--text-body); }
.opt .t small{ display:block; color:var(--text-muted); font-size:12px; }
.opt .t small.no{ color:var(--asubk-red); }
.opt.off .t{ color:var(--text-placeholder); }
.opt .u{ color:var(--text-placeholder); font-size:12px; white-space:nowrap; }
.cutrow{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--asubk-grid-line); flex-wrap:wrap; }
.cutrow .lvl{ flex:none; width:22px; height:22px; border-radius:50%; background:var(--asubk-blue-tint);
  color:var(--asubk-blue); font:var(--weight-semibold) 12px/22px var(--asubk-font); text-align:center; }
.cutrow .nm{ font:var(--font-label); color:var(--text-body); min-width:120px; }
.cutrow select{ height:26px; font-size:12.5px; border:1px solid var(--border-strong); border-radius:var(--radius-md);
  background:var(--surface-card); padding:0 6px; }
.cutrow label.tot{ font:var(--weight-regular) 12.5px/1.3 var(--asubk-font); color:var(--text-muted); display:inline-flex; gap:4px; align-items:center; cursor:pointer; }
.cutrow .ctl{ margin-left:auto; display:inline-flex; gap:4px; }
.fltrow{ display:grid; grid-template-columns:1.3fr .9fr 1.2fr 26px; gap:6px; align-items:center; padding:5px 0; }
.fltrow select, .fltrow input{ height:28px; font-size:12.5px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); background:var(--surface-card); padding:0 6px; min-width:0; }
.addrow{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.addrow select{ height:28px; font-size:12.5px; border:1px solid var(--border-strong); border-radius:var(--radius-md);
  background:var(--surface-card); padding:0 6px; max-width:260px; }

/* ---- шапка показа и паспорт ---- */
.snap{ border:1px solid var(--border-strong); border-left:3px solid var(--asubk-amber);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.snap .hd{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.snap .hd b{ font:var(--weight-semibold) 15px/1.3 var(--asubk-font); color:var(--text-heading); }
/* Висячий отступ: перенесённая строка значения не уходит под ключ. */
.snap .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; padding-left:178px; text-indent:-178px; }
/* ключ строки — сам по себе блок: висячий отступ строки на него не наследуется */
.snap .row .k{ text-indent:0; min-width:178px; }

/* ---- дерево ---- */
table.cgrid thead th.num{ text-align:right; }
table.cgrid thead th.num .th-sub{ text-align:right; }
table.cgrid tr.grp td{ background:var(--asubk-tint-fill); border-top:1px solid var(--border-strong); font-weight:var(--weight-medium); }
table.cgrid tr.grp.g2 td{ background:var(--surface-hover); border-top:none; font-weight:var(--weight-regular); }
table.cgrid tr.grp.g3 td{ background:var(--surface-card); border-top:none; }
table.cgrid tr.grp .ind{ display:inline-block; }
table.cgrid tr.grp .cnt{ color:var(--text-muted); font-weight:var(--weight-regular); font-size:12px; margin-left:6px; }
table.cgrid tr.gtot td{ background:var(--asubk-green-tint); font-size:12.5px; }
table.cgrid tr.gtot td:first-child{ color:var(--asubk-green); font-weight:var(--weight-medium); }
table.cgrid tr.obj td{ font-size:12.5px; color:var(--text-muted); background:var(--surface-card); }
table.cgrid tr.obj td:first-child{ padding-left:36px; }
table.cgrid tr.obj td .f{ color:var(--text-body); }
table.cgrid tr.obj td .sep{ color:var(--text-placeholder); margin:0 6px; }
table.cgrid tr.obj td .chip{ display:inline-block; margin-left:6px; padding:0 6px; border-radius:var(--radius-pill);
  background:var(--asubk-tint-fill); color:var(--text-muted); font-size:11.5px; line-height:18px; white-space:nowrap; }
table.cgrid tr.root td{ background:var(--surface-panel); font-weight:var(--weight-semibold); border-top:2px solid var(--border-strong); }
.empty{ padding:24px; text-align:center; color:var(--text-muted); font:var(--font-label); }

/* ---- действия и след ---- */
.refuse{ display:flex; gap:8px; align-items:baseline; font:var(--font-label); color:var(--text-muted); padding:4px 0; }
.refuse b{ color:var(--text-body); font-weight:var(--weight-medium); white-space:nowrap; }
.refuse .no{ color:var(--asubk-red); white-space:nowrap; }
.trace{ font:var(--font-label); }
.trace .it{ padding:6px 0; border-bottom:1px dashed var(--asubk-grid-line); }
.trace .it:last-child{ border-bottom:none; }
.trace .id{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--asubk-blue); margin-right:6px; }
.trace .it small{ display:block; color:var(--text-muted); font-size:12px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Модуль «Отчётность» · прототип TO-BE</small></div>
    <div class="nav">
      <!-- Три стола — раскладка, а не права: ни один экран роли не заперт (§17, ОЧ-55). -->

<script>
/* =====================================================================
 *  МОДУЛЬ «ОТЧЁТНОСТЬ» — исполняемый прототип, волна 2
 *  Слои файла: даты → мир соседей зеркалом (подразделения, адресаты, публичные
 *  перечни полей ядра, реестр показателей статистики, объекты и их снимки по датам)
 *  → ЧЕТЫРЕ ШВА → движок состава → состояние → операции (публикация, выпуск,
 *  открытие периода, обязательства, черновики документооборота) → швы наружу → экраны.
 *
 *  Главное, что этот файл доказывает исполнением: движок состава не знает базы.
 *  Он умеет спросить четыре вопроса и напечатать ответ с паспортом — ни одного
 *  обращения к массиву объектов и ни одной своей формулы в нём нет (ИО-2, ИО-3).
 * ===================================================================== */
const RP = {};

/* ------------------------------ ДАТЫ И СТРОКИ ----------------------- */
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const addDays = (iso,n) => new Date(Date.parse(iso)+n*86400000).toISOString().slice(0,10);
const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };
const dayWord = d => d + ' ' + plural(d,'день','дня','дней');
const objWord = n => n + ' ' + plural(n,'объект','объекта','объектов');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = sel => (typeof document === 'undefined' ? null : document.querySelector(sel));
const uniq = a => a.filter((x,i) => a.indexOf(x) === i);
const money = v => v == null ? '—' : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
/* своя формула печатается с объявленной разрядностью, а не целыми, как деньги */
const ownNum = x => x.shown == null ? '—' : String(x.shown).replace('.', ',');
const MONTHS_N = ['январь','февраль','март','апрель','май','июнь','июль','август',
                  'сентябрь','октябрь','ноябрь','декабрь'];
const monthLabel = iso => MONTHS_N[+iso.slice(5,7)-1] + ' ' + iso.slice(0,4);
/* Первое число месяца, следующего за месяцем даты. */
const firstOfNext = iso => { const y=+iso.slice(0,4), m=+iso.slice(5,7);
  return (m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'))+'-01'; };
const dayOfMonth = (iso, d) => iso.slice(0,7)+'-'+String(d).padStart(2,'0');

/* ================== МИР СОСЕДЕЙ — ЗЕРКАЛО, НЕ ЭТАЛОН =================
   Всё в этом блоке принадлежит другим модулям и заведено ровно на ширину шва.
   Эталон подразделений — оргструктура, показателей — статистика, полей и
   объектов — ядро, адресатов — справочники (ADR-0157 §3).                    */

/* Подразделения — зеркало ОРГСТРУКТУРЫ. `credits` различает не право, а факт:
   кредиты ведут три подразделения, а Департамент правового обеспечения их не
   ведёт — и потому в области видимости отчётности его нет. Получателем бумаги
   он при этом бывает: служебная записка об инициировании принудительного
   взыскания уходит именно туда (Порядок №41, п. 19 п.п. 2; волна 12).        */
const DEPTS = [
  {id:'dep-admin', name:'Департамент администрирования кредитов', credits:true},
  {id:'dep-prom',  name:'Отраслевой департамент промышленности',  credits:true},
  {id:'rep-osh',   name:'Региональное представительство «Ош»',    credits:true},
  {id:'dep-legal', name:'Департамент правового обеспечения',      credits:false}
];
const DEPT = id => DEPTS.find(d => d.id === id);
const deptName = id => (DEPT(id) || {name:id}).name;

/* Должности — то же зеркало оргструктуры, другой вопрос. Служебная записка о
   судебном взыскании уходит ДОЛЖНОСТИ, а не человеку (п. 21): председатель
   сменится, а адресат бумаги останется тем же. Перечень ведёт оргструктура,
   отчётность его читает и своего не заводит (ИО-2).                          */
const POSTS = [
  {id:'p-chair', name:'Председатель Правления'}
];
const POST = id => POSTS.find(p => p.id === id);

/* Справочник адресатов сдачи. Получатель — ссылка сюда, а не строка: «Минфин»
   и «МФ КР» иначе станут двумя разными адресатами в журнале (ИО-5). Держит
   ТОЛЬКО внешние организации: своё подразделение и должность получатель сдачи
   называет видом из оргструктуры, второго списка подразделений здесь нет —
   он разошёлся бы с оргструктурой при первом переименовании (ADR-0305 п. 1). */
const ADDRESSEES = [
  {id:'a-mf',  name:'Министерство финансов Кыргызской Республики', short:'Минфин КР'},
  {id:'a-kab', name:'Комитет по администрированию бюджетных кредитов', short:'Комитет'},
  {id:'a-me',  name:'Министерство экономики и коммерции Кыргызской Республики', short:'Минэконом'}
];
const ADDR = id => ADDRESSEES.find(a => a.id === id);

/* Получатель сдачи отчёта — пара «вид + значение», как у бланка (ADR-0305,
   ОГ-Д8): адресат сдачи из справочника (внешняя организация) или подразделение
   / должность из оргструктуры. Вид и решает, каким документом станет сдача:
   адресат — черновиком исходящего, подразделение и должность — внутреннего;
   признака «внешний / внутренний» у адресата нет (ADR-0305 п. 2).
   Значение в форме — ссылка: 'a-mf' (адресат), 'unit:dep-legal', 'post:p-chair'. */
const RECIPIENT_KINDS = ['адресат сдачи', 'подразделение', 'должность'];
function reportRecipient(r){
  let kind = 'адресат сдачи', ref = r;
  if(r && typeof r === 'object'){ kind = r.kind; ref = r.ref; }
  else { const m = String(r || '').match(/^(unit|post):(.+)$/);
    if(m){ kind = m[1] === 'unit' ? 'подразделение' : 'должность'; ref = m[2]; } }
  if(kind === 'адресат сдачи'){
    const a = ADDR(ref);
    if(a) return {ok:true, rec:{kind, ref, name: a.name, role:null}};
    const inner = DEPT(ref) || POST(ref);
    if(inner) return {ok:false, why:'«'+inner.name+'» — не адресат сдачи: справочник адресатов держит только '+
      'внешние организации; своё подразделение или должность получатель называет видом «подразделение» / '+
      '«должность» из оргструктуры (ADR-0305 п. 1)'};
    return {ok:false, why:'получатель — ссылка на справочник адресатов, а не строка: '+
      '«'+ref+'» и «Минфин КР» станут в журнале двумя разными адресатами (ИО-5)'};
  }
  if(kind === 'подразделение'){ const d = DEPT(ref);
    return d ? {ok:true, rec:{kind, ref, name: d.name, role:null}}
      : {ok:false, why:'подразделения «'+ref+'» в оргструктуре нет: назвать получателя некем'}; }
  if(kind === 'должность'){ const p = POST(ref);
    return p ? {ok:true, rec:{kind, ref, name: p.name, role:null}}
      : {ok:false, why:'должности «'+ref+'» в оргструктуре нет: назвать получателя некем'}; }
  return {ok:false, why:'вид получателя сдачи «'+kind+'» неизвестен: '+RECIPIENT_KINDS.join(' · ')};
}
const recipientValue = rec => rec.kind === 'подразделение' ? 'unit:'+rec.ref
  : (rec.kind === 'должность' ? 'post:'+rec.ref : rec.ref);

/* Публичные перечни полей — владелец ЯДРО (ADR-0158 §4). Отчётность их читает
   и своих не заводит. Переименование поля здесь ломает публикацию шаблона и
   называет виновником ядро, а не автора шаблона.                             */
const FIELDS = {
  /* `ru` — русское имя поля для макета бланка: ${Заёмщик.ФИО}. Оно часть
     публичного перечня наравне с техническим ключом; движку при утверждении
     отдаётся копия макета с техническими ключами. Поля связанных лиц стоят в
     перечне объекта под именем роли.                                        */
  credit: {name:'кредит', owner:'ядро · кредиты', fields:[
    {id:'no',        name:'Номер договора',          ru:'Кредит.Номер'},
    {id:'borrower',  name:'Заёмщик',                 ru:'Заёмщик.ФИО'},
    {id:'dept',      name:'Подразделение',           ru:'Кредит.Подразделение'},
    {id:'sum',       name:'Сумма договора',          ru:'Кредит.Сумма'},
    {id:'debt_main', name:'Остаток основного долга', ru:'Кредит.ОстатокОсновногоДолга'},
    {id:'days',      name:'Дней просрочки',          ru:'Кредит.ДнейПросрочки'},
    {id:'status',    name:'Состояние',               ru:'Кредит.Состояние'},
    {id:'issued',    name:'Дата выдачи',             ru:'Кредит.ДатаВыдачи'},
    {id:'guarantor', name:'Поручитель',              ru:'Поручитель.ФИО'}
  ]},
  /* Платёж — строка тела бланка: повторяющийся блок объявляет свой объект с
     отбором «принадлежит объекту бланка». Отвечает на него шов РЕЖИМА бланка:
     у «сейчас» — objectRows ядра, у «на дату» — statRows статистики на дату
     состояния (ADR-0305 п. 3).                                               */
  payment: {name:'платёж', owner:'ядро · погашения', fields:[
    {id:'date',   name:'Дата платежа',  ru:'Платёж.Дата'},
    {id:'amount', name:'Сумма платежа', ru:'Платёж.Сумма'},
    {id:'kind',   name:'Вид платежа',   ru:'Платёж.Вид'}
  ]},
  /* Строка графика — второй объект повтора: живая у ядра, а строк на дату
     статистика по ней не держит, поэтому повтор по ней у бланка «на дату»
     проверка макета отклоняет (ADR-0305 п. 4).                              */
  schedule: {name:'строка графика', owner:'ядро · кредиты', fields:[
    {id:'date',   name:'Дата по графику',  ru:'СтрокаГрафика.Дата'},
    {id:'amount', name:'Сумма по графику', ru:'СтрокаГрафика.Сумма'},
    {id:'kind',   name:'Вид платежа',      ru:'СтрокаГрафика.Вид'}
  ]},
  borrower: {name:'заёмщик', owner:'ядро · заёмщики', fields:[
    {id:'name',   name:'Наименование'},
    {id:'inn',    name:'ИНН'},
    {id:'dept',   name:'Подразделение'},
    {id:'status', name:'Состояние'}
  ]}
};
const FIELD = (obj, fid) => (FIELDS[obj] ? FIELDS[obj].fields.find(f => f.id === fid) : null);

/* Реестр показателей — владелец СТАТИСТИКА (ADR-0150). `live` — объявленная
   владельцем исчислимость налету (ADR-0159): без неё режим «сейчас» обещает
   то, чего нет. `withdrawn` — дата вывода показателя из реестра.             */
const STATS = [
  {id:'s-overdue-sum', name:'Сумма просроченной задолженности', unit:'сом', live:true},
  {id:'s-overdue-cnt', name:'Кредитов с просрочкой',            unit:'ед.', live:true},
  {id:'s-portfolio',   name:'Остаток основного долга, всего',   unit:'сом', live:true},
  {id:'s-avg-late',    name:'Средняя просрочка',                unit:'дн.', live:false,
   why:'считается ночным прогоном по живой базе: налету средняя не берётся'},
  {id:'s-recovery',    name:'Собираемость за период',           unit:'%',   live:false,
   why:'нужен закрытый период и сверка платежей — до конца периода величины нет'},
  {id:'s-npl',         name:'Доля проблемных кредитов',         unit:'%',   live:true,
   withdrawn:'2026-08-12', why:'выведен владельцем реестра: методика заменена классификацией'}
];
const STAT = id => STATS.find(s => s.id === id);

/* Объекты ядра — живое состояние («сейчас»). Два типа, и оба ЯДРА: кредит и
   лицо. Лицо заведено не для красоты — на него ссылается получатель бланка
   (ADR-0157 §3: «субъект ядра — должник, поручитель»). До волны 11 получателем
   стояло ИМЯ из поля кредита: одно лицо с двумя договорами было в журнале двумя
   получателями, а требование поручителю адресовать было некому (ОЧ-Д1).
   Поля лица берутся тем же публичным перечнем (FIELDS.borrower) — своих у
   отчётности нет (ИО-2).                                                      */
const OBJECTS = [
  /* --- лица --- */
  {id:'su-1', type:'borrower', name:'ОсОО «Ак-Дан»',          inn:'02508199410119', dept:'dep-prom',  status:'действующий'},
  {id:'su-2', type:'borrower', name:'ОсОО «Нарын-Агро»',      inn:'01703199510072', dept:'dep-prom',  status:'действующий'},
  {id:'su-3', type:'borrower', name:'ИП Садыков А. Т.',       inn:'22206198500531', dept:'rep-osh',   status:'действующий'},
  {id:'su-4', type:'borrower', name:'ОсОО «Тянь-Шань Строй»', inn:'00912200210148', dept:'dep-admin', status:'действующий'},
  {id:'su-5', type:'borrower', name:'ОсОО «Кара-Балта Мел»',  inn:'01204199810217', dept:'dep-admin', status:'действующий'},
  {id:'su-6', type:'borrower', name:'ОсОО «Ош-Текстиль»',     inn:'03011200710093', dept:'rep-osh',   status:'действующий'},
  {id:'su-7', type:'borrower', name:'КФХ «Жайыл»',            inn:'11508197400264', dept:'dep-prom',  status:'действующий'},
  {id:'su-8', type:'borrower', name:'Асанов Т. К.',           inn:'20107198200419', dept:'rep-osh',   status:'действующий'},
  /* --- кредиты. `subjects` — ссылки на лица С РОЛЬЮ: «контрагент объекта» у
         кредита не один, и какой из них получатель — знает не объект, а бланк
         (ADR-0167 §2). КД-2025/088 и КД-2024/259 — ДВА договора одного лица:
         без этой пары расхождение «договоров больше, чем заёмщиков» в зеркале
         не видно, а норма п. 9 считает заёмщиками (ОЧ-61).                    */
  {id:'kr-1', type:'credit', issued:'2024-03-12', guarantor:null, no:'КД-2024/117', borrower:'ОсОО «Ак-Дан»',          dept:'dep-prom',  sum:12000000, debt_main:7400000,  days:0,  status:'действует', closed:null, subjects:[{ref:'su-1', role:'заёмщик'}]},
  {id:'kr-2', type:'credit', issued:'2024-06-20', guarantor:null, no:'КД-2024/203', borrower:'ОсОО «Нарын-Агро»',      dept:'dep-prom',  sum:8500000,  debt_main:5100000,  days:42, status:'просрочен', closed:null, subjects:[{ref:'su-2', role:'заёмщик'}, {ref:'su-2', role:'залогодатель'}]},
  {id:'kr-3', type:'credit', issued:'2025-01-28', guarantor:null, no:'КД-2025/014', borrower:'ИП Садыков А. Т.',       dept:'rep-osh',   sum:3000000,  debt_main:1850000,  days:17, status:'просрочен', closed:null, subjects:[{ref:'su-3', role:'заёмщик'}]},
  {id:'kr-4', type:'credit', issued:'2025-04-15', guarantor:null, no:'КД-2025/088', borrower:'ОсОО «Тянь-Шань Строй»', dept:'dep-admin', sum:45000000, debt_main:31200000, days:0,  status:'действует', closed:null, subjects:[{ref:'su-4', role:'заёмщик'}]},
  {id:'kr-5', type:'credit', issued:'2023-09-05', guarantor:null, no:'КД-2023/311', borrower:'ОсОО «Кара-Балта Мел»',  dept:'dep-admin', sum:20000000, debt_main:0,        days:0,  status:'закрыт',    closed:'2026-08-14', subjects:[{ref:'su-5', role:'заёмщик'}]},
  {id:'kr-6', type:'credit', issued:'2025-07-01', guarantor:'Асанов Т. К.', no:'КД-2025/126', borrower:'ОсОО «Ош-Текстиль»',     dept:'rep-osh',   sum:6200000,  debt_main:4900000,  days:93, status:'просрочен', closed:null, subjects:[{ref:'su-6', role:'заёмщик'}, {ref:'su-8', role:'поручитель'}, {ref:'su-7', role:'залогодатель'}]},
  {id:'kr-7', type:'credit', issued:'2026-02-10', guarantor:null, no:'КД-2026/007', borrower:'КФХ «Жайыл»',            dept:'dep-prom',  sum:2500000,  debt_main:2500000,  days:0,  status:'действует', closed:null, subjects:[{ref:'su-7', role:'заёмщик'}]},
  {id:'kr-8', type:'credit', issued:'2024-11-18', guarantor:null, no:'КД-2024/259', borrower:'ОсОО «Тянь-Шань Строй»', dept:'dep-admin', sum:15000000, debt_main:9700000,  days:5,  status:'просрочен', closed:null, subjects:[{ref:'su-4', role:'заёмщик'}]},
  /* --- платежи: строки тела акта сверки и графика (повторяющийся блок) --- */

const OBJ  = id => OBJECTS.find(o => o.id === id);
const SUBJ = id => OBJECTS.find(o => o.id === id && o.type === 'borrower');
const CREDITS = () => OBJECTS.filter(o => o.type === 'credit');
/* Кто получатель бумаги об объекте — вопрос РОЛИ, а не объекта: уведомление
   уходит заёмщику, требование — поручителю, и оба они контрагенты одного
   кредита. Роль объявляет редакция бланка (ADR-0167 §2).                     */
const subjectInRole = (objId, role) => { const o = OBJ(objId);
  const link = o && (o.subjects || []).find(s => s.role === role);
  return link ? SUBJ(link.ref) : null; };
const SUBJ_ROLES = ['заёмщик','поручитель','залогодатель'];

/* ================ ВИДЫ ПОЛУЧАТЕЛЯ БЛАНКА (ADR-0168) ==================
   Волна 11 научила бланк адресоваться ЛИЦУ в объявленной роли и на том
   остановилась — потому что все пять заведённых бланков уходили наружу.
   Порядок №41 требует одиннадцать, и три из них — служебные записки ВНУТРЬ
   организации: в ДПО (п. 19 п.п. 2), Председателю Правления (п. 21) и
   отраслевому подразделению на доработку (п. 20 п.п. 1). Лица у них нет
   вовсе, и роль ядра им не подходит.

   Поэтому редакция объявляет не роль, а ВИД получателя и его значение.
   Видов четыре, и значение каждого берётся из чужого перечня — своего
   справочника адресатов у отчётности по-прежнему нет (ИО-2):

     роль                  → лицо ядра в роли у объекта (заёмщик · поручитель · залогодатель)
     подразделение         → постоянное подразделение оргструктуры (ДПО)
     подразделение объекта → то, которое ведёт этот кредит: адресат разный у каждой бумаги
     должность             → должность оргструктуры (Председатель Правления), не человек     */
const ADDRESSEE_KINDS = ['роль','подразделение','подразделение объекта','должность'];

/* Проверка объявления — при публикации, а не на выпуске: к моменту выпуска за
   экраном человек с задачей (ИО-7). Возвращает причину отказа или null.      */
function addresseeCheck(a){
  if(!a || !a.kind) return 'редакция не объявила, кому уходит бумага: у бланка есть адресат, '+
    'и вид адресата — часть вопроса, а не настройка минуты (ИО-28, ADR-0168 §1)';
  if(ADDRESSEE_KINDS.indexOf(a.kind) === -1) return 'вида получателя «'+a.kind+'» не бывает: '+
    'бланк уходит лицу в роли, подразделению, подразделению своего объекта или должности '+
    '(ADR-0168 §1)';
  if(a.kind === 'роль'){
    if(SUBJ_ROLES.indexOf(a.role) === -1) return 'роли «'+a.role+'» у лица относительно объекта '+
      'не бывает: роли ведёт ядро, отчётность своего перечня не заводит (ИО-2)';
  } else if(a.kind === 'подразделение'){
    if(!DEPT(a.unit)) return 'подразделения «'+a.unit+'» в оргструктуре нет: перечень ведёт '+
      'оргструктура, отчётность его читает и не пополняет (ИО-2, ИО-29)';
  } else if(a.kind === 'должность'){
    if(!POST(a.post)) return 'должности «'+a.post+'» в оргструктуре нет: перечень ведёт '+
      'оргструктура, отчётность его читает и не пополняет (ИО-2, ИО-29)';
  }
  return null;
}

/* Как объявление читается человеком — одной строкой, в витрине и в редакции. */
function addresseeText(a){
  if(!a || !a.kind) return '—';
  if(a.kind === 'роль') return 'лицо в роли «'+a.role+'»';
  if(a.kind === 'подразделение') return 'подразделение «'+deptName(a.unit)+'»';
  if(a.kind === 'подразделение объекта') return 'подразделение, ведущее объект';
  if(a.kind === 'должность') return 'должность «'+((POST(a.post) || {}).name || a.post)+'»';
  return a.kind;
}

/* Кого назовёт бумага по этому объекту. Объект остаётся ДОРОГОЙ к получателю
   при любом виде: у служебной записки он тоже назван — записка не «вообще», а
   по конкретному кредиту (ADR-0168 §2).                                      */
function resolveAddressee(a, objId){
  const o = OBJ(objId);
  const why = addresseeCheck(a);
  if(why) return {ok:false, why};
  const via = o ? {viaObject: o.id, viaNo: o.no} : {viaObject: objId, viaNo: null};
  if(a.kind === 'роль'){
    const s = subjectInRole(objId, a.role);
    if(!s) return {ok:false, why:'уходит лицу в роли «'+a.role+'», а у объекта «'+
      (o ? o.no : objId)+'» такого лица нет: получателя назвать некем. Роль объявляет '+
      'редакция, а не человек на выпуске (ИО-28, ADR-0167 §2)'};
    return {ok:true, rec: Object.assign({kind:'роль', ref:s.id, name:s.name, role:a.role,
      inn:s.inn}, via)};
  }
  if(a.kind === 'подразделение')
    return {ok:true, rec: Object.assign({kind:'подразделение', ref:a.unit,
      name: deptName(a.unit), role:null}, via)};
  if(a.kind === 'подразделение объекта'){
    if(!o || !o.dept) return {ok:false, why:'уходит подразделению, ведущему объект, а у объекта '+
      'подразделение не названо: адресата назвать некем'};
    return {ok:true, rec: Object.assign({kind:'подразделение', ref:o.dept, name: deptName(o.dept),
      role:null, byObject:true}, via)};
  }
  return {ok:true, rec: Object.assign({kind:'должность', ref:a.post,
    name:(POST(a.post) || {}).name || a.post, role:null}, via)};
}

/* Месяцы до запуска — закрыты переносом «из легаси» (ADR-0307, ОГ-Д11, ИО-59).

const LAUNCH = '2026-01-01';
const MIGRATION = {id:'М-1', at:'2025-12-30', by:'Бекова Н.',
  text:'выпуск миграции М-1 от 30.12.2025, утвердил Бекова Н.'};
const LEGACY = {months:{}};

/* Июль 2025 г. перенесён одними событиями, без итога (допущение стенда: месячного

const legacyNoTotal = asOf => { if(!asOf || asOf.slice(8) !== '01') return null;
