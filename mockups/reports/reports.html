  .filter(t => t.editions.some(e => e.stats.indexOf(sid) !== -1))
  .map(t => ({id:t.id, name:t.name,
    where: t.editions.filter(e => e.stats.indexOf(sid) !== -1).map(e => 'ред. '+e.n+' ('+e.state+')')}));

/* ========================= ШВЫ НАРУЖУ (§12) =========================== */
const SEAMS_OUT = [
  {id:'reportIssues',      q:'что предъявлялось по этому объекту',      to:'карточка объекта, зеркалом'},
  {id:'reportObligations', q:'что за подразделением к сроку',           to:'задачи и руководитель'},
  {id:'reportTemplate',    q:'пригоден ли шаблон для обзора, какая редакция текущая', to:'анализ'}
];
const NO_SEAM_OUT = {
  reportRows:    'строк ответа шов не отдаёт: за строками ходят в выпуск, где рядом стоит его '+
                 'паспорт — число без паспорта не показывается (ИО-6)',
  reportDraft:   'черновиков шов не отдаёт: незаконченный состав, показанный как шаблон, '+
                 'читается как шаблон (ИО-1)',
  reportQuery:   'произвольного запроса отчётность не отдаёт и не имеет: у неё самой своих '+
                 'запросов к базе нет, только четыре шва (ИО-3)'
};
const CONSUMERS = [
  {module:'карточка объекта (ядро)', may:['reportIssues'], note:'зеркало «какие бумаги уходили»'},
  {module:'задачи',        may:['reportObligations'], note:'обязательство — основание задачи; '+
    'поручает человек (ИО-13)'},
  {module:'руководитель',  may:['reportObligations'], note:'календарь своего подразделения'},
  {module:'анализ',        may:['reportTemplate'],    note:'обзор ссылается на шаблон и на выпуск, '+
    'своего снимка не заводит (ИО-16)'},
  {module:'статистика',    may:[], why:'отчётность статистике не отдаёт ничего швом: список '+
    'шаблонов, ломающихся при выводе показателя, — экран владельца реестра, а не контракт'}
];
RP.seamsOut = () => clone(SEAMS_OUT);
RP.noSeamOut = () => clone(NO_SEAM_OUT);
RP.consumers = () => clone(CONSUMERS);
RP.reportIssues = objId => RP.state.issues.filter(i => i.obj === objId)
  .map(i => ({id:i.id, kind:i.kind, at:i.at, tpl:i.tplName,
    to: i.recipient ? i.recipient.name : null, number:i.number}));
RP.reportObligations = dep => RP.obligations().filter(o => o.dept === dep)
  .map(o => ({tpl:o.tplName, period:o.period, due:o.due, state:o.state, who:o.who}));
RP.reportTemplate = tid => { const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t);
  return {id:t.id, name:t.name, forReview: t.forReview, edition: ed ? ed.n : null,
    basis: t.basis, kind: t.kind,
    note:'обзор ссылается на выпуск как на снимок основания и своего снимка не заводит (ИО-16)'}; };
RP.callSeamOut = (module, seam, arg) => {
  const c = CONSUMERS.find(x => x.module === module);
  if(!c) return {ok:false, why:'такого потребителя нет'};
  if(NO_SEAM_OUT[seam]) return {ok:false, why: NO_SEAM_OUT[seam]};
  if(!SEAMS_OUT.some(s => s.id === seam)) return {ok:false, why:'шва «'+seam+'» у отчётности нет'};
  if(c.may.indexOf(seam) === -1) return {ok:false, why: c.why ||
    ('модуль «'+module+'» шов «'+seam+'» не спрашивает')};
  const data = seam === 'reportIssues' ? RP.reportIssues(arg)
             : seam === 'reportObligations' ? RP.reportObligations(arg)
             : RP.reportTemplate(arg);
  return {ok:true, data};
};
RP.ownQuery = () => ({ok:false, why:'своего запроса к базе у отчётности нет: четыре шва — '+
  'единственный вход, и потому обойти область видимости она не может физически (ИО-3, ADR-0158 §2)'});
RP.ownFormula = () => ({ok:false, why:'своей формулы у отчётности нет: показатель берётся из '+
  'реестра статистики, поле — из публичного перечня объекта. Вторая формула той же величины '+
  'разошлась бы с первой (ИО-2, ADR-0150)'});
/* ==================== ВЁРСТКА МАКЕТА БЛАНКА (§8) ======================
   Подстановки не ведутся списком — они ЕСТЬ текст макета: список выводится
   разбором. Список рядом с текстом со временем разошёлся бы с ним, и тогда
   проверка на публикации проверяла бы не то, что напечатается.              */
function parseSubs(text){
  const out = [], re = /\{\{([^{}]+)\}\}/g;
  let m2;
  while((m2 = re.exec(String(text || '')))) out.push(m2[1].trim());
  return uniq(out);
}
RP.parseSubs = parseSubs;
RP.layoutOf = tid => { const t = TPL(tid); if(!t) return null;
  const ed = draftEd(t) || pubEd(t);
  return ed ? {n: ed.n, state: ed.state, text: ed.layoutText || '', subs: parseSubs(ed.layoutText)} : null; };

RP.setLayout = (tid, text) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(t.kind !== 'бланк') return {ok:false, why:'макет верстается у бланка: у отчёта состав — это '+
    'колонки и показатели, а не текст (§2.2)'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'текст опубликованного макета не правится: другой текст насовсем — '+
    'это новая редакция, а не правка на месте (§8). Заведите редакцию '+(pubEd(t).n + 1)};
  if(!RP.isAuth() && !RP.isClerk() && t.owner !== RP.who())
    return {ok:false, why:'макет чужого бланка не правится: черновик личный, пока автор ('+t.owner+
      ') не попросил публикации'};
  ed.layoutText = text; ed.subs = parseSubs(text);
  return {ok:true, note:'подстановок в тексте: '+ed.subs.length+' — список выведен разбором, а не введён руками'};
};
RP.newEdition = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'новую редакцию заводит уполномоченный по отчётности'};
  if(draftEd(t)) return {ok:false, why:'у шаблона уже есть черновая редакция '+draftEd(t).n+
    ': двух незаконченных составов у одного шаблона не бывает'};
  const base = pubEd(t);
  if(!base) return {ok:false, why:'копировать нечего: опубликованной редакции нет'};
  const ed = clone(base);
  ed.n = base.n + 1; ed.state = 'черновик'; ed.since = null; ed.at = RP.state.today; ed.by = RP.who();
  t.editions.push(ed);
  log('заведена редакция '+ed.n+' шаблона «'+t.name+'»');
  return {ok:true, n: ed.n, note:'редакция '+ed.n+' скопирована с '+base.n+
    '; прежняя продолжает работать, пока новая не опубликована'};
};
RP.insertToken = (tid, kind, id) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(kind === 'stat') { const m = SEAM.statMeta(id);
    return {ok:false, why:'показатель «'+(m ? m.name : id)+'» — величина о МНОЖЕСТВЕ объектов; '+
      'бланк говорит об одном, и места ей в нём нет (§2.2). Такой вопрос задаётся отчётом'}; }
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'текст опубликованного макета не правится: заведите новую редакцию (§8)'};
  return RP.setLayout(tid, (ed.layoutText || '') + '{{' + id + '}}');
};
/* ================= МАКЕТ ВЫГРУЗКИ И УРОВНИ (§3 пп. 4, 8) ===============
   Лист — часть редакции: «как было напечатано» предъявлено вместе с числами
   (ИО-18). Правится он там же, где состав, — в черновике и уполномоченным.  */
RP.sheetOf = tid => { const t = TPL(tid); if(!t) return null;
  const ed = pubEd(t) || draftEd(t); if(!ed) return null;
  const s = sheetOfEd(ed);
  return {ed: ed.n, state: ed.state, orient: s.orient, repeatHeader: s.repeatHeader,
    footer: s.footer, bands: s.bands.slice(), formats: s.formats.slice(), widths: s.widths,
    levels: (ed.cuts || []).map(by => ({by, name: cutName(by),
      total: (ed.levelTotals || []).indexOf(by) !== -1})),
    rounding: (ed.stats || []).map(sid => ({id: sid,
      name: (SEAM.statMeta(sid) || {name: sid}).name, dp: dpOf(ed, sid)}))};
};
function draftForEdit(tid){
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.isAuth()) return {ok:false, why:'лист выгрузки правит уполномоченный по отчётности: '+
    'печатное представление предъявляется вместе с числами и потому принадлежит редакции, '+
    'а не экрану пользователя (ИО-18, §13.1)'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'редакция «'+t.name+'» опубликована: печатное представление '+
    'объявлено ею и задним числом не меняется — сданное печатается так, как было сдано. '+
    'Нужен другой лист — нужна НОВАЯ РЕДАКЦИЯ (ИО-18, ИО-2)'};
  return {ok:true, t, ed};
}
RP.setSheet = (tid, patch) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const cur = sheetOfEd(g.ed);
  if(patch.formats){
    const bad = patch.formats.filter(f => ['xlsx','csv','pdf','docx'].indexOf(f) === -1);
    if(bad.length) return {ok:false, why:'формата «'+bad[0]+'» модуль не отдаёт: xlsx · csv · pdf '+
      'для отчёта, docx (черновик) и pdf для бланка (§2.2)'};
  }
  if(patch.bands) return RP.setBands(tid, patch.bands);
  g.ed.sheet = Object.assign({}, cur, patch);
  log('лист выгрузки «'+g.t.name+'» правлен в черновике ред. '+g.ed.n);
  return {ok:true, note:'лист правлен в черновике: наружу уйдёт при публикации редакции'};
};
/* Порядок полос ОБЪЯВЛЕН, а не выведен из положения ячеек: в легаси ИТОГО
   печатается ПЕРЕД группами, потому что порядок там — побочный результат
   номеров строк макета (ОЧ-26, ОЧ-33).                                      */
RP.setBands = (tid, bands) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const miss = BANDS.filter(b => bands.indexOf(b) === -1);
  if(miss.length) return {ok:false, why:'полоса «'+miss[0]+'» из листа выброшена: полосы '+
    'переставляются, но не пропадают — лист состоит из '+BANDS.join(' · ')};
  const bad = bands.filter(b => BANDS.indexOf(b) === -1);
  if(bad.length) return {ok:false, why:'полосы «'+bad[0]+'» в листе не бывает'};
  if(bands.indexOf('итог') < bands.indexOf('уровни')) return {ok:false,
    why:'итог поставлен ПЕРЕД уровнями: так печатает легаси, и читающий видит общую сумму '+
    'раньше слагаемых, из которых она якобы сложена. Итог — последняя полоса тела листа (ОЧ-26)'};
  if(bands.indexOf('шапка') > bands.indexOf('уровни')) return {ok:false,
    why:'шапка таблицы поставлена после строк: столбцы называются до того, как их читают'};
  const cur = sheetOfEd(g.ed);
  g.ed.sheet = Object.assign({}, cur, {bands: bands.slice()});
  log('порядок полос листа «'+g.t.name+'» изменён: '+bands.join(' → '));
  return {ok:true, note:'порядок полос: '+bands.join(' → ')};
};
RP.setLevelTotals = (tid, arr) => {
  const g = draftForEdit(tid); if(!g.ok) return g;
  const out = (arr || []).filter(by => (g.ed.cuts || []).indexOf(by) === -1);
  if(out.length) return {ok:false, why:'итог просят по «'+cutName(out[0])+'», а такого уровня '+
    'разреза в редакции нет: итог печатается по уровню, а не сам по себе'};
  g.ed.levelTotals = (arr || []).slice();
  log('итоги по уровням «'+g.t.name+'»: '+((arr || []).map(cutName).join(', ') || 'нет'));
  return {ok:true, note:'итог печатается по уровням: '+((arr || []).map(cutName).join(', ') || '—')+
    '; величина спрашивается швом, модуль её не складывает (ИО-17)'};
};
/* Отказы, которыми модуль отвечает на привычки легаси. */
RP.setSheetOnIssue = (id, patch) => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  return {ok:false, why:'лист выгрузки у выпуска ВП-'+i.id.replace('ВП-','')+' не правится: '+
    'печатное представление объявлено редакцией '+i.ed+' и предъявлено вместе с числами. '+
    'Иначе один и тот же сданный отчёт у двух людей печатается по-разному (ИО-18)'};
};
RP.exportIssue = (id, fmt) => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  if(i.state !== 'готов') return {ok:false, why:'выпуск ещё '+i.state+': выгружать нечего'};
  if(i.kind === 'окончательный' && fmt !== 'pdf') return {ok:false,
    why:'наружу с получателем уходит только pdf: снимок в редактируемом формате — не снимок '+
    '('+fmt+' отклонён, ИО-10)'};
  if((i.formats || []).indexOf(fmt) === -1) return {ok:false,
    why:'формата «'+fmt+'» этот шаблон не объявляет: перечень форматов — часть листа выгрузки '+
    'в редакции '+i.ed+', а не набор кнопок экрана ('+(i.formats || []).join(' · ')+')'};
  log('выпуск '+i.id+' выгружен в '+fmt);
  return {ok:true, note:'файл '+fmt+' отдан; лист — '+i.passport.sheet.orient+', полосы: '+
    i.passport.sheet.bands.join(' → ')};
};
/* ========== ВЫГРУЗКА ПОКАЗАННОГО — ЭТО ВЫПУСК (ОЧ-49, §14.4) ==========
   «Выгрузить в Excel» выглядит безобидной кнопкой, а по канону выпуском
   становится ровно то, что вышло за пределы экрана. Поэтому выгрузка показа —
   ПРЕДВАРИТЕЛЬНЫЙ ВЫПУСК со строкой в журнале и паспортом; иначе Excel снова
   станет дырой, через которую числа уходят без даты, автора и состава.
   Для человека это по-прежнему одна кнопка: заказ он не заказывает.         */
RP.exportShown = (tid, params, twist, fmt) => {
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const i = ISS(res.id);
  const f = fmt || (i.formats || []).filter(x => x !== 'pdf')[0] || (i.formats || [])[0];
  const ex = RP.exportIssue(res.id, f);
  if(!ex.ok) return ex;
  return {ok:true, id: res.id, fmt: f, note:'выгрузка — это выпуск '+res.id+
    ' (предварительный): строка в журнале, паспорт и показанный состав целиком. Файл живёт '+
    dayWord(FILE_DAYS)+' и гаснет, строка остаётся (ИО-11, ОЧ-49)'};
};
/* Рабочий список тоже идёт через предварительный выпуск: список по определению
   ЗАМОРОЖЕННЫЙ состав, а морозить нечего, пока у ответа нет паспорта (ИО-14). */
RP.worklistShown = (tid, params, twist, name) => {
  if(!String(name || '').trim()) return {ok:false, why:'список называется при создании: '+
    'безымянный список нельзя передать и нельзя спросить «чем кончилось» (ИО-14)'};
  const res = RP.issue(tid, {params: clone(params || {}), kind:'предварительный',
    twist: twist || null});
  if(!res.ok) return res;
  const wl = RP.makeWorklist(res.id, String(name).trim());
  if(!wl.ok) return wl;
  return {ok:true, id: wl.id, issue: res.id, note:'список '+wl.id+' отобран выпуском '+res.id+
    ': состав заморожен паспортом, а не кнопкой. '+wl.note};
};

/* Легаси даёт «На дату» КАЖДОЙ ячейке: один лист может смешать остаток на
   01.07 со ставкой на 01.08, и ответ перестаёт быть ответом на одну дату.   */
RP.setColumnDate = (tid, fid, date) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const list = SEAM.fieldList((pubEd(t) || draftEd(t)).object);
  const f = list.fields.find(x => x.id === fid);
  return {ok:false, why:'дата состояния у ответа ОДНА: «'+(f ? f.name : fid)+'» нельзя взять '+
    'на '+fmt(date)+', пока остальные столбцы стоят на другой дате — иначе лист перестаёт быть '+
    'ответом на один вопрос, а паспорт перестаёт быть проверяемым (ИО-19). Нужна вторая дата — '+
    'это сравнение двух состояний, отдельный вопрос (§19 п. 6)'};
};
/* Итог по уровню НЕ складывается модулем. Доказательство — числами.         */
RP.foldLevelsSelf = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  const ed = pubEd(t) || draftEd(t);
  const sid = (ed.stats || [])[0];
  if(!sid) return {ok:false, why:'показателей у редакции нет — складывать нечего'};
  const v = RP.viewer();
  const cut = {dept:null, ids:null};
  const asOf = ed.mode === 'на дату' ? RP.state.sel.params.asOf : null;
  const pack = SEAM.statSliceBy(sid, 'dept', cut, asOf, v.scope.slice());
  const whole = SEAM.statSlice(sid, cut, asOf, v.scope.slice());
  const sum = pack.groups.reduce((a, g) => a + (g.value || 0), 0);
  const meta = SEAM.statMeta(sid);
  /* Округлять доказательство нельзя: разница видна как раз в десятых.       */
  const exact = v => v == null ? '—' : String(Math.round(v * 10) / 10).replace('.', ',');
  return {ok:false, sum, real: whole.value, stat: meta ? meta.name : sid,
    unit: meta ? meta.unit : '', parts: pack.groups.length,
    why:'модуль не складывает частные итоги сам: «'+(meta ? meta.name : sid)+'» по '+
      pack.groups.length+' подразделениям в сумме даёт '+exact(sum)+' '+(meta ? meta.unit : '')+
      ', а на всём охвате показатель равен '+exact(whole.value)+' '+(meta ? meta.unit : '')+
      '. Доля, средняя и количество уникальных не аддитивны — итог уровня спрашивается швом '+
      'отдельным вопросом (ИО-17, ОЧ-25)'};
};
/* Легаси хранит отбор внутри «шаблона» списком объектов — состав и правило
   слиты, и «почему объект здесь» ответить нечем (ОЧ-28).                    */
RP.ruleAsWorklist = (name, rule) => ({ok:false, why:'правило отбора «'+(rule || 'остаток > 100 млн')+
  '» — не рабочий список: список это ЗАМОРОЖЕННЫЙ СОСТАВ, отобранный выпуском в момент времени, '+
  'и он отвечает «чем кончилось» по каждому объекту (ИО-14). Правило же живёт параметром '+
  'редакции и каждый раз даёт новый состав. Слить их — потерять и то и другое (§9)'});

RP.docxNote = () => ({ok:false, why:'docx — формат черновика: наружу с получателем уходит только '+
  'pdf (ИО-10). Другой текст насовсем делается правкой макета и новой редакцией, а не правкой '+
  'выпущенного файла (§8)'});

/* ===================== РАБОЧИЕ СПИСКИ (§9, ИО-14) =====================
   Список отбирается ВЫПУСКОМ, называется и замораживается. Чисел не хранит —
   только объекты; их величины всегда текущие и берутся швом заново.          */
RP.makeWorklist = (issueId, name) => {
  const i = ISS(issueId); if(!i) return {ok:false, why:'выпуска нет'};
  if(i.kindTpl !== 'отчёт') return {ok:false, why:'список отбирается отчётом о множестве объектов: '+
    'бланк говорит об одном, отбирать из него нечего'};
  if(!name) return {ok:false, why:'список называется при создании: безымянный список нельзя передать '+
    'и нельзя спросить «чем кончилось»'};
  const rows = i.snapshot && i.snapshot.rows ? i.snapshot.rows
    : compose(TPL(i.tpl), TPL(i.tpl).editions.find(e => e.n === i.ed), i.params, RP.viewer()).rows;
  if(!rows.length) return {ok:false, why:'в выпуске нет строк: замораживать нечего'};
  const id = 'РС-' + (++RP.state.wseq);
  RP.state.worklists.push({id, name, from: i.id, fromName: i.tplName,
    at: RP.state.today, by: RP.who(), dept: null, state:'открыт', closed:null, why:null,
    objects: rows.map(r => r.id)});
  log('рабочий список «'+name+'» отобран выпуском '+i.id+', объектов: '+rows.length);
  return {ok:true, id, note:'состав заморожен: '+objWord(rows.length)+
    '; чисел список не хранит — величины всегда текущие'};
};
RP.worklistRows = id => {
  const w = WL(id); if(!w) return null;
  const v = RP.viewer();
  const src = SEAM.objectRows('credit', {ids: w.objects.slice()}, v.scope.slice());
  const seen = {}; src.rows.forEach(r => { seen[r.id] = r; });
  return {
    rows: w.objects.map(oid => seen[oid] || null),
    hidden: w.objects.length - src.rows.length,
    gone: src.rows.filter(r => r.closed).length
  };
};
RP.handWorklist = (id, dept) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, но не передаётся: '+
    'работа по нему окончена ('+fmt(w.closed)+')'};
  w.dept = dept;
  log('список «'+w.name+'» передан подразделению «'+deptName(dept)+'»');
  return {ok:true, note:'список видят все, кто в круге подразделения; поручений он не несёт (ИО-13)'};
};
RP.addToWorklist = (id, objId) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'закрытый список читается, не пополняется'};
  return {ok:false, why:'состав рабочего списка заморожен: он отобран выпуском '+w.from+
    ' и после названия не пополняется — иначе «обзвонили всех» перестаёт быть проверяемым (ИО-14). '+
    'Нужен другой состав — отберите новым выпуском'};
};
RP.closeWorklist = (id, why) => {
  const w = WL(id); if(!w) return {ok:false, why:'списка нет'};
  if(w.state === 'закрыт') return {ok:false, why:'список уже закрыт '+fmt(w.closed)};
  w.state = 'закрыт'; w.closed = RP.state.today; w.why = why || 'работа окончена';
  log('список «'+w.name+'» закрыт: '+w.why);
  return {ok:true, note:'закрытый список читается, но не пополняется; строки остаются на месте'};
};
RP.doRuleList = () => act(RP.ruleAsWorklist('крупные кредиты', 'остаток > 100 млн'));
RP.deleteWorklist = id => ({ok:false, why:'рабочий список не стирается — он кончается ЗАКРЫТИЕМ: '+
  'стёртый список отвечает неправдой на вопрос «кого обзванивали» (ИО-14, §9)'});
RP.worklistTask = id => ({ok:false, why:'рабочий список никому ничего не поручает: у поручения '+
  'должен быть автор, отвечающий за нагрузку (ИО-13, ADR-0160)'});
const WL = id => RP.state.worklists.find(w => w.id === id);
RP.WL = WL;
RP.visibleWorklists = () => {
  const v = RP.viewer();
  return RP.state.worklists.filter(w => w.by === RP.who() ||
    (w.dept && v.scope.indexOf(w.dept) !== -1));
};
/* Список — законный параметр отбора следующего выпуска. Пятого шва он не
   потребовал: перечень объектов уходит в РАЗРЕЗ и спрашивается тем же швом. */
RP.issueByWorklist = (tid, wlId, spec) => {
  const w = WL(wlId); if(!w) return {ok:false, why:'списка нет'};
  const sp = clone(spec || {});
  sp.params = sp.params || {};
  sp.params.ids = w.objects.slice(); sp.params.worklist = w.id;
  return RP.issue(tid, sp);
};
/* Демонстрация выбытия: ядро закрыло кредит уже ПОСЛЕ заморозки состава.    */
RP.demoCloseObject = objId => {
  const o = OBJ(objId); if(!o) return {ok:false, why:'объекта нет'};
  o.closed = RP.state.today; o.status = 'закрыт'; o.debt_main = 0; o.days = 0;
  log('ядро закрыло кредит '+o.no);
  return {ok:true, note:'в рабочих списках он останется строкой «закрыт '+fmt(RP.state.today)+
    '» — выбывший показан выбывшим, а не исчезает (§9)'};
};

/* ========================= ДАШБОРДЫ (§10) ============================
   Плитка — способ показать ОБЪЯВЛЕННЫЙ отчёт; своего состава у неё нет.
   Раскладка объявлена на роль, поверх живёт личная перекладка с возвратом.  */
const DASH_ROLE = {
  auth:  [{tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:''}},
          {tpl:'t-portfolio', params:{dept:''}}],
  head:  [{tpl:'t-portfolio', params:{dept:'dep-admin'}},
          {tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:'dep-admin'}}],
  user:  [{tpl:'t-portfolio', params:{dept:'dep-prom'}}],
  clerk: [],
  buh:   [{tpl:'t-overdue',   params:{asOf:'2026-08-01', dept:''}}]
};
RP.declaredTiles = () => clone(DASH_ROLE[RP.viewer().id] || []);
RP.dashTiles = () => { const p = RP.state.dash.personal[RP.viewer().id];
  return p ? clone(p) : RP.declaredTiles(); };
RP.dashPersonal = () => !!RP.state.dash.personal[RP.viewer().id];
function personalTiles(){ const id = RP.viewer().id;
  if(!RP.state.dash.personal[id]) RP.state.dash.personal[id] = RP.declaredTiles();
  return RP.state.dash.personal[id]; }
RP.addTile = (tid, params) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'шаблона нет'};
  if(!RP.maySee(tid)) return {ok:false, why:'этого шаблона вам не видно: личная раскладка — не '+
    'личный отчёт, добавить можно только доступное (§10)'};
  if(!pubEd(t)) return {ok:false, why:'на дашборд ставится ОБЪЯВЛЕННЫЙ отчёт: «'+t.name+'» — '+
    'личный черновик, плитки из него не бывает (ИО-1, §10)'};
  if(t.kind !== 'отчёт') return {ok:false, why:'плитка показывает отчёт о множестве объектов: '+
    'бланк говорит об одном и на дашборде ничего не сообщает'};
  personalTiles().push({tpl:tid, params: clone(params || {})});
  return {ok:true, note:'плитка добавлена в личную раскладку; объявленная на роль не тронута'};
};
RP.removeTile = i => { const p = personalTiles();
  if(i < 0 || i >= p.length) return {ok:false, why:'плитки нет'};
  const t = p.splice(i, 1)[0];
  return {ok:true, note:'плитка «'+TPL(t.tpl).name+'» убрана из личной раскладки'}; };
RP.resetDash = () => { const id = RP.viewer().id;
  if(!RP.state.dash.personal[id]) return {ok:false, why:'личной перекладки нет: раскладка и так '+
    'та, что объявлена на роль'};
  delete RP.state.dash.personal[id];
  return {ok:true, note:'вернулась раскладка, объявленная на роль — первый день не начинается '+
    'с пустого экрана (§10)'}; };
RP.addExternalTile = url => ({ok:false, why:'внешние источники на дашборде запрещены: плитка '+
  'своего состава не имеет — она показывает объявленный отчёт, и клик раскрывает его целиком (§10)'});
RP.dashPassport = () => ({ok:false, why:'общего паспорта у дашборда нет и быть не может: рядом '+
  'стоят плитки «на дату» и «сейчас», и один паспорт сверху создавал бы вид единой даты, '+
  'которого нет (ИО-15, §10)'});
RP.tileData = tile => {
  const t = TPL(tile.tpl); if(!t) return null;
  const ed = pubEd(t); if(!ed) return null;
  const br = brokenBy(t, ed);
  if(br) return {broken: br, name: t.name};
  const d = compose(t, ed, tile.params, RP.viewer());
  return {name: t.name, tpl: t.id, totals: d.totals, rows: d.rows.length,
    passport: d.passport, soft: d.soft};
};

/* ============================== ЭКРАНЫ =============================== */
const pill = (t, c) => '<span class="pill'+(c?' '+c:'')+'">'+esc(t)+'</span>';
const kv = rows => '<div class="kv">'+rows.map(r =>
  '<div class="k">'+esc(r[0])+'</div><div class="v">'+(r[2] ? r[1] : esc(r[1]))+'</div>').join('')+'</div>';
const stateCls = s => s === 'опубликован' ? 'ok' : s === 'неисполним' ? 'err' : 'neutral';
const oblCls = s => s === 'сдано' ? 'ok' : s === 'сдано с опозданием' ? 'warn'
  : s === 'просрочено' ? 'err' : 'info';

function passportBox(p, frozen){
  const rows = [];
  rows.push(['режим', p.mode]);
  if(p.mode === 'на дату') rows.push(['состояние на', fmt(p.asOf)]);
  rows.push(['редакция шаблона', 'ред. '+p.edition]);
  rows.push(['область видимости', p.scope.join(', ')]);
  if(p.hidden) rows.push(['скрыто видимостью', objWord(p.hidden)+' — охват ответа неполный']);
  if(p.levels && p.levels.length) rows.push(['уровни разрезов', p.levels.join('; ')]);
  if(p.rounding && p.rounding.length) rows.push(['разрядность', p.rounding.join('; ')]);
  if(p.sheet) rows.push(['лист выгрузки', p.sheet.orient+'; полосы: '+p.sheet.bands.join(' → ')+
    '; форматы: '+p.sheet.formats.join(' · ')]);
  rows.push(['спрошенные швы', p.seams && p.seams.length ? p.seams.join(', ')
    : (p.ordered ? 'ещё ни одного — заказ принят, числа не спрошены' : 'objectRows')]);
  rows.push(['числа', frozen ? 'заморожены снимком' : 'живые, пересчитываются при каждом показе']);
  return '<div class="snap'+(frozen?'':' prelim')+'">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
}

/* Шапка ПОКАЗА: то же обещание, что у паспорта, распространённое на экран —
   скриншот уходит в переписку и обязан отвечать за себя сам (ADR-0162 §5). */
function showBox(head){
  if(!head) return '';
  const rows = [['показ', 'НЕ ВЫПУСК — '+head.note]];
  rows.push(['отчёт', head.template+' · ред. '+head.edition+
    (head.editionState === 'черновик' ? ' (черновик: личный состав)' : '')]);
  rows.push(['режим', head.mode]);
  if(head.asOf) rows.push(['состояние на', fmt(head.asOf)]);
  rows.push(['область видимости', head.scope.join(', ')]);
  rows.push(['смотрит', head.who]);
  if(head.composition) rows.push(['показанный состав',
    'разрезы: '+(head.composition.cuts.join(' → ') || 'нет')+
    '; показатели: '+(head.composition.stats.join('; ') || 'нет')+
    '; строки объектов: '+(head.composition.drill ? 'печатаются' : 'не печатаются — спрошены '+
      'только итоги разрезов')+'; раскладка: '+head.composition.layout]);
  rows.push(['состав', head.deviated
    ? 'НАКРУЧЕН на экране в границах, объявленных редакцией (ИО-20)'
    : 'по умолчанию, как объявила редакция']);
  if(head.view) rows.push(['вид', head.view+' — личный: передают не его, а выпуск']);
  let h = '<div class="snap prelim">'+rows.map(r =>
    '<div class="row"><span class="k">'+esc(r[0])+'</span>'+esc(r[1])+'</div>').join('')+'</div>';
  if(head.dropped && head.dropped.length) h += '<div class="banner warn"><b>Вид сверен с '+
    'редакцией.</b> '+head.dropped.map(esc).join('; ')+'. Отвалившееся названо, остальное '+
    'работает — молчаливой подмены не бывает (ADR-0162 §4).</div>';
  return h;
}

/* ===================== ВИТРИНА «ОТЧЁТНОСТЬ» (§14.1) ===================
   Стол ПОТРЕБИТЕЛЯ. Перечисляет то же, что реестр шаблонов, — и потому
   соблазн обойтись одним списком был силён (ОЧ-41). Не обошлись: реестр
   ОБЯЗАН показывать то, что витрине показывать вредно — «неисполним»,
   «личный черновик Осмоновой», «публикации не просили». Это кухня объявления
   состава, и потребителю она мешает.

   Группировка — по ОБЯЗАТЕЛЬНОСТИ, а не по объекту: на данных каталога
   объектная разбивка разваливается (кредит 13 форм, остальные четырнадцать
   объектов по одной — оглавление, где половина пунктов сама себе раздел,
   ОЧ-42). Объект не выброшен, а стал чипом.                                */
RP.showcase = () => {
  const v = RP.viewer(), obl = RP.obligations(), rows = [];
  RP.state.templates.forEach(t => {
    const ed = pubEd(t);
    if(!ed) return;                    /* черновик — кухня реестра, не витрина (ИО-1) */
    const f = t.form ? FORM(t.form) : null;
    const st = RP.tplState(t.id);
    const inCircle = t.circle.indexOf(v.dept) !== -1 || v.scope.length === ALL_DEPTS.length;
    const mine = obl.filter(o => o.tpl === t.id &&
      (t.circle.indexOf(v.dept) !== -1 ? o.dept === v.dept : true));
    const cur = mine.length ? mine[mine.length - 1] : null;
    const fin = RP.state.issues.filter(i => i.tpl === t.id && i.kind === 'окончательный' &&
      i.recipient).slice(-1)[0] || null;
    rows.push({
      kind:'шаблон', id: t.id, form: t.form || null, name: t.name, tplKind: t.kind,
      object: SEAM.fieldList(ed.object).name,
      basis: t.basis ? (t.basis.point ? 'п. '+t.basis.point+' ' : '')+t.basis.doc : null,
      obligatory: !!(f && f.obligatory), state: st.state, why: st.why,
      schedule: t.schedule ? t.schedule.text : null,
      obligation: cur ? {period: cur.period, due: cur.due, state: cur.state, who: cur.who} : null,
      lastFinal: fin ? {id: fin.id, at: fin.at, to: fin.recipient.name, number: fin.number} : null,
      submits: RP.whoSubmits(t.id),
      access: inCircle ? {ok:true} : {ok:false,
        why:'шаблон не в круге подразделения «'+deptName(v.dept)+'»: круг ведёт уполномоченный',
        who: t.circle.map(deptName).join('; ')}
    });
  });
  /* Незаведённые ОБЯЗАТЕЛЬНЫЕ формы — строкой без кнопки. Круга у них нет,
     потому что нет шаблона, а основание публично: оно в норме (§13.7).      */
  RP.formGaps().forEach(g => rows.push({
    kind:'норма', id: g.id, form: g.id, name: g.name, tplKind: g.kind, object: g.object,
    basis: (g.basis.point ? 'п. '+g.basis.point+(g.basis.sub ? ' '+g.basis.sub : '')+' ' : '')+
      g.basis.doc,
    obligatory:true, state:'шаблон не заведён', why: g.why, schedule:null,
    obligation:null, lastFinal:null, submits:null, nowhere: g.nowhere, to: g.to,
    access:{ok:true}, goTo: g.who
  }));
  const key = r => r.obligation && r.obligation.due ? r.obligation.due : '9999-99-99';
  const grp = ob => rows.filter(r => r.obligatory === ob)
    .sort((a, b) => (a.access.ok === b.access.ok ? 0 : (a.access.ok ? -1 : 1)) ||
                    key(a).localeCompare(key(b)) || a.name.localeCompare(b.name));
  return {must: grp(true), rest: grp(false)};
};
RP.scSet = (k, val) => { RP.state.sel[k] = val; render(); };
RP.scToggleViews = () => { RP.state.sel.scViews = !RP.state.sel.scViews; render(); };
RP.openForm = tid => { const t = TPL(tid);
  if(!t) return act({ok:false, why:'шаблона нет'});
  if(t.kind === 'бланк') return RP.whereBlank(tid);
  RP.state.sel.tpl = tid; RP.state.sel.twist = null; RP.state.sel.view = null;
  RP.state.sel.dropped = null; RP.state.sel.live = false;
  RP.state.view = 'issue'; render(); };
/* Бланк в витрине — тупик: у него нет ни фильтров, ни параметров, есть один
   вопрос «о ком». На трёх тестовых записях выпадашка работает, на живых
   двенадцати тысячах — нет (ОЧ-43). Потому кнопка ведёт не на формирование,
   а на «где печатается»: перечень объектов держит сосед, а не отчётность.  */
RP.whereBlank = tid => { const t = TPL(tid); if(!t) return act({ok:false, why:'шаблона нет'});
  return act({ok:true, note:'«'+t.name+'» печатается из КАРТОЧКИ объекта или из рабочего '+
    'списка — там объект уже назван. Своего перечня объектов витрина не держит: сосед '+
    'спрашивает отчётность швом «какие бланки применимы к объекту этого вида и видны '+
    'смотрящему», а не наоборот (§16, ОЧ-43)'}); };
RP.openViewOf = vid => { const vw = RP.state.views.find(x => x.id === vid);
  if(!vw) return act({ok:false, why:'вида нет'});
  RP.state.sel.live = false; RP.state.view = 'issue';
  RP.useView(vid); };                /* один прогон: вид применяется на входе (ОЧ-48) */

function oblPill(o){
  if(!o) return '<span class="muted small">по требованию</span>';
  const cls = o.state === 'просрочено' ? 'err' : (o.state === 'ожидается' ? 'warn' :
    (o.state === 'сдано с опозданием' ? 'warn' : 'ok'));
  return pill(o.state, cls)+'<div class="small">'+esc(o.period)+' · срок '+fmt(o.due)+'</div>';
}
function scShowcase(){
  const sel = RP.state.sel, sc = RP.showcase(), v = RP.viewer();
  const q = String(sel.scQ || '').trim().toLowerCase();
  const objs = uniq(sc.must.concat(sc.rest).map(r => r.object)).sort();
  const pass = r => (!q || r.name.toLowerCase().indexOf(q) !== -1) &&
    (!sel.scKind || r.tplKind === sel.scKind) && (!sel.scObj || r.object === sel.scObj);

  let h = '<div class="page-lead">Витрина — стол <em>потребителя</em>: что я вправе спросить и '+
    'что с этим сейчас. Тот же перечень, что в реестре шаблонов, но другим отбором и другому '+
    'человеку: реестр обязан показывать «неисполним» и «личный черновик такого-то» — здесь это '+
    'мешало бы (ОЧ-41). Группы — по <em>обязательности</em>, а не по объекту: объектов в каталоге '+
    'шестнадцать, и четырнадцать из них дали бы по одной строке (ОЧ-42). Объект — чип.</div>';

  /* --- мои виды: свёрнутой группой СВЕРХУ (ОЧ-48) --- */
  const mine = RP.myViews(null);
  h += '<div class="card"><h3 style="cursor:pointer" onclick="RP.scToggleViews()">'+
    (sel.scViews ? '▾' : '▸')+' Мои виды · '+mine.length+'</h3>'+
    '<div class="small">Вход сразу в то, зачем пришли: «на дату» считается сразу, и открыть '+
    'форму, чтобы тут же переключить вид, — это два прогона каждое утро (ОЧ-48). Вид '+
    '<em>не подменяет форму</em> и стоит рядом отдельной строкой: автоподстановка последнего '+
    'вида отклонена — двое сказали бы «открыл отчёт по просрочке» и увидели разные таблицы, '+
    'ровно та болезнь, против которой писан ADR-0162.</div>';
  if(sel.scViews) h += (mine.length
    ? '<table class="cgrid"><thead><tr><th>Вид</th><th>Форма</th><th>Сохранён</th><th></th></tr></thead><tbody>'+
      mine.map(vw => '<tr><td><b>'+esc(vw.name)+'</b><div class="small mono">'+esc(vw.id)+'</div></td>'+
        '<td class="small">'+esc(TPL(vw.tpl) ? TPL(vw.tpl).name : vw.tpl)+'</td>'+
        '<td class="small">'+fmt(vw.at)+'</td>'+
        '<td><button class="btn btn-secondary btn-sm" onclick="RP.openViewOf(\''+vw.id+'\')">'+
        'Открыть видом</button></td></tr>').join('')+'</tbody></table>'
    : '<div class="banner ok">Сохранённых видов у вас нет. Вид заводится на экране показа — '+
      'кнопкой «Сохранить вид», и остаётся личным (ADR-0162 §3).</div>');
  h += '</div>';

  /* --- отбор: поиск и чипы --- */
  h += '<div class="form-row"><div class="fld"><label>Поиск по названию</label>'+
    '<input value="'+esc(sel.scQ || '')+'" onchange="RP.scSet(\'scQ\', this.value)" '+
    'placeholder="просрочка, претензия, акт…"></div>'+
    '<div class="fld"><label>Вид</label><div class="btn-row" style="margin:0">'+
    ['', 'отчёт', 'бланк'].map(k => '<button class="btn btn-sm '+
      (sel.scKind === k ? 'btn-primary' : 'btn-secondary')+'" onclick="RP.scSet(\'scKind\',\''+
      k+'\')">'+(k || 'все')+'</button>').join('')+'</div></div>'+
    '<div class="fld"><label>Объект</label><div class="btn-row" style="margin:0">'+
    [''].concat(objs).map(o => '<button class="btn btn-sm '+
      (sel.scObj === o ? 'btn-primary' : 'btn-secondary')+'" onclick="RP.scSet(\'scObj\',\''+
      esc(o)+'\')">'+esc(o || 'все')+'</button>').join('')+'</div></div></div>';

  const group = (title, list, note) => {
    const shown = list.filter(pass);
    let g = '<div class="card"><h3>'+esc(title)+' · '+shown.length+
      (shown.length === list.length ? '' : ' из '+list.length)+'</h3>'+
      '<div class="small">'+note+'</div>';
    if(!shown.length){ return g+'<div class="banner warn">Под отбор не попало ничего. '+
      'Пустая витрина не значит «таких форм нет»: справочник форм наполняется согласованным '+
      'перечнем (ADR-0163).</div></div>'; }
    g += '<table class="cgrid"><thead><tr><th>Форма</th><th>О чём</th><th>Основание</th>'+
      '<th>Срок и обязательство</th><th>Последний окончательный выпуск</th><th></th></tr></thead><tbody>';
    shown.forEach(r => {
      const muted = !r.access.ok || r.kind === 'норма';
      g += '<tr'+(muted ? ' class="out"' : '')+'>'+
        '<td><b>'+esc(r.name)+'</b>'+
          '<div class="small mono">'+esc(r.form || r.id)+' · '+esc(r.tplKind)+'</div>'+
          (r.kind === 'норма'
            ? '<div class="why">'+esc(r.why)+(r.nowhere
                ? ' Этой формы нет нигде — ни в новой системе, ни в легаси.' : '')+'</div>'
            : (r.access.ok ? '' : '<div class="why">'+esc(r.access.why)+'. Доступ у: '+
                esc(r.access.who)+'</div>'))+'</td>'+
        '<td class="small">'+esc(r.object)+(r.kind === 'норма' && r.to
          ? '<div class="muted">адресат: '+esc(r.to)+'</div>' : '')+'</td>'+
        '<td class="small">'+(r.basis ? esc(r.basis) : '<span class="muted">не названо</span>')+'</td>'+
        '<td class="small">'+(r.kind === 'норма'
          ? '<span class="muted">срока система не знает: он живёт расписанием шаблона, '+
            'а шаблона нет</span>'
          : oblPill(r.obligation)+(r.obligation && r.obligation.who
              ? '<div class="muted">сдаёт: '+esc(r.obligation.who)+'</div>' : ''))+'</td>'+
        '<td class="small">'+(r.lastFinal
          ? esc(r.lastFinal.id)+' · '+fmt(r.lastFinal.at)+'<div class="muted">'+
            esc(r.lastFinal.to)+(r.lastFinal.number ? ' · '+esc(r.lastFinal.number) : '')+'</div>'
          : '<span class="muted">не выпускалась</span>')+'</td>'+
        '<td>'+(r.kind === 'норма'
          ? '<span class="small muted">кнопки нет: выпуск предъявляет редакцию, а редакции нет.<br>'+
            'Завести — '+esc(r.goTo)+'</span>'
          : (!r.access.ok ? '<span class="small muted">не в круге</span>'
            : '<button class="btn '+(r.tplKind === 'бланк' ? 'btn-secondary' : 'btn-primary')+
              ' btn-sm" onclick="RP.openForm(\''+r.id+'\')">'+
              (r.tplKind === 'бланк' ? 'Где печатается' : 'Открыть')+'</button>'))+
        '</td></tr>';
    });
    return g+'</tbody></table></div>';
  };
  h += group('Обязательные', sc.must,
    'Обязательность выведена из уже объявленного — основания и расписания, — а не ведётся '+
    'вручную и потому не разъедется. Внутри — по сроку; недоступное по кругу приглушено в конце '+
    'с причиной и с тем, у кого доступ.');
  h += group('Остальные', sc.rest,
    'Спрос подтверждён, нормой не названы: срока у них нет, обязательства не порождают.');

  const gaps = RP.formGaps();
  h += '<div class="card"><h3>Чего вы здесь не видите — и почему</h3>'+
    '<div class="small">Роль «'+esc(v.title)+'», подразделение «'+esc(deptName(v.dept))+'».</div>'+
    '<div class="facts">'+
    '<div class="f no"><b>Личных черновиков здесь нет вовсе.</b> Пока состав не опубликован, '+
      'он черновик автора; витрина перечисляет то, что можно спросить, а спросить можно только '+
      'опубликованное (ИО-1). Кухня объявления состава — в реестре шаблонов.</div>'+
    '<div class="f no"><b>Незаведённых НЕобязательных форм здесь нет.</b> Рабочая форма без '+
      'шаблона — пожелание из каталога; каталог остаётся предложением, а не договорённостью, и '+
      'показывать несогласованное на рабочем экране значит обещать (ADR-0163 §4).</div>'+
    (gaps.length ? '<div class="f no"><b>Обязательных форм без шаблона: '+gaps.length+'</b> — '+
      'из них '+gaps.filter(g => g.nowhere).length+' не заведено нигде, даже в легаси. Они '+
      'показаны строкой БЕЗ кнопки: срок по норме идёт независимо от того, завели мы шаблон или '+
      'нет, а пустой экран в этом месте утверждал бы «всё в порядке» (ИО-23, ADR-0163).</div>'
      : '<div class="f yes">обязательных форм без шаблона нет</div>')+
    '<div class="f"><b>Обязательства такая строка не порождает.</b> Обязательство — ожидаемый '+
      'окончательный выпуск шаблона к сроку; нет шаблона — нет ни расписания, ни ответственного. '+
      'В календарь сдачи она не попадает (ADR-0163 §6).</div>'+
    '<div class="f"><b>Годового срока макет не считает.</b> У акта сверки (п. 9) срок годовой — '+
      'на 1 января, подписать до 1 сентября; генератор обязательств в макете месячный, и '+
      'выдумывать ему годовое правило ради витрины не стали. Граница макета, не модели.</div>'+
    '</div></div>';
  return h;
}

/* ------------------------------ РЕЕСТР ------------------------------- */
function scRegistry(){
  const v = RP.viewer(), vis = RP.visibleTemplates();
  const hiddenDrafts = RP.state.templates.filter(t => vis.indexOf(t.id) === -1);
  let h = '<div class="page-lead">Шаблон — <em>объявленный состав ответа</em>. Пока состав не '+
    'опубликован, он личный черновик автора: шаблоном его делает публикация, а не сохранение '+
    '(ИО-1, ADR-0156 §2). Печать и экран к делу отношения не имеют — отчёт определяется '+
    'объявленностью, а не способом показа (ADR-0156 §1).</div>';
  h += '<table class="cgrid"><thead><tr><th>Шаблон</th><th>Вид</th><th>Состояние</th>'+
    '<th>Ред.</th><th>Основание</th><th>Круг</th><th>Расписание</th><th></th></tr></thead><tbody>';
  vis.forEach(tid => {
    const t = TPL(tid), st = RP.tplState(tid);
    h += '<tr'+(st.state === 'неисполним' ? ' class="out"' : '')+'>'+
      '<td><b>'+esc(t.name)+'</b><div class="small mono">'+esc(t.id)+'</div>'+
        (st.why ? '<div class="why">'+esc(st.why)+'</div>' : '')+'</td>'+
      '<td><span class="tmpl-kind">'+esc(t.kind)+'</span>'+
        (t.series ? '<div class="small mono">'+esc(t.series.prefix)+
          (t.series.manual ? ' · ручная' : ' · сквозная')+'</div>' : '')+'</td>'+
      '<td>'+pill(st.state, stateCls(st.state))+'</td>'+
      '<td>'+(RP.pubEd(tid) ? 'ред. '+RP.pubEd(tid).n : '—')+'</td>'+
      '<td class="small">'+(t.basis ? esc((t.basis.point ? 'п. '+t.basis.point+' ' : '')+t.basis.doc)
        : '<span class="muted">не названо</span>')+'</td>'+
      '<td class="small">'+esc(t.circle.map(deptName).join('; '))+'</td>'+
      '<td class="small">'+(t.schedule ? esc(t.schedule.text) : '<span class="muted">по требованию</span>')+'</td>'+
      '<td><div class="btn-row" style="margin:0">'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.openBuilder(\''+t.id+'\')">Состав</button>'+
        (st.state === 'опубликован'
          ? '<button class="btn btn-primary btn-sm" onclick="RP.openIssue(\''+t.id+'\')">Выпустить</button>' : '')+
      '</div></td></tr>';
  });
  h += '</tbody></table>';

  h += '<div class="card" style="margin-top:14px"><h3>Чего вы здесь не видите — и почему</h3>'+
    '<div class="small">Роль «'+esc(v.title)+'», область видимости: '+
      esc(v.scope.map(deptName).join('; '))+'.</div>'+
    (hiddenDrafts.length
      ? '<div class="facts">'+hiddenDrafts.map(t => '<div class="f no">'+esc(t.name)+' — личный '+
          'черновик '+esc(t.owner)+(t.asked ? ', передан на публикацию (виден уполномоченному)'
            : ', публикации не просили: не видит никто, кроме автора')+'</div>').join('')+'</div>'
      : '<div class="facts"><div class="f yes"><em>всё, что есть в системе, вам видно</em></div></div>')+
    '</div>';

  const broken = RP.brokenTemplates();
  if(broken.length) h += '<div class="banner danger"><b>Неисполнимые шаблоны: '+broken.length+'.</b> '+
    broken.map(b => esc(b.name)+' — '+esc(b.why)).join('<br>')+'</div>';

  h += '<div class="card"><h3>Соседи меняются — модуль это переживает вслух</h3>'+
    '<div class="small">Публичный перечень полей и реестр показателей — <em>швы</em>, а не '+
    'локальные справочники. Их правка ломает публикацию шаблона и <em>называет виновника</em> '+
    '(ADR-0158 §4, §16 канона).</div><div class="btn-row">'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoRename()">Ядро переименовало «Дней просрочки» → days_overdue</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoWithdraw()">Статистика выводит «Сумма просроченной задолженности»</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.reset()">Вернуть исходное состояние</button>'+
    '</div></div>';
  return h;
}
RP.openBuilder = tid => { RP.state.sel.draft = tid; RP.state.view = 'builder'; render(); };
RP.openIssue   = tid => { RP.state.sel.tpl = tid; RP.state.view = 'issue'; render(); };
RP.demoRename = () => { const r = RP.renameField('credit','days','days_overdue','Дней просрочки');
  toast(r.note, r.broken.length ? 'err' : 'ok'); render(); };
RP.demoWithdraw = () => { const r = RP.withdrawStat('s-overdue-sum');
  toast(r.note, 'err'); render(); };
RP.reset = () => { const view = RP.state.view; RP.seed(); RP.state.view = view;
  toast('исходное состояние восстановлено','ok'); render(); };

/* ---------------------------- КОНСТРУКТОР ---------------------------- */
function scBuilder(){
  const vis = RP.visibleTemplates();
  let tid = RP.state.sel.draft;
  if(vis.indexOf(tid) === -1) tid = vis[0];
  const t = TPL(tid), ed = draftEd(t) || pubEd(t), list = SEAM.fieldList(ed.object);
  const checks = draftEd(t) ? RP.publishChecks(tid) : [];
  let h = '<div class="page-lead">Конструктор собирает <em>вопрос</em>: объект, режим, поля из '+
    'публичного перечня владельца, показатели из реестра статистики. Своей формулы и своего '+
    'перечня полей у отчётности нет ни одной (ИО-2, ИО-3) — поэтому вторая версия той же '+
    'величины здесь физически не заводится.</div>';
  h += '<div class="form-row"><div class="fld"><label>Шаблон</label><select onchange="RP.selDraft(this.value)">'+
    vis.map(id => '<option value="'+id+'"'+(id===tid?' selected':'')+'>'+esc(TPL(id).name)+'</option>').join('')+
    '</select></div></div>';

  h += '<div class="cols" style="margin-top:14px"><div class="body"><div class="card"><h3>Состав редакции '+
    ed.n+' <span class="small">· '+esc(ed.state)+'</span></h3>'+
    kv([
      ['Вид шаблона', t.kind],
      ['Объект', list.name+' (владелец перечня — '+list.owner+')'],
      ['Режим', ed.mode + (ed.mode === 'сейчас'
        ? ' — спрашивается шов objectRows у ядра' : ' — спрашиваются швы статистики')],
      ['Поля', ed.fields.length ? ed.fields.map(f => { const x = list.fields.find(y => y.id === f);
        return x ? esc(x.name) : '<span style="color:var(--asubk-red)">'+esc(f)+' — нет в перечне</span>'; }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Подстановки бланка', (ed.subs||[]).length ? (ed.subs||[]).map(s => { const x = list.fields.find(y => y.id === s);
        return '{{'+esc(s)+'}}' + (x ? '' : ' <span style="color:var(--asubk-red)">— нет в перечне</span>'); }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Показатели', ed.stats.length ? ed.stats.map(s => { const m = SEAM.statMeta(s);
        return m ? esc(m.name)+(m.withdrawn ? ' <span style="color:var(--asubk-red)">— выведен '+fmt(m.withdrawn)+'</span>'
          : (m.live ? '' : ' <span style="color:var(--asubk-amber)">— налету не берётся</span>')) : esc(s); }).join('; ')
        : '<span class="muted">—</span>', true],
      ['Параметры', ed.params.map(p => p.name+' ('+p.role+')').join('; ')],
      ['Разрезы и уровни', ed.cuts.length ? ed.cuts.map((c, i) => (i+1)+'-й уровень — '+cutName(c)+
        ((ed.levelTotals || []).indexOf(c) !== -1 ? ' <b>с итоговой строкой</b>' : '')).join('; ') : '—', true],
      ['Разрядность', (ed.stats || []).map(s => { const dp = dpOf(ed, s);
        return dp == null ? null : (SEAM.statMeta(s) || {name:s}).name+' → '+
          (dp === 0 ? 'целых' : dp+' зн.'); }).filter(Boolean).join('; ') || '<span class="muted">не объявлена</span>', true]
    ])+'</div>';

  h += '<div class="card"><h3>Шесть проверок публикации (§4)</h3>'+
    '<div class="small">Отказ громкий и <em>на публикации</em>, а не тихая неточность в выпуске: '+
    'к моменту выпуска за экраном человек с задачей, а не с настройкой (ИО-7).</div>';
  if(!draftEd(t)) h += '<div class="banner info">У шаблона нет черновой редакции — публиковать нечего.</div>';
  else if(!checks.length) h += '<div class="banner ok">Все шесть проверок пройдены. '+
    'Публикация превратит личный черновик в шаблон организации.</div>';
  else h += '<div class="facts">'+checks.map(c => '<div class="f no"><b>'+esc(c.check)+':</b> '+
    esc(c.why)+'</div>').join('')+'</div>';
  h += '<div class="btn-row">'+
    '<button class="btn btn-primary btn-sm" onclick="RP.doPublish(\''+t.id+'\')">Опубликовать редакцию</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doAsk(\''+t.id+'\')">Попросить публикации</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doBasis(\''+t.id+'\')">Сослаться на п. 12 Порядка №41</button>'+
    '</div></div>';

  /* Границы крутилки — часть РЕДАКЦИИ: объявляются там же, где состав, и
     задним числом не расширяются (ИО-20, ADR-0162 §1).                     */
  const bo = RP.bounds(t.id);
  h += '<div class="card"><h3>Допустимые отклонения (§3 п. 9)</h3>'+
    '<div class="small">Второй список рядом с составом: что экрану разрешено крутить. Перечень '+
    '<em>разрешённого</em> — не признак «жёсткий / свободный» на весь отчёт и не флаг на каждой '+
    'ячейке: по второй дороге легаси пришло к 928 ячейкам с личным <span class="mono">position</span> '+
    '(ОЧ-33). Что не названо отклонением — не крутится: такой состав собирается личным '+
    'черновиком (ИО-20).</div>'+
    kv([['Разрезы — включать, убирать, переставлять', bo.cutNames.join('; ') ||
          '<span class="muted">нет — уровни жёсткие</span>', true],
        ['Показатели — скрывать и добавлять', bo.statNames.join('; ') ||
          '<span class="muted">нет — состав показателей жёсткий</span>', true],
        ['Углубление до строк объектов', bo.drill
          ? 'крутится: снятое углубление меняет шов — statRows не спрашивается вовсе'
          : 'объявлено редакцией, экраном не трогается'],
        ['Раскладка', 'свободна всегда: '+bo.layouts.join(' · ')+' — клетки те же, вопрос тот же'],
        ['Окончательный выпуск', 'только составом по умолчанию: накрученное сдать нельзя (ИО-21)']])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFreeWithdrawn(\''+t.id+'\')">Разрешить экрану выведенный показатель</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFreePub()">Расширить границы опубликованной редакции</button>'+
    '</div></div>';

  h += '<div class="card"><h3>Что правится без новой редакции</h3>'+
    '<div class="small">Круг, расписание, признак «пригоден для обзора» и серия живут <em>вне</em> '+
    'редакции: они не меняют вопроса, а значит не порождают новой редакции (§2.1).</div>'+
    kv([['Круг подразделений', t.circle.map(deptName).join('; ')],
        ['Расписание сдачи', t.schedule ? t.schedule.text : 'по требованию'],
        ['Пригоден для обзора', t.forReview ? 'да' : 'нет'],
        ['Полный охват обязателен', t.fullCoverage ? 'да — получателя нельзя назвать при усечённом охвате (§13.4)' : 'нет']])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doCircle(\''+t.id+'\')">Сузить круг до департамента промышленности</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doSchedule(\''+t.id+'\')">Назначить ежемесячную сдачу к 15-му</button>'+
    '</div></div></div>';

  /* Лист выгрузки и итоги уровней — состав редакции, а не настройка экрана
     (§3 пп. 4, 8; ИО-17, ИО-18). Карточка показывает и то и другое вместе,
     потому что порядок полос без итогов уровней бессмыслен.                  */
  const sh = RP.sheetOf(t.id);
  h += '<div class="card"><h3>Итоги уровней и лист выгрузки</h3>'+
    '<div class="small">В легаси печатное представление собирается из номеров строк макета, и '+
    'потому <em>ИТОГО печатается перед группами</em>, из которых оно якобы сложено. Здесь полосы '+
    '<em>объявлены</em> списком, а итог по уровню спрашивается швом: доля, средняя и количество '+
    'уникальных не аддитивны, и складывать частные итоги модуль не вправе (ИО-17, ОЧ-25, ОЧ-26).</div>'+
    '<div class="bands">'+sh.bands.map((b, i) => '<span class="band'+(b === 'итог' ? ' tot' :
      (b === 'уровни' ? ' lv' : ''))+'">'+(i+1)+'. '+esc(b)+'</span>').join('<span class="arr">→</span>')+
    '</div>'+
    kv([['Ориентация листа', sh.orient],
        ['Шапка на каждой странице', sh.repeatHeader ? 'да' : 'нет'],
        ['Подвал', sh.footer === 'паспорт' ? 'паспорт ответа (кто, чем, на какую дату, каким охватом)' : sh.footer],
        ['Форматы выгрузки', sh.formats.join(' · ')+' — перечень объявлен редакцией, а не набором кнопок'],
        ['Итоги по уровням', sh.levels.filter(l => l.total).map(l => l.name).join('; ') ||
          '<span class="muted">нет</span>', true]])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doBands(\''+t.id+'\')">Поставить итог перед уровнями</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFold(\''+t.id+'\')">Сложить итоги уровней самим</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doLandscape(\''+t.id+'\')">Развернуть лист альбомно</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doColDate(\''+t.id+'\')">Взять один столбец на другую дату</button>'+
    '</div></div></div>';

  h += '<div class="side"><div class="mirror"><div class="row"><span class="k">публичный перечень</span>'+
    esc(list.name)+'</div><div class="row"><span class="k">владелец</span>'+esc(list.owner)+'</div>'+
    list.fields.map(f => '<div class="row"><span class="k">'+esc(f.id)+'</span>'+esc(f.name)+'</div>').join('')+
    '</div><div class="small">Это <em>зеркало</em> чужого контракта. Отчётность его читает швом '+
    '<span class="mono">fieldList</span> и своих полей не заводит — иначе переименование в ядре '+
    'тихо разошлось бы с шаблоном.</div>'+
    '<div class="mirror none" style="margin-top:12px"><div class="row"><span class="k">реестр показателей</span>'+
    'владелец — статистика</div>'+
    STATS.map(s => '<div class="row"><span class="k">'+esc(s.name)+'</span>'+
      (s.withdrawn ? 'выведен '+fmt(s.withdrawn) : (s.live ? 'налету — да' : 'налету — нет'))+'</div>').join('')+
    '</div></div></div>';
  return h;
}
const deptCutName = c => c === 'dept' ? 'по подразделению' : c;

/* Полосы уровней. Итог печатается ПОСЛЕ строк своей группы и приходит швом:
   складывать частные итоги модуль не вправе (ИО-17, ОЧ-25).                 */
function cellRow(r, cols){
  return '<tr>'+cols.map(c => { const val = r[c.id];
    return '<td'+(typeof val === 'number' ? ' class="num"' : '')+'>'+
      esc(typeof val === 'number' ? money(val) : (val == null ? '—' : val))+'</td>'; }).join('')+'</tr>';
}
function bandRows(gs, cols, depth){
  const lvl = depth || 1;
  return gs.map(g => {
    let out = '<tr class="grp g'+lvl+'"><td colspan="'+cols.length+'">'+
      '<b>'+esc(g.name)+'</b> <span class="small">'+esc(objWord(g.count))+'</span></td></tr>';
    out += g.children ? bandRows(g.children, cols, lvl + 1)
                      : (g.rows || []).map(r => cellRow(r, cols)).join('');
    if(g.totals) out += '<tr class="gtot"><td colspan="'+cols.length+'">Итог по «'+esc(g.name)+'»: '+
      g.totals.map(x => esc(x.name)+' — <b>'+(x.shown == null ? '—' : esc(money(x.shown)))+'</b> '+
        esc(x.unit)).join(' · ')+
      ' <span class="small">спрошен швом <span class="mono">statSlice</span> пакетно; '+
      'модуль его не складывал (ИО-17)</span></td></tr>';
    return out;
  }).join('');
}

/* ------------------------------ ВЫПУСК ------------------------------- */
function scIssue(){
  const vis = RP.visibleTemplates().filter(id => RP.pubEd(id));
  if(!vis.length) return '<div class="banner warn">Опубликованных шаблонов вам не видно: '+
    'выпускать можно только опубликованную редакцию (ИО-1).</div>';
  let tid = RP.state.sel.tpl;
  if(vis.indexOf(tid) === -1) tid = vis[0];
  const t = TPL(tid), ed = pubEd(t), sel = RP.state.sel;
  const isBlank = t.kind === 'бланк';
  const params = isBlank ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept};
  /* Сначала ПОКАЗ, и только потом выпуск: показ крутится в границах редакции,
     выпуск — нет (ИО-20, ИО-21, ADR-0162).                                  */
  const wTwist = isBlank ? null : (sel.twist
    ? Object.assign({}, sel.twist, {dropped: sel.dropped || null}) : null);
  let prev = RP.show(tid, params, wTwist), twistWhy = null;
  if(!prev.ok){ twistWhy = prev.why; prev = RP.show(tid, params, null); }

  let h = '<div class="page-lead">Сначала <em>показ</em>, потом выпуск. Показ считается по '+
    'редакции и значениям параметров, снимка не морозит, номера не тратит и следа в журнале не '+
    'оставляет — потому рядом с числами стоит шапка с меткой «не выпуск» (ADR-0162 §5). '+
    'Выпуск — <em>предъявление ответа</em>, ступеней две: предварительно (числа живые, '+
    'обязательства не закрываются) и окончательно с названным получателем — тогда числа и файл '+
    'морозятся снимком. Морозит именно получатель, а не кнопка «сохранить» (ИО-4, ADR-0157 §2).</div>';
  if(twistWhy) h += '<div class="banner danger"><b>Накрутка не принята.</b> '+esc(twistWhy)+
    '. Показан состав по умолчанию.</div>';

  h += '<div class="form-row"><div class="fld"><label>Шаблон</label>'+
    '<select onchange="RP.selTpl(this.value)">'+vis.map(id =>
      '<option value="'+id+'"'+(id===tid?' selected':'')+'>'+esc(TPL(id).name)+'</option>').join('')+'</select></div>';
  if(isBlank) h += '<div class="fld"><label>Кредит (объект бланка)</label>'+
    '<select onchange="RP.setObj(this.value)">'+OBJECTS.map(o =>
      '<option value="'+o.id+'"'+(o.id===sel.obj?' selected':'')+'>'+esc(o.no+' · '+o.borrower)+'</option>').join('')+
    '</select></div>';
  else {
    if(ed.mode === 'на дату') h += '<div class="fld"><label>Отчётный месяц</label>'+
      '<select onchange="RP.setAsOf(this.value)">'+HIST_DATES.map(d =>
        '<option value="'+d+'"'+(d===sel.params.asOf?' selected':'')+'>'+esc(periodOfAsOf(d))+
        ' (состояние на '+fmt(d)+')</option>').join('')+
      '<option value="2026-09-01"'+(sel.params.asOf==='2026-09-01'?' selected':'')+
      '>август 2026 (снимка нет — будет подстановка)</option></select></div>';
    h += '<div class="fld"><label>Подразделение (разрез)</label><select onchange="RP.setDept(this.value)">'+
      '<option value="">все подразделения круга</option>'+DEPTS.map(d =>
        '<option value="'+d.id+'"'+(d.id===sel.params.dept?' selected':'')+'>'+esc(d.name)+'</option>').join('')+
      '</select></div>';
  }
  h += '</div>';
  /* Экран открывается на периоде, у которого снимок ЕСТЬ, и говорит вслух, когда
     выбран период без снимка: молчаливая подстановка соседней даты — это ответ
     на другой вопрос под именем заказанного (ИО-26, ОЧ-44).                   */
  if(!isBlank && ed.mode === 'на дату' && !RP.hasSnapshot(sel.params.asOf))
    h += '<div class="banner warn"><b>За этот период снимка нет.</b> Ночной прогон до '+
      esc(fmt(sel.params.asOf))+' не доходил; числа ниже посчитаны по ближайшему более раннему '+
      'состоянию, и шапка показа назовёт подставленную дату. Сдавать такой показ окончательно '+
      'нельзя: обязательство берётся на объявленном периоде, а не на соседнем (ИО-8, ИО-26).</div>';

  /* --- как смотреть: крутилка в границах редакции (§3 п. 9, ИО-20) --- */
  if(!isBlank){
    const bo = RP.bounds(tid), w = prev.twist, base = bo.base, mine = RP.myViews(tid);
    h += '<div class="card"><h3>Как смотреть — в границах, объявленных редакцией '+bo.ed+'</h3>'+
      '<div class="small">Редакция объявляет <em>два</em> списка: состав по умолчанию и перечень '+
      'допустимых отклонений. Внутри границ это тот же отчёт; за границей — другой вопрос, то '+
      'есть личный черновик, а не показ (ИО-20). Раскладка объявления не требует вовсе — клетки '+
      'те же; углубление до строк объектов требует: это другой шов (ADR-0162 §8).</div>';
    h += '<div class="form-row"><div class="fld"><label>Разрезы — уровни слева направо</label>'+
      '<div class="btn-row" style="margin:0">'+
      uniq(base.cuts.concat(bo.cuts)).map(c => { const on = w.cuts.indexOf(c) !== -1,
        hard = bo.cuts.indexOf(c) === -1;
        return '<button class="btn btn-sm '+(on ? 'btn-primary' : 'btn-secondary')+'"'+
          (hard ? ' disabled title="уровень объявлен составом: отклонением не назван"' : '')+
          ' onclick="RP.twistCut(\''+c+'\')">'+esc(cutName(c))+
          (hard ? ' · жёстко' : '')+'</button>'; }).join('')+
      w.cuts.filter(c => bo.cuts.indexOf(c) !== -1).map(c =>
        '<button class="btn btn-secondary btn-sm" onclick="RP.twistUp(\''+c+'\')" '+
        'title="поднять уровень выше">↑ '+esc(cutName(c))+'</button>').join('')+
      '</div></div>';
    h += '<div class="fld"><label>Показатели</label><div class="btn-row" style="margin:0">'+
      uniq(base.stats.concat(bo.stats)).map(s => { const on = w.stats.indexOf(s) !== -1,
        hard = bo.stats.indexOf(s) === -1;
        return '<button class="btn btn-sm '+(on ? 'btn-primary' : 'btn-secondary')+'"'+
          (hard ? ' disabled title="показатель объявлен составом: отклонением не назван"' : '')+
          ' onclick="RP.twistStat(\''+s+'\')">'+esc(statName(s))+
          (hard ? ' · жёстко' : '')+'</button>'; }).join('')+'</div></div></div>';
    h += '<div class="form-row"><div class="fld"><label>Строки объектов (углубление)</label>'+
      '<button class="btn btn-sm '+(w.drill ? 'btn-primary' : 'btn-secondary')+'"'+
        (bo.drill ? '' : ' disabled title="редакция углубление отклонением не объявила"')+
        ' onclick="RP.twistDrill()">'+(w.drill ? 'печатаются — спрошен statRows'
          : 'не печатаются — спрошен только statSlice')+'</button></div>'+
      '<div class="fld"><label>Раскладка (объявления не требует)</label>'+
      '<select onchange="RP.twistLayout(this.value)">'+RP.layouts().map(l =>
        '<option'+(l === w.layout ? ' selected' : '')+'>'+esc(l)+'</option>').join('')+
      '</select></div>'+
      '<div class="fld"><label>Личный вид</label><select onchange="RP.useView(this.value)">'+
        '<option value="">— без вида, состав по умолчанию —</option>'+mine.map(vw =>
          '<option value="'+vw.id+'"'+(vw.id === sel.view ? ' selected' : '')+'>'+
          esc(vw.name)+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Сохранить накрутку видом</label>'+
        '<input value="'+esc(sel.viewName || '')+'" onchange="RP.setViewName(this.value)" '+
        'placeholder="как я смотрю просрочку"></div></div>';
    h += '<div class="btn-row">'+
      '<button class="btn btn-primary btn-sm" onclick="RP.doSaveView()">Сохранить вид</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.twistReset()">Вернуть состав по умолчанию</button>'+
      (sel.view ? '<button class="btn btn-secondary btn-sm" onclick="RP.doDropView()">Удалить вид</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.doShareView()">Передать вид коллеге</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.doPublishView()">Опубликовать вид для всех</button>' : '')+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doTwistOut()">Добавить разрез «заёмщик»</button>'+
      '</div></div>';
  }

  /* --- показ: шапка, потом числа --- */
  h += showBox(prev.head);
  /* Момент показа выведен из РЕЖИМА ВРЕМЕНИ, а не назначен: «на дату» читает
     готовые строки ночного прогона — считается сразу; «сейчас» — живой запрос
     к ядру, и гонять его оттого, что кто-то промахнулся мимо строки списка,
     незачем. Легаси мерил: весь портфель 107 с, отбор вчетверо уже — 90 с;
     стоимость сидит не в числе строк, и кнопка её не лечит (ОЧ-44).         */
  const liveGate = !isBlank && ed.mode === 'сейчас' && !sel.live;
  if(liveGate){
    h += '<div class="card"><h3>Числа не запрошены</h3>'+
      '<div class="small">Режим этой редакции — <em>сейчас</em>: числа берутся живым запросом '+
      'к ядру (шов <b>objectRows</b>), а не из готовых строк прогона. Шапка выше отвечает за '+
      'себя уже сейчас — кто смотрит, чем, каким охватом; неизвестны только величины. '+
      'В режиме «на дату» этой кнопки нет: там считается сразу.</div>'+
      '<div class="btn-row"><button class="btn btn-primary" onclick="RP.askLive()">'+
      'Посчитать на сейчас</button></div></div>';
  } else {
  h += '<div class="sheet" style="margin-top:14px"><div class="sheet-h">'+esc(t.name)+'</div>'+
    '<div class="sheet-sub">ред. '+ed.n+' · '+esc(t.basis ? (t.basis.point ? 'п. '+t.basis.point+' ' : '')+t.basis.doc
      : 'основание не названо')+'</div>';
  if(isBlank){
    const d = prev.data;
    if(!d.row) h += '<div class="banner danger">Объект вне области видимости роли: бланк печатает тот, '+
      'у кого шаблон в круге <b>и</b> объект видим — два замка (§13.3).</div>';
    else {
      h += '<div class="lineform">'+d.subs.map(s => '<div class="small"><b>{{'+esc(s.id)+'}}</b> → '+
        (s.lost ? '<span style="color:var(--asubk-red)">поля нет в перечне</span>'
          : esc(typeof s.value === 'number' ? money(s.value) : s.value))+
        '<div class="muted">'+esc(s.name || '—')+'</div></div>').join('')+'</div>';
      h += '<div class="foot-pass">Подстановки берутся из <b>публичного перечня</b> объекта тем же '+
        'швом, что и колонки отчёта: своих полей у бланка нет (§8).</div>';
    }
  } else {
    const d = prev.data;
    /* Порядок полос берётся из ЛИСТА редакции, а не из порядка кода: в легаси
       он выведен из номеров строк макета, и ИТОГО печатается перед группами
       (ОЧ-26, ОЧ-33).                                                        */
    h += '<div class="bands">'+d.sheet.bands.map((b, i) => '<span class="band'+(b === 'итог' ? ' tot' :
      (b === 'уровни' ? ' lv' : ''))+'">'+(i+1)+'. '+esc(b)+'</span>').join('<span class="arr">→</span>')+
      '<span class="arr">·</span><span class="small">лист '+esc(d.sheet.orient)+
      ', форматы: '+esc(d.sheet.formats.join(' · '))+'</span></div>';
    h += '<table class="cgrid"><thead><tr>'+d.cols.map(c =>
      '<th>'+(c.lost ? '<span style="color:var(--asubk-red)">'+esc(c.id)+' — нет в перечне</span>' : esc(c.name))+
      '</th>').join('')+'</tr></thead><tbody>';
    if(d.groups && d.groups.length) h += bandRows(d.groups, d.cols);
    else d.rows.forEach(r => { h += cellRow(r, d.cols); });
    if(!d.rows.length) h += '<tr><td colspan="'+Math.max(1,d.cols.length)+'" class="muted">строк нет</td></tr>';
    h += '</tbody></table>';

      'редактируемом формате не снимок (ИО-10, ADR-0161 §2)</div>'+
    (prev.deviated ? '<div class="f no">накрученный показ выпускается <b>предварительно</b>: '+
      'паспорт запишет показанный состав целиком (ИО-22), а сдать его нельзя — обязательство '+

  /* --- четыре действия с показанным (ОЧ-49) --- */

  h += '<div class="card"><h3>Что делают с показанным — четыре дороги</h3>'+

    '<div class="facts">'+

      (isBlank ? ['docx','pdf'] : sheetOfEd(ed).formats).map(f =>

        : '<button class="btn btn-secondary btn-sm" onclick="RP.doStep(\''+j.id+'\')">Шаг задания</button>')+
      '</td></tr>').join('')+'</tbody></table>';
  h += '</div>';

RP.selTpl = id => { const sel = RP.state.sel;
  /* Накрутка привязана к шаблону: смена шаблона её не переносит.            */
  sel.tpl = id; sel.twist = null; sel.view = null; sel.dropped = null; sel.live = false;
  render(); };
function shownArgs(){ const sel = RP.state.sel, t = TPL(sel.tpl);
  const isB = t && t.kind === 'бланк';
  return {tid: sel.tpl, isBlank: isB,
    params: isB ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept},
    twist: isB ? null : (sel.twist || null)}; }
RP.doExportShown = f => { const a = shownArgs();
  act(RP.exportShown(a.tid, a.params, a.twist, f)); };
RP.setWlName = v => { RP.state.sel.wlName = v; };
RP.doWorklistShown = () => { const sel = RP.state.sel, a = shownArgs();
  const r = RP.worklistShown(a.tid, a.params, a.twist, sel.wlName);
  if(r.ok){ sel.wl = r.id; sel.wlName = ''; }
  act(r); };
function curTwist(){ const sel = RP.state.sel;
  const b = sel.twist || RP.defaultOf(sel.tpl);
  return {cuts: b.cuts.slice(), stats: b.stats.slice(), drill: b.drill, layout: b.layout}; }
function setTwist(w){ const sel = RP.state.sel;
  const r = RP.show(sel.tpl, {asOf: sel.params.asOf, dept: sel.params.dept}, w);
  if(!r.ok) return act(r);
  sel.twist = w; sel.view = null; sel.dropped = null;
  if(r.deviated && sel.kind === 'окончательный') sel.kind = 'предварительный';
  render(); }
RP.twistCut = c => { const w = curTwist(); const i = w.cuts.indexOf(c);
  if(i === -1) w.cuts.push(c); else w.cuts.splice(i, 1); setTwist(w); };
RP.twistStat = s => { const w = curTwist(); const i = w.stats.indexOf(s);
  if(i === -1) w.stats.push(s); else w.stats.splice(i, 1); setTwist(w); };
RP.twistDrill = () => { const w = curTwist(); w.drill = !w.drill; setTwist(w); };
RP.twistLayout = v => { const w = curTwist(); w.layout = v; setTwist(w); };
RP.twistUp = c => { const w = curTwist(); const i = w.cuts.indexOf(c);
  if(i > 0){ w.cuts.splice(i, 1); w.cuts.splice(i - 1, 0, c); } setTwist(w); };
RP.twistReset = () => { const sel = RP.state.sel;
  sel.twist = null; sel.view = null; sel.dropped = null; render(); };
RP.doTwistOut = () => { const w = curTwist();
  if(w.cuts.indexOf('borrower') === -1) w.cuts.push('borrower'); setTwist(w); };
RP.setViewName = v => { RP.state.sel.viewName = v; };
RP.doSaveView = () => { const sel = RP.state.sel;
  const r = RP.saveView(sel.tpl, sel.viewName, sel.twist || null);
  if(r.ok){ sel.view = r.id; sel.viewName = ''; }
  act(r); };
RP.useView = id => { const sel = RP.state.sel;
  if(!id) return RP.twistReset();
  const a = RP.applyView(id);
  if(!a.ok) return act(a);
  sel.view = id; sel.tpl = a.view.tpl; sel.dropped = a.dropped;
  sel.twist = {cuts: a.twist.cuts, stats: a.twist.stats, drill: a.twist.drill,
    layout: a.twist.layout, view: a.view.name};
  if(a.deviated && sel.kind === 'окончательный') sel.kind = 'предварительный';
  act({ok:true, note: a.note}); };
RP.doDropView = () => { const sel = RP.state.sel; const r = RP.deleteView(sel.view);
  if(r.ok){ sel.view = null; sel.twist = null; sel.dropped = null; } act(r); };
RP.doShareView = () => act(RP.shareView(RP.state.sel.view, 'Асанов А.'));
RP.doPublishView = () => act(RP.publishView(RP.state.sel.view));
RP.setObj = id => { RP.state.sel.obj = id; RP.state.sel.live = false; render(); };
/* Период без снимка выбрать МОЖНО, но предупреждение приходит в момент выбора,
   а не после счёта: умолчанием он не бывает никогда (ИО-26, ОЧ-44).         */
RP.setAsOf = v => { RP.state.sel.params.asOf = v; RP.state.sel.live = false;
  if(!RP.hasSnapshot(v)) toast('у периода «'+periodOfAsOf(v)+'» снимка нет: числа возьмутся '+
    'подстановкой ближайшего прошлого снимка, и паспорт это назовёт. Умолчанием такой период '+
    'не бывает — экран открывается на последнем, у которого снимок есть (ИО-26)', 'err');
  render(); };
RP.setDept = v => { RP.state.sel.params.dept = v; RP.state.sel.live = false; render(); };
RP.askLive = () => { RP.state.sel.live = true; render(); };
RP.setKind = v => { RP.state.sel.kind = v; render(); };
RP.setRecipient = v => { RP.state.sel.recipient = v; render(); };
RP.setNumber = v => { RP.state.sel.number = v; render(); };
function issueSpec(){
  const sel = RP.state.sel, t = TPL(sel.tpl) || TPL(RP.visibleTemplates()[0]);
  const params = t.kind === 'бланк' ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept};
  return {t, spec:{params, kind: sel.kind,
    twist: t.kind === 'бланк' ? null : (sel.twist || null),
    recipient: (sel.kind === 'окончательный' && t.kind !== 'бланк') ? sel.recipient : null,
    number: sel.number}};
}
RP.doOrder = () => { const q = issueSpec();
  const r = RP.order(q.t.id, q.spec);
  act(r, r.ok ? 'заказ '+r.id+' принят: чисел ещё нет, строка журнала уже есть' : ''); };
RP.doStep = id => { const r = RP.step(id);
  if(r.done && r.ok){ RP.state.sel.issue = id; RP.state.view = 'journal'; }
  act(r, r.ok ? (r.done ? 'выпуск '+id+': '+r.note : r.note) : ''); };
RP.doIssue = () => { const q = issueSpec();
  const r = RP.issue(q.t.id, q.spec);
  if(r.ok){ RP.state.sel.issue = r.id; RP.state.view = 'journal'; }
  act(r, r.ok ? 'выпуск '+r.id+': '+r.note : '');
};
RP.demoStringRecipient = () => { const sel = RP.state.sel, t = TPL(sel.tpl);
  act(RP.issue(t.id, {params:{asOf:sel.params.asOf, dept:sel.params.dept, obj:sel.obj},
    kind:'окончательный', recipient:'Минфин КР'})); };
RP.demoDocx = () => { const sel = RP.state.sel, t = TPL(sel.tpl);
  act(RP.issue(t.id, {params:{asOf:sel.params.asOf, dept:sel.params.dept, obj:sel.obj},
    kind:'окончательный', recipient:sel.recipient, format:'docx'})); };

    '<div class="chips">'+list.fields.map(f =>

  h += '<div class="card"><h3 class="small">Серия и номер</h3>'+kv([
    ['серия', t.series ? t.series.prefix : '—'],

    'предварительный печатается без номера, иначе в серии зияли бы дыры (ИО-9).</div></div>';

  h += '</div></div>';
  return h;
}
