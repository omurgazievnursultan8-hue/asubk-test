RP.brokenTemplates = () => RP.state.templates.filter(t => {
  const ed = pubEd(t); return ed && brokenBy(t, ed); })
  .map(t => ({id:t.id, name:t.name, why: brokenBy(t, pubEd(t))}));

/* ================= ПУБЛИКАЦИЯ: ГДЕ ЛОВЯТСЯ ОШИБКИ (§4) ================
   Всё проверяемое заранее проверяется ЗДЕСЬ, а не на выпуске: к моменту
   выпуска за экраном человек с задачей, а не с настройкой (ИО-7).           */
RP.publishChecks = tid => {
  const t = TPL(tid); if(!t) return [{ok:false, why:'отчёта или бланка нет'}];
  const ed = draftEd(t);
  if(!ed) return [{ok:false, why:'черновой редакции нет: утверждать нечего'}];
  const list = SEAM.fieldList(ed.object);
  const out = [];
  /* 1. подстановка не из публичного перечня */
  (ed.subs || []).forEach(s => { if(!list.fields.some(f => f.id === s))
    out.push({check:'подстановка', ok:false,
      why:'в макете ${'+s+'} — объект «'+list.name+'» такого поля не объявляет'}); });
  /* 1а. проверка макета документом: старая запись {{…}}, вид значения не из
     набора, условие не из списка, незакрытый повтор — ошибка с местом.     */
  if(t.kind === 'бланк' && ed.pdfForm) pdfFormCheck(ed).forEach(e =>
    out.push({check:'проверка макета', ok:false, why:'поле формы «'+e.field+'»: '+e.why}));
  else if(t.kind === 'бланк') parseLayout(ed.layoutText, ed.object, ed.mode).errors
    .filter(e => e.why.indexOf('такого поля не объявляет') === -1)
    .forEach(e => out.push({check:'проверка макета', ok:false, why:'стр. '+e.line+': '+e.why}));
  /* 1б. своя формула в официальный не входит (ИО-46, ADR-0281 п. 2) */
  (ed.formulas || []).forEach(f => out.push({check:'своя формула', ok:false,
    why:'«'+f.name+'» = '+formulaExpr(f)+': своя формула в официальный отчёт не входит — передайте её '+
      'владельцу реестра показателем или объявите производной колонкой'}));
  /* 1в. колонки-даты — из закрытого набора, «аналогичный» — от колонки формы (ОГ-35) */
  if(t.kind === 'отчёт'){ const badTc = timeColsCheck(ed);
    if(badTc) out.push({check:'колонки-даты', ok:false, why: badTc}); }
  /* 2. показатель выведен из реестра */
  ed.stats.forEach(sid => { const m = SEAM.statMeta(sid);
    if(m && m.withdrawn) out.push({check:'показатель выведен', ok:false,
      why:'показатель «'+m.name+'» выведен '+fmt(m.withdrawn)+', нужна новая редакция'}); });
  /* 3. показатель неисчислим налету при режиме «сейчас» */
  if(ed.mode === 'сейчас') ed.stats.forEach(sid => { const m = SEAM.statMeta(sid);
    if(m && !m.live) out.push({check:'исчислимость налету', ok:false,
      why:'показатель «'+m.name+'» налету не берётся: '+m.why}); });
  /* 3а. бланк без объявленного адресата — или с видом/значением, которого не
     бывает. Проверяются оба: вид объявляет редакция, значение ведёт сосед. */
  if(t.kind === 'бланк'){ const badAddr = addresseeCheck(ed.addressee);
    if(badAddr) out.push({check:'адресат бланка', ok:false, why: badAddr}); }
  /* 4. нормативное основание, названное не публикующим */
  if(t.basisAsk) out.push({check:'основание', ok:false,
    why:'сослаться на пункт нормы может только утверждающий: в личном черновике вписано «'+
      'п. '+t.basisAsk.point+' '+t.basisAsk.doc+'», уполномоченный называет основание сам'});
  /* 5. поле ядра переименовано или снято */
  ed.fields.forEach(fid => { if(!list.fields.some(f => f.id === fid))
    out.push({check:'поле ядра', ok:false,
      why:'поле «'+fid+'» объект «'+list.name+'» больше не объявляет: перечень изменил его '+
        'владелец ('+list.owner+') — виноват не отчёт'}); });
  return out;
};
RP.publish = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  if(!RP.isAuth()) return {ok:false, why:'утверждает уполномоченный по отчётности: роль «'+
    RP.state.role+'» собирает личный черновик, но официальным отчётом его не делает (ИО-1, ADR-0156 §2)'};
  if(!RP.maySee(tid)) return {ok:false, why:'черновик «'+t.name+'» личный: пока автор ('+t.owner+
    ') не попросил утверждения, его состав не виден никому'};
  const ed = draftEd(t);
  if(!ed) return {ok:false, why:'черновой редакции нет: утверждать нечего'};
  const bad = RP.publishChecks(tid);
  if(bad.length) return {ok:false, why: bad[0].why, all: bad};
  ed.state = 'утверждена'; ed.since = RP.state.today; ed.at = RP.state.today; ed.by = RP.who();
  t.asked = false;
  log('утверждена редакция '+ed.n+' «'+t.name+'»');
  return {ok:true, note:'редакция '+ed.n+' утверждена '+fmt(RP.state.today)};
};
RP.askPublish = tid => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  if(t.owner !== RP.who()) return {ok:false, why:'черновик чужой: попросить утверждения может автор'};
  t.asked = true; log('черновик «'+t.name+'» передан на утверждение');
  return {ok:true, note:'уполномоченный увидит состав и проверит его §4'};
};
RP.setBasis = (tid, basis) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  if(!RP.isAuth()) { t.basisAsk = basis;
    return {ok:false, why:'сослаться на пункт нормы может только утверждающий: основание «'+
      'п. '+basis.point+' '+basis.doc+'» записано в черновик как просьба, а не как основание'}; }
  t.basis = basis; t.basisAsk = null; log('основание «'+t.name+'» — п. '+basis.point);
  return {ok:true, note:'основание названо уполномоченным'};
};
/* Круг, расписание, «пригоден для обзора» и тип документа живут ВНЕ редакции: их
   правка не порождает новой редакции, потому что не меняет вопроса (§2.1).  */
RP.setCircle = (tid, depts) => { const t = TPL(tid);
  if(!RP.isAuth()) return {ok:false, why:'круг подразделений ведёт уполномоченный по отчётности'};
  t.circle = depts.slice(); log('круг «'+t.name+'» изменён');
  return {ok:true, note:'новой редакции не понадобилось: круг — не часть вопроса'}; };
RP.setSchedule = (tid, sch) => { const t = TPL(tid);
  if(!RP.isAuth()) return {ok:false, why:'расписание сдачи ведёт уполномоченный по отчётности'};
  const bad = scheduleRecipientsCheck(t, sch);
  if(bad) return {ok:false, why: bad};
  t.schedule = sch; log('расписание «'+t.name+'» изменено');
  return {ok:true, note:'обязательства перечитаются из правила — календарь дат руками не ведётся'}; };

/* ==================== ДВИЖОК БЛАНКА (§8) ==============================
   Тот же закон: подстановки берутся из публичного перечня швом, своих полей
   у бланка нет. ==ДВИЖОК-БЛАНК==                                           */
function composeBlank(tpl, ed, objId, viewer, asOf){
  /* Бланк тоже бывает «на дату»: акт сверки говорит о состоянии на 1 января, и
     брать его из живого ядра значило бы напечатать сегодняшние числа под чужой
     датой. Тогда вход — тот же шов статистики, что у отчёта (волна 9).        */
  const dated = ed.mode === 'на дату';
  const src = dated ? SEAM.statRows(ed.object, asOf, {obj:objId}, viewer.scope.slice())
                    : SEAM.objectRows(ed.object, {obj:objId}, viewer.scope.slice());
  const list = SEAM.fieldList(ed.object);
  const row = src.rows[0] || null;
  const subs = (ed.subs || []).map(sid => {
    const f = list.fields.find(x => x.id === sid);
    return {id:sid, name: f ? f.name : null, lost: !f, value: row && f ? row[sid] : null};
  });
  /* Подставленный соседний снимок — та же мягкая помеха, что у отчёта: выпуск
     не запрещён, но окончательным не бывает (ADR-0152 §5, ИО-8).              */
  const soft = [];
  if(src.substituted) soft.push('снимка на '+fmt(asOf)+' у статистики нет: подставлен ближайший '+
    'на '+fmt(src.substituted)+' — акт на подпись по подставленной дате не уходит');
  /* Повтор работает в режиме бланка (ADR-0305 п. 3): у «на дату» строки
     повтора — statRows объекта строки на ту же дату состояния тем же отбором
     «принадлежит объекту бланка», шапка и тело — из одного снимка; у «сейчас»
     — objectRows ядра. Отбора датой поверх живого ответа нет.               */
  const repeats = ed.layoutText ? parseLayout(ed.layoutText, ed.object, ed.mode).repeats.map(r => {
    const rs = dated ? SEAM.statRows(r.obj, asOf, {of:objId}, viewer.scope.slice())
                     : SEAM.objectRows(r.obj, {of:objId}, viewer.scope.slice());
    return {obj: r.obj, name: SEAM.fieldList(r.obj).name, fields: r.fields.slice(),
      seam: dated ? 'statRows' : 'objectRows', asOf: dated ? rs.passport.asOf : null,
      rows: rs.rows, hidden: rs.hidden};
  }) : [];
  return {row, subs, repeats, hidden: src.hidden, missing: !!src.missing, soft,
    substituted: src.substituted || null,
    passport:{asOf: dated ? src.passport.asOf : null, asked: dated ? asOf : null,
      mode:ed.mode, frozen:false, scope: viewer.scope.map(deptName),
      edition: ed.n, template: tpl.name, params: dated ? {obj:objId, asOf} : {obj:objId},
      hidden: src.hidden, seams:[dated ? 'statRows' : 'objectRows'],
      repeats: repeats.map(r => ({obj: r.name, seam: r.seam, asOf: r.asOf, rows: r.rows.length}))}};
}
/* ==/ДВИЖОК-БЛАНК== */

/* ========================= ПОКАЗ (§5, ADR-0162) =======================
   Показ — не выпуск, но и не пустое место: снимка не морозит, номера не
   тратит, следа в журнале не оставляет, — и потому несёт ШАПКУ. Скриншот
   уходит в переписку и обязан отвечать за себя сам (ИО-6, ADR-0162 §5).    */
function showHead(t, ed, params, v, chk, viewName, dropped){
  const level = levelOf(t), dev = chk ? chk.deviated : false;
  return {kind:'показ', label:'не выпуск', template: t.name, edition: ed.n, editionState: ed.state,
    level, version: level === 'общий' ? ed.n : null, changed: level === 'общий' ? (ed.changed || null) : null,
    mode: ed.mode, asOf: ed.mode === 'на дату' ? (params.asOf || null) : null,
    params: clone(params), scope: v.scope.map(deptName), who: v.who,
    view: viewName || null, dropped: (dropped || []).slice(),
    composition: chk ? shownOf(withTwist(ed, chk.twist), chk.twist.drill) : null,
    deviated: dev,
    /* Накрутка официального видна всегда: скриншот и выгрузка не выдают себя
       за форму. У личного и общего «утверждённого» состава нет — там просто
       показ поверх сохранённого.                                            */
    deviatedLabel: dev ? (level === 'официальный' ? DEVIATED : 'изменено на экране — сохранённый отчёт не тронут') : null,
    note:'снимка не морозит, документа не заводит, следа в журнале не оставляет'};
}
RP.show = (tid, params, twist) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  const ed = liveEd(t) || draftEd(t);
  if(!ed) return {ok:false, why:'нет ни утверждённой редакции, ни черновой'};
  const v = RP.viewer();
  const pr = params || {};
  if(t.kind === 'бланк'){
    if(twist && (twist.cuts || twist.stats || twist.drill != null)) return {ok:false,
      why:'бланк не крутится: он говорит об ОДНОМ объекте — ни разрезов, ни показателей у него '+
        'нет вовсе (§2.2)'};
    return {ok:true, kind:'бланк', data: composeBlank(t, ed, pr.obj, v, pr.asOf), deviated:false,
      twist:null, head: showHead(t, ed, pr, v, null, null, null)};
  }
  const chk = twistCheck(ed, twist || null);
  if(!chk.ok) return chk;
  const edEff = withTwist(ed, chk.twist);
  return {ok:true, kind:'отчёт', data: compose(t, edEff, pr, v), twist: chk.twist,
    deviated: chk.deviated, dev: chk.dev,
    head: showHead(t, ed, pr, v, chk, twist && twist.view, twist && twist.dropped)};
};
/* Показ по умолчанию — тот же вызов без накрутки. */
RP.preview = (tid, params) => RP.show(tid, params, null);

/* ======================= ВИД — ВОСЬМАЯ СУЩНОСТЬ (§2.8) ================
   Личная именованная накрутка: «как я привык смотреть этот отчёт». Не
   черновик и не редакция — живёт ПОВЕРХ чужой утверждённой редакции,
   чисел не хранит и на публикацию не идёт никогда (ADR-0162 §3).          */
/* Что доступно показу этого отчёта — всё, что доступно отчёту вообще, — и
   утверждённый состав, к которому возвращает «вернуть утверждённый».        */
RP.choices = tid => { const t = TPL(tid); if(!t) return null;
  const ed = liveEd(t) || draftEd(t); if(!ed) return null;
  const C = choicesOf(ed), b = baseOf(ed);
  return {ed: ed.n, cuts: C.cuts, stats: C.stats, drill: true,
    cutNames: C.cuts.map(cutName), statNames: C.stats.map(statName),
    base:{cuts: b.cuts.slice(), stats: b.stats.slice(), drill: b.drill, layout: b.layout, formulas: clone(b.formulas)},
    layouts: LAYOUTS.slice()}; };
RP.defaultOf = tid => { const b = RP.choices(tid); return b ? b.base : null; };
RP.layouts = () => LAYOUTS.slice();

RP.saveView = (tid, name, twist, flex) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  if(t.kind === 'бланк') return {ok:false, why:'у бланка вида не бывает: крутить нечего (§2.2)'};
  const ed = liveEd(t);
  if(!ed) return {ok:false, why:'вид живёт поверх чужого отчёта — общего или официального, а «'+t.name+
    '» пока личный: свой отчёт правят сами, вид ему не нужен'};
  const nm = String(name || '').trim();
  if(!nm) return {ok:false, why:'у вида должно быть имя: безымянный вид — это состояние экрана, '+
    'а не способ смотреть'};
  const chk = twistCheck(ed, twist || null);
  if(!chk.ok) return {ok:false, why: chk.why};
  if(RP.state.views.some(x => x.owner === RP.who() && x.tpl === tid && x.name === nm))
    return {ok:false, why:'вид «'+nm+'» у вас уже есть: имя различает ваши способы смотреть'};
  /* Режим времени и фильтр — тоже отличия вида от отчёта (волна 36): хранится
     только то, что расходится с умолчанием самого отчёта.                    */
  const badFlex = flexCheck(t, ed, flex); if(badFlex) return {ok:false, why: badFlex};
  const diff = viewDiff(baseOf(ed), chk.twist), own = ed.flex || {}, fx = flex || {};
  if(fx.time && JSON.stringify(fx.time) !== JSON.stringify(own.time || null)) diff.time = clone(fx.time);
  if(fx.filter && JSON.stringify(fx.filter) !== JSON.stringify(own.filter || null)) diff.filter = clone(fx.filter);
  const id = 'ВД-' + (++RP.state.vseq);
  RP.state.views.push({id, name: nm, tpl: tid, owner: RP.who(), at: RP.state.today, diff});
  log('сохранён вид «'+nm+'» для «'+t.name+'»');
  return {ok:true, id, note:'вид личный: передают не его, а выпуск (ADR-0162 §3)'};
};
RP.myViews = tid => RP.state.views
  .filter(x => x.owner === RP.who() && (!tid || x.tpl === tid)).map(clone);
RP.deleteView = id => { const i = RP.state.views.findIndex(x => x.id === id);
  if(i === -1) return {ok:false, why:'вида нет'};
  if(RP.state.views[i].owner !== RP.who()) return {ok:false, why:'вид чужой: он личный'};
  const nm = RP.state.views[i].name; RP.state.views.splice(i, 1);
  log('вид «'+nm+'» удалён');
  return {ok:true, note:'вид удалён; ни один выпуск от этого не изменился — паспорт хранит '+
    'показанный состав целиком, а не ссылку на вид (ИО-22)'}; };
RP.shareView = (id, who) => { const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  return {ok:false, why:'вид «'+vw.name+'» не передаётся '+(who ? '('+who+') ' : '')+
    '— он личный. Чтобы поделиться, из вида делают свой отчёт, и он проходит путь личный → общий; '+
    'а передают ВЫПУСК: у него есть паспорт, дата состояния и показанный состав'}; };
RP.publishView = id => { const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  return {ok:false, why:'вид «'+vw.name+'» на утверждение не идёт: он живёт поверх чужого '+
    'отчёта, а не вместо него. Нужен общий состав — из вида делают свой отчёт и открывают его '+
    'кругу; официальным он становится утверждением'}; };

/* Вид хранит ТОЛЬКО ОТЛИЧИЯ от утверждённого состава (ИО-43, ADR-0280):
   добавленные и снятые разрезы и показатели, своё углубление и раскладку.
   Состав вида собирается при каждом показе из ТЕКУЩЕЙ редакции и отличий,
   поэтому правка владельца доходит до всех видов сама, а не теряется в копии.
   Перестановка уровней — тоже отличие: тогда хранится порядок целиком.      */
function viewDiff(base, tw){
  const d = {addCuts: tw.cuts.filter(c => base.cuts.indexOf(c) === -1),
    dropCuts: base.cuts.filter(c => tw.cuts.indexOf(c) === -1),
    addStats: tw.stats.filter(x => base.stats.indexOf(x) === -1),
    dropStats: base.stats.filter(x => tw.stats.indexOf(x) === -1)};
  const rebuilt = base.cuts.filter(c => d.dropCuts.indexOf(c) === -1).concat(d.addCuts);
  if(!sameOrder(rebuilt, tw.cuts)) d.cutOrder = tw.cuts.slice();
  if(tw.drill !== base.drill) d.drill = tw.drill;
  if(tw.layout && tw.layout !== base.layout) d.layout = tw.layout;
  const bf = base.formulas || [], tf = tw.formulas || [];
  d.addFormulas = clone(tf.filter(f => !bf.some(x => x.id === f.id)));
  d.dropFormulas = bf.filter(f => !tf.some(x => x.id === f.id)).map(f => f.id);
  return d;
}
function viewTwist(base, d){
  const cuts = d.cutOrder ? d.cutOrder.slice()
    : base.cuts.filter(c => d.dropCuts.indexOf(c) === -1).concat(d.addCuts.filter(c => base.cuts.indexOf(c) === -1));
  const stats = base.stats.filter(x => d.dropStats.indexOf(x) === -1)
    .concat(d.addStats.filter(x => base.stats.indexOf(x) === -1));
  const formulas = (base.formulas || []).filter(f => (d.dropFormulas || []).indexOf(f.id) === -1)
    .concat(clone(d.addFormulas || []));
  return {cuts, stats, drill: d.drill != null ? d.drill : base.drill, layout: d.layout || base.layout, formulas};
}
RP.viewDiff = id => { const vw = RP.state.views.find(x => x.id === id); return vw ? clone(vw.diff) : null; };
/* Вид связан с оригиналом и сверяется при каждом показе: правки владельца
   доходят до вида сами, а ставшее невозможным — разрез, которым больше не
   разрезают, выведенный показатель — отваливается С ПОМЕТКОЙ, остальное
   работает. Ни молчаливой подмены, ни блокировки всего вида.               */
RP.applyView = id => {
  const vw = RP.state.views.find(x => x.id === id);
  if(!vw) return {ok:false, why:'вида нет'};
  if(vw.owner !== RP.who()) return {ok:false, why:'вид «'+vw.name+'» принадлежит '+vw.owner+
    ': вид личный, чужим способом смотреть не пользуются'};
  const t = TPL(vw.tpl); if(!t) return {ok:false, why:'отчёта нет'};
  const ed = liveEd(t);
  if(!ed) return {ok:false, why:'у отчёта «'+t.name+'» нет действующей редакции'};
  const dropped = [];
  const want = viewTwist(baseOf(ed), vw.diff);
  const okCut = c => !!CUT_NAMES[c];
  want.cuts.filter(c => !okCut(c)).forEach(c => dropped.push('разрез «'+cutName(c)+
    '» больше недоступен в отчёте — убран из вашего вида'));
  const okStat = s => { const m = SEAM.statMeta(s);
    return !!m && !m.withdrawn && (ed.mode !== 'сейчас' || m.live); };
  want.stats.filter(s => !okStat(s)).forEach(s => { const m = SEAM.statMeta(s);
    dropped.push('показатель «'+(m ? m.name : s)+'» больше недоступен в отчёте — убран из вашего вида'+
      (m && m.withdrawn ? ' (выведен из реестра '+fmt(m.withdrawn)+')' : '')); });
  const cuts = want.cuts.filter(okCut), stats = want.stats.filter(okStat);
  const formulas = want.formulas.filter(f => { const bad = formulaCheck(f, ed.mode);
    if(bad) dropped.push('своя формула «'+f.name+'» больше не считается ('+bad+') — убрана из вашего вида');
    return !bad; });
  let chk = twistCheck(ed, {cuts, stats, drill: want.drill, layout: want.layout, formulas});
  if(!chk.ok){ dropped.push('остаток вида не годится ('+chk.why+') — показан утверждённый состав');
    chk = twistCheck(ed, null); }
  const flex = RP.flexOf(vw.tpl, vw.id);
  if(flex.dropped) dropped.push(flex.dropped);
  return {ok:true, view: clone(vw), ed: ed.n, dropped, deviated: chk.deviated, flex,
    twist: Object.assign({}, chk.twist, {view: vw.name, dropped}),
    note: dropped.length
      ? 'вид «'+vw.name+'» сверен с отчётом: отвалилось пунктов — '+dropped.length+
        ', остальное работает'
      : 'вид «'+vw.name+'» сверен с отчётом целиком'};
};
RP.showView = (id, params) => { const a = RP.applyView(id); if(!a.ok) return a;
  const r = RP.show(a.view.tpl, params, a.twist);
  if(!r.ok) return r;
  return Object.assign({}, r, {view: a.view, dropped: a.dropped, note: a.note}); };

/* ======================= ВЫПУСК — ЗАКАЗ, А НЕ НАЖАТИЕ ==================
   Легаси считает синхронно: 90–107 с на портфеле в 51 268 субъектов, окно
   висит, отмены нет (ОЧ-30). Здесь заказ и счёт разведены. Дешёвые проверки —
   при ЗАКАЗЕ; счёт, снимок, номер и получатель — в шаге «считается». Строка
   журнала и паспорт заводятся в момент заказа: кто, чем, на какую дату и каким
   охватом — известно сразу, неизвестны только числа (§5).                   */
const JOB_STATES = ['заказан','считается','готов','ошибка'];
RP.jobStates = () => JOB_STATES.slice();

function orderPassport(t, ed, params, v, edEff){
  const sheet = sheetOfEd(ed);
  const e = edEff || ed;
  return {asOf: ed.mode === 'на дату' ? params.asOf : null, mode: ed.mode, frozen:false,
    scope: v.scope.map(deptName), edition: ed.n, template: t.name, params: clone(params),
    hidden: 0, ordered: true,
    sheet:{orient: sheet.orient, bands: sheet.bands.slice(), formats: sheet.formats.slice()},
    levels: (e.cuts || []).map(by => cutName(by) +
      ((e.levelTotals || []).indexOf(by) !== -1 ? ' (с итогом)' : '')),
    /* Показанный состав известен уже при заказе: числа неизвестны, а чем
       спрошено — известно (ИО-22).                                          */
    shown: t.kind === 'бланк' ? null : shownOf(e, e.drill !== false),
    rounding: [], seams: []};
}

/* ============ ПРАВО ОКОНЧАТЕЛЬНОГО ВЫПУСКА (§13.6, ИО-25) =============
   Выводится, а не объявляется: окончательно выпускает ТОТ, ЗА КЕМ
   ОБЯЗАТЕЛЬСТВО; где обязательства нет — всякий в круге. «За кем» бывает
   подразделением, а не человеком, — иначе сдача встанет на отпуске.
   Отдельного права на роли не заводится: это был бы второй источник ответа
   на вопрос «кто сдаёт», и он разошёлся бы с обязательствами (ОЧ-45).
   Крутилка при этом не спрашивается вовсе: она ничего не тратит
   (ADR-0162 §9), а окончательный выпуск закрывает срок.                    */
RP.finalRight = (tid, coverage) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  const v = RP.viewer();
  const cov = (coverage && coverage.length ? coverage
    : v.scope.filter(dp => t.circle.indexOf(dp) !== -1));
  if(!t.schedule) return {ok:true, who:null, free:true,
    note:'обязательства нет — окончательно выпускает всякий в круге'};
  /* Свод по ВСЕМУ кругу — обязательство не подразделения, а того, кто ведёт
     шаблон и сдаёт получателю: он и есть «тот, за кем». Выпуск по одному
     подразделению — обязательство этого подразделения.                      */
  const whole = t.circle.every(dp => cov.indexOf(dp) !== -1);
  if(whole && t.owner === RP.who()) return {ok:true, free:false, whole:true, who:[t.owner],
    note:'свод по всему кругу сдаёт тот, кто ведёт отчёт, — обязательство перед получателем его'};
  const mine = dep => dep === v.dept || RESPONSIBLE[dep] === RP.who();
  const alien = cov.filter(dep => !mine(dep));
  if(!alien.length) return {ok:true, free:false,
    who: cov.map(dep => (RESPONSIBLE[dep] || '—')+' ('+deptName(dep)+')'),
    note:'обязательство за вами: '+cov.map(deptName).join('; ')};
  return {ok:false, free:false,
    who: alien.map(dep => (RESPONSIBLE[dep] || '—')+' ('+deptName(dep)+')'),
    why:'окончательно выпускает тот, за кем обязательство: по охвату «'+
      alien.map(deptName).join('; ')+'» отвечает '+
      alien.map(dep => (RESPONSIBLE[dep] || '—')).join('; ')+', а не '+RP.who()+
      '. Посмотреть, накрутить и выгрузить вы вправе — смотреть волен всякий в круге, '+
      'показ ничего не тратит; окончательный выпуск закрывает срок, и спрашивать за него надо '+
      'с того, с кого и так спросят'};
};
RP.whoSubmits = tid => { const t = TPL(tid);
  if(!t || !t.schedule) return null;
  return t.circle.map(dep => ({dept:dep, deptName: deptName(dep), who: RESPONSIBLE[dep] || '—'}));
};

RP.order = (tid, spec) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта или бланка нет'};
  const v = RP.viewer();
  const ed = liveEd(t);
  if(!ed) return {ok:false, why:'выпускать можно только утверждённую редакцию: «'+t.name+
    '» — личный черновик (ИО-1)'};
  /* Общий отчёт выгружается, но не сдаётся: сдача — дело официального отчёта
     утверждённым составом, у общего нет ни редакции, ни обязательства.      */
  if(levelOf(t) === 'общий' && spec.kind === 'окончательный') return {ok:false,
    why:'«'+t.name+'» — общий отчёт, не официальный: его выгружают, а сдают только официальный '+
      'отчёт утверждённым составом'};
  if(levelOf(t) === 'общий' ? !RP.maySee(tid) : t.circle.indexOf(v.dept) === -1) return {ok:false, why:'«'+t.name+'» не в круге '+
    'подразделения «'+deptName(v.dept)+'»: круг ведёт уполномоченный (§13.1)'};
  const br = brokenBy(t, ed);
  if(br) return {ok:false, why:'«'+t.name+'» неисполним: '+br};
  if(spec.recipient && t.kind !== 'бланк'){ const rr = reportRecipient(spec.recipient);
    if(!rr.ok) return rr; }
  else if(typeof spec.recipient === 'string' && spec.recipient && !ADDR(spec.recipient))
    return {ok:false, why:'получатель — ссылка на справочник адресатов, а не строка: '+
      '«'+spec.recipient+'» и «Минфин КР» станут в журнале двумя разными адресатами (ИО-5)'};
  const at = spec.at || RP.state.today;
  const params = clone(spec.params || {});
  const asked = spec.kind === 'окончательный' ? 'окончательный' : 'предварительный';

  /* Накрученный показ выпускается — но НИКОГДА окончательным: обязательство
     берётся на объявленной форме, а не на той, что человек сложил себе под
     задачу. Получатель сравнивает присланное с прошлым разом, а не с
     паспортом (ИО-21, ADR-0162 §6). Раскладка в выпуск не уходит вовсе:
     лист принадлежит редакции (ИО-18).                                      */
  let twist = null, edEff = ed;
  if(t.kind === 'отчёт'){
    const chk = twistCheck(ed, spec.twist || null);
    if(!chk.ok) return chk;
    if(chk.deviated && asked === 'окончательный') return {ok:false, why:'показ '+DEVIATED+
      ': сдаётся только утверждённый состав — получатель сравнивает присланное с прошлым разом, '+
      'а не с паспортом. Нажмите «вернуть утверждённый» и сдайте его; накрученное можно выгрузить'};
    twist = Object.assign({}, chk.twist, {layout: baseOf(ed).layout});
    edEff = withTwist(ed, twist);
  }

  /* Бланк проверяется целиком при заказе: он об ОДНОМ объекте, счёт дешёвый. */
  if(t.kind === 'бланк'){
    const o = OBJ(params.obj);
    if(!o) return {ok:false, why:'объект для бланка не назван'};
    if(ed.mode === 'на дату' && !params.asOf) return {ok:false, why:'бланк «'+t.name+'» говорит '+
      'о состоянии НА ДАТУ: без даты состояния печатать нечего — она вопрос, а не отбор ('+
      (t.schedule ? t.schedule.asOfRule : 'дата состояния')+')'};
    const data = composeBlank(t, ed, params.obj, v, params.asOf);
    if(data.missing) return {ok:false, why:'снимка статистики на '+fmt(params.asOf)+
      ' нет вовсе: спросить нечего (ИО-6)'};
    if(!data.row && ed.mode === 'на дату' && v.scope.indexOf(o.dept) !== -1)
      return {ok:false, why:'на '+fmt(params.asOf)+' объекта «'+o.no+'» в снимке нет: он заведён '+
        'позже даты состояния, и говорить о нём на эту дату не о чем (ИО-27)'};
    if(!data.row) return {ok:false, why:'объект «'+o.no+'» вне области видимости роли «'+
      RP.state.role+'»: бланк печатает тот, у кого бланк в круге И объект видим — два замка (§13.3)'};
    const lost = data.subs.filter(s => s.lost);
    if(lost.length) return {ok:false, why:'в макете ${'+lost[0].id+'} — объект «'+
      SEAM.fieldList(ed.object).name+'» такого поля не объявляет'};
    if(ed.pdfForm){ const pf = pdfFillEd(ed, params.obj);
      if(!pf.ok) return {ok:false, why:'PDF-форма «'+t.name+'»: '+pf.why}; }
  }
  /* Охват бланка — подразделение ЕГО объекта, а не весь круг смотрящего: бумага
     об одном кредите закрывает долг одного подразделения, и приписывать ей
     остальные значило бы закрыть чужой срок чужой бумагой (волна 9).          */
  const coverage = t.kind === 'бланк' ? [OBJ(params.obj).dept]
    : (params.dept ? [params.dept] : v.scope.filter(dp => t.circle.indexOf(dp) !== -1));

  /* Что можно отклонить, не считая, — отклоняется при заказе: незачем занимать
     очередь заданием, которое всё равно кончится отказом.                    */
  if(asked === 'окончательный'){
    const right = RP.finalRight(tid, coverage);
    if(!right.ok) return right;
    if(t.kind === 'бланк'){
      if(spec.recipient) return {ok:false, why:'у бланка получатель не выбирается из справочника '+
        'адресатов сдачи: его объявляет редакция видом — лицо в роли, подразделение, подразделение '+
        'своего объекта или должность, — а значение берётся у соседа (ИО-5, ADR-0168 §1)'};
      /* Получателя объявила РЕДАКЦИЯ, и невозможность его назвать — отказ с
         именем, а не молчаливая подстановка заёмщика (ADR-0167 §2, ADR-0168 §2). */
      const who = resolveAddressee(ed.addressee, params.obj);
      if(!who.ok) return {ok:false, why:'бланк «'+t.name+'» '+who.why};
    } else if(!spec.recipient) return {ok:false, why:'окончательный выпуск бывает только с названным '+
      'получателем: числа морозит получатель, а не кнопка (ИО-4, ADR-0157 §2)'};
    if(t.kind === 'отчёт' && (ed.timeCols || []).length){
      if(!params.asOf) return {ok:false, why:'колонки-даты формы считаются от отчётной даты: она не названа'};
      const openWhy = timeColsOpenWhy(timeTable(ed, params.asOf, {dept: params.dept || null}, v.scope.slice()));
      if(openWhy) return {ok:false, why: openWhy};
    }
    if(spec.format && spec.format !== 'pdf') return {ok:false, why:'наружу с получателем уходит '+
      'только pdf: снимок в редактируемом формате — не снимок ('+spec.format+' отклонён, ИО-10)'};
    /* Номер у бумаги не вводится и не выдаётся здесь: его выдаёт журнал
       документооборота при регистрации после подписи.                       */
    if(spec.number && !t.numberIsObject) return {ok:false, why:'номер «'+spec.number+'» здесь не '+
      'вводится: окончательный выпуск становится черновиком документа, номер выдаст журнал '+
      'документооборота при регистрации после подписи'};
  }

  const id = 'ВП-' + (++RP.state.seq);
  const rec = {
    id, tpl: t.id, tplName: t.name, kindTpl: t.kind, ed: ed.n,
    kind:'заказан', asked, state:'заказан', at, by: RP.who(),
    recipient: null, params, coverage, passport: orderPassport(t, ed, params, v, edEff),
    twist: twist && twistCheck(ed, twist).deviated ? twist : null,
    deviated: !!(twist && twistCheck(ed, twist).deviated), number: null,
    period: t.kind === 'отчёт' ? periodOfAsOf(params.asOf) : null,
    obj: t.kind === 'бланк' ? params.obj : null,
    formats: null, snapshot: null,
    ask:{recipient: spec.recipient || null, format: spec.format || null}, doc: null,
    fileAlive: true, fileUntil: null, fileDeadAt: null,
    diverged: false, divergedAt: null, correctionOf: null, correctedBy: null,
    note: null, error: null
  };
  RP.state.issues.push(rec);
  log('заказан выпуск '+id+' по «'+t.name+'», ступень при заказе — '+asked);
  return {ok:true, id, state:'заказан', done:false,
    note:'заказ принят: строка журнала и паспорт есть, чисел ещё нет'};
};

/* Шаг задания. Отдельным вызовом, а не таймером: макет показывает состояния,
   а не изображает медленность.                                              */
RP.step = id => {
  const rec = ISS(id); if(!rec) return {ok:false, why:'выпуска нет'};
  const t = TPL(rec.tpl), ed = t.editions.find(e => e.n === rec.ed);
  if(rec.state === 'готов')  return doneResult(rec);
  if(rec.state === 'ошибка') return {ok:false, id, state:'ошибка', done:true, why: rec.error};
  if(rec.state === 'заказан'){
    rec.state = 'считается';
    return {ok:true, id, state:'считается', done:false, note:'задание считает — окно свободно'};
  }

  let data, soft = [];
  if(rec.kindTpl === 'бланк'){
    data = composeBlank(t, ed, rec.params.obj, RP.viewer(), rec.params.asOf);
    soft = data.soft.slice();
  } else {
    data = compose(t, rec.twist ? withTwist(ed, rec.twist) : ed, rec.params, RP.viewer());
    soft = data.soft.slice();
    if(data.missing){
      rec.state = 'ошибка';
      rec.error = data.never ? 'итога на '+fmt(rec.params.asOf)+' нет и не будет — в легаси не собиралось: '+
        'спросить нечего (ИО-6)' : 'снимка статистики на '+fmt(rec.params.asOf)+' нет вовсе: спросить нечего (ИО-6)';
      log('выпуск '+id+' кончился ошибкой: снимка на '+fmt(rec.params.asOf)+' нет');
      return {ok:false, id, state:'ошибка', done:true, why: rec.error};
    }
  }

  /* Ступень. Непроверяемое заранее не запрещает выпуск — оно делает его
     предварительным (ИО-8). На шаблоне с обязательным полным охватом это
     ещё и запрещает называть получателя (§13.4).                          */
  let kind = rec.asked, note = null, recipient = null;
  if(kind === 'окончательный'){
    if(soft.length){
      kind = 'предварительный';
      note = t.fullCoverage
        ? 'отчёт требует полного охвата: '+soft[0]+'; назвать получателя нельзя, выпуск '+
          'остался предварительным (§13.4)'
        : 'выпуск сделан предварительным: '+soft[0]+' (ИО-8)';
    } else if(t.kind === 'бланк'){
      /* Получатель бланка — всегда ССЫЛКА: на лицо, на подразделение или на
         должность. Вид назвала редакция, значение взято у соседа, объект
         остаётся ПУТЁМ (ADR-0167 §1–§2, ADR-0168 §2, ИО-28, ИО-29).          */
      recipient = resolveAddressee(ed.addressee, rec.params.obj).rec;
    } else {
      /* Получатель сдачи — та же пара «вид + значение»: адресат сдачи наружу,
         подразделение или должность — внутрь (ADR-0305 п. 2).                 */
      recipient = reportRecipient(rec.ask.recipient).rec;
    }
  }

  /* Номер выдаёт документооборот, а не бланк. Окончательный выпуск с внешним
     получателем становится ЧЕРНОВИКОМ ИСХОДЯЩЕГО: pdf-снимок — вложение с
     ролью «проект», объект — привязка, получатель — адресат, тип задан
     бланком; служебная записка — черновиком внутреннего документа. Номер
     выдаёт журнал при регистрации после подписи; выпуск ссылается на
     документ, документ — на выпуск. У договора номер — реквизит его объекта:
     он в тексте до подписи, и в журналы документооборота договор не идёт.  */
  let number = null, doc = null;
  if(kind === 'окончательный'){
    if(t.numberIsObject) number = OBJ(rec.params.obj) ? OBJ(rec.params.obj).no : null;
    else if(!t.workPaper) doc = draftDoc(rec, t, recipient);
  }
  const passport = clone(data.passport);
  passport.frozen = kind === 'окончательный';
  passport.deviated = !!rec.deviated;
  /* Файл сам говорит, что он такое: выгрузка — «не официальный документ», у
     накрутки официального — ещё и «изменено — не утверждённый состав».      */
  passport.label = kind === 'окончательный' ? null : 'НЕ ОФИЦИАЛЬНЫЙ ДОКУМЕНТ'+
    (rec.deviated && levelOf(t) === 'официальный' ? ' · '+DEVIATED : '');
  passport.issuedAt = rec.at; passport.by = rec.by; passport.ordered = false;
  rec.kind = kind; rec.state = 'готов'; rec.note = note; rec.recipient = recipient;
  rec.number = number; rec.doc = doc ? doc.id : null; rec.passport = passport;
  /* PDF-форма: лист продолжения — тот же выпуск и тот же снимок (ADR-0297 п. 8). */
  if(ed.pdfForm){ const pf = pdfFillEd(ed, rec.params.obj);
    rec.pdf = pf.ok ? {file: pf.file, pages: pf.pages, continuation: pf.continuation, baked: true} : null; }
  rec.formats = kind === 'окончательный' ? ['pdf']
    : (rec.kindTpl === 'бланк' ? ['docx','pdf'] : sheetOfEd(ed).formats.slice());
  /* В снимок ложится ПОКАЗАННАЯ величина: сдано то, что напечатано, иначе
     расхождение срабатывает на копейках ниже объявленной разрядности (ОЧ-32). */
  rec.snapshot = kind === 'окончательный'
    ? (rec.kindTpl === 'бланк'
        ? {at: rec.at, subs: clone(data.subs),
            repeats: (data.repeats || []).map(r => ({obj: r.obj, seam: r.seam, asOf: r.asOf, rows: clone(r.rows)}))}
        : {at: rec.at, rows: clone(data.rows), totals: data.totals.map(x =>
            ({id:x.id, name:x.name, unit:x.unit, dp:x.dp,
              value: x.shown != null ? x.shown : x.value})),
           timeTable: data.timeTable ? {anchor: data.timeTable.anchor, cols: clone(data.timeTable.cols),
             rows: clone(data.timeTable.rows)} : null})
    : null;
  rec.fileUntil = kind === 'окончательный' ? null : addDays(rec.at, FILE_DAYS);
  log((kind === 'окончательный' ? 'окончательный выпуск ' : 'предварительный выпуск ')+id+
    ' готов по «'+t.name+'»'+(recipient ? ', получатель '+recipient.name : ''));
  return doneResult(rec);
};
/* Документооборот — зеркало соседа на ширину шва: черновик документа по
   выпуску и регистрация с номером после подписи.                           */
const DOC = id => RP.state.docs.find(d => d.id === id);
RP.DOC = id => { const d = DOC(id); return d ? clone(d) : null; };
function draftDoc(rec, t, recipient){
  /* Каким документом стать — решает ВИД получателя, а не признак адресата:
     лицо в роли и адресат сдачи — наружу; подразделение, подразделение своего
     объекта и должность — внутрь (ADR-0305 п. 2).                           */
  const internal = !!(recipient && recipient.kind !== 'роль' && recipient.kind !== 'адресат сдачи');
  const d = {id:'ДО-'+String(++RP.state.dseq).padStart(3,'0'),
    kind: internal ? 'черновик внутреннего документа' : 'черновик исходящего',
    type: t.docType || (t.kind === 'отчёт' ? 'Отчёт' : 'Письмо'), to: recipient ? recipient.name : null,
    issue: rec.id, obj: rec.obj, attach:'pdf-снимок · роль «проект»', state:'черновик', number:null, at: rec.at};
  RP.state.docs.push(d);
  return d;
}
/* Демонстрация соседа: документооборот регистрирует подписанный документ и
   ставит номер штампом на подписанный экземпляр; снимок номера не несёт.   */
RP.registerDoc = id => { const d = DOC(id); if(!d) return {ok:false, why:'документа нет'};
  if(d.state !== 'черновик') return {ok:false, why:'документ уже зарегистрирован: '+d.number};
  const internal = d.kind === 'черновик внутреннего документа';
  d.state = 'зарегистрирован'; d.kind = internal ? 'внутренний документ' : 'исходящий';
  d.number = (internal ? 'ВН-' : 'Исх-')+String(411 + (++RP.state.nseq));
  d.registered = RP.state.today;
  return {ok:true, number: d.number, note:'документооборот зарегистрировал '+d.id+' под номером '+d.number+
    ' — номер стоит на подписанном экземпляре, выпуск '+d.issue+' ссылается на документ'}; };
function doneResult(rec){
  return {ok:true, id: rec.id, kind: rec.kind, state:'готов', done:true,
    note: rec.note || (rec.kind === 'окончательный'
      ? 'числа и файл заморожены снимком'+(rec.number ? '; номер договора — реквизит кредита: '+rec.number
        : (rec.doc ? '; '+DOC(rec.doc).kind+' '+rec.doc+' — номер выдаст журнал документооборота после подписи' : ''))
      : 'обязательства не закрывает, снимка не даёт, документа не заводит'),
    rec: clone(rec)};
}
/* Синхронная обёртка: заказ + шаги до конца. Экран так не делает — так делает
   тот, кому нужен ответ здесь и сейчас (перепечатка, демонстрация, смоук).  */
RP.issue = (tid, spec) => {
  const o = RP.order(tid, spec);
  if(!o.ok) return o;
  let r = o;
  for(let i = 0; i < 8 && !r.done; i++) r = RP.step(o.id);
  return r;
};
/* ПАЧКА — способ заказа, а не сущность (ИО-38, ADR-0225, ADR-0268 п. 6).
   Разворачивается в N обычных выпусков: у каждого свой получатель, снимок,
   строка журнала и — у окончательного с получателем — свой черновик
   документооборота. Отбор — рабочим списком или перечнем объектов. Отказ
   называется поимённо, годные выходят; невидимые заказчику объекты
   называются числом — прав пачка не добавляет. Своей записи у пачки нет:
   «вот та рассылка» — отбор журнала по бланку, дню и заказавшему.          */
RP.batch = (tid, spec) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'бланка нет'};
  if(t.kind !== 'бланк') return {ok:false, why:'пачкой заказываются бланки — по бумаге на объект; '+
    'у отчёта охват — параметр вопроса, а не перечень объектов'};
  spec = spec || {};
  const w = spec.worklist ? WL(spec.worklist) : null;
  if(spec.worklist && !w) return {ok:false, why:'рабочего списка «'+spec.worklist+'» нет'};
  const objs = w ? w.objects.slice() : (spec.objs || []).slice();
  if(!objs.length) return {ok:false, why:'отбор пачки — рабочим списком или перечнем объектов: '+
    '«пятьсот заёмщиков» не название'};
  const v = RP.viewer(), at = spec.at || RP.state.today, by = RP.who();
  const seen = objs.filter(id => OBJ(id) && v.scope.indexOf(OBJ(id).dept) !== -1);
  const issued = [], refused = [];
  seen.forEach(id => {
    const params = {obj: id}; if(spec.asOf) params.asOf = spec.asOf;
    const r = RP.issue(tid, {params, kind: spec.kind || 'предварительный', at});
    if(r.ok) issued.push(r.id); else refused.push({obj: id, no: OBJ(id).no, why: r.why}); });
  const docs = issued.map(id => ISS(id).doc).filter(Boolean);
  log('пачка по бланку «'+t.name+'»'+(w ? ' по списку «'+w.name+'»' : '')+': выпусков '+issued.length+
    ', отказов '+refused.length+(objs.length - seen.length ? ', вне видимости '+(objs.length - seen.length) : ''));
  return {ok: issued.length > 0, issued, refused, hidden: objs.length - seen.length, docs,
    trail:{tpl: tid, at, by},
    why: issued.length ? null : 'ни одна бумага пачки не вышла: '+(refused[0] ? refused[0].no+' — '+refused[0].why
      : 'все объекты вне области видимости'),
    note:'пачка — '+issued.length+' обычных выпусков'+(docs.length ? ', черновиков документооборота '+docs.length : '')+
      (refused.length ? '; не вышли поимённо: '+refused.map(x => x.no).join(', ') : '')+
      (objs.length - seen.length ? '; вне области видимости — '+objWord(objs.length - seen.length) : '')+
      '; след пачки — отбор журнала по бланку, дню и заказавшему'};
};
/* След пачки — отбор журнала, а не запись: пачки как сущности нет (ИО-38). */
RP.journalPick = f => RP.state.issues.filter(i => (!f.tpl || i.tpl === f.tpl) &&
  (!f.at || i.at === f.at) && (!f.by || i.by === f.by)).map(i => i.id);
RP.reprint = tid => RP.issue(tid, {params: clone(RP.state.sel.params), kind:'предварительный'});

/* Факт выпуска вечен; расходник — только файл предварительного (ИО-11).    */
RP.deleteIssue = id => {
  const i = ISS(id); if(!i) return {ok:false, why:'выпуска нет'};
  return {ok:false, why:'выпуск '+id+' не удаляется: журнал заведён ради вопроса «что мы отдали '+
    'наружу» — стёртая строка отвечает на него неправдой (ИО-11). Гаснет только файл '+
    'предварительного выпуска, по сроку'};
};
RP.gcFiles = () => {
  let n = 0;
  RP.state.issues.forEach(i => { if(i.kind === 'предварительный' && i.fileAlive &&
    i.fileUntil && i.fileUntil.localeCompare(RP.state.today) === -1){
      i.fileAlive = false; i.fileDeadAt = i.fileUntil; n++; } });
  return {ok:true, n, note:'файлов погашено: '+n+'; строки журнала на месте'};
};

/* ================== РАСХОЖДЕНИЕ СО СДАННЫМ (§6) =======================
   Метка не отзывает выпуск: сданное остаётся сданным, но перестаёт молча
   считаться верным.                                                        */
RP.recompute = id => {
  const i = ISS(id); if(!i || !i.snapshot || !i.snapshot.totals) return null;
  const t = TPL(i.tpl), ed = t.editions.find(e => e.n === i.ed);
  const now = compose(t, ed, i.params, {scope: i.coverage.slice()});
  const diffs = i.snapshot.totals.map(s => {
    const n = now.totals.find(x => x.id === s.id);
    /* Сравнивается ПОКАЗАННОЕ с ПОКАЗАННЫМ — в той же разрядности, в какой
       сдавали, иначе метка загорится на шуме ниже неё (ОЧ-32).              */
    const nv = n ? (n.shown != null ? n.shown : n.value) : null;
    return {name: s.name, unit: s.unit, was: s.value, now: nv};
  }).filter(d => d.was !== d.now);
  /* Колонки-даты формы морозятся тем же снимком: их клетки сверяются так же —
     правка месяца из легаси задевает выпуск через колонку, а не через период
     выпуска (ADR-0307 п. 6).                                                  */
  const st = i.snapshot.timeTable, nt = now.timeTable;
  if(st && nt) st.rows.forEach(r => { const nr = nt.rows.find(x => x.id === r.id);
    r.cells.forEach(c => { const nc = nr && nr.cells.find(x => x.col === c.col), nv = nc ? nc.value : null;
      if(c.value !== nv) diffs.push({name: r.name+' × «'+st.cols.find(x => x.id === c.col).name+'»', unit: r.unit,
        was: c.value, now: nv}); }); });
  return {diffs, changed: diffs.length > 0};
};
/* Период из легаси не переоткрывается (ADR-0207 п. 4, ADR-0307 п. 6):
   переспрашивать некого, а переоткрытый месяц закрыть заново нечем. Правка —
   новой версией миграции с журналом перезаписи; действия «открыть» нет.     */
const LEGACY_NO_REOPEN = 'закрыт переносом из легаси: переспрашивать некого — действия «открыть» у него нет; '+
  'правка — только новой версией миграции с журналом перезаписи (ADR-0207 п. 4, ADR-0307 п. 6)';
RP.periodActions = period => { const p = RP.state.periods[period];
  if(!p) return {period, state:'не закрыт', origin:null, actions:[]};
  if(p.origin === 'легаси') return {period, state:p.state, origin:'легаси', release:p.release, by:p.by, actions:[], why: LEGACY_NO_REOPEN};
  return {period, state:p.state, origin:'система', actions: p.state === 'закрыт' && asOfOfPeriod(period) ? ['открыть заново'] : []};
};
/* Почему выпуск помечен: причины копятся — второй повод не стирает первый. */
const divergedWhy = (i, cause) => (i.divergedWhy ? i.divergedWhy+'; затем '+cause : 'числа изменились после сдачи: '+cause);
RP.reopenPeriod = (period, why) => {
  const lp = RP.state.periods[period];
  if(lp && lp.origin === 'легаси') return {ok:false, why:'период «'+period+'» '+LEGACY_NO_REOPEN};
  const asOf = asOfOfPeriod(period);
  if(!asOf) return {ok:false, why:'период «'+period+'» снимком не закрыт: открывать нечего'};
  if(RP.viewer().id !== 'buh' && !RP.isAuth()) return {ok:false,
    why:'закрытый период открывает главный бухгалтер: правка чисел задним числом — его решение (ADR-0089)'};
  RP.state.periods[period] = {state:'открыт заново', why, at: RP.state.today};
  /* Правка приходит из ядра и меняет снимок статистики — расхождение
     ЗАРАБОТАНО пересчётом, а не проставлено флагом.                        */
  HIST[asOf]['kr-8'].debt_main = 9950000;
  HIST[asOf]['kr-8'].days = 22;
  HIST[asOf]['kr-8'].status = 'просрочен';
  let marked = 0;
  RP.state.issues.forEach(i => {
    if(!i.snapshot || i.period !== period) return;
    const r = RP.recompute(i.id);
    if(r && r.changed){ i.diverged = true; i.divergedAt = RP.state.today;
      i.divergedWhy = divergedWhy(i, 'период «'+period+'» открыт заново'); marked++; }
  });
  log('период «'+period+'» открыт заново: '+why);
  return {ok:true, marked, note:'выпусков со снимком помечено: '+marked+
    '; предварительные выпуски метки не получают — метить нечего (§6)'};
};
/* Исправление периода из легаси — новой версией миграции, а не открытием
   (ADR-0307 п. 6, ADR-0245 §9). Действие принадлежит миграции: отчётность
   календаря не пишет, а читает его и журнал перезаписи; здесь — зеркало соседа
   на ширину вопроса. Версия утверждается человеком (ИС-9), каждая заменённая
   величина ложится строкой журнала перезаписи «было → стало». Период остаётся
   закрытым из легаси, действия «открыть» у него не появляется. Выпуски на
   прежних числах метятся «числа изменились после сдачи», как при перезакрытии
   (ИО-34), и сами не переиздаются.                                          */
const REWRITE_FIELD = {debt_main:'остаток основного долга', days:'дней просрочки', status:'состояние', amount:'сумма'};
const migVersion = () => MIGRATION.id.replace(/\d+$/, '')+(RP.state.migrations.length + 1);
RP.migrationRevision = spec => {
  const s = spec || {}, period = s.period, p = RP.state.periods[period];
  if(!p) return {ok:false, why:'месяц «'+period+'» перенос не дал: закрытым он не объявлен, правка миграции его не '+
    'закроет — по колонке, которая его касается, только предварительный выпуск'};
  if(p.origin !== 'легаси') return {ok:false, why:'период «'+period+'» закрыт прогоном системы: правка — открытием '+
    'периода главным бухгалтером, а не версией миграции'};
  if(RP.viewer().id !== 'buh') return {ok:false, why:'версию миграции утверждает человек, отвечающий за перенос, — '+
    'как М-1 утвердил '+MIGRATION.by+'; роль «'+RP.state.role+'» её не утверждает'};
  if(!String(s.why || '').trim()) return {ok:false, why:'правка без основания не записывается: журнал перезаписи '+
    'хранит, кто, когда и почему заменил перенесённое'};
  const lm = legacyMonth(period), end = firstOfNext(monthIso(period));
  const tot = s.totals || {}, evs = s.events || {};
  if(!Object.keys(tot).length && !Object.keys(evs).length) return {ok:false, why:'менять нечего: версия миграции '+
    'называет заменяемые итоги или события'};
  if(Object.keys(tot).length && !(lm && lm.totals)) return {ok:false, why:'итог за '+period+' перенос не давал: дополнить '+
    'перенос итогом новой версией модель пока не решила (ОГ-Д13, к гриллингу)'};
  if(Object.keys(tot).length && !HIST[end]) return {ok:false, why:'итога на '+fmt(end)+' в стенде нет — править нечего'};
  for(const id of Object.keys(tot)) if(!HIST[end][id]) return {ok:false, why:'в итоге на '+fmt(end)+' строки «'+id+'» нет'};
  for(const id of Object.keys(evs)){ const o = OBJECTS.find(x => x.id === id && x.type === 'payment');
    if(!o || o.date.localeCompare(monthIso(period)) === -1 || o.date.localeCompare(end) !== -1)
      return {ok:false, why:'событие «'+id+'» не из месяца «'+period+'»'}; }
  const ver = migVersion(), at = RP.state.today, by = RP.who(), rows = [];
  /* В журнал ложится только настоящая замена: версия, не меняющая ни одного
     числа, — не версия.                                                      */
  Object.keys(tot).forEach(id => Object.keys(tot[id]).forEach(f => { if(HIST[end][id][f] === tot[id][f]) return;
    rows.push({release: ver, period, at, by, why: s.why, what:'итог на '+fmt(end)+' · '+(OBJ(id) || {no:id}).no+' · '+(REWRITE_FIELD[f] || f),
      was: HIST[end][id][f], now: tot[id][f], apply: () => { HIST[end][id][f] = tot[id][f]; }}); }));
  Object.keys(evs).forEach(id => { const o = OBJECTS.find(x => x.id === id);
    Object.keys(evs[id]).forEach(f => { if(o[f] === evs[id][f]) return; rows.push({release: ver, period, at, by, why: s.why,
      what:'событие '+id+' от '+fmt(o.date)+' · '+(REWRITE_FIELD[f] || f), was: o[f], now: evs[id][f], apply: () => { o[f] = evs[id][f]; }}); }); });
  if(!rows.length) return {ok:false, why:'менять нечего: в переносе уже эти числа — версия без замен не выпускается'};
  rows.forEach(r => { r.apply(); delete r.apply; });
  RP.state.migrations.push({id: ver, of: MIGRATION.id, at, by, why: s.why, periods:[period]});
  RP.state.rewrites = RP.state.rewrites.concat(rows);
  p.release = ver; p.revisions = (p.revisions || []).concat(ver);
  /* Метится выпуск, чей снимок касается месяца: периодом выпуска или колонкой. */
  const touches = i => i.period === period || !!(i.snapshot && i.snapshot.timeTable &&
    i.snapshot.timeTable.cols.some(c => (c.months || []).indexOf(period) !== -1));
  const marked = [];
  RP.state.issues.forEach(i => { if(!i.snapshot || !touches(i)) return;
    const r = RP.recompute(i.id);
    if(r && r.changed){ i.diverged = true; i.divergedAt = at;
      i.divergedWhy = divergedWhy(i, 'новая версия миграции '+ver+' ('+period+')'); marked.push(i.id); } });
  log('новая версия миграции '+ver+': '+period+' — замен '+rows.length+'; '+s.why);
  return {ok:true, release: ver, period, rewrites: rows.length, marked,
    note:'версия '+ver+' записана, замен в журнале перезаписи: '+rows.length+'; выпусков на прежних числах помечено: '+
      marked.length+' — они не переиздаются, уточнить можно корректирующим выпуском'};
};
RP.rewriteLog = () => clone(RP.state.rewrites);
RP.migrations = () => clone(RP.state.migrations);
RP.whatWentOut = period => RP.state.issues
  .filter(i => i.period === period && i.recipient)
  .map(i => ({id:i.id, at:i.at, to:i.recipient.name, tpl:i.tplName, number: issueNumber(i), doc: i.doc,
              diverged:i.diverged, coverage:i.coverage.map(deptName)}));
RP.corrective = id => {
  const prev = ISS(id); if(!prev) return {ok:false, why:'выпуска нет'};
  if(!prev.recipient) return {ok:false, why:'уточнять нечего: предварительный выпуск наружу не уходил'};
  if(prev.correctedBy) return {ok:false, why:'выпуск '+id+' уже уточнён выпуском '+prev.correctedBy};
  const res = RP.issue(prev.tpl, {params: clone(prev.params), kind:'окончательный',
    recipient: recipientValue(prev.recipient)});
  if(!res.ok) return res;
  const next = ISS(res.id);
  next.correctionOf = id; prev.correctedBy = res.id;
  log('корректирующий выпуск '+res.id+' уточняет '+id);
  return {ok:true, id: res.id, note:'прежний выпуск '+id+' не погашен: он остаётся сданным, '+
    'связь видна с обеих сторон'};
};

/* ================= КАЛЕНДАРЬ И ОБЯЗАТЕЛЬСТВА (§7) =====================
   Обязательства ПОРОЖДАЮТСЯ правилом расписания, а не ведутся списком дат
   (решение открытого вопроса §19 п.2). Состояние считается из выпусков.     */
/* Периоды расписания — календарным правилом и только им (ADR-0164 §2). Годовое
   правило отличается от месячного не природой, а шагом: дата состояния и срок
   считаются из тех же полей, поэтому второй сущности «годовое обязательство»
   не заводится.                                                              */
function schedulePeriods(sch, today){
  const out = [];
  if(sch.freq === 'ежегодно'){
    for(let y = +sch.since.slice(0,4); y <= +today.slice(0,4); y++){
      const asOf = y+'-01-01';
      if(asOf.localeCompare(today) === 1) break;
      out.push({asOf, due: y+'-'+String(sch.dueMonth).padStart(2,'0')+'-'+
        String(sch.dueDay).padStart(2,'0'), period:'состояние на '+fmt(asOf)});
    }
    return out;
  }
  let m = sch.since;
  for(let guard = 0; guard < 60; guard++){
    const asOf = firstOfNext(m);
    if(asOf.localeCompare(today) === 1) break;
    out.push({asOf, due: dayOfMonth(asOf, sch.dueDay), period: periodOfAsOf(asOf)});

/* Знаменатель полного охвата у бланка — ОБЪЕКТЫ на дату состояния, и берутся
   они из снимка, а не из живого перечня: кредит, закрытый после даты, из живого
   выпал бы, хотя акт с ним подписывать обязаны, а заведённый позже — попал бы,
   хотя сверяться на ту дату не с кем (ИО-27, волна 9). Область видимости здесь
   не спрашивается: обязательство — факт об организации, а не о смотрящем.    */
function coverObjects(t, ed, asOf, dep){
  const src = SEAM.statRows(ed.object, asOf, {dept:dep}, ALL_DEPTS.slice());
  return src.rows.filter(r => r.status !== 'закрыт').map(r => { const s = subjectInRole(r.id, 'заёмщик');
    return {id:r.id, no:r.no, borrower:r.borrower, subj: s ? s.id : null}; });
}
/* Знаменатель нормы и знаменатель охвата — разные величины, и это говорится вслух.

   ОБЪЕКТЫ, потому что акт печатается по договору. У лица договоров бывает несколько,
   тогда объектов больше, чем лиц. Счёт по объектам строже: закрыться раньше нормы он

   подразделение, должность; у бланка с полнотой по объектам — «субъект
   объекта» в роли. Закрывает срок только окончательный выпуск этому
   получателю — точным совпадением пары; выпуск другому получателю остаётся
   выпуском (числа заморожены, документ заведён), но срока не закрывает. Два

    'объявленному получателю, и без него закрыть срок нечем (ADR-0306 п. 1)';
  for(const r of list){

        'у сводной сдачи одного объекта нет (ADR-0306 п. 2)';
      if(!r.role) return 'у получателя «субъект объекта» названа роль: кому из лиц объекта уходит бумага';

    }

}
const recipientKey = r => r.kind === 'субъект объекта' ? 'субъект:'+r.role
  : r.kind === 'подразделение' ? 'unit:'+r.ref : r.kind === 'должность' ? 'post:'+r.ref : r.ref;

  if(r.kind === 'субъект объекта') return 'лицо в роли «'+r.role+'» по каждому объекту';
  const rr = reportRecipient(r); return rr.ok ? rr.rec.name : (r.ref || '—');
}
/* Точное совпадение пары: вид и значение. У «субъекта объекта» значение —
   лицо в объявленной роли у ТОГО объекта, по которому выпущена бумага.      */

  const got = i.recipient; if(!got) return false;
  if(decl.kind === 'субъект объекта'){
    const s = subjectInRole(i.obj, decl.role);
    return got.kind === 'роль' && got.role === decl.role && !!s && got.ref === s.id;
  }

RP.scheduleRecipients = tid => { const t = TPL(tid);
  return t && t.schedule ? (t.schedule.recipients || []).map(r => ({key: recipientKey(r), kind: r.kind,
    name: recipientName(r)})) : null; };
RP.obligations = () => {
  const out = [];
  RP.state.templates.forEach(t => {
    const ed = pubEd(t); if(!t.schedule || !ed) return;
    const byObject = t.coverBy === 'объект';
    const recs = t.schedule.recipients || [];
    schedulePeriods(t.schedule, RP.state.today).forEach(p => {
      t.circle.forEach(dep => recs.forEach(decl => {
        const any = RP.state.issues.filter(i => i.tpl === t.id && i.kind === 'окончательный' &&
          i.recipient && i.params.asOf === p.asOf && i.coverage.indexOf(dep) !== -1);
        const fin = any.filter(i => sameRecipient(decl, i));
        const stray = any.filter(i => !recs.some(d => sameRecipient(d, i)));
        let done = fin[0] || null, cover = null, closed = !!done, lastAt = done ? done.at : null;

          const need = coverObjects(t, ed, p.asOf, dep);

          cover = {need: need.length, got: got.length,
            needSubj: subjCount(need), gotSubj: subjCount(got),

          closed = need.length > 0 && cover.missing.length === 0;
          lastAt = closed ? fin.map(i => i.at).sort().pop() : null;
          done = closed ? fin[fin.length-1] : null;
        }
        const state = closed ? (lastAt.localeCompare(p.due) === 1 ? 'сдано с опозданием' : 'сдано')
          : (RP.state.today.localeCompare(p.due) === 1 ? 'просрочено' : 'ожидается');
        out.push({id: t.id+'/'+p.asOf+'/'+dep+'/'+recipientKey(decl), tpl:t.id, tplName:t.name, tplKind:t.kind, dept:dep,
          deptName: deptName(dep), period: p.period, asOf: p.asOf, due: p.due, state,
          to: recipientKey(decl), toKind: decl.kind, toName: recipientName(decl),
          who: RESPONSIBLE[dep] || '—', issue: done ? done.id : null, cover,
          issues: byObject ? fin.map(i => i.id) : (done ? [done.id] : []),
          stray: stray.map(i => ({id:i.id, to:i.recipient.name, kind:i.recipient.kind})),

};
/* Охват обязательства поимённо: кем закрыт и кем нет. Отдельный вызов, потому

RP.coverageOf = oblId => { const o = RP.obligations().find(x => x.id === oblId);
  return o && o.cover ? clone(o.cover) : null; };
/* Подпись заёмщика модуль не наблюдает: это событие контрагента, а не выпуск.
   Обязательство закрывает то, что модуль ПРОИЗВОДИТ, — выпуск акта каждому
   заёмщику; «подписан ли» знает сопровождение на объекте (ОЧ-59, ADR-0160).  */
RP.markSigned = oblId => ({ok:false, why:'отметки «подписан» в отчётности нет: подпись заёмщика — '+
  'событие контрагента, а не выпуск. Обязательство меряется тем, что модуль производит: акт '+
  'выпущен и ушёл каждому действующему заёмщику. Ход подписания ведёт сопровождение на '+

  'закрывает ВЫПУСК объявленному в расписании получателю, а не отметка — сданное без выпуска — это несданное '+
  'с отметкой (ИО-12, ADR-0160 §2)'});
RP.autoTask = oblId => ({ok:false, why:'задачу по просроченному обязательству отчётность не '+
  'ставит: у поручения должен быть автор, отвечающий за нагрузку. Модуль показывает, но не '+
  'поручает (ИО-13, ADR-0160)'});
RP.taskBasis = oblId => {
  const o = RP.obligations().find(x => x.id === oblId);
  if(!o) return null;
  return {kind:'обязательство по отчётности', ref:o.id, text:'«'+o.tplName+'» за '+o.period+

/* ===================== ГИБКОСТЬ ПОКАЗА (ОГ-Д6, волна 35) ==================

  const declared = (ed.timeCols || []).length;
  if(!declared) return {ok:false, why:'в утверждённом составе формы колонок-дат нет: режим показан, '+
    'но сдаётся только утверждённый состав (ИО-21)'};

  const anchor = (params || {}).asOf;
  if(anchor){ const tt = timeTable(ed, anchor, {dept: (params || {}).dept || null}, RP.viewer().scope.slice());
    const why = timeColsOpenWhy(tt);
    return why ? {ok:false, why:'в сдачу идёт не режим экрана, а колонки-даты формы на '+fmt(anchor)+'; '+why}
      : {ok:true, via:'колонки-даты формы', why:'в сдачу идёт не режим экрана, а колонки-даты формы на '+fmt(anchor)+': '+
          tt.cols.map(c => c.name).join(' · ')}; }
  const open = dates.filter(d => { const p = RP.state.periods[periodOfAsOf(d)]; return !p || p.state !== 'закрыт'; });
  return open.length ? {ok:false, why:'не закрыты периоды: '+open.map(periodOfAsOf).join(', ')+

RP.timeAnswer = (tid, spec, params) => {
  const t = TPL(tid); if(!t) return {ok:false, why:'отчёта нет'};
  if(t.kind !== 'отчёт') return {ok:false, why:'бланк говорит об одном объекте на одну дату: режимов времени у него нет'};
  const ed = liveEd(t) || draftEd(t); const mode = (spec || {}).mode;

      'отчёта, собранного в этом режиме, или видом поверх него'};

  }

    if(spec.a === spec.b) return {ok:false, why:'сравнение — двух РАЗНЫХ дат'};
    const rows = stats.map(sid => { const a = SEAM.statSlice(sid, null, cut, spec.a, scope).value,
      b = SEAM.statSlice(sid, null, cut, spec.b, scope).value;
      return {id:sid, name: statName(sid), unit:(SEAM.statMeta(sid) || {}).unit || '', a, b,

    return {ok:true, mode, rows, dates:[spec.a, spec.b], issuable: timeIssuable(t, ed, [spec.a, spec.b], pr),

/* ---- Фильтры: операторы по типу величины, группы «ИЛИ» из «И», топ-N ---- */
const FIELD_TYPES = {sum:'число', debt_main:'число', days:'число', amount:'число',
  issued:'дата', date:'дата'};
const fieldType = fid => FIELD_TYPES[fid] || 'строка';
const FILTER_OPS = {
  'число':  ['равно', 'не равно', 'больше', 'меньше', 'между', 'пусто', 'не пусто'],
  'строка': ['равно', 'не равно', 'содержит', 'начинается с', 'в списке', 'не в списке', 'пусто', 'не пусто'],
  'дата':   ['равно', 'больше', 'меньше', 'между', 'за последние N дней', 'с начала года', 'пусто', 'не пусто']
};
RP.filterOps = fid => (FILTER_OPS[fieldType(fid)] || []).slice();
function condTest(c, r){
  const x = r[c.field], v = c.value, num = y => typeof y === 'number' ? y : +y;
  switch(c.op){
    case 'пусто': return x == null || x === '';
    case 'не пусто': return !(x == null || x === '');
    case 'равно': return String(x) === String(v);
    case 'не равно': return String(x) !== String(v);
    case 'больше': return x != null && (fieldType(c.field) === 'дата' ? String(x) > String(v) : num(x) > num(v));
    case 'меньше': return x != null && (fieldType(c.field) === 'дата' ? String(x) < String(v) : num(x) < num(v));
    case 'между': return x != null && (fieldType(c.field) === 'дата' ? String(x) >= v[0] && String(x) <= v[1]
      : num(x) >= num(v[0]) && num(x) <= num(v[1]));
    case 'содержит': return String(x || '').toLowerCase().indexOf(String(v).toLowerCase()) !== -1;
    case 'начинается с': return String(x || '').toLowerCase().indexOf(String(v).toLowerCase()) === 0;
    case 'в списке': return v.indexOf(x) !== -1;
    case 'не в списке': return v.indexOf(x) === -1;
    case 'за последние N дней': return !!x && daysBetween(x, RP.state.today) >= 0 && daysBetween(x, RP.state.today) <= num(v);

  }

const condVal = (c, x) => c.field === 'dept' ? deptName(x) : x;

  (c.op === 'пусто' || c.op === 'не пусто' || c.op === 'с начала года' ? ''
    : ' '+(Array.isArray(c.value) ? c.value.map(x => condVal(c, x)).join(c.op === 'между' ? '…' : ', ') : condVal(c, c.value)));

  if(!f) return null;

  for(const g of groups){
    if(!Array.isArray(g) || !g.length) return 'группа «И» пуста: в ней хотя бы одно условие';
    for(const c of g){
      if(Array.isArray(c) || c.groups) return 'произвольных скобок нет: фильтр — группы «ИЛИ» из условий «И», '+
        'вложить группу в группу нельзя (форма шва, ADR-0180)';
      if(!FIELD(ed.object, c.field)) return 'поля «'+c.field+'» в публичном перечне объекта нет';
      const ops = FILTER_OPS[fieldType(c.field)];
      if(ops.indexOf(c.op) === -1) return 'к полю «'+FIELD(ed.object, c.field).name+'» ('+fieldType(c.field)+
        ') оператор «'+c.op+'» не применяется: '+ops.join(' · ');
