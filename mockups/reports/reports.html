/* ---------------------------- КОНСТРУКТОР ---------------------------- */
function scBuilder(){
  const vis = RP.visibleTemplates();
  let tid = RP.state.sel.draft;
  if(vis.indexOf(tid) === -1) tid = vis[0];
  const t = TPL(tid), ed = draftEd(t) || pubEd(t), list = SEAM.fieldList(ed.object);
  const checks = draftEd(t) ? RP.publishChecks(tid) : [];
  let h = '<div class="form-row"><div class="fld"><label>Шаблон</label><select onchange="RP.selDraft(this.value)">'+
    vis.map(id => '<option value="'+id+'"'+(id===tid?' selected':'')+'>'+esc(TPL(id).name)+'</option>').join('')+
    '</select></div></div>';

  h += '<div class="cols" style="margin-top:14px"><div class="body"><div class="card"><h3>Состав редакции '+
    ed.n+' <span class="small">· '+esc(ed.state)+'</span></h3>'+
    kv([
      ['Вид шаблона', t.kind],
      ['Объект', list.name+' (владелец перечня — '+list.owner+')'],
      ['Режим', ed.mode],
      ['Поля', ed.fields.length ? ed.fields.map(f => { const x = list.fields.find(y => y.id === f);
        return x ? esc(x.name) : '<span style="color:var(--asubk-red)">'+esc(f)+' — нет в перечне</span>'; }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Подстановки бланка', (ed.subs||[]).length ? (ed.subs||[]).map(s => { const x = list.fields.find(y => y.id === s);
        return '{{'+esc(s)+'}}' + (x ? '' : ' <span style="color:var(--asubk-red)">— нет в перечне</span>'); }).join(', ')
        : '<span class="muted">—</span>', true],
      ['Показатели', ed.stats.length ? ed.stats.map(s => { const m = SEAM.statMeta(s);
        return m ? esc(m.name)+(m.withdrawn ? ' <span style="color:var(--asubk-red)">— выведен '+fmt(m.withdrawn)+'</span>'
          : (m.live ? '' : ' <span style="color:var(--asubk-amber)">— налету не берётся</span>')) : esc(s); }).join('; ')
        : '<span class="muted">—</span>', true],
      ['Параметры', ed.params.map(p => p.name+' ('+p.role+')').join('; ')],
      ['Разрезы и уровни', ed.cuts.length ? ed.cuts.map((c, i) => (i+1)+'-й уровень — '+cutName(c)+
        ((ed.levelTotals || []).indexOf(c) !== -1 ? ' <b>с итоговой строкой</b>' : '')).join('; ') : '—', true],
      ['Разрядность', (ed.stats || []).map(s => { const dp = dpOf(ed, s);
        return dp == null ? null : (SEAM.statMeta(s) || {name:s}).name+' → '+
          (dp === 0 ? 'целых' : dp+' зн.'); }).filter(Boolean).join('; ') || '<span class="muted">не объявлена</span>', true]
    ])+'</div>';

  h += '<div class="card"><h3>Проверки публикации</h3>';
  if(!draftEd(t)) h += '<div class="banner info">У шаблона нет черновой редакции — публиковать нечего.</div>';
  else if(!checks.length) h += '<div class="banner ok">Все шесть проверок пройдены. '+
    'Публикация превратит личный черновик в шаблон организации.</div>';
  else h += '<div class="facts">'+checks.map(c => '<div class="f no"><b>'+esc(c.check)+':</b> '+
    esc(c.why)+'</div>').join('')+'</div>';
  h += '<div class="btn-row">'+
    '<button class="btn btn-primary btn-sm" onclick="RP.doPublish(\''+t.id+'\')">Опубликовать редакцию</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doAsk(\''+t.id+'\')">Попросить публикации</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.doBasis(\''+t.id+'\')">Сослаться на п. 12 Порядка №41</button>'+
    '</div></div>';

  /* Границы крутилки — часть РЕДАКЦИИ: объявляются там же, где состав, и
     задним числом не расширяются (ИО-20, ADR-0162 §1).                     */
  const bo = RP.bounds(t.id);
  h += '<div class="card"><h3>Допустимые отклонения</h3>'+
    kv([['Разрезы — включать, убирать, переставлять', bo.cutNames.join('; ') ||
          '<span class="muted">нет — уровни жёсткие</span>', true],
        ['Показатели — скрывать и добавлять', bo.statNames.join('; ') ||
          '<span class="muted">нет — состав показателей жёсткий</span>', true],
        ['Углубление до строк объектов', bo.drill
          ? 'крутится: снятое углубление меняет шов — statRows не спрашивается вовсе'
          : 'объявлено редакцией, экраном не трогается'],
        ['Раскладка', 'свободна всегда: '+bo.layouts.join(' · ')+' — клетки те же, вопрос тот же'],
        ['Окончательный выпуск', 'только составом по умолчанию: накрученное сдать нельзя']])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFreeWithdrawn(\''+t.id+'\')">Разрешить экрану выведенный показатель</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFreePub()">Расширить границы опубликованной редакции</button>'+
    '</div></div>';

  h += '<div class="card"><h3>Что правится без новой редакции</h3>'+
    kv([['Круг подразделений', t.circle.map(deptName).join('; ')],
        ['Расписание сдачи', t.schedule ? t.schedule.text : 'по требованию'],
        ['Пригоден для обзора', t.forReview ? 'да' : 'нет'],
        ['Полный охват обязателен', t.fullCoverage ? 'да — получателя нельзя назвать при усечённом охвате' : 'нет']])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doCircle(\''+t.id+'\')">Сузить круг до департамента промышленности</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doSchedule(\''+t.id+'\')">Назначить ежемесячную сдачу к 15-му</button>'+
    '</div></div></div>';

  /* Лист выгрузки и итоги уровней — состав редакции, а не настройка экрана
     (§3 пп. 4, 8; ИО-17, ИО-18). Карточка показывает и то и другое вместе,
     потому что порядок полос без итогов уровней бессмыслен.                  */
  const sh = RP.sheetOf(t.id);
  h += '<div class="card"><h3>Итоги уровней и лист выгрузки</h3>'+
    '<div class="bands">'+sh.bands.map((b, i) => '<span class="band'+(b === 'итог' ? ' tot' :
      (b === 'уровни' ? ' lv' : ''))+'">'+(i+1)+'. '+esc(b)+'</span>').join('<span class="arr">→</span>')+
    '</div>'+
    kv([['Ориентация листа', sh.orient],
        ['Шапка на каждой странице', sh.repeatHeader ? 'да' : 'нет'],
        ['Подвал', sh.footer === 'паспорт' ? 'паспорт ответа (кто, чем, на какую дату, каким охватом)' : sh.footer],
        ['Форматы выгрузки', sh.formats.join(' · ')],
        ['Итоги по уровням', sh.levels.filter(l => l.total).map(l => l.name).join('; ') ||
          '<span class="muted">нет</span>', true]])+
    '<div class="btn-row">'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doBands(\''+t.id+'\')">Поставить итог перед уровнями</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doFold(\''+t.id+'\')">Сложить итоги уровней самим</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doLandscape(\''+t.id+'\')">Развернуть лист альбомно</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doColDate(\''+t.id+'\')">Взять один столбец на другую дату</button>'+
    '</div></div></div>';

  h += '<div class="side"><div class="mirror"><div class="row"><span class="k">публичный перечень</span>'+
    esc(list.name)+'</div><div class="row"><span class="k">владелец</span>'+esc(list.owner)+'</div>'+
    list.fields.map(f => '<div class="row"><span class="k">'+esc(f.id)+'</span>'+esc(f.name)+'</div>').join('')+
    '</div>'+
    '<div class="mirror none" style="margin-top:12px"><div class="row"><span class="k">реестр показателей</span>'+
    'владелец — статистика</div>'+
    STATS.map(s => '<div class="row"><span class="k">'+esc(s.name)+'</span>'+
      (s.withdrawn ? 'выведен '+fmt(s.withdrawn) : (s.live ? 'налету — да' : 'налету — нет'))+'</div>').join('')+
    '</div></div></div>';
  return h;
}

/* Полосы уровней. Итог печатается ПОСЛЕ строк своей группы и приходит швом:
   складывать частные итоги модуль не вправе (ИО-17, ОЧ-25).                 */
function cellRow(r, cols){
  return '<tr>'+cols.map(c => { const val = r[c.id];
    return '<td'+(typeof val === 'number' ? ' class="num"' : '')+'>'+
      esc(typeof val === 'number' ? money(val) : (val == null ? '—' : val))+'</td>'; }).join('')+'</tr>';
}
function bandRows(gs, cols, depth){
  const lvl = depth || 1;
  return gs.map(g => {
    let out = '<tr class="grp g'+lvl+'"><td colspan="'+cols.length+'">'+
      '<b>'+esc(g.name)+'</b> <span class="small">'+esc(objWord(g.count))+'</span></td></tr>';
    out += g.children ? bandRows(g.children, cols, lvl + 1)
                      : (g.rows || []).map(r => cellRow(r, cols)).join('');
    if(g.totals) out += '<tr class="gtot"><td colspan="'+cols.length+'">Итог по «'+esc(g.name)+'»: '+
      g.totals.map(x => esc(x.name)+' — <b>'+(x.shown == null ? '—' : esc(money(x.shown)))+'</b> '+
        esc(x.unit)).join(' · ')+
      '</td></tr>';
    return out;
  }).join('');
}

/* ------------------------------ ВЫПУСК ------------------------------- */
function scIssue(){
  const vis = RP.visibleTemplates().filter(id => RP.pubEd(id));
  if(!vis.length) return '<div class="banner warn">Опубликованных шаблонов вам не видно: '+
    'выпускать можно только опубликованную редакцию.</div>';
  let tid = RP.state.sel.tpl;
  if(vis.indexOf(tid) === -1) tid = vis[0];
  const t = TPL(tid), ed = pubEd(t), sel = RP.state.sel;
  const isBlank = t.kind === 'бланк';
  const params = isBlank ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept};
  /* Сначала ПОКАЗ, и только потом выпуск: показ крутится в границах редакции,
     выпуск — нет (ИО-20, ИО-21, ADR-0162).                                  */
  const wTwist = isBlank ? null : (sel.twist
    ? Object.assign({}, sel.twist, {dropped: sel.dropped || null}) : null);
  let prev = RP.show(tid, params, wTwist), twistWhy = null;
  if(!prev.ok){ twistWhy = prev.why; prev = RP.show(tid, params, null); }

  let h = '';
  if(twistWhy) h += '<div class="banner danger"><b>Накрутка не принята.</b> '+esc(twistWhy)+
    '. Показан состав по умолчанию.</div>';

  h += '<div class="form-row"><div class="fld"><label>Шаблон</label>'+
    '<select onchange="RP.selTpl(this.value)">'+vis.map(id =>
      '<option value="'+id+'"'+(id===tid?' selected':'')+'>'+esc(TPL(id).name)+'</option>').join('')+'</select></div>';
  if(isBlank) h += '<div class="fld"><label>Кредит (объект бланка)</label>'+
    '<select onchange="RP.setObj(this.value)">'+CREDITS().map(o =>
      '<option value="'+o.id+'"'+(o.id===sel.obj?' selected':'')+'>'+esc(o.no+' · '+o.borrower)+'</option>').join('')+
    '</select></div>';
  else {
    if(ed.mode === 'на дату') h += '<div class="fld"><label>Отчётный месяц</label>'+
      '<select onchange="RP.setAsOf(this.value)">'+HIST_DATES.map(d =>
        '<option value="'+d+'"'+(d===sel.params.asOf?' selected':'')+'>'+esc(periodOfAsOf(d))+
        ' (состояние на '+fmt(d)+')</option>').join('')+
      '<option value="2026-09-01"'+(sel.params.asOf==='2026-09-01'?' selected':'')+
      '>август 2026 (снимка нет — будет подстановка)</option></select></div>';
    h += '<div class="fld"><label>Подразделение (разрез)</label><select onchange="RP.setDept(this.value)">'+
      '<option value="">все подразделения круга</option>'+DEPTS.map(d =>
        '<option value="'+d.id+'"'+(d.id===sel.params.dept?' selected':'')+'>'+esc(d.name)+'</option>').join('')+
      '</select></div>';
  }
  h += '</div>';
  /* Экран открывается на периоде, у которого снимок ЕСТЬ, и говорит вслух, когда
     выбран период без снимка: молчаливая подстановка соседней даты — это ответ
     на другой вопрос под именем заказанного (ИО-26, ОЧ-44).                   */
  if(!isBlank && ed.mode === 'на дату' && !RP.hasSnapshot(sel.params.asOf))
    h += '<div class="banner warn"><b>За этот период снимка нет.</b> Ночной прогон до '+
      esc(fmt(sel.params.asOf))+' не доходил; числа ниже посчитаны по ближайшему более раннему '+
      'состоянию, и шапка показа назовёт подставленную дату. Сдавать такой показ окончательно '+
      'нельзя: обязательство берётся на объявленном периоде, а не на соседнем.</div>';

  /* --- как смотреть: крутилка в границах редакции (§3 п. 9, ИО-20) --- */
  if(!isBlank){
    const bo = RP.bounds(tid), w = prev.twist, base = bo.base, mine = RP.myViews(tid);
    h += '<div class="card"><h3>Как смотреть — в границах, объявленных редакцией '+bo.ed+'</h3>';
    h += '<div class="form-row"><div class="fld"><label>Разрезы — уровни слева направо</label>'+
      '<div class="btn-row" style="margin:0">'+
      uniq(base.cuts.concat(bo.cuts)).map(c => { const on = w.cuts.indexOf(c) !== -1,
        hard = bo.cuts.indexOf(c) === -1;
        return '<button class="btn btn-sm '+(on ? 'btn-primary' : 'btn-secondary')+'"'+
          (hard ? ' disabled title="уровень объявлен составом: отклонением не назван"' : '')+
          ' onclick="RP.twistCut(\''+c+'\')">'+esc(cutName(c))+
          (hard ? ' · жёстко' : '')+'</button>'; }).join('')+
      w.cuts.filter(c => bo.cuts.indexOf(c) !== -1).map(c =>
        '<button class="btn btn-secondary btn-sm" onclick="RP.twistUp(\''+c+'\')" '+
        'title="поднять уровень выше">↑ '+esc(cutName(c))+'</button>').join('')+
      '</div></div>';
    h += '<div class="fld"><label>Показатели</label><div class="btn-row" style="margin:0">'+
      uniq(base.stats.concat(bo.stats)).map(s => { const on = w.stats.indexOf(s) !== -1,
        hard = bo.stats.indexOf(s) === -1;
        return '<button class="btn btn-sm '+(on ? 'btn-primary' : 'btn-secondary')+'"'+
          (hard ? ' disabled title="показатель объявлен составом: отклонением не назван"' : '')+
          ' onclick="RP.twistStat(\''+s+'\')">'+esc(statName(s))+
          (hard ? ' · жёстко' : '')+'</button>'; }).join('')+'</div></div></div>';
    h += '<div class="form-row"><div class="fld"><label>Строки объектов (углубление)</label>'+
      '<button class="btn btn-sm '+(w.drill ? 'btn-primary' : 'btn-secondary')+'"'+
        (bo.drill ? '' : ' disabled title="редакция углубление отклонением не объявила"')+
        ' onclick="RP.twistDrill()">'+(w.drill ? 'печатаются — спрошен statRows'
          : 'не печатаются — спрошен только statSlice')+'</button></div>'+
      '<div class="fld"><label>Раскладка (объявления не требует)</label>'+
      '<select onchange="RP.twistLayout(this.value)">'+RP.layouts().map(l =>
        '<option'+(l === w.layout ? ' selected' : '')+'>'+esc(l)+'</option>').join('')+
      '</select></div>'+
      '<div class="fld"><label>Личный вид</label><select onchange="RP.useView(this.value)">'+
        '<option value="">— без вида, состав по умолчанию —</option>'+mine.map(vw =>
          '<option value="'+vw.id+'"'+(vw.id === sel.view ? ' selected' : '')+'>'+
          esc(vw.name)+'</option>').join('')+'</select></div>'+
      '<div class="fld"><label>Сохранить накрутку видом</label>'+
        '<input value="'+esc(sel.viewName || '')+'" onchange="RP.setViewName(this.value)" '+
        'placeholder="как я смотрю просрочку"></div></div>';
    h += '<div class="btn-row">'+
      '<button class="btn btn-primary btn-sm" onclick="RP.doSaveView()">Сохранить вид</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="RP.twistReset()">Вернуть состав по умолчанию</button>'+
      (sel.view ? '<button class="btn btn-secondary btn-sm" onclick="RP.doDropView()">Удалить вид</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.doShareView()">Передать вид коллеге</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="RP.doPublishView()">Опубликовать вид для всех</button>' : '')+
      '<button class="btn btn-secondary btn-sm" onclick="RP.doTwistOut()">Добавить разрез «заёмщик»</button>'+
      '</div></div>';
  }

  /* --- показ: шапка, потом числа --- */
  h += showBox(prev.head);
  /* Момент показа выведен из РЕЖИМА ВРЕМЕНИ, а не назначен: «на дату» читает
     готовые строки ночного прогона — считается сразу; «сейчас» — живой запрос
     к ядру, и гонять его оттого, что кто-то промахнулся мимо строки списка,

  const liveGate = !isBlank && ed.mode === 'сейчас' && !sel.live;

    h += '<div class="totals">'+d.totals.map(x => '<div class="tot"><div class="tn">'+esc(x.name)+'</div>'+

  }

  /* --- ступень --- */
  /* Право окончательного выпуска — не роль и не флаг: это то же обязательство,

  const fin = RP.finalRight(t.id, (!isBlank && sel.params.dept) ? [sel.params.dept] : null);

      const br = RP.blankRecipient(t.id, sel.params.obj) || {};
      const r = br.rec;

          : '<span class="muted">назвать некем</span>')+'</div>'+
        '<div class="why">'+(r ? (why[r.kind] || '') : esc(br.why || ''))+'</div></div>';
    })() :
    '<div class="fld"><label>Получатель (справочник адресатов)</label>'+
      '<select onchange="RP.setRecipient(this.value)"'+

  if(isBlank && t.series && t.series.manual) h += '<div class="fld"><label>Номер (серия ручная)</label>'+
    '<input value="'+esc(sel.number||'')+'" onchange="RP.setNumber(this.value)" placeholder="ПР-2026/015"></div>';
  h += '<div class="fld"><label>&nbsp;</label>'+
    '<button class="btn btn-primary" onclick="RP.doOrder()">Заказать выпуск</button></div></div>';
  h += '<div class="facts">'+
    '<div class="f">предварительный — обязательств не закрывает, номера не тратит; '+
      'файл живёт '+dayWord(RP.FILE_DAYS)+' и гаснет</div>'+
    '<div class="f">окончательный — только с названным получателем и только pdf</div>'+
    (prev.deviated ? '<div class="f no">накрученный показ выпускается <b>предварительно</b>; '+
      'сдать его нельзя</div>' : '')+
    (isBlank && t.series ? '<div class="f">серия <b>'+esc(t.series.prefix)+'</b>'+
      (t.series.manual ? ' ручная — номер вводит канцелярия, система ловит дубль'
        : ' сквозная — следующий номер '+esc(t.series.prefix+String(t.series.next).padStart(3,'0')))+
      '</div>' : '')+
    '</div>';
  h += '<div class="btn-row">'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoStringRecipient()">Вписать получателя строкой «Минфин КР»</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="RP.demoDocx()">Отдать получателю docx</button>'+
    '</div></div>';

  /* --- четыре действия с показанным (ОЧ-49) --- */
  /* С показанного ответа уходят четырьмя дорогами, и три из них — выпуск. Excel
     «просто посмотреть» в легаси и есть та дорога, по которой числа уходят из
     системы без паспорта: файл на почте живёт дольше снимка, а спросить у него
     «чем это считано» уже некому (ОЧ-30, ОЧ-49).                              */
  h += '<div class="card"><h3>Что делают с показанным — четыре дороги</h3>'+
    '<div class="facts">'+
      '<div class="f">выгрузить файлом — предварительный выпуск, файл гаснет через '+
        dayWord(RP.FILE_DAYS)+', строка журнала остаётся</div>'+
      '<div class="f">выпустить окончательно — снимок и получатель</div>'+
      '<div class="f">сохранить видом — накрутка, а не числа: вид ничего не морозит</div>'+
      '<div class="f">завести рабочий список — предварительный выпуск и замороженный состав</div>'+
    '</div>'+
    '<div class="form-row"><div class="fld"><label>Формат выгрузки</label>'+
      '<div class="btn-row" style="margin:0">'+

  /* --- задания --- */
  const jobs = RP.state.issues.filter(i => i.state !== 'готов');
  h += '<div class="card"><h3>Задания на выпуск</h3>'+
    '<div class="small">Состояния: '+RP.jobStates().join(' → ')+'.</div>';

      '<tr><td class="mono">'+esc(j.id)+'<div class="small">'+fmt(j.at)+' · '+esc(j.by)+'</div></td>'+
      '<td class="small">'+esc(j.tplName)+'<div class="small">ред. '+j.ed+'</div></td>'+
      '<td class="small">'+esc(j.asked)+'</td>'+
      '<td>'+pill(j.state, j.state === 'ошибка' ? 'err' : (j.state === 'считается' ? 'warn' : 'info'))+
        (j.error ? '<div class="why">'+esc(j.error)+'</div>' : '')+'</td>'+
      '<td>'+(j.state === 'ошибка' ? '<span class="small muted">задание кончилось; строка осталась</span>'
        : '<button class="btn btn-secondary btn-sm" onclick="RP.doStep(\''+j.id+'\')">Шаг задания</button>')+
      '</td></tr>').join('')+'</tbody></table>';
  h += '</div>';
  return h;
}
RP.selTpl = id => { const sel = RP.state.sel;
  /* Накрутка привязана к шаблону: смена шаблона её не переносит.            */
  sel.tpl = id; sel.twist = null; sel.view = null; sel.dropped = null; sel.live = false;
  render(); };
function shownArgs(){ const sel = RP.state.sel, t = TPL(sel.tpl);
  const isB = t && t.kind === 'бланк';
  return {tid: sel.tpl, isBlank: isB,
    params: isB ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept},
    twist: isB ? null : (sel.twist || null)}; }
RP.doExportShown = f => { const a = shownArgs();
  act(RP.exportShown(a.tid, a.params, a.twist, f)); };
RP.setWlName = v => { RP.state.sel.wlName = v; };
RP.doWorklistShown = () => { const sel = RP.state.sel, a = shownArgs();
  const r = RP.worklistShown(a.tid, a.params, a.twist, sel.wlName);
  if(r.ok){ sel.wl = r.id; sel.wlName = ''; }
  act(r); };
function curTwist(){ const sel = RP.state.sel;
  const b = sel.twist || RP.defaultOf(sel.tpl);
  return {cuts: b.cuts.slice(), stats: b.stats.slice(), drill: b.drill, layout: b.layout}; }
function setTwist(w){ const sel = RP.state.sel;
  const r = RP.show(sel.tpl, {asOf: sel.params.asOf, dept: sel.params.dept}, w);
  if(!r.ok) return act(r);
  sel.twist = w; sel.view = null; sel.dropped = null;
  if(r.deviated && sel.kind === 'окончательный') sel.kind = 'предварительный';
  render(); }
RP.twistCut = c => { const w = curTwist(); const i = w.cuts.indexOf(c);
  if(i === -1) w.cuts.push(c); else w.cuts.splice(i, 1); setTwist(w); };
RP.twistStat = s => { const w = curTwist(); const i = w.stats.indexOf(s);
  if(i === -1) w.stats.push(s); else w.stats.splice(i, 1); setTwist(w); };
RP.twistDrill = () => { const w = curTwist(); w.drill = !w.drill; setTwist(w); };
RP.twistLayout = v => { const w = curTwist(); w.layout = v; setTwist(w); };
RP.twistUp = c => { const w = curTwist(); const i = w.cuts.indexOf(c);
  if(i > 0){ w.cuts.splice(i, 1); w.cuts.splice(i - 1, 0, c); } setTwist(w); };
RP.twistReset = () => { const sel = RP.state.sel;
  sel.twist = null; sel.view = null; sel.dropped = null; render(); };
RP.doTwistOut = () => { const w = curTwist();
  if(w.cuts.indexOf('borrower') === -1) w.cuts.push('borrower'); setTwist(w); };
RP.setViewName = v => { RP.state.sel.viewName = v; };
RP.doSaveView = () => { const sel = RP.state.sel;
  const r = RP.saveView(sel.tpl, sel.viewName, sel.twist || null);
  if(r.ok){ sel.view = r.id; sel.viewName = ''; }
  act(r); };
RP.useView = id => { const sel = RP.state.sel;
  if(!id) return RP.twistReset();
  const a = RP.applyView(id);
  if(!a.ok) return act(a);
  sel.view = id; sel.tpl = a.view.tpl; sel.dropped = a.dropped;
  sel.twist = {cuts: a.twist.cuts, stats: a.twist.stats, drill: a.twist.drill,
    layout: a.twist.layout, view: a.view.name};
  if(a.deviated && sel.kind === 'окончательный') sel.kind = 'предварительный';
  act({ok:true, note: a.note}); };
RP.doDropView = () => { const sel = RP.state.sel; const r = RP.deleteView(sel.view);
  if(r.ok){ sel.view = null; sel.twist = null; sel.dropped = null; } act(r); };
RP.doShareView = () => act(RP.shareView(RP.state.sel.view, 'Асанов А.'));
RP.doPublishView = () => act(RP.publishView(RP.state.sel.view));
RP.setObj = id => { RP.state.sel.obj = id; RP.state.sel.live = false; render(); };
/* Период без снимка выбрать МОЖНО, но предупреждение приходит в момент выбора,
   а не после счёта: умолчанием он не бывает никогда (ИО-26, ОЧ-44).         */
RP.setAsOf = v => { RP.state.sel.params.asOf = v; RP.state.sel.live = false;
  if(!RP.hasSnapshot(v)) toast('у периода «'+periodOfAsOf(v)+'» снимка нет: числа возьмутся '+
    'подстановкой ближайшего прошлого снимка, и паспорт это назовёт. Умолчанием такой период '+
    'не бывает — экран открывается на последнем, у которого снимок есть (ИО-26)', 'err');
  render(); };
RP.setDept = v => { RP.state.sel.params.dept = v; RP.state.sel.live = false; render(); };
RP.askLive = () => { RP.state.sel.live = true; render(); };
RP.setKind = v => { RP.state.sel.kind = v; render(); };
RP.setRecipient = v => { RP.state.sel.recipient = v; render(); };
RP.setNumber = v => { RP.state.sel.number = v; render(); };
function issueSpec(){
  const sel = RP.state.sel, t = TPL(sel.tpl) || TPL(RP.visibleTemplates()[0]);
  const params = t.kind === 'бланк' ? {obj: sel.obj} : {asOf: sel.params.asOf, dept: sel.params.dept};
  return {t, spec:{params, kind: sel.kind,
    twist: t.kind === 'бланк' ? null : (sel.twist || null),
    recipient: (sel.kind === 'окончательный' && t.kind !== 'бланк') ? sel.recipient : null,
    number: sel.number}};
}
RP.doOrder = () => { const q = issueSpec();
  const r = RP.order(q.t.id, q.spec);
  act(r, r.ok ? 'заказ '+r.id+' принят: чисел ещё нет, строка журнала уже есть' : ''); };
RP.doStep = id => { const r = RP.step(id);
  if(r.done && r.ok){ RP.state.sel.issue = id; RP.state.view = 'journal'; }
  act(r, r.ok ? (r.done ? 'выпуск '+id+': '+r.note : r.note) : ''); };
RP.doIssue = () => { const q = issueSpec();
  const r = RP.issue(q.t.id, q.spec);
  if(r.ok){ RP.state.sel.issue = r.id; RP.state.view = 'journal'; }
  act(r, r.ok ? 'выпуск '+r.id+': '+r.note : '');
};
RP.demoStringRecipient = () => { const sel = RP.state.sel, t = TPL(sel.tpl);
  act(RP.issue(t.id, {params:{asOf:sel.params.asOf, dept:sel.params.dept, obj:sel.obj},
    kind:'окончательный', recipient:'Минфин КР'})); };
RP.demoDocx = () => { const sel = RP.state.sel, t = TPL(sel.tpl);
  act(RP.issue(t.id, {params:{asOf:sel.params.asOf, dept:sel.params.dept, obj:sel.obj},
    kind:'окончательный', recipient:sel.recipient, format:'docx'})); };

/* 50 кредитов: 47 в департаменте Осмоновой, 3 в чужих. Дни просрочки на 31.08 заданы
   списком, чтобы ступени были заполнены; на 31.07 они на 31 меньше, на 05.09 — на 5 больше. */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const LATE_ON_0831 = [4, 9, 15, 22, 27, 30,  35, 48, 61, 77, 88,  95, 120, 140, 166, 179,  214, 233, 290, 402, 611];
const CREDITS = (() => {
  const rnd = mulberry32(20260905);
  const out = [];
  const owners = [];
  BORROWERS.filter(b => b.dept === 'dep-prom').forEach((b, i) => { const k = 2 + (i % 3); for(let j = 0; j < k; j++) owners.push(b.id); });
  while(owners.length < 47) owners.push('b0' + (1 + Math.floor(rnd() * 9)));
  owners.length = 47;
  owners.push('b17', 'b17', 'b18');
  const lateIdx = [];
  for(let i = 0; i < 21; i++) lateIdx.push(i * 2 + 1);            // 21 просроченный среди первых 47
  const hiddenLate = {48: 12, 49: 240};                             // из скрытых: один 1–30, один 181+
  const seqByYear = {};
  owners.forEach((bid, i) => {
    const b = BR(bid);
    const year = i < 45 ? 2022 + Math.floor(rnd() * 4) : 2026;     // два последних видимых рождены в августе 2026
    const month = i >= 45 && i < 47 ? 8 : 1 + Math.floor(rnd() * (year === 2026 ? 7 : 12));
    const day = i >= 45 && i < 47 ? (i === 45 ? 10 : 20) : 1 + Math.floor(rnd() * 27);
    const date = year + '-' + pad2(month) + '-' + pad2(day);
    seqByYear[year] = (seqByYear[year] || 0) + 1;
    const no = 'КД-' + year + '-' + String(seqByYear[year] * 7 + 3).padStart(3, '0');
    const sum = Math.round((500000 + rnd() * 24500000) / 100000) * 100000;
    const li = lateIdx.indexOf(i);
    const late0831 = li !== -1 ? LATE_ON_0831[li] : (hiddenLate[i] || 0);
    const missAt = late0831 ? addDays('2026-08-31', -late0831) : null;
    const closedAt = (i === 6 || i === 20) ? '2026-06-15' : null;    // два закрытых: строка остаётся
    const paidAt = (i === 3 || i === 21) ? '2026-09-03' : null;       // погасили просрочку после 31.08
    const program = DICTS.program[Math.floor(rnd() * 4)];
    const cur = i % 9 === 4 ? 'USD' : 'сом';                          // валюта договора — нужна залогу и требованию
    out.push({id:'c' + pad2(i + 1), no, borrowerId: bid, borrower: b.name, dept: b.dept,
      program, sum, date, cur, missAt, closedAt, paidAt});
  });
  return out;
})();

/* ---------- данные: предметы залога (владелец — залог) ---------- */
/* ~43 предмета: у каждого свой залогодатель (заёмщик или третье лицо), оценка в валюте
   обеспечиваемого кредита, отнесения под 1–2 кредита одного заёмщика, обследования. Три
   предмета — у кредитов чужих подразделений (скрыты областью видимости). */
const THIRD_PARTIES = ['Жумабекова Н. (третье лицо)', 'ОсОО «Кут-Мүлк» (третье лицо)', 'Асанов Т. (третье лицо)'];
const COLLATERAL = (() => {
  const rnd = mulberry32(20260905 + 21);
  const out = [];
  const byBorrower = {};
  CREDITS.forEach(c => { (byBorrower[c.borrowerId] = byBorrower[c.borrowerId] || []).push(c); });
  let n = 0;
  Object.keys(byBorrower).forEach(bid => {
    const cs = byBorrower[bid], b = BR(bid);
    const k = bid === 'b17' ? 2 : bid === 'b18' ? 1 : 2 + Math.floor(rnd() * 2);      // 2–3 предмета на заёмщика
    for(let j = 0; j < k; j++){
      n++;
      const kind = DICTS.kind[Math.floor(rnd() * DICTS.kind.length)];
      const first = cs[j % cs.length];
      const secured = [first].concat(cs.filter(c => c !== first && c.cur === first.cur).slice(0, Math.floor(rnd() * 2))); // валюта одна (CONTEXT «Валюта оценки»)
      const adm = addDays(first.date, Math.floor(rnd() * 20));                                   // принят при выдаче
      const val = Math.round(secured.reduce((s, c) => s + c.sum, 0) * (1.2 + rnd() * 0.9) / 100000) * 100000;
      const pledger = n % 4 === 0 ? THIRD_PARTIES[n % 3] : b.name;                               // каждый четвёртый — имущественный залог третьего лица
      const region = b.dept === 'rep-osh' ? 'Ошская область' : DICTS.region[Math.floor(rnd() * 3)];
      const lastSurvey = rnd() < 0.12 ? null : addDays('2026-08-31', -Math.floor(rnd() * 300));   // ~12% не обследованы
      out.push({id:'z' + pad2(n), no:'ПЗ-' + adm.slice(0, 4) + '-' + String(n * 5 + 7).padStart(3, '0'), kind, pledger,
        dept: b.dept, curator: b.curator, region, cur: first.cur, adm, val, creditIds: secured.map(c => c.id),
        lastSurvey, ban: rnd() < 0.3 ? 'да' : 'нет', insured: kind === 'депозит' ? 'нет' : rnd() < 0.7 ? 'да' : 'нет'});
    }
  });
  return out;
})();
/* Состояние предмета на дату D — строка среза, собранная прогоном по шву залога calcPledge. */
function collateralAt(z, D){
  if(z.adm > D) return null;                                          // до принятия предмета нет
  const cs = z.creditIds.map(id => creditAt(CREDITS.find(c => c.id === id), D)).filter(Boolean);
  const live = cs.filter(c => c.status !== 'закрыт');
  const pledge = Math.round(z.val * (1 - KIND_DISCOUNT[z.kind]) / 1000) * 1000;
  const alloc = Math.min(pledge, live.reduce((s, c) => s + c.debt_main, 0));  // отнесено — не выше залоговой
  const zstate = !live.length ? 'освобождён' : live.some(c => c.days > 270) ? 'реализуется' : 'в залоге';
  const surv = z.lastSurvey && z.lastSurvey <= D ? daysBetween(z.lastSurvey, D) : null;
  const ctl = surv == null ? 'не обследован' : surv > 180 ? 'контроль просрочен' : 'в срок';
  const secBy = {}; live.forEach(c => { secBy[c.id] = c.debt_main; });   // обеспечиваемое — по каждому кредиту отдельно
  return {id:z.id, no:z.no, kind:z.kind, pledger:z.pledger, dept:z.dept, curator:z.curator, region:z.region, cur:z.cur,
    adm:z.adm, zstate, ban:z.ban, insured:z.insured, val:z.val, pledge, alloc, free: pledge - alloc,
    secBy, sec: live.reduce((s, c) => s + c.debt_main, 0), ccred: live.length, surv, ctl};
}

/* Требование к заёмщику ставит система на 1-й день просрочки; при просрочке свыше 90 дней
   по кредиту с поручителем открывается второе — к поручителю; свыше 180 и при живом предмете
   залога — третье, к залогодателю. Дело одно на заёмщика. Погашение закрывает требование,
   строка остаётся в срезе с фазой «закрыто». */
const GUARANTORS = ['Асанова Ж.', 'ОсОО «Гарант-Юг»', 'Токтогулов М.', 'ИП Бекова А.', 'ОАО «Кыргызгарант»'];
const CLAIMS = (() => {
  const out = [];
  const caseNo = {};
  let n = 0;
  CREDITS.forEach((c, i) => {
    if(!c.missAt) return;
    const b = BR(c.borrowerId);
    if(!caseNo[c.borrowerId]) caseNo[c.borrowerId] = 'ДВ-2026-' + String(Object.keys(caseNo).length * 3 + 11).padStart(3, '0');
    const base = {credit: c.no, creditId: c.id, caseNo: caseNo[c.borrowerId], dept: c.dept, curator: b.curator, cur: c.cur};

KB.moveCut = (id, dir) => { const s = S(); clearNotices(); const i = s.cuts.findIndex(c => c.id === id); const j = i + dir;
  if(i === -1 || j < 0 || j >= s.cuts.length) return {ok:false, why:'двигать некуда'};
  const t = s.cuts[i]; s.cuts[i] = s.cuts[j]; s.cuts[j] = t; s.live = null; return {ok:true}; };
KB.setBucket = (id, b) => { const s = S(); clearNotices(); const c = s.cuts.find(x => x.id === id), m = CUT(id);
  if(!c || !m.buckets) return {ok:false, why:'у разреза корзины не объявлено'};
  if(!(b in m.buckets)) return {ok:false, why:'корзины «' + b + '» у разреза «' + m.name + '» не объявлено'};
  c.bucket = b; s.live = null; return {ok:true}; };
KB.toggleTotal = id => { const s = S(); clearNotices(); const c = s.cuts.find(x => x.id === id); if(!c) return {ok:false, why:'уровня нет'};
  c.total = !c.total; return {ok:true, total: c.total}; };
KB.addFilter = (field, op, value) => { const s = S(); clearNotices(); const fd = fieldOf(s.object, field || FIELDS[s.object].fields[0].id);
  if(!fd) return {ok:false, why:'поля «' + field + '» в публичном перечне объекта нет'};
  const ops = OPS[fd.type]; const o = ops.indexOf(op) !== -1 ? op : ops[0];
  s.filters.push({field: fd.id, op: o, value: value == null ? '' : String(value)}); s.live = null; return {ok:true, i: s.filters.length - 1}; };
KB.setFilter = (i, patch) => { const s = S(); clearNotices(); const f = s.filters[i]; if(!f) return {ok:false, why:'фильтра нет'};
  if(patch.field && patch.field !== f.field){ const fd = fieldOf(s.object, patch.field); if(!fd) return {ok:false, why:'поля нет'};
    f.field = fd.id; f.op = OPS[fd.type][0]; f.value = ''; }
  if(patch.op){ const fd = fieldOf(s.object, f.field); if(OPS[fd.type].indexOf(patch.op) === -1) return {ok:false,
    why:'оператор «' + patch.op + '» типу «' + fd.type + '» не положен: перечень операторов задан на систему по типу величины'}; f.op = patch.op; }
  if(patch.value != null) f.value = String(patch.value);
  s.live = null; return {ok:true}; };
KB.removeFilter = i => { const s = S(); clearNotices(); s.filters.splice(i, 1); s.live = null; return {ok:true}; };
KB.setDrill = on => { const s = S(); clearNotices(); s.drill.on = !!on; return {ok:true}; };
KB.toggleField = fid => { const s = S(); clearNotices(); if(!fieldOf(s.object, fid)) return {ok:false, why:'поля нет в перечне'};
  const i = s.drill.fields.indexOf(fid); if(i !== -1) s.drill.fields.splice(i, 1); else s.drill.fields.push(fid); return {ok:true}; };

/* ---------- план строки объекта (волна 22) ----------
   Одна колонка — одна величина, строка не повторяет дерево:
   · under  — statId → поле: строчная мера печатается ПОД колонкой своего агрегата (`over`);
   · ident  — текстовые поля: первая колонка, идентификатор объекта;
   · chips  — словарные и датовые признаки: чипы в первой колонке;
   · extra  — числовые поля без агрегата над ними: своя колонка «только строки»;
   · skipped — поля, стоящие уровнем: строка и так под своим узлом, повтор не печатается. */
function rowPlan(){
  const s = S();
  const levelFields = s.cuts.map(c => CUT(c.id).field);
  const under = {};
  s.stats.forEach(id => { const m = STAT(id); if(m && m.over && fieldOf(s.object, m.over)) under[id] = m.over; });
  const underFields = uniq(Object.keys(under).map(k => under[k]));
  const ident = [], chips = [], extra = [], skipped = [];
  s.drill.fields.forEach(f => { const fd = fieldOf(s.object, f); if(!fd) return;
    if(levelFields.indexOf(f) !== -1){ skipped.push(f); return; }
    if(fd.type === 'число'){ if(underFields.indexOf(f) === -1) extra.push(f); return; }
    (fd.type === 'текст' ? ident : chips).push(f); });
  return {under, underFields, ident, chips, extra, skipped};
}
KB.rowPlan = rowPlan;

/* ---------- ответ ---------- */
function computeNow(){
  const s = S(), c = composition();
  const r = SEAM.statSlice(c.object, c.stats, c.cuts, c.filters, c.asOf, ME.scope);
  if(!r.ok) return r;
  const visible = r.root.count;
  const p = r.passport;
  p.visible = visible; p.hidden = r.hidden;
  p.scopeText = ME.scope.map(deptName).join('; ');
  if(s.drill.on) p.seams = p.seams.concat([c.asOf ? 'statRows' : 'objectRows']);
  p.shown = {stats: c.stats.map(id => STAT(id).name),
    cuts: c.cuts.map(x => CUT(x.id).name + (x.bucket ? ' · ' + x.bucket : '') + (x.total ? ' · с итогом' : '')),
    filters: c.filters.filter(f => f.value !== '').map(f => fieldOf(c.object, f.field).name + ' ' + f.op + ' ' + f.value),
    drill: s.drill.on ? (() => { const pl = rowPlan(); const nm = f => fieldOf(c.object, f).name;
      return pl.ident.concat(pl.chips).map(nm)
        .concat(pl.underFields.map(f => nm(f) + ' — под своим агрегатом'))
        .concat(pl.extra.map(f => nm(f) + ' — своей колонкой')); })() : null};
  if(c.asOf){ p.age = ageText(p.asOf);
    p.short = 'на ' + fmtShort(p.asOf) + ' (' + p.age + ') · ' + (p.fixed === 'зафиксировано' ? 'зафикс.' : 'не зафикс.') + ' · вам видно ' + visible; }
  else { p.fixed = 'не зафиксировано'; p.short = 'живое ' + fmtShort(TODAY) + ' ' + NOW + ' · не зафикс. · вам видно ' + visible; }
  return r;
}
/* «На дату» считается сразу; «сейчас» — по кнопке: живой запрос к ядру не гоняют оттого,
   что кто-то поставил галочку (§14 п. 4). */
KB.answer = () => { const s = S();
  if(s.mode === 'на дату') return Object.assign(computeNow(), {stale:false});
  if(s.live && s.live.hash === hashOf()) return Object.assign(clone(s.live.answer), {stale:false});
  return {ok:false, stale:true, answer: s.live ? clone(s.live.answer) : null,
    why: s.live ? 'состав изменился после последнего расчёта — нажмите «посчитать»' : 'режим «сейчас» считается по кнопке «посчитать»: это живой запрос к ядру'}; };
KB.compute = () => { const s = S(); const r = computeNow(); if(!r.ok) return r;
  s.live = {hash: hashOf(), answer: clone(r)}; return Object.assign(clone(r), {stale:false}); };
KB.rowsShown = () => { const a = KB.answer(); if(!a.ok) return [];
  const out = []; const walk = n => { if(n.rows) out.push.apply(out, n.rows); (n.children || []).forEach(walk); }; walk(a.root); return out; };

/* ---------- действия ---------- */
KB.saveDraft = name => { const s = S(); clearNotices(); const nm = String(name == null ? s.name : name).trim();
  if(!nm) return {ok:false, why:'у черновика должно быть имя: безымянный состав — это состояние экрана, а не черновик'};
  const id = 'ЧР-' + (++s.seq.draft);
  s.drafts.push({id, name: nm, author: ME.who, at: TODAY, comp: composition()});
  s.name = nm; note('ok', 'черновик «' + nm + '» сохранён · виден только вам');
  return {ok:true, id, note:'личный черновик: виден автору; шаблоном станет только публикацией (ИО-1)'}; };
KB.draftsOf = who => S().drafts.filter(d => d.author === who).map(clone);
KB.openDraft = id => { const s = S(); const d = s.drafts.find(x => x.id === id); if(!d) return {ok:false, why:'черновика нет'};
  if(d.author !== ME.who) return {ok:false, why:'черновик чужой: он личный'};
  clearNotices(); const c = clone(d.comp);
  s.object = c.object; s.mode = c.mode; if(c.asOf) s.asOf = c.asOf; s.stats = c.stats; s.cuts = c.cuts; s.filters = c.filters; s.drill = c.drill;
  s.name = d.name; s.live = null; return {ok:true}; };

KB.exportIssue = fmtName => { const s = S(); clearNotices();
  const fmts = ['xlsx', 'csv', 'pdf']; if(fmts.indexOf(fmtName) === -1) return {ok:false, why:'формат «' + fmtName + '» отчёту не положен: ' + fmts.join(' · ')};
  const a = KB.answer(); if(!a.ok) return {ok:false, why:'выгружать нечего: ' + a.why};
  const id = 'В-Л-' + (++s.seq.issue);
  const it = {id, kind:'предварительный', personal:true, fmt: fmtName, at: fmt(TODAY) + ' ' + NOW, by: ME.who, draft: s.name,
    passport: clone(a.passport), fileUntil: addDays(TODAY, FILE_DAYS)};
  s.issues.push(it); note('ok', 'выпуск ' + id + ' (' + fmtName + ') · предварительный, личный');
  return {ok:true, id, issue: clone(it), note:'предварительный выпуск: строка в журнале навсегда, файл живёт до ' + fmt(it.fileUntil) +
    ' (' + FILE_DAYS + ' дней, ИО-11); паспорт вшит в файл (ИО-6)'}; };
KB.finalIssue = () => ({ok:false, why:'окончательный выпуск у личного черновика невозможен: числа морозит НАЗВАННЫЙ ПОЛУЧАТЕЛЬ (ИО-4), ' +
  'а получатель и обязательство бывают только у опубликованной редакции, и то составом по умолчанию (ИО-21)'});
KB.toDashboard = () => ({ok:false, why:'плиткой на дашборд встаёт только объявленный отчёт: за плиткой всегда стоит шаблон отчётности, ' +
  'а личный черновик шаблоном не является (ИО-1, §10)'});
KB.publish = () => ({ok:false, why:'публикует уполномоченный по отчётности (' + AUTH.who + '), а не автор: шаблоном состав становится публикацией, ' +
  'не сборкой (ИО-1, ADR-0156 §2). Вам доступно «попросить публикации»'});
KB.setBasis = () => ({ok:false, why:'сослаться на пункт нормы из личного черновика нельзя: нормативное основание называет только публикующий (§4)'});
KB.askPublish = () => { const s = S(); clearNotices();
  if(s.asked) return {ok:false, why:'просьба уже передана ' + fmt(s.asked.at) + ' — ' + AUTH.who + ' ещё не ответил'};
  s.asked = {to: AUTH.who, at: TODAY, draft: s.name, comp: composition()};
  note('ok', 'черновик «' + s.name + '» передан на публикацию: ' + AUTH.who);
  return {ok:true, note:'до публикации состав остаётся личным черновиком: круг подразделений, расписание и основание назовёт публикующий'}; };

KB.makeWorklist = name => { const s = S(); clearNotices();
  if(!s.drill.on) return {ok:false, why:'сначала покажите строки объектов: рабочий список замораживает ОБЪЕКТЫ, а не числа (ИО-14). ' +
    'Пока видно только дерево — замораживать нечего'};
  const a = KB.answer(); if(!a.ok) return {ok:false, why:'списка не будет: ' + a.why};
  const rows = KB.rowsShown(); if(!rows.length) return {ok:false, why:'в ответе ни одной строки: список из пустоты не заводится'};
  const nm = String(name || '').trim(); if(!nm) return {ok:false, why:'у рабочего списка должно быть имя: по нему будут звонить'};
  /* Список заводится ЧЕРЕЗ предварительный выпуск: морозить нечего, пока у ответа нет паспорта (§14 п. 4). */
  const iss = KB.exportIssue('xlsx'); if(!iss.ok) return iss;
  const id = 'РС-' + (++s.seq.list);
  const wl = {id, name: nm, issue: iss.id, owner: ME.who, dept: null, at: TODAY, closed:false,
    object: s.object, ids: rows.map(r => r.id), count: rows.length, asOf: a.passport.asOf || TODAY};
  s.worklists.push(wl); note('ok', 'рабочий список ' + id + ' «' + nm + '»: ' + rows.length + ' объектов, состав заморожен');
  return {ok:true, id, count: rows.length, issue: iss.id, note:'состав заморожен на выпуске ' + iss.id + '; числа не хранит, величины всегда текущие; ' +
    'выбывший объект остаётся в списке с пометкой (ИО-14)'}; };
KB.passWorklist = id => { const s = S(); const wl = s.worklists.find(x => x.id === id); if(!wl) return {ok:false, why:'списка нет'};
  if(wl.dept) return {ok:false, why:'список уже передан: ' + deptName(wl.dept)};
  wl.dept = ME.dept; note('ok', 'список ' + id + ' передан подразделению'); return {ok:true, dept: wl.dept}; };
KB.closeWorklist = id => { const s = S(); const wl = s.worklists.find(x => x.id === id); if(!wl) return {ok:false, why:'списка нет'};
  wl.closed = true; note('ok', 'список ' + id + ' закрыт: работа окончена, список читается, но не пополняется'); return {ok:true}; };

/* Справочно для экрана и смоука. */
KB.me = () => clone(ME);
KB.fields = () => SEAM.fieldList(S().object);
KB.statsAvail = () => SEAM.statList(S().object).map(m => Object.assign(m, {on: S().stats.indexOf(m.id) !== -1}, KB.statAvail(m.id)));
KB.cutsAvail = () => SEAM.cutList(S().object).filter(c => !S().cuts.some(x => x.id === c.id)).map(c => Object.assign(c, KB.cutAvail(c.id)));
KB.log = () => clone(log);
KB.seed();

/* ======================================================================
   4. РЕНДЕР — только при наличии DOM; логика выше от него не зависит
   ====================================================================== */
function toast(text, kind){ if(!hasDOM) return; const w = document.getElementById('toastWrap'); if(!w) return;
  const el = document.createElement('div'); el.className = 'toast' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : ''); el.textContent = text;
  w.appendChild(el); setTimeout(() => el.remove(), 4800); }
function kbAct(r, okText){ if(!r.ok){ toast(r.why, 'err'); } else if(okText || r.note){ toast(okText || r.note, 'ok'); } render(); }
const val = (id, v) => { if(v == null) return '—'; const m = STAT(id);
  return (m.unit === 'сом' || m.unit === 'ед.') ? money(v) : num1(v); };
/* Значение поля строки — по типу величины, объявленному владельцем поля. */
const fval = (fd, x) => x == null ? '—' : fd.type === 'число' ? (fd.unit === 'дн.' ? num1(x) : money(x))
  : fd.type === 'дата' ? fmt(x) : fd.dict === 'dept' ? deptName(x) : String(x);

function scCompose(){
  const s = S(), fl = KB.fields();
  let h = '';
  /* --- вопрос --- */
  h += '<div class="card"><h3>Вопрос</h3>' +
    '<div class="form-row"><div class="fld" style="flex:1"><label>Имя черновика</label>' +
    '<input value="' + esc(s.name) + '" onchange="KB.setName(this.value);render()"></div></div>' +
    '<div class="form-row" style="margin-top:8px"><div class="fld" style="flex:1"><label>Основной объект</label>' +
    '<select onchange="KB.ui.obj(this.value)">' + Object.keys(FIELDS).map(o => '<option value="' + o + '"' + (o === s.object ? ' selected' : '') + '>' +
      esc(FIELDS[o].name) + ' — перечень: ' + esc(FIELDS[o].owner) + '</option>').join('') + '</select></div></div>' +
    '<div class="form-row" style="margin-top:8px"><div class="fld"><label>Режим времени</label><div class="seg">' +
    ['на дату', 'сейчас'].map(m => '<button class="' + (s.mode === m ? 'on' : '') + '" onclick="KB.ui.mode(\'' + m + '\')">' + m + '</button>').join('') +
    '</div></div>';
  if(s.mode === 'на дату') h += '<div class="fld" style="flex:1"><label>Дата состояния</label><select onchange="KB.ui.asOf(this.value)">' +
    SNAPSHOTS.map(d => '<option value="' + d + '"' + (d === s.asOf ? ' selected' : '') + '>' + fmt(d) + ' · снимок · ' + (FIXED[d] ? 'зафиксировано' : 'не зафиксировано') + '</option>').join('') +
    '<option value="' + TODAY + '"' + (s.asOf === TODAY ? ' selected' : '') + '>' + fmt(TODAY) + ' · снимка нет</option></select></div>';
  else h += '<div class="fld"><label>Живой запрос к ядру</label><button class="btn btn-primary" style="height:32px" onclick="kbAct(KB.compute(),\'посчитано по живому состоянию\')">Посчитать</button></div>';
  h += '</div><div class="why">' + (s.mode === 'на дату' ? 'Отвечает статистика по строкам ночного прогона; дата состояния одна на весь ответ.'
    : 'Отвечает ядро живым запросом objectRows; считается по кнопке, чтобы не гонять ядро на каждую галочку.') + '</div></div>';

  /* --- показатели --- */
  const st = KB.statsAvail();
  h += '<div class="card"><h3>Показатели <span class="small">· реестр статистики · ' + st.filter(x => x.on).length + ' из ' + st.length + '</span></h3>';
  h += st.map(m => '<label class="opt' + (m.ok || m.on ? '' : ' off') + '"><input type="checkbox"' + (m.on ? ' checked' : '') + (m.ok || m.on ? '' : ' disabled') +
    ' onchange="kbAct(KB.toggleStat(\'' + m.id + '\'))"><span class="t">' + esc(m.name) +
    (m.ok || m.on ? '<small>' + esc(m.agg) + (m.live ? '' : ' · налету не берётся') + '</small>' : '<small class="no">' + esc(m.why) + '</small>') +
    '</span><span class="u">' + esc(m.unit) + '</span></label>').join('');
  h += '<div class="why">Показатель — величина с объявленным источником и без формулы; своих величин страница не считает (ИО-2).</div></div>';

  /* --- разрезы --- */
  h += '<div class="card"><h3>Разрезы <span class="small">· уровни дерева сверху вниз</span></h3>';
  if(!s.cuts.length) h += '<div class="why">Без разреза ответ — один корень «всего». Добавьте уровень.</div>';
  h += s.cuts.map((c, i) => { const m = CUT(c.id);
    return '<div class="cutrow"><span class="lvl">' + (i + 1) + '</span><span class="nm">' + esc(m.name) + '</span>' +
      (m.buckets ? '<select onchange="kbAct(KB.setBucket(\'' + c.id + '\',this.value))">' + Object.keys(m.buckets).map(b =>
        '<option' + (b === c.bucket ? ' selected' : '') + '>' + esc(b) + '</option>').join('') + '</select>' : '') +
      '<label class="tot"><input type="checkbox"' + (c.total ? ' checked' : '') + ' onchange="kbAct(KB.toggleTotal(\'' + c.id + '\'))"> итог</label>' +
      '<span class="ctl"><button class="btn btn-secondary btn-xs" title="выше" onclick="kbAct(KB.moveCut(\'' + c.id + '\',-1))">↑</button>' +
      '<button class="btn btn-secondary btn-xs" title="ниже" onclick="kbAct(KB.moveCut(\'' + c.id + '\',1))">↓</button>' +
      '<button class="btn btn-secondary btn-xs" title="убрать" onclick="kbAct(KB.removeCut(\'' + c.id + '\'))">×</button></span></div>'; }).join('');
  const ca = KB.cutsAvail();
  h += '<div class="addrow"><select id="addCut">' + ca.map(c => '<option value="' + c.id + '"' + (c.ok ? '' : ' disabled') + '>' + esc(c.name) +
    (c.ok ? (c.buckets ? ' · корзины: ' + Object.keys(c.buckets).join(' / ') : '') : ' — недоступен в режиме «' + s.mode + '»') + '</option>').join('') +
    '</select><button class="btn btn-secondary btn-sm" onclick="kbAct(KB.addCut(document.getElementById(\'addCut\').value))">+ добавить разрез</button></div>';
  ca.filter(c => !c.ok).forEach(c => { h += '<div class="why amb">«' + esc(c.name) + '» ' + esc(c.why) + '</div>'; });
  h += '<div class="why">Корзина огрубляет значение при чтении, строка хранит его как есть. Итог уровня приходит узлом дерева, страница его не складывает (ИО-17).</div></div>';

  /* --- фильтры --- */
  h += '<div class="card"><h3>Фильтры <span class="small">· сужают вопрос; разрез делит ответ</span></h3>';
  h += s.filters.map((f, i) => { const fd = fieldOf(s.object, f.field);
    const ops = OPS[fd.type];
    let vin;
    if(fd.type === 'словарь' && f.op === 'равно') vin = '<select onchange="kbAct(KB.setFilter(' + i + ',{value:this.value}))"><option value="">—</option>' +
      DICTS[fd.dict].map(v => '<option' + (v === f.value ? ' selected' : '') + '>' + esc(v) + '</option>').join('') + '</select>';
    else vin = '<input type="' + (fd.type === 'дата' ? 'date' : 'text') + '" value="' + esc(f.value) + '" placeholder="' +
      (fd.type === 'число' ? (fd.unit || 'число') : fd.type === 'словарь' ? 'через запятую' : fd.type) + '" onchange="kbAct(KB.setFilter(' + i + ',{value:this.value}))">';
    return '<div class="fltrow"><select onchange="kbAct(KB.setFilter(' + i + ',{field:this.value}))">' + fl.fields.map(x =>
        '<option value="' + x.id + '"' + (x.id === f.field ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>' +
      '<select onchange="kbAct(KB.setFilter(' + i + ',{op:this.value}))">' + ops.map(o => '<option' + (o === f.op ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
      vin + '<button class="btn btn-secondary btn-xs" onclick="kbAct(KB.removeFilter(' + i + '))">×</button></div>'; }).join('');
  h += '<div class="addrow"><button class="btn btn-secondary btn-sm" onclick="kbAct(KB.addFilter())">+ добавить фильтр</button>' +
    '<span class="small">операторы — по типу величины: число · дата · текст · словарь</span></div></div>';

  /* --- строки объектов --- */
  h += '<div class="card"><h3>Строки объектов <span class="small">· углубление</span></h3>' +
    '<label class="opt"><input type="checkbox"' + (s.drill.on ? ' checked' : '') + ' onchange="kbAct(KB.setDrill(this.checked))"><span class="t">Показывать строки под последним уровнем' +
    '<small>другой шов (' + (s.mode === 'на дату' ? 'statRows' : 'objectRows') + '), другой объём, поля из публичного перечня</small></span></label>';
  if(s.drill.on){
    const pl = rowPlan(), lv = s.cuts.map(c => CUT(c.id).field);
    const on = x => s.drill.fields.indexOf(x.id) !== -1;
    h += '<div class="small" style="margin-top:8px"><b>Идентификатор и признаки</b> — в первой колонке</div>';
    h += fl.fields.filter(x => x.type !== 'число').map(x => { const isLevel = lv.indexOf(x.id) !== -1;
      return '<label class="opt' + (isLevel ? ' off' : '') + '" style="padding:3px 0"><input type="checkbox"' + (on(x) ? ' checked' : '') +
        (isLevel ? ' disabled' : '') + ' onchange="kbAct(KB.toggleField(\'' + x.id + '\'))"><span class="t">' + esc(x.name) +
        (isLevel ? '<small>стоит уровнем — строка и так под своим узлом, повтор не печатается</small>' : '') +
        '</span><span class="u">' + esc(x.type) + '</span></label>'; }).join('');
    h += '<div class="small" style="margin-top:8px"><b>Величины</b> — колонкой: одна колонка — одна величина</div>';
    h += fl.fields.filter(x => x.type === 'число').map(x => {
      const st = Object.keys(pl.under).find(id => pl.under[id] === x.id);
      if(st) return '<label class="opt" style="padding:3px 0"><input type="checkbox" checked disabled><span class="t">' + esc(x.name) +
        '<small>под колонкой «' + esc(STAT(st).name) + '»: узел — ' + esc(STAT(st).agg) + ', строка — мера</small></span><span class="u">' + esc(x.unit) + '</span></label>';
      const agg = STATS.find(m => m.object === s.object && m.over === x.id && !m.withdrawn);
      return '<label class="opt" style="padding:3px 0"><input type="checkbox"' + (on(x) ? ' checked' : '') + ' onchange="kbAct(KB.toggleField(\'' + x.id + '\'))"><span class="t">' + esc(x.name) +
        '<small>своей колонкой, только строки' + (agg ? ' · включите «' + esc(agg.name) + '» — встанет под него' : ' · показателя над ней в реестре нет') + '</small></span><span class="u">' + esc(x.unit) + '</span></label>'; }).join('');
  }
  h += '</div>';
  return h;
}

function treeRows(a, node, depth, plan){
  const s = S(), cols = a.stats, pl = plan || rowPlan();
  let h = '';
  const ind = '<span class="ind" style="width:' + ((depth - 1) * 18) + 'px"></span>';
  const extraDots = pl.extra.map(() => '<td class="num muted">·</td>').join('');
  h += '<tr class="grp g' + Math.min(depth, 3) + '"><td>' + ind + esc(node.key) + '<span class="cnt">' + esc(FIELDS[s.object].word(node.count)) + '</span></td>' +
    cols.map(id => '<td class="num">' + val(id, node.values[id]) + '</td>').join('') + extraDots + '</tr>';
  if(node.children) node.children.forEach(ch => { h += treeRows(a, ch, depth + 1, pl); });
  else if(s.drill.on && node.rows){
    /* Строка объекта: идентификатор и чипы — в первой колонке; мера — под колонкой своего
       агрегата; поле-уровень не повторяется (волна 22). */
    const fd = f => fieldOf(s.object, f);
    node.rows.forEach(r => {
      const idt = pl.ident.map(f => '<span class="f" title="' + esc(fd(f).name) + '">' + esc(fval(fd(f), r[f])) + '</span>').join('<span class="sep">·</span>');
      const ch = pl.chips.map(f => '<span class="chip" title="' + esc(fd(f).name) + '">' + esc(fval(fd(f), r[f])) + '</span>').join('');
      h += '<tr class="obj"><td>' + (idt || '<span class="f muted">объект</span>') + ch + '</td>' +
        cols.map(id => pl.under[id] ? '<td class="num">' + esc(fval(fd(pl.under[id]), r[pl.under[id]])) + '</td>' : '<td class="num muted">·</td>').join('') +
        pl.extra.map(f => '<td class="num">' + esc(fval(fd(f), r[f])) + '</td>').join('') + '</tr>'; });
  }
  if(node.total) h += '<tr class="gtot"><td>' + ind + 'Итог по «' + esc(node.key) + '»</td>' +
    cols.map(id => '<td class="num"><b>' + val(id, node.values[id]) + '</b></td>').join('') + extraDots + '</tr>';
  return h;
}

function scAnswer(){
  const s = S();
  let h = '';
  s.notices.forEach(n => { h += '<div class="banner ' + n.kind + '">' + esc(n.text) + '</div>'; });
  const a = KB.answer();
  if(!a.ok && !a.answer){
    h += '<div class="banner info"><b>Ответа пока нет.</b> ' + esc(a.why) + '</div>';
    return h + scActions();
  }
  const ans = a.ok ? a : a.answer;
  if(a.stale) h += '<div class="banner warn"><b>Показан прежний расчёт.</b> ' + esc(a.why) + '</div>';
  if(ans.substituted) h += '<div class="banner warn"><b>Дата подставлена.</b> Спрошено ' + esc(fmt(ans.passport.asked)) + ', снимка на эту дату нет; показано состояние на ' +
    esc(fmt(ans.substituted)) + '. Паспорт называет обе даты.</div>';
  const p = ans.passport;
  /* --- шапка показа: отвечает сама за себя (ИО-6) --- */
  h += '<div class="snap"><div class="hd"><b>Личный черновик ' + esc(ME.who) + ' · «' + esc(s.name || 'без имени') + '»</b>' +
    '<span class="pill warn">НЕ ВЫПУСК</span><span class="pill neutral">' + esc(p.short) + '</span></div>' +
    '<div class="row"><span class="k">объект · режим</span>' + esc(FIELDS[s.object].name) + ' · ' + esc(s.mode) + '</div>' +
    '<div class="row"><span class="k">дата состояния</span>' + (p.asOf ? esc(fmt(p.asOf)) + ' — ' + esc(p.age) + (p.asked && p.asked !== p.asOf ? ' <span style="color:var(--asubk-amber)">(спрошено ' + esc(fmt(p.asked)) + ')</span>' : '')
      : 'живое состояние на ' + esc(p.at)) + '</div>' +
    '<div class="row"><span class="k">фиксация</span>' + esc(p.fixed) + '</div>' +
    '<div class="row"><span class="k">область видимости</span>' + esc(p.scopeText) + ' — вам видно ' + esc(FIELDS[s.object].word(p.visible)) +
      (p.hidden ? ', <b>' + p.hidden + ' ' + plural(p.hidden, 'скрыт', 'скрыты', 'скрыты') + ' областью видимости</b>' : '') + '</div>' +
    '<div class="row"><span class="k">показанный состав</span>' + esc(p.shown.stats.join('; ') || '—') + ' · уровни: ' + esc(p.shown.cuts.join(' → ') || 'нет') +
      (p.shown.filters.length ? ' · отбор: ' + esc(p.shown.filters.join('; ')) : '') + (p.shown.drill ? ' · строки: ' + esc(p.shown.drill.join(', ')) : '') + '</div>' +
    '<div class="row"><span class="k">кто отвечает</span>' + esc(p.owner) + ' · швы ' + esc(p.seams.join(' + ')) + '</div>' +
    (p.dedup && p.dedup.length ? '<div class="row"><span class="k">дедуп-ключ</span>' + esc(p.dedup.join('; ')) + ' (ИС-34)</div>' : '') + '</div>';
  /* --- дерево --- */
  /* Шапка сетки: одна колонка — одна величина; у агрегата с мерой под ним подзаголовок
     называет обе породы (волна 22). Колонки «только строки» — для мер без агрегата. */
  const pl = rowPlan(), fdn = f => fieldOf(s.object, f);
  const firstSub = s.drill.on
    ? 'уровни · строки: ' + (pl.ident.concat(pl.chips).map(f => fdn(f).name).join(', ') || 'без идентификатора')
    : 'дерево уровней · число узла — по строкам узла';
  h += '<div class="tblwrap"><table class="cgrid"><thead><tr><th>' + esc(ans.levels.map(l => CUT(l.id).name).join(' → ') || 'всего') +
    '<span class="th-sub">' + esc(firstSub) + '</span></th>' +
    ans.stats.map(id => '<th class="num">' + esc(STAT(id).name) + '<span class="th-sub">' + esc(STAT(id).unit) +
      (s.drill.on && pl.under[id] ? ' · узел — ' + esc(STAT(id).agg.split(' ·')[0]) + ' · строка — ' + esc(fdn(pl.under[id]).name.toLowerCase()) : '') + '</span></th>').join('') +
    (s.drill.on ? pl.extra.map(f => '<th class="num">' + esc(fdn(f).name) + '<span class="th-sub">' + esc(fdn(f).unit || '') + ' · только строки</span></th>').join('') : '') +
    '</tr></thead><tbody>';
  if(!ans.stats.length) h += '<tr><td colspan="9" class="empty">Выберите хотя бы один показатель: без него дерево считает только строки.</td></tr>';
  if(ans.root.children) ans.root.children.forEach(n => { h += treeRows(ans, n, 1, pl); });
  else if(s.drill.on && ans.root.rows) h += treeRows(ans, ans.root, 1, pl);
  h += '<tr class="root"><td>Всего<span class="cnt" style="font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px">' + esc(FIELDS[s.object].word(ans.root.count)) + '</span></td>' +
    ans.stats.map(id => '<td class="num">' + val(id, ans.root.values[id]) + '</td>').join('') +
    (s.drill.on ? pl.extra.map(() => '<td class="num muted">·</td>').join('') : '') + '</tr>';
  h += '</tbody></table></div>';
  if(s.drill.on && pl.skipped.length) h += '<div class="why">' + esc(pl.skipped.map(f => '«' + fdn(f).name + '»').join(', ')) +
    ' в строках не печатается: ' + (pl.skipped.length > 1 ? 'эти поля стоят уровнями' : 'это поле стоит уровнем') + ', и строка уже стоит под своим узлом.</div>';
  if(s.cuts.some(c => CUT(c.id).field === 'dept') && ans.root.children && ans.root.children.length === 1)
    h += '<div class="why">Уровень «подразделение» дал один узел: область видимости сузила мир до вашего департамента. У уполномоченного узлов было бы ' + DEPTS.length + '.</div>';
  return h + scActions();
}

function scActions(){
  const s = S();
  let h = '<div class="card"><h3>Действия с ответом</h3><div class="btn-row">' +
    '<button class="btn btn-secondary btn-sm" onclick="kbAct(KB.saveDraft())">Сохранить черновик</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="kbAct(KB.exportIssue(\'xlsx\'))">Выгрузить xlsx</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="kbAct(KB.exportIssue(\'pdf\'))">Выгрузить pdf</button>' +
    '<button class="btn btn-secondary btn-sm" onclick="kbAct(KB.makeWorklist(S().drill.on ? prompt(\'Имя рабочего списка\', S().name) : \'\'))">Завести рабочий список</button>' +
    '<button class="btn btn-primary btn-sm" onclick="kbAct(KB.askPublish())">Попросить публикации</button></div>' +
    '<div style="margin-top:10px">' +
    '<div class="refuse"><b>Выпустить окончательно</b><span class="no">нельзя:</span><span>у черновика нет получателя и обязательства — окончательный выпуск делается по опубликованной редакции составом по умолчанию (ИО-4, ИО-21)</span></div>' +
    '<div class="refuse"><b>Поставить на дашборд</b><span class="no">нельзя:</span><span>плитка бывает только из объявленного отчёта (ИО-1)</span></div>' +
    '<div class="refuse"><b>Опубликовать</b><span class="no">не вам:</span><span>публикует ' + esc(AUTH.who) + '; шаблоном состав становится публикацией, не сборкой (ADR-0156 §2)</span></div>' +
    '</div></div>';
  /* --- след --- */
  const n = s.drafts.length + s.issues.length + s.worklists.length + (s.asked ? 1 : 0);
  h += '<div class="card"><h3>След <span class="small">· ' + (n ? n + ' ' + plural(n, 'запись', 'записи', 'записей') : 'пока пусто') + '</span></h3><div class="trace">';
  if(s.asked) h += '<div class="it"><span class="id">→</span>черновик «' + esc(s.asked.draft) + '» передан на публикацию: ' + esc(s.asked.to) + ', ' + esc(fmt(s.asked.at)) +
    '<small>до публикации — личный; круг, расписание и основание назовёт публикующий</small></div>';
  s.drafts.forEach(d => { h += '<div class="it"><span class="id">' + esc(d.id) + '</span>черновик «' + esc(d.name) + '» · ' + esc(fmt(d.at)) +
    ' · <a href="#" onclick="kbAct(KB.openDraft(\'' + d.id + '\'));return false">открыть</a><small>виден только вам · ' + esc(FIELDS[d.comp.object].name) + ' · ' + esc(d.comp.mode) + '</small></div>'; });
  s.issues.forEach(it => { h += '<div class="it"><span class="id">' + esc(it.id) + '</span>предварительный выпуск · ' + esc(it.fmt) + ' · ' + esc(it.at) + ' <span class="pill neutral">личный</span>' +
    '<small>паспорт: ' + esc(it.passport.short) + ' · файл до ' + esc(fmt(it.fileUntil)) + ', строка навсегда</small></div>'; });
  s.worklists.forEach(w => { h += '<div class="it"><span class="id">' + esc(w.id) + '</span>рабочий список «' + esc(w.name) + '» · ' + w.count + ' объектов · заморожен выпуском ' + esc(w.issue) +
    (w.closed ? ' <span class="pill neutral">закрыт</span>' : w.dept ? ' <span class="pill info">передан: ' + esc(deptName(w.dept)) + '</span>' : ' <span class="pill ok">мой</span>') +
    '<small>' + (w.closed ? 'читается, не пополняется' : '<a href="#" onclick="kbAct(KB.passWorklist(\'' + w.id + '\'));return false">передать подразделению</a> · <a href="#" onclick="kbAct(KB.closeWorklist(\'' + w.id + '\'));return false">закрыть</a>') + '</small></div>'; });
  if(!n) h += '<div class="small">Сохранённые черновики, личные выпуски и рабочие списки появятся здесь.</div>';
  h += '</div></div>';
  return h;
}

KB.ui = {
  obj: v => { const r = KB.setObject(v); if(r.switched) toast(r.why, 'err'); render(); },
  mode: v => { const r = KB.setMode(v); if(!r.ok) toast(r.why, 'err'); else r.dropped.forEach(d => toast(d.kind + ' «' + d.name + '» снят: ' + d.why, 'err')); render(); },
  asOf: v => { const r = KB.setAsOf(v); if(!r.ok) toast(r.why, 'err'); render(); }
};
window.KB = KB; window.S = S; window.scAnswer = scAnswer; window.kbAct = kbAct;
scDraft = function(){
  const who = '<div class="chip" style="margin-bottom:12px"><span class="who">' + esc(ME.who) + '</span> · ' +
    esc(ME.role) + ' <small>· ' + esc(deptName(ME.dept)) + '</small></span></div>';
  return '<div class="kb"><div class="two"><aside class="compose">' + who + scCompose() +
    '</aside><main class="answer">' + scAnswer() + '</main></div><div class="foot">' +
    '<b>Заглушки соседей в этом файле:</b> реестр показателей и разрезов (статистика) · публичные перечни полей (ядро) · строки среза на ' +
    SNAPSHOTS.map(fmt).join(' и ') + ' (ночной прогон) · живое состояние на ' + fmt(TODAY) + ' (ядро). В жизни всё это приходит швами ' +
    '<span class="mono">statSlice · statRows · objectRows</span>; своих запросов к базе и своих формул у страницы нет (ИО-2, ИО-3). ' +
    'Данные: ' + CREDITS.length + ' кредитов, ' + BORROWERS.length + ' заёмщиков, ' + COLLATERAL.length + ' предметов залога, ' +
    CLAIMS.length + ' требований взыскания — сгенерированы детерминированно; предмет залога и требование в v1 отвечают только «на дату».'; + '</div></div>';
};

})();

/* --------------------------- КАРКАС ЭКРАНА --------------------------- */
const VIEWS = {
  showcase:{title:'Отчётность', fn:scShowcase},
  registry:{title:'Реестр шаблонов', fn:scRegistry},
  draft:   {title:'Конструктор',     fn:scDraft},
  builder: {title:'Редакция и публикация', fn:scBuilder},
  issue:   {title:'Показ и выпуск отчёта', fn:scIssue},
  journal: {title:'Журнал выпусков', fn:scJournal},
  calendar:{title:'Календарь сдачи', fn:scCalendar},
  blank:   {title:'Верстальщик макета бланка', fn:scBlank},
  worklists:{title:'Рабочие списки',  fn:scWorklists},
  dash:    {title:'Дашборд',          fn:scDash},
  seams:   {title:'Швы и соседи',    fn:scSeams},
  bounds:  {title:'Границы макета',  fn:scBounds}
};
function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const el = document.createElement('div');
  el.className = 'toast'+(kind ? ' '+kind : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(() => el.remove(), 7000);
}
function act(res, okMsg){
  if(res && res.ok) toast(okMsg || res.note || 'готово','ok');
  else toast((res && res.why) || 'отказано','err');
  render();
}
RP.go = v => { RP.state.view = v; render(); };
RP.setRole = title => { RP.state.role = title;
  toast('роль: '+title+'; область видимости — '+ROLE(title).scope.map(deptName).join('; '),'ok');
  render(); };
function render(){
  if(typeof document === 'undefined') return;
  const st = RP.state, view = VIEWS[st.view] ? st.view : 'registry';
  document.getElementById('title').textContent = VIEWS[view].title;
  document.getElementById('panel').innerHTML = VIEWS[view].fn();
  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.v === view));
  const sel = document.getElementById('role');
  if(sel.options.length !== ROLE_TITLES.length){
    sel.innerHTML = ROLE_TITLES.map(t => '<option>'+esc(t)+'</option>').join(''); }
  sel.value = st.role;
  const v = RP.viewer(), obl = RP.obligations();
  document.getElementById('foot').innerHTML =
    '<div class="row"><b>'+fmt(st.today)+'</b> — сегодня в макете</div>'+
    '<div class="row">видно: '+esc(v.scope.map(deptName).join('; '))+'</div>'+
    '<div class="row">шаблонов видно: '+RP.visibleTemplates().length+' из '+st.templates.length+'</div>'+
    '<div class="row">выпусков: '+st.issues.length+', просрочено обязательств: '+
      obl.filter(o => o.state === 'просрочено').length+'</div>';
}
RP.seed();
if(typeof window !== 'undefined'){ window.RP = RP; window.SEAM = SEAM; window.act = act;
  window.VIEWS = VIEWS; }
render();
</script>
