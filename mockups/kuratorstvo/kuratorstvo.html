  if (!tails.length) return { ok: false, why: 'за работником нет открытых закреплений — переводить нечего' };
  const took = [];
  tails.forEach(r => {
    const o = KU.obj(r.objId) || {};
    const pick = [KU.headOf(r.unitId), KU.admin()]
      .filter(e => e && e !== empId && !KU.banOn(e, o.borrower, st.today))[0] || KU.admin();
    applyAdj({ objId: r.objId, role: r.role, from: st.today, empId: pick, unitId: r.unitId,
      src: 'перевод', ver: null, by: accessName(), at: 'перевод хвостов при увольнении',
      reason: String(reason).trim() + ' — ' + emp.name + ' сдаёт объект, принимает ' +
        ((KU.emp(pick) || {}).name || pick) });
    took.push(pick);
  });
  logIt('перевод хвостов ' + emp.name + ': ' + tails.length + ' закреплений');
  return { ok: true, moved: tails.length,
    note: 'Переведено одной пачкой: ' + tails.length + ' закреплений ушло к ' +
      took.map(e => (KU.emp(e) || {}).name).filter((x, i, a) => a.indexOf(x) === i).join(', ') +
      '. Записи закрыты вчерашним днём и открыты сегодняшним — журнал без разрыва (ИУ-4).' };
};

/* Демо-тумблер: контракт модуля сотрудников замолчал (ИУ-23). */
KU.setHr = up => { KU.state.hr.up = !!up;
  return { ok: true, note: up ? 'Модуль сотрудников отвечает: замещающих называет он.'
    : 'Модуль сотрудников замолчал. Доступность работников неизвестна — работа уходит заведующим, ' +
      'а не остаётся у закреплённых: молчание трактуется в безопасную сторону (ИУ-23).' }; };

/* -------- ОПЕРАЦИИ ВОЛНЫ 4: справочник признаков и группировок -------- *
 *  Заведующий группировку ВЫБИРАЕТ, но не сочиняет (KU.grpPick). Сочиняет её здесь
 *  администратор кураторства — на весь холдинг, потому что имя доли обязано значить
 *  одно и то же в правиле залогового управления и в правиле областного отдела,
 *  иначе витрины двух подразделений не складываются (ADR-0131).
 * --------------------------------------------------------------------- */

KU.canDict = () => {
  const st = KU.state;
  if (st.role === 'admin') return { ok: true };
  return { ok: false, why: accessName() + ' справочник признаков не правит — только читает. ' +
    'Группировка едина на холдинг: её заводит администратор кураторства' };
};

/* ОБРАТНЫЙ ИНДЕКС: кто на группировку смотрит. Без него снятие было бы слепым —
   ссылка живёт в редакции правила, а не в самой группировке (ИУ-6). */
KU.grpUsage = (featId, grpId) => {
  const out = [];
  KU.state.rules.forEach(r => r.versions.forEach(v => {
    if (KU.grpRef(v, featId) === grpId)
      out.push({ ruleId: r.id, scope: r.scope, unit: r.unit || null, role: r.role,
        ver: v.no, from: v.from, until: v.until });
  }));
  return out;
};
KU.grpUsageAfter = (featId, grpId, day) =>
  KU.grpUsage(featId, grpId).filter(u => u.until == null || u.until >= day);
KU.usageName = u => (u.scope === 'top' ? 'холдинг' : (KU.unit(u.unit) || {}).name || u.unit) +
  ' · ' + ((KU.role(u.role) || {}).name || u.role) + ' (ред. ' + u.ver + ')';

/* Занятые имена долей в пределах признака: имя → группировка, которая его держит.
   «Прочие» служебная и потому общая — её печатают с именем своей группировки. */
KU.grpNames = (featId, exceptId) => {
  const taken = {};
  KU.grpList(featId).forEach(g => {
    if (g.id === exceptId) return;
    g.versions.forEach(v => Object.keys(v.map).forEach(k => { taken[v.map[k]] = g.name; }));
  });
  return taken;
};

/* Состояние группировки на дату — для экрана справочника. */
KU.grpStatus = (featId, grpId, d) => {
  const day = d || KU.state.today;
  const off = KU.grpOff(featId, grpId), first = KU.grpFirst(featId, grpId);
  if (off && day >= off) return { code: 'off', text: 'снята с ' + fmt(off) };
  if (first && day < first) return { code: 'soon', text: 'вступает ' + fmt(first) };
  if (off) return { code: 'going', text: 'снимается с ' + fmt(off) };
  const ver = KU.grpVer(featId, grpId, day);
  return { code: 'live', text: 'действует, редакция ' + (ver ? ver.no : '?') };
};

/* --- черновик группировки: заводится и правится только целиком, до сохранения --- */
KU.grpDraftNew = featId => {
  const st = KU.state, g = KU.canDict(); if (!g.ok) return g;
  const f = KU.feat(featId); if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  if (f.num) return { ok: false,
    why: 'признак «' + f.name + '» числовой — его доли задаёт порогами заведующий в своём правиле, ' +
         'единого холдингового разбиения денег нет' };
  st.grpDraft = { featId: featId, grpId: null, name: '', from: st.today, map: {}, propId: '' };
  return { ok: true, note: 'новая группировка признака «' + f.name + '»: назовите её, ' +
    'выберите дату вступления и разложите значения по долям' };
};
KU.grpDraftVer = (featId, grpId) => {
  const st = KU.state, g = KU.canDict(); if (!g.ok) return g;
  const def = KU.grpDef(featId, grpId); if (!def) return { ok: false, why: 'такой группировки у признака нет' };
  const off = KU.grpOff(featId, grpId);
  if (off) return { ok: false, why: 'группировка «' + def.name + '» снята с ' + fmt(off) +
    ' — снятую не оживляют, заводится новая' };
  const last = KU.grpLast(featId, grpId);
  st.grpDraft = { featId: featId, grpId: grpId, name: def.name,
    from: last.from > st.today ? nextDay(last.from) : st.today,
    map: clone(last.map), propId: '' };
  return { ok: true, note: 'новая редакция группировки «' + def.name + '» — раскладка ' +
    'скопирована с редакции ' + last.no + '; прошлое она не переписывает (ИУ-10, ИУ-11)' };
};
KU.grpDraftDrop = () => { KU.state.grpDraft = null; return { ok: true, note: 'черновик отброшен' }; };
KU.grpDraftSet = (field, val) => {
  const d = KU.state.grpDraft; if (!d) return { ok: false, why: 'черновика нет' };
  if (field === 'name') d.name = String(val || '');
  else if (field === 'from') d.from = String(val || '') || null;
  else return { ok: false, why: 'неизвестное поле' };
  return { ok: true };
};
KU.grpDraftMap = (val, group) => {
  const d = KU.state.grpDraft; if (!d) return { ok: false, why: 'черновика нет' };
  const g = String(group || '').trim();
  if (!g) delete d.map[val]; else d.map[val] = g;
  return { ok: true };
};
KU.grpDraftMapAt = (i, group) => {
  const d = KU.state.grpDraft; if (!d) return { ok: false, why: 'черновика нет' };
  const dom = KU.dom(d.featId);
  if (i < 0 || i >= dom.length) return { ok: false, why: 'такого значения в домене нет' };
  return KU.grpDraftMap(dom[i], group);
};
/* ПРЕДЗАПОЛНЕНИЕ ИЗ КОЛОНКИ СПРАВОЧНИКА-ИСТОЧНИКА. Раскладка списывается один раз и
   дальше живёт своей жизнью: связь не хранится. Иначе чужая правка в чужом справочнике
   задним числом переписывала бы наши прошлые ответы (ИУ-11). */
KU.grpDraftFill = propId => {
  const d = KU.state.grpDraft; if (!d) return { ok: false, why: 'черновика нет' };
  const p = KU.propDef(d.featId, propId);
  if (!p) return { ok: false, why: 'такой колонки у справочника-источника нет' };
  d.map = clone(p.map); d.propId = propId;
  if (!String(d.name || '').trim()) d.name = 'По колонке ' + p.name;
  const dom = KU.dom(d.featId), loose = dom.filter(x => !d.map[x]);
  /* Колонку могли уже развернуть в группировку раньше — тогда её имена долей заняты,
     и это видно сразу, а не отказом при сохранении. */
  const taken = KU.grpNames(d.featId, d.grpId), parts = [];
  Object.keys(d.map).forEach(k => { if (parts.indexOf(d.map[k]) < 0) parts.push(d.map[k]); });
  const clash = parts.filter(x => taken[x]);
  return { ok: true, clash: clash.length, note: 'раскладка списана с колонки «' + p.name + '» (' + p.from + '): ' +
    'значений разложено ' + (dom.length - loose.length) + ' из ' + dom.length +
    (loose.length ? ', в «' + KU.OTHER + '» уйдут: ' + loose.join(', ') : '') +
    '. Дальше правьте руками — связь с колонкой не хранится' +
    (clash.length ? '. ВНИМАНИЕ: доли ' + clash.map(x => '«' + x + '»').join(', ') +
      ' уже заняты группировкой «' + taken[clash[0]] + '» — эту колонку по признаку уже разворачивали, ' +
      'переименуйте доли или возьмите готовую группировку' : '') };
};

/* ОСИРОТЕВШИЕ ЯЧЕЙКИ: новая редакция убрала долю, а на неё в правилах уже назначен
   человек. Имя ячейки не переносится молча — за заведующего никто не выбирает (ИУ-8). */
KU.grpOrphans = (featId, grpId, map, from) => {
  const parts = [KU.OTHER];
  Object.keys(map).forEach(k => { if (parts.indexOf(map[k]) < 0) parts.push(map[k]); });
  const out = [];
  KU.state.rules.forEach(r => {
    const v = KU.verAt(r, from) || r.versions[r.versions.length - 1];
    if (!v || KU.grpRef(v, featId) !== grpId) return;
    const i = v.key.indexOf(featId); if (i < 0) return;
    const lost = Object.keys(v.cells).filter(c => parts.indexOf(String(c).split(' | ')[i]) < 0);
    if (lost.length) out.push({ ruleId: r.id, scope: r.scope, unit: r.unit || null,
      role: r.role, ver: v.no, cells: lost });
  });
  return out;
};

function taskFor(o, featName, grpName, from) {
  const st = KU.state;
  const to = o.scope === 'top' ? KU.admin() : KU.headOf(o.unit);
  st.tasks.push({ id: 't' + (st.tseq++), unit: o.scope === 'top' ? null : o.unit,
    to: to, ruleId: o.ruleId, role: o.role, cells: o.cells.slice(), due: from,
    made: st.today, by: accessName(), done: false,
    text: 'группировка «' + grpName + '» признака «' + featName + '» с ' + fmt(from) +
      ' больше не называет ' + (o.cells.length === 1 ? 'долю' : 'доли') + ' ' +
      o.cells.map(c => '«' + c + '»').join(', ') + ' — пересоберите ячейки до ' + fmt(from) +
      ', иначе объекты уйдут по фолбэк-лестнице (ИУ-8)' });
}

KU.grpSave = () => {
  const st = KU.state, gate = KU.canDict(); if (!gate.ok) return gate;
  const d = st.grpDraft; if (!d) return { ok: false, why: 'черновика нет' };
  const f = KU.feat(d.featId); if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  const name = String(d.name || '').trim();
  if (!name) return { ok: false, why: 'у группировки нет имени' };
  const from = d.from;
  if (!from) return { ok: false, why: 'дата вступления не выбрана' };
  /* Первая редакция не раньше сегодня — та же граница, что у редакции правила (ИУ-10).
     Иначе группировка отвечала бы на даты, когда её ещё не существовало. */
  if (from < st.today) return { ok: false,
    why: 'дата вступления ' + fmt(from) + ' в прошлом — справочник вводится сегодняшним днём или позже (ИУ-10)' };

  const dom = KU.dom(d.featId), map = {};
  dom.forEach(x => { const g = String((d.map || {})[x] || '').trim(); if (g) map[x] = g; });
  const parts = [];
  Object.keys(map).forEach(k => { if (parts.indexOf(map[k]) < 0) parts.push(map[k]); });
  if (!parts.length) return { ok: false,
    why: 'раскладка пуста — все значения ушли бы в «' + KU.OTHER + '», а такая группировка ничего не режет' };
  const sys = parts.filter(p => p === KU.OTHER || p === KU.NOGRP);
  if (sys.length) return { ok: false,
    why: 'долю «' + sys[0] + '» заводит система, а не администратор: она есть в каждой группировке ' +
         'и держит значения, не отнесённые ни к одной доле (ИУ-9)' };
  const taken = KU.grpNames(d.featId, d.grpId);
  const clash = parts.filter(p => taken[p]);
  if (clash.length) return { ok: false,
    why: 'доля «' + clash[0] + '» уже занята группировкой «' + taken[clash[0]] + '» того же признака: ' +
         'одно имя — один смысл, иначе витрины двух подразделений не складываются' };

  /* --- новая группировка целиком --- */
  if (!d.grpId) {
    if (KU.grpList(d.featId).some(g => g.name === name))
      return { ok: false, why: 'группировка «' + name + '» у признака «' + f.name + '» уже заведена' };
    const id = 'g_' + d.featId + '_n' + (st.gseq++);
    f.grp = f.grp || [];
    f.grp.push({ id: id, name: name, by: accessName(),
      versions: [{ no: 1, from: from, until: null, map: map }] });
    st.grpDraft = null; st.grpOpen = id;
    logIt('заведена группировка «' + name + '» признака «' + f.name + '» с ' + fmt(from));
    const loose = dom.filter(x => !map[x]);
    return { ok: true, id: id, parts: parts.length,
      note: 'группировка «' + name + '» вступает ' + fmt(from) + ': долей ' + parts.length +
        ' + служебная «' + KU.OTHER + '»' +
        (loose.length ? ' (в неё сейчас попадают: ' + loose.join(', ') + ')' : ' (сейчас пустая)') +
        '. Заведующие увидят её в выборе у правил, вступающих с ' + fmt(from) + ' и позже' };
  }

  /* --- новая редакция существующей --- */
  const def = KU.grpDef(d.featId, d.grpId);
  if (!def) return { ok: false, why: 'такой группировки у признака нет' };
  const off = KU.grpOff(d.featId, d.grpId);
  if (off) return { ok: false, why: 'группировка «' + def.name + '» снята с ' + fmt(off) +
    ' — снятую не оживляют, заводится новая' };
  const last = KU.grpLast(d.featId, d.grpId);
  if (last.from >= from) return { ok: false,
    why: 'редакция ' + last.no + ' вступает ' + fmt(last.from) + ' — новая раньше вступить не может' };
  if (JSON.stringify(map) === JSON.stringify(last.map) && name === def.name)
    return { ok: false, why: 'раскладка та же — редакция не нужна' };

  const orph = KU.grpOrphans(d.featId, d.grpId, map, from);
  last.until = prevDay(from);
  def.name = name;
  def.versions.push({ no: last.no + 1, from: from, until: null, map: map, by: accessName() });
  orph.forEach(o => taskFor(o, f.name, name, from));
  st.grpDraft = null; st.grpOpen = d.grpId;
  logIt('редакция ' + (last.no + 1) + ' группировки «' + name + '» признака «' + f.name + '» с ' + fmt(from) +
    (orph.length ? '; осиротело ячеек ' + orph.reduce((n, o) => n + o.cells.length, 0) : ''));
  const lostCells = orph.reduce((n, o) => n + o.cells.length, 0);
  return { ok: true, ver: last.no + 1, orphans: lostCells, rules: orph.length,
    note: 'редакция ' + (last.no + 1) + ' вступает ' + fmt(from) + ': долей ' + parts.length +
      ' + служебная «' + KU.OTHER + '». Прошлые ответы не изменились (ИУ-10, ИУ-11)' +
      (lostCells ? '. Осиротело названных ячеек: ' + lostCells + ' в правилах ' + orph.length +
        ' — задачи ушли их владельцам со сроком ' + fmt(from) + '; не успеют — сработает фолбэк (ИУ-8)'
      : '. Названных ячеек не задето') };
};

/* СНЯТИЕ. Удаления нет: прошлые ответы обязаны воспроизводиться и через десять лет (ИУ-11).
   Группировка закрывается датой, и то лишь если после неё на неё никто не смотрит. */
KU.grpRetire = (featId, grpId, from) => {
  const st = KU.state, gate = KU.canDict(); if (!gate.ok) return gate;
  const def = KU.grpDef(featId, grpId); if (!def) return { ok: false, why: 'такой группировки у признака нет' };
  if (!from) return { ok: false, why: 'дата снятия не выбрана' };
  if (from < st.today) return { ok: false,
    why: 'дата снятия ' + fmt(from) + ' в прошлом — снимается сегодняшним днём или позже (ИУ-10)' };
  const was = KU.grpOff(featId, grpId);
  if (was) return { ok: false, why: 'группировка «' + def.name + '» уже снята с ' + fmt(was) };
  const last = KU.grpLast(featId, grpId);
  if (last.from >= from) return { ok: false,
    why: 'редакция ' + last.no + ' вступает ' + fmt(last.from) + ' — снять раньше нельзя' };
  const hold = KU.grpUsageAfter(featId, grpId, from);
  if (hold.length) return { ok: false,
    why: 'на группировку «' + def.name + '» после ' + fmt(from) + ' смотрят: ' +
         hold.map(KU.usageName).join('; ') +
         ' — сначала их владельцы переводят ключ на другую группировку, потом снятие' };
  last.until = prevDay(from);
  logIt('группировка «' + def.name + '» признака «' + (KU.feat(featId) || {}).name + '» снята с ' + fmt(from));
  return { ok: true, note: 'группировка «' + def.name + '» снята с ' + fmt(from) +
    '. Ответы на прошлые даты не изменились — редакции остались в справочнике (ИУ-10, ИУ-11). ' +
    'Сослаться на неё редакция правила, вступающая ' + fmt(from) + ' и позже, больше не сможет' };
};

/* Задачи «пересоберите ячейки»: их видит тот, кто держит задетое правило. */
KU.myTasks = () => {
  const st = KU.state;
  return st.tasks.filter(t => !t.done && (st.role === 'admin' ? t.unit == null
    : st.role === 'head' ? t.unit === st.headUnit : false));
};
KU.taskDone = id => {
  const t = KU.state.tasks.find(x => x.id === id);
  if (!t) return { ok: false, why: 'такой задачи нет' };
  t.done = true;
  return { ok: true, note: 'задача снята' };
};

/* ============================== ЭКРАНЫ =============================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
/* значение ячейки едет в onclick одинарной кавычкой: экранируем и её, и разметку */
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
  .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/&(?!quot;|lt;)/g, '&amp;');

KU.go       = v => { KU.state.view = v; KU.state.openCell = null; KU.state.openObj = null; render(); };
KU.setRole  = r => { KU.state.role = r; KU.state.keyDraft = null; KU.state.preview = null; render(); };
KU.setHeadUnit = u => { KU.state.headUnit = u; KU.state.recUnit = u; KU.state.preview = null; render(); };
KU.pickRec  = (roleId, unitId) => {
  if (roleId) KU.state.recRole = roleId;
  if (unitId) KU.state.recUnit = unitId;
  KU.state.preview = null; render();
};
KU.toggleObj = (objId, roleId) => {
  const k = objId + '‖' + roleId;
  KU.state.openObj = KU.state.openObj === k ? null : k;
  render();
};
KU.toggleHand = hId => {
  KU.state.openHand = KU.state.openHand === hId ? null : hId;
  render();
};
/* Обёртки экрана: значения читаются из полей формы, дальше — те же операции. */
const fieldVal = id => { const el = typeof document === 'undefined' ? null : document.getElementById(id);
  return el ? el.value : ''; };
KU.uiAccept   = hId => act(KU.handoffAccept(hId, fieldVal('hEmp_' + hId), fieldVal('hWhy_' + hId)));
KU.uiReject   = hId => act(KU.handoffReject(hId, fieldVal('hWhy_' + hId)));
KU.uiSend     = (objId, roleId) => act(KU.handoffSend(objId, roleId,
  fieldVal('sUnit_' + objId), fieldVal('sWhy_' + objId)));
KU.uiByHand   = (objId, roleId) => act(KU.assignByHand(objId, roleId,
  fieldVal('aEmp_' + objId), fieldVal('aFrom_' + objId), fieldVal('aWhy_' + objId)));
KU.uiFeature  = (objId, featId) => act(KU.setFeature(objId, featId, fieldVal('fVal_' + objId)));
/* волна 3 */
KU.uiBanAdd   = () => act(KU.banAdd(fieldVal('bEmp'), fieldVal('bBor'), fieldVal('bFrom'),
  fieldVal('bInit'), fieldVal('bNo'), fieldVal('bND'), fieldVal('bText')));
KU.uiBanLift  = id => act(KU.banLift(id, fieldVal('lD_' + id), fieldVal('lWhy_' + id)));
KU.uiTails    = () => act(KU.moveTails(KU.state.gateEmp, fieldVal('tWhy')));
KU.pickGate   = e => { KU.state.gateEmp = e; render(); };
KU.pickBan    = (empId, borrower) => {
  if (empId) KU.state.banEmp = empId;
  if (borrower) KU.state.banBor = borrower;
  render();
};
KU.uiHr       = up => act(KU.setHr(up === 'true' || up === true));
KU.setAsOf  = d => { KU.state.asOf = d; render(); };
KU.setStep  = s => { KU.state.step = s; KU.state.openCell = null; KU.state.keyDraft = null;
  KU.state.versOpen = false; render(); };
KU.pickRole = r => {
  KU.state.polRole = r; KU.state.openCell = null; KU.state.keyDraft = null; KU.state.versOpen = false;
  const us = unitsForRole(r);
  if (us.indexOf(KU.state.polUnit) < 0) KU.state.polUnit = us[0] || null;
  render();
};
KU.pickUnit = u => { KU.state.polUnit = u; KU.state.openCell = null; KU.state.keyDraft = null;
  KU.state.versOpen = false; render(); };
KU.toggleCell = (ruleId, cell) => {
  const k = ruleId + '‖' + cell;
  KU.state.openCell = KU.state.openCell === k ? null : k;
  render();
};
/* История редакций живёт в выдвижной панели: на экране она справочная, а не рабочая. */
KU.toggleVers = on => { KU.state.versOpen = !!on; render(); };

const TITLES = { feat: 'Признаки и группировки', pol: 'Политика распределения',
  rec: 'Пересчёт', hand: 'Передачи', show: 'Витрины', off: 'Отстранения' };
const AS_OF = ['2024-06-01', '2026-02-28', '2026-03-01', TODAY];

/* Подразделения, до которых роль доезжает правилом холдинга, плюс те, у кого есть своё
   правило подразделения: объект приходит в отдел и передачей, а правило отдела при этом
   должно быть видно заведующему (ИУ-12). */
function unitsForRole(roleId) {
  const v = KU.verAt(KU.topRule(roleId), KU.state.asOf);
  const set = [];
  if (v) Object.keys(v.cells).forEach(c => {
    const u = v.cells[c];
    if (u && set.indexOf(u) < 0) set.push(u);
  });
  KU.state.rules.forEach(r => {
    if (r.scope === 'low' && r.role === roleId && set.indexOf(r.unit) < 0) set.push(r.unit);
  });
  return set;
}

function render() {
  if (typeof document === 'undefined') return;   // без DOM рисовать нечего (смоук)
  const st = KU.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  $('#title').textContent = TITLES[st.view];
  $('#role').innerHTML = ACCESS.map(a =>
    `<option value="${a.id}"${a.id === st.role ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
  $('#asOf').innerHTML = AS_OF.map(d =>
    `<option value="${d}"${d === st.asOf ? ' selected' : ''}>${fmt(d)}${d === st.today ? ' · сегодня' : ''}</option>`).join('');
  $('#headWrap').innerHTML = st.role === 'head'
    ? `<label>Отдел</label><select onchange="KU.setHeadUnit(this.value)">${UNITS.map(u =>
        `<option value="${u.id}"${u.id === st.headUnit ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`
    : '';
  const queue = st.handoffs.filter(h => h.state === 'в очереди').length;
  const qc = document.getElementById('qCnt');
  if (qc) qc.textContent = queue ? 'в очереди ' + queue : '';
  const live = KU.bansOf(st.asOf).filter(b => b.live).length;
  const bc = document.getElementById('banCnt');
  if (bc) bc.textContent = live ? 'действует ' + live : '';
  const mine = KU.myTasks().length;
  const tc = document.getElementById('tCnt');
  if (tc) tc.textContent = mine ? 'задач ' + mine : '';
  const fb = KU.fallbacks(st.asOf), over = fb.filter(f => f.overdue);
  $('#foot').innerHTML = `${esc((byId(ACCESS, st.role) || {}).who)}${st.role === 'head'
      ? ' · ' + esc((KU.unit(st.headUnit) || {}).name) : ''}<br>
    Объектов ${st.objects.filter(o => o.born <= st.asOf).length} · записей в журнале ${st.journal.length}<br>
    Держится фолбэком <b>${fb.length}</b>, дольше порога <b>${over.length}</b>.<br>
    Отстранений действует <b>${live}</b>, подмен на ${fmt(st.asOf)} <b>${KU.substitutions(st.asOf).length}</b>.`;
  $('#panel').innerHTML =
    st.view === 'feat' ? viewDict()
    : st.view === 'pol'  ? viewPolicy()
    : st.view === 'rec'  ? viewRecalc()
    : st.view === 'hand' ? viewHandoffs()
    : st.view === 'off'  ? viewBans()
    : viewStub(st.view);
}
KU.render = render;

function toast(msg, kind) {
  if (typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if (!w) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function act(res, okMsg) {
  if (res && res.ok) toast(res.note || okMsg || 'готово', 'ok');
  else toast((res && res.why) || 'отказано', 'err');
  render();
}

/* ------------------ ЭКРАН: ПРИЗНАКИ И ГРУППИРОВКИ --------------------
   Справочник, а не настройка правила: здесь живут доли, на которые правила
   только ССЫЛАЮТСЯ. Виден всем на чтение — заведующему надо понимать, что
   он выбирает; правят его руки одного администратора кураторства (ADR-0131). */

KU.pickFeat = featId => { const st = KU.state;
  st.featSel = featId; st.grpOpen = null; st.grpDraft = null; st.offDate = null; render(); };
KU.toggleGrp = grpId => { const st = KU.state;
  st.grpOpen = (st.grpOpen === grpId) ? null : grpId; st.offDate = null; render(); };
KU.setOffDate = d => { KU.state.offDate = d || null; render(); };

function viewDict() {
  const st = KU.state;
  const gate = KU.canDict();
  const featId = st.featSel || (KU.feats()[0] || {}).id;
  const f = KU.feat(featId);
  if (!f) return '<div class="banner danger">Справочник признаков пуст.</div>';

  const head = `
    <div class="rolebar">${KU.feats().map(x => {
      const n = KU.grpList(x.id).filter(g => !KU.grpOff(x.id, g.id)).length;
      return `<button class="${x.id === featId ? 'on' : ''}" onclick="KU.pickFeat('${x.id}')"
        title="${esc(x.name)}${x.num ? ' · доли задаёт порогами владелец правила'
          : ' · значений ' + (x.domain || []).length + ' · группировок ' + n}">
        ${esc(x.name)}${x.num ? '<span class="muted">пороги</span>'
          : n ? `<span class="muted">${n}</span>` : ''}</button>`;
    }).join('')}</div>
    ${gate.ok ? '' : `<div class="banner info">${esc(gate.why)}. Экран открыт на чтение: так видно,
      что стоит за долей, которую вы выбираете в своём правиле.</div>`}`;

  /* ЧИСЛОВОЙ ПРИЗНАК сюда не относится: его доли — пороги, и они живут в редакции правила,
     потому что единого холдингового разбиения денег нет (ADR-0131). */
  if (f.num) return head + `
    <div class="card">
      <div class="card-head"><h3>${esc(f.name)} <span class="pill neutral">числовой</span></h3></div>
      <div class="kv">
        <div class="k">Источник</div><div class="v">${esc(f.src === 'borrower' ? 'заёмщик' : 'сам объект')}</div>
        <div class="k">Единица</div><div class="v">${esc(f.unit || '—')}</div>
        <div class="k">Пороги по умолчанию</div><div class="v">${(f.cutsDefault || []).map(KU.fmtNum).join(' · ') || '—'}</div>
        <div class="k">Виды объектов</div><div class="v">${esc((f.obj || []).map(k => KU.kind(k).name).join(', '))}</div>
      </div>
      <div class="note">Группировок у числового признака нет и быть не может: доли задаёт порогами
        владелец правила в своей редакции. Единого разбиения денег по холдингу не объявляется —
        областной отдел и управление режут суммы по-разному, и это не расхождение, а разная работа.</div>
    </div>`;

  const dom = KU.dom(featId);
  const list = KU.grpList(featId);
  const props = KU.propList(featId);

  const grpRows = list.map(g => {
    const s = KU.grpStatus(featId, g.id, st.asOf);
    const use = KU.grpUsage(featId, g.id);
    const ver = KU.grpVer(featId, g.id, st.asOf) || KU.grpLast(featId, g.id);
    const parts = [];
    Object.keys(ver.map).forEach(k => { if (parts.indexOf(ver.map[k]) < 0) parts.push(ver.map[k]); });
    const open = st.grpOpen === g.id;
    const row = `<tr class="${s.code === 'off' ? 'hole' : ''}">
      <td><a class="linky" onclick="KU.toggleGrp('${g.id}')">${esc(g.name)}</a></td>
      <td>${g.versions.length}</td>
      <td>${fmt(KU.grpFirst(featId, g.id))}</td>
      <td>${parts.length} + «${esc(KU.OTHER)}»</td>
      <td>${use.length ? esc(use.length + ' ред. правил') : '<span class="muted">никто</span>'}</td>
      <td><span class="pill ${s.code === 'live' ? 'ok' : s.code === 'soon' ? 'info'
        : s.code === 'going' ? 'warn' : 'neutral'}">${esc(s.text)}</span></td></tr>`;
    if (!open) return row;

    /* РАЗВЁРНУТАЯ ГРУППИРОВКА: редакции, действующая раскладка, обратный индекс и снятие. */
    const vers = g.versions.map(x => `<tr>
      <td>${x.no}</td><td>${fmt(x.from)}</td><td>${x.until ? fmt(x.until) : '—'}</td>
      <td>${esc(Object.keys(x.map).map(k => x.map[k]).filter((y, i, a) => a.indexOf(y) === i).join(', '))}</td>
      <td>${esc(x.by || '—')}</td></tr>`).join('');
    const loose = dom.filter(x => !ver.map[x]);
    const layout = `<table class="cgrid"><thead><tr><th>Значение</th><th>Доля</th></tr></thead><tbody>
      ${dom.map(val => `<tr${ver.map[val] ? '' : ' class="hole"'}><td>${esc(val)}</td>
        <td>${esc(ver.map[val] || KU.OTHER)}</td></tr>`).join('')}
      <tr class="hole"><td class="muted">всё, что заведут в справочнике позже</td>
        <td>${esc(KU.OTHER)}</td></tr></tbody></table>`;
    const useTbl = use.length
      ? `<table class="cgrid"><thead><tr><th>Правило</th><th>Редакция</th><th>Действует</th></tr></thead><tbody>
          ${use.map(u => `<tr><td>${esc(KU.usageName(u))}</td><td class="mono">${esc(u.ruleId)}</td>
            <td>${fmt(u.from)} — ${u.until ? fmt(u.until) : '—'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="note">На эту группировку не ссылается ни одна редакция ни одного правила — снять её можно хоть сегодня.</div>';
    const off = KU.grpOff(featId, g.id);
    const retire = (gate.ok && !off) ? `
      <div class="form-row" style="margin-top:12px">
        <div class="fld"><label>Снять с даты</label>
          <input type="date" min="${st.today}" value="${st.offDate || ''}"
            onchange="KU.setOffDate(this.value)"></div>
        <button class="btn btn-secondary" onclick="act(KU.grpRetire('${featId}','${g.id}',KU.state.offDate))">
          Снять группировку</button>
        <button class="btn btn-secondary" onclick="act(KU.grpDraftVer('${featId}','${g.id}'))">
          Новая редакция раскладки</button>
      </div>
      <div class="note">Удаления нет: редакции остаются в справочнике навсегда, иначе прошлый ответ
        перестанет воспроизводиться (ИУ-11). Снятие лишь закрывает группировку датой — и только если
        после неё на группировку никто не смотрит.</div>` : '';

    return row + `<tr class="sub"><td colspan="6">
      <div class="section-h">Редакции группировки «${esc(g.name)}»</div>
      <table class="cgrid"><thead><tr><th>№</th><th>С</th><th>По</th><th>Доли</th><th>Кто завёл</th></tr></thead>
        <tbody>${vers}</tbody></table>
      <div class="section-h">Раскладка на ${fmt(st.asOf)}${off ? ' · последняя перед снятием' : ''}</div>
      ${layout}
      ${loose.length ? `<div class="note">В «${esc(KU.OTHER)}» сейчас попадают: ${esc(loose.join(', '))}.</div>` : ''}
      <div class="section-h">Кто на неё смотрит</div>
      ${useTbl}
      ${retire}
    </td></tr>`;
  }).join('');

  /* ЧЕРНОВИК. Раскладка набирается руками; из колонки справочника-источника её можно
     списать одним нажатием — но списать, а не привязать: связь не хранится (ИУ-11). */
  const d = (st.grpDraft && st.grpDraft.featId === featId) ? st.grpDraft : null;
  let draftBox = '';
  if (d) {
    const parts = [];
    dom.forEach(x => { const g = String(d.map[x] || '').trim(); if (g && parts.indexOf(g) < 0) parts.push(g); });
    const loose = dom.filter(x => !String(d.map[x] || '').trim());
    const orph = d.grpId ? KU.grpOrphans(featId, d.grpId, d.map, d.from || st.today) : [];
    const lost = orph.reduce((n, o) => n + o.cells.length, 0);
    const taken = KU.grpNames(featId, d.grpId), clash = parts.filter(x => taken[x]);
    draftBox = `
      <div class="card">
        <div class="card-head"><h3>${d.grpId ? 'Новая редакция группировки' : 'Новая группировка'}
          <span class="pill info">черновик</span></h3>
          <button class="btn btn-secondary btn-sm" onclick="act(KU.grpDraftDrop())">Отбросить</button></div>
        <div class="form-row">
          <div class="fld"><label>Имя группировки</label>
            <input value="${esc(d.name)}" placeholder="например, по подвижности"
              onchange="KU.grpDraftSet('name',this.value)"></div>
          <div class="fld"><label>Вступает с</label>
            <input type="date" min="${st.today}" value="${esc(d.from || '')}"
              onchange="KU.grpDraftSet('from',this.value)"></div>
          ${props.length ? `<div class="fld"><label>Списать раскладку с колонки источника</label>
            <select onchange="act(KU.grpDraftFill(this.value))">
              <option value="">— набрать руками —</option>
              ${props.map(p => `<option value="${p.id}"${p.id === d.propId ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}
            </select></div>` : ''}
        </div>
        <div class="section-h">Раскладка · долей ${parts.length} + служебная «${esc(KU.OTHER)}»</div>
        <table class="cgrid"><thead><tr><th>Значение домена</th><th>Доля</th></tr></thead><tbody>
          ${dom.map((val, i) => `<tr${d.map[val] ? '' : ' class="hole"'}>
            <td>${esc(val)}</td>
            <td><input list="grpParts" value="${esc(d.map[val] || '')}" placeholder="${esc(KU.OTHER)}"
              onchange="KU.grpDraftMapAt(${i},this.value)"></td></tr>`).join('')}
        </tbody></table>
        <datalist id="grpParts">${parts.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
        ${loose.length ? `<div class="note">Не разложено ${loose.length}: ${esc(loose.join(', '))} —
          они уйдут в «${esc(KU.OTHER)}». Это не ошибка: доля «${esc(KU.OTHER)}» есть в каждой
          группировке и держит всё, что заведут в справочнике потом (ИУ-9).</div>` : ''}
        ${clash.length ? `<div class="banner danger">Доли ${esc(clash.map(x => '«' + x + '»').join(', '))}
          уже заняты группировкой «${esc(taken[clash[0]])}» того же признака. Имя доли значит одно и то же
          во всех правилах холдинга — переименуйте или возьмите готовую группировку.</div>` : ''}
        ${lost ? `<div class="banner warn"><b>Осиротеет названных ячеек: ${lost}</b> в правилах:
          ${esc(orph.map(o => KU.usageName({ scope: o.scope, unit: o.unit, role: o.role, ver: o.ver })).join('; '))}.
          Сохранить можно — но каждому владельцу уйдёт задача «пересоберите ячейки до ${fmt(d.from)}».
          Не успеет — объекты этих ячеек уедут по фолбэк-лестнице к заведующему (ИУ-8).</div>` : ''}
        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn-primary" onclick="act(KU.grpSave())">
            Сохранить${lost ? ' · задетых правил ' + orph.length : ''}</button>
        </div>
      </div>`;
  }

  const kinds = (f.obj || []).map(k => KU.kind(k).name.toLowerCase()).join(', ');
  return head + `
    <div class="card">
      <div class="card-head"><h3>${esc(f.name)}</h3>
        ${gate.ok && !d ? `<button class="btn btn-primary btn-sm"
          onclick="act(KU.grpDraftNew('${featId}'))">Завести группировку</button>` : ''}</div>
      <div class="kv">
        <div class="k">Источник значения</div><div class="v">${esc(f.src === 'borrower' ? 'заёмщик' : 'сам объект')}${
          f.srcBy ? ' · ' + esc(Object.keys(f.srcBy).map(k => KU.kind(k).name.toLowerCase() + ': ' +
            (f.srcBy[k] === 'self' ? 'сам объект' : 'заёмщик')).join(', ')) : ''}</div>
        <div class="k">Виды объектов</div><div class="v">${esc(kinds)}</div>
        <div class="k">Значений в домене</div><div class="v">${dom.length}</div>
        <div class="k">Колонки источника</div><div class="v">${props.length
          ? esc(props.map(p => p.name + ' (' + p.from + ')').join(' · '))
          : '<span class="muted">не объявлены — раскладка только руками</span>'}</div>
      </div>
      <div class="section-h">Группировки признака</div>
      ${list.length ? `<table class="cgrid">
        <thead><tr><th>Имя</th><th>Ред.</th><th>С</th><th>Долей</th><th>Ссылок</th><th>Состояние на ${fmt(st.asOf)}</th></tr></thead>
        <tbody>${grpRows}</tbody></table>`
      : '<div class="note">Готовых группировок нет — в ключе этот признак режется доменом, каждое значение своей долей.</div>'}
      <div class="note">Имя доли уникально в пределах признака: «Недвижимое» в правиле управления
        и «Недвижимое» в правиле областного отдела — одно и то же, иначе витрины двух подразделений
        не складываются. Служебная «${esc(KU.OTHER)}» — исключение: она есть в каждой группировке
        и печатается с именем своей.</div>
    </div>
    ${draftBox}`;
}

/* ------------------- ЭКРАН: ПОЛИТИКА РАСПРЕДЕЛЕНИЯ -------------------
   Экран рабочий, не объяснительный: сверху правило и роль, ниже карточка
   редакции и таблица ячеек. Объяснений на экране нет вовсе — модель описана
   в постановке и в ADR-0117; здесь только то, чем работают. История редакций —
   в выдвижной панели: она справочная, а не рабочая. */

/* Тревога на пилюле роли: тот же счёт, что в колонке «Состояние», но по всему правилу —
   больное правило видно, не открывая его. '' спокойно · warn пустые в сроке · err нет
   правила либо пустая ячейка держится дольше порога. */
function roleAlarm(roleId) {
  const st = KU.state;
  const rule = st.step === 'top'
    ? KU.topRule(roleId)
    : KU.lowRule(unitsForRole(roleId).indexOf(st.polUnit) >= 0 ? st.polUnit : unitsForRole(roleId)[0], roleId);
  if (!rule) return 'err';
  const cov = KU.coverage(rule, st.asOf);
  if (!cov.holesHot.length) return '';
  const sla = KU.kind(KU.role(roleId).kind).sla;
  const over = cov.holesHot.some(c => KU.cellObjects(rule, c, st.asOf)
    .some(o => workdays(o.born, st.asOf) > sla));
  return over ? 'err' : 'warn';
}

function viewPolicy() {
  const st = KU.state;
  const role = KU.role(st.polRole), kind = KU.kind(role.kind);
  const rule = st.step === 'top' ? KU.topRule(st.polRole) : KU.lowRule(st.polUnit, st.polRole);
  const guard = KU.canEdit(rule);
  const units = unitsForRole(st.polRole);

  const head = `
    <div class="btn-row" style="margin:0 0 14px">
      <button class="btn btn-secondary ${st.step === 'top' ? 'on' : ''}" onclick="KU.setStep('top')"
        title="Верхняя ступень · объект и роль → подразделение. Владелец — администратор кураторства.">
        Правило холдинга</button>
      <button class="btn btn-secondary ${st.step === 'low' ? 'on' : ''}" onclick="KU.setStep('low')"
        title="Нижняя ступень · подразделение и роль → работник. Владелец — заведующий отделом.">
        Правило подразделения</button>
    </div>
    <div class="rolebar">${ROLES.map(r => {
      const al = roleAlarm(r.id);
      return `<button class="${r.id === st.polRole ? 'on' : ''}" onclick="KU.pickRole('${r.id}')"
        title="${esc(r.name)} · ${esc(KU.kind(r.kind).name.toLowerCase())}${
          al === 'err' ? ' · есть пустая ячейка дольше порога'
          : al === 'warn' ? ' · есть пустые ячейки с объектами, срок не вышел' : ''}">
        ${esc(r.name)}${al ? `<span class="dot ${al}"></span>` : ''}</button>`;
    }).join('')}</div>
    ${st.step === 'low' ? `<div class="form-row">
      <div class="fld"><label>Подразделение</label>
        <select onchange="KU.pickUnit(this.value)">${units.map(u =>
          `<option value="${u}"${u === st.polUnit ? ' selected' : ''}>${esc(KU.unit(u).name)}</option>`).join('')}</select></div>
    </div>` : ''}`;

  if (!rule) {
    const holder = KU.emp(KU.headOf(st.polUnit)) || { name: '—' };
    return head + `
      <div class="banner danger"><b>Правила этой пары нет.</b>
        Объекты держит заведующий отделом <b>${esc(holder.name)}</b> —
        фолбэк при пороге ${kind.sla} раб. дн.</div>
      ${fallbackTable(st.polUnit, st.polRole)}`;
  }

  const cov = KU.coverage(rule, st.asOf);
  const v = cov.v;
  const draft = (st.keyDraft && st.keyDraft.ruleId === rule.id) ? st.keyDraft : null;
  /* Чип признака показывает и ИСТОЧНИК (у кого спрашивается значение), и выбранную
     группировку по имени — редакция на неё только ссылается (ADR-0131). */
  const srcName = f => KU.srcOf(f, role.kind) === 'borrower' ? 'заёмщик' : kind.name.toLowerCase();
  const grpName = (ver, f) => {
    if (KU.isNum(f)) return 'пороги ' + KU.cutsOf(ver, f).map(KU.fmtNum).join(' · ');
    const ref = KU.grpRef(ver, f);
    return ref ? '«' + (KU.grpDef(f, ref) || { name: ref }).name + '»' : 'домен как есть';
  };
  const keyChips = v.key.map(f => {
    const gl = KU.groupsOf(v, f, st.asOf), dom = KU.dom(f).length;
    return `<span class="chip" title="источник: ${esc(srcName(f))} · ${esc(grpName(v, f))} · доли: ${esc(gl.join(', '))}">${
      esc(KU.feat(f).name)} <span class="muted">${esc(srcName(f))}</span> · ${esc(grpName(v, f))} · долей ${
      gl.length}${dom ? ' из ' + dom : ''}</span>`;
  }).join('');
  /* Из чего собрана ячейка — значения за каждой долей, подсказкой на строке. */
  const cellHint = cell => {
    const parts = String(cell).split(' | ');
    return v.key.map((f, i) => KU.feat(f).name + ': ' +
      (KU.valsOf(v, f, parts[i], st.asOf).join(', ') || parts[i])).join(' · ');
  };
  const draftChips = draft ? draft.key.map(f => `<span class="chip">${esc(KU.feat(f).name)}
      <button title="убрать из ключа" onclick="act(KU.keyDraftDrop('${rule.id}','${f}'))">✕</button></span>`).join('') : '';
  const freeFeats = KU.feats().filter(f => (f.obj || []).indexOf(role.kind) >= 0 &&
    (draft ? draft.key : v.key).indexOf(f.id) < 0);

  const rows = cov.cells.map(c => {
    const target = v.cells[c];
    const objs = KU.cellObjects(rule, c, st.asOf);
    const holder = KU.emp(rule.scope === 'top' ? KU.admin() : KU.headOf(rule.unit)) || { name: '—' };
    const worst = (!target && objs.length)
      ? Math.max.apply(null, objs.map(o => workdays(o.born, st.asOf))) : 0;
    const over = !target && worst > kind.sla;
    const opts = rule.scope === 'top' ? UNITS : EMP.filter(e => e.unit === rule.unit);
    const cellSel = guard.ok
      ? `<select onchange="act(KU.setCell('${rule.id}','${jsq(c)}',this.value))">
          <option value=""${!target ? ' selected' : ''}>— не назначено —</option>
          ${opts.map(x => `<option value="${x.id}"${x.id === target ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
         </select>`
      : (target ? esc(nameOf(rule, target)) : '<span class="muted">— не назначено —</span>');
    /* Состояние — одна пилюля: держатель фолбэка на всё правило один и назван
       в карточке строкой «Владелец», подробности давности — в подсказке. */
    const status = target
      ? '<span class="pill ok">закрыта</span>'
      : objs.length
        ? `<span class="pill ${over ? 'err' : 'warn'}" title="Держит ${esc(holder.name)} — ${worst} раб. дн. при пороге ${kind.sla}${
            over ? ', дольше порога' : ', в сроке'}">фолбэк · ${worst} дн.</span>`
        : '<span class="pill neutral">пусто</span>';
    const cnt = objs.length
      ? `<button class="linky" onclick="KU.toggleCell('${rule.id}','${jsq(c)}')">${objs.length}</button>`
      : '<span class="muted">0</span>';
    const open = st.openCell === rule.id + '‖' + c;
    const detail = open ? `<tr class="sub"><td colspan="4">${objList(objs, rule.role)}</td></tr>` : '';
    return `<tr class="${target ? '' : (over ? 'over' : 'hole')}">
      <td class="mono" title="${esc(cellHint(c))}">${esc(c)}</td>
      <td>${cellSel}</td><td>${cnt}</td><td>${status}</td></tr>${detail}`;
  }).join('');

  /* ВЫБОР ГОТОВОЙ ГРУППИРОВКИ (ADR-0131). Заведующий не сочиняет доли и не переименовывает
     их: он берёт объявленную в справочнике признака, и потому «Недвижимое» здесь и
     «Недвижимое» в чужом правиле — одно и то же. У числового признака вместо выбора —
     пороги, они как раз живут в редакции. Пишется в черновик, применяется той же кнопкой,
     что и состав ключа. */
  const groupEd = (draft && guard.ok && draft.key.length) ? `
    <div class="section-h">Как режется каждый признак · черновик</div>
    <div class="gr-wrap">${draft.key.map(f => {
      /* Смотрим на дату вступления редакции, а не на дату среза: именно с неё правило
         начнёт отвечать, и именно на неё группировка обязана быть живой. */
      const eff = KU.effOf(rule.id);
      const feat = KU.feat(f), gl = KU.groupsOf(draft, f, eff);
      const num = KU.isNum(f), list = KU.grpList(f), ref = KU.grpRef(draft, f);
      const ver = (!num && ref) ? KU.grpVer(f, ref, eff) : null;
      const body = num
        ? `<div class="fld"><label>Пороги, ${esc(feat.unit || '')} — через запятую</label>
             <input value="${esc(KU.cutsOf(draft, f).join(', '))}" placeholder="1000000, 10000000"
               onchange="act(KU.cutsSet('${rule.id}','${f}',this.value))"></div>
           <div class="note">Пороги объявляются здесь, в редакции правила: единого разбиения
             денег по холдингу нет, отделы режут суммы по-своему.</div>`
        : `<div class="fld"><label>Группировка из справочника признака · на ${fmt(eff)}</label>
             <select onchange="act(KU.grpPick('${rule.id}','${f}',this.value))">
               <option value=""${!ref ? ' selected' : ''}>— домен как есть, ${KU.dom(f).length} знач. —</option>
               ${list.map(g => {
                 const fit = KU.grpFits(f, g.id, eff), s = KU.grpStatus(f, g.id, eff);
                 return `<option value="${g.id}"${g.id === ref ? ' selected' : ''}${
                   fit.ok ? '' : ' disabled'}>${esc(g.name)}${fit.ok ? '' : ' — ' + esc(s.text)}</option>`;
               }).join('')}
             </select></div>
           ${list.length ? '' : '<div class="note">У признака готовых группировок нет — ключ режет его доменом. Нужна новая доля — к администратору кураторства.</div>'}
           ${(ref && !KU.grpFits(f, ref, eff).ok) ? `<div class="banner warn">${
             esc(KU.grpFits(f, ref, eff).why)}. ${ver ? 'Редакция бессрочна — после снятия ключ схлопнется в одну долю.'
             : 'Ключ на эту дату схлопнется в одну долю.'} Сдвиньте дату вступления редакции или выберите другую
             группировку — сохранить с такой ссылкой не даст.</div>` : ''}
           ${ver ? `<table class="cgrid"><thead><tr><th>Значение</th><th>Доля</th></tr></thead><tbody>
             ${KU.dom(f).map(val => {
               const g = ver.map[val] || '';
               return `<tr${g ? '' : ' class="hole"'}><td>${esc(val)}</td>
                 <td>${esc(g || KU.OTHER)}</td></tr>`;
             }).join('')}<tr class="hole"><td class="muted">всё, что заведут в справочнике позже</td>
               <td>${esc(KU.OTHER)}</td></tr></tbody></table>
             <div class="note">Редакция ${ver.no} группировки от ${fmt(ver.from)} — правка раскладки
               заводит новую редакцию справочника и прошлое не переписывает (ИУ-10, ИУ-11).
               Доля «${esc(KU.OTHER)}» есть всегда, даже когда домен разложен без остатка.</div>` : ''}`;
      return `<div class="gr-card">
        <div class="gr-head">
          <b>${esc(feat.name)}</b>
          <span class="muted">источник: ${esc(srcName(f))} · долей ${gl.length}${
            KU.dom(f).length ? ' из ' + KU.dom(f).length : ''}</span>
        </div>
        ${body}
      </div>`;
    }).join('')}</div>
    <div class="note">Раскладка домена по долям живёт в справочнике признака, а редакция правила
      хранит на неё ссылку: имя доли значит одно и то же во всех правилах холдинга, и витрины
      двух подразделений складываются. Значение, не отнесённое ни к одной доле, попадает в
      «${esc(KU.OTHER)}»: ячейка для него есть всегда, поэтому пополнение справочника не оставляет
      объект без ответа (ИУ-9). Имя куратора переносится в новую ячейку, если все её значения
      раньше вели к одному и тому же человеку.</div>` : '';

  const vers = rule.versions.slice().sort((a, b) => a.no - b.no).map(x => {
    const s = KU.verStatus(x);
    return `<tr>
      <td>${x.no}</td><td>${fmt(x.from)}</td><td>${x.until ? fmt(x.until) : '—'}</td>
      <td>${esc(x.key.map(f => {
        const gl = KU.groupsOf(x, f, x.from);
        return KU.feat(f).name + (KU.isNum(f) || KU.grpRef(x, f) ? ' (' + grpName(x, f) + ', долей ' + gl.length + ')' : '');
      }).join(' + '))}</td>
      <td>${Object.keys(x.cells).length} из ${KU.space(x, x.from).length}</td>
      <td>${esc(x.by)}</td>
      <td><span class="pill ${s === 'действующая' ? 'ok' : s === 'будущая' ? 'info' : 'neutral'}">${s}</span></td></tr>`;
  }).join('');

  /* ЗАДАЧА ОТ СПРАВОЧНИКА: администратор снял долю новой редакцией группировки, и ячейки,
     названные по этой доле, к дате вступления перестанут существовать. За владельца правила
     никто не пересобирает — ему прилетает задача со сроком (ИУ-8). */
  const myT = KU.myTasks(), mine = myT.filter(t => t.ruleId === rule.id), other = myT.length - mine.length;
  const taskBox = myT.length ? `<div class="banner warn">
    ${mine.map(t => `<div style="margin-bottom:6px">${esc(t.text)}
      <button class="btn btn-secondary btn-sm" onclick="act(KU.taskDone('${t.id}'))">Ячейки пересобраны</button></div>`).join('')}
    ${other ? `<div class="muted">Ещё задач по другим вашим правилам: ${other} — ${
      esc(myT.filter(t => t.ruleId !== rule.id).map(t => t.ruleId).filter((x, i, a) => a.indexOf(x) === i).join(', '))}</div>` : ''}
  </div>` : '';

  return head + taskBox + `
    ${guard.ok ? '' : `<div class="banner info">${esc(guard.why)}</div>`}

    <div class="card">
      <div class="card-head">
        <h3>Редакция № ${v.no} от ${fmt(v.from)}${v.until ? ' — ' + fmt(v.until) : ''}
          <span class="pill ${KU.verStatus(v) === 'действующая' ? 'ok' : 'neutral'}">${KU.verStatus(v)}</span></h3>
        <button class="btn btn-secondary btn-sm" onclick="KU.toggleVers(true)">
          История редакций · ${rule.versions.length}</button>
      </div>
      <div class="kv">
        <div class="k">Владелец</div><div class="v">${esc(rule.owner)} · ${esc((KU.emp(rule.scope === 'top'
          ? KU.admin() : KU.headOf(rule.unit)) || {}).name)}</div>
        <div class="k">Объявленный ключ</div><div class="v">${keyChips || '<span class="muted">пуст</span>'}</div>
        <div class="k">Покрытие</div><div class="v">закрыто <b>${cov.named.length}</b> из ${cov.cells.length}${
          cov.holesHot.length ? ` · <span class="pill warn">пустых с объектами: ${cov.holesHot.length}</span>` : ''}</div>
        <div class="k">Порог фолбэка</div><div class="v">${kind.sla} раб. дн. ·
          ${esc(kind.name.toLowerCase())}</div>
      </div>
      ${guard.ok ? `
      <div class="form-row" style="margin:14px 0 0">
        <div class="fld"><label>Дата вступления новой редакции</label>
          <input type="date" value="${KU.effOf(rule.id)}" min="${st.today}"
            onchange="act(KU.setEff('${rule.id}',this.value))"></div>
        <div class="fld"><label>Добавить признак в ключ</label>
          <select onchange="act(KU.keyDraftAdd('${rule.id}',this.value))">
            <option value="">— выбрать —</option>
            ${freeFeats.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>
        ${draft ? `<div class="fld"><label>Черновик ключа · ячеек ${KU.space(draft, st.today).length}${
            KU.space(draft, st.today).length > KU.CELL_SOFT ? ' ⚠' : ''}</label>
          <div>${draftChips || '<span class="muted">пуст</span>'}</div></div>
          <button class="btn btn-primary" onclick="act(KU.saveKey('${rule.id}'))">Сохранить редакцией</button>` : ''}
      </div>
      ${draft && KU.space(draft, st.today).length > KU.CELL_SOFT ? `
      <div class="banner warn"><b>Ячеек ${KU.space(draft, st.today).length}</b> — больше мягкого
        предела ${KU.CELL_SOFT}. Предел меряется ячейками, а не признаками: три признака по десять
        долей опаснее шести по два. Сохранить можно, но каждую ячейку кто-то должен закрыть, иначе
        её держит ${esc(rule.scope === 'top' ? 'администратор кураторства' : 'заведующий отделом')} (ИУ-8).</div>` : ''}` : ''}
    </div>

    ${groupEd}

    <div class="section-h">Ячейки правила</div>
    <table class="cgrid"><thead><tr>
      <th>Значение ключа</th><th>${rule.scope === 'top' ? 'Подразделение' : 'Работник'}</th>
      <th>Объектов</th><th>Состояние</th></tr></thead><tbody>${rows}</tbody></table>

    ${st.versOpen ? `
    <div class="drawer-mask" onclick="KU.toggleVers(false)"></div>
    <aside class="drawer">
      <div class="drawer-h">
        <h3>История редакций · ${esc(role.name)}${rule.scope === 'low'
          ? ' · ' + esc(KU.unit(rule.unit).name) : ''}</h3>
        <button class="drawer-x" title="закрыть" onclick="KU.toggleVers(false)">✕</button>
      </div>
      <div class="drawer-b">
        <table class="cgrid"><thead><tr>
          <th>№</th><th>Вступила</th><th>Закрыта</th><th>Ключ</th><th>Закрыто ячеек</th><th>Кем</th><th></th>
          </tr></thead><tbody>${vers}</tbody></table>
        <div class="note">Записи журнала ссылаются на редакцию, по которой поставлены, — поэтому
          ответ «кто вёл 14.02.2024» воспроизводим (ИУ-10, ИУ-11).</div>
      </div>
    </aside>` : ''}`;
}

function objList(objs, roleId) {
  const st = KU.state;
  const rows = objs.map(o => {
    const a = KU.curatorOn(o.id, roleId, st.asOf);
    const off = KU.offRule(o.id, roleId, st.asOf);
    const pend = KU.pendingHandoff(o.id, roleId);
    const open = st.openObj === o.id + '‖' + roleId;
    const detail = open ? `<tr class="sub"><td colspan="7">${objCard(o, roleId)}</td></tr>` : '';
    return `<tr>
      <td class="mono">${esc(o.id)}</td>
      <td>${esc(KU.kind(o.kind).name)}${o.closed ? ' <span class="pill neutral">погашен ' + fmt(o.closed) + '</span>' : ''}${
        o.of ? '<div class="why">по ' + esc(o.of) + (o.note ? ' · ' + esc(o.note) : '') + '</div>' : ''}</td>
      <td>${fmt(o.born)}</td>
      <td>${esc(o.borrower)}</td>
      <td>${a.ok ? esc(a.assignedName) : '<span class="muted">' + esc(a.why) + '</span>'}
        ${a.ok ? `<div class="why">с ${fmt(a.since)} · <em>${esc(a.src)}</em>${
          a.ver ? ' · редакция ' + a.ver.no : ''}${a.fallback ? ' · держится ' + a.heldDays + ' раб. дн.' +
          (a.overdue ? ' — <em>дольше порога ' + a.sla + '</em>' : '') : ''}</div>` : ''}
        ${a.ok && a.substituted ? `<div class="why"><span class="pill info">действует другой</span>
          работу ведёт <em>${esc(a.actingName)}</em> — ${esc(a.actingWhy)}</div>` : ''}
        ${pend ? '<div class="why"><span class="pill info">передача в очереди</span> до приёма куратор прежний</div>' : ''}</td>
      <td>${off ? `<span class="pill warn">вне правила</span>
        <div class="why">правило сейчас называет <em>${esc((KU.emp(off.now) || {}).name)}</em>,
          в журнале — ${esc((KU.emp(off.journal) || {}).name)} (${esc(off.src)})</div>`
        : '<span class="pill ok">совпадает с правилом</span>'}</td>
      <td><button class="linky" onclick="KU.toggleObj('${jsq(o.id)}','${roleId}')">${open ? 'скрыть' : 'журнал'}</button></td>
      </tr>${detail}`;
  }).join('');
  return `<table class="cgrid"><thead><tr>
    <th>Объект</th><th>Вид</th><th>Рождён</th><th>Заёмщик</th>
    <th>Закреплён на ${fmt(st.asOf)}</th><th>Сверка с правилом</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* Журнал закреплений объекта + действия над ним. Витрина в карточке чужого модуля —
   этап 5; здесь это служебный просмотр, на котором проверяется движение (волна 2). */
function objCard(o, roleId) {
  const st = KU.state;
  const recs = KU.journalOf(o.id, roleId);
  const cur = openRec(o.id, roleId, st.today);
  const kind = KU.kind(o.kind);
  const work = KU.workOpen(o.id, st.today);
  const mates = cur && cur.unitId ? EMP.filter(e => e.unit === cur.unitId) : EMP;
  const feats = KU.featsOf(o.kind);
  /* демо-переключатель берёт первый НЕчисловой признак: у числового домена нет списка */
  const f0 = feats.filter(f => !f.num)[0] || null;
  const now = KU.curatorOn(o.id, roleId, st.asOf);
  const resp = now.ok ? now.resp : null;
  const lead = KU.lead(o.borrower, st.asOf);

  const jr = recs.map(r => `<tr>
    <td>${fmt(r.from)} — ${r.to ? fmt(r.to) : '<span class="muted">открыт</span>'}</td>
    <td>${esc((KU.emp(r.empId) || {}).name || r.empId)}</td>
    <td>${esc((KU.unit(r.unitId) || {}).name || 'администратор кураторства')}</td>
    <td><span class="pill ${r.src === 'правило' ? 'ok' : r.src === 'фолбэк' ? 'warn' : 'info'}">${esc(r.src)}</span>${
      r.retro ? ' <span class="pill warn">задним числом</span>' : ''}</td>
    <td>${r.ver ? 'ред. ' + r.ver.no : '<span class="muted">—</span>'}</td>
    <td>${esc(r.by)}${r.at ? '<div class="why">' + esc(r.at) + '</div>' : ''}
      <div class="why">${esc(r.reason)}</div>
      ${r.snap ? '<div class="why">снимок признаков: ' + esc(Object.keys(r.snap)
        .map(k => (KU.feat(k) || { name: k }).name + ' = ' + r.snap[k]).join(' · ')) + '</div>' : ''}</td>
  </tr>`).join('');

  return `
    <div class="card" style="margin:0">
      <h3>${esc(o.id)} · ${esc((KU.role(roleId) || {}).name)}
        <span class="small"> — рождён ${fmt(o.born)}, точка рождения: ${esc(kind.birth)}</span></h3>
      <div class="kv">
        <div class="k">Признаки сейчас</div><div class="v">${feats.map(f => {
          const val = KU.featVal(o, f.id);
          return esc(f.name + ' = ' + (f.num ? KU.fmtNum(val) + ' ' + (f.unit || '') : (val || '—'))) +
            ' <span class="muted small">(' + esc(KU.srcOf(f.id, o.kind) === 'borrower' ? 'у заёмщика' : 'у объекта') + ')</span>';
        }).join(' · ')}
          <div class="why">объект хранит только свои признаки; вид заёмщика, форму собственности,
            размер, отрасль и территорию правило спрашивает у заёмщика запросом на дату (ADR-0131)</div></div>
        ${now.ok ? `<div class="k">Два ответа на ${fmt(st.asOf)}</div><div class="v">
          закреплён <b>${esc(now.assignedName)}</b> — он отвечает за период;
          ${now.substituted
            ? 'работу ведёт <b>' + esc(now.actingName) + '</b> <span class="pill info">подмена</span>' +
              '<div class="why">' + esc(now.actingWhy) + '</div>'
            : 'работу ведёт он же <span class="pill ok">ответы совпадают</span>' +
              '<div class="why">' + esc(now.actingWhy) + '</div>'}</div>` : ''}
        ${resp ? `<div class="k">Период ответственности</div><div class="v">${esc(resp.text)}
          ${resp.cutDays ? '<div class="why">чистых дней ответственности: <b>' + resp.net +
            '</b> из ' + resp.days + ' (ИУ-24)</div>' : ''}</div>` : ''}
        <div class="k">Ведущий куратор заёмщика</div><div class="v">${lead.ok
          ? '<b>' + esc(lead.name) + '</b> · ' + esc(lead.objId) +
            '<div class="why">' + esc(lead.why) + '</div>' +
            '<div class="why">роль производная: в журнале её нет, назначить её нельзя — ' +
            'на период с ' + fmt(lead.start) + ' ответ не меняется (ИУ-25)</div>'
          : '<span class="muted">' + esc(lead.why) + '</span>'}</div>
        <div class="k">Незакрытая работа</div><div class="v">${work.open
          ? '<span class="pill warn">есть</span> ' + esc(work.why)
          : '<span class="pill ok">нет</span> ' + esc(work.why)}
          <div class="why">спрошены: ${esc(work.asked.join(', '))}${work.silent.length
            ? ' · молчат: <em>' + esc(work.silent.join(', ')) + '</em>' : ''} — признак не хранится, читается на момент вопроса (P18-R12)</div></div>
      </div>
      <table class="cgrid" style="margin-top:12px"><thead><tr>
        <th>Период</th><th>Работник</th><th>Подразделение</th><th>Источник</th><th>Редакция</th><th>Кем и почему</th>
        </tr></thead><tbody>${jr}</tbody></table>
      <div class="note">Журнал append-only: запись закрывается предыдущим днём, новая открывается
        датой вступления — разрыва между ними нет (ИУ-4).</div>

      <div class="section-h" style="margin-top:16px">Действия</div>
      <div class="form-row">
        <div class="fld"><label>Закрепить рукой — работник</label>
          <select id="aEmp_${esc(o.id)}">${mates.map(e =>
            `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>С даты (можно задним числом)</label>
          <input type="date" id="aFrom_${esc(o.id)}" value="${st.today}"></div>
        <div class="fld" style="flex:1"><label>Причина — обязательна</label>
          <input type="text" id="aWhy_${esc(o.id)}" placeholder="почему вне правила"></div>
        <button class="btn btn-secondary" onclick="KU.uiByHand('${jsq(o.id)}','${roleId}')">Закрепить рукой</button>
        <button class="btn btn-secondary" onclick="act(KU.backToRule('${jsq(o.id)}','${roleId}'))">Вернуть к правилу</button>
      </div>
      <div class="form-row">
        <div class="fld"><label>Передать в подразделение</label>
          <select id="sUnit_${esc(o.id)}">${UNITS.filter(u => !cur || u.id !== cur.unitId).map(u =>
            `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
        <div class="fld" style="flex:1"><label>Причина передачи</label>
          <input type="text" id="sWhy_${esc(o.id)}" placeholder="почему объект уезжает"></div>
        <button class="btn btn-secondary" onclick="KU.uiSend('${jsq(o.id)}','${roleId}')">Отправить</button>
      </div>
      ${f0 ? `<div class="form-row">
        <div class="fld"><label>Зеркало соседнего модуля: признак «${esc(f0.name)}» ·
            пишется ${esc(KU.srcOf(f0.id, o.kind) === 'borrower' ? 'заёмщику' : 'объекту')}</label>
          <select id="fVal_${esc(o.id)}">${f0.domain.map(v =>
            `<option value="${esc(v)}"${v === KU.featVal(o, f0.id) ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <button class="btn btn-secondary" onclick="KU.uiFeature('${jsq(o.id)}','${f0.id}')">Сменить признак</button>
        <div class="note" style="margin:0;flex:1">Смена признака куратора не переставляет: решение
          хранит снимок на свою дату, а переставляет объекты только пересчёт (P18-R9).
          Заёмщицкий признак меняется сразу у всех объектов заёмщика — копии на объекте нет.</div>
      </div>` : ''}
      <div class="note">Отправку обычно инициирует не кураторство, а модуль кредита или взыскания —
        кнопка здесь стоит, чтобы прогнать очередь целиком (P18-R10).</div>
    </div>`;
}

/* ------------------------- ЭКРАН: ПЕРЕСЧЁТ --------------------------- */
function viewRecalc() {
  const st = KU.state;
  const roleId = st.recRole;
  const unitId = st.role === 'head' ? st.headUnit : st.recUnit;
  const units = unitsForRole(roleId);
  const guard = KU.canRecalc(unitId, roleId);
  const p = (st.preview && st.preview.unitId === unitId && st.preview.roleId === roleId) ? st.preview : null;
  const rule = KU.lowRule(unitId, roleId);
  const v = rule ? KU.verAt(rule, st.today) : null;

  const head = `
    <div class="section-h">Пересчёт правила подразделения</div>
    <p class="page-lead">Правка правила объекты сама не переставляет: пересчёт — отдельное действие
      заведующего с предпросмотром. Фонового пересчёта нет, у правила холдинга его нет вовсе —
      оно родильное (ИУ-7). Корзин четыре, и ручные закрепления пересчёт не трогает.</p>
    <div class="form-row">
      <div class="fld"><label>Роль</label>
        <select onchange="KU.pickRec(this.value,null)">${ROLES.map(r =>
          `<option value="${r.id}"${r.id === roleId ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Подразделение${st.role === 'head' ? ' — своё, из шапки' : ''}</label>
        ${st.role === 'head'
          ? `<input type="text" value="${esc((KU.unit(unitId) || {}).name || '—')}" disabled>`
          : `<select onchange="KU.pickRec(null,this.value)">${units.map(u =>
              `<option value="${u}"${u === unitId ? ' selected' : ''}>${esc(KU.unit(u).name)}</option>`).join('')}</select>`}</div>
    </div>`;

  const bar = guard.ok
    ? `<div class="btn-row" style="margin:0 0 14px">
         <button class="btn btn-primary" onclick="act(KU.recalcPreview('${unitId}','${roleId}'))">Показать предпросмотр</button>
         ${p ? `<button class="btn btn-secondary" onclick="act(KU.recalcApply('${unitId}','${roleId}'))">Применить</button>
                <button class="btn btn-secondary" onclick="act(KU.recalcClose())">Закрыть без изменений</button>` : ''}
       </div>`
    : `<div class="banner ${st.role === 'admin' ? 'warn' : 'info'}"><b>Кнопки пересчёта здесь нет.</b>
         ${esc(guard.why)}</div>`;

  const basket = (title, rows, cls, lead, extra) => `
    <div class="section-h">${esc(title)} · ${rows.length}</div>
    <p class="page-lead">${lead}</p>
    ${rows.length ? `<table class="cgrid"><thead><tr>
      <th>Объект</th><th>Заёмщик</th><th>Сейчас</th><th>Правило называет</th><th>Ячейка</th><th>${esc(extra || 'Почему сюда')}</th>
      </tr></thead><tbody>${rows.map(r => `<tr class="${cls}">
        <td class="mono">${esc(r.objId)}</td><td>${esc(r.borrower)}</td>
        <td>${esc((KU.emp(r.cur) || {}).name)}<div class="why">${esc(r.src)}, с ${fmt(r.since)}</div></td>
        <td>${esc((KU.emp(r.want) || {}).name)}</td>
        <td class="mono">${esc(r.cell)}${r.ver ? '<div class="why">ред. ' + r.ver.no + '</div>' : ''}</td>
        <td>${r.ban ? 'отстранение по заёмщику с ' + fmt(r.ban.from) + '<div class="why">' + esc(r.ban.why) + '</div>'
          : r.work ? esc(r.work.why)
          : r.same === true ? 'правило называет того же — запись всё равно ручная, пересчёт её не трогает'
          : r.same === false ? 'держится вне правила: ' + esc(r.reason)
          : 'правило и журнал разошлись, работа закрыта'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="note">Пусто.</div>'}`;

  if (!p) return head + bar + (rule
    ? `<div class="card"><h3>Что пересчитывается</h3><div class="kv">
        <div class="k">Правило</div><div class="v">${esc(rule.owner)} · ${esc((KU.unit(unitId) || {}).name)}</div>
        <div class="k">Действующая редакция</div><div class="v">${v ? '№ ' + v.no + ', вступила ' + fmt(v.from) : '—'}</div>
        <div class="k">Объектов в подразделении</div><div class="v">${st.journal.filter(r => r.role === roleId &&
          r.unitId === unitId && r.to == null).length}</div>
      </div><div class="note">Предпросмотр раскрывается до списка объектов — счётчик и список
        считаются одним расчётом. Пока он не применён, не меняется ничего.</div></div>`
    : `<div class="banner warn">У пары «${esc((KU.unit(unitId) || {}).name)} · ${esc((KU.role(roleId) || {}).name)}»
        правила нет — объекты держит заведующий отделом (ИУ-8), пересчитывать нечего.</div>`);

  return head + bar + `
    <div class="banner info"><b>${esc(p.note)}</b>
      ${p.silent.length ? '<br>Молчат источники: <b>' + esc(p.silent.join(', ')) +
        '</b> — их объекты уходят через рукопожатие, безопасная сторона (P18-R12).' : ''}
      ${p.pending.length ? '<br>Уже в очереди передач: ' + p.pending.length +
        ' — повторно не отправляются.' : ''}</div>
    ${basket('Тихо', p.quiet, '', 'Работа на объекте закрыта — закрепление меняется записью журнала, без чьего-либо согласия.')}
    ${basket('Через рукопожатие', p.hand, 'hole', 'На объекте есть незакрытая работа — вместо подмены куратора создаётся передача, и её принимают.')}
    ${basket('Заблокировано отстранением', p.blocked, 'over', 'Правило называет работника, отстранённого по этому заёмщику (ADR-0118) — закрепление остаётся прежним.')}
    ${basket('Ручные — не тронуты', p.manual, 'sub', 'Закрепление рукой держится вне правила до отмены: вернуть его к правилу можно только кнопкой в журнале объекта (P18-R13).')}
    <div class="note">Применение меняет только первую корзину и создаёт передачи по второй.
      Записи журнала ссылаются на редакцию ${p.ver == null ? '—' : '№ ' + p.ver} — поэтому ответ
      «почему так» воспроизводим. Закрытие предпросмотра не меняет ничего.</div>`;
}

/* ------------------------- ЭКРАН: ПЕРЕДАЧИ --------------------------- */
function viewHandoffs() {
  const st = KU.state;
  const queue = st.handoffs.filter(h => h.state === 'в очереди');
  const done  = st.handoffs.filter(h => h.state !== 'в очереди');

  const qrows = queue.map(h => {
    const card = KU.handoffCard(h.id);
    const open = st.openHand === h.id;
    const emps = EMP.filter(e => e.unit === h.toUnit);
    const cur = card.cur;
    const detail = open ? `<tr class="sub"><td colspan="6">
      <div class="card" style="margin:0">
        <h3>Приём передачи ${esc(h.id)} · ${esc(h.objId)}</h3>
        <div class="kv">
          <div class="k">Кто ведёт сейчас</div><div class="v">${esc((KU.emp(cur && cur.empId) || {}).name || '—')} ·
            ${esc((KU.unit(h.fromUnit) || {}).name)} <span class="pill neutral">до приёма ничего не изменилось</span></div>
          <div class="k">Причина отправки</div><div class="v">${esc(h.reason)} <span class="small">· ${esc(h.src)}</span></div>
          <div class="k">Подставлен правилом</div><div class="v"><b>${esc((KU.emp(card.suggest) || {}).name)}</b>
            <div class="why">${esc(card.why)}</div></div>
        </div>
        <div class="form-row" style="margin-top:12px">
          <div class="fld"><label>Работник принимающего подразделения</label>
            <select id="hEmp_${esc(h.id)}">${emps.map(e =>
              `<option value="${e.id}"${e.id === card.suggest ? ' selected' : ''}>${esc(e.name)}${
                e.id === card.suggest ? ' · подставлен' : ''}</option>`).join('')}</select></div>
          <div class="fld" style="flex:1"><label>Причина — обязательна при замене подставленного и при отклонении</label>
            <input type="text" id="hWhy_${esc(h.id)}" placeholder="почему другой работник / почему не принимаем"></div>
          <button class="btn btn-primary" onclick="KU.uiAccept('${esc(h.id)}')">Принять</button>
          <button class="btn btn-secondary" onclick="KU.uiReject('${esc(h.id)}')">Отклонить</button>
        </div>
        <div class="note">Приём открывает закрепление датой приёма и закрывает прежнее предыдущим днём.
          Замена подставленного работника делает источник записи «переопределение» — и причина едет в журнал.
          Отклонение возвращает объект отправителю, журнал при этом не трогается.</div>
      </div></td></tr>` : '';
    return `<tr>
      <td class="mono">${esc(h.id)}</td>
      <td class="mono">${esc(h.objId)}<div class="why">${esc((KU.role(h.role) || {}).name)}</div></td>
      <td>${esc((KU.unit(h.fromUnit) || {}).name)}</td>
      <td>${esc((KU.unit(h.toUnit) || {}).name)}${h.fromUnit === h.toUnit
        ? '<div class="why">внутри отдела — создана пересчётом</div>' : ''}</td>
      <td>${fmt(h.sent)}<div class="why">${esc(h.by)} · ${esc(h.reason)}</div></td>
      <td><button class="linky" onclick="KU.toggleHand('${esc(h.id)}')">${open ? 'скрыть' : 'карточка приёма'}</button></td>
      </tr>${detail}`;
  }).join('');

  const drows = done.map(h => `<tr>
    <td class="mono">${esc(h.id)}</td><td class="mono">${esc(h.objId)}</td>
    <td>${esc((KU.unit(h.fromUnit) || {}).name)} → ${esc((KU.unit(h.toUnit) || {}).name)}</td>
    <td><span class="pill ${h.state === 'принята' ? 'ok' : 'err'}">${esc(h.state)}</span></td>
    <td>${h.accepted ? fmt(h.accepted.d) + ' · ' + esc((KU.emp(h.accepted.empId) || {}).name) +
        (h.accepted.byHand ? ' <span class="pill info">переопределение</span><div class="why">' +
          esc(h.accepted.reason) + '</div>' : '')
      : h.rejected ? fmt(h.rejected.d) + ' · ' + esc(h.rejected.by) +
        '<div class="why">' + esc(h.rejected.why) + '</div>' : '—'}</td></tr>`).join('');

  return `
    <div class="section-h">Очередь передач</div>
    <p class="page-lead">Подразделение объекта меняется только принятой передачей — ни правка верхнего
      правила, ни пересчёт его не двигают (ИУ-12, ADR-0023). Пока передача в очереди, куратор прежний:
      полномочия переходят датой приёма.</p>
    ${queue.length ? `<table class="cgrid"><thead><tr>
      <th>№</th><th>Объект</th><th>Отдаёт</th><th>Принимает</th><th>Отправлена</th><th></th>
      </tr></thead><tbody>${qrows}</tbody></table>`
      : '<div class="note">Очередь пуста. Передачи создаёт пересчёт (корзина «через рукопожатие») или отправка из журнала объекта.</div>'}
    ${done.length ? `<div class="section-h">Разобранные</div>
      <table class="cgrid"><thead><tr>
        <th>№</th><th>Объект</th><th>Маршрут</th><th>Итог</th><th>Кто и когда</th>
      </tr></thead><tbody>${drows}</tbody></table>` : ''}
    <div class="note">Принимает заведующий принимающего подразделения. Если ячейка правила у него
      пуста, карточка подставляет его самого (ИУ-8) и прямо говорит, из какой ячейки взят работник.</div>`;
}

/* ---------------------- ЭКРАН: ОТСТРАНЕНИЯ --------------------------- */
function viewBans() {
  const st = KU.state;
  const list = KU.bansOf(st.asOf);
  const isAdmin = st.role === 'admin';

  const rows = list.map(b => {
    const emp = KU.emp(b.empId) || { name: b.empId };
    const hits = b.live ? KU.banHits(b, st.asOf) : [];
    const lift = b.live && isAdmin ? `<div class="form-row" style="margin:8px 0 0">
        <div class="fld"><label>Снять датой</label>
          <input type="date" id="lD_${esc(b.id)}" value="${st.today}" max="${st.today}"></div>
        <div class="fld" style="flex:1"><label>Причина снятия — обязательна</label>
          <input type="text" id="lWhy_${esc(b.id)}" placeholder="почему отстранение кончилось"></div>
        <button class="btn btn-secondary" onclick="KU.uiBanLift('${esc(b.id)}')">Снять</button>
      </div>` : '';
    const hitList = hits.length ? `<div class="why">затронуто закреплений: ${hits.map(h =>
      esc(h.objId) + ' → работу ведёт ' + esc(h.actingName)).join(' · ')}</div>` : '';
    return `<tr>
      <td class="mono">${esc(b.id)}</td>
      <td>${esc(emp.name)}<div class="why">${esc((KU.unit(emp.unit) || {}).name || '')}</div></td>
      <td>${esc(b.borrower)}</td>
      <td>${fmt(b.from)} — ${b.to ? fmt(b.to) : '<span class="muted">открыто</span>'}</td>
      <td>записка № ${esc(b.note.no)} от ${fmt(b.note.d)}
        <div class="why">${esc(b.note.text)}</div>
        <div class="why">инициатор: <em>${esc(b.init)}</em> · ввёл: ${esc(b.by)}</div></td>
      <td>${b.live ? '<span class="pill err">действует</span>'
          : '<span class="pill neutral">снято ' + fmt(b.to) + '</span>' +
            (b.lifted ? '<div class="why">' + esc(b.lifted.why) + ' · ' + esc(b.lifted.by) + '</div>' : '')}
        ${hitList}${lift}</td></tr>`;
  }).join('');

  const empSel = EMP.map(e =>
    `<option value="${e.id}"${e.id === st.banEmp ? ' selected' : ''}>${esc(e.name)} · ${esc((KU.unit(e.unit) || {}).name)}</option>`).join('');
  const borSel = KU.borrowers().map(b =>
    `<option value="${esc(b)}"${b === st.banBor ? ' selected' : ''}>${esc(b)}</option>`).join('');
  const form = isAdmin ? `
    <div class="card">
      <h3>Завести отстранение</h3>
      <div class="form-row">
        <div class="fld"><label>Работник</label>
          <select id="bEmp" onchange="KU.pickBan(this.value,null)">${empSel}</select></div>
        <div class="fld"><label>Заёмщик — отрезок покрывает все его объекты</label>
          <select id="bBor" onchange="KU.pickBan(null,this.value)">${borSel}</select></div>
        <div class="fld"><label>Действует с</label>
          <input type="date" id="bFrom" value="${st.today}" max="${st.today}"></div>
        <div class="fld"><label>Инициатор</label>
          <select id="bInit">${BAN_INIT.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join('')}</select></div>
      </div>
      <div class="form-row">
        <div class="fld"><label>Служебная записка №</label>
          <input type="text" id="bNo" placeholder="02-14/..."></div>
        <div class="fld"><label>Дата записки</label>
          <input type="date" id="bND" value="${st.today}"></div>
        <div class="fld" style="flex:1"><label>Текст основания</label>
          <input type="text" id="bText" placeholder="в чём конфликт интересов"></div>
        <button class="btn btn-primary" onclick="KU.uiBanAdd()">Завести</button>
      </div>
      <div class="note">Дата окончания открытая: отстранение снимается отдельным действием, датой и
        с причиной. Инициировать может любой — самоотвод виден в реестре как инициатива работника.</div>
    </div>`
    : `<div class="banner info"><b>Отстранение вводит администратор кураторства.</b>
        ${esc(accessName())} реестр только читает: заведение и снятие — его действия по служебной записке (P18-R15).</div>`;

  /* гейт увольнения */
  const g = KU.dismissGate(st.gateEmp, st.today);
  const gEmp = KU.emp(st.gateEmp) || { name: st.gateEmp };
  const tails = st.journal.filter(r => r.empId === st.gateEmp && r.to == null);
  const gateRows = tails.map(r => {
    const w = KU.workOpen(r.objId, st.today);
    return `<tr><td class="mono">${esc(r.objId)}</td>
      <td>${esc((KU.role(r.role) || {}).name)}</td>
      <td>${esc((KU.obj(r.objId) || {}).borrower)}</td>
      <td>${w.open ? '<span class="pill warn">незакрытая работа</span>' : '<span class="pill ok">работы нет</span>'}
        <div class="why">${esc(w.why)}</div></td></tr>`;
  }).join('');

  const subs = KU.substitutions(st.asOf);
  const subRows = subs.map(s => `<tr>
    <td class="mono">${esc(s.objId)}</td><td>${esc(s.roleName)}</td><td>${esc(s.borrower)}</td>
    <td>${esc(s.assignedName)}<div class="why">период ответственности: ${esc(s.resp ? s.resp.text : '—')}</div></td>
    <td>${esc(s.actingName)} <span class="pill info">подмена</span>
      <div class="why">${esc(s.actingWhy)}</div></td></tr>`).join('');

  return `
    <div class="section-h">Отстранения</div>
    <p class="page-lead">Отстранение — своё датированное измерение по паре «работник и заёмщик»
      (ADR-0118), а не поле объекта и не отмена закрепления. Закрепление при нём живёт: меняется
      только действующий исполнитель, а дни отстранения вычитаются из периода ответственности
      (ИУ-21, ИУ-24). Отрезок покрывает все объекты этого заёмщика сразу.</p>
    ${form}

    <div class="section-h">Реестр</div>
    ${list.length ? `<table class="cgrid"><thead><tr>
      <th>№</th><th>Работник</th><th>Заёмщик</th><th>Отрезок</th><th>Основание</th><th>Состояние</th>
      </tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="note">Реестр пуст.</div>'}
    <div class="note">Снятие ничего не стирает: отрезок закрывается датой и причиной, и ответ на дату
      внутри него остаётся прежним — история не переписывается (ИУ-4).</div>

    <div class="section-h">Закреплённый и действующий на ${fmt(st.asOf)}</div>
    <p class="page-lead">Второй ответ шва <code>curatorOn</code>: за период отвечает закреплённый,
      работу сегодня получает действующий. Замещающего называет модуль сотрудников
      (<code>resolveActor</code>, P12-R12) — кураторство его не хранит и не выбирает; если контракт
      молчит или замещающий не назван, работа уходит заведующему отделом (ИУ-23).</p>
    <div class="form-row">
      <div class="fld"><label>Контракт модуля сотрудников</label>
        <select onchange="KU.uiHr(this.value)">
          <option value="true"${st.hr.up ? ' selected' : ''}>отвечает</option>
          <option value="false"${!st.hr.up ? ' selected' : ''}>молчит</option></select></div>
      <div class="note" style="margin:0;flex:1">Отсутствия ведёт модуль сотрудников. Здесь их зеркало:
        ${st.absences.map(a => esc((KU.emp(a.empId) || {}).name) + ' — ' + esc(a.kind) + ' до ' + fmt(a.to) +
          (a.deputy ? ', замещает ' + esc((KU.emp(a.deputy) || {}).name) : ', замещающий не назван')).join(' · ')}</div>
    </div>
    ${subs.length ? `<table class="cgrid"><thead><tr>
      <th>Объект</th><th>Роль</th><th>Заёмщик</th><th>Закреплён — отвечает за период</th>
      <th>Действует — получает работу</th></tr></thead><tbody>${subRows}</tbody></table>`
      : '<div class="note">На эту дату два ответа совпадают везде: ни отстранений, ни отсутствий.</div>'}

    <div class="section-h">Гейт увольнения</div>
    <p class="page-lead">Увольнение держит не факт закреплений, а незакрытая работа на объектах
      (P18-R17, ИУ-26). Хвосты переводятся на заведующего одной пачкой — отдельным действием,
      с причиной, записями в журнале каждого объекта.</p>
    <div class="form-row">
      <div class="fld"><label>Работник</label>
        <select onchange="KU.pickGate(this.value)">${EMP.map(e =>
          `<option value="${e.id}"${e.id === st.gateEmp ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</select></div>
      <div class="fld" style="flex:1"><label>Причина перевода хвостов</label>
        <input type="text" id="tWhy" value="увольнение работника"></div>
      <button class="btn btn-secondary" onclick="KU.uiTails()">Перевести хвосты на заведующего</button>
    </div>
    <div class="banner ${g.ok ? 'info' : 'danger'}"><b>${g.ok ? 'Гейт пропускает' : 'Гейт держит'}:</b>
      ${esc(gEmp.name)} — ${esc(g.why)}</div>
    ${tails.length ? `<table class="cgrid"><thead><tr>
      <th>Объект</th><th>Роль</th><th>Заёмщик</th><th>Работа на объекте</th>
      </tr></thead><tbody>${gateRows}</tbody></table>`
      : '<div class="note">За работником нет открытых закреплений.</div>'}`;
}

/* Объекты, приехавшие в подразделение, у которого правила этой роли нет. */
function fallbackTable(unitId, roleId) {
  const st = KU.state, kindId = (KU.role(roleId) || {}).kind;
  const objs = st.objects.filter(o => o.kind === kindId && o.born <= st.asOf &&
    KU.decide(o.id, roleId, st.asOf).unitId === unitId);
  if (!objs.length) return '<div class="note">Объектов, приехавших в это подразделение, на дату среза нет.</div>';
  return `<div class="section-h">Объекты на руках заведующего</div>${objList(objs, roleId)}`;
}

const STUBS = {
  show: { stage: 'этап 5', tasks: 'P18-R18 · P18-R19 · P18-R20',
    lead: 'Витрины и журнал в карточке объекта — то, чем перекос и дыры становятся видимыми.',

      'витрина «живут вне правила» — расхождение журнала с ячейкой; расчёт уже есть в волне 1 (KU.offRule)',
      'витрина фолбэка «держится дольше порога» — счётчик уже считается и стоит в подвале слева',
      'журнал закреплений в карточке объекта: карточка чужого модуля, кураторство отдаёт ей ответ и историю'] },
};
