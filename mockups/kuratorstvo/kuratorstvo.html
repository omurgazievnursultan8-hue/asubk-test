  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Кураторство» (TO-BE). ВОЛНЫ 1–4.
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Закрепление считается журналом, обе ступени правила
  собраны ИЗ ДАННЫХ, фолбэк-лестница и пороги давности работают, редакция правила заводится
  правкой и вступает датой. Волна 2 добавила движение закрепления: пересчёт с предпросмотром и
  четырьмя корзинами, очередь передач с приёмом, закрепление рукой и возврат к правилу,
  ретро-правку с запертым периодом. Волна 3 добавила ответственность: реестр отстранений со
  своим экраном, второй ответ шва (закреплённый ≠ действующий) через контракт модуля
  сотрудников, период ответственности с вычетом отстранения, ведущего куратора заёмщика
  вычислением и гейт увольнения с переводом хвостов. Волна 4 добавила справочник признаков:
  администратор заводит группировку целиком, версионирует её своими редакциями, снимает датой
  по обратному индексу и видит, чьи ячейки при этом осиротеют. Движок не знает ни одной роли
  и ни одного подразделения по имени: правила, признаки, роли и виды объектов приходят
  справочниками.

  Предшественник — прототип от 12.07.2026 (тот же путь, коммит 0ddd575). Он написан РАНЬШЕ
  модели и переписан здесь целиком: от POLICIES, COI и computeRecalcDemo не осталось ничего
  (`ЗАПИСКА.md`, расхождения `КУ-Д1`…`КУ-Д10` в `ASUBK-status-razrabotki.md`).
  Смоук: `node scripts/inspect/kuratorstvo-check.mjs`.
  Канон логики — постановка `docs/tasks/p18-kuratorstvo-tasks.html` (5 этапов, 20 карточек);
  словарь — `CONTEXT.md`, раздел «Кураторство»; журнал волн — `ASUBK-status-razrabotki.md`.
  Собственной спеки у модуля нет и не будет: та, на которую ссылался прототип, утрачена.

  РЕШЕНИЯ, НА КОТОРЫХ СТОИТ МОДУЛЬ
  ADR-0116 кураторство — измерение, а не поле: журнал закреплений, вопрос всегда с датой,
           ответов два — закреплённый и действующий;
  ADR-0117 две ступени правила: верхняя (объект, роль) → подразделение у администратора
           кураторства, родильная; нижняя (подразделение, роль) → работник у заведующего,
           живая; пустая ячейка отдаёт объект на ступень выше;
  ADR-0118 отстранение — своё датированное измерение по паре «работник и заёмщик»,
           закрепление живёт, меняется действующий исполнитель;
  ADR-0023 подразделение меняется только передачей с приёмом; закрепление по взысканию
           живёт на требовании, требований у кредита может быть несколько.

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (ИУ-1…ИУ-26)
  ИУ-1  Атрибута «куратор» нет ни на одном объекте — ответ даёт журнал на дату (ADR-0116).
  ИУ-2  Ответов два: закреплённый (ответственность за период) и действующий (кому уходит
        работа); путать их нельзя (ADR-0116).
  ИУ-3  Единственный законный пустой ответ — вопрос на дату, когда объекта ещё не было.
  ИУ-4  Журнал append-only: запись закрывается датой и добавляется новая, правки на месте нет.
  ИУ-5  Закрепление не закрывается судьбой объекта: куратор жив и после погашения (ADR-0116).
  ИУ-6  Правил холдинга столько, сколько назначаемых ролей, — по одному на роль, у каждого
        свой ключ признаков; общей таблицы «объект → отдел» не существует (ADR-0117).
        Ключ объявляет и разбиение домена каждого признака на доли: ячейки — произведение
        ДОЛЕЙ, а не значений. Раскладка живёт в СПРАВОЧНИКЕ ПРИЗНАКА, а редакция правила
        хранит на неё ССЫЛКУ: имя доли обязано значить одно и то же во всех правилах
        холдинга, иначе витрины двух подразделений не складываются. Ретроактивность лечится
        не хранением раскладки в правиле, а собственными редакциями группировки — ответ на
        дату берёт ту, что действовала тогда. У числового признака доли задают пороги, и они
        объявляются в редакции правила: единого разбиения денег по холдингу нет
        (P18-R5, ADR-0131).
        ГРУППИРОВКУ ЗАВОДИТ АДМИНИСТРАТОР КУРАТОРСТВА, и только он: доли едины на холдинг.
        Имя доли уникально в пределах признака — исключение одно, служебная «Прочие», которая
        есть в КАЖДОЙ группировке, даже когда домен разложен без остатка: справочник-источник
        пополняется чужими руками, и новая строка обязана приехать в существующую ячейку
        (ИУ-9). Раскладка набирается руками, из колонки справочника-источника её можно
        списать одним нажатием — списать, а не привязать: связь не хранится, иначе чужая
        правка в чужом справочнике переписывала бы наши прошлые ответы (ИУ-11).
        Первая редакция группировки — не раньше сегодня, та же граница, что у редакции
        правила. Удаления нет: группировка закрывается ДАТОЙ СНЯТИЯ, и лишь если после этой
        даты на неё не смотрит ни одна редакция ни одного правила; на уходящую и на ещё не
        вступившую сослаться нельзя — редакция правила бессрочна и пережила бы её.
        Признак попадает в справочник только через гейт из четырёх условий: конечный домен
        из справочника (или число с объявленным разбиением) · принадлежит виду объекта ·
        известен в момент рождения · читается у названного источника и сам кураторством не
        считается. Источник объявлен на признаке — заёмщик, объект, предмет залога или
        требование; заёмщицкие признаки объект НЕ хранит, правило спрашивает их у заёмщика
        запросом на дату (ADR-0131, ADR-0001).
        В каноне ролей пять; в макете их четыре — «Региональный исполнитель» снят
        16.08.2026 по решению заказчика, пока роль на паузе.
  ИУ-7  Верхняя ступень родильная: правка не переставляет живущие объекты, пересчёта у неё
        нет вовсе и кнопки тоже — цена правки меряется датой вступления (ADR-0117).
  ИУ-8  Пустая ячейка нижней ступени отдаёт объект заведующему отделом; пустая или
        отсутствующая верхняя — администратору кураторства (ADR-0117).
  ИУ-9  «Объект без куратора» невозможен; дефект переформулирован в «держится фолбэком дольше
        порога»: заявка 2 · требование 3 · кредит 5 · предмет залога 5 рабочих дней, числа
        живут в справочнике (ADR-0117).
  ИУ-10 Правка правила создаёт новую редакцию с датой вступления; действующая редакция не
        переписывается, дата вступления не ставится в прошлое.
  ИУ-11 Распределение детерминировано: те же признаки на ту же дату дают то же имя; нагрузка
        в правило не входит, перекос показывается витриной (ADR-0117).
  ИУ-12 Подразделение меняется только передачей с приёмом — ни правка верхнего правила, ни
        пересчёт его не двигают (ADR-0023).
  ИУ-13 Роли не вытесняют друг друга: каждая принадлежит ровно одному виду объекта, у
        предмета залога их две и приезжают они в разные подразделения (ADR-0117).
  ИУ-14 Ведущий куратор заёмщика не назначается — вычисляется; в журнале его нет.
  ИУ-15 Решение хранит СНИМОК признаков на свою дату: признак объекта поменялся в соседнем
        модуле — куратор сам по себе не двигается, переставляет только пересчёт (P18-R9).
  ИУ-16 Пересчёт запускает заведующий кнопкой; фонового нет, у администратора кнопки нет ни на
        одном экране. Корзин четыре, и ручные закрепления пересчёт не трогает (P18-R11).
  ИУ-17 Критерий рукопожатия — незакрытая работа на объекте. Признак не хранится: спрашивается
        у источников на момент пересчёта, молчание источника трактуется в безопасную сторону —
        работа считается незакрытой, и это пишется в отчёт (P18-R12).
  ИУ-18 До приёма передачи не изменилось ничего: куратор прежний, полномочия переходят датой
        приёма; отклонение возвращает объект отправителю и журнал не трогает (P18-R10).
  ИУ-19 Закрепление рукой требует причины, держится вне правила до отмены, и снимается только
        отдельным действием «вернуть к правилу»; на отстранённого работника не сохраняется (P18-R13).
  ИУ-20 Задним числом можно, пока период не заперт фактом, закрытым именем прежнего куратора:
        дата вступления поджимается к первому свободному дню, а не отклоняется (P18-R14).
  ИУ-21 Отстранение — своё датированное измерение по паре «работник и заёмщик»: закрепление
        при нём живёт и не закрывается, меняется только действующий исполнитель (ADR-0118).
  ИУ-22 Отстранение вводит администратор кураторства по служебной записке (номер, дата, текст);
        инициировать может любой, включая самоотвод — инициатор пишется отдельно (P18-R15).
  ИУ-23 Замещающего называет модуль сотрудников (resolveActor, P12-R12) — кураторство отсутствий
        не ведёт и замещающего не выбирает. Лестница: замещающий → заведующий отделом →
        администратор; молчание контракта трактуется в безопасную сторону, пустого действующего
        не бывает.
  ИУ-24 Период ответственности — отрезок журнала МИНУС отрезки отстранения; снятие ничего не
        стирает, ответ на дату внутри снятого отрезка остаётся прежним (ADR-0118, ИУ-4).
  ИУ-25 Ведущий куратор заёмщика вычисляется на период: наибольший остаток ОСНОВНОГО долга на
        дату начала периода, валюта — по курсу НБКР на ту же дату, проценты и пеня не считаются;
        внутри периода ответ не меняется, равенство разрешается ранним договором. Нет
        действующих кредитов — последний закрытый, нет кредитов вовсе — специалист последней
        заявки, нет объектов — законная пустота (P18-R16).
  ИУ-26 Увольнение держит не факт закреплений, а незакрытая работа на объектах; хвосты
        переводятся отдельным действием, пачкой и с причиной, записями в журнале каждого
        объекта. Администратора кураторства уволить нельзя — роль вакантной не бывает (P18-R17).

  ДЕМО ПОКРЫВАЕТ: обе ступени на живых данных · правила холдинга с разными ключами ·
  справочник признаков из двенадцати с живыми доменами и объявленным источником · признак,
  который спрашивается у заёмщика, а не хранится на объекте (отрасль, территория, вид
  заёмщика) · составной ключ (территория и вид заёмщика) · группировку из справочника
  признака (десять районов сводятся в области, десять видов залога — в «Движимое» и
  «Недвижимое») · ключ без группировки, доменом как есть (десять видов залога у ОЗО) ·
  верхний пробел (заявка блока «Услуги» держится администратором) ·
  отсутствующее правило подразделения (заявки промышленности держит заведующий) · пустую
  ячейку нижней ступени · фолбэки, часть из них просрочена ·
  смену редакции нижнего правила и ответ на прошлую дату (до 01.03.2026 — Бекова, после —
  Иванов) · объект, оставшийся вне правила после смены редакции · ручное закрепление, которое
  правилу не подчиняется · куратора, живого после погашения кредита · два требования одного
  кредита с разными кураторами · предмет залога, доехавший передачей в отдел, куда правило
  холдинга его не рожает (Ош ведёт залоги только принятыми передачами).
  ВОЛНА 2 ДОБАВИЛА В ДЕМО: пересчёт агродепартамента, дающий ровно по объекту в каждую корзину
  (тихо КД-2025/091 · рукопожатие КД-2025/033 · отстранение КД-2025/072 · рука КД-2024/205) ·
  молчащий источник «Обеспечение» — все предметы залога уходят через рукопожатие ·
  межотдельскую передачу ЗЛ-8802 с пустой ячейкой у принимающего (подставляется заведующий) ·
  запертый период КД-2024/117 (акт от 15.06.2026 именем Иванова).
  ВОЛНА 3 ДОБАВИЛА В ДЕМО: два живых отстранения разной природы — b1 (Иванов × КФХ
  «Береке-Агро», инициатор заведующий) не задевает ни одного текущего закрепления, но держит
  корзину пересчёта; b2 (Бекова × ОсОО «Дан-Азык», САМООТВОД) подменяет исполнителя на
  КД-2025/091 и вычитает 10 раб. дн. из периода ответственности · зеркало отсутствий: отпуск
  Иванова с названным замещающим (Асанов) и больничный Салтанат кызы БЕЗ замещающего (работа
  уходит заведующему) — три ступени лестницы на живых данных · тумблер «модуль сотрудников
  замолчал»: подмена включается разом на всех 21 закреплениях (безопасная сторона, ИУ-23) ·
  курс НБКР двумя редакциями и валютный КД-2025/033, который в сомах крупнее соседей, — на нём
  проверяется, что погашение 10.08 внутри периода ведущего куратора не двигает, а 01.09 двигает ·
  равенство остатков на 01.01.2025 (117 и 205 по 20 млн), разрешаемое ранним договором ·
  три хвоста фолбэка ведущего: закрытый кредит (Береке), одна заявка (Мыкты Сервис), заёмщик
  без объектов · гейт увольнения: Бекова держится горящим сроком, Асанов проходит с двумя
  хвостами, администратора не уволить никогда.
  ВОЛНА 4 ДОБАВИЛА В ДЕМО: экран справочника «Признаки и группировки» — заведение новой
  группировки целиком, её редакции, снятие датой и обратный индекс «кто на неё смотрит» ·
  колонки справочника-источника у вида залога (периодичность переоценки и «изнашиваемая
  техника», zalog.html:1487) — раскладка списывается одним нажатием, дальше руками, связь
  не хранится · колонка «Область» справочника АТЕ, которую по территории уже развернули
  в «По областям»: повторное заведение отбивается занятым именем доли · снятие «По
  регистрирующему органу» проходит (на неё не смотрит никто), «По подвижности» — нет
  (смотрят правило холдинга и правило Оша) · новая редакция «По подвижности» без доли
  «Недвижимое» сиротит по названной ячейке в обоих правилах, и задача уходит владельцу
  каждого — администратору и заведующему Ошем · «Прочие» безусловной долей во всех ключах:
  ячеек стало 3 · 9 · 9 · 27 · 3 · 12 против 2 · 8 · 8 · 16 · 2 · 8, и составной ключ
  промышленности (27 ячеек) уже виден на фоне мягкого предела в 40.

  ГРАНИЦЫ ВОЛНЫ 4: заглушкой остался один экран — «Витрины» (этап 5 постановки: нагрузка и
  перекос, «живут вне правила», просроченный фолбэк, журнал в карточке чужого модуля; расчёты
  под них уже есть). Отсутствия и замещающих кураторство НЕ ведёт: их отдаёт модуль сотрудников
  контрактом resolveActor (P12-R12) — здесь его зеркало ABSENCE_SEED и тумблер «контракт
  молчит». Курс НБКР тоже зеркало (RATES, две редакции): своего справочника валют у кураторства
  нет. Незакрытая работа и закрытые факты живут у соседних модулей — здесь их зеркала
  (WORK_SEED, FACT_SEED). Гейт увольнения показан со стороны кураторства: само увольнение
  оформляет модуль сотрудников, кураторство отвечает «держит или пропускает» и сдаёт хвосты.
  Работники, подразделения и объекты взяты зеркалом соседних модулей и здесь не
  редактируются, кроме одной демо-кнопки смены признака (ИУ-15). Домены признаков — тоже
  зеркало чужих справочников: кураторство их не пополняет и не правит, оно лишь раскладывает
  чужие значения по своим долям. Задача «пересоберите ячейки» показана реестром внутри
  макета — своей очереди задач у кураторства нет, в бою её ведёт модуль задач.

<script>
/* =====================================================================
 *  МОДУЛЬ «КУРАТОРСТВО» — исполняемый прототип, волны 1–4
 *  Слои: даты → справочники → состояние (seed) → ДВИЖОК → ШОВ → операции → экраны.
 *  Движок ничего не знает о конкретных ролях, подразделениях и признаках: он умеет
 *  только «взять правило, взять редакцию на дату, отнести значения объекта к группам
 *  этой редакции, сложить ключ, прочитать ячейку, а если пусто — подняться на ступень выше».
 * ===================================================================== */
const KU = {};

/* ------------------------------ даты -------------------------------- */
const D         = s => new Date(s + 'T00:00:00Z');
const isoOf     = dt => dt.toISOString().slice(0, 10);
const addDays   = (s, n) => { const dt = D(s); dt.setUTCDate(dt.getUTCDate() + n); return isoOf(dt); };
const prevDay   = s => addDays(s, -1);
const nextDay   = s => addDays(s, 1);
const isWorkday = s => { const w = D(s).getUTCDay(); return w !== 0 && w !== 6; };
const workdays  = (a, b) => { if (!a || !b || b < a) return 0; let n = 0, c = a; while (c <= b) { if (isWorkday(c)) n++; c = addDays(c, 1); } return n; };
const fmt       = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '—';
const TODAY     = '2026-08-15';

/* --------------------------- справочники ---------------------------- */
/* Виды объектов. sla — порог давности фолбэка в рабочих днях (ИУ-9, ADR-0117).
   birth — точка рождения: момент, когда правило срабатывает и объект получает
   закрепление (P18-R9). Точек ровно четыре, по числу видов. */
const KINDS = [
  { id: 'app',   name: 'Заявка',         sla: 2, birth: 'регистрация заявки', entry: true },
  { id: 'loan',  name: 'Кредит',         sla: 5, birth: 'подписание кредитного договора', money: true },
  { id: 'coll',  name: 'Предмет залога', sla: 5, birth: 'постановка предмета на учёт' },
  { id: 'claim', name: 'Требование',     sla: 3, birth: 'открытие требования в модуле взыскания' },
];

/* Назначаемые роли — список закрыт, каждая принадлежит ровно одному виду (ИУ-13).
   «Региональный исполнитель» снят с макета 16.08.2026 по решению заказчика — пока роль
   на паузе. В каноне (CONTEXT.md, ADR-0117, постановка P18) назначаемых ролей по-прежнему
   пять; расхождение временное и записано в ASUBK-status-razrabotki.md. */
const ROLES = [
  { id: 'spec_app',  name: 'Специалист заявки',  kind: 'app'   },
  { id: 'cur_loan',  name: 'Куратор кредита',    kind: 'loan'  },
  { id: 'cur_coll',  name: 'Куратор залога',     kind: 'coll'  },
  { id: 'cur_claim', name: 'Куратор требования', kind: 'claim' },
];
/* Производная роль: не назначается, в журнале её нет — вычисляется (ИУ-14, этап 4). */

  st.objects.slice().sort((a, b) => a.born < b.born ? -1 : 1).forEach(o => KU.born(o.id));
  ADJ_SEED.forEach(a => applyAdj(clone(a)));
  return st;
}
KU.seed = () => seed();

/* ============================ ДВИЖОК ================================= *
 *  Ни одной роли, ни одного подразделения и ни одного признака по имени.
 * ===================================================================== */
const byId = (arr, id) => arr.find(x => x.id === id) || null;
KU.dict    = { KINDS: KINDS, ROLES: ROLES, DERIVED: DERIVED, UNITS: UNITS, EMP: EMP,
               FEATURES: FEATURES, BORROWERS: BORROWERS, ACCESS: ACCESS,
               BAN_INIT: BAN_INIT, RATES: RATES };
KU.emp     = id => byId(EMP, id);
KU.unit    = id => byId(UNITS, id);
KU.role    = id => byId(ROLES, id);
KU.kind    = id => byId(KINDS, id);
/* Справочник признаков читается из состояния: администратор заводит в нём группировки,
   и эта правка обязана жить ровно один прогон (KU.seed() возвращает исходный набор). */
KU.feats   = () => (KU.state && KU.state.feats) || FEATURES;
KU.feat    = id => byId(KU.feats(), id);
KU.obj     = id => byId(KU.state.objects, id);
KU.rule    = id => byId(KU.state.rules, id);
KU.headOf  = unitId => (KU.unit(unitId) || {}).head;
KU.admin   = () => (EMP.find(e => e.admin) || {}).id;
KU.rolesOf = kindId => ROLES.filter(r => r.kind === kindId);
KU.topRule = roleId => KU.state.rules.find(r => r.scope === 'top' && r.role === roleId) || null;
KU.lowRule = (unitId, roleId) => KU.state.rules.find(r => r.scope === 'low' && r.unit === unitId && r.role === roleId) || null;

/* Редакция, действующая на дату (ИУ-10): интервалы не пересекаются. */
KU.verAt = (rule, d) => ((rule && rule.versions) || []).find(v => v.from <= d && (v.until == null || d <= v.until)) || null;
KU.verStatus = v => !v ? '—'
  : v.from > KU.state.today ? 'будущая'
  : (v.until && v.until < KU.state.today) ? 'прошлая' : 'действующая';

/* ОБЪЯВЛЕННЫЙ ИСТОЧНИК ПРИЗНАКА (ADR-0131). Признак не хранится полем на объекте: он
   читается там, где объявлен, — у заёмщика или у самого объекта. Кредит отрасль не
   держит, он её спрашивает (ADR-0001, ADR-0116). */
KU.borrower = name => ((KU.state && KU.state.subjects) || BORROWERS).find(b => b.name === name) || null;
KU.srcOf = (featId, kindId) => {
  const f = KU.feat(featId); if (!f) return null;
  return (f.srcBy && f.srcBy[kindId]) || f.src || 'self';
};
KU.featVal = (o, featId) => {
  if (!o) return null;
  if (KU.srcOf(featId, o.kind) === 'borrower') {
    const b = KU.borrower(o.borrower);
    return b ? b.f[featId] : null;
  }
  return (o.f || {})[featId];
};
/* Признаки, применимые к виду объекта, — и их значения на сейчас. Из этого берётся
   снимок решения (ИУ-15). */
KU.featsOf = kindId => KU.feats().filter(f => f.obj.indexOf(kindId) >= 0);
KU.snapOf  = o => {
  const s = {};
  if (o) KU.featsOf(o.kind).forEach(f => {
    const v = KU.featVal(o, f.id);
    if (v !== undefined && v !== null && v !== '') s[f.id] = v;
  });
  return s;
};

/* ГРУППИРОВКА ЗНАЧЕНИЙ (P18-R5, ADR-0131). Ячейки — произведение ДОЛЕЙ, а не значений.
   Раскладка домена по долям живёт в СПРАВОЧНИКЕ ПРИЗНАКА (FEATURES[].grp), а редакция
   правила хранит лишь ССЫЛКУ на неё (v.grp = {признак: идентификатор группировки}).
   Так «Недвижимое» в правиле залогового управления и «Недвижимое» в правиле областного
   отдела значат одно и то же, и витрины двух подразделений складываются.
   Ретроактивность лечится не хранением раскладки в правиле, а собственными редакциями
   группировки: ответ на дату берёт ту, что действовала тогда (ИУ-10, ИУ-11).
   Ссылки нет — каждое значение домена своей долей. Значение, не отнесённое ни к одной
   доле, попадает в «Прочие»: доля есть ВСЕГДА, даже когда домен разложен без остатка,
   потому что справочник-источник пополняется чужими руками и новая строка обязана
   приехать в существующую ячейку, а не породить необслуживаемую (ИУ-9).
   У числового признака доли задают ПОРОГИ, и они объявляются в редакции правила
   (v.cuts), а не в справочнике: единого холдингового разбиения денег нет. */
KU.OTHER = 'Прочие';
/* Доля-заглушка на дату, когда группировка ещё не заведена или уже снята. Молча вернуть
   сырое значение домена нельзя: ключ бесшумно сменил бы разрядность (ИУ-6, ИУ-11). */
KU.NOGRP = 'группировка не действует';
/* Мягкий предел размера ключа — в ЯЧЕЙКАХ, а не в признаках: три признака по десять долей
   опаснее шести по два. За порогом экран предупреждает, но не запрещает (ADR-0131). */
KU.CELL_SOFT = 40;
KU.dom   = featId => (KU.feat(featId) || { domain: [] }).domain || [];
KU.isNum = featId => !!(KU.feat(featId) || {}).num;

KU.grpList = featId => ((KU.feat(featId) || {}).grp) || [];
KU.grpDef  = (featId, grpId) => KU.grpList(featId).find(g => g.id === grpId) || null;
/* Редакция группировки, действующая на дату (ИУ-10). До первой редакции и после снятия
   ответа НЕТ — возвращается null. Подставлять первую редакцию задним числом нельзя:
   группировка, заведённая сегодня, ответила бы на прошлый год, и один и тот же вопрос
   к одной и той же дате дал бы вчера один ответ, а сегодня другой (ИУ-11). */
KU.grpVer  = (featId, grpId, d) => {
  const g = KU.grpDef(featId, grpId); if (!g) return null;
  const day = d || KU.state.today;
  return g.versions.find(x => x.from <= day && (x.until == null || day <= x.until)) || null;
};
/* Крайние даты жизни группировки: первая редакция и дата снятия (null — не снята). */
KU.grpFirst = (featId, grpId) => {
  const g = KU.grpDef(featId, grpId);
  return g && g.versions.length ? g.versions[0].from : null;
};
KU.grpOff   = (featId, grpId) => {
  const g = KU.grpDef(featId, grpId); if (!g || !g.versions.length) return null;
  const last = g.versions[g.versions.length - 1];
  return last.until ? nextDay(last.until) : null;
};
KU.grpLast  = (featId, grpId) => {
  const g = KU.grpDef(featId, grpId);
  return g && g.versions.length ? g.versions[g.versions.length - 1] : null;
};
KU.grpActs  = (featId, grpId, d) => !!KU.grpVer(featId, grpId, d);
KU.grpRef  = (v, featId) => (v && v.grp && v.grp[featId]) || null;
/* Колонки справочника-источника, из которых раскладку можно предзаполнить. */
KU.propList = featId => ((KU.feat(featId) || {}).props) || [];
KU.propDef  = (featId, propId) => KU.propList(featId).find(p => p.id === propId) || null;
KU.cutsOf  = (v, featId) => (v && v.cuts && v.cuts[featId]) || (KU.feat(featId) || {}).cutsDefault || [];

KU.fmtNum  = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
KU.numBands = cuts => {
  if (!cuts || !cuts.length) return ['любая'];
  const out = ['до ' + KU.fmtNum(cuts[0])];
  for (let i = 1; i < cuts.length; i++) out.push(KU.fmtNum(cuts[i - 1]) + ' – ' + KU.fmtNum(cuts[i]));
  out.push('от ' + KU.fmtNum(cuts[cuts.length - 1]));
  return out;
};
KU.numBand = (cuts, val) => {
  const b = KU.numBands(cuts);
  if (!cuts || !cuts.length) return b[0];
  const n = Number(val);
  for (let i = 0; i < cuts.length; i++) if (n < cuts[i]) return b[i];
  return b[b.length - 1];
};

KU.groupOf = (v, featId, val, d) => {
  if (KU.isNum(featId)) return KU.numBand(KU.cutsOf(v, featId), val);
  const ref = KU.grpRef(v, featId); if (!ref) return val;
  const ver = KU.grpVer(featId, ref, d); if (!ver) return KU.NOGRP;
  return ver.map[val] || KU.OTHER;
};
/* Список долей признака в порядке домена. «Прочие» — последней и БЕЗУСЛОВНО: разложенный
   без остатка домен завтра пополнится, и без открытой доли новое значение осталось бы
   без ячейки (ИУ-9). Ссылка есть, а редакции на дату нет — одна доля-заглушка. */
KU.groupsOf = (v, featId, d) => {
  if (KU.isNum(featId)) return KU.numBands(KU.cutsOf(v, featId));
  const dom = KU.dom(featId), ref = KU.grpRef(v, featId);
  if (!ref) return dom.slice();
  const ver = KU.grpVer(featId, ref, d); if (!ver) return [KU.NOGRP];
  const out = [];
  dom.forEach(x => { const g = ver.map[x]; if (g && out.indexOf(g) < 0) out.push(g); });
  out.push(KU.OTHER);
  return out;
};
/* Значения, стоящие за долей — для подсказки в таблице ячеек. */
KU.valsOf = (v, featId, group, d) =>
  KU.isNum(featId) ? [] : KU.dom(featId).filter(x => KU.groupOf(v, featId, x, d) === group);

/* Значение объявленного ключа для объекта: доли признаков склеиваются в объявленном
   порядке. Значение каждого признака берётся у объявленного источника. */
KU.keyVal = (v, obj, d) => (v.key || []).map(f => {
  const val = KU.featVal(obj, f);
  return (val === undefined || val === null || val === '') ? '—' : KU.groupOf(v, f, val, d);
}).join(' | ');

/* Пространство ячеек = декартово произведение долей признаков ключа. */
KU.space = (v, d) => (v.key || []).reduce((acc, f) => {
  const gr = KU.groupsOf(v, f, d);
  return acc.length ? acc.reduce((r, a) => r.concat(gr.map(g => a + ' | ' + g)), []) : gr.slice();
}, []);

/* Обе ступени + фолбэк-лестница (ИУ-8). Ответ всегда есть — «без куратора» невозможно (ИУ-9). */
function decideRaw(objId, roleId, d) {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const top = KU.topRule(roleId);
  const tv = KU.verAt(top, d);
  const tCell = tv ? KU.keyVal(tv, o, d) : null;
  const unitId = tv ? tv.cells[tCell] : null;
  if (!unitId) {
    return { ok: true, unitId: null, empId: KU.admin(), src: 'фолбэк', level: 'верхняя',
      cellTop: tCell, ver: null,
      why: tv ? 'верхнее правило не называет подразделения для ячейки «' + tCell + '»'
              : 'верхнего правила для этой роли нет' };
  }
  const low = KU.lowRule(unitId, roleId);
  if (!low) {
    return { ok: true, unitId: unitId, empId: KU.headOf(unitId), src: 'фолбэк', level: 'нижняя',
      cellTop: tCell, cellLow: null, ver: null,
      why: 'правила подразделения для этой роли нет' };
  }
  const lv = KU.verAt(low, d);
  const lCell = lv ? KU.keyVal(lv, o, d) : null;
  const empId = lv ? lv.cells[lCell] : null;
  if (!empId) {
    return { ok: true, unitId: unitId, empId: KU.headOf(unitId), src: 'фолбэк', level: 'нижняя',
      cellTop: tCell, cellLow: lCell, ver: lv ? { ruleId: low.id, no: lv.no } : null,
      why: lv ? 'ячейка «' + lCell + '» в правиле подразделения не названа'
              : 'на эту дату у правила подразделения нет действующей редакции' };
  }
  return { ok: true, unitId: unitId, empId: empId, src: 'правило', level: null,
    cellTop: tCell, cellLow: lCell, ver: { ruleId: low.id, no: lv.no },
    why: 'правило подразделения, редакция ' + lv.no + ', ячейка «' + lCell + '»' };
}
/* Решение несёт СНИМОК признаков на свою дату (P18-R9): дальше признак объекта может
   поменяться в соседнем модуле — куратора это само по себе не двигает. */
KU.decide = (objId, roleId, d) => {
  const r = decideRaw(objId, roleId, d), o = KU.obj(objId);
  if (r.ok && o) r.snap = KU.snapOf(o);
  return r;
};

/* Рождение объекта: правила запускаются по ВСЕМ ролям своего вида (ИУ-13).
   Точка рождения своя у каждого вида (KINDS.birth), преемства между заявкой и
   кредитом нет: кредит закрепляется своим правилом заново (P18-R9). */
KU.born = objId => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const point = (KU.kind(o.kind) || {}).birth;
  const made = KU.rolesOf(o.kind).map(r => {
    const d = KU.decide(objId, r.id, o.born);
    return push({ objId: o.id, role: r.id, empId: d.empId, unitId: d.unitId, from: o.born, to: null,
      src: d.src, ver: d.ver, by: 'система', at: point, snap: d.snap,
      reason: d.why });
  });
  return { ok: true, made: made, at: point };
};

function push(rec) {
  const st = KU.state;
  rec.id = 'j' + (st.seq++);
  st.journal.push(rec);
  return rec;
}
function openRec(objId, roleId, d) {
  return KU.state.journal.find(r => r.objId === objId && r.role === roleId &&
    r.from <= d && (r.to == null || d <= r.to)) || null;
}
function applyAdj(a) {
  const cur = openRec(a.objId, a.role, a.from);
  if (cur) cur.to = prevDay(a.from);
  const o = KU.obj(a.objId);
  return push({ objId: a.objId, role: a.role, empId: a.empId, unitId: a.unitId, from: a.from, to: null,
    src: a.src, ver: a.ver, by: a.by, at: a.at || null, retro: a.retro || false,
    snap: o ? KU.snapOf(o) : null, reason: a.reason });
}
/* Журнал объекта целиком — для карточки и для приёмки передачи (пара записей без разрыва). */
KU.journalOf = (objId, roleId) => KU.state.journal
  .filter(r => r.objId === objId && (!roleId || r.role === roleId))
  .slice().sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : (a.id < b.id ? -1 : 1));

/* ============================== ШОВ ================================== *
 *  curatorOn(объект, роль, дата) — единственная дверь наружу (ADR-0116).
 *  Ответов два и они расходятся: ЗАКРЕПЛЁННЫЙ отвечает за период (журнал),
 *  ДЕЙСТВУЮЩИЙ получает работу сегодня. Расходятся они на отстранении и
 *  отсутствии; замещающего называет модуль сотрудников (resolveActor,
 *  P12-R12) — кураторство его не хранит и не выбирает (ИУ-2, ИУ-23).
 * ===================================================================== */
KU.curatorOn = (objId, roleId, d) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет: ' + objId };
  if (!d)  return { ok: false, why: 'вопрос без даты не принимается — «текущий куратор» это дата «сегодня»' };
  if (d < o.born) return { ok: false, empty: true,
    why: 'на ' + fmt(d) + ' объекта ещё не было (рождён ' + fmt(o.born) + ') — единственный законный пустой ответ' };
  const rec = openRec(objId, roleId, d);
  if (!rec) return { ok: false, why: 'разрыв в журнале — состояние невозможное (ИУ-9)' };
  const emp = KU.emp(rec.empId) || { name: rec.empId };
  const kind = KU.kind(o.kind);
  const held = rec.src === 'фолбэк' ? workdays(rec.from, d) : 0;
  const act = KU.actingFor(objId, roleId, d) || { empId: rec.empId, substituted: false, why: '' };
  const actEmp = KU.emp(act.empId) || { name: act.empId };
  return { ok: true,
    assigned: rec.empId, assignedName: emp.name,
    acting: act.empId, actingName: actEmp.name, substituted: act.substituted,
    actingWhy: act.why, actingStep: act.step || null, ban: act.ban || null,
    resp: KU.respOf(objId, roleId, d),
    unitId: rec.unitId, since: rec.from, src: rec.src, ver: rec.ver, reason: rec.reason,
    fallback: rec.src === 'фолбэк', heldDays: held, sla: kind.sla,
    overdue: rec.src === 'фолбэк' && held > kind.sla,
    why: 'журнал: с ' + fmt(rec.from) + ' · ' + rec.src + ' · ' + rec.reason };
};
KU.curatorsOfObject = (objId, d) => {
  const o = KU.obj(objId);
  if (!o) return [];
  return KU.rolesOf(o.kind).map(r =>
    Object.assign({ role: r.id, roleName: r.name }, KU.curatorOn(objId, r.id, d)));
};
/* Расхождение «живут вне правила»: журнал против того, что правило говорит сейчас. */
KU.offRule = (objId, roleId, d) => {
  const a = KU.curatorOn(objId, roleId, d);
  if (!a.ok) return null;
  const w = KU.decide(objId, roleId, d);
  return (w.ok && w.empId !== a.assigned) ? { now: w.empId, journal: a.assigned, src: a.src } : null;
};

/* ------------------ покрытие правила и объекты в ячейках ------------- */
KU.objectsOfRule = (rule, d) => {
  const roleId = rule.role;
  const kindId = (KU.role(roleId) || {}).kind;
  return KU.state.objects.filter(o => o.kind === kindId && o.born <= d)
    .filter(o => rule.scope === 'top' ? true : KU.decide(o.id, roleId, d).unitId === rule.unit);
};
KU.cellObjects = (rule, cell, d) => {
  const v = KU.verAt(rule, d);
  if (!v) return [];
  return KU.objectsOfRule(rule, d).filter(o => KU.keyVal(v, o, d) === cell);
};
KU.coverage = (rule, d) => {
  const v = KU.verAt(rule, d);
  if (!v) return { v: null, cells: [], named: [], holes: [], holesHot: [] };
  const cells = KU.space(v, d);
  const named = cells.filter(c => v.cells[c]);
  const holes = cells.filter(c => !v.cells[c]);
  const holesHot = holes.filter(c => KU.cellObjects(rule, c, d).length);
  return { v: v, cells: cells, named: named, holes: holes, holesHot: holesHot };
};
/* Витрина фолбэка целиком — этап 5; здесь считается только счётчик в подвале. */
KU.fallbacks = d => KU.state.objects.filter(o => o.born <= d)
  .reduce((acc, o) => acc.concat(KU.curatorsOfObject(o.id, d)
    .filter(a => a.ok && a.fallback)
    .map(a => Object.assign({ objId: o.id, kind: o.kind }, a))), []);

/* ------------------- расчёты волны 2: движение закрепления ----------- */

/* Что скажет ПРАВИЛО ПОДРАЗДЕЛЕНИЯ — от фактического подразделения из журнала,
   а не от верхней ступени: пересчёт подразделение не двигает (ИУ-12). */
KU.wantIn = (unitId, roleId, objId, d) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const low = KU.lowRule(unitId, roleId), lv = KU.verAt(low, d);
  const cell = lv ? KU.keyVal(lv, o, d) : null;
  const empId = lv ? lv.cells[cell] : null;
  if (empId) return { ok: true, empId: empId, cell: cell, ver: { ruleId: low.id, no: lv.no },
    fallback: false, why: 'правило подразделения, редакция ' + lv.no + ', ячейка «' + cell + '»' };
  return { ok: true, empId: KU.headOf(unitId), cell: cell, ver: lv ? { ruleId: low.id, no: lv.no } : null,
    fallback: true, why: !low ? 'правила подразделения для этой роли нет'
      : lv ? 'ячейка «' + cell + '» в правиле подразделения не названа'
           : 'на эту дату у правила подразделения нет действующей редакции' };
};

/* Незакрытая работа на объекте (P18-R12) — критерий рукопожатия. Признак НЕ хранится:
   спрашивается у источников на момент пересчёта. Молчание источника трактуется в
   безопасную сторону — работа считается незакрытой, и это пишется в отчёт. */
KU.workOpen = (objId, d) => {
  const st = KU.state, o = KU.obj(objId);
  if (!o) return { open: true, items: [], silent: [], why: 'объекта нет' };
  const asked  = st.sources.filter(s => (s.kinds || []).indexOf(o.kind) >= 0);
  const silent = asked.filter(s => !s.up);
  const items  = st.work.filter(w => w.objId === objId && asked.some(s => s.id === w.src))
    .map(w => ({ src: w.src, srcName: (byId(st.sources, w.src) || {}).name, what: w.what }));
  return { asked: asked.map(s => s.name), items: items,
    silent: silent.map(s => s.name), open: items.length > 0 || silent.length > 0,
    why: items.length ? items.map(i => i.srcName + ': ' + i.what).join(' · ')
      : silent.length ? 'источник молчит (' + silent.map(s => s.name).join(', ') +
          ') — работа считается незакрытой, безопасная сторона'
      : 'все источники ответили: незакрытой работы нет' };
};
/* Тот же признак по работнику — им же питается гейт увольнения (этап 4). */
KU.workOfEmp = (empId, d) => KU.state.journal
  .filter(r => r.empId === empId && r.from <= d && (r.to == null || d <= r.to))
  .filter(r => KU.workOpen(r.objId, d).open)
  .map(r => ({ objId: r.objId, role: r.role, why: KU.workOpen(r.objId, d).why }));

/* Отстранение — отдельное измерение по паре «работник и заёмщик» (ADR-0118).
   Реестр и экран приходят волной 3, читается оно уже сейчас. */
KU.banOn = (empId, borrower, d) => KU.state.bans.find(b => b.empId === empId &&
  b.borrower === borrower && b.from <= d && (b.to == null || d <= b.to)) || null;

/* Ретро-граница (P18-R14): период заперт, если в нём есть факт, закрытый ИМЕНЕМ
   куратора, который тогда вёл объект. Дата вступления поджимается к первому
   свободному дню; свободных нет — к сегодняшней. */
KU.retroFit = (objId, roleId, wanted) => {
  const st = KU.state;
  if (!wanted || wanted >= st.today) return { from: wanted || st.today, moved: false, blockers: [] };
  const blockers = st.facts
    .filter(f => f.objId === objId && f.role === roleId && f.d >= wanted && f.d <= st.today)
    .filter(f => { const r = openRec(objId, roleId, f.d); return !!r && r.empId === f.by; })
    .sort((a, b) => a.d < b.d ? -1 : 1);
  if (!blockers.length) return { from: wanted, moved: false, blockers: [] };
  const last = blockers[blockers.length - 1];
  let from = addDays(last.d, 1);
  if (from > st.today) from = st.today;
  return { from: from, moved: true, blockers: blockers, last: last,
    note: 'период до ' + fmt(last.d) + ' заперт: «' + last.what + '» закрыт именем ' +
      ((KU.emp(last.by) || {}).name || last.by) + ' — дата вступления поджата к ' + fmt(from) };
};

/* ------------------- расчёты волны 3: ответственность ---------------- */

/* Контракт МОДУЛЯ СОТРУДНИКОВ (P12-R12). Кураторство отсутствий не ведёт и замещающего
   не выбирает — оно спрашивает. Контракт молчит — молчание в безопасную сторону:
   доступность неизвестна, работа уходит выше по лестнице (ИУ-23). */
KU.resolveActor = (empId, d) => {
  const st = KU.state;
  if (!st.hr.up) return { ok: false, away: true, deputy: null, silent: true,
    why: 'модуль сотрудников молчит — доступность работника неизвестна, работа уходит выше по лестнице' };
  const a = st.absences.find(x => x.empId === empId && x.from <= d && (x.to == null || d <= x.to));
  if (!a) return { ok: true, away: false, deputy: null, silent: false, why: 'работник на месте' };
  return { ok: true, away: true, deputy: a.deputy || null, silent: false, kind: a.kind, absence: a,
    why: a.kind + ' по ' + fmt(a.to) + (a.deputy
      ? ', замещающий назван модулем сотрудников' : ', замещающий не назван') };
};

/* Второй ответ шва: кто получает работу СЕГОДНЯ. Закрепление при этом живёт — меняется
   только исполнитель (ИУ-21). Лестница: замещающий → заведующий отделом → администратор;
   подмена всегда с причиной, пустого ответа не бывает (ИУ-23). */
KU.actingFor = (objId, roleId, d) => {
  const o = KU.obj(objId), rec = openRec(objId, roleId, d);
  if (!o || !rec) return null;
  const assigned = rec.empId;
  const ban = KU.banOn(assigned, o.borrower, d);
  const abs = KU.resolveActor(assigned, d);
  if (!ban && !abs.away) return { empId: assigned, substituted: false, step: null, ban: null,
    why: 'закреплённый работник доступен: ' + abs.why };
  const cause = ban
    ? 'отстранение от заёмщика «' + o.borrower + '» с ' + fmt(ban.from) + ' · ' + ban.why
    : abs.why;
  /* кандидата отводит только отстранение или ПРЯМОЙ ответ «отсутствует»;
     молчание контракта кандидата не отводит — иначе лестница схлопнулась бы к администратору */
  const usable = e => {
    if (!e || e === assigned) return false;
    if (KU.banOn(e, o.borrower, d)) return false;
    const r = KU.resolveActor(e, d);
    return !(r.ok && r.away);
  };
  const steps = [];
  if (abs.deputy) steps.push({ empId: abs.deputy, step: 'замещающий, названный модулем сотрудников (P12-R12)' });
  steps.push({ empId: KU.headOf(rec.unitId), step: 'заведующий отделом' });
  steps.push({ empId: KU.admin(), step: 'администратор кураторства' });
  const pick = steps.filter(s => usable(s.empId))[0] ||
    { empId: KU.admin(), step: 'администратор кураторства' };
  return { empId: pick.empId, substituted: true, step: pick.step, ban: ban || null,
    absence: abs.away && !abs.silent ? abs.absence : null, cause: cause,
    why: cause + ' — работа уходит: ' + pick.step };
};

/* Период ответственности (ИУ-24): отрезок журнала МИНУС отрезки отстранения.
   Закрепление отстранением не закрывается — вычитаются только дни. */
KU.respOf = (objId, roleId, d) => {
  const rec = openRec(objId, roleId, d), o = KU.obj(objId);
  if (!rec || !o) return null;
  const end = rec.to || KU.state.today;
  const cuts = KU.state.bans
    .filter(b => b.empId === rec.empId && b.borrower === o.borrower &&
      b.from <= end && (b.to == null || b.to >= rec.from))
    .map(b => ({ banId: b.id, why: b.why,
      from: b.from > rec.from ? b.from : rec.from,
      to: (b.to == null || b.to > end) ? end : b.to }));
  const days = workdays(rec.from, end);
  const cut = cuts.reduce((n, c) => n + workdays(c.from, c.to), 0);
  const head = 'с ' + fmt(rec.from) + (rec.to ? ' по ' + fmt(rec.to) : ' по сегодня') +
    ' — ' + days + ' раб. дн.';
  return { from: rec.from, to: rec.to, end: end, open: !rec.to, empId: rec.empId,
    days: days, cutDays: cut, net: days - cut, cuts: cuts,
    text: cuts.length
      ? head + ', из них ' + cut + ' вычтено отстранением (' +
        cuts.map(c => fmt(c.from) + '—' + fmt(c.to)).join(', ') +
        '): за эти дни закреплённый не отвечает, но закрепление не закрывалось'
      : head + ' целиком' };
};

/* Витрина расхождения двух ответов: где сегодня закреплённый ≠ действующий. */
KU.substitutions = d => KU.state.objects.filter(o => o.born <= d)
  .reduce((acc, o) => acc.concat(KU.curatorsOfObject(o.id, d)
    .filter(a => a.ok && a.substituted)
    .map(a => Object.assign({ objId: o.id, kind: o.kind, borrower: o.borrower }, a))), []);

/* Ведущий куратор заёмщика (P18-R16, ИУ-25) — не назначается и нигде не лежит: вычисляется.
   Наибольший остаток ОСНОВНОГО долга на дату НАЧАЛА периода, валюта — по курсу НБКР на ту
   же дату; проценты и пеня не считаются. Внутри периода ответ не меняется. */
const periodStart = d => d.slice(0, 8) + '01';
KU.fx = (cur, d) => cur === 'KGS' ? 1
  : ((RATES.filter(r => r.cur === cur && r.from <= d)
      .sort((a, b) => a.from < b.from ? -1 : 1).slice(-1)[0] || { rate: 1 }).rate);
KU.odAt = (o, d) => {
  const s = (o.debt || []).filter(x => x.d <= d).sort((a, b) => a.d < b.d ? -1 : 1).slice(-1)[0];
  return s ? { od: s.od, cur: s.cur, at: s.d, rate: KU.fx(s.cur, d),
    kgs: Math.round(s.od * KU.fx(s.cur, d)) } : { od: 0, cur: 'KGS', at: null, rate: 1, kgs: 0 };
};
KU.lead = (borrower, d) => {
  const st = KU.state, day = d || st.today, start = periodStart(day);
  const mine = st.objects.filter(o => o.borrower === borrower && o.born <= day);
  if (!mine.length) return { ok: false, empty: true,
    why: 'у заёмщика «' + borrower + '» на ' + fmt(day) + ' нет ни одного объекта — законная пустота (ИУ-25)' };
  /* какой вид объекта несёт основной долг, а какой служит первым контактом — сказано
     в справочнике видов (KINDS.money / KINDS.entry), а не именем в коде */
  const loans = mine.filter(o => (KU.kind(o.kind) || {}).money);
  const live = loans.filter(o => !o.closed || o.closed > day);
  const ranked = live.slice().sort((a, b) => {
    const A = KU.odAt(a, start).kgs, B = KU.odAt(b, start).kgs;
    return A !== B ? B - A : (a.born < b.born ? -1 : 1);
  });
  let obj = null, step = null, tie = false;
  if (ranked.length) {
    obj = ranked[0];
    tie = ranked.length > 1 && KU.odAt(ranked[0], start).kgs === KU.odAt(ranked[1], start).kgs;
    step = 'наибольший остаток основного долга на ' + fmt(start) +
      (tie ? '; остатки равны — взят договор, заключённый раньше' : '');
  } else if (loans.length) {
    obj = loans.slice().sort((a, b) => (a.closed || '') < (b.closed || '') ? 1 : -1)[0];
    step = 'действующих кредитов нет — ведёт куратор последнего закрытого';
  } else {
    const apps = mine.filter(o => (KU.kind(o.kind) || {}).entry)
      .sort((a, b) => a.born < b.born ? 1 : -1);
    if (apps.length) { obj = apps[0]; step = 'кредитов нет — специалист последней заявки'; }
  }
  if (!obj) return { ok: false, empty: true,
    why: 'у заёмщика «' + borrower + '» на ' + fmt(day) + ' нет ни кредитов, ни заявок — законная пустота (ИУ-25)' };
  const role = KU.rolesOf(obj.kind)[0];
  const a = KU.curatorOn(obj.id, role.id, day);
  const money = KU.odAt(obj, start);
  return { ok: true, borrower: borrower, at: day, start: start, objId: obj.id, roleId: role.id,
    step: step, tie: tie, money: money,
    empId: a.assigned, name: a.assignedName, acting: a.acting, actingName: a.actingName,
    substituted: a.substituted,
    rivals: ranked.map(o => ({ objId: o.id, money: KU.odAt(o, start), born: o.born })),
    why: 'вычислено, а не назначено: ' + step + ' — ' + obj.id +
      (money.cur === 'KGS' ? '' : ' (' + money.od + ' ' + money.cur + ' по курсу ' + money.rate + ')') +
      ', ' + money.kgs + ' сом' };
};

/* ============================ ОПЕРАЦИИ =============================== */
const accessName = () => (byId(ACCESS, KU.state.role) || {}).name;
function logIt(msg) { KU.state.log.unshift({ at: KU.state.today, who: accessName(), msg: msg }); }

/* Кто правит правило (ADR-0117: согласований между ступенями нет). */
KU.canEdit = rule => {
  const st = KU.state;
  if (!rule) return { ok: false, why: 'правила нет' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' правило не правит — только чтение' };
  if (rule.scope === 'top') return st.role === 'admin' ? { ok: true }
    : { ok: false, why: 'правило холдинга правит администратор кураторства; заведующий его видит, но не правит' };
  if (st.role === 'admin')
    return { ok: false, why: 'раскладку внутри отдела правит заведующий — администратор её не утверждает и не правит' };
  return rule.unit === st.headUnit ? { ok: true }
    : { ok: false, why: 'это правило чужого подразделения — своё у вас одно' };
};

KU.effOf  = ruleId => KU.state.eff[ruleId] || KU.state.today;
KU.setEff = (ruleId, d) => {
  if (!d) return { ok: false, why: 'дата не выбрана' };
  if (d < KU.state.today) return { ok: false, why: 'дата вступления ' + fmt(d) + ' в прошлом (ИУ-10)' };
  KU.state.eff[ruleId] = d;
  return { ok: true, note: 'новая редакция вступит ' + fmt(d) };
};

const nameOf = (rule, target) => rule.scope === 'top'
  ? (KU.unit(target) || {}).name : (KU.emp(target) || {}).name;

/* Правка ячейки = НОВАЯ РЕДАКЦИЯ с датой вступления (ИУ-10). Действующая не переписывается. */
KU.setCell = (ruleId, cell, target) => {
  const st = KU.state, rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const from = KU.effOf(ruleId);
  if (from < st.today) return { ok: false,
    why: 'дата вступления ' + fmt(from) + ' в прошлом — редакция вводится с сегодняшнего дня или позже (ИУ-10)' };
  const cur = KU.verAt(rule, st.today) || rule.versions[rule.versions.length - 1];
  if (cur.from >= from) return { ok: false,
    why: 'редакция ' + cur.no + ' вступила ' + fmt(cur.from) + ' — новая раньше вступить не может' };
  if (rule.versions.some(v => v !== cur && v.from >= from)) return { ok: false,
    why: 'на ' + fmt(from) + ' редакция уже заведена' };

  const affected = KU.cellObjects(rule, cell, st.asOf);
  const nv = { no: Math.max.apply(null, rule.versions.map(v => v.no)) + 1, from: from, until: null,
    by: accessName(), key: cur.key.slice(), grp: clone(cur.grp || {}), cuts: clone(cur.cuts || {}),
    cells: Object.assign({}, cur.cells) };
  if (target) nv.cells[cell] = target; else delete nv.cells[cell];
  cur.until = prevDay(from);
  rule.versions.push(nv);
  logIt('редакция ' + nv.no + ' правила ' + ruleId + ': ячейка «' + cell + '» → ' +
    (target ? nameOf(rule, target) : 'не назначено'));
  const note = rule.scope === 'top'
    ? 'Редакция ' + nv.no + ' вступает ' + fmt(from) + '. Ступень родильная: живущие объекты не двинутся (ИУ-7) — в ячейке их сейчас ' + affected.length + ', подразделение им меняет только передача с приёмом (ИУ-12).'
    : 'Редакция ' + nv.no + ' вступает ' + fmt(from) + '. Объектов в ячейке: ' + affected.length + ' — правка сама их не переставляет, это делает пересчёт отдельным действием с предпросмотром (этап 3).';
  return { ok: true, ver: nv.no, affected: affected.length, note: note };
};

/* Смена состава ключа, выбранных группировок и порогов (P18-R5, ADR-0131): тоже редакция.
   Имя ячейки переносится только там, где ответ доказуемо не меняется (см. carryCells). */
KU.keyDraftInit = ruleId => {
  const v = KU.verAt(KU.rule(ruleId), KU.state.today);
  KU.state.keyDraft = { ruleId: ruleId, key: v ? v.key.slice() : [],
    grp: clone((v && v.grp) || {}), cuts: clone((v && v.cuts) || {}) };
  return KU.state.keyDraft;
};
function draftOf(ruleId) {
  const d = KU.state.keyDraft;
  return (d && d.ruleId === ruleId) ? d : KU.keyDraftInit(ruleId);
}
KU.keyDraftAdd = (ruleId, featId) => {
  if (!featId) return { ok: false, why: 'признак не выбран' };
  const rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const kindId = (KU.role(rule.role) || {}).kind;
  const f = KU.feat(featId);
  if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  if ((f.obj || []).indexOf(kindId) < 0) return { ok: false,
    why: 'признак «' + f.name + '» у вида «' + KU.kind(kindId).name.toLowerCase() + '» не заведён' };
  const d = draftOf(ruleId);
  if (d.key.indexOf(featId) >= 0) return { ok: false, why: 'этот признак в ключе уже стоит' };
  d.key.push(featId);
  return { ok: true, note: 'ключ-черновик: ' + d.key.map(x => KU.feat(x).name).join(' + ') +
    ' · ячеек станет ' + KU.space(d, KU.state.today).length };
};
KU.keyDraftDrop = (ruleId, featId) => {
  const g = KU.canEdit(KU.rule(ruleId)); if (!g.ok) return g;
  const d = draftOf(ruleId);
  d.key = d.key.filter(f => f !== featId);
  delete d.grp[featId];          // признак вышел из ключа — ссылка на группировку не нужна
  delete d.cuts[featId];         // и пороги вместе с ним
  return { ok: true, note: 'ключ-черновик: ' + (d.key.map(x => KU.feat(x).name).join(' + ') || 'пуст') };
};

/* ССЫЛКА НЕ ДОЛЖНА ВИСЕТЬ В ПУСТОТЕ. Редакция правила и группировка — две независимо
   датированные вещи, и правило обязано смотреть на группировку, живую на его дату:
   иначе ключ на день вступления схлопнется в одну долю-заглушку (ИУ-6, ИУ-11). */
function grpFits(featId, grpId, day) {
  const def = KU.grpDef(featId, grpId);
  if (!def) return { ok: false, why: 'такой группировки у признака нет' };
  const first = KU.grpFirst(featId, grpId), off = KU.grpOff(featId, grpId);
  if (!KU.grpActs(featId, grpId, day)) return { ok: false,
    why: 'группировка «' + def.name + '» на ' + fmt(day) +
      (off && day >= off ? ' уже снята — её сняли с ' + fmt(off)
                         : ' ещё не действует — она вступает ' + fmt(first)) };
  /* Редакция правила бессрочна: сославшись на уходящую группировку, она пережила бы её
     и после даты снятия отвечала бы одной долей-заглушкой. Ссылку на уже назначенное
     снятие не даём — иначе снятие пришлось бы отменять задним числом (ИУ-11). */
  if (off) return { ok: false, why: 'группировка «' + def.name + '» снимается с ' + fmt(off) +
    ' — сослаться на уходящую нельзя: редакция правила бессрочна и пережила бы её' };
  return { ok: true };
}
KU.grpFits = grpFits;

/* ВЫБРАТЬ ГОТОВУЮ ГРУППИРОВКУ (ADR-0131). Заведующий не сочиняет доли — он берёт
   объявленную в справочнике признака. Пустой выбор — домен как есть, каждое значение
   своей долей. Своей разовой группировки в редакции не бывает: имя доли обязано значить
   одно и то же во всех правилах холдинга. Нужна новая — к администратору кураторства. */
KU.grpPick = (ruleId, featId, grpId) => {
  const g = KU.canEdit(KU.rule(ruleId)); if (!g.ok) return g;
  const d = draftOf(ruleId);
  if (d.key.indexOf(featId) < 0) return { ok: false, why: 'этот признак в ключе не стоит' };
  if (KU.isNum(featId)) return { ok: false,
    why: 'признак «' + KU.feat(featId).name + '» числовой — его доли задаются порогами, не группировкой' };
  const id = String(grpId || '');
  if (!id) delete d.grp[featId];
  else {
    const fit = grpFits(featId, id, KU.effOf(ruleId)); if (!fit.ok) return fit;
    d.grp[featId] = id;
  }
  const def = id ? KU.grpDef(featId, id) : null;
  const day = KU.effOf(ruleId);
  return { ok: true, note: 'признак «' + KU.feat(featId).name + '» режется ' +
    (def ? 'группировкой «' + def.name + '»' : 'доменом как есть') + ': ' +
    KU.groupsOf(d, featId, day).join(', ') +
    ' · ячеек станет ' + KU.space(d, day).length };
};
/* ПОРОГИ ЧИСЛОВОГО ПРИЗНАКА. Живут в редакции правила, а не в справочнике: единого
   холдингового разбиения денег нет, отделы режут суммы по-своему (ADR-0131). */
KU.cutsSet = (ruleId, featId, text) => {
  const g = KU.canEdit(KU.rule(ruleId)); if (!g.ok) return g;
  const d = draftOf(ruleId);
  if (d.key.indexOf(featId) < 0) return { ok: false, why: 'этот признак в ключе не стоит' };
  if (!KU.isNum(featId)) return { ok: false, why: 'признак не числовой — у него группировка, а не пороги' };
  const raw = String(text || '').replace(/\s/g, '').split(/[,;]/).filter(x => x !== '');
  const nums = raw.map(Number);
  if (nums.some(x => !isFinite(x) || x <= 0)) return { ok: false, why: 'порог должен быть положительным числом' };
  const sorted = nums.slice().sort((a, b) => a - b).filter((x, i, a) => i === 0 || x !== a[i - 1]);
  if (sorted.length !== nums.length) return { ok: false, why: 'пороги повторяются' };
  if (!sorted.length) delete d.cuts[featId]; else d.cuts[featId] = sorted;
  return { ok: true, note: 'доли признака «' + KU.feat(featId).name + '»: ' +
    KU.groupsOf(d, featId, KU.state.today).join(', ') +
    ' · ячеек станет ' + KU.space(d, KU.state.today).length };
};

/* ПЕРЕНОС ИМЁН при смене ключа или группировки. Правило одно на все случаи:
   ячейка получает имя, если ВСЕ её значения раньше вели к одному и тому же человеку —
   разделили группу, добавили признак, сузили домен. Если ответов было два (слили группы
   с разными кураторами) — ячейка остаётся пустой, за заведующего никто не выбирает.
   Это не «вслепую»: сохраняется существующий ответ, а не придумывается новый. */
/* Значения, которыми перебирается признак. У числового домена нет — берутся пробы,
   по одной в каждую долю обеих редакций сразу. */
function sampleVals(cur, nv, f) {
  if (!KU.isNum(f)) return KU.dom(f);
  const cuts = [].concat(KU.cutsOf(cur, f), KU.cutsOf(nv, f))
    .filter((x, i, a) => a.indexOf(x) === i).sort((a, b) => a - b);
  return cuts.length ? [cuts[0] - 1].concat(cuts) : [0];
}
function carryCells(cur, nv) {
  const feats = cur.key.slice();
  nv.key.forEach(f => { if (feats.indexOf(f) < 0) feats.push(f); });
  const vals = {};
  feats.forEach(f => { vals[f] = sampleVals(cur, nv, f); });
  const total = feats.reduce((n, f) => n * Math.max(vals[f].length, 1), 1);
  if (total > 20000) return { cells: {}, capped: true };     // страховка от комбинаторики
  const seen = {}, day = nv.from;
  const walk = (i, pick) => {
    if (i === feats.length) {
      const nCell = nv.key.map(f => KU.groupOf(nv, f, pick[f], day)).join(' | ');
      const oCell = cur.key.map(f => KU.groupOf(cur, f, pick[f], day)).join(' | ');
      const tgt = cur.cells[oCell] || '';
      (seen[nCell] = seen[nCell] || {})[tgt] = 1;
      return;
    }
    vals[feats[i]].forEach(val => { pick[feats[i]] = val; walk(i + 1, pick); });
  };
  walk(0, {});
  const cells = {};
  Object.keys(seen).forEach(c => {
    const answers = Object.keys(seen[c]);
    if (answers.length === 1 && answers[0]) cells[c] = answers[0];
  });
  return { cells: cells, capped: false };
}
KU.saveKey = ruleId => {
  const st = KU.state, rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const d = st.keyDraft;
  if (!d || d.ruleId !== ruleId) return { ok: false, why: 'ключ не менялся' };
  d.grp = d.grp || {}; d.cuts = d.cuts || {};
  if (!d.key.length) return { ok: false, why: 'ключ не может быть пустым — правило перестанет различать объекты' };
  const from = KU.effOf(ruleId);
  if (from < st.today) return { ok: false, why: 'дата вступления ' + fmt(from) + ' в прошлом (ИУ-10)' };
  const cur = KU.verAt(rule, st.today) || rule.versions[rule.versions.length - 1];
  if (cur.from >= from) return { ok: false,
    why: 'редакция ' + cur.no + ' вступила ' + fmt(cur.from) + ' — новая раньше вступить не может' };
  /* ссылки и пороги хранятся только по признакам ключа: вышел признак — ушло и его разбиение */
  const grp = {}, cuts = {};
  d.key.forEach(f => {
    if (d.grp[f]) grp[f] = d.grp[f];
    if (d.cuts[f]) cuts[f] = d.cuts[f].slice();
  });
  /* Дата вступления могла переехать после выбора группировки — сверяем ссылки заново
     ровно на ту дату, с которой редакция начнёт отвечать. */
  for (let i = 0; i < d.key.length; i++) {
    const f = d.key[i];
    if (!grp[f]) continue;
    const fit = grpFits(f, grp[f], from);
    if (!fit.ok) return { ok: false, why: fit.why + ' — либо сдвиньте дату редакции, либо выберите другую' };
  }
  const same = cur.key.join('|') === d.key.join('|') &&
    JSON.stringify(grp) === JSON.stringify(normGrp(cur, 'grp')) &&
    JSON.stringify(cuts) === JSON.stringify(normGrp(cur, 'cuts'));
  if (same) return { ok: false, why: 'ключ, группировки и пороги те же — редакция не нужна' };

  const nv = { no: Math.max.apply(null, rule.versions.map(v => v.no)) + 1, from: from, until: null,
    by: accessName(), key: d.key.slice(), grp: grp, cuts: cuts, cells: {} };
  const carried = carryCells(cur, nv);
  nv.cells = carried.cells;
  const space = KU.space(nv, from);
  cur.until = prevDay(from);
  rule.versions.push(nv);
  st.keyDraft = null;

  const holes = space.length - Object.keys(nv.cells).length;
  const kept = Object.keys(nv.cells).length;
  /* значения, не разложенные по группам, — предупреждение, но не запрет: правило
     остаётся рабочим, а «Прочие» видна в таблице обычной ячейкой (ИУ-9) */
  const loose = d.key.reduce((acc, f) => {
    const ver = KU.grpRef(nv, f) ? KU.grpVer(f, KU.grpRef(nv, f), from) : null;
    return acc.concat(ver ? KU.dom(f).filter(x => !ver.map[x]).map(x => KU.feat(f).name + ': ' + x) : []);
  }, []);
  logIt('редакция ' + nv.no + ' правила ' + ruleId + ': ключ → ' +
    d.key.map(f => KU.feat(f).name + '(' + KU.groupsOf(nv, f, from).length + ')').join(' + '));
  return { ok: true, ver: nv.no, holes: holes, kept: kept, loose: loose.length,
    note: 'редакция ' + nv.no + ' вступает ' + fmt(from) + ': ячеек ' + space.length +
      ', имя перенесено в ' + kept + ', без имени ' + holes +
      (holes ? ' — их держит ' + (rule.scope === 'top' ? 'администратор кураторства' : 'заведующий отделом') + ' (ИУ-8)' : '') +
      (loose.length ? ' · в «' + KU.OTHER + '» попало значений ' + loose.length + ': ' + loose.join(', ') : '') };
};
/* Ссылки (или пороги) текущей редакции, урезанные до признаков её ключа — для сравнения
   с черновиком. */
function normGrp(v, field) {
  const out = {};
  (v.key || []).forEach(f => {
    const x = v[field] && v[field][f];
    if (x) out[f] = (field === 'cuts') ? x.slice() : x;
  });
  return out;
}

/* ------------- ОПЕРАЦИИ ВОЛНЫ 2: движение закрепления ---------------- */

/* Кто трогает закрепление объекта: заведующий — своё подразделение,
   администратор — только то, что держит он сам (верхний фолбэк). */
KU.canAssign = rec => {
  const st = KU.state;
  if (!rec) return { ok: false, why: 'закрепления на сегодня нет' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' закрепление не меняет — только чтение' };
  if (!rec.unitId) return st.role === 'admin' ? { ok: true }
    : { ok: false, why: 'объект держит администратор кураторства — закрепление меняет он' };
  if (st.role === 'admin')
    return { ok: false, why: 'раскладку внутри отдела ведёт заведующий — администратор в неё не вмешивается' };
  return rec.unitId === st.headUnit ? { ok: true }
    : { ok: false, why: 'это объект чужого подразделения — своё у вас одно' };
};

/* Закрепление рукой (P18-R13): причина обязательна, держится ВНЕ правила до отмены. */
KU.assignByHand = (objId, roleId, empId, from, reason) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (!reason || !String(reason).trim()) return { ok: false,
    why: 'причина обязательна: закрепление рукой держится вне правила, и журнал должен объяснять почему' };
  const emp = KU.emp(empId);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (rec.unitId && emp.unit !== rec.unitId) return { ok: false,
    why: 'работник не из подразделения, которое ведёт объект: подразделение меняется только передачей с приёмом (ИУ-12)' };
  if (emp.id === rec.empId) return { ok: false, why: 'этот работник и так закреплён' };
  const o = KU.obj(objId);
  const ban = KU.banOn(emp.id, o.borrower, st.today);
  if (ban) return { ok: false, why: emp.name + ' отстранён от заёмщика «' + o.borrower + '» с ' +
    fmt(ban.from) + ' — назначение не сохранено (ADR-0118)' };
  const fit = KU.retroFit(objId, roleId, from || st.today);
  applyAdj({ objId: objId, role: roleId, from: fit.from, empId: emp.id, unitId: rec.unitId,
    src: 'рука', ver: null, by: accessName(), retro: fit.from < st.today,
    at: fit.moved ? 'ретро-правка, дата поджата' : (fit.from < st.today ? 'ретро-правка' : null),
    reason: String(reason).trim() });
  logIt('закрепление рукой: ' + objId + ' → ' + emp.name + ' с ' + fmt(fit.from));
  return { ok: true, from: fit.from, moved: fit.moved,
    note: (fit.moved ? fit.note + '. ' : '') + 'Закреплено рукой с ' + fmt(fit.from) + ': ' + emp.name +
      ' — источник «рука», правилу оно больше не подчиняется, пересчёт его не тронет (P18-R13).' };
};

/* Возврат к правилу (P18-R13): ручная запись закрывается, открывается обычная. */
KU.backToRule = (objId, roleId) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (rec.src !== 'рука' && rec.src !== 'переопределение')
    return { ok: false, why: 'закрепление и так стоит по правилу — возвращать не к чему' };
  if (!rec.unitId) return { ok: false, why: 'у объекта нет подразделения — правило подразделения к нему не применимо' };
  const w = KU.wantIn(rec.unitId, roleId, objId, st.today);
  if (w.empId === rec.empId) return { ok: false,
    why: 'правило называет того же работника — новая запись ничего не изменит' };
  applyAdj({ objId: objId, role: roleId, from: st.today, empId: w.empId, unitId: rec.unitId,
    src: w.fallback ? 'фолбэк' : 'правило', ver: w.ver, by: accessName(), at: 'возврат к правилу',
    reason: 'возврат к правилу: ' + w.why });
  logIt('возврат к правилу: ' + objId + ' → ' + (KU.emp(w.empId) || {}).name);
  return { ok: true, empId: w.empId,
    note: 'Вернулось к правилу: ' + (KU.emp(w.empId) || {}).name + ' — ' + w.why };
};

/* --------------------------- передачи (P18-R10) --------------------- */
KU.pendingHandoff = (objId, roleId) => KU.state.handoffs.find(h =>
  h.objId === objId && h.role === roleId && h.state === 'в очереди') || null;

KU.handoffSend = (objId, roleId, toUnit, reason) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (!toUnit) return { ok: false, why: 'принимающее подразделение не выбрано' };
  if (toUnit === rec.unitId) return { ok: false, why: 'объект и так в этом подразделении' };
  if (!reason || !String(reason).trim()) return { ok: false,
    why: 'причина обязательна — она едет в карточку приёма' };
  if (KU.pendingHandoff(objId, roleId)) return { ok: false, why: 'по этой паре передача уже в очереди' };
  const h = { id: 'h' + (st.hseq++), objId: objId, role: roleId, fromUnit: rec.unitId, toUnit: toUnit,
    sent: st.today, by: accessName(), reason: String(reason).trim(), state: 'в очереди',
    src: 'решение отдающего подразделения' };
  st.handoffs.push(h);
  logIt('передача ' + h.id + ': ' + objId + ' → ' + (KU.unit(toUnit) || {}).name);
  return { ok: true, id: h.id,
    note: 'Передача отправлена и стоит в очереди. До приёма куратор прежний: подразделение двигает только принятая передача (ИУ-12, ADR-0023).' };
};

/* Карточка приёма: работник подставляется правилом ПРИНИМАЮЩЕГО подразделения. */
KU.handoffCard = hId => {
  const st = KU.state, h = byId(st.handoffs, hId);
  if (!h) return { ok: false, why: 'передачи нет' };
  const cur = openRec(h.objId, h.role, st.today);
  const w = KU.wantIn(h.toUnit, h.role, h.objId, st.today);
  return { ok: true, h: h, cur: cur, suggest: w.empId, cell: w.cell, fallback: w.fallback, ver: w.ver,
    why: w.fallback
      ? 'ячейка принимающего подразделения пуста — подставлен заведующий отделом (ИУ-8): ' + w.why
      : 'подставлен правилом принимающего подразделения: ' + w.why };
};

function canHandle(h) {
  const st = KU.state;
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' передачу не принимает и не отклоняет — только чтение' };
  if (st.role !== 'head' || st.headUnit !== h.toUnit) return { ok: false,
    why: 'передачу разбирает принимающая сторона — заведующий подразделения ' + (KU.unit(h.toUnit) || {}).name };
  return { ok: true };
}

KU.handoffAccept = (hId, empId, reason) => {
  const st = KU.state, card = KU.handoffCard(hId);
  if (!card.ok) return card;
  const h = card.h;
  if (h.state !== 'в очереди') return { ok: false, why: 'передача уже ' + h.state };
  const g = canHandle(h); if (!g.ok) return g;
  const pick = empId || card.suggest;
  const emp = KU.emp(pick);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (emp.unit !== h.toUnit) return { ok: false, why: 'работник не из принимающего подразделения' };
  const o = KU.obj(h.objId);
  const ban = KU.banOn(pick, o.borrower, st.today);
  if (ban) return { ok: false, why: emp.name + ' отстранён от заёмщика «' + o.borrower + '» с ' +
    fmt(ban.from) + ' — приём на него не сохранён (ADR-0118)' };
  const byHand = pick !== card.suggest;
  if (byHand && (!reason || !String(reason).trim())) return { ok: false,
    why: 'замена подставленного работника требует причины — источником записи станет «переопределение»' };
  applyAdj({ objId: h.objId, role: h.role, from: st.today, empId: pick, unitId: h.toUnit,
    src: byHand ? 'переопределение' : (card.fallback ? 'фолбэк' : 'правило'),
    ver: byHand ? null : card.ver, by: accessName(), at: 'приём передачи ' + h.id,
    reason: byHand ? String(reason).trim() : card.why });
  h.state = 'принята';
  h.accepted = { d: st.today, empId: pick, by: accessName(), byHand: byHand,
    reason: byHand ? String(reason).trim() : null };
  logIt('приём передачи ' + h.id + ': ' + h.objId + ' → ' + emp.name);
  return { ok: true, empId: pick, byHand: byHand,
    note: 'Принято. Закрепление с ' + fmt(st.today) + ' в подразделении ' + (KU.unit(h.toUnit) || {}).name +
      ': ' + emp.name + (byHand ? ' (переопределение — причина в журнале)' : '') +
      '. Прежнее закрыто ' + fmt(prevDay(st.today)) + ' — журнал без разрыва.' };
};

KU.handoffReject = (hId, why) => {
  const st = KU.state, h = byId(st.handoffs, hId);
  if (!h) return { ok: false, why: 'передачи нет' };
  if (h.state !== 'в очереди') return { ok: false, why: 'передача уже ' + h.state };
  const g = canHandle(h); if (!g.ok) return g;
  if (!why || !String(why).trim()) return { ok: false,
    why: 'причина отклонения обязательна — она едет обратно отправителю' };
  h.state = 'отклонена';
  h.rejected = { d: st.today, by: accessName(), why: String(why).trim() };
  logIt('отклонение передачи ' + h.id + ': ' + String(why).trim());
  return { ok: true, note: 'Отклонено. Объект остался у отправителя — ' +
    (KU.unit(h.fromUnit) || {}).name + '; журнал не тронут.' };
};

/* --------------------------- пересчёт (P18-R11) ---------------------- */
KU.canRecalc = (unitId, roleId) => {
  const st = KU.state;
  if (st.role === 'admin') return { ok: false,
    why: 'у администратора кураторства кнопки пересчёта нет ни на одном экране: правило холдинга родильное (ИУ-7), а раскладку внутри отдела пересчитывает заведующий' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' пересчёт не запускает — только чтение' };
  if (unitId !== st.headUnit) return { ok: false, why: 'пересчитать можно только своё подразделение' };
  if (!KU.lowRule(unitId, roleId)) return { ok: false,
    why: 'у этой пары правила нет — пересчитывать нечего, объекты держит заведующий (ИУ-8)' };
  return { ok: true };
};

/* Предпросмотр четырьмя корзинами. Фонового пересчёта нет: только эта кнопка. */
KU.recalcPreview = (unitId, roleId) => {
  const st = KU.state, g = KU.canRecalc(unitId, roleId);
  if (!g.ok) return g;
  const d = st.today;
  const recs = st.journal.filter(r => r.role === roleId && r.unitId === unitId &&
    r.from <= d && (r.to == null || d <= r.to));
  const quiet = [], hand = [], blocked = [], manual = [], pending = [];
  recs.forEach(r => {
    const o = KU.obj(r.objId); if (!o) return;
    const w = KU.wantIn(unitId, roleId, r.objId, d);
    const row = { objId: r.objId, borrower: o.borrower, cur: r.empId, want: w.empId,
      cell: w.cell, ver: w.ver, src: r.src, since: r.from, reason: r.reason };
    if (r.src === 'рука' || r.src === 'переопределение') { row.same = w.empId === r.empId; manual.push(row); return; }
    if (w.empId === r.empId) return;
    if (KU.pendingHandoff(r.objId, roleId)) { pending.push(row); return; }
    const ban = KU.banOn(w.empId, o.borrower, d);
    if (ban) { row.ban = ban; blocked.push(row); return; }
    const work = KU.workOpen(r.objId, d);
    if (work.open) { row.work = work; hand.push(row); return; }
    quiet.push(row);
  });
  const v = KU.verAt(KU.lowRule(unitId, roleId), d);
  const p = { ok: true, at: d, unitId: unitId, roleId: roleId, ver: v ? v.no : null,
    quiet: quiet, hand: hand, blocked: blocked, manual: manual, pending: pending,
    silent: st.sources.filter(s => !s.up && (s.kinds || []).indexOf((KU.role(roleId) || {}).kind) >= 0)
      .map(s => s.name),
    total: quiet.length + hand.length,
    note: 'Предпросмотр на ' + fmt(d) + ': тихо ' + quiet.length + ', через рукопожатие ' + hand.length +
      ', заблокировано отстранением ' + blocked.length + ', ручных не тронуто ' + manual.length + '.' };
  st.preview = p;
  return p;
};

KU.recalcApply = (unitId, roleId) => {
  const st = KU.state, g = KU.canRecalc(unitId, roleId);
  if (!g.ok) return g;
  const p = (st.preview && st.preview.unitId === unitId && st.preview.roleId === roleId)
    ? st.preview : KU.recalcPreview(unitId, roleId);
  if (!p.ok) return p;
  let moved = 0, sent = 0;
  p.quiet.forEach(row => {
    applyAdj({ objId: row.objId, role: roleId, from: st.today, empId: row.want, unitId: unitId,
      src: 'правило', ver: row.ver, by: accessName(), at: 'пересчёт',
      reason: 'пересчёт по редакции ' + (row.ver ? row.ver.no : '—') + ', ячейка «' + row.cell + '»' });
    moved++;
  });
  p.hand.forEach(row => {
    if (KU.pendingHandoff(row.objId, roleId)) return;
    st.handoffs.push({ id: 'h' + (st.hseq++), objId: row.objId, role: roleId,
      fromUnit: unitId, toUnit: unitId, sent: st.today, by: accessName(), state: 'в очереди',
      src: 'пересчёт', want: row.want,
      reason: 'пересчёт: ' + (row.work ? row.work.why : 'незакрытая работа на объекте') });
    sent++;
  });
  st.preview = null;
  logIt('пересчёт ' + unitId + '/' + roleId + ': тихо ' + moved + ', передач ' + sent);
  return { ok: true, moved: moved, sent: sent, blocked: p.blocked.length, manual: p.manual.length,
    note: 'Применено: тихо переставлено ' + moved + ', отправлено передач ' + sent +
      ', заблокировано отстранением ' + p.blocked.length + ', ручных не тронуто ' + p.manual.length +
      '. Записи журнала ссылаются на редакцию ' + (p.ver == null ? '—' : p.ver) + '.' };
};
KU.recalcClose = () => { KU.state.preview = null;
  return { ok: true, note: 'Предпросмотр закрыт — ничего не изменилось.' }; };

/* Признак объекта поменялся в соседнем модуле (P18-R9): куратора это НЕ двигает —
   решение хранит снимок признаков на свою дату, переставляет только пересчёт. */
KU.setFeature = (objId, featId, val) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const f = KU.feat(featId);
  if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  if ((f.obj || []).indexOf(o.kind) < 0) return { ok: false,
    why: 'признак «' + f.name + '» у вида «' + KU.kind(o.kind).name.toLowerCase() + '» не заведён' };
  if (f.num) return { ok: false, why: 'признак «' + f.name + '» числовой — правится в своём модуле' };
  if ((f.domain || []).indexOf(val) < 0) return { ok: false,
    why: 'значения «' + val + '» в справочнике признака нет' };
  const was = KU.featVal(o, featId);
  if (was === val) return { ok: false, why: 'значение то же — менять нечего' };
  /* пишем ТУДА, ГДЕ ПРИЗНАК ОБЪЯВЛЕН (ADR-0131): у заёмщика или у самого объекта.
     Заёмщицкий признак меняется разом для всех его объектов — копии на объектах нет. */
  const atBorrower = KU.srcOf(featId, o.kind) === 'borrower';
  let touched = [o.id];
  if (atBorrower) {
    const b = KU.borrower(o.borrower);
    if (!b) return { ok: false, why: 'заёмщика «' + o.borrower + '» в справочнике нет' };
    b.f[featId] = val;
    touched = KU.state.objects.filter(x => x.borrower === o.borrower).map(x => x.id);
  } else o.f[featId] = val;
  const kept = KU.rolesOf(o.kind).map(r => KU.curatorOn(objId, r.id, KU.state.today))
    .filter(a => a.ok).map(a => a.assignedName);
  logIt('признак ' + (atBorrower ? o.borrower : objId) + ': ' + f.name + ' ' + was + ' → ' + val);
  return { ok: true, note: 'Признак «' + f.name + '»: ' + was + ' → ' + val +
    (atBorrower ? '. Он объявлен у заёмщика, поэтому поменялся сразу у ' + touched.length +
                  ' объект(ов) «' + o.borrower + '» — копии на объектах нет (ADR-0131).' : '.') +
    ' Куратор не двинулся (' + kept.join(', ') + '): решение хранит снимок признаков на свою дату, ' +
    'а переставляет объекты только пересчёт (P18-R9).' };
};

/* ------------- ОПЕРАЦИИ ВОЛНЫ 3: ответственность --------------------- */

/* Заёмщики берутся из объектов — своего справочника контрагентов у кураторства нет. */
KU.borrowers = () => KU.state.objects
  .reduce((acc, o) => acc.indexOf(o.borrower) < 0 ? acc.concat([o.borrower]) : acc, []).sort();
KU.bansOf = (d, empId) => KU.state.bans
  .filter(b => !empId || b.empId === empId)
  .map(b => Object.assign({}, b, { live: b.from <= d && (b.to == null || d <= b.to) }));
/* Объекты, которых отстранение касается: закрепление живёт, но исполнителя ему подменяют. */
KU.banHits = (b, d) => KU.state.journal
  .filter(r => r.empId === b.empId && r.from <= d && (r.to == null || d <= r.to))
  .filter(r => (KU.obj(r.objId) || {}).borrower === b.borrower)
  .map(r => Object.assign({ objId: r.objId, role: r.role }, KU.curatorOn(r.objId, r.role, d)));

/* Заведение отстранения (P18-R15). Реквизиты служебной записки обязательны, закрепление
   при этом НЕ закрывается: меняется только действующий исполнитель (ИУ-21, ADR-0118). */
KU.banAdd = (empId, borrower, from, init, no, noteD, text) => {
  const st = KU.state;
  if (st.role !== 'admin') return { ok: false,
    why: 'отстранение вводит администратор кураторства — ' + accessName() + ' его не заводит (P18-R15)' };
  const emp = KU.emp(empId);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (KU.borrowers().indexOf(borrower) < 0) return { ok: false,
    why: 'такого заёмщика среди объектов нет — отстранение заводится по паре «работник и заёмщик»' };
  const d = from || st.today;
  if (d > st.today) return { ok: false,
    why: 'вперёд отстранение не заводится: дата начала не позже сегодняшней' };
  if (!no || !noteD || !text || !String(text).trim()) return { ok: false,
    why: 'основание — служебная записка: нужны её номер, дата и текст (ADR-0118)' };
  if (KU.banOn(empId, borrower, d)) return { ok: false,
    why: 'по этой паре отстранение уже действует — второе не заводится' };
  const b = { id: 'b' + (st.bseq++), empId: empId, borrower: borrower, from: d, to: null,
    init: init || BAN_INIT[0], by: accessName(),
    note: { no: String(no).trim(), d: noteD, text: String(text).trim() },
    why: 'служебная записка № ' + String(no).trim() + ' от ' + fmt(noteD) };
  st.bans.push(b);
  const hits = KU.banHits(b, st.today);
  logIt('отстранение ' + b.id + ': ' + emp.name + ' × ' + borrower + ' с ' + fmt(d));
  return { ok: true, id: b.id, hits: hits.length,
    note: 'Отстранение заведено с ' + fmt(d) + ' по инициативе «' + b.init + '». Закреплений оно не закрыло' +
      (hits.length ? ' (' + hits.length + ' затронуто: работу получает замещающий или заведующий)' : '') +
      ': меняется только действующий исполнитель, а дни отстранения вычитаются из периода ответственности (ИУ-21, ИУ-24).' };
};

/* Снятие (P18-R15): запись не удаляется — закрывается датой с причиной. */
KU.banLift = (id, d, why) => {
  const st = KU.state, b = byId(st.bans, id);
  if (!b) return { ok: false, why: 'такого отстранения в реестре нет' };
  if (st.role !== 'admin') return { ok: false,
    why: 'снимает отстранение администратор кураторства — ' + accessName() + ' его не снимает' };
  if (b.to != null) return { ok: false, why: 'отстранение уже снято ' + fmt(b.to) };
  const day = d || st.today;
  if (day < b.from) return { ok: false, why: 'дата снятия раньше даты начала — отрезка не будет' };
  if (day > st.today) return { ok: false, why: 'снятие вперёд не ставится' };
  if (!why || !String(why).trim()) return { ok: false,
    why: 'причина снятия обязательна — реестр должен объяснять, почему отстранение кончилось' };
  b.to = day;
  b.lifted = { d: day, by: accessName(), why: String(why).trim() };
  logIt('снятие отстранения ' + b.id + ' датой ' + fmt(day));
  return { ok: true,
    note: 'Снято ' + fmt(day) + '. Запись из реестра не исчезла: отрезок закрыт, и ответ на дату внутри ' +
      'него остаётся прежним — история не переписывается (ИУ-4).' };
};

/* Гейт увольнения (P18-R17, ИУ-26): держит незакрытая работа, а не сам факт закреплений. */
KU.dismissGate = (empId, d) => {
  const emp = KU.emp(empId);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  const day = d || KU.state.today;
  const tails = KU.state.journal.filter(r => r.empId === empId && r.from <= day && r.to == null);
  if (emp.admin) return { ok: false, admin: true, items: [], tails: tails.length,
    why: 'администратор кураторства вакантным не бывает: уволить его нельзя, пока роль не передана другому работнику (ИУ-26)' };
  const items = KU.workOfEmp(empId, day);
  if (items.length) return { ok: false, items: items, tails: tails.length,
    why: emp.name + ': незакрытая работа на ' + items.length + ' объектах (' +
      items.map(i => i.objId).join(', ') + ') — увольнение не проходит, пока они не закрыты или не переданы' };
  return { ok: true, items: [], tails: tails.length,
    why: tails.length
      ? 'незакрытой работы нет; за работником ещё ' + tails.length +
        ' закреплений — их переводят одной пачкой, чтобы журнал не повис на уволенном'
      : 'незакрытой работы нет и хвостов нет — увольнение проходит' };
};

/* Массовый перевод хвостов на заведующего одной пачкой (P18-R17). Не удаление и не
   переписывание: по каждому объекту закрывается запись и открывается новая (ИУ-4). */
KU.moveTails = (empId, reason) => {
  const st = KU.state;
  if (st.role !== 'admin' && st.role !== 'head') return { ok: false,
    why: accessName() + ' хвосты не переводит — только чтение' };
  const emp = KU.emp(empId);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (st.role === 'head' && emp.unit !== st.headUnit) return { ok: false,
    why: 'работник чужого подразделения — хвосты сдаёт его собственный заведующий' };
  if (!reason || !String(reason).trim()) return { ok: false,
    why: 'причина обязательна — перевод пишется в журнал каждого объекта' };
  const tails = st.journal.filter(r => r.empId === empId && r.to == null).slice();
