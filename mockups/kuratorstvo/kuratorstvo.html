  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Кураторство» (TO-BE). ВОЛНЫ 1–2.
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Закрепление считается журналом, обе ступени правила
  собраны ИЗ ДАННЫХ, фолбэк-лестница и пороги давности работают, редакция правила заводится
  правкой и вступает датой. Волна 2 добавила движение закрепления: пересчёт с предпросмотром и
  четырьмя корзинами, очередь передач с приёмом, закрепление рукой и возврат к правилу,
  ретро-правку с запертым периодом. Движок не знает ни одной роли и ни одного подразделения по
  имени: правила, признаки, роли и виды объектов приходят справочниками.

  Предшественник — прототип от 12.07.2026 (тот же путь, коммит 0ddd575). Он написан РАНЬШЕ
  модели и переписан здесь целиком: от POLICIES, COI и computeRecalcDemo не осталось ничего
  (`ЗАПИСКА.md`, расхождения `КУ-Д1`…`КУ-Д10` в `ASUBK-status-razrabotki.md`).
  Смоук: `node scripts/inspect/kuratorstvo-check.mjs`.
  Канон логики — постановка `docs/tasks/p18-kuratorstvo-tasks.html` (5 этапов, 20 карточек);
  словарь — `CONTEXT.md`, раздел «Кураторство»; журнал волн — `ASUBK-status-razrabotki.md`.
  Собственной спеки у модуля нет и не будет: та, на которую ссылался прототип, утрачена.

  РЕШЕНИЯ, НА КОТОРЫХ СТОИТ МОДУЛЬ
  ADR-0116 кураторство — измерение, а не поле: журнал закреплений, вопрос всегда с датой,
           ответов два — закреплённый и действующий;
  ADR-0117 две ступени правила: верхняя (объект, роль) → подразделение у администратора
           кураторства, родильная; нижняя (подразделение, роль) → работник у заведующего,
           живая; пустая ячейка отдаёт объект на ступень выше;
  ADR-0118 отстранение — своё датированное измерение по паре «работник и заёмщик»,
           закрепление живёт, меняется действующий исполнитель;
  ADR-0023 подразделение меняется только передачей с приёмом; закрепление по взысканию
           живёт на требовании, требований у кредита может быть несколько.

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (ИУ-1…ИУ-20)
  ИУ-1  Атрибута «куратор» нет ни на одном объекте — ответ даёт журнал на дату (ADR-0116).
  ИУ-2  Ответов два: закреплённый (ответственность за период) и действующий (кому уходит
        работа); путать их нельзя (ADR-0116).
  ИУ-3  Единственный законный пустой ответ — вопрос на дату, когда объекта ещё не было.
  ИУ-4  Журнал append-only: запись закрывается датой и добавляется новая, правки на месте нет.
  ИУ-5  Закрепление не закрывается судьбой объекта: куратор жив и после погашения (ADR-0116).
  ИУ-6  Правил холдинга ровно пять — по числу назначаемых ролей, у каждого свой ключ
        признаков; общей таблицы «объект → отдел» не существует (ADR-0117).
  ИУ-7  Верхняя ступень родильная: правка не переставляет живущие объекты, пересчёта у неё
        нет вовсе и кнопки тоже — цена правки меряется датой вступления (ADR-0117).
  ИУ-8  Пустая ячейка нижней ступени отдаёт объект заведующему отделом; пустая или
        отсутствующая верхняя — администратору кураторства (ADR-0117).
  ИУ-9  «Объект без куратора» невозможен; дефект переформулирован в «держится фолбэком дольше
        порога»: заявка 2 · требование 3 · кредит 5 · предмет залога 5 рабочих дней, числа
        живут в справочнике (ADR-0117).
  ИУ-10 Правка правила создаёт новую редакцию с датой вступления; действующая редакция не
        переписывается, дата вступления не ставится в прошлое.
  ИУ-11 Распределение детерминировано: те же признаки на ту же дату дают то же имя; нагрузка
        в правило не входит, перекос показывается витриной (ADR-0117).
  ИУ-12 Подразделение меняется только передачей с приёмом — ни правка верхнего правила, ни
        пересчёт его не двигают (ADR-0023).
  ИУ-13 Роли не вытесняют друг друга: каждая принадлежит ровно одному виду объекта, у
        предмета залога их две и приезжают они в разные подразделения (ADR-0117).
  ИУ-14 Ведущий куратор заёмщика не назначается — вычисляется; в журнале его нет.
  ИУ-15 Решение хранит СНИМОК признаков на свою дату: признак объекта поменялся в соседнем
        модуле — куратор сам по себе не двигается, переставляет только пересчёт (P18-R9).
  ИУ-16 Пересчёт запускает заведующий кнопкой; фонового нет, у администратора кнопки нет ни на
        одном экране. Корзин четыре, и ручные закрепления пересчёт не трогает (P18-R11).
  ИУ-17 Критерий рукопожатия — незакрытая работа на объекте. Признак не хранится: спрашивается
        у источников на момент пересчёта, молчание источника трактуется в безопасную сторону —
        работа считается незакрытой, и это пишется в отчёт (P18-R12).
  ИУ-18 До приёма передачи не изменилось ничего: куратор прежний, полномочия переходят датой
        приёма; отклонение возвращает объект отправителю и журнал не трогает (P18-R10).
  ИУ-19 Закрепление рукой требует причины, держится вне правила до отмены, и снимается только
        отдельным действием «вернуть к правилу»; на отстранённого работника не сохраняется (P18-R13).
  ИУ-20 Задним числом можно, пока период не заперт фактом, закрытым именем прежнего куратора:
        дата вступления поджимается к первому свободному дню, а не отклоняется (P18-R14).

  составной ключ (область и форма) · верхний пробел (заявка «Услуги» держится администратором) ·

  смену редакции нижнего правила и ответ на прошлую дату (до 01.03.2026 — Бекова, после —

  кредита с разными кураторами · предмет залога с двумя ролями в двух подразделениях.

const clone = o => JSON.parse(JSON.stringify(o));

function seed() {
  const st = {
    today: TODAY, asOf: TODAY, role: 'admin', headUnit: 'u_agro', view: 'pol',
    step: 'top', polRole: 'cur_loan', polUnit: 'u_agro',

    bans: clone(BAN_SEED), sources: clone(SOURCES),
    recRole: 'cur_loan', recUnit: 'u_agro', preview: null, openObj: null, openHand: null,
  };
  KU.state = st;
  st.objects.slice().sort((a, b) => a.born < b.born ? -1 : 1).forEach(o => KU.born(o.id));
  ADJ_SEED.forEach(a => applyAdj(clone(a)));
  return st;
}
KU.seed = () => seed();

/* ============================ ДВИЖОК ================================= *
 *  Ни одной роли, ни одного подразделения и ни одного признака по имени.
 * ===================================================================== */
const byId = (arr, id) => arr.find(x => x.id === id) || null;
KU.dict    = { KINDS: KINDS, ROLES: ROLES, DERIVED: DERIVED, UNITS: UNITS, EMP: EMP,
               FEATURES: FEATURES, ACCESS: ACCESS };
KU.emp     = id => byId(EMP, id);
KU.unit    = id => byId(UNITS, id);
KU.role    = id => byId(ROLES, id);
KU.kind    = id => byId(KINDS, id);
KU.feat    = id => byId(FEATURES, id);
KU.obj     = id => byId(KU.state.objects, id);
KU.rule    = id => byId(KU.state.rules, id);
KU.headOf  = unitId => (KU.unit(unitId) || {}).head;
KU.admin   = () => (EMP.find(e => e.admin) || {}).id;
KU.rolesOf = kindId => ROLES.filter(r => r.kind === kindId);
KU.topRule = roleId => KU.state.rules.find(r => r.scope === 'top' && r.role === roleId) || null;
KU.lowRule = (unitId, roleId) => KU.state.rules.find(r => r.scope === 'low' && r.unit === unitId && r.role === roleId) || null;

/* Редакция, действующая на дату (ИУ-10): интервалы не пересекаются. */
KU.verAt = (rule, d) => ((rule && rule.versions) || []).find(v => v.from <= d && (v.until == null || d <= v.until)) || null;
KU.verStatus = v => !v ? '—'
  : v.from > KU.state.today ? 'будущая'
  : (v.until && v.until < KU.state.today) ? 'прошлая' : 'действующая';

/* Значение объявленного ключа для объекта: признаки склеиваются в объявленном порядке. */
KU.keyVal = (key, obj) => key.map(f => (obj.f || {})[f] || '—').join(' | ');

/* Пространство ячеек = декартово произведение доменов признаков ключа. */
KU.space = key => key.reduce((acc, f) => {
  const dom = (KU.feat(f) || { domain: [] }).domain;
  return acc.length ? acc.reduce((r, a) => r.concat(dom.map(d => a + ' | ' + d)), []) : dom.slice();
}, []);

/* Обе ступени + фолбэк-лестница (ИУ-8). Ответ всегда есть — «без куратора» невозможно (ИУ-9). */
function decideRaw(objId, roleId, d) {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const top = KU.topRule(roleId);
  const tv = KU.verAt(top, d);
  const tCell = tv ? KU.keyVal(tv.key, o) : null;
  const unitId = tv ? tv.cells[tCell] : null;
  if (!unitId) {
    return { ok: true, unitId: null, empId: KU.admin(), src: 'фолбэк', level: 'верхняя',
      cellTop: tCell, ver: null,
      why: tv ? 'верхнее правило не называет подразделения для ячейки «' + tCell + '»'
              : 'верхнего правила для этой роли нет' };
  }
  const low = KU.lowRule(unitId, roleId);
  if (!low) {
    return { ok: true, unitId: unitId, empId: KU.headOf(unitId), src: 'фолбэк', level: 'нижняя',
      cellTop: tCell, cellLow: null, ver: null,
      why: 'правила подразделения для этой роли нет' };
  }
  const lv = KU.verAt(low, d);
  const lCell = lv ? KU.keyVal(lv.key, o) : null;
  const empId = lv ? lv.cells[lCell] : null;
  if (!empId) {
    return { ok: true, unitId: unitId, empId: KU.headOf(unitId), src: 'фолбэк', level: 'нижняя',
      cellTop: tCell, cellLow: lCell, ver: lv ? { ruleId: low.id, no: lv.no } : null,
      why: lv ? 'ячейка «' + lCell + '» в правиле подразделения не названа'
              : 'на эту дату у правила подразделения нет действующей редакции' };
  }
  return { ok: true, unitId: unitId, empId: empId, src: 'правило', level: null,
    cellTop: tCell, cellLow: lCell, ver: { ruleId: low.id, no: lv.no },
    why: 'правило подразделения, редакция ' + lv.no + ', ячейка «' + lCell + '»' };
}
/* Решение несёт СНИМОК признаков на свою дату (P18-R9): дальше признак объекта может
   поменяться в соседнем модуле — куратора это само по себе не двигает. */
KU.decide = (objId, roleId, d) => {
  const r = decideRaw(objId, roleId, d), o = KU.obj(objId);
  if (r.ok && o) r.snap = Object.assign({}, o.f);
  return r;
};

/* Рождение объекта: правила запускаются по ВСЕМ ролям своего вида (ИУ-13).
   Точка рождения своя у каждого вида (KINDS.birth), преемства между заявкой и
   кредитом нет: кредит закрепляется своим правилом заново (P18-R9). */
KU.born = objId => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const point = (KU.kind(o.kind) || {}).birth;
  const made = KU.rolesOf(o.kind).map(r => {
    const d = KU.decide(objId, r.id, o.born);
    return push({ objId: o.id, role: r.id, empId: d.empId, unitId: d.unitId, from: o.born, to: null,
      src: d.src, ver: d.ver, by: 'система', at: point, snap: d.snap,
      reason: d.why });
  });
  return { ok: true, made: made, at: point };
};

function push(rec) {
  const st = KU.state;
  rec.id = 'j' + (st.seq++);
  st.journal.push(rec);
  return rec;
}
function openRec(objId, roleId, d) {
  return KU.state.journal.find(r => r.objId === objId && r.role === roleId &&
    r.from <= d && (r.to == null || d <= r.to)) || null;
}
function applyAdj(a) {
  const cur = openRec(a.objId, a.role, a.from);
  if (cur) cur.to = prevDay(a.from);
  const o = KU.obj(a.objId);
  return push({ objId: a.objId, role: a.role, empId: a.empId, unitId: a.unitId, from: a.from, to: null,
    src: a.src, ver: a.ver, by: a.by, at: a.at || null, retro: a.retro || false,
    snap: o ? Object.assign({}, o.f) : null, reason: a.reason });
}
/* Журнал объекта целиком — для карточки и для приёмки передачи (пара записей без разрыва). */
KU.journalOf = (objId, roleId) => KU.state.journal
  .filter(r => r.objId === objId && (!roleId || r.role === roleId))
  .slice().sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : (a.id < b.id ? -1 : 1));

/* ============================== ШОВ ================================== *
 *  curatorOn(объект, роль, дата) — единственная дверь наружу (ADR-0116).
 *  Ответов два: закреплённый и действующий. Волна 1 отдаёт их равными —
 *  отстранение и замещение приходят на этапе 4, замещающего называет
 *  модуль сотрудников (resolveActor), кураторство его не хранит.
 * ===================================================================== */
KU.curatorOn = (objId, roleId, d) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет: ' + objId };
  if (!d)  return { ok: false, why: 'вопрос без даты не принимается — «текущий куратор» это дата «сегодня»' };
  if (d < o.born) return { ok: false, empty: true,
    why: 'на ' + fmt(d) + ' объекта ещё не было (рождён ' + fmt(o.born) + ') — единственный законный пустой ответ' };
  const rec = openRec(objId, roleId, d);
  if (!rec) return { ok: false, why: 'разрыв в журнале — состояние невозможное (ИУ-9)' };
  const emp = KU.emp(rec.empId) || { name: rec.empId };
  const kind = KU.kind(o.kind);
  const held = rec.src === 'фолбэк' ? workdays(rec.from, d) : 0;
  return { ok: true,
    assigned: rec.empId, assignedName: emp.name,
    acting: rec.empId, actingName: emp.name, substituted: false,
    unitId: rec.unitId, since: rec.from, src: rec.src, ver: rec.ver, reason: rec.reason,
    fallback: rec.src === 'фолбэк', heldDays: held, sla: kind.sla,
    overdue: rec.src === 'фолбэк' && held > kind.sla,
    why: 'журнал: с ' + fmt(rec.from) + ' · ' + rec.src + ' · ' + rec.reason };
};
KU.curatorsOfObject = (objId, d) => {
  const o = KU.obj(objId);
  if (!o) return [];
  return KU.rolesOf(o.kind).map(r =>
    Object.assign({ role: r.id, roleName: r.name }, KU.curatorOn(objId, r.id, d)));
};
/* Расхождение «живут вне правила»: журнал против того, что правило говорит сейчас. */
KU.offRule = (objId, roleId, d) => {
  const a = KU.curatorOn(objId, roleId, d);
  if (!a.ok) return null;
  const w = KU.decide(objId, roleId, d);
  return (w.ok && w.empId !== a.assigned) ? { now: w.empId, journal: a.assigned, src: a.src } : null;
};

/* ------------------ покрытие правила и объекты в ячейках ------------- */
KU.objectsOfRule = (rule, d) => {
  const roleId = rule.role;
  const kindId = (KU.role(roleId) || {}).kind;
  return KU.state.objects.filter(o => o.kind === kindId && o.born <= d)
    .filter(o => rule.scope === 'top' ? true : KU.decide(o.id, roleId, d).unitId === rule.unit);
};
KU.cellObjects = (rule, cell, d) => {
  const v = KU.verAt(rule, d);
  if (!v) return [];
  return KU.objectsOfRule(rule, d).filter(o => KU.keyVal(v.key, o) === cell);
};
KU.coverage = (rule, d) => {
  const v = KU.verAt(rule, d);
  if (!v) return { v: null, cells: [], named: [], holes: [], holesHot: [] };
  const cells = KU.space(v.key);
  const named = cells.filter(c => v.cells[c]);
  const holes = cells.filter(c => !v.cells[c]);
  const holesHot = holes.filter(c => KU.cellObjects(rule, c, d).length);
  return { v: v, cells: cells, named: named, holes: holes, holesHot: holesHot };
};
/* Витрина фолбэка целиком — этап 5; здесь считается только счётчик в подвале. */
KU.fallbacks = d => KU.state.objects.filter(o => o.born <= d)
  .reduce((acc, o) => acc.concat(KU.curatorsOfObject(o.id, d)
    .filter(a => a.ok && a.fallback)
    .map(a => Object.assign({ objId: o.id, kind: o.kind }, a))), []);

/* ------------------- расчёты волны 2: движение закрепления ----------- */

/* Что скажет ПРАВИЛО ПОДРАЗДЕЛЕНИЯ — от фактического подразделения из журнала,
   а не от верхней ступени: пересчёт подразделение не двигает (ИУ-12). */
KU.wantIn = (unitId, roleId, objId, d) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const low = KU.lowRule(unitId, roleId), lv = KU.verAt(low, d);
  const cell = lv ? KU.keyVal(lv.key, o) : null;
  const empId = lv ? lv.cells[cell] : null;
  if (empId) return { ok: true, empId: empId, cell: cell, ver: { ruleId: low.id, no: lv.no },
    fallback: false, why: 'правило подразделения, редакция ' + lv.no + ', ячейка «' + cell + '»' };
  return { ok: true, empId: KU.headOf(unitId), cell: cell, ver: lv ? { ruleId: low.id, no: lv.no } : null,
    fallback: true, why: !low ? 'правила подразделения для этой роли нет'
      : lv ? 'ячейка «' + cell + '» в правиле подразделения не названа'
           : 'на эту дату у правила подразделения нет действующей редакции' };
};

/* Незакрытая работа на объекте (P18-R12) — критерий рукопожатия. Признак НЕ хранится:
   спрашивается у источников на момент пересчёта. Молчание источника трактуется в
   безопасную сторону — работа считается незакрытой, и это пишется в отчёт. */
KU.workOpen = (objId, d) => {
  const st = KU.state, o = KU.obj(objId);
  if (!o) return { open: true, items: [], silent: [], why: 'объекта нет' };
  const asked  = st.sources.filter(s => (s.kinds || []).indexOf(o.kind) >= 0);
  const silent = asked.filter(s => !s.up);
  const items  = st.work.filter(w => w.objId === objId && asked.some(s => s.id === w.src))
    .map(w => ({ src: w.src, srcName: (byId(st.sources, w.src) || {}).name, what: w.what }));
  return { asked: asked.map(s => s.name), items: items,
    silent: silent.map(s => s.name), open: items.length > 0 || silent.length > 0,
    why: items.length ? items.map(i => i.srcName + ': ' + i.what).join(' · ')
      : silent.length ? 'источник молчит (' + silent.map(s => s.name).join(', ') +
          ') — работа считается незакрытой, безопасная сторона'
      : 'все источники ответили: незакрытой работы нет' };
};
/* Тот же признак по работнику — им же питается гейт увольнения (этап 4). */
KU.workOfEmp = (empId, d) => KU.state.journal
  .filter(r => r.empId === empId && r.from <= d && (r.to == null || d <= r.to))
  .filter(r => KU.workOpen(r.objId, d).open)
  .map(r => ({ objId: r.objId, role: r.role, why: KU.workOpen(r.objId, d).why }));

/* Отстранение — отдельное измерение по паре «работник и заёмщик» (ADR-0118).
   Реестр и экран приходят волной 3, читается оно уже сейчас. */
KU.banOn = (empId, borrower, d) => KU.state.bans.find(b => b.empId === empId &&
  b.borrower === borrower && b.from <= d && (b.to == null || d <= b.to)) || null;

/* Ретро-граница (P18-R14): период заперт, если в нём есть факт, закрытый ИМЕНЕМ
   куратора, который тогда вёл объект. Дата вступления поджимается к первому
   свободному дню; свободных нет — к сегодняшней. */
KU.retroFit = (objId, roleId, wanted) => {
  const st = KU.state;
  if (!wanted || wanted >= st.today) return { from: wanted || st.today, moved: false, blockers: [] };
  const blockers = st.facts
    .filter(f => f.objId === objId && f.role === roleId && f.d >= wanted && f.d <= st.today)
    .filter(f => { const r = openRec(objId, roleId, f.d); return !!r && r.empId === f.by; })
    .sort((a, b) => a.d < b.d ? -1 : 1);
  if (!blockers.length) return { from: wanted, moved: false, blockers: [] };
  const last = blockers[blockers.length - 1];
  let from = addDays(last.d, 1);
  if (from > st.today) from = st.today;
  return { from: from, moved: true, blockers: blockers, last: last,
    note: 'период до ' + fmt(last.d) + ' заперт: «' + last.what + '» закрыт именем ' +
      ((KU.emp(last.by) || {}).name || last.by) + ' — дата вступления поджата к ' + fmt(from) };
};

/* ============================ ОПЕРАЦИИ =============================== */
const accessName = () => (byId(ACCESS, KU.state.role) || {}).name;
function logIt(msg) { KU.state.log.unshift({ at: KU.state.today, who: accessName(), msg: msg }); }

/* Кто правит правило (ADR-0117: согласований между ступенями нет). */
KU.canEdit = rule => {
  const st = KU.state;
  if (!rule) return { ok: false, why: 'правила нет' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' правило не правит — только чтение' };
  if (rule.scope === 'top') return st.role === 'admin' ? { ok: true }
    : { ok: false, why: 'верхнюю ступень правит администратор кураторства; заведующий её видит, но не правит' };
  if (st.role === 'admin')
    return { ok: false, why: 'раскладку внутри отдела правит заведующий — администратор её не утверждает и не правит' };
  return rule.unit === st.headUnit ? { ok: true }
    : { ok: false, why: 'это правило чужого подразделения — своё у вас одно' };
};

KU.effOf  = ruleId => KU.state.eff[ruleId] || KU.state.today;
KU.setEff = (ruleId, d) => {
  if (!d) return { ok: false, why: 'дата не выбрана' };
  if (d < KU.state.today) return { ok: false, why: 'дата вступления ' + fmt(d) + ' в прошлом (ИУ-10)' };
  KU.state.eff[ruleId] = d;
  return { ok: true, note: 'новая редакция вступит ' + fmt(d) };
};

const nameOf = (rule, target) => rule.scope === 'top'
  ? (KU.unit(target) || {}).name : (KU.emp(target) || {}).name;

/* Правка ячейки = НОВАЯ РЕДАКЦИЯ с датой вступления (ИУ-10). Действующая не переписывается. */
KU.setCell = (ruleId, cell, target) => {
  const st = KU.state, rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const from = KU.effOf(ruleId);
  if (from < st.today) return { ok: false,
    why: 'дата вступления ' + fmt(from) + ' в прошлом — редакция вводится с сегодняшнего дня или позже (ИУ-10)' };
  const cur = KU.verAt(rule, st.today) || rule.versions[rule.versions.length - 1];
  if (cur.from >= from) return { ok: false,
    why: 'редакция ' + cur.no + ' вступила ' + fmt(cur.from) + ' — новая раньше вступить не может' };
  if (rule.versions.some(v => v !== cur && v.from >= from)) return { ok: false,
    why: 'на ' + fmt(from) + ' редакция уже заведена' };

  const affected = KU.cellObjects(rule, cell, st.asOf);
  const nv = { no: Math.max.apply(null, rule.versions.map(v => v.no)) + 1, from: from, until: null,
    by: accessName(), key: cur.key.slice(), cells: Object.assign({}, cur.cells) };
  if (target) nv.cells[cell] = target; else delete nv.cells[cell];
  cur.until = prevDay(from);
  rule.versions.push(nv);
  logIt('редакция ' + nv.no + ' правила ' + ruleId + ': ячейка «' + cell + '» → ' +
    (target ? nameOf(rule, target) : 'не назначено'));
  const note = rule.scope === 'top'
    ? 'Редакция ' + nv.no + ' вступает ' + fmt(from) + '. Ступень родильная: живущие объекты не двинутся (ИУ-7) — в ячейке их сейчас ' + affected.length + ', подразделение им меняет только передача с приёмом (ИУ-12).'
    : 'Редакция ' + nv.no + ' вступает ' + fmt(from) + '. Объектов в ячейке: ' + affected.length + ' — правка сама их не переставляет, это делает пересчёт отдельным действием с предпросмотром (этап 3).';
  return { ok: true, ver: nv.no, affected: affected.length, note: note };
};

/* Смена состава объявленного ключа (P18-R5): тоже редакция, ячейки вслепую не переносятся. */
KU.keyDraftInit = ruleId => {
  const v = KU.verAt(KU.rule(ruleId), KU.state.today);
  KU.state.keyDraft = { ruleId: ruleId, key: v ? v.key.slice() : [] };
  return KU.state.keyDraft;
};
function draftOf(ruleId) {
  const d = KU.state.keyDraft;
  return (d && d.ruleId === ruleId) ? d : KU.keyDraftInit(ruleId);
}
KU.keyDraftAdd = (ruleId, featId) => {
  if (!featId) return { ok: false, why: 'признак не выбран' };
  const rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const kindId = (KU.role(rule.role) || {}).kind;
  const f = KU.feat(featId);
  if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  if ((f.obj || []).indexOf(kindId) < 0) return { ok: false,
    why: 'признак «' + f.name + '» у вида «' + KU.kind(kindId).name.toLowerCase() + '» не заведён' };
  const d = draftOf(ruleId);
  if (d.key.indexOf(featId) >= 0) return { ok: false, why: 'этот признак в ключе уже стоит' };
  d.key.push(featId);
  return { ok: true, note: 'ключ-черновик: ' + d.key.map(x => KU.feat(x).name).join(' + ') +
    ' · ячеек станет ' + KU.space(d.key).length };
};
KU.keyDraftDrop = (ruleId, featId) => {
  const g = KU.canEdit(KU.rule(ruleId)); if (!g.ok) return g;
  const d = draftOf(ruleId);
  d.key = d.key.filter(f => f !== featId);
  return { ok: true, note: 'ключ-черновик: ' + (d.key.map(x => KU.feat(x).name).join(' + ') || 'пуст') };
};
KU.saveKey = ruleId => {
  const st = KU.state, rule = KU.rule(ruleId);
  const g = KU.canEdit(rule); if (!g.ok) return g;
  const d = st.keyDraft;
  if (!d || d.ruleId !== ruleId) return { ok: false, why: 'ключ не менялся' };
  if (!d.key.length) return { ok: false, why: 'ключ не может быть пустым — правило перестанет различать объекты' };
  const from = KU.effOf(ruleId);
  if (from < st.today) return { ok: false, why: 'дата вступления ' + fmt(from) + ' в прошлом (ИУ-10)' };
  const cur = KU.verAt(rule, st.today) || rule.versions[rule.versions.length - 1];
  if (cur.from >= from) return { ok: false,
    why: 'редакция ' + cur.no + ' вступила ' + fmt(cur.from) + ' — новая раньше вступить не может' };
  if (cur.key.join('|') === d.key.join('|')) return { ok: false, why: 'ключ тот же — редакция не нужна' };

  const space = KU.space(d.key);
  const cells = {};
  space.forEach(c => { if (cur.cells[c]) cells[c] = cur.cells[c]; });  // переносим только совпавшие значения
  const nv = { no: Math.max.apply(null, rule.versions.map(v => v.no)) + 1, from: from, until: null,
    by: accessName(), key: d.key.slice(), cells: cells };
  cur.until = prevDay(from);
  rule.versions.push(nv);
  st.keyDraft = null;
  const holes = space.length - Object.keys(cells).length;
  logIt('редакция ' + nv.no + ' правила ' + ruleId + ': ключ → ' + d.key.map(f => KU.feat(f).name).join(' + '));
  return { ok: true, ver: nv.no, holes: holes,
    note: 'редакция ' + nv.no + ' вступает ' + fmt(from) + ': ячеек ' + space.length + ', без имени ' + holes +
      ' — их держит ' + (rule.scope === 'top' ? 'администратор кураторства' : 'заведующий отделом') + ' (ИУ-8)' };
};

/* ------------- ОПЕРАЦИИ ВОЛНЫ 2: движение закрепления ---------------- */

/* Кто трогает закрепление объекта: заведующий — своё подразделение,
   администратор — только то, что держит он сам (верхний фолбэк). */
KU.canAssign = rec => {
  const st = KU.state;
  if (!rec) return { ok: false, why: 'закрепления на сегодня нет' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' закрепление не меняет — только чтение' };
  if (!rec.unitId) return st.role === 'admin' ? { ok: true }
    : { ok: false, why: 'объект держит администратор кураторства — закрепление меняет он' };
  if (st.role === 'admin')
    return { ok: false, why: 'раскладку внутри отдела ведёт заведующий — администратор в неё не вмешивается' };
  return rec.unitId === st.headUnit ? { ok: true }
    : { ok: false, why: 'это объект чужого подразделения — своё у вас одно' };
};

/* Закрепление рукой (P18-R13): причина обязательна, держится ВНЕ правила до отмены. */
KU.assignByHand = (objId, roleId, empId, from, reason) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (!reason || !String(reason).trim()) return { ok: false,
    why: 'причина обязательна: закрепление рукой держится вне правила, и журнал должен объяснять почему' };
  const emp = KU.emp(empId);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (rec.unitId && emp.unit !== rec.unitId) return { ok: false,
    why: 'работник не из подразделения, которое ведёт объект: подразделение меняется только передачей с приёмом (ИУ-12)' };
  if (emp.id === rec.empId) return { ok: false, why: 'этот работник и так закреплён' };
  const o = KU.obj(objId);
  const ban = KU.banOn(emp.id, o.borrower, st.today);
  if (ban) return { ok: false, why: emp.name + ' отстранён от заёмщика «' + o.borrower + '» с ' +
    fmt(ban.from) + ' — назначение не сохранено (ADR-0118)' };
  const fit = KU.retroFit(objId, roleId, from || st.today);
  applyAdj({ objId: objId, role: roleId, from: fit.from, empId: emp.id, unitId: rec.unitId,
    src: 'рука', ver: null, by: accessName(), retro: fit.from < st.today,
    at: fit.moved ? 'ретро-правка, дата поджата' : (fit.from < st.today ? 'ретро-правка' : null),
    reason: String(reason).trim() });
  logIt('закрепление рукой: ' + objId + ' → ' + emp.name + ' с ' + fmt(fit.from));
  return { ok: true, from: fit.from, moved: fit.moved,
    note: (fit.moved ? fit.note + '. ' : '') + 'Закреплено рукой с ' + fmt(fit.from) + ': ' + emp.name +
      ' — источник «рука», правилу оно больше не подчиняется, пересчёт его не тронет (P18-R13).' };
};

/* Возврат к правилу (P18-R13): ручная запись закрывается, открывается обычная. */
KU.backToRule = (objId, roleId) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (rec.src !== 'рука' && rec.src !== 'переопределение')
    return { ok: false, why: 'закрепление и так стоит по правилу — возвращать не к чему' };
  if (!rec.unitId) return { ok: false, why: 'у объекта нет подразделения — правило подразделения к нему не применимо' };
  const w = KU.wantIn(rec.unitId, roleId, objId, st.today);
  if (w.empId === rec.empId) return { ok: false,
    why: 'правило называет того же работника — новая запись ничего не изменит' };
  applyAdj({ objId: objId, role: roleId, from: st.today, empId: w.empId, unitId: rec.unitId,
    src: w.fallback ? 'фолбэк' : 'правило', ver: w.ver, by: accessName(), at: 'возврат к правилу',
    reason: 'возврат к правилу: ' + w.why });
  logIt('возврат к правилу: ' + objId + ' → ' + (KU.emp(w.empId) || {}).name);
  return { ok: true, empId: w.empId,
    note: 'Вернулось к правилу: ' + (KU.emp(w.empId) || {}).name + ' — ' + w.why };
};

/* --------------------------- передачи (P18-R10) --------------------- */
KU.pendingHandoff = (objId, roleId) => KU.state.handoffs.find(h =>
  h.objId === objId && h.role === roleId && h.state === 'в очереди') || null;

KU.handoffSend = (objId, roleId, toUnit, reason) => {
  const st = KU.state;
  const rec = openRec(objId, roleId, st.today);
  const g = KU.canAssign(rec); if (!g.ok) return g;
  if (!toUnit) return { ok: false, why: 'принимающее подразделение не выбрано' };
  if (toUnit === rec.unitId) return { ok: false, why: 'объект и так в этом подразделении' };
  if (!reason || !String(reason).trim()) return { ok: false,
    why: 'причина обязательна — она едет в карточку приёма' };
  if (KU.pendingHandoff(objId, roleId)) return { ok: false, why: 'по этой паре передача уже в очереди' };
  const h = { id: 'h' + (st.hseq++), objId: objId, role: roleId, fromUnit: rec.unitId, toUnit: toUnit,
    sent: st.today, by: accessName(), reason: String(reason).trim(), state: 'в очереди',
    src: 'решение отдающего подразделения' };
  st.handoffs.push(h);
  logIt('передача ' + h.id + ': ' + objId + ' → ' + (KU.unit(toUnit) || {}).name);
  return { ok: true, id: h.id,
    note: 'Передача отправлена и стоит в очереди. До приёма куратор прежний: подразделение двигает только принятая передача (ИУ-12, ADR-0023).' };
};

/* Карточка приёма: работник подставляется правилом ПРИНИМАЮЩЕГО подразделения. */
KU.handoffCard = hId => {
  const st = KU.state, h = byId(st.handoffs, hId);
  if (!h) return { ok: false, why: 'передачи нет' };
  const cur = openRec(h.objId, h.role, st.today);
  const w = KU.wantIn(h.toUnit, h.role, h.objId, st.today);
  return { ok: true, h: h, cur: cur, suggest: w.empId, cell: w.cell, fallback: w.fallback, ver: w.ver,
    why: w.fallback
      ? 'ячейка принимающего подразделения пуста — подставлен заведующий отделом (ИУ-8): ' + w.why
      : 'подставлен правилом принимающего подразделения: ' + w.why };
};

function canHandle(h) {
  const st = KU.state;
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' передачу не принимает и не отклоняет — только чтение' };
  if (st.role !== 'head' || st.headUnit !== h.toUnit) return { ok: false,
    why: 'передачу разбирает принимающая сторона — заведующий подразделения ' + (KU.unit(h.toUnit) || {}).name };
  return { ok: true };
}

KU.handoffAccept = (hId, empId, reason) => {
  const st = KU.state, card = KU.handoffCard(hId);
  if (!card.ok) return card;
  const h = card.h;
  if (h.state !== 'в очереди') return { ok: false, why: 'передача уже ' + h.state };
  const g = canHandle(h); if (!g.ok) return g;
  const pick = empId || card.suggest;
  const emp = KU.emp(pick);
  if (!emp) return { ok: false, why: 'такого работника в справочнике нет' };
  if (emp.unit !== h.toUnit) return { ok: false, why: 'работник не из принимающего подразделения' };
  const o = KU.obj(h.objId);
  const ban = KU.banOn(pick, o.borrower, st.today);
  if (ban) return { ok: false, why: emp.name + ' отстранён от заёмщика «' + o.borrower + '» с ' +
    fmt(ban.from) + ' — приём на него не сохранён (ADR-0118)' };
  const byHand = pick !== card.suggest;
  if (byHand && (!reason || !String(reason).trim())) return { ok: false,
    why: 'замена подставленного работника требует причины — источником записи станет «переопределение»' };
  applyAdj({ objId: h.objId, role: h.role, from: st.today, empId: pick, unitId: h.toUnit,
    src: byHand ? 'переопределение' : (card.fallback ? 'фолбэк' : 'правило'),
    ver: byHand ? null : card.ver, by: accessName(), at: 'приём передачи ' + h.id,
    reason: byHand ? String(reason).trim() : card.why });
  h.state = 'принята';
  h.accepted = { d: st.today, empId: pick, by: accessName(), byHand: byHand,
    reason: byHand ? String(reason).trim() : null };
  logIt('приём передачи ' + h.id + ': ' + h.objId + ' → ' + emp.name);
  return { ok: true, empId: pick, byHand: byHand,
    note: 'Принято. Закрепление с ' + fmt(st.today) + ' в подразделении ' + (KU.unit(h.toUnit) || {}).name +
      ': ' + emp.name + (byHand ? ' (переопределение — причина в журнале)' : '') +
      '. Прежнее закрыто ' + fmt(prevDay(st.today)) + ' — журнал без разрыва.' };
};

KU.handoffReject = (hId, why) => {
  const st = KU.state, h = byId(st.handoffs, hId);
  if (!h) return { ok: false, why: 'передачи нет' };
  if (h.state !== 'в очереди') return { ok: false, why: 'передача уже ' + h.state };
  const g = canHandle(h); if (!g.ok) return g;
  if (!why || !String(why).trim()) return { ok: false,
    why: 'причина отклонения обязательна — она едет обратно отправителю' };
  h.state = 'отклонена';
  h.rejected = { d: st.today, by: accessName(), why: String(why).trim() };
  logIt('отклонение передачи ' + h.id + ': ' + String(why).trim());
  return { ok: true, note: 'Отклонено. Объект остался у отправителя — ' +
    (KU.unit(h.fromUnit) || {}).name + '; журнал не тронут.' };
};

/* --------------------------- пересчёт (P18-R11) ---------------------- */
KU.canRecalc = (unitId, roleId) => {
  const st = KU.state;
  if (st.role === 'admin') return { ok: false,
    why: 'у администратора кураторства кнопки пересчёта нет ни на одном экране: верхняя ступень родильная (ИУ-7), а раскладку внутри отдела пересчитывает заведующий' };
  if (st.role === 'reader' || st.role === 'worker')
    return { ok: false, why: accessName() + ' пересчёт не запускает — только чтение' };
  if (unitId !== st.headUnit) return { ok: false, why: 'пересчитать можно только своё подразделение' };
  if (!KU.lowRule(unitId, roleId)) return { ok: false,
    why: 'у этой пары правила нет — пересчитывать нечего, объекты держит заведующий (ИУ-8)' };
  return { ok: true };
};

/* Предпросмотр четырьмя корзинами. Фонового пересчёта нет: только эта кнопка. */
KU.recalcPreview = (unitId, roleId) => {
  const st = KU.state, g = KU.canRecalc(unitId, roleId);
  if (!g.ok) return g;
  const d = st.today;
  const recs = st.journal.filter(r => r.role === roleId && r.unitId === unitId &&
    r.from <= d && (r.to == null || d <= r.to));
  const quiet = [], hand = [], blocked = [], manual = [], pending = [];
  recs.forEach(r => {
    const o = KU.obj(r.objId); if (!o) return;
    const w = KU.wantIn(unitId, roleId, r.objId, d);
    const row = { objId: r.objId, borrower: o.borrower, cur: r.empId, want: w.empId,
      cell: w.cell, ver: w.ver, src: r.src, since: r.from, reason: r.reason };
    if (r.src === 'рука' || r.src === 'переопределение') { row.same = w.empId === r.empId; manual.push(row); return; }
    if (w.empId === r.empId) return;
    if (KU.pendingHandoff(r.objId, roleId)) { pending.push(row); return; }
    const ban = KU.banOn(w.empId, o.borrower, d);
    if (ban) { row.ban = ban; blocked.push(row); return; }
    const work = KU.workOpen(r.objId, d);
    if (work.open) { row.work = work; hand.push(row); return; }
    quiet.push(row);
  });
  const v = KU.verAt(KU.lowRule(unitId, roleId), d);
  const p = { ok: true, at: d, unitId: unitId, roleId: roleId, ver: v ? v.no : null,
    quiet: quiet, hand: hand, blocked: blocked, manual: manual, pending: pending,
    silent: st.sources.filter(s => !s.up && (s.kinds || []).indexOf((KU.role(roleId) || {}).kind) >= 0)
      .map(s => s.name),
    total: quiet.length + hand.length,
    note: 'Предпросмотр на ' + fmt(d) + ': тихо ' + quiet.length + ', через рукопожатие ' + hand.length +
      ', заблокировано отстранением ' + blocked.length + ', ручных не тронуто ' + manual.length + '.' };
  st.preview = p;
  return p;
};

KU.recalcApply = (unitId, roleId) => {
  const st = KU.state, g = KU.canRecalc(unitId, roleId);
  if (!g.ok) return g;
  const p = (st.preview && st.preview.unitId === unitId && st.preview.roleId === roleId)
    ? st.preview : KU.recalcPreview(unitId, roleId);
  if (!p.ok) return p;
  let moved = 0, sent = 0;
  p.quiet.forEach(row => {
    applyAdj({ objId: row.objId, role: roleId, from: st.today, empId: row.want, unitId: unitId,
      src: 'правило', ver: row.ver, by: accessName(), at: 'пересчёт',
      reason: 'пересчёт по редакции ' + (row.ver ? row.ver.no : '—') + ', ячейка «' + row.cell + '»' });
    moved++;
  });
  p.hand.forEach(row => {
    if (KU.pendingHandoff(row.objId, roleId)) return;
    st.handoffs.push({ id: 'h' + (st.hseq++), objId: row.objId, role: roleId,
      fromUnit: unitId, toUnit: unitId, sent: st.today, by: accessName(), state: 'в очереди',
      src: 'пересчёт', want: row.want,
      reason: 'пересчёт: ' + (row.work ? row.work.why : 'незакрытая работа на объекте') });
    sent++;
  });
  st.preview = null;
  logIt('пересчёт ' + unitId + '/' + roleId + ': тихо ' + moved + ', передач ' + sent);
  return { ok: true, moved: moved, sent: sent, blocked: p.blocked.length, manual: p.manual.length,
    note: 'Применено: тихо переставлено ' + moved + ', отправлено передач ' + sent +
      ', заблокировано отстранением ' + p.blocked.length + ', ручных не тронуто ' + p.manual.length +
      '. Записи журнала ссылаются на редакцию ' + (p.ver == null ? '—' : p.ver) + '.' };
};
KU.recalcClose = () => { KU.state.preview = null;
  return { ok: true, note: 'Предпросмотр закрыт — ничего не изменилось.' }; };

/* Признак объекта поменялся в соседнем модуле (P18-R9): куратора это НЕ двигает —
   решение хранит снимок признаков на свою дату, переставляет только пересчёт. */
KU.setFeature = (objId, featId, val) => {
  const o = KU.obj(objId);
  if (!o) return { ok: false, why: 'объекта нет' };
  const f = KU.feat(featId);
  if (!f) return { ok: false, why: 'такого признака в справочнике нет' };
  if ((f.obj || []).indexOf(o.kind) < 0) return { ok: false,
    why: 'признак «' + f.name + '» у вида «' + KU.kind(o.kind).name.toLowerCase() + '» не заведён' };
  if ((f.domain || []).indexOf(val) < 0) return { ok: false,
    why: 'значения «' + val + '» в справочнике признака нет' };
  const was = o.f[featId];
  if (was === val) return { ok: false, why: 'значение то же — менять нечего' };
  o.f[featId] = val;
  const kept = KU.rolesOf(o.kind).map(r => KU.curatorOn(objId, r.id, KU.state.today))
    .filter(a => a.ok).map(a => a.assignedName);
  logIt('признак ' + objId + ': ' + f.name + ' ' + was + ' → ' + val);
  return { ok: true, note: 'Признак «' + f.name + '»: ' + was + ' → ' + val +
    '. Куратор не двинулся (' + kept.join(', ') + '): решение хранит снимок признаков на свою дату, ' +
    'а переставляет объекты только пересчёт (P18-R9).' };
};

/* ============================== ЭКРАНЫ =============================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
/* значение ячейки едет в onclick одинарной кавычкой: экранируем и её, и разметку */
const jsq = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")
  .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/&(?!quot;|lt;)/g, '&amp;');

KU.go       = v => { KU.state.view = v; KU.state.openCell = null; KU.state.openObj = null; render(); };
KU.setRole  = r => { KU.state.role = r; KU.state.keyDraft = null; KU.state.preview = null; render(); };
KU.setHeadUnit = u => { KU.state.headUnit = u; KU.state.recUnit = u; KU.state.preview = null; render(); };
KU.pickRec  = (roleId, unitId) => {
  if (roleId) KU.state.recRole = roleId;
  if (unitId) KU.state.recUnit = unitId;
  KU.state.preview = null; render();
};
KU.toggleObj = (objId, roleId) => {
  const k = objId + '‖' + roleId;
  KU.state.openObj = KU.state.openObj === k ? null : k;
  render();
};
KU.toggleHand = hId => {
  KU.state.openHand = KU.state.openHand === hId ? null : hId;
  render();
};
/* Обёртки экрана: значения читаются из полей формы, дальше — те же операции. */
const fieldVal = id => { const el = typeof document === 'undefined' ? null : document.getElementById(id);
  return el ? el.value : ''; };
KU.uiAccept   = hId => act(KU.handoffAccept(hId, fieldVal('hEmp_' + hId), fieldVal('hWhy_' + hId)));
KU.uiReject   = hId => act(KU.handoffReject(hId, fieldVal('hWhy_' + hId)));
KU.uiSend     = (objId, roleId) => act(KU.handoffSend(objId, roleId,
  fieldVal('sUnit_' + objId), fieldVal('sWhy_' + objId)));
KU.uiByHand   = (objId, roleId) => act(KU.assignByHand(objId, roleId,
  fieldVal('aEmp_' + objId), fieldVal('aFrom_' + objId), fieldVal('aWhy_' + objId)));
KU.uiFeature  = (objId, featId) => act(KU.setFeature(objId, featId, fieldVal('fVal_' + objId)));
KU.setAsOf  = d => { KU.state.asOf = d; render(); };
KU.setStep  = s => { KU.state.step = s; KU.state.openCell = null; KU.state.keyDraft = null; render(); };
KU.pickRole = r => {
  KU.state.polRole = r; KU.state.openCell = null; KU.state.keyDraft = null;
  const us = unitsForRole(r);
  if (us.indexOf(KU.state.polUnit) < 0) KU.state.polUnit = us[0] || null;
  render();
};
KU.pickUnit = u => { KU.state.polUnit = u; KU.state.openCell = null; KU.state.keyDraft = null; render(); };
KU.toggleCell = (ruleId, cell) => {
  const k = ruleId + '‖' + cell;
  KU.state.openCell = KU.state.openCell === k ? null : k;
  render();
};

const TITLES = { pol: 'Политика распределения', rec: 'Пересчёт', hand: 'Передачи',
  show: 'Витрины', off: 'Отстранения' };
const AS_OF = ['2024-06-01', '2026-02-28', '2026-03-01', TODAY];

/* Подразделения, до которых роль вообще доезжает верхней ступенью. */
function unitsForRole(roleId) {
  const v = KU.verAt(KU.topRule(roleId), KU.state.asOf);
  const set = [];
  if (v) Object.keys(v.cells).forEach(c => {
    const u = v.cells[c];
    if (u && set.indexOf(u) < 0) set.push(u);
  });
  return set;
}

function render() {
  if (typeof document === 'undefined') return;   // без DOM рисовать нечего (смоук)
  const st = KU.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  $('#title').textContent = TITLES[st.view];
  $('#role').innerHTML = ACCESS.map(a =>
    `<option value="${a.id}"${a.id === st.role ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
  $('#asOf').innerHTML = AS_OF.map(d =>
    `<option value="${d}"${d === st.asOf ? ' selected' : ''}>${fmt(d)}${d === st.today ? ' · сегодня' : ''}</option>`).join('');
  $('#headWrap').innerHTML = st.role === 'head'
    ? `<label>Отдел</label><select onchange="KU.setHeadUnit(this.value)">${UNITS.map(u =>
        `<option value="${u.id}"${u.id === st.headUnit ? ' selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`
    : '';
  const queue = st.handoffs.filter(h => h.state === 'в очереди').length;
  const qc = document.getElementById('qCnt');
  if (qc) qc.textContent = queue ? 'в очереди ' + queue : '';
  const fb = KU.fallbacks(st.asOf), over = fb.filter(f => f.overdue);
  $('#foot').innerHTML = `${esc((byId(ACCESS, st.role) || {}).who)}${st.role === 'head'
      ? ' · ' + esc((KU.unit(st.headUnit) || {}).name) : ''}<br>
    Объектов ${st.objects.filter(o => o.born <= st.asOf).length} · записей в журнале ${st.journal.length}<br>
    Держится фолбэком <b>${fb.length}</b>, дольше порога <b>${over.length}</b>.`;
  $('#panel').innerHTML =
    st.view === 'pol'  ? viewPolicy()
    : st.view === 'rec'  ? viewRecalc()
    : st.view === 'hand' ? viewHandoffs()
    : viewStub(st.view);
}
KU.render = render;

function toast(msg, kind) {
  if (typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if (!w) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function act(res, okMsg) {
  if (res && res.ok) toast(res.note || okMsg || 'готово', 'ok');
  else toast((res && res.why) || 'отказано', 'err');
  render();
}

/* ------------------- ЭКРАН: ПОЛИТИКА РАСПРЕДЕЛЕНИЯ ------------------- */
function viewPolicy() {
  const st = KU.state;
  const role = KU.role(st.polRole), kind = KU.kind(role.kind);
  const rule = st.step === 'top' ? KU.topRule(st.polRole) : KU.lowRule(st.polUnit, st.polRole);
  const guard = KU.canEdit(rule);
  const units = unitsForRole(st.polRole);

  const head = `
    <div class="section-h">Правило распределения</div>
    <p class="page-lead">Куратор нигде не лежит полем: наружу модуль отдаёт ответ на вопрос
      <code>curatorOn(объект, роль, дата)</code>, а собирают ответ две ступени — холдинговая
      называет подразделение в момент рождения объекта, отдельская называет работника.
      Пустая ячейка объект не теряет: он поднимается на ступень выше (ИУ-8).</p>
    <div class="btn-row" style="margin:0 0 14px">
      <button class="btn btn-secondary ${st.step === 'top' ? 'on' : ''}" onclick="KU.setStep('top')">
        Верхняя ступень · объект и роль → подразделение</button>
      <button class="btn btn-secondary ${st.step === 'low' ? 'on' : ''}" onclick="KU.setStep('low')">
        Нижняя ступень · подразделение и роль → работник</button>
    </div>
    <div class="form-row">
      <div class="fld"><label>Роль — правил холдинга ровно пять, по числу назначаемых ролей</label>
        <select onchange="KU.pickRole(this.value)">${ROLES.map(r =>
          `<option value="${r.id}"${r.id === st.polRole ? ' selected' : ''}>${esc(r.name)} · ${esc(KU.kind(r.kind).name.toLowerCase())}</option>`).join('')}</select></div>
      ${st.step === 'low' ? `<div class="fld"><label>Подразделение</label>
        <select onchange="KU.pickUnit(this.value)">${units.map(u =>
          `<option value="${u}"${u === st.polUnit ? ' selected' : ''}>${esc(KU.unit(u).name)}</option>`).join('')}</select></div>` : ''}
    </div>`;

  if (!rule) {
    const holder = KU.emp(KU.headOf(st.polUnit)) || { name: '—' };
    return head + `
      <div class="banner danger"><b>Правила этой пары нет вовсе.</b>
        ${esc(KU.unit(st.polUnit).name)} не объявил раскладку роли «${esc(role.name)}» —
        объекты, приехавшие сюда верхней ступенью, держит заведующий отделом
        <b>${esc(holder.name)}</b> (ИУ-8). Это не «объект без куратора», а видимый долг заведующего:
        порог давности для вида «${esc(kind.name.toLowerCase())}» — ${kind.sla} рабочих дн.</div>
      ${fallbackTable(st.polUnit, st.polRole)}`;
  }

  const cov = KU.coverage(rule, st.asOf);
  const v = cov.v;
  const draft = (st.keyDraft && st.keyDraft.ruleId === rule.id) ? st.keyDraft : null;
  const keyChips = v.key.map(f => `<span class="chip">${esc(KU.feat(f).name)}</span>`).join('');
  const draftChips = draft ? draft.key.map(f => `<span class="chip">${esc(KU.feat(f).name)}
      <button title="убрать из ключа" onclick="act(KU.keyDraftDrop('${rule.id}','${f}'))">✕</button></span>`).join('') : '';
  const freeFeats = FEATURES.filter(f => (f.obj || []).indexOf(role.kind) >= 0 &&
    (draft ? draft.key : v.key).indexOf(f.id) < 0);

  const rows = cov.cells.map(c => {
    const target = v.cells[c];
    const objs = KU.cellObjects(rule, c, st.asOf);
    const holder = KU.emp(rule.scope === 'top' ? KU.admin() : KU.headOf(rule.unit)) || { name: '—' };
    const worst = (!target && objs.length)
      ? Math.max.apply(null, objs.map(o => workdays(o.born, st.asOf))) : 0;
    const over = !target && worst > kind.sla;
    const opts = rule.scope === 'top' ? UNITS : EMP.filter(e => e.unit === rule.unit);
    const cellSel = guard.ok
      ? `<select onchange="act(KU.setCell('${rule.id}','${jsq(c)}',this.value))">
          <option value=""${!target ? ' selected' : ''}>— не назначено —</option>
          ${opts.map(x => `<option value="${x.id}"${x.id === target ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}
         </select>`
      : (target ? esc(nameOf(rule, target)) : '<span class="muted">— не назначено —</span>');
    const status = target
      ? '<span class="pill ok">закрыта</span>'
      : objs.length
        ? `<span class="pill ${over ? 'err' : 'warn'}">держит ${esc(holder.name)}</span>
           <div class="why">фолбэк ${worst} раб. дн. при пороге ${kind.sla}${over ? ' — <em>дольше порога</em>' : ' — в сроке'}</div>`
        : '<span class="pill neutral">пусто, объектов нет</span>';
    const cnt = objs.length
      ? `<button class="linky" onclick="KU.toggleCell('${rule.id}','${jsq(c)}')">${objs.length}</button>`
      : '<span class="muted">0</span>';
    const open = st.openCell === rule.id + '‖' + c;
    const detail = open ? `<tr class="sub"><td colspan="4">${objList(objs, rule.role)}</td></tr>` : '';
    return `<tr class="${target ? '' : (over ? 'over' : 'hole')}">
      <td class="mono">${esc(c)}</td><td>${cellSel}</td><td>${cnt}</td><td>${status}</td></tr>${detail}`;
  }).join('');

  const vers = rule.versions.slice().sort((a, b) => a.no - b.no).map(x => {
    const s = KU.verStatus(x);
    return `<tr>
      <td>${x.no}</td><td>${fmt(x.from)}</td><td>${x.until ? fmt(x.until) : '—'}</td>
      <td>${esc(x.key.map(f => KU.feat(f).name).join(' + '))}</td>
      <td>${Object.keys(x.cells).length} из ${KU.space(x.key).length}</td>
      <td>${esc(x.by)}</td>
      <td><span class="pill ${s === 'действующая' ? 'ok' : s === 'будущая' ? 'info' : 'neutral'}">${s}</span></td></tr>`;
  }).join('');

  return head + `
    ${guard.ok ? '' : `<div class="banner info">${esc(guard.why)}</div>`}
    ${rule.scope === 'top'
      ? `<div class="banner warn"><b>Пересчёта у этой ступени нет — и кнопки тоже.</b>
          Ступень родильная: правка решает судьбу объектов, которые родятся после даты вступления,
          а живущим подразделение меняет только передача с приёмом (ИУ-7, ИУ-12).</div>`
      : `<div class="banner info"><b>Живая ступень.</b> Правка действует на уже закреплённые объекты,
          но не сама: их переставляет пересчёт — явное действие заведующего с предпросмотром и
          четырьмя корзинами (этап 3).</div>`}

    <div class="card">
      <h3>${rule.scope === 'top' ? 'Верхняя ступень' : 'Нижняя ступень'} ·
        ${esc(role.name)}<span class="small"> — ${esc(kind.name.toLowerCase())}</span></h3>
      <div class="kv">
        <div class="k">Что называет</div><div class="v">${rule.scope === 'top'
          ? 'подразделение, которое поведёт объект первым' : 'работника внутри подразделения'}</div>
        <div class="k">Владелец</div><div class="v">${esc(rule.owner)} · ${esc((KU.emp(rule.scope === 'top'
          ? KU.admin() : KU.headOf(rule.unit)) || {}).name)}</div>
        <div class="k">Объявленный ключ</div><div class="v">${keyChips || '<span class="muted">пуст</span>'}</div>
        <div class="k">Редакция на ${fmt(st.asOf)}</div><div class="v">№ ${v.no}, вступила ${fmt(v.from)}${
          v.until ? ', закрыта ' + fmt(v.until) : ''} · ${esc(v.by)}
          <span class="pill ${KU.verStatus(v) === 'действующая' ? 'ok' : 'neutral'}">${KU.verStatus(v)}</span></div>
        <div class="k">Покрытие</div><div class="v">закрыто <b>${cov.named.length}</b> из ${cov.cells.length}${
          cov.holesHot.length ? ` · <span class="pill warn">пустых с объектами: ${cov.holesHot.length}</span>` : ''}</div>
        <div class="k">Порог давности фолбэка</div><div class="v">${kind.sla} рабочих дн. для вида
          «${esc(kind.name.toLowerCase())}» — число из справочника (ИУ-9)</div>
      </div>
      ${guard.ok ? `
      <div class="form-row" style="margin-top:14px">
        <div class="fld"><label>Дата вступления новой редакции</label>
          <input type="date" value="${KU.effOf(rule.id)}" min="${st.today}"
            onchange="act(KU.setEff('${rule.id}',this.value))"></div>
        <div class="fld"><label>Добавить признак в ключ</label>
          <select onchange="act(KU.keyDraftAdd('${rule.id}',this.value))">
            <option value="">— выбрать —</option>
            ${freeFeats.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>
        ${draft ? `<div class="fld"><label>Черновик ключа · ячеек ${KU.space(draft.key).length}</label>
          <div>${draftChips || '<span class="muted">пуст</span>'}</div></div>
          <button class="btn btn-primary" onclick="act(KU.saveKey('${rule.id}'))">Сохранить ключ редакцией</button>` : ''}
      </div>
      <div class="note">Ни правка ячейки, ни смена ключа не переписывают действующую редакцию —
        они заводят новую с датой вступления, и дата не ставится в прошлое (ИУ-10).</div>` : ''}
    </div>

    <div class="section-h">Ячейки правила</div>
    <p class="page-lead">Значения ключа — декартово произведение справочников признаков.
      Число объектов против ячейки кликабельно: список открывается тем же расчётом, что и счётчик.</p>
    <table class="cgrid"><thead><tr>
      <th>Значение ключа</th><th>${rule.scope === 'top' ? 'Подразделение' : 'Работник'}</th>
      <th>Объектов</th><th>Состояние</th></tr></thead><tbody>${rows}</tbody></table>

    <div class="section-h">Редакции правила</div>
    <table class="cgrid"><thead><tr>
      <th>№</th><th>Вступила</th><th>Закрыта</th><th>Ключ</th><th>Закрыто ячеек</th><th>Кем</th><th></th>
      </tr></thead><tbody>${vers}</tbody></table>
    <div class="note">Записи журнала ссылаются на редакцию, по которой поставлены, — поэтому ответ
      «кто вёл 14.02.2024» воспроизводим (ИУ-10, ИУ-11). Смените дату среза наверху и раскройте
      ячейку «Ошская» нижней ступени агродепартамента: до 01.03.2026 там Бекова, после — Иванов.</div>`;
}

function objList(objs, roleId) {
  const st = KU.state;
  const rows = objs.map(o => {
    const a = KU.curatorOn(o.id, roleId, st.asOf);
    const off = KU.offRule(o.id, roleId, st.asOf);
    const pend = KU.pendingHandoff(o.id, roleId);
    const open = st.openObj === o.id + '‖' + roleId;
    const detail = open ? `<tr class="sub"><td colspan="7">${objCard(o, roleId)}</td></tr>` : '';
    return `<tr>
      <td class="mono">${esc(o.id)}</td>
      <td>${esc(KU.kind(o.kind).name)}${o.closed ? ' <span class="pill neutral">погашен ' + fmt(o.closed) + '</span>' : ''}${
        o.of ? '<div class="why">по ' + esc(o.of) + (o.note ? ' · ' + esc(o.note) : '') + '</div>' : ''}</td>
      <td>${fmt(o.born)}</td>
      <td>${esc(o.borrower)}</td>
      <td>${a.ok ? esc(a.assignedName) : '<span class="muted">' + esc(a.why) + '</span>'}
        ${a.ok ? `<div class="why">с ${fmt(a.since)} · <em>${esc(a.src)}</em>${
          a.ver ? ' · редакция ' + a.ver.no : ''}${a.fallback ? ' · держится ' + a.heldDays + ' раб. дн.' +
          (a.overdue ? ' — <em>дольше порога ' + a.sla + '</em>' : '') : ''}</div>` : ''}
        ${pend ? '<div class="why"><span class="pill info">передача в очереди</span> до приёма куратор прежний</div>' : ''}</td>
      <td>${off ? `<span class="pill warn">вне правила</span>
        <div class="why">правило сейчас называет <em>${esc((KU.emp(off.now) || {}).name)}</em>,
          в журнале — ${esc((KU.emp(off.journal) || {}).name)} (${esc(off.src)})</div>`
        : '<span class="pill ok">совпадает с правилом</span>'}</td>
      <td><button class="linky" onclick="KU.toggleObj('${jsq(o.id)}','${roleId}')">${open ? 'скрыть' : 'журнал'}</button></td>
      </tr>${detail}`;
  }).join('');
  return `<table class="cgrid"><thead><tr>
    <th>Объект</th><th>Вид</th><th>Рождён</th><th>Заёмщик</th>
    <th>Закреплён на ${fmt(st.asOf)}</th><th>Сверка с правилом</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* Журнал закреплений объекта + действия над ним. Витрина в карточке чужого модуля —
   этап 5; здесь это служебный просмотр, на котором проверяется движение (волна 2). */
function objCard(o, roleId) {
  const st = KU.state;
  const recs = KU.journalOf(o.id, roleId);
  const cur = openRec(o.id, roleId, st.today);
  const kind = KU.kind(o.kind);
  const work = KU.workOpen(o.id, st.today);
  const mates = cur && cur.unitId ? EMP.filter(e => e.unit === cur.unitId) : EMP;
  const feats = FEATURES.filter(f => (f.obj || []).indexOf(o.kind) >= 0);
  const f0 = feats[0];

  const jr = recs.map(r => `<tr>
    <td>${fmt(r.from)} — ${r.to ? fmt(r.to) : '<span class="muted">открыт</span>'}</td>
    <td>${esc((KU.emp(r.empId) || {}).name || r.empId)}</td>
    <td>${esc((KU.unit(r.unitId) || {}).name || 'администратор кураторства')}</td>
    <td><span class="pill ${r.src === 'правило' ? 'ok' : r.src === 'фолбэк' ? 'warn' : 'info'}">${esc(r.src)}</span>${
      r.retro ? ' <span class="pill warn">задним числом</span>' : ''}</td>
    <td>${r.ver ? 'ред. ' + r.ver.no : '<span class="muted">—</span>'}</td>
    <td>${esc(r.by)}${r.at ? '<div class="why">' + esc(r.at) + '</div>' : ''}
      <div class="why">${esc(r.reason)}</div>
      ${r.snap ? '<div class="why">снимок признаков: ' + esc(Object.keys(r.snap)
        .map(k => (KU.feat(k) || { name: k }).name + ' = ' + r.snap[k]).join(' · ')) + '</div>' : ''}</td>
  </tr>`).join('');

  return `
    <div class="card" style="margin:0">
      <h3>${esc(o.id)} · ${esc((KU.role(roleId) || {}).name)}
        <span class="small"> — рождён ${fmt(o.born)}, точка рождения: ${esc(kind.birth)}</span></h3>
      <div class="kv">
        <div class="k">Признаки сейчас</div><div class="v">${esc(feats.map(f =>
          f.name + ' = ' + (o.f[f.id] || '—')).join(' · '))}</div>
        <div class="k">Незакрытая работа</div><div class="v">${work.open
          ? '<span class="pill warn">есть</span> ' + esc(work.why)
          : '<span class="pill ok">нет</span> ' + esc(work.why)}
          <div class="why">спрошены: ${esc(work.asked.join(', '))}${work.silent.length
            ? ' · молчат: <em>' + esc(work.silent.join(', ')) + '</em>' : ''} — признак не хранится, читается на момент вопроса (P18-R12)</div></div>
      </div>
      <table class="cgrid" style="margin-top:12px"><thead><tr>
        <th>Период</th><th>Работник</th><th>Подразделение</th><th>Источник</th><th>Редакция</th><th>Кем и почему</th>
        </tr></thead><tbody>${jr}</tbody></table>
      <div class="note">Журнал append-only: запись закрывается предыдущим днём, новая открывается
        датой вступления — разрыва между ними нет (ИУ-4).</div>

      <div class="section-h" style="margin-top:16px">Действия</div>
      <div class="form-row">
        <div class="fld"><label>Закрепить рукой — работник</label>
          <select id="aEmp_${esc(o.id)}">${mates.map(e =>
            `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>С даты (можно задним числом)</label>
          <input type="date" id="aFrom_${esc(o.id)}" value="${st.today}"></div>
        <div class="fld" style="flex:1"><label>Причина — обязательна</label>
          <input type="text" id="aWhy_${esc(o.id)}" placeholder="почему вне правила"></div>
        <button class="btn btn-secondary" onclick="KU.uiByHand('${jsq(o.id)}','${roleId}')">Закрепить рукой</button>
        <button class="btn btn-secondary" onclick="act(KU.backToRule('${jsq(o.id)}','${roleId}'))">Вернуть к правилу</button>
      </div>
      <div class="form-row">
        <div class="fld"><label>Передать в подразделение</label>
          <select id="sUnit_${esc(o.id)}">${UNITS.filter(u => !cur || u.id !== cur.unitId).map(u =>
            `<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
        <div class="fld" style="flex:1"><label>Причина передачи</label>
          <input type="text" id="sWhy_${esc(o.id)}" placeholder="почему объект уезжает"></div>
        <button class="btn btn-secondary" onclick="KU.uiSend('${jsq(o.id)}','${roleId}')">Отправить</button>
      </div>
      ${f0 ? `<div class="form-row">
        <div class="fld"><label>Зеркало соседнего модуля: признак «${esc(f0.name)}»</label>
          <select id="fVal_${esc(o.id)}">${f0.domain.map(v =>
            `<option value="${esc(v)}"${v === o.f[f0.id] ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <button class="btn btn-secondary" onclick="KU.uiFeature('${jsq(o.id)}','${f0.id}')">Сменить признак</button>
        <div class="note" style="margin:0;flex:1">Смена признака куратора не переставляет: решение
          хранит снимок на свою дату, а переставляет объекты только пересчёт (P18-R9).</div>
      </div>` : ''}
      <div class="note">Отправку обычно инициирует не кураторство, а модуль кредита или взыскания —
        кнопка здесь стоит, чтобы прогнать очередь целиком (P18-R10).</div>
    </div>`;
}

/* ------------------------- ЭКРАН: ПЕРЕСЧЁТ --------------------------- */
function viewRecalc() {
  const st = KU.state;
  const roleId = st.recRole;
  const unitId = st.role === 'head' ? st.headUnit : st.recUnit;
  const units = unitsForRole(roleId);
  const guard = KU.canRecalc(unitId, roleId);
  const p = (st.preview && st.preview.unitId === unitId && st.preview.roleId === roleId) ? st.preview : null;
  const rule = KU.lowRule(unitId, roleId);
  const v = rule ? KU.verAt(rule, st.today) : null;

  const head = `
    <div class="section-h">Пересчёт нижней ступени</div>
    <p class="page-lead">Правка правила объекты сама не переставляет: пересчёт — отдельное действие
      заведующего с предпросмотром. Фонового пересчёта нет, у верхней ступени его нет вовсе —
      она родильная (ИУ-7). Корзин четыре, и ручные закрепления пересчёт не трогает.</p>
    <div class="form-row">
      <div class="fld"><label>Роль</label>
        <select onchange="KU.pickRec(this.value,null)">${ROLES.map(r =>
          `<option value="${r.id}"${r.id === roleId ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Подразделение${st.role === 'head' ? ' — своё, из шапки' : ''}</label>
        ${st.role === 'head'
          ? `<input type="text" value="${esc((KU.unit(unitId) || {}).name || '—')}" disabled>`
          : `<select onchange="KU.pickRec(null,this.value)">${units.map(u =>
              `<option value="${u}"${u === unitId ? ' selected' : ''}>${esc(KU.unit(u).name)}</option>`).join('')}</select>`}</div>
    </div>`;

  const bar = guard.ok
    ? `<div class="btn-row" style="margin:0 0 14px">
         <button class="btn btn-primary" onclick="act(KU.recalcPreview('${unitId}','${roleId}'))">Показать предпросмотр</button>
         ${p ? `<button class="btn btn-secondary" onclick="act(KU.recalcApply('${unitId}','${roleId}'))">Применить</button>
                <button class="btn btn-secondary" onclick="act(KU.recalcClose())">Закрыть без изменений</button>` : ''}
       </div>`
    : `<div class="banner ${st.role === 'admin' ? 'warn' : 'info'}"><b>Кнопки пересчёта здесь нет.</b>
         ${esc(guard.why)}</div>`;

  const basket = (title, rows, cls, lead, extra) => `
    <div class="section-h">${esc(title)} · ${rows.length}</div>
    <p class="page-lead">${lead}</p>
    ${rows.length ? `<table class="cgrid"><thead><tr>
      <th>Объект</th><th>Заёмщик</th><th>Сейчас</th><th>Правило называет</th><th>Ячейка</th><th>${esc(extra || 'Почему сюда')}</th>
      </tr></thead><tbody>${rows.map(r => `<tr class="${cls}">
        <td class="mono">${esc(r.objId)}</td><td>${esc(r.borrower)}</td>
        <td>${esc((KU.emp(r.cur) || {}).name)}<div class="why">${esc(r.src)}, с ${fmt(r.since)}</div></td>
        <td>${esc((KU.emp(r.want) || {}).name)}</td>
        <td class="mono">${esc(r.cell)}${r.ver ? '<div class="why">ред. ' + r.ver.no + '</div>' : ''}</td>
        <td>${r.ban ? 'отстранение по заёмщику с ' + fmt(r.ban.from) + '<div class="why">' + esc(r.ban.why) + '</div>'
          : r.work ? esc(r.work.why)
          : r.same === true ? 'правило называет того же — запись всё равно ручная, пересчёт её не трогает'
          : r.same === false ? 'держится вне правила: ' + esc(r.reason)
          : 'правило и журнал разошлись, работа закрыта'}</td></tr>`).join('')}</tbody></table>`
      : '<div class="note">Пусто.</div>'}`;

  if (!p) return head + bar + (rule
    ? `<div class="card"><h3>Что пересчитывается</h3><div class="kv">
        <div class="k">Правило</div><div class="v">${esc(rule.owner)} · ${esc((KU.unit(unitId) || {}).name)}</div>
        <div class="k">Действующая редакция</div><div class="v">${v ? '№ ' + v.no + ', вступила ' + fmt(v.from) : '—'}</div>
        <div class="k">Объектов в подразделении</div><div class="v">${st.journal.filter(r => r.role === roleId &&
          r.unitId === unitId && r.to == null).length}</div>
      </div><div class="note">Предпросмотр раскрывается до списка объектов — счётчик и список
        считаются одним расчётом. Пока он не применён, не меняется ничего.</div></div>`
    : `<div class="banner warn">У пары «${esc((KU.unit(unitId) || {}).name)} · ${esc((KU.role(roleId) || {}).name)}»
        правила нет — объекты держит заведующий отделом (ИУ-8), пересчитывать нечего.</div>`);

  return head + bar + `
    <div class="banner info"><b>${esc(p.note)}</b>
      ${p.silent.length ? '<br>Молчат источники: <b>' + esc(p.silent.join(', ')) +
        '</b> — их объекты уходят через рукопожатие, безопасная сторона (P18-R12).' : ''}
      ${p.pending.length ? '<br>Уже в очереди передач: ' + p.pending.length +
        ' — повторно не отправляются.' : ''}</div>
    ${basket('Тихо', p.quiet, '', 'Работа на объекте закрыта — закрепление меняется записью журнала, без чьего-либо согласия.')}
    ${basket('Через рукопожатие', p.hand, 'hole', 'На объекте есть незакрытая работа — вместо подмены куратора создаётся передача, и её принимают.')}
    ${basket('Заблокировано отстранением', p.blocked, 'over', 'Правило называет работника, отстранённого по этому заёмщику (ADR-0118) — закрепление остаётся прежним.')}
    ${basket('Ручные — не тронуты', p.manual, 'sub', 'Закрепление рукой держится вне правила до отмены: вернуть его к правилу можно только кнопкой в журнале объекта (P18-R13).')}
    <div class="note">Применение меняет только первую корзину и создаёт передачи по второй.
      Записи журнала ссылаются на редакцию ${p.ver == null ? '—' : '№ ' + p.ver} — поэтому ответ
      «почему так» воспроизводим. Закрытие предпросмотра не меняет ничего.</div>`;
}

/* ------------------------- ЭКРАН: ПЕРЕДАЧИ --------------------------- */
function viewHandoffs() {
  const st = KU.state;
  const queue = st.handoffs.filter(h => h.state === 'в очереди');
  const done  = st.handoffs.filter(h => h.state !== 'в очереди');

  const qrows = queue.map(h => {
    const card = KU.handoffCard(h.id);
    const open = st.openHand === h.id;
    const emps = EMP.filter(e => e.unit === h.toUnit);
    const cur = card.cur;
    const detail = open ? `<tr class="sub"><td colspan="6">
      <div class="card" style="margin:0">
        <h3>Приём передачи ${esc(h.id)} · ${esc(h.objId)}</h3>
        <div class="kv">
          <div class="k">Кто ведёт сейчас</div><div class="v">${esc((KU.emp(cur && cur.empId) || {}).name || '—')} ·
            ${esc((KU.unit(h.fromUnit) || {}).name)} <span class="pill neutral">до приёма ничего не изменилось</span></div>
          <div class="k">Причина отправки</div><div class="v">${esc(h.reason)} <span class="small">· ${esc(h.src)}</span></div>
          <div class="k">Подставлен правилом</div><div class="v"><b>${esc((KU.emp(card.suggest) || {}).name)}</b>
            <div class="why">${esc(card.why)}</div></div>
        </div>
        <div class="form-row" style="margin-top:12px">
          <div class="fld"><label>Работник принимающего подразделения</label>
            <select id="hEmp_${esc(h.id)}">${emps.map(e =>
              `<option value="${e.id}"${e.id === card.suggest ? ' selected' : ''}>${esc(e.name)}${
                e.id === card.suggest ? ' · подставлен' : ''}</option>`).join('')}</select></div>
          <div class="fld" style="flex:1"><label>Причина — обязательна при замене подставленного и при отклонении</label>
            <input type="text" id="hWhy_${esc(h.id)}" placeholder="почему другой работник / почему не принимаем"></div>
          <button class="btn btn-primary" onclick="KU.uiAccept('${esc(h.id)}')">Принять</button>
          <button class="btn btn-secondary" onclick="KU.uiReject('${esc(h.id)}')">Отклонить</button>
        </div>
        <div class="note">Приём открывает закрепление датой приёма и закрывает прежнее предыдущим днём.
          Замена подставленного работника делает источник записи «переопределение» — и причина едет в журнал.
          Отклонение возвращает объект отправителю, журнал при этом не трогается.</div>
      </div></td></tr>` : '';
    return `<tr>
      <td class="mono">${esc(h.id)}</td>
      <td class="mono">${esc(h.objId)}<div class="why">${esc((KU.role(h.role) || {}).name)}</div></td>
      <td>${esc((KU.unit(h.fromUnit) || {}).name)}</td>
      <td>${esc((KU.unit(h.toUnit) || {}).name)}${h.fromUnit === h.toUnit
        ? '<div class="why">внутри отдела — создана пересчётом</div>' : ''}</td>
      <td>${fmt(h.sent)}<div class="why">${esc(h.by)} · ${esc(h.reason)}</div></td>
      <td><button class="linky" onclick="KU.toggleHand('${esc(h.id)}')">${open ? 'скрыть' : 'карточка приёма'}</button></td>
      </tr>${detail}`;
  }).join('');

  const drows = done.map(h => `<tr>
    <td class="mono">${esc(h.id)}</td><td class="mono">${esc(h.objId)}</td>
    <td>${esc((KU.unit(h.fromUnit) || {}).name)} → ${esc((KU.unit(h.toUnit) || {}).name)}</td>
    <td><span class="pill ${h.state === 'принята' ? 'ok' : 'err'}">${esc(h.state)}</span></td>
    <td>${h.accepted ? fmt(h.accepted.d) + ' · ' + esc((KU.emp(h.accepted.empId) || {}).name) +
        (h.accepted.byHand ? ' <span class="pill info">переопределение</span><div class="why">' +
          esc(h.accepted.reason) + '</div>' : '')
      : h.rejected ? fmt(h.rejected.d) + ' · ' + esc(h.rejected.by) +
        '<div class="why">' + esc(h.rejected.why) + '</div>' : '—'}</td></tr>`).join('');

  return `
    <div class="section-h">Очередь передач</div>
    <p class="page-lead">Подразделение объекта меняется только принятой передачей — ни правка верхнего
      правила, ни пересчёт его не двигают (ИУ-12, ADR-0023). Пока передача в очереди, куратор прежний:
      полномочия переходят датой приёма.</p>
    ${queue.length ? `<table class="cgrid"><thead><tr>
      <th>№</th><th>Объект</th><th>Отдаёт</th><th>Принимает</th><th>Отправлена</th><th></th>
      </tr></thead><tbody>${qrows}</tbody></table>`
      : '<div class="note">Очередь пуста. Передачи создаёт пересчёт (корзина «через рукопожатие») или отправка из журнала объекта.</div>'}
    ${done.length ? `<div class="section-h">Разобранные</div>
      <table class="cgrid"><thead><tr>
        <th>№</th><th>Объект</th><th>Маршрут</th><th>Итог</th><th>Кто и когда</th>
      </tr></thead><tbody>${drows}</tbody></table>` : ''}
    <div class="note">Принимает заведующий принимающего подразделения. Если ячейка правила у него
      пуста, карточка подставляет его самого (ИУ-8) и прямо говорит, из какой ячейки взят работник.</div>`;
}

/* Объекты, приехавшие в подразделение, у которого правила этой роли нет. */
function fallbackTable(unitId, roleId) {
  const st = KU.state, kindId = (KU.role(roleId) || {}).kind;
  const objs = st.objects.filter(o => o.kind === kindId && o.born <= st.asOf &&
    KU.decide(o.id, roleId, st.asOf).unitId === unitId);
  if (!objs.length) return '<div class="note">Объектов, приехавших в это подразделение, на дату среза нет.</div>';
  return `<div class="section-h">Объекты на руках заведующего</div>${objList(objs, roleId)}`;
}

/* ---------------------------- ЗАГЛУШКИ ------------------------------ */

  show: { stage: 'этап 5', tasks: 'P18-R18 · P18-R19 · P18-R20',
    lead: 'Витрины и журнал в карточке объекта — то, чем перекос и дыры становятся видимыми.',
    items: ['витрина нагрузки и перекоса: правило нагрузку не считает, перекос разбирает заведующий решением (ИУ-11)',
      'витрина «живут вне правила» — расхождение журнала с ячейкой; расчёт уже есть в волне 1 (KU.offRule)',
      'витрина фолбэка «держится дольше порога» — счётчик уже считается и стоит в подвале слева',
      'журнал закреплений в карточке объекта: карточка чужого модуля, кураторство отдаёт ей ответ и историю'] },
  off: { stage: 'этап 4', tasks: 'P18-R15 · P18-R17 · P18-R19',
    lead: 'Отстранение — своё датированное измерение по паре «работник и заёмщик» (ADR-0118). Закрепление при нём живёт, меняется только действующий исполнитель.',
    items: ['реестр отстранений: вводит администратор кураторства по служебной записке, инициировать может любой, включая самоотвод',
      'отрезок покрывает все объекты этого заёмщика и вычитается из периода ответственности',
      'пересчёт отстранение не отменяет — корзина «заблокировано отстранением»',
      'второй ответ шва: действующий исполнитель расходится с закреплённым; замещающего называет модуль сотрудников (resolveActor, P12-R12), кураторство его не хранит и не выбирает'] },
};
function viewStub(id) {
  const s = STUBS[id];
  return `<div class="section-h">${esc(TITLES[id])}</div>
    <p class="page-lead">${esc(s.lead)}</p>
    <div class="banner info"><b>Волны 1–2 этот экран не делают.</b>
      ${esc(s.stage)} постановки · задачи ${esc(s.tasks)} · канон —
      <code>docs/tasks/p18-kuratorstvo-tasks.html</code>.</div>
    <div class="card"><h3>Что здесь будет</h3>
      <ul style="margin:0;padding-left:20px">${s.items.map(i => `<li style="margin-bottom:6px">${esc(i)}</li>`).join('')}</ul>
    </div>
    <div class="note">Ядро под это уже стоит: журнал закреплений, обе ступени, фолбэк с порогами,
      ответ <code>curatorOn</code>, пересчёт с четырьмя корзинами и очередь передач работают на
      экранах «Политика распределения», «Пересчёт» и «Передачи».</div>`;
}

seed();
if (typeof window !== 'undefined') window.KU = KU;
if (typeof document !== 'undefined') render();
