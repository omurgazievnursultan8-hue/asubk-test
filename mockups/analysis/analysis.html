  РАСХОЖДЕНИЯ МАКЕТА И ПОСТАНОВКИ — два, оба названные (было три, одно закрыто волной 9):
  1. Расписание и швы в макете живут на ОДНОМ экране; постановка описывает два
     (P21-R17 и P21-R20). Экран швов служебный — в промышленной сборке не обязателен.
  2. Категорию риска и сумму задолженности макет держит ЗЕРКАЛОМ в затравке (поля risk и
     debt у заёмщика, читаются швами AN.riskOn / AN.debtOn); постановка требует брать их у
     соседей — riskCategory классификации (ADR-0124) и calcPortfolio ядра (ADR-0135 §4).
     Своего хранилища этих величин в промышленной сборке быть не должно: зеркало здесь —
     способ исполнить макет без соседей, а не модель.
  Закрыты и сняты из этого списка два: нулевой знаменатель приходил общей причиной «не
     заполнены строки» с пустым списком строк (дефект АН-Д6, закрыт волной 6 — причин две,
     как и требует P21-R9); и адресация экрана обзоров — макет звал его экраном отказа, а

     экранов два, оба живые, и в постановке они названы маршрутом.

  ГДЕ МАКЕТ И ПОСТАНОВКА СХОДЯТСЯ ДОСЛОВНО — проверено сверкой, а не памятью: полнота формы
  проверяется при внесении версии (addReport отказывает поимённо), подпись при непосчитанном
  коэффициенте отклоняется (снимок обязан быть полным), справочник строк ведёт отдел анализа
  (addLine закрыт ролью), «посчитать нельзя» называет СВОЮ причину — незаполненная строка и
  нулевой знаменатель приходят разными текстами и лечатся по-разному (P21-R9, проверки
  #45, #46). Расписание вменяет анализ по паре «тип лица × категория риска», и порог
  задолженности с пунктом основания стоят в строке справочника, а не в коде (P21-R17, проверки
  #47…#52). Затравка макета — витрина на пять заёмщиков, четыре методики, восемь строк
  расписания и три периода; ЧИСЛА ВО ВСЕХ ПРИМЕРАХ ПОСТАНОВКИ взяты прогоном этой
  затравки, а не выписаны.

  ЧЕГО В МОДУЛЕ НЕТ (это решения, а не недоделки): сумм по объекту — их даёт расчётное ядро
  швами calc*; агрегатов и рядов — их считает статистика, обзор их только спрашивает и
  показывает; СОСТАВА СРЕЗА И ЕГО КОНСТРУКТОРА — состав объявляет редакция шаблона
  отчётности, обзор держит ссылку и не копирует (ИА-7); печати формы и адресата подачи —
  это отчётность; ПРАВИЛ КАТЕГОРИИ РИСКА — категорию анализ читает у классификации швом на
  дату и сам её не выводит, а классификация анализ не читает: стрелка одна (ИА-10); записи в
  чужие поля — только зеркало (ИА-9); постановки задач — задачу ставит человек, реестр
  AN.state.tasks здесь заглушка модуля задач и связь односторонняя (ИА-11, АН-61);
  СВОЕГО ЭКЗЕМПЛЯРА ЧИСЕЛ, СОСТАВА И ОХВАТА У ОБЗОРА — только ссылка на выпуск и рабочий
  список (ИА-20); хранения дефекта — анализ отдаёт факт, дефект считает сопровождение
  (ИА-13); порога 50 млн в коде — это поле строки расписания, и правит его отдел анализа
  записью (ИА-5, ИА-18).

  УСТРОЙСТВО ФАЙЛА: ЧЕТЫРЕ МАРКЕРНЫХ УЧАСТКА. Файл длинный, и четыре его куска обведены
  парными маркерами вида /* ==ИМЯ== */ … /* ==/ИМЯ== */. Это не украшение: у каждого участка
  есть ТЕКСТОВОЕ свойство, которое смоук проверяет чтением исходника, а не вызовом функций, —
  границу нельзя нарушить незаметно. Переносить код через маркер = ронять проверку.
    ==ВЫЧИСЛИТЕЛЬ==   весь счёт коэффициентов. Свойство: НИ ОДНОГО названия коэффициента
                      внутри (ни «ликвидность», ни «рентабельность») — вычислитель складывает
                      строки, которые ему назвала запись методики (ИА-3, проверка #3).
    ==ЧУЖАЯ СТОРОНА== заглушка соседей: фикстуры статистики и отчётности, три шва с
                      паспортами, журнал выпусков OUT. Свойство: НОЛЬ вхождений `AN.state`
                      внутри — сосед про состояние анализа не знает и знать не может
                      (проверка #55). Всё, чего живой сосед пока не умеет, названо здесь
                      словами в комментариях, а не подделано поведением.
    ==ОБЗОР==         сущность обзора целиком: заведение, числа, суждение, утверждение,
                      корректировка, поручение. Свойство: НОЛЬ вхождений имён
                      TEMPLATES STAT_INDS PORTFOLIO SNAPS DIMS OUT agg( passportOf( visible( —
                      ни одного числа и ни одного состава внутри, наружу участок ходит только
                      через REP. и STAT. (ИА-7, ИА-20, проверка #61).
    ==ПРОИЗВОДНЫЕ==   арифметика показа: доли (%), сдвиги долей (п.п.), темпы (%). Свойство:
                      НИЧЕГО НЕ ХРАНИТ — считает на показ из чисел, пришедших швом, и в
                      состояние не пишет (ADR-0001, проверка #73).

  РАБОЧИЙ ПРОТОТИП (single-file) — модуль «Анализ» целиком: финансовый анализ заёмщика
  и аналитические обзоры портфеля (TO-BE).
  Не картинка: логика ниже ИСПОЛНЯЕТСЯ. Методика подбирается по типу лица НА ДАТУ
  ОТЧЁТНОСТИ, строка расписания — по паре «тип лица × категория риска» на ту же дату,
  коэффициенты считает машина по объявлению методики, утверждение
  фиксирует снимок основания, а новая версия отчётности утверждённое не пересчитывает —
  она его помечает. Ни одного коэффициента в коде нет: вычислитель складывает строки,
  которые ему назвала запись методики, и слова «ликвидность» в нём не встречается.

  Волна 1 (21.08.2026) вывела модель на бумаге: ADR-0153…ADR-0155 плюс канон логики.
  Волна 2 довела ту же модель до исполняемого эталона поведения; волна 9 (30.08.2026)
  добавила второй раздел — аналитические обзоры, реестр и документ.
  Смоук: `node scripts/inspect/analysis-check.mjs`.
  Канон логики — `mockups/analysis/ASUBK-analiz-logika.md` (пять сущностей, снимок,
  срок → обязательство → дефект, все 20 инвариантов с причиной);
  журнал волн — `ASUBK-status-razrabotki.md`.

  НОРМА В ЭТОМ ФАЙЛЕ. Содержания методики норма не задаёт — коэффициенты объявляет запись
  методики, и пунктов Порядка в вычислителе нет. Но ОБЯЗАТЕЛЬНОСТЬ планового финанализа
  ставит норма, и с волны 7 расписание её цитирует: у каждой строки поле basis — «п. 11.2»
  (обязателен при задолженности свыше порога) либо «п. 6.5» (обязателен безусловно).
  Пункт — ПОЛЕ СТРОКИ, а не литерал в коде: он переезжает вместе с порогом, когда отдел
  анализа правит строку, и проверяется `python3 scripts/check_points.py` наравне с канонами
  соседей. Строки для низкого риска нет вовсе — п. 11.1 («плановый анализ … не проводится»)
  исполнен ОТСУТСТВИЕМ строки, а не полем «не обязателен».

  РЕШЕНИЯ, НА КОТОРЫХ СТОИТ МОДУЛЬ
  ADR-0153 заключение хранит снимок основания, а не ссылку на живой источник;
  ADR-0154 состав среза объявляет шаблон отчётности — своего конструктора у анализа нет;
  ADR-0155 анализ отдаёт зеркало и факт: в чужие карточки не пишет и задач не ставит.
  Поверх: ADR-0001 (производные не хранятся; снимок — названное исключение),
  ADR-0112 (корректировка против нового заключения), ADR-0122 (факт руками, значение
  машиной), ADR-0124 (вычислитель один), ADR-0135 (швы называются вопросом),
  ADR-0146 §2 (стрелка одна: классификация анализ не читает), ADR-0152 §2 (паспорт ответа).

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (ИА-1…ИА-20)
  ИА-1  Утверждённое заключение не пересчитывается никогда (ADR-0153).
  ИА-2  Черновик снимка не имеет и основанием ни для чего не служит.
  ИА-3  Коэффициент вводу не подлежит: человек вносит отчётность, значение ставит машина.
  ИА-4  Методика выбирается по типу лица НА ДАТУ ОТЧЁТНОСТИ, а не на сегодня.
  ИА-5  Редакция методики, на которую есть ссылка из заключения, не снимается.
  ИА-6  Показателя вне реестра в обзоре не бывает: состав — ПЕРЕСЕЧЕНИЕ объявленного
        действующей редакцией шаблона и заведённого в реестре показателей на дату обзора
        (AN.reviewInds, проверки #35, #60).
  ИА-7  Обзор ссылается на шаблон и его редакцию, состав не копирует (ADR-0154). Своего
        конструктора состава в модуле нет ни одной функцией — попытка отказывается словами
        (AN.tryOwnBuilder, AN.tryFreeCut).
  ИА-8  Число в обзоре без паспорта не показывается и не хранится (ADR-0152 §2).
  ИА-9  Анализ не пишет ни в одно чужое поле: наружу — зеркало (ADR-0155 §1).
  ИА-10 Классификация анализ не читает: стрелка одна (ADR-0146 §2). Обратное направление
        инвариант не запрещает — категорию на дату анализ у неё берёт (§7 канона).
  ИА-11 Обзор задач не порождает; задачу ставит человек со ссылкой на обзор. Массового
        заведения нет (AN.tryMassTasks отказывает), в записи обзора номеров задач не
        хранится, а реестр AN.state.tasks — заглушка модуля задач: связь односторонняя,
        «что заведено по обзору» отвечается перебором реестра (АН-61, проверки #69…#71).
  ИА-12 Обязательство закрывается фактом — утверждённым заключением, а не отметкой.
  ИА-13 Дефект анализ не хранит: отдаёт факт, дефект считает сопровождение.
  ИА-14 Отсутствие заключения печатается словами «анализа нет».
  ИА-15 Вывод в снимок не входит: снимок — основание, а не суждение (ADR-0153 §1).
  ИА-16 Заключение за период, по которому уже подписано другое, — переиздание, и правило
        у него одно, какой бы дверью его ни завели.
  ИА-17 Действующая на дату запись выбирается везде одинаково — по дате вступления,
        последней; тип лица для срока берётся на конец отчётного периода (ИА-4).
  ИА-18 Строку формы отчётности заводит отдел анализа записью, а не разработчик правкой кода.
  ИА-19 У «посчитать нельзя» СВОЯ причина: незаполненная строка и нулевой знаменатель —
        разные беды, лечатся по-разному и приходят разными текстами.
  ИА-20 Своего экземпляра чисел и состава обзор не заводит — только ссылку на выпуск и на
        рабочий список (ADR-0157 §4). Проверяется прогоном: открытие обзора спрашивает
        числа у статистики ЗАНОВО и ничего не сохраняет (AN.reviewData, проверки #62, #63),
        а УТВЕРЖДЕНИЕ приносит от окончательного выпуска отчётности ровно два номера —
        выпуска и рабочего списка — и ни одного числа, охвата или паспорта: охват
        утверждённого обзора спрашивается у выпуска (AN.approveReview, AN.reviewScope,
        проверки #64…#66). Живая отчётность получателя вида «обзор» пока не знает — это
        долг соседа, названный словами у REP.finalIssue.

  ДЕМО ПОКРЫВАЕТ: четыре типа лица — четыре методики, единой формы нет · лицо, снявшееся
  с учёта как ИП: отчётность за 2025 считается методикой ИП, за 1П 2026 — методикой
  физлица · живой черновик против замороженного снимка · уточнённый баланс, поданный
  после утверждения: пометка «источник изменён», пересчёта нет, правильный ход — новое
  заключение за тот же период · корректировку с основанием против переиздания (ADR-0112)
  · отказ ввести коэффициент руками и отказ вывести вывод из порогов · ведущего куратора
  чужого заёмщика · заёмщика без заключений — «анализа нет» словами, дефект с влиянием
  «на допуск» и гейт заявки · черновик, который обязательства НЕ закрывает · заёмщика без
  действующих кредитов, которому расписание ничего не вменяет — потому что категории риска
  у него нет вовсе, а не потому что в строке стоял второй признак · охват по категории:
  низкому риску строки нет, высокому анализ вменён безусловно · порог задолженности: ровно
  50 000 000 не обязывают, 81 400 000 обязывают, и порог правит администратор записью ·
  категорию и задолженность, взятые НА КОНЕЦ ПЕРИОДА: у заёмщика b-1 долг упал ниже порога
  после 30.06, и чтение «сегодня» дало бы другой ответ · отказ классификации читать шов.

.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }

.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-danger:hover:not(:disabled){ background:var(--asubk-red-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }

  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);

  font-weight:var(--weight-semibold); border-top:1px solid var(--asubk-grid-line); }

.mirror.none{ border-left-color:var(--asubk-amber); }

.pass{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-green);
  border-radius:var(--radius-md); background:var(--surface-card); padding:10px 14px; margin-bottom:12px; }
.pass .row{ font:var(--font-label); color:var(--text-body); margin-bottom:3px; }
.pass .row:last-child{ margin-bottom:0; }
.pass .k{ color:var(--text-muted); display:inline-block; min-width:190px; }
.pass.warn{ border-left-color:var(--asubk-amber); }

/* ---- отказ шва НА МЕСТЕ ТАБЛИЦЫ (ИА-8, ИА-19) ----
   Блок нарочно похож на паспорт и нарочно другого цвета: он стоит там, где читатель
   ждёт числа, и обязан читаться как «ответ есть, и он отрицательный», а не как пустое
   место. Два вида отказа различаются кромкой: красная — сосед не считал вовсе,

.refusal{ border:1px solid var(--border-default); border-left:3px solid var(--asubk-red);

table.cgrid td.kid{ padding-left:34px; color:var(--text-muted); }

.doc-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }

.thr{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.lineform{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px 16px; }

 *  коэффициентов → чужая сторона (заглушка статистики и отчётности) → состояние →
 *  операции → снимок и швы → срок и дефект → экраны.

 *  Главное, что этот файл доказывает исполнением: вычислитель не знает ни одного
 *  коэффициента. Он складывает строки, которые ему назвала ЗАПИСЬ методики, — пятый
 *  коэффициент заводится строкой в редакции, а не веткой в коде (ИА-3, ADR-0122).
 * ===================================================================== */
const AN = {};

/* ------------------------------ ДАТЫ ------------------------------- */
const fmt = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
const addDays = (iso,n) => new Date(Date.parse(iso)+n*86400000).toISOString().slice(0,10);
const plural = (n,a,b,c) => { const x=n%100, y=n%10; return x>4&&x<21 ? c : y===1 ? a : y>1&&y<5 ? b : c; };
const dayWord = d => d + ' ' + plural(d,'день','дня','дней');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = sel => (typeof document === 'undefined' ? null : document.querySelector(sel));
const uniq = a => a.filter((x,i) => a.indexOf(x) === i);

/* ------------------------- РОЛИ И ВЫВОДЫ ---------------------------- *
   Вывод ставит человек. Правило, ставящее значение по порогу, — это уже
   классификация, а классификация анализ не читает и не слушает (ИА-10).      */
const ROLES = ['Ведущий куратор (Бекова Н.)','Ведущий куратор (Асанов А.)',
               'Сотрудник отдела анализа','Руководитель подразделения','Администратор'];
const WHO = {'Ведущий куратор (Бекова Н.)':'Бекова Н.','Ведущий куратор (Асанов А.)':'Асанов А.',
             'Сотрудник отдела анализа':'Осмонова Г.','Руководитель подразделения':'Тентимишев К.',
             'Администратор':'Администратор'};
const VERDICTS = ['удовлетворительное','удовлетворительное с оговорками','неудовлетворительное'];

/* Швов два, и каждый назван вопросом (форма ADR-0135 §4). Третьего нет. */

  analysisRatios: 'шва «analysisRatios» нет: коэффициент — не текущее значение объекта, '+

};

/* Кто вправе спрашивать. Классификация в списке есть и читать НЕ вправе — ИА-10. */
const CONSUMERS = [
  {module:'заявка и комиссия', may:['analysisVerdict'], note:'вкладка «Заключения», отдел analytics'},
  {module:'сопровождение',     may:['analysisDone'],    note:'обязательство закрывается фактом (ИА-12)'},
  {module:'кураторство',       may:['analysisDone'],    note:'нагрузка куратора'},
  {module:'отчётность',        may:['analysisVerdict','analysisDone'], note:'печать и выгрузка — там (ADR-0145 §4)'},
  {module:'задачи',            may:[], why:'задачу ставит человек со ссылкой на обзор как основание: '+
    'шва «поручить» у анализа нет (ИА-11)'},
  {module:'классификация',     may:[], why:'классификация анализ не читает ни в одной форме: суждение — '+
    'не вход классификации (ИА-10, ADR-0122 §3, ADR-0146 §2)'}
];

/* -------------------- СТРОКИ ФОРМ ВВОДА ОТЧЁТНОСТИ ------------------ *
   Общий справочник строк. Какие из них показать человеку — объявляет методика:
   единой формы «для всех» нет, потому что незаполнимое поле в общей форме

   Ниже — НАЧАЛЬНОЕ НАПОЛНЕНИЕ, а не закрытый список: справочник ведёт отдел анализа
   операциями addLine/retireLine (ИА-18). Иначе методика объявлена «набором форм ввода»,

const LINES = [

/* ------------------------- РЕЕСТР МЕТОДИК --------------------------- *
   Методика объявляет: применимость по типу лица, формы ввода и коэффициенты.
   Коэффициент объявляет ИСТОЧНИК своих чисел — строки отчётности и операцию из

/* Операция объявляет и то, чего она НЕ ТЕРПИТ: делению нужен ненулевой

  share: {sign:'÷ … × 100%', apply:(a,b) => a/b*100, nonZero:'den'},
  diff:  {sign:'−', apply:(a,b) => a-b}
};

    {n:2, since:'2026-04-01', note:'порог ликвидности поднят до 1,2; добавлено покрытие долга потоком',

      {id:'k-cur',  name:'Коэффициент текущей ликвидности', num:['ta_cur'], den:['li_short'], op:'ratio', fmt:'ratio', thr:{cmp:'>=', v:1.2}},
      {id:'k-auto', name:'Коэффициент автономии',           num:['eq'],     den:['bal'],      op:'ratio', fmt:'ratio', thr:{cmp:'>=', v:0.3}},
      {id:'k-ros',  name:'Рентабельность продаж',           num:['profit'], den:['rev'],      op:'share', fmt:'pct',   thr:{cmp:'>=', v:5}},

     ]}

    {n:1, since:'2024-01-01', note:'первая редакция',

     ]}
   ]},
  {id:'m-fl', name:'Оценка дохода и платёжеспособности физического лица', ptype:'физическое лицо',

   editions:[
    {n:1, since:'2024-01-01', note:'первая редакция',

/* ==ВЫЧИСЛИТЕЛЬ== ---------------------------------------------------- *
   Ниже — весь расчёт модуля. Он работает с ЗАПИСЯМИ: берёт из объявления
   коэффициента список строк, складывает их значения и применяет операцию из
   закрытого списка. Названия коэффициентов сюда не попадают ни одним словом —
   пятый коэффициент методики заводится записью, а не веткой (ИА-3).           */
function fold(vals, ids){ return (ids||[]).reduce((s,id) => s + (vals[id]==null ? 0 : Number(vals[id])), 0); }
function missingOf(coef, vals){
  return (coef.num||[]).concat(coef.den||[]).filter(id => vals[id]==null || vals[id]==='');
}
function passes(thr, v){
  if(v == null || !thr) return null;
  return thr.cmp === '>=' ? v >= thr.v : thr.cmp === '<=' ? v <= thr.v : null;
}
/* «Посчитать нельзя» — две разные беды, и вычислитель различает их КОДОМ и списком
   строк, на которые надо смотреть (ИА-19); слова для человека собираются один раз снаружи. */
function calcCoef(coef, vals){
  const miss = missingOf(coef, vals);
  if(miss.length) return {id:coef.id, name:coef.name, v:null, pass:null, missing:miss,
    nocalc:{code:'empty', lines:miss}};
  const a = fold(vals, coef.num);
  const b = coef.den && coef.den.length ? fold(vals, coef.den) : 1;
  /* Вторая беда, и она НЕ первая: строки заполнены, а делитель сложился в ноль.
     Проверка стоит здесь, а не внутри apply: apply умеет вернуть только число, и его null
     от «данных нет» неотличим — назвать причину ему нечем.                          */
  if(OPS[coef.op].nonZero === 'den' && b === 0)
    return {id:coef.id, name:coef.name, v:null, pass:null, missing:[],
      nocalc:{code:'zeroden', lines:(coef.den||[]).slice()}};
  const v = Math.round(OPS[coef.op].apply(a, b)*10000)/10000;
  return {id:coef.id, name:coef.name, v, pass:passes(coef.thr, v), missing:[], nocalc:null};
}
function calcAll(edition, vals){ return (edition.coefs||[]).map(c => calcCoef(c, vals)); }
/* Действующая на дату запись выбирается ОДНОЙ функцией (ИА-17). Порядок один и тот же:
   отобрать вступившие в силу, отсортировать по дате вступления, взять последнюю. Второй
   способ выбрать ту же запись рано или поздно разойдётся с первым — так и было до волны 4,
   когда строку расписания брали первой попавшейся, а редакцию методики — правильно. */
function onDate(rows, dateISO){
  const list = (rows||[]).filter(r => r.since <= dateISO).sort((x,y) => x.since < y.since ? -1 : 1);
  return list.length ? list[list.length-1] : null;
}
/* Тип лица и методика — тоже выбор по записи, и выбор ДАТИРОВАННЫЙ (ИА-4):
   спрашивается дата отчётности, «сегодня» в эту функцию не приходит вовсе. */
function typeOn(subj, dateISO){ return onDate(subj.ptype, dateISO); }
function editionOn(method, dateISO){
  return onDate((method.editions||[]).filter(e => !e.retired), dateISO);
}
/* Строка расписания выбирается тем же порядком и на ту же дату (ИА-17); отбор идёт по
   ПАРЕ «тип лица × категория риска» — ключ строки стал парным (АН-37). */
function rowOn(rows, ptype, risk, dateISO){
  return onDate((rows||[]).filter(r => r.ptype === ptype && r.risk === risk), dateISO);
}
/* Чужие величины спрашиваются НА ДАТУ и той же одной функцией выбора записи (ИА-17):
   второй порядок выбора действующей записи рано или поздно разойдётся с первым. */
function riskOn(subj, dateISO){ const r = onDate(subj.risk, dateISO); return r ? r.v : null; }
function debtOn(subj, dateISO){ const r = onDate(subj.debt, dateISO); return r ? r.v : null; }
/* ==/ВЫЧИСЛИТЕЛЬ== */

/* Слова причины собираются ОДИН раз: их читает и экран, и отказ в подписи — второй
   текст той же причины разошёлся бы с первым, как расходятся две двери одного правила
   (ИА-16). Две беды — два текста: незаполненную строку лечит внесение отчётности,
   нулевой делитель — разбор самой отчётности, вносить в неё нечего (ИА-19).          */
const NOCALC = {
  empty:   ns => 'в отчётности не заполнены строки '+ns.join(', '),
  zeroden: ns => 'знаменатель равен нулю: '+ns.join(' + ')+' = 0'
};
function nocalcWhy(row){
  if(!row || !row.nocalc) return '';
  return NOCALC[row.nocalc.code]((row.nocalc.lines||[])
    .map(id => '«'+(LINE(id) ? LINE(id).name : id)+'»'));
}
AN.nocalcWhy = nocalcWhy;

AN.typeOn = (subjId, dateISO) => { const t = typeOn(SUBJ(subjId), dateISO); return t ? t.v : null; };
AN.riskOn = (subjId, dateISO) => { const s = SUBJ(subjId); return s ? riskOn(s, dateISO) : null; };
AN.debtOn = (subjId, dateISO) => { const s = SUBJ(subjId); return s ? debtOn(s, dateISO) : null; };
AN.riskName = code => RISK[code] || code;
AN.methodFor = (subjId, dateISO) => {
  const s = SUBJ(subjId); if(!s) return {ok:false, why:'заёмщик не найден'};
  const t = typeOn(s, dateISO);
  if(!t) return {ok:false, why:'тип лица на '+fmt(dateISO)+' не установлен: методику выбрать не из чего'};
  const m = AN.state.methods.find(x => x.ptype === t.v);
  if(!m) return {ok:false, why:'для типа лица «'+t.v+'» методики нет: единой методики «для всех» в системе не бывает (§2.2)'};
  const ed = editionOn(m, dateISO);
  if(!ed) return {ok:false, why:'у методики «'+m.name+'» нет редакции, действующей на '+fmt(dateISO)};
  return {ok:true, ptype:t.v, ptypeSince:t.since, method:m, ed,
    why:'тип лица на дату отчётности '+fmt(dateISO)+' — «'+t.v+'»; редакция '+ed.n+' от '+fmt(ed.since)};
};

/* ==ЧУЖАЯ СТОРОНА== */
/* Всё, что ниже до закрывающего маркера, — ЗАГЛУШКА СОСЕДЕЙ: реестр показателей и
   средняя просрочка принадлежат статистике, шаблоны отчётных форм — отчётности.
   Настоящих данных здесь нет и быть не может: заглушка отвечает готовыми фикстурами
   ровно на ширину задаваемого вопроса и НИЧЕГО НЕ СЧИТАЕТ. Второго движка статистики
   внутри анализа не заводится (ADR-0146): агрегат приходит посчитанным — вместе с
   ПАСПОРТОМ ответа (кто ответил, на какую дату, в каком режиме, в каком охвате —
   ADR-0152 §2), потому что число без паспорта в обзоре не показывается (ИА-8).
   Живые соседи этого пока не умеют: шаблон с редакциями и признаком «пригоден как
   основание обзора» есть у отчётности только макетом, шва статистики с паспортом
   нет вовсе. Долг записан в журнале волн (`ASUBK-status-razrabotki.md`), а не спрятан
   здесь под видом работающего соседа.
   Участок ОДНОСТОРОННИЙ: состояния модуля анализа он не читает и не правит ни одной
   строкой — ни в коде, ни в комментарии имени состояния не встречается, и это

   Четыре вещи, без которых шов отдаёт не ответ, а таблицу. Всё это принадлежит
   СОСЕДУ и живёт по эту сторону маркера: анализ ни видимости чужих строк, ни
   паспорта чужого числа не выводит — он их спрашивает (ADR-0146, ИА-9).           */

/* ВИДИМОСТЬ применяется ВНУТРИ шва — до порога, до сложения и до ответа. Строка,
   отданная наружу и спрятанная потом при показе, уже ушла: «спрятать при показе» и
   «не отдавать» расходятся ровно в тот день, когда ответ попадёт в выгрузку или в
   обзор. Роль приходит ВОПРОСОМ, а не читается из состояния спрашивающего: сосед,
   знающий, кто мы сейчас, — уже не сосед (ИА-9, ADR-0155 §1).
   Ведущий куратор видит своих заёмщиков, и только их; отдел анализа, руководитель
   подразделения и администратор — портфель целиком. Роли взяты из общего списка
   ROLES/WHO, своих здесь не заводится.
   Роль не названа — заглушка отвечает в полном охвате: сузить вопрос, который не
   назвал спрашивающего, нечем, и молчаливое сужение было бы хуже явного полного
   охвата — оно выглядело бы как полный ответ.                                     */
const CURATOR_ROLE = 'Ведущий куратор';
function visible(row, who){
  if(String(who == null ? '' : who).indexOf(CURATOR_ROLE) !== 0) return true;
  return row.dims['куратор'] === WHO[who];
}
/* ОХВАТ — то, что роль вправе видеть, СКАЗАННОЕ СЛОВАМИ и уехавшее в паспорт:
   усечение произносится вслух, а не угадывается по короткому списку (ИА-8).       */
function scopeOf(who){
  const mine = PORTFOLIO.filter(r => visible(r, who));
  const narrowed = mine.length !== PORTFOLIO.length;
  return {narrowed, n:mine.length, of:PORTFOLIO.length, who: narrowed ? WHO[who] : null,
    scope: narrowed ? uniq(mine.map(r => r.dims['подразделение'])) : SCOPE.slice()};
}

/* ПАСПОРТ ответа — ДВЕ формы, и обе объявляет производитель (ADR-0152 §2): полная
   едет с ответом, короткая стоит рядом с числом. Третьей, сокращённой потребителем
   на свой вкус, не бывает — иначе два экрана сократят по-разному и «числа без даты
   не остаётся» станет непроверяемым.
   Четвёртый аргумент — ответ scopeOf(): охват в паспорте тот же самый, что применён
   к строкам, а не объявленный отдельно рядом.                                     */
function passportOf(seam, atISO, mode, scope){
  const sc = scope && scope.scope ? scope : {scope:SCOPE.slice(), narrowed:false, who:null};
  return {seam, owner:'статистика', asOf:atISO, mode, scope:sc.scope.slice(),
    narrowed:!!sc.narrowed, forWhom:sc.who || null, n:null};
}
function shortPassport(p){
  if(!p) return null;
  return 'статистика · на '+fmt(p.asOf)+' · '+p.mode+' · '+
    (p.narrowed ? 'вам видно: '+p.forWhom : 'охват: весь портфель')+
    (p.n == null ? '' : ' · строк '+p.n);
}
/* Паспорт — не опция: ответа без него у двери нет. Проверка стоит на ВЫХОДЕ, а не в
   договорённости «не забудь заполнить», потому что забывают всегда (ИА-8).        */
const PASSPORT_FIELDS = [['seam','шов'],['owner','владелец'],['asOf','дата'],
                         ['mode','режим'],['scope','охват']];
function emit(data, p){
  const miss = PASSPORT_FIELDS.filter(f => !p || p[f[0]] == null).map(f => f[1]);
  if(miss.length) return {ok:false, noPassport:true,
    why:'ответ без паспорта наружу не отдаётся: не назван'+(miss.length > 1 ? 'ы' : '')+' '+
      miss.join(', ') + ' — число без паспорта в обзоре не показывается и не хранится '+
      '(ИА-8, ADR-0152 §2)'};
  p.short = shortPassport(p);                          /* краткая форма — тоже паспорт */
  return Object.assign({ok:true, passport:p}, data);
}

/* ЕДИНСТВЕННАЯ АРИФМЕТИКА ЗАГЛУШКИ: сложение показателя по ПОКАЗАННЫМ строкам.
   Снимки заглушка не пересчитывает и не проверяет — их посчитала статистика своим
   прогоном по всему портфелю, и второго её движка внутри анализа не заводится
   (ADR-0146). Итог, собранный здесь, — про показанное, а не про портфель.         */
function agg(rows, ind){
  return (rows || []).reduce((s, r) => s + (r.inds[ind] == null ? 0 : Number(r.inds[ind])), 0);
}
/* ПОРОГ списка объектов. Усечения нет: «первые 12 из 47» читаются как «их 12», и
   ошибка эта тихая — она не ломает экран, она врёт числом (ADR-0178 §1).          */
const rowsLimit = 12;

/* Общий вход трёх швов статистики. Две вещи спрашиваются раньше данных: ДАТА (у
   статистики «сейчас» нет вовсе — у неё есть снимки) и СОСТОЯНИЕ ПОКАЗАТЕЛЯ В
   РЕЕСТРЕ НА ЭТУ ДАТУ (показателя вне реестра в обзоре не бывает — ИА-6).
   Отказ соседа помечен seamFail: экран обязан показать объяснение ВМЕСТО таблицы,
   а не пустую таблицу — пустая таблица читается как «ничего нет».                 */
function seamNo(why){ return {ok:false, seamFail:true, why}; }
function askOk(seam, q){
  if(!q || !q.date) return seamNo('шов «'+seam+'» без даты не отвечает: величина '+
    'статистики живёт снимком на дату, «сейчас» у неё нет вовсе — назовите дату среза '+
    '(ИА-8, ADR-0152 §2)');
  const ind = STAT_INDS.find(x => x.id === q.ind);
  if(!ind) return seamNo('показателя «'+q.ind+'» в реестре статистики нет вовсе: '+
    'показателя вне реестра в обзоре не бывает (ИА-6, ADR-0150 §5)');
  if(!(ind.since <= q.date && (ind.until == null || ind.until >= q.date)))
    return seamNo('показатель «'+ind.name+'» в реестре на '+fmt(q.date)+' не состоит'+
      (ind.why ? ': '+ind.why : '')+' — на эту дату его не существует (ИА-6)');
  const bad = Object.keys(q.values || {}).filter(d => !DIM(d));
  if(bad.length) return seamNo('разреза «'+bad[0]+'» в справочнике статистики нет: какие '+
    'разрезы бывают, знает она, и выдумать их за неё нельзя (ИА-7)');
  return null;
}

/* ДВЕРИ СОСЕДЕЙ. Справочные отвечают, ЧТО объявлено и ЧТО состоит в реестре; три шва
   статистики отвечают ВЕЛИЧИНАМИ — готовыми, с паспортом и в охвате роли. Все они —
   чистые функции от фикстур выше: своей памяти у двери нет, и один и тот же вопрос
   дважды даёт один ответ.
   Действующую на дату запись сосед выбирает ТЕМ ЖЕ порядком, что и мы (ИА-17): в
   макете это буквально одна функция — второй порядок выбора рано или поздно
   разошёлся бы с первым.                                                           */
const REP = {
  /* Какие швы сосед открывает внутрь: имя, владелец и ВОПРОС, на который шов отвечает.
     Справка ссылочная — величин в ней нет, поэтому нет и паспорта (ADR-0152 §2). Тот,
     кто спрашивает, объявление берёт ЗДЕСЬ, а не переписывает его к себе: второй список
     тех же швов рано или поздно разошёлся бы с первым (ИА-16, ADR-0135 §4).         */
  seamsIn(){
    return {list:SEAMS_IN.filter(s => s.owner === 'отчётность')
      .map(s => ({id:s.id, owner:s.owner, q:s.q}))};
  },
  /* Список шаблонов, пригодных как основание обзора. Ссылочная информация: код, имя,
     владелец, можно ли динамику. Состава здесь нет — за ним ходят с датой.         */
  templates(){
    const list = TEMPLATES.filter(t => t.forReview).map(t => {
      const last = t.editions[t.editions.length-1];
      return {code:t.code, name:t.name, owner:t.owner, series:last.series};
    });
    return {list, passport:{seam:'repTemplates', owner:'отчётность', asOf:null, mode:'справка',
      scope:SCOPE.slice()}};
  },
  /* Какая редакция шаблона действует на дату. Вспомогательная: паспорта не несёт,
     потому что наружу сама по себе не ходит.                                       */
  editionOn(code, atISO){
    const t = TEMPLATES.find(x => x.code === code);
    return t ? onDate(t.editions, atISO) : null;
  },
  /* Паспорт шаблона на дату: действующая редакция и её ОБЪЯВЛЕННЫЙ состав. Обзор
     копирует отсюда не состав, а ссылку — «шаблон ШО-04, редакция 2» (ИА-7).       */
  reportTemplate(code, atISO){
    const t = TEMPLATES.find(x => x.code === code);
    if(!t) return {ok:false, why:'шаблона «'+code+'» у отчётности нет: состав среза объявляет '+
      'шаблон, и выдумать его за соседа нельзя (ADR-0154 §2)'};
    const ed = REP.editionOn(code, atISO);
    if(!ed) return {ok:false, why:'у шаблона «'+t.code+'» нет редакции, действующей на '+fmt(atISO)+
      ': первая вступила в силу '+fmt(t.editions[0].since)};
    return {ok:true, code:t.code, name:t.name, owner:t.owner, forReview:t.forReview, why:t.why || null,
      ed:ed.n, since:ed.since, note:ed.note,
      dims:ed.dims.slice(), inds:ed.inds.slice(), series:ed.series,
      passport:{seam:'repTemplate', owner:'отчётность', asOf:atISO, mode:'на дату',
        scope:SCOPE.slice()}};
  },

  /* ─────────────── ВЫПУСК: ДВЕ СТУПЕНИ И ОДНА ДВЕРЬ ─────────────── *
     Отчётность различает ПРЕДВАРИТЕЛЬНЫЙ выпуск и ОКОНЧАТЕЛЬНЫЙ, и разница между ними
     не в оформлении. Предварительный не морозит ничего: получателя у него нет, номера
     серии он не тратит, файл его — расходник, посмотреть и выбросить. Окончательный
     НАЗЫВАЕТ ПОЛУЧАТЕЛЯ, тратит номер и вместе с числами морозит ОХВАТ, в котором
     сделан. Ради этого ступени и различают: подписанный документ стоит только поверх
     окончательного — на предварительном стоять нечему, завтра он покажет другие числа,
     и подпись окажется под пустым местом (ADR-0157 §2).
     ПОЛУЧАТЕЛЬ ЗДЕСЬ — ССЫЛКА {kind, ref}, а не строка «кому». Вид «обзор» означает,
     что выпуск ушёл не наружу, а ДОКУМЕНТУ смежного модуля: тот опирается на этот
     выпуск и держит от него ровно два номера — выпуска и рабочего списка, — а чисел
     не держит вовсе (ADR-0157 §4).
     РАБОЧИЙ СПИСОК возвращается ВМЕСТЕ с выпуском, а не заказывается вторым вопросом:
     список — замороженный состав, и морозит его тот же выпуск; второй заказ дал бы
     второй момент времени и, значит, второй состав под тем же номером.
     ЧЕГО ЖИВАЯ ОТЧЁТНОСТЬ ПОКА НЕ УМЕЕТ (долг соседа, а не наша выдумка): у неё в
     справочнике адресатов только внешние адресаты сдачи и подразделения — получателя
     вида «документ смежного модуля» там нет; нет и рабочего списка, приходящего одним
     ответом с выпуском (сейчас список заказывают отдельной кнопкой). Здесь это
     ЗАГЛУШКА, написанная так, как сосед обязан ответить; требование уходит ему
     отдельной строкой, и до тех пор утверждение обзора на живом стенде не соберётся. */
  finalIssue(spec){
    OUT.asked++;
    const s = spec || {};
    const kind = s.kind == null ? 'окончательный' : String(s.kind);
    const rcp = s.recipient || null;
    if(kind !== 'окончательный') return {ok:false, preliminary:true, kind,
      why:'выпуск «'+kind+'» получателя не несёт и номера серии не тратит: предварительный '+
        'не морозит ни чисел, ни охвата — он расходник. Документ, подписанный поверх него, '+
        'завтра покажет другие числа: подпись обязана стоять на ОКОНЧАТЕЛЬНОМ выпуске, '+
        'потому что морозит числа получатель, а не кнопка (ADR-0157 §2)'};
    if(!rcp || !rcp.kind || !rcp.ref) return {ok:false,
      why:'окончательный выпуск бывает только с НАЗВАННЫМ получателем: без получателя '+
        'морозить нечего и не для кого. Получатель — ссылка вида {kind, ref}, а не строка '+
        '«кому»: по строке потом не найти, что именно на этом выпуске стоит (ADR-0157 §2)'};
    if(!s.tpl || s.ed == null) return {ok:false, why:'выпуск делается по шаблону и его '+
      'РЕДАКЦИИ: без номера редакции непонятно, что именно выпущено — состав объявляет '+
      'редакция, а не код формы (ADR-0154 §2)'};
    if(!s.asOf) return {ok:false, why:'выпуск без даты среза не делается: величина живёт '+
      'снимком на дату, а «сейчас» у отчётности нет вовсе'};
    if(!s.at) return {ok:false, why:'выпуск без даты выпуска не заводится: журнал исходящего '+
      'отвечает на вопрос «что и КОГДА мы отдали наружу», и дату эту приносит тот, кто '+
      'нажал, — своего «сегодня» у двери соседа нет'};
    /* Охват, усечённый видимостью роли, выпуск не запрещает — он делает его
       ПРЕДВАРИТЕЛЬНЫМ и запрещает называть получателя: сданный охват обязан быть
       охватом формы, а не областью видимости того, кто нажал кнопку.               */
    const sc = scopeOf(s.who);
    if(sc.narrowed) return {ok:false, preliminary:true, scope:sc.scope.slice(),
      why:'охват сужен видимостью роли «'+s.who+'»: видно '+sc.n+' объектов из '+sc.of+
        '. Окончательным такой выпуск не бывает и получателя ему назвать нельзя — иначе '+
        'получатель сравнит присланное с прошлым разом и увидит падение там, где сменился '+
        'не портфель, а тот, кто нажал кнопку'};
    const cuts = Object.assign({}, s.cuts || {});
    const objs = PORTFOLIO.filter(r => Object.keys(cuts).every(d => r.dims[d] === cuts[d]))
      .map(r => ({id:r.id, subj:r.subj, no:r.no}));
    const no = 'ВП-'+(++OUT.seq);
    const wl = 'РС-'+(OUT.worklists.length + 1);
    const passport = {seam:'repIssue', owner:'отчётность', asOf:s.asOf, mode:'окончательный выпуск',
      scope:sc.scope.slice(), narrowed:false, forWhom:null, frozen:true, issuedAt:s.at,
      by:s.by || null, tpl:s.tpl, ed:s.ed};
    passport.short = 'отчётность · выпуск '+no+' от '+fmt(s.at)+' · шаблон '+s.tpl+', ред. '+s.ed+
      ' · срез на '+fmt(s.asOf)+' · охват: весь портфель';
    OUT.issues.push({no, at:s.at, kind:'окончательный', final:true,
      tpl:s.tpl, ed:s.ed, asOf:s.asOf,
      period:s.period ? {from:s.period.from, to:s.period.to} : null,
      dim:s.dim || null, cuts, inds:(s.inds || []).slice(), by:s.by || null,
      recipient:{kind:rcp.kind, ref:rcp.ref},
      scope:sc.scope.slice(), worklist:wl, passport:clone(passport)});
    /* Список хранит ОБЪЕКТЫ, а не величины: величина у объекта меняется, состав — нет,
       и рабочий список отвечает на вопрос «с кем работать», а не «сколько там».     */
    OUT.worklists.push({no:wl, from:no, name:String(s.name || ('Объекты выпуска '+no)),
      at:s.at, by:s.by || null, scope:sc.scope.slice(), cuts:Object.assign({}, cuts),
      objects:objs, state:'открыт'});
    return {ok:true, issue:no, worklist:wl, at:s.at, kind:'окончательный', final:true,
      recipient:{kind:rcp.kind, ref:rcp.ref}, scope:sc.scope.slice(),
      passport:clone(passport), short:passport.short, objects:objs.length,
      note:'выпуск '+no+' окончательный: получатель назван ('+rcp.kind+' '+rcp.ref+'), охват '+
        'заморожен вместе с числами, рабочий список '+wl+' ('+objs.length+' объектов) отобран '+
        'ЭТИМ ЖЕ выпуском и пришёл в одном ответе с ним'};
  },

  /* Журнал исходящего целиком — что модуль отдал наружу. Дверь ЧИТАЮЩАЯ и служебная:
     величин в ней нет, поэтому нет и паспорта (ADR-0152 §2). Нужна она тому, кто обязан
     ПОКАЗАТЬ, что утверждение документа — это выпуск у соседа, а не запись у себя.  */
  journal(){ return clone(OUT); },

  /* Одна строка журнала по номеру: чем кончился выпуск, кому ушёл и в каком охвате.
     Отсюда — и только отсюда — получатель узнаёт свой охват: своего экземпляра охвата
     он не держит, иначе два охвата под одним номером разошлись бы молча.           */
  issueInfo(no){
    const i = OUT.issues.find(x => x.no === no);
    if(!i) return {ok:false, why:'выпуска «'+no+'» в журнале отчётности нет: номер выпуска '+
      'выдаётся выпуском, и придумать его за соседа нельзя'};
    return Object.assign({ok:true}, clone(i));
  },
  /* Рабочий список по номеру: состав, отобранный выпуском, и ссылка на него. */
  worklistInfo(no){
    const w = OUT.worklists.find(x => x.no === no);
    if(!w) return {ok:false, why:'рабочего списка «'+no+'» в журнале отчётности нет'};
    return Object.assign({ok:true}, clone(w), {n:w.objects.length});
  },

  /* ПОМЕТКА «ЧИСЛА ЗА ВЫПУСКОМ ПОЕХАЛИ». Ставит её отчётность — та, что выпуск сделала:
     сравнить «до» и «после» вправе только тот, кто заморозил «до». Получатель выпуска
     своей пометки не заводит и завести не может — чисел у него нет, сравнивать нечем.
     ПОМЕТКА НИЧЕГО НЕ МЕНЯЕТ В ЧИСЛАХ. Она не пересчитывает выпуск, не отменяет его и
     не трогает ни одного живого шва: после неё срез, ряд и строки приходят ровно те же.
     Она сообщает ОДНО — источник, из которого выпуск собран, после передачи сдвинулся;
     что с этим делать, решает человек, а выпуск остаётся неизменяемым (ИА-1).
     ЧЕГО ЖИВАЯ ОТЧЁТНОСТЬ ПОКА НЕ УМЕЕТ (долг соседа, а не наша выдумка): доставить
     такую пометку ПОЛУЧАТЕЛЮ вида «документ смежного модуля» она не может — получателя
     такого вида у неё в справочнике адресатов нет вовсе (см. finalIssue выше), а
     рассылка пометок идёт по тому же справочнику. Здесь пометка ложится в журнал и
     читается номером выпуска; требование «пометка обязана доходить до получателя-
     документа, а не только до внешнего адресата сдачи» уходит соседу отдельной строкой,
     и до тех пор помеченный обзор на живом стенде узнает о сдвиге только вручную.     */
  numbersMoved(spec){
    const s = spec || {};
    const i = OUT.issues.find(x => x.no === s.issue);
    if(!i) return {ok:false, why:'пометка ставится НА ВЫПУСК, а выпуска «'+
      (s.issue == null ? '—' : s.issue)+'» в журнале отчётности нет: помечать нечего'};
    if(!s.ind) return {ok:false, why:'пометка без показателя не ставится: «числа поехали» — это '+
      'не про выпуск целиком, а про величину в нём, и получатель обязан узнать, ЧТО именно '+
      'сдвинулось: иначе пометка читается как отзыв всего выпуска'};
    if(i.inds.indexOf(s.ind) < 0) return {ok:false, why:'показателя «'+s.ind+'» выпуск '+i.no+
      ' не отдавал: помечается то, что этим выпуском ушло наружу ('+
      (i.inds.join(', ') || 'ни одного')+')'};
    if(!s.at) return {ok:false, why:'пометка без даты не ставится: «когда замечено» — половина '+
      'её смысла. Своего «сегодня» у двери соседа нет — дату приносит тот, кто заметил'};
    if(!String(s.cause == null ? '' : s.cause).trim()) return {ok:false, why:'пометка без причины '+
      'не ставится: «числа поехали» без объяснения читается как отзыв выпуска, а выпуск '+
      'неизменяем (ИА-1). Сказать надо, ЧЕМ вызван сдвиг — поздней подачей, исправлением '+
      'источника или пересчётом: лечатся они по-разному'};
    const no = 'ПМ-'+(OUT.marks.length + 1);
    OUT.marks.push({no, issue:i.no, ind:s.ind, at:s.at, cause:String(s.cause).trim(),
      by:s.by || null, asOf:i.asOf,
      recipient:i.recipient ? {kind:i.recipient.kind, ref:i.recipient.ref} : null});
    return {ok:true, mark:no, issue:i.no, ind:s.ind, at:s.at,
      note:'пометка '+no+' поставлена на выпуск '+i.no+' и НИЧЕГО в нём не изменила: числа '+
        'выпуска заморожены, живые швы отвечают ровно тем же, что до неё. Пометка говорит '+
        'только одно — источник за выпуском сдвинулся после передачи'};
  },
  /* Пометки одного выпуска — по его номеру, в той же манере, что issueInfo выше:
     дверь ЧИТАЮЩАЯ, величин в ответе нет, поэтому нет и паспорта (ADR-0152 §2). */
  issueMarks(no){
    const i = OUT.issues.find(x => x.no === no);
    if(!i) return {ok:false, why:'выпуска «'+no+'» в журнале отчётности нет: пометка живёт на '+
      'выпуске, и придумать её за соседа нельзя'};
    const list = OUT.marks.filter(x => x.issue === no);
    return {ok:true, issue:i.no, at:i.at, asOf:i.asOf, n:list.length, marks:clone(list)};
  }
};
const STAT = {
  /* Швы статистики — тем же объявлением и в той же форме, что у отчётности выше.    */
  seamsIn(){
    return {list:SEAMS_IN.filter(s => s.owner === 'статистика')
      .map(s => ({id:s.id, owner:s.owner, q:s.q}))};
  },
  /* Сколько раз у статистики спросили величину — по швам и всего. Дверь служебная и
     ЧЕСТНАЯ: она отвечает про обращения, а не про данные, поэтому паспорта не несёт.
     Считает её сама статистика: спрашивающий, ведущий свой счёт обращений к соседу,
     считал бы намерения, а не вопросы.                                              */
  asked(){ return clone(ASKED_STAT); },

  /* Какие разрезы вообще БЫВАЮТ. Дверь справочная: величины в ответе нет, поэтому нет и
     паспорта — паспорт едет с числом (ADR-0152 §2). Объявлен ли разрез в форме, знает
     редакция шаблона, и это другой список (ИА-7).                                    */
  dims(){ return {list:clone(DIMS)}; },

  /* Показатели, состоящие в реестре НА ДАТУ. Выведенный из реестра в список не
     попадает вовсе — не «попадает серым», а не попадает: показателя вне реестра в
     обзоре не бывает (ИА-6, ADR-0150 §5). Вторым списком идут записи, на эту дату в
     реестре НЕ состоящие, — с причиной владельца реестра: «в реестре нет» и «в реестре
     нет ПОТОМУ ЧТО» — разные ответы, и второй нужен тому, кто держит на показатель
     ссылку и обязан объяснить пропавшую колонку словами (ИА-19).                     */
  indsOn(atISO){
    const inReg = s => s.since <= atISO && (s.until == null || s.until >= atISO);
    return {list:clone(STAT_INDS.filter(inReg)), out:clone(STAT_INDS.filter(s => !inReg(s))),
      passport:{seam:'statInds', owner:'статистика', asOf:atISO,
      mode:'на дату', scope:SCOPE.slice()}};
  },

  /* Порог показа объявлен дверью, а не угадывается потребителем: отказ по нему
     обязан называть и число объектов, и сам порог.                               */
  rowsLimit,

  /* ЗНАЧЕНИЕ ПОКАЗАТЕЛЯ В РАЗРЕЗЕ НА ДАТУ. Отвечает ГОТОВЫМ снимком: узлы со
     значением, детьми и нераспределённым остатком. Итог узла приходит посчитанным,
     и сложением детей его не заменить — разницу держит unalloc, а держит он её
     потому, что часть портфеля не отнесена ни к одному значению разреза (ИС-24
     канона отчётности). Заглушка тут ничего не считает вовсе.                    */
  statSlice(q){
    countAsk('statSlice');                               /* обращение считается ДО разбора вопроса:
                                                            отказ соседа — тоже заданный вопрос */
    const bad = askOk('statSlice', q); if(bad) return bad;
    const sc = scopeOf(q.who);
    /* Снимок посчитан по ВСЕМУ портфелю. Роли с суженной видимостью он не отдаётся —
       и не пустым ответом, а отказом словами: срез в её охвате статистика не считала,
       а выдать за него общий итог значит показать чужие деньги как свои (ИА-9). */
    if(sc.narrowed) return Object.assign(seamNo('срез в охвате «'+sc.who+'» статистика не '+
      'считала: снимок посчитан по всему портфелю ('+sc.of+' договоров), вам открыто '+
      sc.n+'. Общий итог за ваш охват не выдаётся — спросите строки швом statRows или '+
      'закажите срез в своём охвате'), {scope:sc.scope.slice()});
    const snap = SNAPS.find(s => s.asOf === q.date && s.ind === q.ind && s.dim === q.dim);
    if(!snap) return seamNo('снимка «'+q.ind+'» в разрезе «'+q.dim+'» на '+fmt(q.date)+
      ' у статистики нет: срез считается её прогоном, и задним числом он не появляется — '+
      'возьмите дату, на которую прогон был');
    const node = n => ({key:n.key, v:n.v, unalloc:n.unalloc, kids:(n.kids || []).map(node)});
    return emit({ind:q.ind, dim:q.dim, total:snap.total, unalloc:snap.unalloc,
      nodes:snap.nodes.map(node),
      why:'итог узла приходит посчитанным отдельно: сумма детей меньше него ровно на '+
        'нераспределённый остаток узла — складывать детей и выдавать сумму за родителя нельзя'},
      passportOf('statSlice', q.date, 'снимок на дату', sc));
  },

  /* ДИНАМИКА ПОКАЗАТЕЛЯ ПО ПЕРИОДАМ. Точки ряда — те же снимки: ряд СОБИРАЕТСЯ из
     готовых итогов, а не считается заново. Названо значение разреза — ряд идёт по
     его узлу; узла в снимке нет — точка приходит пустой С ПРИЧИНОЙ, а не нулём:
     ноль и «не считалось» на графике неотличимы, и это самая тихая из ошибок.    */
  statSeries(q){
    countAsk('statSeries');
    const bad = askOk('statSeries', q); if(bad) return bad;
    const sc = scopeOf(q.who);
    if(sc.narrowed) return Object.assign(seamNo('ряда в охвате «'+sc.who+'» у статистики '+
      'нет: точки ряда — те же снимки по всему портфелю ('+sc.of+' договоров), и сузить '+
      'посчитанное задним числом нельзя'), {scope:sc.scope.slice()});
    const key = q.values ? q.values[q.dim] : null;
    const snaps = SNAPS.filter(s => s.ind === q.ind && s.dim === q.dim && s.asOf <= q.date)
      .sort((a, b) => a.asOf < b.asOf ? -1 : 1);
    if(!snaps.length) return seamNo('снимков «'+q.ind+'» в разрезе «'+q.dim+'» на '+
      fmt(q.date)+' и ранее у статистики нет: ряд не из чего собрать');
    const points = snaps.map(s => {
      if(!key) return {at:s.asOf, v:s.total, unalloc:s.unalloc};
      const n = s.nodes.find(x => x.key === key);
      return n ? {at:s.asOf, v:n.v, unalloc:n.unalloc}
               : {at:s.asOf, v:null, why:'узла «'+key+'» в снимке от '+fmt(s.asOf)+' нет'};
    });
    const p = passportOf('statSeries', q.date, 'ряд снимков', sc); p.n = points.length;
    return emit({ind:q.ind, dim:q.dim, key, points,
      why:'ряд собран из '+points.length+' снимков статистики, а не пересчитан'}, p);
  },

  /* СТРОКИ ОБЪЕКТОВ НА ДАТУ. Ответ ДВОИЧЕН: либо полный список, либо названный отказ
     по порогу. Середины нет намеренно — усечённый список выглядит как полный и врёт
     молча (ADR-0178 §1). У каждой строки назван признак фиксации: смешанную нельзя
     ни показать наравне с закрытыми, ни спрятать (ИА-8).                          */
  statRows(q){
    countAsk('statRows');
    const bad = askOk('statRows', q); if(bad) return bad;
    const ind = STAT_INDS.find(x => x.id === q.ind);
    if(!ind.row) return seamNo('показатель «'+ind.name+'» в строке объекта не живёт'+
      (ind.why ? ': '+ind.why : '')+' — спросите его срезом (statSlice)');
    const sc = scopeOf(q.who);
    /* Видимость применяется ЗДЕСЬ — до порога и до сложения: строка, которую роль
       видеть не вправе, не должна ни попасть в ответ, ни попасть в итог, ни поднять
       счётчик, на котором сработает порог (ИА-9).                                 */
    const vals = q.values || {};
    const mine = PORTFOLIO.filter(r => visible(r, q.who));
    const hit = mine.filter(r => Object.keys(vals).every(d => r.dims[d] === vals[d]));
    if(hit.length > rowsLimit) return {ok:false, overLimit:true, n:hit.length,
      limit:rowsLimit, scope:sc.scope.slice(),
      why:'в этом числе '+hit.length+' объектов, порог показа — '+rowsLimit+': списком не '+
        'отдаётся. Сузьте вопрос значением разреза или возьмите выгрузкой — усечённого '+
        'ответа не бывает: «первые '+rowsLimit+' из '+hit.length+'» читаются как полный список'};
    const rows = hit.map(r => {
      const f = fixationOf(r.id);
      return {id:r.id, subj:r.subj, no:r.no, dims:clone(r.dims), v:r.inds[q.ind],
        fixation:f.kind, fixedBy:f.by, late:clone(f.late), fixNote:f.note};
    });
    const p = passportOf('statRows', q.date, 'строки на дату', sc); p.n = rows.length;
    return emit({ind:q.ind, rows, n:rows.length, sum:agg(hit, q.ind),
      mixed:rows.filter(r => r.fixation === 'смешанно').map(r => r.id),
      why:'итог здесь — сумма ПОКАЗАННЫХ строк, а не итог статистики по портфелю: '+
        'за ним ходят швом statSlice, где он приходит посчитанным'}, p);
  }
};

/* ---------------------------- СОСТОЯНИЕ ----------------------------- */
function seed(){
  const st = {
    today:'2026-08-21',
    role:'Ведущий куратор (Бекова Н.)',
    view:'borrower',
    subj:'b-1',
    doc:'ФА-7',
    subjects: clone(SUBJECTS),
    lines:    clone(LINES),
    methods:  clone(METHODS),
    schedule: clone(SCHEDULE),
    reports:  clone(REPORTS),
    analyses: [],
    reviews:  [],         /* аналитические обзоры: журнал ссылок, ни одного числа. Наполняется НЕ здесь, а AN.seedReviews(): утверждение тратит у отчётности номер выпуска, и сброс состояния жечь чужую серию не должен (АН-55) */
    tasks:    [],         /* поручения по обзорам — ЗАГЛУШКА модуля задач: в промышленной сборке они живут у него, здесь лежат рядом, чтобы показать одностороннюю ссылку (АН-61, ИА-11) */
    log: []
  };
  AN.state = st;
  /* Поля шаблонов в состоянии НЕТ и не было бы правильным: состав формы — знание
     соседа, и спрашивают его у отчётности на дату, а не хранят у себя копией
     (ИА-7, ADR-0154 §2). Журнал соседа тоже возвращается к исходному: он не наш,
     но прогон обязан быть повторимым — иначе второй seed() застаёт записи первого. */
  resetOut();
  /* Заключения проводятся операциями, а не выписываются готовыми: снимок обязан
     появиться из approve(), иначе макет доказывал бы литерал, а не поведение. */
  SEED_ANALYSES.forEach(a => {
    const r = REPORT(a.report);
    const mf = AN.methodFor(a.subj, r.at);
    st.analyses.push({no:a.no, subj:a.subj, period:a.period, report:a.report, reportVer:r.ver,
      method:mf.method.id, ed:mf.ed.n, state:'черновик', text:a.text, verdict:a.verdict,
      by:a.by, createdAt:r.filed, approvedAt:null, snapshot:null, corrections:[], prev:null});
  });
  SEED_ANALYSES.filter(a => a.approvedAt).forEach(a => {
    const doc = DOC(a.no);
    const res = freeze(doc, a.by, a.approvedAt);
    if(!res.ok) throw new Error('сид: '+a.no+' — '+res.why);
  });
  st.log = [];
  return st;
}
AN.seed = () => { AN.state = seed(); return AN.state; };
function log(msg){ AN.state.log.unshift({at: AN.state.today, who: WHO[AN.state.role], msg}); }

/* ------------------------- ДОСТУП И РОЛИ ---------------------------- */
AN.who = () => WHO[AN.state.role];
AN.isCurator = () => AN.state.role.indexOf('Ведущий куратор') === 0;
AN.isAnalyst = () => AN.state.role === 'Сотрудник отдела анализа';
AN.isAdmin   = () => AN.state.role === 'Администратор';
AN.leads = subjId => { const s = SUBJ(subjId); return !!s && AN.isCurator() && s.curator === AN.who(); };
AN.mayLead = subjId => {
  const s = SUBJ(subjId);
  if(!s) return {ok:false, why:'заёмщик не найден'};
  if(!AN.isCurator()) return {ok:false, why:'финанализ ведёт ведущий куратор заёмщика; роль «'+
    AN.state.role+'» его не ведёт (§13 канона)'};
  if(s.curator !== AN.who()) return {ok:false, why:'ведущий куратор заёмщика «'+s.name+'» — '+
    s.curator+'; чужого заёмщика вести нельзя'};
  return {ok:true};
};

/* --------------------------- ОТЧЁТНОСТЬ ----------------------------- */
AN.reportsOf = subjId => AN.state.reports.filter(r => r.subj === subjId)
  .sort((a,b) => a.at === b.at ? a.ver - b.ver : (a.at < b.at ? -1 : 1));
AN.latestReport = (subjId, period) => {
  const rs = AN.reportsOf(subjId).filter(r => r.period === period);
  return rs.length ? rs[rs.length-1] : null;
};
AN.usedBy = reportId => AN.state.analyses.filter(a => a.report === reportId).map(a => a.no);
AN.addReport = spec => {
  const s = SUBJ(spec.subj);
  if(!s) return {ok:false, why:'заёмщик не найден'};
  const lead = AN.mayLead(spec.subj);
  if(!lead.ok) return lead;
  const p = PERIODS.find(x => x.label === spec.period);
  if(!p) return {ok:false, why:'периода «'+spec.period+'» в справочнике нет'};
  if(p.end >= AN.state.today) return {ok:false, why:'период «'+p.label+'» ещё не завершился: '+
    'отчётность за него вносится с '+fmt(addDays(p.end,1))};
  if(!spec.basis) return {ok:false, why:'версия отчётности без документа-основания не вносится: '+
    'у каждой версии свои дата и основание (§2.1)'};
  const mf = AN.methodFor(spec.subj, p.end);
  if(!mf.ok) return mf;
  const empty = mf.ed.lines.filter(id => spec.vals[id]==null || spec.vals[id]==='');
  if(empty.length) return {ok:false, why:'не заполнены строки формы: '+
    empty.map(id => '«'+LINE(id).name+'»').join(', ')+' — форму объявляет методика «'+mf.method.name+'»'};
  const prev = AN.reportsOf(spec.subj).filter(r => r.period === spec.period);
  const r = {id:'r-'+(9000+AN.state.reports.length), subj:spec.subj, period:p.label, at:p.end,
    ver: prev.length+1, filed: AN.state.today, basis: spec.basis, by: AN.who(),
    vals: Object.keys(spec.vals).reduce((o,k) => { o[k] = Number(spec.vals[k]); return o; }, {})};
  AN.state.reports.push(r);
  log('внесена отчётность '+s.name+', '+r.period+', версия '+r.ver);
  return {ok:true, report:r, note: prev.length ? 'версия '+r.ver+': прежняя не затёрта и остаётся основанием своих заключений' : null};
};

/* ------------------------ ЖИЗНЬ ЗАКЛЮЧЕНИЯ -------------------------- */
AN.liveRatios = docNo => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  const r = REPORT(d.report); const m = METHOD(d.method);
  const ed = m.editions.find(e => e.n === d.ed);
  return {ok:true, live:true, rows: calcAll(ed, r.vals), ed, method:m, report:r};
};
/* Что видит человек: у черновика — живой расчёт, у утверждённого — снимок (ИА-1). */
AN.ratiosOf = docNo => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state === 'утверждено') return {ok:true, live:false, rows: clone(d.snapshot.ratios),
    ed: d.snapshot.edSnap, method: METHOD(d.method), report: REPORT(d.snapshot.report)};
  return AN.liveRatios(docNo);
};
AN.newAnalysis = spec => {
  const lead = AN.mayLead(spec.subj);
  if(!lead.ok) return lead;
  const r = REPORT(spec.report);
  if(!r || r.subj !== spec.subj) return {ok:false, why:'версия отчётности не найдена у этого заёмщика'};
  const dup = AN.state.analyses.find(a => a.subj === spec.subj && a.period === r.period && a.state === 'черновик');
  if(dup) return {ok:false, why:'за период «'+r.period+'» уже открыт черновик '+dup.no+
    ': второй черновик того же периода не заводится'};
  /* Заключение за период, по которому уже подписано другое, — это ПЕРЕИЗДАНИЕ, и правило у
     него одно, какой бы дверью его ни завели (ИА-16): кнопкой у версии отчётности или
     кнопкой «Новое заключение» в самом документе. Связь с прежним ставит машина: она
     выводится из данных, а не приносится аргументом вызова — иначе одна из дверей её теряет. */
  const line = AN.state.analyses.filter(a => a.subj === spec.subj && a.period === r.period &&
    a.state === 'утверждено').sort((a,b) => a.approvedAt < b.approvedAt ? -1 : 1);
  const last = line.length ? line[line.length-1] : null;
  if(last && r.id === last.report) return {ok:false, why:'основание то же самое: новое заключение '+
    'заводится, когда изменились обстоятельства — иначе это корректировка (ADR-0112). '+
    'За «'+r.period+'» уже утверждено '+last.no+' на этой же версии '+r.ver};
  if(last && r.ver < last.reportVer) return {ok:false, why:'версия '+r.ver+' отчётности старше '+
    'версии '+last.reportVer+', на которой стоит утверждённое '+last.no+': переиздание встаёт '+
    'на более новое основание, а не на прежнее'};
  const mf = AN.methodFor(spec.subj, r.at);
  if(!mf.ok) return mf;
  const no = 'ФА-'+(AN.state.analyses.length + 6);
  const d = {no, subj:spec.subj, period:r.period, report:r.id, reportVer:r.ver,
    method:mf.method.id, ed:mf.ed.n, state:'черновик', text:'', verdict:null,
    by:AN.who(), createdAt:AN.state.today, approvedAt:null, snapshot:null, corrections:[],
    prev: last ? last.no : null};
  AN.state.analyses.push(d);
  log('заведён черновик '+no+' по '+SUBJ(spec.subj).name+', '+r.period+
    (last ? ' (переиздание '+last.no+')' : ''));
  return {ok:true, doc:d, why:mf.why,
    note: last ? 'за период уже есть утверждённое '+last.no+': новое встало на версию '+r.ver+
      ' основания, связь проставлена — прежнее остаётся в истории (ADR-0112)' : null};
};
AN.setText = (docNo, text) => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state === 'утверждено') return AN.tryEditApproved(docNo);
  const lead = AN.mayLead(d.subj); if(!lead.ok) return lead;
  d.text = String(text||''); return {ok:true};
};
AN.setVerdict = (docNo, v) => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state === 'утверждено') return AN.tryEditApproved(docNo);
  const lead = AN.mayLead(d.subj); if(!lead.ok) return lead;
  if(VERDICTS.indexOf(v) < 0) return {ok:false, why:'вывода «'+v+'» в перечне нет'};
  d.verdict = v; return {ok:true};
};

/* Утверждение = единственная подпись. Оно же фиксирует снимок (ADR-0153 §2). */
function freeze(d, who, atISO){
  const r = REPORT(d.report);
  if(!r) return {ok:false, why:'версия отчётности не найдена'};
  const m = METHOD(d.method);
  const ed = m.editions.find(e => e.n === d.ed);
  if(!ed) return {ok:false, why:'редакция методики не найдена'};
  if(!String(d.text||'').trim()) return {ok:false, why:'заключение без текста не утверждается: '+
    'подпись стоит под суждением, а не под таблицей коэффициентов'};
  if(!d.verdict) return {ok:false, why:'вывод не выбран: утверждается суждение, а не расчёт'};
  const rows = calcAll(ed, r.vals);
  const bad = rows.filter(x => x.v == null);
  if(bad.length) return {ok:false, why:'не посчитан коэффициент «'+bad[0].name+'» — '+nocalcWhy(bad[0])};
  d.state = 'утверждено';
  d.approvedAt = atISO;
  d.by = who;
  d.snapshot = {
    at: atISO, by: who,
    method: m.id, methodName: m.name, ed: ed.n, edSince: ed.since,
    report: r.id, reportVer: r.ver, reportPeriod: r.period, reportAt: r.at, reportFiled: r.filed,
    reportBasis: r.basis,
    ptype: (typeOn(SUBJ(d.subj), r.at)||{}).v,
    lines: clone(r.vals),
    edSnap: clone(ed),
    ratios: rows
    /* Вывода здесь нет и не будет (ИА-15): ADR-0153 §1 перечисляет состав снимка —
       значения, база, редакция методики, версия отчётности, дата расчёта, — и суждения
       в перечне нет. Снимок объясняет вывод, но не является его вторым экземпляром:
       иначе корректировка вывода (ADR-0112) оставляет в одном документе два разных
       значения одного поля, и наружу уходит то одно, то другое.                       */
  };
  return {ok:true};
}
AN.approve = docNo => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state === 'утверждено') return {ok:false, why:'заключение '+d.no+' уже утверждено '+
    fmt(d.approvedAt)+': второй подписи у документа нет (§2.3)'};
  const lead = AN.mayLead(d.subj); if(!lead.ok) return lead;
  const res = freeze(d, AN.who(), AN.state.today);
  if(res.ok) log('утверждено '+d.no+' — '+d.verdict);
  return res;
};

/* Изменился источник — заключение помечается, но НЕ пересчитывается (ИА-1). */
AN.sourceChanged = docNo => {
  const d = DOC(docNo);
  if(!d || d.state !== 'утверждено') return [];
  const notes = [];
  const newer = AN.state.reports.filter(r => r.subj === d.subj && r.period === d.snapshot.reportPeriod &&
    r.ver > d.snapshot.reportVer).sort((a,b) => a.ver - b.ver);
  newer.forEach(r => notes.push({what:'отчётность', text:'за тот же период подана версия '+r.ver+
    ' от '+fmt(r.filed)+' — «'+r.basis+'»', at:r.filed, report:r.id}));
  return notes;
};
/* Что дал бы пересчёт сегодня. Показывается РЯДОМ и никуда не записывается:
   это объяснение пометки, а не новое значение заключения. */
AN.wouldBe = docNo => {
  const d = DOC(docNo);
  if(!d || d.state !== 'утверждено') return null;
  const r = AN.latestReport(d.subj, d.snapshot.reportPeriod);
  if(!r || r.ver === d.snapshot.reportVer) return null;
  return {report:r, rows: calcAll(d.snapshot.edSnap, r.vals)};
};

/* Два механизма правки (ADR-0112): корректировка ошибки — и новое заключение. */
AN.correct = (docNo, spec) => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state !== 'утверждено') return {ok:false, why:'черновик правится прямо, корректировка ему не нужна'};
  const lead = AN.mayLead(d.subj); if(!lead.ok) return lead;
  if(['текст','вывод'].indexOf(spec.field) < 0) return {ok:false, why:'корректировкой правится текст '+
    'заключения или вывод; числа корректировкой не правятся — они в снимке (ИА-1)'};
  if(!String(spec.basis||'').trim()) return {ok:false, why:'корректировка без основания не принимается: '+
    'у исправления обязан быть документ, которым оно объяснено (ADR-0112)'};
  if(spec.field === 'вывод' && VERDICTS.indexOf(spec.value) < 0) return {ok:false, why:'вывода «'+spec.value+'» в перечне нет'};
  const was = spec.field === 'текст' ? d.text : d.verdict;
  if(spec.field === 'текст') d.text = spec.value; else d.verdict = spec.value;
  d.corrections.push({at:AN.state.today, by:AN.who(), field:spec.field, was, now:spec.value, basis:spec.basis});
  log('корректировка '+d.no+' ('+spec.field+')');
  return {ok:true, note:'снимок не тронут: корректировка исправляет запись, а не пересчитывает основание'};
};
/* Ярлык к той же операции: своего правила у него нет — он лишь подставляет последнюю
   версию основания за период. Проверки и связь живут в newAnalysis (ИА-16). */
AN.reissue = docNo => {
  const d = DOC(docNo); if(!d) return {ok:false, why:'заключение не найдено'};
  if(d.state !== 'утверждено') return {ok:false, why:'переиздаётся утверждённое заключение; черновик правится сам'};
  const r = AN.latestReport(d.subj, d.period);
  if(!r) return {ok:false, why:'отчётности за период нет'};
  const res = AN.newAnalysis({subj:d.subj, report:r.id});
  if(res.ok) log('переиздание '+d.no+' → '+res.doc.no+' на версии '+r.ver);
  return res;
};

/* ---------------------------- ШВЫ НАРУЖУ ---------------------------- *
   Два ответа, каждый назван вопросом (форма ADR-0135 §4). Черновиков не отдаёт
   ни один: незаконченная работа, показанная как результат, читается как результат. */
AN.analysisVerdict = subjId => {
  const s = SUBJ(subjId);
  if(!s) return {ok:false, why:'заёмщик не найден'};
  const list = AN.state.analyses.filter(a => a.subj === subjId && a.state === 'утверждено')
    .sort((a,b) => a.approvedAt < b.approvedAt ? -1 : 1);
  if(!list.length) return {ok:true, none:true, text:'анализа нет', subj:subjId};
  const d = list[list.length-1];
  return {ok:true, none:false, subj:subjId, verdict:d.verdict, no:d.no, at:d.approvedAt,
    period:d.period, method:METHOD(d.method).name, ed:d.ed,
    changed: AN.sourceChanged(d.no).length > 0};
};
AN.analysisDone = (subjId, period) => {
  const d = AN.state.analyses.find(a => a.subj === subjId && a.period === period && a.state === 'утверждено');
  return d ? {ok:true, done:true, at:d.approvedAt, no:d.no} : {ok:true, done:false, at:null, no:null};
};
AN.callSeam = (module, seam, arg, period) => {
  const c = CONSUMERS.find(x => x.module === module);
  if(!c) return {ok:false, why:'модуль «'+module+'» шва не спрашивает'};
  if(NO_SEAM[seam]) return {ok:false, why:NO_SEAM[seam]};
  if(SEAMS.indexOf(seam) < 0) return {ok:false, why:'шва «'+seam+'» нет: швов два — '+SEAMS.join(', ')};
  if(c.may.indexOf(seam) < 0) return {ok:false, why: c.why || ('модулю «'+module+'» шов «'+seam+'» не открыт')};
  return {ok:true, answer: seam === 'analysisVerdict' ? AN.analysisVerdict(arg) : AN.analysisDone(arg, period)};
};

/* ------------------ СРОК → ОБЯЗАТЕЛЬСТВО → ДЕФЕКТ -------------------- *
   Расписание — наше. Обязательство и дефект — ЧУЖИЕ: они считаются в
   сопровождении и здесь только показаны зеркалом (ИА-13). Ни одного поля с
   дефектом в состоянии модуля нет — найдите его, и это будет ошибкой.          */
AN.dueOf = subjId => {
  const s = SUBJ(subjId);
  if(!s) return {required:false, why:'заёмщик не найден'};
  const today = AN.state.today;
  /* Тип лица и категория риска берутся на ту же дату, что и методика, — на КОНЕЦ
     ОТЧЁТНОГО ПЕРИОДА (ИА-4, ИА-17, АН-38, §7 канона). Период объявляет сама строка
     расписания, поэтому проходов два: первым находим период, вторым — строку,
     действовавшую на его конец. Все записи выбираются датированно, а не первой
     попавшейся. */
  const ptypeNow = AN.typeOn(subjId, today);
  const riskNow  = riskOn(s, today);
  /* Категории нет — и это ответ соседа, а не пробел: она живёт на кредите и у заёмщика
     без действующих кредитов не применяется (глоссарий, «Категория риска»; канон
     классификации §9). Плановый анализ такому заёмщику не вменяется — и сказано это
     словами (АН-23, АН-54). Второй проверки «есть ли кредиты» в строке расписания нет:
     она была бы второй дверью того же правила. */
  if(!riskNow) return {required:false,
    why:'категории риска у заёмщика нет: она живёт на кредите и у заёмщика без действующих '+
      'кредитов не применяется — плановый анализ ему не вменяется'};
  const first = rowOn(AN.state.schedule, ptypeNow, riskNow, today);
  if(!first) return {required:false,
    why:'для пары «'+ptypeNow+' × '+AN.riskName(riskNow)+'» строки расписания нет: по этой '+
      'категории плановый анализ финансово-хозяйственного состояния не проводится'};
  const p = FREQ[first.freq].last(today);
  const ptypeEnd = AN.typeOn(subjId, p.end);
  const riskEnd  = riskOn(s, p.end);
  if(!riskEnd) return {required:false, why:'на конец периода '+fmt(p.end)+' категории риска у '+
    'заёмщика не было: плановый анализ за этот период не вменяется'};
  const row = rowOn(AN.state.schedule, ptypeEnd, riskEnd, p.end);
  if(!row) return {required:false, why:'на конец периода '+fmt(p.end)+' пара — «'+ptypeEnd+
    ' × '+AN.riskName(riskEnd)+'», и строки расписания для неё нет'};
  /* Периодичности разошлись — значит период, от которого считался срок, посчитан по одной
     строке, а вменяет анализ другая. Молча выбрать любую значит показать чужой срок как
     свой: отказ называется, и решает человек. */
  if(row.freq !== first.freq) return {required:false, unresolved:true, row:row.id,
    why:'срок не определён: пара «тип лица × категория» менялась, и строки расписания '+
      'расходятся периодичностью — по строке «'+first.id+'» ('+FREQ[first.freq].name+
      ') период кончается '+fmt(p.end)+', а на эту дату действует строка «'+row.id+'» ('+
      FREQ[row.freq].name+'). Какая из них вменена, решает администратор расписания, а не машина'};
  /* Порог — поле строки, а не константа кода (АН-37, АН-39): у среднего риска он есть,
     у высокого его нет вовсе. Сравнение строгое: норма говорит «более», а не «не менее».
     Сумма спрашивается на конец периода — той же датой, что категория (АН-38).          */
  const debt = debtOn(s, p.end);
  if(row.limit != null){
    if(debt == null) return {required:false, unresolved:true, row:row.id,
      why:'суммы задолженности на '+fmt(p.end)+' ядро не отдало, а строка «'+row.id+'» вменяет '+
        'анализ только выше порога '+money(row.limit)+' сом ('+row.basis+'): без величины порог '+
        'не проверяется, и решает администратор расписания, а не машина'};
    if(!(debt > row.limit)) return {required:false, row:row.id,
      why:'категория «'+AN.riskName(riskEnd)+'»: задолженность '+money(debt)+' сом на '+fmt(p.end)+
        ' не превышает порог строки «'+row.id+'» — '+money(row.limit)+' сом ('+row.basis+
        '), и плановый анализ не вменяется'};
  }
  return {required:true, row:row.id, freq:row.freq, freqName:FREQ[row.freq].name,
    ptype:ptypeEnd, risk:riskEnd, riskName:AN.riskName(riskEnd), debt, limit:row.limit,
    basis:row.basis, period:p.label, end:p.end, grace:row.grace, due: addDays(p.end, row.grace)};
};
/* Зеркало чужого счёта: как сопровождение прочитает наш факт и что получит гейт. */
AN.mirrorDefect = subjId => {
  const d = AN.dueOf(subjId);
  if(!d.required) return {defect:false, due:null, unresolved:!!d.unresolved, why:d.why};
  const done = AN.analysisDone(subjId, d.period);
  if(done.done) return {defect:false, due:d, done, why:'обязательство закрыто фактом: '+
    done.no+' утверждено '+fmt(done.at)+' (ИА-12)'};
  const late = daysBetween(d.due, AN.state.today);
  if(late <= 0) return {defect:false, due:d, done, why:'срок ещё не вышел: до '+fmt(d.due)+
    ' осталось '+dayWord(-late)};
  const draft = AN.state.analyses.find(a => a.subj === subjId && a.period === d.period && a.state === 'черновик');
  return {defect:true, due:d, done, late,
    code:'финанализ за '+d.period+' не проведён', influence:'на допуск',
    why:'срок '+fmt(d.due)+' вышел '+dayWord(late)+' назад'+
      (draft ? '; черновик '+draft.no+' есть, но обязательство закрывается фактом, а не черновиком (ИА-2, ИА-12)' : ''),
    basis:'расписание анализа, строка «'+d.row+'»'};
};
AN.mirrorGate = subjId => {
  const m = AN.mirrorDefect(subjId);
  const s = SUBJ(subjId);
  if(!m.defect) return {pass:true, text:'дефектов с влиянием «на допуск» от анализа нет'};
  return {pass:false, text:'на комиссию нельзя: дефект «'+m.code+'» с влиянием «'+m.influence+'» — '+m.why,
    appl: s.appl};
};

/* --------------------- МЕТОДИКИ: ВЕДЁТ ОТДЕЛ АНАЛИЗА ----------------- */
AN.refsOfEdition = (methodId, n) =>
  AN.state.analyses.filter(a => a.method === methodId && a.ed === n).map(a => a.no);
AN.addEdition = spec => {
  if(!AN.isAnalyst()) return {ok:false, why:'редакции методики ведёт отдел анализа; роль «'+
    AN.state.role+'» методику не правит (§13: методика содержательная, а не техническая)'};
  const m = METHOD(spec.method);
  if(!m) return {ok:false, why:'методики «'+spec.method+'» нет'};
  if(spec.since < AN.state.today) return {ok:false, why:'редакция публикуется датой и задним числом '+
    'не публикуется: прошлые периоды считались по действовавшей редакции (ИА-5, образец ADR-0125)'};
  if(m.editions.some(e => e.n === spec.n)) return {ok:false, why:'редакция '+spec.n+' уже есть'};
  if(!spec.coefs || !spec.coefs.length) return {ok:false, why:'редакция без коэффициентов не публикуется'};
  const badOp = spec.coefs.filter(c => Object.keys(OPS).indexOf(c.op) < 0);
  if(badOp.length) return {ok:false, why:'операция «'+badOp[0].op+'» вне закрытого списка: '+
    Object.keys(OPS).join(', ') + ' — выражение здесь не заводится, это была бы формула в коде'};
  const used = spec.coefs.reduce((acc,c) => acc.concat((c.num||[]).concat(c.den||[])), [])
    .concat(spec.lines||[]);
  const badLine = used.filter(id => !LINE(id));
  if(badLine.length) return {ok:false, why:'строки «'+badLine[0]+'» в справочнике форм нет: '+
    'её заводит отдел анализа операцией «Завести строку», а не разработчик правкой кода (ИА-18)'};
  const goneLine = used.filter(id => LINE(id).retired);
  if(goneLine.length) return {ok:false, why:'строка «'+LINE(goneLine[0]).name+'» снята со справочника: '+
    'новая редакция на снятую строку не встаёт'};
  m.editions.push(clone(spec));
  log('опубликована редакция '+spec.n+' методики «'+m.name+'»');
  return {ok:true};
};
AN.retireEdition = (methodId, n) => {
  if(!AN.isAnalyst()) return {ok:false, why:'редакции методики ведёт отдел анализа'};
  const m = METHOD(methodId);
  if(!m) return {ok:false, why:'методики нет'};
  const ed = m.editions.find(e => e.n === n);
  if(!ed) return {ok:false, why:'редакции нет'};
  const refs = AN.refsOfEdition(methodId, n);
  if(refs.length) return {ok:false, why:'редакция '+n+' используется заключениями '+refs.join(', ')+
    ': снять её значит оставить снимок ссылаться в пустоту (ИА-5)'};
  ed.retired = true;
  log('снята редакция '+n+' методики «'+m.name+'»');
  return {ok:true};
};
/* ---------------- СПРАВОЧНИК СТРОК: ВЕДЁТ ОТДЕЛ АНАЛИЗА -------------- *
   Строка формы отчётности — такая же запись, как коэффициент и редакция: её заводит
   отдел анализа, а не разработчик правкой константы (ИА-18). Без этого §2.2 («методика —
   набор форм ввода») исполнялась бы только наполовину: методика форму объявляет, но взять
   в неё новый показатель отчётности было бы неоткуда.                                  */
AN.lines = () => clone(AN.state.lines.filter(l => !l.retired));
AN.allLines = () => clone(AN.state.lines);
AN.usedByLine = id => {
  const out = [];
  AN.state.methods.forEach(m => (m.editions||[]).forEach(e => {
    const inCoefs = (e.coefs||[]).some(c => (c.num||[]).concat(c.den||[]).indexOf(id) >= 0);
    if((e.lines||[]).indexOf(id) >= 0 || inCoefs) out.push('«'+m.name+'», ред. '+e.n);
  }));
  return out;
};
AN.addLine = spec => {
  if(!AN.isAnalyst()) return {ok:false, why:'справочник строк формы ведёт отдел анализа; роль «'+
    AN.state.role+'» его не правит (§13: форма ввода содержательная, а не техническая)'};
  const id = String(spec.id||'').trim();
  if(!/^[a-z][a-z0-9_]*$/.test(id)) return {ok:false, why:'код строки — латиница, цифры и '+
    'подчёркивание, с буквы: по нему на строку ссылается методика, и вслед за названием он не меняется'};
  if(AN.state.lines.some(l => l.id === id)) return {ok:false, why:'строка «'+id+'» в справочнике уже есть'};
  if(!String(spec.name||'').trim()) return {ok:false, why:'строка без названия не заводится: '+
    'в форме её читает человек, а не разработчик'};
  if(!String(spec.unit||'').trim()) return {ok:false, why:'строка без единицы измерения не заводится: '+
    'число без единицы неотличимо от числа в другой единице'};
  AN.state.lines.push({id, name:String(spec.name).trim(), unit:String(spec.unit).trim()});
  log('заведена строка формы «'+String(spec.name).trim()+'»');
  return {ok:true, note:'в форме ввода строка появится тогда, когда её назовёт редакция методики: '+
    'единой формы «для всех» нет (§2.2)'};
};
AN.retireLine = id => {
  if(!AN.isAnalyst()) return {ok:false, why:'справочник строк формы ведёт отдел анализа'};
  const l = LINE(id);
  if(!l) return {ok:false, why:'строки «'+id+'» в справочнике нет'};
  if(l.retired) return {ok:false, why:'строка «'+l.name+'» уже снята'};
  const used = AN.usedByLine(id);
  if(used.length) return {ok:false, why:'строка «'+l.name+'» названа редакциями '+used.join(', ')+
    ': снять её значит оставить снимок ссылаться в пустоту (ИА-5)'};
  l.retired = true;
  log('снята строка формы «'+l.name+'»');
  return {ok:true, note:'снятая строка остаётся читаемой: снимки прежних заключений называют её по имени'};
};

AN.addMethod = spec => {
  if(!AN.isAnalyst()) return {ok:false, why:'методики ведёт отдел анализа'};
  if(!spec.ptype) return {ok:false, why:'методика без применимости по типу лица не заводится: '+
    'единой методики «для всех» нет — незаполнимое поле в общей форме неотличимо от незаполненного (§2.2)'};
  if(AN.state.methods.some(m => m.ptype === spec.ptype)) return {ok:false,
    why:'для типа лица «'+spec.ptype+'» методика уже есть: вторую заводить незачем, редакция — механизм изменения'};
  AN.state.methods.push(clone(spec));
  return {ok:true};
};

/* ------------------------- РАСПИСАНИЕ: АДМИН ------------------------- */
AN.setSchedule = (rowId, patch) => {
  if(!AN.isAdmin()) return {ok:false, why:'расписание анализа правит администратор; роль «'+
    AN.state.role+'» его не правит (§13)'};
  const r = AN.state.schedule.find(x => x.id === rowId);
  if(!r) return {ok:false, why:'строки расписания нет'};
  if(patch.freq && !FREQ[patch.freq]) return {ok:false, why:'периодичности «'+patch.freq+'» нет'};
  /* Порог — ведомое поле: его правят записью, а не правкой кода (АН-37). Пустое значение
     означает «порога нет», то есть анализ вменяется безусловно, — и это не то же самое,
     что ноль: ноль сравнивался бы строго и отсёк бы заёмщика с нулевой задолженностью. */
  if('limit' in patch){
    if(patch.limit === '' || patch.limit == null) r.limit = null;
    else if(!(Number(patch.limit) >= 0)) return {ok:false, why:'порог «'+patch.limit+'» — не число: '+
      'пустое поле означает «порога нет», а не ноль'};
    else r.limit = Number(patch.limit);
    delete patch.limit;
  }
  Object.keys(patch).forEach(k => { r[k] = patch[k]; });
  log('изменена строка расписания «'+rowId+'»');
  return {ok:true, note:'срок пересчитан от расписания — второго календаря в системе нет (§7)'};
};

/* ------------------------- ЧЕГО ЗДЕСЬ НЕЛЬЗЯ ------------------------ *
   Отказы названы словами и проверяются смоуком: «кнопки нет» — не объяснение.  */
AN.trySetRatio = () => ({ok:false, why:'коэффициент вводу не подлежит: человек вносит отчётность, '+
