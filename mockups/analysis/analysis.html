  'значение ставит машина (ИА-3, ADR-0122). Неверное число правится версией отчётности, а не полем'});
AN.tryDeriveVerdict = () => ({ok:false, why:'вывод из порогов не выводится: правило, ставящее значение '+
  'по порогу, — это классификация, а она анализ не читает и не слушает (ИА-10, ADR-0122 §3). '+
  'Пороги подсвечивают, суждение ставит человек'});
AN.tryEditApproved = docNo => ({ok:false, why:'утверждённое заключение '+docNo+' не правится: ошибка '+
  'исправляется корректировкой с основанием, изменившиеся обстоятельства — новым заключением за тот же '+
  'период (два механизма ADR-0112)'});
AN.tryDelete = docNo => ({ok:false, why:'удаления утверждённого заключения нет: '+docNo+' остаётся в '+
  'истории, даже когда его сменило новое (ADR-0112)'});
AN.tryMarkDone = () => ({ok:false, why:'отметки «выполнено» в анализе нет: обязательство закрывается '+
  'фактом — утверждённым заключением, а не признаком (ИА-12)'});
AN.tryWriteBorrowerField = () => ({ok:false, why:'анализ в чужие поля не пишет: «внесено в поля объекта» '+
  'исполняется зеркалом в шапке заёмщика, а не второй копией вывода (ИА-9, ADR-0155 §1)'});
AN.tryCreateTask = () => ({ok:false, why:'задач анализ не ставит: задачу заводит руководитель в модуле '+
  'задач, и она несёт ссылку на заключение как основание (ИА-11, ADR-0155 §4)'});
AN.tryClassify = () => ({ok:false, why:'категорию анализ не присваивает и классификацию не кормит: '+
  'слой ниже (ИА-10, ADR-0146 §2)'});
AN.tryCurrentRatio = subjId => ({ok:false, why:'текущего значения коэффициента у заёмщика нет: снимок '+
  'объясняет вывод своего заключения и источником значения ни для кого не является (ADR-0153 §6). '+
  'Нужна величина по объекту — её выводит ядро швами calc*'});
AN.tryPrint = () => ({ok:false, why:'печать и выгрузка идут через отчётность: анализ объявляет и печатает '+
  'форму не сам (ADR-0145 §4)'});

/* ==ОБЗОР== */
/* СУЩНОСТЬ АНАЛИТИЧЕСКОГО ОБЗОРА — и здесь лежит только её ССЫЛОЧНАЯ часть. Обзор не
   хранит ни одного числа: он хранит, ПО ЧЕМУ спрашивать — шаблон отчётности, его
   редакцию, действующую на дату обзора, период, дату среза, разрезы и показатели, — а
   величины спрашивает у соседа заново при каждом открытии (ИА-20, ADR-0157 §4). Дело
   не в экономии места: сохранённое число расходится с источником молча, и обнаруживается
   расхождение не на экране, а через полгода в сверке — паспорт у такой копии к тому дню
   уже чужой (ИА-8). Живой черновик, который это покажет на экране, собирает следующая
   задача волны; здесь заводится то, на что он будет опираться.
   Состав обзора тут не СОБИРАЕТСЯ, а ПЕРЕСЕКАЕТСЯ из двух чужих ответов: что объявила
   действующая на дату редакция шаблона (REP) и что состоит в реестре статистики на ту же
   дату (STAT). Своего конструктора состава у анализа нет и не будет (ИА-7, ADR-0154 §2).
   Дверей наружу из участка ровно две — REP и STAT. Ни одной фикстуры соседа участок не
   видит и ни одного его справочника по имени не знает: это проверяется текстуально
   (проверка #61), потому что «не заглядывать к соседу» — свойство текста, а не намерения. */

/* Выводы ОБЗОРА — свой короткий перечень, и это намеренно не перечень заключения:
   «удовлетворительное» говорится о финансовом состоянии ЛИЦА, а обзор судит о портфеле и
   заканчивается не оценкой лица, а тем, что с увиденным делать. Задачу по обзору всё
   равно ставит человек — вывод ей основание, а не поручение (ИА-11).                   */
const REVIEW_VERDICTS = ['без замечаний','требует внимания','требует решения руководства'];
AN.reviewVerdicts = () => REVIEW_VERDICTS.slice();

/* Шаблоны, пригодные как основание обзора, приходят от отчётности целиком: своего перечня
   форм у анализа нет, и «годится под обзор» — не наше суждение о чужой форме (ИА-7).   */
AN.templates = () => REP.templates().list;
const REVIEW = no => AN.state.reviews.find(r => r.no === no);
AN.REVIEW = REVIEW;
AN.reviews = () => clone(AN.state.reviews);

/* Кто ведёт обзор. Обзор — работа по ПОРТФЕЛЮ: её ведёт отдел анализа, наравне с ним —
   руководитель подразделения, читающий портфель тем же вопросом. Ведущий куратор ведёт
   финанализ СВОЕГО заёмщика (§13) и обзоров не заводит: иначе обзор куратора молча
   собрался бы по всему портфелю. Своих ролей здесь не заводится — список один (ROLES). */
function mayReview(){
  if(AN.isAnalyst() || AN.state.role === 'Руководитель подразделения') return {ok:true};
  return {ok:false, why:'аналитический обзор ведёт отдел анализа (наравне с ним — руководитель '+
    'подразделения); роль «'+AN.state.role+'» обзоров не заводит: обзор — работа по портфелю, а не '+
    'по своему заёмщику (§13)'};
}

/* ОСНОВАНИЕ ОБЗОРА. Годность формы объявляет отчётность признаком, а не мы догадкой по
   её составу: форма может считать разрезы и всё равно не годиться под обзор (ИА-7).   */
function tplOn(code, atISO){
  const t = REP.reportTemplate(code, atISO);
  if(!t.ok) return t;
  if(!t.forReview) return {ok:false, why:'шаблон «'+t.code+'» («'+t.name+'») основанием обзора не '+
    'служит — '+(t.why || 'признака «пригоден как основание обзора» отчётность ему не поставила')+
    '. Пригодность объявляет отчётность, а не анализ (ИА-7, ADR-0154 §2)'};
  return t;
}

/* РАЗРЕЗЫ ОБЗОРА — пересечение двух списков: что объявила действующая редакция шаблона и
   что вообще бывает у статистики. Отпавшее возвращается отдельным списком и с причиной:
   пропавшая колонка без объяснения читается как «данных нет» (ИА-19).                 */
function cutsOn(code, atISO){
  const t = tplOn(code, atISO);
  if(!t.ok) return t;
  const known = STAT.dims().list;
  const avail = [], dropped = [];
  t.dims.forEach(d => {
    if(known.some(k => k.id === d)) avail.push(d);
    else dropped.push({dim:d, kind:'нет у статистики',
      why:'разрез «'+d+'» редакция '+t.ed+' шаблона «'+t.code+'» объявляет, а в справочнике статистики '+
        'его нет: какие разрезы вообще бывают, знает она, и выдумать разрез за неё нельзя (ИА-7)'});
  });
  known.filter(k => t.dims.indexOf(k.id) < 0).forEach(k => dropped.push({dim:k.id, kind:'не объявлен',
    why:'разрез «'+k.name+'» у статистики есть, но редакция '+t.ed+' шаблона «'+t.code+'» его не '+
      'объявляет: состав объявляет шаблон, и добрать разрез мимо него нельзя (ИА-7, ADR-0154 §2)'}));
  return {ok:true, tpl:t.code, ed:t.ed, cuts:avail, dropped, series:t.series};
}

/* ПОКАЗАТЕЛИ ОБЗОРА — то же пересечение, и оба «нельзя» здесь РАЗНЫЕ. «Объявлен формой,
   но из реестра выведен» и «в реестре состоит, но формой не объявлен» — две разные
   причины, и слить их в одно сообщение значит соврать обеим (ИА-19). Реестр спрашивается
   НА ДАТУ ОБЗОРА, а не на сегодня (ИА-6).                                             */
function indsOn(code, atISO){
  const t = tplOn(code, atISO);
  if(!t.ok) return t;
  const reg = STAT.indsOn(atISO);
  const avail = [], dropped = [];
  t.inds.forEach(id => {
    const s = reg.list.find(x => x.id === id);
    if(s) return avail.push({id:s.id, name:s.name, unit:s.unit, row:s.row});
    const gone = (reg.out || []).find(x => x.id === id);
    dropped.push({ind:id, kind:'вне реестра',
      why:'показатель «'+(gone ? gone.name : id)+'» редакция '+t.ed+' шаблона «'+t.code+'» объявляет, '+
        'но в реестре статистики на '+fmt(atISO)+' он не состоит'+
        (gone && gone.why ? ' ('+gone.why+')' : '')+'. Показателя вне реестра в обзоре не бывает '+
        '(ИА-6, ADR-0150 §5)'});
  });
  reg.list.filter(s => t.inds.indexOf(s.id) < 0).forEach(s => dropped.push({ind:s.id, kind:'не объявлен',
    why:'показатель «'+s.name+'» в реестре статистики на '+fmt(atISO)+' состоит, но редакция '+t.ed+
      ' шаблона «'+t.code+'» его не объявляет: состав объявляет шаблон, обзор его не дополняет '+
      '(ИА-7, ADR-0154 §2)'}));
  return {ok:true, tpl:t.code, ed:t.ed, inds:avail, dropped};
}

/* Слова отказа собраны по ОДНОМУ разу на правило: их читает и заведение обзора, и
   именованный отказ ниже. Второй текст того же правила рано или поздно разошёлся бы с
   первым — ровно тем же доводом, что и второй порядок выбора редакции (ИА-16).        */
function cutRefusal(c, dim){
  const d = c.dropped.find(x => x.dim === dim);
  return d ? d.why : 'разреза «'+dim+'» нет ни в редакции '+c.ed+' шаблона «'+c.tpl+'», ни у '+
    'статистики; обзор строится по объявленным разрезам: '+(c.cuts.join(', ') || 'ни одного')+' (ИА-7)';
}
function indRefusal(i, ind){
  const d = i.dropped.find(x => x.ind === ind);
  return d ? d.why : 'показателя «'+ind+'» ни редакция '+i.ed+' шаблона «'+i.tpl+'» не объявляет, ни '+
    'реестр статистики на дату обзора не знает (ИА-6, ИА-7)';
}

/* ЗАВЕДЕНИЕ ОБЗОРА. Всё, что записывается, — ссылки: код шаблона, НОМЕР редакции,
   действующей на дату, период, дата среза, разрез разбивки, закреплённые значения и
   показатели. Ни одного значения показателя в записи нет и появиться не должно: обзор
   спросит их у статистики при открытии (ИА-20).                                       */
AN.newReview = spec => {
  const may = mayReview(); if(!may.ok) return may;
  const s = spec || {};
  if(!s.asOf) return {ok:false, why:'обзор без даты среза не заводится: и редакция шаблона, и состав '+
    'реестра выбираются НА ДАТУ обзора, а «сегодня» у статистики значения не имеет (ИА-6, ИА-17)'};
  if(!s.period || !s.period.from || !s.period.to) return {ok:false, why:'обзор без периода не '+
    'заводится: суждение о портфеле произносится за период, и период этот называет человек'};
  if(s.period.from > s.period.to) return {ok:false, why:'период обзора задан концом раньше начала'};
  if(s.asOf < s.period.to) return {ok:false, why:'дата среза '+fmt(s.asOf)+' раньше конца периода '+
    fmt(s.period.to)+': срез снимается не раньше, чем период закончился'};
  const t = tplOn(s.tpl, s.asOf); if(!t.ok) return t;
  /* Редакция фиксируется НОМЕРОМ и на дату: дальше обзор опирается только на неё, а не
     на «последнюю» — иначе завтрашняя редакция молча переписала бы вчерашний обзор.  */
  const ed = REP.editionOn(s.tpl, s.asOf);
  if(!ed) return {ok:false, why:'у шаблона «'+s.tpl+'» нет редакции, действующей на '+fmt(s.asOf)};
  const c = cutsOn(s.tpl, s.asOf), i = indsOn(s.tpl, s.asOf);
  const fixed = Object.keys(s.cuts || {});
  if(!s.by || c.cuts.indexOf(s.by) < 0) return {ok:false, why:cutRefusal(c, s.by || '—')};
  if(fixed.indexOf(s.by) >= 0) return {ok:false, why:'разрез «'+s.by+'» назван и разбивкой, и '+
    'закреплённым значением сразу: по закреплённому разрезу разбивки не бывает — в нём остаётся '+
    'одно значение'};
  const badCut = fixed.filter(d => c.cuts.indexOf(d) < 0);
  if(badCut.length) return {ok:false, why:cutRefusal(c, badCut[0])};
  const badVal = fixed.filter(d => {
    const k = STAT.dims().list.find(x => x.id === d);
    return !k || k.values.indexOf(s.cuts[d]) < 0;
  });
  if(badVal.length) return {ok:false, why:'значения «'+s.cuts[badVal[0]]+'» у разреза «'+badVal[0]+
    '» в справочнике статистики нет: какие значения бывают, знает она (ИА-7)'};
  const want = (s.inds || []).slice();
  if(!want.length) return {ok:false, why:'обзор без показателей не заводится: обзор — это вопрос к '+
    'статистике, а вопрос без показателя пуст'};
  const badInd = want.filter(id => !i.inds.some(x => x.id === id));
  if(badInd.length) return {ok:false, why:indRefusal(i, badInd[0])};
  const no = 'ОБ-'+(AN.state.reviews.length + 1);
  AN.state.reviews.push({no, tpl:t.code, tplEd:ed.n,
    period:{from:s.period.from, to:s.period.to}, asOf:s.asOf,
    by:s.by, cuts:Object.assign({}, s.cuts || {}), inds:want,
    state:'черновик', text:'', verdict:null,
    author:AN.who(), createdAt:AN.state.today, approvedAt:null, approvedBy:null,
    /* Два номера — и больше ничего от утверждения. Пустыми они заведены сразу, чтобы
       форма записи не менялась от подписи: «поля ещё нет» и «поле пустое» читаются
       по-разному, а доказывать приходится второе (ИА-20).                          */
    issue:null, worklist:null, corrections:[]});
  log('заведён обзор '+no+' по шаблону '+t.code+', ред. '+ed.n+' на '+fmt(s.asOf));
  return {ok:true, review:AN.REVIEW(no), no,
    note:'редакция '+ed.n+' шаблона «'+t.code+'» действует на '+fmt(s.asOf)+' — обзор ссылается на '+
      'неё и состав не копирует (ИА-7); ни одного числа он не сохранил: величины спрашиваются у '+
      'статистики при каждом открытии (ИА-20, ADR-0157 §4)'};
};

/* Состав обзора спрашивается ЗАНОВО и у той редакции, на которую обзор сослался. Если
   отчётность передатировала редакции и на дату обзора действует уже другая — это не
   молчаливое обновление состава, а расхождение, и решает его человек (ИА-7).          */
function fixedEd(r, res){
  if(res.ok && res.ed !== r.tplEd) return {ok:false, why:'обзор '+r.no+' стоит на редакции '+r.tplEd+
    ' шаблона «'+r.tpl+'», а на '+fmt(r.asOf)+' у отчётности действует редакция '+res.ed+': состав '+
    'берётся у той редакции, на которую обзор сослался, и расхождение решает человек (ИА-7)'};
  return res;
}
AN.reviewCuts = no => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  return fixedEd(r, cutsOn(r.tpl, r.asOf));
};
AN.reviewInds = no => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  return fixedEd(r, indsOn(r.tpl, r.asOf));
};

/* Суждение и вывод пишет автор и только в черновике: утверждённое правится корректировкой
   с основанием, а не полем (ADR-0112 — тем же механизмом, что и заключение).          */
function mayWrite(no){
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  if(r.state !== 'черновик') return {ok:false, why:'обзор '+r.no+' утверждён '+fmt(r.approvedAt)+
    ': утверждённое правится корректировкой с основанием, а не полем (ADR-0112)'};
  const may = mayReview(); if(!may.ok) return may;
  if(r.author !== AN.who()) return {ok:false, why:'обзор '+r.no+' ведёт '+r.author+': суждение пишет '+
    'автор обзора, а не тот, кто открыл черновик'};
  return {ok:true, r};
}
AN.setReviewText = (no, text) => {
  const g = mayWrite(no); if(!g.ok) return g;
  g.r.text = String(text == null ? '' : text);
  log('изменён текст обзора '+g.r.no);
  return {ok:true, note:'текст — суждение, и он ничего не считает: числа под ним обзор спрашивает '+
    'заново при каждом открытии (ИА-20)'};
};
AN.setReviewVerdict = (no, verdict) => {
  const g = mayWrite(no); if(!g.ok) return g;
  if(REVIEW_VERDICTS.indexOf(verdict) < 0) return {ok:false, why:'вывода «'+verdict+'» в перечне '+
    'выводов обзора нет: '+REVIEW_VERDICTS.join(', ')+'. Вывод заключения сюда не подходит — он о '+
    'состоянии лица, а обзор судит о портфеле'};
  g.r.verdict = verdict;
  log('вывод обзора '+g.r.no+': '+verdict);
  return {ok:true, note:'вывод ставит человек: правила, выводящего его из чисел обзора, нет (ИА-10)'};
};

/* ------------------ ЧЕГО НЕЛЬЗЯ В ОБЗОРЕ ---------------------------- *
   Отказы названы словами и объясняются на языке работающего экрана.          */
AN.tryOwnBuilder = () => ({ok:false, why:'своего конструктора состава среза у анализа нет и не будет. '+
  'На экране обзора аналитик ВЫБИРАЕТ ИЗ ОБЪЯВЛЕННОГО: шаблон, его редакцию на дату среза, разрез '+
  'разбивки, закреплённые значения и показатели — и всё это уже объявила редакция шаблона отчётности; '+
  'обзор на неё ссылается и состав не копирует (ИА-7, ADR-0154 §2). Поля «добавить свой разрез» нет '+
  'потому, что второй конструктор состава не сошёлся бы с первым, и одна и та же величина стала бы '+
  'в отчёте и в обзоре разной'});
AN.tryFreeCut = (no, dim) => {
  const c = AN.reviewCuts(no);
  if(!c.ok) return {ok:false, why:c.why};
  if(c.cuts.indexOf(dim) >= 0) return {ok:false, why:'разрез «'+dim+'» редакция '+c.ed+' шаблона «'+
    c.tpl+'» объявляет — он берётся составом обзора; свободного ввода разрезов в модуле нет (ИА-7)'};
  return {ok:false, why:cutRefusal(c, dim)};
};
AN.tryRetiredInd = (no, ind) => {
  const i = AN.reviewInds(no);
  if(!i.ok) return {ok:false, why:i.why};
  const d = i.dropped.find(x => x.ind === ind && x.kind === 'вне реестра');
  return {ok:false, why: d ? d.why : indRefusal(i, ind)};
};
AN.tryUndeclaredInd = (no, ind) => {
  const i = AN.reviewInds(no);
  if(!i.ok) return {ok:false, why:i.why};
  const d = i.dropped.find(x => x.ind === ind && x.kind === 'не объявлен');
  return {ok:false, why: d ? d.why : indRefusal(i, ind)};
};

/* ================= ЖИВОЙ ЧЕРНОВИК ОБЗОРА (ИА-20, ADR-0157 §4) ================= *
   Записи обзора хватает ровно на то, чтобы ЗАДАТЬ ВОПРОС: шаблон, номер редакции, период,
   дата среза, разрез разбивки, закреплённые значения, показатели. Чисел в ней нет — и
   открытие обзора поэтому не чтение сохранённого, а НОВЫЙ ВОПРОС соседу.
   Дело не в экономии места. Сохранённое число расходится с источником МОЛЧА: обзор
   показывает вчерашнее как сегодняшнее, расхождение всплывает не на экране, а через
   полгода в сверке, и паспорт у такой копии к тому дню уже чужой (ИА-8, ADR-0152 §2).
   Отсюда правило работы экрана: числа живут ровно столько, сколько открыт документ.
   Операция ниже — ЧТЕНИЕ. Она не пишет ни в запись обзора, ни рядом с ней, ни в журнал:
   два вызова подряд дают один ответ и не двигают состояние ни на байт. Проверяется это
   не словом «чтение» в комментарии, а снимком состояния до и после (проверка #62) и
   счётчиком обращений у самой статистики, который за два открытия растёт дважды
   (проверка #63): «спрашивает заново» обязано быть свойством, а не обещанием.        */

/* Швы, которыми обзор спрашивает состав и числа. Перечень СВОЙ — какие из чужих дверей
   нужны обзору, — а имя, владелец и вопрос каждой двери берутся у самого соседа: второй
   список тех же швов рано или поздно разошёлся бы с первым (ИА-16, ADR-0135 §4).      */
const REVIEW_SEAMS = [
  {id:'repTemplate', numbers:false,
   gives:'состав на дату среза: какие разрезы и показатели объявила действующая редакция'},
  {id:'statSlice',   numbers:true,
   gives:'снимок показателя в разрезе разбивки: узлы, нераспределённый остаток и посчитанный итог'},
  {id:'statSeries',  numbers:true,
   gives:'ряд снимков по датам — динамика показателя за период обзора'},
  {id:'statRows',    numbers:true,
   gives:'строки объектов на дату: полный список либо названный отказ по порогу показа'}
];
AN.reviewSeams = () => {
  const decl = STAT.seamsIn().list.concat(REP.seamsIn().list);
  return REVIEW_SEAMS.map(s => {
    const d = decl.find(x => x.id === s.id) || {};
    return {id:s.id, owner:d.owner || null, q:d.q || null, gives:s.gives, numbers:s.numbers};
  });
};

/* Ответ шва, приведённый к ОДНОЙ форме для экрана. Три вещи стоят в нём рядом, а не вместо
   друг друга: ВОПРОС (что именно спрошено), ПАСПОРТ (кто ответил, на какую дату, в каком
   режиме и охвате) и ЧИСЛА. Паспорт вместо чисел — это уже отказ.
   Отказ приходит в той же форме и с пустым data: экран обязан нарисовать на этом месте
   ОБЪЯСНЕНИЕ, а не пустую таблицу — пустая таблица читается как «ничего нет» (ИА-8).
   Отказы РАЗНЫЕ, и разница названа: сосед не ответил вовсе — или ответил, но отказал в
   форме списка по порогу показа. Лечатся они по-разному: первое — другой датой, другим
   показателем или другим охватом, второе — более узким вопросом (ИА-19).             */
function seamAnswer(seam, res, data){
  if(res && res.ok) return {seam, ok:true, kind:'ответ', passport:res.passport,
    short:res.passport ? res.passport.short : null, why:res.why || null, data:data};
  const over = !!(res && res.overLimit);
  return {seam, ok:false, kind: over ? 'отказ по форме' : 'отказ соседа',
    passport:null, short:null, data:null,
    n:(res && res.n != null) ? res.n : null,
    limit:(res && res.limit != null) ? res.limit : null,
    why:(res && res.why) || 'шов «'+seam+'» не ответил и причины не назвал'};
}

/* ОТКРЫТЬ ОБЗОР = СПРОСИТЬ ЧИСЛА ЗАНОВО. Роль едет в шов ВОПРОСОМ: безымянную роль сосед
   читает как полный охват, и молчаливое расширение прав выглядело бы как полный ответ
   (ИА-9, ADR-0155 §1). Из сессии роль берётся ровно здесь и один раз — дальше она явная.
   Ответ собран так, чтобы экран нарисовал его ЦЕЛИКОМ, когда часть швов ответила, а часть
   отказала: у каждого показателя три ответа одной формы, а отказавшее собрано ещё и
   отдельным списком — чтобы объяснение стояло в документе, а не терялось в углу.      */
AN.reviewData = (no, who) => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  const fromSession = (who == null || who === '');
  const role = fromSession ? AN.state.role : who;
  /* Состав спрашивается у той же редакции, на которую обзор сослался: расхождение с
     сегодняшней редакцией — не молчаливое обновление, а отказ целиком (ИА-7).        */
  const comp = AN.reviewInds(no);
  if(!comp.ok) return {ok:false, why:comp.why};
  const refused = [];
  let asks = 0, answered = 0;
  const inds = r.inds.map(id => {
    const meta = comp.inds.find(x => x.id === id);
    /* Показателя не стало в составе — числа за него не спрашиваются вовсе: спросить
       можно только то, что объявлено и состоит в реестре на дату среза (ИА-6).       */
    if(!meta){
      const why = indRefusal(comp, id);
      refused.push({ind:id, seam:null, kind:'вне состава', why});
      return {id, name:id, unit:null, row:null, inComp:false, why,
        ask:null, slice:null, series:null, rows:null};
    }
    const q = {ind:id, dim:r.by, date:r.asOf, values:Object.assign({}, r.cuts), who:role};
    const sl = STAT.statSlice(q), se = STAT.statSeries(q), rw = STAT.statRows(q);
    const one = {id, name:meta.name, unit:meta.unit, row:meta.row, inComp:true, why:null,
      ask:clone(q),
      slice:  seamAnswer('statSlice',  sl, sl.ok ? {total:sl.total, unalloc:sl.unalloc, nodes:sl.nodes} : null),
      series: seamAnswer('statSeries', se, se.ok ? {key:se.key, points:se.points} : null),
      /* sum здесь — сумма ПОКАЗАННЫХ строк, и ответ шва говорит это своим why: за итогом
         портфеля ходят снимком, где он приходит посчитанным. Агрегатом её не подавать. */
      rows:   seamAnswer('statRows',   rw, rw.ok ? {rows:rw.rows, n:rw.n, sum:rw.sum, mixed:rw.mixed} : null)};
    [one.slice, one.series, one.rows].forEach(a => {
      asks++;
      if(a.ok) answered++; else refused.push({ind:id, seam:a.seam, kind:a.kind, why:a.why});
    });
    return one;
  });
  return {ok:true, live:true, stored:false,
    no:r.no, tpl:r.tpl, tplEd:r.tplEd, asOf:r.asOf, by:r.by,
    period:{from:r.period.from, to:r.period.to}, cuts:Object.assign({}, r.cuts),
    state:r.state, author:r.author, text:r.text, verdict:r.verdict,
    who:role, roleFromSession:fromSession, askedAt:AN.state.today,
    comp:{ed:comp.ed, inds:clone(comp.inds), dropped:clone(comp.dropped)},
    inds, refused, asks, answered,
    why:'ни одно число здесь не сохранено: обзор держит только ссылки — шаблон «'+r.tpl+'», '+
      'редакцию '+r.tplEd+', дату среза '+fmt(r.asOf)+', разрез и показатели, — а величины '+
      'спрошены у статистики сейчас, вопросом под ролью «'+role+'», и уйдут вместе с экраном. '+
      'Открытый второй раз, обзор спросит их заново — потому и не расходится с источником '+
      '(ИА-20, ИА-8, ADR-0157 §4)'};
};

/* ============ УТВЕРЖДЕНИЕ ОБЗОРА = ВЫПУСК, У КОТОРОГО ПОЛУЧАТЕЛЬ — ОБЗОР ============ *
   Обзор не «сохраняется». Сохранять ему нечего: суждение и ссылки лежат в записи с
   первого дня, а чисел он не держит вовсе. Утверждение — это ОКОНЧАТЕЛЬНЫЙ ВЫПУСК,
   сделанный отчётностью, у которого НАЗВАН ПОЛУЧАТЕЛЬ, и получатель этот — сам обзор.
   Оттуда обзор берёт ровно два номера: номер выпуска и номер рабочего списка, — и
   дальше опирается на них.
   Почему не «положить снимок в обзор, чтобы не расходился»: морозить величину вправе
   тот, кто её выпускает. Свой экземпляр чисел, положенный рядом, расходится с выпуском
   МОЛЧА, и через полгода в сверке уже не сказать, какой из двух был сдан; паспорт у
   такой копии к тому дню чужой и датой не совпадает (ИА-20, ИА-8, ADR-0157 §4).
   Отсюда же ОХВАТ утверждённого обзора: он не поле обзора, а свойство выпуска — тот, в
   котором выпуск сделан, — и после утверждения не меняется. За ним ходят к соседу.     */

/* Что обязано быть верно ДО подписи. Вынесено отдельно, потому что читают это двое —
   сама подпись и именованный отказ ниже: второй текст того же правила разошёлся бы с
   первым, а расходятся такие тексты в сторону «на экране можно» (ИА-16).             */
function approvalCheck(no, who){
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  if(r.state === 'утверждено') return {ok:false, r, why:'обзор '+r.no+' утверждён '+
    fmt(r.approvedAt)+' выпуском '+r.issue+': второй подписи у документа не бывает — '+
    'утверждённое правится корректировкой с основанием, а не повторным утверждением '+
    '(ADR-0112)'};
  const may = mayReview(); if(!may.ok) return may;
  if(r.author !== AN.who()) return {ok:false, r, why:'обзор '+r.no+' ведёт '+r.author+
    ': подпись ставит автор обзора — он произнёс суждение, он за него и отвечает'};
  /* СУЖДЕНИЕ. Подпись стоит под словами о портфеле, а не под таблицей величин: таблицу
     обзор и не хранит — она спрашивается заново при каждом открытии (ИА-20).         */
  if(!String(r.text == null ? '' : r.text).trim()) return {ok:false, r, empty:true,
    why:'обзор '+r.no+' утверждать нечем: текста суждения в нём нет. Утверждается СУЖДЕНИЕ '+
      'о портфеле, а не срез — срез обзор не хранит и при следующем открытии спросит '+
      'заново (ИА-20, ADR-0157 §4)'};
  if(!r.verdict) return {ok:false, r, empty:true,
    why:'вывод обзора '+r.no+' не выбран: подпись под документом без вывода не говорит '+
      'ничего. Перечень выводов свой: '+REVIEW_VERDICTS.join(', ')+' — и ставит его '+
      'человек, правила, выводящего вывод из чисел, нет (ИА-10)'};
  /* ХОТЯ БЫ ОДИН ОТВЕТИВШИЙ ШОВ. Отказ соседа — часть документа: он остаётся виден и в
     утверждённом обзоре, и обзор с частью отказов утверждается, потому что суждение
     стоит на том, что ответило. Не утверждается только тот, у кого не ответило НИЧЕГО:
     под ним нет ни одной величины, и подпись оказалась бы под пустым местом.         */
  const d = AN.reviewData(no, who);
  if(!d.ok) return {ok:false, r, why:d.why};
  if(d.answered === 0) return {ok:false, r, empty:true, data:d,
    why:'обзор '+r.no+' утверждать нечего: из '+d.asks+' обращений к соседям не ответило '+
      'ни одно (отказов '+d.refused.length+'). Частичный отказ утверждению не мешает — он '+
      'часть документа и в утверждённом обзоре остаётся виден; но документ, под которым не '+
      'встала НИ ОДНА величина, подтверждать нечем. Первый отказ: '+
      (d.refused.length ? d.refused[0].why : '—')};
  return {ok:true, r, data:d};
}

/* УТВЕРЖДЕНИЕ. Порядок здесь важен: сначала проверки, потом ЧУЖОЙ выпуск, и только
   если сосед выпустил — своя запись. Обратный порядок оставил бы обзор «утверждённым»
   без выпуска, то есть подписанным поверх ничего.                                   */
AN.approveReview = (no, who) => {
  const g = approvalCheck(no, who); if(!g.ok) return g;
  const r = g.r, d = g.data;
  const iss = REP.finalIssue({
    kind:'окончательный',
    tpl:r.tpl, ed:r.tplEd, asOf:r.asOf,
    period:{from:r.period.from, to:r.period.to},
    dim:r.by, cuts:Object.assign({}, r.cuts), inds:r.inds.slice(),
    recipient:{kind:'обзор', ref:r.no},
    who:d.who, at:AN.state.today, by:AN.who(),
    name:'Объекты обзора '+r.no
  });
  if(!iss.ok) return {ok:false, why:'обзор '+r.no+' не утверждён: выпуска не случилось — '+
    iss.why};
  /* В ЗАПИСЬ ЛОЖАТСЯ ДВА НОМЕРА И НИ ОДНОГО ЧИСЛА. Ни итога, ни строк, ни паспорта, ни
     охвата: всё это свойства выпуска и живёт у отчётности. Обзор держит ссылку — и
     потому не может разойтись с тем, на что ссылается (ИА-20, ADR-0157 §4).         */
  r.issue = iss.issue;
  r.worklist = iss.worklist;
  r.state = 'утверждено';
  r.approvedAt = AN.state.today;
  r.approvedBy = AN.who();
  log('утверждён обзор '+r.no+': выпуск '+iss.issue+', рабочий список '+iss.worklist);
  return {ok:true, no:r.no, issue:iss.issue, worklist:iss.worklist,
    approvedAt:r.approvedAt, approvedBy:r.approvedBy, state:r.state,
    scope:iss.scope.slice(), objects:iss.objects,
    asks:d.asks, answered:d.answered, refused:d.refused.length,
    note:'утверждение — не запись у себя, а ВЫПУСК у отчётности: '+iss.issue+' от '+
      fmt(r.approvedAt)+', получатель — обзор '+r.no+'. Обзор взял оттуда два номера '+
      '(выпуск '+iss.issue+', рабочий список '+iss.worklist+') и ни одного числа: из '+
      d.asks+' обращений ответило '+d.answered+', отказало '+d.refused.length+' — отказы '+
      'остались видны в документе, а величины по-прежнему спрашиваются заново (ИА-20)'};
};

/* ОХВАТ УТВЕРЖДЁННОГО ОБЗОРА. Своего экземпляра охвата обзор не держит: он спрашивает
   его у выпуска, на котором стоит. Два охвата под одним номером — по копии у каждого —
   разошлись бы молча, и «в каком охвате подписано» перестало бы иметь один ответ.    */
AN.reviewScope = no => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  if(r.state !== 'утверждено' || !r.issue) return {ok:false, why:'у черновика '+r.no+
    ' охвата ещё нет: охват — свойство ВЫПУСКА, а выпуска у черновика не было. Пока обзор '+
    'не утверждён, величины в нём живут ровно столько, сколько открыт экран, и охват у них '+
    'тот, что у роли на момент открытия (ИА-20)'};
  const i = REP.issueInfo(r.issue);
  if(!i.ok) return {ok:false, why:'обзор '+r.no+' ссылается на выпуск '+r.issue+', а '+
    i.why+': ссылка на выпуск, которого нет, — расхождение, и решает его человек'};
  const w = REP.worklistInfo(r.worklist);
  return {ok:true, no:r.no, issue:i.no, worklist:r.worklist,
    scope:i.scope.slice(), at:i.at, asOf:i.asOf, kind:i.kind, final:i.final,
    recipient:Object.assign({}, i.recipient),
    passport:clone(i.passport), short:i.passport.short,
    objects:w.ok ? w.n : null,
    why:'охват обзора '+r.no+' — это охват выпуска '+i.no+' от '+fmt(i.at)+
      ' ('+i.scope.join(', ')+'): подразделений '+i.scope.length+'. Своего экземпляра '+
      'охвата обзор не завёл — он спросил его у выпуска. Поэтому охват и не меняется '+
      'после утверждения: менять пришлось бы у того, кто его заморозил, а тот замораживал '+
      'его вместе с числами и получателем (ИА-20, ADR-0157 §2)'};
};

/* ------------ ЧЕГО НЕЛЬЗЯ ПРИ УТВЕРЖДЕНИИ ------------ *
   Отказы названы словами и каждый называет ПРИЧИНУ и решение, на котором стоит:
   «кнопки нет» объяснением не считается.                                            */

/* Утверждение пустого. Отказ живой: он прогоняет тот же порядок проверок, что и
   подпись, и возвращает его слова — второй текст того же правила разошёлся бы. */
AN.tryApproveEmpty = (no, who) => {
  if(no == null) return {ok:false, why:'обзор без единого ответившего шва не утверждается: '+
    'подпись стоит под суждением, но суждение опирается на величины, а величин под ним не '+
    'встало ни одной — все швы отказали. Частичный отказ утверждению не мешает: отказ '+
    'соседа — часть документа и остаётся в нём виден (ADR-0178 §1). Не утверждается только '+
    'документ, под которым не ответило НИЧЕГО (ИА-20, ИА-19)'};
  const g = approvalCheck(no, who);
  if(!g.ok) return {ok:false, empty:!!g.empty, why:g.why};
  return {ok:false, why:'обзор '+no+' пустым не является: под ним встали величины, и '+
    'подпись ему не отказана — утверждать его следует настоящей операцией, а не пробой'};
};

/* Утверждение поверх предварительного выпуска. Спрошено у СОСЕДА, а не сочинено:
   ступень выпуска — его правило, и слова отказа его же (ADR-0157 §2).              */
AN.tryApproveOnPreliminary = no => {
  const probe = REP.finalIssue({kind:'предварительный',
    recipient:{kind:'обзор', ref:no == null ? '—' : no}});
  return {ok:false, why:'обзор утверждается только поверх ОКОНЧАТЕЛЬНОГО выпуска. '+
    'Отчётность на просьбу отвечает так: «'+probe.why+'». Предварительный выпуск — '+
    'расходник: он ничего не заморозил, номера не потратил и получателя не назвал, а '+
    'значит, завтра покажет другие числа. Обзор, стоящий на нём, назавтра оказался бы '+
    'подписан под другим портфелем — и заметить это было бы не по чему (ИА-20)'};
};

/* Свой снимок «чтобы не расходились». Самая частая просьба и самая дорогая ошибка. */
AN.tryOwnSnapshot = no => ({ok:false, why:'своего снимка величин обзор'+
  (no == null ? '' : ' '+no)+' не заводит — ни «чтобы не расходились», ни «чтобы быстрее». '+
  'Расходятся ровно наоборот: спрошенное заново расходиться не с чем, а СОХРАНЁННОЕ '+
  'расходится с источником МОЛЧА. Обзор показывал бы вчерашнее как сегодняшнее, '+
  'расхождение всплыло бы не на экране, а через полгода в сверке, и паспорт у копии к '+
  'тому дню уже чужой: он остался паспортом статистики на старую дату, а стоит рядом с '+
  'числом в нашем документе (ИА-8, ADR-0152 §2). Замороженный экземпляр величин в природе '+
  'есть — это ОКОНЧАТЕЛЬНЫЙ ВЫПУСК, и он у отчётности, у которой на него номер и '+
  'получатель; обзор держит от него два номера и не держит чисел (ИА-20, ADR-0157 §4)'});

/* Правка охвата у утверждённого. */
AN.tryChangeScope = no => {
  const r = no == null ? null : REVIEW(no);
  const where = r && r.issue ? 'выпуска '+r.issue : 'выпуска, на котором обзор стоит';
  return {ok:false, why:'охват утверждённого обзора'+(r ? ' '+r.no : '')+' не правится: он '+
    'не поле обзора, а свойство '+where+' — тот заморозил охват вместе с числами и '+
    'получателем. Поменять охват значит выпустить ЗАНОВО: другой охват — другие числа, '+
    'значит новый выпуск, новый номер и новый рабочий список; старая подпись при этом '+
    'остаётся стоять там, где стояла, и вторым номером не переписывается (ИА-20, '+
    'ADR-0157 §2, ADR-0112)'};
};

/* ====== КОРРЕКТИРОВКА СУЖДЕНИЯ И ПОМЕТКА ИСТОЧНИКА (решение АН-60) ====== *
   В утверждённом обзоре лежат ДВЕ РАЗНЫЕ ВЕЩИ, и правятся они по-разному.
   СУЖДЕНИЕ — текст и вывод. Их произнёс человек, ошибиться он мог именно в них, и
   исправляет их он же — КОРРЕКТИРОВКОЙ с основанием, тем же механизмом, что и у
   заключения: корректировка исправляет запись, а не пересчитывает основание (ADR-0112).
   ОСНОВАНИЕ — числа, состав среза и охват. Их заморозил ОКОНЧАТЕЛЬНЫЙ ВЫПУСК у
   отчётности; своего экземпляра ни одного из них обзор не держит вовсе — он держит два
   номера (ИА-20, ADR-0157 §4). Ни корректировка, ни переиздание основания не трогают:
   морозил его не обзор.
   ПЕРЕИЗДАНИЯ У ОБЗОРА НЕТ ВОВСЕ — и это не пропущенная кнопка. Переиздают ради
   основания: заключение переиздаётся, когда пришла новая версия отчётности, и считается
   по ней заново (ИА-16). Здесь переиздать значило бы переписать чужой замороженный
   номер. Поехали числа — обзор носит пометку и не пересчитывается; исправляют это
   корректирующим выпуском у отчётности и НОВЫМ обзором на нём (АН-52).
   ПОЧЕМУ ДВА УТВЕРЖДЕНИЯ СТОЯТ РЯДОМ И НЕ СПОРЯТ. Постановка (P21-R28) говорит: «текст и
   вывод правятся только корректировкой» — это про СУЖДЕНИЕ. Решение АН-52 говорит: «ни
   корректировки, ни переиздания» — это про ОСНОВАНИЕ. Предметы разные, оба верны, и
   ровно это прочтение записано решением АН-60: корректировка обзора трогает ТОЛЬКО
   суждение.                                                                          */

/* Слова этого правила собраны по ОДНОМУ разу: их читает и корректировка, когда ей
   подсовывают лишнее поле, и именованный отказ ниже. Второй текст того же правила
   разошёлся бы с первым, и расходятся такие тексты в сторону «на экране можно» (ИА-16). */
function basisRefusal(what){
  return 'корректировкой обзора правится ТОЛЬКО суждение — текст и вывод; '+what+' ею не '+
    'правится. В документе лежат две разные вещи: СУЖДЕНИЕ произнёс человек — его он и '+
    'исправляет; ОСНОВАНИЕ — числа, состав среза и охват — заморозил окончательный ВЫПУСК у '+
    'отчётности. Дело даже не в запрете: числа тут физически негде править — обзор их не '+
    'хранит и спрашивает заново при каждом открытии, а замороженный их экземпляр лежит у '+
    'выпуска, на который обзор ссылается (ИА-20, ADR-0157 §4). Исправляются числа '+
    'КОРРЕКТИРУЮЩИМ ВЫПУСКОМ у отчётности, и на нём делается НОВЫЙ обзор; прежняя подпись '+
    'при этом остаётся стоять там, где стояла (АН-60, АН-52, ADR-0112)';
}

/* Роль приходит ВОПРОСОМ и здесь: правку вносит названный человек, а не «тот, кто открыл
   экран». Приём тот же, что в затравке обзоров, — роль подменяется на время одного
   действия и возвращается; безымянная роль означает «из сессии» (ADR-0155 §1).       */
function underRole(role, fn){
  if(role == null || role === '') return fn();
  const back = AN.state.role;
  AN.state.role = role;
  try { return fn(); } finally { AN.state.role = back; }
}

/* Кто правит суждение УТВЕРЖДЁННОГО обзора: тот, кто его произнёс и подписал. Проверка
   стоит отдельно от mayWrite потому, что состояния у них противоположные: там правится
   черновик прямо, здесь — утверждённое корректировкой (ADR-0112).                    */
function mayCorrectReview(no){
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  if(r.state !== 'утверждено') return {ok:false, why:'черновик '+r.no+' правится прямо — текстом '+
    'и выводом (setReviewText, setReviewVerdict); корректировка ему не нужна: исправлять нечего, '+
    'подписи под ним ещё не стояло'};
  const may = mayReview(); if(!may.ok) return may;
  if(r.author !== AN.who()) return {ok:false, why:'обзор '+r.no+' ведёт '+r.author+': суждение '+
    'правит тот, кто его произнёс и подписал, — он за него и отвечает'};
  return {ok:true, r};
}

/* КОРРЕКТИРОВКА СУЖДЕНИЯ. Принимаются два поля и основание, и ничего больше. Прежнее
   суждение не затирается: правка ложится записью «было → стало» с причиной, автором и
   датой — иначе в документе останется новое суждение и ни следа от того, что читатель
   уже видел (ADR-0112, та же манера, что у корректировки заключения).               */
AN.correctReview = (no, spec, who) => underRole(who, () => {
  const g = mayCorrectReview(no); if(!g.ok) return g;
  const r = g.r, s = spec || {};
  const extra = Object.keys(s).filter(k => ['text','verdict','why'].indexOf(k) < 0);
  if(extra.length) return {ok:false, why:basisRefusal('поле «'+extra.join('», «')+'»')};
  const hasText = 'text' in s, hasVerdict = 'verdict' in s;
  if(!hasText && !hasVerdict) return {ok:false, why:'корректировка без правки не принимается: '+
    'назовите, ЧТО именно исправляется в суждении — текст, вывод или оба'};
  if(!String(s.why == null ? '' : s.why).trim()) return {ok:false, why:'корректировка без '+
    'основания не принимается: у исправления обязан быть ответ на вопрос «почему суждение '+
    'изменилось». Без него в документе останутся два разных суждения и ни одной причины, а '+
    'читатель через полгода не отличит исправление ошибки от смены мнения (ADR-0112)'};
  const newText = hasText ? String(s.text == null ? '' : s.text) : null;
  if(hasText && !newText.trim()) return {ok:false, why:'корректировкой текст не стирается: обзор '+
    'без суждения утверждённым не бывает, и под подписью осталось бы пустое место'};
  if(hasVerdict && REVIEW_VERDICTS.indexOf(s.verdict) < 0) return {ok:false, why:'вывода «'+
    s.verdict+'» в перечне выводов обзора нет: '+REVIEW_VERDICTS.join(', ')};
  const basis = String(s.why).trim(), done = [];
  const put = (field, was, now) => {
    r.corrections.push({at:AN.state.today, by:AN.who(), field, was, now, basis});
    done.push(field);
  };
  if(hasText && newText !== r.text){ const was = r.text; r.text = newText; put('текст', was, newText); }
  if(hasVerdict && s.verdict !== r.verdict){ const was = r.verdict; r.verdict = s.verdict;
    put('вывод', was, s.verdict); }
  if(!done.length) return {ok:false, why:'корректировка ничего не изменила: присланное суждение '+
    'совпадает с тем, что в обзоре уже стоит. Запись «было → стало», у которой «было» равно '+
    '«стало», объясняет читателю не исправление, а шум'};
  log('корректировка обзора '+r.no+' ('+done.join(', ')+')');
  return {ok:true, no:r.no, fields:done.slice(), corrections:clone(r.corrections),
    issue:r.issue, worklist:r.worklist, state:r.state,
    note:'исправлено СУЖДЕНИЕ, основание не тронуто: выпуск '+r.issue+' и рабочий список '+
      r.worklist+' остались прежними, нового выпуска не случилось — числа, состав и охват '+
      'морозит он, а не эта правка. Прежнее суждение из документа не пропало: оно легло '+
      'записью «было → стало» с основанием, автором и датой (АН-60, ИА-20, ADR-0112)'};
});

/* ПОМЕТКА «ЧИСЛА ПОЕХАЛИ» — ЧУЖАЯ, И СПРАШИВАЕТСЯ У ВЫПУСКА. Своей пометки обзор не
   заводит и завести не может: чисел он не хранит, а сравнить «до» и «после» вправе только
   тот, кто заморозил «до», — отчётность. Обзор пометку ЧИТАЕТ и произносит словами, а сам
   от неё не меняется: помеченный обзор пометку НОСИТ и не пересчитывается (АН-52, ИА-1).
   Молчание журнала здесь тоже ответ, и произносится оно честно: «сосед о сдвиге не
   сообщал» — не то же самое, что «всё сходится» (ИА-19).                             */
AN.reviewMark = no => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет'};
  if(r.state !== 'утверждено' || !r.issue) return {ok:false, why:'у черновика '+r.no+' пометки не '+
    'бывает: помечается ВЫПУСК, а выпуска у черновика не было. Числа черновика и так '+
    'спрашиваются заново при каждом открытии — «поехали» им сказать не о чем (ИА-20)'};
  const im = REP.issueMarks(r.issue);
  if(!im.ok) return {ok:false, why:'обзор '+r.no+' ссылается на выпуск '+r.issue+', а '+im.why+
    ': ссылка на выпуск, которого нет, — расхождение, и решает его человек'};
  if(!im.n) return {ok:true, marked:false, no:r.no, issue:r.issue, n:0, marks:[],
    why:'источник за обзором '+r.no+' не двигался: пометок на выпуске '+r.issue+' от '+fmt(im.at)+
      ' у отчётности нет. Сказано это честно и означает ровно одно — сосед о сдвиге не сообщал; '+
      'молчание журнала не проверка сходимости (ИА-19)'};
  const words = im.marks.map(x => 'показатель «'+x.ind+'» — замечено '+fmt(x.at)+', причина: '+
    x.cause).join('; ');
  return {ok:true, marked:true, no:r.no, issue:r.issue, n:im.n, marks:clone(im.marks),
    why:'обзор '+r.no+' помечен: за выпуском '+r.issue+' от '+fmt(im.at)+' источник сдвинулся '+
      'после передачи — '+words+'. Пометку носит обзор, а поставила её отчётность: сравнить '+
      '«до» и «после» вправе тот, кто заморозил «до», и своего экземпляра чисел у обзора нет '+
      '(ИА-20). Обзор от пометки не пересчитывается и не отменяется — подпись стоит под '+
      'суждением, а числа под ней заморожены выпуском и остались теми же. Если исправление '+
      'нужно, оно делается корректирующим выпуском у отчётности и НОВЫМ обзором на нём '+
      '(АН-52, АН-60, ИА-1)'};
};

/* ------------ ЧЕГО НЕЛЬЗЯ ПОСЛЕ УТВЕРЖДЕНИЯ ------------ */

/* Переиздание обзора. Отказ называет ПРИЧИНУ, а не отсутствие кнопки. */
AN.tryReissueReview = no => ({ok:false, why:'переиздания у обзора'+(no == null ? '' : ' '+no)+
  ' нет вовсе — и это решение, а не пропущенная кнопка. Переиздают ради ОСНОВАНИЯ: заключение '+
  'переиздаётся, когда пришла новая версия отчётности, и считается по ней заново (ИА-16). У '+
  'обзора основание — числа и состав — заморожено ВЫПУСКОМ у отчётности, и переиздать его '+
  'отсюда значило бы переписать чужой замороженный номер: своих чисел у обзора нет вовсе '+
  '(ИА-20, ADR-0157 §4). Поехали числа — обзор носит пометку и не пересчитывается; исправляют '+
  'это корректирующим выпуском у отчётности и НОВЫМ обзором на нём, а прежняя подпись остаётся '+
  'стоять там, где стояла (АН-52). Исправить в самом обзоре можно СУЖДЕНИЕ — текст и вывод, '+
  'корректировкой с основанием (АН-60, ADR-0112)'});

/* Правка чисел или состава корректировкой — самая частая просьба после пометки. */
AN.tryCorrectNumbers = (no, what) => ({ok:false,
  why:basisRefusal(what ? '«'+what+'»' : 'ни число, ни состав среза, ни охват')+
    '. Обзор'+(no == null ? '' : ' '+no)+' от такой правки не изменился бы даже внешне: числа в '+
    'нём не хранятся, и править было бы нечего — на экране стоял бы прежний ответ соседа'});

/* ========= ЗАДАЧА ПО ОБЗОРУ: СТАВИТСЯ РУКОЙ И ПОШТУЧНО (ИА-11) ========= *
   Обзор задач не порождает. Между строкой «просрочка выросла в трёх подразделениях» и
   поручением «разобраться с ОсОО «Кемин Цемент» до 30 сентября» стоит ЧЕЛОВЕК, и стоит
   он там не для порядка: документ называет положение дел, а работой распоряжается тот,
   кто за неё отвечает. Автоматическая постановка сняла бы с поручения автора — осталось
   бы «так вышло по обзору», и спросить за назначенное было бы не с кого. Ровно поэтому
   правило записано инвариантом, а не оставлено настройкой (ИА-11).
   ПОШТУЧНО. Массовая постановка «по всем объектам рабочего списка сразу» — та же
   автоматика, только запущенная рукой один раз; она здесь названный отказ
   (tryMassTasks), а не пропущенное удобство.
   ССЫЛКА ОДНОСТОРОННЯЯ. Задача знает обзор; обзор о задачах не знает НИЧЕГО — в его
   записи не появилось ни поля, ни счётчика, и проверяется это механически, сверкой
   состава полей до и после (проверка #69). Обратная ссылка меняла бы подписанный
   документ после подписи (число поручений росло бы под замороженным суждением) и
   заводила бы вторую истину о том, что поручено: список в обзоре и список в модуле задач
   разошлись бы молча. «Что поручено по обзору» — ВОПРОС (tasksOfReview), и ответ на него
   СОБИРАЕТСЯ перебором поручений, а не читается из обзора.
   ШВА «ПОРУЧИТЬ» НАРУЖУ ПО-ПРЕЖНЕМУ НЕТ (CONSUMERS, модуль «задачи»): анализ никому
   ничего не толкает и ни в одно чужое поле не пишет (ИА-9). taskFromReview — не шов, а
   ДЕЙСТВИЕ ЧЕЛОВЕКА на экране обзора: руководитель заполняет поручение и отправляет его
   в модуль задач, где оно и живёт дальше своей жизнью — с исполнителем, состоянием и
   историей, которых анализ не ведёт.
   ГДЕ ЛЕЖИТ ЗАПИСЬ. Живого модуля задач у макета нет, и регистр поручений стоит
   ЗАГЛУШКОЙ рядом с обзорами (AN.state.tasks) — заглушкой НАЗВАННОЙ, чтобы её не приняли
   за решение хранить поручения в анализе (АН-61). В промышленной сборке этой записи
   здесь не будет вовсе: требование к соседу — принимать ссылку вида «обзор ОБ-N»
   основанием задачи и отдавать по ней перечень поручений — идёт строкой в пакет
   передачи (ADR-0155 §4).                                                            */

/* Регистр поручений. Своей сущности «задача» у анализа нет и не заводится: это место
   соседа, и обращение к нему одно, чтобы заглушку было видно целиком.               */
function TASKS(){ if(!AN.state.tasks) AN.state.tasks = []; return AN.state.tasks; }

/* Кто поручает. Обзор ВЕДУТ двое (mayReview), а поручает по нему один — и двум
   остальным отказано РАЗНЫМИ словами, потому что положения дел у них разные: отдел
   анализа обзор ведёт, но работой не распоряжается; ведущий куратор обзоров не ведёт
   вовсе. Один общий текст «нельзя» соединил бы два разных случая и обоим соврал бы —
   тот же счёт к отказам, что у ИА-19: у каждого «нельзя» своя причина.              */
function mayTask(){
  if(AN.state.role === 'Руководитель подразделения') return {ok:true};
  if(AN.isAnalyst()) return {ok:false, why:'обзор отдел анализа ведёт, но работой не '+
    'распоряжается: поручение — распоряжение чужим временем, и ставит его тот, кто за это '+
    'время отвечает, — руководитель подразделения. Роль «'+AN.state.role+'» доводит суждение '+
    'до вывода (в перечне выводов на этот случай стоит «требует решения руководства»), а '+
    'решение принимает руководство: иначе отдел анализа назначал бы работу подразделениям, '+
    'которыми не руководит (ИА-11, §13)'};
  if(AN.isCurator()) return {ok:false, why:'ведущий куратор обзоров не ведёт вовсе: его работа — '+
    'финанализ СВОЕГО заёмщика (§13), а обзор судит о портфеле целиком, в том числе о чужих '+
    'заёмщиках. Поручить по документу, которого не ведёшь, нельзя, и дело не в правах на кнопку: '+
    'объектами обзора занимаются подразделения, а распоряжается ими их руководитель, а не '+
    'куратор одного заёмщика (ИА-11)'};
  return {ok:false, why:'роль «'+AN.state.role+'» поручений по обзору не ставит: поручение '+
    'персонально и ставится ИМЕНЕМ — за назначенную работу отвечает тот, кто её назначил. '+
    'Ставит задачу руководитель подразделения (ИА-11)'};
}

/* ПОРУЧЕНИЕ ПО ОБЗОРУ. Роль приходит вопросом (underRole) — поручает НАЗВАННЫЙ человек, а
   не «тот, кто открыл экран» (ADR-0155 §1). Авторства обзора здесь НЕ требуется, и это
   отличие от корректировки намеренное: суждение правит тот, кто его произнёс (АН-60), а
   поручают ПО суждению — руководитель не переписывает чужой обзор, он ставит по нему
   задачу.                                                                            */
AN.taskFromReview = (no, spec, who) => underRole(who, () => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет: поручение стоит НА документе — без '+
    'документа у него нет основания, а «поручено по анализу вообще» основанием не считается'};
  const may = mayTask(); if(!may.ok) return may;
  /* Только по УТВЕРЖДЁННОМУ. У черновика нет ни подписи под суждением, ни объектов:
     состав приносит выпуск, а выпуска у черновика не было (ИА-20).                  */
  if(r.state !== 'утверждено' || !r.issue) return {ok:false, why:'по черновику '+r.no+' поручать '+
    'нечего: суждение под ним не подписано, вывода может не стоять вовсе, а числа черновика '+
    'спрашиваются заново при каждом открытии и назавтра будут другими. Основание у обзора '+
    'появляется в момент утверждения — окончательным выпуском у отчётности, и вместе с ним '+
    'появляется рабочий список объектов, по которым и поручают (ИА-20, ADR-0157 §4). '+
    'Утвердите обзор — тогда будет и что поручать, и по кому'};
  const s = spec || {};
  /* Объекты берутся у ОТЧЁТНОСТИ из рабочего списка выпуска, а не собираются заново:
     свой список объектов означал бы второй состав под тем же обзором (ИА-20).       */
  const w = REP.worklistInfo(r.worklist);
  if(!w.ok) return {ok:false, why:'обзор '+r.no+' ссылается на рабочий список '+r.worklist+', а '+
    w.why+': ссылка на список, которого нет, — расхождение, и решает его человек'};
  const objId = String(s.obj == null ? '' : s.obj).trim();
  if(!objId) return {ok:false, why:'поручение без объекта не принимается: поручают ПО КОМУ-ТО, '+
    'а не «по обзору вообще». В рабочем списке '+r.worklist+' объектов '+w.n+' — назовите того, '+
    'с кем разбираться (ИА-11)'};
  const o = w.objects.filter(x => x.id === objId)[0];
  if(!o) return {ok:false, why:'объекта «'+objId+'» в рабочем списке '+r.worklist+' нет: в нём '+
    w.n+' объектов ('+w.objects.slice(0, 3).map(x => x.id).join(', ')+(w.n > 3 ? ', …' : '')+'). '+
    'Поручают по тому, кто в обзор ВОШЁЛ: состав заморожен выпуском '+r.issue+', своего перечня '+
    'объектов анализ не держит и дописать в чужой не может (ИА-20). Объект нужен другой — '+
    'значит, и основание у поручения другое, а не этот обзор'};
  const what = String(s.what == null ? '' : s.what).trim();
  if(!what) return {ok:false, why:'поручение без существа не принимается: скажите, ЧТО сделать '+
    'с «'+o.subj+'» ('+o.no+'). «Разобраться по обзору» — не задача: исполнитель прочтёт её как '+
    'угодно, а через месяц спорить будут о том, что имелось в виду, а не о том, сделано ли'};
  const due = String(s.due == null ? '' : s.due).trim();
  if(!due) return {ok:false, why:'поручение без срока не принимается: у поручения обязан быть '+
    'день, к которому оно исполнено. Бессрочное поручение не исполняется и не нарушается — '+
    'оно просто висит, и спросить по нему нечего'};
  if(due < AN.state.today) return {ok:false, why:'срок '+fmt(due)+' стоит раньше сегодняшнего ('+
    fmt(AN.state.today)+'): поручение, просроченное в день постановки, — не срок, а его '+
    'видимость'};
  /* В ЗАПИСЬ ЛОЖИТСЯ ССЫЛКА НА ОБЗОР И НА ЕГО ОСНОВАНИЕ — и ни одного числа среза.
     Выпуск назван рядом с обзором намеренно: суждение обзора потом поправят
     корректировкой, а замороженное основание, по которому поручали, останется тем же. */
  const t = {no:'ЗД-'+(TASKS().length + 1), review:r.no,
    basis:{issue:r.issue, worklist:r.worklist},
    obj:o.id, subj:o.subj, contract:o.no,
    what, due, by:AN.who(), at:AN.state.today, state:'поставлена'};
  TASKS().push(t);
  log('поручение '+t.no+' по обзору '+r.no+': '+o.subj+', срок '+fmt(t.due));
  return {ok:true, no:t.no, review:r.no, task:clone(t),
    note:'поручение '+t.no+' поставлено РУКОЙ: автор — '+t.by+', объект назван поимённо («'+
      o.subj+'», '+o.no+'), существо и срок ('+fmt(t.due)+') написаны человеком. Основание — '+
      'обзор '+r.no+' и замороживший его состав выпуск '+r.issue+'. Ссылка ОДНОСТОРОННЯЯ: '+
      'задача знает обзор, а в записи обзора не прибавилось ни поля, ни счётчика — «что '+
      'поручено» спрашивается вопросом и собирается перебором поручений (ИА-11)'};
});

/* ЧТО ПОРУЧЕНО ПО ОБЗОРУ. Ответ СОБИРАЕТСЯ здесь и сейчас: перебираются поручения и
   отбираются те, что ссылаются на этот обзор. Хранить этот список в обзоре значило бы
   держать вторую истину о поручениях — и первая, у модуля задач, разошлась бы с ней
   молча (ИА-11).                                                                     */
AN.tasksOfReview = no => {
  const r = REVIEW(no);
  if(!r) return {ok:false, why:'обзора «'+no+'» нет: спрашивать «что по нему поручено» не о чем'};
  const list = TASKS().filter(t => t.review === r.no);
  const words = list.map(t => t.no+' — «'+t.subj+'» ('+t.obj+'), '+t.what+'; срок '+fmt(t.due)+
    ', поставил '+t.by+' '+fmt(t.at)).join('; ');
  return {ok:true, no:r.no, state:r.state, n:list.length, tasks:clone(list),
    why: list.length
      ? 'по обзору '+r.no+' поставлено поручений: '+list.length+' — '+words+'. Список СОБРАН '+
        'вопросом, а не прочитан из обзора: в записи обзора о поручениях не сказано ничего, и '+
        'сам он от них не изменился (ИА-11)'
      : (r.state === 'утверждено'
          ? 'по обзору '+r.no+' не поручено ничего: документ подписан, а работы по нему пока '+
            'никто не назначил. Это нормальное состояние, а не пробел заполнения — обзор задач '+
            'не порождает, их ставит человек (ИА-11)'
          : 'по черновику '+r.no+' не поручено ничего и поручить нечего: суждение под ним ещё '+
            'не подписано, а поручают по подписанному (ИА-11)')};
};

/* «ПОСТАВИТЬ СРАЗУ ПО ВСЕМ ОБЪЕКТАМ СПИСКА». Отказ ОДИН ДЛЯ ВСЕХ, включая руководителя
   подразделения: право поручать у него есть, права поручать НЕ ГЛЯДЯ нет ни у кого.  */
AN.tryMassTasks = no => {
  const r = no == null ? null : REVIEW(no);
  const w = r && r.worklist ? REP.worklistInfo(r.worklist) : {ok:false};
  const many = w.ok ? w.n : null;
  return {ok:false, why:'поручений «по всем объектам сразу»'+(r ? ' по обзору '+r.no : '')+
    ' не ставится'+(many ? ' — ни одного из '+many : '')+', и это не сэкономленное время, а '+
    'ОБХОД правила: та же автоматика, только запущенная рукой один раз. Одна кнопка завела бы '+
    (many ? many+' поручений' : 'десятки поручений')+', ни одно из которых никто не обдумывал: '+
    'у поручения есть объект, существо и срок, и отвечает за них тот, кто его поставил, — а на '+
    'вопрос «почему этому заёмщику назначено именно это» ответ «я нажал на обзоре» не годится. '+
    'Ровно это и запрещает ИА-11: обзор задач не порождает, задачу ставит человек со ссылкой на '+
    'обзор. Нужны поручения по нескольким объектам — их несколько, и каждое названо '+
    '(taskFromReview); список объектов при этом никуда не делся и лежит замороженным у '+
    'отчётности'+(r && r.worklist ? ' в рабочем списке '+r.worklist : '')+' — экономится печать, '+
    'а не решение'};
};

/* ------------------------ ЗАТРАВКА ОБЗОРОВ -------------------------- *
   Обзоры витрины проводятся НАСТОЯЩИМИ операциями: заводятся newReview, получают текст
   и вывод, а утверждённые проходят approveReview — то есть настоящий выпуск у соседа с
   настоящим номером. Выписать готовую запись с проставленными issue/worklist значило бы
   доказывать литерал, а не поведение (тот же приём, что у SEED_ANALYSES и freeze()).
   ЗОВЁТСЯ ОНА ОТДЕЛЬНО ОТ seed(), И ЭТО РЕШЕНИЕ, А НЕ НЕДОДЕЛКА. Причин две.
   Первая: номер обзора выводится из числа записей (ОБ-1, ОБ-2, …) — предзаполненный
   журнал сдвинул бы номера ВСЕГО, что заводят после него, и разбор поведения перестал
   бы стоять на именах документов.
   Вторая, важнее: утверждение тратит у соседа номер выпуска. Если бы витрина ехала
   внутри seed(), каждый сброс состояния жёг бы чужую серию — сброс перестал бы быть
   сбросом. Витрина зовётся явно тем, кому она нужна: экраном.                       */
const SEED_REVIEWS = [
  /* Смешанный случай — норма, а не край: половина швов отказала, обзор утверждён. */
  {tpl:'ШО-04', asOf:'2026-06-30', period:{from:'2026-01-01', to:'2026-06-30'},
   by:'область', cuts:{}, inds:['s-port','s-over'], role:'Сотрудник отдела анализа',
   text:'Портфель за первое полугодие вырос по всем четырём областям; сосредоточение в '+
     'Чуйской области держится около половины. Просрочку в разрезе областей статистика '+
     'на эту дату не считала — суждение о ней вынесено по подразделениям отдельно.',
   verdict:'требует внимания', approve:true},
  /* Полностью ответивший случай — узкий вопрос, все три шва отвечают. */
  {tpl:'ШО-09', asOf:'2026-06-30', period:{from:'2026-01-01', to:'2026-06-30'},
   by:'подразделение', cuts:{'отрасль':'переработка'}, inds:['s-over'],
   role:'Руководитель подразделения',
   text:'Просрочка по переработке сосредоточена в двух подразделениях; рост за полугодие '+
     'опережает рост портфеля. Предлагается вынести на кредитный комитет.',
   verdict:'требует решения руководства', approve:true},
  /* Черновик: суждение написано, вывод не поставлен — подписывать нечего. */
  {tpl:'ШО-12', asOf:'2026-06-30', period:{from:'2026-01-01', to:'2026-06-30'},
   by:'область', cuts:{}, inds:['s-port','s-over'], role:'Сотрудник отдела анализа',
   text:'Черновик обзора по территориальному разрезу: ждём подтверждения по двум областям.',
   verdict:null, approve:false}
];
AN.seedReviews = () => {
  if(AN.state.reviews.length) return {ok:false, why:'обзоры в состоянии уже есть ('+
    AN.state.reviews.map(r => r.no).join(', ')+'): витрина заводится на пустом журнале, '+
    'иначе номера обзоров разъедутся с номерами выпусков у отчётности'};
  const backRole = AN.state.role, backLog = AN.state.log.slice();
  const made = [];
  SEED_REVIEWS.forEach(s => {
    AN.state.role = s.role;
    const mk = AN.newReview({tpl:s.tpl, asOf:s.asOf, period:s.period, by:s.by,
      cuts:Object.assign({}, s.cuts || {}), inds:s.inds.slice()});
    if(!mk.ok) throw new Error('затравка обзоров: '+s.tpl+' — '+mk.why);
    if(s.text){ const t = AN.setReviewText(mk.no, s.text);
      if(!t.ok) throw new Error('затравка обзоров: '+mk.no+' — '+t.why); }
    if(s.verdict){ const v = AN.setReviewVerdict(mk.no, s.verdict);
      if(!v.ok) throw new Error('затравка обзоров: '+mk.no+' — '+v.why); }
    if(s.approve){ const a = AN.approveReview(mk.no);
      if(!a.ok) throw new Error('затравка обзоров: '+mk.no+' не утверждён — '+a.why);
      made.push({no:mk.no, state:'утверждено', issue:REVIEW(mk.no).issue,
        worklist:REVIEW(mk.no).worklist});
    } else made.push({no:mk.no, state:'черновик', issue:null, worklist:null});
  });
  AN.state.role = backRole;
  /* Журнал возвращается к тому, что было: затравка — не работа человека, и в ленте
     действий ей места нет (тот же приём, что в seed()).                            */
  AN.state.log = backLog;
  return {ok:true, made,
    note:'обзоры витрины проведены настоящими операциями: '+
      made.filter(x => x.state === 'утверждено').length+' утверждено (выпуски '+
      made.filter(x => x.issue).map(x => x.issue).join(', ')+'), '+
      made.filter(x => x.state === 'черновик').length+' в черновике. Ни одного числа '+
      'ни в одной записи: утверждённые держат по два номера, черновик — ни одного'};
};
/* ==/ОБЗОР== */

/* ------------------------- ПРЕДСТАВЛЕНИЕ ---------------------------- *
   Форматирование — представление, а не значение: в снимке лежат числа.        */
function money(v){
  if(v == null) return '—';
  const p = (Math.round(v*100)/100).toFixed(2).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+p[1];
}
function coefText(coef, row){
  if(!row || row.v == null) return '—';
  if(coef.fmt === 'pct')   return String(Math.round(row.v*10)/10).replace('.',',')+' %';
  if(coef.fmt === 'money') return money(row.v)+' сом';
  return String(Math.round(row.v*100)/100).replace('.',',');
}
function thrText(coef){
  if(!coef.thr) return '—';
  const sign = coef.thr.cmp === '>=' ? '≥' : '≤';
  const v = coef.fmt === 'pct' ? String(coef.thr.v).replace('.',',')+' %'
          : coef.fmt === 'money' ? money(coef.thr.v)+' сом'
          : String(coef.thr.v).replace('.',',');
  return sign+' '+v;
}
function betterWord(coef){ return coef.thr && coef.thr.cmp === '>=' ? 'выше — лучше' : 'ниже — лучше'; }
function formulaText(coef){
  const nm = ids => ids.map(id => LINE(id) ? LINE(id).name : id).join(' + ');
  if(coef.op === 'diff')  return nm(coef.num)+' − ('+nm(coef.den)+')';
  if(coef.op === 'share') return nm(coef.num)+' ÷ '+nm(coef.den)+' × 100%';
  return nm(coef.num)+' ÷ '+nm(coef.den);
}
function coefOf(ed, id){ return (ed.coefs||[]).find(c => c.id === id); }
function statePill(d){
  return d.state === 'утверждено'
    ? '<span class="pill ok">утверждено '+fmt(d.approvedAt)+'</span>'
    : '<span class="pill neutral">черновик</span>';
}
function verdictPill(v){
  if(!v) return '<span class="pill neutral">вывод не поставлен</span>';
  const cls = v === 'удовлетворительное' ? 'ok' : v === 'неудовлетворительное' ? 'err' : 'warn';
  return '<span class="pill '+cls+'">'+esc(v)+'</span>';
}
/* ==ПРОИЗВОДНЫЕ== *
   ДОЛЯ, ЕЁ ИЗМЕНЕНИЕ И РОСТ ВЕЛИЧИНЫ СЧИТАЮТСЯ В МОМЕНТ ПОКАЗА И НЕ ХРАНЯТСЯ НИГДЕ.
   Ни одна из величин ниже не ложится ни в состояние, ни в запись обзора, ни рядом с
   ней: производное, сохранённое рядом с исходным, расходится с ним МОЛЧА, и первым
   расходится ровно здесь — исходное на экране обзора спрашивается заново при каждом
   открытии, а положенная рядом копия остаётся вчерашней (ADR-0001, ИА-20).
   ПРАВИЛО ДЛЯ ТОГО, КТО ПРАВИТ ЭТОТ ФАЙЛ: внутри секции нет ни одного присваивания в
   AN.state — и держится это прогоном (проверка #73), а не обещанием в комментарии.
   ТРИ ВЕЛИЧИНЫ, И НАЗВАНЫ ОНИ РАЗНЫМИ СЛОВАМИ, потому что путают их постоянно:
     ДОЛЯ            — сколько процентов целого занимает часть НА ДАТУ: «47,7 %»;
     ИЗМЕНЕНИЕ ДОЛИ  — на сколько ПРОЦЕНТНЫХ ПУНКТОВ доля сдвинулась между двумя
                       датами: «+0,03 п.п.»; это НЕ проценты и не сравнимо с ними;
     РОСТ ВЕЛИЧИНЫ   — на сколько процентов выросла сама сумма: «+6,7 % величина».
   Слитые в одно «изменение на 0,03 %» первые две врут обеим сразу: читатель прочтёт
   сдвиг места в целом как рост денег. Поэтому единица печатается ВСЕГДА и печатается
   разная — «%» у доли, «п.п.» у её изменения, «%» с пометкой «величина» у роста.
   ЗНАМЕНАТЕЛЬ. Делить не на что — это ответ СЛОВАМИ, а не прочерк и не ноль: нулевая
   доля и «целое соседом не названо» на экране неотличимы, а лечатся по-разному
   (ИА-19, тот же счёт, что у «посчитать нельзя» в заключении).                     */
function pct1(v){ return String(Math.round(v*10)/10).replace('.',','); }
function pct2(v){ return String(Math.round(v*100)/100).replace('.',','); }
function signed(n, txt){ return (n > 0 ? '+' : n < 0 ? '−' : '')+txt; }
function shareOf(part, whole){
  if(part == null || whole == null || !whole) return null;
  return part/whole*100;
}
function shareText(part, whole){
  const s = shareOf(part, whole);
  return s == null ? '—' : pct1(s)+' %';
}
/* Почему доли нет — словами и в двух разных случаях: не названа часть или не названо
   целое. «—» в клетке об этом не говорит ничего.                                   */
function shareWhy(part, whole){
  if(whole == null || !whole) return 'долю считать не от чего: целое ответом не названо';
  if(part == null) return 'доли нет: часть ответом не названа';
  return 'доля от целого на дату — '+shareText(part, whole)+'; это проценты целого, а не пункты';
}
function ppText(v){ return v == null ? '—' : signed(v, pct2(Math.abs(v))+' п.п.'); }
function shareShift(part0, whole0, part1, whole1){
  const a = shareOf(part0, whole0), b = shareOf(part1, whole1);
  return (a == null || b == null) ? null : b - a;
}
function growthText(was, now){
  if(was == null || now == null) return '—';
  if(!was) return 'расти не от чего';
  return signed(now - was, pct1(Math.abs((now - was)/was*100))+' %');
}
function deltaText(was, now){
  if(was == null || now == null) return '—';
  return signed(now - was, money(Math.abs(now - was)));
}
/* Сумма узлов — ПОКАЗАННАЯ арифметика, а не подмена итога: она печатается рядом с
   нераспределённым остатком именно затем, чтобы разница была видна как величина, а
   не как расхождение (снимок статистики, ИС-24 канона отчётности).                */
function sumNodes(nodes){
  return (nodes || []).reduce((s, n) => s + (n.v == null ? 0 : n.v), 0);
}
/* ==/ПРОИЗВОДНЫЕ== */

function ratioTable(ed, rows, opts){
  const o = opts || {};
  return '<table class="cgrid"><thead><tr><th>Коэффициент</th><th>Из чего считается</th>'+
    '<th class="num">Значение</th><th class="num">Порог</th><th>Оценка</th></tr></thead><tbody>'+
    rows.map(r => {
      const c = coefOf(ed, r.id) || {fmt:'ratio'};
      const bad = r.pass === false;
      return '<tr'+(bad ? ' class="hl"' : '')+'><td><b>'+esc(r.name)+'</b>'+
        (o.was ? '' : '')+'</td>'+
        '<td class="small">'+esc(formulaText(c))+'</td>'+
        '<td class="num">'+esc(coefText(c, r))+'</td>'+
        '<td class="num thr">'+esc(thrText(c))+' <span class="muted">('+betterWord(c)+')</span></td>'+
        '<td>'+(r.v == null ? '<span class="pill err">не посчитан</span>'+
                              '<div class="small">'+esc(nocalcWhy(r))+'</div>'
              : r.pass ? '<span class="pill ok">в норме</span>'
                       : '<span class="pill warn">вне порога</span>')+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function linesTable(ed, vals, vals2){
  return '<table class="cgrid"><thead><tr><th>Строка формы</th><th class="num">Значение</th>'+
    (vals2 ? '<th class="num">Версия рядом</th>' : '')+'</tr></thead><tbody>'+
    ed.lines.map(id => {
      const l = LINE(id);
      const diff = vals2 && vals2[id] !== vals[id];
      return '<tr'+(diff ? ' class="hl"' : '')+'><td>'+esc(l.name)+'</td>'+
        '<td class="num">'+esc(money(vals[id]))+'</td>'+
        (vals2 ? '<td class="num">'+esc(money(vals2[id]))+(diff ? ' <span class="pill warn">иначе</span>' : '')+'</td>' : '')+
        '</tr>';
    }).join('')+'</tbody></table>';
}

/* -------- РИСОВАЛКИ ОТВЕТОВ ОБЗОРА: ПАСПОРТ, ОТКАЗ, ТРИ ТАБЛИЦЫ -------- *
   Всё, что ниже, рисует ОДИН ответ шва в форме seamAnswer: вопрос, паспорт и числа
   стоят РЯДОМ, а не вместо друг друга (ИА-8, ADR-0152 §2). Отказ приходит в той же
   форме с пустым data, и на его месте рисуется ОБЪЯСНЕНИЕ, а не пустая таблица.   */

/* Паспорт печатается КОРОТКОЙ формой производителя, как её объявила статистика: своей,
   сокращённой по вкусу экрана, не бывает — иначе два экрана сократят по-разному, и
   «числа без даты не остаётся» станет непроверяемым (ADR-0152 §2).                 */
function passportLine(a){
  return '<div class="pass"><div class="row"><span class="k">Паспорт ответа</span><b>'+esc(a.short)+
    '</b></div><div class="row"><span class="k">Спросили швом</span><span class="mono">'+esc(a.seam)+
    '</span> <span class="muted">— паспорт стоит РЯДОМ с числами ниже, а не вместо них (ИА-8)</span>'+
    '</div></div>';
}

/* ДВА ОТКАЗА, И ОНИ РАЗНЫЕ. «Отказ соседа» — не считал вовсе: лечится другой датой,
   другим показателем, другим охватом. «Отказ по форме» — посчитал, но списком не
   отдаёт: у него осмысленны число объектов и порог, и лечится он ТОЛЬКО более узким
   вопросом. Слитые в один прочерк, они врут обоим (ИА-19, ADR-0178 §1).            */
function refusalBlock(a, what){
  const form = a.kind === 'отказ по форме';
  return '<div class="refusal'+(form ? ' form' : '')+'"><b>'+esc(what)+' — '+esc(a.kind)+'</b>'+
    (form && a.n != null ? ' <span class="pill warn">'+a.n+' объектов при пороге '+a.limit+'</span>'
                         : ' <span class="pill err">числа не пришли</span>')+
    '<div class="small">'+esc(a.why)+'</div>'+
    '<div class="small muted">'+(form
      ? 'Сосед ПОСЧИТАЛ, но списком не отдаёт: усечённого ответа не бывает — «первые '+
        esc(a.limit)+' из '+esc(a.n)+'» читаются как полный список. Лечится это более узким '+
        'вопросом — значением разреза, — а не другой датой.'
      : 'Сосед НЕ СЧИТАЛ вовсе: лечится другой датой, другим показателем или другим охватом. '+
        'Более узкий вопрос тут не поможет — считать нечего.')+
    ' Объяснение стоит на месте таблицы: пустая таблица читалась бы как «ничего нет» (ИА-8, ИА-19).'+
    '</div></div>';
}

/* СРЕЗ. Итог родителя приходит ПОСЧИТАННЫМ и сумме детей не равен: разницу держит
   нераспределённый остаток узла. Это не ошибка снимка — часть портфеля не отнесена ни к
   одному значению разреза. Поэтому остаток стоит в дереве ОТДЕЛЬНОЙ ВИДИМОЙ величиной,
   а не растворяется в округлении: спрятанный, он превращает «не отнесено» в «сходится».  */
function nodeTable(a){
  const d = a.data, out = [];
  const kidsSum = n => sumNodes(n.kids);
  d.nodes.forEach(n => {
    out.push('<tr><td><b>'+esc(n.key)+'</b></td><td class="num">'+esc(money(n.v))+'</td>'+
      '<td class="num">'+esc(shareText(n.v, d.total))+'</td>'+
      '<td class="num">'+esc(money(n.unalloc))+'</td></tr>');
    (n.kids || []).forEach(k => out.push('<tr><td class="kid">'+esc(k.key)+'</td>'+
      '<td class="num">'+esc(money(k.v))+'</td>'+
      '<td class="num">'+esc(shareText(k.v, n.v))+' <span class="muted">от узла</span></td>'+
      '<td class="num"><span class="muted">—</span></td></tr>'));
    if((n.kids || []).length && n.unalloc)
      out.push('<tr class="hl"><td class="kid">нераспределено в узле «'+esc(n.key)+'»</td>'+
        '<td class="num">'+esc(money(n.unalloc))+'</td>'+
        '<td class="num">'+esc(shareText(n.unalloc, n.v))+' <span class="muted">от узла</span></td>'+
        '<td class="num"><span class="muted">—</span></td></tr>');
  });
  const sum = sumNodes(d.nodes);
  return '<table class="cgrid"><thead><tr><th>Значение разреза</th><th class="num">Величина</th>'+
    '<th class="num">Доля, % целого</th><th class="num">Нераспределено в узле</th></tr></thead><tbody>'+
    out.join('')+'</tbody><tfoot>'+
    '<tr><td>Сумма узлов</td><td class="num">'+esc(money(sum))+'</td>'+
      '<td class="num">'+esc(shareText(sum, d.total))+'</td><td class="num"></td></tr>'+
    '<tr><td>Нераспределённый остаток итога</td><td class="num">'+esc(money(d.unalloc))+'</td>'+
      '<td class="num">'+esc(shareText(d.unalloc, d.total))+'</td><td class="num"></td></tr>'+
    '<tr><td><b>Итог статистики на дату</b></td><td class="num"><b>'+esc(money(d.total))+'</b></td>'+
      '<td class="num">100,0 %</td><td class="num"></td></tr>'+
    '</tfoot></table>'+
    '<div class="why"><b>Итог родителя не равен сумме детей — и это норма.</b> '+
    esc(money(sum))+' + '+esc(money(d.unalloc))+' = '+esc(money(d.total))+': разница ровно '+
    'нераспределённый остаток. Складывать детей и выдавать сумму за родителя нельзя — родитель '+
    'приходит посчитанным отдельно, а остаток означает «часть портфеля не отнесена ни к одному '+
    'значению разреза». Доли в столбце — <em>проценты целого</em> на дату среза, они считаются '+
    'в момент показа и в обзоре не хранятся (ADR-0001, ИА-20).</div>';
}

/* ДИНАМИКА. Здесь стоят рядом три РАЗНЫЕ величины, и единица у каждой своя: доля в
   процентах, изменение доли в процентных пунктах, рост самой суммы в процентах с
   пометкой «величина». Слитые в одно «изменение на 0,03 %» они соврали бы обеим:
   читатель прочёл бы сдвиг места в целом как рост денег.                            */
function seriesTable(a){
  const pts = a.data.points, rows = [];
  pts.forEach((p, i) => {
    const prev = i ? pts[i-1] : null;
    const shift = prev ? shareShift(prev.unalloc, prev.v, p.unalloc, p.v) : null;
    rows.push('<tr'+(p.v == null ? ' class="out"' : '')+'><td>'+fmt(p.at)+'</td>'+
      '<td class="num">'+(p.v == null ? '<span class="pill err">точки нет</span>' : esc(money(p.v)))+'</td>'+
      '<td class="num">'+(p.v == null ? '<span class="muted">—</span>'
        : prev && prev.v != null ? esc(deltaText(prev.v, p.v)) : '<span class="muted">первая точка</span>')+'</td>'+
      '<td class="num">'+(p.v == null || !prev || prev.v == null ? '<span class="muted">—</span>'
        : esc(growthText(prev.v, p.v))+' <span class="muted">величина</span>')+'</td>'+
      '<td class="num">'+(p.unalloc == null ? '<span class="muted">—</span>'
        : esc(shareText(p.unalloc, p.v)))+'</td>'+
      '<td class="num">'+(shift == null ? '<span class="muted">—</span>' : esc(ppText(shift)))+'</td></tr>'+
      (p.v == null ? '<tr class="out"><td colspan="6" class="small">'+esc(p.why || 'точка пустая, '+
        'причина соседом не названа')+' — пустая точка печатается словами, а не нулём: ноль и '+
        '«не считалось» на графике неотличимы (ИА-14). '+esc(shareWhy(p.unalloc, p.v))+
        '</td></tr>' : ''));
  });
  return '<table class="cgrid"><thead><tr><th>Дата снимка</th><th class="num">Величина</th>'+
    '<th class="num">Изменение, сом</th><th class="num">Рост, %</th>'+
    '<th class="num">Доля нераспределённого, %</th><th class="num">Изменение доли, п.п.</th>'+
    '</tr></thead><tbody>'+rows.join('')+'</tbody></table>'+
    '<div class="why"><b>Три величины и три разные единицы.</b> «Доля» — проценты целого на дату; '+
    '«изменение доли» — процентные пункты между датами и с процентами не сравнивается; «рост» — '+
    'проценты самой суммы, и он помечен словом «величина». Ряд СОБРАН соседом из '+pts.length+
    ' снимков и не пересчитан; всё, что стоит правее величины, посчитано здесь, в момент показа, '+
    'и нигде не сохранено (ADR-0001).</div>';
}

/* СТРОКИ ОБЪЕКТОВ. Две вещи, которые экран обязан не проглотить: итог здесь — сумма
   ПОКАЗАННЫХ строк, а не итог портфеля (подпись едет вместе с числом), и смешанная
   фиксация показывается ИНАЧЕ, чем закрытая: показанная наравне, она читается как
   закрытая и молча смешивает две даты (ИА-8, ADR-0152 §2).                          */
function rowsTable(a){
  const d = a.data;
  const pill = r => r.fixation === 'зафиксировано' ? '<span class="pill ok">зафиксировано</span>'
    : r.fixation === 'смешанно' ? '<span class="pill warn">смешанно</span>'
    : '<span class="pill err">не зафиксировано</span>';
  return '<table class="cgrid"><thead><tr><th>Объект</th><th>Договор</th><th class="num">Величина</th>'+
    '<th class="num">Доля показанного, %</th><th>Фиксация на дату снимка</th></tr></thead><tbody>'+
    d.rows.map(r => {
      const odd = r.fixation !== 'зафиксировано';
      return '<tr'+(odd ? ' class="hl"' : '')+'><td>'+esc(r.subj)+'</td><td class="mono">'+esc(r.no)+'</td>'+
        '<td class="num">'+esc(money(r.v))+'</td>'+
        '<td class="num">'+esc(shareText(r.v, d.sum))+'</td>'+
        '<td>'+pill(r)+(r.fixedBy ? ' <span class="muted">'+esc(r.fixedBy)+'</span>' : '')+'</td></tr>'+
        (odd ? '<tr class="out"><td colspan="5" class="small">'+esc(r.fixNote || '')+
          (Object.keys(r.late || {}).length
            ? ' <b>Подтянулось позже снимка:</b> '+Object.keys(r.late).map(k => esc(k)+' — '+
              fmt(r.late[k])).join('; ')+'.' : '')+
          ' Такая строка не ложна и правке не подлежит — она подлежит называнию: сложенная с '+
          'закрытыми, она молча смешивает две даты (ИА-8).</td></tr>' : '');
    }).join('')+'</tbody><tfoot><tr><td colspan="2"><b>Сумма показанных строк</b></td>'+
    '<td class="num"><b>'+esc(money(d.sum))+'</b></td><td class="num">100,0 %</td>'+
    '<td class="small">строк '+d.n+(d.mixed.length ? ', смешанных '+d.mixed.length : '')+'</td></tr>'+
    '</tfoot></table>'+
    '<div class="why"><b>'+esc(a.why)+'</b> Подпись едет вместе с числом: '+esc(money(d.sum))+
    ' — это сложение '+d.n+' показанных строк, и итогом портфеля оно не является. За итогом ходят '+
    'срезом, где он приходит посчитанным.'+
    (d.mixed.length ? ' Смешанная фиксация ('+d.mixed.map(x => esc(x)).join(', ')+') показана иначе '+
      'остальных и названа словами.' : ' Смешанной фиксации среди показанных строк нет.')+'</div>';
}

/* Один показатель — три ответа одной формы. Вопрос печатается ПЕРЕД ответами: без него
   и число, и отказ читаются как свойство обзора, а не как ответ соседа (ADR-0135).   */
function indCard(one){
  if(!one.inComp) return '<div class="card"><h3>'+esc(one.name)+
    ' <span class="pill err">вне состава обзора</span></h3>'+
    '<div class="refusal"><b>числа за этот показатель не спрашивались вовсе</b>'+
    '<div class="small">'+esc(one.why)+'</div>'+
    '<div class="small muted">Спросить можно только то, что объявлено редакцией шаблона и состоит '+
    'в реестре статистики на дату среза (ИА-6, ИА-7). Пропавшая колонка объяснена словами, а не '+
    'оставлена пустой (ИА-19).</div></div></div>';
  const q = one.ask, fixed = Object.keys(q.values || {});
  const sec = (title, a, body) => '<div class="section-h">'+title+'</div>'+
    (a.ok ? passportLine(a)+body(a) : refusalBlock(a, title));
  return '<div class="card"><h3>'+esc(one.name)+' <span class="small">— '+esc(one.unit)+
    (one.row ? '; в строке объекта живёт' : '; в строке объекта не живёт')+'</span></h3>'+

/* Переключатель обзоров в шапке документа. Полный реестр со списком, фильтрами и
   заведением — соседний экран «Обзоры портфеля · реестр»; здесь достаточно назвать
   документы поимённо, чтобы было видно, что открытый — один из нескольких, и чтобы
   переход между ними не требовал возврата в реестр.                                 */
function reviewPicker(list, cur){
  return '<div class="btn-row">'+list.map(r => '<button class="btn '+
    (r.no === cur ? 'btn-primary' : 'btn-secondary')+' btn-sm" onclick="AN.pickReview(\''+esc(r.no)+
    '\')">'+esc(r.no)+' · '+esc(r.state)+'</button>').join('')+'</div>';
}
function reviewVerdictPill(v){
  if(!v) return '<span class="pill neutral">вывод не поставлен</span>';
  const cls = v === 'без замечаний' ? 'ok' : v === 'требует внимания' ? 'warn' : 'err';
  return '<span class="pill '+cls+'">'+esc(v)+'</span>';
}
/* Который обзор открыт. Запись НЕ ЗАВОДИТСЯ показом: если выбора ещё не делали, берётся
   первый из журнала — и состояние от этого не меняется ни на байт (проверка #73).    */
function currentReview(){
  const list = AN.reviews();
  if(!list.length) return null;
  const pick = AN.state.review;
  return list.some(r => r.no === pick) ? pick : list[0].no;
}

const TITLES = {borrower:'Заёмщик · Финансы', doc:'Финанализ (документ)',

function render(){
  if(typeof document === 'undefined') return;            /* без DOM рисовать нечего (смоук) */
  const st = AN.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  $('#title').textContent = TITLES[st.view];
  $('#role').innerHTML = ROLES.map(r => '<option'+(r === st.role ? ' selected' : '')+'>'+esc(r)+'</option>').join('');

    esc(s.name)+'</option>').join('');

  $('#foot').innerHTML = 'Сегодня '+fmt(st.today)+'. Вы — <b>'+esc(WHO[st.role])+'</b>.<br>'+

               : '<span class="pill ok">дефектов от анализа нет</span>');
