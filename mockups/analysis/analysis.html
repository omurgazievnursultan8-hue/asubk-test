AN.render = render;
function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast'+(kind ? ' '+kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(res.note ? okMsg+' — '+res.note : okMsg, 'ok'); }
  else toast((res && res.why) || 'отказано', 'err');
  render();
}
AN.act = act;

function mirrorStrip(subjId){
  const v = AN.analysisVerdict(subjId);
  const md = AN.mirrorDefect(subjId);
  const gate = AN.mirrorGate(subjId);
  const rows = [];
  rows.push('<div class="row"><span class="k">Анализ</span>'+
    (v.none ? '<b>анализа нет</b> <span class="muted">— печатается словами: пустое место '+
      'неотличимо от непоказанного (ИА-14)</span>'
            : verdictPill(v.verdict)+' <b>'+esc(v.no)+'</b> · '+fmt(v.at)+' · '+esc(v.period)+
              (v.changed ? ' <span class="pill warn">источник изменён после утверждения</span>' : ''))+'</div>');
  rows.push('<div class="row"><span class="k">Откуда это поле</span><span class="muted">зеркало шва '+
    '<code>analysisVerdict</code>: анализ в карточку заёмщика не пишет (ИА-9, ADR-0155 §1)</span></div>');
  rows.push('<div class="row"><span class="k">Обязательство</span>'+
    (md.due && md.due.required
      ? esc(md.due.freqName)+', период <b>'+esc(md.due.period)+'</b>, срок '+fmt(md.due.due)+
        ' <span class="muted">(расписание анализа, строка «'+esc(md.due.row)+'»)</span>'
      : '<span class="muted">'+esc(md.why)+'</span>')+'</div>');
  if(md.due && md.due.required)
    rows.push('<div class="row"><span class="k">Счёт сопровождения</span>'+
      (md.defect ? '<span class="pill err">дефект</span> '+esc(md.code)+' · влияние «'+esc(md.influence)+'» — '+
        esc(md.why)+' <span class="muted">считается, не хранится (ИА-13)</span>'
                 : '<span class="pill ok">дефекта нет</span> <span class="muted">'+esc(md.why)+'</span>')+'</div>');
  if(!gate.pass)
    rows.push('<div class="row"><span class="k">Гейт заявки</span><span class="pill err">не пропускает</span> '+
      esc(gate.text)+(gate.appl ? ' <span class="muted">('+esc(gate.appl)+')</span>' : '')+'</div>');
  return '<div class="mirror'+(md.defect ? ' err' : v.none ? ' none' : '')+'">'+rows.join('')+'</div>';
}

function viewDoc(){
  const st = AN.state;
  const d = DOC(st.doc);
  if(!d) return '<div class="banner info">Заключение не выбрано: откройте его из карточки заёмщика.</div>';
  const s = SUBJ(d.subj);
  const r = REPORT(d.report);
  const m = METHOD(d.method);
  const rt = AN.ratiosOf(d.no);
  const lead = AN.mayLead(d.subj);
  const mf = AN.methodFor(d.subj, r.at);
  const hist = st.analyses.filter(a => a.subj === d.subj && a.period === d.period && a.no !== d.no);
  return '<div class="doc-head"><h2>'+esc(d.no)+' · '+esc(s.name)+'</h2>'+statePill(d)+verdictPill(d.verdict)+
      (AN.sourceChanged(d.no).length ? '<span class="pill warn">источник изменён после утверждения</span>' : '')+'</div>'+
    '<div class="page-lead">Финансовый анализ заёмщика — документ-суждение на пару «заёмщик × период '+
    'отчётности». Порядок работы ТЗ: ввод данных → расчёт коэффициентов → ввод результатов.</div>'+
    changedBlock(d)+
    '<div class="card"><h3>Основание</h3><div class="kv">'+
      '<span class="k">Заёмщик</span><span class="v">'+esc(s.name)+'</span>'+
      '<span class="k">Период отчётности</span><span class="v">'+esc(d.period)+', дата отчётности '+fmt(r.at)+'</span>'+
      '<span class="k">Версия отчётности</span><span class="v">версия '+d.reportVer+' от '+fmt(r.filed)+
        ' <span class="muted">— «'+esc(r.basis)+'»</span></span>'+
      '<span class="k">Тип лица на дату отчётности</span><span class="v">'+esc(AN.typeOn(d.subj, r.at))+
        ' <span class="muted">— не на сегодня: «'+esc(AN.typeOn(d.subj, st.today))+'» (ИА-4)</span></span>'+
      '<span class="k">Методика</span><span class="v">'+esc(m.name)+', редакция '+d.ed+
        ' <span class="muted">— '+esc(mf.ok ? mf.why : '')+'</span></span>'+
      '<span class="k">Ведёт</span><span class="v">'+esc(d.by)+' <span class="muted">— ведущий куратор заёмщика</span></span>'+
      (d.prev ? '<span class="k">Переиздаёт</span><span class="v">'+esc(d.prev)+
        ' <button class="btn btn-secondary btn-sm" onclick="AN.openDoc(\''+esc(d.prev)+'\')">Открыть</button>'+
        ' <span class="muted">— заключение за тот же период на прежней версии основания; '+
        'связь проставлена машиной, какой бы дверью ни завели новое (ИА-16)</span></span>' : '')+
    '</div></div>'+
    '<div class="card"><h3>Коэффициенты '+(rt.live
        ? '<span class="small">— живой расчёт: черновик считается заново при каждом показе</span>'
        : '<span class="small">— из снимка: утверждённое не пересчитывается (ИА-1)</span>')+'</h3>'+
      ratioTable(rt.ed, rt.rows)+
      '<div class="why">Значения ставит машина по объявлению методики: человек вносит отчётность, '+
      'а не коэффициент (ИА-3, ADR-0122). Порог подсвечивает — вывод ставит человек.</div></div>'+
    (d.state === 'утверждено'
      ? '<div class="card"><h3>Заключение</h3><div class="verdict">'+verdictPill(d.verdict)+'</div>'+

    (d.corrections.length ? '<div class="card"><h3>Корректировки</h3><table class="cgrid"><thead><tr>'+

      d.corrections.map(c => '<tr><td>'+fmt(c.at)+'</td><td>'+esc(c.by)+'</td><td>'+esc(c.field)+'</td>'+

      hist.map(h => {

        '<td class="small">версия '+h.reportVer+'</td>'+

          : succ ? 'переиздано в '+esc(succ.no) : '<span class="muted">—</span>')+'</td>'+

      'утверждённое, история — в документе. Цепочка переизданий читается здесь, а не только '+
      'списком на карточке заёмщика.</div></div>' : '');
}

function obligationTable(){
  const today = AN.state.today;
  /* Показывается ПАРА, на которой стоит срок, — и показывается на конец периода, а не на
     сегодня: разница видна глазами, а не выясняется отладкой (АН-38). */
  const pairNow = id => esc(AN.typeOn(id, today))+' × '+
    esc(AN.riskOn(id, today) ? AN.riskName(AN.riskOn(id, today)) : 'категории нет');

/* ============ ЭКРАН «ОБЗОР ПОРТФЕЛЯ» — ДОКУМЕНТ ОБЗОРА ============== *
   Живой документ: ни одного числа он не хранит и при каждом открытии спрашивает их
   заново одной дверью — AN.reviewData(no). Ни STAT, ни REP экран не знает вовсе:
   иначе на экране завёлся бы второй порядок обращения к соседу, и он разошёлся бы с
   первым (ИА-20, ИА-16, ADR-0157 §4).
   ЧЕГО ЭКРАН ОБЯЗАН НЕ ПРОГЛОТИТЬ — по пунктам, потому что каждое проглатывание тихое:
   паспорт стоит рядом с числом, а не вместо; два отказа шва не сливаются в прочерк;
   частично ответивший документ честно говорит «ответило N из M»; сумма показанных строк
   подписана как сумма показанных; нераспределённый остаток виден отдельной величиной;
   смешанная фиксация показана иначе закрытой; роль — та, под которой СПРОСИЛИ; молчание
   журнала пометок печатается словами; ноль поручений печатается словами; прежнее суждение
   не пропадает при корректировке; а «сохранить числа», «переиздать» и «пересчитать»
   стоят на экране НАЗВАННЫМИ ОТКАЗАМИ там, где их ищут (ИА-8, ИА-14, ИА-19).       */
AN.pickReview = no => { AN.state.review = no; render(); };
AN.saveReviewUI = () => {
  const no = currentReview();
  const t = AN.setReviewText(no, ($('#rText')||{}).value);
  if(!t.ok) return act(t);
  const v = ($('#rVerdict')||{}).value;
  act(v ? AN.setReviewVerdict(no, v) : t, 'суждение сохранено');
};
AN.approveReviewUI = () => {
  const no = currentReview();
  AN.setReviewText(no, ($('#rText')||{}).value);
  const v = ($('#rVerdict')||{}).value; if(v) AN.setReviewVerdict(no, v);
  act(AN.approveReview(no), 'обзор утверждён');
};
AN.correctReviewUI = () => {
  const no = currentReview(), what = ($('#rcField')||{}).value;
  const spec = {why: ($('#rcBasis')||{}).value};
  if(what === 'вывод') spec.verdict = ($('#rcVerdict')||{}).value;
  else spec.text = ($('#rcText')||{}).value;
  act(AN.correctReview(no, spec), 'корректировка суждения внесена');
};

/* Журнал пуст — это ОТВЕТ, и печатается он словами. Пустая панель читается как
   «экран сломался», а не как «обзоров ещё не заводили» (ИА-14).                  */
function reviewEmptyBlock(){
  return '<h2 class="section-h">Обзор портфеля <span class="pill neutral">обзоров нет</span></h2>'+
    '<div class="page-lead">Обзор — суждение о <b>портфеле</b> за период: срез статистики на дату, '+
    'объяснение словами и одна подпись. Своих чисел обзор не держит вовсе.</div>'+
    '<div class="banner info"><b>Обзоров в журнале нет — ни одного, и сказано это словами.</b> '+
    'Это не пустой экран и не сбой показа: журнал обзоров пуст, потому что обзоров ещё не заводили. '+
    'Пустое место и «ничего нет» на экране неотличимы, и различать их обязан документ, а не '+
    'читатель (ИА-14).</div>'+
    '<div class="card"><h3>Откуда здесь берутся обзоры</h3>'+
      '<div class="why">Обзор заводится операцией <em>newReview</em>: шаблон отчётности, его редакция '+
      'на дату среза, период, разрез разбивки, закреплённые значения и показатели — и всё это уже '+
      'объявила редакция шаблона, обзор на неё ссылается и состав не копирует (ИА-7, ADR-0154 §2). '+
      'В макете журнал наполняет витрина: три обзора проводятся настоящими операциями, а не '+
      'выписываются готовыми записями.</div>'+
      '<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="AN.act(AN.seedReviews(), '+
      '\'обзоры витрины проведены настоящими операциями\')">Провести обзоры витрины</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryOwnBuilder())">Свой конструктор '+
      'состава</button></div></div>';
}

/* Основание вопроса: всё, что обзор ХРАНИТ. Ни одного числа в этой карточке нет и быть

    '<span class="k">Шаблон отчётности</span><span class="v">«'+esc(d.tpl)+'», редакция '+d.tplEd+
      ' <span class="muted">— действующая на дату среза; состав объявляет она, обзор её не копирует '+

    '<span class="k">Период</span><span class="v">'+fmt(d.period.from)+' — '+fmt(d.period.to)+'</span>'+
    '<span class="k">Дата среза</span><span class="v">'+fmt(d.asOf)+' <span class="muted">— срез '+

      '</span></span>'+

      ? fixed.map(k => '<span class="pill info">'+esc(k)+' = '+esc(d.cuts[k])+'</span>').join(' ')
      : '<span class="muted">ни одного — вопрос идёт по всему портфелю</span>')+'</span>'+
    '<span class="k">Показатели</span><span class="v">'+d.inds.map(i => '<span class="pill '+
      (i.inComp ? 'neutral' : 'err')+'">'+esc(i.name)+'</span>').join(' ')+'</span>'+

      d.comp.dropped.length+' <span class="muted">— пересечение объявленного шаблоном и состоящего '+
      'в реестре статистики</span></span>'+
    '</div><div class="why">'+esc(d.why)+'</div></div>';
}

/* ПОД КАКОЙ РОЛЬЮ СПРОСИЛИ. На экране стоит роль ИЗ ОТВЕТА — та, что применена к
   строкам, — а не та, что в шапке приложения: разойдясь, они превратили бы суженный
   ответ в полный (ИА-9, ADR-0155 §1).                                             */

  return '<div class="pass'+(d.roleFromSession ? '' : ' warn')+'">'+
    '<div class="row"><span class="k">Спрошено под ролью</span><b>'+esc(d.who)+'</b> '+

    '<div class="row"><span class="k">Откуда роль</span>'+(d.roleFromSession

        'и названа здесь вслух</span>'
      : '<span class="pill warn">названа вопросом</span> <span class="muted">— спрошено ЗА названного '+
        'человека, а не за того, кто открыл экран</span>')+'</div>'+
    '<div class="row"><span class="k">Спрошено</span>'+fmt(d.askedAt)+' <span class="muted">— числа '+
    'живут ровно столько, сколько открыт документ</span></div></div>';
}

/* Отказы собраны ещё и списком: объяснение обязано стоять В ДОКУМЕНТЕ, а не теряться
   в углу возле той таблицы, которой не случилось (ИА-19).                          */
function reviewRefusedCard(d){
  if(!d.refused.length) return '<div class="card"><h3>Отказы соседей</h3><div class="why">'+
    'Отказов нет: на все '+d.asks+' обращений соседи ответили. Сказано это словами — пустой '+
    'список отказов и «мы их не показали» читаются одинаково (ИА-14).</div></div>';
  return '<div class="card"><h3>Отказы соседей <span class="small">— '+d.refused.length+' из '+d.asks+
    ' обращений; они часть документа и остаются в нём видны</span></h3>'+
    '<table class="cgrid"><thead><tr><th>Показатель</th><th>Шов</th><th>Род отказа</th>'+
    '<th>Причина словами</th></tr></thead><tbody>'+
    d.refused.map(x => '<tr><td>'+esc(x.ind)+'</td><td class="mono">'+esc(x.seam || '—')+'</td>'+
      '<td>'+(x.kind === 'отказ по форме' ? '<span class="pill warn">отказ по форме</span>'
            : x.kind === 'отказ соседа' ? '<span class="pill err">отказ соседа</span>'
            : '<span class="pill err">'+esc(x.kind)+'</span>')+'</td>'+
      '<td class="small">'+esc(x.why)+'</td></tr>').join('')+'</tbody></table>'+
    '<div class="why">Роды отказа не слиты: «отказ соседа» — не считал вовсе, «отказ по форме» — '+
    'посчитал, но списком не отдаёт по порогу показа. Первое лечится другой датой или охватом, '+
    'второе — более узким вопросом; один прочерк на двоих соврал бы обоим (ИА-19).</div></div>';
}

/* Суждение: черновик правится прямо, утверждённое — корректировкой с основанием, и
   прежнее суждение при этом из документа не пропадает (ADR-0112).                  */
function reviewJudgementCard(d, rec){
  const mine = AN.who() === rec.author;
  if(d.state === 'утверждено'){
    return '<div class="card"><h3>Суждение <span class="small">— утверждено '+fmt(rec.approvedAt)+', '+
      esc(rec.approvedBy)+'</span></h3><div class="verdict">'+reviewVerdictPill(d.verdict)+'</div>'+
      '<p class="concl">'+esc(d.text)+'</p>'+
      '<div class="pass"><div class="row"><span class="k">Выпуск</span><b>'+esc(rec.issue)+
        '</b> <span class="muted">— окончательный выпуск у отчётности, получатель которого — этот '+
        'обзор; числа, состав и охват заморозил он, а не мы</span></div>'+
      '<div class="row"><span class="k">Рабочий список</span><b>'+esc(rec.worklist)+'</b> '+
        '<span class="muted">— объекты обзора; своего перечня объектов анализ не держит</span></div>'+
      '<div class="row"><span class="k">Что взял обзор</span>два номера и <b>ни одного числа</b></div>'+
      '</div>'+
      (mine ? '<div class="section-h">Корректировка суждения</div>'+
        '<div class="form-row tight"><div class="fld"><label>Что правим</label>'+
        '<select id="rcField" onchange="AN.render()"><option>текст</option><option>вывод</option></select>'+
        '</div><div class="fld" style="flex:1"><label>Основание корректировки</label>'+
        '<input id="rcBasis" placeholder="например: служебная записка № 14 от 25.08.2026"></div></div>'+
        '<div class="fld" style="margin-top:10px"><label>Новый текст</label>'+
        '<textarea id="rcText">'+esc(d.text)+'</textarea></div>'+
        '<div class="fld" style="margin-top:10px"><label>Новый вывод</label><select id="rcVerdict">'+
        AN.reviewVerdicts().map(v => '<option'+(v === d.verdict ? ' selected' : '')+'>'+esc(v)+
          '</option>').join('')+'</select></div>'+
        '<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="AN.correctReviewUI()">'+
        'Внести корректировку суждения</button></div>'
        : '<div class="banner info">Обзор ведёт '+esc(rec.author)+': суждение правит тот, кто его '+
          'произнёс и подписал, — он за него и отвечает. Переключите роль в шапке, чтобы '+
          'попробовать.</div>')+
      '<div class="why">Корректировкой правится <em>только суждение</em> — текст и вывод. Числа, '+
      'состав среза и охват ею не правятся и не могли бы: обзор их не хранит, а замороженный их '+
      'экземпляр лежит у выпуска '+esc(rec.issue)+' (АН-60, ИА-20, ADR-0112).</div></div>';
  }
  return '<div class="card"><h3>Суждение <span class="small">— черновик: правится прямо, '+
    'подписи под ним ещё не стояло</span></h3>'+
    (mine
      ? '<div class="fld"><label>Текст суждения</label><textarea id="rText">'+esc(d.text)+
        '</textarea></div>'+
        '<div class="form-row" style="margin-top:10px"><div class="fld"><label>Вывод обзора</label>'+
        '<select id="rVerdict"><option value="">— не выбран —</option>'+
        AN.reviewVerdicts().map(v => '<option'+(v === d.verdict ? ' selected' : '')+'>'+esc(v)+
          '</option>').join('')+'</select></div></div>'+
        '<div class="btn-row"><button class="btn btn-secondary" onclick="AN.saveReviewUI()">'+
        'Сохранить суждение</button>'+
        '<button class="btn btn-success" onclick="AN.approveReviewUI()">Утвердить обзор</button>'+
        '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryApproveOnPreliminary(\''+esc(rec.no)+'\'))">Утвердить по предварительному выпуску</button></div>'
      : '<div class="verdict">'+reviewVerdictPill(d.verdict)+'</div><p class="concl">'+esc(d.text)+
        '</p><div class="banner info">Обзор ведёт '+esc(rec.author)+': суждение пишет автор обзора, '+
        'а не тот, кто открыл черновик. Переключите роль в шапке, чтобы попробовать.</div>')+
    '<div class="why">Кнопка «Сохранить суждение» сохраняет <em>текст и вывод</em> — и только их: '+
    'чисел под ними в записи нет, и сохранять там нечего. Утверждение — не запись у себя, а '+
    'окончательный <em>выпуск</em> у отчётности, получателем которого назван этот обзор; оттуда он '+
    'возьмёт два номера и ни одного числа (ИА-20, ADR-0157 §2).</div></div>';
}

/* Пометка источника печатается ВСЕГДА — и когда её нет. Пустое место читается как «всё
   сходится», а молчание журнала соседа сходимости не доказывает (ИА-14, ИА-19).    */
function reviewMarkCard(d) {
  const mk = AN.reviewMark(d.no);
  const cls = (mk.ok && mk.marked) ? 'banner warn' : 'pass';
  return '<div class="card"><h3>Пометка «числа поехали» <span class="small">— чужая: ставит её '+
    'отчётность у выпуска, обзор её носит и не пересчитывается</span></h3>'+
    '<div class="'+cls+'">'+(mk.ok && mk.marked
      ? '<b>Источник за обзором сдвинулся после передачи.</b> '
      : mk.ok ? '<b>Источник не двигался.</b> ' : '<b>Пометки у документа нет.</b> ')+
    esc(mk.why)+'</div>'+
    (mk.ok && mk.marked ? '<table class="cgrid"><thead><tr><th>Показатель</th><th>Замечено</th>'+
      '<th>Причина</th></tr></thead><tbody>'+mk.marks.map(x => '<tr><td>'+esc(x.ind)+'</td>'+
      '<td>'+fmt(x.at)+'</td><td class="small">'+esc(x.cause)+'</td></tr>').join('')+
      '</tbody></table>' : '')+
    '<div class="why">Строка эта стоит здесь всегда, в том числе когда пометок нет: пустое место на '+
    'её месте читалось бы как «всё сходится», а сказать это молчание журнала не вправе (ИА-14).</div>'+
    '</div>';
}

/* Охват и поручения — оба ответа приходят вопросом и оба печатаются словами, включая
   «ничего не поручено» и «у черновика охвата ещё нет» (ИА-11, ИА-14, ИА-20).       */
function reviewScopeCard(d){
  const sc = AN.reviewScope(d.no);
  return '<div class="card"><h3>Охват документа <span class="small">— свойство выпуска, а не поле '+
    'обзора</span></h3><div class="'+(sc.ok ? 'pass' : 'refusal')+'">'+
    (sc.ok ? '<div class="row"><span class="k">Паспорт выпуска</span><b>'+esc(sc.short)+'</b></div>'+
      '<div class="row"><span class="k">Подразделений</span>'+sc.scope.length+' ('+
      sc.scope.map(x => esc(x)).join(', ')+')</div>'+
      '<div class="row"><span class="k">Объектов в рабочем списке</span>'+
      (sc.objects == null ? '<span class="muted">список не отвечает</span>' : sc.objects)+'</div>'+
      '<div class="row"><span class="k">Почему так</span><span class="small">'+esc(sc.why)+'</span></div>'
      : '<b>охвата у документа пока нет</b><div class="small">'+esc(sc.why)+'</div>')+'</div>'+
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryChangeScope(\''+esc(d.no)+'\'))">Поправить охват</button></div></div>';
}
function reviewTasksCard(d){
  const t = AN.tasksOfReview(d.no);
  return '<div class="card"><h3>Что поручено по обзору <span class="small">— ответ СОБРАН вопросом: '+
    'в записи обзора о поручениях не сказано ничего (ИА-11)</span></h3>'+
    (t.ok && t.n
      ? '<table class="cgrid"><thead><tr><th>Поручение</th><th>Объект</th><th>Существо</th>'+
        '<th>Срок</th><th>Поставил</th></tr></thead><tbody>'+t.tasks.map(x => '<tr>'+
        '<td class="mono">'+esc(x.no)+'</td><td>'+esc(x.subj)+'</td><td class="small">'+esc(x.what)+
        '</td><td>'+fmt(x.due)+'</td><td class="small">'+esc(x.by)+'</td></tr>').join('')+
        '</tbody></table>'
      : '<div class="banner info"><b>Поручений нет — и это напечатано словами, а не пустой '+
        'таблицей.</b> '+esc(t.why)+'</div>')+
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryMassTasks(\''+esc(d.no)+'\'))">Поручить сразу по всем объектам</button></div>'+
    '<div class="why">Обзор задач не порождает: между строкой обзора и поручением стоит человек, и '+
    'ссылка односторонняя — задача знает обзор, обзор о задачах не знает ничего (ИА-11).</div></div>';
}

/* КНОПОК «СОХРАНИТЬ ЧИСЛА», «ПЕРЕИЗДАТЬ» И «ПЕРЕСЧИТАТЬ» НЕТ — и отсутствие их
   объяснено ТАМ, ГДЕ ИХ ИЩУТ. Спрятать кнопку значит оставить читателя думать, что
   её забыли; манера модуля — назвать отказ словами и держать его кодом.            */
function reviewCantCard(d){
  const snap = AN.tryOwnSnapshot(d.no), re = AN.tryReissueReview(d.no),
        num = AN.tryCorrectNumbers(d.no, 'итог среза');
  const one = (title, res) => '<div class="refusal"><b>'+esc(title)+'</b><div class="small">'+
    esc(res.why)+'</div></div>';
  return '<div class="card"><h3>Чего на этом экране нет <span class="small">— и почему это решение, '+
    'а не пропущенные кнопки</span></h3>'+
    one('«Сохранить числа в обзоре» / «Заморозить снимок»', snap)+
    one('«Переиздать обзор»', re)+
    one('«Пересчитать» / «Исправить число корректировкой»', num)+
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryOwnSnapshot(\''+esc(d.no)+'\'))">Сохранить числа в обзоре</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryReissueReview(\''+esc(d.no)+'\'))">Переиздать обзор</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryCorrectNumbers(\''+esc(d.no)+'\', \'итог среза\'))">Пересчитать числа</button></div>'+
    '<div class="why">Кнопки оставлены на экране намеренно: отказ, произнесённый словами, учит, а '+
    'исчезнувшая кнопка — нет. Каждая из трёх отвечает СВОЕЙ причиной, а не общим «нельзя» '+
    '(ИА-19).</div></div>';
}

function viewReview(){
  const list = AN.reviews();
  if(!list.length) return reviewEmptyBlock();
  const no = currentReview();
  const d = AN.reviewData(no);
  if(!d.ok) return '<h2 class="section-h">Обзор портфеля</h2>'+reviewPicker(list, no)+
    '<div class="refusal"><b>числа этого обзора не спрашивались</b><div class="small">'+esc(d.why)+
    '</div><div class="small muted">Отказ целиком приходит ровно в двух случаях: обзора нет или '+
    'состав на дату среза разошёлся с редакцией, на которую обзор сослался. Оба решает человек '+
    '(ИА-7, ИА-19).</div></div>';
  const rec = list.find(r => r.no === d.no);
  return '<div class="doc-head"><h2>'+esc(d.no)+' · Обзор портфеля</h2>'+
      (d.state === 'утверждено'
        ? '<span class="pill ok">утверждено '+fmt(rec.approvedAt)+'</span>'
        : '<span class="pill neutral">черновик</span>')+
      reviewVerdictPill(d.verdict)+
      '<span class="pill '+(d.answered === d.asks ? 'ok' : d.answered ? 'warn' : 'err')+'">ответило '+
      d.answered+' из '+d.asks+'</span>'+
      '<span class="pill info">числа живые, не хранятся</span></div>'+
    '<div class="page-lead">Суждение о <b>портфеле</b> за период: шаблон отчётности и его редакция '+
    'на дату среза, разрез разбивки, показатели — и ни одного сохранённого числа. Величины ниже '+
    'спрошены у статистики <b>сейчас</b> и уйдут вместе с экраном.</div>'+
    reviewPicker(list, no)+
    (d.answered === d.asks
      ? '<div class="banner ok"><b>Ответили все '+d.asks+' обращений.</b> Отказов в этом документе '+
        'нет — и сказано это отдельной строкой, чтобы «отказов нет» не путалось с «отказы не '+
        'показаны» (ИА-14).</div>'
      : '<div class="banner warn"><b>Документ отвечен частично: ответило '+d.answered+' из '+d.asks+
        ' обращений, отказало '+d.refused.length+'.</b> Это НОРМА, а не сбой: часть швов отвечает, '+
        'часть отказывает, и суждение стоит на том, что ответило. Отказы остаются в документе '+
        'видны — в том числе после подписи (ADR-0178 §1, ИА-19).</div>')+
    reviewBasisCard(d)+
    '<div class="card"><h3>Под какой ролью спрошены числа</h3>'+reviewRoleCard(d)+
      '<div class="why">На экране стоит роль <em>из ответа</em>, а не из шапки приложения: сосед '+
      'сузил строки именно по ней, и разойдись эти две — суженный ответ читался бы как полный '+
      '(ИА-9, ADR-0155 §1).</div></div>'+
    '<h2 class="section-h">Числа: ответы соседа с паспортами <span class="small">— спрошены '+
      fmt(d.askedAt)+', ответило '+d.answered+' из '+d.asks+'</span></h2>'+
    d.inds.map(indCard).join('')+
    reviewRefusedCard(d)+
    (d.comp.dropped.length ? '<div class="card"><h3>Что в состав не вошло <span class="small">— '+
      d.comp.dropped.length+' записей, и у каждой своя причина</span></h3>'+
      '<table class="cgrid"><thead><tr><th>Показатель</th><th>Род</th><th>Причина словами</th>'+
      '</tr></thead><tbody>'+d.comp.dropped.map(x => '<tr class="out"><td class="mono">'+esc(x.ind)+
      '</td><td>'+esc(x.kind)+'</td><td class="small">'+esc(x.why)+'</td></tr>').join('')+
      '</tbody></table><div class="why">«Объявлен формой, но из реестра выведен» и «в реестре '+
      'состоит, но формой не объявлен» — разные причины, и слить их в одну значило бы соврать '+
      'обеим (ИА-6, ИА-7, ИА-19).</div></div>' : '')+
    reviewJudgementCard(d, rec)+
    (rec.corrections.length ? '<div class="card"><h3>Корректировки суждения <span class="small">— '+
      'прежнее суждение из документа не пропало</span></h3>'+
      '<table class="cgrid"><thead><tr><th>Когда</th><th>Кто</th><th>Что</th><th>Было</th>'+
      '<th>Стало</th><th>Основание</th></tr></thead><tbody>'+
      rec.corrections.map(c => '<tr><td>'+fmt(c.at)+'</td><td>'+esc(c.by)+'</td><td>'+esc(c.field)+
        '</td><td class="small">'+esc(String(c.was).slice(0,60))+'</td>'+
        '<td class="small">'+esc(String(c.now).slice(0,60))+'</td>'+
        '<td class="small">'+esc(c.basis)+'</td></tr>').join('')+'</tbody></table>'+
      '<div class="why">Правка легла записью «было → стало» с основанием, автором и датой: иначе в '+
      'документе осталось бы новое суждение и ни следа от того, что читатель уже видел. Основание '+
      'корректировкой не тронуто — его морозил выпуск (ADR-0112, АН-60).</div></div>'
      : '<div class="card"><h3>Корректировки суждения</h3><div class="why">Корректировок нет: '+
        'суждение с тех пор не правили. Сказано это словами — пустая лента и «правки не '+
        'показываем» читаются одинаково (ИА-14).</div></div>')+
    reviewMarkCard(d)+
    reviewScopeCard(d)+
    reviewTasksCard(d)+
    reviewCantCard(d);
}

/* ============= ЭКРАН 5: РЕЕСТР АНАЛИТИЧЕСКИХ ОБЗОРОВ ================ *
   РАЗДЕЛ ОТКРЫТ — И ОТКРЫТ ПОТОМУ, ЧТО ПОЯВИЛОСЬ ОСНОВАНИЕ: шаблон отчётности с
   редакциями на дату. Пока его не было, раздел стоял запертым, и «пока свой»
   конструктор состава на его месте заведён не был: второй порядок сборки не сошёлся
   бы с первым, и одна и та же цифра стала бы разной в отчёте и в обзоре. Его нет и
   сейчас — состав по-прежнему объявляет редакция шаблона, а обзор держит ССЫЛКУ на
   неё и состав не копирует (ИА-7, ADR-0154 §2).
   ЧТО СТОИТ В СТРОКЕ РЕЕСТРА — ровно то, что обзор хранит: номер, шаблон с редакцией,
   период, дата среза, разрез разбивки, закреплённые значения, состояние, автор, дата
   и два номера у утверждённых. НИ ОДНОЙ ВЕЛИЧИНЫ ПОКАЗАТЕЛЯ здесь нет: величины живут
   ровно столько, сколько открыт документ, и спрашиваются заново при каждом его
   открытии — реестр их не кэширует и кэшировать не может (ИА-20).
   ПЕРЕХОД В ДОКУМЕНТ ставит выбранный номер в состояние В ОБРАБОТЧИКЕ, а не при
   отрисовке: экран, пишущий в состояние показом, менялся бы от одного взгляда на него.
   ПУСТОЙ РЕЕСТР ОБЪЯСНЯЕТСЯ СЛОВАМИ. Пустая таблица и «обзоров ещё не заводили»
   читаются одинаково, а различать их обязан экран, а не читатель (ИА-14).
   ОТКАЗЫ ЗАВЕДЕНИЯ СТОЯТ НА ЭКРАНЕ СЛОВАМИ — и роль, и негодная форма. Спрятанная
   кнопка ничего не объясняет: читатель решит, что её забыли (ИА-19).                */
AN.openReview = no => { AN.state.review = no; AN.state.view = 'review'; render(); };
AN.newReviewUI = () => {
  const g = id => String((($('#'+id) || {}).value) || '').trim();
  const spec = {tpl:g('nrTpl'), asOf:g('nrAsOf'),
    period:{from:g('nrFrom'), to:g('nrTo')}, by:g('nrBy'), cuts:{},
    inds:g('nrInds').split(',').map(x => x.trim()).filter(Boolean)};
  const dim = g('nrCutDim'), val = g('nrCutVal');
  if(dim || val) spec.cuts[dim] = val;
  act(AN.newReview(spec), 'обзор заведён — и ни одного числа в нём нет');
};
/* Обзор по услугам заводится ОТДЕЛЬНОЙ названной кнопкой, и вот почему: смешанная
   фиксация (объект, часть договоров которого подтянулась позже даты снимка) живёт в
   отрасли «услуги», а ни один из трёх обзоров витрины услуг не режет — в реестре
   витрины третье состояние фиксации не всплывает вовсе. Досеивать четвёртый обзор в
   витрину нельзя: номера обзоров идут подряд, а утверждение тратит у отчётности номер
   выпуска — витрина сдвинула бы и то и другое. Поэтому случай назван словами и заводится
   рукой, настоящей операцией.                                                       */
AN.newMixedReviewUI = () => act(AN.newReview({tpl:'ШО-09', asOf:'2026-06-30',
  period:{from:'2026-01-01', to:'2026-06-30'}, by:'подразделение',
  cuts:{'отрасль':'услуги'}, inds:['s-over']}),
  'обзор по услугам заведён — в нём видно третье состояние фиксации');

/* Строка реестра. Клик по ней уходит в документ; номер в состояние ставит ОБРАБОТЧИК. */
function reviewRow(r){
  const fixed = Object.keys(r.cuts || {});
  return '<tr onclick="AN.openReview(\''+esc(r.no)+'\')" style="cursor:pointer" '+
    'title="открыть документ обзора '+esc(r.no)+'">'+
    '<td class="mono"><b>'+esc(r.no)+'</b></td>'+
    '<td>«'+esc(r.tpl)+'», ред. '+esc(r.tplEd)+'</td>'+
    '<td>'+fmt(r.period.from)+' — '+fmt(r.period.to)+'</td>'+
    '<td>'+fmt(r.asOf)+'</td>'+
    '<td><span class="pill info">'+esc(r.by)+'</span>'+
      (fixed.length ? ' '+fixed.map(k => '<span class="pill info">'+esc(k)+' = '+esc(r.cuts[k])+
        '</span>').join(' ') : '')+'</td>'+
    '<td>'+(r.state === 'утверждено'
      ? '<span class="pill ok">утверждено '+fmt(r.approvedAt)+'</span>'
      : '<span class="pill neutral">черновик</span>')+'</td>'+
    '<td>'+reviewVerdictPill(r.verdict)+'</td>'+
    '<td class="small">'+esc(r.author)+'<br><span class="muted">заведён '+fmt(r.createdAt)+
      '</span></td>'+
    '<td class="mono small">'+(r.issue ? esc(r.issue)+'<br>'+esc(r.worklist)
      : '<span class="muted">— ни выпуска, ни рабочего списка: их приносит подпись</span>')+'</td>'+
    '<td class="small">открыть →</td></tr>';
}
function reviewsTable(list){
  return '<table class="cgrid"><thead><tr><th>Обзор</th><th>Шаблон и редакция</th><th>Период</th>'+
    '<th>Дата среза</th><th>Разрез разбивки и закреплённое</th><th>Состояние</th><th>Вывод</th>'+
    '<th>Автор</th><th>Выпуск / рабочий список</th><th></th></tr></thead><tbody>'+
    list.map(reviewRow).join('')+'</tbody></table>'+
    '<div class="why">В строке нет ни одной величины показателя — и это не сокращение таблицы, а '+
    'устройство обзора: он хранит ССЫЛКИ (шаблон с редакцией, период, дату среза, разрез), а числа '+
    'спрашивает у статистики при каждом открытии документа. Реестр, показавший «итог портфеля» '+
    'колонкой, назавтра показывал бы вчерашнее (ИА-20, ADR-0001). Два номера у утверждённых — '+
    'выпуск и рабочий список — это всё, что обзор взял от подписи (ADR-0157 §4).</div>';
}

/* Охват и пометка источника — оба ответа ЧУЖИЕ и оба печатаются ВСЕГДА, включая «источник
   не двигался» и «у черновика охвата ещё нет». Пустая клетка на их месте читалась бы как
   «всё сходится», а молчание журнала сходимости не доказывает (ИА-14, ИА-19).       */
function reviewsSourceCard(list){
  return '<div class="card"><h3>Охват и пометка источника <span class="small">— по каждому обзору, '+
    'включая черновики: оба ответа спрошены у отчётности, своих копий обзор не держит</span></h3>'+
    '<table class="cgrid"><thead><tr><th>Обзор</th><th>Охват выпуска</th><th>Пометка «числа поехали»'+
    '</th><th>Словами</th></tr></thead><tbody>'+
    list.map(r => {
      const sc = AN.reviewScope(r.no), mk = AN.reviewMark(r.no);
      const pill = (mk.ok && mk.marked) ? '<span class="pill warn">источник сдвинулся</span>'
        : mk.ok ? '<span class="pill ok">источник не двигался</span>'
        : '<span class="pill neutral">пометки не бывает</span>';
      return '<tr'+(mk.ok && mk.marked ? ' class="hl"' : '')+'><td class="mono">'+esc(r.no)+'</td>'+
        '<td class="small">'+(sc.ok
          ? 'подразделений '+sc.scope.length+' <span class="muted">('+sc.scope.map(esc).join(', ')+
            ')</span>; объектов '+(sc.objects == null ? '—' : sc.objects)
          : '<span class="muted">охвата ещё нет</span>')+'</td>'+
        '<td>'+pill+'</td><td class="small">'+esc(mk.why)+'</td></tr>'+
        (sc.ok ? '' : '<tr class="out"><td colspan="4" class="small">'+esc(sc.why)+'</td></tr>');
    }).join('')+'</tbody></table>'+
    '<div class="why">Охват — свойство ВЫПУСКА, а не поле обзора: свой экземпляр охвата разошёлся бы '+
    'с тем, в котором подписано. Пометка — тоже чужая: ставит её отчётность у выпуска, обзор её носит '+
    'и от неё не пересчитывается (АН-52, ИА-1, ИА-20).</div></div>';
}

/* Поручения собираются ВОПРОСОМ по каждому обзору: в записи обзора о них не сказано
   ничего, и ноль поручений печатается словами — у черновика и у утверждённого разными
   (ИА-11, ИА-14).                                                                    */
function reviewsTasksCard(list){
  const total = list.reduce((n, r) => { const t = AN.tasksOfReview(r.no); return n + (t.ok ? t.n : 0); }, 0);
  return '<div class="card"><h3>Что поручено по обзорам <span class="small">— всего поручений '+total+
    '; ответ СОБРАН вопросом, а не прочитан из записей</span></h3>'+
    '<table class="cgrid"><thead><tr><th>Обзор</th><th>Поручений</th><th>Словами</th></tr></thead>'+
    '<tbody>'+list.map(r => {
      const t = AN.tasksOfReview(r.no);
      return '<tr><td class="mono">'+esc(r.no)+'</td>'+
        '<td class="num">'+(t.ok ? t.n : '—')+'</td>'+
        '<td class="small">'+esc(t.why)+'</td></tr>';
    }).join('')+'</tbody></table>'+
    '<div class="why">Ссылка односторонняя: задача знает обзор, обзор о задачах не знает ничего. '+
    'Поэтому счётчика поручений в записи обзора нет, а ноль печатается словами — и у черновика он '+
    'значит другое, чем у утверждённого (ИА-11).</div></div>';
}

/* ЗАВЕДЕНИЕ ОБЗОРА ПРЯМО ЗДЕСЬ. Разрезы и показатели набираются РУКОЙ, а не выбираются из
   нашего списка, и это решение: какие разрезы объявлены — знает редакция шаблона, какие
   показатели состоят в реестре — знает статистика. Свой выпадающий список был бы третьим
   мнением о чужом составе и разошёлся бы с ними обоими. Ошибочное имя не теряется: на
   него отвечает словами сама операция и называет, что объявлено (ИА-7, ИА-19).      */
function reviewsNewCard(){
  const tpls = AN.templates();
  return '<div class="card"><h3>Завести обзор <span class="small">— заводится он здесь же, реестром, '+
    'и ссылается на шаблон отчётности</span></h3>'+
    '<div class="form-row"><div class="fld"><label>Шаблон отчётности</label>'+
      '<select id="nrTpl">'+tpls.map(t => '<option value="'+esc(t.code)+'">'+esc(t.code)+' · '+
        esc(t.name)+' ('+esc(t.owner)+(t.series ? '; динамика есть' : '; динамики нет')+')</option>')
        .join('')+'</select></div>'+
      '<div class="fld"><label>Период с</label><input id="nrFrom" value="2026-01-01"></div>'+
      '<div class="fld"><label>по</label><input id="nrTo" value="2026-06-30"></div>'+
      '<div class="fld"><label>Дата среза</label><input id="nrAsOf" value="2026-06-30"></div></div>'+
    '<div class="form-row" style="margin-top:10px">'+
      '<div class="fld"><label>Разрез разбивки</label><input id="nrBy" value="область"></div>'+
      '<div class="fld"><label>Закрепить разрез</label><input id="nrCutDim" placeholder="например: отрасль"></div>'+
      '<div class="fld"><label>значением</label><input id="nrCutVal" placeholder="например: услуги"></div>'+
      '<div class="fld" style="flex:1"><label>Показатели, через запятую</label>'+
      '<input id="nrInds" value="s-port, s-over"></div></div>'+
    '<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="AN.newReviewUI()">Завести обзор</button>'+
      '<button class="btn btn-secondary btn-sm" onclick="AN.newMixedReviewUI()">Завести обзор по услугам '+
      '(ШО-09, отрасль = услуги)</button>'+
      (AN.reviews().length ? '' : '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.seedReviews(), '+
        '\'обзоры витрины проведены настоящими операциями\')">Провести обзоры витрины</button>')+
      '</div>'+
    '<div class="why"><b>Список разрезов и показателей мы не предлагаем — и это не недоделанная '+
    'форма.</b> Что объявлено, знает редакция шаблона; что состоит в реестре на дату среза — '+
    'статистика. Наш выпадающий список стал бы третьим мнением о чужом составе. Ошибётесь именем — '+
    'операция ответит словами и назовёт объявленное (ИА-6, ИА-7). <b>Про услуги отдельно:</b> '+
    'смешанная фиксация — объект, часть договоров которого подтянулась позже даты снимка, — живёт в '+
    'отрасли «услуги», а ни один из трёх обзоров витрины услуг не режет: в витрине третье состояние '+
    'фиксации не всплывает. Кнопка рядом заводит такой обзор настоящей операцией — досеивать его в '+
    'витрину нельзя, номера обзоров идут подряд, а утверждение тратит у отчётности номер выпуска.</div>'+
    '</div>';
}

/* ЧТО ОТВЕТИТ ОПЕРАЦИЯ, ЕСЛИ НАЖАТЬ. Отказы не прячутся за отсутствием кнопки и не
   пересказываются экраном своими словами: экран СПРАШИВАЕТ операцию и печатает её ответ.
   Пересказ рано или поздно разошёлся бы с правилом, а спрятанная кнопка читается как
   забытая (ИА-19). Ни один из трёх вопросов ничего не записывает: все три отказывают до
   единой записи в состояние.                                                          */
function reviewsRefusalCard(){
  const empty = AN.newReview({});
  const badTpl = AN.newReview({tpl:'ШО-21', asOf:'2026-06-30',
    period:{from:'2026-01-01', to:'2026-06-30'}, by:'область', inds:['s-port']});
  const own = AN.tryOwnBuilder();
  const one = (title, res) => '<div class="refusal"><b>'+esc(title)+'</b><div class="small">'+
    esc(res.why)+'</div></div>';
  /* Проверки идут в порядке, и порядок этот виден: под ролью, которая обзоров не ведёт,
     до формы дело не доходит вовсе. Два одинаковых ответа рядом читались бы как сбой,
     поэтому совпадение НАЗЫВАЕТСЯ, а не оставляется читателю в загадку (ИА-19).      */
  const sameAnswer = badTpl.why === empty.why;
  return '<div class="card"><h3>Что ответит операция, если нажать <span class="small">— ответы '+
    'СПРОШЕНЫ у неё же и напечатаны как есть, а не пересказаны экраном</span></h3>'+
    one('«Завести обзор», не заполнив ничего — под ролью «'+AN.state.role+'»', empty)+
    one('«Завести обзор» по форме ШО-21 «Реестр договоров для сверки с казначейством»', badTpl)+
    (sameAnswer ? '<div class="small muted">Ответ тот же самый, и это не сбой показа: роль '+
      'проверяется ПЕРВОЙ, и под ролью «'+esc(AN.state.role)+'» до самой формы дело не доходит. '+
      'Переключите роль в шапке на отдел анализа — и второй вопрос ответит уже про годность '+
      'формы, а не про право.</div>' : '')+
    one('«Свой конструктор состава»', own)+
    '<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="AN.act(AN.newReview({}))">Завести обзор пустым</button>'+
    '<button class="btn btn-secondary btn-sm" onclick="AN.act(AN.tryOwnBuilder())">Свой конструктор состава</button></div>'+
    '<div class="why">Первый ответ меняется вместе с ролью в шапке: обзор ведёт отдел анализа, наравне '+
    'с ним — руководитель подразделения, и роль, которая обзоров не заводит, слышит об этом словами, а '+
    'не видит серую кнопку. Второй — про годность формы: пригодность под обзор объявляет отчётность '+
    'признаком, а не мы догадкой по составу. Третий стоит здесь навсегда: своего конструктора состава '+
    'среза у анализа нет и не будет (ИА-7, ADR-0154 §2).</div></div>';
}

function viewReviews(){
  const list = AN.reviews();
  if(!list.length)
    return '<h2 class="section-h">Обзоры портфеля · реестр <span class="pill neutral">обзоров нет'+
      '</span></h2>'+
      '<div class="page-lead">Реестр аналитических обзоров: суждения о <b>портфеле</b> за период — '+
      'шаблон отчётности с редакцией, срез статистики на дату, объяснение словами и одна подпись.</div>'+
      '<div class="banner info"><b>Обзоров в реестре нет — ни одного, и сказано это словами.</b> '+
      'Это не сбой показа и не пустая таблица, из которой читатель должен догадаться сам: реестр пуст, '+
      'потому что обзоров ещё не заводили. Пустое место и «ничего нет» на экране неотличимы, и различать '+
      'их обязан экран, а не читатель (ИА-14). Раздел при этом открыт и работает — завести обзор можно '+
      'прямо отсюда, формой ниже.</div>'+
      reviewsNewCard()+
      reviewsRefusalCard();
  const appr = list.filter(r => r.state === 'утверждено');
  const drafts = list.filter(r => r.state === 'черновик');
  return '<h2 class="section-h">Обзоры портфеля · реестр <span class="pill info">обзоров '+list.length+
      '</span> <span class="pill ok">утверждено '+appr.length+'</span> '+
      '<span class="pill neutral">черновиков '+drafts.length+'</span></h2>'+
    '<div class="page-lead">Реестр аналитических обзоров: в строке — только то, что обзор <b>хранит</b>, '+
    'то есть ссылки. Числа в реестр не выносятся вовсе: за ними идут в документ, где они спрашиваются '+
    'у статистики заново при каждом открытии (ИА-20).</div>'+
    '<div class="banner ok"><b>Раздел открыт и работает.</b> Основание у обзора появилось — шаблон '+
    'отчётности с редакциями на дату, — и обзор ссылается на него, состав не копируя. Своего '+
    'конструктора состава у анализа при этом не завелось и не заведётся: второй порядок сборки не '+
    'сошёлся бы с первым, и одна и та же цифра стала бы разной в отчёте и в обзоре (ИА-7, ADR-0154 §2).'+
    '</div>'+
    reviewsTable(list)+
    '<div class="why">Строка кликается: щелчок открывает <b>документ обзора</b> — тот же экран, что и '+
    'пункт меню «Обзор портфеля (документ)». Реестр и документ намеренно разведены: реестр отвечает на '+
    '«какие обзоры есть», документ — на «что в этом обзоре сказано», и числа живут только во втором.</div>'+
    reviewsSourceCard(list)+
    reviewsTasksCard(list)+
    reviewsNewCard()+
    reviewsRefusalCard();
}

/* --------------------------- ЗАПУСК --------------------------------- */
AN.seed();
/* Витрина обзоров зовётся ОТДЕЛЬНО от сброса состояния и только здесь: утверждение
   тратит у отчётности номер выпуска, и если бы затравка ехала внутри seed(), каждый
   сброс жёг бы чужую серию. Прогон смоука зовёт seed() сам и обзоров не получает —
   он их заводит настоящими операциями, потому что проверяет поведение, а не витрину. */
AN.seedReviews();
/* Наружу отдаются три двери: наш модуль и две чужие. Двери соседей вынесены
   отдельно намеренно — членами AN они не становятся: заглушка статистики и
   отчётности не часть анализа, она стоит рядом с ним (ADR-0146).              */
if(typeof window !== 'undefined'){ window.AN = AN; window.REP = REP; window.STAT = STAT; }
render();
</script>
</body>
</html>
