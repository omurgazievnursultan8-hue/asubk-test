  команды разработки, не прод-код. Экрана реструктуризации в живой системе нет — модуль
  проектируется с нуля.

  Канон логики: mockups/restructuring/ASUBK-restrukturizatsiya-logika.md (решения Р-1…Р-19).
  Регуляторная база: п.18–19 «Порядка мониторинга, взыскания и урегулирования
  задолженности ОАО "Госфинхолдинг"». Стиль сверен с mockups/collateral/zalog.html.
  Проверка: node scripts/inspect/restructuring-check.mjs

  РЕАЛИЗОВАННЫЕ РЕШЕНИЯ
   Р-1  Единица работы — ЗАЯВКА; якорь = ИНН; один ИНН на заявку.
   Р-2  Охват: только один ИНН; запрет кредита с другой активной заявкой (тост).
   Р-3  Справочник видов: разрешённые параметры + документы + режим просрочки;
        на заявке — объединение параметров/документов выбранных видов.
   Р-4  Конвейер 6 стадий; стадия ПРОИЗВОДНА от owned-фактов (stageOf).
   Р-5  Заключения (СРМиК/ДПО); куратор добавляет заключанта → новое требование гейта.
   Р-6  Комитет→Минфин: позиция необязывающая; письмо всегда (5 р.д.); решение Минфина
        канон, обязателен реквизит письма.
   Р-7  Дедлайны — производные от якоря стадии; просрочка = флаг+история, НЕ блокировка.
   Р-8  Оформление: доп. соглашение (номер+дата обязательны) активирует версию.
   Р-9  Капитализация / прощение — документированные операции на дату вступления
        (компенсирующие, не удаление).
   Р-10 Режим просрочки из вида: (1) в новый график + обнуление счётчика · (2) сохраняется.
   Р-11 Новые условия версии, поля ограничены объединением видов; diff-таблица.
   Р-12 Автоматика швов: пауза (весь процесс, 70 к.д.) + оверлей 181-го дня.
   Р-13 Пеня во время паузы продолжает начисляться (info-plate).
   Р-14 Оси заёмщика не трогаем; счётчик реструктуризаций на кредите +1.
   Р-15 Гейт обеспечения (coverGate) + waiver комиссии по залогу с обязательным основанием.
   Р-16 История append-only; ничего не удаляется/не переписывается.
   Р-17 6 ролей; права через canX(); чужое действие → тост.
   Р-18 5 демо-цепочек.
   Р-19 Зеркальная дисциплина: производное (дедлайны, гейты, покрытие, стадия) не хранится.

  ДЕМО-ОГРАНИЧЕНИЯ
   • «Сегодня» демо зафиксировано (TODAY) — счётчики дедлайнов считаются от него.
   • Рабочие дни для дедлайна письма — простой календарь (сб/вс), без праздников.
   • Расчёт графика — детерминированный аннуитет-упрощение (демонстрация «версия вперёд»),
     не банковский расчётный движок.
   • Мини-зеркало взыскания — read-only панель на демо-данных, навигация внутристраничная.

  ОТКРЫТЫЕ ВОПРОСЫ (спека §17)
   1. Приоритет при разных режимах просрочки у нескольких видов одной заявки.
   2. Источник производственного календаря праздников для дедлайна письма.
   3. Лимит повторов реструктуризации (счётчик растёт неограниченно).

<script>
"use strict";
/* ================= МОДЕЛЬ ДАННЫХ (owned-факты; производное НЕ хранится, Р-19) ============ */
const TODAY = '2026-07-19';                                   // «сегодня» демо
const PARAM_KEYS = [                                          // ключи параметров версии (Р-11)
  ['term','Срок, мес.'],['schedule','Периодичность'],['rate','Ставка, %'],
  ['grace','Льготные периоды'],['capInterest','Капитализация %'],['capPenalty','Капитализация штрафов'],
  ['forgive','Прощение санкций'],['dayMethod','Метод расчёта дней'],['base','База начисления'],
  ['nonworking','Обработка нерабочих дней'],['repayMethod','Метод погашения']
];
const PARAM_LABEL = Object.fromEntries(PARAM_KEYS);
/* Семь статей долга, порядок = очередь погашения (РС-13). principal — выводится (Модель демо §3), не сеется. */
const ARTICLES = [
  { key:'collectionCost', name:'Расходы взыскания' },
  { key:'fees',           name:'Сборы' },
  { key:'accInterest',    name:'Накопленные проценты', accrued:true },
  { key:'accPenalty',     name:'Накопленная пеня',      accrued:true },
  { key:'penalty',        name:'Пеня' },
  { key:'interest',       name:'Проценты' },
  { key:'principal',      name:'Основной долг', derived:true }
];
const ARTICLE_LABEL = Object.fromEntries(ARTICLES.map(a=>[a.key,a.name]));
const DISP_LABEL = { cap:'Капитализация', forgive:'Прощение', spread:'Распределение по периодам', none:'Без распоряжения' };
const URG = [ { key:'over', name:'просроченное' }, { key:'cur', name:'текущее' } ];    // срочность сжата до двух значений (РС-13)
/* Семь стадий текстом спеки (issues/04 реш.1): «Минфин» ушёл из лейблов — норма говорит про
   уполномоченный орган, не про конкретное министерство. Терминал «Закрыта» — не автомат по факту
   ДС, а свёртка трёх гейтов оформления (см. stageOf). */
const STAGES = ['Регистрация обращения','Анализ','Комитет','Письмо направлено','Решение уполномоченного органа','Оформление','Закрыта'];
const ROLES  = ['Куратор ОД','Заключант СРМиК','Заключант ДПО','Секретарь комитета','Администратор','Наблюдатель'];

/* права роли → действия (Р-17) */
const RIGHTS = {
  'Куратор ОД':      ['createApp','addCredit','toggleDoc','startAnalysis','returnApp','addConcl','fixLetter','fixMinfin','editVersion','editBase','regDS','waiver'],
  'Заключант СРМиК': ['editConcl:СРМиК'],

/* Справочник видов (Р-3). params — множество разрешённых ключей версии. allowedDispositions —
   коды распоряжений (issues/04 реш.4, заменяет overdueMode): какие распоряжения вид вообще
   допускает curator'у выбрать на статье; поля вне объединения по заявке рендерятся read-only
   «вид не разрешает» (pCalcBase). 'none' (без распоряжения) не перечисляется — доступен всегда. */
function seedKinds(){ return [
  { id:'K1', name:'Пролонгация', params:['term','schedule','nonworking'],
    docs:['Заявление','Обоснование причин','Финансовый прогноз'], allowedDispositions:['spread'], limits:'Не более +24 мес. к сроку' },
  { id:'K2', name:'Изменение графика', params:['schedule','grace','dayMethod','repayMethod'],
    docs:['Заявление','График-предложение'], allowedDispositions:['spread'], limits:'Тело долга не меняется' },
  { id:'K3', name:'Льготный период', params:['grace','schedule'],
    docs:['Заявление','Обоснование причин'], allowedDispositions:['spread'], limits:'Льгота ≤6 мес.' },
  { id:'K4', name:'Капитализация + прощение штрафов', params:['capInterest','capPenalty','forgive','term'],
    docs:['Заявление','Акт сверки','Решение комитета'], allowedDispositions:['cap','forgive'], limits:'Прощение только по санкциям' }
]; }
/* объединение разрешённых распоряжений выбранных видов заявки (issues/04 реш.4, тот же приём, что allowedParams) */
function allowedDispositions(app){ const s=new Set(); (app.kindIds||[]).forEach(id=>{ const k=kindById(id); if(k) (k.allowedDispositions||[]).forEach(d=>s.add(d)); }); return s; }

/* Транш и долг — базовый сев (Модель демо §01, реш.1-3): остаток НЕ хранится, выводится balanceAt
   поверх ops; шесть статей сеются данными, седьмая (principal) выводится. Базовые кредиты — один
   транш (сплита не было), историю прежних ДС несёт restructCount/audit, не число траншей; полная
   two-транш/три-ДС раскладка — только у демо-заявки (buildDemoApps/seedRestructChain, тикет 06 карты). */
function seedDebt(cr){
  const since = addCalDays(TODAY, -cr.odDays);
  return [
    { article:'collectionCost', urgency:'over', amount: cr.collProc ? Math.round(cr.odSum*0.03) : 0, since },  // демо-коэфф., не норма
    { article:'fees',           urgency:'over', amount: 0, since },
    { article:'accInterest',    urgency:'over', amount: cr.snapshot.accruedInterest, since },
    { article:'accPenalty',     urgency:'over', amount: 0, since },                                  // нет капитализации в базовом севе
    { article:'penalty',        urgency:'over', amount: cr.snapshot.penalty, since, disputed: !!cr.collProc },  // ИР-6: спорная пеня — мёртвая галка
    { article:'interest',       urgency:'cur',  amount: Math.max(0, cr.snapshot.accruedInterest - cr.snapshot.overdueInterest), since }
  ];
}
function mkTranche(cr){
  const ageMonths = cr.terms.term - cr.remainingTermMonths;
  const issued = addCalDays(TODAY, -30*ageMonths);
  const principal = cr.snapshot.principal + cr.paid.principalPaid;         // сумма освоения — восстановлена из известных чисел
  const ops = [ { date:issued, kind:'disburse', amount:principal, mirror:true, owner:'Кредит', basis:{doc:'Договор '+cr.no} } ];
  if(cr.paid.principalPaid) ops.push({ date:addCalDays(TODAY,-45), kind:'repay', amount:cr.paid.principalPaid, mirror:true, owner:'Платежи', basis:{alloc:'график'} });
  return {
    id:cr.id+'-T1', no:cr.no+'-Т1', subjectKey:cr.inn, amount:principal, plannedDate:issued, originalRate:cr.terms.rate,
    ops,
    schedules:[ { ver:1, validFrom:issued, by:{kind:'первичный', ref:cr.no}, rate:cr.terms.rate, rows:[] } ],
    conditionRecords:[ { effectiveFrom:issued, ...cr.terms } ],
    debt: seedDebt(cr),
    closed:null
  };
}
function seedAudit(cr){                            // историч. ДС до начала демо-периода (restructCount уже>0 на трёх кредитах)
  return Array.from({length:cr.restructCount}, (_,i)=>({
    type:'ДС применён', ds:`ДС-${cr.id}-${i+1}`, date:addCalDays(TODAY,-200*(cr.restructCount-i)),
    detail:'историч., до начала демо-периода', mirror:false
  }));
}
/* Кредиты (зеркала; остаток/просрочка read-only). coverSnapshot — чужой ответ (Залог), не
   собственный расчёт (issues/04 реш.2): {cover,required,date,source}, тот же приём, что снимок
   взыскания (collection.html, collSnapshotAge/collSnapshotStale). Числа cover ниже сохраняют
   прежнее соотношение collateralValue/balance один в один (не регрессия, только смена формы). */
function seedCredits(){
  const base = [
  { id:'CR-60540', no:'КД-60540', inn:'02508199700123', borrower:'ОсОО «Ак-Жол Агро»',
    balance:4200000, odDays:96, odSum:512000, collProc:'ВЗ-734', restructCount:1,
    coverSnapshot:{cover:145, required:120, date:'2026-07-05', source:'Залог'}, insuredUntil:'2027-03-01', tech:true, techAgeYears:6, techMaxAge:12,
    snapshot:{ principal:4200000, overduePrincipal:380000, accruedInterest:118000, overdueInterest:118000, penalty:73000 },
    paid:{ principalPaid:800000, interestPaid:340000, penaltyPaid:0 }, remainingTermMonths:22,
    terms:{term:36,schedule:'ежемесячно',rate:8,grace:'нет',dayMethod:'факт/факт',base:'остаток',nonworking:'перенос вперёд',repayMethod:'аннуитет'} },
  { id:'CR-60541', no:'КД-60541', inn:'02508199700123', borrower:'ОсОО «Ак-Жол Агро»',
    balance:1850000, odDays:96, odSum:210000, collProc:'ВЗ-734', restructCount:1,
    coverSnapshot:{cover:111, required:120, date:'2026-07-08', source:'Залог'}, insuredUntil:'2026-10-01', tech:true, techAgeYears:9, techMaxAge:12,
    snapshot:{ principal:1850000, overduePrincipal:150000, accruedInterest:52000, overdueInterest:52000, penalty:31000 },
    paid:{ principalPaid:300000, interestPaid:120000, penaltyPaid:0 }, remainingTermMonths:14,
    terms:{term:24,schedule:'ежемесячно',rate:9,grace:'нет',dayMethod:'факт/факт',base:'остаток',nonworking:'перенос вперёд',repayMethod:'аннуитет'} },
  { id:'CR-58120', no:'КД-58120', inn:'01703198800077', borrower:'ИП Садыков Т.',
    balance:980000, odDays:34, odSum:44000, collProc:null, restructCount:0,

  { id:'CR-59003', no:'КД-59003', inn:'01703198800077', borrower:'ИП Садыков Т.',
    balance:2650000, odDays:220, odSum:390000, collProc:'ВЗ-701', restructCount:2,
    coverSnapshot:{cover:125, required:120, date:'2026-06-20', source:'Залог'}, insuredUntil:'2027-06-01', tech:false, techAgeYears:0, techMaxAge:0,
    snapshot:{ principal:2650000, overduePrincipal:620000, accruedInterest:96000, overdueInterest:96000, penalty:84000 },
    paid:{ principalPaid:500000, interestPaid:210000, penaltyPaid:15000 }, remainingTermMonths:16,

  { id:'CR-61200', no:'КД-61200', inn:'02508199700123', borrower:'ОсОО «Ак-Жол Агро»',
    balance:3100000, odDays:12, odSum:0, collProc:null, restructCount:0,
    coverSnapshot:{cover:129, required:120, date:'2026-07-12', source:'Залог'}, insuredUntil:'2029-01-01', tech:false, techAgeYears:0, techMaxAge:0,

/* Процессы взыскания (read-only зеркало, Р-12). */
const COLL_PROCS = {
  'ВЗ-734': { id:'ВЗ-734', inn:'02508199700123', phase:'Претензия', catDays:96, paused:false, pausedBy:null },
  'ВЗ-701': { id:'ВЗ-701', inn:'01703198800077', phase:'Иск', catDays:220, paused:false, pausedBy:null }
};

/* Зеркало субъектов (read-only, ADR-0019): якорь — плоская строка-ключ, не ИНН напрямую.
   Слияние (aliasOf) резолвится в один корень; реорганизация (successorOf) — нет, два живых ключа. */
const MIRROR = {
  subjects: [
    { key:'02508199700123', name:'ОсОО «Ак-Жол Агро»', aliasOf:null },
    { key:'02508199700099', name:'ОсОО «Ак-Жол» (прежнее наим., слито)', aliasOf:'02508199700123' },
    { key:'02508199700321', name:'ОсОО «Ак-Жол Строй»', aliasOf:null, successorOf:'02508199700123', since:'2026-03-12' }
  ]
};
function resolveKey(key){                              // ключ → корень слияния; реорганизацию не резолвит (оба ключа живы)
  const s = MIRROR.subjects.find(s=>s.key===key);
  return (s && s.aliasOf) ? resolveKey(s.aliasOf) : key;
}
function keysOf(anchorKey){                             // корень → все ключи, слитые в него
  const root = resolveKey(anchorKey);
  return MIRROR.subjects.filter(s=>resolveKey(s.key)===root).map(s=>s.key);
}

/* ---- утилиты дат (Р-7): производные счётчики, ничего не хранится ---- */
const D = s => new Date(s+'T00:00:00Z');
const daysBetween = (a,b) => Math.round((D(b)-D(a))/86400000);
function addCalDays(s,n){ const d=D(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function addWorkDays(s,n){ let d=D(s),added=0; while(added<n){ d.setUTCDate(d.getUTCDate()+1); const wd=d.getUTCDay(); if(wd!==0&&wd!==6) added++; } return d.toISOString().slice(0,10); }
const fmt = n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2= n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= ДВИЖОК ТРАНША — CreditSide (РС-9: граница внутри файла, не сетевой шов) ===== */
const round2 = x => Math.round((Number(x)||0)*100)/100;
function periodMonths(schedule){
  return schedule==='ежеквартально' ? 3
       : schedule==='раз в полугодие' ? 6
       : schedule==='ежегодно' ? 12 : 1;                // дефолт «ежемесячно»
}
/* Амортизация — приватный движок (issues/01, реш.5): тело `base`, годовая ставка `rate`, срок
   `termMonths`, метод, блоки льгот, дата отсчёта, периодность. graceBlocks = [{months:Int,
   type:'interest-only'|'moratorium'}]. Демо: месяц = 30 дней, не прод-начисление (карта, «Не-цели»). */
function amortize(base, rate, termMonths, method, graceBlocks, fromDate, schedule){
  const p = periodMonths(schedule||'ежемесячно');
  const i = (Number(rate)||0)/100 * p/12;
  const nTotal = Math.max(1, Math.round((Number(termMonths)||0)/p));
  let gMor=0, gIo=0;
  (graceBlocks||[]).forEach(b=>{ const per=Math.round((b.months||0)/p);
    if(b.type==='moratorium') gMor+=per; else gIo+=per; });
  const m = Math.max(1, nTotal - gMor - gIo);
  const dateAt = idx => addCalDays(fromDate, idx * 30 * p);
  const rows=[]; let k=0;
  let baseAmort = base, morCap = 0;
  if(gMor>0){ baseAmort = base*Math.pow(1+i,gMor); morCap = round2(baseAmort - base); }
  for(let j=0;j<gMor;j++){ k++;
    rows.push({n:k,date:dateAt(k),pay:0,principal:0,interest:0,balance:round2(base),phase:'мораторий'}); }
  for(let j=0;j<gIo;j++){ k++;
    const interest = round2(baseAmort*i);
    rows.push({n:k,date:dateAt(k),pay:interest,principal:0,interest,balance:round2(baseAmort),phase:'льгота'}); }
  let bal = round2(baseAmort);
  if(method==='дифференцированный'){
    const prConst = round2(baseAmort/m);
    for(let j=0;j<m;j++){ k++;
      const interest = round2(bal*i);
      const principal = (j===m-1) ? bal : prConst;
      const pay = round2(principal + interest);
      bal = round2(bal - principal);
      rows.push({n:k,date:dateAt(k),pay,principal,interest,balance:round2(Math.max(bal,0))});
    }
  } else {                                              // аннуитет (дефолт)
    const A = i>0 ? baseAmort*i/(1-Math.pow(1+i,-m)) : baseAmort/m;
    const Ar = round2(A);
    for(let j=0;j<m;j++){ k++;
      const interest = round2(bal*i);
      const principal = (j===m-1) ? bal : round2(Ar - interest);
      const pay = (j===m-1) ? round2(principal + interest) : Ar;
      bal = round2(bal - principal);
      rows.push({n:k,date:dateAt(k),pay,principal,interest,balance:round2(Math.max(bal,0))});
    }
  }
  return { rows, morCap, meta:{p,i,nTotal,gMor,gIo,m,baseAmort} };
}

/* Остаток транша — формула поверх журнала ops, не поле (ИР-3 стал определением). Чужие записи
   (mirror:true) участвуют в сумме наравне со своими — знак определяет kind, не owner. */
function balanceAt(t,d){
  return round2((t.ops||[]).filter(o=>o.date<=d).reduce((s,o)=>{
    if(o.kind==='disburse'||o.kind==='transfer_in') return s+o.amount;
    if(o.kind==='repay'||o.kind==='transfer_out')   return s-o.amount;
    return s;
  },0));
}
/* Версия графика, действующая на дату d — последняя с validFrom≤d; конец выводится (validTo), не хранится. */
function scheduleAt(t,d){
  const vs=(t.schedules||[]).filter(v=>v.validFrom<=d);
  return vs.length ? vs.reduce((a,b)=>b.validFrom>a.validFrom?b:a) : null;
}
function validTo(t,ver){
  const next=(t.schedules||[]).filter(v=>v.validFrom>ver.validFrom).sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0];
  return next ? addCalDays(next.validFrom,-1) : null;         // null = действует по сей день
}
/* Условия на дату d — свёртка записей с effectiveFrom≤d, поздние поля перекрывают ранние (credit.html, :1699). */
function conditionsAt(t,d){
  return (t.conditionRecords||[]).filter(r=>r.effectiveFrom<=d)
    .sort((a,b)=>a.effectiveFrom<b.effectiveFrom?-1:1)
    .reduce((acc,r)=>Object.assign(acc,r),{});
}
/* Основной долг на дату d — седьмая статья, всегда выводится (issues/01, реш.3): просроченная часть —
   план графика минус фактическое погашение; связь repay↔строки графика пока по сумме (issues/02, новый
   открытый вопрос от 01) — точнее, чем строчная привязка, здесь не требуется (демо). */
function principalAt(t,d){
  const bal=balanceAt(t,d);
  const ver=scheduleAt(t,d);
  const plannedOver=round2(((ver&&ver.rows)||[]).filter(r=>r.date<d).reduce((s,r)=>s+(r.principal||0),0));
  const repaid=round2((t.ops||[]).filter(o=>o.kind==='repay'&&o.date<=d).reduce((s,o)=>s+o.amount,0));
  const over=round2(Math.min(Math.max(plannedOver-repaid,0), bal));
  return { over, cur: round2(bal-over) };
}

/* Чистый предпросмотр — не пишет ничего (issues/01: «черновик остаётся историческим объектом заявки»,
   ADR-0042). ds несёт date/transferSum/params{rate,term,method,schedule,graceBlocks}. */
function draftSchedule(tranche, ds){
  const base = ds.transferSum!=null ? Number(ds.transferSum) : balanceAt(tranche, ds.date);
  const p = ds.params||{};
  const rate = p.rate!=null ? p.rate : tranche.originalRate;
  return amortize(base, rate, p.term, p.method, p.graceBlocks||[], ds.date, p.schedule);
}
/* Предпосылки до первой записи (ИР-2 и прочие) — свод-баннер, а не тост (packetGate/conclGate/
   minfinGate — существующие гейты конвейера, issues/03). */
function validateDS(ds){
  const reasons=[];
  if(!ds.app || !ds.sourceTranche || !ds.credit){ reasons.push('Не выбраны заявка, транш-источник или кредит'); return reasons; }
  if(!packetGate(ds.app).ok) reasons.push('Пакет документов не собран');
  if(!conclGate(ds.app).ok)  reasons.push('Не все заключения завизированы');
  if(!minfinGate(ds.app).ok) reasons.push('Нет решения Минфина');
  const lg=limitsGate(ds.params, ds.credit, ds.date); if(!lg.ok) reasons.push(...lg.messages);                 // жёсткий, без waiver (issues/04)
  const cg=consentGateApp(ds.app); if(!cg.ok) reasons.push('Не получено согласие обеспечителя(ей): '+cg.pending.join(', '));  // жёсткий, без waiver
  const draft=draftSchedule(ds.sourceTranche, ds);
  const sumPrincipal=round2((draft.rows||[]).reduce((s,r)=>s+(r.principal||0),0));
  if(Math.abs(sumPrincipal-Number(ds.transferSum||0))>0.5)
    reasons.push('Сумма графика ('+fmt(sumPrincipal)+') не совпадает с суммой переноса ('+fmt(ds.transferSum)+')');       // ИР-2
  const dates=(draft.rows||[]).map(r=>r.date);
  for(let k=1;k<dates.length;k++) if(!(dates[k]>dates[k-1])){ reasons.push('Даты графика не строго возрастают'); break; }
  const term=Number(ds.params&&ds.params.term)||0;
  if(term>0){ const termEnd=addCalDays(ds.date, term*30);
    if(dates.length && dates[dates.length-1]>termEnd) reasons.push('Последняя дата графика позже конца срока ДС'); }
  return reasons;
}
/* Опустошённый транш-источник закрывается, причина ВЫВЕДЕНА обнулившей операцией, не введена (ИР-5). */
function closeIfEmptied(tranche, ds){
  if(round2(balanceAt(tranche, ds.date))<=0) tranche.closed={ date:ds.date, by:ds.no, reason:'перенос' };
}
/* Единственная пишущая дверь (ADR-0083, issues/03): валидация → 1 производный транш → 2 перенос
   (зеркальная пара transfer_out/transfer_in) → 3 версия графика на новый транш → 4 условия (несутся
   вместе с траншем в conditionRecords) → 5 закрытие опустошённого источника → 6 счётчик + одна запись
   аудита. `tranche.ops.push` вне этой функции быть не должно (граница grep-проверяема). */
function restructureApplied(ds){
  const reasons=validateDS(ds);
  if(reasons.length) return { ok:false, reasons };

  const src=ds.sourceTranche, credit=ds.credit;
  const draft=draftSchedule(src, ds);

  const seq=credit.tranches.length+1;                                       // 1. производный транш
  const newT={
    id:credit.id+'-T'+seq, no:credit.no+'-Т'+seq, subjectKey:src.subjectKey,
    amount:Number(ds.transferSum), plannedDate:ds.date,
    originalRate:(ds.params&&ds.params.rate!=null)?ds.params.rate:src.originalRate,
    ops:[ { date:ds.date, kind:'transfer_in', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, from:src.id} } ],
    schedules:[],
    conditionRecords:[ { effectiveFrom:ds.date, ...conditionsAt(src, ds.date), ...(ds.params||{}) } ],
    debt:[],                                     // долг переносится суммой (transferSum), не построчно — сумма видна в акте ДС
    closed:null
  };
  credit.tranches.push(newT);

  src.ops.push({ date:ds.date, kind:'transfer_out', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, to:newT.id} });  // 2. перенос

  newT.schedules.push({ ver:1, validFrom:ds.date, by:{kind:'ДС', ref:ds.no}, rate:ds.params&&ds.params.rate, rows:draft.rows });  // 3. версия графика

  closeIfEmptied(src, ds);                                                  // 5. закрытие опустошённого транша (условия — шаг 4, см. conditionRecords выше)

  credit.restructCount+=1;                                                  // 6. счётчик + одна запись аудита (не шесть)
  credit.audit.push({ type:'ДС применён', ds:ds.no, date:ds.date, detail:'Транш '+src.no+' → '+newT.no+', перенесено '+fmt(ds.transferSum), mirror:false });

  return { ok:true, tranche:newT };
}
const CreditSide = { balanceAt, scheduleAt, validTo, conditionsAt, principalAt, draftSchedule, restructureApplied };

/* ================= ПРОИЗВОДНЫЕ (Р-19: считаем, не храним) ================= */
const creditById = id => state.credits.find(c=>c.id===id);
const kindById   = id => state.kinds.find(k=>k.id===id);
const appById    = id => state.apps.find(a=>a.id===id);

/* объединение разрешённых параметров выбранных видов (Р-3 ↔ Р-11) */
function allowedParams(app){ const s=new Set(); app.kindIds.forEach(id=>{ const k=kindById(id); if(k) k.params.forEach(p=>s.add(p)); }); return s; }
/* объединение требуемых документов (Р-3, гейт стадии 1) */
function requiredDocs(app){ const s=new Set(); app.kindIds.forEach(id=>{ const k=kindById(id); if(k) k.docs.forEach(d=>s.add(d)); }); return [...s]; }

/* стадия — производная от owned-фактов (Р-4). ДС зарегистрировано ≠ «Закрыта» (issues/04 реш.1,
   ИР-9): терминал наступает только когда все три гейта оформления (согласия РС-17, покрытие/waiver
   РС-18, регуляторные пределы РС-19) пройдены — иначе стадия честно остаётся «Оформление», хоть
   ДС уже стоит. formalGatesOk читает те же три гейта, что и вкладка «Оформление». */
function formalGatesOk(app){
  return consentGateApp(app).ok && limitsGateApp(app).ok && (coverGateApp(app).ok || !!(app.waiver && app.waiver.granted));
}
function stageOf(app){
  if(app.outcome==='возврат') return {idx:0, closed:true, label:'Возвращена без рассмотрения'};
  if(app.ds && app.ds.no){
    return formalGatesOk(app)
      ? {idx:6, closed:true, label:'Закрыта'}
      : {idx:5, closed:false, label:'Оформление'};    // ДС стоит, но не все гейты закрытия пройдены — честно не терминал
  }
  if(app.outcome==='отказ')   return {idx:4, closed:true, label:'Отказ Минфина'};
  if(app.minfin && app.minfin.fixed) return {idx:5, closed:false, label:'Оформление'};
  if(app.letterSent && app.letterSent.fixed) return {idx:3, closed:false, label:'Письмо направлено'};
  if(app.committee && app.committee.fixed)   return {idx:2, closed:false, label:'Комитет'};
  if(app.analysisStarted)     return {idx:1, closed:false, label:'Анализ'};
  return {idx:0, closed:false, label:'Регистрация обращения'};
}

/* Норма-справочник (issues/04 реш.2, ADR-0086, ИР-10): запись — величина+пункт+редакция+дата
   начала действия, не голое число в коде. Расширяет прецедент DEADLINE_TEMPLATES (collection.html)
   двумя полями (edition/dateFrom). Смена редакции — НОВАЯ запись поверх старой (normAt берёт
   последнюю applicable на дату), старую не правим. edition:null — редакция Положения (гл.9,
   пп.89/92) не подтверждена (письмо заказчику вопрос 8, «не выдумывать номер»): гейты, читающие
   termCap/rateFloor, обязаны показать «пункт не подтверждён» рядом с числом (normNote). Три
   регламентных срока читают Порядок №41 от 06.07.2026 — та же редакция, что уже в шапке спеки. */
const NORM_REFERENCE = [
  { code:'termCap', point:'90', origin:'Положение о работе с бюджетными кредитами, гл.9', edition:null, dateFrom:null,
    value:[ {upTo:1000000, months:36}, {upTo:10000000, months:84}, {upTo:20000000, months:120}, {upTo:50000000, months:144}, {upTo:Infinity, months:180} ] },
  { code:'rateFloor', point:'92', origin:'Положение о работе с бюджетными кредитами, гл.9', edition:null, dateFrom:null,
    value:0.5 },
  { code:'deadlineAnalysis', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:30, unit:'к.д.', label:'Анализ'} },
  { code:'deadlineLetter', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:5, unit:'р.д.', label:'Письмо уполномоченному органу'} },
  { code:'deadlineDecision', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:70, unit:'к.д.', label:'Решение уполномоченного органа'} }
];
function normAt(code, date){                      // запись, действующая на дату — последняя applicable, не первая по массиву
  const recs=NORM_REFERENCE.filter(r=>r.code===code);
  const applicable=recs.filter(r=>!r.dateFrom || r.dateFrom<=date);
  if(!applicable.length) return recs[0]||null;
  return applicable.reduce((a,b)=> (!a.dateFrom || (b.dateFrom && b.dateFrom>a.dateFrom)) ? b : a);
}
function normNote(rec){                            // цитата для UI — «не подтверждён», если редакция неизвестна
  if(!rec) return 'норма не найдена';
  return rec.edition
    ? `п. ${rec.point}, ред. ${rec.edition} от ${rec.dateFrom}`
    : `п. ${rec.point} — пункт не подтверждён (редакция не установлена, письмо заказчику, вопрос 8)`;
}
function termCapFor(sum, date){ const rec=normAt('termCap', date); const step=(rec.value||[]).find(s=>sum<s.upTo); return { months:(step||rec.value[rec.value.length-1]).months, rec }; }
function rateFloorFor(origRate, date){ const rec=normAt('rateFloor', date); return { floor: round2((Number(origRate)||0)*rec.value), rec }; }

/* дедлайн активной стадии (Р-7), сроки — из норма-справочника, не литералы */
function deadline(app){
  const st = stageOf(app); if(st.closed) return null;
  if(st.idx===1) { const rec=normAt('deadlineAnalysis',app.regDate); const due=addCalDays(app.regDate,rec.value.n); return mkDl(rec,app.regDate,due); }
  if(st.idx===2) { if(app.committee&&app.committee.date){ const rec=normAt('deadlineLetter',app.committee.date); const due=addWorkDays(app.committee.date,rec.value.n); return mkDl(rec,app.committee.date,due);} return null; }
  if(st.idx===3) { if(app.letterSent&&app.letterSent.date){ const rec=normAt('deadlineDecision',app.letterSent.date); const due=addCalDays(app.letterSent.date,rec.value.n); return mkDl(rec,app.letterSent.date,due);} return null; }
  return null;
}
function mkDl(rec,anchor,due){ const rem=daysBetween(TODAY,due); return {name:rec.value.label,limit:rec.value.n,unit:rec.value.unit,anchor,due,remaining:rem,overdue:rem<0,rec}; }

/* гейты (Р-19: производные предикаты) */
function packetGate(app){ const req=requiredDocs(app); const missing=req.filter(d=>!app.packetDocs[d]); return {ok:missing.length===0 && req.length>0, missing, req}; }
function conclGate(app){ const pending=app.conclusions.filter(c=>!c.visa).map(c=>c.dept); return {ok:pending.length===0 && app.conclusions.length>0, pending}; }
function minfinGate(app){ const m=app.minfin||{}; return {ok:!!m.decision && !!(m.letterRef&&m.letterRef.trim())}; }
function dsGate(app){ const d=app.ds||{}; return {ok:!!(d.no&&d.no.trim()) && !!(d.date&&d.date.trim())}; }

/* остаток на новых условиях (демо-упрощение): тело то же, влияет срок/ставка на maturity */
function newMaturity(app,cr){ const term=(app.version&&app.version.params.term)||cr.terms.term; return addCalDays(app.regDate, term*30); }
/* Устарелость снимка покрытия (issues/04 реш.2: «покрытие — чужой ответ, не свой расчёт»), тот
   же приём, что COLL_SNAPSHOT_STALE_DAYS/collSnapshotStale в collection.html — независимый
   демо-порог этого домена, не то же число по смыслу. Устаревший снимок гейт не пропускает молча
   (тот же принцип, что не даёт «сироте 0,01 сома» E2E-13/14 пройти на устаревших данных). */
const COVER_SNAPSHOT_STALE_DAYS = 60;
const coverSnapshotAge = cr => daysBetween((cr.coverSnapshot||{}).date||TODAY, TODAY);
const coverSnapshotStale = cr => !cr.coverSnapshot || coverSnapshotAge(cr) > COVER_SNAPSHOT_STALE_DAYS;
function coverGate(app,cr){
  const snap = cr.coverSnapshot||{};
  const stale = coverSnapshotStale(cr);
  const required = snap.required, cover = snap.cover;
  const coverOk = !stale && cover!=null && required!=null && cover >= required;
  const mat = newMaturity(app,cr);
  const ageOk = !cr.tech || (cr.techAgeYears + Math.ceil(((app.version&&app.version.params.term)||cr.terms.term)/12) <= cr.techMaxAge);
  const insured = daysBetween(mat, cr.insuredUntil) >= 0;
  const waived = !!(app.waiver && app.waiver.granted);
  const ok = (coverOk && ageOk && insured) || waived;
  return {required,cover,coverOk,ageOk,insured,waived,ok,maturity:mat,stale,snapshotDate:snap.date,source:snap.source};
}
/* агрегат гейта обеспечения по всем кредитам заявки */
function coverGateApp(app){ const rows=app.creditIds.map(id=>({cr:creditById(id),g:coverGate(app,creditById(id))})); const ok=rows.every(r=>r.g.ok); return {rows,ok}; }

/* Пределы (issues/04 реш.2/3, ADR-0086, ИР-10, РС-19): жёсткий гейт, без waiver — срок и ставка
   новых условий сверяются с норма-справочником на дату операции. База предела срока — баланс
   кредита (cr.balance, тот же приём, что coverGate несколькими строками выше), а не сумма
   конкретного переноса: предел — свойство кредита в целом, а партиционный перенос (ADR-0079)
   моложе самой нормы — цена операции внутри кредита её не меняет. */
function limitsGate(params, credit, date){
  const term=Number(params&&params.term)||0;
  const rate=(params&&params.rate!=null) ? Number(params.rate) : null;
  const cap=termCapFor(credit.balance, date), floor=rateFloorFor(credit.terms.rate, date);
  const termOk = term>0 && term<=cap.months;
  const rateOk = rate!=null && rate>=floor.floor;
  const messages=[];
  if(!termOk) messages.push('Срок '+term+' мес. превышает предел '+cap.months+' мес. для баланса '+fmt(credit.balance)+' ('+normNote(cap.rec)+')');
  if(!rateOk) messages.push('Ставка '+(rate==null?'не задана':rate+'%')+' ниже минимума '+floor.floor+'% ('+normNote(floor.rec)+')');
  return { ok:termOk&&rateOk, termOk, rateOk, cap:cap.months, floor:floor.floor, capRec:cap.rec, floorRec:floor.rec, messages };
}
/* превью гейта на уровне заявки — до ДС читает черновик version.params, после ДС читает
   зафиксированные app.ds.params, чтобы терминал (formalGatesOk) не «моргал» после факта */
function limitsGateApp(app){
  const credit=creditById(app.creditIds[0]); if(!credit) return { ok:true, pending:true, messages:['Кредит не выбран'] };
  const fixed=app.ds&&app.ds.no;
  const params = fixed ? app.ds.params : (app.version&&app.version.params);
  const date = fixed ? app.ds.date : app.regDate;
  if(!params) return { ok:true, pending:true, messages:['Условия ещё не выбраны — гейт неприменим до расчёта'] };
  return limitsGate(params, credit, date);
}

/* Согласия обеспечителей (issues/04 реш.2, ADR-0085, ИР-8): зеркало чужого домена (Обеспечение) —
   тот же приём, что COLL_PROCS чуть выше по файлу: демо-данные здесь, не вызов чужого API. Жёсткий
   гейт, без waiver (в отличие от покрытия) — по каждому кредиту заявки все обеспечители обязаны
   быть в статусе «согласовано». */
const GUARANTEES = {
  'CR-60540': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-03-15'} ],
  'CR-60541': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-04-20'} ],
  'CR-58120': [],
  'CR-59003': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-06-01'} ],
  'CR-61200': [ {name:'Петров П.П. (поручитель)', status:'запрошено', date:'2026-07-05'} ]   // демо блокировки ИР-8: одно неурегулированное согласие
};
function consentGate(creditId){
  const list=GUARANTEES[creditId]||[];
  const pending=list.filter(g=>g.status!=='согласовано').map(g=>g.name);
  return { ok:pending.length===0, list, pending };
}
function consentGateApp(app){
  const rows=(app.creditIds||[]).map(id=>({cr:creditById(id), g:consentGate(id)}));
  const ok=rows.every(r=>r.g.ok);
  return { ok, rows, pending:rows.flatMap(r=>r.g.pending) };
}

/* активная заявка на кредите (Р-2): любая незакрытая заявка, кроме текущей */
function activeAppOnCredit(creditId, exceptAppId){
  return state.apps.find(a=>a.id!==exceptAppId && !stageOf(a).closed && a.creditIds.includes(creditId));
}
function canAdvance(app){
  const st=stageOf(app);
  if(st.idx===0) return {to:'Анализ', ok:packetGate(app).ok, why:'Пакет документов неполон'};
  if(st.idx===1) return {to:'Комитет', ok:conclGate(app).ok && app.creditIds.length>0, why:'Не все заключения завизированы / пустой охват'};
  return null;
}

/* права (Р-17) */
function canX(action){ return (RIGHTS[state.role]||[]).includes(action); }
function guard(action){ if(!canX(action)){ toast('Роль «'+state.role+'» не может выполнить это действие','err'); return false; } return true; }

/* ================= ФИНАНСОВОЕ ЯДРО ЗАЯВКИ — AppSide (issues/02: ядро — таблица позиций,
   не набор чисел; порядок и происхождение выражены данными, а не чертой текста). Приватно
   для файла (РС-9 — граница внутри файла, не сетевой шов): «приватно» значит вне RS-экспорта
   (задача 8), не отдельный модуль/замыкание — по духу карты, лишняя абстракция не нужна. */

/* Срез/факт — один счётчик на любую дату (issues/02 реш.2). Шесть статей — со среза транша
   (tranche.debt, демо не считает реальное начисление во времени, см. «Не-цели» карты: месяц =
   30 дней, движок не прод); седьмая (principal) выводится CreditSide.principalAt — единственная
   статья, которая в этом демо реально зависит от даты. */
function debtAt(tranche, date){
  const rows = (tranche.debt||[]).map(d=>({ article:d.article, urgency:d.urgency, amount:d.amount, since:d.since, disputed:!!d.disputed }));
  const { over, cur } = CreditSide.principalAt(tranche, date);
  if(over>0) rows.push({ article:'principal', urgency:'over', amount:over, since:tranche.plannedDate });
  if(cur>0)  rows.push({ article:'principal', urgency:'cur',  amount:cur,  since:tranche.plannedDate });
  return rows;
}

/* База — позиции с тремя состояниями строки (issues/02 реш.1): включена · снята куратором
   (blockedBy пуст, чекбокс живой) · заблокирована видом (чекбокс мёртв). Список статей,
   разрешённых видом, заводит issues/04 (allowedDispositions) — тикет 07, сюда 06 не блокирован
   этим решением: честно не подставляем номер, blockedBy по виду всегда null, не выдумка.
   Спорная пеня (issues/01 реш.3, поле disputed) — та же колонка blockedBy='disputed', галка
   мертва, строка всегда видна (ИР-6: невидимая строка читалась бы как «пени нет»).
   app.calcTranche — транш, выбранный под расчёт ДС; заводит тикет 05/задача 5 (buildDemoApps). */
function defaultBase(app, date){
  const tranche = app.calcTranche;
  if(!tranche) return [];
  return debtAt(tranche, date).map(row => ({
    ...row,
    included: row.urgency==='over' && !row.disputed,
    blockedBy: row.disputed ? 'disputed' : null
  }));
}
/* Распоряжение — на позицию, одно, с суммой (issues/02 реш.4). Остаток «без распоряжения»
   получается вычитанием суммы распоряжения из позиции, второй сущности не заводим. */
function defaultDispositions(base){
  return base.filter(r=>r.included).map(r => ({ article:r.article, urgency:r.urgency, kind:'none', amount:r.amount, periods:null }));
}
function dispositionFor(dispositions, article, urgency){
  return (dispositions||[]).find(d=>d.article===article && d.urgency===urgency) || null;
}
/* Материализация базы/распоряжений при первом живом действии куратора (issues/02 реш.1/4,
   тикет 07 — честная дыра #2 из Answer тикета 06). До первого клика app.base/app.dispositions
   пустые — панель считает defaultBase/defaultDispositions на лету, не хранит (Р-19); первое
   переключение строки или смена распоряжения обязано зафиксировать снимок в app, иначе правка
   потеряется на следующем рендере, откатившись к умолчанию. */
function ensureBaseDispositions(app){
  const date = app.ds ? app.ds.date : TODAY;
  if(!app.base || !app.base.length) app.base = defaultBase(app, date);
  if(!app.dispositions || !app.dispositions.length) app.dispositions = defaultDispositions(app.base);
}
/* Переключение строки — «включена» ↔ «снята куратором» (issues/02 реш.1). Спорная пеня
   (blockedBy='disputed') не переключаема — мёртвая галка это состояние, а не UI-заглушка
   (ИР-6). Снятие строки убирает её распоряжение (issues/02 реш.4: распоряжение живёт только
   на включённой строке); включение заводит распоряжение kind:'none' на всю сумму — то же
   умолчание, что defaultDispositions даёт при первом расчёте. */
function toggleBaseRow(appId, article, urgency){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  const row = app.base.find(r=>r.article===article && r.urgency===urgency);
  if(!row || row.blockedBy) return;
  row.included = !row.included;
  if(row.included){
    if(!dispositionFor(app.dispositions, article, urgency)) app.dispositions.push({article,urgency,kind:'none',amount:row.amount,periods:null});
  } else {
    app.dispositions = app.dispositions.filter(d=>!(d.article===article && d.urgency===urgency));
  }
  app._t=TODAY; render();
}
/* Смена распоряжения на строке (issues/02 реш.4). Значения вне allowedDispositions(app) —
   мёртвые пункты списка с подписью «вид не разрешает», та же механика дохлой галки решения 1
   (issues/02: «а не второй способ говорить то же самое») — сервер-сторона всё равно отбивает
   запрещённое значение молча, а не доверяет disabled-атрибуту разметки. */
function setDisposition(appId, article, urgency, kind){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  if(kind!=='none' && !allowedDispositions(app).has(kind)){ toast('Вид не разрешает это распоряжение','err'); return; }
  const d = dispositionFor(app.dispositions, article, urgency); if(!d) return;
  d.kind = kind;
  app._t=TODAY; render();
}

/* Кандидаты в транш-источник расчёта — открытые транши с положительным остатком по каждому
   кредиту охвата заявки (тикет 07 — честная дыра #3 из Answer тикета 06: выбор транша не был
   вручную сделан, стоял только демо-сидом). Закрытый или обнулённый транш не кандидат — его
   не из чего дальше делить. */
function trancheCandidates(app){
  const list=[];
  (app.creditIds||[]).forEach(cid=>{ const cr=creditById(cid); if(!cr) return;
    (cr.tranches||[]).forEach(t=>{ if(!t.closed && round2(balanceAt(t,TODAY))>0) list.push({cr,t}); });
  });
  return list;
}
function pickTrancheBlock(app){
  const cands=trancheCandidates(app);
  const canEdit=canX('editVersion');
  if(!cands.length) return '<div class="op-empty">Нет открытых траншей с остатком по кредитам охвата — выбирать не из чего.</div>';
  if(!canEdit) return '<div class="op-empty">Транш-источник не выбран. Роль «'+esc(state.role)+'» выбор не делает — только Куратор ОД.</div>';
  const opts=cands.map(({cr,t})=>`<option value="${t.id}">${esc(t.no)} · ${esc(cr.no)} · остаток ${fmt(balanceAt(t,TODAY))}</option>`).join('');
  return `<div class="f2" style="max-width:640px"><div class="field" style="flex:1"><span class="flabel">Транш-источник</span>
    <select id="calctr-${app.id}"><option value="">— выберите транш —</option>${opts}</select></div></div>
    <div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="RS.setCalcTranche('${app.id}', document.getElementById('calctr-${app.id}').value)">Выбрать транш-источник</button></div>`;
}
/* Фиксация транша-источника — заводит app.version черновиком условий кредита, если версии ещё
   нет (draftVersion, issues/05 задача 5). Выбор меняется свободно до ДС: пере-выбор просто
   переставляет calcTranche, версия не трогается повторной инициализацией (issues/01, ADR-0042:
   черновик — исторический объект заявки, не пересоздаётся молча). */
function setCalcTranche(appId, trancheId){
  if(!guard('editVersion')) return;
  if(!trancheId){ toast('Выберите транш','err'); return; }
  const app=appById(appId);
  let found=null;
  (app.creditIds||[]).forEach(cid=>{ if(found) return; const cr=creditById(cid); if(!cr) return;
    const t=(cr.tranches||[]).find(x=>x.id===trancheId); if(t) found={cr,t}; });
  if(!found){ toast('Транш не найден','err'); return; }
  app.calcTranche=found.t;
  if(!app.version) app.version=draftVersion(found.cr,{});
  app._t=TODAY; H(app,'Транш-источник расчёта выбран: '+found.t.no+' (кредит '+found.cr.no+').',state.role);
  toast('Транш-источник выбран','ok'); render();
}
/* Правка параметров черновика ДС (issues/05 задача 5, тикет 07 — та же честная дыра #3).
   Открыта, пока ДС не зарегистрировано: после регистрации app.ds.params — исторический
   реквизит вступившего соглашения, версия дальше не переигрывается (комментарий у coverGate
   про «не моргать» после терминала — то же соображение). */
function setVersionParam(appId, key, val){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  if(app.ds && app.ds.no){ toast('ДС уже зарегистрировано — версия закрыта','err'); return; }
  if(!app.version) app.version=draftVersion(creditById(app.creditIds[0]),{});
  const p=app.version.params;
  if(key==='term') p.term=Number(val)||0;
  else if(key==='rate') p.rate=val===''?null:Number(val);
  else if(key==='schedule') p.schedule=val;
  else if(key==='method') p.method=val;
  app._t=TODAY; render();
}
/* Предварительный расчёт — предпросмотр черновика графика на текущих base/dispositions,
   не пишет ДС (draftSchedule — чистая функция, issues/01 реш.5). Ровно та кнопка, что
   pCalcSched давно анонсировал в своей заглушке как «вне охвата тикета 06». */
function recalcPlan(appId){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  if(!app.calcTranche || !app.version){ toast('Сначала выберите транш-источник','err'); return; }
  const r=run(app, TODAY);
  app.version.plan=draftSchedule(app.calcTranche,{date:TODAY,transferSum:r.transferSum,params:app.version.params});
  app._t=TODAY; H(app,'Предварительный расчёт: черновой график пересчитан.',state.role);
  toast('Черновой график пересчитан','ok'); render();
}
/* Форма параметров черновика — term/rate/schedule/method держат amortize (issues/01 реш.5);
   graceBlocks вне охвата (никакая демо-заявка их не требует — пустой честный список, не UI-стаб).
   Закрыта после регистрации ДС: app.ds.params — реквизит вступившего соглашения дальше живёт
   своей жизнью (issues/01, ADR-0042), версия-черновик его больше не переигрывает. */
function versionParamsBlock(app){
  if(!app.version) return '<div class="op-empty">Выберите транш-источник — черновик условий заведётся автоматически.</div>';
  const p=app.version.params;
  const fixed = !!(app.ds && app.ds.no);
  const canEdit = canX('editVersion') && !fixed;
  const dis = canEdit ? '' : 'disabled';
  const lockNote = fixed
    ? '<span class="mode-tag">ДС '+esc(app.ds.no)+' зарегистрировано — версия стала историей, правка закрыта.</span>'
    : (canX('editVersion') ? '' : '<span class="mode-tag">роль «'+esc(state.role)+'» правку не делает — только Куратор ОД.</span>');
  return `<div class="f2" style="max-width:640px">
      <div class="field"><span class="flabel">Срок, мес.</span><input type="number" min="1" value="${p.term!=null?p.term:''}" ${dis} onchange="RS.setVersionParam('${app.id}','term',this.value)"></div>
      <div class="field"><span class="flabel">Ставка, %</span><input type="number" step="0.1" min="0" value="${p.rate!=null?p.rate:''}" ${dis} onchange="RS.setVersionParam('${app.id}','rate',this.value)"></div>
      <div class="field"><span class="flabel">Периодичность</span><select ${dis} onchange="RS.setVersionParam('${app.id}','schedule',this.value)">
        ${['ежемесячно','ежеквартально','раз в полугодие','ежегодно'].map(s=>`<option value="${s}" ${(p.schedule||'ежемесячно')===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="field"><span class="flabel">Метод</span><select ${dis} onchange="RS.setVersionParam('${app.id}','method',this.value)">
        <option value="аннуитет" ${p.method!=='дифференцированный'?'selected':''}>аннуитет</option>
        <option value="дифференцированный" ${p.method==='дифференцированный'?'selected':''}>дифференцированный</option>
      </select></div>
    </div>
    <div style="margin-top:8px">${canEdit?`<button class="btn btn-primary btn-sm" onclick="RS.recalcPlan('${app.id}')">Предварительный расчёт — пересчитать черновой график</button>`:''} ${lockNote}</div>`;
}

/* Порядок конвейера — константа-массив шагов, прогон reduce (issues/02 реш.6, ИР-7 живёт
   здесь). Стек шагов — побочный продукт прогона, не отдельный лог: смоук (задача 8/тикет 08)
   проверяет ИР-7 по индексам PIPELINE как данные, не разбором расчёта построчно. overdue —
   намеренно тонкий шаг: срочность уже впечатана в позицию (issues/01 реш.3), шагу остаётся
   спросить, что осталось непокрытым распоряжением. */
const PIPELINE = [
  function forgive(state){
    let sum=0;
    const base = state.base.map(r=>{
      const carried = r.carried!=null ? r.carried : r.amount;
      if(!r.included) return {...r, carried};
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(d && d.kind==='forgive'){ sum=round2(sum+d.amount); return {...r, carried: round2(carried-d.amount)}; }
      return {...r, carried};
    });
    return { state:{...state, base, forgiven:round2(sum)}, record:{step:'forgive', sum:round2(sum)} };
  },
  function capitalize(state){
    let sum=0;
    const base = state.base.map(r=>{
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(r.included && d && d.kind==='cap'){ sum=round2(sum+d.amount); return {...r, carried: round2(r.carried-d.amount)}; }
      return r;
    });
    return { state:{...state, base, capitalized:round2(sum)}, record:{step:'capitalize', sum:round2(sum)} };
  },
  function distribute(state){
    const spread=[];
    state.base.forEach(r=>{
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(r.included && d && d.kind==='spread' && d.periods) spread.push({article:r.article, urgency:r.urgency, amount:d.amount, periods:d.periods});
    });
    return { state:{...state, spread}, record:{step:'distribute', count:spread.length} };
  },
  function overdue(state){
    const remainsOverdue = state.base.some(r=>{
      if(!r.included || r.urgency!=='over' || r.carried<=0) return false;
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      return !d || (d.kind!=='cap' && d.kind!=='forgive');
    });
    return { state:{...state, remainsOverdue}, record:{step:'overdue', remainsOverdue} };
  },
  function assembleBase(state){
    const principal = state.base.filter(r=>r.article==='principal' && r.included).reduce((s,r)=>s+r.carried,0);
    const carried = state.base.filter(r=>r.article!=='principal' && r.included).reduce((s,r)=>s+r.carried,0);
    const transferSum = round2(principal + carried + state.capitalized);
    return { state:{...state, transferSum}, record:{step:'assembleBase', transferSum} };
  }
];
function run(app, date){
  const base0 = (app.base && app.base.length ? app.base : defaultBase(app, date)).map(r=>({...r, carried:r.amount}));
  const dispositions = app.dispositions && app.dispositions.length ? app.dispositions : defaultDispositions(base0);
  const st0 = { app, date, base:base0, dispositions, forgiven:0, capitalized:0, spread:[], remainsOverdue:false, transferSum:0, stack:[] };
  return PIPELINE.reduce((s, step) => { const {state, record} = step(s); state.stack.push(record); return state; }, st0);
}

/* Расхождение среза и факта — колонка-дельта, порог мягкий (issues/02 реш.3): флаг + запись в
   журнал, ничего не блокирует — жёсткий гейт на непоказуемое число противоречил бы дисциплине
   «не выдумывать номер» (map.md). */
const CUTOFF_DRIFT_PCT = 0.05;   // (по умолч., настройка) — origin: ADR-0082, письмо вопрос 1, п. не подтверждён
function cutoffDrift(app){
  if(!app.cutoff || !app.cutoff.rows || !app.ds || !app.ds.fact) return null;
  const cutoffSum = round2(app.cutoff.rows.reduce((s,r)=>s+r.amount,0));
  const factSum = round2(app.ds.fact.rows.reduce((s,r)=>s+r.amount,0));
  const delta = round2(factSum-cutoffSum);
  const pct = cutoffSum ? Math.abs(delta)/cutoffSum : 0;
  return { cutoffSum, factSum, delta, pct, material: pct>CUTOFF_DRIFT_PCT };
}
/* Материализация: до отправки письма cutoff держит только дату (двигается свободно, РС-8);
   фиксация письмом и регистрация ДС — единственные два удостоверяющих события (issues/02 реш.2).
   Вызов этих функций из экрана — задачи 6/7 (fixLetter/regDS), здесь только чистые данные. */
function fixCutoff(app, date){
  const tranche = app.calcTranche;
  app.cutoff = { date, rows: tranche ? debtAt(tranche, date) : [], fixedAt: date };
  return app.cutoff;
}
function fixFact(app, date, transferSum){
  if(!app.ds) return null;
  const tranche = app.calcTranche;
  app.ds.fact = { date, rows: tranche ? debtAt(tranche, date) : [], transferSum: round2(transferSum) };
  return app.ds.fact;
}

/* Покрытие строк графика — жадно из одного пула, форма соседа (credit.html:3563-3603) дословно
   по духу: один проход по статьям в порядке очереди (ARTICLES), а не два прохода по четырём
   (issues/02 реш.7). Допущение Д-8 (credit.html:3543-3547) повторяется с той же оговоркой:
   кредит не владеет по слоям, доля берётся пропорционально телу — нетипичные распределения
   куратора разойдутся с выведенным здесь покрытием. Колонки берутся из фактической формы строк
   графика (что реально синтезировал amortize), накопленные колонки не выдумываются. Ссылки в
   repay не хранятся, paid на строке не пишется — второй источник истины рядом с ops лишний. */
function coverageOf(tranche, ver){
  const rows = (ver && ver.rows) || [];
  if(!rows.length) return [];
  const cols = ARTICLES.map(a=>a.key).filter(k => k in rows[0]);
  let pool = round2((tranche.ops||[]).filter(o=>o.kind==='repay').reduce((s,o)=>s+o.amount,0));
  return rows.map(r => {
    const paid={};
    cols.forEach(c=>{
      const take = round2(Math.min(pool, r[c]||0));
      paid[c]=take; pool=round2(pool-take);
    });
    return { n:r.n, date:r.date, paid };
  });
}
const AppSide = { debtAt, defaultBase, defaultDispositions, cutoffDrift, fixCutoff, fixFact, run, coverageOf, PIPELINE };

function baseApp(id,inn,borrower,kindIds,creditIds,regDate){
  return { id,inn,borrower,kindIds:[...kindIds],creditIds:[...creditIds],regDate,
    packetDocs:{}, analysisStarted:false, conclusions:[], committee:null, letterSent:null, minfin:null,
    version:null, ds:null, waiver:null, ops:[], automation:[], outcome:null, history:[],
    calcTranche:null, base:[], dispositions:[], cutoff:null };
}
function H(app,what,who,cls){ app.history.push({when:app._t||app.regDate, what, who:who||'', cls:cls||''}); }
function defaultConclusions(){ return [ {dept:'СРМиК',text:'',visa:false,visaDate:null}, {dept:'ДПО',text:'',visa:false,visaDate:null} ]; }
function fillDocs(app){ requiredDocs(app).forEach(d=>app.packetDocs[d]=true); }
/* Замена снесённого versionFrom (РС-3, карта map.md): версии условий на кредите больше нет —
   черновик читает cr.terms напрямую, а не version-on-credit. plan заполняется отдельно
   (CreditSide.draftSchedule), null пока расчёт не проведён. */
function draftVersion(cr, overrides){
  return {
    params:{ term:cr.terms.term, rate:cr.terms.rate, schedule:cr.terms.schedule, method:cr.terms.repayMethod, graceBlocks:[], ...(overrides||{}) },
    plan:null
  };
}

function seedRestructChain(){
  const cr=creditById('CR-59003'), T1=cr.tranches[0];
  function mkChainApp(id,no,T,date,partial,demoNote){
    const app=baseApp(id,cr.inn,cr.borrower,['K1'],[cr.id],addCalDays(date,-10));
    fillDocs(app); app.analysisStarted=true; app.calcTranche=T;
    app.conclusions=defaultConclusions().map(c=>({...c,visa:true,visaDate:addCalDays(date,-6)}));
    app.committee={fixed:true,position:'одобрено',date:addCalDays(date,-5)};
    app.letterSent={fixed:true,date:addCalDays(date,-3)};
    AppSide.fixCutoff(app, app.letterSent.date);
    if(demoNote){ app._t=app.cutoff.date; H(app,demoNote,'Демо-данные','auto'); }
    app.minfin={fixed:true,decision:'изм',letterRef:'МФ-'+id,date:addCalDays(date,-1)};
    app.version=draftVersion(cr,{term:12});
    const full=round2(CreditSide.balanceAt(T,date));
    const transferSum=partial?round2(full*0.5):full;
    const ds={ no, date, app, sourceTranche:T, credit:cr, transferSum, params:{...app.version.params} };
    const res=CreditSide.restructureApplied(ds);
    if(!res.ok) throw new Error('demo-seed: '+no+' — '+res.reasons.join('; '));
    app.ds={ no, date, transferSum, sourceTrancheId:T.id, params:ds.params, fact:null };
    AppSide.fixFact(app,date,transferSum);
    app.outcome='изм'; app._t=date; H(app,'ДС '+no+' зарегистрировано, перенесено '+fmt(transferSum)+'.','Куратор ОД');
    return { app, tranche:res.tranche };
  }
  const d1=addCalDays(TODAY,-60), d2=addCalDays(TODAY,-30), d3=TODAY;
  const l1=mkChainApp('RS-1005','ДС-59003/3',T1,d1,true);
  const l2=mkChainApp('RS-1006','ДС-59003/4',l1.tranche,d2,false,
    'Контрольная точка §14 «расчёт долга на дату между первой и второй реструктуризацией»: срез этой заявки ('+addCalDays(d2,-3)+') лежит строго между регистрацией ДС-59003/3 ('+d1+') и ДС-59003/4 ('+d2+') — долг на нём посчитан по тому же траншу T2, что реструктуризация #1 произвела, а #2 сейчас закрывает.');
  const l3=mkChainApp('RS-1007','ДС-59003/5',l2.tranche,d3,false);
  return [l1.app,l2.app,l3.app];
}

/* 1. Обращение — чек-лист пакета = объединение документов видов; гейт стадии 1 */
function pReq(app){
  const st=stageOf(app); const g=packetGate(app);
  const docs = g.req.map(d=>`<label class="chk"><input type="checkbox" ${app.packetDocs[d]?'checked':''}
     ${st.idx>0||st.closed?'disabled':''} onchange="RS.toggleDoc('${app.id}','${esc(d)}',this.checked)"> ${esc(d)}</label>`).join('') ||
     '<div class="op-empty">Виды не выбраны — требований к пакету нет.</div>';
  let gate='';
  if(st.idx===0 && !st.closed){
    gate = g.ok
      ? `<div class="okline">Пакет полон. Переход в «Анализ» доступен (кнопка внизу).</div>`
      : `<div class="flagline">Пакет неполон (нет: ${g.missing.map(esc).join(', ')||'—'}). Гейт стадии 1: доступен только исход «возвращена без рассмотрения» либо докомплект. Переход в «Анализ» заблокирован.</div>`;
  }
  const retBtn = (st.idx===0 && !st.closed)
    ? `<button class="btn btn-secondary btn-sm" onclick="RS.returnApp('${app.id}')">Вернуть без рассмотрения</button>` : '';
  return `<div class="detail-panel active">
    <div class="section-h">Обращение</div>
    <div class="section-note">Дата регистрации: <b>${app.regDate}</b>. Требования к пакету — объединение документов выбранных видов (Р-3).</div>
    ${gate}
    <div class="f2" style="max-width:520px">${docs}</div>
    <div style="margin-top:14px">${retBtn}</div>
  </div>`;
}

/* 2. Охват — таблица кредитов; валидации ИНН и «другая активная заявка» (Р-2) */
function pScope(app){
  const rows=app.creditIds.map(id=>{ const c=creditById(id); const other=activeAppOnCredit(id,app.id);
    return `<tr>
      <td>${c.no}</td><td class="numcell">${fmt(c.balance)}</td>
      <td>${c.odDays} дн. / ${fmt(c.odSum)}</td>
      <td>${c.collProc?`<span class="rowlink" onclick="RS.showMirror('${c.collProc}','${app.id}')">${c.collProc}</span>`:'—'}</td>
      <td>${other?`<span class="pill high">${other.id}</span>`:'<span class="pill low">нет</span>'}</td>
      <td>реструкт.: ${c.restructCount}</td>
    </tr>`; }).join('') || `<tr><td colspan="6" class="op-empty">Охват пуст</td></tr>`;
  const st=stageOf(app);
  const addBtn = (!st.closed) ? `<button class="btn btn-primary btn-sm" onclick="RS.openAddCredit('${app.id}')">+ Добавить кредит</button>`:'';
  return `<div class="detail-panel active">
    <div class="section-h">Охват заявки</div>
    <div class="section-note">Только кредиты ИНН <b>${app.inn}</b>. Кредит с другой активной заявкой добавить нельзя (Р-2). Остаток/просрочка — read-only снимки.</div>
    <div class="gtoolbar">${addBtn}</div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr>
      <th>Кредит</th><th class="numcell">Остаток</th><th>Просрочка</th><th>Взыскание</th><th>Другая активная заявка</th><th>Счётчик</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

/* 3. Заключения (Р-5) */
function pConcl(app){
  const g=conclGate(app);
  const cards=app.conclusions.map((c,i)=>{
    const mine = canX('editConcl:'+c.dept);
    return `<div class="concl-card">
      <div class="ch"><span class="cn">Заключение: ${esc(c.dept)}</span>
        ${c.visa?`<span class="gatechip ok">✓ виза ${c.visaDate}</span>`:`<span class="gatechip no">без визы</span>`}</div>
      <div class="field col-span"><textarea ${mine&&!c.visa?'':'disabled'} placeholder="${mine?'Текст заключения…':'Правит только заключант '+esc(c.dept)}"
        onchange="RS.setConclText('${app.id}',${i},this.value)">${esc(c.text)}</textarea></div>
      <div style="margin-top:8px">
        ${!c.visa?`<button class="btn btn-success btn-sm" ${mine?'':'disabled'} onclick="RS.visaConcl('${app.id}',${i})">Завизировать</button>`
          :`<span class="mode-tag">Завизировано ${c.visaDate}</span>`}
      </div>
    </div>`;
  }).join('');
  const gate = g.ok
    ? `<div class="okline">Все затребованные заключения завизированы. Гейт «в Комитет» открыт.</div>`
    : `<div class="warnline">Ожидают визы: ${g.pending.map(esc).join(', ')}. Гейт «в Комитет» закрыт.</div>`;
  return `<div class="detail-panel active">
    <div class="section-h">Заключения подразделений</div>
    <div class="section-note">Куратор может добавить заключанта — это добавит требование к гейту комитета (Р-5).</div>
    ${gate}
    <div class="gtoolbar"><button class="btn btn-secondary btn-sm" onclick="RS.openAddConcl('${app.id}')">+ Добавить заключанта</button></div>
    ${cards}
  </div>`;
}

/* 4. База и распоряжения (issues/05, вариант B) — семь статей, два датированных числа, производный транш.
   Гейты Пределы/Согласия подключены (тикет 07): норма-справочник (limitsGate) и зеркало GUARANTEES
   (consentGate) — оба жёсткие, без waiver. Флажки/распоряжения — read-only показ по умолчанию
   (issues/02 задал состав, интерактивная правка куратором — тикет 07, issues/05 просит только
   раскладку). */
function gateChipsRow(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app);
  return `${lga.pending?'<span class="pill neutral">Пределы — расчёт не выбран</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы ${lga.ok?'OK':'блок'}</span>`}
    <span class="gatechip ${coa.ok?'ok':'no'}">Согласия ${coa.ok?'OK':'блок'}</span>
    <span class="gatechip ${cga.ok?'ok':'no'}">Покрытие ${cga.ok?'OK':'блок (мягкий)'}</span>`;
}
function coverBody(app){
  const cga=coverGateApp(app);
  const rows=cga.rows.map(({cr,g})=>`<div class="mrow"><span>${cr.no}</span><span>${g.cover}% из требуемых ${g.required}% (${esc(g.source||'Залог')}, снимок ${esc(g.snapshotDate||'—')}${g.stale?` <span class="pill high" title="Снимок старше ${COVER_SNAPSHOT_STALE_DAYS} к.д. — данные модуля залога могли устареть">устарел</span>`:''})${g.coverOk?'':' — недостаточно'}</span></div>`).join('') || '<div class="mrow"><span>—</span><span>кредиты не выбраны</span></div>';
  return `<div class="mirror">${rows}</div>` + (cga.ok?'':`<div class="warnline">Недостаточно покрытия по одному или нескольким кредитам — мягкий гейт, снимается waiver-ом комиссии по залогу (вкладка «Оформление»).</div>`);
}
function limitsBody(app){
  const lga=limitsGateApp(app);
  if(lga.pending) return `<div class="op-empty">${esc(lga.messages[0])}</div>`;
  return `<div class="mrow"><span>Срок</span><span>предел ${lga.cap} мес. (${esc(normNote(lga.capRec))})${lga.termOk?'':' — превышен'}</span></div>
    <div class="mrow"><span>Ставка</span><span>минимум ${lga.floor}% (${esc(normNote(lga.floorRec))})${lga.rateOk?'':' — ниже минимума'}</span></div>`
    + (lga.ok?'':`<div class="warnline">${lga.messages.map(esc).join('<br>')} — жёсткий гейт, без waiver.</div>`);
}
function consentBody(app){
  const coa=consentGateApp(app);
  const rows=coa.rows.flatMap(({cr,g})=>g.list.map(x=>`<div class="mrow"><span>${cr.no} · ${esc(x.name)}</span><span>${esc(x.status)} (${x.date})</span></div>`));
  return `<div class="mirror">${rows.join('')||'<div class="mrow"><span>—</span><span>обеспечителей нет</span></div>'}</div>`
    + (coa.ok?'':`<div class="warnline">Не согласовано: ${coa.pending.map(esc).join(', ')} — жёсткий гейт, без waiver.</div>`);
}
function gateDetails(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app);
  return `
  <details class="gate-d"><summary>${lga.pending?'<span class="pill neutral">Пределы</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы</span>`} жёсткий, норма-справочник</summary><div class="gate-body">${limitsBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${coa.ok?'ok':'no'}">Согласия</span> жёсткий, ответ Обеспечения</summary><div class="gate-body">${consentBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${cga.ok?'ok':'no'}">Покрытие</span> мягкий, ответ Залога</summary><div class="gate-body">${coverBody(app)}</div></details>`;
}
/* производный транш по итогам ДС — единственный признак связи назад к door: ops[0].basis (issues/03). */
function resultTranche(app){
  if(!app.ds || !app.ds.no) return null;
  const credit=creditById(app.creditIds[0]); if(!credit) return null;
  return credit.tranches.find(t=>{ const b=(t.ops[0]||{}).basis; return b && b.ds===app.ds.no && b.from===app.ds.sourceTrancheId; }) || null;
}
function rowsTotal(rows){ return round2((rows||[]).reduce((s,r)=>s+r.amount,0)); }

function pCalcBase(app){
  const cr=creditById(app.creditIds[0]);
  if(!cr) return `<div class="detail-panel active"><div class="op-empty">Добавьте кредит в охват — расчёт строится по транш-источнику.</div></div>`;
  if(!app.calcTranche) return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>
    <div class="section-h" style="margin-top:0">Транш-источник расчёта</div>
    ${pickTrancheBlock(app)}
    ${gateDetails(app)}
  </div>`;

  const src=app.calcTranche;
  const drift=cutoffDrift(app);
  const srezRow = app.cutoff
    ? (app.cutoff.rows ? {v:fmt(rowsTotal(app.cutoff.rows)), s:'зафиксирован письмом '+app.cutoff.date} : {v:'—', s:'дата '+app.cutoff.date+' — сумма зафиксируется отправкой письма'})
    : {v:'—', s:'письмо в Минфин ещё не направлено'};
  const factRow = app.ds && app.ds.fact
    ? {v:fmt(rowsTotal(app.ds.fact.rows)), s:'зафиксирован ДС '+app.ds.no+' от '+app.ds.fact.date}
    : {v:fmt(rowsTotal(debtAt(src,TODAY))), s:'предпросмотр на '+TODAY+' — ДС ещё не зарегистрировано'};
  const deltaRow = drift
    ? {v:(drift.delta>=0?'+':'')+fmt(drift.delta), s:(drift.pct*100).toFixed(1).replace(/\.0$/,'')+'% от среза — '+(drift.material?'выше мягкого порога '+(CUTOFF_DRIFT_PCT*100)+'%, не блокирует':'в пределах мягкого порога '+(CUTOFF_DRIFT_PCT*100)+'%'), flag:drift.material}
    : {v:'—', s:'дельта считается после фиксации и среза, и факта (issues/02 реш.2)', flag:false};

  const base = app.base && app.base.length ? app.base : defaultBase(app, app.ds?app.ds.date:TODAY);
  const dispositions = app.dispositions && app.dispositions.length ? app.dispositions : defaultDispositions(base);
  const ordered=[...base].sort((a,b)=>{
    const ia=ARTICLES.findIndex(x=>x.key===a.article), ib=ARTICLES.findIndex(x=>x.key===b.article);
    return ia!==ib ? ia-ib : (a.urgency==='over'?-1:1)-(b.urgency==='over'?-1:1);
  });
  const canEdit = canX('editBase');
  const allowed = allowedDispositions(app);
  const rows = ordered.map(r=>{
    const d=dispositionFor(dispositions,r.article,r.urgency);
    const urg=(URG.find(u=>u.key===r.urgency)||{}).name||r.urgency;
    const dead = r.blockedBy==='disputed';
    const chk = dead
      ? `<label class="chk dead"><input type="checkbox" disabled ${r.included?'checked':''}><span class="lbl">спорная — решает комиссия</span></label>`
      : `<label class="chk"><input type="checkbox" ${r.included?'checked':''} ${canEdit?'':'disabled'} onchange="RS.toggleBaseRow('${app.id}','${r.article}','${r.urgency}')"><span class="lbl">${r.included?'включена':'снята куратором'}</span></label>`;
    const disp = r.included
      ? `<select ${canEdit?'':'disabled'} onchange="RS.setDisposition('${app.id}','${r.article}','${r.urgency}',this.value)">
          ${['none','cap','forgive','spread'].map(k=>{
            const ok = k==='none' || allowed.has(k);
            return `<option value="${k}" ${d&&d.kind===k?'selected':''} ${ok?'':'disabled'}>${DISP_LABEL[k]}${ok?'':' — вид не разрешает'}</option>`;
          }).join('')}
        </select>`
      : '<span class="mode-tag">без распоряжения (строка снята)</span>';
    const rowCls = dead ? 'art-blocked' : (!r.included ? 'art-removed' : '');
    return `<tr class="${rowCls}"><td>${esc(ARTICLE_LABEL[r.article]||r.article)}</td><td>${urg}</td><td class="numcell">${fmt(r.amount)}</td><td>${chk}</td><td>${disp}</td></tr>`;
  }).join('') || '<tr><td colspan="5" class="op-empty">Долг по траншу пуст на выбранную дату</td></tr>';

  const derived=resultTranche(app);
  let splitBlock;
  if(derived){
    const srcConds=conditionsAt(src,TODAY);
    splitBlock = `<div class="split-wrap">
      <div class="split-box">
        <div class="sb-t">${esc(src.no)} · исходный${src.closed?' — закрыт':''}</div>
        <div class="sb-row"><span>Остаток</span><span>${fmt(balanceAt(src,TODAY))}</span></div>
        <div class="sb-row"><span>Условия</span><span>${srcConds.rate!=null?srcConds.rate+'%':'—'}, прежние</span></div>
        <div class="sb-row"><span>Статус</span><span>${src.closed?'закрыт переносом '+src.closed.date:'срочный остаток, график не тронут'}</span></div>
      </div>
      <div class="split-arrow">→</div>
      <div class="split-box new">
        <div class="sb-t">${esc(derived.no)} · производный</div>
        <div class="sb-row"><span>Перенесённая база</span><span>${fmt(derived.amount)}</span></div>
        <div class="sb-row"><span>Новые условия</span><span>${derived.originalRate!=null?derived.originalRate+'%':'—'}</span></div>
        <div class="sb-row"><span>Начало</span><span>${derived.plannedDate}</span></div>
      </div>
    </div>
    <div class="section-note">Деление — не сценарий, а факт устройства двери (issues/03): restructureApplied всегда заводит производный транш и зеркальную пару transfer_out/transfer_in, даже когда перенесён весь остаток источника — источник в этом случае просто закрывается (см. статус слева).</div>`;
  } else {
    splitBlock = `<div class="op-empty">Производный транш появится после регистрации доп. соглашения (вкладка «Оформление»).</div>`;
  }

  return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>

    <div class="section-h" style="margin-top:0">Два датированных числа</div>
    <div class="section-note">Срез — согласовательная величина (заключения, комитет, письмо). Факт — то же самое на дату вступления ДС; реквизит ДС, единственное, что идёт в учёт (issues/02 реш.2).</div>
    <div class="two-num-grid">
      <div class="numtile"><div class="nt-l">Срез — ${app.cutoff?app.cutoff.date:'—'}</div><div class="nt-v">${srezRow.v}</div><div class="nt-d">${srezRow.s}</div></div>
      <div class="numtile delta ${deltaRow.flag?'flag':''}"><div class="nt-l">Дельта ожидания</div><div class="nt-v">${deltaRow.v}</div><div class="nt-d">${deltaRow.s}</div></div>
      <div class="numtile"><div class="nt-l">Факт — ${app.ds&&app.ds.fact?app.ds.fact.date:TODAY}</div><div class="nt-v">${factRow.v}</div><div class="nt-d">${factRow.s}</div></div>
    </div>

    <div class="section-h">База — статьи долга, распоряжения</div>
    <div class="section-note">Порядок строк — константа конвейера PIPELINE (issues/02 реш.6): расходы взыскания → сборы → накопленные проценты → накопленная пеня → пеня → проценты → основной долг. Галка и распоряжение — живые (issues/02 реш.1/4, тикет 07): куратор снимает строку или меняет распоряжение прямо здесь; спорная пеня (ИР-6) и распоряжения, которых вид не допускает, — мёртвые пункты с подписью, не скрытые.${canEdit?'':' <span class="mode-tag">роль «'+esc(state.role)+'» правку не делает — только Куратор ОД.</span>'}</div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr><th>Статья</th><th>Срочность</th><th class="numcell">Сумма</th><th>Включена</th><th>Распоряжение</th></tr></thead><tbody>${rows}</tbody></table></div>

    <div class="section-h">Производный транш</div>
    ${splitBlock}

    <div class="section-h">Гейты — подробно</div>
    ${gateDetails(app)}
  </div>`;
}

function pCalcSched(app){
  const cr=creditById(app.creditIds[0]);
  if(!cr) return `<div class="detail-panel active"><div class="op-empty">Добавьте кредит в охват — расчёт строится по транш-источнику.</div></div>`;
  if(!app.calcTranche) return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>
    <div class="section-h" style="margin-top:0">Транш-источник расчёта</div>
    <div class="op-empty">Транш-источник не выбран — график недоступен. Выбор — на вкладке «База и распоряжения».</div>
    ${gateDetails(app)}
  </div>`;

  const src=app.calcTranche;
  const derived=resultTranche(app);

  let draftBlock;
  if(derived){
    const ver=derived.schedules[0];
    draftBlock = {rows:ver.rows, pill:'<span class="pill low">Действующий</span>', note:'tranche.schedule — реквизит вступившего ДС, дверь restructureApplied положила версию сюда (issues/03).'};
  } else if(app.version && app.version.plan){
    draftBlock = {rows:app.version.plan.rows, pill:'<span class="pill info">Черновик</span>', note:'app.version.plan — предмет согласования, дверью не трогается; вступивший ДС положит версию на tranche.schedule отдельно (issues/03).'};
  } else {
    draftBlock = null;
  }

  const activeRows=(scheduleAt(src,TODAY)?.rows||[]).filter(r=>r.date>=TODAY).slice(0,6);

  function tbl(title,pillHtml,rows,emptyMsg){
    const body=rows.map(r=>`<tr><td>${r.date}</td><td class="numcell">${fmt(r.principal)}</td><td class="numcell">${fmt(r.interest||0)}</td></tr>`).join('') || `<tr><td colspan="3" class="op-empty">${emptyMsg}</td></tr>`;
    return `<div class="f2" style="margin-bottom:6px"><div class="field"><span class="flabel">${title} ${pillHtml}</span></div></div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr><th colspan="3">${title}</th></tr><tr><th>Дата</th><th>Тело</th><th>%</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }

  const derivedBlock = draftBlock
    ? tbl((derived?derived.no:'производный транш'), draftBlock.pill, draftBlock.rows.slice(0,6), 'график пуст')
    : `<div class="op-empty">Черновой график не рассчитан — задайте параметры ниже и нажмите «Предварительный расчёт», или дождитесь регистрации ДС.</div>`;
  const paramsBlock = derived ? '' : `<div class="section-h">Условия черновика ДС</div>${versionParamsBlock(app)}`;
  const activeBlock = tbl(src.no+' — действующий, не тронут переносом', '<span class="pill low">Действующий</span>', activeRows, 'график транша не оцифрован в демо-сиде (schedules[0].rows пуст) — не факт отсутствия платежей');

  const runRes=run(app, app.ds?app.ds.date:TODAY);
  const base = app.base && app.base.length ? app.base : defaultBase(app, app.ds?app.ds.date:TODAY);
  const dispositions = app.dispositions && app.dispositions.length ? app.dispositions : defaultDispositions(base);
  const unresolved = base.filter(r=>r.included && r.urgency==='over').filter(r=>{ const d=dispositionFor(dispositions,r.article,r.urgency); return !d || (d.kind!=='cap'&&d.kind!=='forgive'); });
  const rs15 = runRes.remainsOverdue
    ? `<div style="margin:0 0 14px"><span class="pill mid">Кредит частично просрочен после ДС</span> <span class="mode-tag">Не урегулированы распоряжением: ${esc(unresolved.map(r=>ARTICLE_LABEL[r.article]||r.article).join(', ')||'—')} — просрочка не растворяется, входит суммой в перенос${derived?' '+derived.no:''} (РС-15).</span></div>`
    : (app.ds&&app.ds.no ? `<div class="okline">Все включённые просроченные статьи урегулированы распоряжением — перенос не несёт непокрытой просрочки (РС-15).</div>` : '');

  return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>

    <div class="section-h" style="margin-top:0">Черновой график против действующего</div>
    ${derivedBlock}
    <div class="section-note">${draftBlock?draftBlock.note:''}</div>
    ${paramsBlock}
    ${activeBlock}
