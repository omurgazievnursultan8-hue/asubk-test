    { id:'k-loan', label:'Кредиты и транши',    items:[{label:'Кредиты'},{label:'Список траншей'}] } ]},
  { id:'ob',  label:'Обеспечение', subs:[{ id:'ob-all', headerless:true,
    items:[{label:'Реестр залогов'},{label:'Поручительства'}] }] },
  { id:'pz',  label:'Проблемная задолженность', open:true, subs:[{ id:'pz-all', headerless:true, items:[
    { label:'Реструктуризация — реестр заявок', view:'list' },
    { label:'Справочник видов',                 view:'dict' },
    { label:'Взыскание' } ]}] },
  { id:'d',   label:'Справочники',       subs:[{ id:'d-all',   headerless:true, items:[{label:'Справочники'}] }] },
  { id:'r',   label:'Отчёты',            subs:[{ id:'r-all',   headerless:true, items:[{label:'Отчёты'}] }] },
  { id:'adm', label:'Администрирование', subs:[{ id:'adm-all', headerless:true, items:[{label:'Администрирование'}] }] },
  { id:'sec', label:'Безопасность',      subs:[{ id:'sec-all', headerless:true, items:[{label:'Безопасность'}] }] },
];
/* Раскрытость узлов живёт вне разметки: render() перерисовывает #nav на каждое действие,
   и DOM-переключатель канона схлопывал бы то, что раскрыл пользователь (payments.html:641). */
const NAV_OPEN = new Set(TREE.filter(g=>g.open).map(g=>g.id));
function navToggle(id){ NAV_OPEN.has(id) ? NAV_OPEN.delete(id) : NAV_OPEN.add(id); renderNav(); }
const chev = s => `<span class="chev"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
function renderNav(){
  if(typeof document==='undefined') return;              // без DOM рисовать нечего — как render()
  const nav=document.getElementById('nav'); if(!nav) return;
  /* Подсветка следует за экраном, а не за статичным флагом в дереве: карточка заявки —
     тот же реестр вглубь, и на ней горит его пункт (как было в плоском списке). */
  const isOn = it => it.view && (it.view===state.view || (it.view==='list' && state.view==='card'));
  nav.innerHTML = TREE.map(g=>{
    const subs=(g.subs||[]).map(s=>{
      const items=(s.items||[]).map(it=>`<a class="nav-item${s.headerless?' headerless':''}${isOn(it)?' active':''}" onclick="RS.navClick('${it.label.replace(/'/g,"\\'")}')">${esc(it.label)}</a>`).join('');
      if(s.headerless) return `<div class="nav-children" style="display:block">${items}</div>`;
      return `<div class="nav-sub${NAV_OPEN.has(s.id)?' open':''}"><button class="nav-toggle" onclick="RS.navToggle('${s.id}')">${chev(13)}<span class="lbl">${esc(s.label)}</span></button><div class="nav-children">${items}</div></div>`;
    }).join('');
    return `<div class="nav-group${NAV_OPEN.has(g.id)?' open':''}"><button class="nav-toggle" onclick="RS.navToggle('${g.id}')">${chev(14)}<span class="lbl">${esc(g.label)}</span></button><div class="nav-children">${subs}</div></div>`;
  }).join('');
}
function navLeaf(label){ let f=null; TREE.forEach(g=>(g.subs||[]).forEach(s=>(s.items||[]).forEach(it=>{ if(it.label===label) f=it; }))); return f; }
function navClick(label){
  const it=navLeaf(label);
  if(it&&it.view){ go(it.view); return; }
  toast('Раздел «'+label+'» — вне объёма макета');
}
/* Сворачивание сайдбара — класс на .app, состояние переживает F5. Ключ отдельный от
   демо-данных: это настройка показа, а не модель (collection.html:11706). */
const NAV_KEY='asubk.restructuring.navCollapsed';
function applyNav(collapsed){
  if(typeof document==='undefined') return;
  document.querySelector('.app').classList.toggle('nav-collapsed',collapsed);
  const b=document.getElementById('navBurger');
  if(b) b.setAttribute('aria-expanded',String(!collapsed));
  try{ localStorage.setItem(NAV_KEY, collapsed?'1':'0'); }catch(e){}
}
function toggleNav(){
  if(typeof document==='undefined') return;
  applyNav(!document.querySelector('.app').classList.contains('nav-collapsed'));
}
function restoreNav(){
  if(typeof document==='undefined') return;
  let collapsed=false;
  try{ collapsed=localStorage.getItem(NAV_KEY)==='1'; }catch(e){}
  document.querySelector('.app').classList.toggle('nav-collapsed',collapsed);
  const b=document.getElementById('navBurger');
  if(b) b.setAttribute('aria-expanded',String(!collapsed));
}
function renderRoles(){
  const s=document.getElementById('roleSel');
  s.innerHTML=ROLES.map(r=>`<option ${r===state.role?'selected':''}>${r}</option>`).join('');
}

/* ================= РЕНДЕР: РЕЕСТР ЗАЯВОК ================= */
function stageLabel(app){ return stageOf(app).label; }
function outcomeChip(app){
  const o=app.outcome;
  if(o==='возврат') return '<span class="pill neutral">возврат без рассмотрения</span>';
  // отказ различается по акту, который его нёс (ADR-0107): заключение органа (п. 88) либо постановление КМ
  if(o==='отказ')   return (app.resolution&&app.resolution.fixed)
      ? '<span class="pill high">отказ (постановление КМ)</span>'
      : '<span class="pill high">отказ (заключение органа)</span>';
  if(app.ds&&app.ds.no){ return o==='изм'?'<span class="pill low">одобрена (изм. условия)</span>':'<span class="pill low">одобрена</span>'; }
  if(app.resolution&&app.resolution.fixed) return '<span class="pill info">на оформлении</span>';
  return '<span class="pill neutral">в работе</span>';
}
const OUTCOMES = ['в работе','одобрена','изм','отказ','возврат'];
/* Условия выборки — AND, пустое условие не сужает. Поиск — одно поле на три токена
   (№ заявки, наименование, ИНН): в реестре ищут именно ими, разносить по трём полям
   нечего. */
function passAppFilters(a){
  const f=state;
  if(f.filterQ){
    const hay=(a.id+' '+a.borrower+' '+a.inn).toLowerCase();
    if(!hay.includes(f.filterQ)) return false;
  }
  if(f.filterStage && stageLabel(a)!==f.filterStage && !(f.filterStage==='Закрыта'&&stageOf(a).closed)) return false;
  if(f.filterOutcome){ const oc=(a.outcome||'в работе'); if(oc!==f.filterOutcome) return false; }
  return true;
}
/* Сортировка по клику на шапку — как в «Списке кредитов» (credit.html:5752). Стадия
   сортируется по индексу конвейера, а не по алфавиту ярлыка; дедлайн — по остатку дней,
   иначе «просрочен на 9» встаёт рядом с «осталось 9». */
const APP_SORTERS = {
  id:       a=>a.id,
  borrower: a=>a.borrower,
  credits:  a=>a.creditIds.map(id=>creditById(id)?.no).join(', '),
  kinds:    a=>a.kindIds.map(id=>kindById(id)?.name).filter(Boolean).join(', '),
  stage:    a=>stageOf(a).idx,
  deadline: a=>{ const dl=deadline(a); return dl ? dl.remaining : Infinity; },
  outcome:  a=>OUTCOMES.indexOf(a.outcome||'в работе'),
};
function sortList(key){
  if(!APP_SORTERS[key]) return;
  const s=state.listSort;
  if(s.key===key) s.dir=-s.dir; else { s.key=key; s.dir=1; }
  state.page=1; renderRows();
}
function syncSortHeader(){
  document.querySelectorAll('#view-list table.grid thead th').forEach(th=>{
    const k=th.getAttribute('data-k'); const on = k && k===state.listSort.key;
    th.classList.toggle('sorted', !!on);
    const sp=th.querySelector('.sort'); if(sp) sp.textContent = on ? (state.listSort.dir===1?'↑':'↓') : '↕';
  });
}
function appRowHtml(a){

  const rep=repeatSignal(a);   // РС-32: сигнал, не гейт — видимость без блокировки

     credit.html: в реестре он именно сигнал, полная формулировка живёт в подсказке. */

/* Оболочка реестра рисуется один раз, строки — отдельно (credit.html:5543/5786):

function renderList(){

  v.innerHTML = `

        <div class="control"><input id="fQ" type="search" value="${esc(state.filterQ)}" placeholder="№ заявки, заёмщик или ИНН" oninput="RS.renderRows()"></div></div>
      <div class="field q-stage"><span class="flabel">Стадия</span>
        <div class="control"><select id="fStage" onchange="RS.renderRows()">
          ${[''].concat(STAGES).map(s=>`<option value="${s}" ${state.filterStage===s?'selected':''}>${s||'— все —'}</option>`).join('')}
        </select><span class="caret">▾</span></div></div>
      <div class="field q-outcome"><span class="flabel">Исход</span>
        <div class="control"><select id="fOutcome" onchange="RS.renderRows()">
          ${[''].concat(OUTCOMES).map(s=>`<option value="${s}" ${state.filterOutcome===s?'selected':''}>${s||'— все —'}</option>`).join('')}
        </select><span class="caret">▾</span></div></div>
      <button class="btn btn-secondary btn-sm q-more" onclick="RS.resetFilters()">Сбросить фильтры</button>
      <button class="btn btn-primary btn-sm" ${canX('createApp')?'':'disabled'} onclick="RS.newApp()">+ Новая заявка</button>
    </div>
    <div class="grid-wrap">
      <!-- Ширины подобраны так, чтобы обрезка была страховкой, а не нормой: «ОсОО «Ак-Жол
           Агро»» и «просрочен на 222 дн.» помещаются целиком, длинные ярлыки стадий и
           перечни видов режутся в «…» с полным значением в title (приём credit.html). -->
      <table class="grid reg"><colgroup>
        <col style="width:168px"><col style="width:232px"><col style="width:126px"><col style="width:176px">
        <col style="width:200px"><col style="width:156px"><col style="width:186px">
      </colgroup><thead><tr>
        ${th('id','№ заявки')}${th('borrower','Заёмщик')}${th('credits','Кредиты')}${th('kinds','Виды')}
        ${th('stage','Стадия')}${th('deadline','Дедлайн')}${th('outcome','Исход')}
      </tr></thead><tbody id="appBody"></tbody></table>
    </div>
    <div class="pager" id="appPager"></div>`;
  renderRows();
}
function readAppFilters(){
  const g=id=>{ const e=document.getElementById(id); return e?e.value:''; };
  state.filterQ=g('fQ').trim().toLowerCase();
  state.filterStage=g('fStage'); state.filterOutcome=g('fOutcome');
}
function resetFilters(){
  state.filterQ=''; state.filterStage=''; state.filterOutcome=''; state.page=1;
  ['fQ','fStage','fOutcome'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  renderRows();
}
function renderRows(){
  const body=document.getElementById('appBody'); if(!body) return;
  readAppFilters();
  let hits=state.apps.filter(passAppFilters);
  if(state.listSort.key){
    const get=APP_SORTERS[state.listSort.key], dir=state.listSort.dir;
    hits=hits.slice().sort((x,y)=>{
      const a=get(x), b=get(y);
      if(typeof a==='number' && typeof b==='number') return (a-b)*dir;
      return String(a??'').localeCompare(String(b??''),'ru',{numeric:true})*dir;
    });
  }
  syncSortHeader();
  const pages=Math.max(1, Math.ceil(hits.length/state.pageSize));
  if(state.page>pages) state.page=pages;
  const from=(state.page-1)*state.pageSize;
  const page=hits.slice(from, from+state.pageSize);
  body.innerHTML = page.length ? page.map(appRowHtml).join('')
    : `<tr><td colspan="7" style="text-align:center;color:var(--text-placeholder);padding:20px">Нет заявок по фильтру</td></tr>`;
  renderPager(hits.length, pages, from, page.length);
}
function renderPager(total, pages, from, shown){
  const el=document.getElementById('appPager'); if(!el) return;
  const p=state.page;
  const btn=(label,to,dis)=>`<span class="pg${dis?' dis':''}"${dis?'':` onclick="RS.gotoPage(${to})"`}>${label}</span>`;
  const nums=[];
  for(let i=1;i<=pages;i++) nums.push(i===p?`<span class="pg active">${i}</span>`:btn(i,i,false));
  el.innerHTML=`
    <span class="pinfo">${total?`Показано ${from+1}–${from+shown} из ${total}`:'Нет записей'}</span>
    <span class="pages">${btn('«',1,p===1)}${btn('‹',p-1,p===1)}${nums.join('')}${btn('›',p+1,p===pages)}${btn('»',pages,p===pages)}</span>
    <span class="psize">На странице:
      <select onchange="RS.setPageSize(this.value)">
        ${[10,20,50,100].map(n=>`<option value="${n}"${n===state.pageSize?' selected':''}>${n}</option>`).join('')}
      </select></span>
    <span class="mode-tag">«Сегодня» демо: ${TODAY}</span>`;
}
function gotoPage(n){ state.page=Math.max(1,n); renderRows(); }
function setPageSize(n){ state.pageSize=+n; state.page=1; renderRows(); }

/* ================= РЕНДЕР: КАРТОЧКА ЗАЯВКИ ================= */
/* Вкладок семь: «Охват» снята 13.08.2026. Список траншей заявки — не содержимое вкладки, а
   навигация: он и есть выбор расчёта, и живёт полосой над столом ввода (scopeStrip). Вкладка
   печатала тот же список вторым экземпляром и строила его из creditIds — производного свойства
   с откатом на демо-сид, тогда как охват живёт в app.calcs. */
/* Пара вкладок расчёта названа по самой сделке (CONTEXT «Расчёт реструктуризации»): сначала
   ЗАДАЮТ параметры изменения — какие статьи переносим, как распоряжаемся начисленным, на каких
   условиях, — потом СМОТРЯТ, что из этого вышло. Прежние «База и распоряжения» / «График и
   дифф» именовали куски экрана: «база» в модуле занята одним смыслом (база переноса — только
   включённая часть), а «дифф» — латинский обрубок в русском ряду.
   «Было и стало» продержалось один день и снято по той же причине: имя называло ФОРМУ показа —
   две половины, — а половины держат РАЗНЫЕ объекты (источник переносом закрывается, производный
   рождается датой ДС), и построчно их графики несопоставимы. Вкладка зовётся «Результат
   расчёта»: предмет её — то, что расчёт даёт, а сравнение живёт внутри — колонками «Действует»
   и «По расчёту» у условий и строкой перехода у денег. */
const TABS=[['req','Пакет документов'],['concl','Заключения'],['params','Параметры'],['result','Результат расчёта'],['decision','Комитет и решение'],['formal','Оформление'],['hist','История']];
function openApp(id){ state.curApp=id; state.view='card'; state.curTab='req'; state.curCalc=null; state.gatesOpen=false; render(); }
function setTab(t){ state.curTab=t; render(); }
/* Выбранный расчёт — состояние экрана, не заявки: правка идёт по одному расчёту за раз, и его
   адрес виден полосой выбора, а не только в аргументах сеттеров. Чужой/устаревший id молча
   съезжает на первый расчёт — заявку могли переоткрыть, а список расчётов пересобрать. */
function curCalcOf(app){
  const list=(app && app.calcs) || [];
  if(!list.length) return null;
  return list.find(c=>c.id===state.curCalc) || list[0];
}
function setCalc(id){ state.curCalc=id; render(); }
function toggleGates(){ state.gatesOpen=!state.gatesOpen; render(); }

function renderCard(){
  const v=document.getElementById('view-card'); const app=appById(state.curApp); if(!app){ state.view='list'; return render(); }
  const st=stageOf(app);
  const tabbar = TABS.map(([k,l])=>`<button class="dtab ${state.curTab===k?'active':''}" onclick="RS.setTab('${k}')">${l}</button>`).join('');
  v.innerHTML = phead(app,st) + gatesPanel(app,st) + `<div class="detail-tabbar">${tabbar}</div>` +
    `<div class="panel-wrap">${panel(app)}</div>` + footer(app);
}
/* РС-32: сигнал повторности — пилюля и ничего больше. Норма (п. 82) маршрут установила, своей
   дополнительной ступени согласования Холдинг над ним надстроить не вправе. */
function repeatPill(app){
  const rep=repeatSignal(app);
  return `<span class="pill mid" title="Порядок согласования не меняется; на категорию риска влияет только решением комитета (ADR-0065)">повторная: ${
    rep.credits.map(c=>esc(c.no)+' — '+c.n+'-я').join(' · ')}</span>`;
}
/* ---- шапка карточки: три уровня вместо одной плотной строки ----
   Прежде шапка несла только идентификацию, и вся — одной строкой «заёмщик · ИНН · виды: … ·
   кредиты: …»: четыре разных по смыслу вещи одним весом, при двух видах и двух кредитах строка
   уезжала в перенос. Числами шапка не говорила ничего — остаток, просрочка, охват, гейты,
   дедлайн, перенос лежали внутри восьми вкладок, и на вопрос «что с заявкой» куратор отвечал
   тремя-четырьмя открытыми вкладками.

   Раскладка (приём credit.html:6280-6316): строка идентификации → компактный маршрут →
   плитки. Плитка без данных НЕ рендерится (tileRelief, credit.html:6129): «—» в шести
   плитках хуже отсутствия плитки. */
function dimTile(label, value, basis){
  return `<div class="dim"><div class="dl">${label}</div><div class="dv">${value}</div>`
    + (basis ? `<div class="src">${basis}</div>` : '') + `</div>`;
}
const nCredits = n => n+' '+(n%10===1&&n%100!==11 ? 'кредит'
  : (n%10>=2&&n%10<=4&&(n%100<10||n%100>=20) ? 'кредита' : 'кредитов'));

/* Дедлайн — своя плитка, а не <small> под точкой маршрута: это единственное число шапки,
   у которого есть срок. Стадия и её номер живут в строке маршрута, здесь не дублируются.
   Стадии 6-8 регламентного срока НЕ имеют (РС-34: п. 18 Порядка №41 меряет 70 к.д. от письма
   до решения целиком) — плитка говорит это вслух, потому что пустое место читается как «успеваем». */
function tileDeadline(app,st){
  if(st.closed) return dimTile('Регламентный срок','—', `заявка закрыта: <b>${esc(st.label)}</b>`);
  const dl=deadline(app);
  if(!dl) return dimTile('Регламентный срок','срока нет',
    'на этой стадии норма собственного срока не устанавливает: п. 18 Порядка №41 меряет 70 к.д. от письма до решения целиком');
  const val = dl.overdue ? `<span class="dl-red">просрочен ${-dl.remaining} дн.</span>` : `осталось ${dl.remaining} дн.`;
  return dimTile(`Регламентный срок · ${esc(dl.name)}`, val,
    `${dl.limit} ${esc(dl.unit)} от <b>${esc(dl.anchor)}</b> — до <b>${esc(dl.due)}</b><br>${esc(normNote(dl.rec))}`
    + (dl.calKnown?'':'<br>календарь года неизвестен — рабочие дни посчитаны приблизительно'));
}
function tileScope(app){
  const crs=(app.creditIds||[]).map(id=>creditById(id)).filter(Boolean);
  if(!crs.length) return dimTile('Охват заявки','—','кредиты не выбраны');
  const bal=round2(crs.reduce((s,c)=>s+(c.balance||0),0));
  const od =round2(crs.reduce((s,c)=>s+(c.odSum||0),0));
  const odDays=Math.max(0,...crs.map(c=>c.odDays||0));
  const rc=crs.reduce((s,c)=>s+(c.restructCount||0),0);
  const others=crs.map(c=>({c,o:activeAppOnCredit(c.id,app.id)})).filter(x=>x.o);
  const parts=[];
  if(crs.length>1) parts.push(crs.map(c=>esc(c.no)).join(' · '));
  parts.push(`остаток <b>${fmt(bal)}</b>`);
  if(od>0) parts.push(`просрочено <b style="color:var(--asubk-red)">${fmt(od)}</b> · ${odDays} дн.`);
  parts.push(`реструктуризаций ранее: <b>${rc}</b>`);
  if(others.length) parts.push(`<span class="dl-red">другая активная заявка: ${
    others.map(x=>esc(x.o.id)+' на '+esc(x.c.no)).join(', ')}</span>`);
  return dimTile('Охват заявки', crs.length===1?esc(crs[0].no):nCredits(crs.length), parts.join('<br>'));
}
function tileKinds(app){
  const names=(app.kindIds||[]).map(id=>kindById(id)?.name).filter(Boolean);
  if(!names.length) return dimTile('Виды реструктуризации','—','вид не выбран — разрешённые параметры не определены');
  const shown=names.slice(0,2), rest=names.length-shown.length;
  const val=`<span style="font-size:15px">${esc(shown.join('; '))}${rest?` <span style="color:var(--text-muted);font-weight:400">и ещё ${rest}</span>`:''}</span>`;
  // две колонки — только когда видов больше одного: при единственном виде вторая половина плитки пуста
  return `<div class="dim${names.length>1?' wide':''}" title="${esc(names.join(' · '))}"><div class="dl">Виды реструктуризации</div>`
    + `<div class="dv">${val}</div><div class="src">разрешённые параметры и распоряжения — объединение выбранных видов</div></div>`;
}
/* Стадийная плитка: до «Анализа» решает пакет (пп. 85-86, 95), дальше — визы заключантов. */
function tilePacket(app,st){
  // возврат без рассмотрения тоже стоит на idx 0: пакет — то, чем заявка кончилась, и он остаётся
  if(st.idx===0){
    const g=packetGate(app);
    if(!g.req.length) return dimTile('Пакет документов','—','виды не выбраны');
    return dimTile('Пакет документов', `${g.req.length-g.missing.length} из ${g.req.length}`,
      g.ok ? 'пакет полон — переход в «Анализ» открыт'
           : `не хватает: ${g.missing.map(esc).join(', ')}`);
  }
  const total=(app.conclusions||[]).length; if(!total) return '';
  const g=conclGate(app);
  return dimTile('Заключения подразделений', `${total-g.pending.length} из ${total}`,
    g.ok ? 'все визы есть — гейт «в Комитет» открыт'
         : `ожидают визы: ${g.pending.map(esc).join(', ')}`);
}
/* Гейты вынесены в шапку: они решают, поедет заявка или нет, а состояние их читалось только
   внутри вкладки «Параметры». Чипы берутся у gateChipsRow — одно определение на макет;
   клик ведёт туда, где лежит разбор. */
function tileGates(app,st){
  if(st.idx<1 || !(app.creditIds||[]).length) return '';
  const lga=limitsGateApp(app), coa=consentGateApp(app), cga=coverGateApp(app), dga=appDriftGate(app);
  const why=[];
  if(!lga.pending && !lga.ok) why.push('Пределы — '+(lga.messages[0]||'предел нарушен'));
  if(!coa.ok) why.push('Согласия — не согласовано: '+coa.pending.join(', '));
  if(!cga.ok) why.push('Покрытие — недостаточно по '+cga.rows.filter(r=>!r.g.ok).map(r=>r.cr?r.cr.no:'—').join(', ')+' (мягкий гейт)');
  // Расхождение — четвёртый упор с 12.08.2026; подпись перечисляет ровно те гейты, что стоят
  // чипами рядом, иначе она пересчитывает их за куратора и ошибается («все три» при четырёх).
  if(dga.applicable && !dga.ok) why.push('Расхождение — ступень 2: '+DRIFT_TIERS[1].need);
  const basis = why.length ? why.map(esc).join('<br>')
    : (lga.pending ? 'Согласия и Покрытие пройдены; Пределы неприменимы до расчёта'
                   : dga.applicable ? 'все гейты пройдены'
                                    : 'гейты пройдены; расхождение не считается — срез не зафиксирован');
  return `<div class="dim wide"><div class="dl">Гейты оформления</div>`
    + `<div class="dv" onclick="RS.toggleGates()" title="${state.gatesOpen?'Свернуть разбор':'Развернуть разбор — под шапкой, один раз на заявку'}">${gateChipsRow(app)}</div>`
    + `<div class="src">${basis}</div></div>`;
}
function tileTransfer(app){
  const list=(app.calcs||[]).filter(c=>!c.excluded); if(!list.length) return '';
  const sum=round2(list.reduce((s,c)=>s+((c.fact&&c.fact.transferSum)||0),0));
  const cov=dsCoverage(app);
  const parts=[`расчётов в работе: <b>${list.length}</b>`];
  if(cov.done.length)     parts.push(`ДС зарегистрировано: <b>${cov.done.length}</b>`);
  if(cov.pending.length)  parts.push(`ждут ДС: <b>${cov.pending.length}</b>`);
  if(cov.excluded.length) parts.push(`снято с оформления: ${cov.excluded.length}`);
  // Охват подписан: плитка складывает перенос по ВСЕЙ заявке, а лента на «Результате расчёта»
  // печатает перенос ОДНОГО расчёта. На однорасчётной заявке числа совпадают и выглядят дублем,
  // на многорасчётной молча разойдутся — различает их подпись, а не догадка (РС-46).
  return dimTile('Перенос и ДС — по всей заявке', sum?fmt(sum):'факт не снят', parts.join('<br>'));
}
function phead(app,st){
  const track = STAGES.map((s,i)=>{
    let cls = i<st.idx?'done': i===st.idx&&!st.closed?'cur':'todo';
    if(st.closed && i<=st.idx) cls='done';
    return (i?`<span class="tl-line ${i<=st.idx?'done':''}"></span>`:'')
      + `<span class="tl-dot ${cls}" title="${esc(s)}">${cls==='done'?'✓':i+1}</span>`;
  }).join('');
  const tiles = [tileDeadline(app,st), tileScope(app), tileKinds(app),
                 tilePacket(app,st), tileGates(app,st), tileTransfer(app)].filter(Boolean).join('');
  return `<div class="panel-wrap"><div class="phead">
    <div class="phead-top">
      <div>
        ${/* пилюли стадии здесь нет: стадию называет строка маршрута прямо под этой, и два
              места для одного слова расходятся при первой же правке */''}
        <div class="phead-name"><span class="nm">Заявка ${app.id}</span>
          ${repeatSignal(app).on?repeatPill(app):''}</div>
        <div class="phead-sub"><b>${esc(app.borrower)}</b> · ИНН ${app.inn} · зарегистрирована ${esc(app.regDate)}</div>
      </div>
      <div class="phead-acts">${outcomeChip(app)}</div>
    </div>
    <div class="timeline">
      <span class="tl-track">${track}</span>
      ${/* у закрытой заявки счётчик не пишем: «Стадия 1 из 9 — Возвращена без рассмотрения»
            читалось бы как начало пути, а путь кончился */''}
      <span class="tl-cur">${st.closed?'':`<span class="cnt">Стадия ${st.idx+1} из ${STAGES.length} —</span> `}<b>${esc(st.label)}</b></span>
    </div>
    <div class="phead-dims">${tiles}</div>
  </div></div>`;
}
function footer(app){
  return `<div class="footer">
    <button class="btn btn-secondary" onclick="RS.go('list')">← К реестру</button>
    <div class="spacer"></div>${advanceBtn(app)}</div>`;
}
function advanceBtn(app){
  const adv=canAdvance(app); if(!adv) return '';
  return `<button class="btn btn-primary" ${adv.ok?'':'disabled title="'+esc(adv.why)+'"'} onclick="RS.advance('${app.id}')">Перевести в «${adv.to}»</button>`;
}

/* --- панели вкладок --- */
function panel(app){
  switch(state.curTab){
    case 'req': return pReq(app);
    case 'concl': return pConcl(app);
    case 'params': return pParams(app);
    case 'result': return pResult(app);
    case 'decision': return pDecision(app);
    case 'formal': return pFormal(app);
    case 'hist': return pHist(app);
  }
  return '';
}

/* 1. Пакет документов — чек-лист: НОРМАТИВНЫЕ документы (пп. 85–86, 95 Положения) плюс документы
   выбранных видов. У нормативной строки виден пункт: требование объясняется нормой, а не
   настройкой (ADR-0099 §5). Условные строки (залоговые предложения п. 86, документы снижения
   ставки п. 95) появляются только когда условие в силе — иначе куратор докладывает бумаги,
   которых норма от него не требует.
   Счётчика, пилюли и красной строки гейта здесь нет: полноту пакета и перечень недостающего
   держит плитка «Пакет документов» в шапке, а блокировку перехода — недоступная кнопка футера. */
/* причина, по которой условная строка нормативного пакета вообще в пакете (подсказка строки) */
const PACKET_COND_WHY = {
  coverShort:'покрытие обеспечением недостаточно либо снимка нет — п. 86 добавляет предложения по залоговому обеспечению',
  rateDown:'в видах есть изменение ставки — пп. 91/95 добавляют документы снижения'
};
/* строка чек-листа: флажок · название · основание требования справа. Флажок отключается на тех же
   условиях, что и раньше (пакет правится только на первой стадии и только у незакрытой заявки). */
function packetRow(app, doc, cite, why, ro){
  return `<label class="op-row chk-row${ro?'':' live'}"${why?` title="${esc(why)}"`:''}>
    <input type="checkbox" ${app.packetDocs[doc]?'checked':''} ${ro?'disabled':''}
      onchange="RS.toggleDoc('${app.id}','${esc(doc)}',this.checked)">
    <span class="op-t">${esc(doc)}</span><span class="op-cite">${cite}</span></label>`;
}
function pReq(app){
  const st=stageOf(app); const g=packetGate(app);
  const ro = st.idx>0 || st.closed;
  const open = st.idx===0 && !st.closed;

  // группа 1 — норма: порядок и пункты берутся из NORM_PACKET, а не из порядка галок.
  // Метки «услов.» на строке нет: normPacket отдаёт условную строку только когда условие уже
  // в силе, то есть всё видимое — требуется. Пометка читалась бы как «возможно понадобится».
  const norm = normPacket(app);
  const normRows = norm.map(d=>packetRow(app, d.doc, `п. ${esc(d.point)}`,
    d.when ? PACKET_COND_WHY[d.when] : '', ro)).join('');

  // группа 2 — документы видов СВЕРХ нормы (kind.docs): показываем у первого вида, который их
  // требует, остальные требующие виды уходят в подсказку — двух одинаковых галок быть не должно
  const normSet = new Set(norm.map(d=>d.doc));
  const shown = new Set();
  const kindGroups = app.kindIds.map(kindById).filter(k=>k && (k.docs||[]).length).map(k=>{
    const rows = k.docs.filter(d=>!normSet.has(d) && !shown.has(d)).map(d=>{ shown.add(d);
      const also = app.kindIds.map(kindById).filter(x=>x&&x.id!==k.id&&(x.docs||[]).includes(d)).map(x=>x.name);
      // основания в строке нет: заголовок группы прямо над ней уже называет вид и его пункт
      return packetRow(app, d, '', also.length?`требуют также виды: ${also.join(' · ')}`:'', ro);
    }).join('');
    return rows ? `<div class="grp-h">Требует вид «${esc(k.name)}»${k.point?` (п. ${esc(k.point)})`:''}</div>
      <div class="ops-list">${rows}</div>` : '';
  }).join('');

  // счётчик — только со второй стадии. На первой его несёт плитка «Пакет документов» в шапке,
  // и там же перечислено недостающее поимённо; состояние гейта сообщает та же плитка, а футер —
  // недоступной кнопкой «Перевести в «Анализ»» с причиной в подсказке. Пилюли «пакет полон» и
  // красной строки «не хватает N из M» здесь нет: это было третье и четвёртое место одного факта.
  const cnt = (st.idx>0 && g.req.length) ? ` <span class="cnt">${g.req.length-g.missing.length} из ${g.req.length}</span>` : '';

  // реквизит обращения: инициатор (п. 83) — зеркало, правится во вкладке «Комитет и решение».
  // Дата регистрации не дублируется: её пишет строка под именем заявки в шапке. Признак
  // initiatorViaEnvoy не печатаем — он выводится из initiator==='omsu', а ярлык этого кода
  // и так несёт «(через полномочного представителя Президента в области)».
  const initLabel = (INITIATORS.find(i=>i.code===app.initiator)||{}).label || null;
  const retWhen = (app.outcome==='возврат' && app.history.length) ? app.history[app.history.length-1].when : null;
  const reqLine = `${initLabel?`<div class="section-note" style="margin-bottom:6px">Инициатор: <b>${esc(initLabel)}</b> (п. 83).</div>`:''}
    ${retWhen?`<div class="section-note">Возвращена без рассмотрения <b>${retWhen}</b>${
      g.missing.length?' — неполный пакет':' — причина в истории заявки'}.</div>`:''}`;

  const retBtn = open
    ? `<div style="border-top:1px solid var(--border-default); margin-top:16px; padding-top:14px; max-width:760px">
        <button class="btn btn-secondary btn-sm" onclick="RS.returnApp('${app.id}')">Вернуть без рассмотрения</button>
        <div class="section-note" style="margin:8px 0 0">Заявка закроется на первой стадии — маршрут дальше не пойдёт.</div>
      </div>` : '';

  const body = g.req.length
    ? `<div class="grp-h" style="margin-top:12px">Нормативный пакет</div>
       <div class="ops-list">${normRows}</div>${kindGroups}`
    : '<div class="ops-list"><div class="op-empty">Виды не выбраны — требований к пакету нет.</div></div>';

  return `<div class="detail-panel active">
    <div class="section-h">Пакет документов${cnt}</div>
    ${reqLine}
    <div style="max-width:760px">${body}</div>
    ${retBtn}
  </div>`;
}

/* 2. Заключения (Р-5) */

  const g=conclGate(app);
  const cards=app.conclusions.map((c,i)=>{
    const mine = canX('editConcl:'+c.dept);
    return `<div class="concl-card">
      <div class="ch"><span class="cn">Заключение: ${esc(c.dept)}</span>
        ${c.visa?`<span class="gatechip ok">✓ виза ${c.visaDate}</span>`:`<span class="gatechip no">без визы</span>`}</div>
      <div class="field col-span"><textarea ${mine&&!c.visa?'':'disabled'} placeholder="${mine?'Текст заключения…':'Правит только заключант '+esc(c.dept)}"
        onchange="RS.setConclText('${app.id}',${i},this.value)">${esc(c.text)}</textarea></div>
      <div style="margin-top:8px">
        ${!c.visa?`<button class="btn btn-success btn-sm" ${mine?'':'disabled'} onclick="RS.visaConcl('${app.id}',${i})">Завизировать</button>`
          :`<span class="mode-tag">Завизировано ${c.visaDate}</span>`}
