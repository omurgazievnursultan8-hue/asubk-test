  MOCKUP (single-file, interactive) — TO-BE модуля «Реструктуризация (урегулирование)
  задолженности» (реестр заявок → карточка заявки → справочник видов). Образец для
  команды разработки, не прод-код. Экрана реструктуризации в живой системе нет — модуль
  проектируется с нуля.

  Канон логики: mockups/restructuring/ASUBK-restrukturizatsiya-logika.md (решения РС-1…РС-41;
  РС-1…РС-25 пересобраны 05.08.2026 с чистого листа, РС-26…РС-37 приняты 10.08.2026 при
  закрытии вопросов заказчику, РС-38…РС-41 — тем же вечером при закрытии собственной дыры
  «распределение по периодам» (ADR-0109); карта прежних Р-1…Р-28 → РС — §13 спеки).
  Регуляторная база: п.18–19 «Порядка мониторинга, взыскания и урегулирования задолженности
  ОАО "Госфинхолдинг"» (ред. №41 от 06.07.2026) + гл. 9 и п. 34 «Положения о работе с
  бюджетными кредитами» — приложение к постановлению Кабинета Министров КР от 19.01.2026 № 14,
  редакция 19.01.2026; извлечение: docs/normativ/polozhenie-2026-01-19-N14-gl9.txt.
  Стиль сверен с mockups/collateral/zalog.html.
  Проверка: node scripts/inspect/restructuring-check.mjs — матрица приёмки §14 спеки.

  РЕАЛИЗОВАННЫЕ РЕШЕНИЯ
   РС-1  Владелец факта «идёт рассмотрение» — заявка (не взыскание); шов в журнал мер.
   РС-2  Единица работы — заявка; якорь — ключ субъекта; охват — траншы, не кредиты.
   РС-3  «Версия условий» отменена: расчёт живёт у заявки, записи условий — у кредита.
   РС-4  Производный транш: освоение либо разделение по ДС; исходный — по старым условиям.
   РС-5  Долг на любую дату — выводимая величина; снимок только под удостоверяющим событием.
   РС-6  Делим только при расхождении условий; счётчик реструктуризаций считает ДС.
   РС-7  База переноса — по статьям, не одним числом; срочный остаток по умолчанию не входит.
   РС-8  Два датированных числа: срез (согласовательный) и факт на дату вступления ДС.
   РС-9  Движок амортизации один, владеет им кредит; заявка зовёт его только для черновика.
   РС-10 Одна дверь — restructureApplied(ds); отмена — компенсирующий ДС, не откат.
   РС-11 Распоряжение начисленным — 4 исхода: капитализация · распределение · прощение · нет.
   РС-12 Термин «накопленные», не «рассроченные» — так называет их живое приложение.
   РС-13 Накопленные — отдельные статьи долга (7 статей), не дорожка срочности.
   РС-14 Прощение — списание словаря кредита; в конвейере идёт до капитализации.
   РС-15 «Режима просрочки» как реквизита вида нет; дни обнуляются датой вступления ДС.
   РС-16 Терминал «Реструктурирована» — по условию: только если не осталось непокрытой просрочки.
   РС-17 Согласие обеспечителей — жёсткий гейт регистрации ДС (третьи лица).
   РС-18 Гейт покрытия — мягкий, считает его залог; недостаточность снимается waiver с основанием.
   РС-19 Регуляторные пределы — из нормы-справочника; пол ставки от первоначальной, срок — от остатка задолженности.
   РС-20 Деньги при вступлении: адресный резерв → безадресный аванс; план кредита не двигается.
   РС-21 Пауза — шов при отправке письма (70 к.д.); закрывается отказом/вступлением ДС/истечением срока.
   РС-22 Отложение 181-го дня читается из заявки, не из состояния требования.
   РС-23 Стадия — свёртка журнала актов заявки; поля stage нет.
   РС-24 Вид — справочник: параметры + распоряжения + пакет документов; несколько видов — объединение.
   РС-25 Роли (6) через canX(); журнал append-only; оси заёмщика реструктуризация не трогает.
   РС-26 Порог расхождения «срез ↔ факт» — две ступени: 10%/500 тыс. → виза; 25%/5 млн → возврат на комитет.
   РС-27 Пеня — терминальная статья: на неё не начисляют и она не порождает начисления (ADR-0106).
   РС-28 Прощение доступно, только если прощаемая сумма названа в акте (жёсткий гейт).
   РС-29 Гейт покрытия снимает комитет по администрированию бюджетных кредитов; снятие раскрывается в пакете.
   РС-30 Рабочие дни — производственный календарь (справочник дат), а не правило «сб/вс».
   РС-31 Перечень видов открыт нормой (п. 89 пп. 5); пять форм нормативные и неправимые, прочее — «иное».
   РС-32 Повторность — сигнальный признак с третьей реструктуризации, не гейт.
   РС-33 Норма установлена: прил. к ПКМ КР от 19.01.2026 № 14, ред. 19.01.2026 — реквизиты реальные.
   РС-34 Маршрут акта: заключение органа (пп. 87/88) → согласование профильного комитета ЖК → постановление КМ (ADR-0107).
   РС-35 Полов ставки два, применяется больший: 50% от первоначальной и минимум по виду проекта (п. 34).
   РС-36 Пакет документов — норма (пп. 85/86 + условные пп. 91/95), а не настройка администратора.
   РС-37 База предела срока — остаток задолженности по кредиту; предел = длина нового графика.
   РС-38 Распоряжение несёт сумму и сроки; сроки — «весь график» либо интервал позиций.
   РС-39 Распоряжение меняет статью (начисленное → накопленное) и снимает просрочку по покрытому.
   РС-40 Интервал за длиной плана не подрезается молча — жёсткий гейт до правки (ИР-15).
   РС-41 Строка графика несёт статьи; ставка начисляется только по колонке основного долга.

  ДЕМО-ОГРАНИЧЕНИЯ
   • «Сегодня» демо зафиксировано (TODAY) — счётчики дедлайнов считаются от него.
   • Производственный календарь засеян постоянными праздниками КР; переносы и религиозные
     праздники заведены записью только на 2026 год — на прочие годы календарь честно
     показывает «год не заведён» (РС-30), а не молча откатывается к «сб/вс».
   • Расчёт графика — детерминированный аннуитет-упрощение (демонстрация «версия вперёд»),
     не банковский расчётный движок.
   • Мини-зеркало взыскания — read-only панель на демо-данных, навигация внутристраничная.

  --status-warning:var(--asubk-amber); --status-warning-bg:var(--asubk-amber-tint);
  --status-error:var(--asubk-red); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:320px;   /* как в credit.html — оболочка одна */
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
a{ color:inherit; }
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
/* Сайдбар — общий канон макетов АСУБК (credit.html · collection.html · zalog.html):
   дерево .nav-group → .nav-sub → .nav-item, чеврон 14/13 px, подвал «[admin] + выход».
   Прежде здесь стоял плоский список из двух пунктов, и модуль не показывал, что вокруг
   него есть система: соседи о реструктуризации знают (credit.html — «Проблемная
   задолженность → Реструктуризация»), а она о них — нет. */
.brand{ padding:18px 16px 14px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.nav{ flex:1; overflow-y:auto; padding-bottom:8px; }
.nav-toggle{ display:flex; align-items:center; gap:8px; width:100%; appearance:none;
  border:none; background:transparent; color:rgba(24,39,57,0.82); cursor:pointer; text-align:left; }
.nav-group > .nav-toggle{ padding:9px 16px; font:var(--weight-semibold) 15px/1.3 var(--asubk-font); }
.nav-sub > .nav-toggle{ padding:8px 16px 8px 32px; font:var(--weight-semibold) 14px/1.3 var(--asubk-font); }
.nav-toggle:hover{ background:rgba(24,39,57,0.04); }
.nav-toggle .chev{ display:inline-flex; align-items:center; color:rgba(24,39,57,0.5);
  transition:transform 120ms ease; flex:none; }
.nav-group.open > .nav-toggle .chev, .nav-sub.open > .nav-toggle .chev{ transform:rotate(90deg); }
.nav-toggle .lbl{ flex:1; }
.nav-children{ display:none; }
.nav-group.open > .nav-children, .nav-sub.open > .nav-children{ display:block; }
.nav-item{ display:block; padding:7px 16px 7px 52px; text-decoration:none; color:rgba(27,43,65,0.69);
  font:var(--weight-regular) var(--text-base)/1.625 var(--asubk-font); cursor:pointer; }
.nav-item.headerless{ padding-left:40px; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); }
.nav-item.stub{ color:var(--text-placeholder); font-style:italic; }
.sidebar-foot{ display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; color:var(--text-muted); }
.sidebar-foot span{ font:var(--weight-regular) 14px/1.2 var(--asubk-font); }
.icon-btn{ border:none; background:rgba(24,39,57,0.05); color:var(--text-link); cursor:pointer;
  padding:7px; border-radius:4px; display:flex; }
.app.nav-collapsed .sidebar{ display:none; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ height:var(--header-h); flex:none; background:var(--surface-page);
  border-bottom:1px solid var(--border-default); display:flex; align-items:center; gap:14px; padding:0 20px; }
.topbar .menu{ color:var(--text-muted); display:flex; cursor:pointer; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.crumb-title .bk{ color:var(--text-link); cursor:pointer; }
.crumb-title .bk:hover{ text-decoration:underline; }
.role-wrap{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.role-wrap label{ font:var(--font-label); color:var(--text-muted); }
.role-wrap select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; display:flex; flex-direction:column; min-width:0; }
.view{ display:none; flex-direction:column; }
.view.active{ display:flex; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  height:var(--control-h); padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--action-primary-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-sm{ height:32px; padding:0 10px; font-size:var(--text-sm); }
.btn-tint{ background:var(--asubk-disabled-fill); color:var(--text-link); border:none; font-weight:var(--weight-medium); }
.btn-tint:hover:not(:disabled){ background:rgba(25,59,103,0.10); }
/* ---- строка фильтра реестра заявок ----
   Один ярус: у заявки три условия выборки (поиск · стадия · исход), и все три задаёт
   каждая роль на каждом входе в реестр — второго яруса «⚙ Фильтры» из credit.html
   здесь прятать нечего. Ширины — по содержимому контрола, свободное место уходит
   в разрыв перед кнопками. */
.tb-quick{ display:flex; align-items:flex-end; gap:10px; padding:8px 20px 10px; flex-wrap:wrap; }
.tb-quick .field{ min-width:0; }
.tb-quick .q-search{ width:320px; }
.tb-quick .q-stage{ width:210px; }
.tb-quick .q-outcome{ width:170px; }
.tb-quick .q-more{ margin-left:auto; }
.control{ position:relative; display:flex; align-items:center; }
.control .caret{ position:absolute; right:9px; pointer-events:none; color:var(--text-muted); font-size:11px; }
.control select{ padding-right:26px; appearance:none; }
.tb-actions{ display:flex; align-items:center; gap:10px; padding:10px 20px 12px; }
.tb-actions .spacer{ flex:1; }

/* ---- грид реестра ----
   Визуальная система взята из «Списка кредитов» (credit.html:1170-1244), который сам
   снят с живого vaadin-grid на fkftest: тёмная полужирная шапка 14px, ↕ у КАЖДОЙ
   колонки всегда на виду, зебра, ховер поверх зебры. Два реестра стоят рядом в одном
   конвейере (из кредита открывается заявка, из заявки — кредит) и обязаны читаться
   как один продукт.
   Фиксированные ширины и обрезка в «…» живут на модификаторе .reg — у справочника
   видов (renderDict) колонки со списками документов и параметров, им нужен перенос,
   а не обрезка. */
.grid-wrap{ padding:0 20px 20px; overflow:auto; }
table.grid{ width:100%; border-collapse:separate; border-spacing:0; font:var(--font-label);
  background:var(--surface-card); }
table.grid.reg{ table-layout:fixed; min-width:1244px; }   /* = сумма ширин colgroup */
table.grid thead th{ position:sticky; top:0; z-index:2; background:var(--asubk-gray-300);
  text-align:left; padding:7px 12px; vertical-align:middle;
  border-bottom:1px solid var(--border-strong);
  font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:none; }
table.grid.reg thead th{ cursor:pointer; }
table.grid thead th .sort{ margin-left:4px; font-size:11px; color:var(--text-placeholder); }
table.grid thead th.sorted{ color:var(--asubk-blue); }
table.grid thead th.sorted .sort{ color:var(--asubk-blue); }
table.grid tbody td{ padding:5px 12px; border-bottom:1px solid var(--border-default);
  color:var(--text-body); vertical-align:top; }
table.grid.reg tbody td{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.grid tbody tr{ cursor:pointer; }
/* зебра — чётные строки очень светлой заливкой, чтобы взгляд не съезжал по строке */
table.grid tbody tr:nth-child(even) td{ background:var(--asubk-gray-50); }
/* ховер и состояния строки обязаны перебивать зебру — поэтому ниже по каскаду */
table.grid tbody tr:hover td{ background:var(--asubk-gray-150); }
table.grid tbody tr.overdue td{ background:rgba(224,58,58,0.06); }
table.grid tbody tr.overdue:hover td{ background:rgba(224,58,58,0.12); }
table.grid tbody tr.terminal td{ color:var(--text-muted); }
table.grid tbody tr.terminal td:first-child{ font-style:italic; }
/* главная строка ячейки-имени и вторая, приглушённая (дата, ИНН, куратор) */
.grid td .cell-name{ font-weight:var(--weight-medium); color:var(--text-heading); }
.grid td .sub{ display:block; margin-top:1px; color:var(--text-muted);
  font-weight:var(--weight-regular); font-size:12px; line-height:1.25;
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; }
.grid td .sub.inline{ display:inline; margin-top:0; margin-left:6px; }
/* метка у номера заявки — тот же приём, что Т·N/Р·N у номера договора в credit.html */
.mk{ display:inline-block; margin-left:6px; padding:1px 6px; border-radius:var(--radius-sm);
  background:var(--asubk-tint-fill); color:var(--text-muted);
  font:var(--weight-medium) 11px/1.5 var(--asubk-font); vertical-align:middle; }
.mk-r{ background:var(--status-info-bg); color:var(--asubk-blue); }

/* пейджер под гридом (credit.html:1222-1234) */
.pager{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:0 20px 20px;
  font:var(--font-label); color:var(--text-muted); }
.pager .pages{ display:flex; align-items:center; gap:4px; }
.pager .pg{ min-width:28px; height:28px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card);
  color:var(--text-body); cursor:pointer; user-select:none; }
.pager .pg:hover{ background:var(--surface-hover); }
.pager .pg.active{ background:var(--action-primary); border-color:var(--action-primary); color:#fff; cursor:default; }
.pager .pg.dis{ color:var(--text-disabled); cursor:default; background:var(--asubk-disabled-fill); }
.pager .psize select{ height:28px; min-width:72px; margin-left:6px; border:1px solid var(--border-default);
  border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-body); font:var(--font-label); }
.pager .pinfo{ margin-right:auto; }
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.low{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.mid{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.high{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.dl-red{ color:var(--asubk-red); font-weight:600; }
.dl-ok{ color:var(--text-muted); }
/* Восемь вкладок на 1280 не помещались в строку и уезжали в горизонтальную прокрутку — «Оформление»
   и «История» пропадали за краем, а навигация, которую не видно, навигацией не работает. Перенос
   на вторую строку вместо прокрутки: вкладок фиксированное число, а не растущий список. */
.detail-tabbar{ display:flex; flex-wrap:wrap; padding:6px 20px 0; border-bottom:1px solid var(--border-default);
  background:var(--surface-page); flex:none; }
.dtab{ flex:none; border:none; background:transparent; padding:11px 14px;
  font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); color:var(--text-muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap; }
.dtab:hover{ color:var(--text-body); }
.dtab.active{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.panel-wrap{ padding:18px 20px 8px; max-width:1200px; }
.detail-panel{ display:none; }
.detail-panel.active{ display:block; }
/* Шапка карточки — оболочка как в credit.html (:1277-1303): рамки у неё нет, вес несут
   плитки. Рамка вокруг рамок дала бы двойную коробку. */
.phead{ padding:0; margin-bottom:18px; }
.phead-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.phead-name{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.phead-name .nm{ font:var(--weight-semibold) 18px/1.2 var(--asubk-font); color:var(--text-heading); }
.phead-sub{ font:var(--font-label); color:var(--text-muted); margin-top:4px; }
.phead-sub b{ color:var(--text-body); font-weight:var(--weight-medium); }
.phead-acts{ display:flex; align-items:flex-start; gap:8px; flex:none; }
/* Плиток переменное число — тайл без данных не рендерится вовсе, поэтому auto-fit, а не
   жёсткие четыре колонки. */
.phead-dims{ display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:12px; align-items:stretch; }
.dim{ background:var(--surface-panel); border-radius:var(--radius-md); padding:10px 14px; }
.dim.wide{ grid-column:span 2; }
/* 800px: сайдбар 260 + отступы оставляют < 476px = двух треков minmax(232) уже не хватает,
   и span 2 продавил бы второй трек ниже минимума */
@media(max-width:800px){ .dim.wide{ grid-column:span 1; } }
.dim .dl{ font:12px/1.3 var(--asubk-font); color:var(--text-muted); margin-bottom:5px; }
.dim .dv{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); }
.dim .dv .gatechip{ margin:0 6px 4px 0; cursor:pointer; }
.dim .src{ font:var(--weight-regular) 11.5px/1.45 var(--asubk-font); color:var(--text-muted); margin-top:5px; }
.dim .src b{ color:var(--text-body); font-weight:var(--weight-medium); }
.dim .src .dl-red{ font-size:11.5px; }
/* Маршрут — компактная полоса: девять точек в ряд, подпись только у текущей стадии.
   Названия стадий длинные («Заключение уполномоченного органа»), девять подписей в строку
   не помещаются и рвали шапку на три ряда; остальные читаются наведением (title). */
.timeline{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
.tl-track{ display:flex; align-items:center; gap:0; flex:none; }
.tl-dot{ width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font:var(--weight-bold) 11px/1 var(--asubk-font); flex:none; }
.tl-dot.done{ background:var(--asubk-green); color:#fff; }
.tl-dot.cur{ background:var(--asubk-blue); color:#fff; box-shadow:0 0 0 3px var(--status-info-bg); }
.tl-dot.todo{ background:var(--surface-input); color:var(--text-placeholder); }
.tl-line{ width:14px; height:2px; flex:none; background:var(--asubk-gray-200); }
.tl-line.done{ background:var(--asubk-green); }
.tl-cur{ font:var(--font-label); color:var(--text-body); }
.tl-cur b{ color:var(--text-heading); font-weight:var(--weight-semibold); }
.tl-cur .cnt{ color:var(--text-muted); }
.section-h{ font:var(--weight-semibold) 17px/1.2 var(--asubk-font); color:var(--text-heading); margin:2px 0 6px; }
.section-note{ font:var(--font-label); color:var(--text-muted); margin:0 0 14px; max-width:900px; }
.gtoolbar{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.gtoolbar .spacer{ flex:1; }
.cgrid-wrap{ border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:auto; min-height:60px; margin-bottom:16px; }
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label); white-space:nowrap; }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-card);
  border-bottom:1px solid var(--border-default); font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font);
  color:var(--text-heading); }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--border-default); color:var(--text-body); vertical-align:middle; }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
.numcell{ text-align:right; font-variant-numeric:tabular-nums; }
.diff-old{ color:var(--text-muted); text-decoration:line-through; }
.diff-new{ color:var(--asubk-green); font-weight:600; }
.diff-changed td{ background:rgba(0,106,245,0.05); }
.rowlink{ color:var(--text-link); cursor:pointer; }
.rowlink:hover{ text-decoration:underline; }
.flagline,.okline,.infoline,.warnline{ display:flex; gap:8px; align-items:flex-start; border-radius:var(--radius-md);
  padding:10px 12px; font:var(--font-label); margin:0 0 14px; }
.flagline{ background:var(--status-error-bg); color:var(--asubk-red); }
.okline{ background:var(--status-success-bg); color:var(--asubk-green); }
.infoline{ background:var(--status-info-bg); color:var(--asubk-blue); }
.warnline{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.gatechip{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); }
.gatechip.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.gatechip.no{ background:var(--status-error-bg); color:var(--asubk-red); }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:14px 32px; align-items:start; max-width:920px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.col-span{ grid-column:1 / -1; }
.field .flabel{ font:var(--font-label); color:var(--text-muted); }
.field .flabel .ro-tag{ color:var(--text-placeholder); font-size:11px; }
.field input,.field select,.field textarea{ height:var(--control-h); border-radius:var(--radius-md);
  background:var(--surface-card); color:var(--text-body); font:var(--font-body); font-weight:var(--weight-medium);
  border:1px solid var(--border-strong); outline:none; padding:0 10px; width:100%; }
.field textarea{ height:auto; min-height:70px; padding:8px 10px; resize:vertical; font-weight:400; }
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--border-focus); box-shadow:0 0 0 3px var(--asubk-blue-tint); }
.field input:disabled,.field select:disabled,.field textarea:disabled{ background:var(--surface-input); color:var(--text-muted); border-color:transparent; cursor:not-allowed; }
.chk{ display:flex; align-items:center; gap:8px; font:var(--font-label); color:var(--text-body); padding:4px 0; }
.chk input{ width:16px; height:16px; }
.chk.dead{ color:var(--text-placeholder); }
.chk.dead .lbl{ text-decoration:line-through; }
.concl-card{ border:1px solid var(--border-default); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:12px; }
.concl-card .ch{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.concl-card .ch .cn{ font:var(--weight-semibold) 15px/1.2 var(--asubk-font); color:var(--text-heading); flex:1; }
.ops-list{ border:1px solid var(--border-default); border-radius:var(--radius-md); margin:10px 0 16px; }
.op-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--asubk-grid-line); font:var(--font-label); }
.op-row:last-child{ border-bottom:none; }
.op-row .op-t{ flex:1; }
.op-empty{ padding:14px 12px; color:var(--text-placeholder); font:var(--font-label); }
/* строка-чекбокс в ops-list: название бывает в четыре строки, поэтому флажок держится за первую,
   а цитата нормы не ужимается остатком ширины (иначе «п. 85 пп. 1» рвётся по одному слову) */
.op-row.chk-row{ align-items:flex-start; }
.op-row.chk-row.live{ cursor:pointer; }
.op-row.chk-row input{ width:16px; height:16px; flex:none; margin:2px 0 0; }
.op-cite{ flex:none; text-align:right; white-space:nowrap; font-size:11px; color:var(--text-placeholder); }
.grp-h{ font:var(--weight-semibold) 13px/1.3 var(--asubk-font); color:var(--text-muted); margin:14px 0 6px; }
.section-h .cnt{ font:var(--font-label); font-weight:var(--weight-regular); color:var(--text-muted); margin-left:8px; }
.hist{ border-left:2px solid var(--border-strong); margin-left:6px; }
.hrow{ position:relative; padding:10px 0 10px 22px; border-bottom:1px solid var(--asubk-grid-line); }
.hrow::before{ content:""; position:absolute; left:-5px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--asubk-blue); }
.hrow.auto::before{ background:var(--asubk-amber); }
.hrow.waiver::before{ background:var(--asubk-red); }
.hrow .hwhen{ font:var(--weight-medium) 13px/1.3 var(--asubk-font); color:var(--text-muted); }
.hrow .hwhat{ font:var(--font-label); color:var(--text-body); margin-top:2px; }
.hrow .hwho{ font:12px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }
.mirror{ border:1px solid var(--border-strong); border-radius:var(--radius-md); padding:14px 16px; background:var(--surface-panel); margin-bottom:16px; }
.mirror .mh{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font:var(--weight-semibold) 14px/1.2 var(--asubk-font); color:var(--text-heading); }
.mirror .mbanner{ background:var(--status-warning-bg); color:var(--asubk-amber); border-radius:var(--radius-md); padding:8px 12px; font:var(--font-label); margin-bottom:8px; }
.mirror .mrow{ display:flex; justify-content:space-between; padding:4px 0; font:var(--font-label); border-bottom:1px solid var(--asubk-grid-line); }
.mirror .mrow:last-child{ border-bottom:none; }
.mirror .mrow span:first-child{ color:var(--text-muted); }
.footer{ position:sticky; bottom:0; background:var(--surface-page); border-top:1px solid var(--border-default);
  padding:14px 20px; display:flex; align-items:center; gap:12px; }
.footer .spacer{ flex:1; }
.overlay{ position:fixed; inset:0; background:rgba(16,28,46,0.42); display:none; align-items:center;
  justify-content:center; z-index:60; padding:24px; }
.overlay.open{ display:flex; }
.modal{ background:var(--surface-card); border-radius:var(--radius-lg); width:min(680px,100%); max-height:88vh;
  display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }
.modal.wide{ width:min(920px,100%); }
.modal-h{ padding:18px 24px 12px; display:flex; align-items:center; gap:10px; }
.modal-h .mt{ font:var(--weight-bold) 19px/1.2 var(--asubk-font); color:var(--text-heading); flex:1; }
.modal-x{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); font-size:20px; line-height:1; padding:4px 8px; }
.modal-b{ padding:4px 24px 8px; overflow:auto; flex:1; }
.modal-f{ padding:14px 24px 20px; display:flex; gap:12px; justify-content:flex-end; }
.mform{ display:grid; grid-template-columns:1fr 1fr; gap:14px 32px; align-items:start; padding-top:6px; }
.mform .field.col-span{ grid-column:1 / -1; }
.mform .field.req .flabel::after{ content:" •"; color:var(--action-danger); }
.toast-wrap{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:80; }
.toast{ min-width:260px; max-width:440px; padding:12px 14px; border-radius:var(--radius-md);
  background:var(--asubk-ink); color:#fff; font:var(--font-label); box-shadow:0 10px 30px rgba(16,28,46,0.3); }
.toast.ok{ background:var(--asubk-green); }
.toast.warn{ background:var(--asubk-amber); }
.toast.err{ background:var(--asubk-red); }
.badge-set{ display:flex; gap:6px; flex-wrap:wrap; }
.mode-tag{ font-size:11px; color:var(--text-placeholder); }
.strike{ text-decoration:line-through; color:var(--text-placeholder); }
.normcite{ font-size:11px; color:var(--text-placeholder); margin-top:2px; }
.two-num-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; max-width:920px; margin-bottom:16px; }
@media(max-width:760px){ .two-num-grid{ grid-template-columns:1fr; } }
.numtile{ border:1px solid var(--border-default); border-radius:var(--radius-md); padding:12px 14px; }
.numtile .nt-l{ font:var(--font-label); color:var(--text-muted); margin-bottom:4px; }
.numtile .nt-v{ font:var(--weight-semibold) 19px/1.2 var(--asubk-font); color:var(--text-heading); }
.numtile .nt-d{ font:11px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:4px; }
.numtile.delta.flag{ border-color:var(--asubk-amber); background:var(--status-warning-bg); }
.numtile.delta.flag .nt-v{ color:var(--asubk-amber); }
/* СТРОКА ПЕРЕХОДА — деньги сделки одной лентой: остаток источника → база переноса →
   распоряжения → перенос, всего → остаток источника после переноса. Прежде на этом месте
   стояли две коробки (split-box): одна печатала остаток источника, другая перенесённую базу,
   а чем первое превращается во второе, экран молчал — два числа рядом и ничего между ними. */
.flowline{ display:flex; flex-wrap:wrap; align-items:stretch; max-width:920px; margin:0 0 12px;
  border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; background:var(--surface-card); }
.flowline .fl-i{ flex:1 1 140px; padding:10px 14px; display:flex; flex-direction:column; gap:3px;
  border-left:1px solid var(--border-default); }
.flowline .fl-i:first-child{ border-left:none; }
.flowline .fl-l{ font-size:11px; color:var(--text-muted); }
.flowline .fl-v{ font:var(--weight-semibold) 15px/1.2 var(--asubk-font); color:var(--text-heading); font-variant-numeric:tabular-nums; }
.flowline .fl-i.main{ background:var(--asubk-blue-tint); }
.flowline .fl-i.main .fl-v{ color:var(--asubk-blue); font-size:17px; }
.flowline .fl-i .fl-s{ font-size:11px; color:var(--text-placeholder); }
.flowline .fl-op{ flex:0 0 auto; align-self:center; padding:0 8px; color:var(--text-placeholder); font-size:14px; }
/* Сравнение условий идёт той же cgrid, что и долг расчёта. Колонка «Δ» несёт ТОЛЬКО ЧИСЛО:
   характер значения («новое», «изменено», «не названо — остаётся прежним») стоит подписью под
   самим значением, в графе «По расчёту». Строки без движения добиваются в ТУ ЖЕ таблицу — вторая
   таблица за раскрытием печатала те же четыре заголовка вторым экземпляром. */
/* Ширина у сравнения своя: во всю строку карточки «36» и «60» разъезжались к разным краям
   экрана, и пара, ради которой таблица заведена, читалась как два несвязанных числа. Доли
   пересчитаны под подписи в графе «По расчёту»: 30/20/34/16 вместо 34/22/22/22. С графиками
   таблица роднится левым краем и потолком 920, а не колонками — колонки у них разной природы. */
.cmp-wrap{ max-width:920px; }
.nb{ white-space:nowrap; }
table.cgrid.cmp{ table-layout:fixed; }
table.cgrid.cmp thead th{ white-space:normal; vertical-align:bottom; }   /* дата и пилл уходят на вторую строку, а не в соседа */
table.cgrid.cmp th:nth-child(1), table.cgrid.cmp td:nth-child(1){ width:30%; }
table.cgrid.cmp th:nth-child(2), table.cgrid.cmp td:nth-child(2){ width:20%; text-align:right; }
table.cgrid.cmp th:nth-child(3), table.cgrid.cmp td:nth-child(3){ width:34%; text-align:right; white-space:normal; }
table.cgrid.cmp th:nth-child(4), table.cgrid.cmp td:nth-child(4){ width:16%; padding-left:18px; white-space:normal; }
table.cgrid td.cmp-d{ color:var(--asubk-blue); white-space:nowrap; font-variant-numeric:tabular-nums; }
table.cgrid td.cmp-was{ color:var(--text-muted); font-variant-numeric:tabular-nums; }
table.cgrid td.cmp-now{ font-variant-numeric:tabular-nums; }
/* График занимает СТОЛЬКО, СКОЛЬКО В НЁМ КОЛОНОК: 130 px на колонку, потолок 920 — дальше
   прокрутка внутри рамки. Растянутая по ширине карточки таблица на трёх колонках оставляла
   между «Датой» и числами пустую полосу в пол-экрана. */
.cgrid-wrap.sched{ max-width:920px; }
table.cgrid.sched{ table-layout:fixed; }
/* Статейные заголовки длиннее своих 130 px («Накопленные проценты») — переносятся по словам,
   иначе печатались поверх соседа. */
table.cgrid.sched thead th{ white-space:normal; vertical-align:bottom; line-height:1.3; }
/* Раскрытие живёт СТРОКОЙ ТАБЛИЦЫ, а не ярлыком под ней: «показаны первые 6 из 60» сообщало об
   усечении и не открывало ничего. */
table.cgrid tr.more-row td{ padding:8px 12px; }
/* Подпись итога с числом не влезает в 130 px одной строкой («Перенос по этому расчёту 118 000»)
   и наезжала на сумму «Тела». Ломается по словам, число — своей строкой. */
table.cgrid.sched tfoot th.ft-l{ white-space:normal; line-height:1.3; text-align:left; }
table.cgrid.sched tfoot th.ft-l .ft-v{ display:block; font-variant-numeric:tabular-nums; }
.sched-note{ margin:-8px 0 16px; max-width:920px; }
.nosplit-banner{ max-width:920px; }
/* Полоса охвата: она же выбор расчёта. Охват называет траншы (РС-2), а транш и его расчёт —
   одно и то же (ИР-16), поэтому список траншей заявки и список расчётов — один список, и
   рисуется он один раз. Экран показывает ОДИН расчёт, а не стопку секций: адрес правки виден
   карточкой полосы, а не только в аргументах сеттеров. Отдельной вкладки «Охват» нет — она
   печатала тот же список вторым экземпляром и брала его из производного creditIds. */
.scope-strip{ display:flex; gap:8px; flex-wrap:wrap; align-items:stretch; margin:0 0 14px; }
.spick{ display:flex; flex-direction:column; gap:3px; align-items:flex-start; cursor:pointer; text-align:left;
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card);
  padding:9px 14px; font:var(--font-label); color:var(--text-body); position:relative; }
.spick:hover{ border-color:var(--border-strong); }
.spick.active{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); }
.spick.lone{ cursor:default; }
.spick .cp-t{ font:var(--weight-semibold) 14px/1.2 var(--asubk-font); color:var(--text-heading); }
.spick .cp-n{ font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
/* Скрининг — то, ради чего вкладка «Охват» и держалась: просрочка, чужая активная заявка (ИР-1),
   зеркало взыскания, счётчик прежних реструктуризаций. Стоит он на строке транша, а не таблицей
   на своей вкладке: читают его, когда выбирают транш, а не отдельным заходом. */
.spick .cp-f{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:2px; }
.spick .sp-drop{ border:0; background:none; cursor:pointer; color:var(--text-placeholder);
  font:var(--font-label); padding:0 2px; line-height:1; }
.spick .sp-drop:hover{ color:var(--asubk-red); }
.spick-add{ display:flex; align-items:center; border:1px dashed var(--border-strong); border-radius:var(--radius-md);
  background:none; cursor:pointer; padding:9px 14px; font:var(--font-label); color:var(--text-link); }
.spick-add:hover{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); }
.scope-strip .sp-empty{ align-self:center; color:var(--text-placeholder); font:var(--font-label); }
/* Строка статьи: название со срочностью, под ним — «начисляется» (свойство справочника ушло из
   отдельной колонки туда, где его читают) и дельта под числом факта. */
table.cgrid .a-t{ font:var(--weight-medium) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading); }
table.cgrid .a-s{ font:11px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }
table.cgrid .a-s.up{ color:var(--asubk-amber); }
table.cgrid .dash{ color:var(--text-placeholder); cursor:help; }
table.cgrid.cbase tbody td{ vertical-align:top; }
/* Таблица долга расчёта обязана помещаться в карточку целиком: горизонтальная прокрутка тут
   прячет не хвост данных, а колонку «Распоряжение» — то самое поле ввода, ради которого на
   вкладку и заходят. Общий для .cgrid nowrap распирал таблицу до 1145 px (подписи «начисляется»,
   «предпросмотр на сегодня — ДС не зарегистрировано», «строка снята — распоряжаться нечем»), и
   на 1440 и уже экран её резал (замер 12.08.2026). Правило: ЧИСЛА не переносятся никогда,
   подписи переносятся всегда — читаемость числа стоит колонки, читаемость подписи нет. */
   Раскладка фиксированная: при автоматической колонка «Распоряжение» держала ширину по самому
   длинному пункту списка (249 px) и на узком экране съедала колонку статьи до трёх строк —
   ширины заданы долями, а список ужимается многоточием. */
table.cgrid.cbase{ table-layout:fixed; }
/* Доли столбцов подвинуты под РС-43: у поделённой позиции рядом с селектом стоит «×», и на
   прежних 26 % длинное «Распределение по периодам» пряталось под стрелку. Отдано 4 % из
   статьи и дат — числа там короче своих колонок. */
table.cgrid.cbase col.c-art{ width:29%; } table.cgrid.cbase col.c-cut{ width:14%; }
table.cgrid.cbase col.c-fact{ width:18%; } table.cgrid.cbase col.c-inc{ width:9%; }
table.cgrid.cbase col.c-disp{ width:30%; }
table.cgrid.cbase thead th, table.cgrid.cbase tfoot th{ white-space:normal; }
table.cgrid.cbase .a-t, table.cgrid.cbase .a-s, table.cgrid.cbase .mode-tag,
table.cgrid.cbase .chk .lbl{ white-space:normal; }
table.cgrid.cbase td.numcell, table.cgrid.cbase th.numcell{ white-space:nowrap; }
table.cgrid.cbase select{ width:100%; max-width:100%; }
table.cgrid.cbase tfoot th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-top:1px solid var(--border-default); font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font);
  color:var(--text-heading); }
table.cgrid.cbase tfoot th.numcell{ text-align:right; }
/* Липкая полоса результата — следствие правки стоит рядом с причиной, а не под таблицей за
   краем экрана. Держится над футером карточки, а не под ним. */
.result-bar{ position:sticky; bottom:64px; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:6px 22px;
  background:var(--surface-panel); border:1px solid var(--border-strong); border-radius:var(--radius-md);
  padding:10px 16px; margin:0 0 8px; }
.result-bar .rb-t{ font:var(--weight-semibold) var(--text-sm)/1.2 var(--asubk-font); color:var(--text-heading); }
.result-bar .rb-i{ display:flex; flex-direction:column; }
.result-bar .rb-l{ font-size:11px; color:var(--text-muted); }
.result-bar .rb-v{ font:var(--weight-semibold) 15px/1.2 var(--asubk-font); color:var(--text-heading); font-variant-numeric:tabular-nums; }
.result-bar .rb-i.main .rb-v{ color:var(--asubk-blue); font-size:17px; }
.result-bar details.rb-app{ margin-left:auto; font:var(--font-label); }
.result-bar details.rb-app summary{ cursor:pointer; color:var(--text-link); }
.result-bar details.rb-app .mirror{ margin:8px 0 0; min-width:320px; background:var(--surface-card); }
/* Разбор гейтов — под шапкой карточки, один раз на заявку (прежде три копии в хвостах вкладок). */
.gates-panel{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  background:var(--surface-card); padding:14px 16px; margin-bottom:12px; }
table.cgrid tbody tr.art-blocked td{ color:var(--text-placeholder); background:var(--surface-panel); }
table.cgrid tbody tr.art-removed td{ color:var(--text-placeholder); }
/* Дверь распоряжения (РС-38) — продолжение строки под ней, а не модалка: вид распоряжения уже
   выбирается селектом в той же строке, сумма и сроки живут рядом с ним. */
table.cgrid tbody tr.disp-door td{ background:var(--asubk-tint-fill); padding:10px 12px 12px; }
.dd-wrap{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; font:var(--font-label); }
.dd-grp{ display:flex; align-items:center; gap:6px; }
.dd-grp .flabel{ margin:0; }
.dd-wrap input[type=number]{ width:120px; }
.dd-wrap input.dd-pos{ width:64px; }
.dd-note{ flex-basis:100%; color:var(--text-muted); font-size:11px; }
/* Несколько распоряжений на позиции (РС-43): линии стопкой в той же клетке — вид остаётся там,
   где куратор его ищет, а вторая линия не заводит второй экран. Подпись вида у двери печатается
   только когда дверей больше одной; при одной селект над ней уже назвал вид. */
.dline{ display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.dline select{ flex:1 1 auto; min-width:0; }
.dline-x{ flex:0 0 auto; border:1px solid var(--border-default); background:var(--surface-card);
  color:var(--text-muted); border-radius:var(--radius-sm); cursor:pointer; line-height:1; padding:4px 6px; }
.dline-x:hover{ color:var(--status-error); border-color:var(--status-error); }
.dline-add{ border:1px dashed var(--border-strong); background:none; color:var(--text-link);
  border-radius:var(--radius-sm); cursor:pointer; font:var(--font-label); padding:4px 8px; width:100%;
  white-space:normal; text-align:left; }
.dd-kind{ font:var(--weight-semibold) var(--text-sm)/1.2 var(--asubk-font); color:var(--text-heading); }
details.gate-d{ border:1px solid var(--border-default); border-radius:var(--radius-md); padding:2px 14px; margin-bottom:10px; }
details.gate-d summary{ cursor:pointer; list-style:none; padding:10px 0; display:flex; align-items:center; gap:10px; font:var(--weight-medium) var(--text-sm)/1.3 var(--asubk-font); }
details.gate-d summary::-webkit-details-marker{ display:none; }
details.gate-d summary::after{ content:"развернуть ▾"; margin-left:auto; color:var(--text-placeholder); font-size:11px; font-weight:400; }
details.gate-d[open] summary::after{ content:"свернуть ▴"; }
details.gate-d .gate-body{ padding:2px 0 12px 30px; font:var(--font-label); }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">АСУБК</div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-foot">

/* Плановый график базового транша — только у второй волны. У первых пяти кредитов
   schedules[0].rows пуст: principalAt не видит просроченного ТЕЛА, и перенос собирает одни
   накопленные статьи (у RS-1001 так и вышло). Витрине нужен перенос тела, поэтому план здесь
   синтезируется ТЕМ ЖЕ движком, каким его считает ДС (amortize) — план остаётся производной
   условий, а не вторым вводом рядом с ними. Просрочка тела получается сама: план ушёл дальше,
   чем фактические погашения (ops), и principalAt показывает разницу. */
/* Датировка последнего погашения — тоже только у второй волны. mkTranche ставит его на TODAY-45
   для всех, и это верно, пока заявка одна и она сегодняшняя: у ДС, зарегистрированного РАНЬШЕ
   этой даты, остаток источника читался бы без учёта платежа — перенесли бы «целиком» больше,
   чем на траншe было. Платёж уводится на месяц раньше начала просрочки: перестали платить —
   пошла просрочка, а не наоборот. Сумма не меняется, значит выведенная просрочка тела на
   сегодня та же. */
function retimePayment(cr){
  const t=cr.tranches[0], rep=(t.ops||[]).find(o=>o.kind==='repay');
  if(rep) rep.date=addCalDays(TODAY, -(cr.odDays+30));
  return cr;
}
function seedPlan(cr){
  const t=cr.tranches[0], v=t.schedules[0];
  v.rows = amortize(t.amount, cr.terms, t.plannedDate, []).rows;
  return cr;
}

   Слияние (aliasOf) резолвится в один корень; реорганизация (successorOf) — нет, два живых ключа. */
const MIRROR = {
  subjects: [
    { key:'02508199700123', name:'ОсОО «Ак-Жол Агро»', aliasOf:null },
    { key:'02508199700099', name:'ОсОО «Ак-Жол» (прежнее наим., слито)', aliasOf:'02508199700123' },

    { key:'ГЗ-0007', name:'Группа «Ынтымак» (групповой заёмщик)', aliasOf:null }
  ]
};
function resolveKey(key){                              // ключ → корень слияния; реорганизацию не резолвит (оба ключа живы)
  const s = MIRROR.subjects.find(s=>s.key===key);
  return (s && s.aliasOf) ? resolveKey(s.aliasOf) : key;
}
function keysOf(anchorKey){                             // корень → все ключи, слитые в него
  const root = resolveKey(anchorKey);
  return MIRROR.subjects.filter(s=>resolveKey(s.key)===root).map(s=>s.key);
}

function addCalDays(s,n){ const d=D(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
/* Сдвиг на месяцы с фиксированным днём платежа — тот же приём, что addM кредитного модуля
   (credit.html), только на ISO-строках и UTC, как весь этот файл. Дня, которого в месяце нет
   (31-е в феврале), не бывает: садимся на последний. */
function addCalMonths(s,k,fixedDay){
  const d=D(s), day=fixedDay||d.getUTCDate();
  const x=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+k, 1));
  const last=new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth()+1, 0)).getUTCDate();
  x.setUTCDate(Math.min(day,last));
  return x.toISOString().slice(0,10);
}
const isLeapYear = y => (y%4===0 && y%100!==0) || y%400===0;
/* Производственный календарь (РС-30) — справочник дат, а не правило «сб/вс». Постоянные
   праздники КР сидят как ММ-ДД и действуют в любом году; переносы, перенесённые рабочие
   субботы и религиозные праздники (Орозо айт / Курман айт — лунный календарь) устанавливаются
   отдельным решением ежегодно и потому заводятся ЗАПИСЬЮ С ГОДОМ. Год, которого в справочнике
   нет, — не молчаливый откат к «сб/вс», а видимая отметка «календарь года не заведён»
   (calendarYearKnown → подпись рядом со сроком). Календарь один на все модули: тот же срок в
   рабочих днях есть у платежей. */
const CALENDAR_FIXED = ['01-01','01-07','02-23','03-08','03-21','04-07','05-01','05-05','05-08','05-09','08-31','11-07','11-08'];
const CALENDAR_YEARS = {
  2026: { holidays:['2026-03-20','2026-03-23','2026-05-27','2026-05-28','2026-08-03','2026-11-09'],   // переносы + Орозо айт / Курман айт (демо-даты)
          workdays:['2026-03-28','2026-11-14'] }                                                     // перенесённые рабочие субботы
};
const calendarYearKnown = y => Object.prototype.hasOwnProperty.call(CALENDAR_YEARS, Number(y));
function isWorkDay(iso){
  const y=iso.slice(0,4), md=iso.slice(5), rec=CALENDAR_YEARS[Number(y)]||{holidays:[],workdays:[]};
  if((rec.workdays||[]).includes(iso)) return true;                       // перенесённая рабочая суббота
  if(CALENDAR_FIXED.includes(md)) return false;
  if((rec.holidays||[]).includes(iso)) return false;
  const wd=D(iso).getUTCDay();
  return wd!==0 && wd!==6;
}
function addWorkDays(s,n){ let cur=s,added=0; while(added<n){ cur=addCalDays(cur,1); if(isWorkDay(cur)) added++; } return cur; }
const fmt = n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2= n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= ДВИЖОК ТРАНША — CreditSide (РС-9: граница внутри файла, не сетевой шов) ===== */
const round2 = x => Math.round((Number(x)||0)*100)/100;
/* Месяцев в периоде платежа. «По конкретным месяцам» намеренно падает на 1: график по
   неравным промежуткам формулой не строится — см. разбор у amortize. */
function periodMonths(freq){
  return freq==='ежеквартально' ? 3
       : freq==='раз в полгода' ? 6
       : freq==='ежегодно' ? 12 : 1;                    // дефолт «ежемесячно»
}
/* День-база (dayMethod, «числитель/база») — движок её ЧИТАЕТ, но форма условий не правит:
   ADR-0111 отнёс dayMethod к зоне «вне п. 89», у неё свой маршрут (прямое ДС). Читать
   обязаны: черновик считает проценты той же меркой, что контракт кредита (credit.html,
   dayBasis/periodInterest), иначе комитет утверждает суммы, которых потом не будет. */
function dayBasis(dayMethod, iso){
  const [numRaw, baseRaw] = String(dayMethod||'факт/365').split('/');
  const num = String(numRaw||'').trim().toLowerCase();
  const base = String(baseRaw||'').trim().toLowerCase();
  return {
    numFin: num==='30',                                            // финансовый числитель (30×мес.)
    base: base==='360' ? 360
        : (base==='факт'||base==='фактическая') ? (isLeapYear(Number(String(iso).slice(0,4))) ? 366 : 365)
        : 365
  };
}
/* Начисление за один период — по ДНЯМ, а не по номинальной доле ставки (та остаётся
   структурной: ею размечается величина взноса). Ровно periodInterest кредитного модуля,
   за вычетом паузы начисления — приостановки (Р-17) реструктуризация не ведёт. */
function periodInterest(cnd, prevDate, date, bal, mpp){
  if(!((Number(cnd.rate)||0)>0) || bal<=0.005) return 0;
  const db = dayBasis(cnd.dayMethod, date);
  const days = db.numFin ? 30*mpp : Math.max(0, daysBetween(prevDate, date));
  return round2(bal * (Number(cnd.rate)||0)/100 * days / db.base);
}
/* Безставочные колонки строки (РС-41, ADR-0109). `parts` = [{article, amount, periods}], где
   periods — {mode:'all'} либо {mode:'range',from,to} по позициям графика, 1-базовым включительно.
   Сумма ложится РАВНЫМИ ДОЛЯМИ, остаток — в ПОСЛЕДНЮЮ позицию интервала: тот же приём, которым
   дифференцированный метод ниже уводит хвост тела в последний платёж, и он же гарантирует, что
   сумма колонки сходится с суммой распоряжения в копейку (сирота 0,01 не заводится).
   Интервал за длиной графика здесь зажимается, чтобы график остался суммируемым, — но молчаливой
   подрезкой это не становится: расхождение ловит ИР-15 в validateDS и показывает дверь (РС-40). */
function spreadParts(rows, parts){
  (parts||[]).forEach(p=>{
    const n=rows.length, amount=round2(p.amount); if(!n || amount<=0) return;
    const per = (p.periods && p.periods.mode==='range') ? p.periods : { mode:'all' };
    const from = per.mode==='range' ? Math.min(Math.max(1, Math.trunc(per.from)||1), n) : 1;
    const to   = per.mode==='range' ? Math.min(Math.max(from, Math.trunc(per.to)||from), n) : n;
    const cnt  = to-from+1, share = round2(amount/cnt);
    let left = amount;
    for(let k=from;k<=to;k++){
      const v = (k===to) ? round2(left) : share;                  // хвост округления — в последнюю позицию интервала
      left = round2(left - v);
      const row = rows[k-1];
      row.articles = row.articles || {};
      row.articles[p.article] = round2((row.articles[p.article]||0) + v);
      row.pay = round2((row.pay||0) + v);
    }
  });
  return rows;
}
/* Амортизация — ТА ЖЕ механика, что buildSchedule кредитного модуля (credit.html), перенесённая
   сюда целиком: черновик, который смотрит комитет, обязан совпасть с контрактом, который кредит
   построит после регистрации ДС. Прежний движок считал месяц ровно в 30 дней и знал две льготы
   из трёх — утверждали один график, получали другой.
   Вход: тело `base`, условия `cnd` (ключи реестра PARAMS), дата отсчёта, безставочные колонки.
   `parts` (ADR-0109): ставка считается ТОЛЬКО по `base`, то есть по колонке основного долга;
   накопленное и капитализированная пеня попадают в строку суммой к уплате и базой начисления
   не становятся (ИР-11).

   ТРИ ЛЬГОТЫ — три механизма (ключи graceMain/graceAccrual/graceInterest, ADR-0111):
     graceMain     — тело не гасится, проценты платятся;
     graceAccrual  — проценты НЕ НАЧИСЛЯЮТСЯ вовсе (отсрочка начисления);
     graceInterest — начисляются, но не платятся; накопленное раскладывается по окну
                     graceIntDistFrom..To (по умолчанию — по всем периодам после льготы).
   Льготы заданы в МЕСЯЦАХ, период платежа может быть длиннее — переводим в периоды с
   округлением вверх, чтобы длинный период льготу не съедал.

   Прежний блок 'moratorium' капитализировал проценты в тело и начислял на них дальше — снят
   вместе с graceBlocks: это спорило с ИР-11/РС-27, и капитализация обязана идти явным
   РАСПОРЯЖЕНИЕМ `cap` (вид N4), а не тихим побочным действием льготы.

   freq='по конкретным месяцам' (payMonths) хранится и версионируется как условие, но график по
   нему НЕ строится — periodMonths падает на помесячный шаг. То же решение, что в кредитном
   модуле: при неравных промежутках график не формула, а ручной ввод, и выдумывать её молча
   нельзя. Решается вместе с производственным календарём (РС-30). */
function amortize(base, cnd, fromDate, parts){
  const c = cnd||{};
  const mpp = periodMonths(c.freq);                                  // месяцев в периоде платежа
  const termM = Math.max(1, Number(c.term)||0);
  const n = Math.max(1, Math.ceil(termM/mpp));                       // число ПЛАТЕЖЕЙ
  const i = (Number(c.rate)||0)/100/12*mpp;                          // номинальная ставка за период
  const method = c.method || 'аннуитет';
  const gMainP = Math.ceil(Math.max(0, c.graceMain|0)/mpp);
  const gAccrP = Math.ceil(Math.max(0, c.graceAccrual|0)/mpp);
  const gIntP  = Math.ceil(Math.max(0, c.graceInterest|0)/mpp);
  const gIntDistFrom = (c.graceIntDistFrom|0)>0 ? (c.graceIntDistFrom|0) : (gIntP+1);
  const gIntDistTo   = (c.graceIntDistTo|0)>0   ? (c.graceIntDistTo|0)   : n;
  const payDay = (c.payDay|0)>=1 && (c.payDay|0)<=31 ? (c.payDay|0) : null;
  const anchorFirst = c.lastPaymentAnchor==='по дате 1-го платежа';
  const firstPay = addCalMonths(fromDate, mpp, payDay);
  const principalPeriods = Math.max(1, n - gMainP);                  // периодов гашения тела после льготы
  const annuity = i>0 ? base*i/(1-Math.pow(1+i,-principalPeriods)) : base/principalPeriods;
  const diffPrincipal = base/principalPeriods;
  const rows=[]; let bal=base, deferred=0, deferredPer=0, prevDate=fromDate;
  for(let k=1;k<=n;k++){
    const date = anchorFirst
      ? (k===1 ? firstPay : addCalMonths(firstPay, (k-1)*mpp, payDay))
      : addCalMonths(fromDate, k*mpp, payDay);
    /* Начисленное — по дням (dayMethod), тело взноса — по номинальной `i`: обычная практика
       факт/365-аннуитета, платёж не «плавает» от длины месяца. Так же и в credit.html. */
    const accrued = (k<=gAccrP) ? 0 : periodInterest(c, prevDate, date, bal, mpp);
    prevDate = date;
    let interest;
    if(k<=gIntP){ deferred = round2(deferred + accrued); interest = 0; }          // начислено, не платится
    else if(k>=gIntDistFrom && k<=gIntDistTo){
      if(deferredPer===0 && deferred>0) deferredPer = round2(deferred/Math.max(1, gIntDistTo-gIntDistFrom+1));
      const add = Math.min(deferredPer, deferred);
      deferred = round2(deferred - add);
      interest = round2(accrued + add);
    }
    else interest = accrued;                                                      // вне окна: копится
    let principal;
    if(k<=gMainP) principal = 0;                                                  // льгота по ОД
    else if(method==='в конце срока') principal = (k===n ? round2(bal) : 0);
    else if(method==='равными долями' || method==='дифференцированный') principal = round2(diffPrincipal);
    else principal = round2(annuity - bal*i);                                     // аннуитет
    if(k===n){
      principal = round2(bal);                                                    // последний гасит остаток
      if(deferred>0){ interest = round2(interest + deferred); deferred = 0; }     // и хвост отложенных %
    }
    principal = Math.max(0, Math.min(principal, bal));
    bal = round2(bal - principal);
    const phase = k<=gAccrP ? 'отсрочка начисления'
                : k<=gIntP  ? 'льгота по %'
                : k<=gMainP ? 'льгота по ОД' : null;
    rows.push({ n:k, date, pay:round2(principal+interest), principal, interest, accrued,
      balance:round2(Math.max(bal,0)), ...(phase?{phase}:{}) });
  }
  spreadParts(rows, parts);
  return { rows, meta:{ p:mpp, i, n, gMainP, gAccrP, gIntP, m:principalPeriods, base } };
}

/* Остаток транша — формула поверх журнала ops, не поле (ИР-3 стал определением). Чужие записи
   (mirror:true) участвуют в сумме наравне со своими — знак определяет kind, не owner. */
function balanceAt(t,d){
  return round2((t.ops||[]).filter(o=>o.date<=d).reduce((s,o)=>{
    if(o.kind==='disburse'||o.kind==='transfer_in') return s+o.amount;
    if(o.kind==='repay'||o.kind==='transfer_out')   return s-o.amount;
    return s;
  },0));
}
/* Версия графика, действующая на дату d — последняя с validFrom≤d; конец выводится (validTo), не хранится. */
function scheduleAt(t,d){
  const vs=(t.schedules||[]).filter(v=>v.validFrom<=d);
  return vs.length ? vs.reduce((a,b)=>b.validFrom>a.validFrom?b:a) : null;
}
function validTo(t,ver){
  const next=(t.schedules||[]).filter(v=>v.validFrom>ver.validFrom).sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0];
  return next ? addCalDays(next.validFrom,-1) : null;         // null = действует по сей день
}
/* Условия на дату d — свёртка записей с effectiveFrom≤d, поздние поля перекрывают ранние (credit.html, :1699). */
function conditionsAt(t,d){
  return (t.conditionRecords||[]).filter(r=>r.effectiveFrom<=d)
    .sort((a,b)=>a.effectiveFrom<b.effectiveFrom?-1:1)
    .reduce((acc,r)=>Object.assign(acc,r),{});
}
/* Основной долг на дату d — седьмая статья, всегда выводится (issues/01, реш.3): просроченная часть —
   план графика минус фактическое погашение; связь repay↔строки графика пока по сумме (issues/02, новый
   открытый вопрос от 01) — точнее, чем строчная привязка, здесь не требуется (демо). */
/* Перенесённое НЕ-тело (ADR-0109): производный транш принял одну сумму переноса, но телом в ней
   была только колонка основного долга. Строки, помеченные fromTransfer, живут в t.debt и уже
   участвуют в разбивке долга через debtAt — не вычесть их из остатка значит посчитать накопленное
   дважды и начислить на него ставку. Обычные демо-строки долга такой пометки не несут: у них
   остаток транша и так только тело. */
function transferredNonPrincipal(t){
  return round2((t.debt||[]).filter(x=>x.fromTransfer).reduce((s,x)=>s+(x.amount||0),0));
}
function principalAt(t,d){
  const bal=round2(Math.max(balanceAt(t,d)-transferredNonPrincipal(t), 0));
  const ver=scheduleAt(t,d);
  const plannedOver=round2(((ver&&ver.rows)||[]).filter(r=>r.date<d).reduce((s,r)=>s+(r.principal||0),0));
  const repaid=round2((t.ops||[]).filter(o=>o.kind==='repay'&&o.date<=d).reduce((s,o)=>s+o.amount,0));
  const over=round2(Math.min(Math.max(plannedOver-repaid,0), bal));
  return { over, cur: round2(bal-over) };
}

/* Чистый предпросмотр — не пишет ничего (issues/01: «черновик остаётся историческим объектом заявки»,
   ADR-0042). ds несёт date/transferSum/params (ключи реестра PARAMS). */
function draftSchedule(tranche, ds){
  // База начисления — колонка ОСНОВНОГО ДОЛГА (ADR-0109), а не вся сумма переноса: безставочные
  // статьи приходят отдельно в ds.parts. Прежний вызов без раскладки (principalPart отсутствует)
  // читается как «весь перенос — тело» и даёт ровно прежний график.
  const base = ds.principalPart!=null ? Number(ds.principalPart)
             : ds.transferSum!=null   ? Number(ds.transferSum)
             : balanceAt(tranche, ds.date);
  /* Условия черновика = действующие условия ИСТОЧНИКА, перекрытые параметрами ДС — тот же
     порядок, которым restructureApplied кладёт conditionRecords на производный транш. Считать
     по одним условиям ДС нельзя: неназванное соглашением условие (день-база, метод, день платежа)
     переезжает на новые условия как есть, и черновик обязан взять его оттуда же, откуда потом
     возьмёт кредит. */
  const cnd = Object.assign({}, conditionsAt(tranche, ds.date), condObj(ds.conditions));
  if(cnd.rate==null) cnd.rate = tranche.originalRate;
  return amortize(base, cnd, ds.date, ds.parts||[]);
}
/* Свод безставочных колонок по статье — для строк долга производного транша: в графике сроки
   у каждой части свои, в разбивке долга статья одна. */
function mergeParts(parts){
  const acc={};
  (parts||[]).forEach(p=>{ acc[p.article]=round2((acc[p.article]||0)+p.amount); });
  return ARTICLES.map(a=>a.key).filter(k=>acc[k]>0).map(k=>({article:k, amount:acc[k]}));
}
/* Сумма всех статейных колонок строки — включая колонку ОД (ИР-2 в редакции ADR-0109). */
function rowArticlesSum(r){
  return round2(Object.keys(r.articles||{}).reduce((s,k)=>s+(r.articles[k]||0),0));
}
function scheduleArticleCols(rows){
  const seen=new Set();
  (rows||[]).forEach(r=>Object.keys(r.articles||{}).forEach(k=>{ if(round2(r.articles[k])>0) seen.add(k); }));
  return ARTICLES.map(a=>a.key).filter(k=>seen.has(k));                 // порядок — очередь погашения (РС-13); пустая колонка не рисуется
}
/* Предпосылки до первой записи (ИР-2 и прочие) — свод-баннер, а не тост (packetGate/conclGate/
   resolutionGate — существующие гейты конвейера, issues/03). Дверь спрашивает про ПОСТАНОВЛЕНИЕ
   КАБМИНА: заключение уполномоченного органа само по себе условия не меняет (ADR-0107 §1). */
function validateDS(ds){
  const reasons=[];
  const cnd=condObj(ds.conditions);                                        // плоский вид перечня условий ДС
  if(!ds.app || !ds.sourceTranche || !ds.credit){ reasons.push('Не выбраны заявка, транш-источник или кредит'); return reasons; }
  if(!packetGate(ds.app).ok) reasons.push('Пакет документов не собран');
  if(!conclGate(ds.app).ok)  reasons.push('Не все заключения завизированы');
  if(!resolutionGate(ds.app).ok) reasons.push('Нет постановления Кабинета Министров (реквизит и согласование профильного комитета ЖК обязательны)');
  if(!forgiveGate(ds.app).ok)    reasons.push('Прощение не названо суммой либо основанием в постановлении (РС-28)');
  const lg=limitsGate(cnd, ds.credit, ds.date); if(!lg.ok) reasons.push(...lg.messages);                       // жёсткий, без waiver (issues/04)
  const cg=consentGateApp(ds.app); if(!cg.ok) reasons.push('Не получено согласие обеспечителя(ей): '+cg.pending.join(', '));  // жёсткий, без waiver
  const draft=draftSchedule(ds.sourceTranche, ds);
  // ИР-2 в редакции ADR-0109: сверяется сумма ВСЕХ статейных колонок графика, не одной колонки
  // тела — иначе накопленное уезжает в перенос, но в графике его нет, и подписан не тот документ.
  const sumPrincipal=round2((draft.rows||[]).reduce((s,r)=>s+(r.principal||0),0));
  const sumArticles =round2((draft.rows||[]).reduce((s,r)=>s+rowArticlesSum(r),0));
  const sumAll=round2(sumPrincipal+sumArticles);
  if(Math.abs(sumAll-Number(ds.transferSum||0))>0.5)
    reasons.push('Сумма графика по всем статьям ('+fmt(sumAll)+') не совпадает с суммой переноса ('+fmt(ds.transferSum)+')');       // ИР-2
  // ИР-15 (РС-40): интервал сроков лежит внутри длины графика. Подрезать молча нельзя — куратор
  // задавал позиции при одном сроке, срок мог уменьшиться; подставить новую границу за него
  // значит выдумать его решение.
  const nPos=(draft.rows||[]).length;
  (ds.parts||[]).forEach(p=>{
    const per=p.periods; if(!per || per.mode!=='range') return;
    if(per.from>=1 && per.to<=nPos && per.from<=per.to) return;
    reasons.push('Сроки распоряжения по статье «'+(ARTICLE_LABEL[p.article]||p.article)+'» — позиции '
      +per.from+'–'+per.to+', а в графике '+nPos+' '+(nPos===1?'позиция':'позиций')+' (ИР-15)');
  });
  const dates=(draft.rows||[]).map(r=>r.date);
  for(let k=1;k<dates.length;k++) if(!(dates[k]>dates[k-1])){ reasons.push('Даты графика не строго возрастают'); break; }
  // Конец срока — КАЛЕНДАРНЫЙ: движок ведёт даты по месяцам (addCalMonths), и прежняя мерка
  // «срок × 30 дней» отбивала бы любой график длиннее года как «позже конца срока».
  const term=Number(cnd.term)||0;
  if(term>0){ const termEnd=addCalMonths(ds.date, term);
    if(dates.length && dates[dates.length-1]>termEnd) reasons.push('Последняя дата графика позже конца срока ДС'); }
  return reasons;
}
/* Опустошённый транш-источник закрывается, причина ВЫВЕДЕНА обнулившей операцией, не введена (ИР-5). */
function closeIfEmptied(tranche, ds){
  if(round2(balanceAt(tranche, ds.date))<=0) tranche.closed={ date:ds.date, by:ds.no, reason:'перенос' };
}
/* Единственная пишущая дверь (ADR-0096, issues/03): валидация → 1 производный транш → 2 перенос
   (зеркальная пара transfer_out/transfer_in) → 3 версия графика на новый транш → 4 условия (несутся
   вместе с траншем в conditionRecords) → 5 закрытие опустошённого источника → 6 счётчик + одна запись
   аудита. `tranche.ops.push` вне этой функции быть не должно (граница grep-проверяема). */
function restructureApplied(ds){
  const reasons=validateDS(ds);
  if(reasons.length) return { ok:false, reasons };

  const src=ds.sourceTranche, credit=ds.credit;
  const draft=draftSchedule(src, ds);
  /* Условия соглашения приходят ПЕРЕЧНЕМ (ds.conditions), как их принимает кредитный модуль;
     на транш они ложатся записью-свёрткой: действующие условия источника, перекрытые
     названными в ДС. Названо только то, что менялось, — молчание соглашения переносит
     условие как есть, а не обнуляет его. */
  const cnd=condObj(ds.conditions);

  const seq=credit.tranches.length+1;                                       // 1. производный транш
  const newT={
    id:credit.id+'-T'+seq, no:credit.no+'-Т'+seq, subjectKey:src.subjectKey,
    amount:Number(ds.transferSum), plannedDate:ds.date,
    originalRate:(cnd.rate!=null)?cnd.rate:src.originalRate,
    ops:[ { date:ds.date, kind:'transfer_in', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, from:src.id} } ],
    schedules:[],
    // Порядок ровно такой: сначала унаследованные условия источника, поверх — названные ДС, и
    // ТОЛЬКО ПОТОМ дата. Свёртка conditionsAt несёт собственный effectiveFrom (день выдачи
    // источника), и стоя последней она затирала дату соглашения — запись условий производного
    // транша датировалась задним числом, а conditionsAt на дату ДС читала её как действующую
    // ещё до самого ДС.
    conditionRecords:[ { ...conditionsAt(src, ds.date), ...cnd, effectiveFrom:ds.date } ],
    // Долг переносится ОДНОЙ суммой (transferSum — она и стоит в акте ДС), но разложенной по
    // статьям (ADR-0109): безставочные колонки приезжают на транш строками долга, иначе следующая
    // реструктуризация того же кредита прочитает перенос как чистое тело и потеряет накопленное.
    debt:mergeParts(ds.parts).map(p=>({ article:p.article, urgency:'cur', amount:p.amount, since:ds.date, fromTransfer:true })),
    closed:null
  };
  credit.tranches.push(newT);

  src.ops.push({ date:ds.date, kind:'transfer_out', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, to:newT.id} });  // 2. перенос

  newT.schedules.push({ ver:1, validFrom:ds.date, by:{kind:'ДС', ref:ds.no}, rate:cnd.rate, rows:draft.rows });  // 3. версия графика

  closeIfEmptied(src, ds);                                                  // 5. закрытие опустошённого транша (условия — шаг 4, см. conditionRecords выше)

  credit.restructCount+=1;                                                  // 6. счётчик + одна запись аудита (не шесть)
  credit.audit.push({ type:'ДС применён', ds:ds.no, date:ds.date, detail:'Транш '+src.no+' → '+newT.no+', перенесено '+fmt(ds.transferSum), mirror:false });

  return { ok:true, tranche:newT };
}
const CreditSide = { balanceAt, scheduleAt, validTo, conditionsAt, principalAt, draftSchedule, restructureApplied };

/* ================= ПРОИЗВОДНЫЕ (Р-19: считаем, не храним) ================= */
const creditById = id => state.credits.find(c=>c.id===id);
/* ============ РАСЧЁТ (РС-42, ADR-0114) ============
   Расчёт — единица финансового ядра, и адресует он ТРАНШ, а не кредит: условия и график живут
   на транше (CONTEXT.md), перенос идёт из транша в транш (ADR-0092, ИР-3), а ИР-2 сверяет сумму
   колонок графика — тоже траншевого. Ключ по кредиту оставил бы кредит с двумя траншами в той же
   неразличимости, из которой мы выходим. Заявка держит список расчётов, по одному на транш
   охвата (ИР-16). */
function mkCalc(credit, tranche){
  return { id:'C-'+tranche.id, trancheId:tranche.id, creditId:credit.id,
           base:[], dispositions:[], version:null,
           cutoff:null, fact:null, dsRef:null, excluded:null };
}
function calcById(app, calcId){ return (app.calcs||[]).find(c=>c.id===calcId) || null; }
function calcTrancheOf(calc){
  const cr = calc && creditById(calc.creditId); if(!cr) return null;
  return (cr.tranches||[]).find(t=>t.id===calc.trancheId) || null;
}
function creditOfTranche(trancheId){
  return state.credits.find(c=>(c.tranches||[]).some(t=>t.id===trancheId)) || null;
}
/* Дверь однорасчётной заявки. Пока расчёт один, звать его по имени незачем — но как только их
   два, умолчание «первый» стало бы тихим выбором за куратора, и дверь обязана отказать, а не
   угадать. Тот же приём, что у гейта согласий: молчания как варианта нет. */
function requireCalc(app, calcId){
  const list = (app && app.calcs) || [];
  if(calcId) return calcById(app, calcId);
  return list.length===1 ? list[0] : null;
}
/* Заведение расчёта под транш. Идемпотентно: транш уже в охвате — возвращаем его расчёт, а не
   заводим второй (ИР-16). */
function attachCalc(app, tranche){
  const exist = (app.calcs||[]).find(c=>c.trancheId===tranche.id);
  if(exist) return exist;
  const cr = creditOfTranche(tranche.id); if(!cr) return null;
  const c = mkCalc(cr, tranche);
  Object.defineProperty(c, '__app', { value:app, enumerable:false });   // ссылка вверх, не данные
  app.calcs.push(c);
  return c;
}
const kindById   = id => state.kinds.find(k=>k.id===id);
const appById    = id => state.apps.find(a=>a.id===id);

/* объединение разрешённых параметров выбранных видов (Р-3 ↔ Р-11) */
function allowedParams(app){ const s=new Set(); app.kindIds.forEach(id=>{ const k=kindById(id); if(k) k.params.forEach(p=>s.add(p)); }); return s; }
/* Нормативный пакет (РС-36, ИР-14) — состав приложений к предложению о реструктуризации задан
   пп. 85–86 Положения поимённо, а условные документы под снижение ставки — пп. 91/95. Это
   записи НОРМЫ: у каждой пункт и редакция, администратору они недоступны для удаления; свои
   документы вид добавляет сверх них (kind.docs). when — условие включения в пакет:
   'coverShort' (п. 86 — недостаточность покрытия либо беззалоговый кредит) и 'rateDown'
   (пп. 91/95 — заявка вообще вправе трогать ставку). */
const NORM_PACKET = [
  { doc:'Финансовая отчётность за последние 3 года (или за фактический период деятельности)', point:'85 пп. 1' },
  { doc:'Бизнес-план на весь период пролонгации (доходы и денежные потоки · ресурсы, затраты, оборотный капитал · риски и их минимизация)', point:'85 пп. 2' },
  { doc:'Предложения по обеспечению исполнения обязательств', point:'85 пп. 3' },
  { doc:'Предложения по залоговому обеспечению', point:'86', when:'coverShort' },
  { doc:'Акты органов о наступлении форс-мажорных и независящих обстоятельств', point:'95 пп. 1', when:'rateDown' },
  { doc:'Справка ОМСУ либо государственной администрации соответствующего района', point:'95 пп. 2', when:'rateDown' }
];
function coverShortInScope(app){
  return (app.creditIds||[]).some(id=>{ const cr=creditById(id); if(!cr) return false;
    const s=cr.coverSnapshot; return !s || s.cover==null || s.required==null || s.cover < s.required; });
}
function normPacket(app){
  const rateDown = allowedParams(app).has('rate');
  const coverShort = coverShortInScope(app);
  return NORM_PACKET.filter(d => !d.when || (d.when==='rateDown' ? rateDown : coverShort));
}
/* объединение требуемых документов (Р-3, гейт стадии 1): нормативный пакет + документы видов */
function requiredDocs(app){
  const s=new Set(normPacket(app).map(d=>d.doc));
  app.kindIds.forEach(id=>{ const k=kindById(id); if(k) (k.docs||[]).forEach(d=>s.add(d)); });
  return [...s];
}
const packetPointOf = doc => (NORM_PACKET.find(d=>d.doc===doc)||{}).point || null;

/* стадия — производная от owned-фактов (Р-4). ДС зарегистрировано ≠ «Закрыта» (issues/04 реш.1,
   ИР-9): терминал наступает только когда все три гейта оформления (согласия РС-17, покрытие/waiver
   РС-18, регуляторные пределы РС-19) пройдены — иначе стадия честно остаётся «Оформление», хоть
   ДС уже стоит. formalGatesOk читает те же три гейта, что и вкладка «Оформление». */
/* Снятый с оформления расчёт выходит из-под трёх гейтов оформления вместе со своим кредитом — его
   согласия/покрытие/пределы уже не про эту заявку (спека §4): кредит явно не идёт в ДС, и чужое
   несогласованное поручительство не вправе держать закрытие остальных расчётов заявки. Отбор
   вынесен в две функции и зовётся из ДВУХ мест — formalGatesOk (стадия) и openDS (пред-проверки
   регистрации, :3348). Расходясь, они давали заявку, которую стадия считает закрываемой, а кнопка
   регистрации не пускает по гейту снятого кредита (ревью 12.08.2026). */
function activeCreditIdsOf(app){
  return [...new Set((app.calcs||[]).filter(c=>!c.excluded).map(c=>c.creditId))];
}
function activeLimitRows(app){
  return limitsGateApp(app).rows
    .filter(r=>{ const c=(app.calcs||[]).find(x=>x.id===r.calcId); return !c || !c.excluded; });
}
function formalGatesOk(app){
  const activeCreditIds = activeCreditIdsOf(app);
  const consentOk = activeCreditIds.every(id=>consentGate(id).ok);
  const coverOk = activeCreditIds.every(id=>{ const cr=creditById(id); return !cr || coverGate(app,cr).ok; });
  const limitsOk = activeLimitRows(app).every(r=>r.g.ok);
  return consentOk && limitsOk && (coverOk || !!(app.waiver && app.waiver.granted));
}
function stageOf(app){
  if(app.outcome==='возврат') return {idx:0, closed:true, label:'Возвращена без рассмотрения'};
  const cov=dsCoverage(app);
  if(cov.done.length){
    // Терминал требует ответа по КАЖДОМУ расчёту: зарегистрирован либо явно снят (спека §4).
    return (formalGatesOk(app) && cov.ok)
      ? {idx:8, closed:true, label:'Закрыта'}
      : {idx:7, closed:false, label:'Оформление'};
  }
  // отказ приходит с одного из двух актов: отрицательное заключение органа (п. 88) либо
  // отказ в постановлении КМ (п. 89) — стадия отказа читается по тому, какой акт его нёс
  if(app.outcome==='отказ'){
    return (app.resolution && app.resolution.fixed)
      ? {idx:6, closed:true, label:'Отказ (постановление КМ)'}
      : {idx:4, closed:true, label:'Отказ (заключение уполномоченного органа)'};
  }
  if(app.resolution && app.resolution.fixed)  return {idx:7, closed:false, label:'Оформление'};
  if(app.zk && app.zk.fixed)                  return {idx:5, closed:false, label:'Проект решения КМ'};
  if(app.conclusion && app.conclusion.fixed)  return {idx:4, closed:false, label:'Заключение уполномоченного органа'};
  if(app.letterSent && app.letterSent.fixed)  return {idx:3, closed:false, label:'Письмо направлено'};
  if(app.committee && app.committee.fixed)    return {idx:2, closed:false, label:'Комитет'};
  if(app.analysisStarted)     return {idx:1, closed:false, label:'Анализ'};
  return {idx:0, closed:false, label:'Регистрация обращения'};
}

/* Норма-справочник (issues/04 реш.2, ADR-0099, ИР-10): запись — величина+пункт+редакция+дата
   начала действия, не голое число в коде. Расширяет прецедент DEADLINE_TEMPLATES (collection.html)
   двумя полями (edition/dateFrom). Смена редакции — НОВАЯ запись поверх старой (normAt берёт
   последнюю applicable на дату), старую не правим.

   РС-33 (10.08.2026): редакция Положения найдена — приложение к постановлению Кабинета Министров
   КР от 19.01.2026 № 14, ред. 19.01.2026 (docs/normativ/polozhenie-2026-01-19-N14-gl9.txt).
   Реквизиты ниже реальные, пометка «пункт не подтверждён» снята; ветка edition:null в normNote
   оставлена — она нужна любой БУДУЩЕЙ норме, которой у нас ещё нет. Значения, зашитые прежде по
   неподтверждённой редакции, совпали с действующими до месяца, номера пунктов — тоже.
   Три регламентных срока читают Порядок №41 от 06.07.2026 — та же редакция, что в шапке спеки. */
const POLOZHENIE = { origin:'Положение о работе с бюджетными кредитами', edition:'прил. к ПКМ КР №14', dateFrom:'2026-01-19' };
const NORM_REFERENCE = [
  { code:'termCap', point:'90', ...POLOZHENIE,
    value:[ {upTo:1000000, months:36}, {upTo:10000000, months:84}, {upTo:20000000, months:120}, {upTo:50000000, months:144}, {upTo:Infinity, months:180} ] },
  { code:'rateFloor', point:'92', ...POLOZHENIE,
    value:0.5 },
  /* Второй пол ставки (РС-35, п. 92 абз. 2 → п. 34): минимально допустимая ставка по ВИДУ
     ПРОЕКТА. 'external'/'mitigation' — ставка задана международным договором либо стоимостью
     привлечённых госзаймов и машинно не вычисляется: pct:null, и гейт честно говорит об этом. */
  { code:'rateFloorProject', point:'34', ...POLOZHENIE,
    value:[ { kind:'social',     pct:1,    label:'социально значимые, инфраструктурные, национальная безопасность' },
            { kind:'infraSOE',   pct:4,    label:'инфраструктурные проекты госпредприятий и АО с госдолей ≥ 50 %' },
            { kind:'commercial', pct:6,    label:'коммерческие (извлечение прибыли)' },
            { kind:'external',   pct:null, label:'за счёт средств иностранных кредиторов — ставка международного договора' },
            { kind:'mitigation', pct:null, label:'за счёт средств счёта смягчения — ставка привлечённых госзаймов' } ] },
  { code:'deadlineAnalysis', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:30, unit:'к.д.', label:'Анализ'} },
  { code:'deadlineLetter', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:5, unit:'р.д.', label:'Письмо уполномоченному органу'} },
  { code:'deadlineDecision', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:70, unit:'к.д.', label:'Решение уполномоченного органа'} }
];
function normAt(code, date){                      // запись, действующая на дату — последняя applicable, не первая по массиву
  const recs=NORM_REFERENCE.filter(r=>r.code===code);
  const applicable=recs.filter(r=>!r.dateFrom || r.dateFrom<=date);
  if(!applicable.length) return recs[0]||null;
  return applicable.reduce((a,b)=> (!a.dateFrom || (b.dateFrom && b.dateFrom>a.dateFrom)) ? b : a);
}
function normNote(rec){                            // цитата для UI — «не подтверждён», если редакция неизвестна
  if(!rec) return 'норма не найдена';
  return rec.edition
    ? `п. ${rec.point}, ред. ${rec.edition} от ${rec.dateFrom}`
    : `п. ${rec.point} — пункт не подтверждён (редакция не установлена)`;
}
/* РС-37: база предела срока — ОСТАТОК ЗАДОЛЖЕННОСТИ по кредиту («при остатке задолженности до
   1000000…» дословно), а не сумма конкретного переноса. Границы ступеней пересекаются в точке:
   ровно 1 000 000 (10/20/50 млн) попадает в ВЕРХНЮЮ ступень — так читается «от X до Y». */
function termCapFor(sum, date){ const rec=normAt('termCap', date); const step=(rec.value||[]).find(s=>sum<s.upTo); return { months:(step||rec.value[rec.value.length-1]).months, rec }; }
/* РС-35: полов два, применяется БОЛЬШИЙ. Первый — 50 % от первоначальной ставки транша (не от
   действующей: иначе три сделки «не ниже половины» сводят ставку к одной восьмой договорной).
   Второй — минимум по виду проекта (п. 34). Вид не указан либо ставка внешняя ⇒ второй пол не
