/* ---- утилиты дат (Р-7): производные счётчики, ничего не хранится ---- */
const D = s => new Date(s+'T00:00:00Z');
const daysBetween = (a,b) => Math.round((D(b)-D(a))/86400000);
function addCalDays(s,n){ const d=D(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
/* Производственный календарь (РС-30) — справочник дат, а не правило «сб/вс». Постоянные
   праздники КР сидят как ММ-ДД и действуют в любом году; переносы, перенесённые рабочие
   субботы и религиозные праздники (Орозо айт / Курман айт — лунный календарь) устанавливаются
   отдельным решением ежегодно и потому заводятся ЗАПИСЬЮ С ГОДОМ. Год, которого в справочнике
   нет, — не молчаливый откат к «сб/вс», а видимая отметка «календарь года не заведён»
   (calendarYearKnown → подпись рядом со сроком). Календарь один на все модули: тот же срок в
   рабочих днях есть у платежей. */
const CALENDAR_FIXED = ['01-01','01-07','02-23','03-08','03-21','04-07','05-01','05-05','05-08','05-09','08-31','11-07','11-08'];
const CALENDAR_YEARS = {
  2026: { holidays:['2026-03-20','2026-03-23','2026-05-27','2026-05-28','2026-08-03','2026-11-09'],   // переносы + Орозо айт / Курман айт (демо-даты)
          workdays:['2026-03-28','2026-11-14'] }                                                     // перенесённые рабочие субботы
};
const calendarYearKnown = y => Object.prototype.hasOwnProperty.call(CALENDAR_YEARS, Number(y));
function isWorkDay(iso){
  const y=iso.slice(0,4), md=iso.slice(5), rec=CALENDAR_YEARS[Number(y)]||{holidays:[],workdays:[]};
  if((rec.workdays||[]).includes(iso)) return true;                       // перенесённая рабочая суббота
  if(CALENDAR_FIXED.includes(md)) return false;
  if((rec.holidays||[]).includes(iso)) return false;
  const wd=D(iso).getUTCDay();
  return wd!==0 && wd!==6;
}
function addWorkDays(s,n){ let cur=s,added=0; while(added<n){ cur=addCalDays(cur,1); if(isWorkDay(cur)) added++; } return cur; }
const fmt = n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2= n => Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= ДВИЖОК ТРАНША — CreditSide (РС-9: граница внутри файла, не сетевой шов) ===== */
const round2 = x => Math.round((Number(x)||0)*100)/100;
function periodMonths(schedule){
  return schedule==='ежеквартально' ? 3
       : schedule==='раз в полугодие' ? 6
       : schedule==='ежегодно' ? 12 : 1;                // дефолт «ежемесячно»
}
/* Безставочные колонки строки (РС-41, ADR-0109). `parts` = [{article, amount, periods}], где
   periods — {mode:'all'} либо {mode:'range',from,to} по позициям графика, 1-базовым включительно.
   Сумма ложится РАВНЫМИ ДОЛЯМИ, остаток — в ПОСЛЕДНЮЮ позицию интервала: тот же приём, которым
   дифференцированный метод ниже уводит хвост тела в последний платёж, и он же гарантирует, что
   сумма колонки сходится с суммой распоряжения в копейку (сирота 0,01 не заводится).
   Интервал за длиной графика здесь зажимается, чтобы график остался суммируемым, — но молчаливой
   подрезкой это не становится: расхождение ловит ИР-15 в validateDS и показывает дверь (РС-40). */
function spreadParts(rows, parts){
  (parts||[]).forEach(p=>{
    const n=rows.length, amount=round2(p.amount); if(!n || amount<=0) return;
    const per = (p.periods && p.periods.mode==='range') ? p.periods : { mode:'all' };
    const from = per.mode==='range' ? Math.min(Math.max(1, Math.trunc(per.from)||1), n) : 1;
    const to   = per.mode==='range' ? Math.min(Math.max(from, Math.trunc(per.to)||from), n) : n;
    const cnt  = to-from+1, share = round2(amount/cnt);
    let left = amount;
    for(let k=from;k<=to;k++){
      const v = (k===to) ? round2(left) : share;                  // хвост округления — в последнюю позицию интервала
      left = round2(left - v);
      const row = rows[k-1];
      row.articles = row.articles || {};
      row.articles[p.article] = round2((row.articles[p.article]||0) + v);
      row.pay = round2((row.pay||0) + v);
    }
  });
  return rows;
}
/* Амортизация — приватный движок (issues/01, реш.5): тело `base`, годовая ставка `rate`, срок
   `termMonths`, метод, блоки льгот, дата отсчёта, периодность. graceBlocks = [{months:Int,
   type:'interest-only'|'moratorium'}]. Демо: месяц = 30 дней, не прод-начисление (карта, «Не-цели»).
   `parts` — безставочные статейные колонки (ADR-0109): ставка считается ТОЛЬКО по `base`, то есть
   по колонке основного долга; накопленное и капитализированная пеня попадают в строку суммой к
   уплате и базой начисления не становятся (ИР-11). */
function amortize(base, rate, termMonths, method, graceBlocks, fromDate, schedule, parts){
  const p = periodMonths(schedule||'ежемесячно');
  const i = (Number(rate)||0)/100 * p/12;
  const nTotal = Math.max(1, Math.round((Number(termMonths)||0)/p));
  let gMor=0, gIo=0;
  (graceBlocks||[]).forEach(b=>{ const per=Math.round((b.months||0)/p);
    if(b.type==='moratorium') gMor+=per; else gIo+=per; });
  const m = Math.max(1, nTotal - gMor - gIo);
  const dateAt = idx => addCalDays(fromDate, idx * 30 * p);
  const rows=[]; let k=0;
  let baseAmort = base, morCap = 0;
  if(gMor>0){ baseAmort = base*Math.pow(1+i,gMor); morCap = round2(baseAmort - base); }
  for(let j=0;j<gMor;j++){ k++;
    rows.push({n:k,date:dateAt(k),pay:0,principal:0,interest:0,balance:round2(base),phase:'мораторий'}); }
  for(let j=0;j<gIo;j++){ k++;
    const interest = round2(baseAmort*i);
    rows.push({n:k,date:dateAt(k),pay:interest,principal:0,interest,balance:round2(baseAmort),phase:'льгота'}); }
  let bal = round2(baseAmort);
  if(method==='дифференцированный'){
    const prConst = round2(baseAmort/m);
    for(let j=0;j<m;j++){ k++;
      const interest = round2(bal*i);
      const principal = (j===m-1) ? bal : prConst;
      const pay = round2(principal + interest);
      bal = round2(bal - principal);
      rows.push({n:k,date:dateAt(k),pay,principal,interest,balance:round2(Math.max(bal,0))});
    }
  } else {                                              // аннуитет (дефолт)
    const A = i>0 ? baseAmort*i/(1-Math.pow(1+i,-m)) : baseAmort/m;
    const Ar = round2(A);
    for(let j=0;j<m;j++){ k++;
      const interest = round2(bal*i);
      const principal = (j===m-1) ? bal : round2(Ar - interest);
      const pay = (j===m-1) ? round2(principal + interest) : Ar;
      bal = round2(bal - principal);
      rows.push({n:k,date:dateAt(k),pay,principal,interest,balance:round2(Math.max(bal,0))});
    }
  }
  spreadParts(rows, parts);
  return { rows, morCap, meta:{p,i,nTotal,gMor,gIo,m,baseAmort} };
}

/* Остаток транша — формула поверх журнала ops, не поле (ИР-3 стал определением). Чужие записи
   (mirror:true) участвуют в сумме наравне со своими — знак определяет kind, не owner. */
function balanceAt(t,d){
  return round2((t.ops||[]).filter(o=>o.date<=d).reduce((s,o)=>{
    if(o.kind==='disburse'||o.kind==='transfer_in') return s+o.amount;
    if(o.kind==='repay'||o.kind==='transfer_out')   return s-o.amount;
    return s;
  },0));
}
/* Версия графика, действующая на дату d — последняя с validFrom≤d; конец выводится (validTo), не хранится. */
function scheduleAt(t,d){
  const vs=(t.schedules||[]).filter(v=>v.validFrom<=d);
  return vs.length ? vs.reduce((a,b)=>b.validFrom>a.validFrom?b:a) : null;
}
function validTo(t,ver){
  const next=(t.schedules||[]).filter(v=>v.validFrom>ver.validFrom).sort((a,b)=>a.validFrom<b.validFrom?-1:1)[0];
  return next ? addCalDays(next.validFrom,-1) : null;         // null = действует по сей день
}
/* Условия на дату d — свёртка записей с effectiveFrom≤d, поздние поля перекрывают ранние (credit.html, :1699). */
function conditionsAt(t,d){
  return (t.conditionRecords||[]).filter(r=>r.effectiveFrom<=d)
    .sort((a,b)=>a.effectiveFrom<b.effectiveFrom?-1:1)
    .reduce((acc,r)=>Object.assign(acc,r),{});
}
/* Основной долг на дату d — седьмая статья, всегда выводится (issues/01, реш.3): просроченная часть —
   план графика минус фактическое погашение; связь repay↔строки графика пока по сумме (issues/02, новый
   открытый вопрос от 01) — точнее, чем строчная привязка, здесь не требуется (демо). */
/* Перенесённое НЕ-тело (ADR-0109): производный транш принял одну сумму переноса, но телом в ней
   была только колонка основного долга. Строки, помеченные fromTransfer, живут в t.debt и уже
   участвуют в разбивке долга через debtAt — не вычесть их из остатка значит посчитать накопленное
   дважды и начислить на него ставку. Обычные демо-строки долга такой пометки не несут: у них
   остаток транша и так только тело. */
function transferredNonPrincipal(t){
  return round2((t.debt||[]).filter(x=>x.fromTransfer).reduce((s,x)=>s+(x.amount||0),0));
}
function principalAt(t,d){
  const bal=round2(Math.max(balanceAt(t,d)-transferredNonPrincipal(t), 0));
  const ver=scheduleAt(t,d);
  const plannedOver=round2(((ver&&ver.rows)||[]).filter(r=>r.date<d).reduce((s,r)=>s+(r.principal||0),0));
  const repaid=round2((t.ops||[]).filter(o=>o.kind==='repay'&&o.date<=d).reduce((s,o)=>s+o.amount,0));
  const over=round2(Math.min(Math.max(plannedOver-repaid,0), bal));
  return { over, cur: round2(bal-over) };
}

/* Чистый предпросмотр — не пишет ничего (issues/01: «черновик остаётся историческим объектом заявки»,
   ADR-0042). ds несёт date/transferSum/params{rate,term,method,schedule,graceBlocks}. */
function draftSchedule(tranche, ds){
  // База начисления — колонка ОСНОВНОГО ДОЛГА (ADR-0109), а не вся сумма переноса: безставочные
  // статьи приходят отдельно в ds.parts. Прежний вызов без раскладки (principalPart отсутствует)
  // читается как «весь перенос — тело» и даёт ровно прежний график.
  const base = ds.principalPart!=null ? Number(ds.principalPart)
             : ds.transferSum!=null   ? Number(ds.transferSum)
             : balanceAt(tranche, ds.date);
  const p = ds.params||{};
  const rate = p.rate!=null ? p.rate : tranche.originalRate;
  return amortize(base, rate, p.term, p.method, p.graceBlocks||[], ds.date, p.schedule, ds.parts||[]);
}
/* Свод безставочных колонок по статье — для строк долга производного транша: в графике сроки
   у каждой части свои, в разбивке долга статья одна. */
function mergeParts(parts){
  const acc={};
  (parts||[]).forEach(p=>{ acc[p.article]=round2((acc[p.article]||0)+p.amount); });
  return ARTICLES.map(a=>a.key).filter(k=>acc[k]>0).map(k=>({article:k, amount:acc[k]}));
}
/* Сумма всех статейных колонок строки — включая колонку ОД (ИР-2 в редакции ADR-0109). */
function rowArticlesSum(r){
  return round2(Object.keys(r.articles||{}).reduce((s,k)=>s+(r.articles[k]||0),0));
}
function scheduleArticleCols(rows){
  const seen=new Set();
  (rows||[]).forEach(r=>Object.keys(r.articles||{}).forEach(k=>{ if(round2(r.articles[k])>0) seen.add(k); }));
  return ARTICLES.map(a=>a.key).filter(k=>seen.has(k));                 // порядок — очередь погашения (РС-13); пустая колонка не рисуется
}
/* Предпосылки до первой записи (ИР-2 и прочие) — свод-баннер, а не тост (packetGate/conclGate/
   resolutionGate — существующие гейты конвейера, issues/03). Дверь спрашивает про ПОСТАНОВЛЕНИЕ
   КАБМИНА: заключение уполномоченного органа само по себе условия не меняет (ADR-0107 §1). */
function validateDS(ds){
  const reasons=[];
  if(!ds.app || !ds.sourceTranche || !ds.credit){ reasons.push('Не выбраны заявка, транш-источник или кредит'); return reasons; }
  if(!packetGate(ds.app).ok) reasons.push('Пакет документов не собран');
  if(!conclGate(ds.app).ok)  reasons.push('Не все заключения завизированы');
  if(!resolutionGate(ds.app).ok) reasons.push('Нет постановления Кабинета Министров (реквизит и согласование профильного комитета ЖК обязательны)');
  if(!forgiveGate(ds.app).ok)    reasons.push('Прощение не названо суммой либо основанием в постановлении (РС-28)');
  const lg=limitsGate(ds.params, ds.credit, ds.date); if(!lg.ok) reasons.push(...lg.messages);                 // жёсткий, без waiver (issues/04)
  const cg=consentGateApp(ds.app); if(!cg.ok) reasons.push('Не получено согласие обеспечителя(ей): '+cg.pending.join(', '));  // жёсткий, без waiver
  const draft=draftSchedule(ds.sourceTranche, ds);
  // ИР-2 в редакции ADR-0109: сверяется сумма ВСЕХ статейных колонок графика, не одной колонки
  // тела — иначе накопленное уезжает в перенос, но в графике его нет, и подписан не тот документ.
  const sumPrincipal=round2((draft.rows||[]).reduce((s,r)=>s+(r.principal||0),0));
  const sumArticles =round2((draft.rows||[]).reduce((s,r)=>s+rowArticlesSum(r),0));
  const sumAll=round2(sumPrincipal+sumArticles);
  if(Math.abs(sumAll-Number(ds.transferSum||0))>0.5)
    reasons.push('Сумма графика по всем статьям ('+fmt(sumAll)+') не совпадает с суммой переноса ('+fmt(ds.transferSum)+')');       // ИР-2
  // ИР-15 (РС-40): интервал сроков лежит внутри длины графика. Подрезать молча нельзя — куратор
  // задавал позиции при одном сроке, срок мог уменьшиться; подставить новую границу за него
  // значит выдумать его решение.
  const nPos=(draft.rows||[]).length;
  (ds.parts||[]).forEach(p=>{
    const per=p.periods; if(!per || per.mode!=='range') return;
    if(per.from>=1 && per.to<=nPos && per.from<=per.to) return;
    reasons.push('Сроки распоряжения по статье «'+(ARTICLE_LABEL[p.article]||p.article)+'» — позиции '
      +per.from+'–'+per.to+', а в графике '+nPos+' '+(nPos===1?'позиция':'позиций')+' (ИР-15)');
  });
  const dates=(draft.rows||[]).map(r=>r.date);
  for(let k=1;k<dates.length;k++) if(!(dates[k]>dates[k-1])){ reasons.push('Даты графика не строго возрастают'); break; }
  const term=Number(ds.params&&ds.params.term)||0;
  if(term>0){ const termEnd=addCalDays(ds.date, term*30);
    if(dates.length && dates[dates.length-1]>termEnd) reasons.push('Последняя дата графика позже конца срока ДС'); }
  return reasons;
}
/* Опустошённый транш-источник закрывается, причина ВЫВЕДЕНА обнулившей операцией, не введена (ИР-5). */
function closeIfEmptied(tranche, ds){
  if(round2(balanceAt(tranche, ds.date))<=0) tranche.closed={ date:ds.date, by:ds.no, reason:'перенос' };
}
/* Единственная пишущая дверь (ADR-0096, issues/03): валидация → 1 производный транш → 2 перенос
   (зеркальная пара transfer_out/transfer_in) → 3 версия графика на новый транш → 4 условия (несутся
   вместе с траншем в conditionRecords) → 5 закрытие опустошённого источника → 6 счётчик + одна запись
   аудита. `tranche.ops.push` вне этой функции быть не должно (граница grep-проверяема). */
function restructureApplied(ds){
  const reasons=validateDS(ds);
  if(reasons.length) return { ok:false, reasons };

  const src=ds.sourceTranche, credit=ds.credit;
  const draft=draftSchedule(src, ds);

  const seq=credit.tranches.length+1;                                       // 1. производный транш
  const newT={
    id:credit.id+'-T'+seq, no:credit.no+'-Т'+seq, subjectKey:src.subjectKey,
    amount:Number(ds.transferSum), plannedDate:ds.date,
    originalRate:(ds.params&&ds.params.rate!=null)?ds.params.rate:src.originalRate,
    ops:[ { date:ds.date, kind:'transfer_in', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, from:src.id} } ],
    schedules:[],
    conditionRecords:[ { effectiveFrom:ds.date, ...conditionsAt(src, ds.date), ...(ds.params||{}) } ],
    // Долг переносится ОДНОЙ суммой (transferSum — она и стоит в акте ДС), но разложенной по
    // статьям (ADR-0109): безставочные колонки приезжают на транш строками долга, иначе следующая
    // реструктуризация того же кредита прочитает перенос как чистое тело и потеряет накопленное.
    debt:mergeParts(ds.parts).map(p=>({ article:p.article, urgency:'cur', amount:p.amount, since:ds.date, fromTransfer:true })),
    closed:null
  };
  credit.tranches.push(newT);

  src.ops.push({ date:ds.date, kind:'transfer_out', amount:Number(ds.transferSum), mirror:false, owner:'Кредит', basis:{ds:ds.no, to:newT.id} });  // 2. перенос

  newT.schedules.push({ ver:1, validFrom:ds.date, by:{kind:'ДС', ref:ds.no}, rate:ds.params&&ds.params.rate, rows:draft.rows });  // 3. версия графика

  closeIfEmptied(src, ds);                                                  // 5. закрытие опустошённого транша (условия — шаг 4, см. conditionRecords выше)

  credit.restructCount+=1;                                                  // 6. счётчик + одна запись аудита (не шесть)
  credit.audit.push({ type:'ДС применён', ds:ds.no, date:ds.date, detail:'Транш '+src.no+' → '+newT.no+', перенесено '+fmt(ds.transferSum), mirror:false });

  return { ok:true, tranche:newT };
}
const CreditSide = { balanceAt, scheduleAt, validTo, conditionsAt, principalAt, draftSchedule, restructureApplied };

/* ================= ПРОИЗВОДНЫЕ (Р-19: считаем, не храним) ================= */
const creditById = id => state.credits.find(c=>c.id===id);
const kindById   = id => state.kinds.find(k=>k.id===id);
const appById    = id => state.apps.find(a=>a.id===id);

/* объединение разрешённых параметров выбранных видов (Р-3 ↔ Р-11) */
function allowedParams(app){ const s=new Set(); app.kindIds.forEach(id=>{ const k=kindById(id); if(k) k.params.forEach(p=>s.add(p)); }); return s; }
/* Нормативный пакет (РС-36, ИР-14) — состав приложений к предложению о реструктуризации задан
   пп. 85–86 Положения поимённо, а условные документы под снижение ставки — пп. 91/95. Это
   записи НОРМЫ: у каждой пункт и редакция, администратору они недоступны для удаления; свои
   документы вид добавляет сверх них (kind.docs). when — условие включения в пакет:
   'coverShort' (п. 86 — недостаточность покрытия либо беззалоговый кредит) и 'rateDown'
   (пп. 91/95 — заявка вообще вправе трогать ставку). */
const NORM_PACKET = [
  { doc:'Финансовая отчётность за последние 3 года (или за фактический период деятельности)', point:'85 пп. 1' },
  { doc:'Бизнес-план на весь период пролонгации (доходы и денежные потоки · ресурсы, затраты, оборотный капитал · риски и их минимизация)', point:'85 пп. 2' },
  { doc:'Предложения по обеспечению исполнения обязательств', point:'85 пп. 3' },
  { doc:'Предложения по залоговому обеспечению', point:'86', when:'coverShort' },
  { doc:'Акты органов о наступлении форс-мажорных и независящих обстоятельств', point:'95 пп. 1', when:'rateDown' },
  { doc:'Справка ОМСУ либо государственной администрации соответствующего района', point:'95 пп. 2', when:'rateDown' }
];
function coverShortInScope(app){
  return (app.creditIds||[]).some(id=>{ const cr=creditById(id); if(!cr) return false;
    const s=cr.coverSnapshot; return !s || s.cover==null || s.required==null || s.cover < s.required; });
}
function normPacket(app){
  const rateDown = allowedParams(app).has('rate');
  const coverShort = coverShortInScope(app);
  return NORM_PACKET.filter(d => !d.when || (d.when==='rateDown' ? rateDown : coverShort));
}
/* объединение требуемых документов (Р-3, гейт стадии 1): нормативный пакет + документы видов */
function requiredDocs(app){
  const s=new Set(normPacket(app).map(d=>d.doc));
  app.kindIds.forEach(id=>{ const k=kindById(id); if(k) (k.docs||[]).forEach(d=>s.add(d)); });
  return [...s];
}
const packetPointOf = doc => (NORM_PACKET.find(d=>d.doc===doc)||{}).point || null;

/* стадия — производная от owned-фактов (Р-4). ДС зарегистрировано ≠ «Закрыта» (issues/04 реш.1,
   ИР-9): терминал наступает только когда все три гейта оформления (согласия РС-17, покрытие/waiver
   РС-18, регуляторные пределы РС-19) пройдены — иначе стадия честно остаётся «Оформление», хоть
   ДС уже стоит. formalGatesOk читает те же три гейта, что и вкладка «Оформление». */
function formalGatesOk(app){
  return consentGateApp(app).ok && limitsGateApp(app).ok && (coverGateApp(app).ok || !!(app.waiver && app.waiver.granted));
}
function stageOf(app){
  if(app.outcome==='возврат') return {idx:0, closed:true, label:'Возвращена без рассмотрения'};
  if(app.ds && app.ds.no){
    return formalGatesOk(app)
      ? {idx:8, closed:true, label:'Закрыта'}
      : {idx:7, closed:false, label:'Оформление'};    // ДС стоит, но не все гейты закрытия пройдены — честно не терминал
  }
  // отказ приходит с одного из двух актов: отрицательное заключение органа (п. 88) либо
  // отказ в постановлении КМ (п. 89) — стадия отказа читается по тому, какой акт его нёс
  if(app.outcome==='отказ'){
    return (app.resolution && app.resolution.fixed)
      ? {idx:6, closed:true, label:'Отказ (постановление КМ)'}
      : {idx:4, closed:true, label:'Отказ (заключение уполномоченного органа)'};
  }
  if(app.resolution && app.resolution.fixed)  return {idx:7, closed:false, label:'Оформление'};
  if(app.zk && app.zk.fixed)                  return {idx:5, closed:false, label:'Проект решения КМ'};
  if(app.conclusion && app.conclusion.fixed)  return {idx:4, closed:false, label:'Заключение уполномоченного органа'};
  if(app.letterSent && app.letterSent.fixed)  return {idx:3, closed:false, label:'Письмо направлено'};
  if(app.committee && app.committee.fixed)    return {idx:2, closed:false, label:'Комитет'};
  if(app.analysisStarted)     return {idx:1, closed:false, label:'Анализ'};
  return {idx:0, closed:false, label:'Регистрация обращения'};
}

/* Норма-справочник (issues/04 реш.2, ADR-0099, ИР-10): запись — величина+пункт+редакция+дата
   начала действия, не голое число в коде. Расширяет прецедент DEADLINE_TEMPLATES (collection.html)
   двумя полями (edition/dateFrom). Смена редакции — НОВАЯ запись поверх старой (normAt берёт
   последнюю applicable на дату), старую не правим.

   РС-33 (10.08.2026): редакция Положения найдена — приложение к постановлению Кабинета Министров
   КР от 19.01.2026 № 14, ред. 19.01.2026 (docs/normativ/polozhenie-2026-01-19-N14-gl9.txt).
   Реквизиты ниже реальные, пометка «пункт не подтверждён» снята; ветка edition:null в normNote
   оставлена — она нужна любой БУДУЩЕЙ норме, которой у нас ещё нет. Значения, зашитые прежде по
   неподтверждённой редакции, совпали с действующими до месяца, номера пунктов — тоже.
   Три регламентных срока читают Порядок №41 от 06.07.2026 — та же редакция, что в шапке спеки. */
const POLOZHENIE = { origin:'Положение о работе с бюджетными кредитами', edition:'прил. к ПКМ КР №14', dateFrom:'2026-01-19' };
const NORM_REFERENCE = [
  { code:'termCap', point:'90', ...POLOZHENIE,
    value:[ {upTo:1000000, months:36}, {upTo:10000000, months:84}, {upTo:20000000, months:120}, {upTo:50000000, months:144}, {upTo:Infinity, months:180} ] },
  { code:'rateFloor', point:'92', ...POLOZHENIE,
    value:0.5 },
  /* Второй пол ставки (РС-35, п. 92 абз. 2 → п. 34): минимально допустимая ставка по ВИДУ
     ПРОЕКТА. 'external'/'mitigation' — ставка задана международным договором либо стоимостью
     привлечённых госзаймов и машинно не вычисляется: pct:null, и гейт честно говорит об этом. */
  { code:'rateFloorProject', point:'34', ...POLOZHENIE,
    value:[ { kind:'social',     pct:1,    label:'социально значимые, инфраструктурные, национальная безопасность' },
            { kind:'infraSOE',   pct:4,    label:'инфраструктурные проекты госпредприятий и АО с госдолей ≥ 50 %' },
            { kind:'commercial', pct:6,    label:'коммерческие (извлечение прибыли)' },
            { kind:'external',   pct:null, label:'за счёт средств иностранных кредиторов — ставка международного договора' },
            { kind:'mitigation', pct:null, label:'за счёт средств счёта смягчения — ставка привлечённых госзаймов' } ] },
  { code:'deadlineAnalysis', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:30, unit:'к.д.', label:'Анализ'} },
  { code:'deadlineLetter', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:5, unit:'р.д.', label:'Письмо уполномоченному органу'} },
  { code:'deadlineDecision', point:'18', origin:'Порядок мониторинга, взыскания и урегулирования задолженности', edition:'№41', dateFrom:'2026-07-06',
    value:{n:70, unit:'к.д.', label:'Решение уполномоченного органа'} }
];
function normAt(code, date){                      // запись, действующая на дату — последняя applicable, не первая по массиву
  const recs=NORM_REFERENCE.filter(r=>r.code===code);
  const applicable=recs.filter(r=>!r.dateFrom || r.dateFrom<=date);
  if(!applicable.length) return recs[0]||null;
  return applicable.reduce((a,b)=> (!a.dateFrom || (b.dateFrom && b.dateFrom>a.dateFrom)) ? b : a);
}
function normNote(rec){                            // цитата для UI — «не подтверждён», если редакция неизвестна
  if(!rec) return 'норма не найдена';
  return rec.edition
    ? `п. ${rec.point}, ред. ${rec.edition} от ${rec.dateFrom}`
    : `п. ${rec.point} — пункт не подтверждён (редакция не установлена)`;
}
/* РС-37: база предела срока — ОСТАТОК ЗАДОЛЖЕННОСТИ по кредиту («при остатке задолженности до
   1000000…» дословно), а не сумма конкретного переноса. Границы ступеней пересекаются в точке:
   ровно 1 000 000 (10/20/50 млн) попадает в ВЕРХНЮЮ ступень — так читается «от X до Y». */
function termCapFor(sum, date){ const rec=normAt('termCap', date); const step=(rec.value||[]).find(s=>sum<s.upTo); return { months:(step||rec.value[rec.value.length-1]).months, rec }; }
/* РС-35: полов два, применяется БОЛЬШИЙ. Первый — 50 % от первоначальной ставки транша (не от
   действующей: иначе три сделки «не ниже половины» сводят ставку к одной восьмой договорной).
   Второй — минимум по виду проекта (п. 34). Вид не указан либо ставка внешняя ⇒ второй пол не
   вычисляется: гейт работает по первому и поднимает флаг projectUnchecked («п. 34 не проверен»).
   Жёстко блокировать нельзя — атрибута нет у мигрированных кредитов. */
function rateFloorFor(origRate, date, projectKind){
  const rec=normAt('rateFloor', date);
  const half=round2((Number(origRate)||0)*rec.value);
  const projRec=normAt('rateFloorProject', date);
  const row=projectKind ? (projRec.value||[]).find(v=>v.kind===projectKind) : null;
  const projFloor = row && row.pct!=null ? row.pct : null;
  const floor = projFloor!=null ? Math.max(half, projFloor) : half;
  return { floor, half, projFloor, projectKind:projectKind||null, projectRow:row||null,
           projectUnchecked: projFloor===null, rec, projRec };
}

/* дедлайн активной стадии (Р-7), сроки — из норма-справочника, не литералы.
   РС-34: срок 70 к.д. по п. 18 Порядка меряется от отправки письма ДО РЕШЕНИЯ и внутренних
   этапов не различает — значит он один и тот же на стадиях «письмо направлено», «заключение
   уполномоченного органа» и «проект решения КМ» (idx 3…5), а собственных регламентных сроков
   у этих трёх стадий НЕТ: норма их не устанавливает, а выдуманный срок дал бы флаг просрочки
   по правилу, которого не существует. */
function deadline(app){
  const st = stageOf(app); if(st.closed) return null;
  if(st.idx===1) { const rec=normAt('deadlineAnalysis',app.regDate); const due=addCalDays(app.regDate,rec.value.n); return mkDl(rec,app.regDate,due); }
  if(st.idx===2) { if(app.committee&&app.committee.date){ const rec=normAt('deadlineLetter',app.committee.date); const due=addWorkDays(app.committee.date,rec.value.n); return mkDl(rec,app.committee.date,due);} return null; }
  if(st.idx>=3 && st.idx<=5) { if(app.letterSent&&app.letterSent.date){ const rec=normAt('deadlineDecision',app.letterSent.date); const due=addCalDays(app.letterSent.date,rec.value.n); return mkDl(rec,app.letterSent.date,due);} return null; }
  return null;
}
function mkDl(rec,anchor,due){ const rem=daysBetween(TODAY,due);
  const calKnown = rec.value.unit!=='р.д.' || (calendarYearKnown(anchor.slice(0,4)) && calendarYearKnown(due.slice(0,4)));
  return {name:rec.value.label,limit:rec.value.n,unit:rec.value.unit,anchor,due,remaining:rem,overdue:rem<0,calKnown,rec}; }

/* гейты (Р-19: производные предикаты) */
function packetGate(app){ const req=requiredDocs(app); const missing=req.filter(d=>!app.packetDocs[d]); return {ok:missing.length===0 && req.length>0, missing, req}; }
function conclGate(app){ const pending=app.conclusions.filter(c=>!c.visa).map(c=>c.dept); return {ok:pending.length===0 && app.conclusions.length>0, pending}; }
/* Три акта после письма (РС-34, ADR-0107), у каждого свои реквизиты и свой гейт.
   Заключение уполномоченного органа (пп. 87/88) — «возможно» либо «отказ»; отрицательное
   закрывает заявку и до Кабмина не доходит. Согласование профильного комитета ЖК (п. 82)
   обязательно для регистрации постановления. Под постановлением КМ (п. 89) регистрируется ДС —
   именно его исход, а не исход заключения, читает гейт «решение → оформление» (ИР-12). */
function conclusionGate(app){ const c=app.conclusion||{}; return {ok:!!c.outcome && !!(c.no&&c.no.trim()) && !!c.date}; }
function zkGate(app){ const z=app.zk||{}; const c=app.conclusion||{};
  return {ok: c.outcome==='возможно' && !!(z.no&&z.no.trim()) && !!z.date, needConclusion: c.outcome!=='возможно'}; }
function resolutionGate(app){ const r=app.resolution||{}; const z=app.zk||{};
  return {ok: !!r.decision && !!(r.no&&r.no.trim()) && !!r.date && !!(z.no&&z.no.trim()), needZk: !(z.no&&z.no.trim())}; }
function dsGate(app){ const d=app.ds||{}; return {ok:!!(d.no&&d.no.trim()) && !!(d.date&&d.date.trim())}; }

/* остаток на новых условиях (демо-упрощение): тело то же, влияет срок/ставка на maturity */
function newMaturity(app,cr){ const term=(app.version&&app.version.params.term)||cr.terms.term; return addCalDays(app.regDate, term*30); }
/* Устарелость снимка покрытия (issues/04 реш.2: «покрытие — чужой ответ, не свой расчёт»), тот
   же приём, что COLL_SNAPSHOT_STALE_DAYS/collSnapshotStale в collection.html — независимый
   демо-порог этого домена, не то же число по смыслу. Устаревший снимок гейт не пропускает молча
   (тот же принцип, что не даёт «сироте 0,01 сома» E2E-13/14 пройти на устаревших данных). */
const COVER_SNAPSHOT_STALE_DAYS = 60;
const coverSnapshotAge = cr => daysBetween((cr.coverSnapshot||{}).date||TODAY, TODAY);
const coverSnapshotStale = cr => !cr.coverSnapshot || coverSnapshotAge(cr) > COVER_SNAPSHOT_STALE_DAYS;
function coverGate(app,cr){
  const snap = cr.coverSnapshot||{};
  const stale = coverSnapshotStale(cr);
  const required = snap.required, cover = snap.cover;
  const coverOk = !stale && cover!=null && required!=null && cover >= required;
  const mat = newMaturity(app,cr);
  const ageOk = !cr.tech || (cr.techAgeYears + Math.ceil(((app.version&&app.version.params.term)||cr.terms.term)/12) <= cr.techMaxAge);
  const insured = daysBetween(mat, cr.insuredUntil) >= 0;
  const waived = !!(app.waiver && app.waiver.granted);
  const ok = (coverOk && ageOk && insured) || waived;
  return {required,cover,coverOk,ageOk,insured,waived,ok,maturity:mat,stale,snapshotDate:snap.date,source:snap.source};
}
/* агрегат гейта обеспечения по всем кредитам заявки */
function coverGateApp(app){ const rows=app.creditIds.map(id=>({cr:creditById(id),g:coverGate(app,creditById(id))})); const ok=rows.every(r=>r.g.ok); return {rows,ok}; }

/* Пределы (issues/04 реш.2/3, ADR-0099, ИР-10, РС-19): жёсткий гейт, без waiver — срок и ставка
   новых условий сверяются с норма-справочником на дату операции. База предела срока — ОСТАТОК
   ЗАДОЛЖЕННОСТИ по кредиту (cr.balance, тот же приём, что coverGate несколькими строками выше),
   а не сумма конкретного переноса (РС-37: так говорит п. 90 дословно). Пол ставки — больший из
   двух (РС-35): 50 % от первоначальной и минимум по виду проекта (п. 34). */
function limitsGate(params, credit, date){
  const term=Number(params&&params.term)||0;
  const rate=(params&&params.rate!=null) ? Number(params.rate) : null;
  const cap=termCapFor(credit.balance, date), floor=rateFloorFor(credit.terms.rate, date, credit.projectKind);
  const termOk = term>0 && term<=cap.months;
  const rateOk = rate!=null && rate>=floor.floor;
  const messages=[];
  if(!termOk) messages.push('Срок '+term+' мес. превышает предел '+cap.months+' мес. при остатке задолженности '+fmt(credit.balance)+' ('+normNote(cap.rec)+')');
  if(!rateOk) messages.push('Ставка '+(rate==null?'не задана':rate+'%')+' ниже минимума '+floor.floor+'% ('+normNote(floor.rec)+(floor.projFloor!=null?'; вид проекта — '+floor.projFloor+'%, '+normNote(floor.projRec):'')+')');
  return { ok:termOk&&rateOk, termOk, rateOk, cap:cap.months, floor:floor.floor,
           half:floor.half, projFloor:floor.projFloor, projectRow:floor.projectRow, projectUnchecked:floor.projectUnchecked,
           capRec:cap.rec, floorRec:floor.rec, projRec:floor.projRec, messages };
}
/* превью гейта на уровне заявки — до ДС читает черновик version.params, после ДС читает
   зафиксированные app.ds.params, чтобы терминал (formalGatesOk) не «моргал» после факта */
function limitsGateApp(app){
  const credit=creditById(app.creditIds[0]); if(!credit) return { ok:true, pending:true, messages:['Кредит не выбран'] };
  const fixed=app.ds&&app.ds.no;
  const params = fixed ? app.ds.params : (app.version&&app.version.params);
  const date = fixed ? app.ds.date : app.regDate;
  if(!params) return { ok:true, pending:true, messages:['Условия ещё не выбраны — гейт неприменим до расчёта'] };
  return limitsGate(params, credit, date);
}

/* Согласия обеспечителей (issues/04 реш.2, ADR-0098, ИР-8): зеркало чужого домена (Обеспечение) —
   тот же приём, что COLL_PROCS чуть выше по файлу: демо-данные здесь, не вызов чужого API. Жёсткий
   гейт, без waiver (в отличие от покрытия) — по каждому кредиту заявки все обеспечители обязаны
   быть в статусе «согласовано». */
const GUARANTEES = {
  'CR-60540': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-03-15'} ],
  'CR-60541': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-04-20'} ],
  'CR-58120': [],
  'CR-59003': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-06-01'} ],
  'CR-61200': [ {name:'Петров П.П. (поручитель)', status:'запрошено', date:'2026-07-05'} ],  // демо блокировки ИР-8: одно неурегулированное согласие
  /* вторая волна: согласия собраны — иначе жёсткий гейт держал бы заявку в «Оформлении» и
     витрина показывала бы одну и ту же блокировку пятнадцать раз. Пустой список — беззалоговый
     кредит без поручителей, это не «согласий нет», а «спрашивать некого». */
  'CR-62010': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2026-02-10'} ],
  'CR-62011': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-02-26'} ],
  'CR-62012': [],
  'CR-62013': [ {name:'Токтосунов Б.А. (поручитель)', status:'согласовано', date:'2026-02-18'},
                {name:'ОсОО «Ынтымак-Агро» (залогодатель)', status:'согласовано', date:'2026-02-18'} ],
  'CR-62014': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-03-04'} ],
  'CR-62015': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-04-08'} ],
  'CR-62016': [ {name:'Министерство финансов КР (гарантия)', status:'согласовано', date:'2026-02-12'} ],
  'CR-62017': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2026-02-12'} ],
  'CR-62018': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2025-12-15'} ],
  'CR-62019': [],
  'CR-62020': [ {name:'Асанов Т.К. (поручитель)', status:'согласовано', date:'2026-06-01'} ],
  'CR-62021': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-02-02'} ],
  'CR-62022': [ {name:'Токтосунов Б.А. (поручитель)', status:'запрошено', date:'2026-03-20'} ],   // отказ ПКМ — согласие так и осталось незакрытым
  'CR-62023': []
};
function consentGate(creditId){
  const list=GUARANTEES[creditId]||[];
  const pending=list.filter(g=>g.status!=='согласовано').map(g=>g.name);
  return { ok:pending.length===0, list, pending };
}
function consentGateApp(app){
  const rows=(app.creditIds||[]).map(id=>({cr:creditById(id), g:consentGate(id)}));
  const ok=rows.every(r=>r.g.ok);
  return { ok, rows, pending:rows.flatMap(r=>r.g.pending) };
}

/* Гейт прощения (РС-28, ИР-13): жёсткий. Отдельного решения кредитного комитета сверх ДС не
   заводим — комитет высказался по сделке целиком, а решение принял Кабинет Министров. Но ссылки
   «согласно постановлению» мало: в реквизитах акта обязана стоять СУММА прощения либо прямо
   названная база («вся начисленная неустойка по кредиту №…»), иначе прощение необратимо
   уменьшает актив Холдинга по документу, этой суммы не содержавшему. Пеня и проценты прощаются
   одним порядком: различает их статья, а не процедура. */
function forgiveGate(app){
  const rows=(app.dispositions||[]).filter(d=>d.kind==='forgive');
  const sum=round2(rows.reduce((s,d)=>s+d.amount,0));
  if(!rows.length) return { ok:true, applicable:false, sum:0 };
  const r=app.resolution||{};
  const named = !!(r.forgiveSum!=null || (r.forgiveBasis&&String(r.forgiveBasis).trim()));
  return { ok:named, applicable:true, sum, named,
           actSum: r.forgiveSum!=null ? round2(r.forgiveSum) : null,
           basis: r.forgiveBasis||null,
           mismatch: (r.forgiveSum!=null && round2(r.forgiveSum)!==sum) };
}
/* Повторность (РС-32) — СИГНАЛ, не гейт. Начиная с третьей реструктуризации одного кредита
   заявка получает видимый признак; ничего не блокирует и порядка согласования не меняет —
   маршрут установлен нормой (п. 82), надстроить над ним свою ступень Холдинг не вправе.
   На категорию риска счётчик влияет только через комитет (ADR-0065). Порог — настройка. */
const REPEAT_SIGNAL_FROM = 3;
function repeatSignal(app){
  const rows=(app.creditIds||[]).map(id=>creditById(id)).filter(Boolean)
    .filter(cr=>(cr.restructCount||0)+1 >= REPEAT_SIGNAL_FROM);
  return { on:rows.length>0, credits:rows.map(cr=>({no:cr.no, n:(cr.restructCount||0)+1})) };
}

/* активная заявка на кредите (Р-2): любая незакрытая заявка, кроме текущей */
function activeAppOnCredit(creditId, exceptAppId){
  return state.apps.find(a=>a.id!==exceptAppId && !stageOf(a).closed && a.creditIds.includes(creditId));
}
function canAdvance(app){
  const st=stageOf(app);
  if(st.idx===0) return {to:'Анализ', ok:packetGate(app).ok, why:'Пакет документов неполон'};
  if(st.idx===1) return {to:'Комитет', ok:conclGate(app).ok && app.creditIds.length>0, why:'Не все заключения завизированы / пустой охват'};
  return null;
}

/* права (Р-17) */
function canX(action){ return (RIGHTS[state.role]||[]).includes(action); }
function guard(action){ if(!canX(action)){ toast('Роль «'+state.role+'» не может выполнить это действие','err'); return false; } return true; }

/* ================= ФИНАНСОВОЕ ЯДРО ЗАЯВКИ — AppSide (issues/02: ядро — таблица позиций,
   не набор чисел; порядок и происхождение выражены данными, а не чертой текста). Приватно
   для файла (РС-9 — граница внутри файла, не сетевой шов): «приватно» значит вне RS-экспорта
   (задача 8), не отдельный модуль/замыкание — по духу карты, лишняя абстракция не нужна. */

/* Срез/факт — один счётчик на любую дату (issues/02 реш.2). Шесть статей — со среза транша
   (tranche.debt, демо не считает реальное начисление во времени, см. «Не-цели» карты: месяц =
   30 дней, движок не прод); седьмая (principal) выводится CreditSide.principalAt — единственная
   статья, которая в этом демо реально зависит от даты. */
function debtAt(tranche, date){
  const rows = (tranche.debt||[]).map(d=>({ article:d.article, urgency:d.urgency, amount:d.amount, since:d.since, disputed:!!d.disputed }));
  const { over, cur } = CreditSide.principalAt(tranche, date);
  if(over>0) rows.push({ article:'principal', urgency:'over', amount:over, since:tranche.plannedDate });
  if(cur>0)  rows.push({ article:'principal', urgency:'cur',  amount:cur,  since:tranche.plannedDate });
  return rows;
}

/* Режим начисления по статье (РС-27, ADR-0106) — ТАБЛИЦА С ДАТАМИ ВСТУПЛЕНИЯ, а не флаг на
   кредите: механизм ACCRUAL_MODES/accrualModeOf кредита (ADR-0013 §3). Смена правила заводится
   новой записью с новой датой, сделки прошлых лет продолжают считаться по режиму, действовавшему
   тогда. Пеня — терминальная статья: на неё не начисляют и она сама начислений не порождает;
   капитализированная пеня выделяется ОТДЕЛЬНОЙ СУММОЙ (п. 89 пп. 4) и в тело не сливается,
   потому ставке на ней взяться неоткуда. Накопленное родилось из уступки — начислять на него
   санкцию значит наказывать за уступку, которую Холдинг сам и дал. */
const ACCRUAL_MODES = [
  { article:'principal',      from:'2000-01-01', mode:{interest:true,  penalty:true },  basis:'обычная механика кредита' },
  { article:'interest',       from:'2000-01-01', mode:{interest:false, penalty:true },  basis:'просроченный процент даёт пеню' },
  { article:'accInterest',    from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106' },
  { article:'accPenalty',     from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106' },
  { article:'penalty',        from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106 — пеня на пеню не начисляется никогда' }
];
function accrualModeOf(article, date){
  const recs=ACCRUAL_MODES.filter(r=>r.article===article && r.from<=date);
  if(!recs.length) return { mode:{interest:false,penalty:false}, basis:'режим не заведён', from:null };
  return recs.reduce((a,b)=> b.from>a.from ? b : a);
}
const accrualEmpty = (article,date) => { const m=accrualModeOf(article,date).mode; return !m.interest && !m.penalty; };

/* База — позиции с тремя состояниями строки (issues/02 реш.1): включена · снята куратором
   (blockedBy пуст, чекбокс живой) · заблокирована видом (чекбокс мёртв). Список статей,
   разрешённых видом, заводит issues/04 (allowedDispositions) — тикет 07, сюда 06 не блокирован
   этим решением: честно не подставляем номер, blockedBy по виду всегда null, не выдумка.
   Спорная пеня (issues/01 реш.3, поле disputed) — та же колонка blockedBy='disputed', галка
   мертва, строка всегда видна (ИР-6: невидимая строка читалась бы как «пени нет»).
   app.calcTranche — транш, выбранный под расчёт ДС; заводит тикет 05/задача 5 (buildDemoApps). */
function defaultBase(app, date){
  const tranche = app.calcTranche;
  if(!tranche) return [];
  return debtAt(tranche, date).map(row => ({
    ...row,
    included: row.urgency==='over' && !row.disputed,
    blockedBy: row.disputed ? 'disputed' : null
  }));
}
/* Распоряжение — на позицию, одно, с суммой и сроками (РС-38). Остаток «без распоряжения»
   получается вычитанием суммы распоряжения из позиции, второй сущности не заводим. Сроки —
   позиции графика производного транша: {mode:'all'} (умолчание, следует за сроком само) либо
   {mode:'range',from,to} (1-базовые, включительно). null не используется: «весь график» —
   осмысленное значение, а не отсутствие значения. */
const allPeriods = () => ({ mode:'all' });
function defaultDispositions(base){
  return base.filter(r=>r.included).map(r => ({ article:r.article, urgency:r.urgency, kind:'none', amount:r.amount, periods:allPeriods() }));
}
function dispositionFor(dispositions, article, urgency){
  return (dispositions||[]).find(d=>d.article===article && d.urgency===urgency) || null;
}
/* Материализация базы/распоряжений при первом живом действии куратора (issues/02 реш.1/4,
   тикет 07 — честная дыра #2 из Answer тикета 06). До первого клика app.base/app.dispositions
   пустые — панель считает defaultBase/defaultDispositions на лету, не хранит (Р-19); первое
   переключение строки или смена распоряжения обязано зафиксировать снимок в app, иначе правка
   потеряется на следующем рендере, откатившись к умолчанию. */
function ensureBaseDispositions(app){
  const date = app.ds ? app.ds.date : TODAY;
  if(!app.base || !app.base.length) app.base = defaultBase(app, date);
  if(!app.dispositions || !app.dispositions.length) app.dispositions = defaultDispositions(app.base);
}
/* Переключение строки — «включена» ↔ «снята куратором» (issues/02 реш.1). Спорная пеня
   (blockedBy='disputed') не переключаема — мёртвая галка это состояние, а не UI-заглушка
   (ИР-6). Снятие строки убирает её распоряжение (issues/02 реш.4: распоряжение живёт только
   на включённой строке); включение заводит распоряжение kind:'none' на всю сумму — то же
   умолчание, что defaultDispositions даёт при первом расчёте. */
function toggleBaseRow(appId, article, urgency){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  const row = app.base.find(r=>r.article===article && r.urgency===urgency);
  if(!row || row.blockedBy) return;
  row.included = !row.included;
  if(row.included){
    if(!dispositionFor(app.dispositions, article, urgency)) app.dispositions.push({article,urgency,kind:'none',amount:row.amount,periods:allPeriods()});
  } else {
    app.dispositions = app.dispositions.filter(d=>!(d.article===article && d.urgency===urgency));
  }
  app._t=TODAY; render();
}
/* Смена распоряжения на строке (issues/02 реш.4). Значения вне allowedDispositions(app) —
   мёртвые пункты списка с подписью «вид не разрешает», та же механика дохлой галки решения 1
   (issues/02: «а не второй способ говорить то же самое») — сервер-сторона всё равно отбивает
   запрещённое значение молча, а не доверяет disabled-атрибуту разметки. */
function setDisposition(appId, article, urgency, kind){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  if(kind!=='none' && !allowedDispositions(app).has(kind)){ toast('Вид не разрешает это распоряжение','err'); return; }
  const d = dispositionFor(app.dispositions, article, urgency); if(!d) return;
  d.kind = kind;
  if(!dispositionHasPeriods(kind, article)) d.periods = allPeriods();   // сроки живут только там, где есть безставочная сумма (РС-38)
  app._t=TODAY; render();
}
/* Сроки спрашиваются только у распоряжений, рождающих БЕЗСТАВОЧНУЮ сумму (РС-38): распределение
   и капитализация пени. У капитализации процентов сумма вливается в тело и живёт сроками тела,
   у прощения суммы к уплате не остаётся вовсе — спрашивать не о чем. Проверка по состоянию
   распоряжения и статье строки, а не по тексту разметки. */
function dispositionHasPeriods(kind, article){
  if(kind==='spread') return true;
  return kind==='cap' && (article==='penalty' || article==='accPenalty');
}
/* Сумма распоряжения (РС-38): 0 < amount ≤ сумма позиции. Нарушение — тост, НЕ тихая подстановка
   ближайшего допустимого: подставить значение значит выдумать решение куратора. Остаток позиции
   (позиция − amount) уходит в перенос своей статьёй как «без распоряжения», второй сущности не
   заводим. */
function setDispAmount(appId, article, urgency, value){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  const row = app.base.find(r=>r.article===article && r.urgency===urgency); if(!row) return;
  const d = dispositionFor(app.dispositions, article, urgency); if(!d) return;
  const v = round2(Number(String(value).replace(',','.')));
  if(!isFinite(v) || v<=0){ toast('Сумма распоряжения должна быть больше нуля','err'); render(); return; }
  if(v > round2(row.amount)+0.005){ toast('Сумма распоряжения больше суммы позиции ('+fmt(row.amount)+')','err'); render(); return; }
  d.amount = v;
  app._t=TODAY; render();
}
/* Сроки распоряжения (РС-38/РС-40): режим «весь график» либо интервал позиций «с — по».
   Переключение на 'all' СТИРАЕТ интервал, а не прячет его тенью — иначе куратор возвращает
   режим и получает границы, о которых уже забыл. Выход за длину плана здесь не подрезается:
   молчаливая подрезка = выдуманное решение (РС-40), расхождение ловит ИР-15 в validateDS и
   показывает дверь. */
function setDispPeriods(appId, article, urgency, mode, from, to){
  if(!guard('editBase')) return; const app=appById(appId);
  ensureBaseDispositions(app);
  const d = dispositionFor(app.dispositions, article, urgency); if(!d) return;
  if(!dispositionHasPeriods(d.kind, article)){ toast('У этого распоряжения сроков нет — сумма живёт сроками тела либо не подлежит уплате','err'); return; }
  if(mode!=='range'){ d.periods = allPeriods(); app._t=TODAY; render(); return; }
  const prev = (d.periods && d.periods.mode==='range') ? d.periods : {};
  const f = Math.trunc(Number(from!=null && from!=='' ? from : prev.from)) || 1;
  const t = Math.trunc(Number(to!=null && to!=='' ? to : prev.to)) || f;
  if(f<1){ toast('Первая позиция интервала — не меньше 1','err'); render(); return; }
  if(t<f){ toast('Конец интервала раньше начала','err'); render(); return; }
  d.periods = { mode:'range', from:f, to:t };
  app._t=TODAY; render();
}

/* Кандидаты в транш-источник расчёта — открытые транши с положительным остатком по каждому
   кредиту охвата заявки (тикет 07 — честная дыра #3 из Answer тикета 06: выбор транша не был
   вручную сделан, стоял только демо-сидом). Закрытый или обнулённый транш не кандидат — его
   не из чего дальше делить. */
function trancheCandidates(app){
  const list=[];
  (app.creditIds||[]).forEach(cid=>{ const cr=creditById(cid); if(!cr) return;
    (cr.tranches||[]).forEach(t=>{ if(!t.closed && round2(balanceAt(t,TODAY))>0) list.push({cr,t}); });
  });
  return list;
}
function pickTrancheBlock(app){
  const cands=trancheCandidates(app);
  const canEdit=canX('editVersion');
  if(!cands.length) return '<div class="op-empty">Нет открытых траншей с остатком по кредитам охвата — выбирать не из чего.</div>';
  if(!canEdit) return '<div class="op-empty">Транш-источник не выбран. Роль «'+esc(state.role)+'» выбор не делает — только Куратор ОД.</div>';
  const opts=cands.map(({cr,t})=>`<option value="${t.id}">${esc(t.no)} · ${esc(cr.no)} · остаток ${fmt(balanceAt(t,TODAY))}</option>`).join('');
  return `<div class="f2" style="max-width:640px"><div class="field" style="flex:1"><span class="flabel">Транш-источник</span>
    <select id="calctr-${app.id}"><option value="">— выберите транш —</option>${opts}</select></div></div>
    <div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="RS.setCalcTranche('${app.id}', document.getElementById('calctr-${app.id}').value)">Выбрать транш-источник</button></div>`;
}
/* Фиксация транша-источника — заводит app.version черновиком условий кредита, если версии ещё
   нет (draftVersion, issues/05 задача 5). Выбор меняется свободно до ДС: пере-выбор просто
   переставляет calcTranche, версия не трогается повторной инициализацией (issues/01, ADR-0042:
   черновик — исторический объект заявки, не пересоздаётся молча). */
function setCalcTranche(appId, trancheId){
  if(!guard('editVersion')) return;
  if(!trancheId){ toast('Выберите транш','err'); return; }
  const app=appById(appId);
  let found=null;
  (app.creditIds||[]).forEach(cid=>{ if(found) return; const cr=creditById(cid); if(!cr) return;
    const t=(cr.tranches||[]).find(x=>x.id===trancheId); if(t) found={cr,t}; });
  if(!found){ toast('Транш не найден','err'); return; }
  app.calcTranche=found.t;
  if(!app.version) app.version=draftVersion(found.cr,{});
  app._t=TODAY; H(app,'Транш-источник расчёта выбран: '+found.t.no+' (кредит '+found.cr.no+').',state.role);
  toast('Транш-источник выбран','ok'); render();
}
/* Правка параметров черновика ДС (issues/05 задача 5, тикет 07 — та же честная дыра #3).
   Открыта, пока ДС не зарегистрировано: после регистрации app.ds.params — исторический
   реквизит вступившего соглашения, версия дальше не переигрывается (комментарий у coverGate
   про «не моргать» после терминала — то же соображение). */
function setVersionParam(appId, key, val){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  if(app.ds && app.ds.no){ toast('ДС уже зарегистрировано — версия закрыта','err'); return; }
  if(!app.version) app.version=draftVersion(creditById(app.creditIds[0]),{});
  const p=app.version.params;
  if(key==='term') p.term=Number(val)||0;
  else if(key==='rate') p.rate=val===''?null:Number(val);
  else if(key==='schedule') p.schedule=val;
  else if(key==='method') p.method=val;
  app._t=TODAY; render();
}
/* Предварительный расчёт — предпросмотр черновика графика на текущих base/dispositions,
   не пишет ДС (draftSchedule — чистая функция, issues/01 реш.5). Ровно та кнопка, что
   pCalcSched давно анонсировал в своей заглушке как «вне охвата тикета 06». */
function recalcPlan(appId){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  if(!app.calcTranche || !app.version){ toast('Сначала выберите транш-источник','err'); return; }
  const r=run(app, TODAY);
  app.version.plan=draftSchedule(app.calcTranche,{date:TODAY,transferSum:r.transferSum,principalPart:r.principalPart,parts:r.parts,params:app.version.params});
  app._t=TODAY; H(app,'Предварительный расчёт: черновой график пересчитан.',state.role);
  toast('Черновой график пересчитан','ok'); render();
}
/* Форма параметров черновика — term/rate/schedule/method держат amortize (issues/01 реш.5);
   graceBlocks вне охвата (никакая демо-заявка их не требует — пустой честный список, не UI-стаб).
   Закрыта после регистрации ДС: app.ds.params — реквизит вступившего соглашения дальше живёт
   своей жизнью (issues/01, ADR-0042), версия-черновик его больше не переигрывает. */
function versionParamsBlock(app){
  if(!app.version) return '<div class="op-empty">Выберите транш-источник — черновик условий заведётся автоматически.</div>';
  const p=app.version.params;
  const fixed = !!(app.ds && app.ds.no);
  const canEdit = canX('editVersion') && !fixed;
  const dis = canEdit ? '' : 'disabled';
  const lockNote = fixed
    ? '<span class="mode-tag">ДС '+esc(app.ds.no)+' зарегистрировано — версия стала историей, правка закрыта.</span>'
    : (canX('editVersion') ? '' : '<span class="mode-tag">роль «'+esc(state.role)+'» правку не делает — только Куратор ОД.</span>');
  return `<div class="f2" style="max-width:640px">
      <div class="field"><span class="flabel">Срок, мес.</span><input type="number" min="1" value="${p.term!=null?p.term:''}" ${dis} onchange="RS.setVersionParam('${app.id}','term',this.value)"></div>
      <div class="field"><span class="flabel">Ставка, %</span><input type="number" step="0.1" min="0" value="${p.rate!=null?p.rate:''}" ${dis} onchange="RS.setVersionParam('${app.id}','rate',this.value)"></div>
      <div class="field"><span class="flabel">Периодичность</span><select ${dis} onchange="RS.setVersionParam('${app.id}','schedule',this.value)">
        ${['ежемесячно','ежеквартально','раз в полугодие','ежегодно'].map(s=>`<option value="${s}" ${(p.schedule||'ежемесячно')===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="field"><span class="flabel">Метод</span><select ${dis} onchange="RS.setVersionParam('${app.id}','method',this.value)">
        <option value="аннуитет" ${p.method!=='дифференцированный'?'selected':''}>аннуитет</option>
        <option value="дифференцированный" ${p.method==='дифференцированный'?'selected':''}>дифференцированный</option>
      </select></div>
    </div>
    <div style="margin-top:8px">${canEdit?`<button class="btn btn-primary btn-sm" onclick="RS.recalcPlan('${app.id}')">Предварительный расчёт — пересчитать черновой график</button>`:''} ${lockNote}</div>`;
}

/* Порядок конвейера — константа-массив шагов, прогон reduce (issues/02 реш.6, ИР-7 живёт
   здесь). Стек шагов — побочный продукт прогона, не отдельный лог: смоук (задача 8/тикет 08)
   проверяет ИР-7 по индексам PIPELINE как данные, не разбором расчёта построчно. overdue —
   намеренно тонкий шаг: срочность уже впечатана в позицию (issues/01 реш.3), шагу остаётся
   спросить, что осталось непокрытым распоряжением. */
const PIPELINE = [
  function forgive(state){
    let sum=0;
    const base = state.base.map(r=>{
      const carried = r.carried!=null ? r.carried : r.amount;
      if(!r.included) return {...r, carried};
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(d && d.kind==='forgive'){ sum=round2(sum+d.amount); return {...r, carried: round2(carried-d.amount)}; }
      return {...r, carried};
    });
    return { state:{...state, base, forgiven:round2(sum)}, record:{step:'forgive', sum:round2(sum)} };
  },
  /* Капитализация — два разных исхода одной механики (РС-11/РС-27): проценты входят в основной
     долг и ставка на них идёт (процент на процент — обычная механика кредита), пеня выделяется
     ОТДЕЛЬНОЙ СУММОЙ (п. 89 пп. 4), получает сроки уплаты и попадает в график, но с телом не
     сливается и ставку не притягивает — санкция не цена денег. Обе суммы уходят в перенос,
     различие несут два счётчика, а не одно число. */
  function capitalize(state){
    let sum=0, penalty=0, interest=0;
    const parts=(state.parts||[]).slice();
    const base = state.base.map(r=>{
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(r.included && d && d.kind==='cap'){
        sum=round2(sum+d.amount);
        if(r.article==='penalty'||r.article==='accPenalty'){
          penalty=round2(penalty+d.amount);
          // капитализированная пеня — безставочная колонка со своими сроками (ADR-0109): в тело
          // не вливается, ставку не притягивает; колонка её — «накопленная пеня», восьмой статьи
          // не заводим, происхождение несут счётчик и акт.
          parts.push({ article:'accPenalty', amount:d.amount, periods:d.periods||allPeriods(), from:'капитализация пени' });
        } else {
          interest=round2(interest+d.amount);   // проценты вливаются в тело — ставка на них идёт, это обычная механика кредита
        }
        return {...r, carried: round2(r.carried-d.amount)};
      }
      return r;
    });
    return { state:{...state, base, parts, capitalized:round2(sum), capitalizedInterest:interest, capitalizedPenalty:penalty},
             record:{step:'capitalize', sum:round2(sum), interest, penalty} };
  },
  /* Распределение (РС-39) — не сборщик списка для отчёта, а перенос суммы: начисленная статья
     уходит в накопленную (проценты → накопленные проценты, пеня → накопленная пеня), уже
     накопленная строка статьи не меняет и только получает сроки. Режим начисления
     {проценты:нет, пеня:нет} приходит ВМЕСТЕ со статьёй (ACCRUAL_MODES) — второго правила про
     «ставка не идёт» писать не надо. Сумма снимается с carried, поэтому шаг overdue ниже видит
     распределённое как покрытое. */
  function distribute(state){
    const parts=(state.parts||[]).slice();
    let sum=0;
    const base = state.base.map(r=>{
      const d = dispositionFor(state.dispositions, r.article, r.urgency);
      if(r.included && d && d.kind==='spread'){
        const target = r.article==='interest' ? 'accInterest'
                     : r.article==='penalty'  ? 'accPenalty'
                     : r.article;                                   // накопленное статьи не меняет — идемпотентно
        sum=round2(sum+d.amount);
        parts.push({ article:target, amount:d.amount, periods:d.periods||allPeriods(), from:'распределение' });
        return {...r, carried: round2(r.carried-d.amount)};
      }
      return r;
    });
    return { state:{...state, base, parts, spread:parts.filter(p=>p.from==='распределение')},
             record:{step:'distribute', count:parts.filter(p=>p.from==='распределение').length, sum:round2(sum)} };
  },
  /* Просрочка смотрит на CARRIED, а не на вид распоряжения (РС-39): строка просрочена, если после
     всех распоряжений на ней остался непокрытый остаток. Частичное распределение честно оставляет
     заявку просроченной, полное — снимает просрочку. Тоньше и общее прежней проверки по kind. */
  function overdue(state){
    const remainsOverdue = state.base.some(r=> r.included && r.urgency==='over' && round2(r.carried) > 0);
    return { state:{...state, remainsOverdue}, record:{step:'overdue', remainsOverdue} };
  },
  /* Сборка базы (ADR-0109) — перенос остаётся ОДНОЙ суммой, но разложенной по статьям. Колонка
     основного долга = тело + влившиеся капитализированные проценты, она одна ставочная; всё
     прочее — безставочные колонки со сроками: распределённое, капитализированная пеня и остатки
     позиций без распоряжения (каждый своей статьёй). ИР-2 сверяет сумму ВСЕХ колонок с переносом. */
  function assembleBase(state){
    const parts=(state.parts||[]).slice();
    state.base.forEach(r=>{
      if(!r.included || r.article==='principal') return;
      const rest = round2(r.carried);
      if(rest>0) parts.push({ article:r.article, amount:rest, periods:allPeriods(), from:'без распоряжения' });
    });
    const principalPart = round2(state.base.filter(r=>r.article==='principal' && r.included).reduce((s,r)=>s+r.carried,0) + state.capitalizedInterest);
    const transferSum = round2(principalPart + parts.reduce((s,p)=>s+p.amount,0));
    return { state:{...state, parts, principalPart, transferSum},
             record:{step:'assembleBase', transferSum, principalPart, parts:parts.length} };
  }
];
function run(app, date){
  const base0 = (app.base && app.base.length ? app.base : defaultBase(app, date)).map(r=>({...r, carried:r.amount}));
  const dispositions = app.dispositions && app.dispositions.length ? app.dispositions : defaultDispositions(base0);
  const st0 = { app, date, base:base0, dispositions, forgiven:0, capitalized:0, capitalizedInterest:0, capitalizedPenalty:0,
                parts:[], spread:[], remainsOverdue:false, principalPart:0, transferSum:0, stack:[] };
  return PIPELINE.reduce((s, step) => { const {state, record} = step(s); state.stack.push(record); return state; }, st0);
}

/* Расхождение среза и факта — колонка-дельта и ДВЕ СТУПЕНИ порога (РС-26, решение Холдинга от
   10.08.2026 вместо прежнего одиночного мягкого флага). Обе ступени считаются от согласованной
   базы среза и срабатывают по ЛЮБОМУ из двух измерений: процент один защищает мелкие кредиты и
   пропускает крупные — 25 % от 300 тыс. и 25 % от 300 млн одинаковы в проценте и несопоставимы
   по сути. Ступень 1 — виза куратора с письменным обоснованием; ступень 2 — возврат на комитет,
   регистрация ДС заблокирована до новой позиции. Ступень 2 НЕ переподписывает постановление
   Кабмина: акт одобрял вид и параметры, пересматривается позиция комитета Холдинга, на которой
   стоит письмо. Величины — настройка с историей значений, а не норма. Расхождение считается по
   базе целиком, не по статьям: согласовывалась сумма, а не разбивка. */
const DRIFT_TIERS = [
  { level:1, pct:0.10, abs:500000,  need:'виза куратора с письменным обоснованием расхождения' },
  { level:2, pct:0.25, abs:5000000, need:'возврат на комитет; регистрация ДС заблокирована до новой позиции' }
];
function driftTier(delta, cutoffSum){
  const pct = cutoffSum ? Math.abs(delta)/cutoffSum : 0, abs = Math.abs(delta);
  let hit=null;
  DRIFT_TIERS.forEach(t=>{ if(pct>=t.pct || abs>=t.abs) hit=t; });
  return hit;
}
function cutoffDrift(app){
  if(!app.cutoff || !app.cutoff.rows || !app.ds || !app.ds.fact) return null;
  const cutoffSum = round2(app.cutoff.rows.reduce((s,r)=>s+r.amount,0));
  const factSum = round2(app.ds.fact.rows.reduce((s,r)=>s+r.amount,0));
  const delta = round2(factSum-cutoffSum);
  const pct = cutoffSum ? Math.abs(delta)/cutoffSum : 0;
  const tier = driftTier(delta, cutoffSum);
  return { cutoffSum, factSum, delta, pct, tier, level:tier?tier.level:0, material: !!tier };
}
/* Тот же порог ДО регистрации ДС — на предполагаемой дате вступления: ступень 2 жёстко
   блокирует регистрацию, пока комитет не выскажется заново (app.committee.date позже среза). */
function driftGate(app, date){
  if(!app.cutoff || !app.cutoff.rows || !app.calcTranche) return { ok:true, applicable:false };
  const cutoffSum = round2(app.cutoff.rows.reduce((s,r)=>s+r.amount,0));
  const factSum = round2(debtAt(app.calcTranche, date||TODAY).reduce((s,r)=>s+r.amount,0));
  const delta = round2(factSum-cutoffSum);
  const tier = driftTier(delta, cutoffSum);
  const level = tier?tier.level:0;
  const recommitted = !!(app.committee && app.committee.date && app.cutoff.date && app.committee.date > app.cutoff.date);
  return { ok: level<2 || recommitted, applicable:true, level, tier, delta, cutoffSum, factSum, recommitted,
           pct: cutoffSum ? Math.abs(delta)/cutoffSum : 0 };
}
/* Материализация: до отправки письма cutoff держит только дату (двигается свободно, РС-8);
   фиксация письмом и регистрация ДС — единственные два удостоверяющих события (issues/02 реш.2).
   Вызов этих функций из экрана — задачи 6/7 (fixLetter/regDS), здесь только чистые данные. */
function fixCutoff(app, date){
  const tranche = app.calcTranche;
  app.cutoff = { date, rows: tranche ? debtAt(tranche, date) : [], fixedAt: date };
  return app.cutoff;
}
function fixFact(app, date, transferSum){
  if(!app.ds) return null;
  const tranche = app.calcTranche;
  app.ds.fact = { date, rows: tranche ? debtAt(tranche, date) : [], transferSum: round2(transferSum) };
  return app.ds.fact;
}

/* Покрытие строк графика — жадно из одного пула, форма соседа (credit.html:3563-3603) дословно
   по духу: один проход по статьям в порядке очереди (ARTICLES), а не два прохода по четырём
   (issues/02 реш.7). Допущение Д-8 (credit.html:3543-3547) повторяется с той же оговоркой:
   кредит не владеет по слоям, доля берётся пропорционально телу — нетипичные распределения
   куратора разойдутся с выведенным здесь покрытием. Колонки берутся из фактической формы строк
   графика (что реально синтезировал amortize), накопленные колонки не выдумываются. Ссылки в
   repay не хранятся, paid на строке не пишется — второй источник истины рядом с ops лишний. */
function coverageOf(tranche, ver){
  const rows = (ver && ver.rows) || [];
  if(!rows.length) return [];
  const cols = ARTICLES.map(a=>a.key).filter(k => k in rows[0]);
  let pool = round2((tranche.ops||[]).filter(o=>o.kind==='repay').reduce((s,o)=>s+o.amount,0));
  return rows.map(r => {
    const paid={};
    cols.forEach(c=>{
      const take = round2(Math.min(pool, r[c]||0));
      paid[c]=take; pool=round2(pool-take);
    });
    return { n:r.n, date:r.date, paid };
  });
}
const AppSide = { debtAt, defaultBase, defaultDispositions, cutoffDrift, fixCutoff, fixFact, run, coverageOf, PIPELINE };

function seedRestructChain(){
  const cr=creditById('CR-59003'), T1=cr.tranches[0];
  function mkChainApp(id,no,T,date,partial,demoNote){
    const app=baseApp(id,cr.inn,cr.borrower,['N1'],[cr.id],addCalDays(date,-10));
    fillDocs(app); app.analysisStarted=true; app.calcTranche=T; app.initiator='sector';
    app.conclusions=defaultConclusions().map(c=>({...c,visa:true,visaDate:addCalDays(date,-6)}));
    app.committee={fixed:true,position:'одобрено',date:addCalDays(date,-5)};
    app.letterSent={fixed:true,date:addCalDays(date,-3)};
    AppSide.fixCutoff(app, app.letterSent.date);
    if(demoNote){ app._t=app.cutoff.date; H(app,demoNote,'Демо-данные','auto'); }
    app.conclusion={fixed:true,outcome:'возможно',no:'МФ-'+id,date:addCalDays(date,-2)};
    app.zk={fixed:true,no:'ЖК-'+id,date:addCalDays(date,-2)};
    app.resolution={fixed:true,decision:'изм',no:'ПКМ-'+id,date:addCalDays(date,-1)};
    app.version=draftVersion(cr,{term:12});
    const full=round2(CreditSide.balanceAt(T,date));
    const transferSum=partial?round2(full*0.5):full;
    const ds={ no, date, app, sourceTranche:T, credit:cr, transferSum, params:{...app.version.params} };
    const res=CreditSide.restructureApplied(ds);
    if(!res.ok) throw new Error('demo-seed: '+no+' — '+res.reasons.join('; '));
    app.ds={ no, date, transferSum, sourceTrancheId:T.id, params:ds.params, fact:null };
    AppSide.fixFact(app,date,transferSum);
    app.outcome='изм'; app._t=date; H(app,'ДС '+no+' зарегистрировано, перенесено '+fmt(transferSum)+'.','Куратор ОД');
    return { app, tranche:res.tranche };
  }
  const d1=addCalDays(TODAY,-60), d2=addCalDays(TODAY,-30), d3=TODAY;
  const l1=mkChainApp('RS-1005','ДС-59003/3',T1,d1,true);
  const l2=mkChainApp('RS-1006','ДС-59003/4',l1.tranche,d2,false,
    'Контрольная точка §14 «расчёт долга на дату между первой и второй реструктуризацией»: срез этой заявки ('+addCalDays(d2,-3)+') лежит строго между регистрацией ДС-59003/3 ('+d1+') и ДС-59003/4 ('+d2+') — долг на нём посчитан по тому же траншу T2, что реструктуризация #1 произвела, а #2 сейчас закрывает.');
  const l3=mkChainApp('RS-1007','ДС-59003/5',l2.tranche,d3,false);
  return [l1.app,l2.app,l3.app];
}

const WAVE2_STAGE = { возврат:0, анализ:1, комитет:2, письмо:3, заключение:4, проектКМ:5, отказКМ:6, дс:8 };

/* Даты стадий раскладываются шагами регламента от даты регистрации: считать их в таблице руками
   значило бы пятнадцать раз проверять глазами, что письмо позже комитета. Точечные исключения —
   поле dates строки. */
function wave2Dates(s){
  const o=s.dates||{}, reg=s.reg;
  const committee = o.committee || addCalDays(reg,22);
  const letter    = o.letter    || addWorkDays(committee,4);
  const conclusion= o.conclusion|| addCalDays(letter,45);
  const zk        = o.zk        || addCalDays(conclusion,12);
  const resolution= o.resolution|| addCalDays(zk,10);
  return { analysis:o.analysis||addCalDays(reg,3), visa1:o.visa1||addCalDays(reg,14), visa2:o.visa2||addCalDays(reg,16),
           committee, letter, conclusion, zk, resolution, ds:o.ds||addCalDays(resolution,7), ret:o.ret||addCalDays(reg,2) };
}
const wave2Kinds = s => s.kinds.map(id=>(kindById(id)||{}).name).filter(Boolean).join(' + ');
/* Распоряжения строки таблицы кладутся поверх умолчания (kind:'none' на всю сумму позиции), а не
   вместо него: статью, которой в базе среза не оказалось (спорная пеня, нулевая позиция), спека
   не выдумывает — распоряжение живёт только на включённой строке (issues/02 реш.4). */
/* Ключ спецификации — 'статья' (просроченное, умолчание) либо 'статья@срочность'. Распоряжение
   живёт на ПАРЕ (статья, срочность), и после появления накопленного хвоста (accTail) одной статьи
   стало мало: у 'accInterest' в базе две строки, и распоряжения у них разные. Голый ключ читается
   как '@over' намеренно — им писаны все прежние строки WAVE2, и переписывать их незачем. */
function applyDisp(list, spec){
  if(!spec) return list;
  return list.map(d=>{
    const s = spec[d.article+'@'+d.urgency] || (d.urgency==='over' ? spec[d.article] : null);
    if(!s) return d;
    const out={...d, kind:s.kind};
    if(s.amount!=null) out.amount=round2(s.amount);
    if(s.from!=null)   out.periods={mode:'range', from:s.from, to:s.to};
    return out;
  });
}
function buildWave2(){ return WAVE2.map(s=>buildWave2App(s)); }
function buildWave2App(s){
  const target=WAVE2_STAGE[s.stage], cr=creditById(s.credits[0]), d=wave2Dates(s), n=Number(String(s.id).slice(3));
  const app=baseApp(s.id, s.inn||cr.inn, s.borrower||cr.borrower, s.kinds, s.credits, s.reg);
  app.initiator=s.initiator||'sector';
  if(app.initiator==='omsu') app.initiatorViaEnvoy=true;
  app._t=s.reg; H(app,'Заявка зарегистрирована. Виды: '+wave2Kinds(s)+'.','Куратор ОД');

  if(s.stage==='возврат'){                                    // исход на первой стадии — дальше ничего не заводится
    fillDocs(app); (s.missing||[]).forEach(doc=>{ delete app.packetDocs[doc]; });
    app.outcome='возврат';
    app._t=d.ret; H(app,'Пакет неполон: '+s.why+'. Исход: возвращена без рассмотрения.','Куратор ОД');
    return app;
  }

  fillDocs(app); app.analysisStarted=true; app.calcTranche=cr.tranches[0];
  app.conclusions=defaultConclusions();
  app._t=d.analysis; H(app,'Пакет укомплектован → «Анализ». Дедлайн 30 к.д. (до '+addCalDays(s.reg,30)+').','Куратор ОД');
  if(s.params) app.version=draftVersion(cr,s.params);
  if(s.waiver) app.waiver={granted:true, reason:s.waiver.reason, date:s.waiver.date};

  if(target>=2){
    const pos=s.position||'целесообразно';
    app.conclusions[0].text='Финансовое положение восстановимо, поддержать.'; app.conclusions[0].visa=true; app.conclusions[0].visaDate=d.visa1;
    app.conclusions[1].text='Правовых препятствий нет.'; app.conclusions[1].visa=true; app.conclusions[1].visaDate=d.visa2;
    app._t=d.visa2; H(app,'Заключения СРМиК и ДПО завизированы.','Заключанты');
    app.committee={fixed:true, position:pos, date:d.committee};
    app._t=d.committee; H(app,'Позиция комитета: '+pos+'. Дедлайн письма 5 р.д.','Секретарь комитета');
  }
  if(target>=3){
    app.letterSent={fixed:true, date:d.letter};
    AppSide.fixCutoff(app, d.letter);
    app._t=d.letter; H(app,'Письмо в уполномоченный орган направлено. Срез зафиксирован на дату письма.','Куратор ОД','auto');
  } else {
    app.cutoff={date:TODAY, rows:null, fixedAt:null};          // до письма срез держит только дату (РС-8)
  }

  // финансовое ядро материализуется там, где заявка его уже трогала: у заявки с ДС — на дату ДС,
  // у активной — на сегодня (иначе правка куратора откатилась бы к умолчанию, issues/02 реш.4)
  if(s.disp || s.include || s.plan || (target>=8 && s.mode==='ядро')){
    const at = target>=8 ? d.ds : TODAY;
    app.base=AppSide.defaultBase(app, at);
    // include — та же галка куратора, что в двери (РС-7): по умолчанию в базу входит только
    // просроченное, ненаступившее включается ЯВНО. Заблокированную строку (спорная пеня, ИР-6)
    // не трогаем: демо-сев не вправе обходить гейт, который в UI мёртв.
    (s.include||[]).forEach(k=>{
      const [article, urgency] = k.split('@');
      const r = app.base.find(x=>x.article===article && x.urgency===(urgency||'cur'));
      if(r && !r.blockedBy) r.included=true;
    });
    app.dispositions=applyDisp(AppSide.defaultDispositions(app.base), s.disp);
  }
  if(s.plan){
    const r=AppSide.run(app, TODAY);
    app.version=app.version||draftVersion(cr,{});
    app.version.plan=CreditSide.draftSchedule(app.calcTranche,
      {date:TODAY, transferSum:r.transferSum, principalPart:r.principalPart, parts:r.parts, params:app.version.params});
  }

  if(target>=4){
    app.conclusion={fixed:true, outcome:'возможно', no:'МФ-исх-'+(n+400), date:d.conclusion};
    app._t=d.conclusion; H(app,'Заключение уполномоченного органа: возможно изменение условий ('+app.conclusion.no+' от '+d.conclusion+').','Куратор ОД');
  }
  if(target>=5){
    app.zk={fixed:true, no:'ЖК-К/БФ-'+(n-700), date:d.zk};
    app._t=d.zk; H(app,'Профильный комитет ЖК согласовал проект решения ('+app.zk.no+', п. 82).','Куратор ОД');
  }
  if(target>=6){
    const decision = s.stage==='отказКМ' ? 'отказ' : 'изм';
    app.resolution={fixed:true, decision, no:'ПКМ КР № '+(n-600), date:d.resolution,
                    forgiveSum: s.forgiveSum!=null ? s.forgiveSum : null, forgiveBasis: s.forgiveBasis||null};
    app._t=d.resolution; H(app,'Постановление Кабинета Министров '+app.resolution.no+' от '+d.resolution+': '
      +(decision==='отказ' ? 'в изменении условий отказано (п. 89)' : 'изменённые условия')+'.','Куратор ОД');
    if(decision==='отказ') app.outcome='отказ';
  }

  if(target>=8){
    const T=app.calcTranche;
    app.version=app.version||draftVersion(cr,{});
    let ds;
    if(s.mode==='целиком'){
      ds={ no:s.dsNo, date:d.ds, app, sourceTranche:T, credit:cr,
           transferSum:round2(CreditSide.balanceAt(T,d.ds)), params:{...app.version.params} };
    } else {
      const r=AppSide.run(app, d.ds);
      ds={ no:s.dsNo, date:d.ds, app, sourceTranche:T, credit:cr, transferSum:r.transferSum,
           principalPart:r.principalPart, parts:r.parts, params:{...app.version.params} };
    }
    const res=CreditSide.restructureApplied(ds);
    if(!res.ok) throw new Error('demo-seed: '+s.id+' — '+res.reasons.join('; '));
    app.ds={ no:ds.no, date:ds.date, transferSum:ds.transferSum, sourceTrancheId:T.id, params:ds.params, fact:null };
    AppSide.fixFact(app, ds.date, ds.transferSum);
    app.outcome='изм';
    app._t=ds.date; H(app,'Доп. соглашение '+ds.no+' зарегистрировано, перенесено '+fmt(ds.transferSum)+'.','Куратор ОД');
  }
  if(s.demoNote){ H(app, s.demoNote, 'Демо-данные', 'auto'); }
  return app;
}
