}

/* 3. Параметры (issues/05, вариант B) — пять статей (ADR-0110), два датированных числа, условия черновика.
   Гейты Пределы/Согласия подключены (тикет 07): норма-справочник (limitsGate) и зеркало GUARANTEES
   (consentGate) — оба жёсткие, без waiver. Флажки/распоряжения — read-only показ по умолчанию
   (issues/02 задал состав, интерактивная правка куратором — тикет 07, issues/05 просит только
   раскладку). */
function gateChipsRow(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app), dga=appDriftGate(app);
  return `${lga.pending?'<span class="pill neutral">Пределы — расчёт не выбран</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы ${lga.ok?'OK':'блок'}</span>`}
    <span class="gatechip ${coa.ok?'ok':'no'}">Согласия ${coa.ok?'OK':'блок'}</span>
    <span class="gatechip ${cga.ok?'ok':'no'}">Покрытие ${cga.ok?'OK':'блок (мягкий)'}</span>
    ${dga.applicable?`<span class="gatechip ${dga.ok?'ok':'no'}">Расхождение ${dga.ok?'OK':'блок'}</span>`
                    :'<span class="pill neutral">Расхождение — срез не зафиксирован</span>'}`;
}
function appDriftGate(app){ return driftGate(app, app.ds?app.ds.date:TODAY); }
function coverBody(app){
  const cga=coverGateApp(app);
  const rows=cga.rows.map(({cr,g})=>`<div class="mrow"><span>${cr.no}</span><span>${g.cover}% из требуемых ${g.required}% (${esc(g.source||'Залог')}, снимок ${esc(g.snapshotDate||'—')}${g.stale?` <span class="pill high" title="Снимок старше ${COVER_SNAPSHOT_STALE_DAYS} к.д. — данные модуля залога могли устареть">устарел</span>`:''})${g.coverOk?'':' — недостаточно'}</span></div>`).join('') || '<div class="mrow"><span>—</span><span>кредиты не выбраны</span></div>';
  return `<div class="mirror">${rows}</div>` + (cga.ok?'':`<div class="warnline">Недостаточно покрытия по одному или нескольким кредитам — мягкий гейт, снимается решением комитета по администрированию бюджетных кредитов (вкладка «Оформление»).</div>`);
}
/* Пол ставки — ДВА порога, применяется больший (п. 92 + п. 34, ADR-0099 §2): 50 % от
   первоначальной ставки и минимум по виду проекта. Вид не указан либо ставка внешняя ⇒ второй
   пол не вычисляется, гейт работает по первому и говорит об этом вслух — молчаливое «пройдено»
   на непроверенном условии хуже флага. */
function limitsBody(app){
  const lga=limitsGateApp(app);
  if(!lga.rows.length) return `<div class="op-empty">${esc(lga.messages[0]||'Кредит не выбран')}</div>`;
  return lga.rows.flatMap(({creditNo,g})=>{
    const head = lga.rows.length>1 ? `<div class="mrow"><span><b>${esc(creditNo)}</b></span><span></span></div>` : '';
    const pfx = lga.rows.length>1 ? esc(creditNo)+': ' : '';
    if(g.pending) return [head, `<div class="op-empty">${pfx}${esc(g.messages[0])}</div>`];
    const projLine = g.projectUnchecked
      ? `<div class="mrow"><span>Минимум по виду проекта</span><span><b>не проверен</b> — ${g.projectRow?'ставка внешняя ('+esc(g.projectRow.label)+'), машинно не вычисляется':'вид проекта у кредита не указан'} (${esc(normNote(g.projRec))})</span></div>`
      : `<div class="mrow"><span>Минимум по виду проекта</span><span>${g.projFloor}% — ${esc((g.projectRow||{}).label||'')} (${esc(normNote(g.projRec))})</span></div>`;
    return [head,
      `<div class="mrow"><span>Срок</span><span>предел ${g.cap} мес. от остатка задолженности (${esc(normNote(g.capRec))})${g.termOk?'':' — превышен'}</span></div>`,
      `<div class="mrow"><span>50 % от первоначальной ставки</span><span>${g.half}% (${esc(normNote(g.floorRec))})</span></div>`,
      projLine,
      `<div class="mrow"><span>Действующий пол ставки</span><span><b>${g.floor}%</b> — больший из двух${g.rateOk?'':' · ставка ниже минимума'}</span></div>`,
      g.ok?'':`<div class="warnline">${g.messages.map(esc).join('<br>')} — жёсткий гейт, без waiver.</div>`
    ];
  }).join('');
}
function consentBody(app){
  const coa=consentGateApp(app);
  const rows=coa.rows.flatMap(({cr,g})=>g.list.map(x=>`<div class="mrow"><span>${cr.no} · ${esc(x.name)}</span><span>${esc(x.status)} (${x.date})</span></div>`));
  return `<div class="mirror">${rows.join('')||'<div class="mrow"><span>—</span><span>обеспечителей нет</span></div>'}</div>`
    + (coa.ok?'':`<div class="warnline">Не согласовано: ${coa.pending.map(esc).join(', ')} — жёсткий гейт, без waiver.</div>`);
}
/* Расхождение — такой же упор перед регистрацией ДС, как пределы и согласия, и носитель у него
   тот же чип. Но причина его лежит не в чужом модуле, а прямо в колонках «срез · факт»: строки
   разбора адресуются расчётом, а ступень 2 меряется суммой по заявке (спека §5). */
function driftBody(app){
  const dga=appDriftGate(app);
  if(!dga.applicable) return '<div class="op-empty">Срез не зафиксирован — расхождению не с чем считаться</div>';
  const rows=dga.rows.map(r=>{
    const t=(DRIFT_TIERS.filter(x=>r.level>=x.level).pop()||null);
    return `<div class="mrow"><span>${esc(r.creditNo)}</span><span>срез ${fmt(r.cutoffSum)} → факт ${fmt(r.factSum)} · ${
      (r.delta>=0?'+':'')+fmt(r.delta)} (${(r.pct*100).toFixed(1)} %)${t?' — ступень '+t.level:' — ступени не задеты'}</span></div>`;
  }).join('');
  return `<div class="mirror">${rows}</div>`
    + `<div class="mrow"><span><b>По заявке</b></span><span>${(dga.delta>=0?'+':'')+fmt(dga.delta)} (${(dga.pct*100).toFixed(1)} %) — ступень ${dga.level||'не задета'}</span></div>`
    + (dga.ok ? (dga.recommitted?'<div class="okline">Комитет пересобрался после даты среза — ступень 2 снята его новой позицией.</div>':'')
              : `<div class="warnline">${DRIFT_TIERS[1].need} — жёсткий гейт, снимается новой позицией комитета.</div>`);
}
function gateDetails(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app), dga=appDriftGate(app);
  return `
  <details class="gate-d"><summary>${lga.pending?'<span class="pill neutral">Пределы</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы</span>`} жёсткий, норма-справочник</summary><div class="gate-body">${limitsBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${coa.ok?'ok':'no'}">Согласия</span> жёсткий, ответ Обеспечения</summary><div class="gate-body">${consentBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${cga.ok?'ok':'no'}">Покрытие</span> мягкий, ответ Залога</summary><div class="gate-body">${coverBody(app)}</div></details>
  <details class="gate-d"><summary>${dga.applicable?`<span class="gatechip ${dga.ok?'ok':'no'}">Расхождение</span>`:'<span class="pill neutral">Расхождение</span>'} жёсткий, ступень 2 — возврат на комитет</summary><div class="gate-body">${driftBody(app)}</div></details>`;
}
/* Разбор гейтов живёт под шапкой карточки, а не в хвосте вкладок расчёта: гейт — условие
   регистрации ДС, общее для всей заявки, и раньше он печатался тремя копиями (в каждой секции
   расчёта «Базы» и ещё раз на «Графике»). Раскрывается кликом по чипам, один раз на заявку. */
function gatesPanel(app,st){
  if(st.idx<1 || !(app.creditIds||[]).length || !state.gatesOpen) return '';
  return `<div class="panel-wrap"><div class="gates-panel">
    <div class="section-h" style="margin-top:0">Гейты оформления — разбор
      <span class="cnt" onclick="RS.toggleGates()" style="cursor:pointer">свернуть ▴</span></div>
    ${gateDetails(app)}</div></div>`;
}
/* производный транш по итогам ДС — единственный признак связи назад к door: ops[0].basis. */
function resultTrancheOf(app, calcId){
  const calc=requireCalc(app, calcId); if(!calc || !calc.dsRef) return null;
  const credit=creditById(calc.creditId); if(!credit) return null;
  return credit.tranches.find(t=>{ const b=(t.ops[0]||{}).basis;
    return b && b.ds===calc.dsRef && b.from===calc.trancheId; }) || null;
}
function resultTranche(app){ return resultTrancheOf(app, null); }   // однорасчётная дверь
function rowsTotal(rows){ return round2((rows||[]).reduce((s,r)=>s+r.amount,0)); }

/* Дверь распоряжения (РС-38) — раскрытая строка под самой позицией, не модалка: вид уже
   выбирается селектом в строке, сумма и сроки — его продолжение. Линий на позиции бывает
   несколько (РС-43), и тогда дверей столько же: каждая подписана своим видом, а свободный
   остаток называется один раз, под последней — он общий на позицию, а не свойство линии.
   Сроки показываются только у распоряжений, рождающих БЕЗСТАВОЧНУЮ сумму, и у остальных это
   сказано подписью, а не пустотой. Расхождение интервала с длиной плана (ИР-15) горит здесь же
   и повторяется причиной в панели гейтов — молчаливой подрезки нет (РС-40). */
function dispDoorRow(app, row, d, canEdit, planLen, calc, opts){
  if(!row.included || !d || d.kind==='none') return '';
  const o = opts||{};
  const dis = canEdit ? '' : 'disabled';
  const seq = Number(d.seq||1);
  const A=`'${app.id}','${row.article}','${row.urgency}'`;
  // Адрес строки — тройка (транш, статья, срочность); номер линии (seq) идёт ПОСЛЕДНИМ
  // аргументом, за calcId: сеттеры несут между тройкой и calcId собственные позиционные поля
  // (сумма; режим/от/до), и вставить номер в середину значило бы сдвинуть их в чужие слоты.
  const CS=`'${calc.id}',${seq}`;
  const hasPer = dispositionHasPeriods(d.kind, row.article);
  const per = d.periods || allPeriods();
  const isRange = per.mode==='range';
  let periodsBlock;
  if(!hasPer){
    periodsBlock = `<span class="mode-tag">сроков нет</span>`;
  } else {
    const rname = `per-${app.id}-${row.article}-${row.urgency}-${calc.id}-${seq}`;   // своя группа радио у каждой линии
    periodsBlock = `<div class="dd-grp"><span class="flabel">Сроки</span>
        <label class="chk"><input type="radio" name="${rname}" ${isRange?'':'checked'} ${dis}
          onchange="RS.setDispPeriods(${A},'all',null,null,${CS})"><span class="lbl">весь график</span></label>
        <label class="chk"><input type="radio" name="${rname}" ${isRange?'checked':''} ${dis}
          onchange="RS.setDispPeriods(${A},'range',null,null,${CS})"><span class="lbl">интервал позиций</span></label>
      </div>`
      + (isRange ? `<div class="dd-grp"><span class="flabel">с</span>
        <input class="dd-pos" type="number" min="1" step="1" value="${per.from}" ${dis} onchange="RS.setDispPeriods(${A},'range',this.value,null,${CS})">
        <span class="flabel">по</span>
        <input class="dd-pos" type="number" min="1" step="1" value="${per.to}" ${dis} onchange="RS.setDispPeriods(${A},'range',null,this.value,${CS})">
      </div>` : '');
  }
  // ИР-15 — сверяется с ЧЕРНОВИКОМ графика; пока его нет, шкалы позиций тоже нет, и это говорится.
  // «черновика нет» — свойство РАСЧЁТА, одно на все линии позиции: печатает его первая дверь с
  // интервалом (o.noPlanPill), иначе у поделённой позиции одна и та же фраза стояла бы трижды.
  // Само расхождение ИР-15 остаётся у КАЖДОЙ двери: интервалы у линий разные, и виновата своя.
  let mismatch='';
  if(hasPer && isRange){
    if(planLen==null) mismatch = o.noPlanPill===false ? '' : `<span class="pill neutral">черновой график ещё не рассчитан — длину интервала не с чем сверить</span>`;
    else if(per.to>planLen || per.from<1 || per.from>per.to)
      mismatch = `<span class="pill high">сроки ${per.from}–${per.to}, а в графике ${planLen} ${planLen===1?'позиция':'позиций'} — регистрация ДС закрыта (ИР-15)</span>`;
  }
  const cap = o.cap!=null ? o.cap : round2(row.amount);
  const rest = o.rest!=null ? o.rest : null;              // свободный остаток печатает только последняя дверь позиции
  return `<tr class="disp-door"><td colspan="5"><div class="dd-wrap">
      ${o.label ? `<span class="dd-kind">${DISP_LABEL[d.kind]||d.kind}</span>` : ''}
      <div class="dd-grp"><span class="flabel">Сумма</span>
        <input type="number" min="0" step="0.01" value="${d.amount!=null?d.amount:''}" ${dis} onchange="RS.setDispAmount(${A},this.value,${CS})">
        <span class="mode-tag">≤ ${fmt(cap)}</span></div>
      ${periodsBlock}
      ${mismatch}
      ${rest!=null && rest>0.005 ? `<div class="dd-note">без распоряжения остаётся ${fmt2(rest)} — уйдёт в перенос просроченным</div>` : ''}
    </div></td></tr>`;
}
const SCOPE_EMPTY = 'Охват пуст — добавьте транш, и расчёт заведётся автоматически.';
function pParams(app){
  /* Все параметры изменения — здесь, единственным столом ввода: что переносим (статьи и
     распоряжения) и на каких условиях (срок, ставка, периодичность, метод). Условия стояли на
     соседней вкладке рядом с их же исходом, и ввод жил в двух местах — куратор ходил туда-сюда,
     хотя ставка и срок считаются ОТ базы переноса (пределы пп. 34, 90, 92), то есть от таблицы,
     которая тут же перед глазами. На экране ОДИН расчёт, выбранный полосой охвата сверху. */
  const calc = curCalcOf(app);
  return `<div class="detail-panel active">` + scopeStrip(app, calc)
       + (calc ? driftLine(app, calc) + paramsSection(app, calc) + dispositionsBar(app, calc)
               : `<div class="op-empty">${SCOPE_EMPTY}</div>`)
       + `</div>`;
}
/* ПОЛОСА ОХВАТА — она же выбор расчёта, и другого места, где охват меняют, в макете нет.
   Рисуется ВСЕГДА, в том числе на однорасчётной заявке: полоса — единственная дверь к «добавить
   транш» и «снять», и прятать её при одном расчёте значит прятать сам охват. Строки берутся у
   scopeTranches (модель охвата — app.calcs), а не у производного creditIds.
   Скрининг стоит на строке: просрочка, чужая активная заявка (ИР-1), зеркало взыскания, счётчик
   прежних реструктуризаций. Прежде он жил таблицей на своей вкладке — рядом с тем же списком,
   напечатанным второй раз. Сводка по заявке (остаток, Σ просрочки) остаётся плиткой шапки. */
/* `ro` — полоса как ЧИСТЫЙ ПЕРЕКЛЮЧАТЕЛЬ (РС-46). Охват ведут на «Параметрах»: там крестик,
   там «+ Добавить транш», там чипы просрочки, занятости и прошлых реструктуризаций. На
   «Результате расчёта» те же кнопки означали бы, что вкладка-показ правит охват; остаётся ровно
   то, чем выбирают расчёт, — имя транша, база переноса и судьба. */
function scopeStrip(app, calc, ro){
  const st=stageOf(app);
  const rows=scopeTranches(app).map(({cr,t,calc:c})=>{
    const fate = c.dsRef ? `<span class="pill ok">${esc(c.dsRef)}</span>`
               : c.excluded ? `<span class="pill mid" title="${esc(c.excluded.reason)}">снят с оформления</span>`
               : `<span class="pill neutral">не оформлено</span>`;
    const busy = activeAppOnTranche(c.trancheId, app.id);
    const chips=[fate];
    if(!ro){
      if(cr.odSum>0) chips.push(`<span class="pill high" title="просрочка по кредиту ${esc(cr.no)}">просрочка ${cr.odDays} дн. · ${fmt(cr.odSum)}</span>`);
      if(busy) chips.push(`<span class="pill high" title="транш в другой активной заявке (ИР-1)">${esc(busy.id)}</span>`);
      if(cr.collProc) chips.push(`<span class="rowlink" title="мини-зеркало взыскания"
        onclick="event.stopPropagation();RS.showMirror('${cr.collProc}','${app.id}')">взыскание ${esc(cr.collProc)}</span>`);
      if(cr.restructCount) chips.push(`<span class="mode-tag" title="реструктуризаций по кредиту ранее">ранее: ${cr.restructCount}</span>`);
      // Снятие уносит расчёт вместе с суммами (правило 60) — потому через подтверждение, а не
      // одним кликом рядом со столом ввода. Зарегистрированное ДС снятие запрещает (РС-42).
      if(!st.closed && !c.dsRef) chips.push(`<button class="sp-drop" title="Вывести транш из охвата"
        onclick="event.stopPropagation();RS.openDropTranche('${app.id}','${c.id}')">✕</button>`);
    }
    const sel = calc && c.id===calc.id;
    const lone = (app.calcs||[]).length<2;
    return `<div class="spick${sel?' active':''}${lone?' lone':''}" ${lone?'':`onclick="RS.setCalc('${c.id}')"`}>
      <span class="cp-t">${esc(t.no)} · ${esc(cr.no)}</span>
      <span class="cp-n">база переноса ${fmt(rowsTotal(calcBaseOf(app, c).filter(x=>x.included)))}</span>
      <span class="cp-f">${chips.join('')}</span></div>`;
  }).join('');
  const addBtn = (st.closed || ro) ? ''
    : `<button class="spick-add" onclick="RS.openAddTranche('${app.id}')">+ Добавить транш</button>`;
  const empty = rows ? '' : `<span class="sp-empty">Охват пуст</span>`;
  return `<div class="scope-strip">${rows}${empty}${addBtn}</div>`;
}
/* Расхождение — жёсткий упор, и статус его виден чипом в шапке на всех вкладках. Но причина
   лежит здесь, в колонках «Срез» и «Факт», и гнать за ней куратора в раскрытие чипа значит
   прятать число, которое стоит у него перед глазами. Ступень 1 меряется расчётом, ступень 2 —
   суммой по заявке и блокирует регистрацию всех расчётов (спека §5, РС-26). */
function driftLine(app, calc){
  const dga=appDriftGate(app);
  if(!dga.applicable || !calc) return '';
  const pct = d => (d.pct*100).toFixed(1).replace(/\.0$/,'')+' %';
  const sgn = d => (d.delta>=0?'+':'')+fmt(d.delta);
  if(!dga.ok)
    return `<div class="flagline">Расхождение по заявке ${sgn(dga)} (${pct(dga)} от среза) — ступень 2: ${DRIFT_TIERS[1].need} (РС-26).</div>`;
  if(dga.level>=2 && dga.recommitted)
    return `<div class="okline">Расхождение по заявке ${sgn(dga)} (${pct(dga)}) взято ступенью 2, но комитет пересобрался после даты среза — регистрация открыта.</div>`;
  // У расчёта с зарегистрированным ДС ступень 1 — история, а не работа: виза требовалась ДО
  // регистрации, и требовать её задним числом значит выдавать прошлое за незакрытое дело.
  // Числа при этом остаются в колонках «Срез» и «Факт» — там их и читают.
  if(calc.dsRef) return '';
  const d=calcDrift(app, calc.id);
  if(d && d.level>=1)
    return `<div class="warnline">Расхождение по расчёту ${sgn(d)} (${pct(d)} от среза) — ступень 1: ${DRIFT_TIERS[0].need}. Регистрацию не блокирует.</div>`;
  return '';
}
/* Липкая полоса результата: следствие правки стоит рядом с причиной. Куратор снимает галку в
   верхней части десятистрочной таблицы, и число меняется у него перед глазами, а не под
   таблицей, за краем экрана. Прощение и капитализации показываются только ненулевыми — нули
   рассказывают про механику, которой в этой заявке не было.
   «Итог по заявке» — единственное место экрана, где суммы складываются через расчёты, и оно
   свёрнуто и подписано: такой суммы нет ни в одном акте, у каждого расчёта своё ДС. */
function dispositionsBar(app, calc){
  if(!calc) return '';
  const r=run(app, app.ds?app.ds.date:TODAY, calc.id);
  const parts=[['Прощено',r.forgiven],['Кап. процентов',r.capitalizedInterest],['Кап. пени',r.capitalizedPenalty]]
    .filter(([,v])=>round2(v)>0)
    .concat([['Тело переноса',r.principalPart],['Перенос, всего',r.transferSum]]);
  const cells=parts.map(([l,v],i)=>`<span class="rb-i${i===parts.length-1?' main':''}"><span class="rb-l">${l}</span><span class="rb-v">${fmt(v)}</span></span>`).join('');
  let whole='';
  if((app.calcs||[]).length>1){
    const rows=app.calcs.map(c=>({c, r:run(app, app.ds?app.ds.date:TODAY, c.id)}));
    const sum=round2(rows.reduce((s,x)=>s+(x.r?x.r.transferSum:0),0));
    whole=`<details class="rb-app"><summary>Итог по заявке · перенос ${fmt(sum)}</summary><div class="mirror">${
      rows.map(({c,r:rr})=>{
        const t=calcTrancheOf(c), cr=creditById(c.creditId);
        return `<div class="mrow"><span>${esc(t?t.no:'—')} · ${esc(cr?cr.no:'—')}</span><span>база переноса ${
          fmt(rowsTotal(calcBaseOf(app, c).filter(x=>x.included)))} · перенос ${fmt(rr?rr.transferSum:0)}${
          c.dsRef?' · '+esc(c.dsRef):(c.excluded?' · снят с оформления':' · не оформлено')}</span></div>`;
      }).join('')}</div></details>`;
  }
  return `<div class="result-bar"><span class="rb-t">Итог распоряжений</span>${cells}${whole}</div>`;
}
/* Таблица расчёта. Срез и факт — ОДНА И ТА ЖЕ разбивка по статьям на двух датах (debtAt на дату
   письма и на дату вступления ДС), и потому они стоят соседними колонками одной строки, а не
   двумя плитками-итогами над таблицей: вопрос «чем набежало между письмом и ДС» имеет ответ в
   данных, и колонки дают его без единого клика.
   Наборы строк на двух датах НЕ совпадают: тело мигрирует из текущего в просроченное, статья
   может родиться после среза либо погаситься к дате факта. Такие клетки несут прочерк с
   подписью, а не ноль — ноль читается как «было и погасили».
   Слово «база» здесь занято ровно одним смыслом — сумма ВКЛЮЧЁННЫХ строк («база переноса»,
   подытог справа). Весь список строк зовётся долгом расчёта, свойство статьи — «начисляется». */
function paramsSection(app, calc){
  if(!calc) return '';
  const src=calcTrancheOf(calc);
  const cut=calcCutoffOf(app, calc);
  const cutRows = cut && cut.rows ? cut.rows : null;
  const cutAt = (article,urgency) => {
    if(!cutRows) return null;
    const x=cutRows.find(y=>y.article===article && y.urgency===urgency);
    return x ? x.amount : null;
  };
  const base = calcBaseOf(app, calc);
  const dispositions = calc.dispositions && calc.dispositions.length ? calc.dispositions : defaultDispositions(base);
  const ordered=[...base].sort((a,b)=>{
    const ia=ARTICLES.findIndex(x=>x.key===a.article), ib=ARTICLES.findIndex(x=>x.key===b.article);
    return ia!==ib ? ia-ib : (a.urgency==='over'?-1:1)-(b.urgency==='over'?-1:1);
  });
  const canEdit = canX('editBase');
  const allowed = allowedDispositions(app);
  const factDate = calc.fact ? calc.fact.date : TODAY;
  /* Колонка несёт долг расчёта НА дату вступления — тот, из которого ДС и собиралось, ДО переноса.
     Модуль знает и второе число под тем же словом: calc.fact/driftGate снимают остаток транша-
     источника ПОСЛЕ применения ДС (дефект макета КЛ-2, статус разработки; смоук #13 несёт это
     число как есть: 4 082 000 = 4 200 000 − перенос 118 000), и печатает его «Оформление»
     строкой «Долг на дату вступления». Пока КЛ-2 жив, соседние вкладки показывают под словом
     «факт» разные суммы, и колонка говорит вслух, какая из двух здесь: молчание в этом месте
     читается как расхождение в цифрах, а починка КЛ-2 — работа модели, не раскладки. */
  const factNote = calc.dsRef ? '<span title="Остаток транша-источника после переноса — другое число, его печатает «Оформление» (дефект макета КЛ-2)">до переноса</span>'
                 : calc.fact  ? '' : 'предпросмотр';
  // Длина черновика графика — та самая шкала, в позициях которой куратор задаёт сроки (РС-38).
  // Пока расчёт не проведён, шкалы нет, и об этом говорится вслух, а не подставляется срок/12.
  const planLen = (calc.version && calc.version.plan && calc.version.plan.rows) ? calc.version.plan.rows.length : null;
  const dash = why => `<span class="dash" title="${esc(why)}">—</span>`;

  const rows = ordered.map(r=>{
    const lines=dispositionsFor(dispositions,r.article,r.urgency);
    const urg=(URG.find(u=>u.key===r.urgency)||{}).name||r.urgency;
    const dead = r.blockedBy==='disputed';
    const A=`'${app.id}','${r.article}','${r.urgency}'`;
    const AC=`${A},'${calc.id}'`;   // адрес строки — тройка (транш, статья, срочность) плюс расчёт
    /* Начисление на статью (РС-27/ADR-0106) — свойство самой статьи из справочника, одинаковое
       во всех заявках: ему место подписью у названия, а не отдельным столбцом на десять строк.
       У терминальных статей оно пусто, и это сказано вслух: молча пустое читается как недоделка. */
    const am=accrualModeOf(r.article, app.ds?app.ds.date:TODAY);
    const accrOn=[]; if(am.mode.interest) accrOn.push('проценты'); if(am.mode.penalty) accrOn.push('пеня');
    const accr = accrOn.length ? 'начисляется: '+accrOn.join(' + ') : 'начислений нет';
    const cs = cutAt(r.article, r.urgency);
    const srezCell = !cutRows ? dash('срез не зафиксирован')
                   : cs==null ? dash('на дату среза этой строки не было')
                   : fmt(cs);
    // Подписывается только ДВИЖЕНИЕ. «Без изменений» стояло на большинстве строк и говорило то,
    // что уже сказано двумя равными числами по соседству, — подпись обязана нести новое.
    let deltaSub='';
    if(cutRows){
      if(cs==null) deltaSub=`<div class="a-s">появилась после среза</div>`;
      else {
        const dv=round2(r.amount-cs);
        if(Math.abs(dv)>=0.005) deltaSub=`<div class="a-s${dv>0?' up':''}">${(dv>0?'+':'')+fmt(dv)} с ${cut.date}</div>`;
      }
    }
    const chk = dead
      ? `<label class="chk dead"><input type="checkbox" disabled ${r.included?'checked':''}><span class="lbl">решает комиссия</span></label>`
      : `<label class="chk" title="${r.included?'Включена в базу переноса':'Снята куратором — в перенос не идёт'}"><input type="checkbox" ${r.included?'checked':''} ${canEdit?'':'disabled'} onchange="RS.toggleBaseRow(${AC})"></label>`;
    /* Клетка «Распоряжение» держит СТОЛЬКО селектов, сколько линий на позиции (РС-43). Кнопка
       «+ распоряжение» появляется только там, где деление уже началось (хоть одна линия с видом)
       и остался свободный остаток: на позиции без распоряжений вторая линия не нужна — выбор
       делается в стоящем селекте, а звать делить нераспределённое значит предлагать лишний шаг.
       Убрать можно любую линию, кроме единственной — у включённой позиции распоряжение есть
       всегда, пусть и «без распоряжения». */
    const taken = round2(lines.filter(x=>x.kind!=='none').reduce((s,x)=>s+x.amount,0));
    const free = round2(r.amount - taken);
    const disp = r.included
      ? lines.map(x=>{
          const seq=Number(x.seq||1);
          return `<div class="dline"><select ${canEdit?'':'disabled'} onchange="RS.setDisposition(${A},this.value,'${calc.id}',${seq})">
          ${['none','cap','forgive','spread'].map(k=>{
            const ok = k==='none' || allowed.has(k);
            return `<option value="${k}" ${x.kind===k?'selected':''} ${ok?'':'disabled'}>${DISP_LABEL[k]}${ok?'':' — вид не разрешает'}</option>`;
          }).join('')}
        </select>${canEdit&&lines.length>1?`<button class="dline-x" title="Убрать это распоряжение" onclick="RS.removeDisposition(${A},'${calc.id}',${seq})">×</button>`:''}</div>`;
        }).join('')
        + (canEdit && taken>0.005 && free>0.005 ? `<button class="dline-add" onclick="RS.addDisposition(${AC})">+ распоряжение на ${fmt(free)}</button>` : '')
      : '';   // строка снята — распоряжаться нечем; пустая клетка это и показывает
    const rowCls = dead ? 'art-blocked' : (!r.included ? 'art-removed' : '');
    const doors = lines.filter(x=>x.kind!=='none');
    return `<tr class="${rowCls}">
        <td><div class="a-t">${esc(ARTICLE_LABEL[r.article]||r.article)} · ${urg}</div><div class="a-s">${accr}</div></td>
        <td class="numcell">${srezCell}</td>
        <td class="numcell">${fmt(r.amount)}${deltaSub}</td>
        <td>${chk}</td><td>${disp}</td></tr>`
         + (()=>{
             const ranged = x => dispositionHasPeriods(x.kind, r.article) && (x.periods||allPeriods()).mode==='range';
             const firstRanged = doors.findIndex(ranged);
             return doors.map((x,i)=>dispDoorRow(app, r, x, canEdit, planLen, calc, {
               label: doors.length>1,                                 // при одной двери вид уже назван селектом над ней
               cap: round2(r.amount - round2(taken - x.amount)),      // потолок линии — позиция минус прочие линии
               rest: i===doors.length-1 ? free : null,
               noPlanPill: i===firstRanged
             })).join('');
           })();
  }).join('') || '<tr><td colspan="5" class="op-empty">Долг по траншу пуст на выбранную дату</td></tr>';

  // Строки, которые были на срезе и не дожили до факта: показываются, иначе колонка «Срез» тихо
  // не сойдётся со своим подытогом, а разница спишется на округление.
  const goneRows = (cutRows||[]).filter(x=>!base.some(b=>b.article===x.article && b.urgency===x.urgency)).map(x=>{
    const urg=(URG.find(u=>u.key===x.urgency)||{}).name||x.urgency;
    return `<tr class="art-removed">
      <td><div class="a-t">${esc(ARTICLE_LABEL[x.article]||x.article)} · ${urg}</div></td>
      <td class="numcell">${fmt(x.amount)}</td>
      <td class="numcell">${dash('к дате факта строки не осталось')}<div class="a-s">погашена к ${factDate}</div></td>
      <td colspan="2"></td></tr>`;
  }).join('');

  const inc = base.filter(r=>r.included);
  const sumCut = cutRows ? round2(cutRows.reduce((s,x)=>s+x.amount,0)) : null;
  const foot = `<tfoot><tr>
      <th>Итого — включено ${inc.length} из ${base.length}</th>
      <th class="numcell">${sumCut==null?'—':fmt(sumCut)}</th>
      <th class="numcell">${fmt(rowsTotal(base))}</th>
      <th colspan="2">База переноса <b>${fmt(rowsTotal(inc))}</b></th></tr></tfoot>`;

  /* Примечание объясняет ПУСТУЮ колонку — и только её. Зафиксированный срез стоит датой в
     шапке колонки и подписи не требует; правило про охват статей (ADR-0110) рассказывало про
     то, чего на экране нет вовсе, и ушло в спеку, где ему место. */
  const cutNote = cutRows ? ''
    : cut ? `Дата среза ${cut.date} назначена, суммы зафиксируются отправкой письма — колонка «Срез» пуста не по ошибке.`
          : `Письмо в уполномоченный орган не направлено — срез не зафиксирован, сравнивать факт не с чем.`;
  const note = [cutNote, canEdit?'':`<span class="mode-tag">правку делает только Куратор ОД</span>`]
    .filter(Boolean).join(' ');
  const head = (app.calcs||[]).length>1
    ? ` <span class="cnt">${esc(src?src.no:'—')} · ${esc((creditById(calc.creditId)||{}).no||'—')}</span>` : '';

  /* Условия идут ПОД таблицей, а не над ней: порядок чтения повторяет порядок сделки — что
     переносим → как распоряжаемся → на каких условиях → пересчитать. Ставка и срок упираются в
     пределы от базы переноса (пп. 34, 90, 92), и база к этому месту уже сосчитана подытогом. */
  return `
    <div class="section-h" style="margin-top:0">Долг расчёта — статьи и распоряжения${head}</div>
    ${note ? `<div class="section-note">${note}</div>` : ''}
    <div class="cgrid-wrap"><table class="cgrid cbase">
      <colgroup><col class="c-art"><col class="c-cut"><col class="c-fact"><col class="c-inc"><col class="c-disp"></colgroup>
      <thead><tr>
      <th>Статья · срочность</th>
      <th class="numcell">Срез${cut?' — '+cut.date:''}</th>
      <th class="numcell">Факт — ${factDate}${factNote?`<div class="a-s">${factNote}</div>`:''}</th>
      <th>Включена</th><th>Распоряжение</th></tr></thead>
      <tbody>${rows}${goneRows}</tbody>${foot}</table></div>

    <div class="section-h">Условия чернового графика</div>
    ${versionParamsBlock(app, calc)}
  `;
}
function pResult(app){
  /* Как и стол параметров: на экране ОДИН расчёт, выбранный полосой охвата. Прежде графики шли
     стопкой под заголовками-адресами, и вкладка росла с числом расчётов, а выбор с соседней вкладки
     сюда не переносился — куратор искал глазами тот же транш второй раз. */
  const calc = curCalcOf(app);
  return `<div class="detail-panel active">` + scopeStrip(app, calc, true)
       + (calc ? resultSection(app, calc)
               : `<div class="op-empty">Охват пуст. <span class="rowlink" onclick="RS.setTab('params')">→ Параметры</span></div>`)
       + `</div>`;
}
/* РЕЗУЛЬТАТ РАСЧЁТА — только показ, ни одного поля ввода (сторож #68). Три предмета в порядке
   самой сделки: что становится с УСЛОВИЯМИ, что становится с ДЕНЬГАМИ, каким выходит ГРАФИК.
   Прежняя раскладка («Было и стало») делила экран на две половины по объектам — источник и
   производный, — и на этом ломалась трижды:
     · сравнение обещано именем, а сравнивать было нечего: условия стояли одной строкой «12%,
       60 мес.» у источника и одной ставкой у производного, остальные девять ключей зоны п. 89
       не показывались вовсе;
     · половины держат РАЗНЫЕ объекты: источник переносом закрывается, производный рождается
       датой ДС, — построчно их графики не сопоставимы, и стопка из двух таблиц предлагала
       сопоставление, которого в данных нет;
     · два числа половин — «Остаток» у источника и «Перенесённая база» у производного — не
       сходились друг с другом ничем: чем первое превращается во второе, экран молчал.
   Теперь сравнение идёт КОЛОНКАМИ внутри предмета: у условий «Действует» и «По расчёту», у
   денег — строка перехода, у графиков — свой заголовок на каждый и подпись судьбы источника.

   ЧИСТКА 13.08.2026 (РС-46). Разбор показал: треть текста вкладки — подсказки и оговорки, а
   дата показа, имя транша и судьба печатались по три раза (подпись секции, шапка колонки,
   строка-адрес над лентой, шапка внутри таблицы графика). Правило теперь одно: КАЖДЫЙ ФАКТ
   ПЕЧАТАЕТСЯ РОВНО ОДИН РАЗ И В ТОМ МЕСТЕ, ГДЕ ЕГО ЧИТАЮТ, — дата в шапке колонки условий,
   имя транша в заголовке своего графика, судьба пиллом рядом с ним. Подписи-инструкции сняты:
   объяснение зоны п. 89 живёт в ADR-0111, а не на экране куратора. */
function resultSection(app, calc){
  const src=calcTrancheOf(calc);
  if(!src) return `
    <div class="section-h" style="margin-top:0">Условия</div>
    <div class="op-empty">Транш-источник не выбран. <span class="rowlink" onclick="RS.setTab('params')">→ Параметры</span></div>
  `;

  /* ОДНА ДАТА НА ВЕСЬ ПОКАЗ. Прежде вкладка читала источник на TODAY (остаток, условия, график),
     а прогон конвейера тут же рядом — на дату вступления ДС: условия и деньги стояли на разных
     датах и назывались одним словом «было». Дата видна в шапке колонки «Действует» — и больше
     нигде: подпись секции печатала её вторым экземпляром и первой попадала под правку. */
  const D = calcEffectiveDate(app, calc);
  const derived=resultTrancheOf(app, calc.id);
  const dsNo = calc.dsRef || null;

  /* 1. УСЛОВИЯ. «Действует» — запись условий транша-источника на дату D (conditionsAt несёт все
     двенадцать ключей реестра, а не четыре); «По расчёту» — черновик, а после регистрации ДС
     условия производного транша, то есть то, что реально доехало. Пустое «По расчёту» — НЕ
     обнуление: молчание соглашения переносит условие как есть (restructureApplied), и такая
     строка стоит среди неизменных, а не среди движения.
     До регистрации ДС дата предварительна — это сказано ПИЛЛОМ в самой шапке, рядом с числом,
     которое сдвинется, а не абзацем над таблицей. */
  const was = conditionsAt(src, D);
  const now = derived ? conditionsAt(derived, D) : (calc.version ? calc.version.params : null);
  // Дата держится одним куском: «2026-07-19» браузер охотно рвёт по дефису на «2026-07-» и «19».
  const dt = `<span class="nb">${D}</span>`;
  const wasHead = derived
    ? `Действует — ${dt}`
    : `Действует <span class="pill mid" title="ДС не зарегистрировано. Дата вступления сдвинет и суммы, и графу «Действует».">Предварительно — ${dt}</span>`;
  const nowHead = derived
    ? `По расчёту — <span class="pill low">${esc(dsNo||'по ДС')}</span>`
    : `По расчёту — <span class="pill info">Черновик</span>`;
  const has = v => v!=null && v!=='';
  // Числа печатаются по-русски (запятая), включая дельту: «6.5» рядом с «−1,5 п.п.» читалось бы
  // как два разных числовых языка в одной строке.
  const num = v => String(round2(Number(v))).replace('.',',');
  const show = (d,v) => d.kind==='num' ? num(v) : esc(String(v));
  const cmpRows = { moved:[], same:[] };
  PARAMS.filter(d=>!d.showIf || d.showIf(now||{}) || d.showIf(was||{})).forEach(d=>{
    const a=was?was[d.key]:null, b=now?now[d.key]:null;
    const aCell = has(a) ? show(d,a) : `<span class="dash" title="условие у транша не заведено">—</span>`;
    // Графа Δ держит ТОЛЬКО число. Прежде в ней вперемешку стояли дельта («+36 мес.»), слово
    // («изменено») и целая фраза («не названо — остаётся прежним»): колонка с заголовком «Δ»
    // не может быть то числом, то рассказом. Характер значения — подпись под самим значением.
    let bCell, dCell='', moved=false;
    if(!has(b)){
      bCell = `<span class="dash" title="соглашение условие не называет — оно переносится как есть">—</span>`
            + `<div class="a-s">не названо — остаётся прежним</div>`;
    } else if(!has(a)){
      bCell = show(d,b)+`<div class="a-s">новое</div>`; moved=true;
    } else if(String(a)===String(b)){
      bCell = show(d,b);
    } else if(d.kind==='num'){
      bCell = show(d,b); moved=true;
      const dv=round2(Number(b)-Number(a));
      dCell = (dv>0?'+':'−')+num(Math.abs(dv))+(PARAM_DELTA_UNIT[d.key]||'');
    } else {
      bCell = show(d,b)+`<div class="a-s">изменено</div>`; moved=true;
    }
    cmpRows[moved?'moved':'same'].push(`<tr><td>${esc(d.label)}</td>
      <td class="numcell cmp-was">${aCell}</td><td class="numcell cmp-now">${bCell}</td>
      <td class="cmp-d">${dCell}</td></tr>`);
  });
  // Неизменные условия ДОБИВАЮТСЯ в ту же таблицу, а не разворачиваются второй таблицей со своей
  // шапкой: колонки одни и те же, и шапке незачем печататься дважды.
  const condKey = 'cond:'+calc.id;
  const condOpen = !!state.expand[condKey];
  const moreRow = (n,label) => `<tr class="more-row"><td colspan="4"><span class="rowlink"
      onclick="RS.toggleMore('${condKey}')">${label}</span></td></tr>`;
  const condBlock = !now
    ? `<div class="op-empty">Черновик условий не заведён. <span class="rowlink" onclick="RS.setTab('params')">→ Параметры</span></div>`
    : `<div class="cgrid-wrap cmp-wrap"><table class="cgrid cmp">
        <thead><tr><th>Параметр</th><th class="numcell">${wasHead}</th>
        <th class="numcell">${nowHead}</th><th>Δ</th></tr></thead>
        <tbody>${cmpRows.moved.join('') || `<tr><td colspan="4" class="op-empty">Ни одно условие зоны п. 89 не меняется — сделка держится на распоряжениях начисленным</td></tr>`}${
          condOpen ? cmpRows.same.join('') : ''}${
          cmpRows.same.length ? moreRow(cmpRows.same.length, condOpen ? 'Свернуть неизменные' : `Ещё ${cmpRows.same.length} без изменений`) : ''}</tbody></table></div>`;

  /* 2. ДЕНЬГИ. Строка перехода, а не пара коробок: перенос = база переноса минус прощённое
     (капитализация и распределение сумму не меняют, они меняют статью и сроки — ИР-2), а
     остаток источника уменьшается ровно на перенос (transfer_out). Обе арифметики видны
     подряд, и число производного транша больше не висит рядом с остатком источника без связи.
     Имя транша и дата из подписей лент СНЯТЫ: транш назван полосой охвата и заголовком своего
     графика, дата — шапкой колонки условий. Подпись переноса называет ОХВАТ («по этому
     расчёту»), потому что плитка шапки карточки складывает перенос по ВСЕЙ заявке: на
     однорасчётной заявке числа совпадают, на многорасчётной разойдутся, и различить их
     куратор должен по подписи, а не по догадке. */
  const r=run(app, D, calc.id);
  const baseRows = calcBaseOf(app, calc, D);
  const baseInc = baseRows.filter(x=>x.included);
  const baseSum = rowsTotal(baseInc);
  const outAt = round2((src.ops||[]).filter(o=>o.kind==='transfer_out' && o.date<=D
                        && o.basis && (!dsNo || o.basis.ds===dsNo)).reduce((s,o)=>s+o.amount,0));
  const balAfter  = round2(balanceAt(src, D));
  const balBefore = round2(balAfter + outAt);
  const transfer  = derived ? outAt : r.transferSum;
  const afterVal  = derived ? balAfter : round2(balBefore - r.transferSum);
  const item=(l,v,sub,cls)=>`<div class="fl-i${cls?' '+cls:''}"><span class="fl-l">${l}</span><span class="fl-v">${v}</span>${
    sub?`<span class="fl-s">${sub}</span>`:''}</div>`;
  const op=s=>`<span class="fl-op">${s}</span>`;
  const nonRate = round2(transfer - r.principalPart);
  const flow = `<div class="flowline">
      ${item('Остаток до переноса', fmt(balBefore), derived?'у транша-источника':'у транша-источника, предпросмотр')}
      ${op('→')}
      ${item('База переноса', fmt(baseSum), 'включено '+baseInc.length+' из '+baseRows.length+' строк долга расчёта')}
      ${round2(r.forgiven)>0 ? op('−')+item('Прощено', fmt(r.forgiven), 'списание, в перенос не идёт') : ''}
      ${op('=')}
      ${item('Перенос по этому расчёту', fmt(transfer), 'тело '+fmt(r.principalPart)+' · безставочные '+fmt(nonRate), 'main')}
      ${op('→')}
      ${item('Остаток после переноса', fmt(afterVal),
             src.closed?'транш закрыт переносом':(derived?'срочный остаток':'прогноз'))}
    </div>`;

  /* 3. ГРАФИКИ. Строка графика несёт статьи (РС-41, ADR-0109): рядом с телом и процентом —
     безставочные колонки. Пустая колонка не рисуется, и обычный кредит выглядит как прежде.
     ТО ЖЕ ПРАВИЛО ТЕПЕРЬ И У ТЕЛА С ПРОЦЕНТОМ: график переноса накопленного состоит из
     безставочных статей, тело и процент в нём — сорок восемь нулей подряд, и колонка нулей
     утверждает, что величина есть и равна нулю, тогда как её просто нет.
     Ширина — ФИКСИРОВАННАЯ (130 px на колонку), а не доля экрана: на трёх колонках таблица
     растягивалась на всю ширину и между «Датой» и числами зияла пустота. Потолок 920 px общий
     с лентой денег и таблицей условий; шире — прокрутка внутри рамки, а не по странице.
     `allRows` — полный график: итог считается по ВСЕМУ графику, даже когда на экране шесть
     первых строк, и подпись итога у двух графиков РАЗНАЯ — у производного это перенос (ИР-2),
     у источника остаток по его собственному графику. */
  const COLW = 130, WMAX = 920;
  function tbl(key,rows,emptyMsg,footLabel){
    const cols = scheduleArticleCols(rows);
    const hasP = rows.some(r=>round2(r.principal||0)>0);
    const hasI = rows.some(r=>round2(r.interest||0)>0);
    const money = [].concat(hasP?[{k:'principal', label:'Тело', get:r=>r.principal||0}]:[],
                            hasI?[{k:'interest',  label:'%',    get:r=>r.interest||0}]:[],
                            cols.map(k=>({k, label:ARTICLE_LABEL[k]||k, get:r=>(r.articles||{})[k]||0})));
    const span = 1+money.length;
    const w = COLW*span;
    if(!rows.length) return `<div class="op-empty">${emptyMsg}</div>`;

    const open = !!state.expand[key];
    const shown = open ? rows : rows.slice(0,6);
    const body = shown.map(r=>`<tr><td>${r.date}</td>${
      money.map(c=>`<td class="numcell">${fmt(c.get(r))}</td>`).join('')}</tr>`).join('');
    const more = rows.length>6
      ? `<tr class="more-row"><td colspan="${span}"><span class="rowlink"
          onclick="RS.toggleMore('${key}')">${open?'Свернуть':'Показать все '+rows.length}</span></td></tr>`
      : '';
    const sums = money.map(c=>round2(rows.reduce((s,r)=>s+c.get(r),0)));
    const total = round2(money.reduce((s,c,i)=>s+(c.k==='interest'?0:sums[i]),0));
    // Подпись итога и само число — в столбец «Дата», числом на своей строке: в 130 px «Перенос по
    // этому расчёту 118 000» одной строкой не встаёт и лезет на соседнюю колонку.
    const foot = `<tfoot><tr><th class="ft-l">${footLabel}<span class="ft-v">${fmt(total)}</span></th>${
      sums.map(v=>`<th class="numcell">${fmt(v)}</th>`).join('')}</tr></tfoot>`;
    const colgroup = `<colgroup>${Array(span).fill(`<col style="width:${COLW}px">`).join('')}</colgroup>`;
    return `<div class="cgrid-wrap sched" style="width:${w}px"><table class="cgrid sched" style="width:${w}px">${colgroup}
      <thead><tr><th>Дата</th>${money.map(c=>`<th class="numcell">${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${body}${more}</tbody>${foot}</table></div>`;
  }

  /* Заголовок называет ТО, ЧТО ЕСТЬ. До регистрации ДС производного транша нет — и заголовок
     зовётся «График по расчёту»: обещать номер, которого ещё не выдали, незачем. Прежде тут
     стояла строчная заглушка «производный транш» шапкой внутри таблицы, а над лентой денег та
     же мысль повторялась третьей строкой «производный транш появится после регистрации ДС». */
  const derRows = derived ? (derived.schedules[0].rows||[])
                 : (calc.version && calc.version.plan ? calc.version.plan.rows : null);
  const derHead = derived
    ? `График производного ${esc(derived.no)} <span class="pill low">Действующий</span>`
    : `График по расчёту <span class="pill info">Черновик</span>`;
  const derivedBlock = derRows
    ? tbl('sched:'+calc.id+':der', derRows, 'график пуст', 'Перенос по этому расчёту')
    : `<div class="op-empty">Черновой график не рассчитан. <span class="rowlink" onclick="RS.setTab('params')">→ Параметры</span></div>`;

  const srcVer=scheduleAt(src,D);
  const srcAll=(srcVer?srcVer.rows:[]).filter(x=>x.date>=D);
  const srcHead = `График источника ${esc(src.no)} ` + (src.closed
    ? `<span class="pill neutral">Закрывается переносом</span>`
    : `<span class="pill low">Действующий</span>`);
  // Пустой график схлопывается в СТРОКУ: пустая рамка таблицы съедала ~120 px, чтобы сообщить,
  // что показывать нечего. (В демо-данных график части траншей не оцифрован — это артефакт
  // сида, а не утверждение об отсутствии платежей; в проде такого состояния не будет.)
  const srcBlock = tbl('sched:'+calc.id+':src', srcAll, 'График не заведён.', 'Остаток по графику');

  // Непокрытое — то, что осталось на строке ПОСЛЕ всех распоряжений (РС-39): ровно тот же остаток,
  // по которому шаг overdue считает remainsOverdue. Частичное распределение честно попадает сюда.
  // Печатается ТОЛЬКО отрицательный исход и прижато к таблице производного как её подпись:
  // зелёная плашка «всё урегулировано» сообщала, что ничего не случилось, и занимала строку
  // ровно там, где ищут число.
  const unresolved = (r.base||[]).filter(x=>x.included && x.urgency==='over' && round2(x.carried)>0);
  const rs15 = r.remainsOverdue
    ? `<div class="sched-note"><span class="pill mid">Кредит частично просрочен после ДС</span> <span class="mode-tag">Не урегулированы распоряжением: ${esc(unresolved.map(x=>ARTICLE_LABEL[x.article]||x.article).join(', ')||'—')} — просрочка не растворяется, входит суммой в перенос.</span></div>`
    : '';

  return `
    <div class="section-h" style="margin-top:0">Условия</div>
    ${condBlock}

    <div class="section-h">Деньги</div>
    ${flow}

    <div class="section-h">${derHead}</div>
    ${derivedBlock}
    ${rs15}

    <div class="section-h">${srcHead}</div>
    ${srcBlock}
  `;
}

/* 4. Комитет и решение (Р-6, переборено по ADR-0107). За прежней одной стадией «решение
   уполномоченного органа» стоят ТРИ АКТА РАЗНЫХ ОРГАНОВ: заключение уполномоченного органа
   (пп. 87–88), согласование профильного комитета ЖК и постановление Кабинета Министров (п. 82).
   Все три живут внутри одного срока 70 к.д. — своих регламентных сроков у них нет, и выдумывать
   их нельзя. Отрицательное заключение (п. 88) закрывает заявку отказом, до Кабмина она не идёт. */
function pDecision(app){
  const st=stageOf(app); const c=app.committee||{}; const l=app.letterSent||{};
  const cc=app.conclusion||{}, zk=app.zk||{}, r=app.resolution||{};
  const dl=deadline(app);
  const initLabel = (INITIATORS.find(i=>i.code===app.initiator)||{}).label || null;
  const initBlock = initLabel
    ? `<div class="okline">Инициатор проекта решения: <b>${esc(initLabel)}</b> (п. 83).${app.initiatorViaEnvoy?' Внесено через полномочного представителя Президента в области.':''}</div>`
    : `<div class="warnline">Инициатор проекта решения не указан (п. 83) — реквизит справочника, а не свободная строка.</div>`;
  const committeeBlock = c.fixed
    ? `<div class="okline">Позиция комитета Холдинга: <b>${esc(c.position)}</b> (${c.date}). Позиция необязывающая — письмо направляется всегда.</div>`
    : `<div class="field" style="max-width:420px"><span class="flabel">Позиция комитета</span>
        <select id="cpos"><option value="целесообразно">целесообразно</option><option value="нецелесообразно">нецелесообразно</option></select>
        <div style="margin-top:8px"><button class="btn btn-success btn-sm" onclick="RS.fixCommittee('${app.id}')">Зафиксировать позицию</button></div></div>`;
  let letterBlock='';
  if(c.fixed){
    letterBlock = l.fixed
      ? `<div class="okline">Письмо в уполномоченный государственный орган направлено ${l.date}. Включена пауза взыскания + дедлайн решения 70 к.д. — один срок на все три акта (п. 18 Порядка №41, ADR-0107 §3).</div>`
      : `<div class="warnline">Дедлайн письма: ${dl?(dl.overdue?`<span class="dl-red">просрочен ${-dl.remaining} дн.</span>`:`осталось ${dl.remaining} дн.`):'5 р.д.'} (флаг, не блокировка). Письмо направляется при любой позиции.
         <span class="mode-tag">${esc(dl?normNote(dl.rec):normNote(normAt('deadlineLetter',c.date||TODAY)))} · рабочие дни по производственному календарю${dl&&dl.calKnown===false?' — год не заведён, счёт по сб/вс':''}</span></div>
         <button class="btn btn-primary btn-sm" onclick="RS.fixLetter('${app.id}')">Зафиксировать отправку письма</button>`;
  }
  /* акт 1 — заключение уполномоченного органа (пп. 87–88) */
  let cBlock='';
  if(l.fixed){
    cBlock = cc.fixed
      ? `<div class="${cc.outcome==='отказ'?'flagline':'okline'}">Заключение уполномоченного органа: <b>${cc.outcome==='отказ'?'отрицательное — отказ (п. 88)':'возможно изменение условий (п. 87)'}</b> · № ${esc(cc.no)} от ${cc.date}.${
          cc.outcome==='отказ'?' Заявка закрыта, до Кабинета Министров не доходит.':''}</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Исход заключения</span><select id="cdec">
            <option value="возможно">возможно изменение условий (п. 87)</option><option value="отказ">отрицательное заключение — отказ (п. 88)</option></select></div>
          <div class="field"><span class="flabel">Номер заключения •</span><input id="cno" placeholder="МФ-исх-№"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixConclusion('${app.id}')">Зафиксировать заключение</button></div>
        </div>`;
  }
  /* акт 2 — согласование профильного комитета ЖК (п. 82) */
  let zBlock='';
  if(cc.fixed && cc.outcome==='возможно'){
    zBlock = zk.fixed
      ? `<div class="okline">Профильный комитет Жогорку Кенеша согласовал проект решения: № ${esc(zk.no)} от ${zk.date}.</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Реквизит согласования ЖК •</span><input id="zno" placeholder="ЖК-К/№"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixZk('${app.id}')">Зафиксировать согласование</button>
            <span class="mode-tag" style="margin-left:8px">Без отметки согласования постановление не регистрируется (п. 82).</span></div>
        </div>`;
  } else if(cc.fixed && cc.outcome==='отказ'){
    zBlock = `<div class="op-empty">Отрицательное заключение — согласование и постановление не требуются.</div>`;
  }
  /* акт 3 — постановление Кабинета Министров (п. 82) */
  let rBlock='';
  if(zk.fixed){
    const fg=forgiveGate(app);
    const fgLine = fg.applicable
      ? (fg.ok
          ? `<div class="okline">Прощение ${fmt(fg.sum)} названо в акте${fg.actSum!=null?` суммой ${fmt(fg.actSum)}`:' основанием'}${fg.mismatch?` — <b>расхождение с распоряжениями заявки</b>`:''} (РС-28).${fg.basis?` Основание: ${esc(fg.basis)}`:''}</div>`
          : `<div class="flagline">В распоряжениях есть прощение на ${fmt(fg.sum)}, но акт его не называет. Списание бюджетных средств без названной суммы или основания в решении органа невозможно — жёсткий гейт РС-28/ИР-13.</div>`)
      : '';
    rBlock = (r.fixed
      ? `<div class="${r.decision==='отказ'?'flagline':'okline'}">Постановление Кабинета Министров: <b>${decLabel(r.decision)}</b> · ${esc(r.no)} от ${r.date}. Это и есть реквизит регистрации ДС (п. 96 — соглашение оформляет агент или кредитный агент).</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Решение</span><select id="rdec">
            <option value="одобрено">одобрено</option><option value="изм">одобрено с изменёнными условиями</option><option value="отказ">отказ</option></select></div>
          <div class="field"><span class="flabel">Реквизит постановления •</span><input id="rno" placeholder="ПКМ КР № … от дата"></div>
          <div class="field"><span class="flabel">Сумма прощения по акту</span><input id="rfsum" placeholder="если названа суммой"></div>
          <div class="field"><span class="flabel">Основание прощения</span><input id="rfbasis" placeholder="если названо основанием"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixResolution('${app.id}')">Зафиксировать постановление</button></div>
        </div>`) + fgLine;
  }
  const auto = automationBlock(app);
  return `<div class="detail-panel active">
    <div class="section-note">Своих регламентных сроков у трёх актов нет — все они внутри 70 к.д. от письма (ADR-0107 §3).</div>
    ${initBlock}
    <div class="section-h" style="margin-top:18px">Комитет Холдинга</div>${committeeBlock}
    <div class="section-h" style="margin-top:18px">Письмо в уполномоченный орган</div>${letterBlock||'<div class="op-empty">Сначала зафиксируйте позицию комитета.</div>'}
    <div class="section-h" style="margin-top:18px">Заключение уполномоченного органа (пп. 87–88)</div>${cBlock||'<div class="op-empty">Сначала зафиксируйте отправку письма.</div>'}
    <div class="section-h" style="margin-top:18px">Согласование профильного комитета ЖК (п. 82)</div>${zBlock||'<div class="op-empty">Сначала зафиксируйте заключение уполномоченного органа.</div>'}
    <div class="section-h" style="margin-top:18px">Постановление Кабинета Министров (п. 82)</div>${rBlock||'<div class="op-empty">Сначала зафиксируйте согласование профильного комитета ЖК.</div>'}
    ${auto}
  </div>`;
}
function decLabel(d){ return d==='изм'?'одобрено с изменёнными условиями':d==='отказ'?'отказ':'одобрено'; }

/* Блок «Автоматика» (Р-12/13/14) + мини-зеркало */
function automationBlock(app){
  if(!app.automation.length) return '';
  const events=app.automation.map(e=>`<div class="op-row"><span class="pill ${e.kind==='risk'?'high':e.kind==='unpause'?'low':'mid'}">${e.kind}</span><span class="op-t">${esc(e.text)}</span><span class="mode-tag">${e.when}</span></div>`).join('');
  /* Пауза п. 16 снимается ПО КРЕДИТУ, а не по заявке: зеркало каждого кредита читает своё
     оформление (тот же приём адресации, что newMaturity :1301 — расчёт этого кредита, затем его
     dsRef). Прежнее общее условие app.ds снимало банер разом со всех зеркал многокредитной
     заявки, хотя ДС стояло по одному кредиту (ревью 12.08.2026). Отказ и неотправленное письмо
     остаются общими: это факты заявки, не кредита. */
  const letterPause = app.letterSent&&app.letterSent.fixed && app.outcome!=='отказ';
  const pausedOn = cr => {
    const calc=(app.calcs||[]).find(c=>c.creditId===cr.id && !c.excluded);
    const dsNo = calc ? calc.dsRef : (app.ds && app.ds.no);
    return letterPause && !dsNo;
  };
  const multi = (app.creditIds||[]).length>1;
  const mirrors = (app.creditIds||[]).map(id=>creditById(id)).filter(cr=>cr&&cr.collProc).map(cr=>{
    const proc=state.procs[cr.collProc], paused=pausedOn(cr);
    return `<div class="mirror">
      <div class="mh">Зеркало процесса взыскания ${proc.id}${multi?` (кредит ${esc(cr.no)})`:''} (read-only)</div>
      ${paused?`<div class="mbanner">⏸ Пауза (предмет — меры п. 16, ADR-0063: обе претензии, требования поручителю/гаранту/госоргану, безакцепт; судебный и залоговый треки идут своим ходом; дедлайн 70 к.д.) — источник: заявка <span class="rowlink" onclick="RS.openApp('${app.id}')">${app.id}</span></div>`:''}
      <div class="mrow"><span>Фаза</span><span>${proc.phase}</span></div>
      <div class="mrow"><span>Дней в категории</span><span>${proc.catDays}</span></div>
      <div class="mrow"><span>Заёмщик (ИНН)</span><span>${proc.inn}</span></div>
    </div>`;
  }).join('');
  return `<div class="section-h" style="margin-top:20px">Автоматика швов</div>
    <div class="ops-list">${events}</div>
    ${mirrors}
    <div class="infoline">Пени во время паузы <b>продолжают начисляться</b>: пауза останавливает меры, не обязательства (Р-13).</div>
    <div class="infoline">Группа и риск-категория заёмщика реструктуризацией не меняются — только классификатором; счётчик реструктуризаций кредита +1 (Р-14).</div>`;
}

/* 5. Оформление (Р-8, Р-15) */
function pFormal(app){
  // оформление открывает ПОСТАНОВЛЕНИЕ КМ, а не заключение органа (ADR-0107 §«Последствия»)
  const approved = app.resolution&&app.resolution.fixed&&app.resolution.decision!=='отказ';
  if(!approved) return `<div class="detail-panel active"><div class="op-empty">Оформление доступно после постановления Кабинета Министров об изменении условий (п. 82). Заключения уполномоченного органа для этого недостаточно.</div></div>`;
  const cga=coverGateApp(app);
  const rows=cga.rows.map(({cr,g})=>`<tr>
    <td>${cr.no}</td>
    <td class="numcell">${g.cover}% / ≥${g.required}%</td>
    <td>${g.coverOk?'<span class="gatechip ok">покрытие ✓</span>':'<span class="gatechip no">покрытие ✗</span>'}</td>
    <td>${cr.tech?(g.ageOk?'<span class="gatechip ok">возраст ✓</span>':'<span class="gatechip no">возраст ✗</span>'):'<span class="mode-tag">не техника</span>'}</td>
    <td>${g.insured?'<span class="gatechip ok">страховка ✓</span>':'<span class="gatechip no">страховка ✗</span>'}</td>
    <td>${esc(g.source||'Залог')}, ${esc(g.snapshotDate||'—')}${g.stale?` <span class="pill high" title="Снимок старше ${COVER_SNAPSHOT_STALE_DAYS} к.д. — данные модуля залога могли устареть">устарел</span>`:''}</td>
  </tr>`).join('');
  const waived = app.waiver&&app.waiver.granted;
  let gateLine;
  if(cga.ok && !waived) gateLine=`<div class="okline">Гейт обеспечения пройден по всем кредитам. Регистрация доп. соглашения доступна.</div>`;
  else if(waived) gateLine=`<div class="warnline">Гейт обеспечения снят решением комитета по администрированию бюджетных кредитов. Основание: ${esc(app.waiver.reason)} (${app.waiver.date}).</div>`;
  else gateLine=`<div class="flagline">Гейт обеспечения не пройден — регистрация доп. соглашения заблокирована. Разблокировка — решением комитета по администрированию бюджетных кредитов с обязательным основанием.</div>`;
  const lga=limitsGateApp(app), coa=consentGateApp(app);
  const limitsLine = !lga.rows.length ? '<div class="op-empty">Расчёт (транш-источник/условия) ещё не выбран — гейт неприменим.</div>'
    : lga.rows.map(({creditNo,g})=>{
        const pfx = lga.rows.length>1 ? esc(creditNo)+': ' : '';
        if(g.pending) return `<div class="op-empty">${pfx}Расчёт (транш-источник/условия) ещё не выбран — гейт неприменим.</div>`;
        return g.ok ? `<div class="okline">${pfx}Срок и ставка новых условий в пределах нормы (${esc(normNote(g.capRec))}).${
            g.projectUnchecked?' <b>Вид проекта не указан — минимум п. 34 не проверен</b>, гейт работает по одному полу (50 % от первоначальной).':''}</div>`
          : `<div class="flagline">${pfx}${g.messages.map(esc).join('<br>')} — жёсткий гейт, без waiver.</div>`;
      }).join('');
  const consentLine = coa.ok ? '<div class="okline">Согласия всех обеспечителей получены.</div>'
    : `<div class="flagline">Не согласовано: ${coa.pending.map(esc).join(', ')} — жёсткий гейт, без waiver.</div>`;
  const fg=forgiveGate(app);          // РС-28 — жёсткий: без названной суммы/основания ДС не регистрируется
  const dg=driftGate(app, TODAY);     // РС-26 ступень 2 — возврат на комитет, регистрация заблокирована
  const forgiveLine = !fg.applicable ? '<div class="op-empty">Прощения в распоряжениях нет — гейт неприменим.</div>'
    : fg.ok ? `<div class="okline">Прощение ${fmt(fg.sum)} названо в постановлении${fg.actSum!=null?` суммой ${fmt(fg.actSum)}`:' основанием'}.${
        fg.mismatch?` <b>Сумма акта (${fmt(fg.actSum)}) расходится с распоряжениями (${fmt(fg.sum)})</b> — расхождение видимо, решает куратор.`:''}</div>`
    : `<div class="flagline">Прощение ${fmt(fg.sum)} не названо в постановлении Кабмина — регистрация ДС заблокирована (РС-28/ИР-13).</div>`;
  const driftLine = !dg.applicable ? '<div class="op-empty">Срез не зафиксирован — порог неприменим.</div>'
    : dg.level===0 ? `<div class="okline">Долг на дату вступления ${fmt(dg.factSum)} против среза ${fmt(dg.cutoffSum)} — расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}), обе ступени не задеты.</div>`
    : dg.level===1 ? `<div class="warnline">Ступень 1: расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}) — ${esc(DRIFT_TIERS[0].need)}. Регистрацию не блокирует.</div>`
    : dg.recommitted ? `<div class="warnline">Ступень 2 сработала (${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} %, ${fmt(dg.delta)}), но комитет высказался заново ${esc(app.committee.date)} — блокировка снята.</div>`
    : `<div class="flagline">Ступень 2: расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}) — ${esc(DRIFT_TIERS[1].need)}. Постановление Кабмина не переподписывается: пересматривается позиция комитета Холдинга, на которой стоит письмо.</div>`;
  const done = app.ds&&app.ds.no;
  const dispRows = (app.dispositions||[]).filter(d=>d.kind!=='none');
  // Ярлык распоряжения — один на файл (DISP_LABEL, :~432): прежний локальный kindLabel повторял
  // его третьим списком и расходился бы при первом же новом виде распоряжения.
  const planLenG = (app.version && app.version.plan && app.version.plan.rows) ? app.version.plan.rows.length : null;
  const badPeriods = dispRows.filter(d=>{
    if(!dispositionHasPeriods(d.kind, d.article)) return false;
    const p = d.periods || allPeriods();
    return p.mode==='range' && planLenG!=null && (p.to>planLenG || p.from<1 || p.from>p.to);
  });
  const perLabel = d => {
    if(!dispositionHasPeriods(d.kind, d.article)) return 'сроков нет';
    const p = d.periods || allPeriods();
    if(p.mode!=='range') return 'весь график';
    const bad = planLenG!=null && (p.to>planLenG || p.from<1 || p.from>p.to);
    return 'позиции '+p.from+'–'+p.to+(bad?' — вне графика ('+planLenG+'), ИР-15':'');
  };
  // ИР-15/РС-40 — жёсткий гейт: интервал за длиной плана закрывает регистрацию до правки, а не
  // подрезается молча. Ровно та же причина придёт из validateDS, если дверь всё-таки дёрнут.
  const canReg = (cga.ok||waived) && lga.ok && coa.ok && fg.ok && dg.ok && !badPeriods.length;
  const dsBlock = done
    ? `<div class="okline">Доп. соглашение <b>${esc(app.ds.no)}</b> зарегистрировано. Версия «действует» с ${app.ds.date}. Счётчик реструктуризаций кредитов +1.</div>`
    : `<div class="gtoolbar">
        ${(!cga.ok && !waived)?`<button class="btn btn-danger btn-sm" onclick="RS.openWaiver('${app.id}')">Решение комитета по администрированию (снятие гейта)</button>`:''}
        <button class="btn btn-primary btn-sm" ${canReg?'':'disabled'} onclick="RS.openDS('${app.id}')">Зарегистрировать доп. соглашение</button>
      </div>`;
  const ops = dispRows.length
    ? `<div class="ops-list">${dispRows.map(d=>`<div class="op-row"><span class="op-t"><b>${DISP_LABEL[d.kind]||d.kind}</b> — ${esc(ARTICLE_LABEL[d.article]||d.article)} (${esc((URG.find(u=>u.key===d.urgency)||{}).name||d.urgency)})</span><span class="mode-tag">${fmt(d.amount)} · ${esc(perLabel(d))}</span></div>`).join('')}</div>`
    : '<div class="op-empty">Распоряжений нет — статьи, распоряжения и условия задаются на вкладке «Параметры».</div>';
  return `<div class="detail-panel active">
    <div class="section-h">Гейт пределов (жёсткий, без waiver)</div>
    ${limitsLine}
    <div class="section-h" style="margin-top:18px">Гейт согласий обеспечителей (жёсткий, без waiver)</div>
    <div class="section-note">Ответ Обеспечения (ADR-0098) — зеркало, не собственный расчёт.</div>
    ${consentLine}
    <div class="section-h" style="margin-top:18px">Гейт прощения (жёсткий, без waiver)</div>
    ${forgiveLine}
    <div class="section-h" style="margin-top:18px">Порог расхождения среза и факта (две ступени)</div>
    <div class="section-note">Обе ступени — настройка с историей значений, а не норма (РС-26).</div>
    ${driftLine}
    <div class="section-h" style="margin-top:18px">Гейт обеспечения (мягкий, снимается waiver-ом)</div>
    <div class="section-note">Покрытие = залоговая стоимость / остаток ≥ порог; возраст техники и страховка — на новый срок (Р-15).</div>
    ${gateLine}
    <div class="cgrid-wrap" style="max-width:900px"><table class="cgrid"><thead><tr><th>Кредит</th><th class="numcell">Покрытие</th><th>Гейт</th><th>Возраст</th><th>Страховка</th><th>Снимок</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-h" style="margin-top:18px">Гейт сроков распоряжений (жёсткий, без waiver)</div>
    ${badPeriods.length
      ? `<div class="flagline">${badPeriods.map(d=>'«'+esc(ARTICLE_LABEL[d.article]||d.article)+'» — '+esc(perLabel(d))).join('; ')}. Регистрация ДС закрыта до правки интервала либо возврата к режиму «весь график».</div>`
      : (planLenG==null
          ? `<div class="okline">Черновой график ещё не рассчитан — шкалы позиций нет, сверять нечего.</div>`
          : `<div class="okline">Все интервалы лежат внутри графика (${planLenG} ${planLenG===1?'позиция':'позиций'}).</div>`)}
    <div class="section-h" style="margin-top:18px">Доп. соглашение</div>${dsBlock}
    <div class="section-h" style="margin-top:18px">Операции на дату вступления</div>${ops}
  </div>`;
}

/* 6. История (Р-16, append-only) */
function pHist(app){
  const rows=[...app.history].map(h=>`<div class="hrow ${h.cls||''}">
    <div class="hwhen">${h.when}</div><div class="hwhat">${esc(h.what)}</div>${h.who?`<div class="hwho">${esc(h.who)}</div>`:''}
  </div>`).join('');
  return `<div class="detail-panel active">
    <div class="section-h">История заявки</div>
    <div class="hist">${rows||'<div class="op-empty">Пусто</div>'}</div>

/* ================= СПРАВОЧНИК ВИДОВ (Р-3, РС-33/ИР-14) =================
   Справочник ОТКРЫТ, но каждая запись несёт происхождение. Пять форм п. 89 замкнуты: их нельзя
   удалить и нельзя переименовать — они цитата нормы, а не настройка. Всё, что администратор
   заводит сверх них, живёт под п. 89 пп. 5 «и другим обоснованным предложениям» и обязано нести
   письменное обоснование: закрытый список остановил бы работу на форме, которой в перечне нет,
   открытый без признака — стёр бы границу между нормой и самодеятельностью. */
function renderDict(){
  const v=document.getElementById('view-dict');
  const rows=state.kinds.map(k=>`<tr>

        : `<button class="btn btn-secondary btn-sm" ${canX('manageDict')?'':'disabled'} onclick="RS.dropKind('${k.id}')">Удалить</button>`}</td>
  </tr>`).join('');
  v.innerHTML=`
    <div class="tb-actions">
      <button class="btn btn-primary btn-sm" ${canX('manageDict')?'':'disabled'} onclick="RS.openNewKind()">+ Новый вид</button>
      <div class="spacer"></div>
      <span class="mode-tag">Конструктор — роль Администратор.</span>
    </div>
    <div class="grid-wrap"><table class="grid"><thead><tr>
      <th>Вид</th><th>Происхождение</th><th>Разрешённые параметры</th><th>Документы</th><th>Разрешённые распоряжения</th><th>Ограничения</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function openDS(appId, calcId){
  if(!guard('regDS')) return; const app=appById(appId);
  // Пред-проверки читают ТОТ ЖЕ активный охват, что formalGatesOk (:1164): агрегаты *GateApp
  // ходят по всем кредитам заявки, включая снятые с оформления, и держали бы регистрацию по
  // чужому гейту (ревью 12.08.2026). Тексты сообщений прежние, изменился только состав строк.
  const activeIds=activeCreditIdsOf(app);
  const coverBad=activeIds.map(id=>creditById(id)).filter(cr=>cr && !coverGate(app,cr).ok);
  if(coverBad.length && !(app.waiver&&app.waiver.granted)){ toast('Гейт обеспечения не пройден — сначала waiver','err'); return; }
  const lrows=activeLimitRows(app), lbad=lrows.filter(r=>!r.g.ok);                                        // жёсткий, без waiver
  if(lbad.length){ toast('Гейт пределов не пройден: '+lbad.flatMap(r=>(r.g.messages||[])
      .map(m=>lrows.length>1 ? r.creditNo+': '+m : m)).join('; '),'err'); return; }
  const cPending=activeIds.flatMap(id=>consentGate(id).pending);                                          // жёсткий, без waiver
  if(cPending.length){ toast('Гейт согласий не пройден: не согласовано — '+cPending.join(', '),'err'); return; }
  const fg=forgiveGate(app);
  if(!fg.ok){ toast('Прощение '+fmt(fg.sum)+' не названо в постановлении Кабмина (РС-28) — регистрация невозможна','err'); return; }
  const dg=driftGate(app, TODAY);
  if(!dg.ok){ toast('Ступень 2 порога расхождения ('+(dg.pct*100).toFixed(1)+' %, '+fmt(dg.delta)+') — требуется новая позиция комитета (РС-26)','err'); return; }
  modal(`<div class="modal">${mhead('Регистрация доп. соглашения')}<div class="modal-b"><div class="mform">
    <div class="field req"><span class="flabel">Номер доп. соглашения</span><input id="dsno" placeholder="ДС-…"></div>
    <div class="field req"><span class="flabel">Дата</span><input id="dsdate" type="date" value="${TODAY}"></div>
    <div class="field col-span"><div class="section-note">Основание — постановление Кабинета Министров ${esc((app.resolution||{}).no||'—')} от ${esc((app.resolution||{}).date||'—')}; соглашение оформляет агент либо кредитный агент (п. 96). При регистрации: версия «действует», операции на дату вступления, счётчик реструктуризаций +1.</div></div>
  </div></div><div class="modal-f"><button class="btn btn-secondary" onclick="RS.closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="RS.regDS('${appId}','${calcId||''}')">Зарегистрировать</button></div></div>`);
}
/* Единственное место в оболочке, которое зовёт дверь CreditSide.restructureApplied (ADR-0096,
   issues/03) — раньше applyEntryOps писал app.ops мимо двери, теперь пишущий путь один.
   Одно ДС на кредит; регистрируется своими гейтами и своей датой вступления. Оболочка (модалка)
   отдаёт номер и дату, а решение принимает ядро — иначе сторожу пришлось бы поднимать DOM. */
function regDS(appId, calcId, fields){
  const app=appById(appId);
  const calc=requireCalc(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return {ok:false, reasons:['Не указан расчёт']}; }
  const src = fields || { no:(document.getElementById('dsno').value||'').trim(),
                          date:(document.getElementById('dsdate').value||'').trim() };
  const no=(src.no||'').trim(), date=(src.date||'').trim();
  if(!no||!date){ toast('Номер и дата обязательны (Р-8)','err'); return {ok:false, reasons:['Номер и дата обязательны']}; }
  if(calc.dsRef){ toast('По этому траншу ДС уже зарегистрировано','err'); return {ok:false, reasons:['ДС уже зарегистрировано']}; }
  const tranche=calcTrancheOf(calc), credit=creditById(calc.creditId);
  if(!tranche||!credit){ toast('Транш-источник расчёта не найден','err'); return {ok:false, reasons:['Транш не найден']}; }
  const dg=driftGate(app, date);
  if(!dg.ok){ toast('Ступень 2 порога расхождения — требуется новая позиция комитета (РС-26)','err');
              return {ok:false, reasons:['Ступень 2 порога расхождения']}; }
  const r=run(app, date, calc.id);
  const ds={ no, date, app, sourceTranche:tranche, credit, transferSum:r.transferSum,
             principalPart:r.principalPart, parts:r.parts, conditions:toConditions(calc.version?calc.version.params:{}) };
  const res=CreditSide.restructureApplied(ds);
  if(!res.ok){ toast(res.reasons.join('; '),'err'); return res; }
  if(!app.agreements) app.agreements=[];
  app.agreements.push({ no, date, creditId:credit.id, appId:app.id, calcIds:[calc.id],
                        transferSum:ds.transferSum, sourceTrancheId:tranche.id, conditions:ds.conditions });
  calc.dsRef=no;
  fixFact(app, date, calc.id, ds.transferSum);
  if(!app.ds) app.ds={ no, date, transferSum:ds.transferSum, sourceTrancheId:tranche.id, conditions:ds.conditions, fact:calc.fact };
  const cov=dsCoverage(app);
  if(cov.ok && !app.outcome && app.resolution) app.outcome = app.resolution.decision==='изм'?'изм':'одобрена';
  app._t=date;
  H(app,'Доп. соглашение '+no+' зарегистрировано по кредиту '+credit.no+'. Перенесено '+fmt(ds.transferSum)+' на транш '+res.tranche.no+'. Счётчик реструктуризаций +1.',state.role);
  if(credit.collProc){ app.automation.push({when:date,kind:'unpause',text:'Оформление завершено — пауза снята штатно, взыскание закрыто по кредиту '+credit.no}); }
  if(typeof document!=='undefined') closeModal();
  toast('Доп. соглашение зарегистрировано','ok'); render();
  return res;
}
/* Снятие расчёта с оформления — второй из двух допустимых ответов (первый — регистрация ДС).
   Основание обязательно: «закрыто, потому что промолчали» неотличимо от забытого кредита. */
function excludeCalc(appId, calcId, reason){
  if(!guard('regDS')) return false;
  const app=appById(appId), calc=calcById(app, calcId);
  if(!calc){ toast('Расчёт не найден','err'); return false; }
  if(calc.dsRef){ toast('По этому траншу ДС уже зарегистрировано — снять нельзя','err'); return false; }
  if(!reason || !String(reason).trim()){ toast('Снятие расчёта с оформления требует основания','err'); return false; }
  calc.excluded={ reason:String(reason).trim(), date:TODAY, by:state.role };
  app._t=TODAY;
  H(app,'Расчёт по траншу '+((calcTrancheOf(calc)||{}).no||calcId)+' снят с оформления: '+calc.excluded.reason,state.role,'warn');
  render(); return true;
}
/* Покрытие оформления: ответ дан по каждому расчёту либо не дан. Молчание — не «нет». */
function dsCoverage(app){
  const list=app.calcs||[];
  const done=list.filter(c=>c.dsRef).map(c=>c.id);
  const excluded=list.filter(c=>!c.dsRef && c.excluded).map(c=>c.id);
  const pending=list.filter(c=>!c.dsRef && !c.excluded).map(c=>c.id);
  return { done, excluded, pending, ok: list.length>0 && pending.length===0 && done.length>0 };
}

function addKind(){
  const name=(document.getElementById('nkname').value||'').trim(); if(!name){ toast('Название обязательно','err'); return; }
  const rationale=(document.getElementById('nkrat').value||'').trim();
  if(!rationale){ toast('Обоснование обязательно: вид заводится под п. 89 пп. 5 как обоснованное предложение (РС-33)','err'); return; }
  const params=[...document.querySelectorAll('.npk:checked')].map(x=>x.value);
  const docs=(document.getElementById('nkdocs').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const dispositions=[...document.querySelectorAll('.ndk:checked')].map(x=>x.value);
  const limits=(document.getElementById('nklim').value||'').trim();
  const id='X'+(state.kinds.filter(k=>!isNormKind(k)).length+1)+'_'+Date.now().toString(36);
  state.kinds.push({id,name,origin:'иное',point:'89 пп. 5',rationale,params,docs,allowedDispositions:dispositions,limits});
  closeModal(); toast('Вид создан с происхождением «иное» — доступен в заявках','ok'); render();
}
/* Удалять можно только своё: нормативная запись — цитата, не настройка (ИР-14). */
function dropKind(kindId){
  if(!guard('manageDict')) return;
  const k=kindById(kindId); if(!k) return;
  if(isNormKind(k)){ toast('Вид установлен нормой (п. '+k.point+') — удалить нельзя','err'); return; }

  if(used){ toast('Вид используется заявкой '+used.id+' — удалить нельзя','err'); return; }
  state.kinds=state.kinds.filter(x=>x.id!==kindId);
  toast('Вид удалён','ok'); render();
}
