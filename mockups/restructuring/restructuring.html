   вычисляется: гейт работает по первому и поднимает флаг projectUnchecked («п. 34 не проверен»).
   Жёстко блокировать нельзя — атрибута нет у мигрированных кредитов. */
function rateFloorFor(origRate, date, projectKind){
  const rec=normAt('rateFloor', date);
  const half=round2((Number(origRate)||0)*rec.value);
  const projRec=normAt('rateFloorProject', date);
  const row=projectKind ? (projRec.value||[]).find(v=>v.kind===projectKind) : null;
  const projFloor = row && row.pct!=null ? row.pct : null;
  const floor = projFloor!=null ? Math.max(half, projFloor) : half;
  return { floor, half, projFloor, projectKind:projectKind||null, projectRow:row||null,
           projectUnchecked: projFloor===null, rec, projRec };
}

/* дедлайн активной стадии (Р-7), сроки — из норма-справочника, не литералы.
   РС-34: срок 70 к.д. по п. 18 Порядка меряется от отправки письма ДО РЕШЕНИЯ и внутренних
   этапов не различает — значит он один и тот же на стадиях «письмо направлено», «заключение
   уполномоченного органа» и «проект решения КМ» (idx 3…5), а собственных регламентных сроков
   у этих трёх стадий НЕТ: норма их не устанавливает, а выдуманный срок дал бы флаг просрочки
   по правилу, которого не существует. */
function deadline(app){
  const st = stageOf(app); if(st.closed) return null;
  if(st.idx===1) { const rec=normAt('deadlineAnalysis',app.regDate); const due=addCalDays(app.regDate,rec.value.n); return mkDl(rec,app.regDate,due); }
  if(st.idx===2) { if(app.committee&&app.committee.date){ const rec=normAt('deadlineLetter',app.committee.date); const due=addWorkDays(app.committee.date,rec.value.n); return mkDl(rec,app.committee.date,due);} return null; }
  if(st.idx>=3 && st.idx<=5) { if(app.letterSent&&app.letterSent.date){ const rec=normAt('deadlineDecision',app.letterSent.date); const due=addCalDays(app.letterSent.date,rec.value.n); return mkDl(rec,app.letterSent.date,due);} return null; }
  return null;
}
function mkDl(rec,anchor,due){ const rem=daysBetween(TODAY,due);
  const calKnown = rec.value.unit!=='р.д.' || (calendarYearKnown(anchor.slice(0,4)) && calendarYearKnown(due.slice(0,4)));
  return {name:rec.value.label,limit:rec.value.n,unit:rec.value.unit,anchor,due,remaining:rem,overdue:rem<0,calKnown,rec}; }

/* гейты (Р-19: производные предикаты) */
function packetGate(app){ const req=requiredDocs(app); const missing=req.filter(d=>!app.packetDocs[d]); return {ok:missing.length===0 && req.length>0, missing, req}; }
function conclGate(app){ const pending=app.conclusions.filter(c=>!c.visa).map(c=>c.dept); return {ok:pending.length===0 && app.conclusions.length>0, pending}; }
/* Три акта после письма (РС-34, ADR-0107), у каждого свои реквизиты и свой гейт.
   Заключение уполномоченного органа (пп. 87/88) — «возможно» либо «отказ»; отрицательное
   закрывает заявку и до Кабмина не доходит. Согласование профильного комитета ЖК (п. 82)
   обязательно для регистрации постановления. Под постановлением КМ (п. 89) регистрируется ДС —
   именно его исход, а не исход заключения, читает гейт «решение → оформление» (ИР-12). */
function conclusionGate(app){ const c=app.conclusion||{}; return {ok:!!c.outcome && !!(c.no&&c.no.trim()) && !!c.date}; }
function zkGate(app){ const z=app.zk||{}; const c=app.conclusion||{};
  return {ok: c.outcome==='возможно' && !!(z.no&&z.no.trim()) && !!z.date, needConclusion: c.outcome!=='возможно'}; }
function resolutionGate(app){ const r=app.resolution||{}; const z=app.zk||{};
  return {ok: !!r.decision && !!(r.no&&r.no.trim()) && !!r.date && !!(z.no&&z.no.trim()), needZk: !(z.no&&z.no.trim())}; }
function dsGate(app){ const c=dsCoverage(app); return { ok:c.ok, pending:c.pending }; }

/* остаток на новых условиях (демо-упрощение): тело то же, влияет срок/ставка на maturity.
   Срок берётся с расчёта ЭТОГО кредита, не с двери app.version (та дверь отказывает при 2+
   расчётах, ИР-16) — тот же приём адресации, что limitsGateApp уже применяет к пределам. */
function newMaturity(app,cr){
  const calc=(app.calcs||[]).find(c=>c.creditId===cr.id && !c.excluded);
  const fixed=calc && calc.dsRef && app.agreements ? app.agreements.find(d=>d.no===calc.dsRef) : null;
  // Зарегистрированное ДС несёт условия МАССИВОМ conditions (шов кредитного модуля), черновик —
  // плоскими params версии: свёртка condObj равняет два входа в один вокабуляр реестра PARAMS.
  const params=fixed ? condObj(fixed.conditions) : (calc && calc.version && calc.version.params);
  const term=(params&&params.term)||cr.terms.term;
  return addCalMonths(app.regDate, term);              // срок в МЕСЯЦАХ — календарных, не по 30 дней
}
/* Устарелость снимка покрытия (issues/04 реш.2: «покрытие — чужой ответ, не свой расчёт»), тот
   же приём, что COLL_SNAPSHOT_STALE_DAYS/collSnapshotStale в collection.html — независимый
   демо-порог этого домена, не то же число по смыслу. Устаревший снимок гейт не пропускает молча
   (тот же принцип, что не даёт «сироте 0,01 сома» E2E-13/14 пройти на устаревших данных). */
const COVER_SNAPSHOT_STALE_DAYS = 60;
const coverSnapshotAge = cr => daysBetween((cr.coverSnapshot||{}).date||TODAY, TODAY);
const coverSnapshotStale = cr => !cr.coverSnapshot || coverSnapshotAge(cr) > COVER_SNAPSHOT_STALE_DAYS;
function coverGate(app,cr){
  const snap = cr.coverSnapshot||{};
  const stale = coverSnapshotStale(cr);
  const required = snap.required, cover = snap.cover;
  const coverOk = !stale && cover!=null && required!=null && cover >= required;
  const mat = newMaturity(app,cr);
  // Тот же приём адресации, что newMaturity двумя строками выше: срок берётся с расчёта ЭТОГО
  // кредита, а не с двери app.version (отказывает при 2+ расчётах, ИР-16) — иначе возрастной гейт
  // техники ломался бы для исходного, уже готового кредита, как только в охват входит второй расчёт.
  const ageCalc=(app.calcs||[]).find(c=>c.creditId===cr.id && !c.excluded);
  const ageFixed=ageCalc && ageCalc.dsRef && app.agreements ? app.agreements.find(d=>d.no===ageCalc.dsRef) : null;
  const ageParams=ageFixed ? condObj(ageFixed.conditions) : (ageCalc && ageCalc.version && ageCalc.version.params);
  const ageTerm=(ageParams&&ageParams.term)||cr.terms.term;
  const ageOk = !cr.tech || (cr.techAgeYears + Math.ceil(ageTerm/12) <= cr.techMaxAge);
  const insured = daysBetween(mat, cr.insuredUntil) >= 0;
  const waived = !!(app.waiver && app.waiver.granted);
  const ok = (coverOk && ageOk && insured) || waived;
  return {required,cover,coverOk,ageOk,insured,waived,ok,maturity:mat,stale,snapshotDate:snap.date,source:snap.source};
}
/* агрегат гейта обеспечения по всем кредитам заявки */
function coverGateApp(app){ const rows=app.creditIds.map(id=>({cr:creditById(id),g:coverGate(app,creditById(id))})); const ok=rows.every(r=>r.g.ok); return {rows,ok}; }

/* Пределы (issues/04 реш.2/3, ADR-0099, ИР-10, РС-19): жёсткий гейт, без waiver — срок и ставка
   новых условий сверяются с норма-справочником на дату операции. База предела срока — ОСТАТОК
   ЗАДОЛЖЕННОСТИ по кредиту (cr.balance, тот же приём, что coverGate несколькими строками выше),
   а не сумма конкретного переноса (РС-37: так говорит п. 90 дословно). Пол ставки — больший из
   двух (РС-35): 50 % от первоначальной и минимум по виду проекта (п. 34). */
function limitsGate(params, credit, date){
  const term=Number(params&&params.term)||0;
  const rate=(params&&params.rate!=null) ? Number(params.rate) : null;
  const cap=termCapFor(credit.balance, date), floor=rateFloorFor(credit.terms.rate, date, credit.projectKind);
  const termOk = term>0 && term<=cap.months;
  const rateOk = rate!=null && rate>=floor.floor;
  const messages=[];
  if(!termOk) messages.push('Срок '+term+' мес. превышает предел '+cap.months+' мес. при остатке задолженности '+fmt(credit.balance)+' ('+normNote(cap.rec)+')');
  if(!rateOk) messages.push('Ставка '+(rate==null?'не задана':rate+'%')+' ниже минимума '+floor.floor+'% ('+normNote(floor.rec)+(floor.projFloor!=null?'; вид проекта — '+floor.projFloor+'%, '+normNote(floor.projRec):'')+')');
  return { ok:termOk&&rateOk, termOk, rateOk, cap:cap.months, floor:floor.floor,
           half:floor.half, projFloor:floor.projFloor, projectRow:floor.projectRow, projectUnchecked:floor.projectUnchecked,
           capRec:cap.rec, floorRec:floor.rec, projRec:floor.projRec, messages };
}
/* Пределы — гейт КРЕДИТА, а не заявки: пол ставки от первоначальной ставки кредита (п. 34,
   п. 92), длина графика от остатка задолженности по кредиту (п. 90). Каждый расчёт несёт свои
   параметры и свой кредит, поэтому строк столько, сколько расчётов, и сообщение называет кредит:
   «не проходит» без адреса на многокредитной заявке нечинимо. */
function limitsGateApp(app){
  const rows=(app.calcs||[]).map(c=>{
    const credit=creditById(c.creditId);
    const fixed=c.dsRef && app.agreements ? app.agreements.find(d=>d.no===c.dsRef) : null;
    const params = fixed ? fixed.params : (c.version && c.version.params);
    const date   = fixed ? fixed.date   : app.regDate;
    if(!credit) return { calcId:c.id, creditNo:'—', g:{ ok:true, pending:true, messages:['Кредит не найден'] } };
    if(!params) return { calcId:c.id, creditNo:credit.no, g:{ ok:true, pending:true,
                         messages:['Условия ещё не выбраны — гейт неприменим до расчёта'] } };
    return { calcId:c.id, creditNo:credit.no, g:limitsGate(params, credit, date) };
  });
  // Нет расчётов — гейт неприменим по той же причине, что и при расчёте без параметров: сверять
  // нечего. Текст тот же, что у строчного случая выше, — «Кредит не выбран» описывал прежний
  // экран с отдельным выбором транша, которого больше нет (fix-round-1).
  if(!rows.length) return { ok:true, pending:true, messages:['Условия ещё не выбраны — гейт неприменим до расчёта'], rows:[] };
  const pending = rows.every(r=>r.g.pending);
  const ok = rows.every(r=>r.g.ok);
  const messages = rows.flatMap(r=>(r.g.messages||[]).map(m=>rows.length>1 ? r.creditNo+': '+m : m));
  return { ok, pending, messages, rows };
}

/* Согласия обеспечителей (issues/04 реш.2, ADR-0098, ИР-8): зеркало чужого домена (Обеспечение) —
   тот же приём, что COLL_PROCS чуть выше по файлу: демо-данные здесь, не вызов чужого API. Жёсткий
   гейт, без waiver (в отличие от покрытия) — по каждому кредиту заявки все обеспечители обязаны
   быть в статусе «согласовано». */
const GUARANTEES = {
  'CR-60540': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-03-15'} ],
  'CR-60541': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-04-20'} ],
  'CR-58120': [],
  'CR-59003': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-06-01'} ],
  'CR-61200': [ {name:'Петров П.П. (поручитель)', status:'запрошено', date:'2026-07-05'} ],  // демо блокировки ИР-8: одно неурегулированное согласие
  /* вторая волна: согласия собраны — иначе жёсткий гейт держал бы заявку в «Оформлении» и
     витрина показывала бы одну и ту же блокировку пятнадцать раз. Пустой список — беззалоговый
     кредит без поручителей, это не «согласий нет», а «спрашивать некого». */
  'CR-62010': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2026-02-10'} ],
  'CR-62011': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-02-26'} ],
  'CR-62012': [],
  'CR-62013': [ {name:'Токтосунов Б.А. (поручитель)', status:'согласовано', date:'2026-02-18'},
                {name:'ОсОО «Ынтымак-Агро» (залогодатель)', status:'согласовано', date:'2026-02-18'} ],
  'CR-62014': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-03-04'} ],
  'CR-62015': [ {name:'Иванов И.И. (поручитель)', status:'согласовано', date:'2026-04-08'} ],
  'CR-62016': [ {name:'Министерство финансов КР (гарантия)', status:'согласовано', date:'2026-02-12'} ],
  'CR-62017': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2026-02-12'} ],
  'CR-62018': [ {name:'ОсОО «Нарын-Инвест» (залогодатель)', status:'согласовано', date:'2025-12-15'} ],
  'CR-62019': [],
  'CR-62020': [ {name:'Асанов Т.К. (поручитель)', status:'согласовано', date:'2026-06-01'} ],
  'CR-62021': [ {name:'ОсОО «Гарант-Строй» (залогодатель)', status:'согласовано', date:'2026-02-02'} ],
  'CR-62022': [ {name:'Токтосунов Б.А. (поручитель)', status:'запрошено', date:'2026-03-20'} ],   // отказ ПКМ — согласие так и осталось незакрытым
  'CR-62023': []
};
function consentGate(creditId){
  const list=GUARANTEES[creditId]||[];
  const pending=list.filter(g=>g.status!=='согласовано').map(g=>g.name);
  return { ok:pending.length===0, list, pending };
}
function consentGateApp(app){
  const rows=(app.creditIds||[]).map(id=>({cr:creditById(id), g:consentGate(id)}));
  const ok=rows.every(r=>r.g.ok);
  return { ok, rows, pending:rows.flatMap(r=>r.g.pending) };
}

/* Гейт прощения (РС-28, ИР-13): жёсткий. Отдельного решения кредитного комитета сверх ДС не
   заводим — комитет высказался по сделке целиком, а решение принял Кабинет Министров. Но ссылки
   «согласно постановлению» мало: в реквизитах акта обязана стоять СУММА прощения либо прямо
   названная база («вся начисленная неустойка по кредиту №…»), иначе прощение необратимо
   уменьшает актив Холдинга по документу, этой суммы не содержавшему. Пеня и проценты прощаются
   одним порядком: различает их статья, а не процедура. */
function forgiveGate(app){
  const rows=(app.dispositions||[]).filter(d=>d.kind==='forgive');
  const sum=round2(rows.reduce((s,d)=>s+d.amount,0));
  if(!rows.length) return { ok:true, applicable:false, sum:0 };
  const r=app.resolution||{};
  const named = !!(r.forgiveSum!=null || (r.forgiveBasis&&String(r.forgiveBasis).trim()));
  return { ok:named, applicable:true, sum, named,
           actSum: r.forgiveSum!=null ? round2(r.forgiveSum) : null,
           basis: r.forgiveBasis||null,
           mismatch: (r.forgiveSum!=null && round2(r.forgiveSum)!==sum) };
}
/* Повторность (РС-32) — СИГНАЛ, не гейт. Начиная с третьей реструктуризации одного кредита
   заявка получает видимый признак; ничего не блокирует и порядка согласования не меняет —
   маршрут установлен нормой (п. 82), надстроить над ним свою ступень Холдинг не вправе.
   На категорию риска счётчик влияет только через комитет (ADR-0065). Порог — настройка. */
const REPEAT_SIGNAL_FROM = 3;
function repeatSignal(app){
  const rows=(app.creditIds||[]).map(id=>creditById(id)).filter(Boolean)
    .filter(cr=>(cr.restructCount||0)+1 >= REPEAT_SIGNAL_FROM);
  return { on:rows.length>0, credits:rows.map(cr=>({no:cr.no, n:(cr.restructCount||0)+1})) };
}

/* активная заявка на кредите (Р-2): любая незакрытая заявка, кроме текущей */
function activeAppOnCredit(creditId, exceptAppId){
  return state.apps.find(a=>a.id!==exceptAppId && !stageOf(a).closed && a.creditIds.includes(creditId));
}
function canAdvance(app){
  const st=stageOf(app);
  if(st.idx===0) return {to:'Анализ', ok:packetGate(app).ok, why:'Пакет документов неполон'};
  // Охват меряется РАСЧЁТАМИ, а не creditIds: последний — производное с откатом на сид, и заявка
  // без единого расчёта проходила гейт, показывая комитету кредит, для которого ничего не считали.
  if(st.idx===1) return {to:'Комитет', ok:conclGate(app).ok && (app.calcs||[]).length>0, why:'Не все заключения завизированы / пустой охват'};
  return null;
}

/* права (Р-17) */
function canX(action){ return (RIGHTS[state.role]||[]).includes(action); }
function guard(action){ if(!canX(action)){ toast('Роль «'+state.role+'» не может выполнить это действие','err'); return false; } return true; }

/* ================= ФИНАНСОВОЕ ЯДРО ЗАЯВКИ — AppSide (issues/02: ядро — таблица позиций,
   не набор чисел; порядок и происхождение выражены данными, а не чертой текста). Приватно
   для файла (РС-9 — граница внутри файла, не сетевой шов): «приватно» значит вне RS-экспорта
   (задача 8), не отдельный модуль/замыкание — по духу карты, лишняя абстракция не нужна. */

/* Срез/факт — один счётчик на любую дату (issues/02 реш.2). Шесть статей — со среза транша
   (tranche.debt, демо не считает реальное начисление во времени, см. «Не-цели» карты: месяц =
   30 дней, движок не прод); седьмая (principal) выводится CreditSide.principalAt — единственная
   статья, которая в этом демо реально зависит от даты. */
function debtAt(tranche, date){
  const rows = (tranche.debt||[]).map(d=>({ article:d.article, urgency:d.urgency, amount:d.amount, since:d.since, disputed:!!d.disputed }));
  const { over, cur } = CreditSide.principalAt(tranche, date);
  if(over>0) rows.push({ article:'principal', urgency:'over', amount:over, since:tranche.plannedDate });
  if(cur>0)  rows.push({ article:'principal', urgency:'cur',  amount:cur,  since:tranche.plannedDate });
  return rows;
}

/* Режим начисления по статье (РС-27, ADR-0106) — ТАБЛИЦА С ДАТАМИ ВСТУПЛЕНИЯ, а не флаг на
   кредите: механизм ACCRUAL_MODES/accrualModeOf кредита (ADR-0013 §3). Смена правила заводится
   новой записью с новой датой, сделки прошлых лет продолжают считаться по режиму, действовавшему
   тогда. Пеня — терминальная статья: на неё не начисляют и она сама начислений не порождает;
   капитализированная пеня выделяется ОТДЕЛЬНОЙ СУММОЙ (п. 89 пп. 4) и в тело не сливается,
   потому ставке на ней взяться неоткуда. Накопленное родилось из уступки — начислять на него
   санкцию значит наказывать за уступку, которую Холдинг сам и дал. */
const ACCRUAL_MODES = [
  { article:'principal',      from:'2000-01-01', mode:{interest:true,  penalty:true },  basis:'обычная механика кредита' },
  { article:'interest',       from:'2000-01-01', mode:{interest:false, penalty:true },  basis:'просроченный процент даёт пеню' },
  { article:'accInterest',    from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106' },
  { article:'accPenalty',     from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106' },
  { article:'penalty',        from:'2026-01-01', mode:{interest:false, penalty:false }, basis:'РС-27 / ADR-0106 — пеня на пеню не начисляется никогда' }
];
function accrualModeOf(article, date){
  const recs=ACCRUAL_MODES.filter(r=>r.article===article && r.from<=date);
  if(!recs.length) return { mode:{interest:false,penalty:false}, basis:'режим не заведён', from:null };
  return recs.reduce((a,b)=> b.from>a.from ? b : a);
}
const accrualEmpty = (article,date) => { const m=accrualModeOf(article,date).mode; return !m.interest && !m.penalty; };

/* База — позиции с тремя состояниями строки (issues/02 реш.1): включена · снята куратором
   (blockedBy пуст, чекбокс живой) · заблокирована видом (чекбокс мёртв). Список статей,
   разрешённых видом, заводит issues/04 (allowedDispositions) — тикет 07, сюда 06 не блокирован
   этим решением: честно не подставляем номер, blockedBy по виду всегда null, не выдумка.
   Спорная пеня (issues/01 реш.3, поле disputed) — та же колонка blockedBy='disputed', галка
   мертва, строка всегда видна (ИР-6: невидимая строка читалась бы как «пени нет»).
   Финансовое ядро адресует РАСЧЁТ (задача 2, РС-42/ADR-0114), не заявку — заявка держит их
   список. app.calcTranche — дверь к транш-источнику единственного расчёта, живёт до задачи 6. */
/* Принимает расчёт; заявку принимает тоже — но только однорасчётную, через ту же дверь
   requireCalc. Разной логики у двух случаев нет, есть один вход и одно разрешение адреса. */
function asCalc(x, calcId){
  if(!x) return null;
  return x.trancheId ? x : requireCalc(x, calcId);
}
function defaultBase(x, date, calcId){
  const calc = asCalc(x, calcId); if(!calc) return [];
  const tranche = calcTrancheOf(calc); if(!tranche) return [];
  return debtAt(tranche, date).map(row => ({
    ...row,
    included: row.urgency==='over' && !row.disputed,
    blockedBy: row.disputed ? 'disputed' : null
  }));
}
/* ДЕЙСТВУЮЩАЯ БАЗА РАСЧЁТА — одна дверь на всех потребителей (run, scopeStrip,
   dispositionsBar, paramsSection, resultSection). До первого живого действия куратора calc.base пуст, и база
   считается на лету из долга транша (Р-19, ensureBaseDispositions ниже) — умолчание нигде не
   хранится. Три независимых пересчёта этого умолчания в трёх экранных функциях уже разошлись
   однажды: секция брала умолчание через дверь заявки (defaultBase(app,…)), которая на двух
   расчётах молчит, а шапка и итоговая полоса читали calc.base сырым — вкладка расчёта второго
   транша рисовала пустую базу и печатала «база 0» (ревью 12.08.2026). Дверь адресуется РАСЧЁТОМ,
   не заявкой: адрес суммы известен вызывающему, домысливать его здесь нечем. */
function calcBaseOf(app, calc, date){
  if(!calc) return [];
  if(calc.base && calc.base.length) return calc.base;
  return defaultBase(calc, date || (app && app.ds ? app.ds.date : TODAY));
}
/* Распоряжение — линия на позиции, с суммой и сроками (РС-38). Линий на позиции может быть
   НЕСКОЛЬКО (РС-43): акт вправе часть суммы капитализировать, часть распределить, остальное
   простить — формы п. 89 складываются, и запрет «одно распоряжение на позицию» вынуждал бы
   куратора бросить непокрытое в перенос просроченным, чего акт не говорил. Инвариант —
   Σ сумм линий с распоряжением ≤ сумме позиции; остаток «без распоряжения» получается
   вычитанием, второй сущности не заводим. Линия адресуется номером seq (1-базовый, свой на
   каждой позиции): номер держится в данных и переживает перерисовку, в отличие от индекса
   массива и от сгенерированного на лету id — умолчание считается на лету (Р-19) и id менялся
   бы под руками у обработчика. Сроки — позиции графика производного транша: {mode:'all'}
   (умолчание, следует за сроком само) либо {mode:'range',from,to} (1-базовые, включительно).
   null не используется: «весь график» — осмысленное значение, а не отсутствие значения. */
const allPeriods = () => ({ mode:'all' });
function defaultDispositions(base){
  return base.filter(r=>r.included).map(r => ({ article:r.article, urgency:r.urgency, seq:1, kind:'none', amount:r.amount, periods:allPeriods() }));
}
function dispositionsFor(dispositions, article, urgency){
  return (dispositions||[]).filter(d=>d.article===article && d.urgency===urgency)
                           .sort((a,b)=>(a.seq||1)-(b.seq||1));
}
/* Первая линия позиции. Годится там, где линия заведомо одна (сев демо-заявок, ярлык вида в
   готовом ДС); там, где решается судьба суммы, читается ВЕСЬ список — иначе вторая линия
   молча пропадает из конвейера. */
function dispositionFor(dispositions, article, urgency){
  return dispositionsFor(dispositions, article, urgency)[0] || null;
}
/* Занятая распоряжениями часть позиции. Линия 'none' в сумму не идёт: «без распоряжения» —
   это и есть остаток, и считать его дважды значит закрыть позицию для второй линии. */
function dispositionsSum(dispositions, article, urgency, except){
  return round2(dispositionsFor(dispositions, article, urgency)
    .filter(d=>d.kind!=='none' && d!==except).reduce((s,d)=>s+d.amount,0));
}
/* Адрес линии для сеттеров: тройка позиции плюс номер. Номер необязателен и опущенный значит
   «единственная линия»: пока позиция несёт одну линию, старый адрес тройкой остаётся верным
   (так её зовут смоук и демо-сев). На позиции с двумя линиями безномерный адрес ничего не
   находит — молча править первую попавшуюся значит угадывать за куратора. */
function pickDisp(calc, article, urgency, seq){
  const lines = dispositionsFor(calc.dispositions, article, urgency);
  if(seq==null || seq==='') return lines.length===1 ? lines[0] : null;
  return lines.find(d=>Number(d.seq||1)===Number(seq)) || null;
}
/* Материализация базы/распоряжений при первом живом действии куратора (issues/02 реш.1/4,
   тикет 07 — честная дыра #2 из Answer тикета 06). До первого клика calc.base/calc.dispositions
   пустые — панель считает defaultBase/defaultDispositions на лету, не хранит (Р-19); первое
   переключение строки или смена распоряжения обязано зафиксировать снимок в расчёте, иначе
   правка потеряется на следующем рендере, откатившись к умолчанию. Дата среза берётся у
   заявки через __app (attachCalc, задача 2) — расчёт её не дублирует. */
function ensureBaseDispositions(x, calcId){
  const calc = asCalc(x, calcId); if(!calc) return null;
  const app = calc.__app || null;
  const date = (app && app.ds) ? app.ds.date : TODAY;
  if(!calc.base || !calc.base.length) calc.base = defaultBase(calc, date);
  if(!calc.dispositions || !calc.dispositions.length) calc.dispositions = defaultDispositions(calc.base);
  return calc;
}
/* Переключение строки — «включена» ↔ «снята куратором» (issues/02 реш.1). Спорная пеня
   (blockedBy='disputed') не переключаема — мёртвая галка это состояние, а не UI-заглушка
   (ИР-6). Снятие строки убирает её распоряжение (issues/02 реш.4: распоряжение живёт только
   на включённой строке); включение заводит распоряжение kind:'none' на всю сумму — то же
   умолчание, что defaultDispositions даёт при первом расчёте. */
function toggleBaseRow(appId, article, urgency, calcId){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const row = calc.base.find(r=>r.article===article && r.urgency===urgency);
  if(!row || row.blockedBy) return;
  row.included = !row.included;
  if(row.included){
    if(!dispositionFor(calc.dispositions, article, urgency))
      calc.dispositions.push({article,urgency,seq:1,kind:'none',amount:row.amount,periods:allPeriods()});
  } else {
    calc.dispositions = calc.dispositions.filter(d=>!(d.article===article && d.urgency===urgency));
  }
  app._t=TODAY; render();
}
/* Смена распоряжения на строке (issues/02 реш.4). Значения вне allowedDispositions(app) —
   мёртвые пункты списка с подписью «вид не разрешает», та же механика дохлой галки решения 1
   (issues/02: «а не второй способ говорить то же самое») — сервер-сторона всё равно отбивает
   запрещённое значение молча, а не доверяет disabled-атрибуту разметки. */
function setDisposition(appId, article, urgency, kind, calcId, seq){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  if(kind!=='none' && !allowedDispositions(app).has(kind)){ toast('Вид не разрешает это распоряжение','err'); return; }
  const d = pickDisp(calc, article, urgency, seq); if(!d) return;
  /* Один и тот же вид дважды на позиции (РС-43) допускается только там, где у распоряжения есть
     СРОКИ: две линии распределения — это два интервала графика, разный смысл. Прощение и
     капитализация процентов сроков не несут, и вторая линия того же вида была бы первой,
     записанной двумя числами. */
  if(kind!=='none' && !dispositionHasPeriods(kind, article)
     && dispositionsFor(calc.dispositions, article, urgency).some(x=>x!==d && x.kind===kind)){
    toast('Такое распоряжение на позиции уже есть — правьте его сумму','err'); return;
  }
  /* Линия «без распоряжения» в занятую часть позиции не входит, поэтому при смене вида её сумма
     может оказаться больше свободного остатка. Подрезать молча нельзя (РС-38): куратор называет
     сумму сам. */
  const free = round2(row0(calc, article, urgency) - dispositionsSum(calc.dispositions, article, urgency, d));
  if(kind!=='none' && round2(d.amount) > free+0.005){
    toast('Свободный остаток позиции — '+fmt(free)+'; уменьшите сумму линии','err'); return;
  }
  d.kind = kind;
  if(!dispositionHasPeriods(kind, article)) d.periods = allPeriods();   // сроки живут только там, где есть безставочная сумма (РС-38)
  app._t=TODAY; render();
}
function row0(calc, article, urgency){
  const r=(calc.base||[]).find(x=>x.article===article && x.urgency===urgency);
  return r ? round2(r.amount) : 0;
}
/* Вторая линия на позиции (РС-43). Заводится суммой свободного остатка — это единственное
   значение, которое здесь не выдумано: всё, чем ещё можно распорядиться. Позиция, занятая
   распоряжениями целиком, второй линии не получает — сначала уменьшить сумму первой. */
function addDisposition(appId, article, urgency, calcId){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const row = calc.base.find(r=>r.article===article && r.urgency===urgency);
  if(!row || !row.included || row.blockedBy) return;
  const free = round2(row.amount - dispositionsSum(calc.dispositions, article, urgency));
  if(free<=0.005){ toast('Позиция распределена целиком — уменьшите сумму существующего распоряжения','err'); return; }
  const lines = dispositionsFor(calc.dispositions, article, urgency);
  const seq = lines.reduce((m,d)=>Math.max(m, Number(d.seq||1)), 0) + 1;
  calc.dispositions.push({article, urgency, seq, kind:'none', amount:free, periods:allPeriods()});
  app._t=TODAY; render();
}
/* Убрать линию. Последнюю не убираем: у включённой позиции распоряжение есть всегда, пусть и
   «без распоряжения» — это состояние, а не отсутствие строки (то же правило, что у мёртвой
   галки ИР-6). Номера прочих линий не пересчитываются: seq — адрес, а не порядковый номер
   в списке, и перенумерация увела бы обработчики соседних линий на чужие суммы. */
function removeDisposition(appId, article, urgency, calcId, seq){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const lines = dispositionsFor(calc.dispositions, article, urgency);
  if(lines.length<2){ toast('Это единственное распоряжение позиции — переключите его на «без распоряжения»','err'); return; }
  const d = pickDisp(calc, article, urgency, seq); if(!d) return;
  calc.dispositions = calc.dispositions.filter(x=>x!==d);
  app._t=TODAY; render();
}
/* Сроки спрашиваются только у распоряжений, рождающих БЕЗСТАВОЧНУЮ сумму (РС-38): распределение
   и капитализация пени. У капитализации процентов сумма вливается в тело и живёт сроками тела,
   у прощения суммы к уплате не остаётся вовсе — спрашивать не о чем. Проверка по состоянию
   распоряжения и статье строки, а не по тексту разметки. */
function dispositionHasPeriods(kind, article){
  if(kind==='spread') return true;
  return kind==='cap' && (article==='penalty' || article==='accPenalty');
}
/* Сумма распоряжения (РС-38): 0 < amount ≤ сумма позиции. Нарушение — тост, НЕ тихая подстановка
   ближайшего допустимого: подставить значение значит выдумать решение куратора. Остаток позиции
   (позиция − amount) уходит в перенос своей статьёй как «без распоряжения», второй сущности не
   заводим. */
function setDispAmount(appId, article, urgency, value, calcId, seq){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const row = calc.base.find(r=>r.article===article && r.urgency===urgency); if(!row) return;
  const d = pickDisp(calc, article, urgency, seq); if(!d) return;
  const v = round2(Number(String(value).replace(',','.')));
  if(!isFinite(v) || v<=0){ toast('Сумма распоряжения должна быть больше нуля','err'); render(); return; }
  // Потолок линии — позиция МИНУС суммы прочих линий (РС-43). На единственной линии это прежний
  // потолок «не больше позиции», на второй — ровно свободный остаток, и он назван в тосте.
  const other = dispositionsSum(calc.dispositions, article, urgency, d);
  const free = round2(round2(row.amount) - other);
  if(v > free+0.005){
    toast(other>0 ? 'Свободный остаток позиции — '+fmt(free)+' (прочие распоряжения заняли '+fmt(other)+')'
                  : 'Сумма распоряжения больше суммы позиции ('+fmt(row.amount)+')', 'err');
    render(); return;
  }
  d.amount = v;
  app._t=TODAY; render();
}
/* Сроки распоряжения (РС-38/РС-40): режим «весь график» либо интервал позиций «с — по».
   Переключение на 'all' СТИРАЕТ интервал, а не прячет его тенью — иначе куратор возвращает
   режим и получает границы, о которых уже забыл. Выход за длину плана здесь не подрезается:
   молчаливая подрезка = выдуманное решение (РС-40), расхождение ловит ИР-15 в validateDS и
   показывает дверь. */
function setDispPeriods(appId, article, urgency, mode, from, to, calcId, seq){
  if(!guard('editBase')) return; const app=appById(appId);
  const calc = ensureBaseDispositions(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const d = pickDisp(calc, article, urgency, seq); if(!d) return;
  if(!dispositionHasPeriods(d.kind, article)){ toast('У этого распоряжения сроков нет — сумма живёт сроками тела либо не подлежит уплате','err'); return; }
  if(mode!=='range'){ d.periods = allPeriods(); app._t=TODAY; render(); return; }
  const prev = (d.periods && d.periods.mode==='range') ? d.periods : {};
  const f = Math.trunc(Number(from!=null && from!=='' ? from : prev.from)) || 1;
  const t = Math.trunc(Number(to!=null && to!=='' ? to : prev.to)) || f;
  if(f<1){ toast('Первая позиция интервала — не меньше 1','err'); render(); return; }
  if(t<f){ toast('Конец интервала раньше начала','err'); render(); return; }
  d.periods = { mode:'range', from:f, to:t };
  app._t=TODAY; render();
}

function scopeTranches(app){
  return (app.calcs||[]).map(c=>({ cr:creditById(c.creditId), t:calcTrancheOf(c), calc:c }))
                        .filter(x=>x.cr && x.t);
}
/* Кандидаты — открытые траншы с остатком по кредитам, уже названным в охвате, ПЛЮС траншы
   прочих кредитов того же субъекта: заявка вправе охватывать несколько кредитов одного лица
   (РС-2). Субъект ищется по ИНН — тем же ключом, что naFillCredits (:3202); поля subjectKey у
   кредита нет, оно живёт на транше. Вошедшие вычитаются: второй расчёт на тот же транш
   запрещён (ИР-16). */
function trancheCandidates(app){
  const taken=new Set((app.calcs||[]).map(c=>c.trancheId));
  const list=[];
  state.credits.forEach(cr=>{
    const own = (app.creditIds||[]).includes(cr.id) || cr.inn===app.inn;
    if(!own) return;
    (cr.tranches||[]).forEach(t=>{
      if(t.closed || taken.has(t.id) || round2(balanceAt(t,TODAY))<=0) return;
      list.push({cr,t});
    });
  });
  return list;
}
function addTrancheToScope(appId, trancheId){
  if(!guard('editVersion')) return;
  if(!trancheId){ toast('Выберите транш','err'); return; }
  const app=appById(appId);
  const cr=creditOfTranche(trancheId); if(!cr){ toast('Транш не найден','err'); return; }
  const t=(cr.tranches||[]).find(x=>x.id===trancheId);
  // Заявка — обращение одного заёмщика: кредит чужого ИНН в охват не входит (РС-2).
  if(cr.inn!==app.inn){ toast('Кредит принадлежит другому заёмщику','err'); return; }
  const busy=activeAppOnTranche(trancheId, appId);
  if(busy){ toast('Транш уже в активной заявке '+busy.id+' (ИР-1)','err'); return; }
  const had=(app.calcs||[]).some(c=>c.trancheId===trancheId);
  const calc=attachCalc(app, t);
  if(!calc){ toast('Кредит транша не найден','err'); return; }
  if(!calc.version) calc.version=draftVersion(cr,{});
  /* Срез уже зафиксирован письмом — новый расчёт обязан получить СВОЙ, иначе он выпадает из
     фильтров appDrift/driftGate и ступень 2 считается по неполной заявке молча (ревью
     12.08.2026). Дата берётся у заявки — она одна на обращение (спека §2); суммы считаются тем
     же debtAt на ту же дату, что fixCutoff. app.cutoffDate до этой правки только писался. */
  if(!calc.cutoff && app.cutoffDate){
    calc.cutoff = { date: app.cutoffDate, rows: debtAt(t, app.cutoffDate), fixedAt: app.cutoffDate };
    if(app.cutoff) app.cutoff.rows = (app.calcs||[]).filter(c=>c.cutoff && c.cutoff.rows).flatMap(c=>c.cutoff.rows);   // итог, не хранилище
  }
  if(!had){ app._t=TODAY; H(app,'В охват добавлен транш '+t.no+' (кредит '+cr.no+').',state.role); }
  closeModal(); toast('Транш добавлен в охват','ok'); render();
}
/* Снятие транша уносит расчёт целиком — базу, распоряжения, черновик условий (правило 60).
   Действие стоит на полосе, в шаге от стола ввода, и потому спрашивает: отменить его нечем,
   а суммы куратор набивал руками. Отказ по зарегистрированному ДС виден ДО подтверждения —
   спрашивать «уверены?» о том, что всё равно запрещено, значит врать про исход. */
function openDropTranche(appId, calcId){
  if(!guard('editVersion')) return;
  const app=appById(appId), calc=calcById(app, calcId);
  if(!calc){ toast('Расчёт не найден','err'); return; }
  if(calc.dsRef){ toast('По этому траншу зарегистрировано ДС — из охвата не выводится','err'); return; }
  const t=calcTrancheOf(calc), cr=creditById(calc.creditId);
  const base=fmt(rowsTotal(calcBaseOf(app, calc).filter(x=>x.included)));
  modal(`<div class="modal">${mhead('Вывести транш из охвата')}<div class="modal-b">
    <div class="flagline">Расчёт по траншу ${esc(t?t.no:'—')} (кредит ${esc(cr?cr.no:'—')}) будет снят вместе
      с базой переноса ${base} и распоряжениями. Вернуть его можно только заведя заново.</div>
  </div><div class="modal-f"><button class="btn btn-secondary" onclick="RS.closeModal()">Отмена</button>
    <button class="btn btn-danger" onclick="RS.removeTrancheFromScope('${appId}','${calcId}')">Вывести из охвата</button></div></div>`);
}
function removeTrancheFromScope(appId, calcId){
  if(!guard('editVersion')) return;
  const app=appById(appId), calc=calcById(app, calcId);
  if(!calc){ toast('Расчёт не найден','err'); return; }
  if(calc.dsRef){ toast('По этому траншу зарегистрировано ДС — из охвата не выводится','err'); return; }
  const t=calcTrancheOf(calc);
  app.calcs=app.calcs.filter(c=>c.id!==calcId);
  // Выбор экрана мог указывать на снятый расчёт — curCalcOf съедет на первый сам, но оставлять
  // в состоянии мёртвый адрес значит держать ссылку на то, чего нет.
  if(state.curCalc===calcId) state.curCalc=null;
  app._t=TODAY; H(app,'Из охвата выведен транш '+(t?t.no:calcId)+' вместе с расчётом.',state.role);
  closeModal(); toast('Транш выведен из охвата','ok'); render();
}
/* ИР-1 ключуется траншем, а не кредитом: два расчёта одного графика неразрешимы, а разные
   траншы одного кредита в разных заявках — разрешены (РС-2). */
function activeAppOnTranche(trancheId, exceptAppId){
  return state.apps.find(a=>a.id!==exceptAppId && !stageOf(a).closed
    && (a.calcs||[]).some(c=>c.trancheId===trancheId));
}
/* Фиксация транша-источника — заводит app.version черновиком условий кредита, если версии ещё
   нет (draftVersion, issues/05 задача 5). Выбор меняется свободно до ДС: пере-выбор просто
   переставляет calcTranche, версия не трогается повторной инициализацией (issues/01, ADR-0042:
   черновик — исторический объект заявки, не пересоздаётся молча). */
function setCalcTranche(appId, trancheId){
  if(!guard('editVersion')) return;
  if(!trancheId){ toast('Выберите транш','err'); return; }
  const app=appById(appId);
  let found=null;
  (app.creditIds||[]).forEach(cid=>{ if(found) return; const cr=creditById(cid); if(!cr) return;
    const t=(cr.tranches||[]).find(x=>x.id===trancheId); if(t) found={cr,t}; });
  if(!found){ toast('Транш не найден','err'); return; }
  // Пере-выбор на однорасчётной заявке переставляет транш существующего расчёта, а не плодит
  // второй: куратор передумал, а не добавил кредит (ADR-0042 — черновик не пересоздаётся молча).
  const cur = requireCalc(app);
  if(cur && (app.calcs||[]).length===1){ cur.trancheId=found.t.id; cur.creditId=found.cr.id; cur.id='C-'+found.t.id; }
  else attachCalc(app, found.t);
  const c = requireCalc(app) || calcById(app, 'C-'+found.t.id);
  if(c && !c.version) c.version=draftVersion(found.cr,{});
  app._t=TODAY; H(app,'Транш-источник расчёта выбран: '+found.t.no+' (кредит '+found.cr.no+').',state.role);
  toast('Транш-источник выбран','ok'); render();
}
/* Правка параметров черновика ДС (issues/05 задача 5, тикет 07 — та же честная дыра #3).
   Открыта, пока ДС не зарегистрировано: после регистрации условия ДС — исторический
   реквизит вступившего соглашения, версия дальше не переигрывается (комментарий у coverGate
   про «не моргать» после терминала — то же соображение). Проверка «версия закрыта» получает
   второе основание — calc.dsRef: закрывает версию своё соглашение, а не первое зарегистрированное
   по заявке. Старое условие по app.ds остаётся до задачи 6, где app.ds становится дверью и
   держать его в паре перестаёт быть нужным. */
function setVersionParam(appId, key, val, calcId){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  const calc=requireCalc(app, calcId);
  if(!calc){ toast('Сначала выберите транш-источник расчёта','err'); return; }
  if(calc.dsRef || (app.ds && app.ds.no)){ toast('ДС уже зарегистрировано — версия закрыта','err'); return; }
  const def=PARAM_BY_KEY[key];
  if(!def){ toast('Условие «'+key+'» не в реестре зоны п. 89','err'); return; }
  /* Вид ДС отбивается ЗДЕСЬ, а не только disabled-атрибутом поля: та же доктрина, что у
     распоряжений (setDisposition) — разметке не доверяем, запрещённое значение отбивает
     сторона модели. Гейт Г-23 держит тот же рубеж на входе в ДС (ADR-0111). */
  if(!allowedParams(app).has(key)){ toast('Вид ДС не разрешает менять «'+def.label+'»','err'); return; }
  if(!calc.version) calc.version=draftVersion(creditById(calc.creditId),{});
  const p=calc.version.params;
  p[key] = def.kind==='num' ? (val===''?null:Number(val)) : val;
  app._t=TODAY; render();
}
/* Предварительный расчёт — предпросмотр черновика графика на текущих base/dispositions,
   не пишет ДС (draftSchedule — чистая функция, issues/01 реш.5). Ровно та кнопка, что
   вторая вкладка расчёта давно анонсировала в своей заглушке как «вне охвата тикета 06».
   Кнопка стоит на «Параметрах», а её исход — на «Результате расчёта», поэтому расчёт сам
   переводит взгляд на вторую вкладку: иначе нажатие ничего не меняет на экране и читается
   как отказ. */
function recalcPlan(appId, calcId){
  if(!guard('editVersion')) return;
  const app=appById(appId);
  const calc=requireCalc(app, calcId);
  if(!calc){ toast('У заявки несколько расчётов — укажите, по какому траншу','err'); return; }
  const tranche=calcTrancheOf(calc);
  if(!tranche || !calc.version){ toast('Сначала выберите транш-источник','err'); return; }
  const r=run(app, TODAY, calc.id);
  calc.version.plan=draftSchedule(tranche,{date:TODAY,transferSum:r.transferSum,
    principalPart:r.principalPart,parts:r.parts,conditions:toConditions(calc.version.params)});
  app._t=TODAY; H(app,'Предварительный расчёт: черновой график пересчитан.',state.role);
  state.curTab='result';
  toast('Черновой график пересчитан — вкладка «Результат расчёта»','ok'); render();
}
/* Форма условий черновика — РЕЕСТР PARAMS, а не четыре поля руками: зона «формы п. 89» держит
   двенадцать ключей (ADR-0111), и пока форма знала четыре, виды N3 «льготный период» и N5
   «отсрочка» нечем было оформить — норму называли, а поля под неё не было.
   Ключи вне allowedParams(app) не прячутся, а стоят read-only с подписью «вид не разрешает»:
   тот же приём, что у мёртвых пунктов распоряжений (setDisposition), и он же отвечает на
   вопрос «а где остальные условия» — они здесь, их не разрешает ВЫБРАННЫЙ ВИД, а не движок.
   Подполя (payMonths, окно распределения отсроченных %) показываются только при своём хозяине.
   Закрыта после регистрации ДС: app.ds.conditions — реквизит вступившего соглашения дальше живёт
   своей жизнью (issues/01, ADR-0042), версия-черновик его больше не переигрывает. */
function versionParamsBlock(app, calc){
  if(!calc.version) return '<div class="op-empty">Выберите транш-источник — черновик условий заведётся автоматически.</div>';
  const p=calc.version.params;
  const dsNo = calc.dsRef || (app.ds && app.ds.no);
  const fixed = !!dsNo;
  const roleOk = canX('editVersion');
  const canEdit = roleOk && !fixed;
  const allowed = allowedParams(app);
  const lockNote = fixed
    ? '<span class="mode-tag">ДС '+esc(dsNo)+' зарегистрировано — версия стала историей, правка закрыта.</span>'
    : (roleOk ? '' : '<span class="mode-tag">роль «'+esc(state.role)+'» правку не делает — только Куратор ОД.</span>');
  const set = k => `RS.setVersionParam('${app.id}','${k}',this.value,'${calc.id}')`;
  const field = d => {
    const on = allowed.has(d.key);
    const dis = (canEdit && on) ? '' : 'disabled';
    const v = p[d.key];
    const ctl = d.kind==='enum'
      ? `<select ${dis} onchange="${set(d.key)}">${d.options.map(o=>
          `<option value="${esc(o)}" ${String(v!=null&&v!==''?v:d.options[0])===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
      : d.kind==='text'
      ? `<input type="text" value="${esc(v!=null?v:'')}" placeholder="${esc(d.hint||'')}" ${dis} onchange="${set(d.key)}">`
      : `<input type="number" min="0" ${d.step?`step="${d.step}"`:''} value="${v!=null?v:''}" ${dis} onchange="${set(d.key)}">`;
    return `<div class="field"><span class="flabel">${esc(d.label)}${on?'':' <span class="ro-tag">— вид не разрешает</span>'}</span>${ctl}</div>`;
  };
  const shown = PARAMS.filter(d => !d.showIf || d.showIf(p));
  /* «По конкретным месяцам» — условие хранится и уезжает в ДС, но график по нему формулой не
     строится (см. amortize). Молчать об этом нельзя: черновик покажет помесячные строки. */
  const freqNote = p.freq==='по конкретным месяцам'
    ? '<div class="section-note">Платежи по конкретным месяцам уезжают в ДС как условие, но черновой график по ним не строится — при неравных промежутках график задаётся вручную. Строки ниже посчитаны помесячно.</div>'
    : '';
  return `<div class="f2" style="max-width:920px">${shown.map(field).join('')}</div>
    ${freqNote}
    <div style="margin-top:8px">${canEdit?`<button class="btn btn-primary btn-sm" onclick="RS.recalcPlan('${app.id}','${calc.id}')">Предварительный расчёт — пересчитать черновой график</button>`:''} ${lockNote}</div>`;
}

/* Порядок конвейера — константа-массив шагов, прогон reduce (issues/02 реш.6, ИР-7 живёт
   здесь). Стек шагов — побочный продукт прогона, не отдельный лог: смоук (задача 8/тикет 08)
   проверяет ИР-7 по индексам PIPELINE как данные, не разбором расчёта построчно. overdue —
   намеренно тонкий шаг: срочность уже впечатана в позицию (issues/01 реш.3), шагу остаётся
   спросить, что осталось непокрытым распоряжением. */
const PIPELINE = [
  function forgive(state){
    let sum=0;
    const base = state.base.map(r=>{
      const carried = r.carried!=null ? r.carried : r.amount;
      if(!r.included) return {...r, carried};
      // Линий на позиции может быть несколько (РС-43) — шаг берёт ВСЕ линии своего вида. Порядок
      // применения держит конвейер (прощение до капитализации, РС-14), а не порядок линий на
      // экране: иначе куратор управлял бы ставкой на прощённое перестановкой строк.
      const cut = round2(dispositionsFor(state.dispositions, r.article, r.urgency)
        .filter(d=>d.kind==='forgive').reduce((s,d)=>s+d.amount,0));
      if(cut>0){ sum=round2(sum+cut); return {...r, carried: round2(carried-cut)}; }
      return {...r, carried};
    });
    return { state:{...state, base, forgiven:round2(sum)}, record:{step:'forgive', sum:round2(sum)} };
  },
  /* Капитализация — два разных исхода одной механики (РС-11/РС-27): проценты входят в основной
     долг и ставка на них идёт (процент на процент — обычная механика кредита), пеня выделяется
     ОТДЕЛЬНОЙ СУММОЙ (п. 89 пп. 4), получает сроки уплаты и попадает в график, но с телом не
     сливается и ставку не притягивает — санкция не цена денег. Обе суммы уходят в перенос,
     различие несут два счётчика, а не одно число. */
  function capitalize(state){
    let sum=0, penalty=0, interest=0;
    const parts=(state.parts||[]).slice();
    const base = state.base.map(r=>{
      const lines = r.included
        ? dispositionsFor(state.dispositions, r.article, r.urgency).filter(d=>d.kind==='cap') : [];
      if(!lines.length) return r;
      let carried = r.carried;
      // Две линии капитализации пени с разными интервалами дают ДВЕ безставочные части: сроки
      // живут на линии, и слить их в одну колонку значит потерять половину сроков.
      lines.forEach(d=>{
        sum=round2(sum+d.amount);
        if(r.article==='penalty'||r.article==='accPenalty'){
          penalty=round2(penalty+d.amount);
          // капитализированная пеня — безставочная колонка со своими сроками (ADR-0109): в тело
          // не вливается, ставку не притягивает; колонка её — «накопленная пеня», восьмой статьи
          // не заводим, происхождение несут счётчик и акт.
          parts.push({ article:'accPenalty', amount:d.amount, periods:d.periods||allPeriods(), from:'капитализация пени' });
        } else {
          interest=round2(interest+d.amount);   // проценты вливаются в тело — ставка на них идёт, это обычная механика кредита
        }
        carried = round2(carried-d.amount);
      });
      return {...r, carried};
    });
    return { state:{...state, base, parts, capitalized:round2(sum), capitalizedInterest:interest, capitalizedPenalty:penalty},
             record:{step:'capitalize', sum:round2(sum), interest, penalty} };
  },
  /* Распределение (РС-39) — не сборщик списка для отчёта, а перенос суммы: начисленная статья
     уходит в накопленную (проценты → накопленные проценты, пеня → накопленная пеня), уже
     накопленная строка статьи не меняет и только получает сроки. Режим начисления
     {проценты:нет, пеня:нет} приходит ВМЕСТЕ со статьёй (ACCRUAL_MODES) — второго правила про
     «ставка не идёт» писать не надо. Сумма снимается с carried, поэтому шаг overdue ниже видит
     распределённое как покрытое. */
  function distribute(state){
    const parts=(state.parts||[]).slice();
    let sum=0;
    const base = state.base.map(r=>{
      const lines = r.included
        ? dispositionsFor(state.dispositions, r.article, r.urgency).filter(d=>d.kind==='spread') : [];
      if(!lines.length) return r;
      const target = r.article==='interest' ? 'accInterest'
                   : r.article==='penalty'  ? 'accPenalty'
                   : r.article;                                     // накопленное статьи не меняет — идемпотентно
      let carried = r.carried;
      // Каждая линия — своя часть со своими сроками (РС-43): две линии распределения это два
      // интервала графика, а не одна сумма, записанная дважды.
      lines.forEach(d=>{
        sum=round2(sum+d.amount);
        parts.push({ article:target, amount:d.amount, periods:d.periods||allPeriods(), from:'распределение' });
        carried = round2(carried-d.amount);
      });
      return {...r, carried};
    });
    return { state:{...state, base, parts, spread:parts.filter(p=>p.from==='распределение')},
             record:{step:'distribute', count:parts.filter(p=>p.from==='распределение').length, sum:round2(sum)} };
  },
  /* Просрочка смотрит на CARRIED, а не на вид распоряжения (РС-39): строка просрочена, если после
     всех распоряжений на ней остался непокрытый остаток. Частичное распределение честно оставляет
     заявку просроченной, полное — снимает просрочку. Тоньше и общее прежней проверки по kind. */
  function overdue(state){
    const remainsOverdue = state.base.some(r=> r.included && r.urgency==='over' && round2(r.carried) > 0);
    return { state:{...state, remainsOverdue}, record:{step:'overdue', remainsOverdue} };
  },
  /* Сборка базы (ADR-0109) — перенос остаётся ОДНОЙ суммой, но разложенной по статьям. Колонка
     основного долга = тело + влившиеся капитализированные проценты, она одна ставочная; всё
     прочее — безставочные колонки со сроками: распределённое, капитализированная пеня и остатки
     позиций без распоряжения (каждый своей статьёй). ИР-2 сверяет сумму ВСЕХ колонок с переносом. */
  function assembleBase(state){
    const parts=(state.parts||[]).slice();
    state.base.forEach(r=>{
      if(!r.included || r.article==='principal') return;
      const rest = round2(r.carried);
      if(rest>0) parts.push({ article:r.article, amount:rest, periods:allPeriods(), from:'без распоряжения' });
    });
    const principalPart = round2(state.base.filter(r=>r.article==='principal' && r.included).reduce((s,r)=>s+r.carried,0) + state.capitalizedInterest);
    const transferSum = round2(principalPart + parts.reduce((s,p)=>s+p.amount,0));
    return { state:{...state, parts, principalPart, transferSum},
             record:{step:'assembleBase', transferSum, principalPart, parts:parts.length} };
  }
];
function run(app, date, calcId){
  const calc = asCalc(app, calcId); if(!calc) return null;
  // Источник строк — сначала СОБСТВЕННЫЕ base/dispositions первого аргумента, если он их
  // прямо несёт (юнит-тест конвейера годами подсовывает сюда пустой объект-подделку с готовыми
  // base/dispositions мимо calc — смоук #35), иначе — расчёт, иначе — умолчание с нуля. На
  // однорасчётной заявке app.base — та же дверь на calc.base (Task 1), различия нет; на
  // многорасчётной дверь без имени молчит ([]), и выбор падает на calc, адресованный calcId.
  const ownBase = (app && app.base && app.base.length) ? app.base : null;
  const ownDisp = (app && app.dispositions && app.dispositions.length) ? app.dispositions : null;
  const base0 = (ownBase || calcBaseOf(app, calc, date)).map(r=>({...r, carried:r.amount}));
  const dispositions = ownDisp || (calc.dispositions && calc.dispositions.length ? calc.dispositions : defaultDispositions(base0));
  const st0 = { app, calc, date, base:base0, dispositions, forgiven:0, capitalized:0,
                capitalizedInterest:0, capitalizedPenalty:0,
                parts:[], spread:[], remainsOverdue:false, principalPart:0, transferSum:0, stack:[] };
  return PIPELINE.reduce((s, step) => { const {state, record} = step(s); state.stack.push(record); return state; }, st0);
}

/* Расхождение среза и факта — колонка-дельта и ДВЕ СТУПЕНИ порога (РС-26, решение Холдинга от
   10.08.2026 вместо прежнего одиночного мягкого флага). Обе ступени считаются от согласованной
   базы среза и срабатывают по ЛЮБОМУ из двух измерений: процент один защищает мелкие кредиты и
   пропускает крупные — 25 % от 300 тыс. и 25 % от 300 млн одинаковы в проценте и несопоставимы
   по сути. Ступень 1 — виза куратора с письменным обоснованием; ступень 2 — возврат на комитет,
   регистрация ДС заблокирована до новой позиции. Ступень 2 НЕ переподписывает постановление
   Кабмина: акт одобрял вид и параметры, пересматривается позиция комитета Холдинга, на которой
   стоит письмо. Величины — настройка с историей значений, а не норма. Расхождение считается по
   базе целиком, не по статьям: согласовывалась сумма, а не разбивка. */
const DRIFT_TIERS = [
  { level:1, pct:0.10, abs:500000,  need:'виза куратора с письменным обоснованием расхождения' },
  { level:2, pct:0.25, abs:5000000, need:'возврат на комитет; регистрация ДС заблокирована до новой позиции' }
];
function driftTier(delta, cutoffSum){
  const pct = cutoffSum ? Math.abs(delta)/cutoffSum : 0, abs = Math.abs(delta);
  let hit=null;
  DRIFT_TIERS.forEach(t=>{ if(pct>=t.pct || abs>=t.abs) hit=t; });
  return hit;
}
/* Срез — согласовательная величина заявки: дата одна на обращение, суммы свои у каждого расчёта
   (спека §2). Ступень 1 меряется расчётом, ступень 2 — суммой по заявке (спека §5).
   Фиксация письмом и регистрация ДС — единственные два удостоверяющих события (issues/02 реш.2);
   вызов fixCutoff/fixFact из экрана — задачи 6/7 (fixLetter/regDS), здесь только чистые данные. */
function fixCutoff(app, date){
  app.cutoffDate = date;
  (app.calcs||[]).forEach(c=>{
    const t=calcTrancheOf(c);
    c.cutoff = { date, rows: t ? debtAt(t, date) : [], fixedAt: date };
  });
  app.cutoff = { date, rows: (app.calcs||[]).flatMap(c=>c.cutoff.rows), fixedAt: date };  // итог, не хранилище
  return app.cutoff;
}
/* Срез, ДЕЙСТВУЮЩИЙ ДЛЯ РАСЧЁТА — вторая дверь того же рода, что calcBaseOf. После fixCutoff
   срез лежит на расчёте суммами; ДО письма он держит только дату, одну на обращение (спека §2),
   и заводится прямо на заявке (app.cutoffDate / app.cutoff, минуя fixCutoff — так делают демо
   RS-1004 и вторая волна): сумм в этом состоянии нет ни у одного расчёта, и подставлять их
   неоткуда. Экран обязан читать срез СВОЕГО расчёта: ролл-ап app.cutoff — сумма по всем траншам,
   и на двух расчётах он печатал бы в обеих секциях одно и то же чужое число (ревью 12.08.2026). */
function calcCutoffOf(app, calc){
  if(calc && calc.cutoff) return calc.cutoff;
  const date = app && (app.cutoffDate || (app.cutoff ? app.cutoff.date : null));
  return date ? { date, rows:null, fixedAt:null } : null;
}
function fixFact(app, date, calcId, transferSum){
  const calc=requireCalc(app, calcId); if(!calc) return null;
  const t=calcTrancheOf(calc);
  calc.fact = { date, rows: t ? debtAt(t, date) : [], transferSum: round2(transferSum) };
  // Факт переехал на расчёт, но app.ds.fact — публичный реквизит вступившего соглашения: его
  // читают экран (:2524) и сторож #14. Пока расчёт один, зеркалим; при двух его несёт своё ДС.
  if(app.ds && (app.calcs||[]).length===1) app.ds.fact = calc.fact;
  return calc.fact;
}
/* ДАТА ВСТУПЛЕНИЯ ПО РАСЧЁТУ — одна дата на весь показ результата. Соглашение регистрируется
   по расчёту, то есть по траншу (РС-2), поэтому дата берётся у ЕГО факта: на многорасчётной
   заявке app.ds — реквизит первого зарегистрированного ДС и к соседнему расчёту отношения не
   имеет. Пока ДС нет, датой стоит «сегодня», и экран называет это предпросмотром: сравнивать
   на дату, которой ещё не назначено, значит выдавать предположение за реквизит. */
function calcEffectiveDate(app, calc){
  if(calc && calc.fact && calc.fact.date) return calc.fact.date;
  const ag = calc && (app.agreements||[]).find(a=>(a.calcIds||[]).indexOf(calc.id)>=0);
  if(ag && ag.date) return ag.date;
  return (app.ds && app.ds.date) ? app.ds.date : TODAY;
}
function sumRows(rows){ return round2((rows||[]).reduce((s,r)=>s+r.amount,0)); }
function driftOf(cutoffRows, factRows){
  const cutoffSum=sumRows(cutoffRows), factSum=sumRows(factRows);
  const delta=round2(factSum-cutoffSum);
  const tier=driftTier(delta, cutoffSum);
  return { cutoffSum, factSum, delta, pct: cutoffSum ? Math.abs(delta)/cutoffSum : 0,
           tier, level: tier?tier.level:0, material: !!tier };
}
function calcDrift(app, calcId){
  const c=requireCalc(app, calcId);
  if(!c || !c.cutoff || !c.fact) return null;
  return { calcId:c.id, ...driftOf(c.cutoff.rows, c.fact.rows) };
}
function appDrift(app, date){
  // Условие отбора то же, что у driftGate: срез с суммами. Расчёт, у которого срез держит одну
  // дату (rows:null), в сумму не входит — складывать нечего, а не ноль.
  const list=(app.calcs||[]).filter(c=>c.cutoff && c.cutoff.rows);
  const cut=list.flatMap(c=>c.cutoff.rows);
  const fact=list.flatMap(c=>{
    const t=calcTrancheOf(c); return t ? debtAt(t, date||TODAY) : [];
  });
  return driftOf(cut, fact);
}
function cutoffDrift(app){ return calcDrift(app, null); }
/* Гейт регистрации: ступень 2 считается по заявке и блокирует ВСЕ расчёты — вернуть на комитет
   половину обращения нельзя. Ступень 1 остаётся в строках: она про визу конкретного ДС. */
function driftGate(app, date){
  const list=(app.calcs||[]).filter(c=>c.cutoff && c.cutoff.rows);
  if(!list.length) return { ok:true, applicable:false, rows:[] };
  const whole=appDrift(app, date);
  const recommitted = !!(app.committee && app.committee.date && app.cutoff && app.cutoff.date
                         && app.committee.date > app.cutoff.date);   // как сегодня (:1755)
  const rows=list.map(c=>{
    const t=calcTrancheOf(c);
    const factRows = c.fact ? c.fact.rows : (t ? debtAt(t, date||TODAY) : []);
    return { calcId:c.id, creditNo:(creditById(c.creditId)||{}).no || '—', ...driftOf(c.cutoff.rows, factRows) };
  });
  // Блокировка (ok) считается ТОЛЬКО по расчётам без уже зарегистрированного ДС: тот расчёт прошёл
  // свою ступень 2 при собственной регистрации, и его старый (дописьменный) срез не должен вечно
  // читаться как расхождение против живого остатка транша-источника, урезанного самим переносом —
  // иначе ступень 2 срабатывала бы от факта регистрации, а не от настоящего дрейфа (RS-1005/РС-26,
  // тест #64: второй, ещё не оформленный расчёт не должен блокироваться визой первого). Все
  // остальные поля (level/tier/delta/cutoffSum/factSum/pct) остаются по `whole` без выреза — та же
  // цифра, что видит pFormal сегодня для любой из 25 демо-заявок, побайтово (сверено с aec7728).
  // У однорасчётной уже зарегистрированной заявки gateList пуст и ok переворачивается в true — но
  // это инертно: dsBlock (:3119) к этому моменту уже рисует «зарегистрировано» вместо кнопки, а
  // сам regDS отсекает повтор своей проверкой calc.dsRef ДО обращения к driftGate (:3274).
  const gateList=list.filter(c=>!c.dsRef);
  const gateWhole = gateList.length ? appDrift({...app, calcs:gateList}, date) : {level:0};
  return { ok: gateWhole.level<2 || recommitted, applicable:true, recommitted, rows,
           level:whole.level, tier:whole.tier, delta:whole.delta,
           cutoffSum:whole.cutoffSum, factSum:whole.factSum, pct:whole.pct };
}

/* Покрытие строк графика — жадно из одного пула, форма соседа (credit.html:3563-3603) дословно
   по духу: один проход по статьям в порядке очереди (ARTICLES), а не два прохода по четырём
   (issues/02 реш.7). Допущение Д-8 (credit.html:3543-3547) повторяется с той же оговоркой:
   кредит не владеет по слоям, доля берётся пропорционально телу — нетипичные распределения
   куратора разойдутся с выведенным здесь покрытием. Колонки берутся из фактической формы строк
   графика (что реально синтезировал amortize), накопленные колонки не выдумываются. Ссылки в
   repay не хранятся, paid на строке не пишется — второй источник истины рядом с ops лишний. */
function coverageOf(tranche, ver){
  const rows = (ver && ver.rows) || [];
  if(!rows.length) return [];
  const cols = ARTICLES.map(a=>a.key).filter(k => k in rows[0]);
  let pool = round2((tranche.ops||[]).filter(o=>o.kind==='repay').reduce((s,o)=>s+o.amount,0));
  return rows.map(r => {
    const paid={};
    cols.forEach(c=>{
      const take = round2(Math.min(pool, r[c]||0));
      paid[c]=take; pool=round2(pool-take);
    });
    return { n:r.n, date:r.date, paid };
  });
}
const AppSide = { debtAt, defaultBase, defaultDispositions, cutoffDrift, calcDrift, appDrift, driftOf, fixCutoff, fixFact, run, coverageOf, PIPELINE };

/* initiator — инициатор проекта решения КМ (п. 83 Положения): отраслевой орган · ОМСУ (через
   полномочного представителя Президента в области) · уполномоченный орган. Реквизит заявки, не
   свободная строка. conclusion / zk / resolution — три акта цепи (ADR-0107) на месте прежнего
   одиночного app.minfin. */
const INITIATORS = [
  {code:'sector', label:'Отраслевой государственный орган'},
  {code:'omsu',   label:'ОМСУ (через полномочного представителя Президента в области)'},
  {code:'authority', label:'Уполномоченный государственный орган'}
];
/* Старые поля base/dispositions/version/calcTranche остаются ДВЕРЬЮ к единственному расчёту,
   а не вторым хранилищем: геттер читает calcs, сеттер пишет в calcs. Пока заявка однотраншевая,
   экран и сторожа разницы не замечают; как только расчётов два — дверь молчит, и звать нужно
   расчёт по имени (requireCalc). */
function baseApp(id,inn,borrower,kindIds,creditIds,regDate){
  const app = { id,inn,borrower,kindIds:[...kindIds],regDate,
    packetDocs:{}, analysisStarted:false, conclusions:[], committee:null, letterSent:null,
    initiator:null, conclusion:null, zk:null, resolution:null,
    ds:null, waiver:null, ops:[], automation:[], outcome:null, history:[],
    calcs:[], cutoff:null };
  ['base','dispositions','version'].forEach(k=>Object.defineProperty(app, k, {
    enumerable:true, configurable:true,
    get(){ const c=requireCalc(app); return c ? c[k] : (k==='version' ? null : []); },
    set(v){ const c=requireCalc(app); if(c) c[k]=v; }
  }));
  Object.defineProperty(app, 'calcTranche', {
    enumerable:true, configurable:true,
    get(){ const c=requireCalc(app); return c ? calcTrancheOf(c) : null; },
    set(t){ if(t) attachCalc(app, t); }
  });
  const seededCredits = [...creditIds];        // охват до перехода на траншы (демо-сид, задача 8)
  Object.defineProperty(app, 'creditIds', {
    enumerable:true, configurable:true,
    // Охват называет траншы; кредит — производное от них. Пока у заявки нет ни одного расчёта,
    // источником остаётся сид: у заявки на стадии «Регистрация обращения» кредит уже назван,
    // а транш-источник ещё не выбран, и терять кредит из-за этого нельзя.
    get(){ const fromCalcs=[...new Set(app.calcs.map(c=>c.creditId))];
           return fromCalcs.length ? fromCalcs : seededCredits; },
    set(v){ seededCredits.length=0; (v||[]).forEach(x=>seededCredits.push(x)); }
  });
  return app;
}
function H(app,what,who,cls){ app.history.push({when:app._t||app.regDate, what, who:who||'', cls:cls||''}); }
function defaultConclusions(){ return [ {dept:'СРМиК',text:'',visa:false,visaDate:null}, {dept:'ДПО',text:'',visa:false,visaDate:null} ]; }
function fillDocs(app){ requiredDocs(app).forEach(d=>app.packetDocs[d]=true); }
/* Замена снесённого versionFrom (РС-3, карта map.md): версии условий на кредите больше нет —
   черновик читает cr.terms напрямую, а не version-on-credit. plan заполняется отдельно
   (CreditSide.draftSchedule), null пока расчёт не проведён. */
function draftVersion(cr, overrides){
  // Черновик стартует «как есть»: из условий кредита берутся те ключи реестра, которые там
  // заведены (term/rate/freq/method). Незаведённые — льготы, день платежа — остаются пустыми:
  // пустая льгота и есть «льготы нет», а нулём её сеять значит выдать неназванное за условие.
  const params={};
  PARAMS.forEach(p=>{ if(cr.terms[p.key]!==undefined) params[p.key]=cr.terms[p.key]; });
  return { params:Object.assign(params, overrides||{}), plan:null };
}

    const app=baseApp(id,cr.inn,cr.borrower,['N1'],[cr.id],addCalDays(date,-10));

    app.letterSent={fixed:true,date:addCalDays(date,-3)};
    AppSide.fixCutoff(app, app.letterSent.date);
    if(demoNote){ app._t=app.cutoff.date; H(app,demoNote,'Демо-данные','auto'); }
    app.conclusion={fixed:true,outcome:'возможно',no:'МФ-'+id,date:addCalDays(date,-2)};
    app.zk={fixed:true,no:'ЖК-'+id,date:addCalDays(date,-2)};
    app.resolution={fixed:true,decision:'изм',no:'ПКМ-'+id,date:addCalDays(date,-1)};
    app.version=draftVersion(cr,{term:12});
    const full=round2(CreditSide.balanceAt(T,date));
    const transferSum=partial?round2(full*0.5):full;
    const ds={ no, date, app, sourceTranche:T, credit:cr, transferSum, conditions:toConditions(app.version.params) };
    const res=CreditSide.restructureApplied(ds);

    app.ds={ no, date, transferSum, sourceTrancheId:T.id, conditions:ds.conditions, fact:null };
    const calc = requireCalc(app);
    calc.dsRef = no;

      appId:app.id, calcIds:[calc.id], transferSum, sourceTrancheId:T.id, conditions:ds.conditions });
    AppSide.fixFact(app,date,null,transferSum);
    app.outcome='изм'; app._t=date; H(app,'ДС '+no+' зарегистрировано, перенесено '+fmt(transferSum)+'.','Куратор ОД');
    return { app, tranche:res.tranche };
  }
  const d1=addCalDays(TODAY,-60), d2=addCalDays(TODAY,-30), d3=TODAY;

/* Даты стадий раскладываются шагами регламента от даты регистрации: считать их в таблице руками
   значило бы пятнадцать раз проверять глазами, что письмо позже комитета. Точечные исключения —
   поле dates строки. */
function wave2Dates(s){
  const o=s.dates||{}, reg=s.reg;
  const committee = o.committee || addCalDays(reg,22);
  const letter    = o.letter    || addWorkDays(committee,4);
  const conclusion= o.conclusion|| addCalDays(letter,45);
  const zk        = o.zk        || addCalDays(conclusion,12);
  const resolution= o.resolution|| addCalDays(zk,10);
  return { analysis:o.analysis||addCalDays(reg,3), visa1:o.visa1||addCalDays(reg,14), visa2:o.visa2||addCalDays(reg,16),
           committee, letter, conclusion, zk, resolution, ds:o.ds||addCalDays(resolution,7), ret:o.ret||addCalDays(reg,2) };
}
const wave2Kinds = s => s.kinds.map(id=>(kindById(id)||{}).name).filter(Boolean).join(' + ');
/* Распоряжения строки таблицы кладутся поверх умолчания (kind:'none' на всю сумму позиции), а не
   вместо него: статью, которой в базе среза не оказалось (спорная пеня, нулевая позиция), спека
   не выдумывает — распоряжение живёт только на включённой строке (issues/02 реш.4). */
/* Ключ спецификации — 'статья' (просроченное, умолчание) либо 'статья@срочность'. Распоряжение
   живёт на ПАРЕ (статья, срочность), и после появления накопленного хвоста (accTail) одной статьи
   стало мало: у 'accInterest' в базе две строки, и распоряжения у них разные. Голый ключ читается
   как '@over' намеренно — им писаны все прежние строки WAVE2, и переписывать их незачем. */
/* Значение спецификации — либо ОДИН объект (одно распоряжение на всю позицию), либо МАССИВ:
   позиция делится на несколько линий, и каждая обязана назвать свою сумму (РС-43). Порядок в
   массиве становится seq — адресом линии на экране; исход прогона от него не зависит. */
function applyDisp(list, spec){
  if(!spec) return list;
  return list.flatMap(d=>{
    const s = spec[d.article+'@'+d.urgency] || (d.urgency==='over' ? spec[d.article] : null);
    if(!s) return [d];
    const lines = Array.isArray(s) ? s : [s];
    if(lines.length>1 && lines.some(x=>x.amount==null))
      throw new Error('applyDisp: линия деления позиции '+d.article+'@'+d.urgency+' без суммы');
    return lines.map((one,i)=>{
      const out={...d, kind:one.kind, seq:i+1};
      if(one.amount!=null) out.amount=round2(one.amount);
      if(one.from!=null)   out.periods={mode:'range', from:one.from, to:one.to};
      return out;
    });
  });
}
function buildWave2(){ return WAVE2.map(s=>buildWave2App(s)); }
function buildWave2App(s){
  const target=WAVE2_STAGE[s.stage], cr=creditById(s.credits[0]), d=wave2Dates(s), n=Number(String(s.id).slice(3));
  const app=baseApp(s.id, s.inn||cr.inn, s.borrower||cr.borrower, s.kinds, s.credits, s.reg);
  app.initiator=s.initiator||'sector';
  if(app.initiator==='omsu') app.initiatorViaEnvoy=true;
  app._t=s.reg; H(app,'Заявка зарегистрирована. Виды: '+wave2Kinds(s)+'.','Куратор ОД');

  if(s.stage==='возврат'){                                    // исход на первой стадии — дальше ничего не заводится
    fillDocs(app); (s.missing||[]).forEach(doc=>{ delete app.packetDocs[doc]; });
    app.outcome='возврат';
    app._t=d.ret; H(app,'Пакет неполон: '+s.why+'. Исход: возвращена без рассмотрения.','Куратор ОД');
    return app;
  }

  fillDocs(app); app.analysisStarted=true;
  // Охват называет траншы: у сценария с несколькими кредитами расчёт заводится на каждый
  // первый открытый транш, а не только на кредит[0] — иначе второй кредит в расчёт не входит.
  (s.credits||[]).forEach(cid=>{ const c=creditById(cid); const t=(c.tranches||[]).find(x=>!x.closed);
    if(t){ const calc=attachCalc(app, t); if(!calc.version) calc.version=draftVersion(c,{}); } });
  app.conclusions=defaultConclusions();
  app._t=d.analysis; H(app,'Пакет укомплектован → «Анализ». Дедлайн 30 к.д. (до '+addCalDays(s.reg,30)+').','Куратор ОД');
  if(s.params) app.calcs.forEach(calc=>{ calc.version=draftVersion(creditById(calc.creditId),s.params); });
  if(s.waiver) app.waiver={granted:true, reason:s.waiver.reason, date:s.waiver.date};

  if(target>=2){
    const pos=s.position||'целесообразно';
    app.conclusions[0].text='Финансовое положение восстановимо, поддержать.'; app.conclusions[0].visa=true; app.conclusions[0].visaDate=d.visa1;
    app.conclusions[1].text='Правовых препятствий нет.'; app.conclusions[1].visa=true; app.conclusions[1].visaDate=d.visa2;
    app._t=d.visa2; H(app,'Заключения СРМиК и ДПО завизированы.','Заключанты');
    app.committee={fixed:true, position:pos, date:d.committee};
    app._t=d.committee; H(app,'Позиция комитета: '+pos+'. Дедлайн письма 5 р.д.','Секретарь комитета');
  }
  if(target>=3){
    app.letterSent={fixed:true, date:d.letter};
    AppSide.fixCutoff(app, d.letter);
    app._t=d.letter; H(app,'Письмо в уполномоченный орган направлено. Срез зафиксирован на дату письма.','Куратор ОД','auto');
  } else {
    app.cutoff={date:TODAY, rows:null, fixedAt:null};          // до письма срез держит только дату (РС-8)
  }

  // финансовое ядро материализуется там, где заявка его уже трогала: у заявки с ДС — на дату ДС,
  // у активной — на сегодня (иначе правка куратора откатилась бы к умолчанию, issues/02 реш.4)
  if(s.disp || s.include || s.plan || (target>=8 && s.mode==='ядро')){
    const at = target>=8 ? d.ds : TODAY;
    app.calcs.forEach(calc=>{
      calc.base=AppSide.defaultBase(calc, at);
      // include — та же галка куратора, что в двери (РС-7): по умолчанию в базу входит только
      // просроченное, ненаступившее включается ЯВНО. Заблокированную строку (спорная пеня, ИР-6)
      // не трогаем: демо-сев не вправе обходить гейт, который в UI мёртв.
      (s.include||[]).forEach(k=>{
        const [article, urgency] = k.split('@');
        const r = calc.base.find(x=>x.article===article && x.urgency===(urgency||'cur'));
        if(r && !r.blockedBy) r.included=true;
      });
      calc.dispositions=applyDisp(AppSide.defaultDispositions(calc.base), s.disp);
    });
  }
  if(s.plan){
    app.calcs.forEach(calc=>{
      const r=AppSide.run(app, TODAY, calc.id);
      calc.version=calc.version||draftVersion(creditById(calc.creditId),{});
      calc.version.plan=CreditSide.draftSchedule(calcTrancheOf(calc),
        {date:TODAY, transferSum:r.transferSum, principalPart:r.principalPart, parts:r.parts, conditions:toConditions(calc.version.params)});
    });
  }

  if(target>=4){
    app.conclusion={fixed:true, outcome:'возможно', no:'МФ-исх-'+(n+400), date:d.conclusion};
    app._t=d.conclusion; H(app,'Заключение уполномоченного органа: возможно изменение условий ('+app.conclusion.no+' от '+d.conclusion+').','Куратор ОД');
  }
  if(target>=5){
    app.zk={fixed:true, no:'ЖК-К/БФ-'+(n-700), date:d.zk};
    app._t=d.zk; H(app,'Профильный комитет ЖК согласовал проект решения ('+app.zk.no+', п. 82).','Куратор ОД');
  }
  if(target>=6){
    const decision = s.stage==='отказКМ' ? 'отказ' : 'изм';
    app.resolution={fixed:true, decision, no:'ПКМ КР № '+(n-600), date:d.resolution,
                    forgiveSum: s.forgiveSum!=null ? s.forgiveSum : null, forgiveBasis: s.forgiveBasis||null};
    app._t=d.resolution; H(app,'Постановление Кабинета Министров '+app.resolution.no+' от '+d.resolution+': '
      +(decision==='отказ' ? 'в изменении условий отказано (п. 89)' : 'изменённые условия')+'.','Куратор ОД');
    if(decision==='отказ') app.outcome='отказ';
  }

  if(target>=8){
    const T=app.calcTranche;
    app.version=app.version||draftVersion(cr,{});
    let ds;
    if(s.mode==='целиком'){
      ds={ no:s.dsNo, date:d.ds, app, sourceTranche:T, credit:cr,
           transferSum:round2(CreditSide.balanceAt(T,d.ds)), conditions:toConditions(app.version.params) };
    } else {
      const r=AppSide.run(app, d.ds);
      ds={ no:s.dsNo, date:d.ds, app, sourceTranche:T, credit:cr, transferSum:r.transferSum,
           principalPart:r.principalPart, parts:r.parts, conditions:toConditions(app.version.params) };
    }
    const res=CreditSide.restructureApplied(ds);
    if(!res.ok) throw new Error('demo-seed: '+s.id+' — '+res.reasons.join('; '));
    app.ds={ no:ds.no, date:ds.date, transferSum:ds.transferSum, sourceTrancheId:T.id, conditions:ds.conditions, fact:null };
    const calc = requireCalc(app);
    calc.dsRef = ds.no;
    (app.agreements = app.agreements || []).push({ no:ds.no, date:ds.date, creditId:cr.id,
      appId:app.id, calcIds:[calc.id], transferSum:ds.transferSum, sourceTrancheId:T.id, conditions:ds.conditions });
    AppSide.fixFact(app, ds.date, null, ds.transferSum);
    app.outcome='изм';
    app._t=ds.date; H(app,'Доп. соглашение '+ds.no+' зарегистрировано, перенесено '+fmt(ds.transferSum)+'.','Куратор ОД');
  }
  if(s.demoNote){ H(app, s.demoNote, 'Демо-данные', 'auto'); }
  return app;
}

/* Дерево модулей АСУБК — общий канон макетов (credit.html:5872, collection.html:1095).
   Свои экраны стоят листьями в «Проблемной задолженности» — ровно там, где кредитный
   макет уже объявляет реструктуризацию соседкой взыскания. */
const TREE = [
  { id:'k', label:'Система кредитования', subs:[
