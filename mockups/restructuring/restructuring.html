      <td>${a.creditIds.map(id=>creditById(id)?.no).join(', ')}</td>
      <td>${esc(kinds)}</td>
      <td>${esc(st.label)}</td>
      <td>${dlCell}</td>
      <td>${outcomeChip(a)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--text-placeholder);height:80px">Нет заявок по фильтру</td></tr>`;
  v.innerHTML = `
    <div class="filter-head">
      <div class="fl">Стадия <select onchange="RS.setFilter('stage',this.value)">
        ${[''].concat(STAGES).map(s=>`<option value="${s}" ${state.filterStage===s?'selected':''}>${s||'все'}</option>`).join('')}
      </select></div>
      <div class="fl">Исход <select onchange="RS.setFilter('outcome',this.value)">
        ${['','в работе','одобрена','изм','отказ','возврат'].map(s=>`<option value="${s}" ${state.filterOutcome===s?'selected':''}>${s||'все'}</option>`).join('')}
      </select></div>
    </div>
    <div class="tb-actions">
      <button class="btn btn-primary btn-sm" ${canX('createApp')?'':'disabled'} onclick="RS.newApp()">+ Новая заявка</button>
      <div class="spacer"></div>
      <span class="mode-tag">«Сегодня» демо: ${TODAY}</span>
    </div>
    <div class="grid-wrap">
      <table class="grid"><thead><tr>
        <th>№ заявки</th><th>Заёмщик (ИНН)</th><th>Кредиты</th><th>Виды</th><th>Стадия</th><th>Дедлайн</th><th>Исход</th>
      </tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

/* ================= РЕНДЕР: КАРТОЧКА ЗАЯВКИ ================= */
const TABS=[['req','Обращение'],['scope','Охват'],['concl','Заключения'],['calcBase','База и распоряжения'],['calcSched','График и дифф'],['decision','Комитет и решение'],['formal','Оформление'],['hist','История']];
function openApp(id){ state.curApp=id; state.view='card'; state.curTab='req'; render(); }
function setTab(t){ state.curTab=t; render(); }

function renderCard(){
  const v=document.getElementById('view-card'); const app=appById(state.curApp); if(!app){ state.view='list'; return render(); }
  const st=stageOf(app);
  const tabbar = TABS.map(([k,l])=>`<button class="dtab ${state.curTab===k?'active':''}" onclick="RS.setTab('${k}')">${l}</button>`).join('');
  v.innerHTML = phead(app,st) + `<div class="detail-tabbar">${tabbar}</div>` +
    `<div class="panel-wrap">${panel(app)}</div>` + footer(app);
}
/* РС-32: сигнал повторности — пилюля и ничего больше. Норма (п. 82) маршрут установила, своей
   дополнительной ступени согласования Холдинг над ним надстроить не вправе. */
function repeatPill(app){
  const rep=repeatSignal(app);
  return `<span class="pill mid" title="Порядок согласования не меняется; на категорию риска влияет только решением комитета (ADR-0065)">повторная: ${
    rep.credits.map(c=>esc(c.no)+' — '+c.n+'-я').join(' · ')}</span>`;
}
function phead(app,st){
  const kinds=app.kindIds.map(id=>kindById(id)?.name).filter(Boolean).join(', ');
  const steps = STAGES.map((s,i)=>{
    let cls = i<st.idx?'done': i===st.idx&&!st.closed?'cur':'todo';
    if(st.closed && i<=st.idx) cls='done';
    const dl = (i===st.idx && !st.closed) ? deadline(app) : null;
    let sub='';
    if(dl){ sub = dl.overdue?`<span class="dl-red">просрочен ${-dl.remaining} дн.</span>`:`осталось ${dl.remaining} дн.`; }
    return `<div class="tl-step"><span class="tl-dot ${cls}">${cls==='done'?'✓':i+1}</span>
      <span class="tl-lbl ${cls==='todo'?'todo':''}">${s}${sub?`<small>${sub}</small>`:''}</span></div>` +
      (i<STAGES.length-1?`<span class="tl-arrow">→</span>`:'');
  }).join('');
  return `<div class="panel-wrap"><div class="phead">
    <div class="phead-top">
      <div class="phead-name"><span class="nm">${app.id}</span>
        <div class="phead-sub"><b>${esc(app.borrower)}</b> · ИНН ${app.inn} · виды: ${esc(kinds)||'—'} · кредиты: ${app.creditIds.map(id=>creditById(id)?.no).join(', ')||'—'}</div>
      </div>
      <div>${repeatSignal(app).on?repeatPill(app)+' ':''}${outcomeChip(app)}</div>
    </div>
    <div class="timeline">${steps}</div>
  </div></div>`;
}
function footer(app){
  return `<div class="footer">
    <button class="btn btn-secondary" onclick="RS.go('list')">← К реестру</button>
    <div class="spacer"></div>${advanceBtn(app)}</div>`;
}
function advanceBtn(app){
  const adv=canAdvance(app); if(!adv) return '';
  return `<button class="btn btn-primary" ${adv.ok?'':'disabled title="'+esc(adv.why)+'"'} onclick="RS.advance('${app.id}')">Перевести в «${adv.to}»</button>`;
}

/* --- панели вкладок --- */
function panel(app){
  switch(state.curTab){
    case 'req': return pReq(app);
    case 'scope': return pScope(app);
    case 'concl': return pConcl(app);
    case 'calcBase': return pCalcBase(app);
    case 'calcSched': return pCalcSched(app);
    case 'decision': return pDecision(app);
    case 'formal': return pFormal(app);
    case 'hist': return pHist(app);
  }
  return '';
}

/* 1. Обращение — чек-лист пакета: НОРМАТИВНЫЕ документы (пп. 85–86, 95 Положения) плюс документы
   выбранных видов. У нормативной строки виден пункт: требование объясняется нормой, а не
   настройкой (ADR-0099 §5). Условные строки (залоговые предложения п. 86, документы снижения
   ставки п. 95) появляются только когда условие в силе — иначе куратор докладывает бумаги,
   которых норма от него не требует. */
function pReq(app){
  const st=stageOf(app); const g=packetGate(app);
  const docs = g.req.map(d=>{ const pt=packetPointOf(d);
    return `<label class="chk"><input type="checkbox" ${app.packetDocs[d]?'checked':''}
     ${st.idx>0||st.closed?'disabled':''} onchange="RS.toggleDoc('${app.id}','${esc(d)}',this.checked)"> ${esc(d)}${
     pt?` <span class="mode-tag">п. ${pt}</span>`:' <span class="mode-tag">по виду заявки</span>'}</label>`;
  }).join('') || '<div class="op-empty">Виды не выбраны — требований к пакету нет.</div>';
  const cond = [];
  if(coverShortInScope(app)) cond.push('покрытие обеспечением недостаточно либо снимка нет ⇒ добавлены залоговые предложения (п. 86)');
  if(allowedParams(app).has('rate')) cond.push('в видах есть изменение ставки ⇒ добавлены документы снижения (п. 95 пп. 1–2)');
  let gate='';
  if(st.idx===0 && !st.closed){
    gate = g.ok
      ? `<div class="okline">Пакет полон. Переход в «Анализ» доступен (кнопка внизу).</div>`
      : `<div class="flagline">Пакет неполон (нет: ${g.missing.map(esc).join(', ')||'—'}). Гейт стадии 1: доступен только исход «возвращена без рассмотрения» либо докомплект. Переход в «Анализ» заблокирован.</div>`;
  }
  const retBtn = (st.idx===0 && !st.closed)
    ? `<button class="btn btn-secondary btn-sm" onclick="RS.returnApp('${app.id}')">Вернуть без рассмотрения</button>` : '';
  return `<div class="detail-panel active">
    <div class="section-h">Обращение</div>
    <div class="section-note">Дата регистрации: <b>${app.regDate}</b>. Пакет — нормативные приложения пп. 85–86, 95 Положения (прил. к ПКМ КР №14 от 19.01.2026) плюс документы выбранных видов (Р-3, ADR-0099 §5).</div>
    ${gate}
    <div class="f2" style="max-width:640px">${docs}</div>
    ${cond.length?`<div class="section-note" style="margin-top:10px">Условные строки пакета: ${cond.map(esc).join(' · ')}.</div>`:''}
    <div style="margin-top:14px">${retBtn}</div>
  </div>`;
}

/* 2. Охват — таблица кредитов; валидации ИНН и «другая активная заявка» (Р-2) */
function pScope(app){
  const rows=app.creditIds.map(id=>{ const c=creditById(id); const other=activeAppOnCredit(id,app.id);
    return `<tr>
      <td>${c.no}</td><td class="numcell">${fmt(c.balance)}</td>
      <td>${c.odDays} дн. / ${fmt(c.odSum)}</td>
      <td>${c.collProc?`<span class="rowlink" onclick="RS.showMirror('${c.collProc}','${app.id}')">${c.collProc}</span>`:'—'}</td>
      <td>${other?`<span class="pill high">${other.id}</span>`:'<span class="pill low">нет</span>'}</td>
      <td>реструкт.: ${c.restructCount}</td>
    </tr>`; }).join('') || `<tr><td colspan="6" class="op-empty">Охват пуст</td></tr>`;
  const st=stageOf(app);
  const addBtn = (!st.closed) ? `<button class="btn btn-primary btn-sm" onclick="RS.openAddCredit('${app.id}')">+ Добавить кредит</button>`:'';
  return `<div class="detail-panel active">
    <div class="section-h">Охват заявки</div>
    <div class="section-note">Только кредиты ИНН <b>${app.inn}</b>. Кредит с другой активной заявкой добавить нельзя (Р-2). Остаток/просрочка — read-only снимки.</div>
    <div class="gtoolbar">${addBtn}</div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr>
      <th>Кредит</th><th class="numcell">Остаток</th><th>Просрочка</th><th>Взыскание</th><th>Другая активная заявка</th><th>Счётчик</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

/* 3. Заключения (Р-5) */
function pConcl(app){

/* 4. База и распоряжения (issues/05, вариант B) — пять статей (ADR-0110), два датированных числа, производный транш.
   Гейты Пределы/Согласия подключены (тикет 07): норма-справочник (limitsGate) и зеркало GUARANTEES
   (consentGate) — оба жёсткие, без waiver. Флажки/распоряжения — read-only показ по умолчанию
   (issues/02 задал состав, интерактивная правка куратором — тикет 07, issues/05 просит только
   раскладку). */
function gateChipsRow(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app);
  return `${lga.pending?'<span class="pill neutral">Пределы — расчёт не выбран</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы ${lga.ok?'OK':'блок'}</span>`}
    <span class="gatechip ${coa.ok?'ok':'no'}">Согласия ${coa.ok?'OK':'блок'}</span>
    <span class="gatechip ${cga.ok?'ok':'no'}">Покрытие ${cga.ok?'OK':'блок (мягкий)'}</span>`;
}
function coverBody(app){
  const cga=coverGateApp(app);
  const rows=cga.rows.map(({cr,g})=>`<div class="mrow"><span>${cr.no}</span><span>${g.cover}% из требуемых ${g.required}% (${esc(g.source||'Залог')}, снимок ${esc(g.snapshotDate||'—')}${g.stale?` <span class="pill high" title="Снимок старше ${COVER_SNAPSHOT_STALE_DAYS} к.д. — данные модуля залога могли устареть">устарел</span>`:''})${g.coverOk?'':' — недостаточно'}</span></div>`).join('') || '<div class="mrow"><span>—</span><span>кредиты не выбраны</span></div>';
  return `<div class="mirror">${rows}</div>` + (cga.ok?'':`<div class="warnline">Недостаточно покрытия по одному или нескольким кредитам — мягкий гейт, снимается решением комитета по администрированию бюджетных кредитов (вкладка «Оформление»).</div>`);
}
/* Пол ставки — ДВА порога, применяется больший (п. 92 + п. 34, ADR-0099 §2): 50 % от
   первоначальной ставки и минимум по виду проекта. Вид не указан либо ставка внешняя ⇒ второй
   пол не вычисляется, гейт работает по первому и говорит об этом вслух — молчаливое «пройдено»
   на непроверенном условии хуже флага. */
function limitsBody(app){
  const lga=limitsGateApp(app);
  if(lga.pending) return `<div class="op-empty">${esc(lga.messages[0])}</div>`;
  const projLine = lga.projectUnchecked
    ? `<div class="mrow"><span>Минимум по виду проекта</span><span><b>не проверен</b> — ${lga.projectRow?'ставка внешняя ('+esc(lga.projectRow.label)+'), машинно не вычисляется':'вид проекта у кредита не указан'} (${esc(normNote(lga.projRec))})</span></div>`
    : `<div class="mrow"><span>Минимум по виду проекта</span><span>${lga.projFloor}% — ${esc((lga.projectRow||{}).label||'')} (${esc(normNote(lga.projRec))})</span></div>`;
  return `<div class="mrow"><span>Срок</span><span>предел ${lga.cap} мес. от остатка задолженности (${esc(normNote(lga.capRec))})${lga.termOk?'':' — превышен'}</span></div>
    <div class="mrow"><span>50 % от первоначальной ставки</span><span>${lga.half}% (${esc(normNote(lga.floorRec))})</span></div>
    ${projLine}
    <div class="mrow"><span>Действующий пол ставки</span><span><b>${lga.floor}%</b> — больший из двух${lga.rateOk?'':' · ставка ниже минимума'}</span></div>`
    + (lga.ok?'':`<div class="warnline">${lga.messages.map(esc).join('<br>')} — жёсткий гейт, без waiver.</div>`);
}
function consentBody(app){
  const coa=consentGateApp(app);
  const rows=coa.rows.flatMap(({cr,g})=>g.list.map(x=>`<div class="mrow"><span>${cr.no} · ${esc(x.name)}</span><span>${esc(x.status)} (${x.date})</span></div>`));
  return `<div class="mirror">${rows.join('')||'<div class="mrow"><span>—</span><span>обеспечителей нет</span></div>'}</div>`
    + (coa.ok?'':`<div class="warnline">Не согласовано: ${coa.pending.map(esc).join(', ')} — жёсткий гейт, без waiver.</div>`);
}
function gateDetails(app){
  const cga=coverGateApp(app), lga=limitsGateApp(app), coa=consentGateApp(app);
  return `
  <details class="gate-d"><summary>${lga.pending?'<span class="pill neutral">Пределы</span>':`<span class="gatechip ${lga.ok?'ok':'no'}">Пределы</span>`} жёсткий, норма-справочник</summary><div class="gate-body">${limitsBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${coa.ok?'ok':'no'}">Согласия</span> жёсткий, ответ Обеспечения</summary><div class="gate-body">${consentBody(app)}</div></details>
  <details class="gate-d"><summary><span class="gatechip ${cga.ok?'ok':'no'}">Покрытие</span> мягкий, ответ Залога</summary><div class="gate-body">${coverBody(app)}</div></details>`;
}
/* производный транш по итогам ДС — единственный признак связи назад к door: ops[0].basis (issues/03). */
function resultTranche(app){
  if(!app.ds || !app.ds.no) return null;
  const credit=creditById(app.creditIds[0]); if(!credit) return null;
  return credit.tranches.find(t=>{ const b=(t.ops[0]||{}).basis; return b && b.ds===app.ds.no && b.from===app.ds.sourceTrancheId; }) || null;
}
function rowsTotal(rows){ return round2((rows||[]).reduce((s,r)=>s+r.amount,0)); }

/* Дверь распоряжения (РС-38) — раскрытая строка под самой позицией, не модалка: вид уже
   выбирается селектом в строке, сумма и сроки — его продолжение. Сроки показываются только у
   распоряжений, рождающих БЕЗСТАВОЧНУЮ сумму, и у остальных это сказано подписью, а не
   пустотой. Расхождение интервала с длиной плана (ИР-15) горит здесь же и повторяется причиной
   в панели гейтов — молчаливой подрезки нет (РС-40). */
function dispDoorRow(app, row, d, canEdit, planLen){
  if(!row.included || !d || d.kind==='none') return '';
  const dis = canEdit ? '' : 'disabled';
  const A=`'${app.id}','${row.article}','${row.urgency}'`;
  const rest = round2(row.amount - (d.amount||0));
  const hasPer = dispositionHasPeriods(d.kind, row.article);
  const per = d.periods || allPeriods();
  const isRange = per.mode==='range';
  let periodsBlock;
  if(!hasPer){
    periodsBlock = `<span class="mode-tag">${d.kind==='forgive'
      ? 'сроков нет — прощённая сумма к уплате не назначается'
      : 'сроков нет — капитализированные проценты вливаются в тело и живут сроками тела'}</span>`;
  } else {
    periodsBlock = `<div class="dd-grp"><span class="flabel">Сроки</span>
        <label class="chk"><input type="radio" name="per-${app.id}-${row.article}-${row.urgency}" ${isRange?'':'checked'} ${dis}
          onchange="RS.setDispPeriods(${A},'all')"><span class="lbl">весь график</span></label>
        <label class="chk"><input type="radio" name="per-${app.id}-${row.article}-${row.urgency}" ${isRange?'checked':''} ${dis}
          onchange="RS.setDispPeriods(${A},'range')"><span class="lbl">интервал позиций</span></label>
      </div>`
      + (isRange ? `<div class="dd-grp"><span class="flabel">с</span>
        <input class="dd-pos" type="number" min="1" step="1" value="${per.from}" ${dis} onchange="RS.setDispPeriods(${A},'range',this.value,null)">
        <span class="flabel">по</span>
        <input class="dd-pos" type="number" min="1" step="1" value="${per.to}" ${dis} onchange="RS.setDispPeriods(${A},'range',null,this.value)">
      </div>` : '');
  }
  // ИР-15 — сверяется с ЧЕРНОВИКОМ графика; пока его нет, шкалы позиций тоже нет, и это говорится.
  let mismatch='';
  if(hasPer && isRange){
    if(planLen==null) mismatch = `<span class="pill neutral">черновой график ещё не рассчитан — длину интервала не с чем сверить</span>`;
    else if(per.to>planLen || per.from<1 || per.from>per.to)
      mismatch = `<span class="pill high">сроки ${per.from}–${per.to}, а в графике ${planLen} ${planLen===1?'позиция':'позиций'} — регистрация ДС закрыта (ИР-15)</span>`;
  }
  return `<tr class="disp-door"><td colspan="6"><div class="dd-wrap">
      <div class="dd-grp"><span class="flabel">Сумма</span>
        <input type="number" min="0" step="0.01" value="${d.amount!=null?d.amount:''}" ${dis} onchange="RS.setDispAmount(${A},this.value)">
        <span class="mode-tag">≤ ${fmt(row.amount)}</span></div>
      ${periodsBlock}
      ${mismatch}
      <div class="dd-note">${rest>0.005
        ? 'без распоряжения остаётся '+fmt2(rest)+' — уходит в перенос своей статьёй и остаётся просроченным'
        : 'позиция покрыта распоряжением целиком — просрочка по ней снимается'}</div>
    </div></td></tr>`;
}
function pCalcBase(app){
  const cr=creditById(app.creditIds[0]);
  if(!cr) return `<div class="detail-panel active"><div class="op-empty">Добавьте кредит в охват — расчёт строится по транш-источнику.</div></div>`;
  if(!app.calcTranche) return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>
    <div class="section-h" style="margin-top:0">Транш-источник расчёта</div>
    ${pickTrancheBlock(app)}
    ${gateDetails(app)}
  </div>`;

  const src=app.calcTranche;
  const drift=cutoffDrift(app);
  const srezRow = app.cutoff
    ? (app.cutoff.rows ? {v:fmt(rowsTotal(app.cutoff.rows)), s:'зафиксирован письмом '+app.cutoff.date} : {v:'—', s:'дата '+app.cutoff.date+' — сумма зафиксируется отправкой письма'})
    : {v:'—', s:'письмо в уполномоченный орган ещё не направлено'};
  const factRow = app.ds && app.ds.fact
    ? {v:fmt(rowsTotal(app.ds.fact.rows)), s:'зафиксирован ДС '+app.ds.no+' от '+app.ds.fact.date}
    : {v:fmt(rowsTotal(debtAt(src,TODAY))), s:'предпросмотр на '+TODAY+' — ДС ещё не зарегистрировано'};
  const driftPct = drift ? (drift.pct*100).toFixed(1).replace(/\.0$/,'')+'% от среза' : '';
  const deltaRow = drift
    ? {v:(drift.delta>=0?'+':'')+fmt(drift.delta),
       s: driftPct+' — '+(drift.level===0 ? 'обе ступени не задеты'
            : drift.level===1 ? 'ступень 1: '+DRIFT_TIERS[0].need+', регистрацию не блокирует'
            : 'ступень 2: '+DRIFT_TIERS[1].need),
       flag:drift.material}
    : {v:'—', s:'дельта считается после фиксации и среза, и факта (issues/02 реш.2)', flag:false};

  const base = app.base && app.base.length ? app.base : defaultBase(app, app.ds?app.ds.date:TODAY);
  const dispositions = app.dispositions && app.dispositions.length ? app.dispositions : defaultDispositions(base);
  const ordered=[...base].sort((a,b)=>{
    const ia=ARTICLES.findIndex(x=>x.key===a.article), ib=ARTICLES.findIndex(x=>x.key===b.article);
    return ia!==ib ? ia-ib : (a.urgency==='over'?-1:1)-(b.urgency==='over'?-1:1);
  });
  const canEdit = canX('editBase');
  const allowed = allowedDispositions(app);
  // Длина черновика графика — та самая шкала, в позициях которой куратор задаёт сроки (РС-38).
  // Пока расчёт не проведён, шкалы нет, и об этом говорится вслух, а не подставляется срок/12.
  const planLen = (app.version && app.version.plan && app.version.plan.rows) ? app.version.plan.rows.length : null;
  const rows = ordered.map(r=>{
    const d=dispositionFor(dispositions,r.article,r.urgency);
    const urg=(URG.find(u=>u.key===r.urgency)||{}).name||r.urgency;
    const dead = r.blockedBy==='disputed';
    const chk = dead
      ? `<label class="chk dead"><input type="checkbox" disabled ${r.included?'checked':''}><span class="lbl">спорная — решает комиссия</span></label>`
      : `<label class="chk"><input type="checkbox" ${r.included?'checked':''} ${canEdit?'':'disabled'} onchange="RS.toggleBaseRow('${app.id}','${r.article}','${r.urgency}')"><span class="lbl">${r.included?'включена':'снята куратором'}</span></label>`;
    const disp = r.included
      ? `<select ${canEdit?'':'disabled'} onchange="RS.setDisposition('${app.id}','${r.article}','${r.urgency}',this.value)">
          ${['none','cap','forgive','spread'].map(k=>{
            const ok = k==='none' || allowed.has(k);
            return `<option value="${k}" ${d&&d.kind===k?'selected':''} ${ok?'':'disabled'}>${DISP_LABEL[k]}${ok?'':' — вид не разрешает'}</option>`;
          }).join('')}
        </select>`
      : '<span class="mode-tag">без распоряжения (строка снята)</span>';
    const rowCls = dead ? 'art-blocked' : (!r.included ? 'art-removed' : '');
    /* База начисления статьи (РС-27/ADR-0106). У терминальных статей она пуста, и это сказано
       вслух: пустое начисление, показанное молча, читается как недоработка движка. */
    const am=accrualModeOf(r.article, app.ds?app.ds.date:TODAY);
    const accrOn=[]; if(am.mode.interest) accrOn.push('проценты'); if(am.mode.penalty) accrOn.push('пеня');
    const accCell = accrOn.length
      ? `<span class="mode-tag">${accrOn.join(' + ')}</span>`
      : `<span class="mode-tag" title="Терминальная статья: только гасится, начислений не порождает (РС-27)">не начисляется — терминальная</span>`;
    return `<tr class="${rowCls}"><td>${esc(ARTICLE_LABEL[r.article]||r.article)}</td><td>${urg}</td><td class="numcell">${fmt(r.amount)}</td><td>${accCell}</td><td>${chk}</td><td>${disp}</td></tr>`
         + dispDoorRow(app, r, d, canEdit, planLen);
  }).join('') || '<tr><td colspan="6" class="op-empty">Долг по траншу пуст на выбранную дату</td></tr>';

  /* Итог прогона (ADR-0109): перенос — одно число, но происхождение его частей видно здесь.
     Капитализированные проценты влились в тело, капитализированная пеня легла в колонку
     накопленной пени — восьмой статьи нет, и различить их можно только этими счётчиками и
     записью в акте. Пока счётчик никто не показывает, «выделение отдельной суммой» п. 89
     пп. 4 остаётся переменной, а не суммой в документе. */
  const runSum = run(app, app.ds?app.ds.date:TODAY);
  const sumTiles = [
    ['Прощено', runSum.forgiven, 'п. 89 пп. 5 — к уплате не назначается'],
    ['Капитализировано процентов', runSum.capitalizedInterest, 'влились в колонку основного долга — ставка на них идёт'],
    ['Капитализировано пени', runSum.capitalizedPenalty, 'легла в колонку накопленной пени — безставочная (ADR-0106, ИР-11)'],
    ['Тело переноса', runSum.principalPart, 'база начисления графика'],
    ['Перенос, всего', runSum.transferSum, 'сумма акта ДС — одно число, пара transfer_out/transfer_in не расщепляется']
  ].filter(([,v],i)=>i>=3 || round2(v)>0);
  const runBlock = `<div class="two-num-grid">${sumTiles.map(([l,v,d])=>
    `<div class="numtile"><div class="nt-l">${l}</div><div class="nt-v">${fmt(v)}</div><div class="nt-d">${d}</div></div>`).join('')}</div>`;

  const derived=resultTranche(app);
  let splitBlock;
  if(derived){
    const srcConds=conditionsAt(src,TODAY);
    splitBlock = `<div class="split-wrap">
      <div class="split-box">
        <div class="sb-t">${esc(src.no)} · исходный${src.closed?' — закрыт':''}</div>
        <div class="sb-row"><span>Остаток</span><span>${fmt(balanceAt(src,TODAY))}</span></div>
        <div class="sb-row"><span>Условия</span><span>${srcConds.rate!=null?srcConds.rate+'%':'—'}, прежние</span></div>
        <div class="sb-row"><span>Статус</span><span>${src.closed?'закрыт переносом '+src.closed.date:'срочный остаток, график не тронут'}</span></div>
      </div>
      <div class="split-arrow">→</div>
      <div class="split-box new">
        <div class="sb-t">${esc(derived.no)} · производный</div>
        <div class="sb-row"><span>Перенесённая база</span><span>${fmt(derived.amount)}</span></div>
        <div class="sb-row"><span>Новые условия</span><span>${derived.originalRate!=null?derived.originalRate+'%':'—'}</span></div>
        <div class="sb-row"><span>Начало</span><span>${derived.plannedDate}</span></div>
      </div>
    </div>
    <div class="section-note">Деление — не сценарий, а факт устройства двери (issues/03): restructureApplied всегда заводит производный транш и зеркальную пару transfer_out/transfer_in, даже когда перенесён весь остаток источника — источник в этом случае просто закрывается (см. статус слева).</div>`;
  } else {
    splitBlock = `<div class="op-empty">Производный транш появится после регистрации доп. соглашения (вкладка «Оформление»).</div>`;
  }

  return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>

    <div class="section-h" style="margin-top:0">Два датированных числа</div>
    <div class="section-note">Срез — согласовательная величина (заключения, комитет, письмо). Факт — то же самое на дату вступления ДС; реквизит ДС, единственное, что идёт в учёт (issues/02 реш.2).</div>
    <div class="two-num-grid">
      <div class="numtile"><div class="nt-l">Срез — ${app.cutoff?app.cutoff.date:'—'}</div><div class="nt-v">${srezRow.v}</div><div class="nt-d">${srezRow.s}</div></div>
      <div class="numtile delta ${deltaRow.flag?'flag':''}"><div class="nt-l">Дельта ожидания</div><div class="nt-v">${deltaRow.v}</div><div class="nt-d">${deltaRow.s}</div></div>
      <div class="numtile"><div class="nt-l">Факт — ${app.ds&&app.ds.fact?app.ds.fact.date:TODAY}</div><div class="nt-v">${factRow.v}</div><div class="nt-d">${factRow.s}</div></div>
    </div>

    <div class="section-h">База — статьи долга, распоряжения</div>
    <div class="section-note">Порядок строк — константа конвейера PIPELINE (issues/02 реш.6): накопленные проценты → накопленная пеня → пеня → проценты → основной долг. Расходов взыскания и сборов здесь нет вовсе (ADR-0110): формы п. 89 их не касаются, расходами владеет «Взыскание», сбор — цена отдельной услуги. Галка и распоряжение — живые (issues/02 реш.1/4, тикет 07): куратор снимает строку или меняет распоряжение прямо здесь; спорная пеня (ИР-6) и распоряжения, которых вид не допускает, — мёртвые пункты с подписью, не скрытые.${canEdit?'':' <span class="mode-tag">роль «'+esc(state.role)+'» правку не делает — только Куратор ОД.</span>'}</div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr><th>Статья</th><th>Срочность</th><th class="numcell">Сумма</th><th>База начисления</th><th>Включена</th><th>Распоряжение</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-note">Колонка «база начисления» — режим статьи на дату операции (РС-27, ADR-0106): пеня терминальна — ни она сама, ни капитализированная пеня, ни просроченное накопленное начислений не порождают. Режим хранится с датой начала действия, поэтому сделки прошлых лет продолжают считаться по правилу, действовавшему тогда.</div>

    <div class="section-h">Итог прогона</div>
    <div class="section-note">Перенос уходит одним числом (РС-41: пара transfer_out/transfer_in и акт ДС не расщепляются), но раскладывается по тем же пяти статьям долга. Капитализированные проценты вливаются в тело и начисляют ставку; капитализированная пеня ложится в колонку накопленной пени и остаётся безставочной — восьмой статьи не заводится, различие происхождения несут эти счётчики и запись в акте (ADR-0109).</div>
    ${runBlock}

    <div class="section-h">Производный транш</div>
    ${splitBlock}

    <div class="section-h">Гейты — подробно</div>
    ${gateDetails(app)}
  </div>`;
}

function pCalcSched(app){
  const cr=creditById(app.creditIds[0]);
  if(!cr) return `<div class="detail-panel active"><div class="op-empty">Добавьте кредит в охват — расчёт строится по транш-источнику.</div></div>`;
  if(!app.calcTranche) return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>
    <div class="section-h" style="margin-top:0">Транш-источник расчёта</div>
    <div class="op-empty">Транш-источник не выбран — график недоступен. Выбор — на вкладке «База и распоряжения».</div>
    ${gateDetails(app)}
  </div>`;

  const src=app.calcTranche;
  const derived=resultTranche(app);

  let draftBlock;
  if(derived){
    const ver=derived.schedules[0];
    draftBlock = {rows:ver.rows, pill:'<span class="pill low">Действующий</span>', note:'tranche.schedule — реквизит вступившего ДС, дверь restructureApplied положила версию сюда (issues/03).'};
  } else if(app.version && app.version.plan){
    draftBlock = {rows:app.version.plan.rows, pill:'<span class="pill info">Черновик</span>', note:'app.version.plan — предмет согласования, дверью не трогается; вступивший ДС положит версию на tranche.schedule отдельно (issues/03).'};
  } else {
    draftBlock = null;
  }

  const activeRows=(scheduleAt(src,TODAY)?.rows||[]).filter(r=>r.date>=TODAY).slice(0,6);

  /* Строка графика несёт статьи (РС-41, ADR-0109): рядом с телом и процентом — безставочные
     колонки. Пустая колонка не рисуется, и обычный кредит выглядит как прежде. Итоговая строка
     показывает раскладку переноса — ровно то, что сверяет ИР-2. `allRows` — полный график, когда
     на экран выведены первые несколько строк: итог обязан считаться по всему графику. */
  function tbl(title,pillHtml,rows,emptyMsg,allRows){
    const full = allRows || rows;
    const cols = scheduleArticleCols(full);
    const head = cols.map(k=>`<th>${esc(ARTICLE_LABEL[k]||k)}</th>`).join('');
    const body=rows.map(r=>`<tr><td>${r.date}</td><td class="numcell">${fmt(r.principal)}</td><td class="numcell">${fmt(r.interest||0)}</td>${
        cols.map(k=>`<td class="numcell">${fmt((r.articles||{})[k]||0)}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${3+cols.length}" class="op-empty">${emptyMsg}</td></tr>`;
    let foot='';
    if(allRows && full.length){
      const sumP=round2(full.reduce((s,r)=>s+(r.principal||0),0));
      const sumI=round2(full.reduce((s,r)=>s+(r.interest||0),0));
      const sumC=cols.map(k=>round2(full.reduce((s,r)=>s+((r.articles||{})[k]||0),0)));
      const transfer=round2(sumP+sumC.reduce((s,v)=>s+v,0));
      foot=`<tfoot><tr><th>Перенос, всего ${fmt(transfer)}</th><th class="numcell">${fmt(sumP)}</th><th class="numcell">${fmt(sumI)}</th>${
        sumC.map(v=>`<th class="numcell">${fmt(v)}</th>`).join('')}</tr></tfoot>`;
    }
    const more = allRows && full.length>rows.length ? `<div class="mode-tag">показаны первые ${rows.length} из ${full.length} позиций; итог — по всему графику</div>` : '';
    return `<div class="f2" style="margin-bottom:6px"><div class="field"><span class="flabel">${title} ${pillHtml}</span></div></div>
    <div class="cgrid-wrap"><table class="cgrid"><thead><tr><th colspan="${3+cols.length}">${title}</th></tr><tr><th>Дата</th><th>Тело</th><th>%</th>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>${more}`;
  }

  const derivedBlock = draftBlock
    ? tbl((derived?derived.no:'производный транш'), draftBlock.pill, draftBlock.rows.slice(0,6), 'график пуст', draftBlock.rows)
    : `<div class="op-empty">Черновой график не рассчитан — задайте параметры ниже и нажмите «Предварительный расчёт», или дождитесь регистрации ДС.</div>`;
  const paramsBlock = derived ? '' : `<div class="section-h">Условия черновика ДС</div>${versionParamsBlock(app)}`;
  const activeBlock = tbl(src.no+' — действующий, не тронут переносом', '<span class="pill low">Действующий</span>', activeRows, 'график транша не оцифрован в демо-сиде (schedules[0].rows пуст) — не факт отсутствия платежей');

  const runRes=run(app, app.ds?app.ds.date:TODAY);
  // Непокрытое — то, что осталось на строке ПОСЛЕ всех распоряжений (РС-39): ровно тот же остаток,
  // по которому шаг overdue считает remainsOverdue. Частичное распределение честно попадает сюда.
  const unresolved = (runRes.base||[]).filter(r=>r.included && r.urgency==='over' && round2(r.carried)>0);
  const rs15 = runRes.remainsOverdue
    ? `<div style="margin:0 0 14px"><span class="pill mid">Кредит частично просрочен после ДС</span> <span class="mode-tag">Не урегулированы распоряжением: ${esc(unresolved.map(r=>ARTICLE_LABEL[r.article]||r.article).join(', ')||'—')} — просрочка не растворяется, входит суммой в перенос${derived?' '+derived.no:''} (РС-15).</span></div>`
    : (app.ds&&app.ds.no ? `<div class="okline">Все включённые просроченные статьи урегулированы распоряжением — перенос не несёт непокрытой просрочки (РС-15).</div>` : '');

  return `<div class="detail-panel active">
    <div class="gatebar-slim">${gateChipsRow(app)}</div>

    <div class="section-h" style="margin-top:0">Черновой график против действующего</div>
    ${derivedBlock}
    <div class="section-note">${draftBlock?draftBlock.note:''}</div>
    ${paramsBlock}
    ${activeBlock}

    <div class="section-h">Частичная реструктуризация</div>
    ${rs15}
    <div class="mode-tag">Агрегатные поля кредита (cr.odDays/odSum) при регистрации ДС не пересчитываются — демо не строит реальный движок начислений («Не-цели демо», map.md).</div>

    <div class="section-h">Гейты — подробно</div>
    ${gateDetails(app)}
  </div>`;
}

/* 5. Комитет и решение (Р-6, переборено по ADR-0107). За прежней одной стадией «решение
   уполномоченного органа» стоят ТРИ АКТА РАЗНЫХ ОРГАНОВ: заключение уполномоченного органа
   (пп. 87–88), согласование профильного комитета ЖК и постановление Кабинета Министров (п. 82).
   Все три живут внутри одного срока 70 к.д. — своих регламентных сроков у них нет, и выдумывать
   их нельзя. Отрицательное заключение (п. 88) закрывает заявку отказом, до Кабмина она не идёт. */
function pDecision(app){
  const st=stageOf(app); const c=app.committee||{}; const l=app.letterSent||{};
  const cc=app.conclusion||{}, zk=app.zk||{}, r=app.resolution||{};
  const dl=deadline(app);
  const initLabel = (INITIATORS.find(i=>i.code===app.initiator)||{}).label || null;
  const initBlock = initLabel
    ? `<div class="okline">Инициатор проекта решения: <b>${esc(initLabel)}</b> (п. 83).${app.initiatorViaEnvoy?' Внесено через полномочного представителя Президента в области.':''}</div>`
    : `<div class="warnline">Инициатор проекта решения не указан (п. 83) — реквизит справочника, а не свободная строка.</div>`;
  const committeeBlock = c.fixed
    ? `<div class="okline">Позиция комитета Холдинга: <b>${esc(c.position)}</b> (${c.date}). Позиция необязывающая — письмо направляется всегда.</div>`
    : `<div class="field" style="max-width:420px"><span class="flabel">Позиция комитета</span>
        <select id="cpos"><option value="целесообразно">целесообразно</option><option value="нецелесообразно">нецелесообразно</option></select>
        <div style="margin-top:8px"><button class="btn btn-success btn-sm" onclick="RS.fixCommittee('${app.id}')">Зафиксировать позицию</button></div></div>`;
  let letterBlock='';
  if(c.fixed){
    letterBlock = l.fixed
      ? `<div class="okline">Письмо в уполномоченный государственный орган направлено ${l.date}. Включена пауза взыскания + дедлайн решения 70 к.д. — один срок на все три акта (п. 18 Порядка №41, ADR-0107 §3).</div>`
      : `<div class="warnline">Дедлайн письма: ${dl?(dl.overdue?`<span class="dl-red">просрочен ${-dl.remaining} дн.</span>`:`осталось ${dl.remaining} дн.`):'5 р.д.'} (флаг, не блокировка). Письмо направляется при любой позиции.
         <span class="mode-tag">${esc(dl?normNote(dl.rec):normNote(normAt('deadlineLetter',c.date||TODAY)))} · рабочие дни по производственному календарю${dl&&dl.calKnown===false?' — год не заведён, счёт по сб/вс':''}</span></div>
         <button class="btn btn-primary btn-sm" onclick="RS.fixLetter('${app.id}')">Зафиксировать отправку письма</button>`;
  }
  /* акт 1 — заключение уполномоченного органа (пп. 87–88) */
  let cBlock='';
  if(l.fixed){
    cBlock = cc.fixed
      ? `<div class="${cc.outcome==='отказ'?'flagline':'okline'}">Заключение уполномоченного органа: <b>${cc.outcome==='отказ'?'отрицательное — отказ (п. 88)':'возможно изменение условий (п. 87)'}</b> · № ${esc(cc.no)} от ${cc.date}.${
          cc.outcome==='отказ'?' Заявка закрыта, до Кабинета Министров не доходит.':''}</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Исход заключения</span><select id="cdec">
            <option value="возможно">возможно изменение условий (п. 87)</option><option value="отказ">отрицательное заключение — отказ (п. 88)</option></select></div>
          <div class="field"><span class="flabel">Номер заключения •</span><input id="cno" placeholder="МФ-исх-№"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixConclusion('${app.id}')">Зафиксировать заключение</button>
            <span class="mode-tag" style="margin-left:8px">Без номера и исхода кнопка отклонит фиксацию (conclusionGate).</span></div>
        </div>`;
  }
  /* акт 2 — согласование профильного комитета ЖК (п. 82) */
  let zBlock='';
  if(cc.fixed && cc.outcome==='возможно'){
    zBlock = zk.fixed
      ? `<div class="okline">Профильный комитет Жогорку Кенеша согласовал проект решения: № ${esc(zk.no)} от ${zk.date}.</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Реквизит согласования ЖК •</span><input id="zno" placeholder="ЖК-К/№"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixZk('${app.id}')">Зафиксировать согласование</button>
            <span class="mode-tag" style="margin-left:8px">П. 82: Кабмин решает «по согласованию с профильным комитетом ЖК» — без отметки постановление не на чем объяснить.</span></div>
        </div>`;
  } else if(cc.fixed && cc.outcome==='отказ'){
    zBlock = `<div class="op-empty">Отрицательное заключение — согласование и постановление не требуются.</div>`;
  }
  /* акт 3 — постановление Кабинета Министров (п. 82) */
  let rBlock='';
  if(zk.fixed){
    const fg=forgiveGate(app);
    const fgLine = fg.applicable
      ? (fg.ok
          ? `<div class="okline">Прощение ${fmt(fg.sum)} названо в акте${fg.actSum!=null?` суммой ${fmt(fg.actSum)}`:' основанием'}${fg.mismatch?` — <b>расхождение с распоряжениями заявки</b>`:''} (РС-28).${fg.basis?` Основание: ${esc(fg.basis)}`:''}</div>`
          : `<div class="flagline">В распоряжениях есть прощение на ${fmt(fg.sum)}, но акт его не называет. Списание бюджетных средств без названной суммы или основания в решении органа невозможно — жёсткий гейт РС-28/ИР-13.</div>`)
      : '';
    rBlock = (r.fixed
      ? `<div class="${r.decision==='отказ'?'flagline':'okline'}">Постановление Кабинета Министров: <b>${decLabel(r.decision)}</b> · ${esc(r.no)} от ${r.date}. Это и есть реквизит регистрации ДС (п. 96 — соглашение оформляет агент или кредитный агент).</div>`
      : `<div class="f2" style="max-width:640px">
          <div class="field"><span class="flabel">Решение</span><select id="rdec">
            <option value="одобрено">одобрено</option><option value="изм">одобрено с изменёнными условиями</option><option value="отказ">отказ</option></select></div>
          <div class="field"><span class="flabel">Реквизит постановления •</span><input id="rno" placeholder="ПКМ КР № … от дата"></div>
          <div class="field"><span class="flabel">Сумма прощения по акту</span><input id="rfsum" placeholder="если названа суммой"></div>
          <div class="field"><span class="flabel">Основание прощения</span><input id="rfbasis" placeholder="если названо основанием"></div>
          <div class="field col-span"><button class="btn btn-primary btn-sm" onclick="RS.fixResolution('${app.id}')">Зафиксировать постановление</button>
            <span class="mode-tag" style="margin-left:8px">Без реквизита кнопка отклонит фиксацию (resolutionGate).</span></div>
        </div>`) + fgLine;
  }
  const auto = automationBlock(app);
  return `<div class="detail-panel active">
    <div class="section-note">Цепь актов по гл. 9 Положения (прил. к ПКМ КР №14 от 19.01.2026): комитет Холдинга → письмо → <b>заключение уполномоченного органа</b> → <b>согласование профильного комитета ЖК</b> → <b>постановление Кабинета Министров</b>. Собственных регламентных сроков у трёх актов нет — все они внутри 70 к.д. (ADR-0107 §3).</div>
    ${initBlock}
    <div class="section-h" style="margin-top:18px">Комитет Холдинга</div>${committeeBlock}
    <div class="section-h" style="margin-top:18px">Письмо в уполномоченный орган</div>${letterBlock||'<div class="op-empty">Сначала зафиксируйте позицию комитета.</div>'}
    <div class="section-h" style="margin-top:18px">Заключение уполномоченного органа (пп. 87–88)</div>${cBlock||'<div class="op-empty">Сначала зафиксируйте отправку письма.</div>'}
    <div class="section-h" style="margin-top:18px">Согласование профильного комитета ЖК (п. 82)</div>${zBlock||'<div class="op-empty">Сначала зафиксируйте заключение уполномоченного органа.</div>'}
    <div class="section-h" style="margin-top:18px">Постановление Кабинета Министров (п. 82)</div>${rBlock||'<div class="op-empty">Сначала зафиксируйте согласование профильного комитета ЖК.</div>'}
    ${auto}
  </div>`;
}
function decLabel(d){ return d==='изм'?'одобрено с изменёнными условиями':d==='отказ'?'отказ':'одобрено'; }

/* Блок «Автоматика» (Р-12/13/14) + мини-зеркало */
function automationBlock(app){
  if(!app.automation.length) return '';
  const events=app.automation.map(e=>`<div class="op-row"><span class="pill ${e.kind==='risk'?'high':e.kind==='unpause'?'low':'mid'}">${e.kind}</span><span class="op-t">${esc(e.text)}</span><span class="mode-tag">${e.when}</span></div>`).join('');
  const cr=creditById(app.creditIds[0]); const proc=cr&&cr.collProc?state.procs[cr.collProc]:null;
  const paused = app.letterSent&&app.letterSent.fixed && !(app.outcome==='отказ'||(app.ds&&app.ds.no));
  const mirror = proc ? `<div class="mirror">
      <div class="mh">Зеркало процесса взыскания ${proc.id} (read-only)</div>
      ${paused?`<div class="mbanner">⏸ Пауза (предмет — меры п. 16, ADR-0063: обе претензии, требования поручителю/гаранту/госоргану, безакцепт; судебный и залоговый треки идут своим ходом; дедлайн 70 к.д.) — источник: заявка <span class="rowlink" onclick="RS.openApp('${app.id}')">${app.id}</span></div>`:''}
      <div class="mrow"><span>Фаза</span><span>${proc.phase}</span></div>
      <div class="mrow"><span>Дней в категории</span><span>${proc.catDays}</span></div>
      <div class="mrow"><span>Заёмщик (ИНН)</span><span>${proc.inn}</span></div>
    </div>`:'';
  return `<div class="section-h" style="margin-top:20px">Автоматика швов</div>
    <div class="ops-list">${events}</div>
    ${mirror}
    <div class="infoline">Пени во время паузы <b>продолжают начисляться</b> (Р-13). Пауза останавливает меры, не обязательства.</div>
    <div class="infoline">Оси заёмщика <b>не трогаем</b> (Р-14): группа и риск-категория меняются только классификатором; счётчик реструктуризаций на кредите +1.</div>`;
}

/* 6. Оформление (Р-8, Р-15) */
function pFormal(app){
  // оформление открывает ПОСТАНОВЛЕНИЕ КМ, а не заключение органа (ADR-0107 §«Последствия»)
  const approved = app.resolution&&app.resolution.fixed&&app.resolution.decision!=='отказ';
  if(!approved) return `<div class="detail-panel active"><div class="op-empty">Оформление доступно после постановления Кабинета Министров об изменении условий (п. 82). Заключения уполномоченного органа для этого недостаточно.</div></div>`;
  const cga=coverGateApp(app);
  const rows=cga.rows.map(({cr,g})=>`<tr>
    <td>${cr.no}</td>
    <td class="numcell">${g.cover}% / ≥${g.required}%</td>
    <td>${g.coverOk?'<span class="gatechip ok">покрытие ✓</span>':'<span class="gatechip no">покрытие ✗</span>'}</td>
    <td>${cr.tech?(g.ageOk?'<span class="gatechip ok">возраст ✓</span>':'<span class="gatechip no">возраст ✗</span>'):'<span class="mode-tag">не техника</span>'}</td>
    <td>${g.insured?'<span class="gatechip ok">страховка ✓</span>':'<span class="gatechip no">страховка ✗</span>'}</td>
    <td>${esc(g.source||'Залог')}, ${esc(g.snapshotDate||'—')}${g.stale?` <span class="pill high" title="Снимок старше ${COVER_SNAPSHOT_STALE_DAYS} к.д. — данные модуля залога могли устареть">устарел</span>`:''}</td>
  </tr>`).join('');
  const waived = app.waiver&&app.waiver.granted;
  let gateLine;
  if(cga.ok && !waived) gateLine=`<div class="okline">Гейт обеспечения пройден по всем кредитам. Регистрация доп. соглашения доступна.</div>`;
  else if(waived) gateLine=`<div class="warnline">Гейт обеспечения снят решением комитета по администрированию бюджетных кредитов. Основание: ${esc(app.waiver.reason)} (${app.waiver.date}).</div>`;
  else gateLine=`<div class="flagline">Гейт обеспечения не пройден — регистрация доп. соглашения заблокирована. Разблокировка — решением комитета по администрированию бюджетных кредитов с обязательным основанием (КД-10 модуля залога: роли «залоговая комиссия» в системе нет).</div>`;
  const lga=limitsGateApp(app), coa=consentGateApp(app);
  const limitsLine = lga.pending ? '<div class="op-empty">Расчёт (транш-источник/условия) ещё не выбран — гейт неприменим.</div>'
    : lga.ok ? `<div class="okline">Срок и ставка новых условий в пределах нормы (${esc(normNote(lga.capRec))}).${
        lga.projectUnchecked?' <b>Вид проекта не указан — минимум п. 34 не проверен</b>, гейт работает по одному полу (50 % от первоначальной).':''}</div>`
    : `<div class="flagline">${lga.messages.map(esc).join('<br>')} — жёсткий гейт, без waiver.</div>`;
  const consentLine = coa.ok ? '<div class="okline">Согласия всех обеспечителей получены.</div>'
    : `<div class="flagline">Не согласовано: ${coa.pending.map(esc).join(', ')} — жёсткий гейт, без waiver.</div>`;
  const fg=forgiveGate(app);          // РС-28 — жёсткий: без названной суммы/основания ДС не регистрируется
  const dg=driftGate(app, TODAY);     // РС-26 ступень 2 — возврат на комитет, регистрация заблокирована
  const forgiveLine = !fg.applicable ? '<div class="op-empty">Прощения в распоряжениях нет — гейт неприменим.</div>'
    : fg.ok ? `<div class="okline">Прощение ${fmt(fg.sum)} названо в постановлении${fg.actSum!=null?` суммой ${fmt(fg.actSum)}`:' основанием'}.${
        fg.mismatch?` <b>Сумма акта (${fmt(fg.actSum)}) расходится с распоряжениями (${fmt(fg.sum)})</b> — расхождение видимо, решает куратор.`:''}</div>`
    : `<div class="flagline">Прощение ${fmt(fg.sum)} не названо в постановлении Кабмина — регистрация ДС заблокирована (РС-28/ИР-13).</div>`;
  const driftLine = !dg.applicable ? '<div class="op-empty">Срез не зафиксирован — порог неприменим.</div>'
    : dg.level===0 ? `<div class="okline">Долг на дату вступления ${fmt(dg.factSum)} против среза ${fmt(dg.cutoffSum)} — расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}), обе ступени не задеты.</div>`
    : dg.level===1 ? `<div class="warnline">Ступень 1: расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}) — ${esc(DRIFT_TIERS[0].need)}. Регистрацию не блокирует.</div>`
    : dg.recommitted ? `<div class="warnline">Ступень 2 сработала (${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} %, ${fmt(dg.delta)}), но комитет высказался заново ${esc(app.committee.date)} — блокировка снята.</div>`
    : `<div class="flagline">Ступень 2: расхождение ${(dg.pct*100).toFixed(1).replace(/\.0$/,'')} % (${fmt(dg.delta)}) — ${esc(DRIFT_TIERS[1].need)}. Постановление Кабмина не переподписывается: пересматривается позиция комитета Холдинга, на которой стоит письмо.</div>`;
  const done = app.ds&&app.ds.no;
  const dispRows = (app.dispositions||[]).filter(d=>d.kind!=='none');
  // Ярлык распоряжения — один на файл (DISP_LABEL, :~432): прежний локальный kindLabel повторял
  // его третьим списком и расходился бы при первом же новом виде распоряжения.
  const planLenG = (app.version && app.version.plan && app.version.plan.rows) ? app.version.plan.rows.length : null;
  const badPeriods = dispRows.filter(d=>{
    if(!dispositionHasPeriods(d.kind, d.article)) return false;
    const p = d.periods || allPeriods();
    return p.mode==='range' && planLenG!=null && (p.to>planLenG || p.from<1 || p.from>p.to);
  });
  const perLabel = d => {
    if(!dispositionHasPeriods(d.kind, d.article)) return 'сроков нет';
    const p = d.periods || allPeriods();
    if(p.mode!=='range') return 'весь график';
    const bad = planLenG!=null && (p.to>planLenG || p.from<1 || p.from>p.to);
    return 'позиции '+p.from+'–'+p.to+(bad?' — вне графика ('+planLenG+'), ИР-15':'');
  };
  // ИР-15/РС-40 — жёсткий гейт: интервал за длиной плана закрывает регистрацию до правки, а не
  // подрезается молча. Ровно та же причина придёт из validateDS, если дверь всё-таки дёрнут.
  const canReg = (cga.ok||waived) && lga.ok && coa.ok && fg.ok && dg.ok && !badPeriods.length;
  const dsBlock = done
    ? `<div class="okline">Доп. соглашение <b>${esc(app.ds.no)}</b> зарегистрировано. Версия «действует» с ${app.ds.date}. Счётчик реструктуризаций кредитов +1.</div>`
    : `<div class="gtoolbar">
        ${(!cga.ok && !waived)?`<button class="btn btn-danger btn-sm" onclick="RS.openWaiver('${app.id}')">Решение комитета по администрированию (снятие гейта)</button>`:''}
        <button class="btn btn-primary btn-sm" ${canReg?'':'disabled'} onclick="RS.openDS('${app.id}')">Зарегистрировать доп. соглашение</button>
      </div>`;
  const ops = dispRows.length
    ? `<div class="ops-list">${dispRows.map(d=>`<div class="op-row"><span class="op-t"><b>${DISP_LABEL[d.kind]||d.kind}</b> — ${esc(ARTICLE_LABEL[d.article]||d.article)} (${esc((URG.find(u=>u.key===d.urgency)||{}).name||d.urgency)})</span><span class="mode-tag">${fmt(d.amount)} · ${esc(perLabel(d))}</span></div>`).join('')}</div>`
    : '<div class="op-empty">Распоряжений нет — база и распоряжения задаются на вкладке «База и распоряжения».</div>';
  return `<div class="detail-panel active">
    <div class="section-h">Гейт пределов (жёсткий, без waiver)</div>
    <div class="section-note">Срок и ставка новых условий против норма-справочника (ADR-0099) на дату операции.</div>
    ${limitsLine}
    <div class="section-h" style="margin-top:18px">Гейт согласий обеспечителей (жёсткий, без waiver)</div>
    <div class="section-note">Ответ Обеспечения (ADR-0098) — зеркало, не собственный расчёт.</div>
    ${consentLine}
    <div class="section-h" style="margin-top:18px">Гейт прощения (жёсткий, без waiver)</div>
    <div class="section-note">Списание бюджетных средств стоит на акте: сумма либо основание прощения названы в постановлении Кабмина (РС-28, ИР-13).</div>
    ${forgiveLine}
    <div class="section-h" style="margin-top:18px">Порог расхождения среза и факта (две ступени)</div>
    <div class="section-note">Ступень 1 — ${(DRIFT_TIERS[0].pct*100)} % либо ${fmt(DRIFT_TIERS[0].abs)} сом: виза куратора. Ступень 2 — ${(DRIFT_TIERS[1].pct*100)} % либо ${fmt(DRIFT_TIERS[1].abs)} сом: возврат на комитет, регистрация заблокирована. Обе ступени — настройка с историей значений, не норма (РС-26).</div>
    ${driftLine}
    <div class="section-h" style="margin-top:18px">Гейт обеспечения (мягкий, снимается waiver-ом)</div>
    <div class="section-note">Покрытие = залоговая стоимость / остаток ≥ порог. Возраст техники против нового срока. Страховка на новый срок (Р-15).</div>
    ${gateLine}
    <div class="cgrid-wrap" style="max-width:900px"><table class="cgrid"><thead><tr><th>Кредит</th><th class="numcell">Покрытие</th><th>Гейт</th><th>Возраст</th><th>Страховка</th><th>Снимок</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-h" style="margin-top:18px">Гейт сроков распоряжений (жёсткий, без waiver)</div>
    <div class="section-note">Интервал позиций, назначенный распоряжению, лежит внутри длины чернового графика (ИР-15). Выход за длину не подрезается молча: срок мог уменьшиться после того, как куратор задал позиции, и подставить новую границу за него значит выдумать его решение (РС-40).</div>
    ${badPeriods.length
      ? `<div class="flagline">${badPeriods.map(d=>'«'+esc(ARTICLE_LABEL[d.article]||d.article)+'» — '+esc(perLabel(d))).join('; ')}. Регистрация ДС закрыта до правки интервала либо возврата к режиму «весь график».</div>`
      : (planLenG==null
          ? `<div class="okline">Черновой график ещё не рассчитан — шкалы позиций нет, сверять нечего.</div>`
          : `<div class="okline">Все интервалы лежат внутри графика (${planLenG} ${planLenG===1?'позиция':'позиций'}).</div>`)}
    <div class="section-h" style="margin-top:18px">Доп. соглашение</div>${dsBlock}
    <div class="section-h" style="margin-top:18px">Операции на дату вступления</div>${ops}
  </div>`;
}

/* 7. История (Р-16, append-only) */
function pHist(app){
  const rows=[...app.history].map(h=>`<div class="hrow ${h.cls||''}">
    <div class="hwhen">${h.when}</div><div class="hwhat">${esc(h.what)}</div>${h.who?`<div class="hwho">${esc(h.who)}</div>`:''}
  </div>`).join('');
  return `<div class="detail-panel active">
    <div class="section-h">История заявки</div>
    <div class="section-note">Append-only. Записи не удаляются и не переписываются; отмена — компенсирующей записью (Р-16).</div>
    <div class="hist">${rows||'<div class="op-empty">Пусто</div>'}</div>
  </div>`;
}

/* ================= СПРАВОЧНИК ВИДОВ (Р-3, РС-33/ИР-14) =================
   Справочник ОТКРЫТ, но каждая запись несёт происхождение. Пять форм п. 89 замкнуты: их нельзя
   удалить и нельзя переименовать — они цитата нормы, а не настройка. Всё, что администратор
   заводит сверх них, живёт под п. 89 пп. 5 «и другим обоснованным предложениям» и обязано нести
   письменное обоснование: закрытый список остановил бы работу на форме, которой в перечне нет,
   открытый без признака — стёр бы границу между нормой и самодеятельностью. */
function renderDict(){
  const v=document.getElementById('view-dict');
  const rows=state.kinds.map(k=>`<tr>

    <td>${esc(k.limits||'')}</td>

  </tr>`).join('');
  v.innerHTML=`
    <div class="tb-actions">
      <button class="btn btn-primary btn-sm" ${canX('manageDict')?'':'disabled'} onclick="RS.openNewKind()">+ Новый вид</button>

    </div>
    <div class="grid-wrap"><table class="grid"><thead><tr>
      <th>Вид</th><th>Происхождение</th><th>Разрешённые параметры</th><th>Документы</th><th>Разрешённые распоряжения</th><th>Ограничения</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* Орган, снимающий мягкий гейт покрытия, — КОМИТЕТ ПО АДМИНИСТРИРОВАНИЮ БЮДЖЕТНЫХ КРЕДИТОВ
   (РС-31). «Залоговой комиссии» в системе нет и не будет: КД-10 модуля залога снял эту роль,
   и держать её в реструктуризации значило бы называть один и тот же орган двумя именами в
   двух модулях. */
const COVER_WAIVER_BODY = 'Комитет по администрированию бюджетных кредитов';
function openWaiver(appId){
  if(!guard('waiver')) return;
  modal(`<div class="modal">${mhead('Решение комитета по администрированию бюджетных кредитов')}<div class="modal-b">

    <div class="field col-span"><span class="flabel">Основание •</span><textarea id="wreason" placeholder="Протокол комитета, компенсирующее обеспечение, …"></textarea></div>

function grantWaiver(appId){

  H(app,'Решение комитета по администрированию бюджетных кредитов — гейт покрытия снят. Основание: '+reason,COVER_WAIVER_BODY,'waiver');
  closeModal(); toast('Гейт обеспечения снят решением комитета','ok'); render();
}

function openDS(appId){
  if(!guard('regDS')) return; const app=appById(appId);
  const cga=coverGateApp(app);
  if(!cga.ok && !(app.waiver&&app.waiver.granted)){ toast('Гейт обеспечения не пройден — сначала waiver','err'); return; }
  const lga=limitsGateApp(app);
  if(!lga.ok){ toast('Гейт пределов не пройден: '+lga.messages.join('; '),'err'); return; }               // жёсткий, без waiver
  const coa=consentGateApp(app);
  if(!coa.ok){ toast('Гейт согласий не пройден: не согласовано — '+coa.pending.join(', '),'err'); return; }  // жёсткий, без waiver
  const fg=forgiveGate(app);
  if(!fg.ok){ toast('Прощение '+fmt(fg.sum)+' не названо в постановлении Кабмина (РС-28) — регистрация невозможна','err'); return; }
  const dg=driftGate(app, TODAY);
  if(!dg.ok){ toast('Ступень 2 порога расхождения ('+(dg.pct*100).toFixed(1)+' %, '+fmt(dg.delta)+') — требуется новая позиция комитета (РС-26)','err'); return; }
  modal(`<div class="modal">${mhead('Регистрация доп. соглашения')}<div class="modal-b"><div class="mform">
    <div class="field req"><span class="flabel">Номер доп. соглашения</span><input id="dsno" placeholder="ДС-…"></div>
    <div class="field req"><span class="flabel">Дата</span><input id="dsdate" type="date" value="${TODAY}"></div>
    <div class="field col-span"><div class="section-note">Оба реквизита обязательны (Р-8). Основание — постановление Кабинета Министров ${esc((app.resolution||{}).no||'—')} от ${esc((app.resolution||{}).date||'—')}; соглашение оформляет агент либо кредитный агент (п. 96). При регистрации: версия «действует», операции на дату вступления, счётчик реструктуризаций +1.</div></div>
  </div></div><div class="modal-f"><button class="btn btn-secondary" onclick="RS.closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="RS.regDS('${appId}')">Зарегистрировать</button></div></div>`);
}
/* Единственное место в оболочке, которое зовёт дверь CreditSide.restructureApplied (ADR-0096,
   issues/03) — раньше applyEntryOps писал app.ops мимо двери, теперь пишущий путь один. */
function regDS(appId){
  const app=appById(appId); const no=(document.getElementById('dsno').value||'').trim(); const date=(document.getElementById('dsdate').value||'').trim();
  if(!no||!date){ toast('Номер и дата обязательны (Р-8)','err'); return; }
  const tranche=app.calcTranche, credit=creditById(app.creditIds[0]);
  if(!tranche||!credit){ toast('Не выбран транш-источник расчёта','err'); return; }
  const run=AppSide.run(app,date);
  const ds={ no, date, app, sourceTranche:tranche, credit, transferSum:run.transferSum,
             principalPart:run.principalPart, parts:run.parts, params:{...(app.version?app.version.params:{})} };
  const res=CreditSide.restructureApplied(ds);
  if(!res.ok){ toast(res.reasons.join('; '),'err'); return; }
  app.ds={ no, date, transferSum:ds.transferSum, sourceTrancheId:tranche.id, params:ds.params, fact:null };
  AppSide.fixFact(app, date, ds.transferSum);
  if(!app.outcome) app.outcome = app.resolution.decision==='изм'?'изм':'одобрена';
  app._t=date; H(app,'Доп. соглашение '+no+' зарегистрировано. Перенесено '+fmt(ds.transferSum)+' на транш '+res.tranche.no+'. Счётчик реструктуризаций +1.',state.role);
  if(credit.collProc){ app.automation.push({when:date,kind:'unpause',text:'Оформление завершено — пауза снята штатно, взыскание закрыто по кредитам заявки'}); }
  closeModal(); toast('Доп. соглашение зарегистрировано','ok'); render();
}

function addKind(){
  const name=(document.getElementById('nkname').value||'').trim(); if(!name){ toast('Название обязательно','err'); return; }
  const rationale=(document.getElementById('nkrat').value||'').trim();
  if(!rationale){ toast('Обоснование обязательно: вид заводится под п. 89 пп. 5 как обоснованное предложение (РС-33)','err'); return; }
  const params=[...document.querySelectorAll('.npk:checked')].map(x=>x.value);
  const docs=(document.getElementById('nkdocs').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const dispositions=[...document.querySelectorAll('.ndk:checked')].map(x=>x.value);
  const limits=(document.getElementById('nklim').value||'').trim();
  const id='X'+(state.kinds.filter(k=>!isNormKind(k)).length+1)+'_'+Date.now().toString(36);
  state.kinds.push({id,name,origin:'иное',point:'89 пп. 5',rationale,params,docs,allowedDispositions:dispositions,limits});
  closeModal(); toast('Вид создан с происхождением «иное» — доступен в заявках','ok'); render();
}
/* Удалять можно только своё: нормативная запись — цитата, не настройка (ИР-14). */
function dropKind(kindId){
  if(!guard('manageDict')) return;
  const k=kindById(kindId); if(!k) return;
  if(isNormKind(k)){ toast('Вид установлен нормой (п. '+k.point+') — удалить нельзя','err'); return; }
  const used=state.apps.find(a=>(a.kindIds||[]).includes(kindId));
  if(used){ toast('Вид используется заявкой '+used.id+' — удалить нельзя','err'); return; }
  state.kinds=state.kinds.filter(x=>x.id!==kindId);
  toast('Вид удалён','ok'); render();
}

/* Отказ снимает паузу на общих основаниях — но теперь его несут ДВА разных акта (ADR-0107):
   отрицательное заключение уполномоченного органа (п. 88) и отказ в постановлении КМ. */
function closeByRefusal(app,what){
  app.outcome='отказ';
  const cr=creditById(app.creditIds[0]); const nd=addCalDays(TODAY,1);
  app.automation.push({when:nd,kind:'unpause',text:what+' зафиксирован '+TODAY+' → снятие следующим календарным днём ('+nd+'): взыскание возобновлено с фазы «'+(cr&&cr.collProc?state.procs[cr.collProc].phase:'—')+'».'});
  app.automation.push({when:nd,kind:'risk',text:'Ночной пересчёт категории → высокий (следующим календарным днём после отказа).'});
  H(app,'Снятие паузы/оверлея следующим днём; взыскание возобновлено с сохранённой фазы; категория → высокий (РС-21).','Система','auto');

  const no=(document.getElementById('zno').value||'').trim();

function fixResolution(appId){ if(!guard('fixResolution')) return; const app=appById(appId);
  const dec=document.getElementById('rdec').value; const no=(document.getElementById('rno').value||'').trim();
  const fsumRaw=(document.getElementById('rfsum').value||'').trim();
  const fbasis=(document.getElementById('rfbasis').value||'').trim();
  if(!no){ toast('Реквизит постановления Кабмина обязателен (resolutionGate)','err'); return; }
  if(!(app.zk&&app.zk.no)){ toast('Без согласования профильного комитета ЖК постановление не регистрируется (п. 82)','err'); return; }
  const fsum = fsumRaw ? Number(fsumRaw.replace(/\s/g,'').replace(',','.')) : null;
  app.resolution={fixed:true,decision:dec,no,date:TODAY,
                  forgiveSum: (fsum!=null && !isNaN(fsum)) ? fsum : null, forgiveBasis: fbasis||null};
  app._t=TODAY;
  H(app,'Постановление Кабинета Министров: '+decLabel(dec)+' ('+no+').','Куратор ОД');
  if(dec==='отказ'){ closeByRefusal(app,'Отказ постановлением Кабмина'); toast('Отказ зафиксирован','ok'); }
  else if(dec==='изм'){ if(app.version) app.version.source='постановление КМ';
    H(app,'Условия — версия постановления Кабмина (то, что утвердили). Откройте вкладки «База и распоряжения» / «График и дифф» для просмотра расчёта.','Куратор ОД');
    toast('Одобрено с изменёнными условиями','ok');
  } else { toast('Постановление зафиксировано','ok'); }
  const fg=forgiveGate(app);
  if(fg.applicable && !fg.ok) toast('Прощение '+fmt(fg.sum)+' не названо в акте — регистрация ДС заблокирована (РС-28)','err');
  render(); }
function advance(appId){ const app=appById(appId); const adv=canAdvance(app); if(!adv||!adv.ok){ toast(adv?adv.why:'Нет перехода','err'); return; }
  if(adv.to==='Анализ'){ if(!guard('startAnalysis')) return; app.analysisStarted=true; app._t=TODAY; H(app,'Пакет укомплектован → переход в «Анализ». Дедлайн 30 к.д.',state.role); toast('Переход выполнен','ok'); render(); return; }
  if(adv.to==='Комитет'){ toast('Заключения завизированы — зафиксируйте позицию комитета во вкладке «Комитет и решение»','ok'); state.curTab='decision'; render(); return; }
}

/* ================= МАРШРУТ / ИНИЦИАЛИЗАЦИЯ ================= */
/* создание новой заявки (Р-1: заявка — единица работы, привязана к ИНН; Р-2: охват одного ИНН) */
function newApp(){
  if(!guard('createApp')) return;
  const inns=[...new Map(state.credits.map(c=>[c.inn,c.borrower])).entries()];
  const innOpts=inns.map(([inn,b],i)=>`<option value="${inn}" ${i===0?'selected':''}>${esc(b)} · ИНН ${inn}</option>`).join('');
  const kinds=state.kinds.map(k=>`<label class="chk"><input type="checkbox" class="nakind" value="${k.id}"> ${esc(k.name)}</label>`).join('');
  modal(`<div class="modal wide">${mhead('Новая заявка на реструктуризацию')}<div class="modal-b"><div class="mform">
    <div class="field req"><span class="flabel">Заёмщик (ИНН)</span><select id="nainn" onchange="RS.naFillCredits()">${innOpts}</select></div>
    <div class="field req"><span class="flabel">Дата регистрации обращения</span><input id="nadate" value="${TODAY}" placeholder="ГГГГ-ММ-ДД"></div>
    <div class="field col-span"><span class="flabel">Охват — кредиты этого ИНН <span class="ro-tag">(Р-2: кредит с активной заявкой недоступен)</span></span>
      <div id="nacredits" class="f2" style="max-width:640px"></div></div>
    <div class="field col-span"><span class="flabel">Виды реструктуризации <span class="ro-tag">(Р-3; определяют пакет документов и разрешённые параметры)</span></span>
      <div class="f2" style="grid-template-columns:1fr 1fr">${kinds}</div></div>
    <div class="section-note">Заключения (СРМиК/ДПО), чек-лист пакета и конвейер стадий создаются автоматически. Заявка стартует на стадии «Регистрация обращения».</div>
  </div></div><div class="modal-f"><button class="btn btn-secondary" onclick="RS.closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="RS.createApp()">Создать заявку</button></div></div>`);
  naFillCredits();
}
function naFillCredits(){
  const inn=document.getElementById('nainn').value;
  const list=state.credits.filter(c=>c.inn===inn).map(c=>{
    const other=activeAppOnCredit(c.id,'__new__');
    return `<label class="chk" ${other?'style="opacity:.5"':''}><input type="checkbox" class="nacred" value="${c.id}" ${other?'disabled':''}>
      ${c.no} · остаток ${fmt(c.balance)} · просрочка ${c.odDays} дн.${other?` · занят заявкой ${other.id}`:''}</label>`;
  }).join('') || '<div class="op-empty">У ИНН нет кредитов</div>';
  document.getElementById('nacredits').innerHTML=list;
}
function nextAppId(){ let n=1001; const ids=new Set(state.apps.map(a=>a.id)); while(ids.has('RS-'+n)) n++; return 'RS-'+n; }
function createApp(){
  if(!guard('createApp')) return;
  const inn=document.getElementById('nainn').value;
  const borrower=(state.credits.find(c=>c.inn===inn)||{}).borrower||'';
  const regDate=(document.getElementById('nadate').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(regDate)){ toast('Дата регистрации в формате ГГГГ-ММ-ДД','err'); return; }
  const creditIds=[...document.querySelectorAll('.nacred:checked')].map(x=>x.value);
  if(!creditIds.length){ toast('Выберите хотя бы один кредит охвата','err'); return; }
  const bad=creditIds.find(id=>activeAppOnCredit(id,'__new__'));
  if(bad){ toast('Кредит '+creditById(bad).no+' в другой активной заявке (Р-2)','err'); return; }
  const kindIds=[...document.querySelectorAll('.nakind:checked')].map(x=>x.value);
  if(!kindIds.length){ toast('Выберите хотя бы один вид реструктуризации','err'); return; }
  const id=nextAppId();
  const app=baseApp(id,inn,borrower,kindIds,creditIds,regDate);
  app.conclusions=defaultConclusions();
  app._t=regDate;
  H(app,'Заявка зарегистрирована. Охват: '+creditIds.map(i=>creditById(i).no).join(', ')+'. Виды: '+kindIds.map(i=>kindById(i).name).join(', ')+'.',state.role);
  state.apps.push(app);
  closeModal(); toast('Заявка '+id+' создана — стадия «Регистрация обращения»','ok'); openApp(id);
}
function setFilter(k,v){ if(k==='stage') state.filterStage=v; else state.filterOutcome=v; render(); }
function go(view){ state.view=view; if(view==='list') state.curApp=null; render(); }
function setRole(r){ state.role=r; render(); }

function render(){
  // Без DOM перерисовывать нечего — тем же приёмом, что и toast (:2804). Это открывает смоуку
  // экспортированные двери, которые кончаются render(): состояние уже изменено, и сценарию не
  // приходится подбирать вызовы, у которых guard успевает отсечь путь до document.
  if(typeof document==='undefined') return;
  document.getElementById('view-list').classList.toggle('active',state.view==='list');
  document.getElementById('view-card').classList.toggle('active',state.view==='card');
  document.getElementById('view-dict').classList.toggle('active',state.view==='dict');
  document.getElementById('crumb').innerHTML =
    state.view==='card' ? `<span class="bk" onclick="RS.go('list')">Реестр заявок</span> / ${state.curApp||''}`
    : state.view==='dict' ? 'Справочник видов' : 'Реестр заявок';
  renderNav(); renderRoles();
  if(state.view==='list') renderList();
  else if(state.view==='card') renderCard();
  else if(state.view==='dict') renderDict();
}

function toast(msg,kind){ if(typeof document==='undefined') return; const w=document.getElementById('toastWrap'); if(!w) return; const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:''); t.innerHTML=`<span>${esc(msg)}</span>`; w.appendChild(t); setTimeout(()=>t.remove(),4200); }

/* публичный слой (UI + headless-check) */
const RS = {
  go, setRole, setTab, openApp, newApp, naFillCredits, createApp, nextAppId, setFilter, closeModal,
  toggleDoc, returnApp, setConclText, visaConcl, openAddConcl, addConcl,
  openAddCredit, addCredit, fixCommittee, fixLetter, fixConclusion, fixZk, fixResolution, advance,
  openWaiver, grantWaiver, openDS, regDS, openNewKind, addKind, dropKind, showMirror,
  get state(){ return state; }, seed, stageOf, deadline, packetGate, conclGate, dsGate,
  conclusionGate, zkGate, resolutionGate, forgiveGate, repeatSignal, driftGate, driftTier, cutoffDrift,
  coverGate, coverGateApp, allowedParams, allowedDispositions, requiredDocs, normPacket, packetPointOf,
  coverShortInScope, isNormKind, isWorkDay, addWorkDays, calendarYearKnown,
  accrualModeOf, ACCRUAL_MODES, DRIFT_TIERS, INITIATORS, REPEAT_SIGNAL_FROM, AppSide, CreditSide,
  activeAppOnCredit, canAdvance, canX,
  appById, creditById, kindById, amortize, periodMonths, round2, addCalDays,
  normAt, normNote, termCapFor, rateFloorFor, limitsGate, limitsGateApp,
  consentGate, consentGateApp, coverSnapshotAge, coverSnapshotStale,
  toggleBaseRow, setDisposition, setDispAmount, setDispPeriods, dispositionHasPeriods,
  ensureBaseDispositions, dispositionFor, defaultBase, defaultDispositions,
  scheduleArticleCols, rowArticlesSum, mergeParts, validateDS,
  trancheCandidates, setCalcTranche, setVersionParam, recalcPlan,
  TODAY, STAGES, ROLES,
  __baseApp: baseApp
};
if(typeof window!=='undefined') window.RS=RS;

seed();
if(typeof document!=='undefined' && document.getElementById('view-list')){
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&overlay().classList.contains('open')) closeModal(); });
  render();
}
</script>
