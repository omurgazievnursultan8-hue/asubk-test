        <div class="dv">${v.state==='executed' ? pill({t:'Исполнен '+v.execAt, cls:'ok'}) : pill({t:'Не исполнен', cls:'neutral'})}
          <span style="font:var(--font-label)">${v.execBy || ''}</span></div>
        <div class="src">исполняет бухгалтер</div>
      </div>
    </div>
  </div>`;

  /* --- баннер состояния --- */
  const banner = v.state==='executed'
    ? `<div class="banner ok">${RET_ICO_I}<div><b>Возврат исполнен ${v.execAt}.</b> Деньги ушли наружу.</div></div>`
    : !adm.ok
      ? `<div class="banner err">${RET_ICO_I}<div><b>Возврат недопустим по состоянию долга.</b>
          Препятствий: ${adm.blockers.length}.</div></div>`
      : `<div class="banner ok">${RET_ICO_I}<div><b>Возврат допустим.</b> Проверено на ${adm.checked},
          препятствий нет. Осталось исполнение.</div></div>`;

  return `<div class="page-pad">
    <div class="gtoolbar"><button class="btn btn-tint btn-sm" onclick="back()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      К списку возвратов</button></div>
    ${head}
    ${banner}
    ${retTimeline(v)}
    ${retRecipientBlock(v)}
    ${retBasisBlock(v)}
    ${retAdmissibilityBlock(v)}
    ${retSurplusBlock(v)}
    ${retExecBlock(v)}
    ${retInvariantBlock(v)}
    <div class="section-h" style="margin-top:24px">След возврата</div>
    ${retHistBlock(v)}
  </div>`;
}

/* --- ТРИ ФУНКЦИИ (главный визуальный акцент экрана, ПТ-Д26 / ПТ-29) --- */
function retTimeline(v){
  const adm = v.admissibility;
  const arrow = `<span class="tl-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>`;
  const step = (dot, cls, lbl, sub) => `<div class="tl-step">
      <span class="tl-dot ${cls}">${dot}</span>
      <span class="tl-lbl${cls==='todo'?' todo':''}"><b>${lbl}</b><br><span class="src-tag">${sub}</span></span>
    </div>`;

  const s1 = v.basis
    ? step('✓','done','1 · Основание', `${v.basisBy} · ${retBasisWho(v)}`)
    : step('1','cur','1 · Основание', retBasisWho(v));
  const s2 = adm.ok
    ? step('✓','done','2 · Допустимость', `проверено на ${adm.checked}`)
    : step('!','todo','2 · Допустимость', `препятствий ${adm.blockers.length}`);
  const s3 = v.state==='executed'
    ? step('✓','done','3 · Исполнение', `${v.execBy} · ${v.execAt}`)
    : step('3', adm.ok && v.basis ? 'cur' : 'todo', '3 · Исполнение', 'бухгалтер, по реквизитам получателя');

  return `<div class="section-h" style="margin-top:22px">Ход возврата</div>
    <div class="timeline">${s1}${arrow}${s2}${arrow}${s3}</div>`;
}

/* --- ПОЛУЧАТЕЛЬ (ПТ-Д2) --- */
function retRecipientBlock(v){
  const r = receiptOf(v);
  const third = retIsThirdParty(v);
  const borrowers = retBorrowers(v);
  const why = third
    ? `Получатель — третье лицо: доля залогодателя в разбивку не входила.
       Заёмщик по этому поступлению — ${borrowers.join(', ') || '—'}.`
    : `Получатель совпал с заёмщиком (${borrowers.join(', ') || '—'}).`;

  return `<div class="section-h" style="margin-top:24px">Получатель</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Куда уходят деньги ${pill(third ? {t:'Третье лицо', cls:'purple'} : {t:'Заёмщик', cls:'neutral'})}</h4>
      <dl class="kv">
        <dt>Наименование</dt><dd>${v.recipient.name}</dd>
        <dt>Вид получателя</dt><dd>${v.recipient.kind}</dd>
        <dt>Реквизиты</dt><dd class="mono">${v.recipient.requisites}</dd>
        <dt>Сумма к выплате</dt><dd class="mono">${cur(v.amount, v.currency)}</dd>
        <dt>Плательщик по поступлению</dt><dd>${r ? r.payerName : '—'}</dd>
        <dt>Заёмщик по поступлению</dt><dd>${borrowers.join(', ') || '<i>заёмщика нет — деньги чужие</i>'}</dd>
      </dl>
    </div>
    <div class="banner ${third?'info':'warn'}" style="margin-top:12px">${RET_ICO_I}<div>${why}</div></div>`;
}

/* --- ОСНОВАНИЕ (функция человека) --- */
function retBasisBlock(v){
  const allowed = retBasisAllowed(v);
  return `<div class="section-h" style="margin-top:24px">1 · Основание</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Основание возврата</h4>
      <dl class="kv">
        <dt>Документ</dt><dd>${v.basis || '<i>не приложено</i>'}</dd>
        <dt>Положил</dt><dd>${v.basisBy || '—'}</dd>
        <dt>Роль по правилу</dt><dd>${retOwnerless(v) ? 'бухгалтер (чужие деньги)' : 'куратор (трактовка)'}</dd>
      </dl>
    </div>
    <div class="gtoolbar" style="margin-top:10px">
      <button class="btn btn-secondary btn-sm" onclick="retBasisModal('${v.id}')">${v.basis?'Заменить основание':'Приложить основание'}</button>
      ${roleHint(allowed, retOwnerless(v) ? 'кладёт бухгалтер' : 'кладёт куратор')}
    </div>`;
}

/* --- ДОПУСТИМОСТЬ (вывод, а не согласование) --- */
function retAdmissibilityBlock(v){
  const adm = v.admissibility;
  const third = retIsThirdParty(v);

  const ruleRow = (on, title, text) => `<div class="grow" style="${on?'background:var(--asubk-blue-tint)':''}">
      <div class="gkind">${on?'▶ ':''}${title}</div>
      <div class="gwhat">${text}</div>
      <div class="gid"><span class="src-tag">${on?'применяется здесь':'другой случай'}</span></div>
    </div>`;

  const rule = `<div class="gate">
      ${ruleRow(!third, 'Возврат заёмщику', 'Допустим, если по заёмщику не осталось непогашенного ни по одному кредиту и ни один слой суда не жив.')}
      ${ruleRow(third,  'Возврат чужой доли', 'Состояние долга её не держит: доля третьего лица в разбивку не входила.')}
    </div>`;

  const body = adm.ok
    ? `<div class="banner ok">${RET_ICO_I}<div><b>Препятствий нет.</b> Проверено на ${adm.checked}.</div></div>`
    : `<div class="gate">${adm.blockers.map((b,i)=>`<div class="grow">
         <div class="gkind">Препятствие №${i+1}</div>
         <div class="gwhat">${b}</div>
         <div class="gid"><span class="src-tag">вывод на ${adm.checked}</span></div>
       </div>`).join('')}</div>`;

  return `<div class="section-h" style="margin-top:24px">2 · Допустимость</div>
    ${rule}
    <div style="margin-top:12px">${body}</div>
    <div class="gtoolbar" style="margin-top:12px">
      <button class="btn btn-tint btn-sm" onclick="retRecheck('${v.id}')">Проверить допустимость заново</button>
      <span class="src-tag">пересобирает вывод на ${DATA.today}</span>
    </div>`;
}

/* --- СВЯЗЬ С ОСТАТКОМ СВЕРХ НАСТУПИВШЕГО (ADR-0073) --- */
function retSurplusBlock(v){
  const r = receiptOf(v);
  if(!r) return '';
  const A = retAlloc(r);
  const mode = SURPLUS[r.surplus];
  const left = A ? A.a.surplusLeft : 0;

  const chain = `<div class="banner info">${RET_ICO_I}<div>
      <b>Порядок при обратной очереди:</b>
      <div style="margin:8px 0 0">${retQueueChain()}</div></div></div>`;

  /* случай остатка, закреплённого адресным резервом (V-4 · ПС-290) */
  if(left > 0){
    const rows = (r.reserveRows||[]).map(x=>`<tr>
        <td>${x.due}</td><td>${x.article}</td>
        <td><span class="trn">Строка графика</span></td>
        <td class="r">${money(x.amount)}</td></tr>`).join('');
    return `<div class="section-h" style="margin-top:24px">Откуда эти деньги: остаток сверх наступившего</div>
      <div class="inv">
        <span class="iv">Поступление: <b>${money(r.amount)}</b></span>
        <span class="iv">Наступившее на ${A.a.asOf}: <b>${money(A.a.due)}</b></span>
        <span class="iv">Остаток сверх наступившего: <b>${money(left)}</b></span>
        <span class="iv">Затребовано к возврату: <b>${money(v.amount)}</b></span>
        <span class="iv">Режим остатка: ${pill(mode)}</span>
      </div>
      <div class="matrix" style="margin-top:12px">
        <div class="mx-layer open">
          <div class="mx-layer-h" onclick="this.parentNode.classList.toggle('open')">
            <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            <span class="ml-title">За чем закреплён остаток</span>
            <span class="ml-mode">${mode.hint}</span>
            <span class="ml-sum">${money(left)}</span>
          </div>
          <div class="mx-body"><table class="mxg">
            <thead><tr><th>Срок</th><th>Статья долга</th><th>Область</th><th class="r">Сумма</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">строк нет</td></tr>'}</tbody>
          </table></div>
        </div>
      </div>
      ${chain}
      <div class="banner warn">${RET_ICO_I}<div>
        Режим «${mode.t}»: ${money(left)} закреплены за взносами по графику. Пока закрепление живо,
        возврат недопустим. Сумма остаётся внутри платежа
        <span class="rowlink" onclick="openPayment('${A.p.id}')">${A.p.number}</span>.</div></div>`;
  }

  /* случай чужой доли: остатка сверх наступившего нет вовсе */
  return `<div class="section-h" style="margin-top:24px">Откуда эти деньги</div>
    <div class="inv">
      <span class="iv">Поступление: <b>${money(r.amount)}</b></span>
      <span class="iv">Ушло в погашение: <b>${A ? money(A.a.total) : '—'}</b></span>
      <span class="iv">Доля третьего лица: <b>${money(v.amount)}</b></span>
      <span class="iv">Остаток сверх наступившего: <b>${money(A ? A.a.surplusLeft : 0)}</b></span>
      <span class="iv">Режим остатка: ${pill(mode)}</span>
    </div>
    ${chain}`;
}

/* --- ИСПОЛНЕНИЕ (функция человека) --- */
function retExecBlock(v){
  const adm = v.admissibility;
  const execOk = can.execReturn() && adm.ok && v.state!=='executed';
  const why = v.state==='executed' ? 'исполнен'
    : !adm.ok ? 'закрыто: возврат недопустим по состоянию долга'
    : !can.execReturn() ? 'закрыто: исполняет бухгалтер'
    : 'открыто';

  return `<div class="section-h" style="margin-top:24px">3 · Исполнение</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Исполнение ${pill(v.state==='executed' ? {t:'Исполнен', cls:'ok'} : {t:'Не исполнен', cls:'neutral'})}</h4>
      <dl class="kv">
        <dt>Исполнил</dt><dd>${v.execBy || '—'}</dd>
        <dt>Дата</dt><dd>${v.execAt || '—'}</dd>
        <dt>Реквизиты выплаты</dt><dd class="mono">${v.recipient.requisites}</dd>
        <dt>Сумма</dt><dd class="mono">${cur(v.amount, v.currency)}</dd>
        <dt>Состояние кнопки</dt><dd${execOk?'':' class="diff"'}>${why}</dd>
      </dl>
    </div>
    <div class="gtoolbar" style="margin-top:10px">
      <button class="btn ${execOk?'btn-primary':'btn-secondary'} btn-sm" onclick="retExec('${v.id}')">Исполнить возврат</button>
      ${roleHint(can.execReturn(), 'исполняет бухгалтер')}
      ${can.execReturn() && !adm.ok && v.state!=='executed' ? roleHint(false, 'есть препятствия') : ''}
    </div>`;
}

/* --- ИНВАРИАНТ ПОСТУПЛЕНИЯ: возврат — отдельное слагаемое --- */
function retInvariantBlock(v){
  const r = receiptOf(v);
  if(!r) return '';
  const paid = paymentsOf(r).filter(p=>!p.void).reduce((s,p)=>s+paidOf(p),0);
  const ret  = returnsOf(r).filter(x=>x.state==='executed').reduce((s,x)=>s+x.amount,0);
  const rest = unallocated(r);
  return `<div class="section-h" style="margin-top:24px">Инвариант поступления ${r.number}</div>
    <div class="inv">
      <span class="iv">Сумма поступления <b>${money(r.amount)}</b></span>
      <span class="iv">= Σ платежей <b>${money(paid)}</b></span>
      <span class="iv">+ исполненные возвраты <b>${money(ret)}</b></span>
      <span class="iv${rest!==0?' bad':''}">+ ${isReversed(r)?'снято сторно':'нераспределённое'} <b>${money(rest)}</b></span>
      <span class="iv">${axes(r)}</span>
    </div>`;
}

/* --- след --- */
function retHistBlock(v){
  const r = receiptOf(v), adm = v.admissibility;
  const rows = [];
  if(r) rows.push({when:r.date, what:`Поступление ${r.number}: ${money(r.amount)} от «${r.payerName}».`, who:'источник возврата', cls:''});
  if(v.basis) rows.push({when:'—', what:`Основание положено: ${v.basis}`, who:v.basisBy, cls:''});
  rows.push({when:adm.checked, what: adm.ok
      ? 'Допустимость выведена: препятствий нет.'
      : `Допустимость выведена: препятствий — ${adm.blockers.length}.`,
    who:'вывод из состояния долга', cls: adm.ok?'res':'rev'});
  if(v.state==='executed') rows.push({when:v.execAt, what:`Возврат исполнен на реквизиты получателя: ${v.recipient.requisites}`, who:v.execBy, cls:'res'});
  else rows.push({when:'—', what:'Исполнения нет: деньги наружу не уходили.', who:'ждёт бухгалтера', cls:''});
  return `<div class="hist">${rows.map(h=>`<div class="hrow ${h.cls}">
      <div class="hwhen">${h.when}</div><div class="hwhat">${h.what}</div><div class="hwho">${h.who}</div>
    </div>`).join('')}</div>`;
}

/* ============================================================
   ДЕЙСТВИЯ
   ============================================================ */
function retExec(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  if(v.state==='executed') return toast('Возврат уже исполнен '+v.execAt+'.','warn');
  if(!can.execReturn())
    return toast('Возврат исполняет бухгалтер','warn');
  if(!v.basis)
    return toast('Нет основания — приложите документ','warn');
  if(!v.admissibility.ok)
    return toast('Возврат недопустим по состоянию долга: '+v.admissibility.blockers[0],'warn');
  v.state = 'executed';
  v.execBy = 'Бухгалтер · А.Иманкулова';
  v.execAt = DATA.today;
  render();
  toast('Возврат '+v.id+' исполнен на '+money(v.amount),'ok');
}

function retRecheck(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  v.admissibility.checked = DATA.today;
  render();
  if(v.admissibility.ok)
    toast('Вывод пересобран на '+DATA.today+': препятствий нет','ok');
  else
    toast('Вывод пересобран на '+DATA.today+': препятствий '+v.admissibility.blockers.length,'warn');
}

function retBasisModal(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  if(!retBasisAllowed(v))
    return toast(retOwnerless(v)
      ? 'Основание возврата кладёт бухгалтер'
      : 'Основание возврата кладёт куратор', 'warn');
  openModal(`<div class="modal-h"><span class="mt">Основание возврата ${v.id}</span>
    <button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="f2">
      <div class="field col-span req"><label class="flabel">Документ-основание</label>
        <div class="control"><input value="${(v.basis||'').replace(/"/g,'&quot;')}" placeholder="заявление заёмщика от … / акт реализации залога от …"></div></div>
      <div class="field col-span"><label class="flabel">Комментарий</label>
        <textarea class="note-area" placeholder="чем подтверждается право получателя на эти деньги"></textarea></div>
    </div>
    <div class="dropzone" style="margin-top:14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <div>Скан заявления либо акта</div></div>
  </div>
  <div class="modal-f">
    <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="retBasisSave('${v.id}')">Приложить основание</button>
  </div>`);
}

function retBasisSave(id){
  const v = DATA.returns.find(x=>x.id===id);
  closeModal();
  if(!v) return;
  if(v.state==='draft') v.state = 'based';
  v.basisBy = retOwnerless(v) ? 'Бухгалтер · А.Иманкулова' : 'Куратор · Ж.Осмонова';
  render();
  toast('Основание положено ('+v.basisBy+')','ok');
}

/* ------------------------------------------------------------
   РЕЕСТР ЦК — ВНЕШНИЙ ФАКТ (ADR-0058, спека §2.5).
   Строка реестра — отдельная НЕИЗМЕНЯЕМАЯ запись, а не наш платёж:
   мы её не правим, мы с ней сопоставляемся. Разошлась сумма — правится
   НАША запись, и направление названо явно: наша подтягивается к сумме ЦК,
   не наоборот (ПТ-Д13). До сопоставления действует наша сумма, после — ЦК.

   Дедупликация — на ВХОДЕ, ключом «№ документа + дата + сумма». Ключ
   относится к ПОСТУПЛЕНИЮ, а не к платежу: сводная строка остаётся одной,
   сколько бы платежей из неё ни нарезали (спека §2.5, ADR-0056).

   Импорт идёт шагами: привязка → распределение → сопоставление → заморозка.
   Шаг распределения (куратор подтверждает рассчитанную разбивку) в прежнем
   макете отсутствовал — ПТ-Д15. Сопоставление здесь ВТОРАЯ проверка, а не
   способ опознать деньги: опознание живёт на поступлении.

   Закрывает: ПТ-Д13, ПТ-Д15 (+ случаи волны из ПТ-Д22 — сводная строка ЦК
   на трёх заёмщиков и повторная присылка уточнённого реестра).
   ------------------------------------------------------------ */

/* ---- мелкая инфраструктура экрана ---- */
const REG_I = {
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/>',
  warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  up:   '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  x:    '<path d="M18 6L6 18M6 6l12 12"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
};
const regIco = (d,s) => `<svg width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const regBan = (kind, html) => `<div class="banner ${kind}">${regIco(REG_I[(kind==='warn'||kind==='err')?'warn':'info'])}<div>${html}</div></div>`;
const regVal = id => { const e = document.getElementById(id); return e ? String(e.value||'').trim() : ''; };

/* пилюли строки реестра — состояние ПАРЫ, а не состояние наших денег */
const REG_P = {
  matched:  { t:'Сопоставлена',        cls:'ok'      },
  none:     { t:'Нет нашей записи',    cls:'err'     },
  dup:      { t:'Дубль отсеян',        cls:'neutral' },
  mismatch: { t:'Расхождение суммы',   cls:'warn'    },
  split:    { t:'Сводная строка',      cls:'purple'  },
};

/* ============================================================
   ВЫВОДЫ ПО РЕЕСТРУ (ничего не хранится — ADR-0001)
   Признак дубля НЕ берётся из флага: он выводится ключом, потому
   что работу делает ключ, а не пометка в файле.
   ============================================================ */
const regKey = x => `№${x.doc} · ${x.date} · ${money(x.amount)}`;

function regFeed(){
  const seen = {};
  return DATA.registry.map((x,i)=>{
    const key = regKey(x), firstAt = seen[key];
    if(firstAt===undefined) seen[key] = i;
    const dup = firstAt!==undefined;
    const r   = x.matched ? DATA.receipts.find(y=>y.id===x.matched) : null;
    const diff = (!dup && r) ? +(x.amount - r.amount).toFixed(2) : 0;
    const split = (!dup && r) ? paymentsOf(r).filter(p=>!p.void) : [];
    return { x, i, key, dup, firstAt, r, diff, split };
  });
}
const regAt = i => regFeed()[i] || null;

let regFilter = 'all';
function setRegFilter(f){ regFilter = f; render(); }

const REG_FILTERS = [
  { id:'all',      t:'Все',              f:()=>true },
  { id:'matched',  t:'Сопоставленные',   f:o=>!o.dup && !!o.r },
  { id:'none',     t:'Несопоставленные', f:o=>!o.dup && !o.r },
  { id:'dup',      t:'Дубли',            f:o=>o.dup },
  { id:'mismatch', t:'Расхождения',      f:o=>!o.dup && !!o.diff },
];

/* ============================================================
   ЛЕНТА СТРОК
   ============================================================ */
/* i — порядок строки В ОТОБРАЖЁННОМ списке, а не в ленте: зебра здесь проставляется
   вручную (класс .zeb), потому что под строкой живут пояснения и nth-child врёт. */
function regRow(o, i){
  const x = o.x, r = o.r;
  const zeb = (i % 2) ? ' zeb' : '';
  const marks = o.dup ? pill(REG_P.dup)
    : (r ? pill(REG_P.matched) : pill(REG_P.none))
      + (o.diff ? ' '+pill(REG_P.mismatch) : '')
      + (o.split.length>1 ? ' '+pill(REG_P.split) : '');

  /* к чему привязано: id нашего поступления либо честное «нет нашей записи» */
  const bound = o.dup
    ? `<span class="sub">в сопоставление не идёт</span>`
    : r
      ? `<span class="rowlink" onclick="event.stopPropagation();openReceipt('${r.id}')">${r.number}</span>
         <span class="sub">наше от ${r.date}${o.split.length?` · платежей ${o.split.length}`:' · платежей нет'}</span>`
      : `<b style="color:var(--asubk-red)">нет нашей записи</b>
         <span class="sub">держит закрытие периода</span>`;

  const act = o.dup
    ? `<span class="sub">—</span>`
    : o.diff
      ? `<button class="btn btn-sm ${can.correct()?'btn-primary':'btn-secondary'}"
           onclick="event.stopPropagation();regCorrect(${o.i})">Корректировать нашу запись</button>`
      : r
        ? `<span class="sub">совпало 1:1</span>`
        : `<button class="btn btn-sm ${can.bind()?'btn-tint':'btn-secondary'}"
             onclick="event.stopPropagation();regCreateModal(${o.i})">Создать поступление по строке</button>`;

  const click = (!o.dup && r) ? ` onclick="openReceipt('${r.id}')"` : ' style="cursor:default"';

  /* подстрочники: дубль · расщепление сводной · расхождение суммы */
  const sub = [];
  if(o.dup) sub.push(`Ключ дедупликации совпал: <b>${o.key}</b> — та же строка уже принята (позиция ${o.firstAt+1} ленты).`);
  if(o.split.length>1) sub.push(`Одна строка ЦК — ${o.split.length} платежа:
    ${o.split.map(p=>`<span class="rowlink" onclick="openPayment('${p.id}')">${p.number}</span> ${money(paidOf(p))}
      (${(creditOf(p.credit)||{}).borrower||p.credit})`).join(' · ')}.
    Расщепление — у поступления <span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span>.`);
  if(o.diff) sub.push(`У нас <b>${money(r.amount)}</b>, в ЦК <b>${money(x.amount)}</b>, разница
    <b style="color:var(--asubk-red)">${money(Math.abs(o.diff))}</b> — наша запись подтягивается к ЦК.`);

  /* Наша сумма ушла подстрочником под сумму ЦК: это не две независимые величины, а
     одна сверка — глазу нужно видеть их в одной ячейке, а не в двух колонках. */
  const ours = o.dup ? 'в учёт не берётся' : r ? `наша ${money(r.amount)}` : 'нашей записи нет';
  return `<tr class="${o.dup?'muted':''}${zeb}"${click}>
    <td><span class="mono">№${x.doc}</span><span class="sub wrap">${marks}</span></td>
    <td class="mono">${x.date}</td>
    <td class="r num${o.diff?' bad':''}">${money(x.amount)}<span class="sub">${ours}</span></td>
    <td title="${esc(x.payer)} · ${esc(x.note||'—')}"><span class="cell-name">${x.payer}</span
      ><span class="sub">${x.note||'—'}</span></td>
    <td>${(DATA.periods.find(p=>p.id===x.period)||{}).label || x.period}</td>
    <td>${bound}</td>
    <td class="r">${act}</td>
  </tr>${sub.map(s=>`<tr class="note muted${zeb}"><td colspan="${REG_COLS}">${s}</td></tr>`).join('')}`;
}

const REG_COLS = 7;
/* Сортеры реестра ЦК. Сумма — по сумме ЦК: после сопоставления действует именно она.
   «К чему привязано» сортируется по состоянию привязки (нет записи → дубль → есть пара),
   а не по номеру нашего поступления: в этой колонке ищут не номер, а дыры. */
const REG_SORTERS = {
  doc:    o => o.x.doc,
  date:   o => toISO(o.x.date),
  amount: o => o.x.amount,
  payer:  o => o.x.payer,
  period: o => o.x.period,
  bound:  o => o.dup ? 1 : o.r ? 2 : 0,
};

/* Девять колонок реестра ЦК слиты в семь — по тому же правилу, что и у кредитов:
   «Сумма ЦК» + «Наша сумма» = одна ячейка сверки, «Плательщик» + «Назначение» =
   один банковский документ. Зебра здесь ручная (.man-zeb + .zeb): под строкой живут
   пояснения (дубль · расщепление · расхождение), и полосатость по nth-child сбилась бы. */
function regTable(rows){
  if(!rows.length) return `<div class="grid-wrap"><div class="grid-empty">Строк реестра в этом отборе нет</div></div>`;
  return `<div class="grid-wrap"><table class="grid man-zeb" data-t="reg" style="min-width:1300px">
    <colgroup>
      <col style="width:195px"><col style="width:150px"><col style="width:165px"><col style="width:230px">
      <col style="width:120px"><col style="width:210px"><col style="width:250px">
    </colgroup>
    <thead><tr>
      ${gth('reg','doc','Строка ЦК')}${gth('reg','date','Дата документа')}${gth('reg','amount','Сумма ЦК / наша','r')}
      ${gth('reg','payer','Плательщик')}${gth('reg','period','Период')}${gth('reg','bound','К чему привязано')}
      <th class="nos">Действие</th>
    </tr></thead><tbody>${gapply('reg', rows, REG_SORTERS).map(regRow).join('')}</tbody></table></div>`;
}

/* ---- группировка по периоду с итогами; дубли в сумму не входят ---- */
function regGroups(list){
  const order = DATA.periods.map(p=>p.id);
  const ids = [...new Set(list.map(o=>o.x.period))]
    .sort((a,b)=>((order.indexOf(a)<0?99:order.indexOf(a)) - (order.indexOf(b)<0?99:order.indexOf(b))));
  if(!ids.length) return regTable([]);
  return ids.map(pid=>{
    const rows = list.filter(o=>o.x.period===pid);
    const per  = DATA.periods.find(p=>p.id===pid) || { label:pid, state:'open' };
    const keep = rows.filter(o=>!o.dup);
    const sum  = +keep.reduce((s,o)=>s+o.x.amount,0).toFixed(2);
    const dupN = rows.length - keep.length;
    const noneN = keep.filter(o=>!o.r).length;
    return `<div class="gtoolbar" style="margin:22px 0 8px">
        <span class="section-h" style="margin:0">${per.label}</span>${pill(PSTATE[per.state])}
        ${noneN?pill({t:'без нашей пары: '+noneN, cls:'err'}):''}
        <span class="spacer"></span>
        <span class="src-tag">строк ${rows.length} · к учёту ${keep.length} на
          <b style="color:var(--text-heading)">${money(sum)}</b>${dupN?` · дублей отсеяно ${dupN} — в сумму не входят`:''}</span>
      </div>${regTable(rows)}`;
  }).join('');
}

/* ---- итог по всей ленте ---- */
function regInvTop(f){
  const dup  = f.filter(o=>o.dup), keep = f.filter(o=>!o.dup);
  const sum  = +keep.reduce((s,o)=>s+o.x.amount,0).toFixed(2);
  const dsum = +dup.reduce((s,o)=>s+o.x.amount,0).toFixed(2);
  const none = keep.filter(o=>!o.r), mis = keep.filter(o=>o.diff);
  return `<div class="inv">
    <span class="iv">Строк реестра: <b>${f.length}</b></span>
    <span class="iv">К учёту после дедупликации: <b>${keep.length}</b> на <b>${money(sum)}</b></span>
    <span class="iv">Отсеяно дублей: <b>${dup.length}</b> на <b>${money(dsum)}</b></span>
    <span class="iv${none.length?' bad':''}">Без нашей записи: <b>${none.length}</b></span>
    <span class="iv${mis.length?' bad':''}">С расхождением суммы: <b>${mis.length}</b></span>
  </div>`;
}

/* ============================================================
   РАЗБОРЫ ПОД ЛЕНТОЙ
   ============================================================ */

/* ---- 1 · дедупликация: работает ключ, а не пометка в файле ---- */
function regDedupBlock(all){
  const dup = all.filter(o=>o.dup);
  return `<div class="section-h" style="margin-top:26px">Дедупликация повторной присылки</div>
    <p class="section-note">Ключ дедупликации: <b>№ документа + дата + сумма</b>.</p>
    ${dup.length ? `<div class="gate">${dup.map(o=>{
        const first = regAt(o.firstAt);
        return `<div class="grow">
          <span class="gkind">Дубль строки №${o.x.doc}</span>
          <span class="gwhat">ключ <b>${o.key}</b> совпал с принятой строкой (позиция ${o.firstAt+1}); присылка —
            «${o.x.note||'—'}». Сумма ${money(o.x.amount)} в итог периода не вошла.</span>
          ${first && first.r ? `<span class="gid" onclick="openReceipt('${first.r.id}')">${first.r.number} →</span>`
                             : `<span class="src-tag">пары нет</span>`}
        </div>`;
      }).join('')}</div>`
      : regBan('ok', `Повторных присылок в текущем реестре нет.`)}`;
}

/* ---- 2 · сводная строка: одна строка ЦК — несколько платежей ---- */
function regSplitBlock(all){
  const sp = all.filter(o=>o.split.length>1);
  if(!sp.length) return '';
  return sp.map(o=>{
    const r = o.r, sum = +o.split.reduce((s,p)=>s+paidOf(p),0).toFixed(2);
    const ok = Math.abs(sum - r.amount) < 0.005;
    return `<div class="section-h" style="margin-top:26px">Сводная строка №${o.x.doc}: одна строка ЦК — ${o.split.length} заёмщика</div>
      <p class="section-note">ЦК прислал одну сумму на нескольких заёмщиков («${o.x.note||'—'}»). Расщепление живёт
        у поступления <span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span>.</p>
      <div class="cgrid-wrap"><table class="cgrid"><thead><tr>
        <th>Платёж</th><th>Заёмщик · кредит</th><th>Транш — область разбивки</th><th class="r">Сумма</th><th>Основание расщепления</th>
        </tr></thead><tbody>
        ${o.split.map(p=>{
          const c = creditOf(p.credit) || {};
          const t = ((c.tranches)||[]).find(y=>y.id===p.tranche);
          return `<tr onclick="openPayment('${p.id}')">
            <td><span class="rowlink">${p.number}</span></td>
            <td>${c.borrower||'—'}<div class="src-tag" style="margin-top:4px">${c.title||p.credit}</div></td>
            <td>${t?`<span class="trn">${t.label}</span>`:'<span class="trn">оба транша кредита</span>'}</td>
            <td class="r mono">${cur(p.amount,p.currency)}</td>
            <td style="white-space:normal;max-width:360px">${p.basis||'—'}</td></tr>`;
        }).join('')}
        <tr class="total" style="cursor:default"><td colspan="3">Итого платежей поступления ${r.number}</td>
          <td class="r mono">${money(sum)}</td><td>строка ЦК — ${money(o.x.amount)}</td></tr>
      </tbody></table></div>
      <div class="inv">
        <span class="iv">Строка реестра ЦК: <b>${money(o.x.amount)}</b></span>
        <span class="iv">Поступление ${r.number}: <b>${money(r.amount)}</b></span>
        <span class="iv${ok?'':' bad'}">Σ платежей расщепления: <b>${money(sum)}</b> ${ok?'— сходится':'— не сходится'}</span>
      </div>`;
  }).join('');
}

/* ---- 3 · расхождение суммы: направление корректировки названо явно (ПТ-Д13) ---- */
function regMismatchBlock(all){
  const ms = all.filter(o=>!o.dup && o.diff);
  if(!ms.length) return `<div class="section-h" style="margin-top:26px">Расхождение суммы</div>
    ${regBan('ok', `Расхождений нет: по всем сопоставленным строкам наша сумма совпала с суммой ЦК.`)}`;
  return ms.map(o=>{
    const r = o.r, x = o.x;
    return `<div class="section-h" style="margin-top:26px">Расхождение суммы: строка №${x.doc} и поступление ${r.number}</div>
      <div class="recon-split">
        <div class="recon-col"><h4>Строка реестра ЦК ${pill({t:'источник после сопоставления',cls:'info'})}</h4>
          <dl class="kv">
            <dt>Документ</dt><dd>№${x.doc}</dd>
            <dt>Дата</dt><dd class="mono">${x.date}</dd>
            <dt>Сумма</dt><dd class="diff">${money(x.amount)}</dd>
            <dt>Плательщик</dt><dd>${x.payer}</dd>
            <dt>Назначение</dt><dd>${x.note||'—'}</dd>
            <dt>Правится ли</dt><dd>Нет. Только перезагрузка реестра и пересопоставление.</dd>
          </dl></div>
        <div class="recon-mid">${regIco(REG_I.arrow,18)}</div>
        <div class="recon-col"><h4>Наша запись ${pill({t:'подтягивается к ЦК',cls:'warn'})}</h4>
          <dl class="kv">
            <dt>Поступление</dt><dd><span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span></dd>
            <dt>Дата факта</dt><dd class="mono">${r.date}</dd>
            <dt>Сумма</dt><dd class="diff">${money(r.amount)}</dd>
            <dt>Разница</dt><dd class="diff">${money(Math.abs(o.diff))} ${o.diff>0?'(у нас меньше)':'(у нас больше)'}</dd>
            <dt>Сопоставление</dt><dd>${pill(MATCH[r.match])}</dd>
            <dt>Правится ли</dt><dd>Да — корректировкой с основанием.</dd>
          </dl></div>
      </div>
      ${regBan('warn', `<b>Направление корректировки: сумма ЦК → наша запись.</b> Разница
        ${money(Math.abs(o.diff))} после корректировки станет нераспределённой. Платежи не гасятся.
        <div class="gtoolbar" style="margin:10px 0 0">
          <button class="btn btn-sm ${can.correct()?'btn-primary':'btn-secondary'}" onclick="regCorrect(${o.i})">
            Корректировать нашу запись с основанием</button>
          ${roleHint(can.correct(),'только бухгалтер')}
          <button class="btn btn-sm btn-tint" onclick="go('recon')">Открыть сопоставление</button>
        </div>`)}`;
  }).join('');
}

/* ---- 4 · несопоставленные строки: чем они держат месяц ---- */
function regUnmatchedBlock(all){
  const ns = all.filter(o=>!o.dup && !o.r);
  return `<div class="section-h" style="margin-top:26px">Несопоставленные строки — «есть в ЦК, нет у нас»</div>
    <p class="section-note">Деньги у ЦК прошли, а нашей записи под них нет. Такая строка держит закрытие периода.</p>
    ${ns.length ? `<div class="gate">${ns.map(o=>`<div class="grow">
        <span class="gkind">Строка №${o.x.doc} от ${o.x.date}</span>
        <span class="gwhat">${money(o.x.amount)} от «${o.x.payer}», назначение «${o.x.note||'—'}» ·
          период ${(DATA.periods.find(p=>p.id===o.x.period)||{}).label||o.x.period} — держит закрытие</span>
        <span class="gid" onclick="go('period')">гейт периода →</span>
      </div>`).join('')}</div>
      <div class="gtoolbar" style="margin-top:12px">
        ${ns.map(o=>`<button class="btn btn-sm ${can.bind()?'btn-tint':'btn-secondary'}" onclick="regCreateModal(${o.i})">
          Создать поступление по строке №${o.x.doc}</button>`).join('')}
        ${roleHint(can.bind(),'вносит куратор')}
      </div>
      ${regBan('warn', `Внесённое по строке поступление придёт на общий счёт ЦК и ляжет <b>невыясненным</b>:
        препятствие гейта сменит вид и уйдёт только после опознания объекта.`)}`
      : regBan('ok', `Несопоставленных строк нет: у каждой строки реестра есть наша пара.
        <span class="rowlink" onclick="go('period')">Проверить остальные препятствия</span>.`)}`;
}

/* ============================================================
   САМ ЭКРАН
   ============================================================ */
function viewRegistry(){
  const all  = regFeed();
  const flt  = REG_FILTERS.find(x=>x.id===regFilter) || REG_FILTERS[0];
  const list = all.filter(flt.f);
  const segs = `<div class="seg">${REG_FILTERS.map(x=>
    `<button class="${x.id===regFilter?'on':''}" onclick="setRegFilter('${x.id}')">${x.t} · ${all.filter(x.f).length}</button>`).join('')}</div>`;

/** Корректировка НАШЕЙ записи по сумме ЦК. Операция уровня факта денег —
    бухгалтер; сама модалка и проводка живут на экране поступлений. */
function regCorrect(i){
  const o = regAt(i);
  if(!o || !o.r) return toast('Корректировать нечего: у строки нет нашей пары','warn');
  if(!can.correct()) return toast('Корректировку суммы проводит бухгалтер','warn');
  if(!o.diff) return toast('Суммы совпадают — корректировать нечего');
  recAct('correct', o.r.id);
}

/** Внесение поступления по строке ЦК: список ЦК и есть основание ввода (спека §1),
    поэтому строку разбирает куратор. Поступление ляжет невыясненным — общий счёт
    ЦК объекта не опознаёт; препятствие гейта сменит вид, а не исчезнет. */
function regCreateModal(i){
  const o = regAt(i);
  if(!o) return;
  if(o.dup)  return toast('Это дубль: деньги уже приняты строкой выше','warn');
  if(o.r)    return toast('У строки уже есть наша запись — '+o.r.number,'warn');
  if(!can.bind()) return toast('Внесение по строке реестра — работа куратора','warn');
  const per = DATA.periods.find(p=>p.id===o.x.period) || {};
  if(per.state==='closed') return toast('Период «'+(per.label||o.x.period)+'» закрыт: сначала открытие периода по решению комиссии','warn');

  openModal(`<div class="modal-h"><span class="mt">Поступление по строке №${o.x.doc}</span>
      <button class="modal-x" onclick="closeModal()">${regIco(REG_I.x,20)}</button></div>
    <div class="modal-b">
      ${regBan('info', `Сумма и дата берутся из строки: <b>${money(o.x.amount)}</b> от
        <b>${o.x.date}</b>, плательщик «${o.x.payer}», назначение «${o.x.note||'—'}».`)}
      ${regBan('warn', `<b>Поступление ляжет невыясненным:</b> общий счёт ЦК объект не опознаёт.
        Платежи появятся после опознания заёмщика.`)}
      <div class="field req"><label class="flabel">Основание внесения</label>
        <textarea class="note-area" id="regBasis" placeholder="реестр ЦК за ${(per.label||o.x.period)}, строка №${o.x.doc} от ${o.x.date}"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="regCreateDo(${o.i})">Внести поступление</button></div>`);
}

function regCreateDo(i){
  const o = regAt(i);
  if(!o || o.r || o.dup) return;
  const basis = regVal('regBasis');
  if(!basis) return toast('Без основания запись не заводится','warn');
  const seq = 400 + DATA.receipts.length;
  const id  = 'R-'+seq;
  DATA.receipts.push({
    id, number:'ПС-'+seq, date:o.x.date, amount:o.x.amount, currency:'KGS', period:o.x.period,
    channel:'cbk', match:'confirmed', frozen:'open',
    account:'1298 0000 0000 0001', accountObject:'Общий счёт ЦК (объект не опознан счётом)',
    payerName:o.x.payer, note:o.x.note,
    unresolvedReason:'внесено по строке реестра ЦК — общий счёт объект не опознаёт',
    candidates:[], surplus:'queue_back', deadline:'—', daysLeft:null,
    hist:[ hrow('Внесено по строке реестра ЦК №'+o.x.doc+' от '+o.x.date+'. Основание: '+basis+'.','Куратор · Ж.Осмонова') ]
  });
  o.x.matched = id;
  closeModal(); render();
  toast('Создано поступление ПС-'+seq+' на '+money(o.x.amount)+'. Строка №'+o.x.doc+
    ' сопоставлена; поступление невыясненное','warn');
}

/* ============================================================
   ЗАГРУЗКА РЕЕСТРА
   Импорт: привязка → распределение → сопоставление → заморозка.
   Дедупликация выполняется НА ВХОДЕ, до привязки (спека §2.5, ПТ-Д15).
   ============================================================ */
const REG_STEPS = [
  ['Привязка',      'куратор: кредит и, если счёт опознал, транш'],
  ['Распределение', 'куратор подтверждает рассчитанную разбивку'],
  ['Сопоставление', 'наша запись против строки ЦК'],
  ['Заморозка',     'бухгалтер по положительной сверке'],
];

function regSteps(){
  const dots = REG_STEPS.map(([t],n)=>`<div class="tl-step">
      <span class="tl-dot ${n===0?'cur':'todo'}">${n+1}</span>

    .join(`<span class="tl-arrow">${regIco(REG_I.arrow,14)}</span>`);
  return `<div class="timeline">${dots}</div>
    <dl class="kv" style="padding:12px 0">
      ${REG_STEPS.map(([t,h],n)=>`<dt>${n+1} · ${t}</dt><dd>${h}</dd>`).join('')}
    </dl>`;
}

function regPickFile(){

}

    <div class="modal-b">

        <div class="field req"><label class="flabel">Файл реестра</label>

      ${regBan('warn', `<b>Дедупликация — на входе.</b> Ключ: <b>№ документа + дата + сумма</b>.`)}
      <div class="section-h" style="font-size:16px;margin-top:6px">Что идёт после загрузки</div>

    <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>

function doLoadRegistry(){
  const pid  = regVal('regPeriod'), file = regVal('regFile');
  const per  = DATA.periods.find(p=>p.id===pid) || {};
  if(!file) return toast('Укажите файл реестра','warn');
  if(per.state==='closed') return toast('Период «'+(per.label||pid)+'» закрыт: сначала открытие периода по решению комиссии','warn');
  const rows = regFeed().filter(o=>o.x.period===pid);
  const dups = rows.filter(o=>o.dup).length;
  const none = rows.filter(o=>!o.dup && !o.r).length;
  const mis  = rows.filter(o=>!o.dup && o.diff).length;
  closeModal(); render();
  toast('Реестр «'+(per.label||pid)+'» принят ('+file+'). Строк '+rows.length+
    ', дедупликация отсеяла '+dups+'. Без нашей пары: '+none+' · с расхождением суммы: '+mis,
    (none||mis) ? 'warn' : 'ok');
}

/* ============================================================
   VIEW: СОПОСТАВЛЕНИЕ (СВЕРКА)
   ============================================================ */
/* @@VIEW:recon@@ */
/* ------------------------------------------------------------
   СОПОСТАВЛЕНИЕ (СВЕРКА) — четвёртый шов модуля.
   Сверка даёт ЧЕТЫРЕ исхода, а не два: совпало · расхождение суммы ·
   есть у нас, нет в ЦК · есть в ЦК, нет у нас. Схлопывание в «сошлось /
   не сошлось» прячет два исхода из четырёх, и именно они держат месяц.

   Экран держит три тезиса:
   • ПТ-Д13 — ЧЬЯ СУММА ДЕЙСТВУЕТ. До сопоставления — наша, после —
     сумма ЦК (ADR-0058). Направление правки одно и названо: наша запись
     приводится к сумме ЦК. Обратного направления нет — реестр ЦК внешний
     факт, его не правит никто.
   • ПТ-Д15 — ШАГ РАЗБИВКИ, которого в интерфейсе не было вовсе.
     Импорт реестра — четыре шага: привязка → разбивка → сопоставление →
     заморозка. Шаг разбивки — ПОДТВЕРЖДЕНИЕ рассчитанной, а не ввод
     сумм руками: разрез выводится из очереди погашения, которую публикует
     КРЕДИТ (ADR-0057, ADR-0060), куратор соглашается с выводом.
   • ПТ-Д16 — ПРАВА ПРИНЦИПОМ, а не перечнем: факт денег — бухгалтер,
     трактовка — куратор, граница — заморозка. Матрицы «роль × действие»
     на экране нет намеренно.
   ------------------------------------------------------------ */

/* ---- локальная инфраструктура экрана ---- */
const RC_I = {
  info:  '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/>',
  warn:  '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  chev:  '<path d="M9 6l6 6-6 6"/>',
  link:  '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
};
const rcIco = d => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const rcBan = (kind, html) => `<div class="banner ${kind}">${rcIco(RC_I[(kind==='warn'||kind==='err')?'warn':'info'])}<div>${html}</div></div>`;
const RC_DIM = 'color:var(--text-muted)';
const RC_OFF = 'color:var(--text-placeholder)';
const RC_URG = { over:'просрочено', cur:'текущее', acc:'начисленное' };

/* ---- ПРАВА ВЫВЕДЕНЫ ИЗ ПРИНЦИПА (ПТ-Д16) ----
   На экране два права, и оба — следствие одной границы, а не пункты списка:
   величина нашей записи есть ФАКТ ДЕНЕГ (бухгалтер), а кому и во что легли
   деньги — ТРАКТОВКА (куратор). Третьего вида прав здесь нет. */
const rcMoney   = () => can.correct();    // факт денег: наша сумма, внесение недостающей записи
const rcMeaning = () => can.allocate();   // трактовка: подтверждение разбивки и поправка внутри вывода
const rcMatch   = () => can.match();      // сопоставление строки ЦК с нашей записью — тоже трактовка

/* ---- производные экрана (ничего не хранится) ---- */
const rcReceipt = id => id ? (DATA.receipts.find(r => r.id === id) || null) : null;
const rcReg     = doc => doc ? (DATA.registry.find(x => x.doc === doc && !x.dup)
                             || DATA.registry.find(x => x.doc === doc) || null) : null;
const rcDup     = doc => doc ? (DATA.registry.find(x => x.doc === doc && x.dup) || null) : null;
const rcSign    = v => (v > 0 ? '+' : '') + money(v);
const rcPeriod  = pid => (DATA.periods.find(p => p.id === pid) || {});
/** строки реестра ЦК без нашей пары; дубли в сопоставление не идут */
const rcOrphanRegs = () => DATA.registry.filter(x => !x.matched && !x.dup);

/* исход · как он выглядит · что он означает одним словом.
   Короткая подпись не повторяет заголовок, а добавляет к нему следствие. */
const RC_OUT = {
  ok:        { t:'Совпало 1:1',          cls:'ok',     sign:'=', mid:'суммы равны',        short:'сверка положительная' },
  mismatch:  { t:'Расхождение суммы',    cls:'warn',   sign:'≠', mid:'разница',            short:'действует сумма ЦК' },
  ours_only: { t:'Есть у нас, нет в ЦК', cls:'purple', sign:'→', mid:'сравнивать не с чем', short:'идёт таймаут' },
  cbk_only:  { t:'Есть в ЦК, нет у нас', cls:'err',    sign:'←', mid:'сравнивать не с чем', short:'держит закрытие периода' },
};
const rcShort = o => pill({ t:o.short, cls:o.cls });

/* ============================================================
   СВОДКА СВЕРКИ
   ============================================================ */
function reconTally(){
  const by = o => DATA.recon.filter(m => m.outcome === o);
  return { ok:by('ok'), mismatch:by('mismatch'), ours:by('ours_only'), cbk:by('cbk_only') };
}

function reconSummary(){
  const t = reconTally();
  const orphans = rcOrphanRegs();
  const dups    = DATA.registry.filter(x => x.dup);
  const holdP   = DATA.periods.filter(p => p.state === 'open' && periodBlockers(p.id).length);

  const tile = (n, label, o, src) => `<div class="dim">
    <div class="dl">${label}</div>
    <div class="dv"><b class="num" style="font:var(--weight-bold) 22px/1 var(--asubk-font);color:var(--text-heading)">${n}</b>
      ${rcShort(o)}</div>
    <div class="src">${src}</div></div>`;

  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px">
      ${tile(t.ok.length, 'Сошлось 1:1', RC_OUT.ok,
        'Реквизиты и сумма совпали — основание заморозки.')}
      ${tile(t.mismatch.length, 'Расхождение суммы', RC_OUT.mismatch,
        'Нужна корректировка нашей записи по сумме ЦК.')}
      ${tile(t.ours.length, 'Ждёт подтверждения ЦК', RC_OUT.ours_only,
        `Идёт таймаут ${DATA.timeoutDays} рабочих дней.`)}
      ${tile(t.cbk.length, 'Строк ЦК без нашей записи', RC_OUT.cbk_only,
        'Деньги в реестре есть, факта у нас нет.')}
    </div>

    <div class="inv">
      <span class="iv">Строк реестра ЦК всего: <b>${DATA.registry.length}</b></span>
      <span class="iv">из них дублей: <b>${dups.length}</b></span>
      <span class="iv${orphans.length ? ' bad' : ''}">без нашей пары: <b>${orphans.length}</b></span>
      <span class="iv">исходов сверки в работе: <b>${DATA.recon.filter(m => m.outcome !== 'ok').length}</b> из ${DATA.recon.length}</span>
    </div>

    ${rcBan(orphans.length ? 'warn' : 'ok', orphans.length
      ? `<b>Несопоставленные строки держат закрытие периода:</b> ${orphans.map(x =>
           `<b>№${x.doc}</b> от ${x.date} на ${money(x.amount)} («${x.payer}») — период ${rcPeriod(x.period).label || x.period}`).join(' · ')}.
         ${holdP.length ? `Не закрываются: ${holdP.map(p => `<b>${p.label}</b> (препятствий ${periodBlockers(p.id).length})`).join(' · ')}. ` : ''}
         <span class="rowlink" onclick="go('period')">Гейт закрытия периода</span>.`
      : `<b>Строк реестра ЦК без нашей пары нет.</b>
         <span class="rowlink" onclick="go('period')">Гейт закрытия периода</span>.`)}`;
}

/* ============================================================
   КАРТОЧКА ИСХОДА — четыре исхода одним рендером
   ============================================================ */

/* пустая сторона рисуется ЯВНО: «записи нет» — это исход, а не пропуск */
function rcEmptyCol(title, why){

function reconCard(m){
  const r = rcReceipt(m.receipt), g = rcReg(m.reg), dup = rcDup(m.reg);
  const o = RC_OUT[m.outcome] || RC_OUT.ok;
  const diff = (r && g) ? +(g.amount - r.amount).toFixed(2) : null;

  const mid = `<div class="recon-mid">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px">
      <span style="font:var(--weight-bold) 24px/1 var(--asubk-font)">${o.sign}</span>
      <span style="font:var(--font-label);${RC_DIM}">${diff
        ? 'разница<br><b class="mono" style="color:var(--asubk-red)">' + rcSign(diff) + '</b>'
        : diff === 0 ? 'разницы нет' : o.mid}</span>
    </div></div>`;

  const cols = `<div class="recon-split" style="grid-template-columns:1fr 120px 1fr">
      ${r ? rcOursCol(r, diff) : rcEmptyCol('Наша запись — поступление',
        `Поступление не внесено и не импортировано.`)}
      ${mid}
      ${g ? rcCbkCol(g, diff) : rcEmptyCol('Строка реестра ЦК',
        `Подтверждение из ЦК ещё не пришло — действует наша сумма.`)}
    </div>`;

  return `<div class="phead" style="margin-bottom:18px">
    <div class="phead-top">
      <div>
        <div class="phead-name">
          <span class="nm">${m.title}</span>${rcShort(o)}
          ${r ? `<span class="amt num">${cur(r.amount, r.currency)}</span>` : ''}
          ${g && !r ? `<span class="amt num">${money(g.amount)}</span>` : ''}
        </div>
        <div class="phead-sub">${m.detail}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        ${r ? `<button class="btn btn-tint btn-sm" onclick="openReceipt('${r.id}')">Открыть ${r.number}</button>` : ''}
        <button class="btn btn-tint btn-sm" onclick="go('registry')">Реестр ЦК</button>
      </div>
    </div>
    ${cols}
    ${dup ? rcBan('info', `<b>Строка №${dup.doc} приходила повторно</b> («${dup.note}»). Дубль в сопоставление не идёт.`) : ''}
    ${reconOutcomeBlock(m, r, g, diff)}
  </div>`;
}

/* ---- что делать при каждом исходе: правило текстом, потом кнопка ---- */
function reconOutcomeBlock(m, r, g, diff){

  /* СОВПАЛО 1:1 */
  if(m.outcome === 'ok'){
    return rcBan('ok', `<b>Сверка положительная.</b> Наша ${money(r.amount)} и сумма ЦК ${money(g.amount)} совпали —
        это основание заморозки.`)
      + (r.frozen === 'open'
        ? rcBan('warn', `<b>Заморозки ещё нет.</b> Поступление ${r.number} стоит в
            <span class="rowlink" onclick="go('period')">гейте закрытия периода</span> как «незамороженное».`)
        : rcBan('info', `<b>Заморозка стоит.</b> Разбивка зафиксирована.`));
  }

  /* РАСХОЖДЕНИЕ СУММЫ — ПТ-Д13 */
  if(m.outcome === 'mismatch'){
    const live = paymentsOf(r).filter(p => !p.void);
    return rcBan('err', `<b>Наша запись приводится к сумме ЦК:</b>
        ${money(r.amount)} <b>→</b> ${money(g.amount)} (${rcSign(diff)}, документ №${g.doc} от ${g.date}).
        Пока корректировка не проведена, ${live.length ? 'платёж ' + live[0].number : 'платёж поступления'} носит
        нашу сумму. После корректировки разница ${money(Math.abs(diff))} станет нераспределённой. Платежи не гасятся.
        <div class="gtoolbar" style="margin:12px 0 0">
          <button class="btn btn-sm btn-primary" onclick="reconCorrect('${r.id}')">Корректировать нашу запись с основанием</button>
          ${roleHint(rcMoney(), 'только бухгалтер')}
          <span class="src-tag">без основания операция не проводится</span>
        </div>`);
  }

  /* ЕСТЬ У НАС, НЕТ В ЦК */
  if(m.outcome === 'ours_only'){
    const soon = r.daysLeft != null && r.daysLeft <= DATA.warnDays;
    return rcBan(soon ? 'warn' : 'info', `<b>Подтверждения ЦК ещё нет</b> — действует наша сумма
        ${cur(r.amount, r.currency)}. Таймаут до <b>${r.deadline}</b>, осталось <b>${r.daysLeft} раб. дн.</b>${soon
          ? ` Порог предупреждения (${DATA.warnDays} раб. дн.) пройден.` : ''}
        Поступление стоит в <span class="rowlink" onclick="go('period')">гейте закрытия периода</span>.
        <div class="gtoolbar" style="margin:12px 0 0">
          <button class="btn btn-sm btn-secondary" onclick="reconAct('ask','${r.id}')">Запросить подтверждение в ЦК</button>
          <button class="btn btn-sm btn-tint" onclick="openReceipt('${r.id}')">Открыть ${r.number}</button>
        </div>`);
  }

  /* ЕСТЬ В ЦК, НЕТ У НАС */
  return rcBan('err', `<b>Нашей записи нет — а деньги в ЦК есть.</b> Документ №${g.doc} от ${g.date} на
      <b>${money(g.amount)}</b>, плательщик «${g.payer}», назначение «${g.note || '—'}».
      Строка держит <span class="rowlink" onclick="go('period')">закрытие периода</span>
      ${rcPeriod(g.period).label || g.period}.`)
    + rcBan('info', `Два пути: внести недостающее поступление у себя либо сопоставить строку
      с уже существующим нашим поступлением.
      <div class="gtoolbar" style="margin:12px 0 0">
        <button class="btn btn-sm btn-primary" onclick="reconAct('adopt','${g.doc}')">Внести поступление по строке ЦК</button>
        ${roleHint(rcMoney(), 'только бухгалтер')}
        <button class="btn btn-sm btn-secondary" onclick="reconAct('pair','${g.doc}')">Сопоставить с нашим поступлением</button>
        ${roleHint(rcMatch(), 'только куратор')}
      </div>`);
}

/* ============================================================
   ШАГ РАЗБИВКИ — ПОДТВЕРЖДЕНИЕ РАССЧИТАННОЙ (ПТ-Д15)
   ============================================================ */
let rcStage = 'R-311';
function setRcStage(id){ rcStage = id; render(); }
/* демо-след подтверждений: сам вывод не хранится, хранится согласие человека */
const RC_CONFIRMED = {};

const RC_STAGE_IDS = [
  { id:'R-311', t:'шлюз · ждёт ЦК' },
  { id:'R-305', t:'сводная строка на трёх заёмщиков' },
  { id:'R-290', t:'заморожено · адресный резерв' },
];

/* четыре шага импорта; состояние каждого выводится из самого поступления */
function reconSteps(r){
  const bound   = paymentsOf(r).filter(p => !p.void).length > 0;
  const spread  = !!RC_CONFIRMED[r.id] || r.frozen === 'frozen';
  const matched = r.match === 'confirmed' || r.match === 'restored';
  const frozen  = r.frozen === 'frozen';
  const state   = [bound, spread, matched, frozen];
  const first   = state.indexOf(false);
  const cls     = i => state[i] ? 'done' : (i === first ? 'cur' : 'todo');
  const dot     = i => state[i] ? '✓' : String(i + 1);

  const step = (i, lbl, sub) => `<div class="tl-step">
      <span class="tl-dot ${cls(i)}">${dot(i)}</span>
      <span class="tl-lbl${cls(i) === 'todo' ? ' todo' : ''}"><b>${lbl}</b><br><span class="src-tag">${sub}</span></span>
    </div>`;
  const arrow = `<span class="tl-arrow">${rcIco(RC_I.arrow)}</span>`;

  const conf = RC_CONFIRMED[r.id];
  return `<div class="timeline">
    ${step(0, '1 · Привязка', bound
      ? `платежей ${paymentsOf(r).filter(p => !p.void).length} · куратор`
      : 'объект счётом не опознан — невыясненное')}
    ${arrow}
    ${step(1, '2 · Разбивка', spread
      ? (frozen ? 'зафиксирована на заморозке' : `подтверждено ${conf ? conf.when + ' · ' + conf.who : ''}`)
      : 'слой → статья долга → срочность · подтверждает куратор')}
    ${arrow}
    ${step(2, '3 · Сопоставление', `${(MATCH[r.match] || {}).t || '—'}`)}
    ${arrow}
    ${step(3, '4 · Заморозка', frozen ? 'разбивка зафиксирована · бухгалтер' : 'бухгалтер по положительной сверке')}
  </div>`;
}

/* выведенный разрез поступления: слой → статья долга → срочность, транш в каждой строке */
function reconCut(a){
  if(!a) return `<div style="padding:14px"><span class="src-tag">разбивка не выведена</span></div>`;
  if(!a.layers.length) return `<div style="padding:14px"><span class="src-tag">разносить нечего: сумма снята сторно</span></div>`;
  const cy = a.currency;
  return `<div style="overflow-x:auto"><table class="mxg">
    <thead><tr><th>Слой · статья долга</th><th>Транш</th><th>Срочность</th><th class="r">Сумма</th></tr></thead>
    <tbody>${a.layers.map(L => L.articles.map(A => A.rows.map(row => `<tr>
      <td>${L.name}<div style="${RC_DIM};font-size:12px">${A.article} · ${row.label}</div></td>
      <td><span class="trn">${row.tranche}</span></td>
      <td><span class="urg ${row.urg}">${RC_URG[row.urg] || row.urg}</span></td>
      <td class="r">${cur(row.v, cy)}</td></tr>`).join('')).join('')).join('')}</tbody>
  </table></div>`;
}

/* очередь погашения публикует КРЕДИТ; ненаступившее видно, но серым */
function reconQueue(p){
  const c = creditOf(p.credit) || {}, q = DATA.queue[p.credit];
  const h = `<h4>Очередь погашения ${pill({ t:'публикует КРЕДИТ', cls:'info' })}</h4>`;
  if(!q) return `<div class="recon-col">${h}
    <div style="padding:14px"><p class="section-note" style="margin:0">Перечень непогашенного по
      <b>${c.title || p.credit}</b> не опубликован.</p></div></div>`;

  const rows = q.rows.map(x => {
    const ln = ((c.layers || []).find(l => l.id === x.layer) || {}).name || x.layer;
    const tn = ((c.tranches || []).find(t => t.id === x.tranche) || {}).label || x.tranche;
    return `<tr style="${x.future ? RC_OFF : ''}">
      <td class="num">${x.due}${x.future ? '' : `<div><span class="urg ${x.urg}">${RC_URG[x.urg] || x.urg}</span></div>`}</td>
      <td>${ln}<div><span class="trn">${tn}</span></div></td>
      <td>${x.article}${x.future ? '<div style="font-size:12px">не наступило</div>' : ''}</td>
      <td class="r">${money(x.amount)}</td></tr>`;
  }).join('');

  return `<div class="recon-col">${h}
    <div style="padding:10px 14px;border-bottom:1px solid var(--asubk-grid-line)">
      <span class="src-tag">непогашенное на ${q.asOf} · ${c.title || p.credit}</span></div>
    <div style="overflow-x:auto"><table class="mxg">
      <thead><tr><th>Срок</th><th>Слой · транш</th><th>Статья долга</th><th class="r">Сумма</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div style="padding:12px 14px">
      <p class="section-note" style="margin:0">Обычные строки — <b>наступившее</b> на дату.</p>
      <p class="section-note" style="margin:4px 0 0;${RC_OFF}">Серые — <b>не наступило</b>.</p>
    </div></div>`;
}

/* пара «вывод ↔ источник вывода» по одному платежу поступления */
function reconAllocPair(p){
  const a = allocOf(p.snapshot || p.derived);
  const c = creditOf(p.credit) || {};
  const r = receiptOf(p);
  const mode = (a && a.surplusMode) || r.surplus;
  const cy = a && a.currency;
  const q  = DATA.queue[p.credit];
  const day = s => String(s || '').split(' (')[0];
  /* даты среза у вывода и у очереди свои: кредит публикует перечень на свою дату */
  const skew = (a && q && day(a.asOf) !== day(q.asOf))
    ? `<p class="section-note" style="margin:8px 0 0">Очередь опубликована на <b>${q.asOf}</b>, разрез выведен
       на <b>${day(a.asOf)}</b> — даты среза разные, построчного равенства сумм между колонками нет.</p>` : '';
  return `<div style="margin-top:14px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start">
      <div class="recon-col">
        <h4>Выведенный разрез поступления ${pill(p.snapshot ? { t:'зафиксирована', cls:'neutral' } : { t:'динамическая', cls:'info' })}</h4>
        <div style="padding:10px 14px;border-bottom:1px solid var(--asubk-grid-line)">
          <span class="src-tag">платёж <span class="rowlink" onclick="openPayment('${p.id}')">${p.number}</span> ·
            ${c.borrower || ''} · ${c.title || p.credit} · выведено на ${a ? a.asOf : '—'}</span></div>
        ${reconCut(a)}
      </div>
      ${reconQueue(p)}
    </div>
    ${a ? `<div class="inv">
      <span class="iv">Всего в разбивке: <b>${cur(a.total, cy)}</b></span>
      <span class="iv">Наступившее на ${a.asOf}: <b>${cur(a.due, cy)}</b></span>
      <span class="iv${a.surplusLeft ? ' bad' : ''}">Остаток сверх наступившего: <b>${cur(a.surplusLeft, cy)}</b></span>
      ${a.surplusLeft ? `<span class="iv">Режим остатка: ${pill(SURPLUS[mode])} <span style="${RC_DIM}">${SURPLUS[mode].hint}</span></span>` : ''}
    </div>` : ''}${skew}</div>`;
}

function reconAllocStage(){
  const r = rcReceipt(rcStage) || DATA.receipts[0];
  const ps = paymentsOf(r).filter(p => !p.void);
  const frozen = r.frozen === 'frozen';
  const conf = RC_CONFIRMED[r.id];

  const segs = `<div class="seg">${RC_STAGE_IDS.map(x => {
    const rr = rcReceipt(x.id);
    return rr ? `<button class="${x.id === r.id ? 'on' : ''}" onclick="setRcStage('${x.id}')">${rr.number} · ${x.t}</button>` : '';
  }).join('')}</div>`;

  const state = frozen
    ? rcBan('info', `<b>Шаг пройден.</b> Поступление ${r.number} заморожено: разбивка зафиксирована.
        Вернуться внутрь можно только разморозкой по решению комиссии.`)
    : conf
      ? rcBan('ok', `<b>Разбивка подтверждена ${conf.when} (${conf.who}).</b>`)
      : rcBan('warn', `<b>Разбивка ещё не подтверждена.</b> Разрез слева выведен — с ним нужно согласиться либо
          внести поправку с основанием (блок ниже).`);

  return `<div class="section-h" style="margin-top:26px">Шаг разбивки — подтверждение рассчитанной</div>

    ${reconSteps(r)}

    <div class="gtoolbar" style="margin-top:14px">${segs}<span class="spacer"></span>
      <span class="src-tag">поступление ${r.number} · ${cur(r.amount, r.currency)} · ${r.date} ·
        платежей ${ps.length} · ${(MATCH[r.match] || {}).t || '—'}</span></div>

    ${state}

    ${ps.length
      ? ps.map(reconAllocPair).join('')
      : rcBan('err', `<b>Разносить нечего: платежей нет.</b> Опознание объекта — в карточке поступления,
          вкладка «Разбор».`)}

    <div class="gtoolbar" style="margin-top:16px">
      <button class="btn btn-primary btn-sm" onclick="reconConfirmAlloc('${r.id}')">Подтвердить разбивку</button>
      ${roleHint(rcMeaning(), 'подтверждает куратор')}
      ${frozen ? roleHint(false, 'поступление заморожено') : ''}
    </div>

    ${reconAdjustBlock(r, ps)}`;
}

/* ---- ручная поправка: директива ВНУТРИ вывода ---- */
function reconAdjustBlock(r, ps){
  const frozen = r.frozen === 'frozen';
  return `<div class="section-h" style="font-size:16px;margin-top:24px">Ручная поправка к выведенному разрезу</div>
    <div class="gtoolbar">
      <button class="btn btn-secondary btn-sm" onclick="reconAdjust('${r.id}')">Внести поправку внутрь вывода</button>
      ${roleHint(rcMeaning(), 'вносит куратор')}
      ${frozen ? roleHint(false, 'поступление заморожено') : ''}
    </div>
    <p class="section-note">Основание поправки обязательно.
      ${frozen
        ? '<b>Здесь поправка запрещена:</b> сначала разморозка по решению комиссии.'
        : ps.length ? '' : '<b>Поправлять нечего:</b> платежей у поступления нет.'}</p>`;
}

/* ============================================================
   ДЕЙСТВИЯ ЭКРАНА (демонстрационные)
   ============================================================ */

/** Корректировка нашей записи по сумме ЦК. Модалка с основанием живёт на экране
    поступлений — здесь она не дублируется, вызывается та же операция. */
function reconCorrect(id){
  const r = rcReceipt(id);
  if(!r) return;
  if(!rcMoney()) return toast('Корректировку суммы проводит бухгалтер','warn');
  recAct('correct', r.id);
}

function reconConfirmAlloc(id){
  const r = rcReceipt(id);
  if(!r) return;
  if(!rcMeaning())  return toast('Разбивку подтверждает куратор','warn');
  if(r.frozen === 'frozen') return toast('Поступление заморожено — подтверждать нечего','warn');
  if(isReversed(r)) return toast('Поступление сторнировано — разносить нечего','warn');
  if(isUnresolved(r)) return toast('Объект не опознан: сначала привязка','warn');
  if(RC_CONFIRMED[r.id]) return toast('Разбивка уже подтверждена');
  RC_CONFIRMED[r.id] = { who:'Куратор · Ж.Осмонова', when:DATA.today };
  r.hist.push(hrow('Разбивка подтверждена на шаге импорта: куратор согласился с выведенным разрезом.','Куратор · Ж.Осмонова'));
  render();
  toast('Разбивка подтверждена','ok');
}

/** Поправка внутри вывода. Форма с основанием живёт на карточке платежа — переиспользуется. */
function reconAdjust(id){
  const r = rcReceipt(id);
  if(!r) return;
  if(!rcMeaning())  return toast('Поправку вносит куратор','warn');
  if(r.frozen === 'frozen') return toast('Поступление заморожено: сначала разморозка по решению комиссии','warn');
  const p = paymentsOf(r).filter(x => !x.void)[0];
  if(!p) return toast('Поправлять нечего: платежей у поступления нет','warn');
  payAdjust(p.id);
}

function reconAct(kind, arg){
  if(kind === 'ask'){
    const r = rcReceipt(arg);
    return toast('Запрос подтверждения отправлен в ЦК по ' + (r ? r.number : '') + '. Таймаут не ускоряется','ok');
  }
  if(kind === 'adopt'){
    const g = rcReg(arg);
    if(!rcMoney()) return toast('Внесение поступления — работа бухгалтера','warn');
    toast('Строка ЦК №' + (g ? g.doc : '') + ': если счёт не опознает объект, запись ляжет в невыясненные','ok');
    return modalNewReceipt();
  }
  if(kind === 'pair'){
    const g = rcReg(arg);
    if(!rcMatch()) return toast('Сопоставление выполняет куратор','warn');
    return toast('Подходящего поступления не нашлось. Плательщик «' + (g ? g.payer : '') +
      '» ни с одним кредитом не связан','warn');
  }
}

/* ============================================================
   САМ ЭКРАН
   ============================================================ */
function viewRecon(){
  return `<div class="page-pad">
    <div class="section-h">Сопоставление (сверка)</div>

    ${reconSummary()}

    <div class="section-h" style="margin-top:22px">Исходы сверки</div>
    ${DATA.recon.map(reconCard).join('')}

    ${reconAllocStage()}

    <div class="legend" style="margin-top:18px">
      <span>${pill(RC_OUT.ok)} наша запись и строка ЦК сошлись</span>
      <span>${pill(RC_OUT.mismatch)} суммы разошлись</span>
      <span>${pill(RC_OUT.ours_only)} подтверждения ЦК нет — идёт таймаут</span>
      <span>${pill(RC_OUT.cbk_only)} нашей записи нет</span>
      <span style="${RC_OFF}">серые строки очереди — не наступило</span>
    </div>
  </div>`;
}

/* @@VIEW:period@@ */
/* ------------------------------------------------------------
   ВТОРОЙ уровень заморозки (ADR-0075). Первый — заморозка ПОСТУПЛЕНИЯ
   (над одной записью, по положительной сверке, фиксирует разбивку
   платежей). Второй — ЗАКРЫТИЕ ПЕРИОДА (над месяцем целиком, по гейту).
   Уровни не подменяют друг друга: закрытие периода платежи НЕ морозит —
   оно проверяет, что они уже заморожены, и захлопывает месяц.
   Экрана не было вовсе — дефект ПТ-Д24.
   ------------------------------------------------------------ */

/* демо-актор операций уровня факта денег */
const PERIOD_ACTOR = 'Бухгалтер · А.Иманкулова';

/* Журнал закрытий и открытий ведётся всегда: и закрытие, и открытие —
   именованные операции с автором, датой и основанием. Открытие — ещё и
   с реквизитами решения комиссии. */
let PERIOD_LOG = [
  { when:'10.07.2026', act:'Закрытие', period:'Июнь 2026', who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст: три невыясненных разобраны, строки реестра ЦК сопоставлены, таймауты закрыты.' },
  { when:'02.07.2026', act:'Открытие', period:'Май 2026', who:PERIOD_ACTOR,
    decision:'Решение комиссии №11 от 01.07.2026',
    why:'Позднее подтверждение ЦК по сторнированному поступлению: понадобилась корректировка внутри уже закрытого месяца.' },
  { when:'30.06.2026', act:'Закрытие', period:'Май 2026', who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст.' },

/* ---- вспомогательные выводы по периоду (ничего не хранится) ---- */
function periodTotals(pid){
  const rs   = DATA.receipts.filter(r=>r.period===pid);
  const need = rs.filter(r=>r.match==='confirmed' && !isUnresolved(r));   // положительная сверка = основание заморозки
  return { rs, sum: rs.reduce((s,r)=>s+r.amount,0), need,
           frz: need.filter(r=>r.frozen==='frozen').length };
}
function periodKindTally(bl){
  const m = {}; bl.forEach(b=> m[b.kind] = (m[b.kind]||0)+1 );
  return Object.keys(m).map(k=>`${k} — ${m[k]}`).join(' · ');
}

/* ---- ГЕЙТ: поимённый список препятствий (ADR-0075 §2).
   periodBlockers даёт {kind, id, what, go}; функцию go в разметку не передать,
   поэтому переход собираем здесь: поступление — по номеру, строка ЦК — в реестр. */
function periodGate(pid, inModal){
  const bl = periodBlockers(pid);
  if(!bl.length) return '';
  return `<div class="gate">${bl.map(b=>{
    const rec  = DATA.receipts.find(r=>r.number===b.id);
    const jump = (inModal?'closeModal();':'') + (rec ? `openReceipt('${rec.id}')` : `go('registry')`);
    return `<div class="grow">
      <span class="gkind">${b.kind}</span>
      <span class="gwhat">${b.what}</span>
      <span class="gid" onclick="${jump}" title="Перейти к объекту">${b.id} →</span>
    </div>`;
  }).join('')}</div>`;
}

/** Закрытие месяца. Кнопка неактивна, пока гейт не пуст; отказ — всегда поимённый. */
function closePeriod(pid){
  const p = DATA.periods.find(x=>x.id===pid);
  if(!p || p.state==='closed') return;
  if(!can.closePeriod()) return toast('Период закрывает бухгалтер','warn');
  const bl = periodBlockers(pid);
  if(bl.length){
    modalBlockers(pid);
    return toast(`Период не закрыт: препятствий ${bl.length}`,'warn');
  }
  p.state   = 'closed';
  p.closedBy = PERIOD_ACTOR;
  p.closedAt = DATA.today;
  p.note     = 'Гейт был пуст.';
  PERIOD_LOG.unshift({ when:DATA.today, act:'Закрытие', period:p.label, who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст: невыясненных нет, строки реестра ЦК сопоставлены, положительные сверки заморожены, таймауты закрыты.' });
  render();
  toast(`«${p.label}» закрыт`,'ok');
}

/** Отказ: система называет каждое препятствие и ведёт к нему (ПТ-Д24). */

function doOpenPeriod(pid){

    decision:`Решение комиссии №${num} от ${dt}`,
    why: why || 'Причина не указана.' });
  closeModal(); render();
  toast(`«${p.label}» открыт по решению комиссии №${num}`,'ok');
}
