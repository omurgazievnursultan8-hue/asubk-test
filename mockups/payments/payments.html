/* ============================================================
   VIEW: ПОСТУПЛЕНИЯ + НЕВЫЯСНЕННЫЕ + карточка поступления
   ============================================================ */
/* @@VIEW:receipts@@ */
/* Экран ПОСТУПЛЕНИЙ — факт денег (ADR-0056). Три оси состояния живут здесь,
   платёж их наследует. Невыясненное — ВИД этой же ленты (ноль платежей), а не
   отдельная сущность (ПТ-Д1). Счёт зачисления опознаёт объект (ПТ-Д7).
   Сторно · корректировка · перепривязка — три разные операции (ПТ-Д12).
   Режим остатка сверх наступившего ставится ДО разбивки (ПТ-Д23).
   В текстах экрана — только «заморозка»; жаргон бухгалтерии изъят (ПТ-Д18). */
let rTab = 'alloc';
function setRTab(t){ rTab = t; render(); }
let rFilter = 'all';
function setRFilter(f){ rFilter = f; FEEDS.rec.page = 1; render(); }

/* ---- мелкая инфраструктура экрана ---- */
const recIco = d => `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const REC_I = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/>',
  warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  x:    '<path d="M18 6L6 18M6 6l12 12"/>',
};
const recBan = (kind, html) => `<div class="banner ${kind}">${recIco(REC_I[(kind==='warn'||kind==='err')?'warn':'info'])}<div>${html}</div></div>`;
function recVal(id){ const e = document.getElementById(id); return e ? String(e.value||'').trim() : ''; }
function recModal(title, body, okLabel, okCall, danger){
  openModal(`<div class="modal-h"><span class="mt">${title}</span><button class="modal-x" onclick="closeModal()">${recIco(REC_I.x)}</button></div>
  <div class="modal-b">${body}</div>
  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    <button class="btn ${danger?'btn-danger':'btn-primary'}" onclick="${okCall}">${okLabel}</button></div>`);
}

/* ---- производные ленты (ADR-0001: не хранятся, выводятся) ---- */
const recPaidSum = r => +paymentsOf(r).filter(p=>!p.void).reduce((s,p)=>s+paidOf(p),0).toFixed(2);
const recRetSum  = r => +returnsOf(r).filter(v=>v.state==='executed').reduce((s,v)=>s+v.amount,0).toFixed(2);
const recRegOf   = r => DATA.registry.filter(x=>x.matched===r.id);
/** подпись нераспределённого остатка зависит от состояния поступления, а не от знака суммы */
function recLeftLabel(r){
  if(isReversed(r))   return { t:'снято сторно',      bad:false };
  if(isUnresolved(r)) return { t:'ожидает опознания', bad:false };
  return { t:'нераспределённое', bad: Math.abs(unallocated(r)) > 0.004 };
}

/** полоса инварианта одного поступления: сумма = Σ платежей + исполненные возвраты + нераспределённое */
function recInv(r){
  const paid = recPaidSum(r), ret = recRetSum(r), left = unallocated(r), L = recLeftLabel(r);
  const tail = isReversed(r) ? 'платежи погашены сторно — сумма не распределена'
             : isUnresolved(r) ? 'платежей нет: деньги пришли, объект не опознан'
             : L.bad ? 'остаток ждёт распределения' : 'распределено полностью';
  return `<div class="inv">
    <span class="iv">Инвариант поступления: <b>сумма</b> = Σ платежей + исполненные возвраты + ${L.t}</span>
    <span class="iv">сумма <b>${cur(r.amount, r.currency)}</b></span>
    <span class="iv">Σ платежей <b>${money(paid)}</b></span>
    <span class="iv">возвраты исполненные <b>${money(ret)}</b></span>
    <span class="iv${L.bad?' bad':''}">${L.t} <b>${money(left)}</b></span>
    <span class="iv">${tail}</span></div>`;
}

/** Тот же инвариант итогом по видимой выборке — но подвалом таблицы, чтобы каждая
    величина стояла в СВОЕЙ колонке: сумма под «Суммой», остаток под «Нераспределено»,
    число платежей под «Платежей». Средняя ячейка держит само равенство, иначе итог
    читается как три несвязанных числа. */
function recInvFoot(list){
  const sum  = +list.reduce((s,r)=>s+r.amount,0).toFixed(2);
  const paid = +list.reduce((s,r)=>s+recPaidSum(r),0).toFixed(2);
  const ret  = +list.reduce((s,r)=>s+recRetSum(r),0).toFixed(2);
  const left = +(sum-paid-ret).toFixed(2);
  const bad  = list.filter(r=>recLeftLabel(r).bad).length;
  const pays = list.reduce((s,r)=>s+paymentsOf(r).filter(p=>!p.void).length, 0);
  return `<tr>
    <td class="lbl">Итого по выборке<span class="sub">${list.length} поступл.</span></td>
    <td class="r num">${money(sum)}</td>
    <td colspan="4" class="lbl">= Σ платежей ${money(paid)} + исполненные возвраты ${money(ret)}
      + нераспределённое${bad ? ` · с остатком: ${bad}` : ''}</td>
    <td class="r num">${pays}</td>
    <td class="r num${bad?' bad':''}">${money(left)}</td></tr>`;
}

/* ---- строка ленты: один рендер и для «Поступлений», и для «Невыясненных» ---- */
function recRow(r){
  const ps = paymentsOf(r), live = ps.filter(p=>!p.void).length, dead = ps.length - live;
  const L = recLeftLabel(r), left = unallocated(r);
  const mark = isReversed(r)   ? pill({t:'Сторнировано', cls:'err'})
             : isUnresolved(r) ? pill({t:'Невыясненное', cls:'warn'}) : '';
  const per = (DATA.periods.find(p=>p.id===r.period)||{});
  const wait = r.match==='pending' && r.daysLeft!=null
    ? `<span class="sub">до автосторно ${r.daysLeft} раб. дн. · ${r.deadline}</span>` : '';
  return `<tr onclick="openReceipt('${r.id}')">
    <td><span class="rowlink">${r.number}</span><span class="sub">${r.date}</span>${mark?`<span class="sub">${mark}</span>`:''}</td>
    <td class="r num">${cur(r.amount, r.currency)}</td>
    <td>${axes(r)}${wait}</td>
    <td title="${esc(r.account)} · ${esc(r.accountObject||'')}"><span class="mono">${r.account}</span
      ><span class="sub">${r.accountObject}</span></td>
    <td title="${esc(r.payerName||'—')} · ${esc(r.note||'—')}"><span class="cell-name">${r.payerName || '—'}</span
      ><span class="sub">${r.note || '—'}</span></td>
    <td>${per.label || r.period}<span class="sub">${(PSTATE[per.state]||{}).t||''}</span></td>
    <td class="r num">${live}${dead?`<span class="sub">+${dead} погашен сторно</span>`:''}</td>
    <td class="r num${L.bad?' bad':''}">${money(left)}<span class="sub">${L.t}</span></td></tr>`;
}

const REC_COLS = 8;
/* Пусто по двум разным причинам, и путать их нельзя: в виде ленты нет строк вообще —
   или их отсеяли условия фильтра. Второе снимается кнопкой «Сбросить», первое нет. */
const recRowsHtml = list => list.length ? list.map(recRow).join('')
  : `<tr><td colspan="${REC_COLS}"><div class="grid-empty">${
      feedActive(FEEDS.rec).length ? 'Ничего не найдено по фильтрам' : 'В этом виде ленты поступлений нет'}</div></td></tr>`;

/* Формат реестра кредитов (§Р-19). Десять колонок слиты в восемь — пары, которые
   читаются как одно:
     Поступление = номер (+ метка) над датой факта — дата как измерение выборки
                   закрыта условием «Дата факта», как дата договора у кредитов;
     Плательщик  = имя над примечанием документа: и то и другое пришло из банковского
                   документа, а не из нашей трактовки;
     остальные пары (счёт → что опознал, период → его состояние, остаток → его подпись)
     уже жили подстрочником src-tag и просто переехали в .sub. */
function recTable(list, hits){
  return `<div class="grid-wrap"><table class="grid" data-t="rec" style="min-width:1290px">
    <colgroup>
      <col style="width:150px"><col style="width:120px"><col style="width:250px"><col style="width:190px">
      <col style="width:210px"><col style="width:115px"><col style="width:105px"><col style="width:160px">
    </colgroup>
    <thead><tr>
      ${gth('rec','number','Поступление')}${gth('rec','amount','Сумма','r')}${gth('rec','axes','Оси состояния')}
      ${gth('rec','account','Счёт и что опознал')}${gth('rec','payer','Плательщик')}
      ${gth('rec','period','Период')}${gth('rec','pays','Платежей','r')}${gth('rec','left','Нераспределено','r')}
    </tr></thead><tbody id="rec-body">${recRowsHtml(list)}</tbody>
    <tfoot id="rec-foot">${recInvFoot(hits||list)}</tfoot></table></div>`;
}

const REC_LEGEND = `<div class="legend">
  <span>${pill(CHAN.gateway)} канал — откуда пришли деньги</span>
  <span>${pill(MATCH.pending)} сопоставление с реестром ЦК</span>
  <span>${pill(FRZ.frozen)} заморозка</span>
  <span>${pill({t:'Невыясненное',cls:'warn'})} платежей нет</span></div>`;

/* ---- каркас ленты; «Невыясненные» — этот же каркас, отличается только базой ----
   Своего заголовка у ленты нет: имя экрана уже стоит в шапке страницы (VIEW_TITLES).
   Фильтр у обеих лент ОДИН (feed 'rec'): невыясненные — вид ленты поступлений,
   а не отдельная сущность, и своих условий у них быть не может. Отбор вида
   применяется до условий, условия — внутри вида. */
function recFeed(o){
  const s = feedSlice('rec');
  /* «Внести поступление» — действие ленты поступлений, а не «Невыясненных»: сюда
     заходят опознавать уже пришедшие деньги (вкладка «Разбор» в карточке), а не
     заводить новые. Внесённое поступление в этот список само не попадает. */
  const add = o.add === false ? '' :
    `<button class="btn btn-primary btn-sm" onclick="modalNewReceipt()">${recIco(REC_I.plus)}Внести поступление</button>`;
  const bar = (o.segs || add)
    ? `<div class="gtoolbar">${o.segs||''}<span class="spacer"></span>${add}</div>` : '';
  return `<div class="page-pad">
    ${o.banners||''}
    ${bar}
    ${feedBar('rec')}
    ${recTable(s.page, s.hits)}
    ${feedPagerHtml(s)}
    ${REC_LEGEND}</div>`;
}

/* Условия ленты поступлений. Ярус 1 — то, чем сужают выборку каждый вход
   (поиск по реквизитам, канал, период); ярус 2 — редкое.
   Сверка и заморозка дублируют часть сегментов намеренно: сегмент — готовый вид
   одним кликом, условие — произвольная комбинация (например «банк + расхождение
   + июль»), которую сегментами не собрать. */
const REC_CONDS = [
  { key:'q', kind:'text', zone:'quick', label:'Поиск', width:340,
    ph:'Номер, плательщик, счёт, примечание',
    test:(r,v)=>(`${r.number} ${r.payerName||''} ${r.account} ${r.accountObject||''} ${r.note||''}`).toLowerCase().includes(v) },
  { key:'channel', kind:'select', zone:'quick', label:'Канал', width:170,
    options:()=>Object.keys(CHAN).map(k=>({ v:k, t:CHAN[k].t })), test:(r,v)=>r.channel===v },
  { key:'period', kind:'select', zone:'quick', label:'Период', width:170,
    options:()=>DATA.periods.map(p=>({ v:p.id, t:p.label })), test:(r,v)=>r.period===v },
  { key:'match', kind:'select', label:'Сопоставление с ЦК',
    options:()=>uniqv(DATA.receipts.map(r=>r.match)).map(k=>({ v:k, t:MATCH[k].t })), test:(r,v)=>r.match===v },
  { key:'frozen', kind:'select', label:'Заморозка',
    options:()=>Object.keys(FRZ).map(k=>({ v:k, t:FRZ[k].t })), test:(r,v)=>r.frozen===v },
  { key:'left', kind:'select', label:'Нераспределённый остаток',
    options:()=>[{ v:'yes', t:'есть' }, { v:'no', t:'нет' }],
    test:(r,v)=>(Math.abs(unallocated(r)) > 0.004) === (v==='yes') },
  { key:'date', kind:'range', input:'date', label:'Дата факта',
    test:(r,v)=>{ const iso = toISO(r.date);
      return !(v.from && (!iso || iso < v.from)) && !(v.to && (!iso || iso > v.to)); } },
  { key:'amount', kind:'range', input:'number', label:'Сумма поступления',
    test:(r,v)=>!(v.from!=='' && r.amount < +v.from) && !(v.to!=='' && r.amount > +v.to) },
];

defFeed('rec', {
  conds: REC_CONDS,
  /* Сортеры — по величине из ячейки. Колонка «Поступление» сортируется по номеру
     (дата в ней подстрочник и закрыта условием «Дата факта»), «Нераспределено» — по
     самой сумме остатка, а не по её подписи. */
  sorters: {
    number:  r => r.number,
    amount:  r => r.amount,
    axes:    r => `${MATCH[r.match].t} ${FRZ[r.frozen].t} ${CHAN[r.channel].t}`,
    account: r => r.account,
    payer:   r => r.payerName || '',
    period:  r => r.period,
    pays:    r => paymentsOf(r).filter(p=>!p.void).length,
    left:    r => unallocated(r),
  },
  /* база = отбор ВИДА: экран «Невыясненные» или выбранный сегмент общей ленты */
  base: () => CUR_VIEW==='unresolved' ? unresolvedReceipts()
            : DATA.receipts.filter((RFILTERS.find(x=>x.id===rFilter) || RFILTERS[0]).f),
  /* итог инварианта считается по ВСЕЙ выборке, а не по странице: это итог ленты */
  paint: s => {
    const b = document.getElementById('rec-body'); if(b) b.innerHTML = recRowsHtml(s.page);
    const f = document.getElementById('rec-foot'); if(f) f.innerHTML = recInvFoot(s.hits);
  },
});

const RFILTERS = [
  { id:'all',        t:'Все',            f:()=>true },
  { id:'unresolved', t:'Невыясненные',   f:r=>isUnresolved(r) },
  { id:'pending',    t:'Ожидают ЦК',     f:r=>r.match==='pending' },
  { id:'open',       t:'Незамороженные', f:r=>r.frozen==='open' },
  { id:'reversed',   t:'Сторно',         f:r=>isReversed(r) },
];

function viewReceipts(){
  const segs = `<div class="seg">${RFILTERS.map(x=>
    `<button class="${x.id===rFilter?'on':''}" onclick="setRFilter('${x.id}')">${x.t} (${DATA.receipts.filter(x.f).length})</button>`).join('')}</div>`;
  const waiting = DATA.receipts.filter(r=>r.match==='pending');
  const soon    = waiting.filter(r=>r.daysLeft!=null && r.daysLeft<=DATA.warnDays);
  const bans =
    (soon.length ? recBan('warn', `<b>Скоро автосторно:</b> ${soon.map(r=>
        `<span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span> — ${r.deadline}, осталось ${r.daysLeft} раб. дн.`).join(' · ')}.`) : '')
    + (unresolvedReceipts().length ? recBan('warn', `<b>Невыясненных: ${unresolvedReceipts().length}.</b>
        Держат закрытие периода. Разбор — в карточке поступления, вкладка «Разбор».`) : '');
  return recFeed({ banners:bans, segs });
}

function viewUnresolved(){
  const list = unresolvedReceipts();
  /* Сегментов нет: «Вся лента» — это соседний пункт меню, а не вид внутри экрана.
     Возврат к полной ленте даёт навигация, дублировать её кнопкой незачем. */
  const bans = list.length ? recBan('warn', `<b>Невыясненных: ${list.length}.</b> Держат закрытие периода.
      Опознание — вкладка «Разбор» в карточке поступления.`) : '';
  return recFeed({ banners:bans, add:false });
}

/* ============================================================
   КАРТОЧКА ПОСТУПЛЕНИЯ
   ============================================================ */
function receiptDetail(r){
  const per  = DATA.periods.find(p=>p.id===r.period) || {};
  const regs = recRegOf(r), reg = regs.find(x=>!x.dup) || regs[0] || null;
  const ps   = paymentsOf(r), live = ps.filter(p=>!p.void);
  const bans =
    (isReversed(r) ? recBan('err', `<b>Сторно по таймауту ${r.deadline}.</b> Платежи погашены.
        Восстановление вернёт исходную дату ${r.date}.`) : '')
    + (r.match==='pending' ? recBan(r.daysLeft!=null && r.daysLeft<=DATA.warnDays ? 'warn':'info',
        `<b>Ожидает подтверждения ЦК.</b> Таймаут до <b>${r.deadline}</b> — осталось <b>${r.daysLeft} раб. дн.</b>`) : '')
    + (isUnresolved(r) ? recBan('warn', `<b>Невыясненное:</b> платежей нет. Держит закрытие периода.
        Разбор — на вкладке «Разбор».`) : '')
    + (r.match==='mismatch' && reg ? recBan('warn', `<b>Расхождение с реестром ЦК.</b> У нас ${money(r.amount)},
        в ЦК ${money(reg.amount)}. Требуется корректировка суммы — вкладка «Сверка».`) : '')
    + (r.dispute ? recBan('info', `<b>Спорная пеня ${money(r.dispute.amount)}.</b> Ожидает решения комиссии.`) : '');

  const tabs = [
    ['alloc','Платежи ('+live.length+')'],
    ['parse', isUnresolved(r) ? 'Разбор' : 'Разбор · режим остатка'],
    ['recon','Сверка'],
    ['hist','История'],
  ];
  const panel = { alloc:recPayPanel, parse:recParsePanel, recon:recReconPanel, hist:recHistPanel };
  return `<div class="page-pad">
    <div class="gtoolbar">
      <button class="btn btn-secondary btn-sm" onclick="back()">${recIco(REC_I.back)}К ленте поступлений</button>
      <span class="spacer"></span>${recActionBar(r)}
    </div>
    ${bans}
    <div class="phead">
      <div class="phead-top">
        <div>
          <div class="phead-name"><span class="nm">${r.number}</span><span class="amt">${cur(r.amount, r.currency)}</span></div>
          <div class="phead-sub">Дата фактического поступления <b>${r.date}</b> · период <b>${per.label||r.period}</b>
            (${(PSTATE[per.state]||{}).t||'—'}) · плательщик <b>${r.payerName||'—'}</b><br>
            Примечание документа: «${r.note||'—'}»</div>
        </div>
        ${axes(r)}
      </div>
      <div class="phead-dims">
        <div class="dim"><div class="dl">Канал и счёт зачисления</div>
          <div class="dv">${pill(CHAN[r.channel])}<span class="mono">${r.account}</span></div>
          <div class="src">Счёт опознал: <b>${r.accountObject}</b>.</div></div>
        <div class="dim"><div class="dl">Сопоставление с реестром ЦК</div>
          <div class="dv">${pill(MATCH[r.match])}</div>
          <div class="src">${reg ? 'строка ЦК №'+reg.doc+' от '+reg.date+' на '+money(reg.amount)
            : r.match==='pending' ? 'подтверждение не пришло; таймаут до '+r.deadline+' ('+r.daysLeft+' раб. дн.)'
            : 'строки реестра нет'}</div></div>
        <div class="dim"><div class="dl">Заморозка</div>
          <div class="dv">${pill(FRZ[r.frozen])}</div>
          <div class="src">${r.frozen==='frozen'
            ? 'Разбивка платежей зафиксирована. Правка — только через разморозку по решению комиссии.'
            : 'Ставится по положительной сверке.'}</div></div>
      </div>
    </div>
    ${recInv(r)}
    <div class="detail-tabbar">${tabs.map(([id,t])=>
      `<button class="dtab${rTab===id?' active':''}" onclick="setRTab('${id}')">${t}</button>`).join('')}</div>
    ${tabs.map(([id])=>`<div class="dpanel${rTab===id?' active':''}">${rTab===id?panel[id](r):''}</div>`).join('')}
  </div>`;
}

/* ---- панель действий: ТРИ операции вместо одной кнопки «сторно» (ПТ-Д12) ---- */
function recActionBar(r){
  let b = '';
  if(isReversed(r)){
    b += `<button class="btn btn-sm btn-tint" onclick="recAct('restore','${r.id}')">Позднее подтверждение ЦК — восстановить</button>
      ${roleHint(can.reverse(),'только бухгалтер')}`;
  } else {
    b += `<button class="btn btn-sm btn-tint danger" onclick="recAct('reverse','${r.id}')">Сторно поступления</button>
      ${roleHint(can.reverse(),'только бухгалтер')}`;
    b += `<button class="btn btn-sm btn-tint" onclick="recAct('correct','${r.id}')">Корректировка суммы</button>
      ${roleHint(can.correct(),'только бухгалтер')}`;
  }
  if(r.frozen==='open'){
    b += `<button class="btn btn-sm btn-secondary" onclick="recAct('freeze','${r.id}')">${recIco(REC_I.lock)}Заморозить</button>
      ${roleHint(can.freeze(),'только бухгалтер')}`;
  } else {
    b += `<button class="btn btn-sm btn-secondary" onclick="recAct('unfreeze','${r.id}')">Разморозить по решению комиссии</button>
      ${roleHint(can.unfreeze(),'только бухгалтер')}`;
  }
  return b;
}

/* ---- вкладка «Платежи»: трактовка поступления ---- */
function recPayPanel(r){
  const ps  = paymentsOf(r);
  const vs  = returnsOf(r);
  const rows = ps.map(p=>{
    const c = creditOf(p.credit) || {};
    const tr = (c.tranches||[]).find(t=>t.id===p.tranche);
    const eq = p.currency!=='KGS' ? kgsEquiv(p) : null;
    return `<tr onclick="openPayment('${p.id}')">
      <td><span class="rowlink">${p.number}</span>${p.void?'<div style="margin-top:4px">'+pill({t:'Погашен сторно',cls:'err'})+'</div>':''}</td>
      <td>${c.title||p.credit}<div class="src-tag" style="margin-top:4px">${c.borrower||''}</div></td>
      <td>${tr?`<span class="trn">${tr.label}</span>`:'<span class="trn">область — весь кредит</span>'}</td>
      <td>${p.kind}<div class="src-tag" style="margin-top:4px">${p.basis||''}</div></td>
      <td class="r mono">${cur(p.amount,p.currency)}${eq!=null?`<div class="src-tag" style="text-align:right">= ${money(eq)} сом · курс НБ на ${p.rateDate}</div>`:''}</td>
      <td>${p.snapshot?pill({t:'Разбивка зафиксирована',cls:'info'}):pill({t:'Разбивка динамическая',cls:'neutral'})}</td>
      <td class="r"><button class="btn btn-sm btn-tint" onclick="event.stopPropagation();recAct('rebind','${p.id}')">Перепривязать</button></td>
    </tr>${p.note?`<tr class="muted"><td colspan="7" style="white-space:normal">${p.note}</td></tr>`:''}`;
  }).join('');
  const retRows = vs.map(v=>`<tr onclick="openReturn('${v.id}')">
      <td><span class="rowlink">${v.id}</span></td>
      <td>${v.recipient.name}<div class="src-tag" style="margin-top:4px">${v.recipient.kind}</div></td>
      <td class="r mono">${cur(v.amount,v.currency)}</td>
      <td>${pill(RET_STATE[v.state])}</td>
      <td style="white-space:normal;max-width:420px">${v.basis||''}</td></tr>`).join('');
  return `${ps.length ? `<div class="cgrid-wrap"><table class="cgrid"><thead><tr>
      <th>Платёж</th><th>Кредит и заёмщик</th><th>Транш (область разбивки)</th><th>Вид и основание</th>
      <th class="r">Сумма</th><th>Разбивка</th><th class="r">Операция куратора</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="cgrid-wrap"><div class="cgrid-empty">Платежей нет — опознание на вкладке «Разбор»</div></div>`}
    ${vs.length ? `<div class="section-h" style="margin-top:22px">Возвраты этого поступления</div>
      <div class="cgrid-wrap"><table class="cgrid"><thead><tr>
        <th>Возврат</th><th>Получатель</th><th class="r">Сумма</th><th>Состояние</th><th>Основание</th>
        </tr></thead><tbody>${retRows}</tbody></table></div>` : ''}`;
}

/* ---- остаток сверх наступившего: что вывелось по платежам поступления ---- */
function recSurplusRows(r){
  return paymentsOf(r).filter(p=>!p.void).map(p=>{
    const a = allocOf(p.snapshot || p.derived) || {};
    return { p, due:a.due||0, left:a.surplusLeft||0, asOf:a.asOf||'—', cu:a.currency||p.currency };
  });
}

/* ---- вкладка «Разбор»: невыясненное — опознание; остальные — режим остатка (ПТ-Д23) ---- */
function recParsePanel(r){
  if(isUnresolved(r)) return recIdentifyPanel(r);

  const rows = recSurplusRows(r);
  const anyLeft = rows.some(x=>x.left > 0.004);
  const frozen  = r.frozen==='frozen';
  const allowed = can.surplus() && !frozen;
  const opts = Object.keys(SURPLUS).map(k=>{
    const on = r.surplus===k;
    return `<div class="cand">
      <div class="ci"><div class="cn">${pill(SURPLUS[k])}${on?' &nbsp;<span class="src-tag">— режим действует</span>':''}</div>
        <div class="cm">${SURPLUS[k].hint}</div></div>
      ${on ? '<span class="src-tag">стоит</span>'
           : `<button class="btn btn-sm ${allowed?'btn-tint':'btn-secondary'}" onclick="recAct('surplus','${r.id}','${k}')">Поставить режим</button>`}
    </div>`;
  }).join('');

  const reserve = (r.surplus==='reserve' && (r.reserveRows||[]).length) ? `
    <div class="matrix" style="margin-top:14px"><div class="mx-layer open">
      <div class="mx-layer-h" onclick="this.parentNode.classList.toggle('open')">
        <span class="chev">${recIco('<path d="M9 6l6 6-6 6"/>')}</span>
        <span class="ml-title">Резерв закреплён за строками графика</span>
        <span class="ml-mode">адресный: каждая строка названа датой взноса и статьёй долга</span>
        <span class="ml-sum">${money(r.reserveRows.reduce((s,x)=>s+x.amount,0))}</span></div>
      <div class="mx-body"><table class="mxg"><thead><tr>
        <th>Дата взноса по графику</th><th>Статья долга</th><th class="r">Сумма резерва</th>
        </tr></thead><tbody>${r.reserveRows.map(x=>`<tr>
          <td class="mono">${x.due}</td><td>${x.article}</td><td class="r">${money(x.amount)}</td></tr>`).join('')}
        </tbody></table></div></div></div>` : '';

  return `${frozen ? recBan('info', `<b>Поступление заморожено.</b> Разбивка зафиксирована,
        смена режима — только после разморозки по решению комиссии.`) : ''}
    ${isReversed(r) ? recBan('warn', `Поступление сторнировано: разбивки нет, режим вступит в силу при восстановлении.`) : ''}
    ${rows.length ? `<div class="cgrid-wrap"><table class="cgrid"><thead><tr>
        <th>Платёж</th><th>Дата среза вывода</th><th class="r">Наступившее на дату</th>
        <th class="r">Остаток сверх наступившего</th></tr></thead><tbody>
        ${rows.map(x=>`<tr onclick="openPayment('${x.p.id}')">
          <td><span class="rowlink">${x.p.number}</span></td><td class="mono">${x.asOf}</td>
          <td class="r mono">${cur(x.due,x.cu)}</td>
          <td class="r mono"${x.left>0.004?' style="color:var(--asubk-red);font-weight:600"':''}>${cur(x.left,x.cu)}</td>
          </tr>`).join('')}</tbody></table></div>` : ''}
    ${reserve}
    ${anyLeft ? '' : recBan('info', `Остатка сверх наступившего нет — вся сумма легла на наступившее.`)}
    <div class="section-h" style="margin-top:18px">Режим остатка сверх наступившего
      ${roleHint(can.surplus(),'ставит куратор')}</div>
    ${opts}`;
}

/* ---- опознание невыясненного ---- */
function recIdentifyPanel(r){
  const cands = r.candidates || [];
  return `${recBan('warn', `<b>Объект не опознан:</b> ${r.unresolvedReason||'—'}.
      Счёт зачисления — <b>${r.accountObject}</b>.`)}
    <div class="section-h" style="margin-top:16px">Кандидаты ${cands.length?roleHint(can.bind(),'привязывает куратор'):''}</div>
    ${cands.length ? `${cands.map(c=>`<div class="cand">
        <div class="ci"><div class="cn">${c.title}</div>
          <div class="cm">${c.borrower} · совпадение: ${c.score}</div></div>
        <button class="btn btn-sm ${can.bind()?'btn-tint':'btn-secondary'}"
          onclick="recAct('bind','${r.id}','${c.credit}')">Привязать</button></div>`).join('')}`
      : recBan('err', `<b>Кандидатов нет:</b> ни плательщик, ни назначение не распознаны.
          Следующий шаг — запрос уточнения реквизитов в ЦК.`)}
    <div class="gtoolbar" style="margin-top:14px">
      <button class="btn btn-sm btn-secondary" onclick="toast('Запрос уточнения реквизитов отправлен в ЦК','ok')">Запросить уточнение в ЦК</button>
    </div>`;
}

/* ---- вкладка «Сверка» ---- */
function recReconPanel(r){
  const regs = recRegOf(r);
  const reg  = regs.find(x=>!x.dup) || regs[0] || null;
  const dup  = regs.find(x=>x.dup);
  const m    = DATA.recon.find(x=>x.receipt===r.id);
  const head = m ? `<p class="section-note">Исход сопоставления: <b>${m.title}</b> — ${m.detail}</p>` : '';
  if(!reg) return head + recBan(r.match==='pending'?'warn':'info',
    r.match==='pending'
      ? `<b>Строки реестра ЦК пока нет.</b> Таймаут до <b>${r.deadline}</b>, осталось <b>${r.daysLeft} раб. дн.</b>`
      : `<b>Строки реестра ЦК нет.</b> Сопоставление не выполнялось: ${(MATCH[r.match]||{}).t||'—'}.`);
  const diff = +(reg.amount - r.amount).toFixed(2);
  return head + `<div class="recon-split">
      <div class="recon-col"><h4>Наша запись — поступление</h4>
        <dl class="kv">
          <dt>Номер</dt><dd>${r.number}</dd>
          <dt>Дата факта</dt><dd>${r.date}</dd>
          <dt>Сумма</dt><dd>${cur(r.amount,r.currency)}</dd>
          <dt>Плательщик</dt><dd>${r.payerName||'—'}</dd>
          <dt>Назначение</dt><dd>${r.note||'—'}</dd>
          <dt>Счёт зачисления</dt><dd class="mono">${r.account}</dd>
        </dl></div>
      <div class="recon-mid">${recIco(REC_I.arrow)}</div>
      <div class="recon-col"><h4>Строка реестра ЦК — внешний факт</h4>
        <dl class="kv">
          <dt>Документ</dt><dd>№${reg.doc}</dd>
          <dt>Дата</dt><dd>${reg.date}</dd>
          <dt>Сумма</dt><dd${diff?' class="diff"':''}>${money(reg.amount)}</dd>
          <dt>Плательщик</dt><dd>${reg.payer}</dd>
          <dt>Назначение</dt><dd>${reg.note}</dd>
          <dt>Период</dt><dd>${reg.period}</dd>
        </dl></div></div>
    ${dup ? recBan('info', `<b>Строка пришла повторно</b> («${dup.note}»). Дубль в сопоставление не идёт.`) : ''}
    ${diff ? recBan('warn', `<b>Действует сумма ЦК.</b> У нас ${money(r.amount)}, в ЦК ${money(reg.amount)}, разница
        <b>${money(Math.abs(diff))}</b>. До корректировки платёж носит нашу сумму.
        <div class="gtoolbar" style="margin:10px 0 0">
          <button class="btn btn-sm btn-primary" onclick="recAct('correct','${r.id}')">Корректировка суммы по реестру ЦК</button>
          ${roleHint(can.correct(),'только бухгалтер')}</div>`)
      : recBan('ok', `<b>Совпало 1:1.</b> Сверка положительная — можно замораживать.`)}`;
}

/* ---- вкладка «История» ---- */
function recHistPanel(r){
  const rows = (r.hist||[]).slice().reverse();
  return `<div class="hist">${rows.map(h=>`<div class="hrow ${h.cls||''}">
      <div class="hwhen">${h.when}</div><div class="hwhat">${h.what}</div><div class="hwho">${h.who}</div></div>`).join('')}</div>`;
}

/* ============================================================
   ДЕЙСТВИЯ ЭКРАНА
   Три операции вместо одной кнопки «сторно» (ПТ-Д12):
     • сторно поступления   — денег не было; гасит ВСЕ платежи; бухгалтер;
     • корректировка суммы  — сумма неверна, по реестру ЦК;  бухгалтер;
     • перепривязка платежа — записано не тому; операция над ПЛАТЕЖОМ; куратор.
   ============================================================ */
function recAct(kind, id, arg){
  if(kind==='rebind') return recRebind(id);
  const r = DATA.receipts.find(x=>x.id===id);
  if(!r) return;

  if(kind==='reverse'){
    if(!can.reverse()) return toast('Сторно проводит бухгалтер','warn');
    if(isReversed(r))  return toast('Поступление уже сторнировано','warn');
    return recModal('Сторно поступления '+r.number,
      recBan('err', `<b>Сторно гасит все платежи поступления</b> (${paymentsOf(r).filter(p=>!p.void).length} шт.
        на ${money(recPaidSum(r))}). При восстановлении они оживут исходной датой ${r.date}.`)
      + `<div class="field req"><label class="flabel">Основание сторно</label>
          <textarea class="note-area" id="recBasis" placeholder="например: возврат банком, п/п №… не исполнено"></textarea></div>`,
      'Провести сторно', `recDo('reverse','${r.id}')`, true);
  }

  if(kind==='restore'){
    if(!can.reverse()) return toast('Восстановление проводит бухгалтер','warn');
    return recModal('Восстановление поступления '+r.number,
      recBan('ok', `<b>Поступление восстановится исходной датой ${r.date}.</b> Платежи оживут той же датой.
        Пеня за период между сторно и восстановлением будет помечена спорной.`)
      + `<div class="field req"><label class="flabel">Реквизиты позднего подтверждения ЦК</label>
          <textarea class="note-area" id="recBasis" placeholder="реестр ЦК от …, документ №…"></textarea></div>`,
      'Восстановить', `recDo('restore','${r.id}')`);
  }

  if(kind==='correct'){
    if(!can.correct()) return toast('Корректировку суммы проводит бухгалтер','warn');
    const reg = recRegOf(r).find(x=>!x.dup) || recRegOf(r)[0];
    if(!reg) return toast('Строки реестра ЦК нет — корректировать не по чему','warn');
    return recModal('Корректировка суммы '+r.number,
      recBan('warn', `Наша ${money(r.amount)} → ЦК <b>${money(reg.amount)}</b> (документ №${reg.doc} от ${reg.date}).
        Разница ${money(Math.abs(reg.amount-r.amount))} станет нераспределённой. Платежи не гасятся.`)
      + `<div class="field req"><label class="flabel">Основание корректировки</label>
          <textarea class="note-area" id="recBasis" placeholder="реестр ЦК №… от …, расхождение суммы"></textarea></div>`,
      'Привести к сумме ЦК', `recDo('correct','${r.id}')`);
  }

  if(kind==='freeze'){
    if(!can.freeze())        return toast('Заморозку ставит бухгалтер','warn');
    if(r.frozen==='frozen')  return toast('Уже заморожено','warn');
    if(isUnresolved(r))      return toast('Платежей нет — замораживать нечего','warn');
    if(r.match!=='confirmed') return toast('Заморозка — только по положительной сверке. Сейчас: '+MATCH[r.match].t,'warn');
    r.frozen = 'frozen';
    paymentsOf(r).forEach(p=>{ if(!p.void && !p.snapshot) p.snapshot = p.derived; });
    r.hist.push(hrow('Заморожено по положительной сверке. Разбивка платежей зафиксирована.','Бухгалтер · А.Иманкулова'));
    render();
    return toast('Заморожено. Разбивка платежей зафиксирована','ok');
  }

  if(kind==='unfreeze'){
    if(!can.unfreeze())   return toast('Разморозку проводит бухгалтер','warn');
    if(r.frozen!=='frozen') return toast('Поступление не заморожено','warn');
    return recModal('Разморозка поступления '+r.number,
      recBan('warn', `<b>Разморозка — только по решению комиссии.</b> Фиксация разбивки снимется,
        трактовку снова правит куратор.`)
      + `<div class="f2">
          <div class="field req"><label class="flabel">Номер решения комиссии</label><div class="control"><input id="recDecNo" placeholder="№…"></div></div>
          <div class="field req"><label class="flabel">Дата решения</label><div class="control"><input id="recDecDate" placeholder="дд.мм.гггг"></div></div>
          <div class="field col-span req"><label class="flabel">Суть решения</label>
            <textarea class="note-area" id="recBasis" placeholder="что именно разрешено пересмотреть"></textarea></div>
        </div>`,
      'Разморозить', `recDo('unfreeze','${r.id}')`, true);
  }

  if(kind==='surplus'){
    if(!can.surplus()) return toast('Режим остатка ставит куратор','warn');
    if(r.frozen==='frozen') return toast('Поступление заморожено: сначала разморозка по решению комиссии','warn');
    if(r.surplus===arg) return toast('Этот режим уже стоит');
    const from = SURPLUS[r.surplus].t, to = SURPLUS[arg].t;
    r.surplus = arg;
    if(arg!=='reserve') r.reserveRows = [];
    r.hist.push(hrow('Режим остатка сверх наступившего изменён: «'+from+'» → «'+to+'».','Куратор · Ж.Осмонова'));
    render();
    return toast('Режим остатка: '+to+'. '+SURPLUS[arg].hint,'ok');
  }

  if(kind==='bind'){
    if(!can.bind()) return toast('Привязку делает куратор','warn');
    const c = (r.candidates||[]).find(x=>x.credit===arg);
    if(!c) return toast('Кандидат не найден','warn');
    return recModal('Привязка поступления '+r.number,
      recBan('info', `Кандидат «${c.title}» (${c.borrower}). Будет создан платёж на ${money(r.amount)};
        поступление выйдет из невыясненных.`)
      + `<div class="field req"><label class="flabel">Основание привязки</label>
          <textarea class="note-area" id="recBasis" placeholder="чем подтверждается, что деньги этого заёмщика"></textarea></div>`,
      'Привязать и создать платёж', `recDo('bind','${r.id}','${arg}')`);
  }
}

/* перепривязка — операция над ПЛАТЕЖОМ (записано не тому), делает куратор */
function recRebind(pid){
  const p = DATA.payments.find(x=>x.id===pid);
  if(!p) return;
  const r = receiptOf(p);
  if(!can.bind()) return toast('Перепривязку делает куратор','warn');
  if(p.void) return toast('Платёж погашен сторно: перепривязывать нечего','warn');
  if(r && r.frozen==='frozen') return toast('Поступление заморожено: сначала разморозка по решению комиссии','warn');
  const opts = DATA.credits.map(c=>`<option value="${c.id}"${c.id===p.credit?' selected':''}>${c.title} — ${c.borrower}</option>`).join('');
  recModal('Перепривязка платежа '+p.number,
    recBan('info', `Факт поступления ${r?r.number:''} не меняется — меняется адресат платежа.
      Разбивка выведется заново по очереди погашения нового кредита.`)
    + `<div class="field req"><label class="flabel">Куда перепривязать</label>
        <div class="control"><select id="recTarget">${opts}</select>
          <span class="caret">${recIco('<path d="M6 9l6 6 6-6"/>')}</span></div></div>
       <div class="field req" style="margin-top:12px"><label class="flabel">Основание перепривязки</label>
        <textarea class="note-area" id="recBasis" placeholder="чем подтверждается новый адресат"></textarea></div>
       <div class="gtoolbar" style="margin-top:12px">
         <button class="btn btn-sm btn-tint" onclick="closeModal();openPayment('${p.id}')">Открыть карточку платежа ${p.number}</button>
       </div>`,
    'Перепривязать', `recDo('rebind','${p.id}')`);
}

/* ---- подтверждения из модалок: меняют DATA и перерисовывают ---- */
function recDo(kind, id, arg){
  const basis = recVal('recBasis');
  if(!basis) return toast('Без основания операция не проводится','warn');

  if(kind==='rebind'){
    const p = DATA.payments.find(x=>x.id===id); if(!p) return;
    const to = recVal('recTarget') || p.credit;
    const c  = creditOf(to) || {};
    const was = (creditOf(p.credit)||{}).title || p.credit;
    p.credit = to; p.tranche = (c.tranches&&c.tranches[0]) ? c.tranches[0].id : null;
    p.basis = basis;
    const r = receiptOf(p);
    if(r) r.hist.push(hrow('Перепривязка платежа '+p.number+': «'+was+'» → «'+(c.title||to)+'». Основание: '+basis+'.','Куратор · Ж.Осмонова'));
    closeModal(); render();
    return toast('Платёж '+p.number+' перепривязан','ok');
  }

  const r = DATA.receipts.find(x=>x.id===id); if(!r) return;

  if(kind==='reverse'){
    const n = paymentsOf(r).filter(p=>!p.void).length;
    paymentsOf(r).forEach(p=>{ p.void = true; });
    r.match = 'reversed'; r.frozen = 'open';
    r.hist.push(hrow('Сторно поступления. Основание: '+basis+'. Погашено платежей: '+n+'.','Бухгалтер · А.Иманкулова'));
    closeModal(); render();
    return toast('Сторно проведено: погашено платежей '+n,'ok');
  }

  if(kind==='restore'){
    paymentsOf(r).forEach(p=>{ p.void = false; });
    r.match = 'restored';
    r.hist.push(hrow('Восстановлено исходной датой '+r.date+' по позднему подтверждению ЦК: '+basis+'. Платежи ожили той же датой.','Бухгалтер · А.Иманкулова'));
    closeModal(); render();
    return toast('Поступление восстановлено исходной датой '+r.date,'ok');
  }

  if(kind==='correct'){
    const reg = recRegOf(r).find(x=>!x.dup) || recRegOf(r)[0];
    if(!reg) return toast('Строки реестра ЦК нет','warn');
    const was = r.amount;
    r.amount = reg.amount; r.match = 'confirmed';
    r.hist.push(hrow('Корректировка суммы по реестру ЦК: '+money(was)+' → '+money(reg.amount)+' (док. №'+reg.doc+'). Основание: '+basis+'. Платежи не гашены.','Бухгалтер · А.Иманкулова'));
    closeModal(); render();
    const left = unallocated(r);
    return toast('Сумма приведена к ЦК. Нераспределённое: '+money(left),
      Math.abs(left)>0.004 ? 'warn' : 'ok');
  }

  if(kind==='unfreeze'){
    const no = recVal('recDecNo'), dt = recVal('recDecDate');
    if(!no || !dt) return toast('Нужны реквизиты решения комиссии: номер и дата','warn');
    r.frozen = 'open';
    paymentsOf(r).forEach(p=>{ p.snapshot = null; });
    r.hist.push(hrow('Разморозка по решению комиссии №'+no+' от '+dt+'. '+basis+'. Фиксация разбивки снята.','Бухгалтер · А.Иманкулова'));
    closeModal(); render();
    return toast('Разморожено по решению комиссии №'+no+' от '+dt,'ok');
  }

  if(kind==='bind'){
    const c = (r.candidates||[]).find(x=>x.credit===arg);
    if(!c) return toast('Кандидат не найден','warn');
    if(!creditOf(c.credit)) DATA.credits.push({ id:c.credit, title:c.title, borrower:c.borrower, inn:'—',
      currency:'KGS', account:r.account, tranches:[], layers:[{ id:'free', name:'Свободный слой', mode:'по договору' }] });
    const seq = 9000 + DATA.payments.length;
    const key = 'AL-'+seq;
    DATA.alloc[key] = { total:r.amount, asOf:DATA.today, due:r.amount, surplusLeft:0, layers:[
      { name:'Свободный слой', mode:'по договору', sum:r.amount, articles:[
        { article:'Проценты', rows:[{ tranche:'—', urg:'over', label:'просроченные', v:r.amount }] } ] } ] };
    DATA.payments.push({ id:'P-'+seq, number:'ПЛ-'+seq, receiptId:r.id, credit:c.credit, tranche:null,
      amount:r.amount, currency:r.currency, derived:key, snapshot:null, void:false,
      kind:'Денежные средства', basis:basis,
      note:'Платёж создан опознанием невыясненного поступления '+r.number });
    r.candidates = []; r.unresolvedReason = null;
    r.hist.push(hrow('Опознано: привязано к «'+c.title+'» ('+c.borrower+'). Основание: '+basis+'. Создан платёж на '+money(r.amount)+'.','Куратор · Ж.Осмонова'));
    closeModal(); render();
    return toast('Создан платёж на '+money(r.amount)+'. Поступление вышло из невыясненных','ok');
  }
}

/* ============================================================
   VIEW: ПЛАТЕЖИ + карточка платежа (разбивка, спорная пеня, история)
   ============================================================ */
/* @@VIEW:payments@@ */
/* ------------------------------------------------------------
   ПЛАТЕЖИ — ТРАКТОВКА поступления (ADR-0056): кому и во что.
   Своих осей состояния у платежа нет — он наследует их у поступления.
   Разбивка живого платежа — динамическая, на дату среза (ADR-0001);
   у замороженного — зафиксированная, и расхождение с текущей
   показывается, а не прячется (ADR-0055, ПТ-Д9).
   Матрица: слой → статья долга → срочность; транш назван в КАЖДОЙ
   строке, потому что транш — ОБЛАСТЬ разбивки, а не уровень
   матрицы (ADR-0060, ПТ-Д3). Порядок строк задаёт срок, не номер транша.
   Закрывает: ПТ-Д3, ПТ-Д4, ПТ-Д5, ПТ-Д9, ПТ-Д14, ПТ-Д17, ПТ-Д25
   и единый язык ПТ-Д18…ПТ-Д20 (заморозка · статья долга · разбивка).
   ------------------------------------------------------------ */
let payTab = 'req';
function setPayTab(t){ payTab = t; render(); }

/* ---- локальные словари и иконки ---- */
const URG_T   = { over:'просрочено', cur:'текущее', acc:'начисленное' };
const DSP_ST  = { pending:{ t:'Ожидает решения комиссии', cls:'warn' },
                  resolved:{ t:'Решение комиссии внесено', cls:'ok' } };
const PAY_CHEV  = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const PAY_ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const PAY_INFO  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>';
const MUT = 'color:var(--text-muted)';
const PLC = 'color:var(--text-placeholder)';

/* ---- производные платежа (не хранятся — выводятся) ---- */
const payFrozen  = p => receiptOf(p).frozen === 'frozen';
/** метка транша; null означает «область разбивки — оба транша кредита» (ADR-0060) */
function payTrancheLabel(p){
  const c = creditOf(p.credit);
  if(!p.tranche) return null;
  const t = ((c && c.tranches) || []).find(x => x.id === p.tranche);
  return t ? t.label : p.tranche;
}
const payScopeTag = p => {
  const l = payTrancheLabel(p);
  return l ? `<span class="trn">${l}</span>`
           : `<span class="trn">Оба транша кредита</span>`;
};
const payScopeNote = p => p.tranche
  ? 'Счёт зачисления опознал транш.'
  : 'Транш счётом не опознан — область разбивки: оба транша кредита.';
const payWriteOffsOf = p => DATA.writeOffs.filter(w => w.credit === p.credit);
/** дата среза без пояснительного хвоста: «12.07.2026 (зафиксирована)» → «12.07.2026» */
const payAsOfDate = s => s == null ? '' : String(s).split(' (')[0];

/* ============================================================
   ЛЕНТА ПЛАТЕЖЕЙ
   ============================================================ */
function viewPayments(){
  const s = feedSlice('pay');

  return `<div class="page-pad">
    ${feedBar('pay')}

    <!-- Формат реестра кредитов (§Р-19): фиксированные ширины, ↕ у каждой колонки,
         подстрочник .sub вместо отдельной колонки. Слитые пары:
           Заёмщик = имя над «кредит · область разбивки»
           Платёж  = номер над датой факта (дата — из поступления, ADR-0056)
           Сумма   = сумма долга над пришедшими сомами (валютный платёж)
           Разбивка = вид разбивки над датой среза -->
    <div class="grid-wrap"><table class="grid" data-t="pay" style="min-width:1300px">
      <colgroup>
        <col style="width:260px"><col style="width:190px"><col style="width:150px">
        <col style="width:200px"><col style="width:330px"><col style="width:170px">
      </colgroup>
      <thead><tr>
        ${gth('pay','borrower','Заёмщик')}${gth('pay','number','Платёж')}${gth('pay','amount','Сумма','r')}
        ${gth('pay','alloc','Разбивка платежа')}${gth('pay','axes','Оси состояния')}${gth('pay','receipt','Из поступления')}
      </tr></thead>
      <tbody id="pay-body">${payRowsHtml(s.page)}</tbody>
      <tfoot><tr>
        <td colspan="2" class="lbl">Итого по выборке</td>
        <td class="r num" id="pay-total">${payTotalHtml(s.hits)}</td>
        <td colspan="3"></td>
      </tr></tfoot>
    </table></div>
    ${feedPagerHtml(s)}
  </div>`;
}

/* ---- строка ленты платежей ---- */
function payRow(p){
  const r = receiptOf(p), c = creditOf(p.credit), d = snapshotDrift(p);
  const a = allocOf(p.snapshot || p.derived);   // у замороженного дата среза — дата фиксации
  const alloc = p.snapshot
    ? pill({ t:'Зафиксированная', cls:'neutral' }) + (d ? ' ' + pill({ t:'Разошлась с текущей', cls:'warn' }) : '')
    : pill({ t:'Динамическая', cls:'info' });
  const scope = payTrancheLabel(p) || 'Оба транша кредита';
  return `<tr class="${p.void?'muted':''}" onclick="openPayment('${p.id}')">
    <td title="${esc(c.borrower)} · ${esc(c.title)} · ${esc(scope)}"><span class="cell-name">${c.borrower}</span
      ><span class="sub">${c.title} · ${scope}</span></td>
    <td><span class="mono">${p.number}</span>${p.void?' '+pill({t:'Сторнирован',cls:'err'}):''}<span class="sub">${r.date}</span></td>
    <td class="r num">${cur(p.amount, p.currency)}${p.paidKGS?`<span class="sub">${money(p.paidKGS)} сом</span>`:''}</td>
    <td>${alloc}<span class="sub">${a ? ('на ' + payAsOfDate(a.asOf)) : '—'}</span></td>
    <td>${axes(r)}</td>
    <td><span class="rowlink" onclick="event.stopPropagation();openReceipt('${r.id}')">${r.number}</span></td>
  </tr>`;
}
const PAY_COLS = 6;
const payRowsHtml = list => list.length ? list.map(payRow).join('')
  : `<tr><td colspan="${PAY_COLS}"><div class="grid-empty">${
      feedActive(FEEDS.pay).length ? 'Ничего не найдено по фильтрам' : 'Платежей в выборке нет'}</div></td></tr>`;
/* Итог по видимой выборке за вычетом сторнированных: их сумма снята, складывать её
   с живыми деньгами нельзя. Живёт в подвале таблицы, в колонке «Сумма». */
const payTotalHtml = hits =>
  `${money(hits.filter(p=>!p.void).reduce((s,p)=>s+paidOf(p), 0))} сом`;

/* Условия ленты платежей. Платёж своих осей и своей даты не имеет — он наследует их
   у поступления (ADR-0056), поэтому «Дата факта» и «Период» читаются через receiptOf(). */
const PAY_CONDS = [
  /* Одно поле на несколько токенов, включая плательщика поступления: по «Бек» находятся
     и три платежа, расщеплённые из сводной строки «ОсОО «Бек Кабель» и др.». Это не
     ложное совпадение — платежи действительно пришли одной суммой от этого плательщика. */
  { key:'q', kind:'text', zone:'quick', label:'Поиск', width:360,
    ph:'Номер платежа, заёмщик, № договора, поступление',
    test:(p,v)=>{ const r = receiptOf(p), c = creditOf(p.credit);
      return (`${p.number} ${c.borrower} ${c.inn} ${c.title} ${r.number} ${r.payerName||''}`).toLowerCase().includes(v); } },
  /* Заёмщика отдельным селектом не держим: он уже входит в поле поиска выше —
     два входа в одну величину дают выборку, которую пользователь не может прочитать
     по чипам. В быстрой зоне вместо него стоит период — измерение, поиском не берущееся. */
  { key:'period', kind:'select', zone:'quick', label:'Период', width:230,
    options:()=>DATA.periods.map(x=>({ v:x.id, t:x.label })), test:(p,v)=>receiptOf(p).period===v },
  { key:'kind', kind:'select', zone:'quick', label:'Вид платежа', width:200,
    options:()=>uniqv(DATA.payments.map(p=>p.kind)), test:(p,v)=>p.kind===v },
  /* Каскад «кредит → транш» — одно условие на двух селектах, как Область→Район в
     реестре кредитов. Платёж без транша (область разбивки — весь кредит, ADR-0060)
     под условие транша не попадает: сужайте по кредиту. */
  { key:'scope', kind:'pair', label:'Кредит / транш',
    options:()=>DATA.credits.map(c=>({ v:c.id, t:c.title })),
    optionsB:(cid)=>(cid ? [creditOf(cid)].filter(Boolean) : DATA.credits)
      .flatMap(c=>(c.tranches||[]).map(t=>({ v:t.id, t: cid ? t.label : `${t.label} · ${c.title}` }))),
    test:(p,v)=>(!v.a || p.credit===v.a) && (!v.b || p.tranche===v.b) },
  { key:'currency', kind:'select', label:'Валюта',
    options:()=>uniqv(DATA.payments.map(p=>p.currency)), test:(p,v)=>p.currency===v },
  { key:'alloc', kind:'select', label:'Разбивка',
    options:()=>[{ v:'live', t:'Динамическая' }, { v:'snap', t:'Зафиксированная' },
                 { v:'drift', t:'Разошлась с текущей' }],
    test:(p,v)=>v==='live' ? !p.snapshot : v==='snap' ? !!p.snapshot : !!snapshotDrift(p) },
  { key:'date', kind:'range', input:'date', label:'Дата факта',
    test:(p,v)=>{ const iso = toISO(receiptOf(p).date);
      return !(v.from && (!iso || iso < v.from)) && !(v.to && (!iso || iso > v.to)); } },
  { key:'amount', kind:'range', input:'number', label:'Сумма платежа',
    test:(p,v)=>!(v.from!=='' && p.amount < +v.from) && !(v.to!=='' && p.amount > +v.to) },
];

/* Сортеры ленты платежей — по той же величине, что стоит в ячейке.
   Дата в колонке «Платёж» — подстрочник, сортируется колонка по номеру (как «Договор»
   в реестре кредитов); дата как измерение выборки закрыта условием «Дата факта».
   Сумма сортируется по пришедшим деньгам (paidOf), а не по величине долга: в ленте
   лежат платежи в разных валютах, и 1 000 USD не должна вставать ниже 42 600 сом. */
defFeed('pay', {
  conds: PAY_CONDS,
  sorters: {
    borrower: p => creditOf(p.credit).borrower,
    number:   p => p.number,
    amount:   p => paidOf(p),
    alloc:    p => !p.snapshot ? 0 : snapshotDrift(p) ? 2 : 1,
    axes:     p => { const r = receiptOf(p);
                     return `${MATCH[r.match].t} ${FRZ[r.frozen].t} ${CHAN[r.channel].t}`; },
    receipt:  p => receiptOf(p).number,
  },
  base: () => DATA.payments,
  paint: s => {
    const b = document.getElementById('pay-body'); if(b) b.innerHTML = payRowsHtml(s.page);
    const t = document.getElementById('pay-total'); if(t) t.innerHTML = payTotalHtml(s.hits);
  },
});

/* ============================================================
   КАРТОЧКА ПЛАТЕЖА
   ============================================================ */
function paymentDetail(p){
  const r = receiptOf(p), c = creditOf(p.credit);
  const a = allocOf(p.derived), d = snapshotDrift(p);
  const dsp = r.dispute;

  const snapA = p.snapshot ? allocOf(p.snapshot) : null;
  const allocPill = p.snapshot ? pill({ t:'Зафиксированная', cls:'neutral' }) : pill({ t:'Динамическая', cls:'info' });
  const allocDate = payAsOfDate((snapA || a || {}).asOf);
  const allocSrc  = p.snapshot
    ? 'Зафиксирована на дату заморозки.'
      + (d ? ' Текущий вывод на ' + payAsOfDate(a.asOf) + ' отличается — расхождение во вкладке «Разбивка».' : '')
    : 'Выводится заново на дату среза.';

  const tab = (id, label, mark) =>
    `<button class="dtab ${payTab===id?'active':''}" onclick="setPayTab('${id}')">${label}${mark||''}</button>`;

  return `<div class="page-pad">
    <div class="gtoolbar">
      <button class="btn btn-secondary btn-sm" onclick="back()">← К ленте платежей</button>
      <span class="spacer"></span>
      <button class="btn btn-tint btn-sm" onclick="openReceipt('${r.id}')">Открыть поступление ${r.number}</button>
    </div>

    <div class="phead">
      <div class="phead-top">
        <div>
          <div class="phead-name">
            <span class="nm">${p.number}</span>
            <span class="amt num">${cur(p.amount, p.currency)}</span>
            ${p.void ? pill({t:'Сторнирован — снято сторно', cls:'err'}) : ''}
            ${d ? pill({t:'Разбивка разошлась с текущей', cls:'warn'}) : ''}
          </div>
          <div class="phead-sub">${c.borrower} · <b>${c.title}</b> · ${payScopeTag(p)} ·
            поступление <span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span> от <b>${r.date}</b>
            · период учёта <b>${r.period}</b></div>
        </div>
      </div>
      <div class="phead-dims">
        <div class="dim">
          <div class="dl">Оси состояния — наследованы</div>
          <div class="dv">${axes(r)}</div>
          <div class="src">Наследованы у поступления ${r.number}.</div>
        </div>
        <div class="dim">
          <div class="dl">Разбивка платежа</div>
          <div class="dv">${allocPill}<span class="num" style="${MUT}">на ${allocDate || '—'}</span></div>
          <div class="src">${allocSrc}</div>
        </div>
        <div class="dim">
          <div class="dl">Область разбивки</div>
          <div class="dv">${payScopeTag(p)}</div>
          <div class="src">${payScopeNote(p)}</div>
        </div>
      </div>
    </div>

    <div class="detail-tabbar">
      ${tab('req','Реквизиты')}
      ${tab('alloc','Разбивка', d ? ' <span class="urg over" style="margin-left:6px">расхождение</span>' : '')}
      ${tab('dispute','Спорная пеня', dsp ? ' <span class="urg acc" style="margin-left:6px">спор</span>' : '')}
      ${tab('hist','История')}
    </div>

    <div class="dpanel ${payTab==='req'?'active':''}">${payPanelReq(p)}</div>
    <div class="dpanel ${payTab==='alloc'?'active':''}">${payPanelAlloc(p)}</div>
    <div class="dpanel ${payTab==='dispute'?'active':''}">${payPanelDispute(p)}</div>
    <div class="dpanel ${payTab==='hist'?'active':''}">${payPanelHist(p)}</div>
  </div>`;
}

/* ---------- вкладка: РЕКВИЗИТЫ ---------- */
function payPanelReq(p){
  const r = receiptOf(p), c = creditOf(p.credit);
  const per = DATA.periods.find(x => x.id === r.period) || { state:'open', label:r.period };

  const warn = p.void
    ? `<div class="banner err">${PAY_INFO}<div><b>Платёж погашен сторно поступления.</b> Сумма снята сторно.</div></div>`
    : r.match === 'mismatch'
      ? `<div class="banner warn">${PAY_INFO}<div><b>Расхождение с реестром ЦК.</b>
          До корректировки платёж носит нашу сумму.</div></div>`
      : '';

  return `${warn}
  <div class="recon-split">
    <div class="recon-col">
      <h4>Поступление — факт денег</h4>
      <dl class="kv">
        <dt>Поступление</dt><dd><span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span></dd>
        <dt>Дата</dt><dd class="num">${r.date}<div style="${MUT};font-weight:400">дата фактического поступления</div></dd>
        <dt>Сумма поступления</dt><dd class="num">${cur(r.amount, r.currency)}</dd>
        <dt>Канал</dt><dd>${pill(CHAN[r.channel])}</dd>
        <dt>Счёт зачисления</dt><dd><span class="mono">${r.account}</span><div style="${MUT};font-weight:400">${r.accountObject}</div></dd>
        <dt>Плательщик</dt><dd>${r.payerName}</dd>
        <dt>Примечание документа</dt><dd>${r.note || '—'}</dd>
        <dt>Период учёта</dt><dd>${per.label || r.period} ${pill(PSTATE[per.state])}</dd>
      </dl>
    </div>
    <div class="recon-mid">${PAY_ARROW}</div>
    <div class="recon-col">
      <h4>Платёж — трактовка</h4>
      <dl class="kv">
        <dt>Платёж</dt><dd><span class="mono">${p.number}</span></dd>
        <dt>Сумма платежа</dt><dd class="num">${cur(p.amount, p.currency)}</dd>
        <dt>Кредит</dt><dd>${c.title}<div style="${MUT};font-weight:400">${c.borrower} · ИНН ${c.inn}</div></dd>
        <dt>Транш</dt><dd>${payScopeTag(p)}<div style="${MUT};font-weight:400">${payScopeNote(p)}</div></dd>
        <dt>Вид погашения</dt><dd>${p.kind}</dd>
        <dt>Основание привязки</dt><dd>${p.basis}</dd>
        <dt>Примечание</dt><dd>${p.note || '—'}</dd>
      </dl>
    </div>
  </div>
  ${payRateBlock(p)}`;
}

/* ---------- курс НБ КР: производная, а не реквизит платежа (ПТ-Д4, ADR-0061) ---------- */
function payRateBlock(p){
  if(p.currency === 'KGS' && p.paidKGS == null) return '';
  const r = receiptOf(p);
  const rate = rateOn(p.currency, p.rateDate);
  const eq   = kgsEquiv(p);
  const other = Object.keys((DATA.rates[p.currency] || {})).filter(dt => dt !== p.rateDate);
  const okEq = eq != null && p.paidKGS != null && Math.abs(eq - p.paidKGS) < 0.01;

  return `<div class="section-h" style="font-size:16px;margin-top:24px">Валюта долга и сомовый эквивалент</div>
  <div class="inv">
    <span class="iv">Сумма в валюте долга: <b>${cur(p.amount, p.currency)}</b></span>
    <span class="iv">Пришло в сомах: <b>${money(p.paidKGS)}</b></span>
    <span class="iv">Курс НБ КР: <b>${rate == null ? '—' : money(rate)}</b> на <b>${p.rateDate}</b></span>
    <span class="iv ${okEq ? '' : 'bad'}">Проверка: ${cur(p.amount, p.currency)} × ${money(rate)} = <b>${money(eq)} сом</b></span>
  </div>
  <p class="section-note">Курс из справочника НБ КР на дату поступления ${r.date}.
    ${other.length ? 'На другие даты справочника: ' + other.map(dt => money(rateOn(p.currency, dt)) + ' на ' + dt).join('; ') + '.' : ''}</p>`;
}

/* ---------- вкладка: РАЗБИВКА ---------- */
function payPanelAlloc(p){
  const a = allocOf(p.derived);
  const r = receiptOf(p);
  const mode = (a && a.surplusMode) || r.surplus;
  const cy = a && a.currency;
  const mc = v => cur(v, cy);
  const invBad = a && Math.abs((a.due + a.surplusLeft) - a.total) > 0.01;

  const invBar = !a ? '' : `<div class="inv">
    <span class="iv">Вывод на дату: <b>${a.asOf}</b></span>
    <span class="iv">Всего в разбивке: <b>${mc(a.total)}</b></span>
    <span class="iv">Наступившее на дату: <b>${mc(a.due)}</b></span>
    <span class="iv ${invBad ? 'bad' : ''}">Остаток сверх наступившего: <b>${mc(a.surplusLeft)}</b></span>
    ${a.surplusLeft ? '<span class="iv">Режим остатка: ' + pill(SURPLUS[mode]) + ' <span style="' + MUT + '">' + SURPLUS[mode].hint + '</span></span>' : ''}
  </div>`;

  const reserve = (a && a.surplusLeft && mode === 'reserve' && r.reserveRows)
    ? `<p class="section-note"><b>Адресный резерв закреплён за строками графика:</b>
        ${r.reserveRows.map(x => x.article + ' от ' + x.due + ' — ' + money(x.amount)).join(' · ')}.</p>`
    : '';

  return `${invBar}${reserve}${payOrderingBlock(a)}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start;margin-top:14px">
      <div>
        ${payMatrix(a, p)}
        ${payOverdueByLayer(a)}
      </div>
      ${payQueueBlock(p)}
    </div>
    ${payDriftBlock(p)}
    ${payWriteOffBlock(p)}
    ${payAdjustBlock(p)}`;
}

/* источник очерёдности статей и исключённые статьи (ПТ-Д6, ADR-0059) */
function payOrderingBlock(a){
  const o = a && a.ordering;
  if(!o) return '';
  const exc = (o.excluded||[]).map(x=>`<div class="grow">
      <span class="gkind">${x.article} — исключённая статья</span>
      <span class="gwhat">${x.why}</span>
      <span class="gid" style="cursor:default">приоритет 0</span></div>`).join('');
  return `<div class="gate" style="margin-top:12px">
    <div class="grow">
      <span class="gkind">Источник очерёдности</span>
      <span class="gwhat">${o.note}</span>
      <span class="gid" style="cursor:default">${pill(ORDERING[o.source])}</span>
    </div>${exc}
  </div>`;
}

/* матрица слой → статья долга → срочность; транш — в каждой строке (ПТ-Д3) */
function payMatrix(a, p){
  if(!a) return `<div class="banner warn">${PAY_INFO}<div>Разбивка не выведена.</div></div>`;
  if(!a.layers.length) return `<div class="banner err">${PAY_INFO}<div><b>Разносить нечего:</b> сумма платежа
    снята сторно ${payAsOfDate(a.asOf)}.</div></div>`;
  const cy = a.currency;
  return `<div class="matrix">${a.layers.map(L => `
    <div class="mx-layer open">
      <div class="mx-layer-h" onclick="this.parentNode.classList.toggle('open')">
        <span class="chev">${PAY_CHEV}</span>
        <div><div class="ml-title">${L.name}</div><div class="ml-mode">${L.mode}</div></div>
        <span class="ml-sum">${cur(L.sum, cy)}</span>
      </div>
      <div class="mx-body">
        <table class="mxg">
          <thead><tr><th>Статья долга</th><th>Транш — область</th><th>Срочность</th><th class="r">Сумма</th></tr></thead>
          <tbody>${L.articles.map(A => A.rows.map(row => `<tr>
            <td>${A.article}<div style="${MUT};font-size:12px">${row.label}</div></td>
            <td><span class="trn">${row.tranche}</span></td>
            <td><span class="urg ${row.urg}">${URG_T[row.urg] || row.urg}</span></td>
            <td class="r">${cur(row.v, cy)}</td></tr>`).join('')).join('')}</tbody>
        </table>
      </div>
    </div>`).join('')}</div>`;
}

/* просрочка — по слоям и статьям долга, а не одним числом «дней» (ПТ-Д17) */
function payOverdueByLayer(a){
  if(!a || !a.layers.length) return '';
  const groups = a.layers.map(L => ({
    name: L.name,
    items: L.articles.map(A => {
      const over = A.rows.filter(row => row.urg === 'over');
      return over.length ? A.article + ' (' + over.map(row => row.tranche + ' · ' + row.label).join('; ') + ')' : null;
    }).filter(Boolean)
  })).filter(g => g.items.length);

  if(!groups.length) return `<p class="section-note" style="margin-top:12px">Просроченных строк в этой разбивке нет.</p>`;

  return `<div class="section-h" style="font-size:16px;margin-top:20px">Что именно просрочено</div>
  <div class="gate">${groups.map(g => `<div class="grow">
      <span class="gkind">${g.name}</span>
      <span class="gwhat">просрочены статьи долга: ${g.items.join(' · ')}</span>
    </div>`).join('')}</div>`;
}

/* область разбивки: очередь погашения публикует КРЕДИТ (ПТ-Д5, ADR-0060) */
function payQueueBlock(p){
  const c = creditOf(p.credit), q = DATA.queue[p.credit];
  const h = `<h4>Область разбивки — очередь погашения</h4>`;

  if(!q) return `<div class="recon-col">${h}
    <div style="padding:14px"><p class="section-note" style="margin:0">Очередь погашения по кредиту <b>${c.title}</b>
      не опубликована.</p></div></div>`;

  const row = x => {
    const ln = ((c.layers || []).find(l => l.id === x.layer) || {}).name || x.layer;
    const tn = ((c.tranches || []).find(t => t.id === x.tranche) || {}).label || x.tranche;
    return `<tr style="${x.future ? PLC : ''}">
      <td class="num">${x.due}<div>${x.future ? '' : '<span class="urg ' + x.urg + '">' + (URG_T[x.urg] || x.urg) + '</span>'}</div></td>
      <td>${ln}<div><span class="trn">${tn}</span></div></td>
      <td>${x.article}${x.future ? '<div style="font-size:12px">не наступило</div>' : ''}</td>
      <td class="r">${money(x.amount)}</td></tr>`;
  };

  return `<div class="recon-col">${h}
    <div style="padding:10px 14px;border-bottom:1px solid var(--asubk-grid-line)">
      <span class="src-tag">непогашенное на ${q.asOf}</span></div>
    <table class="mxg">
      <thead><tr><th>Срок</th><th>Слой · транш</th><th>Статья долга</th><th class="r">Сумма</th></tr></thead>
      <tbody>${q.rows.map(row).join('')}</tbody>
    </table>
    <div style="padding:12px 14px">
      <div class="legend" style="margin:0">
        <span>Обычные строки — <b>наступившее</b> на дату</span>
        <span style="${PLC}">Серые строки — <b>не наступило</b></span>
      </div>
    </div></div>`;
}

/* зафиксированная разбивка против текущей (ПТ-Д9, ADR-0055 поверх ADR-0001) */
function payDriftBlock(p){
  const d = snapshotDrift(p);
  const H = `<div class="section-h" style="font-size:16px;margin-top:24px">Зафиксированная и текущая разбивка</div>`;

  if(!p.snapshot) return `${H}
    <div class="banner info">${PAY_INFO}<div><b>Разбивка динамическая.</b> Платёж не заморожен —
      зафиксированной разбивки нет.</div></div>`;

  if(!d) return `${H}
    <div class="banner ok">${PAY_INFO}<div><b>Разбивка зафиксирована на дату заморозки.</b>
      Текущая от неё не отличается.</div></div>`;

  const snap = allocOf(p.snapshot), live = allocOf(p.derived);
  return `${H}
  <div class="banner warn">${PAY_INFO}<div><b>Зафиксированная и текущая разбивка разошлись.</b></div></div>
  <div class="drift">
    <div class="dcol snap">
      <div class="dhead">Зафиксирована на заморозке · ${payAsOfDate(snap.asOf)} · ${money(d.snapTotal)}</div>
      ${payAllocCompact(snap)}
    </div>
    <div class="dcol live">
      <div class="dhead">Текущая разбивка · ${payAsOfDate(live.asOf)} · ${money(d.liveTotal)}</div>
      ${payAllocCompact(live)}
    </div>
  </div>
  <p class="section-note" style="margin-top:12px"><b>Причина расхождения.</b> ${d.reason}</p>
  <p class="section-note">Сумма платежа не изменилась (${money(d.snapTotal)}) — изменился состав слоёв.
    Закрыть расхождение по существу можно только разморозкой по решению комиссии.</p>`;
}

/* компактный вид разбивки для колонок расхождения */
function payAllocCompact(a){
  const cy = a.currency;
  return `<table class="mxg">
    <thead><tr><th>Слой · статья долга</th><th>Транш</th><th class="r">Сумма</th></tr></thead>
    <tbody>${a.layers.map(L => L.articles.map(A => A.rows.map(row => `<tr>
      <td>${L.name}<div style="${MUT};font-size:12px">${A.article} · ${row.label}</div></td>
      <td><span class="trn">${row.tranche}</span></td>
      <td class="r">${cur(row.v, cy)}</td></tr>`).join('')).join('')).join('')}</tbody>
  </table>`;
}

/* списание уменьшает НАЧИСЛЕННОЕ и погашением не является (ПТ-Д25, ADR-0076) */
function payWriteOffBlock(p){
  const w = payWriteOffsOf(p);
  if(!w.length) return '';
  const c = creditOf(p.credit);
  return `<div class="section-h" style="font-size:16px;margin-top:24px">Списания по кредиту</div>
  <div class="gate">${w.map(x => {
    const ln = ((c.layers || []).find(l => l.id === x.layer) || {}).name || x.layer;
    return `<div class="grow">
      <span class="gkind">Списание — уменьшение начисленного</span>
      <span class="gwhat">${money(x.amount)} · статья долга: <b>${x.article}</b> · ${ln} · ${x.date} ·
        основание: ${x.basis} · владелец операции: <b>${x.owner}</b></span>
      <span class="gid" onclick="payOpenWriteOff('${x.id}')">${x.id} →</span></div>`;
  }).join('')}</div>
  <p class="section-note" style="margin-top:10px">В сумму погашенного по платежу списание не входит
    и в матрицу разбивки не попадает.</p>`;
}

/* ручная поправка — вводимая директива ВНУТРИ вывода, а не отмена вывода */
function payAdjustBlock(p){
  const frozen = payFrozen(p);
  return `<div class="section-h" style="font-size:16px;margin-top:24px">Ручная поправка к разбивке</div>
  <div class="gtoolbar">
    <button class="btn btn-secondary btn-sm" onclick="payAdjust('${p.id}')">Внести поправку к разбивке</button>
    ${roleHint(can.allocate(), 'вносит куратор')}
    ${frozen ? roleHint(false, 'платёж заморожен') : ''}
  </div>
  <p class="section-note">Основание поправки обязательно.
    ${frozen ? '<b>На замороженном платеже поправка запрещена:</b> сначала разморозка по решению комиссии.' : ''}</p>`;
}

/* ---------- вкладка: СПОРНАЯ ПЕНЯ (ПТ-Д14) ---------- */
function payPanelDispute(p){
  const r = receiptOf(p), dsp = r.dispute;

  if(!dsp) return `<div class="banner info">${PAY_INFO}<div><b>Спорной пени по этому платежу нет.</b></div></div>`;

  const iv = payDisputeSpan(r);
  const last = iv.list[iv.list.length - 1];
  const open = last && !last.to;
  const st = DSP_ST[dsp.status] || DSP_ST.pending;

  const timeline = `<div class="timeline">
    <div class="tl-step"><span class="tl-dot done">1</span>
      <span class="tl-lbl">Сторно ${iv.list.map(x => x.from).join(', ')}</span></div>
    <span class="tl-arrow">${PAY_ARROW}</span>
    <div class="tl-step"><span class="tl-dot ${open ? 'todo' : 'done'}">2</span>
      <span class="tl-lbl ${open ? 'todo' : ''}">${open ? 'Восстановление не наступило — интервал открыт по ' + DATA.today : 'Восстановление ' + iv.list.map(x => x.to).filter(Boolean).join(', ')}</span></div>
    <span class="tl-arrow">${PAY_ARROW}</span>
    <div class="tl-step"><span class="tl-dot cur">=</span>
      <span class="tl-lbl"><b>Период спора:</b> ${iv.list.map(x => x.from + ' — ' + (x.to || DATA.today + ' (открыт)')).join(' · ')}, итого ${iv.days} дн.</span></div>
  </div>`;

/** период спора: интервалы «сторно → восстановление» из истории, с объединением пересечений */
function payDisputeSpan(r){
  const D = s => { const a = String(s).split('.'); return new Date(+a[2], +a[1] - 1, +a[0]); };
  const day = s => String(s).split(' ')[0];
  const revs = r.hist.filter(h => h.cls === 'rev').map(h => day(h.when));
  const ress = r.hist.filter(h => h.cls === 'res').map(h => day(h.when));
  const raw = revs.map((from, i) => ({ from, to: ress[i] || null }))
                  .sort((x, y) => D(x.from) - D(y.from));
  const list = [];
  raw.forEach(x => {
    const prev = list[list.length - 1];
    if(prev && D(x.from) <= D(prev.to || DATA.today)){
      if(D(x.to || DATA.today) > D(prev.to || DATA.today)) prev.to = x.to;   // интервалы слились
    } else list.push({ from:x.from, to:x.to });
  });
  const days = list.reduce((s, x) => s + Math.round((D(x.to || DATA.today) - D(x.from)) / 86400000), 0);
  return { list, days };
}

/* ------------------------------------------------------------
   ВОЗВРАТ — третья денежная сущность (ADR-0056): деньги, уходящие НАРУЖУ.
   В Σ платежей поступления возврат не входит; инвариант поступления:
   сумма = Σ платежей + возврат + нераспределённое.

   Экран держит два тезиса:
   • ПТ-Д2  — получатель бывает третьим лицом и из кредита НЕ выводится.
   • ПТ-Д26 / ПТ-29 — у возврата ТРИ РАЗНЫЕ функции, а не три согласования:
     основание (человек · куратор) → допустимость (ВЫВОД, подписи нет) →
     исполнение (человек · бухгалтер).
   ------------------------------------------------------------ */

/* получатель — реквизит возврата, а не производная кредита (ПТ-Д2) */
const retIsThirdParty = v => /трет/i.test(v.recipient.kind);

/* Сортеры ленты возвратов. Состояние сортируется по порядку жизни возврата
   (черновик → основание → недопустим → исполнен), а не по алфавиту подписи:
   алфавит здесь ничего не значит, порядок стадий — значит. */
const RET_ORDER = Object.keys(RET_STATE);
const RET_SORTERS = {
  id:        v => v.id,
  receipt:   v => (receiptOf(v)||{}).number || '',
  amount:    v => v.amount,
  recipient: v => v.recipient.name,
  third:     v => retIsThirdParty(v) ? 1 : 0,
  state:     v => RET_ORDER.indexOf(v.state),
  basis:     v => v.basis || '',
  exec:      v => v.execBy || '',
};

/* заёмщик по поступлению выводится из живых платежей; чужие деньги заёмщика не имеют */
function retBorrowers(v){
  const r = receiptOf(v); if(!r) return [];
  return [...new Set(paymentsOf(r).filter(p=>!p.void).map(p=>(creditOf(p.credit)||{}).borrower).filter(Boolean))];
}
const retOwnerless    = v => retBorrowers(v).length===0;                 // заёмщика нет → деньги чужие
const retBasisAllowed = v => retOwnerless(v) ? can.ownerless() : can.returnBasis();
const retBasisWho     = v => retOwnerless(v)
  ? 'основание кладёт бухгалтер'
  : 'основание кладёт куратор';

/* разбивка поступления — чтобы показать, из чего возврат вырос */
function retAlloc(r){
  const p = (r? paymentsOf(r).filter(x=>!x.void) : [])[0];
  if(!p) return null;
  const a = allocOf(p.snapshot || p.derived);
  return a ? { p, a } : null;
}

/** Итог по видимой выборке подвалом таблицы: Σ стоит в СВОЕЙ колонке «Сумма», средняя
    ячейка держит само равенство. Три величины разной природы — «деньги ушли», «ещё не
    ушли», «не уйдут, пока не изменится состояние долга» — тремя несвязанными числами
    не читаются. Считается по всей выборке, а не по странице: это итог ленты. */
function retFoot(list){
  const sum  = a => +a.reduce((s,v)=>s+v.amount,0).toFixed(2);
  const done = list.filter(v=>v.state==='executed');
  const wait = list.filter(v=>v.state!=='executed');
  const blk  = list.filter(v=>v.state==='blocked');
  return `<tr>
    <td colspan="2" class="lbl">Итого по выборке<span class="sub">${list.length} возвр.</span></td>
    <td class="r num">${money(sum(list))}</td>
    <td colspan="5" class="lbl">= исполнено ${money(sum(done))} + ждут исполнения ${money(sum(wait))}${
      blk.length ? ` · из них недопустимы ${money(sum(blk))}` : ''}</td></tr>`;
}

/* Условия ленты возвратов. Осей поступления возврат не наследует — у него их нет вовсе

      <div class="dim">
