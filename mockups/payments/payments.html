/* --- ТРИ ФУНКЦИИ (главный визуальный акцент экрана, ПТ-Д26 / ПТ-29) --- */
function retTimeline(v){
  const adm = v.admissibility;
  const arrow = `<span class="tl-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>`;
  const step = (dot, cls, lbl, sub) => `<div class="tl-step">
      <span class="tl-dot ${cls}">${dot}</span>
      <span class="tl-lbl${cls==='todo'?' todo':''}"><b>${lbl}</b><br><span class="src-tag">${sub}</span></span>
    </div>`;

  const s1 = v.basis
    ? step('✓','done','1 · Основание — человек', `${v.basisBy} · ${retBasisWho(v)}`)
    : step('1','cur','1 · Основание — человек', retBasisWho(v));
  const s2 = adm.ok
    ? step('✓','done','2 · Допустимость — вывод', `проверено на ${adm.checked}; согласующего нет`)
    : step('!','todo','2 · Допустимость — вывод', `препятствий ${adm.blockers.length}; это не отказ человека`);
  const s3 = v.state==='executed'
    ? step('✓','done','3 · Исполнение — человек', `${v.execBy} · ${v.execAt}`)
    : step('3', adm.ok && v.basis ? 'cur' : 'todo', '3 · Исполнение — человек', 'бухгалтер, по реквизитам получателя');

  return `<div class="section-h" style="margin-top:22px">Три функции возврата — не три согласования</div>
    <div class="section-note">Средний шаг подписи <b>не несёт</b>: допустимость выводится из состояния долга,
      человек её не даёт и не снимает. Крайние шаги — наоборот, чисто человеческие: основание кладёт куратор
      (у чужих денег — бухгалтер), исполняет бухгалтер. Граница ролей проходит здесь же, где и везде в модуле:
      трактовка — куратор, факт денег — бухгалтер.</div>
    <div class="timeline">${s1}${arrow}${s2}${arrow}${s3}</div>`;
}

/* --- ПОЛУЧАТЕЛЬ (ПТ-Д2) --- */
function retRecipientBlock(v){
  const r = receiptOf(v);
  const third = retIsThirdParty(v);
  const borrowers = retBorrowers(v);
  const why = third
    ? `Получатель <b>не равен заёмщику</b> и из кредита не выводится. Деньги пришли от залогодателя —
       третьего лица; в погашение ушла только наша часть, а доля залогодателя (ADR-0054)
       <b>вообще не наши деньги</b>: она не участвовала в разнесении и ни одной статьи долга не коснулась.
       Заёмщик по этому поступлению — ${borrowers.join(', ') || '—'}, и к получателю он отношения не имеет.`
    : `Здесь получатель совпал с заёмщиком (${borrowers.join(', ') || '—'}), но это <b>совпадение случая, а не правило</b>:
       поле заполняется из основания, а не выводится из кредита. Тот же экран обслуживает возврат третьему лицу
       и возврат плательщику чужих денег.`;

  return `<div class="section-h" style="margin-top:24px">Получатель</div>
    <div class="section-note">Реквизит возврата, а не производная кредита (ПТ-Д2).</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Куда уходят деньги ${pill(third ? {t:'Третье лицо', cls:'purple'} : {t:'Заёмщик', cls:'neutral'})}</h4>
      <dl class="kv">
        <dt>Наименование</dt><dd>${v.recipient.name}</dd>
        <dt>Вид получателя</dt><dd>${v.recipient.kind}</dd>
        <dt>Реквизиты</dt><dd class="mono">${v.recipient.requisites}</dd>
        <dt>Сумма к выплате</dt><dd class="mono">${cur(v.amount, v.currency)}</dd>
        <dt>Плательщик по поступлению</dt><dd>${r ? r.payerName : '—'}</dd>
        <dt>Заёмщик по поступлению</dt><dd>${borrowers.join(', ') || '<i>заёмщика нет — деньги чужие</i>'}</dd>
      </dl>
    </div>
    <div class="banner ${third?'info':'warn'}" style="margin-top:12px">${RET_ICO_I}<div>${why}</div></div>`;
}

/* --- ОСНОВАНИЕ (функция человека) --- */
function retBasisBlock(v){
  const allowed = retBasisAllowed(v);
  return `<div class="section-h" style="margin-top:24px">1 · Основание — кладёт человек</div>
    <div class="section-note">${retOwnerless(v)
      ? 'У этих денег заёмщика нет, заявление брать не с кого: основание кладёт <b>бухгалтер</b> (<code>can.ownerless()</code>).'
      : 'Основание держит <b>куратор</b> (<code>can.returnBasis()</code>) — обычно заявление заёмщика либо акт, выделивший чужую долю.'}</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Основание возврата</h4>
      <dl class="kv">
        <dt>Документ</dt><dd>${v.basis || '<i>не приложено</i>'}</dd>
        <dt>Положил</dt><dd>${v.basisBy || '—'}</dd>
        <dt>Роль по правилу</dt><dd>${retOwnerless(v) ? 'бухгалтер (чужие деньги)' : 'куратор (трактовка)'}</dd>
      </dl>
    </div>
    <div class="gtoolbar" style="margin-top:10px">
      <button class="btn btn-secondary btn-sm" onclick="retBasisModal('${v.id}')">${v.basis?'Заменить основание':'Приложить основание'}</button>
      ${roleHint(allowed, retOwnerless(v) ? 'у чужих денег основание кладёт бухгалтер' : 'основание кладёт куратор')}
    </div>`;
}

/* --- ДОПУСТИМОСТЬ (вывод, а не согласование) --- */
function retAdmissibilityBlock(v){
  const adm = v.admissibility;
  const third = retIsThirdParty(v);

  const ruleRow = (on, title, text) => `<div class="grow" style="${on?'background:var(--asubk-blue-tint)':''}">
      <div class="gkind">${on?'▶ ':''}${title}</div>
      <div class="gwhat">${text}</div>
      <div class="gid"><span class="src-tag">${on?'применяется здесь':'другой случай'}</span></div>
    </div>`;

  const rule = `<div class="gate">
      ${ruleRow(!third, 'Возврат заёмщику', 'Допустим, если по заёмщику <b>не осталось непогашенного ни по одному кредиту</b> и ни один слой суда не жив. <b>Живой слой суда — стоп.</b>')}
      ${ruleRow(third,  'Возврат чужой доли', 'Состояние долга её не держит: доля третьего лица в разнесение не входила и ничего не гасила. Вывод опирается на акт, выделивший долю (ADR-0054).')}
    </div>`;

  const body = adm.ok
    ? `<div class="banner ok">${RET_ICO_I}<div><b>Препятствий нет.</b> Проверено на ${adm.checked}.
         Вывод не хранится — он пересобран на дату среза; на другую дату может выйти иначе, и это нормально.</div></div>`
    : `<div class="gate">${adm.blockers.map((b,i)=>`<div class="grow">
         <div class="gkind">Препятствие №${i+1} · состояние долга</div>
         <div class="gwhat">${b}</div>
         <div class="gid"><span class="src-tag">вывод на ${adm.checked}</span></div>
       </div>`).join('')}</div>
       <div class="banner err" style="margin-top:12px">${RET_ICO_I}<div>
         <b>Возврат не отклонён человеком — он недопустим по состоянию долга.</b>
         Подписи, которая это снимет, не существует: препятствия уйдут сами, когда изменится состояние
         (закроется слой мирового соглашения, снимется закрепление остатка). Тогда кнопка «Исполнить»
         откроется без единого нового согласования.</div></div>`;

  return `<div class="section-h" style="margin-top:24px">2 · Допустимость — выводится, человеком не согласуется</div>
    <div class="section-note">ПТ-29: допустимость не имеет согласующего. Это производная от состояния долга
      на дату среза — ровно как разнесение живого платежа (ADR-0001).</div>
    ${rule}
    <div style="margin-top:12px">${body}</div>
    <div class="gtoolbar" style="margin-top:12px">
      <button class="btn btn-tint btn-sm" onclick="retRecheck('${v.id}')">Проверить допустимость заново</button>
      <span class="src-tag">пересобирает вывод на сегодня (${DATA.today}) — это не подпись и не согласование</span>
    </div>`;
}

/* --- СВЯЗЬ С ОСТАТКОМ СВЕРХ НАСТУПИВШЕГО (ADR-0062) --- */
function retSurplusBlock(v){
  const r = receiptOf(v);
  if(!r) return '';
  const A = retAlloc(r);
  const mode = SURPLUS[r.surplus];
  const left = A ? A.a.surplusLeft : 0;

  const chain = `<div class="banner info">${RET_ICO_I}<div>
      <b>Дефолтный режим — обратная очередь.</b> Порядок такой:
      <div style="margin:8px 0 6px">${retQueueChain()}</div>
      возврат в нём стоит <b>последним</b> и наступает, только когда гасить больше нечего.
      Режим ставится куратором <b>ДО</b> разнесения (ADR-0062).</div></div>`;

  /* случай остатка, закреплённого адресным резервом (V-4 · ПС-290) */
  if(left > 0){
    const rows = (r.reserveRows||[]).map(x=>`<tr>
        <td>${x.due}</td><td>${x.article}</td>
        <td><span class="trn">Строка графика</span></td>
        <td class="r">${money(x.amount)}</td></tr>`).join('');
    return `<div class="section-h" style="margin-top:24px">Откуда эти деньги: остаток сверх наступившего</div>
      <div class="section-note">Возврат ${v.id} требует ${money(v.amount)} по поступлению
        <span class="rowlink" onclick="openReceipt('${r.id}')">${r.number}</span> — это ровно тот остаток,
        что не лёг в наступившее на дату разнесения.</div>
      <div class="inv">
        <span class="iv">Поступление: <b>${money(r.amount)}</b></span>
        <span class="iv">Наступившее на ${A.a.asOf}: <b>${money(A.a.due)}</b></span>
        <span class="iv">Остаток сверх наступившего: <b>${money(left)}</b></span>
        <span class="iv">Затребовано к возврату: <b>${money(v.amount)}</b></span>
        <span class="iv">Режим остатка: ${pill(mode)}</span>
      </div>
      <div class="matrix" style="margin-top:12px">
        <div class="mx-layer open">
          <div class="mx-layer-h" onclick="this.parentNode.classList.toggle('open')">
            <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            <span class="ml-title">За чем закреплён остаток</span>
            <span class="ml-mode">${mode.hint}</span>
            <span class="ml-sum">${money(left)}</span>
          </div>
          <div class="mx-body"><table class="mxg">
            <thead><tr><th>Срок</th><th>Статья долга</th><th>Область</th><th class="r">Сумма</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="4">строк нет</td></tr>'}</tbody>
          </table></div>
        </div>
      </div>
      ${chain}
      <div class="banner warn">${RET_ICO_I}<div>
        <b>Отсюда и второе препятствие допустимости.</b> Дефолт здесь <b>не применялся</b>: куратор
        поставил режим «${mode.t}» и закрепил ${money(left)} за взносами по графику. Одни и те же деньги
        сейчас и обещаны графику, и затребованы к возврату — пока закрепление живо, вывод даёт «недопустим».
        Пока возврат не исполнен, ${money(left)} остаются внутри платежа
        <span class="rowlink" onclick="openPayment('${A.p.id}')">${A.p.number}</span>: факт денег не меняется,
        меняется только трактовка.</div></div>`;
  }

  /* случай чужой доли: остатка сверх наступившего нет вовсе */
  return `<div class="section-h" style="margin-top:24px">Откуда эти деньги</div>
    <div class="section-note">Здесь возврат вырос не из остатка сверх наступившего: чужая доля
      в разнесение не попадала.</div>
    <div class="inv">
      <span class="iv">Поступление: <b>${money(r.amount)}</b></span>
      <span class="iv">Ушло в погашение: <b>${A ? money(A.a.total) : '—'}</b></span>
      <span class="iv">Доля третьего лица: <b>${money(v.amount)}</b></span>
      <span class="iv">Остаток сверх наступившего: <b>${money(A ? A.a.surplusLeft : 0)}</b></span>
      <span class="iv">Режим остатка: ${pill(mode)}</span>
    </div>
    ${chain}`;
}

/* --- ИСПОЛНЕНИЕ (функция человека) --- */
function retExecBlock(v){
  const adm = v.admissibility;
  const execOk = can.execReturn() && adm.ok && v.state!=='executed';
  const why = v.state==='executed' ? 'исполнен'
    : !adm.ok ? 'закрыто выводом: возврат недопустим по состоянию долга'
    : !can.execReturn() ? 'закрыто ролью: исполняет бухгалтер'
    : 'открыто';

  return `<div class="section-h" style="margin-top:24px">3 · Исполнение — делает человек</div>
    <div class="section-note">Факт денег во всех состояниях ведёт бухгалтер (<code>can.execReturn()</code>).
      Кнопка открыта, только когда <b>допустимость выведена положительно</b> и роль — бухгалтер.</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Исполнение ${pill(v.state==='executed' ? {t:'Исполнен', cls:'ok'} : {t:'Не исполнен', cls:'neutral'})}</h4>
      <dl class="kv">
        <dt>Исполнил</dt><dd>${v.execBy || '—'}</dd>
        <dt>Дата</dt><dd>${v.execAt || '—'}</dd>
        <dt>Реквизиты выплаты</dt><dd class="mono">${v.recipient.requisites}</dd>
        <dt>Сумма</dt><dd class="mono">${cur(v.amount, v.currency)}</dd>
        <dt>Состояние кнопки</dt><dd${execOk?'':' class="diff"'}>${why}</dd>
      </dl>
    </div>
    <div class="gtoolbar" style="margin-top:10px">
      <button class="btn ${execOk?'btn-primary':'btn-secondary'} btn-sm" onclick="retExec('${v.id}')">Исполнить возврат</button>
      ${roleHint(can.execReturn(), 'исполнение возврата — бухгалтер')}
      ${can.execReturn() && !adm.ok && v.state!=='executed' ? roleHint(false, 'откроется само, когда снимутся препятствия') : ''}
      <span class="spacer"></span>
      <span class="src-tag">порог, выше которого нужна подпись распорядителя, живёт вне модуля платежей</span>
    </div>`;
}

/* --- ИНВАРИАНТ ПОСТУПЛЕНИЯ: возврат — отдельное слагаемое --- */
function retInvariantBlock(v){
  const r = receiptOf(v);
  if(!r) return '';
  const paid = paymentsOf(r).filter(p=>!p.void).reduce((s,p)=>s+paidOf(p),0);
  const ret  = returnsOf(r).filter(x=>x.state==='executed').reduce((s,x)=>s+x.amount,0);
  const rest = unallocated(r);
  return `<div class="section-h" style="margin-top:24px">Инвариант поступления ${r.number}</div>
    <div class="section-note">Возврат стоит в инварианте <b>отдельным слагаемым</b> — он не платёж и не остаток.</div>
    <div class="inv">
      <span class="iv">Сумма поступления <b>${money(r.amount)}</b></span>
      <span class="iv">= Σ платежей <b>${money(paid)}</b></span>
      <span class="iv">+ исполненные возвраты <b>${money(ret)}</b></span>
      <span class="iv${rest!==0?' bad':''}">+ ${isReversed(r)?'снято сторно':'нераспределённое'} <b>${money(rest)}</b></span>
      <span class="iv">${axes(r)}</span>
    </div>`;
}

/* --- след --- */
function retHistBlock(v){
  const r = receiptOf(v), adm = v.admissibility;
  const rows = [];
  if(r) rows.push({when:r.date, what:`Поступление ${r.number} — факт денег: ${money(r.amount)} от «${r.payerName}».`, who:'источник возврата', cls:''});
  if(v.basis) rows.push({when:'—', what:`Основание положено: ${v.basis}`, who:v.basisBy, cls:''});
  rows.push({when:adm.checked, what: adm.ok
      ? 'Допустимость выведена: препятствий нет.'
      : `Допустимость выведена: препятствий — ${adm.blockers.length}. Отказа человека нет, согласующего не было.`,
    who:'вывод из состояния долга (не подпись)', cls: adm.ok?'res':'rev'});
  if(v.state==='executed') rows.push({when:v.execAt, what:`Возврат исполнен на реквизиты получателя: ${v.recipient.requisites}`, who:v.execBy, cls:'res'});
  else rows.push({when:'—', what:'Исполнения нет: деньги наружу не уходили.', who:'ждёт бухгалтера', cls:''});
  return `<div class="hist">${rows.map(h=>`<div class="hrow ${h.cls}">
      <div class="hwhen">${h.when}</div><div class="hwhat">${h.what}</div><div class="hwho">${h.who}</div>
    </div>`).join('')}</div>`;
}

/* ============================================================
   ДЕЙСТВИЯ
   ============================================================ */
function retExec(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  if(v.state==='executed') return toast('Возврат уже исполнен '+v.execAt+'.','warn');
  if(!can.execReturn())
    return toast('Исполнение возврата — факт денег: только бухгалтер. Куратор кладёт основание, но денег наружу не отправляет.','warn');
  if(!v.basis)
    return toast('Нет основания. Первую функцию выполняет человек — приложите документ, затем допустимость выведется сама.','warn');
  if(!v.admissibility.ok)
    return toast('Возврат недопустим по состоянию долга: '+v.admissibility.blockers[0]+' Это вывод, а не отказ — подписи, которая его снимет, нет.','warn');
  v.state = 'executed';
  v.execBy = 'Бухгалтер · А.Иманкулова';
  v.execAt = DATA.today;
  render();
  toast('Демо: возврат '+v.id+' исполнен на '+money(v.amount)+'. Деньги ушли наружу — в Σ платежей поступления они не входят.','ok');
}

function retRecheck(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  v.admissibility.checked = DATA.today;
  render();
  if(v.admissibility.ok)
    toast('Вывод пересобран на '+DATA.today+': препятствий нет. Это производная от состояния долга, а не подпись.','ok');
  else
    toast('Вывод пересобран на '+DATA.today+': препятствий по-прежнему '+v.admissibility.blockers.length+
          '. Согласовать допустимость нельзя — она снимется сама, когда изменится состояние долга.','warn');
}

function retBasisModal(id){
  const v = DATA.returns.find(x=>x.id===id);
  if(!v) return;
  if(!retBasisAllowed(v))
    return toast(retOwnerless(v)
      ? 'У чужих денег заёмщика нет — основание возврата кладёт бухгалтер.'
      : 'Основание возврата — трактовка: его кладёт куратор.', 'warn');
  openModal(`<div class="modal-h"><span class="mt">Основание возврата ${v.id}</span>
    <button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="banner info" style="margin-bottom:14px">${RET_ICO_I}<div>Это <b>первая</b> из трёх функций и единственная,
      где человек решает. Допустимость после сохранения <b>выведется сама</b> — согласовывать её не нужно и не у кого.</div></div>
    <div class="f2">
      <div class="field col-span req"><label class="flabel">Документ-основание</label>
        <div class="control"><input value="${(v.basis||'').replace(/"/g,'&quot;')}" placeholder="заявление заёмщика от … / акт реализации залога от …"></div></div>
      <div class="field col-span"><label class="flabel">Комментарий</label>
        <textarea class="note-area" placeholder="чем подтверждается право получателя на эти деньги"></textarea></div>
    </div>
    <div class="dropzone" style="margin-top:14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <div>Скан заявления либо акта</div></div>
  </div>
  <div class="modal-f">
    <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="retBasisSave('${v.id}')">Приложить основание</button>
  </div>`);
}

function retBasisSave(id){
  const v = DATA.returns.find(x=>x.id===id);
  closeModal();
  if(!v) return;
  if(v.state==='draft') v.state = 'based';
  v.basisBy = retOwnerless(v) ? 'Бухгалтер · А.Иманкулова' : 'Куратор · Ж.Осмонова';
  render();
  toast('Демо: основание положено ('+v.basisBy+'). Допустимость пересобрана автоматически — согласования у неё нет.','ok');
}

/* ============================================================
   MODAL: новый возврат
   ============================================================ */

  <div class="modal-b">
    <div class="banner info" style="margin-bottom:14px">${RET_ICO_I}<div>Возврат — <b>деньги наружу</b>, третья сущность
      наряду с поступлением и платежом (ADR-0056). В погашение он не идёт и в Σ платежей не входит.
      Здесь заполняется только <b>основание</b>; <b>допустимость выведется сама</b> из состояния долга,

    <div class="f2">
      <div class="field col-span req"><label class="flabel">Поступление-источник</label>
        <div class="control"><select>${opts}</select>
          <span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div></div>
      <div class="field req"><label class="flabel">Сумма возврата</label>
        <div class="control"><input placeholder="0,00"></div></div>
      <div class="field req"><label class="flabel">Вид получателя</label>
        <div class="control"><select>
            <option>Заёмщик по кредиту</option>
            <option>Третье лицо (залогодатель, поручитель)</option>
            <option>Плательщик чужих денег (заёмщика нет)</option>
          </select>
          <span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div></div>
      <div class="field req"><label class="flabel">Получатель</label>
        <div class="control"><input placeholder="ФИО / наименование — из основания, не из кредита"></div></div>
      <div class="field"><label class="flabel">Реквизиты выплаты</label>
        <div class="control"><input placeholder="р/с, банк"></div></div>
      <div class="field col-span req"><label class="flabel">Основание</label>

/* ------------------------------------------------------------
   ВТОРОЙ уровень заморозки (ADR-0064). Первый — заморозка ПОСТУПЛЕНИЯ
   (над одной записью, по положительной сверке, материализует снимок
   разнесения). Второй — ЗАКРЫТИЕ ПЕРИОДА (над месяцем целиком, по гейту).
   Уровни не подменяют друг друга: закрытие периода платежи НЕ морозит —
   оно проверяет, что они уже заморожены, и захлопывает месяц.
   Экрана не было вовсе — дефект ПТ-Д24.
   ------------------------------------------------------------ */

/* демо-актор операций уровня факта денег */
const PERIOD_ACTOR = 'Бухгалтер · А.Иманкулова';

/* Журнал закрытий и открытий ведётся всегда: и закрытие, и открытие —
   именованные операции с автором, датой и основанием. Открытие — ещё и
   с реквизитами решения комиссии. */
let PERIOD_LOG = [
  { when:'10.07.2026', act:'Закрытие', period:'Июнь 2026', who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст: три невыясненных разобраны, строки реестра ЦК сопоставлены, таймауты закрыты.' },
  { when:'02.07.2026', act:'Открытие', period:'Май 2026', who:PERIOD_ACTOR,
    decision:'Решение комиссии №11 от 01.07.2026',
    why:'Позднее подтверждение ЦК по сторнированному поступлению: понадобилась корректировка внутри уже закрытого месяца.' },
  { when:'30.06.2026', act:'Закрытие', period:'Май 2026', who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст.' },
];

/* ---- вспомогательные выводы по периоду (ничего не хранится) ---- */
function periodTotals(pid){
  const rs   = DATA.receipts.filter(r=>r.period===pid);
  const need = rs.filter(r=>r.match==='confirmed' && !isUnresolved(r));   // положительная сверка = основание заморозки
  return { rs, sum: rs.reduce((s,r)=>s+r.amount,0), need,
           frz: need.filter(r=>r.frozen==='frozen').length };
}
function periodKindTally(bl){
  const m = {}; bl.forEach(b=> m[b.kind] = (m[b.kind]||0)+1 );
  return Object.keys(m).map(k=>`${k} — ${m[k]}`).join(' · ');
}

/* ---- ГЕЙТ: поимённый список препятствий (ADR-0064 §2).
   periodBlockers даёт {kind, id, what, go}; функцию go в разметку не передать,
   поэтому переход собираем здесь: поступление — по номеру, строка ЦК — в реестр. */
function periodGate(pid, inModal){
  const bl = periodBlockers(pid);
  if(!bl.length) return '';
  return `<div class="gate">${bl.map(b=>{
    const rec  = DATA.receipts.find(r=>r.number===b.id);
    const jump = (inModal?'closeModal();':'') + (rec ? `openReceipt('${rec.id}')` : `go('registry')`);
    return `<div class="grow">
      <span class="gkind">${b.kind}</span>
      <span class="gwhat">${b.what}</span>
      <span class="gid" onclick="${jump}" title="Перейти к объекту">${b.id} →</span>
    </div>`;
  }).join('')}</div>`;
}

      Экран показывает, чем месяц держится, кто его закрыл и чем закрытый месяц отличается от открытого.</p>

    ${periodIntro()}

    <div class="section-h">Периоды учёта</div>
    <p class="section-note">Открытый период показывает препятствия поимённо, закрытый — автора, дату и основание закрытия.</p>
    ${DATA.periods.map(periodCard).join('')}

    ${periodUnresolvedNote()}
    ${periodValue()}
    ${periodDrift()}
    ${periodJournal()}

    <div class="legend">
      <span>${pill(PSTATE.open)} — записи периода ещё принимаются</span>
      <span>${pill(PSTATE.closed)} — месяц захлопнут, отчётность собирается отсюда</span>
      <span>${pill(FRZ.frozen)} — снимок разнесения материализован (уровень поступления)</span>
    </div>
  </div>`;
}

/* ============================================================
   ДЕЙСТВИЯ: закрытие · отказ поимённо · открытие по решению комиссии
   ============================================================ */

/** Закрытие месяца. Кнопка неактивна, пока гейт не пуст; отказ — всегда поимённый. */
function closePeriod(pid){
  const p = DATA.periods.find(x=>x.id===pid);
  if(!p || p.state==='closed') return;
  if(!can.closePeriod()) return toast('Закрытие периода — операция бухгалтера (факт денег)','warn');
  const bl = periodBlockers(pid);
  if(bl.length){
    modalBlockers(pid);
    return toast(`Период не закрыт: препятствий ${bl.length} — перечислены поимённо`,'warn');
  }
  p.state   = 'closed';
  p.closedBy = PERIOD_ACTOR;
  p.closedAt = DATA.today;
  p.note     = 'Закрыт в демо-режиме: гейт был пуст.';
  PERIOD_LOG.unshift({ when:DATA.today, act:'Закрытие', period:p.label, who:PERIOD_ACTOR, decision:'—',
    why:'Гейт пуст: невыясненных нет, строки реестра ЦК сопоставлены, положительные сверки заморожены, таймауты закрыты.' });
  render();
  toast(`«${p.label}» закрыт. Платежи месяца закрытием не заморожены — они были заморожены раньше, закрытие это проверило.`,'ok');
}

/** Отказ: система называет каждое препятствие и ведёт к нему (ПТ-Д24). */
function modalBlockers(pid){
  const p  = DATA.periods.find(x=>x.id===pid);
  const bl = periodBlockers(pid);
  openModal(`<div class="modal-h"><span class="mt">Почему «${p.label}» не закрывается</span>
    <button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="banner err"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
      <div>Отказ поимённый: <b>${bl.length}</b> — ${periodKindTally(bl)}.
        Формулировка «период не может быть закрыт» без перечня — дефект интерфейса, а не сообщение.</div></div>
    ${periodGate(pid, true)}
    <p class="section-note" style="margin-top:14px">Убрать препятствие можно только там, где оно живёт: невыясненное —
      опознанием объекта и разнесением (куратор), строку реестра — сопоставлением, незамороженное — заморозкой (бухгалтер),
      неистёкший таймаут — временем: он не ускоряется вручную.</p>
  </div>
  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Понятно</button></div>`);
}

/** Открытие закрытого месяца — операция уровня разморозки: только по решению комиссии. */
function modalOpenPeriod(pid){
  const p = DATA.periods.find(x=>x.id===pid);
  if(!p) return;
  if(!can.closePeriod()) return toast('Открытие закрытого периода — операция бухгалтера, и только по решению комиссии','warn');
  openModal(`<div class="modal-h"><span class="mt">Открыть период «${p.label}»</span>
    <button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="banner warn" style="margin-bottom:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0"/></svg>
      <div>Это операция <b>уровня разморозки</b>: закрытый месяц уже отдал цифры в отчётность и в подписанные акты.
        Поэтому открывает бухгалтер и только <b>по решению комиссии</b> — реквизиты решения обязательны,
        запись уйдёт в журнал закрытий и открытий.</div></div>
    <div class="f2">
      <div class="field req"><label class="flabel">Номер решения комиссии</label>
        <div class="control"><input id="poNum" placeholder="например, 17"></div></div>
      <div class="field req"><label class="flabel">Дата решения</label>
        <div class="control"><input id="poDate" value="${DATA.today}" placeholder="дд.мм.гггг"></div></div>
      <div class="field col-span req"><label class="flabel">Причина открытия</label>
        <textarea id="poWhy" class="note-area" placeholder="что именно требуется отразить внутри закрытого месяца: позднее подтверждение ЦК, восстановление сторнированного поступления, опознание невыясненного"></textarea></div>
    </div>
    <p class="section-note" style="margin-top:12px">Закрытие было: <b>${p.closedBy||'—'}</b>, <b>${p.closedAt||'—'}</b>.
      После открытия месяц снова начнёт принимать записи, а его закрытие снова потребует пустого гейта.</p>
  </div>
  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="doOpenPeriod('${p.id}')">Открыть период</button></div>`);
}

function doOpenPeriod(pid){
  const p = DATA.periods.find(x=>x.id===pid);
  if(!p) return;
  const val = id => ((document.getElementById(id)||{}).value||'').trim();
  const num = val('poNum'), dt = val('poDate'), why = val('poWhy');
  if(!num || !dt) return toast('Реквизиты решения комиссии обязательны: без номера и даты решения период не открывается','warn');
  const wasBy = p.closedBy, wasAt = p.closedAt;
  p.state    = 'open';
  p.closedBy = null;
  p.closedAt = null;
  p.note     = `Открыт по решению комиссии №${num} от ${dt}. Ранее закрыт: ${wasBy||'—'}, ${wasAt||'—'}.`;
  PERIOD_LOG.unshift({ when:DATA.today, act:'Открытие', period:p.label, who:PERIOD_ACTOR,
    decision:`Решение комиссии №${num} от ${dt}`,
    why: why || 'Причина не указана (демо).' });
  closeModal(); render();
  toast(`«${p.label}» открыт по решению комиссии №${num}. Запись ушла в журнал закрытий и открытий.`,'ok');
}
/* @@END:period@@ */

const hrow = (what,who) => ({when:'сейчас (демо)', what, who, cls: what.indexOf('Сторн')===0?'rev':what.indexOf('Восстанов')===0?'res':''});

/* ============================================================
   MODAL: новое поступление (факт денег, не платёж — ADR-0056)
   ============================================================ */
function modalNewReceipt(){
  if(ROLE==='viewer') return toast('Наблюдатель не вносит поступления','warn');
  openModal(`<div class="modal-h"><span class="mt">Внести поступление</span><button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="banner info" style="margin-bottom:14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/></svg><div>Вносится <b>факт денег</b>, а не трактовка. <b>Дата = дата фактического поступления</b>, не дата ввода. Платежи (кому и во что) появятся отдельным шагом; если объект не опознан — поступление ляжет в невыясненные, и это норма банковского канала.</div></div>
    <div class="f2">
      <div class="field req"><label class="flabel">Дата поступления</label><div class="control"><input placeholder="дд.мм.гггг"></div></div>
      <div class="field req"><label class="flabel">Сумма</label><div class="control"><input placeholder="0,00"></div></div>
      <div class="field req"><label class="flabel">Канал</label><div class="control"><select><option>Ручной ввод (список ЦК, почта)</option><option>Банк — общий счёт ЦК</option><option>Импорт реестра ЦК</option></select><span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div></div>
      <div class="field"><label class="flabel">Счёт зачисления</label><div class="control"><input placeholder="счёт кредита либо транша; общий счёт ЦК объект не опознаёт"></div></div>
      <div class="field"><label class="flabel">Вид погашения</label><div class="control"><select><option>Денежные средства</option><option>Имущество в счёт погашения</option><option>По решению суда</option><option>Реализация залога</option></select><span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span></div></div>
      <div class="field"><label class="flabel">Плательщик</label><div class="control"><input placeholder="ФИО / наименование из платёжного документа"></div></div>
      <div class="field col-span"><label class="flabel">Примечание платёжного документа</label><div class="control"><input placeholder="назначение платежа как есть"></div></div>
    </div>
  </div>
  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="closeModal();toast('Демо: поступление внесено. Оси: канал = Ручной ввод, сопоставление = Ожидает ЦК, заморозка = нет.','ok')">Внести</button></div>`);
}

/* ============================================================
   INFRA
   ============================================================ */
function onRoleChange(){ ROLE = document.getElementById('roleSel').value; render(); toast('Роль: '+ROLE_LABEL[ROLE]); }
function openModal(html){ const h=document.getElementById('modalHost'); h.innerHTML=`<div class="modal">${html}</div>`; h.classList.add('open'); }
function closeModal(){ const h=document.getElementById('modalHost'); h.classList.remove('open'); h.innerHTML=''; }
function toast(msg,kind){ const w=document.getElementById('toastWrap'); const t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.innerHTML=`<span>${msg}</span>`; w.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3400); }

render();
</script>
