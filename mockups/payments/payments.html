   ============================================================ */
/* @@VIEW:acts@@ */
/* ------------------------------------------------------------
   АКТЫ СВЕРКИ. Под одним словом живут ДВА РАЗНЫХ документа (ПТ-Д11):

   • ВНУТРЕННИЙ акт (kind:'internal') — рабочий документ Холдинга по периоду.
     Строится по ЗАКРЫТОМУ месяцу: цифры месяца неподвижны, поэтому под ними
     есть что подписывать. По открытому месяцу акт допустим только с пометкой
     «предварительно» и подписи не несёт.
   • ДВУСТОРОННИЙ акт с заёмщиком (kind:'bilateral') — не рабочий документ,
     а ПРИЗНАНИЕ ДОЛГА: прерывает срок исковой давности (ADR-0051) и
     принадлежит журналу мер взыскания. Здесь он только виден.

   Круга «акт ↔ заморозка» НЕТ (ПТ-Д10). Первична заморозка: акт ничего не
   морозит — он собирается из УЖЕ замороженных поступлений периода.
   Формулировки «подписанный акт является основанием заморозки» в модуле нет.
   ------------------------------------------------------------ */
const ACT_STATE = { draft:['Предварительный','neutral'], formed:['Сформирован','warn'], agreed:['Согласован','info'], signed:['Подписан','ok'] };

/* два документа — две пилюли; вид виден в ленте с одного взгляда */
const ACT_KIND = {
  internal:  { t:'Внутренний',   cls:'info',   full:'Внутренний акт Холдинга',
               why:'рабочий документ по периоду: свод замороженных поступлений месяца' },
  bilateral: { t:'Двусторонний', cls:'purple', full:'Двусторонний акт с заёмщиком',
               why:'признание долга: прерывает срок исковой давности' },
};

const ACT_ACTOR_CUR = 'Куратор · Ж.Осмонова';
const ACT_ACTOR_ACC = 'Бухгалтер · А.Иманкулова';

const ACT_ICO_I = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>';
const ACT_ARROW = '<span class="tl-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

/* ---- мелкие выводы (ADR-0001: ничего из этого не хранится) ---- */
const actState     = a => ACT_STATE[a.state] || ['—','neutral'];
const actPill      = a => pill({ t:actState(a)[0], cls:actState(a)[1] });
const actKindPill  = k => pill(ACT_KIND[k] || { t:k, cls:'neutral' });
const actPeriodOf  = a => DATA.periods.find(p=>p.id===a.period) || { id:a.period, label:a.period, state:'open' };
/** акт по НЕзакрытому периоду — только «предварительно»: цифры месяца ещё двигаются */
const actIsPrelim  = a => actPeriodOf(a).state !== 'closed';

/** заёмщик поступления выводится из живых платежей; если платежей нет — из плательщика документа */
function actBorrowersOf(r){
  const b = [...new Set(paymentsOf(r).filter(p=>!p.void).map(p=>(creditOf(p.credit)||{}).borrower).filter(Boolean))];
  return b.length ? b : (r.payerName ? [r.payerName] : []);
}
const actHasBorrower = (r, who) => actBorrowersOf(r).indexOf(who) >= 0;

/** СОСТАВ АКТА — производная: замороженные поступления периода по этому заёмщику.
    Отдельным списком акт свой состав не хранит, он пересобирается из данных периода. */
function actComposition(a){
  const mine = DATA.receipts.filter(r => r.period===a.period && actHasBorrower(r, a.borrower));
  const inn  = mine.filter(r => r.frozen==='frozen');   // вошли: заморожены
  const out  = mine.filter(r => r.frozen!=='frozen');   // не вошли: заморозки нет
  const credited = r => +paymentsOf(r)
    .filter(p => !p.void && (creditOf(p.credit)||{}).borrower === a.borrower)
    .reduce((s,p)=>s+paidOf(p),0).toFixed(2);
  const back = r => +returnsOf(r).filter(v=>v.state==='executed').reduce((s,v)=>s+v.amount,0).toFixed(2);
  return { mine, inn, out, credited, back,
    gross: +inn.reduce((s,r)=>s+r.amount,0).toFixed(2),
    sum:   +inn.reduce((s,r)=>s+credited(r),0).toFixed(2),
    ret:   +inn.reduce((s,r)=>s+back(r),0).toFixed(2) };
}

/** «1 замороженное поступление» / «2 замороженных поступления» — счётная форма */
function actPlur(n){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return n + ' замороженных поступлений';
  if(b === 1)          return n + ' замороженное поступление';
  if(b > 1 && b < 5)   return n + ' замороженных поступления';
  return n + ' замороженных поступлений';
}

/** ЧЬИ цифры показывать. Период ЗАКРЫТ — цифры месяца неподвижны, и акт держит их сам:
    показываем зафиксированное при формировании. Период ОТКРЫТ — акт предварительный,
    величина ещё двигается: показываем текущий вывод, а зафиксированное — рядом. */
function actShown(a, comp){
  return actIsPrelim(a)
    ? { n:comp.inn.length, sum:comp.sum, src:'выведено на '+DATA.today, fixed:true }
    : { n:a.frozenCount,   sum:a.sum,   src:'зафиксировано в акте: период закрыт', fixed:false };
}

/** почему поступление периода в акт НЕ вошло — причина выводится, а не пишется руками */
function actWhyOut(r){
  if(isReversed(r))   return 'Сторнировано: платежи погашены, сумма не распределена.';
  if(isUnresolved(r)) return 'Невыясненное: платежей нет, объект не опознан.';
  if(r.match==='mismatch')  return 'Расхождение с реестром ЦК: до корректировки замораживать нечего.';
  if(r.match==='pending')   return 'Ждёт подтверждения ЦК: таймаут ещё идёт, заморозки нет.';
  if(r.match==='confirmed') return 'Сверка положительная, а заморозки нет.';
  return 'Не заморожено — в акт не входит.';
}

/* ============================================================
   ЛЕНТА АКТОВ
   ============================================================ */
function actRow(a){
  const per   = actPeriodOf(a);
  const comp  = actComposition(a);
  const prel  = actIsPrelim(a);
  const sh    = actShown(a, comp);
  const dN    = prel && comp.inn.length !== a.frozenCount;          // разошлось число
  const dS    = prel && Math.abs(comp.sum - a.sum) > 0.004;         // разошлась сумма
  const bl    = prel ? periodBlockers(a.period) : [];
  return `<tr onclick="openAct('${a.id}')">
    <td><span class="rowlink">${a.id}</span><span class="sub">создан ${a.created}</span></td>
    <td title="${esc((ACT_KIND[a.kind]||{}).why||'')}">${actKindPill(a.kind)}
      <span class="sub">${(ACT_KIND[a.kind]||{}).why||''}</span></td>
    <td>${per.label}
      <span class="sub">${pill(PSTATE[per.state]||PSTATE.open)}</span>
      ${prel?`<span class="sub">препятствий: ${bl.length}</span>`:''}</td>
    <td title="${esc(a.borrower)}"><span class="cell-name">${a.borrower}</span></td>
    <td class="r num"><b>${sh.n}</b><span class="sub">${sh.src}</span>
      ${dN?`<span class="sub">в акте: ${a.frozenCount}</span>`:''}</td>
    <td class="r num">${money(sh.sum)}
      ${dS?`<span class="sub">в акте: ${money(a.sum)}</span>`:''}</td>
    <td title="${esc(a.initiator)}">${a.initiator}</td>
    <td>${actPill(a)}
      ${prel?`<span class="sub">период открыт — только «предварительно»</span>`:''}</td>
  </tr>`;
}

/* Сортеры ленты актов. «Состояние» сортируется по подписи состояния, а «Период» — по
   его id (2026-06 < 2026-07): в ISO-подобном id лексика совпадает с хронологией. */
const ACT_SORTERS = {
  id:        a => a.id,
  kind:      a => (ACT_KIND[a.kind]||{}).t || a.kind,
  period:    a => a.period,
  borrower:  a => a.borrower,
  frozen:    a => actShown(a, actComposition(a)).n,
  sum:       a => actShown(a, actComposition(a)).sum,
  initiator: a => a.initiator,
  state:     a => actState(a)[0],
};

function viewActs(){
  const internal  = DATA.acts.filter(a=>a.kind==='internal');
  const bilateral = DATA.acts.filter(a=>a.kind==='bilateral');
  const prelim    = DATA.acts.filter(actIsPrelim);

  return `<div class="page-pad">
    <div class="section-h">Акты сверки</div>

    <div class="gtoolbar">
      <button class="btn btn-primary btn-sm" onclick="actDo('init')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Инициировать акт</button>
      ${roleHint(can.initAct(),'инициирует куратор')}
      <span class="spacer"></span>
      <span class="src-tag">внутренних: ${internal.length} · двусторонних: ${bilateral.length} ·
        предварительных: ${prelim.length} · состояние на ${DATA.today}</span>
    </div>

    <div class="grid-wrap">
      <table class="grid" data-t="act" style="min-width:1300px">
        <colgroup>
          <col style="width:150px"><col style="width:170px"><col style="width:155px"><col style="width:200px">
          <col style="width:140px"><col style="width:145px"><col style="width:185px"><col style="width:180px">
        </colgroup>
        <!-- Шапки сокращены до слова: «Вошло замороженных» и «Сумма, вошедшая в акт» в
             фиксированной колонке обрезались в «…», а обрезанная шапка не называет колонку. -->
        <thead><tr>
          ${gth('act','id','Акт')}${gth('act','kind','Вид документа')}${gth('act','period','Период')}
          ${gth('act','borrower','Заёмщик')}${gth('act','frozen','Замороженных','r')}
          ${gth('act','sum','Сумма акта','r')}${gth('act','initiator','Инициатор')}${gth('act','state','Состояние')}
        </tr></thead>
      <tbody>${gapply('act', DATA.acts, ACT_SORTERS).map(actRow).join('')
        || '<tr><td colspan="8"><div class="grid-empty">Актов нет</div></td></tr>'}</tbody>
      </table>
    </div>

    <div class="legend">
      <span>${actKindPill('internal')} рабочий документ Холдинга по периоду</span>
      <span>${actKindPill('bilateral')} признание долга, мера взыскания</span>
      <span>${pill({t:ACT_STATE.draft[0],  cls:ACT_STATE.draft[1]})} период не закрыт</span>
      <span>${pill({t:ACT_STATE.formed[0], cls:ACT_STATE.formed[1]})} состав собран по закрытому месяцу</span>
      <span>${pill({t:ACT_STATE.agreed[0], cls:ACT_STATE.agreed[1]})} цифры приняты</span>
      <span>${pill({t:ACT_STATE.signed[0], cls:ACT_STATE.signed[1]})} подписан</span>
    </div>
  </div>`;
}

/* ============================================================
   КАРТОЧКА АКТА
   ============================================================ */
function actDetail(a){
  const per  = actPeriodOf(a);
  const comp = actComposition(a);
  const prel = actIsPrelim(a);
  const sh   = actShown(a, comp);
  const bl   = prel ? periodBlockers(a.period) : [];

  const banner = prel
    ? `<div class="banner warn">${ACT_ICO_I}<div><b>Акт предварительный: период «${per.label}» не закрыт.</b>
        Подписи не несёт — препятствий ${bl.length}.
        <span class="rowlink" onclick="go('period')">Экран закрытия периода</span>.</div></div>`
    : a.kind==='bilateral'
      ? `<div class="banner info">${ACT_ICO_I}<div><b>Двусторонний акт — признание долга.</b>
          Живёт в журнале мер взыскания, здесь только виден.</div></div>`
      : `<div class="banner ok">${ACT_ICO_I}<div><b>Период «${per.label}» закрыт ${per.closedAt||'—'}.</b>
          Цифры месяца неподвижны.</div></div>`;

  return `<div class="page-pad">
    <div class="gtoolbar">
      <button class="btn btn-tint btn-sm" onclick="back()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        К ленте актов</button>
      <span class="spacer"></span>${actActionBar(a)}
    </div>

    ${banner}

    <div class="phead">
      <div class="phead-top">
        <div>
          <div class="phead-name">
            <span class="nm">Акт ${a.id}</span>
            <span class="amt">${money(sh.sum)}</span>
            ${actKindPill(a.kind)}${actPill(a)}
          </div>
          <div class="phead-sub">${(ACT_KIND[a.kind]||{}).full||''} · период <b>${per.label}</b>
            (${(PSTATE[per.state]||{}).t||'—'}) · заёмщик <b>${a.borrower}</b> · инициатор <b>${a.initiator}</b>,
            ${a.created}<br>${a.note||''}</div>
        </div>
        ${pill(PSTATE[per.state]||PSTATE.open)}
      </div>
      <div class="phead-dims">
        <div class="dim"><div class="dl">Что это за документ</div>
          <div class="dv">${actKindPill(a.kind)}</div>
          <div class="src">${a.kind==='bilateral'
            ? 'Признание долга. Живёт в журнале мер взыскания.'
            : 'Свод замороженных поступлений заёмщика за период.'}</div></div>
        <div class="dim"><div class="dl">Период и его состояние</div>
          <div class="dv">${pill(PSTATE[per.state]||PSTATE.open)}</div>
          <div class="src">${per.state==='closed'
            ? 'Закрыл: '+(per.closedBy||'—')+', '+(per.closedAt||'—')+'.'
            : 'Месяц открыт: препятствий '+bl.length+' — акт только «предварительно».'}</div></div>
        <div class="dim"><div class="dl">Состав акта</div>
          <div class="dv"><b class="num">${sh.n}</b>
            <span style="font:var(--font-label)">${actPlur(sh.n).replace(String(sh.n)+' ','')} на ${money(sh.sum)}</span></div>
          <div class="src">${sh.src}.
            ${comp.out.length?'Не вошло: '+comp.out.length+' — ниже, с причиной.':'Незамороженных поступлений периода по заёмщику нет.'}</div></div>
      </div>
    </div>

    ${actTimeline(a)}
    ${actCompositionBlock(a, comp)}
    ${actNumbersBlock(a, comp)}
    ${a.kind==='bilateral' ? actBilateralBlock(a) : actInternalBlock(a)}

    <div class="section-h" style="margin-top:24px">След акта</div>
    ${actHistBlock(a, comp)}
  </div>`;
}

/* ---- ЖИЗНЕННЫЙ ЦИКЛ: у двустороннего он кончается подписью ЗАЁМЩИКА ---- */
function actTimeline(a){
  const order = ['draft','formed','agreed','signed'];
  const idx   = Math.max(0, order.indexOf(a.state));
  const prel  = actIsPrelim(a);
  const steps = a.kind==='bilateral'
    ? [['Предварительный','расчёт по данным периода; подписи не несёт'],
       ['Сформирован','состав собран из замороженных поступлений'],
       ['Согласован с заёмщиком','стороны сверили цифры'],
       ['Подписан заёмщиком','признание долга: срок исковой давности прерывается']]
    : [['Предварительный','месяц открыт — только «предварительно»'],
       ['Сформирован','по закрытому периоду'],
       ['Согласован','бухгалтерия приняла цифры месяца'],
       ['Подписан','внутренний документ Холдинга']];

  const html = steps.map(([lbl,sub],i)=>{
    const cls = i < idx ? 'done' : i === idx ? 'cur' : 'todo';
    const dot = i < idx ? '✓' : String(i+1);
    return `<div class="tl-step"><span class="tl-dot ${cls}">${dot}</span>
      <span class="tl-lbl${cls==='todo'?' todo':''}"><b>${lbl}</b><br><span class="src-tag">${sub}</span></span></div>`;
  }).join(ACT_ARROW);

  return `<div class="section-h" style="margin-top:22px">Жизненный цикл
      ${a.kind==='bilateral'?actKindPill('bilateral')+' '+pill({t:'Мера взыскания',cls:'purple'}):actKindPill('internal')}</div>
    ${prel?'<p class="section-note">Месяц открыт — цикл стоит на первом шаге.</p>':''}
    <div class="timeline">${html}</div>`;
}

/* ---- СОСТАВ: замороженные поступления периода этого заёмщика ---- */
function actCompositionBlock(a, comp){
  const per = actPeriodOf(a);
  const inRows = comp.inn.map(r=>`<tr onclick="openReceipt('${r.id}')">
      <td><span class="rowlink">${r.number}</span></td>
      <td class="mono">${r.date}</td>
      <td class="r mono">${cur(r.amount, r.currency)}</td>
      <td class="r mono">${money(comp.credited(r))}</td>
      <td class="r mono">${comp.back(r)>0.004?'&minus; '+money(comp.back(r)):'—'}</td>
      <td>${pill(FRZ[r.frozen])}<div class="src-tag" style="margin-top:4px">${pill(MATCH[r.match])}</div></td>
      <td style="white-space:normal;max-width:300px">${r.accountObject}
        <div class="src-tag" style="margin-top:4px">${r.note||''}</div></td>
    </tr>`).join('');

  const outRows = comp.out.map(r=>`<tr onclick="openReceipt('${r.id}')">
      <td><span class="rowlink">${r.number}</span></td>
      <td class="mono">${r.date}</td>
      <td class="r mono">${cur(r.amount, r.currency)}</td>
      <td>${axes(r)}</td>
      <td style="white-space:normal;max-width:520px">${actWhyOut(r)}</td>
    </tr>`).join('');

  return `<div class="section-h" style="margin-top:24px">Состав акта — только замороженные поступления периода</div>
    <p class="section-note">Отбор: поступления периода <b>${per.label}</b>, заёмщик <b>${a.borrower}</b>,
      заморозка стоит.</p>
    ${comp.inn.length ? `<div class="cgrid-wrap"><table class="cgrid"><thead><tr>
        <th>Поступление</th><th>Дата факта</th><th class="r">Сумма поступления</th>
        <th class="r">Вошло в акт</th><th class="r">Возвраты исполненные</th>
        <th>Оси состояния</th><th>Что опознал счёт</th>
      </tr></thead><tbody>${inRows}
        <tr class="total"><td colspan="2">Итого вошло замороженных: ${comp.inn.length}</td>
          <td class="r mono">${money(comp.gross)}</td>
          <td class="r mono">${money(comp.sum)}</td>
          <td class="r mono">${comp.ret>0.004?'&minus; '+money(comp.ret):'—'}</td>
          <td colspan="2" style="white-space:normal">«Вошло в акт» — Σ платежей заёмщика.</td></tr>
      </tbody></table></div>`
      : `<div class="cgrid-wrap"><div class="cgrid-empty">Замороженных поступлений периода
          по этому заёмщику нет</div></div>
        <p class="section-note" style="margin-top:10px">При формировании акт зафиксировал
          <b>${actPlur(a.frozenCount)}</b> на <b>${money(a.sum)}</b>.</p>`}

    ${comp.out.length ? `<div class="section-h" style="margin-top:22px">Не вошло в акт — с причиной</div>
      <p class="section-note">Поступления периода того же заёмщика, которых в акте нет.</p>
      <div class="cgrid-wrap"><table class="cgrid"><thead><tr>
        <th>Поступление</th><th>Дата факта</th><th class="r">Сумма</th><th>Оси состояния</th><th>Почему не вошло</th>
      </tr></thead><tbody>${outRows}</tbody></table></div>` : ''}`;
}

/* ---- цифры акта: зафиксированное при формировании против текущего вывода ---- */
function actNumbersBlock(a, comp){
  const per   = actPeriodOf(a);
  const diff  = Math.abs(comp.sum - a.sum) > 0.004 || comp.inn.length !== a.frozenCount;
  if(!actIsPrelim(a))
    return `<div class="banner ok" style="margin-top:14px">${ACT_ICO_I}<div>
      <b>Цифры акта неподвижны: период «${per.label}» закрыт.</b> Поздний факт потребует открытия периода
      по решению комиссии.</div></div>`;

  const bl = periodBlockers(a.period);
  return `<div class="section-h" style="margin-top:24px">Почему подписи нет: цифры месяца ещё двигаются</div>
    <div class="drift">
      <div class="dcol snap"><div class="dhead">Зафиксировано в акте ${a.created}</div>
        <dl class="kv">
          <dt>Замороженных поступлений</dt><dd class="num">${a.frozenCount}</dd>
          <dt>Сумма</dt><dd class="num mono">${money(a.sum)}</dd>
          <dt>Что это</dt><dd>Предварительный расчёт. Подписи не несёт.</dd>
        </dl></div>
      <div class="dcol live"><div class="dhead">Выведено сейчас на ${DATA.today}</div>
        <dl class="kv">
          <dt>Замороженных поступлений</dt><dd class="num">${comp.inn.length}</dd>
          <dt>Сумма</dt><dd class="num mono${diff?' diff':''}">${money(comp.sum)}</dd>
          <dt>Что держит месяц</dt><dd>Препятствий ${bl.length} ·
            <span class="rowlink" onclick="go('period')">экран закрытия периода</span></dd>
        </dl></div>
    </div>
    ${actGate(a.period)}`;
}

/* ---- гейт периода поимённо: убрать препятствие можно только там, где оно живёт ---- */
function actGate(pid){
  const bl = periodBlockers(pid);
  if(!bl.length) return '';
  return `<div class="gate">${bl.map(b=>`<div class="grow">
      <span class="gkind">${b.kind}</span>
      <span class="gwhat">${b.what}</span>
      <span class="gid" onclick="go('period')" title="К закрытию периода">${b.id} →</span>
    </div>`).join('')}</div>`;
}

/* ---- двусторонний: принадлежит журналу мер взыскания ---- */
function actBilateralBlock(a){
  return `<div class="section-h" style="margin-top:24px">Где этот акт живёт</div>
    <div class="recon-col" style="max-width:720px">
      <h4>Журнал мер взыскания ${pill({t:'владелец документа',cls:'purple'})}</h4>
      <dl class="kv">
        <dt>Правовой эффект</dt><dd>Признание долга: срок исковой давности прерывается и течёт заново.</dd>
        <dt>Что хранится там</dt><dd>Дата подписи, экземпляр документа, связь с процедурой и фазой взыскания.</dd>
        <dt>Кто ведёт</dt><dd>Куратор.</dd>
        <dt>Роль модуля платежей</dt><dd>Отдаёт цифры и показывает состояние.</dd>
      </dl>
    </div>
    <div class="gtoolbar" style="margin-top:12px">
      <button class="btn btn-secondary btn-sm" onclick="toast('Журнал мер взыскания живёт вне модуля платежей','ok')">Открыть в журнале мер взыскания</button>
    </div>`;
}

/* ---- внутренний: текущее состояние периода ---- */
function actInternalBlock(a){
  const per = actPeriodOf(a);
  return `<p class="section-note" style="margin-top:16px">Период акта — <b>${per.label}</b>,
    ${(PSTATE[per.state]||{}).t||'—'}${per.state==='closed'?', закрыл '+(per.closedBy||'—')+' '+(per.closedAt||''):''}.</p>`;
}

/* ---- след ---- */
function actHistBlock(a, comp){
  const per  = actPeriodOf(a);
  const rows = [];
  rows.push({ when:a.created, cls:'',
    what:`Акт инициирован: ${(ACT_KIND[a.kind]||{}).full||a.kind} по периоду «${per.label}», заёмщик ${a.borrower}`,
    who:a.initiator });
  rows.push({ when: per.state==='closed' ? (per.closedAt||'—') : '—',
    cls: per.state==='closed' ? 'res' : 'rev',
    what: per.state==='closed'
      ? 'Период закрыт: акт может нести подпись.'
      : `Период не закрыт: препятствий ${periodBlockers(a.period).length}. Акт остаётся предварительным.`,
    who: per.state==='closed' ? (per.closedBy||'—') : 'гейт закрытия периода' });
  rows.push({ when:'—', cls:'',
    what:`Состав выведен из данных периода: ${actPlur(comp.inn.length)} на ${money(comp.sum)}` +
         (comp.out.length?`; не вошло ${comp.out.length} — заморозки нет`:'') + '.',
    who:'вывод' });
  if(a.state==='agreed' || a.state==='signed')
    rows.push({ when:'—', cls:'',
      what: a.kind==='bilateral' ? 'Цифры согласованы с заёмщиком.' : 'Цифры согласованы бухгалтерией.',
      who: a.kind==='bilateral' ? a.borrower + ' и ' + a.initiator : ACT_ACTOR_ACC });
  if(a.state==='signed')
    rows.push({ when:'—', cls:'res',
      what: a.kind==='bilateral'
        ? 'Подписан заёмщиком: долг признан, срок исковой давности прерван. Запись ушла в журнал мер взыскания.'
        : 'Подписан как внутренний документ Холдинга по закрытому периоду.',
      who: a.kind==='bilateral' ? a.borrower : ACT_ACTOR_ACC });
  if(a.note) rows.push({ when:'—', cls:'', what:a.note, who:'примечание акта' });
  return `<div class="hist">${rows.map(h=>`<div class="hrow ${h.cls}">
      <div class="hwhen">${h.when}</div><div class="hwhat">${h.what}</div><div class="hwho">${h.who}</div>
    </div>`).join('')}</div>`;
}

/* ============================================================
   ДЕЙСТВИЯ: инициатива и формирование — куратор, согласование цифр —
   бухгалтерия, подпись внутреннего — бухгалтер, подпись заёмщика в
   двустороннем фиксирует куратор (это мера взыскания).
   ============================================================ */
const actCanAgree = () => ROLE === 'accountant';
const actCanSign  = a => a.kind==='bilateral' ? can.initAct() : ROLE === 'accountant';

function actActionBar(a){
  const per = actPeriodOf(a);
  let b = '';
  if(a.state==='draft'){
    if(per.state==='closed'){
      b += `<button class="btn btn-primary btn-sm" onclick="actDo('form','${a.id}')">Сформировать по закрытому периоду</button>
        ${roleHint(can.initAct(),'формирует куратор')}`;
    } else {
      b += `<button class="btn btn-secondary btn-sm" onclick="actDo('prelim','${a.id}')">Пересобрать предварительный расчёт</button>
        ${roleHint(can.initAct(),'собирает куратор')}`;
      b += `<button class="btn btn-tint btn-sm" onclick="actDo('form','${a.id}')">Сформировать с подписью</button>
        ${roleHint(false,'месяц «'+per.label+'» ещё открыт')}`;
    }
  } else if(a.state==='formed'){
    b += `<button class="btn btn-primary btn-sm" onclick="actDo('agree','${a.id}')">${a.kind==='bilateral'?'Согласовать с заёмщиком':'Согласовать (бухгалтерия)'}</button>
      ${roleHint(actCanAgree(),'цифры принимает бухгалтерия')}`;
  } else if(a.state==='agreed'){
    b += `<button class="btn btn-primary btn-sm" onclick="actDo('sign','${a.id}')">${a.kind==='bilateral'?'Зафиксировать подпись заёмщика':'Подписать'}</button>
      ${roleHint(actCanSign(a), a.kind==='bilateral'?'фиксирует куратор':'подписывает бухгалтер')}`;
  } else {
    b += pill({ t:'Подписан '+(a.kind==='bilateral'?'заёмщиком':'Холдингом'), cls:'ok' });
    b += `<button class="btn btn-tint btn-sm" onclick="toast('Печатная форма акта ${a.id}','ok')">Печатная форма</button>`;
  }
  return b;
}

function actDo(kind, id){
  if(kind==='init') return actInitModal();
  const a = DATA.acts.find(x=>x.id===id);
  if(!a) return;
  const per  = actPeriodOf(a);
  const comp = actComposition(a);

  if(kind==='prelim'){
    if(!can.initAct()) return toast('Акт собирает куратор','warn');
    a.frozenCount = comp.inn.length;
    a.sum         = comp.sum;
    a.note        = 'Предварительный расчёт пересобран ' + DATA.today + '. Период не закрыт.';
    render();
    return toast('Предварительный расчёт пересобран: замороженных '+comp.inn.length+' на '+money(comp.sum),'warn');
  }

  if(kind==='form'){
    if(!can.initAct()) return toast('Акт формирует куратор','warn');
    if(a.state!=='draft') return toast('Акт уже сформирован: состояние «'+actState(a)[0]+'»','warn');
    if(per.state!=='closed'){
      const bl = periodBlockers(a.period);
      return toast('«'+per.label+'» не закрыт: препятствий '+bl.length+'. Акт возможен только предварительно','warn');
    }
    a.state       = 'formed';
    a.frozenCount = comp.inn.length;
    a.sum         = comp.sum;
    a.note        = 'Сформирован по закрытому периоду ' + DATA.today + '.';
    render();
    return toast('Акт '+a.id+' сформирован по закрытому периоду','ok');
  }

  if(kind==='agree'){
    if(!actCanAgree()) return toast('Цифры месяца принимает бухгалтерия','warn');
    if(a.state!=='formed') return toast('Согласовывать нечего: состояние «'+actState(a)[0]+'»','warn');
    a.state = 'agreed';
    render();
    return toast(a.kind==='bilateral'
      ? 'Цифры согласованы с заёмщиком'
      : 'Цифры приняты бухгалтерией. Осталась подпись','ok');
  }

  if(kind==='sign'){
    if(!actCanSign(a)) return toast(a.kind==='bilateral'
      ? 'Подпись заёмщика фиксирует куратор'
      : 'Акт подписывает бухгалтер','warn');
    if(a.state!=='agreed') return toast('Подписывать рано: состояние «'+actState(a)[0]+'»','warn');
    if(a.kind==='internal' && per.state!=='closed')
      return toast('Подпись возможна только по закрытому периоду','warn');
    a.state = 'signed';
    render();
    return toast(a.kind==='bilateral'
      ? 'Подпись заёмщика зафиксирована. Запись ушла в журнал мер взыскания'
      : 'Акт '+a.id+' подписан по закрытому периоду','ok');
  }
}

/* ---- инициатива акта: куратор выбирает документ, период и заёмщика ---- */
function actInitModal(){
  if(!can.initAct()) return toast('Акт сверки инициирует куратор','warn');
  const pers = DATA.periods.map(p=>`<option value="${p.id}">${p.label} · ${(PSTATE[p.state]||{}).t||''}</option>`).join('');
  const brs  = [...new Set(DATA.credits.map(c=>c.borrower))].map(b=>`<option>${b}</option>`).join('');
  const caret = `<span class="caret"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>`;
  openModal(`<div class="modal-h"><span class="mt">Инициировать акт сверки</span>
    <button class="modal-x" onclick="closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-b">
    <div class="f2">
      <div class="field col-span req"><label class="flabel">Вид документа</label>
        <div class="control"><select id="actKind">
          <option value="internal">Внутренний акт Холдинга — рабочий документ по периоду</option>
          <option value="bilateral">Двусторонний акт с заёмщиком — признание долга</option>
        </select>${caret}</div></div>
      <div class="field req"><label class="flabel">Период</label>
        <div class="control"><select id="actPeriod">${pers}</select>${caret}</div></div>
      <div class="field req"><label class="flabel">Заёмщик</label>
        <div class="control"><select id="actBorrower">${brs}</select>${caret}</div></div>
      <div class="field col-span"><label class="flabel">Примечание</label>
        <textarea id="actNote" class="note-area" placeholder="зачем нужен акт: сверка перед подписанием графика, подготовка претензии, признание долга"></textarea></div>
    </div>
    <div class="banner warn" style="margin-top:14px">${ACT_ICO_I}<div>
      <b>По открытому месяцу выйдет только «предварительно».</b> Состав соберётся из замороженных
      поступлений периода.</div></div>
  </div>
  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
    <button class="btn btn-primary" onclick="actCreate()">Инициировать</button></div>`);
}

function actCreate(){
  const val = id => ((document.getElementById(id)||{}).value||'').trim();
  const kind = val('actKind') || 'internal';
  const pid  = val('actPeriod') || DATA.periods[0].id;
  const who  = val('actBorrower') || (DATA.credits[0]||{}).borrower || '—';
  const per  = DATA.periods.find(p=>p.id===pid) || { label:pid, state:'open' };
  const n    = DATA.acts.reduce((m,x)=>Math.max(m, +String(x.id).replace(/\D/g,'')||0), 0) + 1;
  const a = { id:'AS-'+n, kind, period:pid, borrower:who, state:'draft', created:DATA.today,
    frozenCount:0, sum:0, initiator:ACT_ACTOR_CUR, note:val('actNote') || '' };
  const comp = actComposition(a);
  a.frozenCount = comp.inn.length;
  a.sum         = comp.sum;
  if(!a.note) a.note = per.state==='closed'
    ? 'Построен по закрытому периоду.'
    : 'Период не закрыт — акт только «предварительно».';
  DATA.acts.unshift(a);
  closeModal();
  openAct(a.id);
  toast(per.state==='closed'
    ? 'Акт '+a.id+' заведён по закрытому периоду: '+comp.inn.length+' замороженных поступлений на '+money(comp.sum)
    : 'Акт '+a.id+' заведён предварительным: «'+per.label+'» не закрыт',
    per.state==='closed' ? 'ok' : 'warn');
}

      <div class="field col-span"><label class="flabel">Примечание платёжного документа</label><div class="control"><input placeholder="назначение платежа как есть"></div></div>
    </div>

  <div class="modal-f"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="closeModal();toast('Поступление внесено. Оси: канал = Ручной ввод, сопоставление = Ожидает ЦК, заморозка = нет','ok')">Внести</button></div>`);

function onRoleChange(){ ROLE = document.getElementById('roleSel').value; render(); toast('Роль: '+ROLE_LABEL[ROLE]); }
function openModal(html){ const h=document.getElementById('modalHost'); h.innerHTML=`<div class="modal">${html}</div>`; h.classList.add('open'); }
function closeModal(){ const h=document.getElementById('modalHost'); h.classList.remove('open'); h.innerHTML=''; }
function toast(msg,kind){ const w=document.getElementById('toastWrap'); const t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.innerHTML=`<span>${msg}</span>`; w.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3400); }

render();
