<title>Учёт и сверка платежей · АСУБК</title>
<!--
  MOCKUP (single-file, interactive) — TO-BE модуля «Учёт и сверка платежей».
  Образец для команды разработки, не прод-код. Стиль сверен с mockups/collection/
  и mockups/loan-credit/. Модуль проектируется с нуля (в живом стенде отдельного
  экрана сверки нет) — дефекты по нему в notes/qa-findings.md не заводятся.

  Канон логики: mockups/payments/ASUBK-platezhi-logika.md (редакция волны 3, 04.08.2026).
  Решения: docs/adr/0055…0061 и 0073…0076 поверх docs/adr/0001 «производные не хранятся».
  Язык предметной области: CONTEXT.md.

  СЛОВАРЬ ЭКРАНА ↔ СЛОВАРЬ МОДЕЛИ. В интерфейсе термины модели заменены обиходными;
  сущности те же, ADR не переименованы:
    разбивка платежа   = разнесение (§5 канона)
    динамическая       = производная (ADR-0001: не хранится, выводится на дату среза)
    зафиксированная    = снимок      (ADR-0055: материализована на заморозке)
  «Снимок» остаётся только там, где речь о закрытом периоде, — это другой объект.

  ВОСЕМЬ АРХИТЕКТУРНЫХ ШВОВ (что демонстрирует макет)
  1. Поступление · платёж · возврат — ТРИ сущности (ADR-0056). Поступление — факт денег,
     платёж — трактовка, возврат — деньги наружу. Инвариант: сумма поступления =
     Σ платежей + возврат + нераспределённое. Невыясненное = поступление с нулём платежей,
     а не отдельная сущность.
  2. Разбивка платежа — ДИНАМИЧЕСКАЯ у живого платежа и ЗАФИКСИРОВАННАЯ у замороженного (ADR-0055).
     Расхождение зафиксированной разбивки с текущей показывается, а не прячется. Операции «каскад
     пересчёта» не существует: величины выводятся сами, человека уведомляют.
  3. Сверка — ЧЕТЫРЕ исхода. Три независимые оси состояния: регистрация · сопоставление ·
     заморозка. После сопоставления действует сумма ЦК (ADR-0058). Схлопывание в один
     status запрещено.
  4. Матрица разносит ТОЛЬКО наступившее на дату, по всем слоям (ADR-0057). Перечень
     непогашенного на дату публикует кредит — очередь погашения (ADR-0060).
  5. Транш — ОБЛАСТЬ разбивки, не четвёртый уровень матрицы (ADR-0060). Счёт опознаёт
     объект: шлюз генерирует счёт на транш, банк даёт общий счёт ЦК с примечанием и ФИО
     (поэтому невыясненные — основной поток банковского канала, а не редкость).
  6. Остаток сверх наступившего — ТРИ режима (ADR-0073): обратная очередь (дефолт), аванс,
     адресный резерв. Режим — директива на входе вывода, ставится ДО разбивки.
     Досрочка график не трогает; перестроение — только по заявлению заёмщика (ADR-0074).
  7. Заморозка ДВУХУРОВНЕВАЯ (ADR-0075): заморозка поступления по положительной сверке
     и закрытие периода по гейту (невыясненные · несопоставленные строки ЦК ·
     незамороженные поступления · платежи с неистёкшим таймаутом).
  8. Списание уменьшает НАЧИСЛЕННОЕ и платежом не является (ADR-0076) — в модуле только
     ссылка на операцию у владельца начисления. Курс НБ на дату поступления — производная,
     сомовый эквивалент подписан датой курса (ADR-0061).

  Роли (селектор в шапке меняет доступные действия):
    • Куратор — ТРАКТОВКА: привязка и перепривязка, разбивка, режим остатка,
      основание возврата, инициатива акта, решение комиссии по спорной пене.
    • Бухгалтер — ФАКТ ДЕНЕГ: сторно поступления, корректировка суммы по ЦК, заморозка
      и разморозка, закрытие и открытие периода, исполнение возврата, основание у чужих денег.
    • Наблюдатель — только чтение.
  Граница между ролями — заморозка (ADR-0055, спека §8.1).

  ДЕМО-ОГРАНИЧЕНИЯ: часть производных подана готовой в данных, а не считается в рантайме.
  Комиссия вне АСУБК — вносится только результат её решения.
-->

  background:var(--surface-hover); border-top:1px solid var(--border-strong); }
table.cgrid tbody tr.muted td{ color:var(--text-muted); font-style:italic; }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
.cgrid-empty{ display:flex; align-items:center; justify-content:center; min-height:120px; color:var(--text-placeholder); font:var(--font-label); }

/* ---- РЕЕСТРОВЫЙ ГРИД (.grid) — формат реестра кредитов, mockups/loan-credit/credit.html §Р-19.
   Ленты платежей/поступлений/возвратов, реестр ЦК и лента актов стоят с реестром кредитов в
   одном конвейере и обязаны читаться как один продукт. Отсюда всё, что отличает .grid от .cgrid:
     • тёмная липкая шапка 14px и ↕ у КАЖДОЙ колонки — сортировка всегда на виду, а не угадывается;
     • фиксированные ширины через <colgroup> + table-layout:fixed — колонки не пляшут от выборки,
       длинное значение обрезается в «…», полное остаётся в title ячейки;
     • зебра — чтобы взгляд не съезжал по строке в широкой таблице;
     • вторая строка ячейки .sub вместо отдельной колонки (сюда ушли src-tag-подстрочники);
     • деньги — вправо табличными цифрами: разряды обязаны стоять в столбик.
   Обёртка .grid-wrap оставлена в рамке .cgrid-wrap: у кредитов реестр — вся страница, здесь
   таблица стоит среди баннеров и пояснений и должна читаться отдельным блоком. ---- */
.grid-wrap{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  overflow:auto; min-height:80px; background:var(--surface-card); }
table.grid{ width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; font:var(--font-label); }
table.grid thead th{ position:sticky; top:0; z-index:2; background:var(--asubk-gray-300);
  text-align:left; padding:7px 12px; vertical-align:middle;
  border-bottom:1px solid var(--border-strong);
  font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  cursor:pointer; user-select:none; }
table.grid thead th.nos{ cursor:default; }   /* колонка без сортировки — например, «Действие» */
table.grid thead th .sort{ margin-left:4px; font-size:11px; color:var(--text-placeholder); }
table.grid thead th.sorted{ color:var(--asubk-blue); }
table.grid thead th.sorted .sort{ color:var(--asubk-blue); }
table.grid thead th.r, table.grid tbody td.r{ text-align:right; }
table.grid tbody td{ padding:5px 12px; border-bottom:1px solid var(--border-default);
  color:var(--text-body); vertical-align:top;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.grid tbody tr{ cursor:pointer; }
table.grid tbody tr:nth-child(even) td{ background:var(--asubk-gray-50); }
/* реестр ЦК: под строкой живут пояснительные строки, и полосатость по nth-child врёт —
   там зебра проставляется вручную классом .zeb на всей группе строк одной записи */
table.grid.man-zeb tbody tr:nth-child(even) td{ background:none; }
table.grid tbody tr.zeb td{ background:var(--asubk-gray-50); }
/* ховер и выбор перебивают зебру — поэтому ниже по каскаду */
table.grid tbody tr:hover td{ background:var(--asubk-gray-150); }
table.grid tbody tr.sel td{ background:var(--asubk-nav-active); }
table.grid tbody tr.muted td{ color:var(--text-muted); font-style:italic; }
table.grid tbody tr:last-child td{ border-bottom:none; }
/* пояснение под строкой — не строка данных: курсора-указателя и обрезки у неё нет */
table.grid tbody tr.note td{ white-space:normal; cursor:default;
  padding-top:0; color:var(--text-muted); font-size:12px; line-height:1.45; }
table.grid tbody tr.note{ cursor:default; }
/* итоговая строка: стоит подвалом таблицы, чтобы величина оказалась в СВОЕЙ колонке,
   а не в тулбаре над реестром. Липнет к нижней кромке скролл-обёртки. */
table.grid tfoot td{ position:sticky; bottom:0; z-index:1;
  padding:7px 12px; background:var(--asubk-gray-100);
  border-top:1px solid var(--border-strong);
  font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading);
  white-space:nowrap; }
table.grid tfoot td.r{ text-align:right; }
table.grid tfoot td.lbl{ font-weight:var(--weight-regular); color:var(--text-muted); }
/* денежная ячейка */
.grid td.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
.grid td.bal{ font-weight:var(--weight-medium); color:var(--text-heading); }
.grid td.bad, .grid td.bad .num{ color:var(--asubk-red); font-weight:var(--weight-semibold); }
/* главная строка ячейки-имени */
.grid td .cell-name{ font-weight:var(--weight-medium); color:var(--text-heading); }
/* вторая строка ячейки: дата, реквизит, пояснение — то, что было отдельной колонкой или src-tag */
.grid td .sub{ display:block; margin-top:1px; color:var(--text-muted);
  font-weight:var(--weight-regular); font-size:12px; line-height:1.25;
  font-variant-numeric:tabular-nums;
  overflow:hidden; text-overflow:ellipsis; }
.grid td .sub.inline{ display:inline; margin-top:0; margin-left:6px; }
/* подстрочник из пилюль (метки строки реестра ЦК): их бывает две-три, и обрезка в «…»
   съела бы вторую метку целиком — здесь перенос честнее многоточия */
.grid td .sub.wrap{ white-space:normal; }
/* пилюли в ячейке грида плотнее: строка 5px-паддинга, пилюля не должна её распирать */
.grid td .pill{ vertical-align:baseline; }
.grid-empty{ display:flex; align-items:center; justify-content:center; min-height:120px;
  color:var(--text-placeholder); font:var(--font-label); white-space:normal; }

.rowlink{ color:var(--text-link); cursor:pointer; }
.rowlink:hover{ text-decoration:underline; }
.mono{ font:var(--weight-medium) 13px/1.4 var(--mono); }

/* ---- pills / axes ---- */
.pill{ display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.pill.purple{ background:var(--asubk-purple-tint); color:var(--asubk-purple); }

.axes{ display:flex; gap:6px; flex-wrap:wrap; }
.src-tag{ display:inline-flex; align-items:center; gap:5px; font:var(--weight-medium) 12px/1 var(--asubk-font); color:var(--text-muted); }

/* ---- banners ---- */
.banner{ display:flex; align-items:flex-start; gap:10px; border-radius:var(--radius-md); padding:11px 14px;
  font:var(--font-label); margin-bottom:14px; }
.banner svg{ flex:none; margin-top:1px; }
.banner b{ font-weight:var(--weight-semibold); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }

/* ---- payment card header ---- */
.phead{ border:1px solid var(--border-default); border-radius:var(--radius-md); padding:16px 20px; margin-bottom:16px; }
.phead-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
.phead-name{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.phead-name .nm{ font:var(--weight-semibold) 20px/1.2 var(--asubk-font); color:var(--text-heading); }
.phead-name .amt{ font:var(--weight-bold) 20px/1.2 var(--asubk-font); color:var(--text-heading); }

.phead-dims{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
@media(max-width:760px){ .phead-dims{ grid-template-columns:1fr; } }
.dim{ background:var(--surface-panel); border-radius:var(--radius-md); padding:11px 14px; }
.dim .dl{ font:var(--weight-regular) 11px/1 var(--asubk-font); color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:7px; }
.dim .dv{ display:flex; align-items:center; gap:8px; }
.dim .src{ font:var(--weight-regular) 11px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:6px; }

/* ---- tabs ---- */
.detail-tabbar{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin-bottom:18px; overflow-x:auto; }
.dtab{ flex:none; border:none; background:transparent; padding:11px 15px;
  font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); color:var(--text-muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap; }
.dtab:hover{ color:var(--text-body); }
.dtab.active{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.dpanel{ display:none; }

/* ---- allocation matrix ---- */
.matrix{ border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }
.mx-layer{ border-bottom:1px solid var(--border-default); }
.mx-layer:last-child{ border-bottom:none; }
.mx-layer-h{ display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface-panel); cursor:pointer; user-select:none; }
.mx-layer-h .chev{ display:inline-flex; color:var(--text-muted); transition:transform 120ms ease; }
.mx-layer.open .mx-layer-h .chev{ transform:rotate(90deg); }
.mx-layer-h .ml-title{ font:var(--weight-semibold) var(--text-sm)/1.2 var(--asubk-font); color:var(--text-heading); }
.mx-layer-h .ml-mode{ font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-muted); }
.mx-layer-h .ml-sum{ margin-left:auto; font:var(--weight-bold) var(--text-sm)/1 var(--mono); color:var(--text-heading); }
.mx-body{ display:none; }
.mx-layer.open .mx-body{ display:block; }
table.mxg{ width:100%; border-collapse:collapse; font:var(--font-label); }
table.mxg th{ text-align:left; padding:7px 14px; font:var(--weight-medium) 12px/1 var(--asubk-font); color:var(--text-muted); background:var(--surface-hover); }
table.mxg th.r{ text-align:right; }
table.mxg td{ padding:7px 14px; border-top:1px solid var(--asubk-grid-line); }
table.mxg td.r{ text-align:right; font:var(--weight-medium) 13px/1.4 var(--mono); }
.urg{ font:var(--weight-medium) 11px/1 var(--asubk-font); padding:1px 6px; border-radius:var(--radius-pill); }
.urg.over{ background:var(--status-error-bg); color:var(--asubk-red); }
.urg.acc{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.urg.cur{ background:var(--asubk-tint-fill); color:var(--text-muted); }

/* ---- reconciliation split ---- */
.recon-split{ display:grid; grid-template-columns:1fr 44px 1fr; gap:0; align-items:stretch; }
@media(max-width:900px){ .recon-split{ grid-template-columns:1fr; } .recon-mid{ display:none !important; } }
.recon-col{ border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }
.recon-col h4{ margin:0; padding:10px 14px; font:var(--weight-semibold) var(--text-sm)/1.2 var(--asubk-font);
  background:var(--surface-panel); color:var(--text-heading); border-bottom:1px solid var(--border-default); display:flex; align-items:center; gap:8px; }
.recon-mid{ display:flex; align-items:center; justify-content:center; color:var(--text-placeholder); }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; padding:14px; margin:0; }
.kv dt{ font:var(--font-label); color:var(--text-muted); }
.kv dd{ margin:0; font:var(--weight-medium) var(--text-sm)/1.4 var(--asubk-font); color:var(--text-body); }
.kv dd.diff{ color:var(--asubk-red); font-weight:var(--weight-semibold); }

/* candidate suggestion rows */
.cand{ display:flex; align-items:center; gap:12px; padding:11px 14px; border:1px solid var(--border-default);
  border-radius:var(--radius-md); margin-bottom:8px; }
.cand .ci{ flex:1; }
.cand .ci .cn{ font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading); }
.cand .ci .cm{ font:var(--font-label); color:var(--text-muted); margin-top:2px; }

/* ---- form ---- */
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:16px 32px; align-items:start; max-width:1100px; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field.col-span{ grid-column:1 / -1; }
.field .flabel{ font:var(--font-label); color:var(--text-muted); }
.field.req .flabel::after{ content:" •"; color:var(--action-danger); }
.control{ position:relative; display:flex; align-items:center; }
.control input, .control select, .note-area{ width:100%; height:var(--control-h); border-radius:var(--radius-md);
  background:var(--surface-card); color:var(--text-body); font:var(--font-body); font-weight:var(--weight-medium);
  border:1px solid var(--border-strong); outline:none; padding:0 var(--space-2); }
.control select{ cursor:pointer; appearance:none; padding-right:30px; }
.control input:focus, .control select:focus, .note-area:focus{ border-color:var(--border-focus); box-shadow:0 0 0 3px var(--asubk-blue-tint); }
.control input[readonly], .ro input{ background:var(--surface-input); color:var(--text-muted); border:1px solid transparent; cursor:default; }
.control .caret{ position:absolute; right:9px; pointer-events:none; color:var(--text-muted); display:flex; }
.note-area{ height:auto; min-height:74px; padding:10px 12px; resize:vertical; line-height:1.5; }

/* ---- timeline (act lifecycle) ---- */
.timeline{ display:flex; flex-wrap:wrap; gap:0; margin:2px 0 6px; }
.tl-step{ display:flex; align-items:center; gap:8px; }
.tl-dot{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font:var(--weight-bold) 12px/1 var(--asubk-font); flex:none; }
.tl-dot.done{ background:var(--asubk-green); color:#fff; }
.tl-dot.cur{ background:var(--asubk-blue); color:#fff; }
.tl-dot.todo{ background:var(--surface-input); color:var(--text-placeholder); }
.tl-lbl{ font:var(--font-label); color:var(--text-body); }
.tl-lbl.todo{ color:var(--text-placeholder); }
.tl-arrow{ color:var(--text-placeholder); margin:0 14px; display:flex; }

.hist{ border-left:2px solid var(--border-strong); margin-left:6px; }
.hrow{ position:relative; padding:10px 0 10px 22px; border-bottom:1px solid var(--asubk-grid-line); }
.hrow::before{ content:""; position:absolute; left:-5px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--asubk-blue); }
.hrow.rev::before{ background:var(--asubk-red); }
.hrow.res::before{ background:var(--asubk-green); }
.hrow .hwhen{ font:var(--weight-medium) 13px/1.3 var(--asubk-font); color:var(--text-muted); }
.hrow .hwhat{ font:var(--font-label); color:var(--text-body); margin-top:2px; }
.hrow .hwho{ font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }

/* dropzone */
.dropzone{ border:1.5px dashed var(--border-strong); border-radius:var(--radius-md); padding:26px; text-align:center;
  color:var(--text-muted); background:var(--surface-panel); cursor:pointer; margin-bottom:16px; }
.dropzone:hover{ border-color:var(--asubk-blue); color:var(--text-link); }
.dropzone svg{ margin-bottom:8px; }

/* footer */
.footer{ position:sticky; bottom:0; background:var(--surface-page); border-top:1px solid var(--border-default);
  padding:14px 20px; display:flex; align-items:center; gap:12px; z-index:5; }
.footer .spacer{ flex:1; }

/* modal */
.overlay{ position:fixed; inset:0; background:rgba(16,28,46,0.42); display:none; align-items:center; justify-content:center; z-index:60; padding:24px; }
.overlay.open{ display:flex; }
.modal{ background:var(--surface-card); border-radius:var(--radius-lg); width:min(640px,100%); max-height:88vh;
  display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }
.modal.wide{ width:min(860px,100%); }
.modal-h{ padding:18px 24px 12px; display:flex; align-items:center; gap:10px; }
.modal-h .mt{ font:var(--weight-bold) 19px/1.2 var(--asubk-font); color:var(--text-heading); flex:1; }
.modal-x{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); display:flex; padding:4px; }
.modal-x:hover{ color:var(--text-body); }
.modal-b{ padding:4px 24px 8px; overflow:auto; flex:1; }
.modal-f{ padding:14px 24px 20px; display:flex; gap:12px; justify-content:flex-end; }

/* toast */
.toast-wrap{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:80; }
.toast{ min-width:260px; max-width:440px; padding:12px 14px; border-radius:var(--radius-md);
  background:var(--asubk-ink); color:#fff; font:var(--font-label); box-shadow:0 10px 30px rgba(16,28,46,0.3);
  display:flex; gap:10px; align-items:flex-start; }
.toast.ok{ background:var(--asubk-green); } .toast.warn{ background:var(--asubk-amber); } .toast.err{ background:var(--asubk-red); }

.role-hint{ font:var(--font-label); color:var(--text-placeholder); display:inline-flex; align-items:center; gap:6px; }
.legend{ display:flex; gap:16px; flex-wrap:wrap; font:var(--font-label); color:var(--text-muted); margin-top:12px; }
.legend span{ display:inline-flex; align-items:center; gap:6px; }

/* ---- волна 3: транш, режим остатка, инвариант, расхождение разбивок, гейт периода ---- */
.trn{ display:inline-block; padding:1px 7px; border-radius:10px; border:1px solid var(--asubk-grid-line);
  background:var(--asubk-bg-soft,#F5F7FA); font:var(--weight-medium) 12px/1.5 var(--asubk-font); color:var(--text-muted); white-space:nowrap; }
.inv{ display:flex; flex-wrap:wrap; gap:10px 22px; align-items:center; padding:10px 14px; margin:12px 0;
  border:1px solid var(--asubk-grid-line); border-radius:var(--radius-md); background:var(--asubk-bg-soft,#F5F7FA); }
.inv .iv{ font:var(--font-label); color:var(--text-muted); }
.inv .iv b{ color:var(--text-heading); font-variant-numeric:tabular-nums; }
.inv .iv.bad b{ color:var(--asubk-red); }
.drift{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
.drift .dcol{ border:1px solid var(--asubk-grid-line); border-radius:var(--radius-md); overflow:hidden; }
.drift .dhead{ padding:8px 12px; font:var(--weight-bold) 13px/1.3 var(--asubk-font); background:var(--asubk-bg-soft,#F5F7FA); border-bottom:1px solid var(--asubk-grid-line); }
.drift .dcol.snap .dhead{ color:var(--asubk-blue); }
.drift .dcol.live .dhead{ color:var(--asubk-green); }
.gate{ border:1px solid var(--asubk-grid-line); border-radius:var(--radius-md); overflow:hidden; margin-top:12px; }
.gate .grow{ display:flex; gap:12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--asubk-grid-line); }
.gate .grow:last-child{ border-bottom:none; }
.gate .gkind{ font:var(--weight-medium) 13px/1.3 var(--asubk-font); color:var(--text-heading); min-width:250px; }
.gate .gwhat{ font:var(--font-label); color:var(--text-muted); flex:1; }
.gate .gid{ font:var(--weight-medium) 13px/1.3 var(--asubk-font); color:var(--asubk-link); cursor:pointer; }
</style>
</head>

  <div class="main">

<script>
/* ============================================================
   ROLE + NAV
   Граница ролей — заморозка: до неё трактовку правит куратор,
   факт денег во всех состояниях — бухгалтер (спека §8.1, ПТ-20).
   ============================================================ */
let ROLE = 'curator';
const ROLE_LABEL = { curator:'Куратор', accountant:'Бухгалтер', viewer:'Наблюдатель' };
const can = {
  // факт денег — бухгалтер
  reverse:     () => ROLE==='accountant',   // сторно поступления (денег не было)
  correct:     () => ROLE==='accountant',   // корректировка суммы по реестру ЦК
  freeze:      () => ROLE==='accountant',   // заморозка поступления по положительной сверке
  unfreeze:    () => ROLE==='accountant',   // разморозка — по решению комиссии
  closePeriod: () => ROLE==='accountant',   // закрытие / открытие периода (ADR-0075)
  execReturn:  () => ROLE==='accountant',   // исполнение возврата
  ownerless:   () => ROLE==='accountant',   // основание возврата у чужих денег (нет заёмщика)
  // трактовка — куратор
  bind:        () => ROLE==='curator',      // привязка и перепривязка платежа
  allocate:    () => ROLE==='curator',      // разбивка и поправка к ней
  surplus:     () => ROLE==='curator',      // режим остатка сверх наступившего (ADR-0073)
  returnBasis: () => ROLE==='curator',      // основание возврата (заявление заёмщика)
  initAct:     () => ROLE==='curator',      // акт сверки инициирует куратор
  dispute:     () => ROLE==='curator',      // решение комиссии по спорной пене вносит куратор
  match:       () => ROLE==='curator',      // сопоставление подтверждает куратор
};

/* Порядок меню — по спеке §12 «Новые экраны»:
   ПЛАТЕЖИ — главная лента куратора, поэтому первый блок и стартовый экран;
   ПОСТУПЛЕНИЯ — служебная лента, живёт рядом с реестром ЦК, а не над платежами
   (`ADR-0056`: два похожих списка подряд — куратор не знает, в каком работать);
   ПЕРИОД И АКТЫ — последним, потому что внутренний акт строится по ЗАКРЫТОМУ
   периоду (§8.6), то есть закрытие предшествует акту и в меню тоже. */
const NAV = [
  { id:'g-pay', label:'Платежи и возвраты', open:true, items:[
    { id:'pay',        label:'Платежи',                icon:'coin' },
    { id:'unresolved', label:'Невыясненные',           icon:'help',  badge:()=>unresolvedReceipts().length },
    { id:'returns',    label:'Возвраты',               icon:'back',  badge:()=>DATA.returns.filter(v=>v.state!=='executed').length },
  ]},
  { id:'g-cbk', label:'Поступления и сверка с ЦК', open:true, items:[
    { id:'receipts',   label:'Поступления',            icon:'inbox' },
    { id:'registry',   label:'Реестр ЦК',              icon:'file' },
    { id:'recon',      label:'Сопоставление (сверка)', icon:'link',  badge:()=>DATA.recon.filter(r=>r.outcome!=='ok').length },
  ]},
  { id:'g-period', label:'Период и акты', open:true, items:[
    { id:'period',     label:'Закрытие периода',       icon:'lock',  badge:()=>DATA.periods.filter(p=>p.state==='open'&&periodBlockers(p.id).length).length },
    { id:'acts',       label:'Акты сверки',            icon:'check' },

];
const ICONS = {
  coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2-2.5 3.7"/><path d="M12 17h.01"/>',

/* Раскрытость узлов живёт вне разметки: render() перерисовывает сайдбар целиком,
   и без этого набора любое действие схлопывало бы то, что открыл пользователь. */
const NAV_OPEN = new Set(['m-pay', ...NAV.filter(g=>g.open).map(g=>g.id)]);
function navToggle(id){ NAV_OPEN.has(id) ? NAV_OPEN.delete(id) : NAV_OPEN.add(id); renderNav(); }
/* Свёрнутость сайдбара живёт классом на .app, а не в состоянии рендера:
   render() перерисовывает только #nav и #content, поэтому переключение переживает
   любое действие пользователя и не требует места в модели. */
function toggleSidebar(){
  const off = document.querySelector('.app').classList.toggle('nav-off');
  const b = document.querySelector('.topbar .menu');
  b.setAttribute('aria-expanded', String(!off));
  b.setAttribute('aria-label', off ? 'Развернуть меню' : 'Свернуть меню');
}
function renderNav(){
  const nav = document.getElementById('nav');
  const chev = s => `<span class="chev"><svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>`;
  const item = n => {
    const badge = n.badge ? n.badge() : 0;
    const b = badge ? `<span class="cnt${n.id==='unresolved'?' mut':''}">${badge}</span>` : '';
    return `<a class="nav-item${n.id===CUR_VIEW?' active':''}" onclick="go('${n.id}')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n.icon]}</svg>
      <span>${n.label}</span>${b}</a>`;
  };
  // Счётчик схлопнутой подгруппы поднимается на её заголовок: свёрнутый узел
  // не имеет права спрятать препятствие закрытия периода.
  const sub = g => {
    const open = NAV_OPEN.has(g.id);
    const sum = g.items.reduce((s,n)=>s + (n.badge ? n.badge() : 0), 0);
    const b = (!open && sum) ? `<span class="cnt">${sum}</span>` : '';
    return `<div class="nav-sub${open?' open':''}">
      <button class="nav-toggle" onclick="navToggle('${g.id}')">${chev(14)}<span class="lbl">${g.label}</span>${b}</button>
      <div class="nav-children">${g.items.map(item).join('')}</div></div>`;
  };
  const grp = (id,lbl,inner) => `<div class="nav-group${NAV_OPEN.has(id)?' open':''}">
      <button class="nav-toggle" onclick="navToggle('${id}')">${chev(14)}<span class="lbl">${lbl}</span></button>
      <div class="nav-children">${inner}</div></div>`;
  const stub = lbl => `<a class="nav-item" onclick="toast('Активен модуль платежей')">${lbl}</a>`;
  nav.innerHTML =
    grp('m-pay',        'Учёт и сверка платежей',  NAV.map(sub).join('')) +
    grp('m-credit',     'Кредиты и транши',        stub('Кредиты')) +
    grp('m-collection', 'Взыскание задолженности', stub('Процессы взыскания')) +
    grp('m-dict',       'Справочники',             stub('Справочники'));
}

/* ============================================================
   ОСИ СОСТОЯНИЯ И ФОРМАТТЕРЫ (шов №3)
   ============================================================ */
const CHAN = {                                   // канал поступления (шов №5)
  manual:  { t:'Ручной ввод', cls:'neutral' },
  gateway: { t:'Шлюз',        cls:'purple'  },

const MATCH = {

const FRZ = {                                    // ПТ-Д18: в интерфейсе — «заморозка», не «крыжение»
  open:   { t:'Не заморожено', cls:'neutral' },

  draft:    { t:'Черновик',      cls:'neutral' },

};

const pill  = (o) => `<span class="pill ${o.cls}"><span class="dot"></span>${o.t}</span>`;
const money = v => v==null? '—' : v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const cur   = (v,c) => money(v) + (c && c!=='KGS' ? ' '+c : '');

/* три оси у ПОСТУПЛЕНИЯ; платёж своих осей не имеет — он их наследует (ADR-0056) */
function axes(r){ return `<div class="axes">${pill(CHAN[r.channel])}${pill(MATCH[r.match])}${pill(FRZ[r.frozen])}</div>`; }

/* ---- производные модели (docs/adr/0001: не хранятся, а выводятся) ---- */
const receiptOf   = p => DATA.receipts.find(r=>r.id===p.receiptId);
const paymentsOf  = r => DATA.payments.filter(p=>p.receiptId===r.id);
const returnsOf   = r => DATA.returns.filter(v=>v.receiptId===r.id);
const creditOf    = id => DATA.credits.find(c=>c.id===id);
const allocOf     = key => DATA.alloc[key];

/** сумма платежа в валюте ПОСТУПЛЕНИЯ: долг может быть в USD, а деньги пришли в сомах */
const paidOf = p => p.paidKGS ?? p.amount;
/** нераспределённый остаток поступления: сумма = Σ платежей + исполненные возвраты + нераспределённое.
    Сторнированные платежи и несостоявшиеся возвраты в сумму не входят. */
function unallocated(r){
  const paid = paymentsOf(r).filter(p=>!p.void).reduce((s,p)=>s+paidOf(p),0);
  const ret  = returnsOf(r).filter(v=>v.state==='executed').reduce((s,v)=>s+v.amount,0);
  return +(r.amount - paid - ret).toFixed(2);
}
/** невыясненное = поступление с нулём платежей (ПТ-Д1, ADR-0056) */
const isReversed   = r => r.match==='reversed';
const isUnresolved = r => paymentsOf(r).length===0 && !isReversed(r);
const unresolvedReceipts = () => DATA.receipts.filter(isUnresolved);

/** курс НБ на дату поступления — производная (ADR-0061) */
function rateOn(code, date){ return (DATA.rates[code]||{})[date] ?? null; }
function kgsEquiv(p){
  if(p.currency==='KGS') return p.amount;
  const r = rateOn(p.currency, p.rateDate);
  return r==null ? null : +(p.amount*r).toFixed(2);
}

/** расхождение зафиксированной разбивки с текущей — обязано быть видимым (ПТ-Д9, ADR-0055) */
function snapshotDrift(p){
  if(!p.snapshot || !p.derived) return null;
  const a = allocOf(p.snapshot), b = allocOf(p.derived);
  if(!a || !b || p.snapshot===p.derived) return null;
  return { snapTotal:a.total, liveTotal:b.total, reason:p.driftReason||'' };
}

/** гейт закрытия периода: поимённо, что мешает (ADR-0075 §2) */
function periodBlockers(pid){
  const inP = r => r.period===pid;
  const b = [];
  DATA.receipts.filter(r=>inP(r)&&isUnresolved(r)).forEach(r=>
    b.push({ kind:'Невыясненное поступление', id:r.number, what:`${money(r.amount)} от «${r.payerName}»`, go:()=>openReceipt(r.id) }));
  DATA.registry.filter(x=>x.period===pid && !x.matched && !x.dup).forEach(x=>
    b.push({ kind:'Несопоставленная строка реестра ЦК', id:'№'+x.doc, what:`${money(x.amount)} от «${x.payer}»`, go:()=>go('registry') }));
  DATA.receipts.filter(r=>inP(r)&&r.frozen==='open'&&r.match==='confirmed'&&!isUnresolved(r)).forEach(r=>
    b.push({ kind:'Незамороженное поступление', id:r.number, what:`сверка положительная, заморозки нет`, go:()=>openReceipt(r.id) }));
  DATA.receipts.filter(r=>inP(r)&&r.match==='pending').forEach(r=>
    b.push({ kind:'Ожидает подтверждения ЦК', id:r.number, what:`таймаут до ${r.deadline} (${r.daysLeft} раб. дн.)`, go:()=>openReceipt(r.id) }));
  return b;
}

/* ============================================================
   ДАТА СРЕЗА ЖИВОГО ВЫВОДА НЕ ХРАНИТСЯ (ADR-0001)
   Динамическая разбивка пересобирается при каждом открытии — значит её дата
   среза всегда «сегодня», а не та, что лежит в демо-данных. Зафиксированную
   (snapshot) не трогаем: у неё дата — момент заморозки, и она застыла.
   Сторнированный платёж тоже не трогаем: там дата — дата сторно, а не срез.
   ============================================================ */
DATA.payments.forEach(p => {
  if(p.void || p.derived === p.snapshot) return;
  const live = DATA.alloc[p.derived];
  if(live) live.asOf = DATA.today + (p.snapshot ? ' (текущий вывод)' : '');
});

/* ============================================================
   ФИЛЬТР ЛЕНТЫ — один движок на три ленты (поступления · платежи · возвраты)

   Паттерн взят из реестра кредитов (mockups/loan-credit/credit.html, §Р-19):
   ярус 1 — быстрая строка (поиск + частые условия + «⚙ Фильтры» с бейджем),
   ярус 2 — свёрнутая панель редких условий, под ними чипы активных условий.

   Отличие от кредитов — в механике рендера. Там реестр живёт в своём DOM и
   строки перерисовываются точечно; здесь render() пересобирает весь #content,
   поэтому:
     • источник истины — состояние в JS (feed.st), контролы рисуются ИЗ него;
       читать значения из DOM нельзя — после ререндера их там уже нет;
     • ввод в поиск зовёт не render(), а feedRows() — точечную перерисовку
       строк, чипов, бейджа, пейджера и итоговой полосы. Полный render() на
       каждой букве уносил бы фокус и каретку из поля.
   Клик по чипу и «Сбросить фильтры» — наоборот, полный render(): фокус в этот
   момент не в поле, а значения надо вернуть в сами контролы.

   Условие ≠ поле: диапазон «от—до» и каскад «кредит → транш» — это ОДНО
   условие на двух контролах. Иначе бейдж врёт: заполненный диапазон дал бы 2.
   Сегменты-виды ленты («Все · Живые · Сторнированные») фильтром не являются:
   это отбор, внутри которого работают условия. Они складываются по AND.
   ============================================================ */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const uniqv = arr => [...new Set(arr)].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ru'));
/* модель хранит даты как дд.мм.гггг, <input type="date"> говорит только в ISO.
   В ISO лексикографический порядок совпадает с хронологическим — сравниваем в нём. */
const toISO = s => /^\d{2}\.\d{2}\.\d{4}$/.test(s||'') ? String(s).split('.').reverse().join('-') : '';
const toDMY = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'') ? String(s).split('-').reverse().join('.') : (s||'');

const FEEDS = {};
const normOpt = o => typeof o==='string' ? { v:o, t:o } : o;
const optLabel = (list, v) => { const o = list.map(normOpt).find(x=>x.v===v); return o ? o.t : v; };
const optHtml = (list, sel) => ['<option value="">— все —</option>'].concat(
  list.map(normOpt).map(o=>`<option value="${esc(o.v)}"${o.v===sel?' selected':''}>${esc(o.t)}</option>`)).join('');
const blankOf = c => c.kind==='range' ? { from:'', to:'' } : c.kind==='pair' ? { a:'', b:'' } : '';

/** дескриптор ленты: откуда строки (base), чем их рисовать (paint), какие условия.
    size 5 — демонстрационный: в тестовых данных 10 строк, при 10 пейджер себя не
    покажет. В проде дефолт 10, как в реестре кредитов. */
function defFeed(name, o){
  const f = { name, conds:o.conds, base:o.base, paint:o.paint, sorters:o.sorters||{},
              size:o.size||5, page:1, open:false, st:{} };
  f.conds.forEach(c => f.st[c.key] = blankOf(c));
  FEEDS[name] = f;
  return f;
}

/** задано ли условие (не «заполнено ли поле») */
function condSet(c, v){
  if(c.kind==='range') return v.from!=='' || v.to!=='';
  if(c.kind==='pair')  return !!(v.a || v.b);
  return String(v).trim() !== '';
}
/** подпись условия в чипе */
function condText(c, v){
  if(c.fmt) return c.fmt(v);
  if(c.kind==='text')   return v.trim();
  if(c.kind==='select') return optLabel(c.options(), v);
  if(c.kind==='pair')   return [v.a && optLabel(c.options(), v.a), v.b && optLabel(c.optionsB(v.a), v.b)]
                                .filter(Boolean).join(' · ');
  const f = c.input==='date' ? toDMY(v.from) : v.from, t = c.input==='date' ? toDMY(v.to) : v.to;
  return `${f||'…'}—${t||'…'}`;
}
/** активные условия ленты — [{c, text}] */
const feedActive = f => f.conds.filter(c=>condSet(c, f.st[c.key])).map(c=>({ c, text:condText(c, f.st[c.key]) }));
/** AND-комбинация: незаданное условие выборку не сужает */
function feedApply(f, list){
  const on = feedActive(f).map(x=>x.c);
  return list.filter(row => on.every(c => c.test(row, c.kind==='text' ? String(f.st[c.key]).trim().toLowerCase() : f.st[c.key])));
}
/* ============================================================
   СОРТИРОВКА ГРИДА — общая для лент и обычных таблиц

   Взято из реестра кредитов: ↕ стоит у КАЖДОЙ колонки всегда, клик по шапке
   переключает ↑/↓. Состояние сортировки — не свойство ленты: у реестра ЦК и актов
   ленты нет, а шапка та же. Поэтому ключ состояния — ИМЯ ТАБЛИЦЫ (pay · rec · ret ·
   reg · act), а сортеры — аксессоры на строку, объявленные рядом со своей таблицей.

   Перерисовка разная по той же причине, что и у фильтров: у ленты есть точечный
   feedRows() (иначе слетит страница и фокус), у остальных таблиц — полный render().
   Сортировка применяется ДО пагинации: иначе сортировался бы только текущий лист.
   ============================================================ */
const SORTS = {};
const sortState = t => SORTS[t] || (SORTS[t] = { key:null, dir:1 });
/** шапка-колонка со стрелкой; cls — доп. классы ячейки (r — правое выравнивание) */
function gth(t, key, label, cls){
  const s = sortState(t), on = s.key === key;
  const cl = [cls||'', on?'sorted':''].filter(Boolean).join(' ');
  return `<th data-k="${key}"${cl?` class="${cl}"`:''} onclick="gsort('${t}','${key}')"
    >${label}<span class="sort">${on ? (s.dir===1?'↑':'↓') : '↕'}</span></th>`;
}
function gsort(t, key){
  const s = sortState(t);
  if(s.key === key) s.dir = -s.dir; else { s.key = key; s.dir = 1; }
  if(FEEDS[t]){ FEEDS[t].page = 1; feedRows(t); gsyncHead(t); } else render();
}
/** отразить состояние сортировки на стрелках шапки (лента шапку не перерисовывает) */
function gsyncHead(t){
  const s = sortState(t);
  document.querySelectorAll(`table.grid[data-t="${t}"] thead th[data-k]`).forEach(th=>{
    const on = th.getAttribute('data-k') === s.key;
    th.classList.toggle('sorted', on);
    const sp = th.querySelector('.sort');
    if(sp) sp.textContent = on ? (s.dir===1?'↑':'↓') : '↕';
  });
}
/** применить сортировку таблицы t; числа — арифметически, остальное — localeCompare('ru') */
function gapply(t, list, sorters){
  const s = sortState(t), get = sorters && sorters[s.key];
  if(!get) return list;
  return list.slice().sort((a,b)=>{
    const x = get(a), y = get(b);
    if(typeof x==='number' && typeof y==='number') return (x-y) * s.dir;
    return String(x==null?'':x).localeCompare(String(y==null?'':y), 'ru', { numeric:true }) * s.dir;
  });
}

/** выборка + страница; страница зажимается, если выборка усохла */
function feedSlice(name){
  const f = FEEDS[name];
  const hits = gapply(name, feedApply(f, f.base()), f.sorters);
  const pages = Math.max(1, Math.ceil(hits.length / f.size));
  if(f.page > pages) f.page = pages;
  const from = (f.page - 1) * f.size;
  return { f, hits, pages, from, page: hits.slice(from, from + f.size) };
}

/* ---- контролы условий ---- */
function feedCtl(f, c){
  const id = `f-${f.name}-${c.key}`, v = f.st[c.key];
  const w = c.width ? ` style="width:${c.width}px"` : '';
  const lab = `<span class="flabel">${esc(c.label)}</span>`;
  const set = (part, ev) => `${ev}="feedSet('${f.name}','${c.key}','${part}',this.value)"`;
  if(c.kind==='text') return `<div class="field"${w}>${lab}<div class="control">
      <input id="${id}" type="search" placeholder="${esc(c.ph||'')}" value="${esc(v)}" ${set('','oninput')}></div></div>`;
  if(c.kind==='select') return `<div class="field"${w}>${lab}<div class="control">
      <select id="${id}" ${set('','onchange')}>${optHtml(c.options(), v)}</select>
      <span class="caret">▾</span></div></div>`;
  if(c.kind==='pair') return `<div class="field"${w}>${lab}<div class="range-pair">
      <div class="control"><select id="${id}-a" ${set('a','onchange')}>${optHtml(c.options(), v.a)}</select><span class="caret">▾</span></div>
      <div class="control"><select id="${id}-b" ${set('b','onchange')}>${optHtml(c.optionsB(v.a), v.b)}</select><span class="caret">▾</span></div>
    </div></div>`;
  const t = c.input || 'number', ev = t==='date' ? 'onchange' : 'oninput';
  const ph = t==='number' ? [' placeholder="от"',' placeholder="до"'] : ['',''];
  return `<div class="field"${w}>${lab}<div class="range-pair">
      <input id="${id}-from" type="${t}"${ph[0]} value="${esc(v.from)}" ${set('from',ev)}>
      <span>—</span>
      <input id="${id}-to" type="${t}"${ph[1]} value="${esc(v.to)}" ${set('to',ev)}>
    </div></div>`;
}

/** оба яруса + чипы; right — что прижать вправо в быстрой строке */
function feedBar(name, right){
  const f = FEEDS[name];
  const n = feedActive(f).length;
  const quick = f.conds.filter(c=>c.zone==='quick'), panel = f.conds.filter(c=>c.zone!=='quick');
  return `<div class="tb-quick">
      ${quick.map(c=>feedCtl(f,c)).join('')}
      <button class="btn btn-secondary btn-sm q-more" onclick="feedToggle('${name}')">⚙ Фильтры<span
        class="fbadge" id="fb-${name}"${n?'':' hidden'}>${n?'·'+n:''}</span></button>
      ${right||''}
    </div>
    <div class="filter-body${f.open?' open':''}" id="fp-${name}">
      ${panel.map(c=>feedCtl(f,c)).join('')}
      <div class="filter-actions"><button class="btn btn-secondary btn-sm" onclick="feedReset('${name}')">Сбросить фильтры</button></div>
    </div>
    <div class="filter-chips" id="fc-${name}">${feedChips(f)}</div>`;
}
/* × снимает условие целиком: обе границы диапазона, оба селекта каскада */
const feedChips = f => feedActive(f).map(({c, text}) =>
  `<span class="fchip">${esc(c.label)}: ${esc(text)}<button title="Снять условие"
     onclick="feedClear('${f.name}','${c.key}')">×</button></span>`).join('');

function feedPagerInner(f, total, pages, from, shown){
  const btn = (label, to, dis) => dis ? `<span class="pg dis">${label}</span>`
    : `<span class="pg" onclick="feedPage('${f.name}',${to})">${label}</span>`;
  const nums = [];
  for(let i=1;i<=pages;i++) nums.push(i===f.page ? `<span class="pg active">${i}</span>` : btn(i, i, false));
  return `<span class="pinfo">${total ? `Показано ${from+1}–${from+shown} из ${total}` : 'Ничего не найдено'}</span>
    <span class="pages">${btn('‹', f.page-1, f.page<=1)}${nums.join('')}${btn('›', f.page+1, f.page>=pages)}</span>
    <span class="psize">На странице<select onchange="feedSize('${f.name}',this.value)">${
      [5,10,25].map(n=>`<option${n===f.size?' selected':''}>${n}</option>`).join('')}</select></span>`;
}
const feedPagerHtml = s => `<div class="pager" id="fpg-${s.f.name}">${
  feedPagerInner(s.f, s.hits.length, s.pages, s.from, s.page.length)}</div>`;

/* ---- действия ---- */
function feedSet(name, key, part, value){
  const f = FEEDS[name], c = f.conds.find(x=>x.key===key);
  if(part) f.st[key][part] = value; else f.st[key] = value;
  f.page = 1;
  if(c.kind==='pair' && part==='a'){          // каскад: старший селект пересобирает младший
    f.st[key].b = '';
    const b = document.getElementById(`f-${name}-${key}-b`);
    if(b) b.innerHTML = optHtml(c.optionsB(value), '');
  }
  feedRows(name);
}
function feedToggle(name){
  const f = FEEDS[name]; f.open = !f.open;
  const el = document.getElementById(`fp-${name}`); if(el) el.classList.toggle('open', f.open);
}
function feedClear(name, key){
  const f = FEEDS[name]; f.st[key] = blankOf(f.conds.find(c=>c.key===key)); f.page = 1; render();
}
function feedReset(name){
  const f = FEEDS[name]; f.conds.forEach(c=>f.st[c.key] = blankOf(c)); f.page = 1; render();
}
function feedPage(name, to){ FEEDS[name].page = to; feedRows(name); }
function feedSize(name, v){ const f = FEEDS[name]; f.size = +v; f.page = 1; feedRows(name); }

/** точечная перерисовка: строки и итоги — дело ленты, чипы/бейдж/пейджер — движка */
function feedRows(name){
  const s = feedSlice(name);
  s.f.paint(s);
  const chips = document.getElementById('fc-'+name); if(chips) chips.innerHTML = feedChips(s.f);
  const badge = document.getElementById('fb-'+name);
  if(badge){ const n = feedActive(s.f).length; badge.textContent = n ? '·'+n : ''; badge.hidden = !n; }
  const pg = document.getElementById('fpg-'+name);
  if(pg) pg.innerHTML = feedPagerInner(s.f, s.hits.length, s.pages, s.from, s.page.length);
}

/* ============================================================
   VIEW ROUTER — восемь экранов (шов №1: поступление · платёж · возврат)
   ============================================================ */

function go(v){ CUR_VIEW = v; curReceipt=null; curPayment=null; curReturn=null; curAct=null; render(); }

function openPayment(id){ curPayment = DATA.payments.find(p=>p.id===id); curReceipt=null; curReturn=null; curAct=null; payTab='req'; render(); }
function openReturn(id){ curReturn = DATA.returns.find(v=>v.id===id); curReceipt=null; curPayment=null; curAct=null; render(); }
function openAct(id){ curAct = DATA.acts.find(a=>a.id===id); curReceipt=null; curPayment=null; curReturn=null; render(); }
function back(){ curReceipt=null; curPayment=null; curReturn=null; curAct=null; render(); }

const VIEW_TITLES = {
  receipts:'Поступления', unresolved:'Невыясненные поступления', pay:'Платежи',
  returns:'Возвраты', registry:'Реестр ЦК', recon:'Сопоставление (сверка)',

const roleHint = (allowed, txt) => allowed ? '' :
  `<span class="role-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>${txt}</span>`;

/* заглушка этапа 1: экран переписывается на этапе 2 */
const stubView = (title, note, defects) => `<div class="page-pad">
