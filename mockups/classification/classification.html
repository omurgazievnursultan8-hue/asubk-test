<!--
  ═══════════════ ПАКЕТ ПЕРЕДАЧИ «КЛАССИФИКАЦИЯ» · 18.09.2026 · читать отсюда ═══════════════

  ПАКЕТ — ДВА ФАЙЛА, третьего нет:
    `classification.html`             — этот файл: исполняемый эталон интерфейса и поведения;
    `p19-klassifikatsiya-tasks.html`  — постановка, редакция 2: 25 задач (P19-R1…P19-R25),
                                        модель данных, правила, приёмка и границы каждой задачи.
  Расхождение ПО ЛОГИКЕ решает постановка, расхождение ПО ВИДУ ИНТЕРФЕЙСА — макет.

  ЧТО ЭТО ЗА ФАЙЛ. Рабочий прототип (single-file, TO-BE), не картинка: логика ниже
  ИСПОЛНЯЕТСЯ. Значение классификатора ХРАНИТСЯ интервалами «с — по» и при чтении не
  считается (ADR-0246): событие владельца ставит метку «пересчитать объект с даты D»,
  обработчик переписывает ряд объекта и свёртку заёмщика, изменение прошлого дня уходит в
  журнал перезаписи, ночной проход сверяет вчерашний день и пишет смены по дате, закрытие
  периода — защёлка в общем справочнике периодов, запрещающая правку. Конструктор правит
  редакцию, публикация проверяет её и отказывает списком, движок разбирает значения по
  предикатам, шов отдаёт хранимое значение с объяснением. Ничего из этого не зашито кодом:
  классификаторы собраны ИЗ ДАННЫХ, движок не знает ни Порядка №41, ни лестницы подгруппы.
  Ряды затравки не выдуманы: при загрузке прогон истории спрашивает владельцев на каждый
  день с 01.05.2026 и сжимает ответы в интервалы по тем же правилам, что обработчик.
  Открывается двойным щелчком, ничего не устанавливая; данные живут в памяти вкладки,
  перезагрузка возвращает исходное состояние.

  ЯЗЫК МОДУЛЯ. Значение назначается ПРАВИЛАМИ. Правило — конъюнкция (И) скалярных
  предикатов; правила одного значения связаны дизъюнкцией (ИЛИ). Скобок и вложенности нет:
  любая формулировка нормы раскладывается в этот вид (ДНФ), а вложенность нельзя ни
  прочитать глазами, ни объяснить заёмщику. Предикат — «показатель · оператор · КОНСТАНТА»;
  показателя справа не бывает. Слово «условие» в этом модуле не употребляется: оно занято
  договорным условием кредита.

  ЧЕГО В МОДУЛЕ НЕТ (граница проходит по глаголу: модуль не считает вход и не распоряжается выходом)
    · вычисления самих показателей — их считает модуль-владелец: дней просрочки и слой-источник
      даёт «Платежи», вид живой процедуры — «Взыскание», действующий ли кредит — «Кредиты»;
      классификация спрашивает владельца «показатель · объект · дата» и величин не хранит;
    · последствий значения: резервы, лимиты, штрафы, запрет выдачи, уведомления — не здесь;
      модуль отдаёт значение и объяснение, распоряжается им потребитель;
    · ручного проставления и правки значения или интервала — И-1: их пишет только движок;
    · выдумывания недостающего входа — И-20: «не отдан» не равно «ложь», объект получает
      интервал «нет данных» с названным показателем и владельцем;
    · записей фиксации: закрытие периода запирает интервалы, копии не пишет (И-26);
    · блокировок работы: просроченный срок отчёта п. 12 — предупреждение, а не запрет (И-14).

  check_points:ignore-start
  Пункты в правилах и отчёте — по редакции №41 от 06.07.2026 (11.1/11.2/11.3, 12, 16.1, 19.1).
  check_points:ignore-end

  ИНВАРИАНТЫ, КОТОРЫЕ РАЗРАБОТЧИК ОБЯЗАН СОХРАНИТЬ (И-1…И-26 — дословно из постановки; в
  комментариях кода они помечены «ИК-n», это тот же инвариант того же номера; встречающиеся
  там же коды вида ADR-nnnn — наши внутренние ссылки на решения, на смысл требования они не
  влияют. На экранах кодов нет: отказ и объяснение говорят словами)
  И-1  Значение нигде не вводится и не правится руками — его ставит движок. Ни экрана,
       ни интерфейса, ни миграции, которые бы его писали, не существует.
  И-2  Действующая редакция не правится: правка — это новый черновик, открытый копией
       действующей.
  И-3  Редакция публикуется только замкнутой: ровно одно значение по умолчанию, оно
       последнее в списке и без правил.
  И-4  Дата ввода в действие не раньше начала открытого периода и не позже сегодняшнего
       дня: публикация вводит редакцию немедленно, отложенного пуска в модели нет.
  И-5  Правило, ссылающееся на снятый показатель, на константу вне домена, на оператор
       не своего типа либо на пустой список у «одно из», публикацию не проходит.
  И-6  Свёртка «худшее по кредитам» разрешена только у редакции, объявившей себя
       сравнимой. Лестница подгруппы такого признака не несёт и не сворачивается.
  И-7  Объект вне области значения не получает: он хранит интервал «вне области» с
       причиной, и витрина говорит почему, а не ставит прочерк. Пустая область впускает
       всех.
  И-8  Закрытый период неизменен: его интервалы не меняются, и за него отдаётся хранимый
       интервал, а не пересчёт — в том числе по прежней редакции.
  И-9  Факт, наступивший в закрытом периоде, принимается, но учитывается с начала
       открытого; в реестре стоят обе даты.
  И-10 Факт без реквизитов решения комитета в показатель не попадает.
  И-11 Объяснение несёт все сработавшие правила выбранного значения, а не первое из них.
  И-12 Незачтённый факт виден в реестре фактов кредита с причиной из закрытого списка
       трёх: нет решения комитета · интервал истёк · ведёт к более лёгкому значению, чем
       выбранное.
  И-13 Периоды закрываются по порядку и только после окончания месяца; закрытый обратно
       не открывается.
  И-14 Классификация не запирает работу: просроченный срок сдачи отчёта п. 12 печатается
       предупреждением, а не блокировкой.
  И-15 Правило кредита вправе читать показатели заёмщика; обратного чтения нет — вниз
       идут показатели, вверх свёртка значений.
  И-16 Показатель, на который ссылается действующая редакция, с реестра не снимается.
  И-17 Значение без правил, не объявленное значением по умолчанию, недостижимо —
       редакция с ним не публикуется.
  И-18 «Дней просрочки» и «слой-источник просрочки» — пара одного владельца: одно число
       без имени слоя не показывается нигде.
  И-19 Классификатор не удаляется — он прекращает действие датой и причиной; интервалы
       закрытых периодов ссылаются на его редакции и обязаны остаться читаемыми.
  И-20 Показатель, которого владелец не отдал, не считается ложным: объект получает
       интервал «нет данных», отказ называет показатель и владельца. Молчаливый откат к
       значению по умолчанию запрещён — на категории риска он читается как «низкий риск»
       по причине отсутствия данных.
  И-21 Два правила одного значения с одним и тем же пунктом основания обязаны нести
       подпись — иначе объяснение назовёт пункт дважды и не скажет, что именно
       сработало.
  И-22 Две редакции одного классификатора не действуют одновременно: дата ввода строго
       позже начала действующей редакции, и публикация закрывает прошлую днём раньше
       даты ввода новой — стык без зазора и нахлёста.
  И-23 Своего календаря у модуля нет: период — строка общего справочника учётных
       периодов, закрытие классификации — колонка-защёлка в ней. Она ставится после
       защёлки учёта и раньше защёлки статистики.
  И-24 Значение хранится и при чтении не считается: витрина, шов, отчёт п. 12 и
       предпросмотр закрытия читают интервалы. Без записи движок считает только в сухом
       прогоне черновика — это «что было бы», а не «что есть».
  И-25 Метка пересчёта ставится в транзакции события; событие классификацию не ждёт.
       Вход, изменившийся без метки, ночной проход ловит сверкой вчерашнего дня и пишет
       в журнал как дефект стыка, а не исправляет молча.
  И-26 Закрытие запрещает правку интервалов, а не пишет их копию. Висящая метка с датой
       закрываемого месяца закрытие запрещает.
  Ни один исход не молчит: «черновик не классифицирует», «действующей редакции нет», «вне
  области», «нет данных», «действие прекращено», «обновляется» — у каждого свой текст,
  называющий причину.

.meta b{ color:var(--text-body); font-weight:var(--weight-medium); }
.kv{ display:grid; grid-template-columns:190px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }

/* ---- classifier picker ---- */
.clf{ display:block; width:100%; text-align:left; font:var(--font-label); padding:9px 11px; margin-bottom:6px;
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card); cursor:pointer; }
.clf.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); }
.clf b{ display:block; font-weight:var(--weight-semibold); color:var(--text-heading); margin-bottom:3px; }
.clf .small{ display:block; }

/* ---- value / rule editor ---- */
.val{ border:1px solid var(--border-default); border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden; }
.val-h{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface-panel); flex-wrap:wrap; }
.val-h .nm{ font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading); }
.val-h .acts{ margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; }
.val-b{ padding:10px 12px; }
.rule{ border-left:3px solid var(--asubk-blue-tint); padding:6px 0 6px 10px; margin-bottom:8px; }
.rule:last-child{ margin-bottom:0; }
.rule-h{ display:flex; align-items:center; gap:8px; font:var(--font-label); color:var(--text-muted); flex-wrap:wrap; }
.pred{ display:flex; align-items:center; gap:6px; margin:5px 0; flex-wrap:wrap; font:var(--font-label); }
.pred select, .pred input{ height:30px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 8px; }
.pred select:focus, .pred input:focus{ outline:none; border-color:var(--border-focus); box-shadow:var(--shadow-focus); }
/* Связки пишутся словом. «и» между предикатами правила, «или» между правилами значения:
   раньше «или» не было нарисовано вовсе, и два правила читались как одно (КФ-Д7). */
.and, .or{ display:inline-block; font:var(--font-label); text-transform:uppercase; letter-spacing:.04em; }
.and{ color:var(--text-muted); font-size:11.5px; margin:0 2px; }
.or{ color:var(--asubk-blue); font-size:11.5px; font-weight:var(--weight-semibold);
  padding:1px 8px; margin:2px 0 2px 10px; border-radius:10px; background:var(--asubk-blue-tint); }
.rule-sum{ font:var(--font-label); color:var(--text-body); margin:2px 0 6px; }
.rule-sum b{ font-weight:var(--weight-semibold); }
/* Множество значений — только члены домена: свободного ввода у ∈/∉ нет (ИК-5). */
.setbox{ display:flex; flex-wrap:wrap; gap:4px 10px; padding:5px 8px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); background:var(--surface-card); }
.setbox label{ display:flex; align-items:center; gap:4px; font:var(--font-label); color:var(--text-body); cursor:pointer; }
.setbox input{ height:auto; }
.setflat{ font:var(--font-label); color:var(--text-body); }
.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ height:var(--control-h); border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }

/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }
.facts .f.annul{ text-decoration:line-through; color:var(--text-placeholder); }
.frozen{ background:var(--asubk-gray-50); }

/* ---- модалка (дизайн-система: prompt/alert в макетах не используются) ---- */
.overlay{ position:fixed; inset:0; background:rgba(16,28,46,0.42); display:none;
  align-items:center; justify-content:center; z-index:60; padding:24px; }
.overlay.open{ display:flex; }
.modal{ background:var(--surface-card); border-radius:var(--radius-lg); width:min(640px,100%);
  max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }
.modal-h{ padding:18px 24px 12px; display:flex; align-items:center; gap:10px; }
.modal-h .mt{ font:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  color:var(--text-heading); flex:1; }
.modal-x{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); padding:4px;
  font-size:18px; line-height:1; }
.modal-x:hover{ color:var(--text-body); }
.modal-b{ padding:4px 24px 8px; overflow:auto; flex:1; }
.modal-b textarea{ width:100%; min-height:88px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); padding:8px 10px; font:var(--font-label); resize:vertical; }
.modal-f{ padding:14px 24px 20px; display:flex; gap:12px; justify-content:flex-end; }

/* ---- фильтр-чипы (реестр фактов: по судьбе фильтруют и считают, ИК-12) ---- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.chip{ border:1px solid var(--border-default); background:var(--surface-card); cursor:pointer;
  border-radius:var(--radius-pill); padding:5px 13px; font:var(--font-label); color:var(--text-body); }
.chip:hover{ background:var(--surface-hover); }
.chip.on{ background:var(--asubk-blue); border-color:var(--asubk-blue); color:#fff; }
.chip .n{ font-weight:var(--weight-semibold); margin-left:6px; }
/* Нехватка данных красится, а не прячется в общую графу: это чужой долг, а не норма (ИК-20). */
.chip.bad{ border-color:var(--asubk-red); color:var(--asubk-red); background:var(--status-error-bg); }
.bad{ color:var(--asubk-red); }

/* ---- крошки, тумблер пояснений ---- */
.crumb{ font:var(--font-label); color:var(--text-muted); }
.crumb-title.link{ cursor:pointer; color:var(--text-link); }
.crumb-title.link:hover{ text-decoration:underline; }

/* ---- вкладки карточки ---- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin:16px 0 14px; flex-wrap:wrap; }
.tab{ border:none; background:none; cursor:pointer; padding:9px 14px; margin-bottom:-1px;
  font:var(--font-label); color:var(--text-muted); border-bottom:2px solid transparent; }
.tab:hover{ color:var(--text-body); }
.tab.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }

/* ---- список: строка открывает карточку ---- */
table.cgrid tbody tr.pick{ cursor:pointer; }
table.cgrid tbody tr.pick:hover td{ background:var(--surface-hover); }
.rowname{ font-weight:var(--weight-medium); color:var(--text-link); }

/* ---- панель над списком: завести · поиск · фильтр ---- */
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search]{ height:32px; min-width:250px; border-radius:var(--radius-md);
  border:1px solid var(--border-strong); background:var(--surface-card);
  color:var(--text-body); font:var(--font-label); padding:0 10px; }
.toolbar input[type=search]:focus{ outline:none; border-color:var(--border-focus); box-shadow:var(--shadow-focus); }
.toolbar .chips{ margin:0; }

/* ---- toast ---- */
/* Выше .overlay (60): тост с причиной отказа рисовался ПОД затемнением модального окна и
   человеку виден не был вовсе — кнопка выглядела мёртвой (КФ-Д10). Причина окна печатается
   внутри окна (#modalErr), но и всякий другой тост обязан быть виден поверх всего. */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:70; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
/* ---- ссылки, текущий интервал, разбор по шагам ---- */
.lnk{ color:var(--text-link); cursor:pointer; text-decoration:none; }
.lnk:hover{ text-decoration:underline; }
table.cgrid tbody tr.cur td{ background:var(--asubk-blue-tint); }
details summary{ cursor:pointer; }
.trace{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.tr-step{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-body); margin:4px 0; }
.tr-ok{ color:var(--asubk-green); font-weight:var(--weight-semibold); }
.tr-no{ color:var(--asubk-red); font-weight:var(--weight-semibold); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Модуль «Классификация» · прототип TO-BE</small></div>
    <div class="nav">
      <div class="nav-sec">Настройка</div>
      <button class="nav-item" data-v="clf" onclick="CL.go('clf')">Классификаторы</button>
      <button class="nav-item" data-v="ind" onclick="CL.go('ind')">Реестр показателей</button>
      <div class="nav-sec">Работа</div>
      <button class="nav-item" data-v="facts" onclick="CL.go('facts')">Факты (п. 11)</button>
      <button class="nav-item" data-v="show" onclick="CL.go('show')">Витрина результата</button>
      <button class="nav-item" data-v="wait" onclick="CL.go('wait')">Ожидают пересчёта <span class="cnt" id="waitCnt"></span></button>

      <span class="crumb" id="crumb"></span>
      <div class="right">
        <span><label>Дата среза</label><select id="asOf" onchange="CL.setAsOf(this.value)"></select></span>
        <span><label>Роль</label><select id="role" onchange="CL.setRole(this.value)"></select></span>
      </div>

<div id="toastWrap"></div>

<script>
/* =====================================================================
 *  МОДУЛЬ «КЛАССИФИКАЦИЯ» — исполняемый прототип
 *  Слои файла: даты → справочники → состояние → владельцы показателей →
 *  движок → хранимые интервалы → метки и обработчик → шов → операции →
 *  ночной проход → закрытие периода → прогон истории → экраны.
 * ===================================================================== */
const CL = {};

/* ------------------------------ ДАТЫ ------------------------------- */
const MON = {'01':'январь','02':'февраль','03':'март','04':'апрель','05':'май','06':'июнь',
  '07':'июль','08':'август','09':'сентябрь','10':'октябрь','11':'ноябрь','12':'декабрь'};
const fmt   = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const ym    = iso => iso.slice(0,7);
const first = m => m+'-01';
const day15 = m => m+'-15';
const nextM = m => { let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const monLabel = m => MON[m.slice(5,7)]+' '+m.slice(0,4);
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);
/* Арифметика дат — в UTC: часовой пояс браузера не должен сдвигать сутки интервала. */
const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const lastDay = m => addDays(first(nextM(m)), -1);
const maxD = (a, b) => a > b ? a : b;
function dayRange(a, b){ const out = []; for(let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }
/* Метка времени «ГГГГ-ММ-ДД ЧЧ:ММ» печатается «ДД.ММ.ГГГГ ЧЧ:ММ». */
const fmtAt = at => at ? fmt(at.slice(0, 10)) + (at.length > 10 ? ' ' + at.slice(11) : '') : '—';

/* ------------------- СПРАВОЧНИК ФАКТОРОВ п. 11 --------------------- */
/* Зеркало нормы: вид фактора несёт уровень и пункт. Уровень выбирает не человек —
   он приходит из справочника вместе с видом (ADR-0122: вводится факт, не значение). */
const FACTOR_KINDS = [
  {id:'f-nonTarget', name:'Нецелевое использование средств',        level:'высокий', norm:'п. 11.3'},
  {id:'f-lostColl',  name:'Утрата предмета залога',                 level:'высокий', norm:'п. 11.3'},
  {id:'f-hide',      name:'Сокрытие имущества от взыскания',        level:'высокий', norm:'п. 11.3'},
  {id:'f-noAct',     name:'Уклонение от подписания акта сверки',    level:'средний', norm:'п. 11.2'},
  {id:'f-collDown',  name:'Ухудшение состояния предмета залога',    level:'средний', norm:'п. 11.2'},
  {id:'f-noReport',  name:'Непредставление отчётности по кредиту',  level:'средний', norm:'п. 11.2'}
];
const KIND = id => FACTOR_KINDS.find(k=>k.id===id);

const ROLES = ['Администратор классификации','Кредитный инспектор','Наблюдатель'];
/* Владельцы входа, которых классификация спрашивает на пересчёте (ADR-0246 §9). Себя она не
   спрашивает: уровень фактора сворачивает из собственного реестра фактов. */
const OWNERS = ['Платежи','Кредиты','Взыскание','Заёмщик'];

/* ---------------------------- СОСТОЯНИЕ ---------------------------- */
/* Всё, что модуль знает, лежит здесь. Объекты (кредиты, заёмщики) и история их событий —
   зеркало соседних модулей: читаются, не правятся (ADR-0124, И-11). Хранимые интервалы
   затравка не выдумывает — их пишет прогон истории по тем же правилам, что обработчик
   (CL.replay в конце файла). */
function seed(){
  const st = {
    today:'2026-08-14',
    role:'Администратор классификации',
    asOf:'2026-08-14',
    view:'clf',
    /* Маршрут: curClf/curInd/curObj пусты — показан список, заполнены — карточка. Держится в
       состоянии, а не в DOM, чтобы смоук проверял разметку экрана так же, как браузер. */
    curClf:null, clfVer:null, clfTab:'values',
    curInd:null, indQ:'', indObj:'все',
    curObj:null, showFilter:null, shownQ:{T:'', X:''},
    nightFilter:null, repPeriod:null,
    /* Набранное в форме заведения факта держится в состоянии: любое действие перерисовывает
       панель целиком, и форма, жившая только в DOM, обнулялась вместе с ней — отказ по одному
       полю стирал все четыре (КФ-Д11). */
    factForm:{credit:'', kind:'', when:'', doc:'', until:''},
    factFilter:null,
    /* Часы макета: каждое действие сдвигает их на минуту, первое за день — 10:14. Прогон
       повторяем, а время в журнале перезаписи читается как настоящее. */
    minute:10 * 60 + 13,
    handler:{running:true},           /* обработчик меток; в макете его можно остановить */
    ownersDown:{},                    /* владельцы, которые не отвечают (имитация сбоя связи) */
    intervals:[], markers:[], rewrites:[], night:[], lastPass:null,
    log:[]
  };

  /* --- ОБЩИЙ СПРАВОЧНИК УЧЁТНЫХ ПЕРИОДОВ (ADR-0204, ИК-23) ---
     Своего календаря у классификации нет: строка — месяц, колонки-защёлки — слои. Колонка
     классификации ставится после колонки учёта, колонка статистики — после классификации. */
  st.periods = [
    {m:'2026-05', uchet:{at:'2026-06-02'}, klass:{by:'Сламкулов А. О.', at:'2026-06-04'}, stat:{at:'2026-06-05'}},
    {m:'2026-06', uchet:{at:'2026-07-02'}, klass:{by:'Сламкулов А. О.', at:'2026-07-03'}, stat:{at:'2026-07-06'}},
    {m:'2026-07', uchet:{at:'2026-08-04'}, klass:null, stat:null},
    {m:'2026-08', uchet:null, klass:null, stat:null}
  ];

  /* --- РЕЕСТР ПОКАЗАТЕЛЕЙ (ADR-0120 §1) ---
     Именованный вход: объект, тип, источник, владелец. Способа вычисления реестр не хранит.
     «События» — чем владелец двигает показатель и в чьей транзакции ставит метку пересчёта
     (ИК-25); «по дате» — как показатель меняется без события: это ловит ночной проход.
     Квантор по коллекции свёрнут ВНУТРЬ показателя-перечисления (ADR-0125 §1), поэтому
     предикат остаётся скалярным. */
  st.indicators = [
    {id:'daysOverdue', name:'Дней просрочки (худший слой)', obj:'кредит', type:'число',
     src:'расчёт', owner:'Платежи', retired:false,
     events:['проведение платежа','сторно платежа','отзыв расчёта'],
     byDate:'растёт каждый день без события: первый день просрочки (п. 16.1) и 181-й день (п. 19.1) ловит ночной проход',
     pair:'overdueLayer',
     note:'Пара с «слой-источник»: считаются одним расчётом и отдаются одним ответом.'},
    {id:'overdueLayer', name:'Слой-источник просрочки', obj:'кредит', type:'перечисление',
     domain:['нет просрочки','свободный слой','мировое соглашение','реструктуризация'],
     src:'расчёт', owner:'Платежи', retired:false,
     events:['проведение платежа','сторно платежа','отзыв расчёта'], byDate:'вместе с днями просрочки'},
    {id:'creditActive', name:'Кредит действующий', obj:'кредит', type:'булево',
     src:'расчёт', owner:'Кредиты', retired:false, events:['выдача кредита','закрытие кредита']},
    {id:'factorLevel', name:'Максимальный уровень действующего фактора п. 11', obj:'кредит',
     type:'перечисление', domain:['нет','средний','высокий'],
     src:'ввод факта', owner:'Классификация', retired:false,
     events:['факт заведён','факт получил решение комитета','факт аннулирован'],
     byDate:'истечение срока действия факта',
     note:'Свёртка засчитанных фактов кредита; факт без решения комитета в неё не входит.'},
    {id:'defer181', name:'Перевод на 181-й день отложен', obj:'кредит', type:'булево',
     src:'расчёт', owner:'Взыскание', retired:false,
     events:['заявление на реструктуризацию принято','рассмотрение завершено']},
    {id:'procKind', name:'Максимальный вид живой подтверждённой процедуры', obj:'заёмщик',
     type:'перечисление', domain:['нет','суд','исполнительные листы','инициирование банкротства'],
     src:'расчёт', owner:'Взыскание', retired:false,
     events:['процедура подтверждена','процедура завершена']},
    {id:'roleEnd', name:'Терминальный исход роли', obj:'заёмщик', type:'перечисление',
     domain:['нет','полное погашение','признана безнадёжной','завершено банкротство'],
     src:'расчёт', owner:'Заёмщик', retired:false, events:['исход роли зафиксирован']},
    {id:'everCredits', name:'Кредиты были когда-либо', obj:'заёмщик', type:'булево',

CL.canEditConstructor = () => CL.state.role === 'Администратор классификации';

/* ------------------- ПЕРИОДЫ (ADR-0204, ИК-13, ИК-23) --------------------- */
CL.period     = m => CL.state.periods.find(p => p.m === m) || null;
CL.ensurePeriod = m => { if(!CL.period(m)) CL.state.periods.push({m, uchet:null, klass:null, stat:null}); };
CL.isClosed   = dateISO => { const p = CL.period(ym(dateISO)); return !!(p && p.klass); };
CL.closedMonths = () => CL.state.periods.filter(p => p.klass).map(p => p.m);
CL.openPeriod = () => (CL.state.periods.find(p => !p.klass) || {}).m;
CL.startOfOpen = () => first(CL.openPeriod());
CL.lastClosedDay = () => addDays(CL.startOfOpen(), -1);
CL.periodStatus = m => CL.isClosed(first(m)) ? 'закрыт' : m === CL.openPeriod() ? 'открыт' : 'будущий';

/* ------------------------------ ЧАСЫ ------------------------------- */
CL.tick = () => { CL.state.minute++; };
CL.now  = () => { const m = CL.state.minute; return CL.state.today + ' ' +
  String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

/* ---------------- ВЛАДЕЛЬЦЫ ПОКАЗАТЕЛЕЙ ---------------------------- *
 * Считает владелец данных, а не классификация: реестр хранит имя владельца, но не способ
 * вычисления (ADR-0120 §2, ADR-0125 §1). На пересчёте движок спрашивает «показатель · объект ·
 * дата» и получает значение либо «не отдан» — молчание, а не ложь и не ноль (ADR-0246 §9).
 * Недоступный владелец — не ответ, а сбой: запрос бросает исключение, пересчёт объекта
 * прерывается целиком, метка висит (ADR-0246 §9).
 * ------------------------------------------------------------------- */
function ownerDown(owner){ const e = new Error('владелец «' + owner + '» не ответил'); e.owner = owner; return e; }
function reach(owner){ if(CL.state.ownersDown[owner]) throw ownerDown(owner); }
/* Платежи: дни просрочки слоя на конец дня — от самого старого взноса, не оплаченного к концу
   этого дня (взнос с датой D просрочен с D+1). */
function layerDays(layer, d){
  let oldest = null;
  (layer.dues || []).forEach(x => {
    if(x.due < d && (!x.paid || x.paid > d) && (!oldest || x.due < oldest)) oldest = x.due;
  });
  return oldest ? daysBetween(oldest, d) : 0;
}
/* Расчёт по кредиту не заведён либо отозван — владелец отвечает «не отдан». */
function noCalc(credit, d){ return !!credit.noCalcFrom && credit.noCalcFrom <= d; }
/* Платежи: свёртка по слоям требования. Число и слой отдаются ОДНИМ ответом (ИК-18). */
function overdueOf(credit, d){
  reach('Платежи');
  /* Расчёта нет — это НЕ ноль: ноль означал бы «просрочки нет», а здесь неизвестно (ИК-20).
     Оба показателя пары молчат вместе (ИК-18). */
  if(noCalc(credit, d) || !credit.layers.length) return {days:undefined, layer:undefined};
  const ls = credit.layers.map(l => ({name:l.name, days:layerDays(l, d)}));
  const worst = ls.reduce((a, l) => l.days > a.days ? l : a, ls[0]);
  return worst.days > 0 ? {days:worst.days, layer:worst.name} : {days:0, layer:'нет просрочки'};
}
CL.overdueOf = overdueOf;
const creditActive = (c, d) => c.issued <= d && (!c.closed || d < c.closed);
const deferSpan = (c, d) => (c.defer || []).find(s => s.from <= d && d <= s.until) || null;
const histAt = (hist, d) => { let v = null; (hist || []).forEach(h => { if(h.from <= d) v = h.v; }); return v; };
/* Классификация: свёртка засчитанных фактов кредита в уровень (ADR-0122). Аннулированный
   факт не действует ни на одну дату открытого периода — метка ставится с его «учтён с». */
CL.countedFacts = (creditId, dateISO) => {
  const d = dateISO || CL.state.today;
  return CL.state.facts.filter(f => f.creditId === creditId && !f.annulled && !!f.doc &&
    f.counted <= d && (!f.until || f.until >= d));
};
function factorLevelOf(creditId, d){
  const lv = CL.countedFacts(creditId, d).map(f => KIND(f.kindId).level);
  return lv.includes('высокий') ? 'высокий' : lv.includes('средний') ? 'средний' : 'нет';
}
CL.indicatorsOfCredit = (credit, dateISO) => {
  const d = dateISO || CL.state.today;
  const o = overdueOf(credit, d);
  reach('Кредиты'); reach('Взыскание');
  return { daysOverdue:o.days, overdueLayer:o.layer, creditActive:creditActive(credit, d),
           defer181:!!deferSpan(credit, d), factorLevel:factorLevelOf(credit.id, d) };
};
CL.indicatorsOfBorrower = (b, dateISO) => {
  const d = dateISO || CL.state.today;
  reach('Кредиты'); reach('Взыскание'); reach('Заёмщик');
  const mine = CL.state.credits.filter(c => c.inn === b.inn && c.issued <= d);
  const live = mine.filter(c => creditActive(c, d));
  /* Свёртка «есть просрочка» неизвестна, пока молчит хоть один действующий кредит: «нет»
     здесь означало бы «проверено и не нашли», а проверено не всё (ИК-20). Владелец показателя
     обязан вернуть «не отдан», а не удобный ответ. */
  const blind = live.some(c => noCalc(c, d) || !c.layers.length);
  return { procKind:histAt(b.proc, d) || 'нет', roleEnd:histAt(b.roleEnd, d) || 'нет',
           everCredits:mine.length > 0, hasActive:live.length > 0,
           anyOverdue: blind ? undefined : live.some(c => overdueOf(c, d).days > 0) };
};
CL.valuesOf = (objType, objId, dateISO) => objType === 'кредит'
  ? CL.indicatorsOfCredit(CL.credit(objId), dateISO)
  : CL.indicatorsOfBorrower(CL.borrower(objId), dateISO);
/* Объект существует с даты выдачи: до неё ни интервалов, ни значения у кредита нет (КФ-Д21). */
CL.objectExists = (objType, objId, d) => objType === 'кредит'
  ? !!CL.credit(objId) && CL.credit(objId).issued <= d
  : !!CL.borrower(objId);
CL.objectsOf = (objType, d) => objType === 'кредит'
  ? CL.state.credits.filter(c => c.issued <= d).map(c => ({type:'кредит', id:c.id}))
  : CL.state.borrowers.map(b => ({type:'заёмщик', id:b.inn}));

/* ------------------------- ДВИЖОК ---------------------------------- *
 * Знает предикаты, порядок разбора, область и значение по умолчанию.
 * Ни Порядка №41, ни лестницы подгруппы здесь нет (ADR-0120, ADR-0124).
 * ------------------------------------------------------------------- */
CL.ind = id => CL.state.indicators.find(i => i.id === id);
CL.clf = id => CL.state.classifiers.find(c => c.id === id);
CL.credit = id => CL.state.credits.find(c => c.id === id);
CL.borrower = inn => CL.state.borrowers.find(b => b.inn === inn);
CL.activeVer = clfId => (CL.clf(clfId).versions || []).find(v => v.status === 'действующая') || null;
CL.draftVer  = clfId => (CL.clf(clfId).versions || []).find(v => v.status === 'черновик') || null;
CL.editionNo = (clfId, no) => (CL.clf(clfId).versions || []).find(v => v.no === no) || null;
/* Редакция, действовавшая на дату: «с — по» включительно, черновик не действует никогда. */
CL.editionAt = (clfId, d) => (CL.clf(clfId).versions || []).find(v =>
  v.status !== 'черновик' && v.from && v.from <= d && (!v.until || d <= v.until)) || null;
/* Последняя опубликованная редакция — та, чьё начало сторожит ИК-22, даже если действие
   классификатора прекращено. */
CL.lastEdition = clfId => (CL.clf(clfId).versions || []).filter(v => v.status !== 'черновик')
  .sort((a, b) => b.no - a.no)[0] || null;

/* Правая часть предиката — ТОЛЬКО константа: скалярная (p.v) либо множество членов
   домена (p.set) у ∈/∉. Показателя справа нет намеренно: «стоимость залога покрывает
   обязательства» (п. 11.1) сворачивает владелец залога — тот же довод, которым ADR-0125 §1
   убрал квантор внутрь показателя (ADR-0137 §4). Множество — константа, а не коллекция
   записей, поэтому предикат остаётся скалярным (ADR-0137 §2). */
const SET_OPS = ['∈','∉'];
const NUM_OPS = ['>','≥','<','≤'];
function testPred(p, vals){
  const a = vals[p.i];
  if(p.op === '∈')  return (p.set || []).indexOf(a) >= 0;
  if(p.op === '∉')  return (p.set || []).indexOf(a) < 0;
  if(p.op === '=')  return a === p.v;
  if(p.op === '≠')  return a !== p.v;
  if(p.op === '>')  return Number(a) >  Number(p.v);
  if(p.op === '≥')  return Number(a) >= Number(p.v);
  if(p.op === '<')  return Number(a) <  Number(p.v);
  if(p.op === '≤')  return Number(a) <= Number(p.v);
  return false;
}
/* Правило срабатывает, когда верны ВСЕ его предикаты. Пустое правило не срабатывает
   никогда: «ни одного предиката» — это не «любой объект подходит», а недописанный черновик. */
function ruleFires(r, vals){
  return !!(r.preds && r.preds.length && r.preds.every(p => testPred(p, vals)));
}
function shownVal(v){
  if(v === undefined || v === null) return 'не отдан';
  return typeof v === 'boolean' ? (v ? 'да' : 'нет') : String(v);
}
function constOf(p){
  return SET_OPS.indexOf(p.op) >= 0 ? (p.set || []).map(shownVal).join(', ') : shownVal(p.v);
}
CL.constOf = constOf;
/* Оператор печатается словами: объяснение читает проверяющий, а не программист. */
function opWord(op){ return op === '∈' ? 'одно из' : op === '∉' ? 'ни одно из' : op; }
CL.opWord = opWord;
/* Предикат с ответом владельца: «сейчас» — на сегодня, иначе с датой, на которую спрошено. */
function phrase(p, vals, when){
  const ind = CL.ind(p.i);
  /* Число пары печатается только вместе с парным показателем: «214» без имени слоя
     запрещено (ИК-18). Какой показатель парный — говорит реестр, а не код. */
  const pair = ind && ind.pair && vals[p.i] !== undefined && vals[ind.pair] !== undefined
    ? ' · ' + CL.ind(ind.pair).name.toLowerCase() + ': ' + shownVal(vals[ind.pair]) : '';
  const got = shownVal(vals[p.i]) + pair;
  return (ind ? ind.name.toLowerCase() : p.i) + ' ' + opWord(p.op) + ' ' + constOf(p) +
         (when ? ' (на ' + fmt(when) + ': ' + got + ')' : ' (сейчас ' + got + ')');
}
CL.phrase = phrase;
/* Сводка правила в одну строку — подпись впереди, если она есть (ИК-21). */
function ruleText(r, vals, when){
  const body = (r.preds || []).map(p => phrase(p, vals, when)).join(' и ');
  return r.label ? r.label + ': ' + body : body;
}
/* Та же сводка без ответа владельца — в таком виде она хранится в «почему» интервала:
   величина показателя в интервал не пишется, иначе ряд резался бы каждый день (ADR-0246 §2). */
function predSig(p){
  const ind = CL.ind(p.i);
  return (ind ? ind.name.toLowerCase() : p.i) + ' ' + opWord(p.op) + ' ' + constOf(p);
}
function ruleSig(r){
  const body = (r.preds || []).map(predSig).join(' и ');
  return r.label ? r.label + ': ' + body : body;
}
function scopeSig(scope){
  return scope.length === 1
    ? (scope[0].preds || []).map(predSig).join(' и ')
    : 'не выполнено ни одно из правил входа — ' +
      scope.map((r, i) => '(' + (i + 1) + ') ' + ruleSig(r)).join('; ');
}

/* --- НЕХВАТКА ДАННЫХ (ИК-20) ---
   Молчаливое «ложно» на неотданном показателе — худший из исходов: правило не срабатывает,
   объект съезжает к значению по умолчанию и выглядит классифицированным. На категории риска
   это «низкий риск по отсутствию данных» — ровно та ошибка, за которую наказывает проверка (ADR-0137 §5). */
function hasVal(vals, id){ const v = vals[id]; return v !== undefined && v !== null; }
function missingIn(rules, vals){
  const miss = [];
  (rules || []).forEach(r => (r.preds || []).forEach(p => {
    if(!hasVal(vals, p.i) && miss.indexOf(p.i) < 0) miss.push(p.i);
  }));
  return miss;
}
function noDataWhy(miss, where){
  return ['классифицировать нечем: ' + miss.map(id => {
    const i = CL.ind(id);
    return '«' + (i ? i.name : id) + '» (владелец — ' + (i ? i.owner : '—') + ')';
  }).join(', ') + ' не отдан' + (miss.length > 1 ? 'ы' : '') +
  ', а ' + where + ' на ' + (miss.length > 1 ? 'них' : 'нём') + ' стоит'];
}
/* Все правила версии одним списком — для проверки полноты данных ДО разбора. */
function allRules(ver){
  return (ver.values || []).reduce((acc, v) => acc.concat(v.rules || []), []);
}
/* Провал дизъюнкции одной строкой не объяснить: перечисляются все альтернативы (ИК-7). */
function scopeWhy(scope, vals, when){
  /* У одной альтернативы подпись правила ничего не добавляет — она повторяет сам предикат.
     У нескольких она единственное, чем они различаются, и печатается. */
  return scope.length === 1
    ? (scope[0].preds || []).map(p => phrase(p, vals, when)).join(' и ')
    : 'не выполнено ни одно из правил входа — ' +
      scope.map((r, i) => '(' + (i + 1) + ') ' + ruleText(r, vals, when)).join('; ');
}

/* Результат: {ok, code, label, index, fired:[{norm,text,rule}], why:[…]} либо отказ с причиной.
   Отказ никогда не молчит — у него есть текст (§0.3). */
CL.classifyWith = (ver, vals, sim) => {
  if(!ver) return {ok:false, why:['действующей версии нет — классификатор ничего не назначает']};
  /* sim=true — сухой прогон черновика (CL.dryRun): считает, но никому не назначает. ИК-1 цел:
     значение по-прежнему ставит только движок действующей редакции. */
  if(ver.status === 'черновик' && !sim) return {ok:false, draft:true, why:['версия в черновике — не классифицирует']};
  /* Область — такой же список правил, как у значения: правила через ИЛИ, предикаты внутри
     правила через И (ADR-0137 §3). Пустая область = все объекты типа, вход открыт всем. */
  const scope = ver.scope || [];
  /* Порядок проверок: данные области → область → данные значений → разбор.
     Показатели значений спрашиваются ТОЛЬКО у того, кто в область вошёл: «вне области» —
     дешёвый и законный исход (ИК-7), он не вправе требовать данных, до которых дела нет. */
  if(scope.length){
    const missScope = missingIn(scope, vals);
    if(missScope.length) return {ok:false, nodata:true, miss:missScope, where:'область', why:noDataWhy(missScope, 'область')};
    if(!scope.some(r => ruleFires(r, vals)))
      return {ok:false, out:true, why:['вне области классификатора: ' + scopeWhy(scope, vals)]};
  }
  const miss = missingIn(allRules(ver), vals);
  if(miss.length) return {ok:false, nodata:true, miss, where:'правило редакции', why:noDataWhy(miss, 'правило редакции')};
  for(let idx = 0; idx < ver.values.length; idx++){
    const v = ver.values[idx];
    /* Разбор останавливается на первом сработавшем ЗНАЧЕНИИ, но внутри значения проверяются
       ВСЕ правила и отдаются все сработавшие: снятие одной причины значения не двинет (ИК-11). */
    const fired = (v.rules || []).filter(r => ruleFires(r, vals));
    if(fired.length) return {ok:true, code:v.code, label:v.label, index:idx,
      fired: fired.map(r => ({norm:r.norm, label:r.label || '', text:ruleText(r, vals), rule:r})),
      why: fired.map(r => ruleText(r, vals) + ' — ' + r.norm)};
    if(v.dflt) return {ok:true, code:v.code, label:v.label, index:idx, fired:[],
      why:['ни одно правило выше не сработало — ' + (v.norm || 'значение по умолчанию')]};
  }
  return {ok:false, unclosed:true, why:['версия не замкнута: значения по умолчанию нет']};
};
/* Расчёт по объекту на дату — ВНУТРЕННИЙ вызов обработчика, ночного прохода и сухого прогона.
   Витрина, шов, отчёт п. 12 и предпросмотр закрытия его не зовут: они читают хранимое (ИК-24). */
CL.compute = (clfId, objType, objId, dateISO) => {
  const d = dateISO || CL.state.today;
  const clf = CL.clf(clfId);
  const ver = CL.editionAt(clfId, d);
  /* Классификатор с прекращённым действием тоже не молчит: причина и дата названы (ИК-19, §0.3). */
  if(!ver && clf && clf.stopped && d >= clf.stopped.from)
    return {ok:false, stopped:true, why:['действие классификатора прекращено с ' + fmt(clf.stopped.from) +
      ': ' + clf.stopped.reason + ' — интервалы прошлых дат читаются по-прежнему']};
  /* Классификатор, у которого есть только черновик, — законное состояние, а не поломка:
     он ничего не назначает и говорит об этом прямо (ADR-0125 §2, §0.3). */
  if(!ver && CL.draftVer(clfId) && !CL.lastEdition(clfId))
    return {ok:false, draft:true, why:['действующей редакции нет — черновик значений не назначает']};
  if(!ver) return {ok:false, none:true, why:['на ' + fmt(d) + ' у классификатора нет действующей редакции']};
  return CL.classifyWith(ver, CL.valuesOf(objType, objId, d));
};

/* --------------------- ХРАНИМЫЙ ОТВЕТ (ADR-0246 §2) --------------------- *
 * Ответ на дату в той форме, в какой он хранится: состояние · значение · редакция · строки
 * «почему». Величин показателей в нём нет. null — ответа нет вовсе: объекта на эту дату ещё
 * нет либо не действует ни одна редакция — тогда и интервала нет.
 * ------------------------------------------------------------------- */
/* Засчитанные факты в «почему» — те, что держат сработавшее правило: факт с уровнем, на
   который правило смотрит. Факт, который ни одного правила не держит, ряд не режет — иначе
   F-005 (средний при выбранном высоком) открыл бы интервал, ничего не изменив (КФ-48). */
function factsOf(fired, creditId, d){
  const levels = [];
  fired.forEach(f => (f.rule.preds || []).forEach(p => {
    if(p.i !== 'factorLevel') return;
    if(p.op === '=') levels.push(p.v);
    if(p.op === '∈') (p.set || []).forEach(x => levels.push(x));
  }));
  return levels.length ? CL.countedFacts(creditId, d).filter(f => levels.includes(KIND(f.kindId).level)) : [];
}
CL.answer = (clfId, objType, objId, d) => {
  if(!CL.objectExists(objType, objId, d)) return null;
  const ver = CL.editionAt(clfId, d);
  if(!ver) return null;
  const r = CL.classifyWith(ver, CL.valuesOf(objType, objId, d));
  if(r.out) return {state:'вне области', verNo:ver.no, why:[{k:'scope', text:scopeSig(ver.scope || [])}]};
  if(r.nodata) return {state:'нет данных', verNo:ver.no,
    why:[{k:'nodata', miss:r.miss, text:noDataWhy(r.miss, r.where)[0]}]};
  if(!r.ok) return {state:'нет данных', verNo:ver.no, why:[{k:'nodata', miss:[], text:r.why[0]}]};
  const why = r.fired.length
    ? r.fired.map(f => ({k:'rule', norm:f.norm, label:f.label, sig:ruleSig(f.rule)}))
    : [{k:'default', norm:ver.values[r.index].norm || 'значение по умолчанию'}];
  if(objType === 'кредит') factsOf(r.fired, objId, d).forEach(f => {
    const k = KIND(f.kindId);
    why.push({k:'fact', id:f.id, name:k.name, norm:k.norm, doc:f.doc, counted:f.counted, occurred:f.occurred});
  });
  return {state:'есть', code:r.code, label:r.label, verNo:ver.no, why};
};
/* Строка «почему» словами — так её отдаёт шов и печатает витрина. */
function whyLine(w){
  if(w.k === 'rule') return w.sig + ' — ' + w.norm;
  if(w.k === 'default') return 'ни одно правило выше не сработало — ' + w.norm;
  if(w.k === 'fact') return 'факт ' + w.id + ' «' + w.name + '» (' + w.norm + '), ' + w.doc +
    ' — учтён с ' + fmt(w.counted) + (w.counted !== w.occurred ? ', наступил ' + fmt(w.occurred) : '');
  if(w.k === 'scope') return 'вне области классификатора: ' + w.text;
  if(w.k === 'nodata') return w.text;
  if(w.k === 'source') return 'худшее по кредитам заёмщика — ' + w.credit + ': ' + w.label + ' (редакция ' + w.verNo + ')';
  if(w.k === 'fold-nodata') return 'свёртка невозможна: по кредиту ' + w.credit + ' значения нет — ' + w.text;
  if(w.k === 'fold-empty') return 'в области классификатора нет ни одного кредита заёмщика — категории нет';
  return String(w.text || '');
}
CL.whyLine = whyLine;
const ansOf = iv => iv ? {state:iv.state, code:iv.code, label:iv.label, verNo:iv.verNo, why:iv.why} : null;
/* Ключ сравнения ответов: новый интервал — только при смене состояния, значения, редакции,
   правил или фактов (ADR-0246 §2). */
const keyOf = a => a ? JSON.stringify([a.state, a.code || '', a.verNo, a.why]) : '∅';
CL.keyOf = keyOf;

/* Свёртка «худшее по кредитам» — ответ классификатора риска у заёмщика; своего классификатора
   риска у заёмщика нет (ADR-0121). Её пишет обработчик
   сразу после кредитов и хранит своими интервалами (ADR-0246 §3); читает она ответы кредитов
   на ту же дату, а не разбирает их заново. Тяжесть — индекс значения внутри редакции, которой
   ответ получен. В «почему» — кредит-источник, а не его правила: правила живут в его ряду. */
function foldAnswer(inn, d, ansOfCredit){
  const ver = CL.editionAt('risk', d);
  if(!ver || !ver.comparable) return null;
  const mine = CL.state.credits.filter(c => c.inn === inn && c.issued <= d);
  const all = mine.map(c => ({c, a:ansOfCredit(c.id)})).filter(x => x.a);
  /* Худшее из неполного набора — не худшее. Один кредит без данных — и у заёмщика интервал
     «нет данных» с названием кредита, иначе категория вышла бы мягче настоящей (ИК-20). */
  const blind = all.find(x => x.a.state === 'нет данных');
  if(blind) return {state:'нет данных', verNo:ver.no,
    why:[{k:'fold-nodata', credit:blind.c.id, text:whyLine(blind.a.why[0])}]};
  const each = all.filter(x => x.a.state === 'есть');
  if(!each.length) return {state:'вне области', verNo:ver.no, why:[{k:'fold-empty'}]};
  const idx = x => (CL.editionNo('risk', x.a.verNo) || ver).values.findIndex(v => v.code === x.a.code);
  /* Порядок разбора при объявленной сравнимости идёт от тяжёлого, поэтому worst-of —
     это минимальный индекс значения. Отдельного ранга у значения нет (ADR-0126 §1–2). */
  const worst = each.reduce((a, x) => idx(x) < idx(a) ? x : a, each[0]);
  return {state:'есть', code:worst.a.code, label:worst.a.label, verNo:ver.no,
    why:[{k:'source', credit:worst.c.id, label:worst.a.label, verNo:worst.a.verNo}]};
}

/* ---------------------- ХРАНИЛИЩЕ ИНТЕРВАЛОВ (ADR-0246) --------------------- *
 * Ряд «с — по» у каждого объекта по каждому классификатору, без пропусков и наложений на
 * отрезке действия редакций. «По» пусто — по сей день. Писатель один — обработчик движка.
 * ------------------------------------------------------------------- */
const sameObj = (iv, clf, type, id) => iv.clf === clf && iv.type === type && iv.id === id;
CL.store = {
  series: (clf, type, id) => CL.state.intervals.filter(iv => sameObj(iv, clf, type, id))
    .sort((a, b) => a.from < b.from ? -1 : 1),
  at: (clf, type, id, d) => CL.state.intervals.find(iv => sameObj(iv, clf, type, id) &&
    iv.from <= d && (!iv.until || d <= iv.until)) || null,
  answerAt: (clf, type, id, d) => ansOf(CL.store.at(clf, type, id, d)),
  /* Сторож базы (ИК-26): интервал на дату закрытого месяца не создаётся, не правится и не
     удаляется. Исключение одно — «по» интервала, пересекающего границу: его вправе поставить
     датой не раньше последнего дня закрытого месяца. В целевой модели это запрет базы, а не
     проверка интерфейса; в макете — единственный путь записи, мимо которого писать нечем. */
  guard: d => CL.isClosed(d)
    ? 'интервал на ' + fmt(d) + ' лежит в закрытом месяце ' + monLabel(ym(d)) + ' — база правку отклоняет'
    : null,
  setUntil: (iv, until) => {
    const L = CL.lastClosedDay();
    if(iv.from <= L && (until < L || (iv.until && iv.until < L)))
      return {ok:false, why:'«по» интервала с ' + fmt(iv.from) + ' ставится не раньше ' + fmt(L) +
        ' — последнего дня закрытого месяца; прочие его поля не меняются'};
    iv.until = until;
    return {ok:true};
  },
  add: iv => {
    const bad = CL.store.guard(iv.from);
    if(bad) return {ok:false, why:bad};
    CL.state.intervals.push(iv);
    return {ok:true};
  },
  remove: iv => {
    const bad = CL.store.guard(iv.from);
    if(bad) return {ok:false, why:bad};
    CL.state.intervals = CL.state.intervals.filter(x => x !== iv);
    return {ok:true};
  },
  /* Переписать ряд объекта с даты D по сегодня ответами days[] (по одному на день). Первый
     день, где ответ разошёлся с хранимым, — F. Изменение на день раньше сегодняшнего —
     перезапись: заменённые интервалы целиком уходят в журнал (ADR-0246 §8). Движение вперёд —
     закрыть текущий интервал вчерашним днём и открыть новый — в журнал не пишется. */
  rewrite: (key, D, days, cause, at) => {
    const {clf, type, id} = key;
    const today = CL.state.today;
    const bad = CL.store.guard(D);
    if(bad) return {ok:false, why:bad};
    const old = CL.store.series(clf, type, id);
    const oldAt = d => ansOf(old.find(iv => iv.from <= d && (!iv.until || d <= iv.until)));
    let fi = -1;
    for(let i = 0; i < days.length; i++) if(keyOf(oldAt(addDays(D, i))) !== keyOf(days[i])){ fi = i; break; }
    if(fi < 0) return {ok:true, changed:false};
    const F = addDays(D, fi);
    const hit = old.filter(iv => !iv.until || iv.until >= F);
    if(F < today) CL.state.rewrites.push({at, clf, type, id, D, F, cause,
      was:hit.map(iv => JSON.parse(JSON.stringify(iv)))});
    hit.filter(iv => iv.from >= F).forEach(iv => CL.store.remove(iv));
    const cut = hit.find(iv => iv.from < F);
    if(cut) CL.store.setUntil(cut, addDays(F, -1));
    /* Ответ дня F может совпасть с интервалом, закончившимся накануне, — тогда он продлевается,
       а не рядом открывается второй с тем же ответом. */
    let cur = CL.store.series(clf, type, id).find(iv => iv.until === addDays(F, -1)) || null;
    for(let i = fi; i < days.length; i++){
      const d = addDays(D, i), a = days[i];
      if(!a){ if(cur && (!cur.until || cur.until >= d)) CL.store.setUntil(cur, addDays(d, -1)); cur = null; continue; }
      if(cur && keyOf(ansOf(cur)) === keyOf(a)){ cur.until = null; continue; }
      if(cur && (!cur.until || cur.until >= d)) CL.store.setUntil(cur, addDays(d, -1));
      cur = Object.assign({clf, type, id, from:d, until:null}, JSON.parse(JSON.stringify(a)),
        {written:{at, cause}});
      CL.store.add(cur);
    }
    return {ok:true, changed:true, F, rewrite:F < today};
  }
};
CL.rewritesOf = (type, id) => CL.state.rewrites.filter(r => r.type === type && r.id === id)
  .sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : 0);

/* Что пересчитывать по объекту: у кредита — все классификаторы кредита, затем его заёмщик;
   у заёмщика — его классификаторы и свёртка риска. Свёртка идёт последней: она читает
   ответы кредитов на те же даты (ADR-0246 §3). */
CL.seriesKeys = (type, id, d) => {
  const keys = [];
  const inn = type === 'кредит' ? CL.credit(id).inn : id;
  if(type === 'кредит' && CL.objectExists('кредит', id, d))
    CL.state.classifiers.filter(k => k.object === 'кредит').forEach(k => keys.push({clf:k.id, type, id}));
  CL.state.classifiers.filter(k => k.object === 'заёмщик').forEach(k => keys.push({clf:k.id, type:'заёмщик', id:inn}));
  keys.push({clf:'risk', type:'заёмщик', id:inn, fold:true});
  return keys;
};
/* Все ряды на дату — для ночного прохода и сверки. */
CL.allKeys = d => {
  const keys = [];
  CL.state.credits.filter(c => c.issued <= d).forEach(c =>
    CL.state.classifiers.filter(k => k.object === 'кредит').forEach(k => keys.push({clf:k.id, type:'кредит', id:c.id})));
  CL.state.borrowers.forEach(b => {
    CL.state.classifiers.filter(k => k.object === 'заёмщик').forEach(k => keys.push({clf:k.id, type:'заёмщик', id:b.inn}));
    keys.push({clf:'risk', type:'заёмщик', id:b.inn, fold:true});
  });
  return keys;
};

/* --------------------- МЕТКИ И ОБРАБОТЧИК (ADR-0246 §4) --------------------- *
 * Событие в своей транзакции ставит метку «пересчитать объект с даты D» (ИК-25). Метки
 * одного объекта сливаются по самой ранней D. Обработчик разбирает их за секунды; сбой
 * пересчёта событие не откатывает — метка висит, попытки считаются, ответ шва несёт признак
 * «обновляется». В макете обработчик синхронный: разбор идёт сразу после события.
 * ------------------------------------------------------------------- */
CL.placeMarker = (type, id, D, event) => {
  /* Событие с датой в закрытом месяце действует с первого дня открытого (ИК-9, ИК-26). */
  const from = maxD(D, CL.startOfOpen());
  const at = CL.now();
  let m = CL.state.markers.find(x => x.type === type && x.id === id);
  if(m){ if(from < m.from) m.from = from; m.events.push({at, text:event}); }
  else { m = {type, id, from, placed:at, events:[{at, text:event}], attempts:0, lastError:null};
         CL.state.markers.push(m); }
  return m;
};
/* Признак «обновляется»: по объекту висит метка, и её дата не позже спрошенной — хранимое
   на эту дату может отставать. У заёмщика — и метки его кредитов: свёртка ждёт их. */
CL.updating = (type, id, d) => CL.state.markers.some(m => m.from <= d &&
  ((m.type === type && m.id === id) ||
   (type === 'заёмщик' && m.type === 'кредит' && CL.credit(m.id).inn === id)));
CL.markerOf = (type, id) => CL.state.markers.find(m => m.type === type && m.id === id) || null;
/* Пересчёт объекта с даты D: всё посчитать, потом всё записать. Недоступный владелец
   прерывает пересчёт целиком — интервалы не трогаются, «нет данных» по сбою не пишется
   (ADR-0246 §9). */
function recomputeObject(type, id, D, cause){
  const from = maxD(D, CL.startOfOpen());
  const today = CL.state.today;
  if(from > today) return {ok:true};
  const days = dayRange(from, today);
  const plan = [];
  try {
    const riskNew = {};
    CL.seriesKeys(type, id, today).forEach(k => {
      const arr = k.fold
        ? days.map((d, i) => foldAnswer(k.id, d, cid => riskNew[cid] ? riskNew[cid][i] : CL.store.answerAt('risk', 'кредит', cid, d)))
        : days.map(d => CL.answer(k.clf, k.type, k.id, d));
      if(k.type === 'кредит' && k.clf === 'risk') riskNew[k.id] = arr;
      plan.push({k, arr});
    });
  } catch(e){ return {ok:false, why:e.message, owner:e.owner}; }
  const at = CL.now();
  plan.forEach(p => CL.store.rewrite(p.k, from, p.arr, cause, at));
  return {ok:true};
}
CL.recomputeObject = recomputeObject;
const causeOf = m => m.events.map(e => e.text).join('; ');
/* Разбор одной метки: успех снимает её, сбой оставляет висеть с попыткой и ошибкой. */
CL.runMarker = m => {
  m.attempts++;
  const res = recomputeObject(m.type, m.id, m.from, causeOf(m));
  if(res.ok){ CL.state.markers = CL.state.markers.filter(x => x !== m); return {ok:true, m}; }
  m.lastError = res.why;
  return {ok:false, m, why:res.why};
};
/* Обработчик: разбирает все висящие метки. Остановленный — не разбирает ничего, метки копятся
   (так в макете видно, что закрытие месяца с висящей меткой отклоняется). */
CL.processMarkers = opts => {
  if(!CL.state.handler.running && !(opts && opts.force)) return [];
  return CL.state.markers.slice().map(CL.runMarker);
};
/* Поставить метку и сразу отдать её обработчику — так ведёт себя событие любого владельца. */
CL.mark = (type, id, D, event) => { const m = CL.placeMarker(type, id, D, event); CL.processMarkers(); return m; };
CL.markerNote = () => {
  const n = CL.state.markers.length;
  return n ? ' · висит меток: ' + n + ' — экран «Ожидают пересчёта»' : '';
};

/* --------------------------- ШОВ ----------------------------------- *
 * Единственная дверь наружу (ADR-0124). На ЛЮБУЮ дату шов читает хранимый интервал:
 * движок при чтении не исполняется ни в открытом периоде, ни в закрытом (ИК-24); за закрытый
 * месяц отдаётся хранимый интервал прежней редакции, а не пересчёт (ИК-8). Ответ несёт
 * состояние, редакцию, «почему» и два признака — «период закрыт» и «обновляется».
 * ------------------------------------------------------------------- */
CL.valueAt = (clfId, objType, objId, dateISO) => {
  /* Дата обязательна: «сейчас» подставляется явно, иначе история читалась бы сегодняшними
     правилами (P19-R21). */
  if(!dateISO) return {ok:false, nodate:true, why:['дата обязательна: запрос без даты не принимается — «сейчас» подставляется явно']};
  const d = dateISO;
  const flags = {closed:CL.isClosed(d), updating:CL.updating(objType, objId, d)};
  const iv = CL.store.at(clfId, objType, objId, d);
  if(iv) return Object.assign({source:'хранимый интервал', ok:iv.state === 'есть', state:iv.state,
    code:iv.code, label:iv.label, verNo:iv.verNo, why:iv.why.map(whyLine), whyItems:iv.why, interval:iv,
    out:iv.state === 'вне области', nodata:iv.state === 'нет данных'}, flags);
  const res = Object.assign({source:'интервала нет', ok:false, none:true}, flags);
  const clf = CL.clf(clfId);
  if(!CL.objectExists(objType, objId, d)) res.why = [objType === 'кредит'
    ? 'кредита на ' + fmt(d) + ' ещё нет: он выдан ' + fmt(CL.credit(objId).issued)
    : 'объекта на ' + fmt(d) + ' нет'];
  else if(clf.stopped && d >= clf.stopped.from){ res.stopped = true;
    res.why = ['действие классификатора прекращено с ' + fmt(clf.stopped.from) + ': ' + clf.stopped.reason +
      ' — интервалы прошлых дат читаются по-прежнему']; }
  else if(!CL.lastEdition(clfId)){ res.draft = !!CL.draftVer(clfId);
    res.why = [res.draft ? 'действующей редакции нет — черновик значений не назначает'
                         : 'у классификатора нет ни одной редакции']; }
  else if(objType === 'заёмщик' && clfId === 'risk' && CL.editionAt('risk', d) && !CL.editionAt('risk', d).comparable){
    res.forbidden = true;
    res.why = ['свёртка запрещена: редакция ' + CL.editionAt('risk', d).no +
      ' не объявила значения сравнимыми по тяжести']; }
  else if(!CL.editionAt(clfId, d)) res.why = ['на ' + fmt(d) + ' классификатор не действовал: ' +
    'редакций, действующих на эту дату, нет — интервалов нет вовсе'];
  else res.why = ['интервала на ' + fmt(d) + ' нет — по объекту ещё не прошёл пересчёт'];
  return res;
};
/* Имя шва из ADR-0124. У заёмщика — хранимая свёртка: интервал с кредитом-источником. */
CL.riskCategory = (objType, objId, dateISO) => {
  const r = CL.valueAt('risk', objType, objId, dateISO);
  const src = (r.whyItems || []).find(w => w.k === 'source');
  if(src) r.sourceCreditId = src.credit;
  return r;
};
/* Строка статистики на дату D берёт интервал на D−1: срез у неё на начало дня (ADR-0246 §7,
   ADR-0238 §2). Строка 1-го числа поэтому совпадает с отчётом п. 12 за прошлый месяц. */
CL.statisticsValue = (clfId, objType, objId, sliceDate) =>
  Object.assign(CL.valueAt(clfId, objType, objId, addDays(sliceDate, -1)), {readDate:addDays(sliceDate, -1)});
/* «Что система показывала на момент T на дату X»: «было» из первой записи журнала перезаписи
   после T, покрывающей X; такой нет — текущий интервал (ADR-0246 §8). */
CL.shownAt = (clfId, objType, objId, X, T) => {
  const later = CL.state.rewrites.filter(r => r.clf === clfId && r.type === objType && r.id === objId && r.at > T)
    .sort((a, b) => a.at < b.at ? -1 : 1);
  for(const r of later){
    const iv = r.was.find(w => w.from <= X && (!w.until || X <= w.until));
    if(iv) return {from:'журнал перезаписи', rewriteAt:r.at, interval:iv, answer:ansOf(iv)};
  }
  const cur = CL.store.at(clfId, objType, objId, X);
  return {from:'текущий ряд', interval:cur, answer:ansOf(cur)};
};
/* Свёртка на дату по хранимым ответам кредитов — то, что обработчик записал бы заёмщику.
   Нужна сторожу ИК-6: без признака сравнимости свёртки нет вовсе. */
CL.foldBorrower = (inn, dateISO) => {
  const d = dateISO || CL.state.today;
  const ver = CL.editionAt('risk', d);
  if(!ver) return {ok:false, why:['действующей редакции риск-классификатора на ' + fmt(d) + ' нет']};
  if(!ver.comparable) return {ok:false, forbidden:true,
    why:['свёртка запрещена: редакция ' + ver.no + ' не объявила значения сравнимыми по тяжести']};
  const a = foldAnswer(inn, d, cid => CL.store.answerAt('risk', 'кредит', cid, d));
  const src = a.why.find(w => w.k === 'source');
  return Object.assign({ok:a.state === 'есть', nodata:a.state === 'нет данных', empty:a.state === 'вне области',
    why:a.why.map(whyLine), sourceCreditId:src ? src.credit : null}, a);
};

CL.classify = CL.compute;             /* прежнее имя внутреннего вызова — движок тот же */

/* ------------- ПРОВЕРКА ПЕРЕД ПУБЛИКАЦИЕЙ (ИК-3…ИК-5, ИК-17) ------- *
 * Отказ списком и по делу: молчаливого отказа быть не может (§0.3).
 * ------------------------------------------------------------------- */
CL.publishChecks = (clfId, ver) => {
  const clf = CL.clf(clfId);
  const v = ver || CL.draftVer(clfId);
  const out = [];
  if(!v) return ['черновика нет — публиковать нечего'];
  if(!v.values.length) out.push('в версии нет ни одного значения');

  const dflts = v.values.filter(x => x.dflt);
  if(dflts.length !== 1) out.push('значений по умолчанию должно быть ровно одно, сейчас ' + dflts.length +
    ' — иначе часть объектов молча осталась бы без значения');
  if(dflts.length === 1){
    const d = dflts[0];
    if(v.values.indexOf(d) !== v.values.length - 1)
      out.push('значение по умолчанию «' + d.label + '» должно замыкать список, сейчас оно ' +
        (v.values.indexOf(d) + 1) + '-е из ' + v.values.length);
    if((d.rules || []).length)
      out.push('у значения по умолчанию «' + d.label + '» есть правила — их быть не должно');
  }
  v.values.forEach(x => {
    if(!x.dflt && !(x.rules || []).length)
      out.push('значение «' + x.label + '» недостижимо: правил нет, и значением по умолчанию оно не объявлено');
    /* ИК-21: два правила одного значения с одним пунктом различает только подпись. Без неё
       объяснение назовёт пункт дважды, и снявший фактор не поймёт, какое из двух снял. */
    const byNorm = {};
    (x.rules || []).forEach(r => { const k = r.norm || ''; byNorm[k] = (byNorm[k] || 0) + 1; });
    (x.rules || []).forEach(r => {
      if(!r.preds.length) out.push('правило ' + (r.norm || 'без пункта') + ' у значения «' + x.label + '» пустое');
      if(!r.norm) out.push('у правила значения «' + x.label + '» не указан пункт основания');
      else if(byNorm[r.norm] > 1 && !r.label)
        out.push('у значения «' + x.label + '» пункт ' + r.norm + ' назван ' + byNorm[r.norm] +
          ' раза — каждому такому правилу нужна подпись, иначе объяснение их не различит');
      r.preds.forEach(p => out.push(...predProblems(p, clf, 'значения «' + x.label + '»')));
    });
  });
  /* Область проверяется теми же правилами, кроме пункта основания: вход — проектное решение
     редакции, а не цитата нормы, поэтому норма у правила области необязательна (ADR-0137 §3). */
  (v.scope || []).forEach(r => {
    if(!(r.preds || []).length) out.push('в области есть пустое правило — уберите его или допишите предикаты');
    (r.preds || []).forEach(p => out.push(...predProblems(p, clf, 'области')));
  });
  if(!v.basis) out.push('не указано основание версии — норма и её редакция');
  if(!v.from) out.push('не указана дата ввода в действие');
  else if(v.from < CL.startOfOpen())
    out.push('дата ввода в действие ' + fmt(v.from) + ' раньше начала открытого периода ' +
      fmt(CL.startOfOpen()) + ' — закрытые периоды неприкосновенны');
  /* Верхняя граница окна (ИК-4): публикация — немедленный ввод в действие. Дата вперёд
     означала бы четвёртый статус «утверждена, ждёт даты», которого в модели нет: сегодня
     «действующая» и «та, что классифицирует сейчас» — одно и то же. */
  else if(v.from > CL.state.today)
    out.push('дата ввода в действие ' + fmt(v.from) + ' в будущем — публикация вводит редакцию ' +
      'в действие немедленно, отложенного пуска в модели нет');
  /* Нижняя граница окна — не только начало открытого периода, но и начало ДЕЙСТВУЮЩЕЙ
     редакции: публикация закрывает прошлую днём раньше даты ввода новой (prev.until = from − 1),
     и дата не позже начала действующей дала бы отрицательный интервал действия, а дни между
     ними — две действующие редакции сразу. Интервал значения после этого не смог бы назвать
     свою редакцию (ИК-22, КФ-Д12, КФ-Д22). Проверять открытый период недостаточно: обе даты
     могут лежать внутри него. У прекращённого классификатора сторож — последний день
     действия последней редакции. */
  const cur = CL.activeVer(clfId);
  const last = CL.lastEdition(clfId);
  if(v.from && cur && cur !== v && v.from <= cur.from)
    out.push('дата ввода в действие ' + fmt(v.from) + ' не позже начала действующей редакции ' +
      cur.no + ' от ' + fmt(cur.from) + ' — две редакции одновременно не действуют');
  else if(v.from && !cur && last && last !== v && last.until && v.from <= last.until)
    out.push('дата ввода в действие ' + fmt(v.from) + ' не позже последнего дня действия редакции ' +
      last.no + ' (' + fmt(last.until) + ') — две редакции одновременно не действуют');
  return out;
};
function predProblems(p, clf, where){
  const out = [];
  const pre = 'предикат ' + where + ': ';
  const ind = CL.ind(p.i);
  if(!ind){ out.push(pre + 'неизвестный показатель «' + p.i + '»'); return out; }
  if(ind.retired) out.push(pre + 'снятый показатель «' + ind.name + '»');
  /* Правило кредита вправе читать показатели заёмщика; обратного чтения нет (ИК-15). */
  if(clf.object === 'заёмщик' && ind.obj === 'кредит')
    out.push(pre + 'читает показатель кредита «' + ind.name +
      '» — классификатор заёмщика вниз не смотрит');
  const isSet = SET_OPS.indexOf(p.op) >= 0;
  if(isSet){
    /* ∈/∉ — сокращение цепочки «= a или = b», поэтому домен обязателен: у числа и булева
       перечислять нечего, а члены множества обязаны быть членами домена (ИК-5). */
    if(ind.type !== 'перечисление')
      out.push(pre + 'оператор ' + opWord(p.op) + ' применим только к показателю-перечислению, а «' +
        ind.name + '» — ' + ind.type);
    else {
      const set = p.set || [];
      if(!set.length) out.push(pre + 'у оператора ' + opWord(p.op) + ' пустой список значений — выберите хотя бы одно');
      set.forEach(x => { if(!(ind.domain || []).includes(x))
        out.push(pre + 'значение «' + shownVal(x) + '» не входит в домен показателя «' + ind.name + '»'); });
      if(set.length && (ind.domain || []).length && set.length === (ind.domain || []).length)
        out.push(pre + opWord(p.op) + ' перечисляет весь домен показателя «' + ind.name +
          '» — такое правило либо всегда верно, либо всегда ложно');
    }
  } else {
    if(ind.type === 'перечисление' && !(ind.domain || []).includes(p.v))
      out.push(pre + 'значение «' + shownVal(p.v) + '» не входит в домен показателя «' + ind.name + '»');
    if(ind.type === 'число' && !(typeof p.v === 'number' && isFinite(p.v)))
      out.push(pre + 'показатель «' + ind.name + '» числовой, а константа не число');
    if(ind.type === 'булево' && typeof p.v !== 'boolean')
      out.push(pre + 'показатель «' + ind.name + '» булев, а константа не «да/нет»');
  }
  if(ind.type !== 'число' && NUM_OPS.indexOf(p.op) >= 0)
    out.push(pre + 'оператор ' + p.op + ' применим только к числовому показателю');
  if(CL.opsFor(ind).indexOf(p.op) < 0)
    out.push(pre + 'оператор ' + opWord(p.op) + ' не разрешён для показателя «' + ind.name + '»');
  return out;
}

/* ------------- СУХОЙ ПРОГОН ЧЕРНОВИКА (предпросмотр публикации) ----- *
 * Публикация необратима: отменить редакцию можно только следующей редакцией (ИК-2). Значит,
 * последствия обязаны быть видны ДО неё — по каждому объекту «хранится» против «стало бы».
 * ИК-1 при этом цел: прогон ничего не пишет и меток не ставит, результат живёт только на
 * экране, и значение по-прежнему назначает лишь действующая редакция.
 * ------------------------------------------------------------------- */
CL.dryRun = clfId => {
  const clf = CL.clf(clfId);
  const draft = CL.draftVer(clfId);
  if(!draft) return {ok:false, why:'черновика нет — сравнивать не с чем'};
  const active = CL.activeVer(clfId);
  const d = CL.state.today;
  const rows = CL.objectsOf(clf.object, d).map(o => {
    const iv = CL.store.at(clfId, o.type, o.id, d);
    const was = iv && iv.state === 'есть' ? {ok:true, code:iv.code, label:iv.label, why:iv.why.map(whyLine)}
      : {ok:false, why: iv ? iv.why.map(whyLine) : ['интервала на ' + fmt(d) + ' нет — значения сейчас нет']};
    let will;
    try { will = CL.classifyWith(draft, CL.valuesOf(o.type, o.id, d), true); }
    catch(e){ will = {ok:false, why:['прогон прерван: ' + e.message]}; }
    return {objId:o.id, objType:o.type, was, will,
      changed: (was.ok ? was.code : '∅') !== (will.ok ? will.code : '∅')};
  });
  return {ok:true, clfId, verNo:draft.no, baseNo: active ? active.no : null, rows,
    refusals: CL.publishChecks(clfId, draft),
    cnt:{ total:rows.length,
      changed: rows.filter(r => r.changed).length,
      inNow:   rows.filter(r => r.was.ok).length,
      inDraft: rows.filter(r => r.will.ok).length,
      lost:    rows.filter(r => r.was.ok && !r.will.ok).length,
      gained:  rows.filter(r => !r.was.ok && r.will.ok).length }};
};

/* --------------------- ОПЕРАЦИИ КОНСТРУКТОРА ------------------------ */
/* Каждое действие ставит время один раз: событие, его метка и перезапись интервалов стоят
   в журналах одной минутой — так в системе они одна транзакция и её следствие (ИК-25). */
CL.stamp = () => { CL.tick(); return CL.now(); };
function guardDraft(clfId){
  if(!CL.canEditConstructor()) return 'править конструктор вправе только администратор классификации';
  const d = CL.draftVer(clfId);
  if(!d) return 'действующая версия не правится: заведите новую редакцию — она откроется черновиком';
  return null;
}
/* Метки на все объекты классификатора с даты D: так публикация и прекращение действия
   доходят до хранимых интервалов (ИК-25). Метка кредита ведёт за собой и заёмщика. */
function markAll(clfId, D, event){
  const clf = CL.clf(clfId);
  CL.objectsOf(clf.object, CL.state.today).forEach(o => CL.placeMarker(o.type, o.id, D, event));
  return CL.processMarkers();
}
/* ------------------- КЛАССИФИКАТОР: ЗАВЕСТИ И ОСТАНОВИТЬ ----------- *
 * Главное обещание модуля: четвёртая классификация появляется НАСТРОЙКОЙ, а не релизом
 * (ADR-0120). Значит, завести классификатор обязан уметь администратор — здесь, а не
 * миграцией. Удалить его нельзя: интервалы закрытых месяцев ссылаются на его редакции и
 * обязаны остаться читаемыми, поэтому вместо удаления — прекращение действия (ИК-19).
 * ------------------------------------------------------------------- */
CL.addClassifier = spec => {
  if(!CL.canEditConstructor()) return {ok:false, why:'заводит классификаторы только администратор классификации'};
  const id = (spec.id || '').trim();
  if(!id || CL.clf(id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!(spec.name || '').trim()) return {ok:false, why:'у классификатора обязано быть наименование'};
  /* Объект задан у классификатора, а не у версии: сменить объект — значит завести другой,
     иначе прошлые интервалы потеряли бы смысл (спека §2.1). */
  if(!['кредит','заёмщик'].includes(spec.object)) return {ok:false, why:'объект классификации — «кредит» либо «заёмщик»'};
  CL.stamp();
  CL.state.classifiers.push({id, name:spec.name.trim(), object:spec.object, versions:[
    {no:1, status:'черновик', basis:'', from:'', by:CL.state.role, at:null, until:null,
     comparable:false, scope:[], values:[]}
  ]});
  log('заведён классификатор «' + spec.name.trim() + '» (объект: ' + spec.object + '), редакция 1 — черновик');
  return {ok:true, id};
};
/* Прекращение действия — не удаление и не откат. Дата — первый день без редакции: последняя
   редакция закрывается днём раньше, с этой даты интервалов у классификатора нет, а метки
   убирают их у всех объектов. Интервалы прошлых дат читаются по своим редакциям (ИК-19). */
CL.stopClassifier = (clfId, opts) => {
  if(!CL.canEditConstructor()) return {ok:false, why:'прекращает действие только администратор классификации'};
  const clf = CL.clf(clfId);
  if(!clf) return {ok:false, why:'классификатора нет'};
  const ver = CL.activeVer(clfId);
  if(!ver) return {ok:false, why:'действующей редакции нет — прекращать нечего'};
  const reason = ((opts || {}).reason || '').trim();
  if(!reason) return {ok:false, why:'прекращение действия без причины не принимается'};
  const from = (opts || {}).from || CL.state.today;
  if(from < CL.startOfOpen()) return {ok:false, why:'дата прекращения ' + fmt(from) +
    ' раньше начала открытого периода ' + fmt(CL.startOfOpen()) + ' — закрытые периоды неприкосновенны'};
  if(from > CL.state.today) return {ok:false, why:'дата прекращения ' + fmt(from) + ' в будущем'};
  if(from <= ver.from) return {ok:false, why:'дата прекращения ' + fmt(from) + ' не позже ввода действующей редакции ' +
    ver.no + ' от ' + fmt(ver.from) + ' — редакция не может закончиться раньше, чем началась'};
  const at = CL.stamp();
  ver.status = 'прошлая'; ver.until = addDays(from, -1);
  clf.stopped = {from, reason, by:CL.state.role, at};
  log('действие классификатора «' + clf.name + '» прекращено с ' + fmt(from) + ': ' + reason);
  markAll(clfId, from, 'прекращение действия «' + clf.name + '» с ' + fmt(from));
  return {ok:true, from};
};
CL.newDraft = clfId => {
  if(!CL.canEditConstructor()) return {ok:false, why:'править конструктор вправе только администратор классификации'};
  if(CL.draftVer(clfId)) return {ok:false, why:'черновик уже есть'};
  const clf = CL.clf(clfId);
  /* База копии — действующая редакция; у остановленного классификатора её нет, и черновик
     открывается копией последней по номеру: возобновление не начинается с чистого листа. */
  const base = CL.activeVer(clfId) ||
    clf.versions.slice().sort((a, b) => b.no - a.no)[0] || null;
  const copy = JSON.parse(JSON.stringify(base ? {scope:base.scope, values:base.values, comparable:base.comparable} : {scope:[], values:[], comparable:false}));
  const no = Math.max(0, ...clf.versions.map(v => v.no)) + 1;
  CL.stamp();
  clf.versions.push({no, status:'черновик', basis:'', from:'', by:CL.state.role, at:null, until:null,
    comparable:copy.comparable, scope:copy.scope, values:copy.values});
  log('заведена редакция ' + no + ' классификатора «' + clf.name + '» (черновик)');
  return {ok:true, no};
};
CL.publish = (clfId, opts) => {
  const d = CL.draftVer(clfId);
  if(!CL.canEditConstructor()) return {ok:false, refusals:['публикует только администратор классификации']};
  if(!d) return {ok:false, refusals:['черновика нет']};
  if(opts && opts.basis !== undefined) d.basis = opts.basis;
  if(opts && opts.from !== undefined) d.from = opts.from;
  const refusals = CL.publishChecks(clfId, d);
  if(refusals.length) return {ok:false, refusals};
  const at = CL.stamp();
  /* Стык без зазора и без наложения: прошлая редакция закрывается ДНЁМ РАНЬШЕ даты ввода
     новой — «по» у редакции включительное, как у интервала значения (ИК-22, КФ-Д22). */
  const prev = CL.activeVer(clfId);
  if(prev){ prev.status = 'прошлая'; prev.until = addDays(d.from, -1); }
  /* Публикация возобновляет остановленный классификатор: отметка о прекращении снимается,
     но её след остаётся в журнале действий (ИК-19). */
  if(CL.clf(clfId).stopped) delete CL.clf(clfId).stopped;
  d.status = 'действующая';
  d.by = CL.state.role;
  d.at = at;
  log('опубликована редакция ' + d.no + ' классификатора «' + CL.clf(clfId).name + '» с ' + fmt(d.from));
  /* Публикация — событие: метки на все объекты классификатора с даты ввода, обработчик
     переписывает их ряды от этой даты (ИК-25). */
  markAll(clfId, d.from, 'публикация редакции ' + d.no + ' «' + CL.clf(clfId).name + '»');
  return {ok:true, no:d.no};
};
/* Основание и дата ввода — реквизиты черновика, а не аргументы публикации: пока они писались
   только внутри publish(), в черновике они оставались пустыми, список отказов держал «не указано
   основание» и «не указана дата ввода», кнопка от этого гасла — и черновик было не опубликовать
   вовсе (КФ-Д6). Пишем их при вводе, как любую другую правку черновика. */
CL.setVerMeta = (clfId, patch) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  if(patch.basis !== undefined) d.basis = patch.basis;
  if(patch.from !== undefined) d.from = patch.from;
  return {ok:true};
};
CL.addValue = (clfId, label) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  let n = d.values.length + 1, code = 'v' + n;
  while(d.values.some(v => v.code === code)) code = 'v' + (++n);
  /* Новое значение встаёт ПЕРЕД значением по умолчанию: замыкающее остаётся последним (ИК-3). */
  const at = d.values.findIndex(v => v.dflt);
  const val = {code, label:label || 'Без названия', rules:[]};
  if(at === -1) d.values.push(val); else d.values.splice(at, 0, val);
  return {ok:true, code};
};
CL.removeValue = (clfId, code) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  d.values = d.values.filter(v => v.code !== code);
  return {ok:true};
};
CL.moveValue = (clfId, code, dir) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  const i = d.values.findIndex(v => v.code === code);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= d.values.length) return {ok:false, why:'двигать некуда'};
  const t = d.values[i]; d.values[i] = d.values[j]; d.values[j] = t;
  return {ok:true};
};
CL.setDefault = (clfId, code) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  d.values.forEach(v => { delete v.dflt; });
  const v = d.values.find(x => x.code === code);
  if(!v) return {ok:false, why:'значения нет'};
  v.dflt = true; v.rules = [];
  /* Значение по умолчанию замыкает список — переставляем сразу, чтобы отказ не всплыл при публикации. */
  d.values = d.values.filter(x => x.code !== code).concat([v]);
  return {ok:true};
};
CL.setComparable = (clfId, on) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  CL.draftVer(clfId).comparable = !!on;
  return {ok:true};
};
/* Область и значение правятся ОДНИМИ мутациями: список правил у них устроен одинаково,
   и второй редактор разошёлся бы с первым на первой же правке (ADR-0137 §3, КФ-Д8).
   Псевдо-код '@scope' адресует область той же парой (clfId, code), что и значение. */
CL.SCOPE = '@scope';
function rulesOf(clfId, code){
  const d = CL.draftVer(clfId);
  if(!d) return null;
  if(code === CL.SCOPE){ if(!d.scope) d.scope = []; return d.scope; }
  const v = d.values.find(x => x.code === code);
  return v ? (v.rules || (v.rules = [])) : null;
}
CL.rulesOf = rulesOf;
CL.addRule = (clfId, code, norm) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  if(code !== CL.SCOPE){
    const v = CL.draftVer(clfId).values.find(x => x.code === code);
    if(!v) return {ok:false, why:'значения нет'};
    if(v.dflt) return {ok:false, why:'у значения по умолчанию правил быть не может'};
  }
  const rules = rulesOf(clfId, code);
  rules.push({norm:norm || '', label:'', preds:[]});
  return {ok:true, index:rules.length - 1};
};
CL.removeRule = (clfId, code, ri) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code).splice(ri, 1);
  return {ok:true};
};
CL.setRuleNorm = (clfId, code, ri, norm) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].norm = norm;
  return {ok:true};
};
/* Подпись правила едет тем же маршрутом, что и норма: объяснение → строка «почему» интервала →
   отчёт п. 12. Обязательна только при повторе пункта внутри значения (ИК-21). */
CL.setRuleLabel = (clfId, code, ri, label) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].label = label;
  return {ok:true};
};
