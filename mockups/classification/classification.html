/* --------------------- КАРТОЧКА РАЗБОРА ОБЪЕКТА --------------------- *
 * Всё, что модуль знает об объекте: ряд интервалов по каждому классификатору, журнал
 * перезаписи, ответ «что система показывала на момент T», разбор по шагам из хранимого и
 * висящая метка. Ответ шва здесь тот же, что уходит потребителю (P19-R21).
 * ------------------------------------------------------------------- */
function seriesOf(o){
  const out = [];
  if(o.type === 'кредит') CL.state.classifiers.filter(k => k.object === 'кредит').forEach(k => out.push({clf:k.id, name:k.name}));
  else {
    out.push({clf:'risk', name:'Категория кредитного риска — свёртка по кредитам', fold:true});
    CL.state.classifiers.filter(k => k.object === 'заёмщик').forEach(k => out.push({clf:k.id, name:k.name}));
  }
  return out;
}
function ivRows(clfId, o, d){
  const ivs = CL.store.series(clfId, o.type, o.id);
  if(!ivs.length) return '<tr><td colspan="5" class="muted">интервалов нет — ' +
    esc(CL.valueAt(clfId, o.type, o.id, d).why[0]) + '</td></tr>';
  const L = CL.lastClosedDay();
  return ivs.map(iv => {
    const on = iv.from <= d && (!iv.until || d <= iv.until);
    const lock = iv.from <= L ? (iv.until && iv.until <= L ? 'заперт: месяц закрыт'
      : 'пересекает границу закрытого месяца — «по» не раньше ' + fmt(L)) : '';
    return `<tr${on ? ' class="cur"' : ''}>
      <td class="mono">${fmt(iv.from)}</td><td class="mono">${iv.until ? fmt(iv.until) : 'по сей день'}</td>
      <td>${statePill(iv)} <span class="small">ред. ${iv.verNo}</span>${lock ? '<div class="small">🔒 ' + esc(lock) + '</div>' : ''}</td>
      <td>${iv.why.map(w => '<div class="why">' + esc(whyLine(w)) + '</div>').join('')}</td>
      <td class="small">${fmtAt(iv.written.at)}<div>${esc(iv.written.cause)}</div></td></tr>`;
  }).join('');
}
function rewriteRows(clfId, o){
  const rs = CL.rewritesOf(o.type, o.id).filter(r => r.clf === clfId);
  if(!rs.length) return '';
  return `<div class="small" style="margin:12px 0 6px"><b>История перезаписей объекта</b> — записи журнала
    перезаписи: изменения на дни раньше сегодняшнего; заменённые интервалы лежат целиком</div>
    <table class="cgrid"><thead><tr><th>Когда</th><th>Пересчёт с · первый изменённый день</th><th>Причина</th><th>Было</th></tr></thead>
    <tbody>${rs.slice().reverse().map(r => `<tr><td class="mono">${fmtAt(r.at)}</td>
      <td>${fmt(r.D)} · ${fmt(r.F)}</td><td>${esc(r.cause)}</td>
      <td>${r.was.map(iv => `<div>${fmt(iv.from)} — ${iv.until ? fmt(iv.until) : 'по сей день'}: ${statePill(iv)}
        <span class="small">ред. ${iv.verNo}</span>${iv.why.map(w => '<div class="why">' + esc(whyLine(w)) + '</div>').join('')}</div>`).join('')}</td></tr>`).join('')}
    </tbody></table>`;
}
/* Разбор по шагам собирается из хранимого интервала, а не повторным расчётом: порядок разбора
   сверху вниз означает, что у значений выше выбранного не сработало ни одно правило, а ниже
   выбранного ничего не проверялось. Движок при этом не исполняется (ИК-24); величины на дату
   спрошены у владельцев только для показа. */
function stepsHtml(r, clfId, type, id, d){
  if(!r.interval || r.whyItems.some(w => w.k === 'source' || w.k === 'fold-nodata' || w.k === 'fold-empty')) return '';
  const ver = CL.editionNo(clfId, r.verNo);
  const vals = liveVals(type, id, d) || {};
  const when = d === CL.state.today ? null : d;
  const mark = f => f ? '<span class="tr-ok">✓</span>' : '<span class="tr-no">✗</span>';
  const scope = ver.scope || [];
  const out = [];
  out.push(`<div class="tr-step"><b>1. Область</b> — ${scope.length
    ? scope.map(x => esc(ruleText(x, vals, when))).join(' <span class="or">или</span> ') : 'пуста, входят все'}
    → ${r.state === 'вне области' ? 'не пройдена: объект вне области, значения не разбирались' : 'пройдена'}</div>`);
  if(r.state === 'нет данных') out.push(`<div class="tr-step"><b>2. Полнота входа</b> — ${esc(r.why[0])}; значения не разбирались</div>`);
  if(r.state === 'есть'){
    out.push('<div class="tr-step"><b>2. Полнота входа</b> — все показатели правил отданы владельцами</div>');
    const ci = ver.values.findIndex(v => v.code === r.code);
    const fired = r.whyItems.filter(w => w.k === 'rule');
    ver.values.forEach((v, i) => {
      if(i > ci){ out.push(`<div class="tr-step muted">${esc(v.label)} — не проверялось: выбрано значение выше</div>`); return; }
      const rules = (v.rules || []).map(x => {
        const hit = i === ci && fired.some(w => w.norm === x.norm && (w.label || '') === (x.label || ''));
        return '<div class="why">' + mark(hit) + ' ' + esc(ruleText(x, vals, when)) + ' — ' + esc(x.norm) + '</div>';
      }).join('');
      out.push(`<div class="tr-step"><b>${i === 0 ? '3. ' : ''}${esc(v.label)}</b>${i === ci ? ' <span class="pill ok">выбрано</span>' : ''} — ${
        v.dflt ? 'замыкающее, правил нет' + (v.norm ? ' · ' + esc(v.norm) : '') : i < ci ? 'ни одно правило не сработало' + rules : rules}</div>`);
    });
  }
  return `<details class="trace"><summary class="small">Разбор по шагам — из хранимого интервала, редакция ${r.verNo}</summary>${out.join('')}</details>`;
}
CL.shownUI = (field, value) => { CL.state.shownQ[field] = value; };
CL.shownGo = () => render();
function objDetail(o){

  const exists = o.type === 'кредит' ? !!CL.credit(o.id) : !!CL.borrower(o.id);
  if(!exists){ st.curObj = null; return viewShowcase(); }
  const c = o.type === 'кредит' ? CL.credit(o.id) : null;
  const b = c ? CL.borrower(c.inn) : CL.borrower(o.id);
  const m = CL.markerOf(o.type, o.id);
  const mine = o.type === 'заёмщик' ? st.markers.filter(x => x.type === 'кредит' && CL.credit(x.id).inn === o.id) : [];
  const head = `<div class="card">
    <h3>${esc(objName(o))} <span class="small">· ${o.type}${c ? ' · ' + esc(b.name) + ' · выдан ' + fmt(c.issued) +
      (c.closed ? ', закрыт ' + fmt(c.closed) : '') : ' · ИНН ' + esc(o.id)}</span></h3>
    ${m ? `<div class="banner warn"><b>Обновляется:</b> висит метка «пересчитать с ${fmt(m.from)}» — попыток ${m.attempts}${
      m.lastError ? ', последняя ошибка: ' + esc(m.lastError) : ''}. События: ${m.events.map(e => fmtAt(e.at) + ' ' + esc(e.text)).join('; ')}.
      Ответы на даты с ${fmt(m.from)} несут признак «обновляется».</div>` : ''}
    ${mine.length ? `<div class="banner warn">Свёртка ждёт кредиты: ${mine.map(x => esc(x.id) + ' с ' + fmt(x.from)).join(', ')}.</div>` : ''}
    ${c ? `<div class="kv"><div class="k">Вход на ${fmt(d)}</div><div class="v">${inputCell(c, d)}</div></div>` : ''}
  </div>`;
  const cards = seriesOf(o).map(s => {
    const r = CL.valueAt(s.clf, o.type, o.id, d);
    return `<div class="card">
      <h3>${esc(s.name)}</h3>
      <div class="kv"><div class="k">Ответ шва на ${fmt(d)}</div><div class="v">${statePill(r)}${flagsHtml(r)}
        ${r.verNo ? '<span class="small"> · редакция ' + r.verNo + '</span>' : ''}
        ${whyHtml(r, s.clf, o.type, o.id, d)}${stepsHtml(r, s.clf, o.type, o.id, d)}</div></div>
      <table class="cgrid" style="margin-top:10px"><thead><tr><th>С</th><th>По</th><th>Ответ</th><th>Почему</th><th>Записан</th></tr></thead>
        <tbody>${ivRows(s.clf, o, d)}</tbody></table>
      ${rewriteRows(s.clf, o)}
    </div>`;
  }).join('');
  const q = st.shownQ;
  const T = q.T || st.today + ' 10:00', X = q.X || d;
  const shownRows = seriesOf(o).map(s => {
    const a = CL.shownAt(s.clf, o.type, o.id, X, T);
    return `<tr><td>${esc(s.name)}</td><td>${statePill(a.answer)}${a.answer ? ' <span class="small">ред. ' + a.answer.verNo + '</span>' : ''}</td>
      <td class="small">${a.from === 'журнал перезаписи' ? 'из журнала перезаписи — «было» записи ' + fmtAt(a.rewriteAt) : 'текущий ряд: перезаписей после ' + esc(T) + ' нет'}</td></tr>`;
  }).join('');
  return head + cards + `<div class="card">
    <h3>Что система показывала на момент T на дату X</h3>
    <div class="form-row">
      <div class="fld"><label>Момент T (ГГГГ-ММ-ДД ЧЧ:ММ)</label>
        <input id="shT" value="${esc(T)}" oninput="CL.shownUI('T',this.value)"></div>
      <div class="fld"><label>Дата X</label>
        <input id="shX" type="date" value="${esc(X)}" oninput="CL.shownUI('X',this.value)"></div>
      <button class="btn btn-secondary" onclick="CL.shownGo()">Показать</button>
    </div>
    <table class="cgrid" style="margin-top:10px"><thead><tr><th>Классификатор</th><th>Показывала</th><th>Откуда ответ</th></tr></thead>
      <tbody>${shownRows}</tbody></table>
  </div>`;
}

CL.NIGHT_KINDS = ['смена по дате', 'расхождение', 'повтор метки', 'сбой', 'сверка'];
CL.nightFilterUI = k => { CL.state.nightFilter = k || null; render(); };
CL.nightUI = () => { const r = CL.nightly();
  toast('ночной проход ' + fmtAt(CL.state.lastPass.at) + ': смен по дате ' + r.transitions + ', расхождений ' + r.mismatches, r.mismatches ? 'err' : 'ok');
  render(); };
function viewNight(){
  const st = CL.state;
  const flt = st.nightFilter;
  const list = st.night.filter(n => !flt || n.kind === flt);
  const kindPill = k => k === 'расхождение' || k === 'сбой' ? 'err' : k === 'смена по дате' ? 'info' : 'neutral';
  const rows = list.map(n => `<tr>
    <td class="mono">${fmtAt(n.at)}</td><td><span class="pill ${kindPill(n.kind)}">${esc(n.kind)}</span></td>
    <td>${n.id ? `<a class="lnk" onclick="CL.openObj('${n.type}','${esc(n.id)}')">${esc(n.obj)}</a>` : '—'}</td>
    <td class="small">${esc(n.clf || '—')}</td><td>${esc(n.text)}</td>
    <td class="small">${(n.owners || []).map(esc).join(', ') || '—'}</td></tr>`).join('')
    || '<tr><td colspan="6" class="muted">записей этого вида нет</td></tr>';
  const chips = `<div class="chips">
    <span class="chip${flt ? '' : ' on'}" onclick="CL.nightFilterUI(null)">все <span class="n">${st.night.length}</span></span>
    ${CL.NIGHT_KINDS.map(k => { const n = st.night.filter(x => x.kind === k).length;
      return `<span class="chip${flt === k ? ' on' : ''}${k === 'расхождение' && n ? ' bad' : ''}" onclick="CL.nightFilterUI('${k}')">${k} <span class="n">${n}</span></span>`; }).join('')}</div>`;
  const lp = st.lastPass;
  return `<div class="toolbar">
      <button class="btn btn-primary" onclick="CL.nightUI()">Запустить ночной проход</button>
      <span class="small">имитация: «сегодня» станет ${fmt(addDays(st.today, 1))}, проход встанет на 02:00</span>
    </div>
    ${lp ? `<div class="banner info">Последний проход ${fmtAt(lp.at)}: сверка за ${fmt(lp.day)} — рядов
      ${lp.checked}, расхождений без метки <b>${lp.mismatches}</b>; смен по дате ${lp.transitions};
      повторено меток ${lp.retried}.</div>` : ''}
    <div class="card">
      <h3>Журнал прохода</h3>
      ${chips}
      <table class="cgrid"><thead><tr><th>Время</th><th>Вид</th><th>Объект</th><th>Классификатор</th>
        <th>Что</th><th>Адресаты</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

/* ------------------- ЭКРАН: ПЕРИОДЫ И ФИКСАЦИЯ ---------------------- */
CL.repUI = m => { CL.state.repPeriod = m; render(); };
function latchCell(l){ return l ? '<span class="pill neutral">закрыт</span><div class="small">' + fmt(l.at) +
  (l.by ? ' · ' + esc(l.by) : '') + '</div>' : '<span class="muted">открыт</span>'; }
function objLinks(list){
  return list.map(x => `<div class="small"><a class="lnk" onclick="CL.openObj('${x.type || 'кредит'}','${esc(x.id || x)}')">${esc(x.name || x.id || x)}</a>${
    x.why ? ' — ' + esc(x.why) : ''}</div>`).join('');
}
function viewPeriods(){
  const st = CL.state;
  const open = CL.openPeriod();
  const pv = CL.closePreview();
  const periods = st.periods.map(p => `<tr><td>${monLabel(p.m)}</td>
      <td>${latchCell(p.uchet)}</td><td>${latchCell(p.klass)}</td><td>${latchCell(p.stat)}</td>
      <td>${p.klass ? '<span class="pill neutral">закрыт</span>' : p.m === open ? '<span class="pill ok">открыт</span>'
        : '<span class="pill info">будущий</span>'}</td></tr>`).join('');
  const closed = CL.closedMonths();
  const repM = st.repPeriod && CL.isClosed(first(st.repPeriod)) ? st.repPeriod : closed[closed.length - 1];
  const rep = repM ? CL.report12(repM) : null;
  const repChips = `<div class="chips">${closed.map(m =>
    `<span class="chip${m === repM ? ' on' : ''}" onclick="CL.repUI('${m}')">${monLabel(m)}</span>`).join('')}</div>`;
  const repRows = rep && rep.ok ? rep.rows.map(r => `<tr><td>${esc(r.label)}</td><td class="mono">${r.count}</td>
      <td>${r.count ? '<details><summary class="small">объекты</summary>' + objLinks(r.objs.map(id => ({type:'кредит', id}))) + '</details>' : ''}</td></tr>`).join('') : '';
  return `<div class="banner ${pv.canClose ? 'ok' : 'warn'}">
      Открыт период классификации <b>${open ? monLabel(open) : '—'}</b>.
      ${pv.canClose ? 'Закрыть можно: месяц завершён, учёт закрыт, висящих меток за месяц нет.'
        : '<b>Закрыть сейчас нельзя — ' + pv.refusals.length + ':</b><ul>' + pv.refusals.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>'}
    </div>
    ${closePreviewCard(pv)}
    ${CL.canClosePeriod() ? `<div class="btn-row" style="margin-bottom:14px">
      <button class="btn btn-primary" onclick="CL.closeUI()">Закрыть период ${open ? monLabel(open) : ''}</button>
    </div>` : `<div class="banner info">Период закрывает роль <b>«Администратор классификации»</b> —
      переключается в шапке.</div>`}
    <div class="card">
      <h3>Общий справочник учётных периодов</h3>
      <table class="cgrid"><thead><tr><th>Месяц</th><th>Учёт</th><th>Классификация</th><th>Статистика</th>
        <th>Для классификации</th></tr></thead><tbody>${periods}</tbody></table>
    </div>
    ${rep ? `<div class="card">
      <h3>Отчёт п. 12 — ${monLabel(rep.period)}</h3>
      ${repChips}
      ${rep.ok ? `${rep.late ? `<div class="banner warn">Срок представления ${fmt(rep.deadline)} прошёл: отчёт строится
        ${fmt(rep.builtAt)}, просрочка ${rep.lateBy} дн. Это предупреждение — ничего не запирается.</div>` : ''}
      <div class="kv">
        <div class="k">Период</div><div class="v">${monLabel(rep.period)} · интервалы на ${fmt(rep.last)}, редакция ${rep.verNo}</div>
        <div class="k">По состоянию на</div><div class="v">${fmt(rep.asOf)}</div>
        <div class="k">Срок представления</div><div class="v">не позднее ${fmt(rep.deadline)}</div>
        <div class="k">Период закрыт</div><div class="v">${fmt(rep.closedAt)} · ${esc(rep.by)}</div>
        <div class="k">Кредитов в отчёте</div><div class="v">${rep.total}</div>
      </div>
      <table class="cgrid" style="margin-top:12px"><thead><tr><th>Категория</th><th>Кредитов</th><th></th></tr></thead>
        <tbody>${repRows}</tbody></table>
      <div class="small" style="margin-top:8px">В строки значений не входят: вне области — ${rep.out.length
        ? rep.out.map(esc).join(', ') : 'нет'}; нет данных — ${rep.nodata.length ? rep.nodata.map(esc).join(', ') : 'нет'}.</div>`
      : '<div class="banner info">' + esc(rep.why) + '</div>'}
    </div>` : ''}
    ${st.log.length ? `<div class="card"><h3>Журнал действий сессии</h3>
      <table class="cgrid"><thead><tr><th>Когда</th><th>Кто</th><th>Что</th></tr></thead>
      <tbody>${st.log.map(l => `<tr><td class="mono">${fmtAt(l.at)}</td><td>${esc(l.who)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</tbody>
      </table></div>` : ''}`;
}
/* Предпросмотр читает интервалы на последний день месяца (ИК-24): четыре раздельные графы —
   со значением (по значениям), вне области, нет данных, висящие метки — и строка классификатора
   без интервалов. Каждое число раскрывается списком объектов с причиной. */
function closePreviewCard(pv){
  if(!pv.ok) return '';
  const rows = pv.rows.map(r => {
    if(r.verNo === null) return `<tr class="out"><td>${esc(r.clf)}</td><td class="muted">нет</td><td class="mono">${r.total}</td>
      <td colspan="3" class="small">${esc(r.why)}</td></tr>`;
    const vals = r.values.map(v => `<div class="small">${esc(v.label)}: <b>${v.objs.length}</b>${v.objs.length
      ? ' <details style="display:inline"><summary>кто</summary>' + objLinks(v.objs) + '</details>' : ''}</div>`).join('');
    const list = (xs, bad) => xs.length ? `<details><summary class="mono${bad ? ' bad' : ''}">${xs.length}</summary>${objLinks(xs)}</details>` : '<span class="mono">0</span>';
    return `<tr><td>${esc(r.clf)}</td><td>${r.verNo}</td><td class="mono">${r.total}</td>
      <td><b class="mono">${r.withValue}</b>${vals}</td><td>${list(r.out)}</td><td>${list(r.nodata, true)}</td></tr>`;
  }).join('');
  return `<div class="card">
    <h3>Предпросмотр закрытия ${monLabel(pv.period)} <span class="small">· интервалы на ${fmt(pv.last)}</span></h3>
    <div class="chips">
      <span class="chip on">со значением <span class="n">${pv.withValue}</span></span>
      <span class="chip">вне области <span class="n">${pv.out}</span></span>
      <span class="chip${pv.nodata ? ' bad' : ''}">нет данных <span class="n">${pv.nodata}</span></span>
      <span class="chip${pv.hanging.length ? ' bad' : ''}">висящих меток <span class="n">${pv.hanging.length}</span></span>
      <span class="chip">классификаторов без интервалов <span class="n">${pv.silent}</span></span>
    </div>
    <table class="cgrid"><thead><tr><th>Классификатор</th><th>Редакция на ${fmt(pv.last)}</th><th>Объектов</th>
      <th>Со значением</th><th>Вне области</th><th>Нет данных</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="small" style="margin-top:8px"><b>Висящие метки месяца:</b> ${pv.hanging.length
      ? pv.hanging.map(h => `<a class="lnk" onclick="CL.openObj('${h.type}','${esc(h.id)}')">${esc(h.name)}</a> — ожидает пересчёта с ${fmt(h.from)}`).join('; ') +
        ' — закрытие отклоняется, пока они не разобраны'
      : 'нет'}</div>
    ${pv.nodata ? `<div class="banner warn" style="margin-top:10px">Закрыть с графой «нет данных» можно, но
      эти объекты останутся без значения за ${monLabel(pv.period)} навсегда: после защёлки их интервалы не
      переписать.</div>` : ''}
  </div>`;
}
CL.closeUI = () => {
  const res = CL.closePeriod();
  if(res.ok) toast('период ' + monLabel(res.period) + ' закрыт классификацией: интервалы месяца неизменны, записей не создано', 'ok');
  else toast(res.why, 'err');
  render();
};

if(typeof window !== 'undefined') window.CL = CL;
if(typeof document !== 'undefined') render();
</script>
</body>
</html>
