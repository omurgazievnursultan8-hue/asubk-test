/* Предикат добавляется только выбором из реестра: свободных формул в конструкторе нет (ADR-0120). */
CL.addPred = (clfId, code, ri) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const clf = CL.clf(clfId);
  const ind = CL.state.indicators.find(i => !i.retired && CL.readable(clf.object, i.obj));
  if(!ind) return {ok:false, why:'в реестре нет доступного показателя'};
  rulesOf(clfId, code)[ri].preds.push(defaultPred(ind));
  return {ok:true};
};
CL.removePred = (clfId, code, ri, pi) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].preds.splice(pi, 1);
  return {ok:true};
};
CL.setPred = (clfId, code, ri, pi, field, raw) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const p = rulesOf(clfId, code)[ri].preds[pi];
  if(field === 'i'){ const ind = CL.ind(raw); Object.assign(p, defaultPred(ind)); delete p.set; }
  else if(field === 'op'){
    const wasSet = SET_OPS.indexOf(p.op) >= 0, nowSet = SET_OPS.indexOf(raw) >= 0;
    p.op = raw;
    /* Переключение скаляр↔множество не теряет уже выбранное: '= высокий' становится
       'одно из: высокий', и наоборот берётся первый член списка. Молчаливое обнуление
       правой части выглядело бы как сбой формы. */
    if(nowSet && !wasSet){ p.set = p.v === undefined ? [] : [p.v]; delete p.v; }
    if(!nowSet && wasSet){ p.v = (p.set || [])[0]; delete p.set; if(p.v === undefined) Object.assign(p, defaultPred(CL.ind(p.i)), {op:raw}); }
  }
  else {
    const ind = CL.ind(p.i);
    p.v = ind.type === 'число' ? Number(raw) : ind.type === 'булево' ? (raw === 'да' || raw === true) : raw;
  }
  return {ok:true};
};
/* Член множества добавляется и снимается по одному: список — это набор членов домена,
   свободного ввода у него нет (ИК-5). */
CL.togglePredMember = (clfId, code, ri, pi, member, on) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const p = rulesOf(clfId, code)[ri].preds[pi];
  const set = p.set || (p.set = []);
  const at = set.indexOf(member);
  if(on && at < 0) set.push(member);
  if(!on && at >= 0) set.splice(at, 1);
  return {ok:true};
};
function defaultPred(ind){
  if(ind.type === 'число')  return {i:ind.id, op:'≥', v:0};
  if(ind.type === 'булево') return {i:ind.id, op:'=', v:true};
  return {i:ind.id, op:'=', v:(ind.domain || [''])[0]};
}
/* ИК-15: классификатор кредита читает и свои показатели, и показатели заёмщика; обратно — нет. */
CL.readable = (clfObject, indObject) => clfObject === 'кредит' ? true : indObject === 'заёмщик';
/* Набор операторов задаёт тип показателя. Строгие > и < добавлены потому, что Порядок
   пишет «свыше 180» и «более 50 000 000»: пересчёт в ≥ 181 верен для целых дней и неверен
   для сомов с копейками, а переводить норму в голове — источник ошибки (ADR-0137 §2). */
CL.opsFor = ind => ind.type === 'число'       ? ['>','≥','<','≤','=','≠']
                 : ind.type === 'перечисление' ? ['=','≠','∈','∉']
                 :                               ['=','≠'];

/* ------------------- РЕЕСТР ПОКАЗАТЕЛЕЙ ---------------------------- */
CL.usedBy = indId => {
  const hits = [];
  CL.state.classifiers.forEach(c => c.versions.forEach(v => {
    if(v.status === 'прошлая') return;
    const inScope = (v.scope || []).some(r => (r.preds || []).some(p => p.i === indId));
    const inRules = v.values.some(val => (val.rules || []).some(r => r.preds.some(p => p.i === indId)));
    if(inScope || inRules) hits.push({clf:c.name, verNo:v.no, status:v.status, where:inScope ? 'область' : 'правило'});
  }));
  return hits;
};
/* Владельцы показателей редакции — адресаты дефекта стыка, когда ночной проход находит
   расхождение без метки: кому писать, если величина врёт (ADR-0120 §2, ADR-0246 §5). */
CL.ownersOf = ver => {
  const ids = [];
  allRules(ver).concat(ver.scope || []).forEach(r => (r.preds || []).forEach(p => { if(ids.indexOf(p.i) < 0) ids.push(p.i); }));
  return ids.map(id => (CL.ind(id) || {}).owner).filter((o, i, a) => o && a.indexOf(o) === i);
};
CL.retireIndicator = id => {
  if(!CL.canEditConstructor()) return {ok:false, why:'снимает показатели только администратор классификации'};
  const ind = CL.ind(id);
  if(!ind) return {ok:false, why:'показателя нет'};
  if(ind.retired) return {ok:false, why:'уже снят'};
  /* ИК-16: показатель, на который ссылается живая версия, с реестра не снимается —
     иначе действующее правило осталось бы без входа, и отказ был бы молчаливым. */
  const used = CL.usedBy(id).filter(u => u.status === 'действующая');
  if(used.length) return {ok:false, why:'показатель используется: ' +
    used.map(u => u.clf + ', редакция ' + u.verNo + ' (' + u.where + ')').join('; ')};
  CL.stamp();
  ind.retired = true;
  log('показатель «' + ind.name + '» снят с реестра');
  return {ok:true};
};
CL.addIndicator = spec => {
  if(!CL.canEditConstructor()) return {ok:false, why:'заводит показатели только администратор классификации'};
  if(!spec.id || CL.ind(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!spec.owner) return {ok:false, why:'у показателя обязан быть владелец — он и считает значение'};
  /* Домен — часть заведения перечисления, а не то, что дописывается потом: предикат сравнивает
     значение с ЧЛЕНОМ домена (ИК-5), и показатель без домена дал бы правило, которое не с чем
     сверить. Пока домен подставлялся кодом, заведённое с экрана перечисление вставало в реестр
     булевым под чужим типом (КФ-Д13). */
  const type = spec.type || 'булево';
  const dom = (spec.domain || []).map(d => String(d).trim()).filter(Boolean);
  const uniq = dom.filter((d, i) => dom.indexOf(d) === i);
  if(type === 'перечисление'){
    if(uniq.length < 2) return {ok:false, why:'у перечисления обязан быть домен — не меньше двух членов: предикат сравнивает значение с членом домена, а не со свободной строкой'};
    if(uniq.length !== dom.length) return {ok:false, why:'члены домена повторяются — домен перечисления состоит из различных значений'};
  } else if(dom.length) return {ok:false, why:'домен бывает только у перечисления: у типа «' + type + '» сравнивать не с чем'};
  CL.stamp();
  CL.state.indicators.push({id:spec.id, name:spec.name || spec.id, obj:spec.obj || 'кредит',
    type, domain: type === 'перечисление' ? uniq : null, src:spec.src || 'расчёт',
    owner:spec.owner, retired:false, events:[], note:spec.note || ''});
  log('заведён показатель «' + (spec.name || spec.id) + '» (владелец — ' + spec.owner + ')');
  return {ok:true};
};

/* ---------------------- ФАКТЫ (ADR-0122) --------------------------- *
 * Факт — событие владельца «Классификация»: заведение и аннулирование ставят метку
 * пересчёта кредита с даты «учтён с» в той же транзакции (ИК-25).
 * ------------------------------------------------------------------- */
CL.addFact = spec => {
  if(!CL.canEnterFacts()) return {ok:false, why:'наблюдатель факты не вводит'};
  if(!CL.credit(spec.creditId)) return {ok:false, why:'кредита нет'};
  if(!KIND(spec.kindId)) return {ok:false, why:'вид фактора не выбран'};
  if(!spec.occurred) return {ok:false, why:'не указана дата наступления'};
  if(spec.occurred > CL.state.today) return {ok:false, why:'дата наступления в будущем'};
  /* ИК-9: факт, наступивший в закрытом периоде, влияет на значение с начала открытого.
     Интервалы закрытого месяца не трогаются (ИК-26), но и факт не теряется — в реестре стоят
     обе даты, а метка встаёт с первого дня открытого. */
  const counted = CL.isClosed(spec.occurred) ? CL.startOfOpen() : spec.occurred;
  const id = 'F-' + String(CL.state.facts.length + 1).padStart(3, '0');
  CL.stamp();
  CL.state.facts.push({id, creditId:spec.creditId, kindId:spec.kindId, occurred:spec.occurred,
    counted, until:spec.until || null, doc:spec.doc || null, by:CL.state.role, annulled:null});
  log('заведён факт ' + id + ' по ' + spec.creditId + ' — ' + KIND(spec.kindId).name +
      (counted !== spec.occurred ? ' (учтён с ' + fmt(counted) + ')' : ''));
  const m = CL.mark('кредит', spec.creditId, counted, 'факт ' + id + ' заведён');
  return {ok:true, id, counted, markerFrom:m.from, hanging:!!CL.markerOf('кредит', spec.creditId)};
};
/* Корректировка не удаляет факт. Метка ставится с даты «учтён с»: ряд открытого периода
   переписывается, закрытый месяц неизменен (ADR-0122 решение 5, ИК-26). */
CL.annulFact = (id, reason) => {
  if(!CL.canEnterFacts()) return {ok:false, why:'наблюдатель факты не правит'};
  const f = CL.state.facts.find(x => x.id === id);
  if(!f) return {ok:false, why:'факта нет'};
  if(f.annulled) return {ok:false, why:'уже аннулирован'};
  if(!reason) return {ok:false, why:'аннулирование без причины не принимается'};
  const at = CL.stamp();
  f.annulled = {reason, by:CL.state.role, at};
  log('факт ' + id + ' аннулирован: ' + reason);
  const m = CL.mark('кредит', f.creditId, f.counted, 'аннулирование ' + id);
  return {ok:true, markerFrom:m.from, hanging:!!CL.markerOf('кредит', f.creditId)};
};
/* Судьба факта. Список причин закрытый — по нему фильтруют и считают (ИК-12). */
CL.factFate = (f, chosenCode, ver) => {
  if(f.annulled) return 'аннулирован';
  if(!f.doc) return 'не засчитан: нет решения комитета';
  if(f.until && f.until < CL.state.today) return 'не засчитан: интервал истёк';
  const v = ver || CL.activeVer('risk');
  if(v && v.comparable && chosenCode){
    const own = valueIndexByFactorLevel(v, KIND(f.kindId).level);
    const chosen = v.values.findIndex(x => x.code === chosenCode);
    if(own > -1 && chosen > -1 && own > chosen) return 'не засчитан: ведёт к более лёгкому значению, чем выбранное';
  }
  return 'засчитан';
};
/* Какое значение дал бы фактор сам по себе — берётся из правил версии, не из таблицы рангов. */
function valueIndexByFactorLevel(ver, level){
  return ver.values.findIndex(v => (v.rules || []).some(r =>
    r.preds.some(p => p.i === 'factorLevel' && ((p.op === '=' && p.v === level) || (p.op === '∈' && (p.set || []).includes(level))))));
}
/* Судьба факта в РЕЕСТРЕ считается против значения, которое кредит ХРАНИТ на сегодня: иначе
   третья причина закрытого списка («ведёт к более лёгкому значению, чем выбранное») видна
   только на витрине, и ИК-12 держится наполовину. Движок для этого не исполняется (ИК-24). */
CL.fateOf = f => {
  const a = CL.store.answerAt('risk', 'кредит', f.creditId, CL.state.today);
  const ok = a && a.state === 'есть';
  return CL.factFate(f, ok ? a.code : null, ok ? CL.editionNo('risk', a.verNo) : null);
};
CL.FATES = ['засчитан',
  'не засчитан: нет решения комитета',
  'не засчитан: интервал истёк',
  'не засчитан: ведёт к более лёгкому значению, чем выбранное',
  'аннулирован'];
CL.factCounts = () => {
  const out = {всего: CL.state.facts.length};
  CL.FATES.forEach(k => { out[k] = 0; });
  CL.state.facts.forEach(f => { const k = CL.fateOf(f); out[k] = (out[k] || 0) + 1; });
  return out;
};

/* ------------ СОБЫТИЯ ВЛАДЕЛЬЦЕВ (имитация соседних модулей) ------------ *
 * В системе этих кнопок нет: события приходят из платежей, кредитов, взыскания. Здесь они
 * нужны, чтобы увидеть две дороги к ряду — метку в транзакции события (ИК-25) и сверку
 * ночного прохода, когда метку забыли поставить (дефект стыка).
 * ------------------------------------------------------------------- */
CL.SIMS = {
  storno043: {owner:'Платежи', marker:false,
    title:'Сторно платежа 14.07.2026 по КД-2025/043 — метку не поставили',
    note:'Платёж отменён, взнос 14.07.2026 снова не оплачен: с 15.07.2026 у кредита просрочка. Метки нет — ряд остаётся прежним, пока ночной проход не найдёт расхождение за вчера.'},
  recall043: {owner:'Платежи', marker:true,
    title:'Отзыв расчёта просрочки по КД-2025/043 — с меткой',
    note:'Платежи отзывают расчёт с сегодняшнего дня и ставят метку: на запрос пары показателей просрочки теперь ответ «не отдан».'}
};
CL.simulate = key => {
  const s = CL.SIMS[key];
  if(!s) return {ok:false, why:'такого события нет'};
  if(s.done) return {ok:false, why:'событие уже проведено'};
  const c = CL.credit('КД-2025/043');
  const at = CL.stamp();
  if(key === 'storno043') c.layers[0].dues[0].paid = null;
  if(key === 'recall043') c.noCalcFrom = CL.state.today;
  s.done = at;
  log('имитация: ' + s.owner + ' — ' + s.title);
  if(!s.marker) return {ok:true, marker:false};
  const m = CL.mark('кредит', c.id, key === 'recall043' ? CL.state.today : '2026-07-14', s.title.split(' — ')[0]);
  return {ok:true, marker:true, markerFrom:m.from};
};
CL.setHandler = on => {
  CL.state.handler.running = !!on;
  CL.stamp();
  log('обработчик меток ' + (on ? 'запущен' : 'остановлен') + ' (имитация)');
  return {ok:true, done: on ? CL.processMarkers() : []};
};
CL.setOwnerDown = (owner, down) => {
  if(OWNERS.indexOf(owner) < 0) return {ok:false, why:'такого владельца нет'};
  CL.state.ownersDown[owner] = !!down;
  CL.stamp();
  log('владелец «' + owner + '» ' + (down ? 'не отвечает' : 'снова отвечает') + ' (имитация)');
  return {ok:true};
};
/* Разобрать одну метку вне очереди — кнопка экрана «Ожидают пересчёта». */
CL.retryMarker = (type, id) => {
  const m = CL.markerOf(type, id);
  if(!m) return {ok:false, why:'метки нет'};
  /* Повтор вручную — действие администратора (ТЗ 17 §11); остальные роли очередь читают. */
  if(!CL.canClosePeriod()) return {ok:false, why:'повторить метку вручную вправе только администратор классификации'};
  CL.stamp();
  const r = CL.runMarker(m);
  return r.ok ? {ok:true} : {ok:false, why:'пересчёт не прошёл: ' + r.why + ' — метка висит, попытка ' + m.attempts};
};

/* ------------------- НОЧНОЙ ПРОХОД (ADR-0246 §5) ------------------- *
 * В 02:00 следующего дня: 1) сверка вчерашнего дня — ответ движка против хранимого;
 * расхождение без метки — дефект стыка: запись с владельцами показателей и метка, молча
 * не исправляется; 2) смены по дате без события — первый день просрочки, 181-й день, конец
 * срока факта; 3) повтор висящих меток.
 * ------------------------------------------------------------------- */
function ansText(a){
  if(!a) return 'интервала нет';
  return (a.state === 'есть' ? '«' + a.label + '»' : a.state) + ', ред. ' + a.verNo;
}
CL.ansText = ansText;
/* Что сменилось без события — словами: какие правила сработали и какие перестали, какие
   факты вошли и вышли. Из данных редакции, без знания нормы в коде. */
function changeText(was, now){
  const rules = a => (a && a.why || []).filter(w => w.k === 'rule').map(w => (w.label || w.sig) + ' (' + w.norm + ')');
  const facts = a => (a && a.why || []).filter(w => w.k === 'fact').map(w => w.id);
  const on = rules(now).filter(x => rules(was).indexOf(x) < 0);
  const off = rules(was).filter(x => rules(now).indexOf(x) < 0);
  const fIn = facts(now).filter(x => facts(was).indexOf(x) < 0);
  const fOut = facts(was).filter(x => facts(now).indexOf(x) < 0);
  const parts = [ansText(was) + ' → ' + ansText(now)];
  if(on.length) parts.push('сработало: ' + on.join('; '));
  if(off.length) parts.push('перестало: ' + off.join('; '));
  if(fIn.length) parts.push('вошли факты: ' + fIn.join(', '));
  if(fOut.length) parts.push('вышли факты: ' + fOut.join(', '));
  return parts.join(' · ');
}
CL.changeText = changeText;
const keyName = k => (k.type === 'кредит' ? k.id : (CL.borrower(k.id) || {}).name || k.id);
const keyClf = k => k.fold ? 'Категория кредитного риска (свёртка)' : k.clf ? CL.clf(k.clf).name : 'все ряды объекта';
function night(at, kind, k, text, extra){
  CL.state.night.unshift(Object.assign({at, kind, obj:k ? keyName(k) : '', type:k ? k.type : '',
    id:k ? k.id : '', clf:k ? keyClf(k) : '', text}, extra || {}));
}
CL.nightly = () => {
  const st = CL.state;
  const T = st.today, T1 = addDays(T, 1);
  const at = T1 + ' 02:00';
  let checked = 0, mism = 0, waiting = 0, trans = 0;
  /* 1. Сверка вчерашнего дня. Свёртка сверяется с хранимыми ответами кредитов — её вход
     классификация держит сама; расхождение кредита ловится на его собственном ряду. */
  CL.allKeys(T).forEach(k => {
    let fresh;
    try { fresh = k.fold ? foldAnswer(k.id, T, cid => CL.store.answerAt('risk', 'кредит', cid, T))
                         : CL.answer(k.clf, k.type, k.id, T); }
    catch(e){ night(at, 'сбой', k, 'сверка за ' + fmt(T) + ' не выполнена: ' + e.message); return; }
    checked++;
    const stored = CL.store.answerAt(k.clf, k.type, k.id, T);
    if(keyOf(fresh) === keyOf(stored)) return;
    if(CL.updating(k.type, k.id, T)){ waiting++; return; }
    mism++;
    const ver = CL.editionAt(k.clf, T);
    const owners = ver ? CL.ownersOf(ver).filter(o => o !== 'Классификация') : [];
    night(at, 'расхождение', k, 'за ' + fmt(T) + ' хранится ' + ansText(stored) + ', пересчёт даёт ' +
      ansText(fresh) + ' — метки не было: событие владельца прошло мимо классификации',
      {owners});
    CL.placeMarker(k.type, k.id, CL.startOfOpen(), 'ночной проход: расхождение за ' + fmt(T) + ' без метки — дефект стыка');
  });
  /* 2. Новый день. Смена ответа по дате без события — движение вперёд: текущий интервал
     закрывается вчерашним днём, новый открывается сегодняшним; в журнал перезаписи это не
     пишется (ADR-0246 §8). */
  st.today = T1;
  if(st.asOf === T) st.asOf = T1;
  CL.ensurePeriod(ym(T1));
  st.minute = 2 * 60;
  CL.allKeys(T1).forEach(k => {
    /* Объект с висящей меткой ждёт её разбора в шаге 3: смена «по дате» у него была бы
       смесью даты и пропущенного события. */
    if(CL.updating(k.type, k.id, T1)) return;
    let fresh;
    try { fresh = k.fold ? foldAnswer(k.id, T1, cid => CL.store.answerAt('risk', 'кредит', cid, T1))
                         : CL.answer(k.clf, k.type, k.id, T1); }
    catch(e){
      CL.placeMarker(k.type, k.id, T1, 'ночной проход: смена по дате не посчитана — ' + e.message);
      night(at, 'сбой', k, 'смена по дате на ' + fmt(T1) + ' не посчитана: ' + e.message + ' — поставлена метка');
      return;
    }
    const was = CL.store.answerAt(k.clf, k.type, k.id, T);
    if(keyOf(fresh) === keyOf(CL.store.answerAt(k.clf, k.type, k.id, T1))) return;
    const r = CL.store.rewrite(k, T1, [fresh], 'ночной проход: смена по дате', at);
    if(r.ok && r.changed){ trans++; night(at, 'смена по дате', k, changeText(was, fresh)); }
  });
  /* 3. Повтор висящих меток — в том числе поставленных сверкой в шаге 1. */
  const tries = CL.state.markers.slice().map(m => {
    const r = CL.runMarker(m);
    night(at, 'повтор метки', {type:m.type, id:m.id},
      r.ok ? 'метка с ' + fmt(m.from) + ' разобрана, ряд переписан' : 'не разобрана: ' + r.why + ' — попытка ' + m.attempts);
    return r;
  });
  night(at, 'сверка', null, 'сверка за ' + fmt(T) + ': рядов ' + checked + ', расхождений без метки ' + mism +
    (waiting ? ', ждут метки ' + waiting : '') + '; смен по дате ' + trans + '; повторено меток ' + tries.length);
  st.lastPass = {at, day:T, checked, mismatches:mism, transitions:trans, retried:tries.length};
  st.minute = 10 * 60 + 13;
  return {ok:true, day:T, today:T1, checked, mismatches:mism, transitions:trans, retried:tries.length};
};

/* ----------- ЗАКРЫТИЕ ПЕРИОДА — ЗАЩЁЛКА (ADR-0204, ADR-0246 §6) ----------- *
 * Закрытие ничего не пишет: оно ставит колонку классификации в общем справочнике периодов,
 * и с этой минуты интервалы месяца неизменны (ИК-26). Предпросмотр и отчёт п. 12 читают
 * интервалы на последний день месяца — движок не исполняется (ИК-24).
 * ------------------------------------------------------------------- */
CL.hangingIn = m => CL.state.markers.filter(x => x.from <= lastDay(m));
const markerObj = x => x.type === 'кредит' ? x.id : (CL.borrower(x.id) || {}).name || x.id;
CL.closeRefusals = m => {
  const out = [];
  if(!m) return ['открытых периодов нет'];
  const p = CL.period(m);
  const asOf = first(nextM(m));
  if(CL.state.today < asOf) out.push('период ' + monLabel(m) + ' ещё не завершён: закрытие возможно с ' + fmt(asOf));
  if(!p || !p.uchet) out.push('учёт ещё не закрыл ' + monLabel(m) +
    ': колонка классификации ставится после колонки учёта того же месяца');
  CL.hangingIn(m).forEach(x => out.push(markerObj(x) + ' — ожидает пересчёта с ' + fmt(x.from)));
  return out;
};
CL.closePreview = periodId => {
  const m = periodId || CL.openPeriod();
  if(!m) return {ok:false, why:'открытых периодов нет'};
  const L = lastDay(m);
  const rows = CL.state.classifiers.map(clf => {
    const ver = CL.editionAt(clf.id, L);
    const objs = CL.objectsOf(clf.object, L);
    if(!ver) return {clf:clf.name, clfId:clf.id, verNo:null, total:objs.length, values:[], out:[], nodata:[], none:[],
      why: clf.stopped && clf.stopped.from <= L
        ? 'действие прекращено с ' + fmt(clf.stopped.from) + ' — интервалов на ' + fmt(L) + ' нет'
        : 'действующей редакции на ' + fmt(L) + ' нет — интервалов за месяц нет вовсе'};
    const byCode = ver.values.map(v => ({code:v.code, label:v.label, objs:[]}));
    const out = [], nodata = [], none = [];
    objs.forEach(o => {
      const iv = CL.store.at(clf.id, o.type, o.id, L);
      const name = o.type === 'кредит' ? o.id : (CL.borrower(o.id) || {}).name;
      const row = {type:o.type, id:o.id, name, why: iv ? iv.why.map(whyLine).join(' · ') : 'интервала нет'};
      if(!iv) none.push(row);
      else if(iv.state === 'вне области') out.push(row);
      else if(iv.state === 'нет данных') nodata.push(row);
      else { let b = byCode.find(x => x.code === iv.code);
             if(!b){ b = {code:iv.code, label:iv.label + ' (ред. ' + iv.verNo + ')', objs:[]}; byCode.push(b); }
             b.objs.push(row); }
    });
    return {clf:clf.name, clfId:clf.id, verNo:ver.no, total:objs.length, values:byCode,
      withValue: byCode.reduce((s, b) => s + b.objs.length, 0), out, nodata, none, why:null};
  });
  const hanging = CL.hangingIn(m).map(x => ({type:x.type, id:x.id, name:markerObj(x), from:x.from,
    attempts:x.attempts, lastError:x.lastError}));
  const refusals = CL.closeRefusals(m);
  const sum = f => rows.reduce((s, r) => s + f(r), 0);
  return {ok:true, period:m, last:L, asOf:first(nextM(m)), rows, hanging, refusals, canClose:!refusals.length,
    withValue:sum(r => r.withValue || 0), out:sum(r => r.out.length), nodata:sum(r => r.nodata.length),
    silent:rows.filter(r => r.verNo === null).length};
};
CL.closePeriod = () => {
  if(!CL.canClosePeriod()) return {ok:false, why:'период закрывает администратор классификации',
    refusals:['период закрывает администратор классификации']};
  const m = CL.openPeriod();
  const refusals = CL.closeRefusals(m);
  if(refusals.length) return {ok:false, why:refusals[0], refusals};
  const at = CL.stamp();
  const before = CL.state.intervals.length;
  CL.period(m).klass = {by:CL.state.role, at:CL.state.today, time:at};
  CL.ensurePeriod(nextM(m));
  log('период ' + monLabel(m) + ' закрыт классификацией: интервалы по ' + fmt(lastDay(m)) +
      ' неизменны, записей не создано');
  return {ok:true, period:m, written:CL.state.intervals.length - before};
};
/* Отчёт п. 12 за закрытый месяц: интервалы на последний день месяца, строки — в порядке
   значений редакции, действовавшей в тот день. «Вне области» и «нет данных» в строки значений
   не входят, но названы под таблицей. Срок — 15-е; просрочка — предупреждение (ИК-14). */
CL.report12 = periodId => {
  const closed = CL.closedMonths();
  const m = periodId || closed[closed.length - 1];
  const p = CL.period(m);
  if(!p || !p.klass) return {ok:false, period:m, why:'отчёт п. 12 строится по закрытому периоду — ' + monLabel(m) + ' ещё открыт'};
  const L = lastDay(m);
  const ver = CL.editionAt('risk', L);
  const credits = CL.objectsOf('кредит', L);
  const ivs = credits.map(o => ({id:o.id, iv:CL.store.at('risk', 'кредит', o.id, L)}));
  const rows = (ver ? ver.values : []).map(v => ({code:v.code, label:v.label,
    objs:ivs.filter(x => x.iv && x.iv.state === 'есть' && x.iv.code === v.code).map(x => x.id)}));
  const other = ivs.filter(x => x.iv && x.iv.state === 'есть' && !rows.some(r => r.code === x.iv.code));
  if(other.length) rows.push({code:'—', label:'значения других редакций', objs:other.map(x => x.id)});
  rows.forEach(r => { r.count = r.objs.length; });
  const deadline = day15(nextM(m));
  const late = CL.state.today > deadline;
  return {ok:true, period:m, last:L, verNo:ver ? ver.no : null, asOf:first(nextM(m)), deadline,
    closedAt:p.klass.at, by:p.klass.by, builtAt:CL.state.today, late,
    lateBy: late ? daysBetween(deadline, CL.state.today) : 0,
    total:rows.reduce((s, r) => s + r.count, 0), rows,
    out:ivs.filter(x => x.iv && x.iv.state === 'вне области').map(x => x.id),
    nodata:ivs.filter(x => x.iv && x.iv.state === 'нет данных').map(x => x.id)};
};

function log(msg){ CL.state.log.unshift({at:CL.now(), who:CL.state.role, msg}); }

/* ------------------- ПРОГОН ИСТОРИИ ЗАТРАВКИ ------------------- *
 * Хранимые интервалы затравка не выдумывает: прогон спрашивает владельцев на каждый день с
 * 01.05.2026 по сегодня и сжимает ответы в интервалы по тем же правилам, по которым их пишет
 * обработчик (новый интервал — только при смене ответа). Причина записи — событие владельца
 * или публикация, если оно пришлось на этот день, иначе смена по дате: такие дни ночной проход
 * записывает в свой журнал. Перезаписей и меток в затравке нет.
 * ------------------------------------------------------------------- */
function eventsOn(k, d){
  const st = CL.state;
  const ev = [];
  const ver = k.fold ? CL.editionAt('risk', d) : CL.editionAt(k.clf, d);
  if(ver && ver.from === d) ev.push('публикация редакции ' + ver.no + ' «' + CL.clf(k.fold ? 'risk' : k.clf).name + '»');
  const credits = k.type === 'кредит' ? [CL.credit(k.id)] : st.credits.filter(c => c.inn === k.id);
  credits.forEach(c => {
    if(c.issued === d) ev.push('выдача кредита ' + c.id);
    c.layers.forEach(l => (l.dues || []).forEach(x => { if(x.paid === d) ev.push('проведение платежа по ' + c.id); }));
    /* Факт двигает только ряды кредита и свёртку: классификатор заёмщика показателей кредита не
       читает (ИК-15), и приписывать ему факт как причину было бы неправдой. */
    if(k.type === 'кредит' || k.fold)
      st.facts.filter(f => f.creditId === c.id && f.counted === d).forEach(f => ev.push('факт ' + f.id + ' заведён'));
  });
  return ev;
}
CL.replay = () => {
  const st = CL.state;
  const start = '2026-05-01';
  const days = dayRange(start, st.today);
  const riskOf = {};
  CL.allKeys(st.today).forEach(k => {
    const arr = days.map((d, i) => k.fold
      ? foldAnswer(k.id, d, cid => riskOf[cid] ? riskOf[cid][i] : null)
      : CL.answer(k.clf, k.type, k.id, d));
    if(k.type === 'кредит' && k.clf === 'risk') riskOf[k.id] = arr;
    let cur = null;
    arr.forEach((a, i) => {
      const d = days[i];
      if(cur && a && keyOf(ansOf(cur)) === keyOf(a)) return;
      if(cur) cur.until = addDays(d, -1);
      cur = null;
      if(!a) return;
      const ev = eventsOn(k, d);
      const prev = i ? arr[i - 1] : null;
      const nightly = !ev.length && i > 0;
      cur = Object.assign({clf:k.clf, type:k.type, id:k.id, from:d, until:null}, JSON.parse(JSON.stringify(a)),
        {written:{at:d + (nightly ? ' 02:00' : ev.length ? ' 11:40' : ' 02:00'),
                  cause:nightly ? 'ночной проход: смена по дате' : ev.length ? ev.join('; ') : 'начальная загрузка ряда'}});
      st.intervals.push(cur);
      if(nightly) night(d + ' 02:00', 'смена по дате', k, changeText(prev, a));
    });
  });
  const T = addDays(st.today, -1);
  night(st.today + ' 02:00', 'сверка', null, 'сверка за ' + fmt(T) + ': рядов ' + CL.allKeys(T).length +
    ', расхождений без метки 0; смен по дате ' + st.night.filter(n => n.at.slice(0, 10) === st.today).length +
    '; повторено меток 0');
  st.night.sort((a, b) => a.at < b.at ? 1 : a.at > b.at ? -1 : 0);
  st.lastPass = {at:st.today + ' 02:00', day:T, checked:CL.allKeys(T).length, mismatches:0, transitions:0, retried:0};
};
CL.seed = () => { CL.state = seed(); CL.replay(); return CL.state; };
CL.seed();

/* ===================================================================== *
 *                              ЭКРАНЫ
 * ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
const pillFor = code => code === 'high' ? 'err' : code === 'mid' ? 'warn' : code === 'low' ? 'ok' : 'neutral';
/* Состояние интервала рисуется тремя разными видами: «вне области» — норма, «нет данных» —
   чужой долг, и сливать их в один прочерк нельзя (ИК-7, ИК-20). */
function statePill(a){
  if(!a || a.none || !a.state) return '<span class="pill neutral">интервала нет</span>';
  if(a.state === 'есть') return `<span class="pill ${pillFor(a.code)}">${esc(a.label)}</span>`;
  if(a.state === 'вне области') return '<span class="pill neutral">вне области</span>';
  return '<span class="pill err">нет данных</span>';
}
function flagsHtml(r){
  return (r.closed ? ' <span class="pill info">период закрыт</span>' : '') +
         (r.updating ? ' <span class="pill warn">обновляется</span>' : '');
}
const ivSpan = iv => fmt(iv.from) + ' — ' + (iv.until ? fmt(iv.until) : 'по сей день');

/* Переход по разделу всегда возвращает к списку: боковое меню называет раздел, а не
   последний открытый объект. */
CL.go = v => { const st = CL.state; st.view = v; st.curClf = null; st.curInd = null; st.curObj = null; render(); };
CL.open = id => { const st = CL.state; st.curClf = id; st.clfVer = null; st.clfTab = 'values'; render(); };
CL.openInd = id => { CL.state.curInd = id; render(); };
/* Карточка разбора живёт под витриной: в неё ведут строка витрины, строка отчёта п. 12 и
   строка экрана «Ожидают пересчёта». */
CL.openObj = (type, id) => { const st = CL.state; st.view = 'show'; st.curObj = {type, id}; render(); };
CL.back = () => { const st = CL.state;
  if(st.view === 'ind') st.curInd = null; else if(st.view === 'show') st.curObj = null; else st.curClf = null; render(); };
CL.tab = k => { CL.state.clfTab = k; render(); };
CL.showVer = no => { CL.state.clfVer = no; render(); };
CL.setRole = r => { CL.state.role = r; render(); };
CL.setAsOf = d => { CL.state.asOf = d; render(); };

const TITLES = {clf:'Классификаторы', ind:'Реестр показателей', facts:'Факты (п. 11)',
  show:'Витрина результата', wait:'Ожидают пересчёта', night:'Журнал ночного прохода', per:'Периоды и фиксация'};
const objName = o => o.type === 'кредит' ? o.id : ((CL.borrower(o.id) || {}).name || o.id);

/* Разметка панели собирается отдельно от её вставки в DOM: смоук вызывает panelHtml()
   без браузера и проверяет ровно то, что увидит человек (роль, вкладки, фильтры). */
function deepName(){
  const st = CL.state;
  if(st.view === 'clf' && st.curClf) return (CL.clf(st.curClf) || {}).name || '';
  if(st.view === 'ind' && st.curInd) return (CL.ind(st.curInd) || {}).name || '';
  if(st.view === 'show' && st.curObj) return 'Карточка разбора · ' + objName(st.curObj);
  return '';
}
function panelHtml(){
  const st = CL.state;
  return st.view === 'clf'  ? viewClassifiers() :
         st.view === 'ind'  ? viewIndicators()  :
         st.view === 'facts'? viewFacts()       :
         st.view === 'show' ? viewShowcase()    :
         st.view === 'wait' ? viewWait()        :
         st.view === 'night'? viewNight()       : viewPeriods();
}
CL.panelHtml = panelHtml;
CL.deepName = deepName;
/* Даты среза: конец мая и июня (закрыты), день до смены редакции, конец июля и сегодня. */
CL.sliceDates = () => ['2026-05-31', '2026-06-30', '2026-07-05', '2026-07-31', CL.state.today]
  .filter((d, i, a) => a.indexOf(d) === i && d <= CL.state.today);

function render(){
  if(typeof document === 'undefined') return;   // без DOM рисовать нечего (смоук)
  const st = CL.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  const wc = $('#waitCnt'); if(wc) wc.textContent = st.markers.length ? st.markers.length : '';
  const deep = deepName();
  const title = $('#title');
  title.textContent = TITLES[st.view];
  title.className = 'crumb-title' + (deep ? ' link' : '');
  title.onclick = deep ? CL.back : null;
  $('#crumb').textContent = deep ? '/ ' + deep : '';
  const sel = $('#role');
  sel.innerHTML = ROLES.map(r => `<option${r === st.role ? ' selected' : ''}>${esc(r)}</option>`).join('');
  const dates = CL.sliceDates();
  if(dates.indexOf(st.asOf) < 0) dates.push(st.asOf);
  $('#asOf').innerHTML = dates.map(d => `<option value="${d}"${d === st.asOf ? ' selected' : ''}>${fmt(d)} · ${
    CL.isClosed(d) ? 'закрытый период' : 'открытый период'}</option>`).join('');
  $('#foot').innerHTML = `Сегодня <b>${fmt(st.today)}</b>. Открыт период классификации
    <b>${monLabel(CL.openPeriod() || '—')}</b>; закрыто: ${CL.closedMonths().map(monLabel).join(', ') || '—'}.<br>
    Обработчик меток: ${st.handler.running ? 'работает' : '<b>остановлен</b>'} · висит меток: ${st.markers.length}.`;
  const panel = $('#panel');
  panel.className = 'panel-wrap';
  panel.innerHTML = panelHtml();
}
CL.render = render;

function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 5200);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(okMsg + CL.markerNote(), 'ok'); }
  else toast((res && (res.why || (res.refusals || [])[0])) || 'отказано', 'err');
  render();
}
/* Правка ТЕКСТОВОГО поля идёт без перерисовки панели. Поля висели на onchange, а act() менял
   #panel целиком: mousedown по соседней кнопке уводил фокус → change → перерисовка → mouseup
   приходил уже на новый узел, и первое нажатие пропадало (КФ-Д9). Отказ всё равно называется —
   тостом, без перерисовки. Экран догоняет состояние при следующей отрисовке: пункт основания и
   подпись правила ни счётчиков, ни связок не двигают. */
CL.quiet = res => {
  if(!(res && res.ok)) toast((res && (res.why || (res.refusals || [])[0])) || 'отказано', 'err');
  return res;
};
/* Отказ модального окна печатается ВНУТРИ окна, а не тостом за затемнением (КФ-Д10), и окно
   при отказе не перерисовывается — набранное в полях остаётся на месте (родня КФ-Д11). */
function modalErr(msg){
  if(typeof document === 'undefined') return;
  const el = document.getElementById('modalErr');
  if(!el) return toast(msg, 'err');
  el.innerHTML = '<div class="banner danger">' + esc(msg) + '</div>';
}
function modalAct(res, okMsg){
  if(res && res.ok){ closeModal(); if(okMsg) toast(okMsg + CL.markerNote(), 'ok'); render(); return true; }
  modalErr((res && (res.why || (res.refusals || [])[0])) || 'отказано');
  return false;
}
/* Модалка вместо prompt()/confirm(): модальные окна браузера блокируют страницу целиком и
   в дизайн-системе АСУБК не используются ни в одном макете. */
function openModal(html){
  if(typeof document === 'undefined') return;
  const h = document.getElementById('modalHost');
  h.innerHTML = '<div class="modal">' + html + '</div>';
  h.classList.add('open');
}
function closeModal(){
  if(typeof document === 'undefined') return;
  const h = document.getElementById('modalHost');
  h.classList.remove('open'); h.innerHTML = '';
}

/* ------------------------ ЭКРАН: КЛАССИФИКАТОРЫ --------------------- */
function verPill(v){
  return v.status === 'действующая' ? '<span class="pill ok">действующая</span>'
       : v.status === 'черновик'    ? '<span class="pill warn">черновик</span>'
                                    : '<span class="pill neutral">прошлая</span>';
}
function predHtml(clfId, code, ri, pi, p, editable){
  const clf = CL.clf(clfId);
  const ind = CL.ind(p.i) || {name:p.i, type:'—', domain:[]};
  const isSet = SET_OPS.indexOf(p.op) >= 0;
  if(!editable){
    return `<span class="pred"><code class="mono">${esc(ind.name)}</code> ${esc(opWord(p.op))}
      <code class="mono">${esc(constOf(p))}</code></span>`;
  }
  const inds = CL.state.indicators.filter(i => (!i.retired || i.id === p.i) && CL.readable(clf.object, i.obj));
  const opts = inds.map(i => `<option value="${i.id}"${i.id === p.i ? ' selected' : ''}>${esc(i.name)}${i.retired ? ' (снят)' : ''}</option>`).join('');
  const ops = CL.opsFor(ind).map(o => `<option value="${o}"${o === p.op ? ' selected' : ''}>${o === '∈' ? '∈ одно из' : o === '∉' ? '∉ ни одно из' : o}</option>`).join('');
  const set = p.set || [];
  const val = isSet
    /* Флажки по домену, а не поле ввода: набор членов домена нельзя опечатать (ИК-5). */
    ? `<span class="setbox">${(ind.domain || []).map(d =>
        `<label><input type="checkbox"${set.indexOf(d) >= 0 ? ' checked' : ''}
           onchange="act(CL.togglePredMember('${clfId}','${code}',${ri},${pi},${esc(JSON.stringify(d))},this.checked))">${esc(d)}</label>`
        ).join('') || '<span class="setflat">у показателя нет домена</span>'}</span>`
    : ind.type === 'число'
    ? `<input type="number" style="width:110px" value="${esc(p.v)}" oninput="CL.quiet(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">`
    : ind.type === 'булево'
    ? `<select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">
         <option${p.v === true ? ' selected' : ''}>да</option><option${p.v === false ? ' selected' : ''}>нет</option></select>`
    : `<select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">${
        (ind.domain || []).map(d => `<option${d === p.v ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select>`;
  return `<span class="pred">
    <select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'i',this.value))">${opts}</select>
    <select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'op',this.value))">${ops}</select>
    ${val}
    <button class="btn btn-secondary btn-sm" onclick="act(CL.removePred('${clfId}','${code}',${ri},${pi}))">✕</button></span>`;
}
/* Правило рисуется одинаково у значения и у области — разница только в адресе (code). */
function ruleHtml(clfId, code, r, ri, editable, scope){
  return `<div class="rule">
      <div class="rule-h">
        <span>правило ${ri + 1} ·</span>
        ${editable
          ? `${scope ? '' : `<input value="${esc(r.norm || '')}" placeholder="пункт основания" style="height:28px;width:170px;border:1px solid var(--border-strong);border-radius:4px;padding:0 8px"
               oninput="CL.quiet(CL.setRuleNorm('${clfId}','${code}',${ri},this.value))">`}
             <input value="${esc(r.label || '')}" placeholder="подпись правила" style="height:28px;width:200px;border:1px solid var(--border-strong);border-radius:4px;padding:0 8px"
               oninput="CL.quiet(CL.setRuleLabel('${clfId}','${code}',${ri},this.value))">
             <button class="btn btn-secondary btn-sm" onclick="act(CL.removeRule('${clfId}','${code}',${ri}))">удалить правило</button>`
          : `<b>${esc(scope ? (r.label || 'правило входа') : (r.norm || 'без пункта'))}</b>${
              !scope && r.label ? ' · ' + esc(r.label) : ''}`}
      </div>
      ${(r.preds || []).map((p, pi) => predHtml(clfId, code, ri, pi, p, editable))
              .join('<span class="and">и</span>') ||
        '<div class="small">предикатов нет — правило не сработает никогда</div>'}
      ${editable ? `<div><button class="btn btn-secondary btn-sm" onclick="act(CL.addPred('${clfId}','${code}',${ri}))">+ предикат (и)</button></div>` : ''}
    </div>`;
}
/* Правила связаны ИЛИ. Связка пишется между блоками, а не подразумевается (КФ-Д7). */
function rulesHtml(clfId, code, rules, editable, scope){
  return rules.map((r, ri) => ruleHtml(clfId, code, r, ri, editable, scope))
              .join('<div><span class="or">или</span></div>');
}
CL.rulesHtml = rulesHtml;
/* Фраза значения одной строкой: сколько правил и как связаны. Без неё читатель считает
   блоки глазами и не видит, что связка — ИЛИ (КФ-Д7). */
function rulesSummary(rules){
  const n = rules.length;
  if(!n) return '';
  const preds = rules.reduce((a, r) => a + (r.preds || []).length, 0);
  return n === 1
    ? `<div class="rule-sum">Одно правило из <b>${preds}</b> ${plural(preds, 'предиката', 'предикатов', 'предикатов')}, связка — <b>И</b>.</div>`
    : `<div class="rule-sum">Сработает, если верно <b>любое из ${n}</b> правил (связка — <b>ИЛИ</b>); внутри правила предикаты связаны <b>И</b>.</div>`;
}
function plural(n, one, few, many){
  const d = n % 10, h = n % 100;
  return (d === 1 && h !== 11) ? one : (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? few : many;
}
function valueHtml(clfId, ver, v, idx, editable){
  const rules = (v.rules || []);
  const body = v.dflt
    ? `<div class="small">правил нет — <b>значение по умолчанию</b>, замыкает список${v.norm ? ' · ' + esc(v.norm) : ''}</div>`
    : rules.length ? rulesSummary(rules) + rulesHtml(clfId, v.code, rules, editable, false)
    : `<div class="small">правил нет — значение объявлено, но назначено быть не может</div>`;
  return `<div class="val">
    <div class="val-h">
      <span class="nm">${idx + 1}. ${esc(v.label)}</span>
      ${v.dflt ? '<span class="pill info">по умолчанию</span>' : ''}
      ${!v.dflt && rules.length > 1 ? '<span class="pill neutral">' + rules.length + ' правила через ИЛИ</span>' : ''}
      ${editable ? `<span class="acts">
        <button class="btn btn-secondary btn-sm" onclick="act(CL.moveValue('${clfId}','${v.code}',-1))">↑</button>
        <button class="btn btn-secondary btn-sm" onclick="act(CL.moveValue('${clfId}','${v.code}',1))">↓</button>
        ${v.dflt ? '' : `<button class="btn btn-secondary btn-sm" onclick="act(CL.addRule('${clfId}','${v.code}',''))">+ правило (или)</button>
        <button class="btn btn-secondary btn-sm" onclick="act(CL.setDefault('${clfId}','${v.code}'))">сделать по умолчанию</button>`}
        <button class="btn btn-secondary btn-sm" onclick="act(CL.removeValue('${clfId}','${v.code}'))">удалить</button></span>` : ''}
    </div>
    <div class="val-b">${body}</div></div>`;
}
/* ------------------------ ЭКРАН: КЛАССИФИКАТОРЫ ---------------------
 * Экран разведён надвое: СПИСОК (что вообще заведено в системе) и КАРТОЧКА одного
 * классификатора (редакции, значения, публикация, журнал). Модуль обещает четвёртый и пятый
 * классификатор НАСТРОЙКОЙ, а не релизом (ADR-0120) — простыня карточек росла бы вместе с
 * ними, а список не растёт. Маршрут держится в состоянии (curClf, clfTab, clfVer), а не в
 * DOM, поэтому смоук проверяет ту же разметку, что видит человек.
 * ------------------------------------------------------------------- */
function clfState(c){
  const a = CL.activeVer(c.id), d = CL.draftVer(c.id);
  if(c.stopped) return {pill:'<span class="pill err">действие прекращено</span>',
    small:'с ' + fmt(c.stopped.from) + ' · ' + esc(c.stopped.reason)};
  if(a && d)    return {pill:'<span class="pill warn">есть черновик</span>', small:'редакция ' + d.no + ' готовится'};
  if(a)         return {pill:'<span class="pill ok">действует</span>', small:''};
  if(d)         return {pill:'<span class="pill info">только черновик</span>', small:'значений пока не назначает'};
  return {pill:'<span class="pill neutral">редакций нет</span>', small:''};
}
/* Роль без права правки не получает погашенных кнопок: их не показывают вовсе, а строкой
   названо, кто вправе. Недоступная кнопка — тот же молчаливый отказ, что и пустой экран:
   человек видит запрет и не видит причины (§0.3, урок КФ-Д6). */
function readOnlyBanner(what){
  return CL.canEditConstructor() ? '' :
    `<div class="banner info">Только просмотр: ${what} правит роль
      <b>«Администратор классификации»</b> — переключается в шапке. Кнопки настройки не показаны
      вовсе: погашенная кнопка сообщила бы о запрете, но не о причине.</div>`;
}
function viewClassifiers(){
  return CL.state.curClf ? clfDetail(CL.state.curClf) : clfList();
}
function clfList(){
  const rows = CL.state.classifiers.map(c => {
    const a = CL.activeVer(c.id), d = CL.draftVer(c.id), s = clfState(c);
    /* Графа считает значения той редакции, о которой говорит соседняя графа состояния:
       у прекращённого — последней по номеру, а не ноль при трёх заведённых значениях (КФ-Д17). */
    const last = c.versions.slice().sort((x, y) => y.no - x.no)[0];
    const vals = (a || d || last || {values:[]}).values.length;
    return `<tr class="pick" onclick="CL.open('${c.id}')">
      <td><span class="rowname">${esc(c.name)}</span><div class="small mono">${esc(c.id)}</div></td>
      <td>${esc(c.object)}</td>
      <td>${a ? 'редакция ' + a.no : '<span class="muted">нет</span>'}</td>
      <td>${a ? fmt(a.from) : '—'}</td>
      <td class="mono">${vals}</td>
      <td>${s.pill}${s.small ? '<div class="small">' + s.small + '</div>' : ''}</td></tr>`;
  }).join('');
  return `${readOnlyBanner('классификаторы')}
    <div class="toolbar">
      ${CL.canEditConstructor() ? '<button class="btn btn-primary" onclick="CL.newClfUI()">+ Классификатор</button>' : ''}
      <span class="small">всего ${CL.state.classifiers.length}</span>
    </div>
    <table class="cgrid"><thead><tr><th>Наименование</th><th>Объект</th><th>Действующая редакция</th>
      <th>Действует с</th><th>Значений</th><th>Состояние</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
}
CL.newClfUI = () => {
  openModal(`<div class="modal-h"><span class="mt">Завести классификатор</span>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p class="small">Четвёртая классификация появляется <b>настройкой, а не релизом</b>:
        новый классификатор открывается пустым черновиком и до публикации никого не классифицирует.
        Объект задаётся здесь и потом не меняется — сменить его значило бы обессмыслить уже
        записанные интервалы.</p>
      <div class="fld" style="margin-bottom:10px"><label>Идентификатор</label>
        <input id="ncId" placeholder="например: pledgeQuality"></div>
      <div class="fld" style="margin-bottom:10px"><label>Наименование</label>
        <input id="ncName" placeholder="Качество обеспечения"></div>
      <div class="fld"><label>Объект классификации</label>
        <select id="ncObj"><option>кредит</option><option>заёмщик</option></select></div>
      <div id="modalErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="CL.addClassifierUI()">Завести</button>
    </div>`);
};
CL.addClassifierUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();
  const res = CL.addClassifier({id:g('ncId'), name:g('ncName'), object:g('ncObj')});
  /* Заведение сразу открывает карточку нового черновика: заводят не ради строки в списке,
     а чтобы наполнить редакцию — и заполнять её больше негде. */
  if(res.ok){ const st = CL.state; st.curClf = res.id; st.clfVer = null; st.clfTab = 'values'; }
  modalAct(res, 'классификатор заведён — редакция 1 открыта черновиком');
};

function clfDetail(clfId){
  const clf = CL.clf(clfId);
  if(!clf){ CL.state.curClf = null; return clfList(); }
  const st = CL.state;
  const draft = CL.draftVer(clfId), active = CL.activeVer(clfId);
  const last = clf.versions.slice().sort((a, b) => b.no - a.no)[0];
  const shown = clf.versions.find(v => v.no === st.clfVer) || draft || active || last;
  const editable = !!draft && shown === draft && CL.canEditConstructor();
  const canPub = !!draft && CL.canEditConstructor();
  let tab = st.clfTab || 'values';
  if(tab === 'pub' && !canPub) tab = 'values';

  /* Область — список правил через ИЛИ, как у значения (ADR-0137 §3). В шапке она печатается
     одной строкой; править её можно на вкладке значений, где живут те же правила (КФ-Д8). */
  const scopeLine = (shown.scope || []).length
    ? shown.scope.map(r => (r.preds || []).map(p => { const i = CL.ind(p.i) || {name:p.i};
        return `<code class="mono">${esc(i.name)}</code> ${esc(opWord(p.op))} <code class="mono">${esc(constOf(p))}</code>`;
      }).join(' <span class="and">и</span> ')).join(' <span class="or">или</span> ')
    : 'пусто — входят <b>все объекты</b> типа «' + clf.object + '»';

  /* Переключатель редакций — не «история», а рабочий выбор: одна и та же карточка показывает
     черновик, действующую и прошлые; интервал на дату прошлой редакции несёт её номер, и по
     прошлой видно, какими правилами он записан. */
  const switcher = `<div class="chips">${clf.versions.slice().sort((a, b) => b.no - a.no)
    .map(v => `<span class="chip${v === shown ? ' on' : ''}" onclick="CL.showVer(${v.no})">редакция ${v.no} · ${v.status}</span>`)
    .join('')}</div>`;

  const tabBtn = (k, label) => `<button class="tab${tab === k ? ' on' : ''}" onclick="CL.tab('${k}')">${label}</button>`;
  const body = tab === 'pub' ? tabPublication(clf, draft)
             : tab === 'journal' ? tabJournal(clf)
             : tabValues(clf, shown, editable);

  return `<div class="card">
    <h3>${esc(clf.name)} <span class="small">· объект: ${clf.object} · <code class="mono">${esc(clf.id)}</code></span></h3>
    ${readOnlyBanner('редакции классификатора')}
    ${clf.stopped ? `<div class="banner warn"><b>Действие прекращено с ${fmt(clf.stopped.from)}</b> —
      ${esc(clf.stopped.reason)} <span class="small">(${esc(clf.stopped.by)}, ${fmtAt(clf.stopped.at)})</span>.
      С этой даты интервалов у классификатора нет; интервалы прошлых дат читаются по своим
      редакциям и остаются на месте — классификатор не удаляется никогда. Возобновляет его
      публикация новой редакции.</div>` : ''}
    ${switcher}
    <div class="kv">
      <div class="k">Показана редакция</div><div class="v">${shown.no} ${verPill(shown)}</div>
      <div class="k">Основание</div><div class="v">${esc(shown.basis || '— (черновик)')}</div>
      <div class="k">Действует</div><div class="v">${shown.from ? fmt(shown.from) : '—'}${
        shown.until ? ' — ' + fmt(shown.until) + ' включительно' : (shown.status === 'действующая' ? ' — по настоящее время' : '')}</div>
      <div class="k">Ввёл в действие</div><div class="v">${esc(shown.by || '—')}${shown.at ? ', ' + fmtAt(shown.at) : ''}</div>
      <div class="k">Область (правила входа)</div><div class="v">${scopeLine}</div>
      <div class="k">Значения сравнимы по тяжести</div><div class="v">
        ${shown.comparable ? 'да' : 'нет'}
        ${editable ? `<button class="btn btn-secondary btn-sm" style="margin-left:8px"
            onclick="act(CL.setComparable('${clf.id}', ${!shown.comparable}))">переключить</button>` : ''}
        <div class="small">${shown.comparable
          ? 'разбор идёт от тяжёлого, свёртка worst-of на заёмщика разрешена'
          : 'порядок разбора тяжести не означает — свернуть такие значения нельзя'}</div></div>
    </div>
    ${CL.canEditConstructor() ? `<div class="btn-row">
      ${draft ? '' : `<button class="btn btn-primary" onclick="act(CL.newDraft('${clf.id}'),'заведена новая редакция — правьте черновик')">Новая редакция</button>`}
      ${active ? `<button class="btn btn-danger" onclick="CL.stopUI('${clf.id}')">Прекратить действие</button>` : ''}
    </div>` : ''}
  </div>
  <div class="tabs">
    ${tabBtn('values', 'Значения и правила')}
    ${canPub ? tabBtn('pub', 'Публикация редакции ' + draft.no) : ''}
    ${tabBtn('journal', 'Журнал редакций')}
  </div>
  ${body}`;
}

function tabValues(clf, shown, editable){
  const scope = shown.scope || [];
  return `${scopeCard(clf, shown, scope, editable)}
  <div class="card">
    <h3>Значения и правила — в порядке разбора <span class="small">· редакция ${shown.no}, ${shown.status}</span></h3>
    ${shown.values.length ? shown.values.map((v, i) => valueHtml(clf.id, shown, v, i, editable)).join('')
      : '<div class="banner warn">Значений нет: пока список пуст, редакция не публикуется и никого не классифицирует.</div>'}
    ${editable ? `<div class="btn-row">
      <input id="newVal" placeholder="наименование значения" style="height:36px;min-width:260px;border:1px solid var(--border-strong);border-radius:4px;padding:0 10px">
      <button class="btn btn-secondary" onclick="CL.addValueUI('${clf.id}')">+ значение</button></div>` : ''}
  </div>`;
}
/* Редактор области — не отдельный экран: правила у неё те же, и второй редактор разошёлся бы
   с первым на первой правке (КФ-Д8). Отличие одно — пункт основания не спрашивается. */
function scopeCard(clf, shown, scope, editable){
  return `<div class="card">
    <h3>Область — кто вообще классифицируется <span class="small">· редакция ${shown.no}</span></h3>
    ${scope.length
      ? rulesSummary(scope) + CL.rulesHtml(clf.id, CL.SCOPE, scope, editable, true)
      : `<div class="banner info">Область пуста — классифицируются <b>все объекты</b> типа
         «${clf.object}». Это законное состояние, а не недоделка: у подгруппы заёмщика входного
         правила нет по существу.</div>`}
    ${editable ? `<div class="btn-row">
      <button class="btn btn-secondary" onclick="act(CL.addRule('${clf.id}','${CL.SCOPE}',''))">+ правило области (или)</button>
      </div>` : ''}
  </div>`;
}

/* Вкладка публикации существует только у черновика и только у администратора: у остальных
   её нет в ряду вкладок вовсе — пустая вкладка «нельзя» ничего не объясняет. */
function tabPublication(clf, draft){
  const refusals = CL.publishChecks(clf.id, draft);
  return `<div class="card">
    <h3>Публикация редакции ${draft.no}</h3>
    <div class="form-row">
      <div class="fld"><label>Основание (норма и редакция)</label>
        <input id="pubBasis" value="${esc(draft.basis)}" oninput="CL.metaUI('${clf.id}')"
          placeholder="например: Порядок №41 от 06.07.2026, п. 11"></div>
      <div class="fld"><label>Дата ввода в действие</label>
        <input id="pubFrom" type="date" value="${esc(draft.from)}" oninput="CL.metaUI('${clf.id}')"></div>
      <button class="btn btn-success" onclick="CL.publishUI('${clf.id}')">Ввести в действие</button>
    </div>
    <div id="pubRefusals">${pubBanner(refusals)}</div>
  </div>
  <div id="dryRun">${dryRunCard(clf.id)}</div>`;
}

function tabJournal(clf){
  const journal = clf.versions.slice().sort((a, b) => b.no - a.no).map(v => `
    <tr class="pick" onclick="CL.showVer(${v.no})"><td><b>${v.no}</b></td><td>${verPill(v)}</td>
      <td>${esc(v.basis || '—')}</td>
      <td>${v.from ? fmt(v.from) : '—'}${v.until ? ' — ' + fmt(v.until) : ''}</td>
      <td>${esc(v.by || '—')}${v.at ? '<div class="small">' + fmtAt(v.at) + '</div>' : ''}</td>
      <td>${v.values.length}</td></tr>`).join('');
  return `<div class="card">
    <h3>Журнал редакций</h3>
    <table class="cgrid"><thead><tr><th>№</th><th>Статус</th><th>Основание</th>
      <th>Действует (включительно)</th><th>Кто ввёл</th><th>Значений</th></tr></thead>
      <tbody>${journal}</tbody></table>
  </div>`;
}

CL.pick = id => CL.open(id);          /* прежнее имя перехода — карточка одна и та же */
CL.addValueUI = clfId => {
  const el = $('#newVal');
  const label = el && el.value.trim();
  if(!label){ toast('укажите наименование значения', 'err'); return; }
  act(CL.addValue(clfId, label), 'значение добавлено');
};
CL.publishUI = clfId => {
  const basis = ($('#pubBasis') || {}).value || '';
  const from = ($('#pubFrom') || {}).value || '';
  const res = CL.publish(clfId, {basis, from});
  if(res.ok){ CL.state.clfVer = null; CL.state.clfTab = 'values';
    toast('редакция ' + res.no + ' введена в действие, ряды переписаны с ' + fmt(from) + CL.markerNote(), 'ok'); render(); }
  else { toast(res.refusals[0], 'err'); render(); }
};
CL.metaUI = clfId => {
  CL.setVerMeta(clfId, {basis:(($('#pubBasis') || {}).value || ''),
    from:(($('#pubFrom') || {}).value || '')});
  const el = $('#pubRefusals');
  if(el) el.innerHTML = pubBanner(CL.publishChecks(clfId, CL.draftVer(clfId)));
  /* Прогон пересчитывается тем же вводом: он читает дату ввода в действие и число отказов, и
     оставшись от прошлой полной отрисовки, спорил с баннером в одном окне — «проверки пройдены»
     сверху и «публикацию держат отказы» снизу (КФ-Д14). */
  const dr = $('#dryRun');
  if(dr) dr.innerHTML = dryRunCard(clfId);
};
CL.stopUI = clfId => {
  const clf = CL.clf(clfId);
  openModal(`<div class="modal-h"><span class="mt">Прекращение действия: ${esc(clf.name)}</span>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p class="small">Классификатор не удаляется: интервалы прошлых дат ссылаются на его редакции
        и обязаны остаться читаемыми. Действующая редакция закрывается днём раньше указанной
        даты; с неё интервалов нет вовсе, витрина и шов скажут причину.</p>
      <label class="small"><b>Первый день без редакции</b> — не раньше начала открытого периода
        ${fmt(CL.startOfOpen())}, позже ввода действующей редакции и не позже сегодняшнего дня</label>
      <input id="stopFrom" type="date" value="${CL.state.today}"
        style="height:36px;width:100%;border:1px solid var(--border-strong);border-radius:4px;padding:0 10px;margin-bottom:10px">
      <label class="small"><b>Причина</b> — обязательна</label>
      <textarea id="stopReason" placeholder="например: Порядок №41 отменил классификацию по этому признаку"></textarea>
      <div id="modalErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="CL.stopDo('${clfId}')">Прекратить действие</button>
    </div>`);
};
CL.stopDo = clfId => {
  const res = CL.stopClassifier(clfId, {from:(($('#stopFrom') || {}).value || ''),
    reason:(($('#stopReason') || {}).value || '')});
  if(res.ok) CL.state.clfVer = null;
  modalAct(res, 'действие классификатора прекращено');
};

function pubBanner(refusals){
  return refusals.length
    ? `<div class="banner danger" style="margin-top:12px"><b>Публикация невозможна — ${refusals.length}:</b>
       <ul>${refusals.map(r => '<li>' + esc(r) + '</li>').join('')}</ul></div>`
    : `<div class="banner ok" style="margin-top:12px">Проверки пройдены: список замкнут значением по
       умолчанию, показатели живы, дата не раньше начала открытого периода ${fmt(CL.startOfOpen())}.</div>`;
}

/* Сухой прогон виден рядом с кнопкой публикации всегда, а не по кнопке «показать»: публикация
   необратима, и цена её последствий не должна зависеть от того, догадался ли администратор
   заглянуть в предпросмотр (ИК-2). */
function dryRunCard(clfId){
  const r = CL.dryRun(clfId);
  if(!r.ok) return '';
  const rows = r.rows.map(o => {
    const was = o.was.ok ? esc(o.was.label) : '<span class="muted">нет значения</span>';
    const will = o.will.ok ? esc(o.will.label) : '<span class="muted">нет значения</span>';
    return `<tr${o.changed ? '' : ' class="out"'}>
      <td class="mono">${esc(o.objType === 'кредит' ? o.objId : objName({type:o.objType, id:o.objId}))}</td>
      <td>${was}<div class="small">${esc((o.was.why || [])[0] || '')}</div></td>
      <td>${o.changed ? '<b>' + will + '</b>' : will}<div class="small">${esc((o.will.why || [])[0] || '')}</div></td>
      <td>${o.changed ? '<span class="pill warn">изменится</span>' : '<span class="pill neutral">как есть</span>'}</td></tr>`;
  }).join('');
  return `<div class="card">
    <h3>Сухой прогон черновика ${r.verNo}${r.baseNo ? ' против хранимых значений редакции ' + r.baseNo : ' (действующей редакции нет)'}
      <span class="small">· на ${fmt(CL.state.today)}</span></h3>
    <div class="chips">
      <span class="chip">объектов <span class="n">${r.cnt.total}</span></span>
      <span class="chip${r.cnt.changed ? ' on' : ''}">изменится <span class="n">${r.cnt.changed}</span></span>
      <span class="chip">со значением сейчас <span class="n">${r.cnt.inNow}</span></span>
      <span class="chip">со значением после <span class="n">${r.cnt.inDraft}</span></span>
      <span class="chip">потеряют значение <span class="n">${r.cnt.lost}</span></span>
      <span class="chip">получат значение <span class="n">${r.cnt.gained}</span></span>
    </div>
    <table class="cgrid"><thead><tr><th>Объект</th><th>Хранится сейчас</th><th>Станет</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${r.refusals.length ? `<div class="banner warn">Прогон считает даже непубликуемый черновик —
      это предпросмотр, а не проверка: публикацию всё равно ${plural(r.refusals.length, 'держит', 'держат', 'держат')}
      ${r.refusals.length} ${plural(r.refusals.length, 'отказ', 'отказа', 'отказов')} выше.</div>` : ''}
  </div>`;
}

/* ------------------------ ЭКРАН: ПОКАЗАТЕЛИ -------------------------
 * Тот же разворот, что у классификаторов: список отвечает «что есть и кто это считает»,
 * карточка — «где это используется, чем двигается и можно ли снять» (ИК-16, ИК-25).
 * ------------------------------------------------------------------- */
function viewIndicators(){
  return CL.state.curInd ? indDetail(CL.state.curInd) : indList();
}
CL.indShown = () => {
  const st = CL.state;
  const q = (st.indQ || '').trim().toLowerCase();
  return st.indicators.filter(i =>
    (st.indObj === 'все' || i.obj === st.indObj) &&
    (!q || i.name.toLowerCase().includes(q) || i.id.toLowerCase().includes(q)));
};
CL.indRowsHtml = () => {
  const list = CL.indShown();
  if(!list.length) return `<tr><td colspan="7" class="muted">по этому запросу показателей нет</td></tr>`;
  return list.map(i => {
    const used = CL.usedBy(i.id);
    return `<tr class="pick${i.retired ? ' out' : ''}" onclick="CL.openInd('${i.id}')">
      <td><span class="rowname">${esc(i.name)}</span><div class="small mono">${esc(i.id)}</div></td>
      <td>${esc(i.obj)}</td>
      <td>${esc(i.type)}${i.domain ? '<div class="small">' + i.domain.map(esc).join(' · ') + '</div>' : ''}</td>
      <td>${esc(i.src)}</td>
      <td>${esc(i.owner)}</td>
      <td class="mono">${used.length}</td>
      <td>${i.retired ? '<span class="pill neutral">снят</span>' : '<span class="pill ok">в реестре</span>'}</td></tr>`;
  }).join('');
};
function indList(){
  const st = CL.state;
  const objChip = o => `<span class="chip${st.indObj === o ? ' on' : ''}" onclick="CL.indObjUI('${o}')">${o}</span>`;
  return `${readOnlyBanner('реестр показателей')}
    <div class="toolbar">
      ${CL.canEditConstructor() ? '<button class="btn btn-primary" onclick="CL.newIndUI()">+ Показатель</button>' : ''}
      <input type="search" id="indQ" value="${esc(st.indQ)}" oninput="CL.indSearch(this.value)"
        placeholder="поиск по наименованию или идентификатору">
      <span class="chips">${objChip('все')}${objChip('кредит')}${objChip('заёмщик')}</span>
      <span class="small" id="indCount">показано ${CL.indShown().length} из ${st.indicators.length}</span>
    </div>
    <table class="cgrid"><thead><tr><th>Наименование</th><th>Объект</th><th>Тип</th>
      <th>Источник</th><th>Владелец</th><th>Исп.</th><th>Состояние</th></tr></thead>
      <tbody id="indRows">${CL.indRowsHtml()}</tbody></table>`;
}
/* Поиск перерисовывает ТОЛЬКО строки таблицы: полный render() на каждом нажатии клавиши
   отобрал бы у поля фокус — тот же приём, что у списка отказов публикации (КФ-Д6). */
CL.indSearch = v => {
  CL.state.indQ = v;
  const t = $('#indRows'); if(t) t.innerHTML = CL.indRowsHtml();
  const c = $('#indCount');
  if(c) c.textContent = 'показано ' + CL.indShown().length + ' из ' + CL.state.indicators.length;
};
CL.indObjUI = o => { CL.state.indObj = o; render(); };

function indDetail(indId){
  const ind = CL.ind(indId);
  if(!ind){ CL.state.curInd = null; return indList(); }
  const used = CL.usedBy(indId);
  const live = used.filter(u => u.status === 'действующая');
  const rows = used.length ? used.map(u => `<tr>
      <td>${esc(u.clf)}</td><td>редакция ${u.verNo}</td>
      <td>${u.status === 'действующая' ? '<span class="pill ok">действующая</span>' : '<span class="pill warn">черновик</span>'}</td>
      <td>${esc(u.where)}</td></tr>`).join('')
    : `<tr><td colspan="4" class="muted">ни одна живая редакция на показатель не ссылается</td></tr>`;
  return `<div class="card">
    <h3>${esc(ind.name)} <span class="small">· <code class="mono">${esc(ind.id)}</code></span></h3>
    ${readOnlyBanner('реестр показателей')}
    <div class="kv">
      <div class="k">Объект</div><div class="v">${esc(ind.obj)}</div>
      <div class="k">Тип</div><div class="v">${esc(ind.type)}</div>
      <div class="k">Домен</div><div class="v">${ind.domain ? ind.domain.map(esc).join(' · ') : '<span class="muted">не перечисление</span>'}</div>
      <div class="k">Источник</div><div class="v">${esc(ind.src)}</div>
      <div class="k">Владелец (кто считает)</div><div class="v">${esc(ind.owner)}</div>
      <div class="k">События с меткой пересчёта</div><div class="v">${(ind.events || []).length
        ? ind.events.map(esc).join(' · ') + '<div class="small">владелец ставит метку в транзакции события</div>'
        : '<span class="muted">—</span>'}</div>
      <div class="k">Меняется по дате</div><div class="v">${ind.byDate ? esc(ind.byDate) : '<span class="muted">нет — только событием</span>'}</div>
      <div class="k">Состояние</div><div class="v">${ind.retired ? '<span class="pill neutral">снят с реестра</span>' : '<span class="pill ok">в реестре</span>'}</div>
    </div>
    ${ind.note ? '<div class="note">' + esc(ind.note) + '</div>' : ''}
  </div>
  <div class="card">
    <h3>Где используется</h3>
    <table class="cgrid"><thead><tr><th>Классификатор</th><th>Редакция</th><th>Статус</th><th>Где</th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${ind.retired ? '' : (live.length
      ? `<div class="banner danger" style="margin-top:12px"><b>Снять с реестра нельзя — ${live.length}:</b>
          <ul>${live.map(u => '<li>' + esc(u.clf) + ', редакция ' + u.verNo + ' (' + esc(u.where) + ')</li>').join('')}</ul>
          Сначала новая редакция без этого показателя — потом снятие.</div>`
      : `<div class="banner ok" style="margin-top:12px">Действующие редакции на показатель не ссылаются — снять можно.</div>`)}
    ${!ind.retired && CL.canEditConstructor() ? `<div class="btn-row">
      <button class="btn btn-danger" onclick="act(CL.retireIndicator('${ind.id}'),'показатель снят с реестра')">Снять с реестра</button>
    </div>` : ''}
  </div>`;
}

        <input id="niDomain" placeholder="например: полное, частичное, отсутствует">
        <div class="small">Правило сравнивает значение с членом этого списка, а не со свободной

};
/* Поле домена показывается только у перечисления: у булева и числа сравнивать не с чем. */
CL.indTypeUI = type => {
  if(typeof document === 'undefined') return;
  const w = document.getElementById('niDomWrap');
  if(w) w.style.display = type === 'перечисление' ? '' : 'none';
};
CL.addIndicatorUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();
  const type = g('niType');
  /* Домен читается с экрана, а не подставляется кодом: подставленный ['нет','да'] заводил
     перечисление булевым под чужим типом (КФ-Д13). */
  const domain = type === 'перечисление' ? g('niDomain').split(/[,;\n]/) : [];
  modalAct(CL.addIndicator({id:g('niId'), name:g('niName'), obj:g('niObj'), type,
    domain, owner:g('niOwner')}), 'показатель заведён');
};

/* --------------------------- ЭКРАН: ФАКТЫ --------------------------- */
function factRow(f, showCredit){
  const k = KIND(f.kindId);
  const fate = CL.fateOf(f);
  const cls = f.annulled ? 'annul' : (fate === 'засчитан' ? 'yes' : 'no');
  const late = f.counted !== f.occurred;
  return `<tr>
    ${showCredit ? '<td class="mono">' + esc(f.creditId) + '</td>' : ''}
    <td class="mono">${esc(f.id)}</td>
    <td>${esc(k.name)}<div class="small">${esc(k.norm)} · уровень: ${esc(k.level)}</div></td>
    <td>${fmt(f.occurred)}${late ? '<div class="small">учтён с <b>' + fmt(f.counted) + '</b> — ' +
        monLabel(ym(f.occurred)) + ' закрыт, его интервалы не переписываются</div>' : ''}</td>
    <td>${f.doc ? esc(f.doc) : '<span class="pill err">решения комитета нет</span>'}</td>
    <td>${f.until ? fmt(f.until) : '<span class="muted">бессрочно</span>'}</td>
    <td class="${cls === 'annul' ? 'muted' : ''}">${f.annulled
      ? 'аннулирован ' + fmtAt(f.annulled.at) + '<div class="small">' + esc(f.annulled.reason) + '</div>'
      : esc(fate)}</td>
    <td>${f.annulled || !CL.canEnterFacts() ? '' : `<button class="btn btn-secondary btn-sm" onclick="CL.annulUI('${f.id}')">аннулировать</button>`}</td></tr>`;
}
function viewFacts(){
  const st = CL.state;
  const cnt = CL.factCounts();
  const flt = st.factFilter || null;
  const ff = st.factForm || (st.factForm = {credit:'', kind:'', when:'', doc:'', until:''});
  const canEnter = CL.canEnterFacts();
  const shown = st.facts.filter(f => !flt || CL.fateOf(f) === flt);
  const rows = shown.length
    ? shown.map(f => factRow(f, true)).join('')
    : `<tr><td colspan="8" class="muted">фактов с судьбой «${esc(flt)}» нет</td></tr>`;
  const chips = `<div class="chips">
    <span class="chip${flt ? '' : ' on'}" onclick="CL.factFilterUI(null)">все факты <span class="n">${cnt['всего']}</span></span>
    ${CL.FATES.map(k => `<span class="chip${flt === k ? ' on' : ''}" onclick="CL.factFilterUI('${esc(k)}')">${esc(k)} <span class="n">${cnt[k]}</span></span>`).join('')}
  </div>`;
  const creditOpts = CL.state.credits.map(c => `<option${c.id === ff.credit ? ' selected' : ''}>${esc(c.id)}</option>`).join('');
  const kindOpts = FACTOR_KINDS.map(k => `<option value="${k.id}"${k.id === ff.kind ? ' selected' : ''}>${esc(k.name)} — ${esc(k.norm)}, ${esc(k.level)}</option>`).join('');
  return `${canEnter ? `<div class="card">
      <h3>Завести факт по кредиту</h3>
      <div class="form-row">
        <div class="fld"><label>Кредит</label>
          <select id="fCredit" onchange="CL.factFormUI('credit',this.value)">${creditOpts}</select></div>
        <div class="fld"><label>Вид фактора (п. 11)</label>
          <select id="fKind" onchange="CL.factFormUI('kind',this.value)">${kindOpts}</select></div>
        <div class="fld"><label>Дата наступления</label>
          <input id="fWhen" type="date" value="${esc(ff.when || CL.state.today)}" oninput="CL.factFormUI('when',this.value)"></div>
        <div class="fld"><label>Решение комитета</label>
          <input id="fDoc" placeholder="протокол КАБК № … от …" value="${esc(ff.doc)}" oninput="CL.factFormUI('doc',this.value)"></div>
        <div class="fld"><label>Действует до</label>
          <input id="fUntil" type="date" value="${esc(ff.until)}" oninput="CL.factFormUI('until',this.value)"></div>
        <button class="btn btn-primary" onclick="CL.addFactUI()">Завести факт</button>
      </div>
    </div>` : `<div class="banner info">Только просмотр: факты вводит и аннулирует
      <b>«Кредитный инспектор»</b> либо <b>«Администратор классификации»</b> — роль переключается в
      шапке. Форма и кнопки не показаны вовсе: погашенная кнопка сообщила бы о запрете, но не о
      причине.</div>`}
    <div class="card">
      <h3>Реестр фактов</h3>
      ${chips}
      <table class="cgrid"><thead><tr><th>Кредит</th><th>ID</th><th>Вид фактора</th>
        <th>Наступил</th><th>Решение комитета</th><th>Действует до</th><th>Судьба</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>`;
}
CL.factFilterUI = k => { CL.state.factFilter = k || null; render(); };
CL.factFormUI = (field, value) => { (CL.state.factForm || (CL.state.factForm = {}))[field] = value; };
CL.addFactUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();
  const spec = {creditId:g('fCredit'), kindId:g('fKind'), occurred:g('fWhen'),
    doc:g('fDoc') || null, until:g('fUntil') || null};
  CL.state.factForm = {credit:spec.creditId, kind:spec.kindId, when:spec.occurred,
    doc:spec.doc || '', until:spec.until || ''};
  const res = CL.addFact(spec);
  /* Форма очищается только успехом: после отказа она возвращается набранной (КФ-Д11). */
  if(res.ok) CL.state.factForm = {credit:'', kind:'', when:'', doc:'', until:''};
  act(res, res.ok ? 'факт ' + res.id + ' заведён · метка ' + spec.creditId + ' с ' + fmt(res.markerFrom) : '');
};
CL.annulUI = id => {
  openModal(`<div class="modal-h"><span class="mt">Аннулирование факта ${esc(id)}</span>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p class="small">Факт не удаляется: он остаётся в реестре с пометкой, причиной и автором.
        Метка пересчёта встаёт с даты «учтён с»; интервалы закрытого месяца не меняются.</p>
      <label class="small"><b>Причина аннулирования</b> — обязательна</label>
      <textarea id="annulReason" placeholder="например: заведён на другой кредит"></textarea>
      <div id="modalErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="CL.annulDo('${esc(id)}')">Аннулировать</button>
    </div>`);
};
CL.annulDo = id => {
  modalAct(CL.annulFact(id, (($('#annulReason') || {}).value || '').trim()), 'факт ' + id + ' аннулирован');
};

/* ------------------------- ЭКРАН: ВИТРИНА --------------------------- *
 * Витрина не считает: она читает хранимый интервал через шов на выбранную дату и печатает
 * его «почему» (ИК-24). Величины показателей в интервале нет — их на ту же дату отдают
 * владельцы, и витрина спрашивает их только затем, чтобы показать число рядом с правилом.
 * ------------------------------------------------------------------- */
function liveVals(type, id, d){
  try { return CL.valuesOf(type, id, d); } catch(e){ return null; }
}
/* Строки «почему» интервала — с величинами на дату, если владельцы ответили. Правило ищется в
   своей редакции по пункту и подписи: интервал хранит их, а не текст с числом. */
function whyHtml(r, clfId, type, id, d){
  const items = r.whyItems || [];
  if(!items.length) return (r.why || []).map(w => '<div class="why">' + esc(w) + '</div>').join('');
  const ver = r.verNo ? CL.editionNo(clfId, r.verNo) : null;
  const vals = items.some(w => w.k === 'rule' || w.k === 'scope') ? liveVals(type, id, d) : null;
  const when = d === CL.state.today ? null : d;
  return items.map(w => {
    if(w.k === 'rule' && ver && vals){
      const rule = allRules(ver).find(x => x.norm === w.norm && (x.label || '') === (w.label || ''));
      if(rule) return '<div class="why">' + esc(ruleText(rule, vals, when)) + ' — <em>' + esc(w.norm) + '</em></div>';
    }
    /* Отказ области печатается с величиной на дату — «кредит действующий = да (сейчас нет)»:
       тот же текст на витрине и в карточке разбора (P19-R13). */
    if(w.k === 'scope' && ver && vals)
      return '<div class="why">' + esc('вне области классификатора: ' + scopeWhy(ver.scope || [], vals, when)) + '</div>';
    if(w.k === 'source') return `<div class="why">${esc(whyLine(w))} ·
      <a class="lnk" onclick="CL.openObj('кредит','${esc(w.credit)}')">разбор ${esc(w.credit)}</a></div>`;
    return '<div class="why">' + esc(whyLine(w)) + '</div>';
  }).join('') + (items.some(w => w.k === 'rule') && !vals
    ? '<div class="why">величины на дату не показаны: владелец показателя не ответил</div>' : '');
}
CL.whyHtml = whyHtml;
function factsBlock(creditId, chosenCode, ver){
  const fs = CL.state.facts.filter(f => f.creditId === creditId);
  if(!fs.length) return '';
  const items = fs.map(f => {
    const k = KIND(f.kindId);
    const fate = f.annulled ? 'аннулирован — ' + f.annulled.reason : CL.factFate(f, chosenCode, ver);
    const cls = f.annulled ? 'annul' : fate === 'засчитан' ? 'yes' : 'no';
    const late = f.counted !== f.occurred;
    return `<div class="f ${cls}">${esc(f.id)} · ${esc(k.name)} · ${esc(k.norm)} · ${f.doc ? esc(f.doc) : 'решения комитета нет'}
      — <em>${esc(fate)}</em>${late ? '<br>наступил ' + fmt(f.occurred) + ', учтён с ' + fmt(f.counted) +
      ' — ' + monLabel(ym(f.occurred)) + ' закрыт' : ''}</div>`;
  }).join('');
  return `<div class="facts"><div class="small"><b>Реестр фактов кредита</b></div>${items}</div>`;
}
/* Вход на дату — ответ владельца «Платежи»: число всегда рядом со слоем (ИК-18). */
function inputCell(c, d){
  let o;
  try { o = overdueOf(c, d); } catch(e){ return '<span class="bad">владелец «Платежи» не ответил</span>'; }
  const def = deferSpan(c, d);

    : o.days ? `${o.days} <span class="small">· ${esc(o.layer)}</span>` : '0';
  return days + (def ? '<div class="why">' + esc(def.note) + '</div>' : '') +
    (creditActive(c, d) ? '' : '<div class="small">кредит не действует' + (c.closed ? ' с ' + fmt(c.closed) : '') + '</div>');
}
CL.SHOW_STATES = ['есть', 'вне области', 'нет данных', 'обновляется'];
CL.showRows = () => {

      /* Реестр фактов печатается и без значения: причина отказа и заведённые факты — разные

      <div class="kv">
        <div class="k">Категория риска</div><div class="v">${statePill(fold)}${flagsHtml(fold)}
          ${fold.interval ? '<div class="small">хранимая свёртка worst-of · интервал ' + ivSpan(fold.interval) + '</div>' : ''}
          ${whyHtml(fold, 'risk', 'заёмщик', b.inn, d)}</div>
        <div class="k">Подгруппа</div><div class="v">${statePill(sub)}${flagsHtml(sub)}
          ${sub.interval ? '<div class="small">редакция ' + sub.verNo + ' · интервал ' + ivSpan(sub.interval) + '</div>' : ''}
          ${whyHtml(sub, 'sub', 'заёмщик', b.inn, d)}

      ${closed ? 'месяц ' + monLabel(ym(d)) + ' <b>закрыт</b>: интервалы на эту дату неизменны, ответ несёт признак «период закрыт».'
               : 'период <b>открыт</b>: интервал переписывается метками событий и ночным проходом.'}
