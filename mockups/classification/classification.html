    <select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'op',this.value))">${ops}</select>
    ${val}
    <button class="btn btn-secondary btn-sm" onclick="act(CL.removePred('${clfId}','${code}',${ri},${pi}))">✕</button></span>`;
}
/* Правило рисуется одинаково у значения и у области — разница только в адресе (code). */
function ruleHtml(clfId, code, r, ri, editable, scope){
  return `<div class="rule">
      <div class="rule-h">
        <span>правило ${ri + 1} ·</span>
        ${editable
          ? `${scope ? '' : `<input value="${esc(r.norm || '')}" placeholder="пункт основания" style="height:28px;width:170px;border:1px solid var(--border-strong);border-radius:4px;padding:0 8px"
               oninput="CL.quiet(CL.setRuleNorm('${clfId}','${code}',${ri},this.value))">`}
             <input value="${esc(r.label || '')}" placeholder="подпись правила" style="height:28px;width:200px;border:1px solid var(--border-strong);border-radius:4px;padding:0 8px"
               oninput="CL.quiet(CL.setRuleLabel('${clfId}','${code}',${ri},this.value))">
             <button class="btn btn-secondary btn-sm" onclick="act(CL.removeRule('${clfId}','${code}',${ri}))">удалить правило</button>`
          : `<b>${esc(scope ? (r.label || 'правило входа') : (r.norm || 'без пункта'))}</b>${
              !scope && r.label ? ' · ' + esc(r.label) : ''}`}
      </div>
      ${(r.preds || []).map((p, pi) => predHtml(clfId, code, ri, pi, p, editable))
              .join('<span class="and">и</span>') ||
        '<div class="small">предикатов нет — правило не сработает никогда</div>'}
      ${editable ? `<div><button class="btn btn-secondary btn-sm" onclick="act(CL.addPred('${clfId}','${code}',${ri}))">+ предикат (и)</button></div>` : ''}
    </div>`;
}
/* Правила связаны ИЛИ. Связка пишется между блоками, а не подразумевается (КФ-Д7). */
function rulesHtml(clfId, code, rules, editable, scope){
  return rules.map((r, ri) => ruleHtml(clfId, code, r, ri, editable, scope))
              .join('<div><span class="or">или</span></div>');
}
CL.rulesHtml = rulesHtml;
/* Фраза значения одной строкой: сколько правил и как связаны. Без неё читатель считает
   блоки глазами и не видит, что связка — ИЛИ (КФ-Д7). */
function rulesSummary(rules){
  const n = rules.length;
  if(!n) return '';
  const preds = rules.reduce((a, r) => a + (r.preds || []).length, 0);
  return n === 1
    ? `<div class="rule-sum">Одно правило из <b>${preds}</b> ${plural(preds, 'предиката', 'предикатов', 'предикатов')}, связка — <b>И</b>.</div>`
    : `<div class="rule-sum">Сработает, если верно <b>любое из ${n}</b> правил (связка — <b>ИЛИ</b>); внутри правила предикаты связаны <b>И</b>.</div>`;
}
function plural(n, one, few, many){
  const d = n % 10, h = n % 100;
  return (d === 1 && h !== 11) ? one : (d >= 2 && d <= 4 && (h < 12 || h > 14)) ? few : many;
}
function valueHtml(clfId, ver, v, idx, editable){
  const rules = (v.rules || []);
  const body = v.dflt
    ? `<div class="small">правил нет — <b>значение по умолчанию</b>, замыкает список${v.norm ? ' · ' + esc(v.norm) : ''}</div>`
    : rules.length ? rulesSummary(rules) + rulesHtml(clfId, v.code, rules, editable, false)
    : `<div class="small">правил нет — значение объявлено, но назначено быть не может (ИК-17)</div>`;
  return `<div class="val">
    <div class="val-h">
      <span class="nm">${idx + 1}. ${esc(v.label)}</span>
      ${v.dflt ? '<span class="pill info">по умолчанию</span>' : ''}
      ${!v.dflt && rules.length > 1 ? '<span class="pill neutral">' + rules.length + ' правила через ИЛИ</span>' : ''}
      ${editable ? `<span class="acts">
        <button class="btn btn-secondary btn-sm" onclick="act(CL.moveValue('${clfId}','${v.code}',-1))">↑</button>
        <button class="btn btn-secondary btn-sm" onclick="act(CL.moveValue('${clfId}','${v.code}',1))">↓</button>
        ${v.dflt ? '' : `<button class="btn btn-secondary btn-sm" onclick="act(CL.addRule('${clfId}','${v.code}',''))">+ правило (или)</button>
        <button class="btn btn-secondary btn-sm" onclick="act(CL.setDefault('${clfId}','${v.code}'))">сделать по умолчанию</button>`}
        <button class="btn btn-secondary btn-sm" onclick="act(CL.removeValue('${clfId}','${v.code}'))">удалить</button></span>` : ''}
    </div>
    <div class="val-b">${body}</div></div>`;
}
/* ------------------------ ЭКРАН: КЛАССИФИКАТОРЫ ---------------------
 * Экран разведён надвое: СПИСОК (что вообще заведено в системе) и КАРТОЧКА одного
 * классификатора (редакции, значения, публикация, журнал). Раньше карточки всех
 * классификаторов висели одной простынёй и переключались колонкой слева: пока их три,
 * это читалось, но модуль обещает четвёртый и пятый НАСТРОЙКОЙ, а не релизом (ADR-0120) —
 * простыня растёт вместе с ними, а список не растёт. Маршрут держится в состоянии
 * (curClf, clfTab, clfVer), а не в DOM, поэтому смоук проверяет ту же разметку, что видит
 * человек. Обратный путь — крошка в шапке, как в макете кредита.
 * ------------------------------------------------------------------- */
function clfState(c){
  const a = CL.activeVer(c.id), d = CL.draftVer(c.id);
  if(c.stopped) return {pill:'<span class="pill err">действие прекращено</span>',
    small:'с ' + fmt(c.stopped.until) + ' · ' + esc(c.stopped.reason)};
  if(a && d)    return {pill:'<span class="pill warn">есть черновик</span>', small:'редакция ' + d.no + ' готовится'};
  if(a)         return {pill:'<span class="pill ok">действует</span>', small:''};
  if(d)         return {pill:'<span class="pill info">только черновик</span>', small:'значений пока не назначает'};
  return {pill:'<span class="pill neutral">редакций нет</span>', small:''};
}
/* Роль без права правки не получает погашенных кнопок: их не показывают вовсе, а строкой
   названо, кто вправе. Недоступная кнопка — тот же молчаливый отказ, что и пустой экран:
   человек видит запрет и не видит причины (§0.3, урок КФ-Д6). */
function readOnlyBanner(what){
  return CL.canEditConstructor() ? '' :
    `<div class="banner info">Только просмотр: ${what} правит роль
      <b>«Администратор классификации»</b> — переключается в шапке. Кнопки настройки не показаны
      вовсе: погашенная кнопка сообщила бы о запрете, но не о причине (§0.3).</div>`;
}
function viewClassifiers(){
  return CL.state.curClf ? clfDetail(CL.state.curClf) : clfList();
}
function clfList(){
  const rows = CL.state.classifiers.map(c => {
    const a = CL.activeVer(c.id), d = CL.draftVer(c.id), s = clfState(c);
    /* Графа считает значения той редакции, о которой говорит соседняя графа состояния:
       у прекращённого — последней по номеру, а не ноль при трёх заведённых значениях (КФ-Д17). */
    const last = c.versions.slice().sort((x, y) => y.no - x.no)[0];
    const vals = (a || d || last || {values:[]}).values.length;
    return `<tr class="pick" onclick="CL.open('${c.id}')">
      <td><span class="rowname">${esc(c.name)}</span><div class="small mono">${esc(c.id)}</div></td>
      <td>${esc(c.object)}</td>
      <td>${a ? 'редакция ' + a.no : '<span class="muted">нет</span>'}</td>
      <td>${a ? fmt(a.from) : '—'}</td>
      <td class="mono">${vals}</td>
      <td>${s.pill}${s.small ? '<div class="small">' + s.small + '</div>' : ''}</td></tr>`;
  }).join('');
  return `<p class="page-lead">Классификатор — набор значений с правилами над показателями реестра.
    Список отвечает на один вопрос: что заведено, по какой редакции работает и есть ли готовящаяся.
    Правка живёт внутри карточки — строка списка ничего необратимого не делает.</p>
    ${readOnlyBanner('классификаторы')}
    <div class="toolbar">
      ${CL.canEditConstructor() ? '<button class="btn btn-primary" onclick="CL.newClfUI()">+ Классификатор</button>' : ''}
      <span class="small">всего ${CL.state.classifiers.length}</span>
    </div>
    <table class="cgrid"><thead><tr><th>Наименование</th><th>Объект</th><th>Действующая редакция</th>
      <th>Действует с</th><th>Значений</th><th>Состояние</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="note">«Только черновик» — классификатор заведён, но ещё никого не классифицирует
      (ADR-0125); «действие прекращено» — редакций больше не назначает, но записи закрытых периодов
      по нему читаются по-прежнему, потому что классификатор не удаляется никогда (ИК-19).</div>
    <div class="note">Значения ведутся здесь. В разделе «Справочники» строки
      <code>borrower-groups</code> и <code>loan-payment-capacity-groups</code> остаются
      зеркалом на чтение: у классификации одна дверь (ADR-0125 §3).</div>`;
}
CL.newClfUI = () => {
  openModal(`<div class="modal-h"><span class="mt">Завести классификатор</span>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p class="small">Четвёртая классификация появляется <b>настройкой, а не релизом</b> (ADR-0120):
        новый классификатор открывается пустым черновиком и до публикации никого не классифицирует.
        Объект задаётся здесь и потом не меняется — сменить его значило бы обессмыслить уже
        сделанные записи фиксации.</p>
      <div class="fld" style="margin-bottom:10px"><label>Идентификатор</label>
        <input id="ncId" placeholder="например: pledgeQuality"></div>
      <div class="fld" style="margin-bottom:10px"><label>Наименование</label>
        <input id="ncName" placeholder="Качество обеспечения"></div>
      <div class="fld"><label>Объект классификации</label>
        <select id="ncObj"><option>кредит</option><option>заёмщик</option></select></div>
      <div id="modalErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="CL.addClassifierUI()">Завести</button>
    </div>`);
};
CL.addClassifierUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();
  const res = CL.addClassifier({id:g('ncId'), name:g('ncName'), object:g('ncObj')});
  /* Заведение сразу открывает карточку нового черновика: заводят не ради строки в списке,
     а чтобы наполнить редакцию — и заполнять её больше негде. */
  if(res.ok){ const st = CL.state; st.curClf = res.id; st.clfVer = null; st.clfTab = 'values'; }
  modalAct(res, 'классификатор заведён — редакция 1 открыта черновиком');
};

function clfDetail(clfId){
  const clf = CL.clf(clfId);
  if(!clf){ CL.state.curClf = null; return clfList(); }
  const st = CL.state;
  const draft = CL.draftVer(clfId), active = CL.activeVer(clfId);
  const last = clf.versions.slice().sort((a, b) => b.no - a.no)[0];
  const shown = clf.versions.find(v => v.no === st.clfVer) || draft || active || last;
  const editable = !!draft && shown === draft && CL.canEditConstructor();
  const canPub = !!draft && CL.canEditConstructor();
  let tab = st.clfTab || 'values';
  if(tab === 'pub' && !canPub) tab = 'values';

  /* Область — список правил через ИЛИ, как у значения (ADR-0137 §3). В шапке она печатается
     одной строкой; править её можно на вкладке значений, где живут те же правила (КФ-Д8). */
  const scopeLine = (shown.scope || []).length
    ? shown.scope.map(r => (r.preds || []).map(p => { const i = CL.ind(p.i) || {name:p.i};
        return `<code class="mono">${esc(i.name)}</code> ${esc(opWord(p.op))} <code class="mono">${esc(constOf(p))}</code>`;
      }).join(' <span class="and">и</span> ')).join(' <span class="or">или</span> ')
    : 'пусто — входят <b>все объекты</b> типа «' + clf.object + '»';

  /* Переключатель редакций — не «история», а рабочий выбор: одна и та же карточка показывает
     черновик, действующую и прошлые, и по прошлой видно, чем именно посчитан закрытый период (ИК-8). */
  const switcher = `<div class="chips">${clf.versions.slice().sort((a, b) => b.no - a.no)
    .map(v => `<span class="chip${v === shown ? ' on' : ''}" onclick="CL.showVer(${v.no})">редакция ${v.no} · ${v.status}</span>`)
    .join('')}</div>`;

  const tabBtn = (k, label) => `<button class="tab${tab === k ? ' on' : ''}" onclick="CL.tab('${k}')">${label}</button>`;
  const body = tab === 'pub' ? tabPublication(clf, draft)
             : tab === 'journal' ? tabJournal(clf)
             : tabValues(clf, shown, editable);

  return `<div class="card">
    <h3>${esc(clf.name)} <span class="small">· объект: ${clf.object} · <code class="mono">${esc(clf.id)}</code></span></h3>
    ${readOnlyBanner('редакции классификатора')}
    ${clf.stopped ? `<div class="banner warn"><b>Действие прекращено ${fmt(clf.stopped.until)}</b> —
      ${esc(clf.stopped.reason)} <span class="small">(${esc(clf.stopped.by)}, ${fmt(clf.stopped.at)})</span>.
      Классификатор значений не назначает; записи закрытых периодов читаются по своим редакциям
      и остаются на месте — классификатор не удаляется никогда (ИК-19). Возобновляет его
      публикация новой редакции.</div>` : ''}
    ${switcher}
    <div class="kv">
      <div class="k">Показана редакция</div><div class="v">${shown.no} ${verPill(shown)}</div>
      <div class="k">Основание</div><div class="v">${esc(shown.basis || '— (черновик)')}</div>
      <div class="k">Действует</div><div class="v">${shown.from ? fmt(shown.from) : '—'}${
        shown.until ? ' — ' + fmt(shown.until) : (shown.status === 'действующая' ? ' — по настоящее время' : '')}</div>
      <div class="k">Ввёл в действие</div><div class="v">${esc(shown.by || '—')}${shown.at ? ', ' + fmt(shown.at) : ''}</div>
      <div class="k">Область (правила входа)</div><div class="v">${scopeLine}</div>
      <div class="k">Значения сравнимы по тяжести</div><div class="v">
        ${shown.comparable ? 'да' : 'нет'}
        ${editable ? `<button class="btn btn-secondary btn-sm" style="margin-left:8px"
            onclick="act(CL.setComparable('${clf.id}', ${!shown.comparable}))">переключить</button>` : ''}
        <div class="small">${shown.comparable
          ? 'разбор идёт от тяжёлого, свёртка worst-of на заёмщика разрешена (ИК-6)'
          : 'порядок разбора тяжести не означает — свернуть такие значения нельзя (ИК-6)'}</div></div>
    </div>
    ${CL.canEditConstructor() ? `<div class="btn-row">
      ${draft ? '' : `<button class="btn btn-primary" onclick="act(CL.newDraft('${clf.id}'),'заведена новая редакция — правьте черновик')">Новая редакция</button>`}
      ${active ? `<button class="btn btn-danger" onclick="CL.stopUI('${clf.id}')">Прекратить действие</button>` : ''}
    </div>` : ''}
    <div class="note">${draft
      ? 'Действующая редакция не правится: правки идут в черновик и вступают в силу публикацией (ИК-2).'
      : 'Правка действующей редакции невозможна. «Новая редакция» откроет черновик — копию действующей.'}
      Прекращение действия живёт только здесь, в карточке: необратимую операцию нельзя вешать на
      строку списка, где её нажимают мимоходом (ИК-19).</div>
  </div>
  <div class="tabs">
    ${tabBtn('values', 'Значения и правила')}
    ${canPub ? tabBtn('pub', 'Публикация редакции ' + draft.no) : ''}
    ${tabBtn('journal', 'Журнал редакций')}
  </div>
  ${body}`;
}

function tabValues(clf, shown, editable){
  const scope = shown.scope || [];
  return `${scopeCard(clf, shown, scope, editable)}
  <div class="card">
    <h3>Значения и правила — в порядке разбора <span class="small">· редакция ${shown.no}, ${shown.status}</span></h3>
    ${shown.values.length ? shown.values.map((v, i) => valueHtml(clf.id, shown, v, i, editable)).join('')
      : '<div class="banner warn">Значений нет: пока список пуст, редакция не публикуется и никого не классифицирует (ИК-3).</div>'}
    ${editable ? `<div class="btn-row">
      <input id="newVal" placeholder="наименование значения" style="height:36px;min-width:260px;border:1px solid var(--border-strong);border-radius:4px;padding:0 10px">
      <button class="btn btn-secondary" onclick="CL.addValueUI('${clf.id}')">+ значение</button></div>` : ''}
    <div class="note">Объекту присваивается <b>первое значение</b>, у которого сработало хотя бы одно
    правило; внутри значения проверяются все правила, и в объяснение уходят все сработавшие (ИК-11).
    Правило — конъюнкция (<b>И</b>) скалярных предикатов над показателями реестра; правила одного
    значения связаны дизъюнкцией (<b>ИЛИ</b>). Скобок и вложенности нет: любая формулировка нормы
    раскладывается в этот вид, а вложенность нельзя ни прочитать глазами, ни объяснить заёмщику
    (ADR-0120, ADR-0125 §1, ADR-0137 §1).</div>
  </div>`;
}
/* Редактор области — не отдельный экран: правила у неё те же, и второй редактор разошёлся бы
   с первым на первой правке (КФ-Д8). Отличие одно — пункт основания не спрашивается. */
function scopeCard(clf, shown, scope, editable){
  return `<div class="card">
    <h3>Область — кто вообще классифицируется <span class="small">· редакция ${shown.no}</span></h3>
    ${scope.length
      ? rulesSummary(scope) + CL.rulesHtml(clf.id, CL.SCOPE, scope, editable, true)
      : `<div class="banner info">Область пуста — классифицируются <b>все объекты</b> типа
         «${clf.object}». Это законное состояние, а не недоделка: у подгруппы заёмщика входного
         правила нет по существу.</div>`}
    ${editable ? `<div class="btn-row">
      <button class="btn btn-secondary" onclick="act(CL.addRule('${clf.id}','${CL.SCOPE}',''))">+ правило области (или)</button>
      </div>` : ''}
    <div class="note">Область проверяется <b>до</b> значений. Объект вне области значения не получает
    и в фиксацию не идёт — это не ошибка и не «нет данных», а законный исход с названной причиной
    (ИК-7). Показатели значений у такого объекта не спрашиваются вовсе: до них нет дела.</div>
  </div>`;
}

/* Вкладка публикации существует только у черновика и только у администратора: у остальных
   её нет в ряду вкладок вовсе — пустая вкладка «нельзя» ничего не объясняет. */
function tabPublication(clf, draft){
  const refusals = CL.publishChecks(clf.id, draft);
  return `<div class="card">
    <h3>Публикация редакции ${draft.no}</h3>
    <div class="form-row">
      <div class="fld"><label>Основание (норма и редакция)</label>
        <input id="pubBasis" value="${esc(draft.basis)}" oninput="CL.metaUI('${clf.id}')"
          placeholder="например: Порядок №41 от 06.07.2026, п. 11"></div>
      <div class="fld"><label>Дата ввода в действие</label>
        <input id="pubFrom" type="date" value="${esc(draft.from)}" oninput="CL.metaUI('${clf.id}')"></div>
      <button class="btn btn-success" onclick="CL.publishUI('${clf.id}')">Ввести в действие</button>
    </div>
    <div id="pubRefusals">${pubBanner(refusals)}</div>
    <div class="note">Отказ не молчит и не копится по одному: перечисляются все причины сразу (§0.3).
    Список пересчитывается по мере заполнения полей, а кнопка не гаснет: причину обязано быть
    видно, а не угадывать по недоступной кнопке (КФ-Д6).
    Дата ввода в действие может быть в прошлом, но не раньше начала открытого периода — иначе
    версия дотянулась бы до зафиксированного; и не позже сегодняшнего дня — публикация вводит
    редакцию в действие немедленно, отложенного пуска в модели нет (ИК-4).</div>
  </div>
  <div id="dryRun">${dryRunCard(clf.id)}</div>`;
}

function tabJournal(clf){
  const journal = clf.versions.slice().sort((a, b) => b.no - a.no).map(v => `
    <tr class="pick" onclick="CL.showVer(${v.no})"><td><b>${v.no}</b></td><td>${verPill(v)}</td>
      <td>${esc(v.basis || '—')}</td>
      <td>${v.from ? fmt(v.from) : '—'}${v.until ? ' — ' + fmt(v.until) : ''}</td>
      <td>${esc(v.by || '—')}${v.at ? '<div class="small">' + fmt(v.at) + '</div>' : ''}</td>
      <td>${v.values.length}</td></tr>`).join('');
  return `<div class="card">
    <h3>Журнал редакций</h3>
    <table class="cgrid"><thead><tr><th>№</th><th>Статус</th><th>Основание</th>
      <th>Действует</th><th>Кто ввёл</th><th>Значений</th></tr></thead>
      <tbody>${journal}</tbody></table>
    <div class="note">Запись фиксации ссылается на конкретную редакцию, а не на «текущую»:
    поэтому июнь читается по редакции 1, даже когда действует редакция 2 (ИК-8). Строка журнала
    открывает свою редакцию на вкладке значений — прошлое читается, но не правится (ИК-2).</div>
  </div>`;
}

CL.pick = id => CL.open(id);          /* прежнее имя перехода — карточка одна и та же */
CL.addValueUI = clfId => {
  const el = $('#newVal');
  const label = el && el.value.trim();
  if(!label){ toast('укажите наименование значения', 'err'); return; }
  act(CL.addValue(clfId, label), 'значение добавлено');
};
CL.publishUI = clfId => {
  const basis = ($('#pubBasis') || {}).value || '';
  const from = ($('#pubFrom') || {}).value || '';
  const res = CL.publish(clfId, {basis, from});
  if(res.ok){ CL.state.clfVer = null; CL.state.clfTab = 'values'; toast('редакция ' + res.no + ' введена в действие', 'ok'); render(); }
  else { toast(res.refusals[0], 'err'); render(); }
};
CL.metaUI = clfId => {
  CL.setVerMeta(clfId, {basis:(($('#pubBasis') || {}).value || ''),
    from:(($('#pubFrom') || {}).value || '')});
  const el = $('#pubRefusals');
  if(el) el.innerHTML = pubBanner(CL.publishChecks(clfId, CL.draftVer(clfId)));
  /* Прогон пересчитывается тем же вводом: он читает дату ввода в действие и число отказов, и
     оставшись от прошлой полной отрисовки, спорил с баннером в одном окне — «проверки пройдены»
     сверху и «публикацию держат отказы» снизу (КФ-Д14). */
  const dr = $('#dryRun');
  if(dr) dr.innerHTML = dryRunCard(clfId);
};
CL.stopUI = clfId => {
  const clf = CL.clf(clfId);
  openModal(`<div class="modal-h"><span class="mt">Прекращение действия: ${esc(clf.name)}</span>
      <button class="modal-x" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p class="small">Классификатор не удаляется: записи закрытых периодов ссылаются на его
        редакции и обязаны остаться читаемыми (ИК-19). Действующая редакция закрывается датой,
        после неё значений не назначается вовсе — витрина скажет причину, а закрытие периода
        записей по этому классификатору не сделает.</p>
      <label class="small"><b>Дата прекращения</b> — не раньше начала открытого периода
        ${fmt(CL.startOfOpen())} и не позже сегодняшнего дня (ИК-4)</label>
      <input id="stopUntil" type="date" value="${CL.state.today}"
        style="height:36px;width:100%;border:1px solid var(--border-strong);border-radius:4px;padding:0 10px;margin-bottom:10px">
      <label class="small"><b>Причина</b> — обязательна</label>
      <textarea id="stopReason" placeholder="например: Порядок №41 отменил классификацию по этому признаку"></textarea>
      <div id="modalErr"></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
      <button class="btn btn-danger" onclick="CL.stopDo('${clfId}')">Прекратить действие</button>
    </div>`);
};
CL.stopDo = clfId => {
  const res = CL.stopClassifier(clfId, {until:(($('#stopUntil') || {}).value || ''),
    reason:(($('#stopReason') || {}).value || '')});
  if(res.ok) CL.state.clfVer = null;
  modalAct(res, 'действие классификатора прекращено');
};

function pubBanner(refusals){
  return refusals.length
    ? `<div class="banner danger" style="margin-top:12px"><b>Публикация невозможна — ${refusals.length}:</b>
       <ul>${refusals.map(r => '<li>' + esc(r) + '</li>').join('')}</ul></div>`
    : `<div class="banner ok" style="margin-top:12px">Проверки пройдены: список замкнут значением по
       умолчанию, показатели живы, дата не раньше начала открытого периода ${fmt(CL.startOfOpen())}.</div>`;
}

/* Сухой прогон виден рядом с кнопкой публикации всегда, а не по кнопке «показать»: публикация
   необратима, и цена её последствий не должна зависеть от того, догадался ли администратор
   заглянуть в предпросмотр (ИК-2). */
function dryRunCard(clfId){
  const r = CL.dryRun(clfId);
  if(!r.ok) return '';
  const rows = r.rows.map(o => {
    const was = o.was.ok ? esc(o.was.label) : '<span class="muted">нет значения</span>';
    const will = o.will.ok ? esc(o.will.label) : '<span class="muted">нет значения</span>';
    return `<tr${o.changed ? '' : ' class="out"'}>
      <td class="mono">${esc(o.objId)}</td>
      <td>${was}<div class="small">${esc((o.was.why || [])[0] || '')}</div></td>
      <td>${o.changed ? '<b>' + will + '</b>' : will}<div class="small">${esc((o.will.why || [])[0] || '')}</div></td>
      <td>${o.changed ? '<span class="pill warn">изменится</span>' : '<span class="pill neutral">как есть</span>'}</td></tr>`;
  }).join('');
  return `<div class="card">
    <h3>Сухой прогон черновика ${r.verNo}${r.baseNo ? ' против действующей редакции ' + r.baseNo : ' (действующей редакции нет)'}</h3>
    <div class="chips">
      <span class="chip">объектов <span class="n">${r.cnt.total}</span></span>
      <span class="chip${r.cnt.changed ? ' on' : ''}">изменится <span class="n">${r.cnt.changed}</span></span>
      <span class="chip">со значением сейчас <span class="n">${r.cnt.inNow}</span></span>
      <span class="chip">со значением после <span class="n">${r.cnt.inDraft}</span></span>
      <span class="chip">потеряют значение <span class="n">${r.cnt.lost}</span></span>
      <span class="chip">получат значение <span class="n">${r.cnt.gained}</span></span>
    </div>
    <table class="cgrid"><thead><tr><th>Объект</th><th>Сейчас</th><th>Станет</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    ${r.refusals.length ? `<div class="banner warn">Прогон считает даже непубликуемый черновик —
      это предпросмотр, а не проверка: публикацию всё равно ${plural(r.refusals.length, 'держит', 'держат', 'держат')}
      ${r.refusals.length} ${plural(r.refusals.length, 'отказ', 'отказа', 'отказов')} выше.</div>` : ''}
    <div class="note">Прогон <b>ничего не записывает и никому не назначает</b>: значение по-прежнему
      ставит только действующая редакция (ИК-1). Строки «потеряют значение» — это, как правило, выход
      объекта из области версии; это законный исход, но он обязан быть виден до публикации, а не после
      (ИК-7). Строки «как есть» приглушены, чтобы разница читалась глазами.</div>
  </div>`;
}

/* ------------------------ ЭКРАН: ПОКАЗАТЕЛИ -------------------------
 * Тот же разворот, что у классификаторов: список отвечает «что есть и кто это считает»,
 * карточка — «где это используется и можно ли снять» (ИК-16).
 * ------------------------------------------------------------------- */
function viewIndicators(){
  return CL.state.curInd ? indDetail(CL.state.curInd) : indList();
}
CL.indShown = () => {
  const st = CL.state;
  const q = (st.indQ || '').trim().toLowerCase();
  return st.indicators.filter(i =>
    (st.indObj === 'все' || i.obj === st.indObj) &&
    (!q || i.name.toLowerCase().includes(q) || i.id.toLowerCase().includes(q)));
};
CL.indRowsHtml = () => {
  const list = CL.indShown();
  if(!list.length) return `<tr><td colspan="7" class="muted">по этому запросу показателей нет</td></tr>`;
  return list.map(i => {
    const used = CL.usedBy(i.id);
    return `<tr class="pick${i.retired ? ' out' : ''}" onclick="CL.openInd('${i.id}')">
      <td><span class="rowname">${esc(i.name)}</span><div class="small mono">${esc(i.id)}</div></td>
      <td>${esc(i.obj)}</td>
      <td>${esc(i.type)}${i.domain ? '<div class="small">' + i.domain.map(esc).join(' · ') + '</div>' : ''}</td>
      <td>${esc(i.src)}</td>
      <td>${esc(i.owner)}</td>
      <td class="mono">${used.length}</td>
      <td>${i.retired ? '<span class="pill neutral">снят</span>' : '<span class="pill ok">в реестре</span>'}</td></tr>`;
  }).join('');
};
function indList(){

  return `<p class="page-lead">Показатель — именованный вход классификатора, а не поле объекта.
    Реестр хранит имя, тип, объект, источник и владельца; способа вычисления в нём нет — он у
    владельца данных (ADR-0120 §1–2).</p>
    ${readOnlyBanner('реестр показателей')}
    <div class="toolbar">
      ${CL.canEditConstructor() ? '<button class="btn btn-primary" onclick="CL.newIndUI()">+ Показатель</button>' : ''}
      <input type="search" id="indQ" value="${esc(st.indQ)}" oninput="CL.indSearch(this.value)"
        placeholder="поиск по наименованию или идентификатору">
      <span class="chips">${objChip('все')}${objChip('кредит')}${objChip('заёмщик')}</span>
      <span class="small" id="indCount">показано ${CL.indShown().length} из ${st.indicators.length}</span>

      <th>Источник</th><th>Владелец</th><th>Исп.</th><th>Состояние</th></tr></thead>
      <tbody id="indRows">${CL.indRowsHtml()}</tbody></table>

      где именно — видно в карточке. Владелец отвечает на вопрос «кому писать, если величина врёт»,
      и потому обязателен (ADR-0120 §2).</div>
    <div class="note">Показатели-перечисления <code>procKind</code>, <code>roleEnd</code> и

      честно платящий по мировому соглашению, увидел бы чужую просрочку без пояснения (ИК-18).</div>`;

/* Поиск перерисовывает ТОЛЬКО строки таблицы: полный render() на каждом нажатии клавиши
   отобрал бы у поля фокус — тот же приём, что у списка отказов публикации (КФ-Д6). */

    </div>` : ''}

      правило осталось бы без входа. Причина названа списком до нажатия, а кнопка не гаснет — отказ
      обязан быть читаемым, а не угадываемым (§0.3, КФ-Д6).</div>
  </div>`;
}

/* Поле домена показывается только у перечисления: у булева и числа сравнивать не с чем. */
CL.indTypeUI = type => {
  if(typeof document === 'undefined') return;
  const w = document.getElementById('niDomWrap');
  if(w) w.style.display = type === 'перечисление' ? '' : 'none';
};
CL.addIndicatorUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();

  /* Домен читается с экрана, а не подставляется кодом: подставленный ['нет','да'] заводил

};

/* --------------------------- ЭКРАН: ФАКТЫ --------------------------- */
function factRow(f, showCredit){
  const k = KIND(f.kindId);
  const fate = CL.fateOf(f);
  const cls = f.annulled ? 'annul' : (fate === 'засчитан' ? 'yes' : 'no');
  const late = f.counted !== f.occurred;
  return `<tr>
    ${showCredit ? '<td class="mono">' + esc(f.creditId) + '</td>' : ''}
    <td class="mono">${esc(f.id)}</td>
    <td>${esc(k.name)}<div class="small">${esc(k.norm)} · уровень: ${esc(k.level)}</div></td>
    <td>${fmt(f.occurred)}${late ? '<div class="small">учтён с <b>' + fmt(f.counted) + '</b> — ' +
        monLabel(ym(f.occurred)) + ' закрыт, прошлое не переписывается (ИК-9)</div>' : ''}</td>
    <td>${f.doc ? esc(f.doc) : '<span class="pill err">решения комитета нет</span>'}</td>
    <td>${f.until ? fmt(f.until) : '<span class="muted">бессрочно</span>'}</td>
    <td class="${cls === 'annul' ? 'muted' : ''}">${f.annulled
      ? 'аннулирован ' + fmt(f.annulled.at) + '<div class="small">' + esc(f.annulled.reason) + '</div>'
      : esc(fate)}</td>
    <td>${f.annulled || !CL.canEnterFacts() ? '' : `<button class="btn btn-secondary btn-sm" onclick="CL.annulUI('${f.id}')">аннулировать</button>`}</td></tr>`;
}
function viewFacts(){
  const st = CL.state;
  const cnt = CL.factCounts();
  const flt = st.factFilter || null;
  const ff = st.factForm || (st.factForm = {credit:'', kind:'', when:'', doc:'', until:''});
  const canEnter = CL.canEnterFacts();
  const shown = st.facts.filter(f => !flt || CL.fateOf(f) === flt);
  const rows = shown.length
    ? shown.map(f => factRow(f, true)).join('')
    : `<tr><td colspan="8" class="muted">фактов с судьбой «${esc(flt)}» нет</td></tr>`;
  const chips = `<div class="chips">
    <span class="chip${flt ? '' : ' on'}" onclick="CL.factFilterUI(null)">все факты <span class="n">${cnt['всего']}</span></span>
    ${CL.FATES.map(k => `<span class="chip${flt === k ? ' on' : ''}" onclick="CL.factFilterUI('${esc(k)}')">${esc(k)} <span class="n">${cnt[k]}</span></span>`).join('')}
  </div>`;
  const creditOpts = CL.state.credits.map(c => `<option${c.id === ff.credit ? ' selected' : ''}>${esc(c.id)}</option>`).join('');
  const kindOpts = FACTOR_KINDS.map(k => `<option value="${k.id}"${k.id === ff.kind ? ' selected' : ''}>${esc(k.name)} — ${esc(k.norm)}, ${esc(k.level)}</option>`).join('');
  return `<p class="page-lead">Руками вводится <b>факт</b>, а не значение: категорию по фактам выводит
    движок (ADR-0122, ИК-1). Фактор без решения комитета в показатель не попадает, но остаётся
    виден с причиной — молчаливого отказа нет (ИК-10, ИК-12).</p>
    ${canEnter ? `<div class="card">
      <h3>Завести факт по кредиту</h3>
      <div class="form-row">
        <div class="fld"><label>Кредит</label>
          <select id="fCredit" onchange="CL.factFormUI('credit',this.value)">${creditOpts}</select></div>
        <div class="fld"><label>Вид фактора (п. 11)</label>
          <select id="fKind" onchange="CL.factFormUI('kind',this.value)">${kindOpts}</select></div>
        <div class="fld"><label>Дата наступления</label>
          <input id="fWhen" type="date" value="${esc(ff.when || CL.state.today)}" oninput="CL.factFormUI('when',this.value)"></div>
        <div class="fld"><label>Решение комитета</label>
          <input id="fDoc" placeholder="протокол КАБК № … от …" value="${esc(ff.doc)}" oninput="CL.factFormUI('doc',this.value)"></div>
        <div class="fld"><label>Действует до</label>
          <input id="fUntil" type="date" value="${esc(ff.until)}" oninput="CL.factFormUI('until',this.value)"></div>
        <button class="btn btn-primary" onclick="CL.addFactUI()">Завести факт</button>
      </div>
      <div class="note">Уровень и пункт приходят из справочника вместе с видом фактора — человек их не
        выбирает. Дата в закрытом периоде принимается: факт учтётся с ${fmt(CL.startOfOpen())} — начала
        открытого периода, и в реестре встанут обе даты (ИК-9).</div>
      <div class="note">Отказ по одному полю не стирает остальные: набранное остаётся на месте, править
        нужно только названное в отказе (КФ-Д11).</div>
    </div>` : `<div class="banner info">Только просмотр: факты вводит и аннулирует
      <b>«Кредитный инспектор»</b> либо <b>«Администратор классификации»</b> — роль переключается в
      шапке. Форма и кнопки не показаны вовсе: погашенная кнопка сообщила бы о запрете, но не о
      причине (§0.3, КФ-Д16).</div>`}
    <div class="card">
      <h3>Реестр фактов</h3>
      ${chips}
      <table class="cgrid"><thead><tr><th>Кредит</th><th>ID</th><th>Вид фактора</th>
        <th>Наступил</th><th>Решение комитета</th><th>Действует до</th><th>Судьба</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      <div class="note">Причины незачёта — закрытый список из трёх: нет решения комитета · интервал
        истёк · ведёт к более лёгкому значению, чем выбранное. Свободного текста в этой колонке нет,
        иначе по ней нельзя было бы ни фильтровать, ни считать (ИК-12) — счётчики и фильтр выше и есть
        та самая работа, ради которой список закрыт. Сумма по судьбам равна числу фактов: судьба у
        факта ровно одна.</div>
      <div class="note">Судьба считается против значения, которое кредит имеет <b>сейчас</b>: третья
        причина («ведёт к более лёгкому значению, чем выбранное») без выбранного значения не
        существует вовсе. Поэтому у кредита вне области или без действующей редакции факт с решением
        комитета остаётся «засчитан» — незачесть его нечему.</div>
      <div class="note">Аннулирование не удаляет факт: он остаётся в реестре с причиной и автором,
        а пересчёт затрагивает только открытый период (ADR-0122, ИК-8).</div>
    </div>`;
}
CL.factFilterUI = k => { CL.state.factFilter = k || null; render(); };
CL.factFormUI = (field, value) => { (CL.state.factForm || (CL.state.factForm = {}))[field] = value; };
CL.addFactUI = () => {
  const g = id => (($('#' + id) || {}).value || '').trim();
  const spec = {creditId:g('fCredit'), kindId:g('fKind'), occurred:g('fWhen'),
    doc:g('fDoc') || null, until:g('fUntil') || null};
  CL.state.factForm = {credit:spec.creditId, kind:spec.kindId, when:spec.occurred,
    doc:spec.doc || '', until:spec.until || ''};
  const res = CL.addFact(spec);
  /* Форма очищается только успехом: после отказа она возвращается набранной (КФ-Д11). */
  if(res.ok) CL.state.factForm = {credit:'', kind:'', when:'', doc:'', until:''};
  act(res, 'факт заведён');
};

/* ------------------------- ЭКРАН: ВИТРИНА --------------------------- */
function factsBlock(creditId, chosenCode){
  const fs = CL.state.facts.filter(f => f.creditId === creditId);
  if(!fs.length) return '';
  const items = fs.map(f => {
    const k = KIND(f.kindId);
    const fate = f.annulled ? 'аннулирован — ' + f.annulled.reason : CL.factFate(f, chosenCode);
    const cls = f.annulled ? 'annul' : fate === 'засчитан' ? 'yes' : 'no';
    const late = f.counted !== f.occurred;
    return `<div class="f ${cls}">${esc(k.name)} · ${esc(k.norm)} · ${f.doc ? esc(f.doc) : 'решения комитета нет'}
      — <em>${esc(fate)}</em>${late ? '<br>наступил ' + fmt(f.occurred) + ', учтён с ' + fmt(f.counted) +
      ' — ' + monLabel(ym(f.occurred)) + ' зафиксирован' : ''}</div>`;
  }).join('');
  return `<div class="facts"><div class="small"><b>Реестр фактов кредита</b></div>${items}</div>`;
}
function viewShowcase(){
  const st = CL.state;
  const closed = CL.isClosed(st.asOf);
  const rows = st.credits.map(c => {
    const seam = CL.riskCategory('кредит', c.id, st.asOf);
    const o = overdueOf(c);
    const days = o.days ? `${o.days} <span class="small">· ${esc(o.layer)}</span>` : '0';
    /* Реестр фактов печатается и без значения: причина отказа и заведённые факты — разные
       вопросы, а гаснущий вместе со значением реестр читается как «факт не сохранился»
       (КФ-Д15). Без выбранного значения третья причина незачёта не существует — судьба
       считается против null, как и в реестре фактов. */
    const cell = (seam.ok
      ? `<span class="pill ${pillFor(seam.code)}">${esc(seam.label)}</span>
         <div class="small">редакция ${seam.verNo || '—'} · источник: ${esc(seam.source)}</div>`
      : `<span class="pill neutral">значения нет</span>`)
      + seam.why.map(w => '<div class="why">' + esc(w) + '</div>').join('')
      + (closed ? '' : factsBlock(c.id, seam.ok ? seam.code : null));
    return `<tr${seam.ok ? '' : ' class="out"'}>
      <td><b>${esc(c.id)}</b><div class="small">${esc((CL.borrower(c.inn) || {}).name)}</div></td>
      <td>${days}${c.defer ? '<div class="why">' + esc(c.deferNote) + '</div>' : ''}</td>
      <td>${cell}</td></tr>`;
  }).join('');

  const cards = st.borrowers.map(b => {
    const fold = CL.riskCategory('заёмщик', b.inn, st.asOf);
    const sub = CL.valueAt('sub', 'заёмщик', b.inn, st.asOf);
    const grp = sub.ok && !['none','closed'].includes(sub.code) ? sub.code[0] : null;
    const pay = CL.classify('pay', 'заёмщик', b.inn);
    return `<div class="card">
      <h3>${esc(b.name)} <span class="small">· ИНН ${esc(b.inn)} · ${esc(b.kind)}</span></h3>
      <div class="kv">
        <div class="k">Категория риска</div><div class="v">${fold.ok
          ? `<span class="pill ${pillFor(fold.code)}">${esc(fold.label)}</span>
             <div class="small">свёртка worst-of по ${fold.counted} кредитам в области; источник —
             <b>${esc(fold.sourceCreditId)}</b>. Своего классификатора у заёмщика нет (ADR-0121)</div>`
          : `<span class="pill neutral">нет</span><div class="small">${esc(fold.why[0])}</div>`}</div>
        <div class="k">Подгруппа</div><div class="v">${sub.ok
          ? esc(sub.label) + '<div class="small">' + sub.why.map(esc).join(' · ') +
            '</div><div class="small">свернуть подгруппу нельзя: признака сравнимости у версии нет (ИК-6)</div>'
          : '<span class="pill neutral">нет</span><div class="small">' + esc(sub.why[0]) + '</div>'}</div>
        <div class="k">Группа</div><div class="v">${grp
          ? grp + '<div class="small">первый разряд подгруппы; отдельным значением не заводится (ADR-0012)</div>'
          : '— <div class="small">вне лестницы группы нет</div>'}</div>
        <div class="k">Платёжеспособность</div><div class="v">—
          <div class="small">${esc(pay.why[0])}</div></div>
      </div></div>`;
  }).join('');

  return `<p class="page-lead">Витрина не считает категорию: она спрашивает шов
    <code>riskCategory(объект, дата)</code> и печатает объяснение (ADR-0124). На закрытую дату шов
    отдаёт запись фиксации, на открытую — значение функции; потребитель различия не знает (ИК-8).</p>
    <div class="banner ${closed ? 'info' : 'ok'}">Дата среза <b>${fmt(st.asOf)}</b> —
      ${closed ? 'период ' + monLabel(ym(st.asOf)) + ' <b>закрыт</b>: показываются записи фиксации, пересчёта нет.'
               : 'период <b>открыт</b>: значение считается сейчас и меняется с каждым новым фактом.'}</div>
    <div class="card">
      <h3>Кредиты</h3>
      <table class="cgrid"><thead><tr><th>Договор</th><th>Дней просрочки · слой</th>
        <th>Категория и объяснение</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="note">Одно число «дней просрочки» не показывается нигде: рядом всегда слой-источник
        (ИК-18). Объяснение несёт <b>все</b> сработавшие правила выбранного значения — видно, что
        снятие одной причины значения не двинет (ИК-11).</div>
    </div>
    <div class="section-h">Заёмщики</div>
    <p class="page-lead">Категория заёмщика — свёртка, а не собственный классификатор; подгруппа —
      отдельный классификатор с тем же движком и другим порядком разбора.</p>
    ${cards}`;
}

/* ------------------- ЭКРАН: ПЕРИОДЫ И ФИКСАЦИЯ ---------------------- */
function viewPeriods(){
  const st = CL.state;
  const open = CL.openPeriod();
  const asOf = open ? first(nextM(open)) : null;
  const canClose = open && st.today >= asOf;
  const periods = st.months.map(m => {
    const s = CL.periodStatus(m);
    const meta = st.periodMeta[m] || {};
    const cnt = st.records.filter(r => r.period === m).length;
    return `<tr><td>${monLabel(m)}</td>
      <td>${s === 'закрыт' ? '<span class="pill neutral">закрыт</span>'
        : s === 'открыт' ? '<span class="pill ok">открыт</span>' : '<span class="pill info">будущий</span>'}</td>
      <td>${meta.at ? fmt(meta.at) : '—'}</td><td>${esc(meta.by || '—')}</td>
      <td>${cnt || '—'}</td></tr>`;
  }).join('');

  const rep = CL.report12();
  const repRows = rep.rows.map(r => `<tr><td>${esc(r.label)}</td><td class="mono">${r.count}</td></tr>`).join('');

  const recs = st.records.slice().sort((a, b) => a.period < b.period ? 1 : -1).map(r => `
    <tr><td>${monLabel(r.period)}</td><td class="mono">${esc(r.objId)}</td>
      <td>${esc(r.objType)}</td>
      <td><span class="pill ${pillFor(r.code)}">${esc(r.label)}</span>
        <div class="small">${esc(CL.clf(r.clfId).name)}, редакция ${r.verNo}</div></td>
      <td>${r.rules.map(c => '<div class="why">' + esc(c.text) + ' — <em>' + esc(c.norm) + '</em></div>').join('')}
        ${r.factIds.length ? '<div class="small">факты: ' + r.factIds.map(esc).join(', ') + '</div>' : ''}</td>
      <td>${esc(r.by)}<div class="small">${fmt(r.at)} · срез ${fmt(r.asOf)}</div></td></tr>`).join('');

  return `<p class="page-lead">Закрытие учётного периода — это и есть фиксация: по каждому объекту в
    области пишется запись со значением, редакцией, всеми сработавшими правилами и засчитанными
    фактами. Записи неизменны: ни корректировка факта, ни новая редакция нормы прошлое не
    переписывают (ADR-0123).</p>
    <div class="banner ${canClose ? 'warn' : 'info'}">
      Открыт период <b>${open ? monLabel(open) : '—'}</b>.
      ${canClose ? 'Закрытие возможно с ' + fmt(asOf) + ' — срез на 1-е число, срок сдачи отчёта п. 12 — ' + fmt(day15(nextM(open))) + '.'
                 : 'Закрывать рано: период не завершён, закрытие откроется ' + fmt(asOf) + ' (ИК-13).'}
    </div>
    ${closePreviewCard()}
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn btn-primary" onclick="CL.closeUI()" ${canClose && CL.canClosePeriod() ? '' : 'disabled'}>
        Закрыть период ${open ? monLabel(open) : ''}</button>
    </div>
    <div class="card">
      <h3>Учётные периоды</h3>
      <table class="cgrid"><thead><tr><th>Период</th><th>Статус</th><th>Закрыт</th><th>Кто закрыл</th>
        <th>Записей</th></tr></thead><tbody>${periods}</tbody></table>
      <div class="note">Закрытый период обратно не открывается, и закрываются они по порядку (ИК-13).
        Фиксацию делает человек, закрывающий месяц, — не ночной процесс: у записи есть автор.</div>
    </div>
    <div class="card">
      <h3>Отчёт п. 12 — ${monLabel(rep.period)}</h3>
      <div class="kv">
        <div class="k">По состоянию на</div><div class="v">${fmt(rep.asOf)}</div>
        <div class="k">Срок представления</div><div class="v">не позднее ${fmt(rep.deadline)}</div>
        <div class="k">Фактически сформирован</div><div class="v">${rep.closedAt ? fmt(rep.closedAt) : '—'}
          ${rep.closedAt ? (rep.late ? '<span class="pill err">просрочен на ' + rep.lateBy + ' дн.</span>'
                                     : '<span class="pill ok">в срок</span>') : ''}</div>
        <div class="k">Всего кредитов в отчёте</div><div class="v">${rep.total}</div>
      </div>
      <table class="cgrid" style="margin-top:12px"><thead><tr><th>Категория</th><th>Кредитов</th></tr></thead>
        <tbody>${repRows}</tbody></table>
      <div class="note">Просроченный срок п. 12 печатается предупреждением и период не запирает:
        в сводку препятствий закрытия классификация ничего не добавляет (ИК-14).</div>
    </div>
    <div class="card">
      <h3>Записи фиксации</h3>
      <table class="cgrid"><thead><tr><th>Период</th><th>Объект</th><th>Тип</th><th>Значение</th>
        <th>Сработавшие правила</th><th>Кто закрыл</th></tr></thead><tbody>${recs}</tbody></table>
      <div class="note">Объектов вне области в записях нет вовсе: недействующий кредит значения не
        получает, и закрытие дешевеет ровно на такие объекты (ИК-7). Отчёт обязан различать «вне
        области» и «записи нет»: первое нормально, второе — дефект.</div>
    </div>
    ${st.log.length ? `<div class="card"><h3>Журнал действий сессии</h3>
      <table class="cgrid"><thead><tr><th>Дата</th><th>Кто</th><th>Что</th></tr></thead>
      <tbody>${st.log.map(l => `<tr><td>${fmt(l.at)}</td><td>${esc(l.who)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</tbody>
      </table></div>` : ''}`;
}
/* Закрытие периода необратимо (ИК-13), поэтому состав будущих записей показан ДО кнопки —
   и отдельной строкой назван случай «записи не будет вовсе»: классификатор без действующей
   редакции. Отчёт п. 12 обязан различать «вне области» и «записи нет», и различие обязано
   быть видно закрывающему, а не читателю отчёта задним числом. */
function closePreviewCard(){
  const pv = CL.closePreview();
  if(!pv.ok) return '';
  const rows = pv.rows.map(r => `<tr${r.verNo === null ? ' class="out"' : ''}>
    <td>${esc(r.clf)}</td>
    <td>${r.verNo === null ? '<span class="muted">нет</span>' : r.verNo}</td>
    <td class="mono">${r.total}</td>
    <td class="mono">${r.verNo === null ? '<span class="muted">0</span>' : '<b>' + r.willWrite + '</b>'}</td>
    <td class="mono">${r.verNo === null ? '—' : r.out}</td>
    <td class="mono">${r.verNo === null ? '—' : (r.nodata ? '<b class="bad">' + r.nodata + '</b>' : '0')}</td>
    <td class="small">${esc(r.why || (r.nodata
      ? 'записей меньше, чем объектов: ' + r.nodataWhy
      : 'записи пишутся по редакции ' + r.verNo + '; объекты вне области пропускаются (ИК-7)'))}</td></tr>`).join('');
  return `<div class="card">
    <h3>Что будет записано при закрытии ${monLabel(pv.period)}</h3>
    <div class="chips">
      <span class="chip on">записей будет <span class="n">${pv.willWrite}</span></span>
      <span class="chip">вне области <span class="n">${pv.out}</span></span>
      <span class="chip${pv.nodata ? ' bad' : ''}">нет данных <span class="n">${pv.nodata}</span></span>
      <span class="chip">классификаторов без записи <span class="n">${pv.silent}</span></span>
      <span class="chip">срез на <span class="n">${fmt(pv.asOf)}</span></span>
    </div>
    <table class="cgrid"><thead><tr><th>Классификатор</th><th>Редакция</th><th>Объектов</th>
      <th>Записей</th><th>Вне области</th><th>Нет данных</th><th>Примечание</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Предпросмотр считает тем же движком и той же областью, что и само закрытие, —
      это не отдельная оценка, а тот же расчёт без записи (ИК-1). «Вне области» — норма: объект
      законно остаётся без значения. «Нет данных» — <b>не</b> норма: владелец показателя его не отдал,
      объект остаётся без записи, и починить это после закрытия периода уже нельзя (ИК-20, ИК-13).
      «Классификатор без записи» — не норма и не поломка данных, а прямое следствие того, что
      действующей редакции нет; если это не так задумано, публикуйте редакцию до закрытия,
      потому что задним числом период не открыть (ИК-13).</div>
  </div>`;
}
CL.closeUI = () => {
  const res = CL.closePeriod();
  if(res.ok) toast('период ' + monLabel(res.period) + ' закрыт: записей — ' + res.written, 'ok');
  else toast(res.why, 'err');
  render();
};

if(typeof window !== 'undefined') window.CL = CL;
if(typeof document !== 'undefined') render();
</script>
</body>
</html>
