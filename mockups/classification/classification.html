  ЯЗЫК МОДУЛЯ. Значение назначается ПРАВИЛАМИ. Правило — конъюнкция (И) скалярных
  предикатов; правила одного значения связаны дизъюнкцией (ИЛИ). Скобок и вложенности нет:
  любая формулировка нормы раскладывается в этот вид (ДНФ), а вложенность нельзя ни
  прочитать глазами, ни объяснить заёмщику. Предикат — «показатель · оператор · КОНСТАНТА»;
  показателя справа не бывает. Слово «условие» в этом модуле не употребляется: оно занято
  договорным условием кредита.

  ЧЕГО В МОДУЛЕ НЕТ (граница проходит по глаголу: модуль не считает вход и не распоряжается выходом)
    · вычисления самих показателей — их считает модуль-владелец: дней просрочки и слой-источник
      даёт «Платежи», вид живой процедуры — «Взыскание», действующий ли кредит — «Кредиты»;
      классификация только читает готовое значение и называет владельца в отказе;
    · последствий значения: резервы, лимиты, штрафы, запрет выдачи, уведомления — не здесь;
      модуль отдаёт значение и объяснение, распоряжается им потребитель;
    · ручного проставления и правки значения — И-1: значение ставит только движок;
    · выдумывания недостающего входа — И-20: «не отдан» не равно «ложь», объект остаётся
      без значения с названным показателем и владельцем;
    · блокировок работы: просроченный срок отчёта п. 12 — предупреждение, а не запрет (И-14).

  И-1  Значение нигде не вводится и не правится руками — его ставит движок.
  И-2  Действующая редакция не правится: правка — это новый черновик, открытый копией действующей.
  И-3  Редакция публикуется только замкнутой: ровно одно значение по умолчанию, оно
       последнее в списке и без правил.
  И-4  Дата ввода в действие не раньше начала открытого периода и не позже сегодняшнего
       дня: публикация — немедленный ввод в действие, отложенного пуска нет.
  И-5  Правило значения или области, ссылающееся на снятый показатель, на константу вне
       домена, на оператор не своего типа либо на пустой список у «одно из», публикацию
       не проходит.
  И-6  Свёртка «худшее по кредитам» разрешена только у редакции, объявившей себя сравнимой.
  И-7  Объект вне области значения не получает; запись фиксации по нему не пишется, и

       пустая область впускает всех; отказ называет все альтернативы входа, а не первую.
  И-8  Закрытый период неизменен: за него отдаётся запись фиксации, не пересчёт.
  И-9  Факт, наступивший в закрытом периоде, учитывается с начала открытого; в реестре
       стоят обе даты.
  И-10 Факт без реквизитов решения комитета в показатель не попадает.
  И-11 Объяснение — ВСЕ сработавшие правила выбранного значения, а не первое.
  И-12 Незачтённый факт виден в реестре фактов кредита с причиной из закрытого списка
       трёх: нет решения комитета · интервал истёк · ведёт к более лёгкому значению.
  И-13 Периоды закрываются по порядку и только после окончания месяца; закрытый не
       открывается обратно.
  И-14 Классификация не запирает период: просроченный срок п. 12 печатается
       предупреждением, а не блокировкой.
  И-15 Правило кредита вправе читать показатели заёмщика; обратного чтения нет —
       значения сворачиваются вверх, показатели читаются вниз.
  И-16 Показатель, на который ссылается действующая редакция, с реестра не снимается.
  И-17 Значение без правил, не являющееся значением по умолчанию, недостижимо —
       редакция с ним не публикуется.
  И-18 «Дней просрочки» и «слой-источник» — пара одного владельца: одно число без имени
       слоя не показывается нигде.
  И-19 Классификатор не удаляется — он прекращает действие датой и причиной. Записи
       закрытых периодов ссылаются на его редакции и обязаны остаться читаемыми.

       значения, отказ называет показатель и владельца, запись фиксации не пишется.
       Молчаливый откат к значению по умолчанию запрещён: на категории риска он читается
       как «низкий риск», потому что данных не было.
  И-21 Два правила одного значения с одним и тем же пунктом основания обязаны нести
       подпись — иначе объяснение назовёт пункт дважды и не скажет, что именно сработало.
  И-22 Две редакции одного классификатора не действуют одновременно: дата ввода в действие
       строго позже начала действующей редакции. Публикация закрывает прошлую этой же датой,
       поэтому более ранняя дала бы отрицательный интервал действия и дни, за которые
       действуют обе, — а запись фиксации после этого не может назвать свою редакцию.
  Ни один исход не молчит: «черновик не классифицирует», «действующей редакции нет», «вне
  области», «нет данных», «редакция не замкнута» — у каждого свой текст, называющий причину.

  ДЕМО ПОКРЫВАЕТ: два непохожих классификатора на одном движке · черновик без правил
  (публикация отказывает списком) · смену редакции (редакция 1 → редакция 2) и запись июня,
  посчитанную по прежней редакции · объект вне области · два сработавших правила на одном
  кредите (связка ИЛИ) · два правила одного пункта, различённые подписью (И-21) ·
  строгий оператор «> 180» из формулировки «свыше 180 дней» · отложение 181-го дня
  (п. 19.1) · кредит без опубликованного расчёта просрочки — отказ «нет данных» вместо
  тихого низкого риска (И-20) · факт без решения комитета · факт из закрытого периода с
  двумя датами · факт с истёкшим интервалом · слой-источник просрочки (мировое соглашение
  против свободного слоя) · свёртку worst-of, запрет свёртки лестницы и запрет свёртки по
  неполному набору · закрытие периода с записями и отчёт п. 12.

  ГРАНИЦЫ МАКЕТА: показатели держатся «на сейчас» — историчность даёт фиксация, а не
  пересчёт задним числом; справочник факторов п. 11 и объекты (кредиты, заёмщики) взяты
  зеркалом соседних модулей и здесь не редактируются. «Сегодня» в макете зафиксировано
  на 14.08.2026, чтобы прогон повторялся; открытый период — август 2026.
  Оператора «одно из списка» в затравке НЕТ намеренно: факторы-списки п. 11.2 и п. 11.3
  свёрнуты владельцем в показатель «максимальный уровень фактора», а три ступени процедур
  взыскания ведут к трём РАЗНЫМ подгруппам и сокращению не подлежат.
  Оператор проверяется в редакторе правил (перечисление → «∈ одно из») и в смоуке #64–#66;
  первым реальным местом станет редакция, где несколько членов домена ведут к одному
  значению.

  РАСХОЖДЕНИЯ МАКЕТА И ПОСТАНОВКИ (макет — демонстрация, постановка — требование; делать по постановке)
  1. Значения показателей в макете лежат зеркалом рядом с объектами; постановка требует
     принимать их швом от модуля-владельца, с датой снятия и признаком «не отдан» (P19-R2).
  2. Справочник видов факторов п. 11 в макете — константа кода; постановка требует
     справочник настройкой: вид, уровень, пункт, период действия (P19-R15).
  3. Журнал действий в макете живёт в памяти вкладки и показывает только текущую сессию;
     постановка требует хранимый журнал с автором, временем и предметом действия (P19-R23).
  4. Отчёт п. 12 в макете даёт распределение по значениям и число объектов; сумм
     задолженности в нём нет — это открытый вопрос карточки P19-R20, а не пропуск.
  5. Роль в макете переключается тумблером в шапке; аутентификации и прав из оргструктуры
     макет не изображает — источник роли определяет система, поведение под ролью — P19-R23.
  6. Кредиты и заёмщики в макете не создаются и не правятся: их даёт соседний модуль.

.setbox{ display:flex; flex-wrap:wrap; gap:4px 10px; padding:5px 8px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); background:var(--surface-card); }
.setbox label{ display:flex; align-items:center; gap:4px; font:var(--font-label); color:var(--text-body); cursor:pointer; }
.setbox input{ height:auto; }
.setflat{ font:var(--font-label); color:var(--text-body); }
.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ height:var(--control-h); border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; min-width:210px; }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }

/* ---- explanation blocks ---- */
.why{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-top:4px; }
.why em{ font-style:normal; color:var(--text-body); font-weight:var(--weight-medium); }
.facts{ margin-top:8px; border-top:1px dashed var(--border-default); padding-top:6px; }
.facts .f{ font:var(--weight-regular) 12.5px/1.5 var(--asubk-font); color:var(--text-muted); margin-bottom:4px; }
.facts .f.no{ color:var(--asubk-red); }
.facts .f.yes em{ color:var(--asubk-green); }
.facts .f.annul{ text-decoration:line-through; color:var(--text-placeholder); }
.frozen{ background:var(--asubk-gray-50); }

/* ---- модалка (дизайн-система: prompt/alert в макетах не используются) ---- */
.overlay{ position:fixed; inset:0; background:rgba(16,28,46,0.42); display:none;
  align-items:center; justify-content:center; z-index:60; padding:24px; }
.overlay.open{ display:flex; }
.modal{ background:var(--surface-card); border-radius:var(--radius-lg); width:min(640px,100%);
  max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }
.modal-h{ padding:18px 24px 12px; display:flex; align-items:center; gap:10px; }
.modal-h .mt{ font:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  color:var(--text-heading); flex:1; }
.modal-x{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); padding:4px;
  font-size:18px; line-height:1; }
.modal-x:hover{ color:var(--text-body); }
.modal-b{ padding:4px 24px 8px; overflow:auto; flex:1; }
.modal-b textarea{ width:100%; min-height:88px; border:1px solid var(--border-strong);
  border-radius:var(--radius-md); padding:8px 10px; font:var(--font-label); resize:vertical; }
.modal-f{ padding:14px 24px 20px; display:flex; gap:12px; justify-content:flex-end; }

/* ---- фильтр-чипы (реестр фактов: по судьбе фильтруют и считают, ИК-12) ---- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.chip{ border:1px solid var(--border-default); background:var(--surface-card); cursor:pointer;
  border-radius:var(--radius-pill); padding:5px 13px; font:var(--font-label); color:var(--text-body); }
.chip:hover{ background:var(--surface-hover); }
.chip.on{ background:var(--asubk-blue); border-color:var(--asubk-blue); color:#fff; }
.chip .n{ font-weight:var(--weight-semibold); margin-left:6px; }
/* Нехватка данных красится, а не прячется в общую графу: это чужой долг, а не норма (ИК-20). */
.chip.bad{ border-color:var(--asubk-red); color:var(--asubk-red); background:var(--status-error-bg); }
.bad{ color:var(--asubk-red); }

/* ---- крошки, тумблер пояснений ---- */
.crumb{ font:var(--font-label); color:var(--text-muted); }
.crumb-title.link{ cursor:pointer; color:var(--text-link); }
.crumb-title.link:hover{ text-decoration:underline; }
.tgl{ height:32px; border-radius:var(--radius-pill); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 12px; cursor:pointer; }
.tgl.on{ background:var(--asubk-blue-tint); border-color:var(--asubk-blue); color:var(--asubk-blue); }
.notes-off .note{ display:none; }

/* ---- вкладки карточки ---- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--border-default); margin:16px 0 14px; flex-wrap:wrap; }
.tab{ border:none; background:none; cursor:pointer; padding:9px 14px; margin-bottom:-1px;
  font:var(--font-label); color:var(--text-muted); border-bottom:2px solid transparent; }
.tab:hover{ color:var(--text-body); }
.tab.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }

/* ---- список: строка открывает карточку ---- */
table.cgrid tbody tr.pick{ cursor:pointer; }
table.cgrid tbody tr.pick:hover td{ background:var(--surface-hover); }
.rowname{ font-weight:var(--weight-medium); color:var(--text-link); }

/* ---- панель над списком: завести · поиск · фильтр ---- */
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search]{ height:32px; min-width:250px; border-radius:var(--radius-md);
  border:1px solid var(--border-strong); background:var(--surface-card);
  color:var(--text-body); font:var(--font-label); padding:0 10px; }
.toolbar input[type=search]:focus{ outline:none; border-color:var(--border-focus); box-shadow:var(--shadow-focus); }
.toolbar .chips{ margin:0; }

/* ---- toast ---- */
/* Выше .overlay (60): тост с причиной отказа рисовался ПОД затемнением модального окна и
   человеку виден не был вовсе — кнопка выглядела мёртвой (КФ-Д10). Причина окна печатается
   внутри окна (#modalErr), но и всякий другой тост обязан быть виден поверх всего. */
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:70; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:420px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Модуль «Классификация» · прототип TO-BE</small></div>

<div id="toastWrap"></div>

<script>
/* =====================================================================
 *  МОДУЛЬ «КЛАССИФИКАЦИЯ» — исполняемый прототип
 *  Слои файла: даты → справочники → состояние → владельцы показателей →
 *  движок → шов → операции → экраны.
 * ===================================================================== */
const CL = {};

/* ------------------------------ ДАТЫ ------------------------------- */
const MON = {'01':'январь','02':'февраль','03':'март','04':'апрель','05':'май','06':'июнь',
  '07':'июль','08':'август','09':'сентябрь','10':'октябрь','11':'ноябрь','12':'декабрь'};
const fmt   = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : '—';
const ym    = iso => iso.slice(0,7);
const first = m => m+'-01';
const day15 = m => m+'-15';
const nextM = m => { let [y,mm]=m.split('-').map(Number); mm++; if(mm>12){mm=1;y++;} return y+'-'+String(mm).padStart(2,'0'); };
const monLabel = m => MON[m.slice(5,7)]+' '+m.slice(0,4);
const daysBetween = (a,b) => Math.round((Date.parse(b)-Date.parse(a))/86400000);

/* ------------------- СПРАВОЧНИК ФАКТОРОВ п. 11 --------------------- */
/* Зеркало нормы: вид фактора несёт уровень и пункт. Уровень выбирает не человек —
   он приходит из справочника вместе с видом (ADR-0122: вводится факт, не значение). */
const FACTOR_KINDS = [
  {id:'f-nonTarget', name:'Нецелевое использование средств',        level:'высокий', norm:'п. 11.3'},
  {id:'f-lostColl',  name:'Утрата предмета залога',                 level:'высокий', norm:'п. 11.3'},
  {id:'f-hide',      name:'Сокрытие имущества от взыскания',        level:'высокий', norm:'п. 11.3'},
  {id:'f-noAct',     name:'Уклонение от подписания акта сверки',    level:'средний', norm:'п. 11.2'},
  {id:'f-collDown',  name:'Ухудшение состояния предмета залога',    level:'средний', norm:'п. 11.2'},
  {id:'f-noReport',  name:'Непредставление отчётности по кредиту',  level:'средний', norm:'п. 11.2'}
];
const KIND = id => FACTOR_KINDS.find(k=>k.id===id);

const ROLES = ['Администратор классификации','Кредитный инспектор','Наблюдатель'];

/* ---------------------------- СОСТОЯНИЕ ---------------------------- */
/* Всё, что модуль знает, лежит здесь. Объекты (кредиты, заёмщики) и слои просрочки —
   зеркало соседних модулей: читаются, не правятся (ADR-0124, И-11). */
function seed(){
  const st = {
    today:'2026-08-14',
    role:'Администратор классификации',
    asOf:'2026-08-14',
    view:'clf',
    /* Маршрут: curClf/curInd пусты — показан список, заполнены — карточка. Держится в
       состоянии, а не в DOM, чтобы смоук проверял разметку экрана так же, как браузер. */
    curClf:null, clfVer:null, clfTab:'values',
    curInd:null, indQ:'', indObj:'все',
    notes:false,                      /* пояснения по умолчанию свёрнуты (КФ-22) */
    /* Набранное в форме заведения факта держится в состоянии: любое действие перерисовывает
       панель целиком, и форма, жившая только в DOM, обнулялась вместе с ней — отказ по одному
       полю стирал все четыре (КФ-Д11). */
    factForm:{credit:'', kind:'', when:'', doc:'', until:''},
    factFilter:null,
    closedPeriods:['2026-05','2026-06'],
    months:['2026-05','2026-06','2026-07','2026-08'],
    log:[]
  };

  /* --- РЕЕСТР ПОКАЗАТЕЛЕЙ (ADR-0120 §1) ---
     Именованный вход: объект, тип, источник, владелец. Способа вычисления реестр не хранит.
     Квантор по коллекции свёрнут ВНУТРЬ показателя-перечисления (ADR-0125 §1), поэтому
     предикат остаётся скалярным. */
  st.indicators = [
    {id:'daysOverdue', name:'Дней просрочки (худший слой)', obj:'кредит', type:'число',
     src:'расчёт', owner:'Платежи', retired:false,
     note:'Пара с «слой-источник»: считаются одним расчётом и публикуются вместе (ИК-18).'},
    {id:'overdueLayer', name:'Слой-источник просрочки', obj:'кредит', type:'перечисление',
     domain:['нет просрочки','свободный слой','мировое соглашение','реструктуризация'],
     src:'расчёт', owner:'Платежи', retired:false},
    {id:'creditActive', name:'Кредит действующий', obj:'кредит', type:'булево',
     src:'расчёт', owner:'Кредиты', retired:false},
    {id:'factorLevel', name:'Максимальный уровень действующего фактора п. 11', obj:'кредит',
     type:'перечисление', domain:['нет','средний','высокий'],
     src:'ввод факта', owner:'Классификация', retired:false,
     note:'Свёртка засчитанных фактов кредита; факт без решения комитета в неё не входит (ИК-10).'},
    {id:'defer181', name:'Перевод на 181-й день отложен', obj:'кредит', type:'булево',
     src:'расчёт', owner:'Взыскание', retired:false},
    {id:'procKind', name:'Максимальный вид живой подтверждённой процедуры', obj:'заёмщик',
     type:'перечисление', domain:['нет','суд','исполнительные листы','инициирование банкротства'],
     src:'расчёт', owner:'Взыскание', retired:false},
    {id:'roleEnd', name:'Терминальный исход роли', obj:'заёмщик', type:'перечисление',
     domain:['нет','полное погашение','признана безнадёжной','завершено банкротство'],
     src:'расчёт', owner:'Заёмщик', retired:false},
    {id:'everCredits', name:'Кредиты были когда-либо', obj:'заёмщик', type:'булево',
     src:'расчёт', owner:'Кредиты', retired:false},
    {id:'hasActive', name:'Есть действующие кредиты', obj:'заёмщик', type:'булево',
     src:'расчёт', owner:'Кредиты', retired:false},
    {id:'anyOverdue', name:'Есть просрочка по действующим кредитам', obj:'заёмщик', type:'булево',
     src:'расчёт', owner:'Кредиты', retired:false},
    /* Снятый показатель: правило на него не сошлётся (ИК-5), новая ссылка не заводится. */
    {id:'oldRating', name:'Внутренний рейтинг заёмщика', obj:'заёмщик', type:'перечисление',
     domain:['A','B','C'], src:'расчёт', owner:'—', retired:true,
     note:'Снят с реестра 01.07.2026: методика рейтинга отменена вместе с прежней редакцией.'}
  ];

  /* --- КЛАССИФИКАТОРЫ: данные, а не код ---
     Версия несёт статус, основание, дату ввода, признак сравнимости, область,
     набор значений и правила (ADR-0125 §2–3, ADR-0126). */
  st.classifiers = [
    {id:'risk', name:'Категория кредитного риска', object:'кредит', versions:[
      { no:1, status:'прошлая',
        basis:'Порядок №41 (редакция до 06.07.2026)', from:'2026-05-01', by:'Администратор',
        at:'2026-05-04', until:'2026-07-05', comparable:true,
        scope:[{label:'кредит действующий', preds:[{i:'creditActive',op:'=',v:true}]}],
        values:[
          {code:'high', label:'Высокий кредитный риск', rules:[
            {norm:'п. 19.1', label:'просрочка 181+ дней', preds:[{i:'daysOverdue',op:'≥',v:181}]}]},
          {code:'mid', label:'Средний кредитный риск', rules:[
            {norm:'прежняя редакция', label:'просрочка от 30 дней', preds:[{i:'daysOverdue',op:'≥',v:30}]}]},
          {code:'low', label:'Низкий кредитный риск', rules:[], dflt:true, norm:'п. 11.1'}
        ]},
      { no:2, status:'действующая',
        basis:'Порядок №41 от 06.07.2026, п. 11, п. 16.1, п. 19.1', from:'2026-07-06',
        by:'Администратор', at:'2026-07-06', until:null, comparable:true,
        /* Область — правила входа: недействующий кредит значения не получает (ИК-7).
           Список правил, а не список предикатов: у области та же форма, что у значения. */
        scope:[{label:'кредит действующий', preds:[{i:'creditActive',op:'=',v:true}]}],
        values:[
          /* Два правила через ИЛИ: п. 11.3 перечисляет факторы, любого из них хватает. */
          {code:'high', label:'Высокий кредитный риск', rules:[
            {norm:'п. 19.1', label:'просрочка 181+ дней, перевод не отложен',
             preds:[{i:'daysOverdue',op:'>',v:180},{i:'defer181',op:'=',v:false}]},
            {norm:'п. 11.3', label:'засчитанный фактор высокого уровня',
             preds:[{i:'factorLevel',op:'=',v:'высокий'}]}]},
          /* Оба правила — подпункты ОДНОГО пункта 11.2, поэтому подпись у каждого обязательна:
             без неё объяснение назвало бы «п. 11.2» дважды и не сказало, что именно сработало (ИК-21). */
          {code:'mid', label:'Средний кредитный риск', rules:[
            /* Верхней границы «180 дней» здесь намеренно НЕТ, хотя п. 11.2 её называет:
               при отложении по п. 19.1 кредит с 200 днями в высокий не переводится и обязан
               остаться средним. Дописать «≤ 180» — значит уронить такой кредит в низкий риск
               мимо отложения. Граница живёт в правиле высокого («> 180 и отложения нет»),
               а разбор сверху вниз делает её здесь лишней (ADR-0126 §4). */
            {norm:'п. 11.2', label:'текущая просрочка от 1 дня',
             preds:[{i:'daysOverdue',op:'≥',v:1}]},
            {norm:'п. 11.2', label:'засчитанный фактор среднего уровня',
             preds:[{i:'factorLevel',op:'=',v:'средний'}]}]},
          {code:'low', label:'Низкий кредитный риск', rules:[], dflt:true, norm:'п. 11.1'}
        ]}
    ]},
    {id:'sub', name:'Подгруппа заёмщика', object:'заёмщик', versions:[
      { no:1, status:'действующая',
        basis:'Проектное решение ADR-0012 · лестница §3 спеки заёмщика', from:'2026-07-01',
        by:'Администратор', at:'2026-07-01', until:null,
        /* Порядок здесь — доминирование, а не тяжесть: первым стоит «кредитов не было».
           Признака сравнимости нет → свернуть лестницу нельзя технически (ИК-6). */
        /* Область пуста: подгруппу получает КАЖДЫЙ заёмщик, правил входа у неё нет
           по существу — «кредитов не было» здесь законное значение, а не отказ (ADR-0137 §3). */
        comparable:false, scope:[],
        values:[
          {code:'none',  label:'Кредитов не было',                rules:[{norm:'ступень 0', label:'кредитов не было никогда', preds:[{i:'everCredits',op:'=',v:false}]}]},
          {code:'3.2',   label:'3.2 · Банкротство завершено',     rules:[{norm:'ступень 1', label:'банкротство завершено',     preds:[{i:'roleEnd',op:'=',v:'завершено банкротство'}]}]},
          {code:'4',     label:'4 · Безнадёжная',                 rules:[{norm:'ступень 1', label:'признана безнадёжной',      preds:[{i:'roleEnd',op:'=',v:'признана безнадёжной'}]}]},
          {code:'5',     label:'5 · Погашенная',                  rules:[{norm:'ступень 1', label:'полное погашение',          preds:[{i:'roleEnd',op:'=',v:'полное погашение'}]}]},
          /* Три ступени второго уровня различают ВИД процедуры, поэтому «одно из» их не
             сворачивает: у каждого вида своя подгруппа (ADR-0137 §2 — ∈ сокращает цепочку
             «= a или = b» лишь там, где значения ведут к ОДНОМУ исходу). */
          {code:'2.3',   label:'2.3 · Инициировано банкротство',  rules:[{norm:'ступень 2', label:'инициирование банкротства', preds:[{i:'procKind',op:'=',v:'инициирование банкротства'}]}]},
          {code:'2.2',   label:'2.2 · Исполнительные листы',      rules:[{norm:'ступень 2', label:'исполнительные листы',      preds:[{i:'procKind',op:'=',v:'исполнительные листы'}]}]},
          {code:'2.1',   label:'2.1 · Судебное взыскание',        rules:[{norm:'ступень 2', label:'судебное взыскание',        preds:[{i:'procKind',op:'=',v:'суд'}]}]},

/* ----------------------- ДОСТУП И РОЛИ ----------------------------- */

/* ------------------- ПЕРИОДЫ (ADR-0123, ИК-13) --------------------- */
CL.isClosed   = dateISO => CL.state.closedPeriods.includes(ym(dateISO));
CL.openPeriod = () => CL.state.months.find(m => !CL.state.closedPeriods.includes(m));
CL.startOfOpen = () => first(CL.openPeriod());
CL.periodStatus = m => CL.state.closedPeriods.includes(m) ? 'закрыт'
  : m === CL.openPeriod() ? 'открыт' : 'будущий';

/* ---------------- ВЛАДЕЛЬЦЫ ПОКАЗАТЕЛЕЙ ---------------------------- *
 * Считает владелец данных, а не классификация: реестр хранит имя владельца,
 * но не способ вычисления (ADR-0120 §2, ADR-0125 §1).
 * ------------------------------------------------------------------- */
/* Платежи: свёртка по слоям требования. Число и слой публикуются ПАРОЙ (ИК-18). */
function overdueOf(credit){
  /* Слоёв нет вовсе — владелец расчёт не отдавал. Это НЕ ноль: ноль означал бы
     «просрочки нет», а здесь неизвестно (ИК-20). Оба показателя пары молчат вместе (ИК-18). */
  if(!credit.layers || !credit.layers.length) return {days:undefined, layer:undefined};
  const worst = credit.layers.reduce((a,l)=> l.days > a.days ? l : a, credit.layers[0]);
  return worst.days > 0 ? {days:worst.days, layer:worst.name} : {days:0, layer:'нет просрочки'};
}
/* Расчёт по кредиту не публиковался — отдельная проверка для свёрток заёмщика. */
function noCalc(credit){ return !credit.layers || !credit.layers.length; }
/* Классификация: свёртка засчитанных фактов кредита в уровень (ADR-0122). */
CL.countedFacts = creditId => CL.state.facts.filter(f =>
  f.creditId === creditId && !f.annulled && !!f.doc &&
  f.counted <= CL.state.today && (!f.until || f.until >= CL.state.today));
function factorLevelOf(creditId){
  const lv = CL.countedFacts(creditId).map(f => KIND(f.kindId).level);
  return lv.includes('высокий') ? 'высокий' : lv.includes('средний') ? 'средний' : 'нет';
}
CL.indicatorsOfCredit = credit => {
  const o = overdueOf(credit);
  return { daysOverdue:o.days, overdueLayer:o.layer, creditActive:credit.active,
           defer181:credit.defer, factorLevel:factorLevelOf(credit.id) };
};
CL.indicatorsOfBorrower = b => {
  const mine = CL.state.credits.filter(c => c.inn === b.inn);
  /* Свёртка «есть просрочка» неизвестна, пока молчит хоть один действующий кредит: «нет»
     здесь означало бы «проверено и не нашли», а проверено не всё (ИК-20). Владелец показателя
     обязан вернуть «не отдан», а не удобный ответ. */
  const blind = mine.some(c => c.active && noCalc(c));
  return { procKind:b.proc || 'нет', roleEnd:b.roleEnd || 'нет',
           everCredits:mine.length > 0, hasActive:mine.some(c => c.active),
           anyOverdue: blind ? undefined : mine.some(c => c.active && overdueOf(c).days > 0) };
};
CL.valuesOf = (objType, objId) => objType === 'кредит'
  ? CL.indicatorsOfCredit(CL.credit(objId))
  : CL.indicatorsOfBorrower(CL.borrower(objId));

/* ------------------------- ДВИЖОК ---------------------------------- *
 * Знает предикаты, порядок разбора, область и значение по умолчанию.
 * Ни Порядка №41, ни лестницы подгруппы здесь нет (ADR-0120, ADR-0124).
 * ------------------------------------------------------------------- */
CL.ind = id => CL.state.indicators.find(i => i.id === id);
CL.clf = id => CL.state.classifiers.find(c => c.id === id);
CL.credit = id => CL.state.credits.find(c => c.id === id);
CL.borrower = inn => CL.state.borrowers.find(b => b.inn === inn);
CL.activeVer = clfId => (CL.clf(clfId).versions || []).find(v => v.status === 'действующая') || null;
CL.draftVer  = clfId => (CL.clf(clfId).versions || []).find(v => v.status === 'черновик') || null;

/* Правая часть предиката — ТОЛЬКО константа: скалярная (p.v) либо множество членов
   домена (p.set) у ∈/∉. Показателя справа нет намеренно: «стоимость залога покрывает
   обязательства» (п. 11.1) сворачивает владелец залога — тот же довод, которым ADR-0125 §1
   убрал квантор внутрь показателя (ADR-0137 §4). Множество — константа, а не коллекция
   записей, поэтому предикат остаётся скалярным (ADR-0137 §2). */
const SET_OPS = ['∈','∉'];
const NUM_OPS = ['>','≥','<','≤'];
function testPred(p, vals){
  const a = vals[p.i];
  if(p.op === '∈')  return (p.set || []).indexOf(a) >= 0;
  if(p.op === '∉')  return (p.set || []).indexOf(a) < 0;
  if(p.op === '=')  return a === p.v;
  if(p.op === '≠')  return a !== p.v;
  if(p.op === '>')  return Number(a) >  Number(p.v);
  if(p.op === '≥')  return Number(a) >= Number(p.v);
  if(p.op === '<')  return Number(a) <  Number(p.v);
  if(p.op === '≤')  return Number(a) <= Number(p.v);
  return false;
}
/* Правило срабатывает, когда верны ВСЕ его предикаты. Пустое правило не срабатывает
   никогда: «ни одного предиката» — это не «любой объект подходит», а недописанный черновик. */
function ruleFires(r, vals){
  return !!(r.preds && r.preds.length && r.preds.every(p => testPred(p, vals)));
}
function shownVal(v){
  if(v === undefined || v === null) return 'не отдан';
  return typeof v === 'boolean' ? (v ? 'да' : 'нет') : String(v);
}
function constOf(p){
  return SET_OPS.indexOf(p.op) >= 0 ? (p.set || []).map(shownVal).join(', ') : shownVal(p.v);
}
CL.constOf = constOf;
/* Оператор печатается словами: объяснение читает проверяющий, а не программист. */
function opWord(op){ return op === '∈' ? 'одно из' : op === '∉' ? 'ни одно из' : op; }
CL.opWord = opWord;
function phrase(p, vals){
  const ind = CL.ind(p.i);
  return (ind ? ind.name.toLowerCase() : p.i) + ' ' + opWord(p.op) + ' ' + constOf(p) +
         ' (сейчас ' + shownVal(vals[p.i]) + ')';
}
CL.phrase = phrase;
/* Сводка правила в одну строку — подпись впереди, если она есть (ИК-21). */
function ruleText(r, vals){
  const body = (r.preds || []).map(p => phrase(p, vals)).join(' и ');
  return r.label ? r.label + ': ' + body : body;
}

/* --- НЕХВАТКА ДАННЫХ (ИК-20) ---
   Молчаливое «ложно» на неотданном показателе — худший из исходов: правило не срабатывает,
   объект съезжает к значению по умолчанию и выглядит классифицированным. На категории риска
   это «низкий риск по отсутствию данных» — ровно та ошибка, за которую наказывает проверка (ADR-0137 §5). */
function hasVal(vals, id){ const v = vals[id]; return v !== undefined && v !== null; }
function missingIn(rules, vals){
  const miss = [];
  (rules || []).forEach(r => (r.preds || []).forEach(p => {
    if(!hasVal(vals, p.i) && miss.indexOf(p.i) < 0) miss.push(p.i);
  }));
  return miss;
}
function noDataWhy(miss, where){
  return ['классифицировать нечем: ' + miss.map(id => {
    const i = CL.ind(id);
    return '«' + (i ? i.name : id) + '» (владелец — ' + (i ? i.owner : '—') + ')';
  }).join(', ') + ' не отдан' + (miss.length > 1 ? 'ы' : '') +
  ', а ' + where + ' на ' + (miss.length > 1 ? 'них' : 'нём') + ' стоит (ИК-20)'];
}
/* Все правила версии одним списком — для проверки полноты данных ДО разбора. */
function allRules(ver){
  return (ver.values || []).reduce((acc, v) => acc.concat(v.rules || []), []);
}
/* Провал дизъюнкции одной строкой не объяснить: перечисляются все альтернативы (ИК-7). */
function scopeWhy(scope, vals){
  /* У одной альтернативы подпись правила ничего не добавляет — она повторяет сам предикат.
     У нескольких она единственное, чем они различаются, и печатается. */
  return scope.length === 1
    ? (scope[0].preds || []).map(p => phrase(p, vals)).join(' и ')
    : 'не выполнено ни одно из правил входа — ' +
      scope.map((r, i) => '(' + (i + 1) + ') ' + ruleText(r, vals)).join('; ');
}

/* Результат: {ok, code, label, index, fired:[{norm,text}], why:[…]} либо отказ с причиной.
   Отказ никогда не молчит — у него есть текст (§0.3). */
CL.classifyWith = (ver, vals, sim) => {
  if(!ver) return {ok:false, why:['действующей версии нет — классификатор ничего не назначает']};
  /* sim=true — сухой прогон черновика (CL.dryRun): считает, но никому не назначает. ИК-1 цел:
     значение по-прежнему ставит только движок действующей редакции. */
  if(ver.status === 'черновик' && !sim) return {ok:false, draft:true, why:['версия в черновике — не классифицирует (ADR-0125)']};
  /* Область — такой же список правил, как у значения: правила через ИЛИ, предикаты внутри
     правила через И (ADR-0137 §3). Пустая область = все объекты типа, вход открыт всем. */
  const scope = ver.scope || [];
  /* Порядок проверок: данные области → область → данные значений → разбор.
     Показатели значений спрашиваются ТОЛЬКО у того, кто в область вошёл: «вне области» —
     дешёвый и законный исход (ИК-7), он не вправе требовать данных, до которых дела нет. */
  if(scope.length){
    const missScope = missingIn(scope, vals);
    if(missScope.length) return {ok:false, nodata:true, miss:missScope, why:noDataWhy(missScope, 'область')};
    if(!scope.some(r => ruleFires(r, vals)))
      return {ok:false, out:true, why:['вне области классификатора: ' + scopeWhy(scope, vals)]};
  }
  const miss = missingIn(allRules(ver), vals);
  if(miss.length) return {ok:false, nodata:true, miss, why:noDataWhy(miss, 'правило редакции')};
  for(let idx = 0; idx < ver.values.length; idx++){
    const v = ver.values[idx];
    /* Разбор останавливается на первом сработавшем ЗНАЧЕНИИ, но внутри значения проверяются
       ВСЕ правила и отдаются все сработавшие: снятие одной причины значения не двинет (ИК-11). */
    const fired = (v.rules || []).filter(r => ruleFires(r, vals));
    if(fired.length) return {ok:true, code:v.code, label:v.label, index:idx,
      fired: fired.map(r => ({norm:r.norm, label:r.label || '', text:ruleText(r, vals)})),
      why: fired.map(r => ruleText(r, vals) + ' — ' + r.norm)};
    if(v.dflt) return {ok:true, code:v.code, label:v.label, index:idx, fired:[],
      why:['ни одно правило выше не сработало — ' + (v.norm || 'значение по умолчанию')]};
  }
  return {ok:false, unclosed:true, why:['версия не замкнута: значения по умолчанию нет (ИК-3)']};
};
CL.classify = (clfId, objType, objId) => {
  const ver = CL.activeVer(clfId);
  const clf = CL.clf(clfId);
  /* Классификатор с прекращённым действием тоже не молчит: причина и дата названы (ИК-19, §0.3). */
  if(!ver && clf && clf.stopped)
    return {ok:false, stopped:true, why:['действие классификатора прекращено ' + fmt(clf.stopped.until) +
      ': ' + clf.stopped.reason + ' — записи закрытых периодов читаются по-прежнему (ИК-19)']};
  /* Классификатор, у которого есть только черновик, — законное состояние, а не поломка:
     он ничего не назначает и говорит об этом прямо (ADR-0125 §2, §0.3). */
  if(!ver && CL.draftVer(clfId))
    return {ok:false, draft:true, why:['действующей редакции нет — черновик значений не назначает (ADR-0125)']};
  return CL.classifyWith(ver, CL.valuesOf(objType, objId));
};

/* --------------------------- ШОВ ----------------------------------- *
 * Единственная дверь наружу (ADR-0124). На закрытую дату отдаёт ЗАПИСЬ ФИКСАЦИИ,
 * на открытую — значение функции; потребитель различия не знает (ИК-8).
 * ------------------------------------------------------------------- */
CL.valueAt = (clfId, objType, objId, dateISO) => {
  const date = dateISO || CL.state.today;
  if(CL.isClosed(date)){
    const rec = CL.state.records.find(r => r.period === ym(date) && r.clfId === clfId && r.objId === objId);
    return rec
      ? {source:'запись фиксации', ok:true, code:rec.code, label:rec.label, verNo:rec.verNo,
         why: rec.rules.map(c => c.text + ' — ' + c.norm), record:rec}
      : {source:'записи нет', ok:false,
         why:['за ' + monLabel(ym(date)) + ' записи по объекту нет — он был вне области либо период закрыт до его появления']};
  }
  const r = CL.classify(clfId, objType, objId);
  return Object.assign({source:'расчёт', verNo:(CL.activeVer(clfId) || {}).no}, r);
};
/* Имя шва из ADR-0124. Заёмщик своего значения не имеет ни в открытом периоде, ни в
   закрытом: и там и там это свёртка — по функции либо по записям того же периода
   (ADR-0121, ADR-0001 «производные не хранятся»). */
CL.riskCategory = (objType, objId, dateISO) => {
  const date = dateISO || CL.state.today;
  if(objType === 'заёмщик')
    return CL.isClosed(date) ? CL.foldFromRecords(objId, ym(date))
                             : Object.assign({source:'расчёт'}, CL.foldBorrower(objId));
  return CL.valueAt('risk', objType, objId, date);
};
CL.foldFromRecords = (inn, per) => {
  const ids = CL.state.credits.filter(c => c.inn === inn).map(c => c.id);
  const recs = CL.state.records.filter(r => r.period === per && r.clfId === 'risk' && ids.includes(r.objId));
  if(!recs.length) return {source:'записи нет', ok:false,
    why:['за ' + monLabel(per) + ' записей по кредитам заёмщика нет — в области классификатора их не было']};
  const verOf = no => CL.clf('risk').versions.find(v => v.no === no);
  /* Тяжесть сравнивается индексом внутри ТОЙ редакции, которой запись сделана; при
     несравнимых значениях свёртки нет и в прошлом (ИК-6). */
  const bad = recs.find(r => { const v = verOf(r.verNo); return !v || !v.comparable; });
  if(bad) return {source:'запись фиксации', ok:false, forbidden:true,
    why:['свёртка запрещена: редакция ' + bad.verNo + ' не объявила значения сравнимыми по тяжести (ИК-6)']};
  const idx = r => verOf(r.verNo).values.findIndex(x => x.code === r.code);
  const worst = recs.reduce((a, r) => idx(r) < idx(a) ? r : a, recs[0]);
  return {source:'запись фиксации', ok:true, code:worst.code, label:worst.label, verNo:worst.verNo,
    sourceCreditId:worst.objId, counted:recs.length,
    why: worst.rules.map(c => c.text + ' — ' + c.norm)};
};

/* Свёртка живёт в шве, а не в конструкторе: она знает схему («действующие кредиты
   заёмщика»), которой конструктор знать не должен (ADR-0126 §3). Признак сравнимости —
   разрешение, которое шов обязан проверить (ИК-6). */
CL.foldBorrower = inn => {
  const ver = CL.activeVer('risk');
  if(!ver) return {ok:false, why:['действующей версии риск-классификатора нет']};
  if(!ver.comparable) return {ok:false, forbidden:true,
    why:['свёртка запрещена: версия не объявила значения сравнимыми по тяжести (ИК-6)']};
  const mine = CL.state.credits.filter(c => c.inn === inn);
  const all = mine.map(c => ({credit:c, r:CL.classifyWith(ver, CL.indicatorsOfCredit(c))}));
  /* Худшее из неполного набора — не худшее. Один непосчитанный кредит запрещает свёртку
     целиком, иначе заёмщик получил бы категорию мягче настоящей (ИК-20). */
  const blind = all.filter(x => x.r.nodata);
  if(blind.length) return {ok:false, nodata:true,
    why:['свёртка невозможна: по кредиту ' + blind[0].credit.id + ' значения нет — ' + blind[0].r.why[0]]};
  const each = all.filter(x => x.r.ok);
  if(!each.length) return {ok:false, empty:true,
    why:['в области классификатора нет ни одного кредита заёмщика — категории нет (ИК-7)']};
  /* Порядок разбора при объявленной сравнимости идёт от тяжёлого, поэтому worst-of —
     это минимальный индекс значения. Отдельного ранга у значения нет (ADR-0126 §1–2). */
  const worst = each.reduce((a, x) => x.r.index < a.r.index ? x : a, each[0]);
  return {ok:true, code:worst.r.code, label:worst.r.label, sourceCreditId:worst.credit.id,
    counted:each.length, why:worst.r.why};
};

/* ------------- ПРОВЕРКА ПЕРЕД ПУБЛИКАЦИЕЙ (ИК-3…ИК-5, ИК-17) ------- *
 * Отказ списком и по делу: молчаливого отказа быть не может (§0.3).
 * ------------------------------------------------------------------- */
CL.publishChecks = (clfId, ver) => {
  const clf = CL.clf(clfId);
  const v = ver || CL.draftVer(clfId);
  const out = [];
  if(!v) return ['черновика нет — публиковать нечего'];
  if(!v.values.length) out.push('в версии нет ни одного значения');

  const dflts = v.values.filter(x => x.dflt);
  if(dflts.length !== 1) out.push('значений по умолчанию должно быть ровно одно, сейчас ' + dflts.length +
    ' — иначе часть объектов молча осталась бы без значения (ИК-3)');
  if(dflts.length === 1){
    const d = dflts[0];
    if(v.values.indexOf(d) !== v.values.length - 1)
      out.push('значение по умолчанию «' + d.label + '» должно замыкать список, сейчас оно ' +
        (v.values.indexOf(d) + 1) + '-е из ' + v.values.length + ' (ИК-3)');
    if((d.rules || []).length)
      out.push('у значения по умолчанию «' + d.label + '» есть правила — их быть не должно (ИК-3)');
  }
  v.values.forEach(x => {
    if(!x.dflt && !(x.rules || []).length)
      out.push('значение «' + x.label + '» недостижимо: правил нет, и значением по умолчанию оно не объявлено (ИК-17)');
    /* ИК-21: два правила одного значения с одним пунктом различает только подпись. Без неё
       объяснение назовёт «п. 11.3» дважды, и снявший фактор не поймёт, какое из двух снял. */
    const byNorm = {};
    (x.rules || []).forEach(r => { const k = r.norm || ''; byNorm[k] = (byNorm[k] || 0) + 1; });
    (x.rules || []).forEach(r => {
      if(!r.preds.length) out.push('правило ' + (r.norm || 'без пункта') + ' у значения «' + x.label + '» пустое');
      if(!r.norm) out.push('у правила значения «' + x.label + '» не указан пункт основания');
      else if(byNorm[r.norm] > 1 && !r.label)
        out.push('у значения «' + x.label + '» пункт ' + r.norm + ' назван ' + byNorm[r.norm] +
          ' раза — каждому такому правилу нужна подпись, иначе объяснение их не различит (ИК-21)');
      r.preds.forEach(p => out.push(...predProblems(p, clf, 'значения «' + x.label + '»')));
    });
  });
  /* Область проверяется теми же правилами, кроме пункта основания: вход — проектное решение
     редакции, а не цитата нормы, поэтому норма у правила области необязательна (ADR-0137 §3). */
  (v.scope || []).forEach(r => {
    if(!(r.preds || []).length) out.push('в области есть пустое правило — уберите его или допишите предикаты');
    (r.preds || []).forEach(p => out.push(...predProblems(p, clf, 'области')));
  });
  if(!v.basis) out.push('не указано основание версии — норма и её редакция (ADR-0125 §2)');
  if(!v.from) out.push('не указана дата ввода в действие');
  else if(v.from < CL.startOfOpen())
    out.push('дата ввода в действие ' + fmt(v.from) + ' раньше начала открытого периода ' +
      fmt(CL.startOfOpen()) + ' — закрытые периоды неприкосновенны (ИК-4)');
  /* Верхняя граница окна (ИК-4): публикация — немедленный ввод в действие. Дата вперёд
     означала бы четвёртый статус «утверждена, ждёт даты», которого в модели нет: сегодня
     «действующая» и «та, что классифицирует сейчас» — одно и то же. */
  else if(v.from > CL.state.today)
    out.push('дата ввода в действие ' + fmt(v.from) + ' в будущем — публикация вводит редакцию ' +
      'в действие немедленно, отложенного пуска в модели нет (ИК-4)');
  /* Нижняя граница окна — не только начало открытого периода, но и начало ДЕЙСТВУЮЩЕЙ
     редакции: публикация закрывает прошлую датой ввода новой (prev.until = d.from), и дата
     раньше дала бы отрицательный интервал действия, а дни между ними — две действующие
     редакции сразу. Запись фиксации после этого не смогла бы назвать свою редакцию (ИК-8,
     КФ-Д12). Проверять открытый период недостаточно: обе даты могут лежать внутри него. */
  const cur = CL.activeVer(clfId);
  if(v.from && cur && cur !== v && v.from <= cur.from)
    out.push('дата ввода в действие ' + fmt(v.from) + ' не позже начала действующей редакции ' +
      cur.no + ' от ' + fmt(cur.from) + ' — две редакции одновременно не действуют (ИК-22)');
  return out;
};
function predProblems(p, clf, where){
  const out = [];
  const pre = 'предикат ' + where + ': ';
  const ind = CL.ind(p.i);
  if(!ind){ out.push(pre + 'неизвестный показатель «' + p.i + '»'); return out; }
  if(ind.retired) out.push(pre + 'снятый показатель «' + ind.name + '» (ИК-5)');
  /* Правило кредита вправе читать показатели заёмщика; обратного чтения нет (ИК-15). */
  if(clf.object === 'заёмщик' && ind.obj === 'кредит')
    out.push(pre + 'читает показатель кредита «' + ind.name +
      '» — классификатор заёмщика вниз не смотрит (ИК-15)');
  const isSet = SET_OPS.indexOf(p.op) >= 0;
  if(isSet){
    /* ∈/∉ — сокращение цепочки «= a или = b», поэтому домен обязателен: у числа и булева
       перечислять нечего, а члены множества обязаны быть членами домена (ИК-5). */
    if(ind.type !== 'перечисление')
      out.push(pre + 'оператор ' + opWord(p.op) + ' применим только к показателю-перечислению, а «' +
        ind.name + '» — ' + ind.type);
    else {
      const set = p.set || [];
      if(!set.length) out.push(pre + 'у оператора ' + opWord(p.op) + ' пустой список значений — выберите хотя бы одно');
      set.forEach(x => { if(!(ind.domain || []).includes(x))
        out.push(pre + 'значение «' + shownVal(x) + '» не входит в домен показателя «' + ind.name + '» (ИК-5)'); });
      if(set.length && (ind.domain || []).length && set.length === (ind.domain || []).length)
        out.push(pre + opWord(p.op) + ' перечисляет весь домен показателя «' + ind.name +
          '» — такое правило либо всегда верно, либо всегда ложно');
    }
  } else {
    if(ind.type === 'перечисление' && !(ind.domain || []).includes(p.v))
      out.push(pre + 'значение «' + shownVal(p.v) + '» не входит в домен показателя «' + ind.name + '» (ИК-5)');
    if(ind.type === 'число' && !(typeof p.v === 'number' && isFinite(p.v)))
      out.push(pre + 'показатель «' + ind.name + '» числовой, а константа не число');
    if(ind.type === 'булево' && typeof p.v !== 'boolean')
      out.push(pre + 'показатель «' + ind.name + '» булев, а константа не «да/нет»');
  }
  if(ind.type !== 'число' && NUM_OPS.indexOf(p.op) >= 0)
    out.push(pre + 'оператор ' + p.op + ' применим только к числовому показателю');
  if(CL.opsFor(ind).indexOf(p.op) < 0)
    out.push(pre + 'оператор ' + opWord(p.op) + ' не разрешён для показателя «' + ind.name + '» (ИК-5)');
  return out;
}

/* ---------------------- ОБЪЕКТЫ КЛАССИФИКАТОРА ---------------------- *
 * Кредиты и заёмщики — зеркало соседних модулей: здесь они читаются и не редактируются
 * (ADR-0124, И-11).
 * ------------------------------------------------------------------- */
CL.objectsOf = clf => clf.object === 'кредит'
  ? CL.state.credits.map(c => ({type:'кредит', id:c.id}))
  : CL.state.borrowers.map(b => ({type:'заёмщик', id:b.inn}));

/* ------------- СУХОЙ ПРОГОН ЧЕРНОВИКА (предпросмотр публикации) ----- *
 * Публикация необратима: отменить редакцию можно только следующей редакцией (ИК-2). Значит,
 * последствия обязаны быть видны ДО неё — по каждому объекту «есть» против «стало бы».
 * ИК-1 при этом цел: прогон ничего не пишет, результат живёт только на экране, и значение
 * по-прежнему назначает лишь действующая редакция.
 * ------------------------------------------------------------------- */
CL.dryRun = clfId => {
  const clf = CL.clf(clfId);
  const draft = CL.draftVer(clfId);
  if(!draft) return {ok:false, why:'черновика нет — сравнивать не с чем'};
  const active = CL.activeVer(clfId);
  const rows = CL.objectsOf(clf).map(o => {
    const vals = CL.valuesOf(o.type, o.id);
    const was = active ? CL.classifyWith(active, vals)
                       : {ok:false, why:['действующей редакции нет — значения сейчас нет']};
    const will = CL.classifyWith(draft, vals, true);
    return {objId:o.id, objType:o.type, was, will,
      changed: (was.ok ? was.code : '∅') !== (will.ok ? will.code : '∅')};
  });
  return {ok:true, clfId, verNo:draft.no, baseNo: active ? active.no : null, rows,
    refusals: CL.publishChecks(clfId, draft),
    cnt:{ total:rows.length,
      changed: rows.filter(r => r.changed).length,
      inNow:   rows.filter(r => r.was.ok).length,
      inDraft: rows.filter(r => r.will.ok).length,
      lost:    rows.filter(r => r.was.ok && !r.will.ok).length,
      gained:  rows.filter(r => !r.was.ok && r.will.ok).length }};
};

/* -------------- ПРЕДПРОСМОТР ЗАКРЫТИЯ ПЕРИОДА ---------------------- *
 * Закрытие необратимо (ИК-13), поэтому до кнопки видно, что именно будет записано:
 * объектов в области · объектов вне области (это норма, ИК-7) · классификаторов без
 * действующей редакции. Последнее — единственный случай, когда за период вообще не будет
 * записи: в отчёте это «записи нет», а не «вне области», и различать их обязан модуль,
 * а не читатель отчёта.
 * ------------------------------------------------------------------- */
CL.closePreview = () => {
  const p = CL.openPeriod();
  if(!p) return {ok:false, why:'открытых периодов нет'};
  const asOf = first(nextM(p));
  const rows = CL.state.classifiers.map(clf => {
    const ver = CL.activeVer(clf.id);
    const total = CL.objectsOf(clf).length;
    if(!ver) return {clf:clf.name, verNo:null, total, willWrite:0, out:0, nodata:0, nodataWhy:'',
      why: clf.stopped
        ? 'действие прекращено ' + fmt(clf.stopped.until) + ' — записей за период не будет (ИК-19)'
        : 'действующей редакции нет — записей за период не будет (ADR-0125)'};
    const res = CL.objectsOf(clf).map(o => CL.classifyWith(ver, CL.valuesOf(o.type, o.id)));
    /* «Вне области» и «нет данных» считаются раздельно: первое — норма (ИК-7), второе —
       чужой долг, который кто-то обязан закрыть до закрытия периода (ИК-20). Одна графа
       на оба исхода прятала бы вторую за первой. */
    const nodata = res.filter(r => r.nodata);
    return {clf:clf.name, verNo:ver.no, total, why:null,
      willWrite: res.filter(r => r.ok).length,
      out:       res.filter(r => !r.ok && !r.nodata).length,
      nodata:    nodata.length,
      nodataWhy: nodata.length ? nodata[0].why[0] : ''};
  });
  return {ok:true, period:p, asOf, canClose: CL.state.today >= asOf, rows,
    willWrite: rows.reduce((s, r) => s + r.willWrite, 0),
    out:       rows.reduce((s, r) => s + r.out, 0),
    nodata:    rows.reduce((s, r) => s + (r.nodata || 0), 0),
    silent:    rows.filter(r => r.verNo === null).length};
};

/* --------------------- ОПЕРАЦИИ КОНСТРУКТОРА ------------------------ */
function guardDraft(clfId){
  if(!CL.canEditConstructor()) return 'править конструктор вправе только администратор классификации';
  const d = CL.draftVer(clfId);
  if(!d) return 'действующая версия не правится: заведите новую редакцию — она откроется черновиком (ИК-2)';
  return null;
}
/* ------------------- КЛАССИФИКАТОР: ЗАВЕСТИ И ОСТАНОВИТЬ ----------- *
 * Главное обещание модуля: четвёртая классификация появляется НАСТРОЙКОЙ, а не релизом
 * (ADR-0120). Значит, завести классификатор обязан уметь администратор — здесь, а не
 * миграцией. Удалить его нельзя: записи закрытых периодов ссылаются на его редакции и
 * обязаны остаться читаемыми, поэтому вместо удаления — прекращение действия (ИК-19).
 * ------------------------------------------------------------------- */
CL.addClassifier = spec => {
  if(!CL.canEditConstructor()) return {ok:false, why:'заводит классификаторы только администратор классификации'};
  const id = (spec.id || '').trim();
  if(!id || CL.clf(id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!(spec.name || '').trim()) return {ok:false, why:'у классификатора обязано быть наименование'};
  /* Объект задан у классификатора, а не у версии: сменить объект — значит завести другой,
     иначе прошлые записи фиксации потеряли бы смысл (спека §2.1). */
  if(!['кредит','заёмщик'].includes(spec.object)) return {ok:false, why:'объект классификации — «кредит» либо «заёмщик»'};
  CL.state.classifiers.push({id, name:spec.name.trim(), object:spec.object, versions:[
    {no:1, status:'черновик', basis:'', from:'', by:CL.state.role, at:null, until:null,
     comparable:false, scope:[], values:[]}
  ]});
  log('заведён классификатор «' + spec.name.trim() + '» (объект: ' + spec.object + '), редакция 1 — черновик');
  return {ok:true, id};
};
/* Прекращение действия — не удаление и не откат: действующая редакция закрывается датой из
   того же окна, что и ввод (ИК-4), классификатор перестаёт назначать значения, а записи
   закрытых периодов продолжают читаться по своим редакциям (ИК-8, ИК-19). */
CL.stopClassifier = (clfId, opts) => {
  if(!CL.canEditConstructor()) return {ok:false, why:'прекращает действие только администратор классификации'};
  const clf = CL.clf(clfId);
  if(!clf) return {ok:false, why:'классификатора нет'};
  const ver = CL.activeVer(clfId);
  if(!ver) return {ok:false, why:'действующей редакции нет — прекращать нечего'};
  const reason = ((opts || {}).reason || '').trim();
  if(!reason) return {ok:false, why:'прекращение действия без причины не принимается'};
  const until = (opts || {}).until || CL.state.today;
  if(until < CL.startOfOpen()) return {ok:false, why:'дата прекращения ' + fmt(until) +
    ' раньше начала открытого периода ' + fmt(CL.startOfOpen()) + ' — закрытые периоды неприкосновенны (ИК-4)'};
  if(until > CL.state.today) return {ok:false, why:'дата прекращения ' + fmt(until) + ' в будущем (ИК-4)'};
  ver.status = 'прошлая'; ver.until = until;
  clf.stopped = {until, reason, by:CL.state.role, at:CL.state.today};
  log('действие классификатора «' + clf.name + '» прекращено с ' + fmt(until) + ': ' + reason);
  return {ok:true, until};
};
CL.newDraft = clfId => {
  if(!CL.canEditConstructor()) return {ok:false, why:'править конструктор вправе только администратор классификации'};
  if(CL.draftVer(clfId)) return {ok:false, why:'черновик уже есть'};
  const clf = CL.clf(clfId);
  /* База копии — действующая редакция; у остановленного классификатора её нет, и черновик
     открывается копией последней по номеру: возобновление не начинается с чистого листа. */
  const base = CL.activeVer(clfId) ||
    clf.versions.slice().sort((a, b) => b.no - a.no)[0] || null;
  const copy = JSON.parse(JSON.stringify(base ? {scope:base.scope, values:base.values, comparable:base.comparable} : {scope:[], values:[], comparable:false}));
  const no = Math.max(0, ...clf.versions.map(v => v.no)) + 1;
  clf.versions.push({no, status:'черновик', basis:'', from:'', by:CL.state.role, at:null, until:null,
    comparable:copy.comparable, scope:copy.scope, values:copy.values});
  log('заведена редакция ' + no + ' классификатора «' + clf.name + '» (черновик)');
  return {ok:true, no};
};
CL.publish = (clfId, opts) => {
  const d = CL.draftVer(clfId);
  if(!CL.canEditConstructor()) return {ok:false, refusals:['публикует только администратор классификации']};
  if(!d) return {ok:false, refusals:['черновика нет']};
  if(opts && opts.basis !== undefined) d.basis = opts.basis;
  if(opts && opts.from !== undefined) d.from = opts.from;
  const refusals = CL.publishChecks(clfId, d);
  if(refusals.length) return {ok:false, refusals};
  const prev = CL.activeVer(clfId);
  if(prev){ prev.status = 'прошлая'; prev.until = d.from; }
  /* Публикация возобновляет остановленный классификатор: отметка о прекращении снимается,
     но её след остаётся в журнале действий (ИК-19). */
  if(CL.clf(clfId).stopped) delete CL.clf(clfId).stopped;
  d.status = 'действующая';
  d.by = CL.state.role;
  d.at = CL.state.today;
  log('опубликована редакция ' + d.no + ' классификатора «' + CL.clf(clfId).name + '» с ' + fmt(d.from));
  return {ok:true, no:d.no};
};
/* Основание и дата ввода — реквизиты черновика, а не аргументы публикации: пока они писались
   только внутри publish(), в черновике они оставались пустыми, список отказов держал «не указано
   основание» и «не указана дата ввода», кнопка от этого гасла — и черновик было не опубликовать
   вовсе (КФ-Д6). Пишем их при вводе, как любую другую правку черновика. */
CL.setVerMeta = (clfId, patch) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  if(patch.basis !== undefined) d.basis = patch.basis;
  if(patch.from !== undefined) d.from = patch.from;
  return {ok:true};
};
CL.addValue = (clfId, label) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  let n = d.values.length + 1, code = 'v' + n;
  while(d.values.some(v => v.code === code)) code = 'v' + (++n);
  /* Новое значение встаёт ПЕРЕД значением по умолчанию: замыкающее остаётся последним (ИК-3). */
  const at = d.values.findIndex(v => v.dflt);
  const val = {code, label:label || 'Без названия', rules:[]};
  if(at === -1) d.values.push(val); else d.values.splice(at, 0, val);
  return {ok:true, code};
};
CL.removeValue = (clfId, code) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  d.values = d.values.filter(v => v.code !== code);
  return {ok:true};
};
CL.moveValue = (clfId, code, dir) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  const i = d.values.findIndex(v => v.code === code);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= d.values.length) return {ok:false, why:'двигать некуда'};
  const t = d.values[i]; d.values[i] = d.values[j]; d.values[j] = t;
  return {ok:true};
};
CL.setDefault = (clfId, code) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const d = CL.draftVer(clfId);
  d.values.forEach(v => { delete v.dflt; });
  const v = d.values.find(x => x.code === code);
  if(!v) return {ok:false, why:'значения нет'};
  v.dflt = true; v.rules = [];
  /* Значение по умолчанию замыкает список — переставляем сразу, чтобы отказ не всплыл при публикации. */
  d.values = d.values.filter(x => x.code !== code).concat([v]);
  return {ok:true};
};
CL.setComparable = (clfId, on) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  CL.draftVer(clfId).comparable = !!on;
  return {ok:true};
};
/* Область и значение правятся ОДНИМИ мутациями: список правил у них устроен одинаково,
   и второй редактор разошёлся бы с первым на первой же правке (ADR-0137 §3, КФ-Д8).
   Псевдо-код '@scope' адресует область той же парой (clfId, code), что и значение. */
CL.SCOPE = '@scope';
function rulesOf(clfId, code){
  const d = CL.draftVer(clfId);
  if(!d) return null;
  if(code === CL.SCOPE){ if(!d.scope) d.scope = []; return d.scope; }
  const v = d.values.find(x => x.code === code);
  return v ? (v.rules || (v.rules = [])) : null;
}
CL.rulesOf = rulesOf;
CL.addRule = (clfId, code, norm) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  if(code !== CL.SCOPE){
    const v = CL.draftVer(clfId).values.find(x => x.code === code);
    if(!v) return {ok:false, why:'значения нет'};
    if(v.dflt) return {ok:false, why:'у значения по умолчанию правил быть не может (ИК-3)'};
  }
  const rules = rulesOf(clfId, code);
  rules.push({norm:norm || '', label:'', preds:[]});
  return {ok:true, index:rules.length - 1};
};
CL.removeRule = (clfId, code, ri) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code).splice(ri, 1);
  return {ok:true};
};
CL.setRuleNorm = (clfId, code, ri, norm) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].norm = norm;
  return {ok:true};
};
/* Подпись правила едет тем же маршрутом, что и норма: объяснение → запись фиксации →
   отчёт п. 12. Обязательна только при повторе пункта внутри значения (ИК-21). */
CL.setRuleLabel = (clfId, code, ri, label) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].label = label;
  return {ok:true};
};
/* Предикат добавляется только выбором из реестра: свободных формул в конструкторе нет (ADR-0120). */
CL.addPred = (clfId, code, ri) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const clf = CL.clf(clfId);
  const ind = CL.state.indicators.find(i => !i.retired && CL.readable(clf.object, i.obj));
  if(!ind) return {ok:false, why:'в реестре нет доступного показателя'};
  rulesOf(clfId, code)[ri].preds.push(defaultPred(ind));
  return {ok:true};
};
CL.removePred = (clfId, code, ri, pi) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  rulesOf(clfId, code)[ri].preds.splice(pi, 1);
  return {ok:true};
};
CL.setPred = (clfId, code, ri, pi, field, raw) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const p = rulesOf(clfId, code)[ri].preds[pi];
  if(field === 'i'){ const ind = CL.ind(raw); Object.assign(p, defaultPred(ind)); delete p.set; }
  else if(field === 'op'){
    const wasSet = SET_OPS.indexOf(p.op) >= 0, nowSet = SET_OPS.indexOf(raw) >= 0;
    p.op = raw;
    /* Переключение скаляр↔множество не теряет уже выбранное: '= высокий' становится
       'одно из: высокий', и наоборот берётся первый член списка. Молчаливое обнуление
       правой части выглядело бы как сбой формы. */
    if(nowSet && !wasSet){ p.set = p.v === undefined ? [] : [p.v]; delete p.v; }
    if(!nowSet && wasSet){ p.v = (p.set || [])[0]; delete p.set; if(p.v === undefined) Object.assign(p, defaultPred(CL.ind(p.i)), {op:raw}); }
  }
  else {
    const ind = CL.ind(p.i);
    p.v = ind.type === 'число' ? Number(raw) : ind.type === 'булево' ? (raw === 'да' || raw === true) : raw;
  }
  return {ok:true};
};
/* Член множества добавляется и снимается по одному: список — это набор членов домена,
   свободного ввода у него нет (ИК-5). */
CL.togglePredMember = (clfId, code, ri, pi, member, on) => {
  const bad = guardDraft(clfId); if(bad) return {ok:false, why:bad};
  const p = rulesOf(clfId, code)[ri].preds[pi];
  const set = p.set || (p.set = []);
  const at = set.indexOf(member);
  if(on && at < 0) set.push(member);
  if(!on && at >= 0) set.splice(at, 1);
  return {ok:true};
};
function defaultPred(ind){
  if(ind.type === 'число')  return {i:ind.id, op:'≥', v:0};
  if(ind.type === 'булево') return {i:ind.id, op:'=', v:true};
  return {i:ind.id, op:'=', v:(ind.domain || [''])[0]};
}
/* ИК-15: классификатор кредита читает и свои показатели, и показатели заёмщика; обратно — нет. */
CL.readable = (clfObject, indObject) => clfObject === 'кредит' ? true : indObject === 'заёмщик';
/* Набор операторов задаёт тип показателя. Строгие > и < добавлены потому, что Порядок
   пишет «свыше 180» и «более 50 000 000»: пересчёт в ≥ 181 верен для целых дней и неверен
   для сомов с копейками, а переводить норму в голове — источник ошибки (ADR-0137 §2). */
CL.opsFor = ind => ind.type === 'число'       ? ['>','≥','<','≤','=','≠']
                 : ind.type === 'перечисление' ? ['=','≠','∈','∉']
                 :                               ['=','≠'];

/* ------------------- РЕЕСТР ПОКАЗАТЕЛЕЙ ---------------------------- */
CL.usedBy = indId => {
  const hits = [];
  CL.state.classifiers.forEach(c => c.versions.forEach(v => {
    if(v.status === 'прошлая') return;
    const inScope = (v.scope || []).some(p => p.i === indId);
    const inRules = v.values.some(val => (val.rules || []).some(r => r.preds.some(p => p.i === indId)));
    if(inScope || inRules) hits.push({clf:c.name, verNo:v.no, status:v.status, where:inScope ? 'область' : 'правило'});
  }));
  return hits;
};
CL.retireIndicator = id => {
  if(!CL.canEditConstructor()) return {ok:false, why:'снимает показатели только администратор классификации'};
  const ind = CL.ind(id);
  if(!ind) return {ok:false, why:'показателя нет'};
  if(ind.retired) return {ok:false, why:'уже снят'};
  /* ИК-16: показатель, на который ссылается живая версия, с реестра не снимается —
     иначе действующее правило осталось бы без входа, и отказ был бы молчаливым. */
  const used = CL.usedBy(id).filter(u => u.status === 'действующая');
  if(used.length) return {ok:false, why:'показатель используется: ' +
    used.map(u => u.clf + ', редакция ' + u.verNo + ' (' + u.where + ')').join('; ') + ' (ИК-16)'};
  ind.retired = true;
  log('показатель «' + ind.name + '» снят с реестра');
  return {ok:true};
};
CL.addIndicator = spec => {
  if(!CL.canEditConstructor()) return {ok:false, why:'заводит показатели только администратор классификации'};
  if(!spec.id || CL.ind(spec.id)) return {ok:false, why:'идентификатор пуст или занят'};
  if(!spec.owner) return {ok:false, why:'у показателя обязан быть владелец — он и считает значение (ADR-0120 §2)'};
  /* Домен — часть заведения перечисления, а не то, что дописывается потом: предикат сравнивает
     значение с ЧЛЕНОМ домена (ИК-5), и показатель без домена дал бы правило, которое не с чем
     сверить. Пока домен подставлялся кодом, заведённое с экрана перечисление вставало в реестр
     булевым под чужим типом (КФ-Д13). */
  const type = spec.type || 'булево';
  const dom = (spec.domain || []).map(d => String(d).trim()).filter(Boolean);
  const uniq = dom.filter((d, i) => dom.indexOf(d) === i);
  if(type === 'перечисление'){
    if(uniq.length < 2) return {ok:false, why:'у перечисления обязан быть домен — не меньше двух членов: предикат сравнивает значение с членом домена, а не со свободной строкой (ИК-5)'};
    if(uniq.length !== dom.length) return {ok:false, why:'члены домена повторяются — домен перечисления состоит из различных значений'};
  } else if(dom.length) return {ok:false, why:'домен бывает только у перечисления: у типа «' + type + '» сравнивать не с чем'};
  CL.state.indicators.push({id:spec.id, name:spec.name || spec.id, obj:spec.obj || 'кредит',
    type, domain: type === 'перечисление' ? uniq : null, src:spec.src || 'расчёт',
    owner:spec.owner, retired:false, note:spec.note || ''});
  log('заведён показатель «' + (spec.name || spec.id) + '» (владелец — ' + spec.owner + ')');
  return {ok:true};
};

/* ---------------------- ФАКТЫ (ADR-0122) --------------------------- */
CL.addFact = spec => {
  if(!CL.canEnterFacts()) return {ok:false, why:'наблюдатель факты не вводит'};
  if(!CL.credit(spec.creditId)) return {ok:false, why:'кредита нет'};
  if(!KIND(spec.kindId)) return {ok:false, why:'вид фактора не выбран'};
  if(!spec.occurred) return {ok:false, why:'не указана дата наступления'};
  if(spec.occurred > CL.state.today) return {ok:false, why:'дата наступления в будущем'};
  /* ИК-9: факт, наступивший в закрытом периоде, влияет на значение с начала открытого.
     Прошлое не переписывается, но и факт не теряется — в реестре стоят обе даты. */
  const counted = CL.isClosed(spec.occurred) ? CL.startOfOpen() : spec.occurred;
  const id = 'F-' + String(CL.state.facts.length + 1).padStart(3, '0');
  CL.state.facts.push({id, creditId:spec.creditId, kindId:spec.kindId, occurred:spec.occurred,
    counted, until:spec.until || null, doc:spec.doc || null, by:CL.state.role, annulled:null});
  log('заведён факт ' + id + ' по ' + spec.creditId + ' — ' + KIND(spec.kindId).name +
      (counted !== spec.occurred ? ' (учтён с ' + fmt(counted) + ')' : ''));
  return {ok:true, id, counted};
};
/* Корректировка не удаляет факт и не трогает закрытые периоды: они пересчёту не подлежат
   (ADR-0122 решение 5, ИК-8). */
CL.annulFact = (id, reason) => {
  if(!CL.canEnterFacts()) return {ok:false, why:'наблюдатель факты не правит'};
  const f = CL.state.facts.find(x => x.id === id);
  if(!f) return {ok:false, why:'факта нет'};
  if(f.annulled) return {ok:false, why:'уже аннулирован'};
  if(!reason) return {ok:false, why:'аннулирование без причины не принимается'};
  f.annulled = {reason, by:CL.state.role, at:CL.state.today};
  log('факт ' + id + ' аннулирован: ' + reason);
  return {ok:true};
};
/* Судьба факта. Список причин закрытый — по нему фильтруют и считают (ИК-12). */
CL.factFate = (f, chosenCode, ver) => {
  if(f.annulled) return 'аннулирован';
  if(!f.doc) return 'не засчитан: нет решения комитета';
  if(f.until && f.until < CL.state.today) return 'не засчитан: интервал истёк';
  const v = ver || CL.activeVer('risk');
  if(v && v.comparable && chosenCode){
    const own = valueIndexByFactorLevel(v, KIND(f.kindId).level);
    const chosen = v.values.findIndex(x => x.code === chosenCode);
    if(own > -1 && chosen > -1 && own > chosen) return 'не засчитан: ведёт к более лёгкому значению, чем выбранное';
  }
  return 'засчитан';
};
/* Какое значение дал бы фактор сам по себе — берётся из правил версии, не из таблицы рангов. */
function valueIndexByFactorLevel(ver, level){
  return ver.values.findIndex(v => (v.rules || []).some(r =>
    r.preds.some(p => p.i === 'factorLevel' && p.op === '=' && p.v === level)));
}
/* Судьба факта в РЕЕСТРЕ считается против значения, которое кредит имеет сейчас: иначе
   третья причина закрытого списка («ведёт к более лёгкому значению, чем выбранное») видна
   только на витрине, и ИК-12 держится наполовину. */
CL.fateOf = f => {
  const r = CL.classify('risk', 'кредит', f.creditId);
  return CL.factFate(f, r.ok ? r.code : null);
};
/* Список закрыт ровно затем, чтобы по нему фильтровали и считали (ИК-12): «сколько фактов
   не сыграло без решения комитета» — рабочий вопрос куратора, а не чтение глазами. */
CL.FATES = ['засчитан',
  'не засчитан: нет решения комитета',
  'не засчитан: интервал истёк',
  'не засчитан: ведёт к более лёгкому значению, чем выбранное',
  'аннулирован'];
CL.factCounts = () => {
  const out = {всего: CL.state.facts.length};
  CL.FATES.forEach(k => { out[k] = 0; });
  CL.state.facts.forEach(f => { const k = CL.fateOf(f); out[k] = (out[k] || 0) + 1; });
  return out;
};

/* ---------- ЗАКРЫТИЕ ПЕРИОДА И ФИКСАЦИЯ (ADR-0123) ----------------- */
CL.closePeriod = () => {
  if(!CL.canClosePeriod()) return {ok:false, why:'период закрывает администратор классификации'};
  const p = CL.openPeriod();
  if(!p) return {ok:false, why:'открытых периодов нет'};
  const asOf = first(nextM(p));
  /* ИК-13: закрывать можно только после окончания месяца и только самый ранний открытый. */
  if(CL.state.today < asOf) return {ok:false, why:'период ' + monLabel(p) +
    ' ещё не завершён: закрытие возможно с ' + fmt(asOf)};
  const written = [];
  CL.state.classifiers.forEach(clf => {
    const ver = CL.activeVer(clf.id);
    if(!ver) return;
    CL.objectsOf(clf).forEach(o => {
      const r = CL.classifyWith(ver, CL.valuesOf(o.type, o.id));
      /* ИК-7: вне области запись не пишется вовсе — закрытие дешевеет ровно на такие объекты. */
      if(!r.ok) return;
      CL.state.records.push({period:p, clfId:clf.id, verNo:ver.no, objType:o.type, objId:o.id,
        code:r.code, label:r.label, by:CL.state.role, at:CL.state.today, asOf,
        rules:(r.fired.length ? r.fired : [{norm:'по умолчанию', text:r.why[0]}]),
        factIds: o.type === 'кредит' ? CL.countedFacts(o.id).map(f => f.id) : []});
      written.push(o.id);
    });
  });
  CL.state.closedPeriods.push(p);
  CL.state.periodMeta[p] = {by:CL.state.role, at:CL.state.today};
  log('период ' + monLabel(p) + ' закрыт, записей фиксации: ' + written.length);
  return {ok:true, period:p, written:written.length, asOf};
};
/* Отчёт п. 12: по состоянию на 1-е число, не позднее 15-го. Просрочка — предупреждение,
   период она не запирает (ИК-14). */
CL.report12 = periodId => {
  const p = periodId || CL.state.closedPeriods[CL.state.closedPeriods.length - 1];
  const meta = CL.state.periodMeta[p] || {};
  const recs = CL.state.records.filter(r => r.period === p && r.clfId === 'risk');
  const ver = CL.activeVer('risk');
  const order = (ver ? ver.values : []).map(v => ({code:v.code, label:v.label}));
  const rows = order.map(o => ({code:o.code, label:o.label, count:recs.filter(r => r.code === o.code).length}));
  const other = recs.filter(r => !order.some(o => o.code === r.code));
  if(other.length) rows.push({code:'—', label:'значения прежних редакций', count:other.length});
  const deadline = day15(nextM(p));
  const late = meta.at ? meta.at > deadline : CL.state.today > deadline;
  return {period:p, asOf:first(nextM(p)), deadline, late, closedAt:meta.at || null, by:meta.by || null,
    total:recs.length, rows,
    lateBy: late && meta.at ? daysBetween(deadline, meta.at) : 0};
};

function log(msg){ CL.state.log.unshift({at:CL.state.today, who:CL.state.role, msg}); }

/* ===================================================================== *
 *                              ЭКРАНЫ
 * ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const $ = s => (typeof document === 'undefined' ? null : document.querySelector(s));
const pillFor = code => code === 'high' ? 'err' : code === 'mid' ? 'warn' : code === 'low' ? 'ok' : 'neutral';

/* Переход по разделу всегда возвращает к списку: боковое меню называет раздел, а не
   последний открытый объект. */
CL.go = v => { const st = CL.state; st.view = v; st.curClf = null; st.curInd = null; render(); };
CL.open = id => { const st = CL.state; st.curClf = id; st.clfVer = null; st.clfTab = 'values'; render(); };
CL.openInd = id => { CL.state.curInd = id; render(); };
CL.back = () => { const st = CL.state; if(st.view === 'ind') st.curInd = null; else st.curClf = null; render(); };
CL.tab = k => { CL.state.clfTab = k; render(); };
CL.showVer = no => { CL.state.clfVer = no; render(); };
CL.toggleNotes = () => { CL.state.notes = !CL.state.notes; render(); };
CL.setRole = r => { CL.state.role = r; render(); };
CL.setAsOf = d => { CL.state.asOf = d; render(); };

const TITLES = {clf:'Классификаторы', ind:'Реестр показателей', facts:'Факты (п. 11)',
  show:'Витрина результата', per:'Периоды и фиксация'};

/* Разметка панели собирается отдельно от её вставки в DOM: смоук вызывает panelHtml()
   без браузера и проверяет ровно то, что увидит человек (роль, вкладки, фильтры). */
function deepName(){
  const st = CL.state;
  if(st.view === 'clf' && st.curClf) return (CL.clf(st.curClf) || {}).name || '';
  if(st.view === 'ind' && st.curInd) return (CL.ind(st.curInd) || {}).name || '';
  return '';
}
function panelHtml(){
  const st = CL.state;
  return st.view === 'clf'  ? viewClassifiers() :
         st.view === 'ind'  ? viewIndicators()  :
         st.view === 'facts'? viewFacts()       :
         st.view === 'show' ? viewShowcase()    : viewPeriods();
}
CL.panelHtml = panelHtml;
CL.deepName = deepName;

function render(){
  if(typeof document === 'undefined') return;   // без DOM рисовать нечего (смоук)
  const st = CL.state;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.v === st.view));
  const deep = deepName();
  const title = $('#title');
  title.textContent = TITLES[st.view];
  title.className = 'crumb-title' + (deep ? ' link' : '');
  title.onclick = deep ? CL.back : null;
  $('#crumb').textContent = deep ? '/ ' + deep : '';
  const nb = $('#notesBtn');
  nb.textContent = 'Пояснения: ' + (st.notes ? 'вкл' : 'выкл');
  nb.className = 'tgl' + (st.notes ? ' on' : '');
  const sel = $('#role');
  sel.innerHTML = ROLES.map(r => `<option${r === st.role ? ' selected' : ''}>${esc(r)}</option>`).join('');
  const dates = [first('2026-06'), first('2026-07'), st.today];
  $('#asOf').innerHTML = dates.map(d => `<option value="${d}"${d === st.asOf ? ' selected' : ''}>${fmt(d)} · ${
    CL.isClosed(d) ? 'закрытый период' : 'открытый период'}</option>`).join('');
  $('#foot').innerHTML = `Учётный период <b>${monLabel(CL.openPeriod() || '—')}</b> — открыт.<br>
    Сегодня ${fmt(st.today)}. Закрыто: ${st.closedPeriods.map(monLabel).join(', ') || '—'}.`;
  const panel = $('#panel');
  panel.className = 'panel-wrap' + (st.notes ? '' : ' notes-off');
  panel.innerHTML = panelHtml();
}
CL.render = render;

function toast(msg, kind){
  if(typeof document === 'undefined') return;
  const w = document.getElementById('toastWrap'); if(!w) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg; w.appendChild(t);
  setTimeout(() => t.remove(), 5200);
}
function act(res, okMsg){
  if(res && res.ok){ if(okMsg) toast(okMsg, 'ok'); }
  else toast((res && (res.why || (res.refusals || [])[0])) || 'отказано', 'err');
  render();
}
/* Правка ТЕКСТОВОГО поля идёт без перерисовки панели. Поля висели на onchange, а act() менял
   #panel целиком: mousedown по соседней кнопке уводил фокус → change → перерисовка → mouseup
   приходил уже на новый узел, и первое нажатие пропадало (КФ-Д9). Отказ всё равно называется —
   тостом, без перерисовки. Экран догоняет состояние при следующей отрисовке: пункт основания и
   подпись правила ни счётчиков, ни связок не двигают. */
CL.quiet = res => {
  if(!(res && res.ok)) toast((res && (res.why || (res.refusals || [])[0])) || 'отказано', 'err');
  return res;
};
/* Отказ модального окна печатается ВНУТРИ окна, а не тостом за затемнением (КФ-Д10), и окно
   при отказе не перерисовывается — набранное в полях остаётся на месте (родня КФ-Д11). */
function modalErr(msg){
  if(typeof document === 'undefined') return;
  const el = document.getElementById('modalErr');
  if(!el) return toast(msg, 'err');
  el.innerHTML = '<div class="banner danger">' + esc(msg) + '</div>';
}
function modalAct(res, okMsg){
  if(res && res.ok){ closeModal(); if(okMsg) toast(okMsg, 'ok'); render(); return true; }
  modalErr((res && (res.why || (res.refusals || [])[0])) || 'отказано');
  return false;
}
/* Модалка вместо prompt()/confirm(): модальные окна браузера блокируют страницу целиком и
   в дизайн-системе АСУБК не используются ни в одном макете. */
function openModal(html){
  if(typeof document === 'undefined') return;
  const h = document.getElementById('modalHost');
  h.innerHTML = '<div class="modal">' + html + '</div>';
  h.classList.add('open');
}
function closeModal(){
  if(typeof document === 'undefined') return;
  const h = document.getElementById('modalHost');
  h.classList.remove('open'); h.innerHTML = '';
}

/* ------------------------ ЭКРАН: КЛАССИФИКАТОРЫ --------------------- */
function verPill(v){
  return v.status === 'действующая' ? '<span class="pill ok">действующая</span>'
       : v.status === 'черновик'    ? '<span class="pill warn">черновик</span>'
                                    : '<span class="pill neutral">прошлая</span>';
}
function predHtml(clfId, code, ri, pi, p, editable){
  const clf = CL.clf(clfId);
  const ind = CL.ind(p.i) || {name:p.i, type:'—', domain:[]};
  const isSet = SET_OPS.indexOf(p.op) >= 0;
  if(!editable){
    return `<span class="pred"><code class="mono">${esc(ind.name)}</code> ${esc(opWord(p.op))}
      <code class="mono">${esc(constOf(p))}</code></span>`;
  }
  const inds = CL.state.indicators.filter(i => (!i.retired || i.id === p.i) && CL.readable(clf.object, i.obj));
  const opts = inds.map(i => `<option value="${i.id}"${i.id === p.i ? ' selected' : ''}>${esc(i.name)}${i.retired ? ' (снят)' : ''}</option>`).join('');
  const ops = CL.opsFor(ind).map(o => `<option value="${o}"${o === p.op ? ' selected' : ''}>${o === '∈' ? '∈ одно из' : o === '∉' ? '∉ ни одно из' : o}</option>`).join('');
  const set = p.set || [];
  const val = isSet
    /* Флажки по домену, а не поле ввода: набор членов домена нельзя опечатать (ИК-5). */
    ? `<span class="setbox">${(ind.domain || []).map(d =>
        `<label><input type="checkbox"${set.indexOf(d) >= 0 ? ' checked' : ''}
           onchange="act(CL.togglePredMember('${clfId}','${code}',${ri},${pi},${esc(JSON.stringify(d))},this.checked))">${esc(d)}</label>`
        ).join('') || '<span class="setflat">у показателя нет домена</span>'}</span>`
    : ind.type === 'число'
    ? `<input type="number" style="width:110px" value="${esc(p.v)}" oninput="CL.quiet(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">`
    : ind.type === 'булево'
    ? `<select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">
         <option${p.v === true ? ' selected' : ''}>да</option><option${p.v === false ? ' selected' : ''}>нет</option></select>`
    : `<select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'v',this.value))">${
        (ind.domain || []).map(d => `<option${d === p.v ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select>`;
  return `<span class="pred">
    <select onchange="act(CL.setPred('${clfId}','${code}',${ri},${pi},'i',this.value))">${opts}</select>
