<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задания · АСУБК</title>
<!--
  АСУБК · модуль «Задания» · макет.
  Логика и решения — ASUBK-zadaniya-logika.md, история волн — ASUBK-status-razrabotki.md.
  Движок window.ZD проверяется смоуком: node scripts/inspect/zadaniya-check.mjs
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-green-hover:#106A36; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:290px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 10px; cursor:pointer; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; max-width:1180px; }
.view{ display:none; } .view.active{ display:block; }
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.drawer-mask{ position:fixed; inset:0; background:rgba(24,39,57,0.28); z-index:40; }
.drawer{ position:fixed; top:0; right:0; height:100vh; width:min(860px,92vw); z-index:41;
  background:var(--surface-page); border-left:1px solid var(--border-default);
  box-shadow:-10px 0 30px rgba(24,39,57,0.18); display:flex; flex-direction:column; }
.drawer-h{ flex:none; display:flex; align-items:center; gap:12px; padding:14px 20px;
  border-bottom:1px solid var(--border-default); background:var(--surface-card); }
.drawer-h h3{ margin:0; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.drawer-x{ margin-left:auto; background:none; border:none; cursor:pointer; font-size:18px;
  line-height:1; color:var(--text-muted); padding:2px 6px; }
.drawer-x:hover{ color:var(--text-body); }
.drawer-b{ flex:1; overflow:auto; padding:16px 20px 40px; }
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-secondary.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-blue); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:flex-end; }
.rolebar{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.rolebar button{ display:inline-flex; align-items:center; gap:7px; padding:5px 12px;
  border:1px solid var(--border-default); border-radius:var(--radius-pill);
  background:var(--surface-card); color:var(--text-body);
  font:var(--weight-medium) 12.5px/1.5 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.rolebar button:hover{ background:var(--surface-hover); }
.rolebar button.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint);
  color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.rolebar .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.rolebar .dot.warn{ background:var(--asubk-amber); }
.rolebar .dot.err{ background:var(--asubk-red); }
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.hole td{ background:var(--asubk-gray-50); }
table.cgrid tbody tr.over td{ background:var(--status-error-bg); }
table.cgrid tbody tr.sub td{ background:var(--surface-panel); }
table.cgrid select{ height:30px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 8px; max-width:280px; }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b, .small em{ color:var(--text-body); font-style:normal; font-weight:var(--weight-medium); }
.linky{ background:none; border:none; padding:0; cursor:pointer; color:var(--text-link);
  font:var(--font-label); text-decoration:underline; }
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card > h3 .small{ font-weight:var(--weight-regular); }
.card-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 10px; }
.card-head h3{ margin:0; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.card-head > .btn{ margin-left:auto; }
.kv{ display:grid; grid-template-columns:210px 1fr; gap:6px 14px; font:var(--font-label); }
.kv .k{ color:var(--text-muted); } .kv .v{ color:var(--text-body); }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:var(--radius-pill);
  background:var(--asubk-tint-fill); font:var(--weight-medium) 12px/1.7 var(--asubk-font);
  color:var(--text-body); margin-right:6px; }
.chip button{ background:none; border:none; cursor:pointer; color:var(--text-muted); padding:0; font-size:12px; }
.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input, .fld textarea{ border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:6px 10px; min-width:210px; }
.fld select, .fld input{ height:var(--control-h); }
.form-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border-default); margin-bottom:14px; }
.tabs button{ background:none; border:none; padding:8px 14px; cursor:pointer; font:var(--font-label);
  color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; }
.tabs button.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
#toastWrap{ position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);
  font:var(--font-label); max-width:460px; box-shadow:0 6px 20px rgba(24,39,57,0.25); }
.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Задания</small></div>
    <div class="nav">
      <div class="nav-sec">Работа</div>
      <button class="nav-item" data-v="queue" onclick="ZD.go('queue')">Очередь заданий<span class="cnt" id="qCnt"></span></button>
      <div class="nav-sec">Настройка</div>
      <button class="nav-item" data-v="settings" onclick="ZD.go('settings')">Виды повода · действия · правила</button>
      <button class="nav-item" data-v="runs" onclick="ZD.go('runs')">Журнал прогонов<span class="cnt" id="rCnt"></span></button>
    </div>
  </aside>

  <div class="main">

      <div class="crumb-title" id="title">Очередь заданий</div>

        <span><label>Дата среза</label><select id="asOf" onchange="ZD.setAsOf(this.value)"></select></span>
        <span><label>Смотрю как</label><select id="viewer" onchange="ZD.setViewer(this.value)"></select></span>
        <span><button class="btn btn-secondary btn-sm" onclick="ZD.go('notif')">🔔 Уведомления <span id="nCnt"></span></button></span>

    <div class="content"><div class="panel-wrap" id="panel"></div></div>
  </div>
</div>
<div id="toastWrap"></div>

<script>
/* =====================================================================
   ZD — движок модуля «Задания».
   Журналы (task.journal, povod.journal) — только дозапись; состояние
   выводится чтением последней записи, отдельным полем не хранится.
   ===================================================================== */
window.ZD = (function(){

/* ---------- 0. учебный мок оргструктуры ---------- */
const EMP = [
  {id:'E1', name:'Есенова А.Т.',      role:'специалист',              dept:'Сопровождение', chief:'E2'},
  {id:'E2', name:'Токтогулов Б.С.',   role:'заведующий отделом',      dept:'Сопровождение', chief:'E4'},
  {id:'E3', name:'Нурланова Ж.К.',    role:'специалист',              dept:'Сопровождение', chief:'E2'},
  {id:'E4', name:'Абдразакова С.М.',  role:'администратор модуля',    dept:'Администрирование', chief:null},
  {id:'E5', name:'Садыков Р.И.',      role:'заведующий отделом',      dept:'Взыскание',     chief:'E4'},
];
function emp(id){ return EMP.find(e=>e.id===id); }
function chiefOf(id){ const e=emp(id); return e && e.chief; }
function chiefChainIncludes(empId, targetChief){
  let cur = emp(empId);
  while(cur && cur.chief){ if(cur.chief===targetChief) return true; cur = emp(cur.chief); }
  return false;
}
function subordinatesOf(id){ return EMP.filter(e=>chiefChainIncludes(e.id,id)); }

/* ---------- 0а. ответ Сотрудников и Кураторства на дату (демо-данные) ---------- */
const ADMIN = 'E4'; // администратор модуля
const DEPTS = [ // подразделение → руководитель
  {id:'Сопровождение',     head:'E2'},
  {id:'Взыскание',         head:'E5'},
  {id:'Администрирование', head:'E4'},
  {id:'Аналитика',         head:null},
];
const ABSENCES = [ // замещение: кто действует за сотрудника на дату
  {emp:'E2', from:'2026-08-31', to:'2026-09-11', sub:'E5', reason:'отпуск'},
];
const CURATION = [ // закрепление: роль кураторства × объект → ответственный на дату
  {role:'куратор подразделения', obj:'ЦА — Кредитный отдел',   emp:'E2', from:'2026-01-01', to:null},
  {role:'куратор подразделения', obj:'Ошская область',         emp:'E1', from:'2026-01-01', to:'2026-09-07'},
  {role:'куратор подразделения', obj:'Ошская область',         emp:'E3', from:'2026-09-08', to:null},
  {role:'куратор подразделения', obj:'Жалал-Абадская область', emp:'E1', from:'2026-01-01', to:null},
  {role:'куратор подразделения', obj:'Баткенская область',     emp:'E2', from:'2026-01-01', to:'2026-09-03'},
  {role:'куратор подразделения', obj:'Баткенская область',     emp:'E1', from:'2026-09-04', to:null},
  {role:'куратор подразделения', obj:'unit-narynskaya-obl',    emp:'E3', from:'2026-01-01', to:null},
  {role:'куратор модуля-соседа', obj:'взыскание',              emp:'E1', from:'2026-01-01', to:null},
  {role:'куратор отчётности подразделения', obj:'dep-admin',   emp:'E1', from:'2026-01-01', to:null},
  {role:'куратор отчётности подразделения', obj:'dep-prom',    emp:'E3', from:'2026-01-01', to:null},
];
function curatorOn(role, obj, d){
  const c = CURATION.find(c=>c.role===role && c.obj===obj && c.from<=d && (!c.to || d<=c.to));
  return c ? c.emp : null;
}
function actingFor(id, d){ const a = ABSENCES.find(a=>a.emp===id && a.from<=d && d<=a.to); return a ? a.sub : id; }
function deptHead(id){ const x = DEPTS.find(x=>x.id===id); return x ? x.head : null; }

/* ---------- 1. даты: упрощённый рабочий календарь (сб/вс) ---------- */
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addWorkdays(iso,n){
  let d = new Date(iso+'T00:00:00'), c=0;
  while(c<n){ d.setDate(d.getDate()+1); const wd=d.getDay(); if(wd!==0&&wd!==6) c++; }
  return d.toISOString().slice(0,10);
}
function workdaysBetween(a,b){ // a..b, a<b
  let d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00'), c=0;
  while(d<end){ d.setDate(d.getDate()+1); const wd=d.getDay(); if(wd!==0&&wd!==6) c++; }
  return c;
}
function fmt(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }

/* ---------- 2. реестры: вид повода · действие · правило ---------- */
function seedPovodKinds(){ return [
  {id:'pk-overdue',       title:'Просрочено задание',                    objectType:'task',      traits:['давность_раб_дней'], rollup:20, sensitive:false, ownerDept:'Администрирование', createdAt:'2026-08-16', activatedAt:'2026-08-16'},
  {id:'pk-rejected',      title:'Задание отклонено',                     objectType:'task',      traits:[],                    rollup:20, sensitive:false, ownerDept:'Администрирование', createdAt:'2026-08-16', activatedAt:'2026-08-16'},
  {id:'pk-await-long',    title:'Ожидает приёмки дольше срока',          objectType:'task',      traits:['давность_раб_дней'], rollup:20, sensitive:false, ownerDept:'Администрирование', createdAt:'2026-08-16', activatedAt:'2026-08-16'},

function log(entity, ev, extra){ entity.journal.push(Object.assign({t:state.today, ev}, extra||{})); }
function taskOf(id){ return state.tasks.find(t=>t.id===id); }
function povodByKey(k){ return state.povods.find(p=>p.key===k); }
/* события, которые состояние не меняют: ход, продление, судьба ключа внутри вала */
const NEUTRAL_EV = ['отметка о ходе','запрошено продление','продление утверждено','продление отклонено','ключ отпал','ключ вышел'];
function stateEntry(t){
  for(let i=t.journal.length-1;i>=0;i--) if(NEUTRAL_EV.indexOf(t.journal[i].ev)===-1) return t.journal[i];
  return t.journal[0];
}
function lastEv(t){ // переадресация и переназначение возвращают задание в «поручено»
  const ev = stateEntry(t).ev;
  return (ev==='переадресовано' || ev==='переназначено') ? 'поручено' : ev;
}
function isTerminal(t){ return lastEv(t)==='закрыто'; }
function outcomeOf(t){ if(!isTerminal(t)) return null; const e=stateEntry(t); return {outcome:e.outcome, reason:e.reason||null}; }

/* срок: установленный — последний утверждённый; первоначальный — t.dueDate */
function dueOf(t){ let d=t.dueDate; t.journal.forEach(e=>{ if(e.ev==='продление утверждено') d=e.newDue; }); return d; }
function extensionsOf(t){ return t.journal.filter(e=>e.ev==='продление утверждено').length; }
function approverOf(t){ return t.controller || t.author; }
function pendingExtension(t){
  for(let i=t.journal.length-1;i>=0;i--){
    const ev=t.journal[i].ev;
    if(ev==='запрошено продление') return t.journal[i];
    if(ev==='продление утверждено' || ev==='продление отклонено') return null;
  }
  return null;
}

/* вал: судьба каждого ключа — по последней записи журнала вала об этом ключе */
function keyStatus(t, key){
  for(let i=t.journal.length-1;i>=0;i--){
    const e=t.journal[i];
    if(e.key===key && e.ev==='ключ отпал') return 'отпал';
    if(e.key===key && e.ev==='ключ вышел') return 'вышел';
  }
  return 'жив';
}
function liveKeys(t){ return (t.rollupKeys||[]).filter(k=>keyStatus(t,k)==='жив'); }
function coversKey(t, key){
  if(isTerminal(t)) return false;
  if(t.povodKey===key) return true;
  return Array.isArray(t.rollupKeys) && t.rollupKeys.indexOf(key)!==-1 && keyStatus(t,key)==='жив';
}

const STATE_LABEL = {
  'поручено':'в работе', 'принято':'принято', 'заявлено':'заявлено (ждёт опроса)',
  'ожидает приёмки':'ожидает приёмки', 'возвращено':'возвращено', 'отказано':'отказано',
  'отпало':'отпало — ждёт разбора',
};
function displayState(t){
  if(isTerminal(t)){ const o=outcomeOf(t); return o.outcome==='отпало' ? `закрыто — отпало (${o.reason})` : `закрыто — ${o.outcome}`; }
  return STATE_LABEL[lastEv(t)] || lastEv(t);
}

/* ---------- 4. уведомления: закрытый список, только о задании ---------- */
const NOTIF_KINDS = ['повод-появился','поручено','принято','срок-близко','срок-истёк','эскалация','возвращено','повод-отпал','закрыто',
  'переадресовано','запрошено-продление','решение-по-продлению'];
function notify(taskOrPovod, kind, to, due){
  if(NOTIF_KINDS.indexOf(kind)===-1) throw new Error('уведомление вне закрытого списка: '+kind);
  const taskId = taskOrPovod.id && taskOrPovod.id[0]==='T' ? taskOrPovod.id : (taskOrPovod.taskRef||null);
  const addressee = to || (taskOrPovod.assignee) || null;
  state.notifications.push({id:nextId('N'), t:state.today, kind, taskId, to:addressee, due:due||null});
}
function notifiedOnce(taskId, kind, due){ // «срок близко» / «срок истёк» — однократно на каждый установленный срок
  return state.notifications.some(n=>n.taskId===taskId && n.kind===kind && (due===undefined || n.due===due));
}

/* ---------- 5. переходы задания ---------- */
function claimInternal(t, asOf, proof){
  const extra = {claimedAt:asOf||state.today};
  if(proof) extra.proof = proof; // ссылка на подтверждение — реквизит сдачи
  if(t.controller) log(t,'ожидает приёмки',extra);
  else log(t,'заявлено',extra);
}
function claim(taskId, proof){
  const t = taskOf(taskId); if(!t||isTerminal(t)) return;
  const a = t.action ? actionOf(t.action) : null;
  if(a && a.needsProof && !proof) throw new Error('действие требует ссылку на подтверждение');
  claimInternal(t, null, proof||null);
  notify(t, t.controller ? 'принято':'принято'); // подача исполнителем фиксируется как «принято» в собственном смысле работы
}
function rejectInternal(t, note, asOf){
  log(t,'отказано',{note, t:asOf||state.today});
}
function reject(taskId, note){
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  rejectInternal(t, note);
}
function releaseTask(taskId, reason){ // «снято» — решение автора после отказа
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='отказано') return;
  log(t,'закрыто',{outcome:'снято', reason});
  notify(t,'закрыто');
}
function reassignTask(taskId, newAssignee, by, reason){ // решение человека: автор или руководитель исполнителя по цепочке
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто — переназначать нечего');
  if(by===t.assignee) throw new Error('исполнитель задание не передаёт');
  if(by!==t.author && !chiefChainIncludes(t.assignee, by)) throw new Error('переназначает автор или руководитель исполнителя по цепочке');
  if(!reason) throw new Error('нужно основание переназначения');
  if(!emp(newAssignee) || newAssignee===t.assignee) throw new Error('выберите другого исполнителя');
  const from = t.assignee;
  t.assignee = newAssignee;
  log(t,'переназначено',{from, to:newAssignee, by, reason});
  notify(t,'переадресовано', from);
  notify(t,'поручено');
  return t;
}
function requestExtension(taskId, by, newDue, reason){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(by!==t.assignee) throw new Error('продление запрашивает исполнитель');
  if(pendingExtension(t)) throw new Error('предыдущий запрос продления ещё без решения');
  if(!newDue || newDue<=dueOf(t)) throw new Error('новая дата должна быть позже установленного срока');
  if(!reason) throw new Error('нужно основание продления');
  log(t,'запрошено продление',{by, newDue, reason});
  notify(t,'запрошено-продление', approverOf(t));
  return t;
}
function decideExtension(taskId, by, approve, note){ // решает тот, кто ставил срок: контролёр, если назван, иначе автор
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  const req = pendingExtension(t);
  if(!req) throw new Error('запроса продления нет');
  if(by!==approverOf(t)) throw new Error('решение по продлению принимает '+(t.controller?'контролёр':'автор'));
  if(approve) log(t,'продление утверждено',{by, prevDue:dueOf(t), newDue:req.newDue});
  else log(t,'продление отклонено',{by, note:note||''});
  notify(t,'решение-по-продлению', t.assignee);
  if(t.controller && t.controller!==by) notify(t,'решение-по-продлению', t.controller);
  return t;
}
function addProgress(taskId, by, text, opts){ // отметка о ходе: состояние не меняет, уведомлений не шлёт, не правится
  opts = opts || {};
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!visibleTo(t, by)) throw new Error('отметку оставляет участник задания');
  if(!text) throw new Error('нужен текст отметки');
  const extra = {by, text, link:opts.link||null};
  if(opts.fixes!=null){
    const target = t.journal[opts.fixes];
    if(!target || target.ev!=='отметка о ходе') throw new Error('исправлять можно только отметку о ходе');
    extra.fixes = opts.fixes;
  }
  log(t,'отметка о ходе',extra);
  return t;
}
function acceptDecision(taskId, approve, note){ // решение контролёра (только свободные поручения)
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='ожидает приёмки') return;
  if(approve){ log(t,'закрыто',{outcome:'исполнено'}); notify(t,'закрыто'); }
  else { log(t,'возвращено',{note}); notify(t,'возвращено'); }
}
function disposeLapsed(taskId, outcome, reason){ // человек разбирает «отпало-до-разбора»
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='отпало') return;
  log(t,'закрыто',{outcome, reason});
  notify(t,'закрыто');
}
function createFreeTask(p){ // свободное поручение: объекта и ключа не имеет, контролёр обязателен
  if(!p.controller) throw new Error('свободное поручение обязано иметь контролёра');
  return mkTask({kind:'free', label:p.label, assignee:p.assignee, controller:p.controller,
    author:p.author, dueDate:p.dueDate, importance:p.importance||'средняя', createdAt:state.today});
}
function issueManual(kindId){ // задание по правилу в ручном режиме
  const rule = state.rules.find(r=>r.kind===kindId && r.mode==='ручной');
  if(!rule) return null;
  const pending = state.povods.filter(p=>p.kind===kindId && p.status!=='gone' &&
    !state.tasks.some(t=>t.povodKey===p.key && !isTerminal(t)));
  const out = [];
  pending.forEach(p=> out.push(issueRuleTask(rule, p)));
  return out;
}

/* ---------- 6. опрос: ожидаемое множество поводов по виду ---------- */
const AWAIT_THRESHOLD_WD = 3;   // «дольше срока» для ожидания приёмки
const SILENT_THRESHOLD = 2;     // «сосед не отвечает» — подряд промахов
const INACTIVE_THRESHOLD_D = 3; // «вид не введён в действие дольше срока» — календарных дней
const EXT_PENDING_WD = 1;       // «запрос продления без ответа» — рабочих дней
const RETURN_THRESHOLD = 3;     // «повод возвращается» — появлений ключа вновь…
const RETURN_WINDOW_D = 30;     // …за календарных дней

function computeExpectedForKind(kindId, asOf){
  const out = new Map(); // key -> {kind,objectType,objectId,stateDate,approx,traits}
  const pkGate = kindOf(kindId);
  if(!pkGate.activatedAt || pkGate.activatedAt>asOf) return out; // рубильник: вид не введён в действие — поводов не порождает
  if(kindId==='pk-overdue'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-overdue') return; // стопор рекурсии, один шаг
      if(isTerminal(t)) return;
      const st = lastEv(t);
      if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
      const due = dueOf(t);
      if(due >= asOf) return;
      const key = `pk-overdue|task:${t.id}|`;
      out.set(key, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
        traits:{давность_раб_дней: workdaysBetween(due, asOf)}});
    });
  } else if(kindId==='pk-rejected'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-rejected') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='отказано') return;
      const stDate = stateEntry(t).t;
      out.set(`pk-rejected|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:stDate, approx:false, traits:{}});
    });
  } else if(kindId==='pk-await-long'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-await-long') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='ожидает приёмки') return;
      const claimedAt = stateEntry(t).claimedAt || stateEntry(t).t;
      const wd = workdaysBetween(claimedAt, asOf);
      if(wd <= AWAIT_THRESHOLD_WD) return;
      out.set(`pk-await-long|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:claimedAt, approx:false, traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-lapsed-review'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-lapsed-review') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='отпало') return;
      const stDate = stateEntry(t).t;
      out.set(`pk-lapsed-review|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:stDate, approx:false, traits:{}});
    });
  } else if(kindId==='pk-neighbor-silent'){
    const misses = countTrailingMisses(asOf);
    if(misses >= SILENT_THRESHOLD){
      out.set('pk-neighbor-silent|source:self|', {kind:kindId, objectType:'source', objectId:'self',
        stateDate:asOf, approx:true, traits:{прогонов_подряд:misses}});
    }
  } else if(kindId==='pk-kind-inactive'){
    state.povodKinds.forEach(pk=>{
      if(pk.activatedAt && pk.activatedAt<=asOf) return; // введён — не наш случай
      const days = daysBetween(pk.createdAt, asOf);
      if(days < INACTIVE_THRESHOLD_D) return;
      out.set(`pk-kind-inactive|povodKind:${pk.id}|`, {kind:kindId, objectType:'povodKind', objectId:pk.id,
        stateDate:pk.createdAt, approx:false, traits:{дней_с_заведения:days}});
    });
  } else if(kindId==='pk-addr-missing'){
    // задание выдано администратору по концу цепочки запасных
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-addr-missing') return;
      if(isTerminal(t) || !t.addr || t.addr.via!=='администратор') return;
      const issued = t.journal[0].t;
      const objType = t.povodKey && povodByKey(t.povodKey) ? povodByKey(t.povodKey).objectType : (t.rollupKeys ? 'вал' : '—');
      out.set(`pk-addr-missing|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:issued, approx:false,
        traits:{вид_объекта:objType, роль:t.addr.role}});
    });
  } else if(kindId==='pk-ext-pending'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-ext-pending') return;
      if(isTerminal(t)) return;
      const req = pendingExtension(t);
      if(!req) return;
      const wd = workdaysBetween(req.t, asOf);
      if(wd <= EXT_PENDING_WD) return;
      out.set(`pk-ext-pending|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:req.t, approx:false,
        traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-returning'){
    // ключ вновь появлялся не реже порога за окно
    const from = addDays(asOf, -RETURN_WINDOW_D);
    state.povods.forEach(p=>{
      if(p.kind==='pk-returning') return;
      const back = p.journal.filter(e=>e.ev==='вновь-появился' && e.t>from && e.t<=asOf);
      if(back.length < RETURN_THRESHOLD) return;
      out.set(`pk-returning|povod:${p.key}|`, {kind:kindId, objectType:'povod', objectId:p.key, stateDate:back[back.length-1].t, approx:false,
        traits:{повторов:back.length}});
    });
  } else if(ORGSTRUCT_CFG[kindId]){
    // одна ветка на все виды Оргструктуры, различие — в ORGSTRUCT_CFG
    const cfg = ORGSTRUCT_CFG[kindId];
    const rows = orgstructMirrorAt(asOf)[cfg.list] || [];
    rows.forEach(r=>{
      const objectId = cfg.id(r);
      const stateDate = dateMax(cfg.date(r), pkGate.activatedAt); // клэмп к дате подключения
      out.set(`${kindId}|${cfg.objectType}:${objectId}|`, {kind:kindId, objectType:cfg.objectType, objectId,
        curObj:cfg.cur(r)||null, stateDate, approx:false, traits:cfg.traits(r)});
    });
  } else if(kindId==='pk-stat-neighbor-silent'){
    // ключ шва — от соседа
    const ans = statMirrorAt(asOf);
    (ans.leads||[]).forEach(lead=>{
      const stateDate = dateMax(lead.from, pkGate.activatedAt); // клэмп к дате подключения
      out.set(lead.key, {kind:kindId, objectType:'module', objectId:lead.nb, curObj:lead.nb, stateDate, approx:false,
        traits:{прогонов_подряд:lead.runs, причины:lead.reasons.join(', ')}});
    });
  } else if(kindId==='pk-rep-obligation-overdue'){
    // ключ шва — от соседа; поводом становится только «просрочено»
    reportsMirrorAt(asOf).filter(o=>o.state==='просрочено').forEach(o=>{
      const stateDate = dateMax(o.due, pkGate.activatedAt); // клэмп к дате подключения
      out.set(o.id, {kind:kindId, objectType:'obligation', objectId:o.dept, curObj:o.dept, stateDate, approx:false,
        traits:{форма:o.tplName, подразделение:o.deptName, период:o.period, срок:o.due,
          дней_просрочки:daysBetween(o.due, asOf)}});
    });
  }
  return out;
}
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
/* база срока = max(дата состояния у соседа, дата ввода вида в действие) */
function dateMax(a,b){ return a>b ? a : b; }
function countTrailingMisses(asOf){
  let c=0;
  for(let i=state.pollRuns.length-1;i>=0;i--){
    const r = state.pollRuns[i];
    if(r.date>asOf) continue;
    if(!r.complete) c++; else break;
  }
  return c;
}

/* ---------- 7. сверка множества: полная, идемпотентная ---------- */
function reconcileKind(kindId, asOf){
  const expected = computeExpectedForKind(kindId, asOf);
  const newKeys=[], goneKeys=[], matchedKeys=[];
  state.povods.filter(p=>p.kind===kindId && p.status!=='gone').forEach(p=>{
    if(!expected.has(p.key)) goneKeys.push(p.key);
  });
  goneKeys.forEach(key=>{
    const p = povodByKey(key);
    p.status='gone'; log(p,'отпал',{});
  });
  expected.forEach((e,key)=>{
    let p = povodByKey(key);
    if(!p || p.status==='gone'){
      if(p){ p.status='appeared'; p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; p.curObj=e.curObj||null; log(p,'вновь-появился',{}); }
      else {
        p = {key, kind:e.kind, objectType:e.objectType, objectId:e.objectId, curObj:e.curObj||null, stateDate:e.stateDate,
          approx:e.approx, firstSeen:asOf, status:'appeared', frozenSince:null, traits:e.traits, journal:[]};
        log(p,'появился',{});
        state.povods.push(p);
      }
      newKeys.push(key);
      notify({assignee:null}, 'повод-появился', resolveAddressee(ruleForKind(kindId), p, asOf).assignee);
    } else {
      matchedKeys.push(key);
      p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; p.curObj=e.curObj||null;
      if(p.status==='frozen'){ p.status='appeared'; p.frozenSince=null; log(p,'разморожен',{}); }
      // независимая ось: заявлено/ожидает приёмки БЕЗ контролёра, а повод всё ещё на месте => возвращено
      state.tasks.filter(t=>t.povodKey===key && !isTerminal(t)).forEach(t=>{
        if(!t.controller && (lastEv(t)==='заявлено')){
          log(t,'возвращено',{}); notify(t,'возвращено');
        }
      });
    }
  });
  return {new:newKeys, gone:goneKeys, matched:matchedKeys, kindTitle:kindOf(kindId).title};
}

function handleGoneForKind(goneKeys, asOf){
  goneKeys.forEach(key=>{
    const openTasks = state.tasks.filter(t=>t.povodKey===key && !isTerminal(t));
    const rollups = state.tasks.filter(t=>Array.isArray(t.rollupKeys) && coversKey(t,key));
    if(openTasks.length===0 && rollups.length===0){
      const p = povodByKey(key);
      log(p,'закрыт-системой',{reason:'поручения не было'});
      return;
    }
    rollups.forEach(t=>{ log(t,'ключ отпал',{key}); settleRollup(t); });
    openTasks.forEach(t=>{
      const st = lastEv(t);
      if(st==='заявлено' || st==='ожидает приёмки'){
        log(t,'закрыто',{outcome:'исполнено'});
        notify(t,'закрыто');
      } else {
        log(t,'отпало',{});
        notify(t,'повод-отпал');
      }
    });
  });
}

function kindOf(id){ return state.povodKinds.find(k=>k.id===id); }
function actionOf(id){ return state.actions.find(a=>a.id===id); }
function ruleForKind(kindId){ return state.rules.find(r=>r.kind===kindId); }

/* адресат: формула правила → замещение на дату → запасной (руководитель подразделения-владельца
   вида повода) → администратор модуля; результат хранится в задании снимком */
function participantOf(who, t){
  if(!t) return null;
  if(who==='руководитель исполнителя') return chiefOf(t.assignee);
  if(who==='автор') return t.author;
  if(who==='контролёр') return t.controller;
  if(who==='исполнитель') return t.assignee;
  if(who==='утверждающий продление') return approverOf(t);
  return null;
}
function fallbackAddressee(rule, asOf){
  const f = rule.addressee, head = deptHead(kindOf(rule.kind).ownerDept);
  if(!head) return {by:f.by, role:f.role||f.who, responsible:null, assignee:ADMIN, via:'администратор', subst:false};
  const acting = actingFor(head, asOf);
  return {by:f.by, role:f.role||f.who, responsible:head, assignee:acting, via:'запасной', subst:acting!==head};
}
function resolveAddressee(rule, povod, asOf){
  const f = rule.addressee;
  let responsible = null;
  if(f.by==='кураторство') responsible = povod.curObj ? curatorOn(f.role, povod.curObj, asOf) : null;
  else if(f.by==='участник') responsible = participantOf(f.who, povod.objectType==='task' ? taskOf(povod.objectId) : null);
  else if(f.by==='должность') responsible = ADMIN;
  if(!responsible) return Object.assign(fallbackAddressee(rule, asOf), {curObj:povod.curObj||null});
  const acting = actingFor(responsible, asOf);
  return {by:f.by, role:f.role||f.who, curObj:povod.curObj||null, responsible, assignee:acting, via:f.by, subst:acting!==responsible};
}
function addrText(a){
  if(!a) return '—';
  const who = id=>emp(id) ? emp(id).name : id;
  if(a.via==='администратор') return `${who(a.assignee)} — администратор модуля: ответственный не найден (${a.role})`;
  const base = a.via==='запасной' ? `запасной адресат — руководитель подразделения ${who(a.responsible)}` : `${a.role}: ${who(a.responsible)}`;
  return a.subst ? `${base}; действует ${who(a.assignee)} (замещение)` : base;
}
function priorTasksForKey(key){ // закрытые задания по ключу и валы, где ключ отпал
  return state.tasks.filter(t=>
    (t.povodKey===key && isTerminal(t)) ||
    (Array.isArray(t.rollupKeys) && t.rollupKeys.indexOf(key)!==-1 && keyStatus(t,key)!=='вышел' &&
      (isTerminal(t) || keyStatus(t,key)==='отпал')));
}
function computeImportance(action, rule){ return rule.importanceOverride || action.importance; }
function issueRuleTask(rule, povod){
  const action = actionOf(rule.action);
  const addr = resolveAddressee(rule, povod, state.today);
  const dueDate = rule.dueUnit==='workday' ? addWorkdays(state.today, rule.dueN) : addDays(state.today, rule.dueN);
  const ed = rule.editions[rule.editions.length-1];
  const prior = priorTasksForKey(povod.key); // закрытое не переоткрывается — повтор идёт новым заданием
  const t = mkTask({kind:'rule', povodKey:povod.key, originKind:rule.kind, action:action.id,
    label: action.label + ' — ' + describePovod(povod), assignee:addr.assignee, controller:null, author:rule.author,
    dueDate, ruleId:rule.id, ruleEdition:ed.n, importance:computeImportance(action, rule), createdAt:state.today,
    addr, repeatOf: prior.length ? prior[prior.length-1].id : null, repeatCount: prior.length});
  return t;
}
function issueRollupTask(kindId, keys){
  const rule = ruleForKind(kindId), action = actionOf(rule.action);
  const per = keys.map(k=>resolveAddressee(rule, povodByKey(k), state.today));
  // общий ответственный у всех ключей — ему; иначе запасной адресат вида
  const same = per.every(a=>a.responsible && a.responsible===per[0].responsible);
  const addr = same ? per[0] : fallbackAddressee(rule, state.today);
  const t = mkTask({kind:'rule', povodKey:null, originKind:kindId, action:action.id,
    label:`Разобраться с валом: «${kindOf(kindId).title}» — ${keys.length} шт., порог свёртки ${kindOf(kindId).rollup}`,
    assignee:addr.assignee, controller:null, author:rule.author, dueDate:addWorkdays(state.today,1),
    ruleId:rule.id, ruleEdition:rule.editions.slice(-1)[0].n,
    importance:'высокая', createdAt:state.today, addr});
  t.rollupKeys = keys;
  t.rollupResp = {}; // ответственный по каждому ключу — снимок на выдачу
  keys.forEach((k,i)=>{ t.rollupResp[k] = per[i].responsible; });
  return t;
}
function settleRollup(t){ // вал закрыт, когда живых ключей нет
  if(isTerminal(t) || liveKeys(t).length) return;
  if(t.rollupKeys.every(k=>keyStatus(t,k)==='отпал')){ log(t,'закрыто',{outcome:'исполнено'}); notify(t,'закрыто'); }
  else if(lastEv(t)!=='отпало'){ log(t,'отпало',{}); notify(t,'повод-отпал'); }
}
function splitRollup(taskId, by){ // исполнитель разбирает вал на поштучные задания
  const t = taskOf(taskId);
  if(!t || isTerminal(t) || !Array.isArray(t.rollupKeys)) throw new Error('это не открытый вал');
  if(by!==t.assignee) throw new Error('разбирает вал исполнитель');
  const rule = state.rules.find(r=>r.id===t.ruleId);
  const out = [];
  liveKeys(t).forEach(key=>{ log(t,'ключ вышел',{key, причина:'разбор вала'}); out.push(issueRuleTask(rule, povodByKey(key))); });
  log(t,'закрыто',{outcome:'снято', reason:'вал разобран на поштучные задания'});
  notify(t,'закрыто');
  return out;
}

/* смена закрепления: непринятое («поручено») уходит новому ответственному, принятое остаётся */
function readdressByCuration(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t) || !t.addr || t.addr.by!=='кураторство' || lastEv(t)!=='поручено') return;
    if(t.journal.some(e=>e.ev==='переназначено')) return; // переназначенное человеком не переадресуется
    const rule = state.rules.find(r=>r.id===t.ruleId);
    if(Array.isArray(t.rollupKeys)){
      liveKeys(t).forEach(key=>{
        const p = povodByKey(key);
        if(!p || p.status!=='appeared') return;
        const now = resolveAddressee(rule, p, asOf);
        if(now.responsible===t.rollupResp[key]) return;
        log(t,'ключ вышел',{key, to:now.assignee, причина:'смена закрепления'});
        issueRuleTask(rule, p);
      });
      settleRollup(t);
      return;
    }
    const p = povodByKey(t.povodKey);
    if(!p || p.status!=='appeared') return;
    const now = resolveAddressee(rule, p, asOf);
    if(now.responsible===t.addr.responsible) return;
    const from = t.assignee;
    t.assignee = now.assignee; t.addr = now;
    log(t,'переадресовано',{from, to:now.assignee, причина:'смена закрепления'});
    notify(t,'переадресовано', from);
    notify(t,'поручено');
  });
}
function describePovod(p){
  if(p.objectType==='task'){ const t=taskOf(p.objectId); return t ? `«${t.label}» (${p.objectId})` : p.objectId; }
  if(p.objectType==='povodKind'){ return `вид «${kindOf(p.objectId).title}»`; }
  if(p.objectType==='unit'){ return `подразделение «${p.objectId}»`; }
  if(p.objectType==='employee'){ return `сотрудник ${p.objectId}`; }
  if(p.objectType==='territory'){ return `территория подразделения «${p.objectId}»`; }
  if(p.objectType==='module'){ return `сосед-модуль «${p.objectId}» (по данным статистики)`; }
  if(p.objectType==='povod'){ const q=povodByKey(p.objectId); return q ? `повод «${kindOf(q.kind).title}» · ${q.key}` : p.objectId; }
  if(p.objectType==='obligation'){ return `«${p.traits.форма}» за ${p.traits.период}, ${p.traits.подразделение} (срок ${fmt(p.traits.срок)})`; }
  return p.objectId;
}

function handleNewForKind(kindId, newKeys, asOf){
  const rule = ruleForKind(kindId);
  const pk = kindOf(kindId);
  if(newKeys.length===0) return {rollup:false};
  if(newKeys.length > pk.rollup){
    issueRollupTask(kindId, newKeys);
    return {rollup:true};
  }
  if(rule.mode!=='авто') return {rollup:false}; // ручной режим — человек нажимает «Поручить вручную»
  newKeys.forEach(key=>{
    const p = povodByKey(key);
    issueRuleTask(rule, p);
  });
  return {rollup:false};
}
function reissueForFreedPairs(kindId, matchedKeys){
  if(kindOf(kindId).activatedAt===null) return;
  const rule = ruleForKind(kindId);
  if(rule.mode!=='авто') return;
  matchedKeys.forEach(key=>{
    const p = povodByKey(key);
    if(p.status!=='appeared') return;
    // повод покрыт поштучным заданием или вал-заданием свёртки
    const hasOpen = state.tasks.some(t=>coversKey(t, key));
    if(!hasOpen) issueRuleTask(rule, p);
  });
}

/* ---------- 8. эскалация / срок-близко — периодические проверки ---------- */
const ESCALATE_WD = 5;
function checkDeadlines(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t)) return;
    const st = lastEv(t);
    if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
    const due = dueOf(t);
    if(due>=asOf && daysBetween(asOf,due)<=1 && !notifiedOnce(t.id,'срок-близко',due)){
      notify(t,'срок-близко',null,due);
    }
    if(due<asOf && !notifiedOnce(t.id,'срок-истёк',due)){
      notify(t,'срок-истёк',null,due);
    }
    if(due<asOf && workdaysBetween(due,asOf)>=ESCALATE_WD && !notifiedOnce(t.id,'эскалация')){
      notify(t,'эскалация', chiefOf(t.assignee) || 'E4');
    }
  });
}

/* ---------- 9. прогон опроса ---------- */
function runPoll(opts){
  opts = opts || {};
  const asOf = state.today;
  const run = {id:nextId('PR'), date:asOf, sources:[], complete:true};
  SOURCES.forEach(src=>{
    const isDown = opts.down!==undefined ? opts.down
      : (opts.downSources ? opts.downSources.indexOf(src.id)!==-1 : !!state.sourceDown[src.id]);
    if(isDown){
      run.sources.push({name:src.name, answer:'таймаут', matched:0, new:0, gone:0, rollup:[]});
      run.complete = false;
      // замораживаются только поводы этого источника
      state.povods.filter(p=>p.status==='appeared' && src.kinds.indexOf(p.kind)!==-1).forEach(p=>{
        p.status='frozen'; p.frozenSince=asOf; log(p,'заморожен',{});
      });
      return;
    }
    let totalNew=0, totalGone=0, totalMatched=0; const rollupKinds=[];
    src.kinds.forEach(kindId=>{
      const {new:nk, gone:gk, matched:mk} = reconcileKind(kindId, asOf);
      handleGoneForKind(gk, asOf);
      const r = handleNewForKind(kindId, nk, asOf);
      reissueForFreedPairs(kindId, mk);
      if(r.rollup) rollupKinds.push(kindId);
      totalNew+=nk.length; totalGone+=gk.length; totalMatched+=mk.length;
    });
    run.sources.push({name:src.name, answer:'множество', matched:totalMatched, new:totalNew, gone:totalGone, rollup:rollupKinds});
    if(src.id==='self') checkDeadlines(asOf); // эскалация срока — только при доступном самоопросе
  });
  readdressByCuration(asOf);
  state.pollRuns.push(run);
  return run;
}

/* ---------- 10. видимость ---------- */
function responsibleNow(t){ // ответственный по кураторству на дату
  if(!t.addr || t.addr.by!=='кураторство' || !t.addr.curObj) return null;
  return curatorOn(t.addr.role, t.addr.curObj, state.today);
}
function visibleTo(t, viewerId){
  if(viewerId===t.assignee || viewerId===t.controller || viewerId===t.author) return true;
  if(chiefChainIncludes(t.assignee, viewerId)) return true;
  return responsibleNow(t)===viewerId;
}
function queueTasks(scope){
  const v = state.viewer;
  return state.tasks.filter(t=>{
    if(scope==='mine') return t.assignee===v;
    return visibleTo(t, v);
  }).sort((a,b)=> (isTerminal(a)-isTerminal(b)) || (dueOf(a)<dueOf(b)?-1:1));
}

/* ---------- 10а. сверка реестров ---------- */
function checkRegistry(){
  const errs = [];
  state.povodKinds.forEach(k=>{
    if(!('sumAttr' in k)) errs.push(`«${k.title}»: не объявлен реквизит суммы`);
    if(!k.ownerDept) errs.push(`«${k.title}»: не объявлено подразделение-владелец`);
    if(k.periodic && k.periodAbsorb!=='да' && k.periodAbsorb!=='нет') errs.push(`«${k.title}»: периодический вид не объявил поглощение периодом`);
    if(!k.periodic && k.periodAbsorb!=null) errs.push(`«${k.title}»: поглощение периодом у событийного вида`);
  });
  state.rules.forEach(r=>{ if(!r.addressee) errs.push(`${r.id}: нет формулы адресата`); });
  return errs;
}

/* ---------- 10б. строки заданий для статистики (сумм не несут) ---------- */
function taskRows(){
  return state.tasks.map(t=>{
    const claimed = t.journal.find(e=>e.ev==='заявлено' || e.ev==='ожидает приёмки');
    const k = t.originKind ? kindOf(t.originKind) : null;
    return {
      task:t.id, key:t.povodKey, rollupKeys:t.rollupKeys ? t.rollupKeys.slice() : null,
      kind:t.originKind, action:t.action, assignee:t.assignee,
      dept: emp(t.assignee) ? emp(t.assignee).dept : null,
      issued:t.journal[0].t, initialDue:t.dueDate, setDue:dueOf(t),
      claimed: claimed ? (claimed.claimedAt||claimed.t) : null,
      closed: isTerminal(t) ? stateEntry(t).t : null,
      outcome: outcomeOf(t) ? outcomeOf(t).outcome : null,
      extensions: extensionsOf(t), repeatOf:t.repeatOf, repeatCount:t.repeatCount,
      sumAttr: k ? k.sumAttr : null,
    };
  });
}

/* ---------- 11. рендер (no-op вне DOM) ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, kind){
  if(typeof document==='undefined') return;
  const el = document.createElement('div'); el.className='toast'+(kind?(' '+kind):'');
  el.textContent = msg; document.getElementById('toastWrap').appendChild(el);

}

    <div class="drawer-b">
      <div class="kv">
        <div class="k">Формулировка</div><div class="v">${esc(t.label)}</div>
        <div class="k">Род</div><div class="v">${t.kind==='rule'?'по правилу '+esc(t.ruleId)+' (ред. '+t.ruleEdition+')':'свободное поручение'}</div>
        <div class="k">Основание</div><div class="v">${povod ? 'повод «'+esc(kindOf(povod.kind).title)+'» · '+esc(describePovod(povod)) : (t.kind==='rule'?'—':'решение автора '+esc(emp(t.author)?.name))}</div>
        <div class="k">Исполнитель</div><div class="v">${esc(emp(t.assignee)?.name)}</div>
        ${t.addr ? `<div class="k">Адресат (снимок на выдачу)</div><div class="v">${esc(addrText(t.addr))}</div>` : ''}
        ${responsibleNow(t) ? `<div class="k">Ответственный на ${fmt(state.today)}</div><div class="v">${esc(emp(responsibleNow(t))?.name)}</div>` : ''}
        <div class="k">Контролёр</div><div class="v">${t.controller?esc(emp(t.controller)?.name):'нет — независимая ось: отпадение повода'}</div>
        <div class="k">Автор</div><div class="v">${esc(emp(t.author)?.name)}</div>
        <div class="k">Первоначальный срок</div><div class="v">${fmt(t.dueDate)}</div>
        <div class="k">Установленный срок</div><div class="v">${fmt(dueOf(t))}${extensionsOf(t)?' · продлений: '+extensionsOf(t):''}</div>
        ${t.repeatOf ? `<div class="k">Повтор после</div><div class="v"><button class="linky" onclick="ZD.openCard('${t.repeatOf}')">${t.repeatOf}</button> · повторов по ключу: ${t.repeatCount}</div>` : ''}
        <div class="k">Важность</div><div class="v">${t.importance}</div>
        <div class="k">Состояние</div><div class="v"><b>${esc(displayState(t))}</b></div>
      </div>
      ${t.rollupKeys ? `<div class="section-h">Ключи вала</div>
      <table class="cgrid"><thead><tr><th>Ключ</th><th>Ответственный (снимок)</th><th>Судьба</th></tr></thead>
        <tbody>${t.rollupKeys.map(k=>`<tr><td class="mono small">${esc(k)}</td><td>${esc(emp(t.rollupResp&&t.rollupResp[k])?.name||'—')}</td>
          <td><span class="pill ${keyStatus(t,k)==='жив'?'ok':keyStatus(t,k)==='отпал'?'neutral':'info'}">${keyStatus(t,k)}</span></td></tr>`).join('')}</tbody></table>` : ''}
      <div class="section-h">Действия</div>
      ${renderTaskActions(t)}
      <div class="section-h">Журнал (только дозапись)</div>
      <table class="cgrid"><thead><tr><th>Дата</th><th>Событие</th><th>Подробности</th></tr></thead>
        <tbody>${t.journal.map(e=>`<tr><td>${fmt(e.t)}</td><td>${esc(e.ev)}</td><td class="small">${esc(JSON.stringify(Object.assign({},e,{t:undefined,ev:undefined})))}</td></tr>`).join('')}</tbody></table>
    </div>
  </div>`;
}
function renderTaskActions(t){
  if(isTerminal(t)) return '<div class="muted small">задание закрыто, действий нет</div>';
  const st = lastEv(t), v = state.viewer, id = t.id;
  const act = t.action ? actionOf(t.action) : null;
  const empOpts = EMP.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  let html = '';
  if(st==='поручено' || st==='принято' || st==='возвращено'){
    const proof = act && act.needsProof ? `prompt('Ссылка на подтверждение:')` : 'null';
    html += `<div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.claim('${id}', ${proof}))">Заявить исполнение</button>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reject('${id}', prompt('Причина отказа:')||'без причины'))">Отказаться</button>
      ${t.rollupKeys && v===t.assignee ? `<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.splitRollup('${id}', ZD.state.viewer))">Разобрать вал на поштучные</button>` : ''}
    </div>`;
  }
  if(st==='ожидает приёмки'){
    html += `<div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.acceptDecision('${id}',true))">Принять (исполнено)</button>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.acceptDecision('${id}',false, prompt('Причина возврата:')||''))">Отклонить приёмку</button>
    </div>`;
  }
  if(st==='отказано'){
    html += `<div class="btn-row">
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.releaseTask('${id}', prompt('Причина снятия:')||'решение автора'))">Снять (решение автора)</button>
    </div>`;
  }
  if(st==='отпало'){
    html += `<div class="banner warn">Повод отпал раньше, чем задание было заявлено — требует разбора.</div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.disposeLapsed('${id}','исполнено', prompt('Как сделано?')||'сделано мимо системы'))">Закрыть — сделано</button>
      <select id="lapsedReason"><option value="сделано мимо системы">сделано мимо системы</option><option value="условие изменилось">условие изменилось</option><option value="объект выбыл">объект выбыл</option><option value="ошибка данных">ошибка данных</option><option value="иное">иное</option></select>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.disposeLapsed('${id}','отпало', document.getElementById('lapsedReason').value))">Закрыть — отпало (с причиной)</button>
    </div>`;
  }
  // срок: запрос исполнителя, решение утверждающего
  const req = pendingExtension(t);
  if(req){
    html += `<div class="card"><h3>Запрос продления</h3>
      <div class="small">до <b>${fmt(req.newDue)}</b> · основание: ${esc(req.reason)} · решает ${esc(emp(approverOf(t))?.name)}</div>
      ${v===approverOf(t) ? `<div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.decideExtension('${id}', ZD.state.viewer, true))">Утвердить</button>
        <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.decideExtension('${id}', ZD.state.viewer, false, prompt('Почему отклонено?')||''))">Отклонить</button>
      </div>` : ''}</div>`;
  } else if(v===t.assignee){
    html += `<div class="card"><h3>Продление срока</h3><div class="form-row">
      <div class="fld"><label>Новый срок</label><input type="date" id="extDue" value="${addWorkdays(dueOf(t),3)}"></div>
      <div class="fld"><label>Основание</label><input id="extReason"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.requestExtension('${id}', ZD.state.viewer, document.getElementById('extDue').value, document.getElementById('extReason').value.trim()))">Запросить продление</button>
    </div></div>`;
  }
  // ход исполнения: любой участник
  if(visibleTo(t, v)){
    const notes = t.journal.map((e,i)=>({e,i})).filter(x=>x.e.ev==='отметка о ходе');
    html += `<div class="card"><h3>Отметка о ходе</h3><div class="form-row">
      <div class="fld"><label>Что сделано</label><input id="prText"></div>
      <div class="fld"><label>Ссылка или вложение</label><input id="prLink"></div>
      ${notes.length ? `<div class="fld"><label>Исправление к</label><select id="prFix"><option value="">—</option>${notes.map(x=>`<option value="${x.i}">${fmt(x.e.t)} · ${esc(x.e.text)}</option>`).join('')}</select></div>` : ''}
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>{ const f=document.getElementById('prFix'); ZD.addProgress('${id}', ZD.state.viewer, document.getElementById('prText').value.trim(), {link:document.getElementById('prLink').value.trim(), fixes: f&&f.value!=='' ? +f.value : null}); })">Отметить</button>
    </div></div>`;
  }
  // переназначение: автор или руководитель исполнителя по цепочке
  if(v!==t.assignee && (v===t.author || chiefChainIncludes(t.assignee, v))){
    html += `<div class="card"><h3>Переназначение</h3><div class="form-row">
      <div class="fld"><label>Новый исполнитель</label><select id="reassignSel">${empOpts}</select></div>
      <div class="fld"><label>Основание</label><input id="reassignReason"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reassignTask('${id}', document.getElementById('reassignSel').value, ZD.state.viewer, document.getElementById('reassignReason').value.trim()))">Переназначить</button>
    </div></div>`;
  }
  return html || '<div class="muted small">нет доступных действий из этого состояния</div>';
}

function renderSettings(){
  const tabs = [['kinds','Виды повода'],['actions','Действия'],['rules','Правила'],['addr','Кураторство и замещение']];
  const tabBtns = tabs.map(([k,l])=>`<button class="${state.settingsTab===k?'on':''}" onclick="ZD.setSettingsTab('${k}')">${l}</button>`).join('');
  let body='';
  if(state.settingsTab==='kinds'){
    const errs = checkRegistry();
    const srcOf = id=>(SOURCES.find(s=>s.kinds.indexOf(id)!==-1)||{}).name||'—';
    body = `${errs.length ? `<div class="banner danger"><b>Реестр не сходится:</b><ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
    <table class="cgrid"><thead><tr><th>Вид повода</th><th>Владелец</th><th>Объект</th><th>Признаки</th><th>Опрос</th><th>Реквизит суммы</th><th>Порог свёртки</th><th>Введён в действие</th></tr></thead>
    <tbody>${state.povodKinds.map(k=>`<tr>
      <td>${esc(k.title)} <span class="mono small">${k.id}</span>${SELF_KINDS.includes(k.id)?' <span class="pill info">свой</span>':''}</td>
      <td>${esc(srcOf(k.id))}<div class="small">${esc(k.ownerDept)}</div></td>
      <td>${esc(k.objectType)}</td><td>${k.traits.join(', ')||'—'}</td>
      <td>${k.periodic ? 'периодический<div class="small">поглощение периодом: '+esc(k.periodAbsorb||'не объявлено')+'</div>' : 'событийный'}</td>
      <td>${esc(k.sumAttr||'—')}</td>
      <td><input type="number" value="${k.rollup}" style="width:70px" onchange="ZD.setRollup('${k.id}', this.value)"></td>
      <td>${k.activatedAt && k.activatedAt<=state.today ? '<span class="pill ok">'+fmt(k.activatedAt)+'</span>' : '<span class="pill warn">не введён</span>'}
        <div style="margin-top:6px">${k.activatedAt ? `<button class="btn btn-sm btn-secondary" onclick="ZD.deactivateKind('${k.id}')">Деактивировать (демо)</button>`
                           : `<button class="btn btn-sm btn-primary" onclick="ZD.activateKind('${k.id}')">Ввести в действие</button>`}</div></td>
    </tr>`).join('')}</tbody></table>`;
  } else if(state.settingsTab==='actions'){
    body = `<table class="cgrid"><thead><tr><th>Действие</th><th>Важность по умолчанию</th><th>Ссылка на подтверждение</th></tr></thead>
    <tbody>${state.actions.map(a=>`<tr><td>${esc(a.label)} <span class="mono small">${a.id}</span></td><td>${a.importance}</td><td>${a.needsProof?'обязательна':'—'}</td></tr>`).join('')}</tbody></table>`;
  } else if(state.settingsTab==='rules'){
    body = `<table class="cgrid"><thead><tr><th>Правило</th><th>Вид повода</th><th>Действие</th><th>Адресат</th><th>Режим</th><th>Срок</th><th>Редакций</th></tr></thead>
    <tbody>${state.rules.map(r=>`<tr>
      <td class="mono small">${r.id}</td><td>${esc(kindOf(r.kind).title)}</td><td>${esc(actionOf(r.action).label)}</td>
      <td>${esc(r.addressee.by==='кураторство' ? 'роль кураторства: '+r.addressee.role : r.addressee.who)}</td>
      <td><span class="pill ${r.mode==='авто'?'info':'neutral'}">${r.mode}</span></td>
      <td>${r.dueN} ${r.dueUnit==='workday'?'раб.дн.':'кал.дн.'}</td><td>${r.editions.length}</td>
    </tr>`).join('')}</tbody></table>`;
  } else if(state.settingsTab==='addr'){
    const d = state.today, who = id=>emp(id)?.name||'—';
    body = `<div class="section-h">Закрепления на ${fmt(d)}</div>
    <table class="cgrid"><thead><tr><th>Роль</th><th>Объект</th><th>Ответственный</th><th>Действует</th><th>Период</th></tr></thead>
    <tbody>${CURATION.map(c=>{ const on = c.from<=d && (!c.to || d<=c.to); return `<tr class="${on?'':'hole'}">
      <td>${esc(c.role)}</td><td>${esc(c.obj)}</td><td>${esc(who(c.emp))}</td><td>${on?esc(who(actingFor(c.emp,d))):'—'}</td>
      <td class="small">${fmt(c.from)} — ${c.to?fmt(c.to):'…'}</td></tr>`; }).join('')}</tbody></table>
    <div class="section-h">Замещение</div>
    <table class="cgrid"><thead><tr><th>Сотрудник</th><th>Замещает</th><th>Период</th><th>Причина</th></tr></thead>
    <tbody>${ABSENCES.map(a=>`<tr><td>${esc(who(a.emp))}</td><td>${esc(who(a.sub))}</td><td>${fmt(a.from)} — ${fmt(a.to)}</td><td>${esc(a.reason)}</td></tr>`).join('')}</tbody></table>
    <div class="section-h">Подразделения — запасной адресат</div>
    <table class="cgrid"><thead><tr><th>Подразделение</th><th>Руководитель</th></tr></thead>
    <tbody>${DEPTS.map(x=>`<tr><td>${esc(x.id)}</td><td>${x.head?esc(who(x.head)):'<span class="pill warn">нет</span>'}</td></tr>`).join('')}</tbody></table>`;
  }
  return `<div class="tabs">${tabBtns}</div>${body}`;
}
function setSettingsTab(k){ state.settingsTab=k; render(); }
function setRollup(kindId, v){ kindOf(kindId).rollup = parseInt(v,10)||1; }
function deactivateKind(kindId){ // демонстрация pk-kind-inactive: снимает активацию, обнуляет createdAt на сегодня минус запас
  const k = kindOf(kindId); k.activatedAt=null; k.createdAt = addDays(state.today, -(INACTIVE_THRESHOLD_D+1));
  toast('Вид деактивирован — демо-условие для «вид повода не введён в действие»','ok'); render();
}
function activateKind(kindId){ kindOf(kindId).activatedAt = state.today; render(); }

function renderRuns(){
  const rows = state.pollRuns.slice().reverse().map(r=>`
    <tr class="${r.complete?'':'over'}">
      <td>${r.id}</td><td>${fmt(r.date)}</td>
      <td>${r.sources.map(s=>`${esc(s.name)}: ${esc(s.answer)}`).join('; ')}</td>
      <td>${r.sources.reduce((a,s)=>a+s.new,0)}</td>
      <td>${r.sources.reduce((a,s)=>a+s.gone,0)}</td>
      <td>${r.sources.reduce((a,s)=>a+s.matched,0)}</td>
      <td>${r.complete ? '<span class="pill ok">полный</span>' : '<span class="pill warn">неполный — молчал источник</span>'}</td>
      <td>${r.sources.some(s=>s.rollup&&s.rollup.length) ? '<span class="pill err">сработал порог</span>' : '—'}</td>
    </tr>`).join('') || '<tr><td colspan="8" class="muted">прогонов ещё не было</td></tr>';
  return `
  ${SOURCES.map(s=>`<label><input type="checkbox" ${state.sourceDown[s.id]?'checked':''} onchange="ZD.toggleDown('${s.id}', this.checked)"> имитировать недоступность источника «${esc(s.name)}»</label>`).join('<br>')}
  <br><label><input type="checkbox" ${state.statCleared?'checked':''} onchange="ZD.toggleStatCleared(this.checked)"> сосед «взыскание» у Статистики перестал молчать</label>
  <div class="btn-row">
    <button class="btn btn-primary btn-sm" onclick="ZD.runPollUI()">Прогнать самоопрос на дату среза (${fmt(state.today)})</button>
  </div>
  <div class="section-h">Журнал прогонов</div>
  <table class="cgrid"><thead><tr><th>№</th><th>Дата</th><th>Ответ источника</th><th>Новых</th><th>Отпавших</th><th>Совпало</th><th>Полнота</th><th>Порог</th></tr></thead>
    <tbody>${rows}</tbody></table>
  <div class="section-h">Поводы (текущий срез)</div>
  <table class="cgrid"><thead><tr><th>Ключ</th><th>Вид</th><th>Состояние</th><th>Дата состояния</th><th>Признаки</th></tr></thead>
    <tbody>${state.povods.slice().reverse().map(p=>`<tr>
      <td class="mono small">${esc(p.key)}</td><td>${esc(kindOf(p.kind).title)}</td>
      <td><span class="pill ${p.status==='gone'?'neutral':p.status==='frozen'?'warn':'ok'}">${p.status}</span></td>
      <td>${fmt(p.stateDate)}${p.approx?' <span class="small">(приблизительно)</span>':''}</td>
      <td class="small">${esc(JSON.stringify(p.traits||{}))}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">пусто</td></tr>'}</tbody></table>
  `;
}
function toggleDown(sourceId, v){ state.sourceDown[sourceId]=v; render(); }
function toggleStatCleared(v){ state.statCleared=v; render(); }
function runPollUI(){ const r=runPoll(); toast(r.complete?`Прогон ${r.id}: множество получено`:`Прогон ${r.id}: источник молчал — заморозка`, r.complete?'ok':'err'); render(); }

function renderNotif(){
  const mine = state.notifications.filter(n=>n.to===state.viewer).slice().reverse();
  return `<table class="cgrid"><thead><tr><th>Дата</th><th>Вид</th><th>Задание</th></tr></thead>
    <tbody>${mine.map(n=>`<tr><td>${fmt(n.t)}</td><td>${esc(n.kind)}${n.due?' <span class="small">срок '+fmt(n.due)+'</span>':''}</td>
      <td>${n.taskId?`<button class="linky" onclick="ZD.openCard('${n.taskId}')">${n.taskId}</button>`:'—'}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">пусто</td></tr>'}</tbody></table>`;
}

function init(){
  if(typeof document==='undefined') return;
  seedState();
  render();
}
if(typeof document!=='undefined') document.addEventListener('DOMContentLoaded', init);

return {
  seed: seedState, get state(){ return state; }, EMP,
  runPoll, claim, reject, releaseTask, reassignTask, acceptDecision, disposeLapsed,
  createFreeTask, issueManual, mkTask, notify,
  requestExtension, decideExtension, addProgress, splitRollup,
  deriveState: displayState, lastEv, isTerminal, outcomeOf, describePovod,
  kindOf, actionOf, ruleForKind, povodByKey, taskOf,
  visibleTo, subordinatesOf, chiefOf, chiefChainIncludes,
  resolveAddressee, curatorOn, actingFor, responsibleNow, dueOf, extensionsOf, approverOf, pendingExtension,
  keyStatus, liveKeys, checkRegistry, taskRows,
  SELF_KINDS, NOTIF_KINDS,
  go, setAsOf, setViewer, openCard, closeCard, renderCardDrawer, render,
  openFreeForm, cancelFree, submitFree, setSettingsTab, setRollup, deactivateKind, activateKind,
  toggleDown, toggleStatCleared, runPollUI, ui,
};
})();
</script>
</body>
</html>
