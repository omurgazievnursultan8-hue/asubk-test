<style>

  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;

}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) var(--text-base)/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);

.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.topbar label{ font:var(--font-label); color:var(--text-muted); margin-right:6px; }
.topbar select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);

.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:18px 24px 60px; max-width:1180px; }

  .app{ flex-direction:column; height:auto; min-height:100vh; }
  .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border-default); }
  .nav{ overflow:visible; }

.view{ display:none; } .view.active{ display:block; }
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.drawer-mask{ position:fixed; inset:0; background:rgba(24,39,57,0.28); z-index:40; }
.drawer{ position:fixed; top:0; right:0; height:100vh; width:min(860px,92vw); z-index:41;

  box-shadow:-10px 0 30px rgba(24,39,57,0.18); display:flex; flex-direction:column; }
.drawer-h{ flex:none; display:flex; align-items:center; gap:12px; padding:14px 20px;
  border-bottom:1px solid var(--border-default); background:var(--surface-card); }
.drawer-h h3{ margin:0; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.drawer-x{ margin-left:auto; background:none; border:none; cursor:pointer; font-size:18px;
  line-height:1; color:var(--text-muted); padding:2px 6px; }
.drawer-x:hover{ color:var(--text-body); }
.drawer-b{ flex:1; overflow:auto; padding:16px 20px 40px; }
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.banner ul{ margin:6px 0 0; padding-left:20px; } .banner li{ margin-bottom:3px; }
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--control-h);

.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-secondary.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-blue); }
.btn-sm{ height:28px; padding:0 9px; font-size:12.5px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:flex-end; }
.rolebar{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }

  background:var(--surface-card); color:var(--text-body);
  font:var(--weight-medium) 12.5px/1.5 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.rolebar button:hover{ background:var(--surface-hover); }
.rolebar button.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint);
  color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.rolebar .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.rolebar .dot.warn{ background:var(--asubk-amber); }
.rolebar .dot.err{ background:var(--asubk-red); }
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:10px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) var(--text-sm)/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line);
  vertical-align:top; color:var(--text-body); }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.hole td{ background:var(--asubk-gray-50); }
table.cgrid tbody tr.over td{ background:var(--status-error-bg); }
table.cgrid tbody tr.focus td{ background:var(--asubk-blue-tint); }
table.cgrid tbody tr.sub td{ background:var(--surface-panel); }

.toast{ background:var(--asubk-ink); color:#fff; padding:10px 14px; border-radius:var(--radius-md);

.toast.err{ background:var(--asubk-red); } .toast.ok{ background:var(--asubk-green); }
</style>

/* ---------- 1. даты: производственный календарь системы (общий справочник, только чтение) ----------
   постоянные праздники КР — ММ-ДД на любой год; переносы, религиозные праздники и рабочие субботы —
   записью на год. Года нет в справочнике — счёт по сб/вс с видимой отметкой рядом со сроком. */
const CALENDAR_FIXED = ['01-01','01-07','02-23','03-08','03-21','04-07','05-01','05-05','05-08','05-09','08-31','11-07','11-08'];
const CALENDAR_YEARS = {
  2026: { holidays:['2026-03-20','2026-03-23','2026-05-27','2026-05-28','2026-08-03','2026-11-09'], workdays:['2026-03-28','2026-11-14'] },
};
function utc(iso){ return new Date(iso+'T00:00:00Z'); }
function addDays(iso,n){ const d=utc(iso); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function calendarYearKnown(y){ return Object.prototype.hasOwnProperty.call(CALENDAR_YEARS, Number(y)); }
function isWork(iso){
  const rec = CALENDAR_YEARS[+iso.slice(0,4)] || {holidays:[], workdays:[]};
  if(rec.workdays.indexOf(iso)!==-1) return true;
  if(CALENDAR_FIXED.indexOf(iso.slice(5))!==-1 || rec.holidays.indexOf(iso)!==-1) return false;
  const wd = utc(iso).getUTCDay(); return wd!==0 && wd!==6;
}
function addMonths(iso,n){ // тот же день через n месяцев; нет такого дня — последний день месяца
  const d=utc(iso), day=d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+n);
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
  d.setUTCDate(Math.min(day, last)); return d.toISOString().slice(0,10);
}
function addWorkdays(iso,n){ let d=iso, c=0; while(c<n){ d=addDays(d,1); if(isWork(d)) c++; } return d; }
function workdaysBetween(a,b){ let d=a, c=0; while(d<b){ d=addDays(d,1); if(isWork(d)) c++; } return c; } // после a по b включительно
function calNote(from, to){ // годы промежутка, которых нет в календаре
  const gap = []; if(!from || !to) return '';
  for(let y=+from.slice(0,4); y<=+to.slice(0,4); y++) if(!calendarYearKnown(y)) gap.push(y);
  return gap.length ? `календарь ${gap.join(', ')} года не заведён — рабочие дни по сб/вс` : '';
}
function fmt(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
const money = n=>Number(n).toLocaleString('ru-RU');

}, k)); }

function ed(from, basis){ return {n:1, from, by:'выпуск 1', basis, release:1}; } // начальные деловые значения ставит выпуск
/* правило — деловая половина вида: поля прода меняются только новой редакцией с датой начала и основанием;
   редакция хранит свои значения, поля правила — значения редакции, действующей на сегодня */
const PROD_FIELDS = ['dueN','controller','importance','author','rollup','mode'];
const FIELD_TITLE = {dueN:'срок', controller:'контролёр', importance:'важность', author:'автор', rollup:'свёртка', mode:'режим'};
const IMPORTANCE = ['высокая','средняя','низкая'];
const startOf = e=>e.n===1 ? '' : e.from; // начальные значения действуют с появления правила
const byFrom = (a,b)=>startOf(a)<startOf(b) ? -1 : startOf(a)>startOf(b) ? 1 : a.n-b.n;
function editionOn(r, d){ return r.editions.filter(e=>!e.cancelled && startOf(e)<=d).sort(byFrom).pop(); }
function pendingEdition(r){ return r.editions.find(e=>!e.cancelled && !e.release && e.from>state.today) || null; }
function applyEditions(d){ state.rules.forEach(r=>{ const e = editionOn(r, d); PROD_FIELDS.forEach(f=>{ r[f] = e.values[f]; }); r.edN = e.n; }); }
function ruleById(id){ return state.rules.find(r=>r.id===id); }
function editRule(ruleId, changes, o){
  o = o || {};
  const r = ruleById(ruleId);
  if(!r) throw new Error('правила нет');
  if(!isTasksAdmin(o.by)) throw new Error('правит администратор заданий — остальным реестры на чтение');
  if(!o.basis) throw new Error('нужно основание правки — приказ или служебная записка');
  const from = o.from || state.today;
  if(from < state.today) throw new Error('дата начала — сегодня или будущая: задним числом правило не меняется');
  const k = kindOf(r.kind), cur = editionOn(r, state.today), v = Object.assign({}, cur.values);
  const num = (x, what)=>{ const n = parseInt(x,10); if(!(n>=1) || String(n)!==String(x).trim()) throw new Error(`${what} — целое число больше нуля`); return n; };
  Object.keys(changes).forEach(f=>{
    const x = changes[f];
    if(f==='threshold') throw new Error('порог появления повода — настройка соседа, не правила');
    if(PROD_FIELDS.indexOf(f)===-1) throw new Error(`«${f}» меняется выпуском`);
    if(f==='dueN'){ if(r.dueUnit==='named') throw new Error('срок этого правила называет владелец — не настраивается');
      v.dueN = r.dueUnit==='beforeDate' && String(x).trim()==='0' ? 0 : num(x, 'срок'); } // «за N к.д. до даты» — и в самый день
    else if(f==='rollup') v.rollup = x==null || x==='' ? null : num(x, 'порог свёртки');
    else if(f==='importance'){ if(x && IMPORTANCE.indexOf(x)===-1) throw new Error('важность — высокая, средняя или низкая'); v.importance = x || null; }
    else if(f==='controller'){ if(x && x!=='автор' && !postOf(x)) throw new Error('контролёр — автор правила или должность'); v.controller = x || null; }
    else if(f==='author'){ if(!postOf(x)) throw new Error('автор правила — должность бизнес-владельца'); v.author = x; }
    else if(f==='mode'){
      if(['авто','ручной'].indexOf(x)===-1) throw new Error('режим — авто или ручной');
      if(x!==v.mode && k.genus!=='надзор') throw new Error(`у вида рода «${k.genus}» режим всегда авто`);
      v.mode = x;
    }
  });
  if(!PROD_FIELDS.some(f=>v[f]!==cur.values[f])) throw new Error('значения не изменились');
  const pend = pendingEdition(r);
  if(pend && from===state.today) throw new Error(`ждёт редакция ${pend.n} с ${fmt(pend.from)} — отмените или замените её будущей`);
  if(pend) pend.cancelled = {t:state.today, by:o.by, basis:'заменена редакцией '+(r.editions.length+1)};
  const e = {n:r.editions.length+1, from, by:o.by, basis:o.basis, values:v, was:cur.n};
  r.editions.push(e);
  applyEditions(state.today);
  return e;
}
function cancelEdition(ruleId, n, by, basis){ // ожидающая редакция отменяется до своей даты
  const r = ruleById(ruleId), e = r && r.editions.find(x=>x.n===n);
  if(!isTasksAdmin(by)) throw new Error('правит администратор заданий — остальным реестры на чтение');
  if(!e || e!==pendingEdition(r)) throw new Error('отменить можно только ожидающую редакцию');
  if(!basis) throw new Error('нужно основание отмены');
  e.cancelled = {t:state.today, by, basis};
  return e;
}
/* выпуск правит только свои поля — тоже новой редакцией; деловые значения берёт из действующей редакции прода */
const RELEASE_FIELDS = ['addressee','dueUnit','dueFrom','extendBy','dueBase','ownDue','dueSource'];
function releaseRule(ruleId, no, fields){
  const r = ruleById(ruleId);
  Object.keys(fields).forEach(f=>{ if(RELEASE_FIELDS.indexOf(f)===-1) throw new Error(`«${f}» — поле прода, выпуск его не правит`); });
  Object.assign(r, fields);
  const e = {n:r.editions.length+1, from:state.today, by:'выпуск '+no, basis:'выпуск '+no, release:no,
    values:Object.assign({}, editionOn(r, state.today).values), fields:Object.keys(fields)};
  r.editions.push(e);
  applyEditions(state.today);
  return e;
}
/* выданное держит снимок правила на момент выдачи: срок, автор, контролёр задним числом не двигаются */
const SNAP_FIELDS = PROD_FIELDS.concat(['edN','dueUnit','extendBy','dueBase','ownDue','dueSource','dueFrom']);
function snapOf(rule){ const s = {}; SNAP_FIELDS.forEach(f=>{ s[f] = rule[f]===undefined ? null : rule[f]; }); return s; }
function ruleAsIssued(t){ const r = ruleById(t.ruleId); return t.snap ? Object.assign({}, r, t.snap) : r; }
/* контролёр правила: автор правила или держатель должности; нет — подтверждает отпадение повода */
function controllerOf(rule, author){
  const c = rule.controller; if(!c) return null;
  if(c==='автор') return author || authorOn(rule.author, state.today).emp;
  return postHolderOn(c, state.today) || ADMIN;
}

/* обязательство на дату: сдано (в срок / с опозданием) окончательным выпуском, снято с расписания, иначе ожидается или просрочено;
   «срок близко» — отметка отчётности по её настройке «напоминать за N к.д. до срока» */
function repSoonDays(){ return state.neighborSet.rp.soonDays; }
function obligationAt(o, d){
  if(!o || !o.ev.length || o.ev[0].t>d) return null;
  const s = {id:o.id, form:o.form, dept:o.dept, deptName:o.deptName, period:o.period, due:o.due, role:o.role, issued:null, removed:null, last:null};
  for(const e of byDate(o.ev)){ if(e.t>d) continue; if(e.issue && !s.issued) s.issued=e; if(e.removed && !s.removed) s.removed=e; s.last=e; }
  s.state = s.removed ? 'снято' : s.issued ? (s.issued.t<=o.due ? 'сдано' : 'сдано с опозданием') : d>o.due ? 'просрочено' : 'ожидается';
  s.soon = s.state==='ожидается' && daysBetween(d, o.due)<=repSoonDays();
  return s;
}
function repIssue(id, by){ // демо отчётности: окончательный выпуск с получателем закрывает обязательство
  const o = ownerObj('rp', id), s = obligationAt(o, state.today);
  if(!s || s.issued || s.removed) throw new Error('обязательство уже закрыто');
  const r = o.role && roleOf(o.role);
  if(!r || r.holders.indexOf(by)===-1) throw new Error('окончательно выпускает подразделение, за которым обязательство');
  o.ev.push({t:state.today, issue:true, by, how:'окончательный выпуск с получателем'});
}

ZL_STEPS.forEach(x=>{ OWNER_CFG[x.id].objectType = x.objectType; });
/* атрибуция отпадения: кто и что сделал у владельца; снятие — причина от владельца */
function appearedOn(p){
  for(let i=p.journal.length-1;i>=0;i--) if(p.journal[i].ev==='появился' || p.journal[i].ev==='вновь-появился') return p.journal[i].t;
  return p.firstSeen;
}
function doneEvent(o, asOf, from, pred){ // последнее событие владельца с даты появления повода, которое сделало шаг
  let hit = null;
  o.ev.forEach(e=>{ if(e.t>=from && e.t<=asOf && pred(e) && (!hit || e.t>=hit.t)) hit = e; });
  return hit;
}
function goneReason(o, asOf){ const del = o && o.ev.find(e=>e.deleted && e.t<=asOf); return del ? del.how : 'объект удалён у владельца'; }
function ownerAttrib(kindId, p, asOf){
  const cfg = OWNER_CFG[kindId], o = ownerObj(cfg.src, p.ownerId||p.objectId), s = stateAt(cfg.src, o, asOf);
  if(!s) return {cancel:goneReason(o, asOf)};
  if(kindId==='lp-expiring' && OWNER_CFG['lp-expired'].when(s, asOf)) return {cancel:'перешло в истёкший'};
  if(cfg.attrib) return cfg.attrib(s, p, asOf);
  if(cfg.done){
    const e = doneEvent(o, asOf, appearedOn(p), x=>cfg.done(x, p));
    return e ? {by:e.by, for:e.for, how:e.how} : {cancel:(cfg.cancel && cfg.cancel(s, asOf, p)) || s.last.how};
  }
  return {by:s.last.by, how:s.last.how};
}
/* задание эскалации к тому, кто вправе решить: отпадает вместе с просроченным шагом — по событию владельца */
function escAttrib(p, asOf){
  const base = taskOf(p.objectId), bp = povodByKey(base.povodKey), cfg = OWNER_CFG[base.originKind];
  const o = ownerObj(cfg.src, bp.ownerId||bp.objectId), s = stateAt(cfg.src, o, asOf);
  if(!s) return {cancel:goneReason(o, asOf)};
  const e = doneEvent(o, asOf, appearedOn(p), kindOf(base.originKind).escalate.done);
  return e ? {by:e.by, how:e.how} : {cancel:s.last.how};
}

/* действия в карточке у владельца (демо соседа): шаги согласования и два узких действия Согласующего */
const OWNER_STEPS = {
  'отправить на рассмотрение': {from:['Черновик','На доработке'], to:()=>'На рассмотрении', who:'автор'},
  'одобрить':                  {from:['На рассмотрении'], to:()=>'Действует', who:'согласующий'},
  'отклонить':                 {from:['На рассмотрении'], to:src=>src==='gd'?'Отклонён':'Отклонена', who:'согласующий'},
  'вернуть на доработку':      {from:['На рассмотрении'], to:()=>'На доработке', who:'согласующий'},
  'закрыть':                   {from:['Действует'], to:src=>src==='gd'?'Закрыт':'Закрыта', who:'согласующий'},
  'вернуть на рассмотрение':   {from:['Закрыт','Закрыта','Отклонён','Отклонена'], to:()=>'На рассмотрении', who:'администратор'},
};
const OWNER_ROLE = {gd:'gd-approver', lp:'lp-approver'};
function holds(roleId, who){ const r=roleOf(roleId); return !!r && r.holders.indexOf(who)!==-1; }
function ownerStep(src, id, by, step){
  const o = ownerObj(src, id), s = objAt(o, state.today), st = OWNER_STEPS[step];
  if(!s || !st) throw new Error('объекта или действия нет');
  if(st.from.indexOf(s.status)===-1) throw new Error(`«${step}» недоступно в статусе «${s.status}»`);
  if(st.who==='автор' && by!==s.author) throw new Error('отправляет автор');
  if(st.who==='согласующий'){
    if(!holds(OWNER_ROLE[src], by)) throw new Error('это действие Согласующего');
    if(src==='lp' && step!=='закрыть' && by===s.author) throw new Error('свою программу автор не рассматривает');
  }
  if(st.who==='администратор' && by!==ADMIN) throw new Error('возвращает администратор');
  o.ev.push({t:state.today, status:st.to(src), by, how:step});
}
function lpExtend(id, by, newTo, reason){ // «Продлить срок»: только «Дата по», статус не меняется
  const o = ownerObj('lp', id), s = objAt(o, state.today);
  if(!s) throw new Error('программы нет');
  if(!holds('lp-approver', by)) throw new Error('продлевает Согласующий');
  if(s.status!=='Действует') throw new Error('продлить можно только действующую программу');
  if(!newTo || newTo<s.dateFrom || (s.dateTo && newTo<=s.dateTo)) throw new Error('новая «Дата по» должна быть позже прежней');
  if(!reason) throw new Error('нужны причина и реквизиты основания продления');
  o.ev.push({t:state.today, dateTo:newTo, by, how:'срок продлён до '+fmt(newTo), reason});
}
function lpChangeBase(id, by, gdId, reason){ // «Сменить основание»: только ссылка на госрешение
  const o = ownerObj('lp', id), s = objAt(o, state.today), g = ownerAt('gd', gdId, state.today);
  if(!s) throw new Error('программы нет');
  if(!holds('lp-approver', by)) throw new Error('основание меняет Согласующий');
  if(s.status!=='Действует') throw new Error('сменить основание можно только у действующей программы');
  if(!g || g.status!=='Действует') throw new Error('новое основание — только действующее госрешение');
  if(gdId===s.base) throw new Error('это прежнее основание');
  if(s.dateFrom < g.date) throw new Error('«Дата с» программы раньше даты нового решения');
  if(!reason) throw new Error('нужны причина и реквизиты');
  o.ev.push({t:state.today, base:gdId, by, how:'основание сменено на '+gdId, reason});
}
function gdAttachDoc(id, by){ // «Приложить основной документ» в «Действует» без смены статуса
  const o = ownerObj('gd', id), s = objAt(o, state.today);
  if(!s) throw new Error('госрешения нет');
  if(s.status!=='Действует') throw new Error('документ прикладывается к действующему решению');
  if(s.doc) throw new Error('основной документ уже приложен');
  if(by!==(s.author || ADMIN)) throw new Error('прикладывает автор решения, без автора — администратор');
  o.ev.push({t:state.today, doc:true, by, how:'приложен основной документ'});
}
/* действия в карточке заявки (демо соседа): специалист заявки, ГФ, отдел, комиссия */
function apActorOk(s, by){ // специалист заявки на дату или его замещающий; без закрепления — автор заявки
  const c = apSpecOn(s, state.today) || s.author;
  return by===c || actingFor(c, state.today)===by;
}
function apStep(id, by, step, arg, reason){
  const o = ownerObj('ap', id), d = state.today, s = objAt(o, d);
  if(!s) throw new Error('заявки нет');
  const st = s.status, draft = AP_DRAFT.includes(st);
  const need = (c, msg)=>{ if(!c) throw new Error(msg); };
  const spec = ()=>need(apActorOk(s, by), 'это действие специалиста заявки');
  const role = r=>need(holds(r, by), `это действие роли «${roleOf(r).name}»`);
  let e;
  if(step==='передать на подтверждение ГФ'){
    spec(); need(draft && !s.gf, 'комплект уже у ГФ или подтверждён');
    e = {gf:'handed', how:'комплект проверен специалистом, передан на подтверждение ГФ'};
  } else if(step==='подтвердить комплект'){
    role('ap-gf'); need(draft && s.gf==='handed', 'подтверждать нечего');
    e = {gf:'confirmed', how:'комплект подтверждён ГФ'};
  } else if(step==='внести заключение'){
    need(AP_DEPTS[arg] && s.depts.includes(arg), 'отдел не назначен'); role(AP_DEPTS[arg].role);
    need(draft && s.gf==='confirmed' && !s.concl[arg], 'заключение вносится после подтверждения ГФ, одно на отдел');
    e = {concl:arg, how:'внесено заключение: '+AP_DEPTS[arg].name};
  } else if(step==='отправить в комиссию'){
    spec(); need(draft && s.gf==='confirmed' && s.depts.every(k=>s.concl[k]), 'комплект не подтверждён ГФ или внесены не все заключения');
    e = {status:'На рассмотрении', how:'отправлено в комиссию'};
  } else if(step==='вынести на заседание' || step==='запросить замену'){
    role('ap-commission'); need(st==='На рассмотрении' && s.phase==='prelim', 'действие предварительного изучения');
    e = step==='вынести на заседание'
      ? {phase:'session', session:addWorkdays(d, 5), deadline:addWorkdays(d, 3), how:'вынесено на заседание комитета'}
      : {status:'Требуется доп. информация', gfReset:true, conclReset:true, how:'запрошена замена документа — возврат на дозаполнение'};
  } else if(step==='проголосовать'){
    need(st==='На рассмотрении' && s.phase==='session', 'голосуют на заседании');
    need(s.com.members.indexOf(by)!==-1, 'голосует член комиссии'); need(!s.votes[by], 'голос уже подан');
    e = {vote:by, how:'проголосовал: '+(arg||'одобрить')};
  } else if(step==='одобрить' || step==='отклонить' || step==='вернуть'){
    need(st==='На рассмотрении' && s.phase==='session', 'решение выносится на заседании'); need(by===s.com.chair, 'решение выносит председатель');
    const n = Object.keys(s.votes).length;
    need(n>=quorumOf(s), `кворум не набран: проголосовало ${n} из ${s.com.members.length}, требуется ${quorumOf(s)}`);
    e = step==='одобрить' ? {status:'Одобрена', how:'одобрено комиссией'} : step==='отклонить' ? {status:'Отклонена', how:'отклонено комиссией'}
      : {status:'Требуется доп. информация', gfReset:true, conclReset:true, how:'возвращено комиссией на дозаполнение'};
  } else if(step==='отклонить за неустранение недостатков'){
    role('ap-commission'); need(st==='Требуется доп. информация', 'так отклоняется заявка, возвращённая на дозаполнение'); need(reason, 'нужна причина');
    e = {status:'Отклонена', how:'отклонено за неустранение недостатков', reason};
  } else if(step==='сменить программу'){
    spec(); need(st!=='На рассмотрении', 'на рассмотрении программу не сменить — сначала возврат комиссией');
    need(draft, 'программа меняется в «Новый» и «Требуется доп. информация»');
    need(arg && arg!==s.program, 'выберите другую программу'); need(programAccepts(arg, d), 'новая программа должна принимать заявки');
    need(reason, 'нужна причина');
    e = {program:arg, how:'программа сменена на '+arg, reason};
  } else if(step==='отозвать'){
    spec(); need(st==='На рассмотрении' || st==='Требуется доп. информация', 'отозвать можно на рассмотрении или на дозаполнении');
    e = {status:'Отозвана', how:'отозвано специалистом'};
  } else if(step==='удалить'){
    spec(); need(st==='Новый', 'удаляется только «Новый»');
    e = {deleted:true, how:'заявка удалена'};
  } else if(step==='сформировать кредит'){
    spec(); need(st==='Одобрена', 'кредит формируется по одобренной заявке');
    need(programAccepts(s.program, d), 'программа не принимает заявки — кредит не формируется');
    e = s.flow==='B' ? {status:'Ожидает решения/программы', how:'кредит сформирован — ждёт привязки решения и программы'}
      : {status:'На оформлении', how:'кредит сформирован, договоры на регистрации'};
  } else if(step==='привязать решение и программу'){
    spec(); need(st==='Ожидает решения/программы', 'привязка — после формирования кредита');
    const lp = arg || s.program; need(programAccepts(lp, d), 'программа должна принимать заявки');
    e = {status:'На оформлении', program:lp, how:'привязаны решение и программа '+lp};
  } else if(step==='зарегистрировать договоры'){
    spec(); need(st==='На оформлении', 'договоры регистрируются на оформлении');
    e = {status:'Оформлена', how:'договоры зарегистрированы'};
  } else if(step==='заменить документ'){
    spec(); need(apExpiredDocs(s, d).some(x=>x.name===arg), 'просроченного документа нет');
    e = {renewed:arg, how:`заменён документ «${arg}»`};
  } else throw new Error('такого действия у заявки нет');
  o.ev.push(Object.assign({t:d, by}, e));
}
/* действия в карточке документа (демо соседа): автор, согласующий, подписант, регистратор, получатель,
   исполнитель резолюции, контролёр, архивариус; кто действует за кого — пишет сам документ */
function docStep(id, by, step, arg, reason){
  const o = ownerObj('doc', id), d = state.today, s = docAt(o, d);
  if(!s) throw new Error('документа нет');
  const need = (c, msg)=>{ if(!c) throw new Error(msg); };
  const forWho = who=>who!==by ? {for:who} : {};
  const execRecipient = ()=>s.recipients.find(x=>x.mode==='исполнение' && (x.emp===by || actingFor(x.emp, d)===by) && !s.reviewed[x.emp]);
  let e;
  if(step==='на согласование'){
    need(by===s.author, 'отправляет автор'); need(s.stage==='Черновик', 'отправляется черновик');
    e = s.approvers.length ? {stage:'Согласование', how:'отправлен на согласование'} : {stage:'Подпись', how:'отправлен на подпись'};
  } else if(step==='согласовать' || (step==='отказать' && s.stage==='Согласование')){
    need(s.stage==='Согласование', 'документ не на согласовании');
    const who = s.approvers.find(a=>(a===by || actingFor(a, d)===by) && !s.approved[a]);
    need(who, 'согласует названный согласующий или его замещающий');
    if(step==='отказать') need(reason, 'нужен комментарий отказа');
    e = Object.assign(step==='согласовать' ? {approve:true, how:'согласовал'} : {refuse:reason, how:'отказал: '+reason}, forWho(who));
  } else if(step==='подписать' || step==='отказать'){
    need(s.stage==='Подпись' && !s.signed, 'документ не ждёт подписи');
    need(by===s.signer || signerOn(s.signer, d)===by, 'подписывает подписант или замещающий по приказу с правом подписи');
    if(step==='отказать') need(reason, 'нужен комментарий отказа');
    e = Object.assign(step==='подписать' ? {sign:true, how:by===s.signer ? 'подписал' : 'подписал по приказу о замещении с правом подписи'}
      : {refuse:reason, how:'отказал: '+reason}, forWho(s.signer));
  } else if(step==='зарегистрировать'){
    need(holds('doc-registrar', by), 'это действие роли «Регистратор»'); need(s.stage==='Подпись' && !!s.signed, 'регистрируется подписанный документ');
    const n = (s.kind==='исх' ? 'Исх-' : s.kind==='вх' ? 'Вх-' : 'Пр-') + nextId('');
    e = {register:n, how:'зарегистрирован, № '+n};
  } else if(step==='отметить отправку'){
    need(holds('doc-registrar', by), 'отправку отмечает регистратор'); need(s.kind==='исх' && s.stage==='Зарегистрирован', 'отправляется зарегистрированный исходящий');
    need(arg && s.addressees.includes(arg) && !s.sent[arg], 'адресат не выбран или ему уже отправлено');
    e = {send:arg, how:'отправлено: '+arg};
  } else if(step==='дать резолюцию'){ // arg: {resp, co, due, text, parent}
    const a = arg || {};
    need(s.kind!=='исх' && s.stage==='Зарегистрирован', 'резолюцию дают по зарегистрированному входящему или внутреннему');
    need(a.resp && emp(a.resp), 'нужен ответственный'); need(a.due && a.due>=d, 'нужен срок не раньше сегодняшнего');
    let author;
    if(a.parent){ // каскад: срок ниже — не позже ДЕЙСТВУЮЩЕГО срока резолюции выше, его документ читает у заданий
      const pr = s.res[a.parent]; need(pr && pr.state==='open', 'резолюция выше не в работе');
      need(by===pr.resp || actingFor(pr.resp, d)===by, 'резолюцию ниже даёт исполнитель резолюции выше');
      const st = stepByKey(resKey(pr, pr.resp)), lim = st ? st.setDue : pr.due;
      need(a.due<=lim, `срок не позже действующего срока резолюции выше — ${fmt(lim)}`+(st && st.extensions ? ' (с продлением)' : ''));
      author = pr.resp;
    } else { const r = execRecipient(); need(r, 'резолюцию даёт получатель документа'); author = r.emp; }
    const rid = 'R-'+nextId('');
    e = Object.assign({resolution:{id:rid, resp:a.resp, co:a.co||[], due:a.due, text:a.text||'Исполнить', parent:a.parent||null,
      control:a.parent ? null : s.control}, how:'дана резолюция '+rid}, forWho(author));
  } else if(step==='к сведению'){
    const r = execRecipient(); need(s.stage==='Зарегистрирован' && r, 'отметку ставит получатель документа');
    e = Object.assign({info:true, how:'к сведению'}, forWho(r.emp));
  } else if(step==='исполнено' || step==='отказать в исполнении'){
    const r = s.res[arg]; need(r && r.state==='open', 'резолюция не в работе');
    need(by===r.resp || actingFor(r.resp, d)===by, 'исход ставит ответственный резолюции или его замещающий');
    need(reason, step==='исполнено' ? 'нужен текст результата' : 'нужно основание отказа');
    if(step==='исполнено') need(!(s.requiresAnswer && !r.parent), 'документ требует ответа — поручение гаснет отправкой ответного исходящего');
    e = Object.assign(step==='исполнено' ? {resDone:arg, text:reason, how:'отмечено «Исполнено»: '+reason}
      : {resRefuse:arg, text:reason, how:'отказано в исполнении: '+reason}, forWho(r.resp));
  } else if(step==='подтвердить' || step==='вернуть'){
    const r = s.res[arg]; need(r && r.state==='control', 'исполнение не ждёт контролёра');
    need(by===r.control || actingFor(r.control, d)===by, 'решает контролёр или его замещающий');
    if(step==='вернуть') need(reason, 'нужен комментарий');
    e = Object.assign(step==='подтвердить' ? {ctrl:arg, ok:true, how:'контролёр подтвердил исполнение'} : {ctrl:arg, ok:false, how:'контролёр вернул: '+reason}, forWho(r.control));
  } else if(step==='ознакомлен'){
    need(DOC_LIVE.includes(s.stage) && s.recipients.some(x=>x.mode==='ознакомление' && x.emp===by) && !s.acq[by], 'знакомится получатель документа — лично');
    e = {acq:true, how:'ознакомлен'};
  } else if(step==='сдать в дело'){
    need(holds('doc-archivist', by) || holds('doc-registrar', by), 'в дело сдаёт архивариус или регистратор');
    need(s.stage==='Зарегистрирован' && docExecDone(s), 'исполнение и отправка не закончены');
    e = {file:arg||'по типу', how:'сдан в дело'+(arg ? ' '+arg : '')};
  } else if(step==='оригинал возвращён'){
    need(holds('doc-archivist', by) || holds('doc-registrar', by), 'возврат отмечает архивариус или регистратор');
    const i = s.issues[arg]; need(i && !i.returned, 'оригинал не выдан');
    e = {returned:arg, by:i.to, marked:by, how:'оригинал возвращён'};
  } else if(step==='аннулировать'){
    need(holds('doc-registrar', by), 'аннулирует регистратор'); need(s.stage==='Зарегистрирован', 'аннулируется зарегистрированный документ');
    need(!Object.keys(s.sent).length, 'документ уже отправлен адресату'); need(reason, 'нужно основание');
    e = {annul:reason, how:'аннулирован: '+reason};
  } else if(step==='удалить'){
    need(by===s.author, 'удаляет автор'); need(s.stage==='Черновик' && !s.number, 'удаляется черновик без номера');
    e = {deleted:true, how:'черновик удалён'};
  } else throw new Error('такого действия у документа нет');
  o.ev.push(Object.assign({t:d, by}, e));
}
/* действия в карточке имущества (демо соседа): специалист вводит факт, начальник Управления публикует вторым ключом,
   бухгалтер отмечает деньги; задания видят только опубликованное — на следующем опросе */
const IM_KEY2 = ['act','registered']; // факты, которые действуют с публикации
const IM_STAFF = id=>{ const e = emp(id); return !!e && e.dept==='Управление по работе с активами'; };
const IM_STEPS = {
  imo:{
    'промежуточное письмо': {who:'специалист', ok:s=>s.open && !s.answer, ev:()=>({answer:'промежуточное письмо', how:'промежуточное письмо источнику: рассматриваем'})},
    'акт по позиции':       {who:'специалист', ok:(s,n)=>s.pos[n] && s.pos[n].outcome==='принята' && !s.pos[n].act, ev:n=>({act:n, draft:true, how:`акт приёма-передачи по позиции ${n} подготовлен — ждёт второго ключа`})},
    'отзыв позиции':        {who:'специалист', ok:(s,n)=>s.pos[n] && !IM_OUT.includes(s.pos[n].outcome) && !s.pos[n].act, ev:n=>({withdraw:n, how:`позиция ${n} отозвана источником`})},
  },
  ima:{
    'осмотр':               {who:'специалист', ok:s=>IM_ON.includes(s.status), ev:()=>({inspection:true, how:'акт осмотра внесён'})},
    'регистрация права':    {who:'специалист', ok:s=>s.status==='принят, ждёт регистрации', ev:()=>({registered:true, draft:true, how:'регистрация права внесена — ждёт второго ключа'})},
    'открыть попытку':      {who:'специалист', ok:s=>s.status==='на учёте', ev:(a, s)=>({attempt:s.attempts+1, how:`попытка продажи ${s.attempts+1} открыта`})},
    'попытка не состоялась':{who:'специалист', ok:s=>s.open, ev:(a, s)=>({attemptEnd:'не состоялась', how:`попытка ${s.attempts} не состоялась`})},
    'продлить обременение': {who:'специалист', ok:s=>!!s.enc, ev:(to, s)=>({enc:{kind:s.enc.kind, to}, how:`обременение «${s.enc.kind}» продлено до ${fmt(to)}`})},
    'требование погашено':  {who:'специалист', ok:s=>!!s.claim && s.claim.rest>0, ev:(sum, s)=>({claimPaid:Math.min(+sum||s.claim.rest, s.claim.rest), how:`требование погашено: ${Math.min(+sum||s.claim.rest, s.claim.rest)} (ссылка на поступление)`})},
    'доплата исполнена':    {who:'бухгалтер', ok:s=>!!s.topup && !s.topup.paid, ev:(a, s)=>({topupPaid:true, how:`Возврат ${s.topup.amount} отчуждателю исполнен в Платежах`})},
    'платёж зачислен':      {who:'бухгалтер', ok:s=>!!s.contract && s.contract.active, ev:(a, s)=>({paid:s.contract.firstUnpaid, how:`оплата по ${s.contract.id} за ${fmt(s.contract.firstUnpaid)} зачислена`})},
  },
};
function imDrafts(o, d){ // черновики, которые ещё не опубликованы
  const live = byDate(o.ev).filter(e=>e.t<=d);
  return live.filter(e=>e.draft && !live.some(x=>!x.draft && x.t>=e.t && IM_KEY2.some(k=>e[k]!==undefined && x[k]===e[k])));
}
function imStep(src, id, by, step, arg){
  const o = ownerObj(src, id), s = stateAt(src, o, state.today), d = state.today;
  if(!s) throw new Error('объекта нет');
  if(step==='опубликовать'){ // второй ключ: начальник Управления публикует последний неопубликованный черновик
    if(by!=='E24') throw new Error('публикует начальник Управления — второй ключ');
    const dr = imDrafts(o, d).pop();
    if(!dr) throw new Error('публиковать нечего');
    const e = Object.assign({}, dr, {t:d, by:dr.by, pubBy:by, how:dr.how.replace(' — ждёт второго ключа', '')+' — опубликовано'}); delete e.draft;
    o.ev.push(e); return;
  }
  const st = (IM_STEPS[src]||{})[step];
  if(!st) throw new Error('такого действия у объекта нет');
  if(st.who==='специалист' && !IM_STAFF(by)) throw new Error('факт вводит специалист по имуществу');
  if(st.who==='бухгалтер' && by!=='E25') throw new Error('деньги отмечает бухгалтер — в Платежах');
  if(!st.ok(s, arg)) throw new Error(`«${step}» недоступно: ${s.status}`);
  o.ev.push(Object.assign({t:d, by}, st.ev(arg, s)));
}
/* действия в карточке кредита (демо соседа): уведомление заёмщику по строке графика — куратор кредита, его замещающий
   или руководитель; платёж по строке отмечает бухгалтер в Платежах */
function crNoticeError(id, by, date){
  const d = state.today, s = creditAt(ownerObj('cr', id), d), cur = curatorOn('куратор кредита', id, d);
  if(!s) return 'кредита нет';
  if(!s.schedule.some(r=>r.date===date)) return 'в графике нет строки на эту дату';
  if(s.paid[date]) return `платёж ${fmt(date)} уже внесён`;
  if(s.notices[date]) return `${id}: заёмщик о платеже ${fmt(date)} уже уведомлён`;
  if(date<=d) return 'срок платежа наступил — уведомлять поздно';
  if(!cur || !(by===cur || by===actingFor(cur, d) || by===chiefOf(cur))) return 'уведомляет куратор кредита, его замещающий или руководитель';
  return null;
}
function crStep(id, by, step, date){
  const o = ownerObj('cr', id), d = state.today, s = creditAt(o, d);
  if(!s) throw new Error('кредита нет');
  if(step==='уведомить'){
    const err = crNoticeError(id, by, date); if(err) throw new Error(err);
    o.ev.push({t:d, notice:date, by, how:`уведомление заёмщику о платеже ${fmt(date)} отправлено`});
  } else if(step==='платёж'){
    if(by!=='E25') throw new Error('платёж отмечает бухгалтер — в Платежах');
    if(!s.schedule.some(r=>r.date===date) || s.paid[date]) throw new Error('строки нет или платёж уже внесён');
    o.ev.push({t:d, paid:date, by, how:`платёж по графику ${fmt(date)} зачислен`+(d<date ? ' досрочно' : '')});
  } else throw new Error('такого действия у кредита нет');
}
/* уведомление по выбранным платежам вала — одно действие, запись в карточку каждого кредита отдельно */
function crNoticeBatch(keys, by){
  const ps = keys.map(k=>povodByKey(k)).filter(p=>p && p.status!=='gone');
  if(!ps.length) throw new Error('выберите платежи');
  const err = ps.map(p=>crNoticeError(p.objectId, by, p.sub)).find(Boolean); if(err) throw new Error(err);

const ZL_FACTS = {

function log(entity, ev, extra){ entity.journal.push(Object.assign({t:state.today, ev}, extra||{})); }
function taskOf(id){ return state.tasks.find(t=>t.id===id); }
function povodByKey(k){ return state.povods.find(p=>p.key===k); }
/* события, которые состояние не меняют: ход, продление, судьба ключа внутри вала */
const NEUTRAL_EV = ['отметка о ходе','запрошено продление','продление утверждено','продление отклонено','ключ отпал','ключ вышел',
  'повод отпал','ключ добавлен']; // «повод отпал» — ось подтверждения у задания, которое ждёт решения контролёра
function stateEntry(t){
  for(let i=t.journal.length-1;i>=0;i--) if(NEUTRAL_EV.indexOf(t.journal[i].ev)===-1) return t.journal[i];
  return t.journal[0];
}
function lastEv(t){ // переадресация и переназначение возвращают задание в «поручено»
  const ev = stateEntry(t).ev;
  return (ev==='переадресовано' || ev==='переназначено') ? 'поручено' : ev;
}
function isTerminal(t){ return lastEv(t)==='закрыто'; }
function outcomeOf(t){ if(!isTerminal(t)) return null; const e=stateEntry(t); return {outcome:e.outcome, reason:e.reason||null, by:e.by||null}; }

/* срок: установленный — последний утверждённый; первоначальный — t.dueDate */
function dueOf(t){ let d=t.dueDate; t.journal.forEach(e=>{ if(e.ev==='продление утверждено') d=e.newDue; }); return d; }
function extensionsOf(t){ return t.journal.filter(e=>e.ev==='продление утверждено').length; }
function approverOf(t){ return t.approver || t.controller || t.author; } // утверждающего продление может назвать повод (автор резолюции)
function pendingExtension(t){
  for(let i=t.journal.length-1;i>=0;i--){
    const ev=t.journal[i].ev;
    if(ev==='запрошено продление') return t.journal[i];
    if(ev==='продление утверждено' || ev==='продление отклонено') return null;
  }
  return null;
}

/* вал: судьба каждого ключа — по последней записи журнала вала об этом ключе */
function keyStatus(t, key){
  for(let i=t.journal.length-1;i>=0;i--){
    const e=t.journal[i];
    if(e.key===key && e.ev==='ключ добавлен') return 'жив'; // вернувшийся повод снова в «решить»
    if(e.key===key && e.ev==='ключ отпал') return 'отпал';
    if(e.key===key && e.ev==='ключ вышел') return 'вышел';
  }
  return 'жив';
}
function liveKeys(t){ return (t.rollupKeys||[]).filter(k=>keyStatus(t,k)==='жив'); }
function coversKey(t, key){
  if(isTerminal(t)) return false;
  if(t.povodKey===key) return true;
  return Array.isArray(t.rollupKeys) && t.rollupKeys.indexOf(key)!==-1 && keyStatus(t,key)==='жив';
}

/* ---------- 4. уведомления: закрытый список, только о задании ---------- */
const NOTIF_KINDS = ['повод-появился','поручено','принято','срок-близко','срок-истёк','эскалация','возвращено','повод-отпал','закрыто',
  'переадресовано','запрошено-продление','решение-по-продлению'];
function notify(taskOrPovod, kind, to, due){
  if(NOTIF_KINDS.indexOf(kind)===-1) throw new Error('уведомление вне закрытого списка: '+kind);
  const taskId = taskOrPovod.id && taskOrPovod.id[0]==='T' ? taskOrPovod.id : (taskOrPovod.taskRef||null);
  if(!to && !taskOrPovod.assignee && taskOrPovod.queue){ // очередь, которую никто не взял, — всем носителям роли
    queueHolders(taskOrPovod).forEach(h=>state.notifications.push({id:nextId('N'), t:state.today, kind, taskId, to:h, due:due||null}));
    return;
  }
  const addressee = to || (taskOrPovod.assignee) || null;
  state.notifications.push({id:nextId('N'), t:state.today, kind, taskId, to:addressee, due:due||null});
}
/* носители роли очереди, кроме исключённых (автор объекта при четырёх глазах) */
function queueHolders(q){ const r = roleOf(q.queue.role); return r ? r.holders.filter(h=>(q.queue.exclude||[]).indexOf(h)===-1) : []; }
function inQueue(t){ return !!t.queue && !t.assignee; }
function notifiedOnce(taskId, kind, due){ // «срок близко» / «срок истёк» — однократно на каждый установленный срок
  return state.notifications.some(n=>n.taskId===taskId && n.kind===kind && (due===undefined || n.due===due));
}

/* ---------- 5. переходы задания ---------- */
/* действует за исполнителя: сам исполнитель или его замещающий на дату (задание не переезжает) */
function actingOn(t, d){ const k = t.originKind && kindOf(t.originKind); return k && k.personal ? t.assignee : actingFor(t.assignee, d); } // «лично» — без замещения
function canActFor(t, by){ return !!by && (by===t.assignee || actingOn(t, state.today)===by); }
function actor(t, by){ return by===t.assignee ? {by} : {by, for:t.assignee}; }
function takeInternal(t, asOf){ log(t,'принято',{t:asOf||state.today, by:t.assignee}); }
function take(taskId, by){ // «Взять в работу»: только это событие защищает от переадресации
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(inQueue(t)){ // в очереди роли «Взять в работу» — закрепление за взявшим
    if(!by || queueHolders(t).indexOf(by)===-1)
      throw new Error((t.queue.exclude||[]).indexOf(by)!==-1 ? 'по своему объекту автор задание не берёт' : 'из очереди берёт носитель роли');
    t.assignee = by; t.addr = Object.assign({}, t.addr, {assignee:by, responsible:by});
    log(t,'принято',{by, закреплено:roleTitle(t.queue.role)});
    [t.author, t.controller].filter((x,i,a)=>x && x!==by && a.indexOf(x)===i).forEach(x=>notify(t,'принято',x));
    return t;
  }
  by = by || t.assignee;
  if(lastEv(t)!=='поручено') throw new Error(kindTake(t)==='не нужно' ? 'принятие не нужно — задание уже в работе' : 'взять в работу можно только порученное задание');
  if(!canActFor(t, by)) throw new Error('в работу берёт исполнитель или его замещающий');
  log(t,'принято',actor(t, by));
  [t.author, t.controller].filter((x,i,a)=>x && x!==by && a.indexOf(x)===i).forEach(x=>notify(t,'принято',x));
  return t;
}
function claimInternal(t, asOf, proof, by){
  const extra = Object.assign({claimedAt:asOf||state.today}, by ? actor(t, by) : {});
  if(proof) extra.proof = proof; // ссылка на подтверждение — реквизит сдачи
  if(t.controller) log(t,'ожидает приёмки',extra);
  else log(t,'заявлено',extra);
}
function claim(taskId, proof, by){
  const t = taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  by = by || t.assignee;
  const st = lastEv(t);
  if(ownerExecOf(t)) throw new Error(`работа делается у владельца (${actionOf(t.action).where}) — задание закроется само`);
  if(st==='поручено') throw new Error('сначала «Взять в работу»');
  if(st!=='принято' && st!=='возвращено') throw new Error('заявить можно только задание в работе');
  if(!canActFor(t, by)) throw new Error('заявляет исполнитель или его замещающий');
  const a = t.action ? actionOf(t.action) : null;
  if(a && a.needsProof && !proof) throw new Error('действие требует ссылку на подтверждение');
  claimInternal(t, null, proof||null, by);
  return t;
}
function rejectInternal(t, note, asOf){
  log(t,'отказано',{note, t:asOf||state.today});
}
function reject(taskId, note){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(['поручено','принято','возвращено'].indexOf(lastEv(t))===-1) throw new Error('отказаться можно до заявления');
  rejectInternal(t, note);
  return t;
}
/* «Снять» — автор, из любого нетерминального, с основанием; ключ, снятый с поручения,
   по правилу не переиздаётся, пока жив */
function releaseTask(taskId, by, reason, onlyKeys){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто — снимать нечего');
  const k = t.originKind && kindOf(t.originKind);
  if(k && k.selfRelease){ // решение адресата без действия у владельца: с основанием, ключ не переиздаётся, пока жив
    if(!canActFor(t, by)) throw new Error(`«${k.selfRelease}» принимает адресат задания`);
    if(!reason) throw new Error('нужно основание решения');
    if(t.rollupKeys){ // в вале — по выбранным поводам (не названы — все живые); вал закрывается, когда живых не осталось
      const pick = onlyKeys===undefined ? liveKeys(t) : onlyKeys;
      if(!pick.length) throw new Error('выберите поводы');
      if(pick.some(key=>t.rollupKeys.indexOf(key)===-1 || keyStatus(t, key)!=='жив')) throw new Error('повода нет в вале, он уже решён или отпал');
      pick.forEach(key=>{ log(t,'ключ вышел',Object.assign({key, причина:k.selfRelease, reason}, actor(t, by)));
        const p = povodByKey(key); if(p && p.status!=='gone') log(p,'снят без поручения',{task:t.id, reason}); });
      if(t.rollupKeys.every(key=>pick.indexOf(key)!==-1)){ // решено всё разом — вал снят с этим основанием
        log(t,'закрыто',Object.assign({outcome:'снято', reason:`${k.selfRelease}: ${reason}`}, actor(t, by)));
        notify(t,'закрыто');
      } else settleRollup(t);
      return t;
    }
    log(t,'закрыто',Object.assign({outcome:'снято', reason:`${k.selfRelease}: ${reason}`}, actor(t, by)));
    notify(t,'закрыто');
    const p = povodByKey(t.povodKey); if(p && p.status!=='gone') log(p,'снят без поручения',{task:t.id});
    return t;
  }
  if(ownerExecOf(t)) throw new Error('снять нельзя: судьбу шага решает владелец — задание закроется отпадением повода');
  if(by!==t.author) throw new Error('снимает автор задания');
  if(!reason) throw new Error('нужно основание снятия');
  const keys = t.povodKey ? [t.povodKey] : liveKeys(t);
  log(t,'закрыто',{outcome:'снято', reason, by});
  notify(t,'закрыто');
  keys.forEach(k=>{ const p=povodByKey(k); if(p && p.status!=='gone') log(p,'снят без поручения',{task:t.id}); });
  return t;
}
function povodReleased(p){ // последнее событие жизни ключа — снятие с поручения
  for(let i=p.journal.length-1;i>=0;i--){
    const ev=p.journal[i].ev;
    if(ev==='снят без поручения') return true;
    if(ev==='появился' || ev==='вновь-появился' || ev==='отпал') return false;
  }
  return false;
}
function reassignTask(taskId, newAssignee, by, reason){ // решение человека: автор или руководитель исполнителя по цепочке
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто — переназначать нечего');
  if(escalateOf(t) && escalateOf(t).reassign===false) throw new Error('адресата называет владелец — задание не переназначается');
  if(inQueue(t)){ // неразобранная очередь: назначает автор, руководитель подразделения роли или администратор владельца
    const r = roleOf(t.queue.role);
    if(by!==t.author && by!==deptHead(r.dept) && by!==ownerAdminOf(t)) throw new Error('из очереди назначает руководитель подразделения роли или администратор');
    if(!reason) throw new Error('нужно основание назначения');
    if(queueHolders(t).indexOf(newAssignee)===-1) throw new Error('назначить можно только носителя роли');
    t.assignee = newAssignee; t.addr = Object.assign({}, t.addr, {assignee:newAssignee, responsible:newAssignee});
    log(t,'переназначено',{from:null, to:newAssignee, by, reason});
    notify(t,'поручено');
    return t;
  }
  if(by===t.assignee) throw new Error('исполнитель задание не передаёт');
  if(by!==t.author && !chiefChainIncludes(t.assignee, by)) throw new Error('переназначает автор или руководитель исполнителя по цепочке');
  if(!reason) throw new Error('нужно основание переназначения');
  if(!emp(newAssignee) || newAssignee===t.assignee) throw new Error('выберите другого исполнителя');
  if(t.queue && queueHolders(t).indexOf(newAssignee)===-1) throw new Error('задание очереди переназначается только носителю роли');
  const from = t.assignee;
  t.assignee = newAssignee;
  log(t,'переназначено',{from, to:newAssignee, by, reason});
  notify(t,'переадресовано', from);
  notify(t,'поручено');
  return t;
}
function requestExtension(taskId, by, newDue, reason){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!canActFor(t, by)) throw new Error('продление запрашивает исполнитель или его замещающий');
  if(namedDue(t)) throw new Error('срок называет владелец — переносится в его записи, не здесь');
  if(pendingExtension(t)) throw new Error('предыдущий запрос продления ещё без решения');
  if(!newDue || newDue<=dueOf(t)) throw new Error('новая дата должна быть позже установленного срока');
  if(!reason) throw new Error('нужно основание продления');
  log(t,'запрошено продление',Object.assign(actor(t, by), {newDue, reason}));
  notify(t,'запрошено-продление', approverOf(t));
  return t;
}
function decideExtension(taskId, by, approve, note){ // решает тот, кто ставил срок: контролёр, если назван, иначе автор
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  const req = pendingExtension(t);
  if(!req) throw new Error('запроса продления нет');
  if(by!==approverOf(t)) throw new Error('решение по продлению принимает '+(t.approver ? 'автор резолюции '+emp(t.approver).name : t.controller?'контролёр':'автор'));
  if(approve) log(t,'продление утверждено',{by, prevDue:dueOf(t), newDue:req.newDue});
  else log(t,'продление отклонено',{by, note:note||''});
  notify(t,'решение-по-продлению', t.assignee);
  if(t.controller && t.controller!==by) notify(t,'решение-по-продлению', t.controller);
  return t;
}
function addProgress(taskId, by, text, opts){ // отметка о ходе: состояние не меняет, уведомлений не шлёт, не правится
  opts = opts || {};
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!visibleTo(t, by)) throw new Error('отметку оставляет участник задания');
  if(!text) throw new Error('нужен текст отметки');

    const target = t.journal[opts.fixes];
    if(!target || target.ev!=='отметка о ходе') throw new Error('исправлять можно только отметку о ходе');
    extra.fixes = opts.fixes;
  }
  log(t,'отметка о ходе',extra);
  return t;
}
/* ось подтверждения повода: у поштучного — ключ отпал, у вала — живых ключей нет */
function povodGoneFor(t){
  if(Array.isArray(t.rollupKeys)) return liveKeys(t).length===0;
  if(!t.povodKey) return true;
  const p = povodByKey(t.povodKey);
  return !p || p.status==='gone';
}
function acceptDecision(taskId, approve, note){ // решение контролёра; у задания по правилу «Принять» — только когда повод отпал
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='ожидает приёмки') return;
  if(approve){
    if(t.kind==='rule' && !povodGoneFor(t)) throw new Error('повод ещё жив — принять нельзя, только вернуть');
    log(t,'закрыто',{outcome:'исполнено'}); notify(t,'закрыто');
  }
  else { log(t,'возвращено',{note}); notify(t,'возвращено'); }
}
function disposeLapsed(taskId, outcome, reason){ // человек разбирает «отпало-до-разбора»
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='отпало') return;
  log(t,'закрыто',{outcome, reason});
  notify(t,'закрыто');
}
function createFreeTask(p){ // свободное поручение: ключа не имеет, контролёр обязателен; основание — необязательная ссылка на документ
  if(p.basis){ // поручение по обзору: обычное свободное задание — исполнителя называет автор, контролёр — автор
    const s = ownerAt('an', p.basis, state.today);
    if(!s) throw new Error(`обзора ${p.basis} нет`);
    if(!s.approved) throw new Error(`по черновику ${p.basis} поручать нечего — основание поручения утверждённый обзор`);
    if(s.replacedBy) throw new Error(`обзор ${p.basis} заменён ${s.replacedBy} — поручение ставится по действующему`);
    if(p.object && s.worklist.indexOf(p.object)===-1) throw new Error(`объекта ${p.object} в рабочем списке ${p.basis} нет`);
    if(p.controller && p.controller!==p.author) throw new Error('контролёр поручения по обзору — его автор');
    p = Object.assign({}, p, {controller:p.author});
  }
  if(!p.controller) throw new Error('свободное поручение обязано иметь контролёра');
  if(!p.assignee || !emp(p.assignee)) throw new Error('исполнителя называет автор');
  return mkTask({kind:'free', label:p.label, assignee:p.assignee, controller:p.controller,
    author:p.author, dueDate:p.dueDate, importance:p.importance||'средняя', createdAt:state.today, basis:p.basis, object:p.object});
}
/* форма поручения по обзору: подставляет куратора объекта на дату (ответ кураторства), автор вправе заменить; контролёр — автор */
function reviewTaskDraft(no, obj, by){

/* шов «задания по основанию»: перечень свободных заданий по ссылке на документ; задания по поводу в ответ не входят */
function tasksByBasis(ref, asOf){

/* демо-карточка обзора (у анализа): утверждение — заведующий отделом анализа или руководство */
function anStep(id, by, step){
  const o = ownerObj('an', id), s = reviewAt(o, state.today);
  if(!s) throw new Error('обзора нет');

  if(!e || (by!=='E27' && e.dept!=='Руководство')) throw new Error('утверждает заведующий отделом анализа или руководство');
  o.ev.push({t:state.today, approved:true, by, how:`обзор ${id} утверждён`+(o.replaces ? ` взамен ${o.replaces}` : '')});

/* ручной режим: правило выдаёт не работу, а решение — задание автору «решить по поводам» со сроком правила */
function decideTaskOf(rule){ return state.tasks.find(t=>t.decide && t.ruleId===rule.id && !isTerminal(t)) || null; }
function decideLabel(t){ return `Решить по поводам: «${kindOf(t.originKind).title}» — ${liveKeys(t).length} шт.`; }
function addToDecide(rule, keys, asOf){
  let t = decideTaskOf(rule);
  if(!t){
    const a = authorOn(rule.author, asOf);
    t = mkTask({kind:'rule', povodKey:null, originKind:rule.kind, action:null, label:'', assignee:a.emp, controller:null, author:a.emp,
      dueDate:dueFromRule(rule, asOf), ruleId:rule.id, ruleEdition:rule.edN, createdAt:asOf,
      importance:computeImportance(actionOf(rule.action), rule),

    Object.assign(t, {decide:true, rollupKeys:[], rollupResp:{}, snap:snapOf(rule), authorPost:rule.author, authorVia:a.via});
    log(t,'принято',{by:t.assignee, без_принятия:true}); // решение автора — сразу в работе
  } else keys.forEach(key=>log(t,'ключ добавлен',{key}));
  t.keyAdded = t.keyAdded || {};
  keys.forEach(key=>{ if(t.rollupKeys.indexOf(key)===-1) t.rollupKeys.push(key); t.rollupResp[key] = null; if(!(key in t.keyAdded)) t.keyAdded[key] = asOf; });
  t.label = decideLabel(t);
  return t;
}
function decidePovods(taskId, keys, how, by, basis){
  const t = taskOf(taskId);
  if(!t || !t.decide || isTerminal(t)) throw new Error('это не открытое задание «решить по поводам»');
  if(!canActFor(t, by)) throw new Error('решает автор правила');
  if(how!=='поручить' && how!=='не поручать') throw new Error('решение — «поручить» или «не поручать»');
  if(how==='не поручать' && !basis) throw new Error('нужно основание — почему не поручать');
  const live = liveKeys(t);
  keys = (keys||[]).filter(k=>live.indexOf(k)!==-1);
  if(!keys.length) throw new Error('не выбран ни один живой повод');
  const rule = ruleById(t.ruleId), out = [];
  keys.forEach(key=>{
    const p = povodByKey(key);
    if(how==='поручить'){ const x = issueRuleTask(rule, p); out.push(x); log(t,'ключ вышел',Object.assign({key, причина:'поручено', task:x.id}, actor(t, by))); }
    else { log(t,'ключ вышел',Object.assign({key, причина:'не поручать', reason:basis}, actor(t, by))); log(p,'снят без поручения',{task:t.id, reason:basis}); }
  });
  t.label = decideLabel(t);
  settleRollup(t);
  return out;
}
/* правило переведено в авто — нерешённые поводы поручаются сами, «решить» снимается */
function flushDecide(asOf){
  state.tasks.filter(t=>t.decide && !isTerminal(t)).forEach(t=>{
    const rule = ruleById(t.ruleId);
    if(rule.mode!=='авто') return;
    const keys = liveKeys(t);
    keys.forEach(key=>log(t,'ключ вышел',{key, причина:'правило переведено в авто'}));
    issueForKeys(rule, keys, asOf);
    log(t,'закрыто',{outcome:'снято', reason:'правило переведено в авто'});
    notify(t,'закрыто');
  });
}

/* ---------- 6. опрос: ожидаемое множество поводов по виду ---------- */
const AWAIT_THRESHOLD_WD = 3;   // «дольше срока» для ожидания приёмки
const OVERDUE_WD = 5;           // «просрочено задание» — рабочих дней после установленного срока
const INACTIVE_THRESHOLD_D = 3; // «вид не введён в действие дольше срока» — календарных дней
const EXT_PENDING_WD = 1;       // «запрос продления без ответа» — рабочих дней
const RETURN_THRESHOLD = 3;     // «повод возвращается» — появлений ключа вновь…
const RETURN_WINDOW_D = 30;     // …за календарных дней

function computeExpectedForKind(kindId, asOf, asIfActive){
  const out = new Map(); // key -> {kind,objectType,objectId,stateDate,approx,traits}
  const pkGate = kindOf(kindId);
  if(!pkGate.activatedAt || pkGate.activatedAt>asOf) return out; // рубильник: вид не введён в действие — поводов не порождает
  if(pkGate.retiredAt && pkGate.retiredAt<=asOf && !asIfActive) return out; // выведен из употребления выпуском
  if(kindId==='pk-overdue'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-overdue') return; // стопор рекурсии, один шаг
      if(isTerminal(t)) return;
      const st = lastEv(t);
      if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
      const due = dueOf(t), esc = escalateOf(t);
      if(esc && esc.to==='уведомление') return; // адресат эскалации — уведомлением при истечении срока, задания нет
      if(esc && esc.to==='очередь'){ // сразу по истечении срока — задание очереди того, кто вправе решить
        if(due >= asOf) return;
        out.set(`pk-overdue|task:${t.id}|${esc.step}`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
          esc:{role:esc.role, action:esc.action}, traits:{давность_раб_дней:workdaysBetween(due, asOf), ступень:roleTitle(esc.role)}});
        return;
      }
      if(inQueue(t)){ // очередь, которую никто не взял: сразу — руководителю подразделения роли, на 5-й р.д. — администратору владельца
        if(due >= asOf) return;
        const wd = workdaysBetween(due, asOf);
        out.set(`pk-overdue|task:${t.id}|никто не взял`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
          traits:{давность_раб_дней:wd, ступень:'руководитель подразделения роли'}});
        if(wd >= OVERDUE_WD) out.set(`pk-overdue|task:${t.id}|никто не взял, 5-й р.д.`, {kind:kindId, objectType:'task', objectId:t.id,
          stateDate:addWorkdays(due, OVERDUE_WD), approx:false, traits:{давность_раб_дней:wd, ступень:'администратор владельца'}});
        return;
      }
      if(due >= asOf || workdaysBetween(due, asOf) < OVERDUE_WD) return; // до того — исполнителю «срок истёк»
      const key = `pk-overdue|task:${t.id}|`;
      out.set(key, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
        traits:{давность_раб_дней: workdaysBetween(due, asOf)}});
    });
  } else if(kindId==='pk-rejected'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-rejected') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='отказано') return;
      const stDate = stateEntry(t).t;
      out.set(`pk-rejected|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:stDate, approx:false, traits:{}});
    });
  } else if(kindId==='pk-await-long'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-await-long') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='ожидает приёмки') return;
      const claimedAt = stateEntry(t).claimedAt || stateEntry(t).t;
      const wd = workdaysBetween(claimedAt, asOf);
      if(wd <= AWAIT_THRESHOLD_WD) return;
      out.set(`pk-await-long|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:claimedAt, approx:false, traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-lapsed-review'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-lapsed-review') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='отпало') return;
      const stDate = stateEntry(t).t;
      out.set(`pk-lapsed-review|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:stDate, approx:false, traits:{}});
    });
  } else if(kindId==='pk-neighbor-silent'){
    // молчание — время без полного ответа, по журналу прошлых прогонов; порог объявляет источник
    SOURCES.filter(s=>s.id!=='self').forEach(src=>{
      const sil = silenceOf(src.id, asOf);
      if(!sil) return;
      const thr = silenceThreshold(src);
      if(sil.minutes < thr) return;
      out.set(`pk-neighbor-silent|source:${src.id}|`, {kind:kindId, objectType:'source', objectId:src.id,
        stateDate:sil.since, approx:true, traits:{молчит_минут:sil.minutes, порог_минут:thr, молчит_с:sil.since}});
    });
  } else if(kindId==='pk-kind-inactive'){
    state.povodKinds.forEach(pk=>{
      if(pk.activatedAt && pk.activatedAt<=asOf) return; // введён — не наш случай
      if(pk.off) return; // выключен администратором с основанием — не «не введён»
      const days = daysBetween(pk.createdAt, asOf);
      if(days < INACTIVE_THRESHOLD_D) return;
      out.set(`pk-kind-inactive|povodKind:${pk.id}|`, {kind:kindId, objectType:'povodKind', objectId:pk.id,
        stateDate:pk.createdAt, approx:false, traits:{дней_с_заведения:days}});
    });
  } else if(kindId==='pk-addr-missing'){
    // задание выдано администратору по концу цепочки запасных
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-addr-missing') return;
      if(isTerminal(t) || !t.addr || t.addr.via!=='администратор') return;
      const issued = t.journal[0].t;
      const objType = t.povodKey && povodByKey(t.povodKey) ? povodByKey(t.povodKey).objectType : (t.rollupKeys ? 'вал' : '—');
      out.set(`pk-addr-missing|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:issued, approx:false,
        traits:{вид_объекта:objType, роль:t.addr.role}});
    });
  } else if(kindId==='pk-ext-pending'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-ext-pending') return;
      if(isTerminal(t)) return;
      const req = pendingExtension(t);
      if(!req) return;
      const wd = workdaysBetween(req.t, asOf);
      if(wd <= EXT_PENDING_WD) return;
      out.set(`pk-ext-pending|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:req.t, approx:false,
        traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-returning'){
    // ключ вновь появлялся не реже порога за окно
    const from = addDays(asOf, -RETURN_WINDOW_D);
    state.povods.forEach(p=>{
      if(p.kind==='pk-returning') return;
      const back = p.journal.filter(e=>e.ev==='вновь-появился' && e.t>from && e.t<=asOf);
      if(back.length < RETURN_THRESHOLD) return;
      out.set(`pk-returning|povod:${p.key}|`, {kind:kindId, objectType:'povod', objectId:p.key, stateDate:back[back.length-1].t, approx:false,
        traits:{повторов:back.length}});
    });

          sub:x.sub||null, named:x.named!==undefined ? x.named : cfg.named ? cfg.named(s, asOf) : (s.author||null), namedRole:x.role && roleOf(x.role) ? x.role : null,
          curObj:typeof cfg.cur==='function' ? cfg.cur(s) : cfg.cur ? o.id : null, due:x.due || (cfg.due ? cfg.due(s) : null), mark:x.mark||null, escWho:cfg.escWho ? cfg.escWho(s) : null,
          approver:x.approver||null, unit:cfg.unit ? cfg.unit(s, asOf, x) : null, dueN:x.dueN||null,
          stateDate, approx:false, traits:Object.assign(s.status||s.stage ? {статус:s.status||s.stage} : {}, 'author' in s ? {автор:s.author ? emp(s.author).name : 'нет'} : {}, cfg.traits ? cfg.traits(s, asOf, x) : {})});
      });
    });
  } else if(kindId==='pk-stat-neighbor-silent'){
    // ключ шва — от соседа
    const ans = statMirrorAt(asOf);
    (ans.leads||[]).forEach(lead=>{
      const stateDate = dateMax(lead.from, pkGate.activatedAt); // клэмп к дате подключения
      out.set(lead.key, {kind:kindId, objectType:'module', objectId:lead.nb, curObj:lead.nb, stateDate, approx:false,

    reportsMirrorAt(asOf).filter(o=>o.state==='просрочено').forEach(o=>{
      const stateDate = dateMax(o.due, pkGate.activatedAt); // клэмп к дате подключения
      out.set(o.id, {kind:kindId, objectType:'obligation', objectId:o.dept, curObj:o.dept, stateDate, approx:false,

}
function daysBetween(a,b){ return Math.round((utc(b)-utc(a))/86400000); }
/* база срока = max(дата состояния у соседа, дата ввода вида в действие) */
function dateMax(a,b){ return a>b ? a : b; }
function silenceOf(srcId, asOf){ // {since, minutes} — с последнего полного ответа; отвечал в последний раз — null
  const runs = state.pollRuns.filter(r=>r.date<=asOf).map(r=>({date:r.date, s:r.sources.find(x=>x.src===srcId)})).filter(x=>x.s);
  if(!runs.length || runs[runs.length-1].s.answer==='множество') return null;

/* ---------- 7. сверка множества: полная, идемпотентная ---------- */
/* что повод несёт от шва кроме признаков: объект кураторства, названный адресат или роль, срок владельца, пометка */
const SEAM_FIELDS = ['curObj','named','namedRole','due','mark','escWho','esc','sub','ownerId','approver','unit','dueN'];

function reconcileKind(kindId, asOf){
  const expected = computeExpectedForKind(kindId, asOf);
  const newKeys=[], goneKeys=[], matchedKeys=[];
  state.povods.filter(p=>p.kind===kindId && p.status!=='gone').forEach(p=>{
    if(!expected.has(p.key)) goneKeys.push(p.key);

  goneKeys.forEach(key=>{
    const p = povodByKey(key);

  expected.forEach((e,key)=>{
    let p = povodByKey(key);
    if(!p || p.status==='gone'){
      if(p){ p.status='appeared'; p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; seamCopy(p, e); log(p,'вновь-появился',{}); }
      else {
        p = seamCopy({key, kind:e.kind, objectType:e.objectType, objectId:e.objectId, stateDate:e.stateDate,
          approx:e.approx, firstSeen:asOf, status:'appeared', frozenSince:null, traits:e.traits, journal:[]}, e);
        log(p,'появился',{});

      newKeys.push(key);
      const r0 = ruleForKind(kindId), a = r0 ? resolveAddressee(r0, p, asOf) : {via:'администратор', assignee:ADMIN};
      if(r0 && r0.mode==='ручной') notify({assignee:null}, 'повод-появился', authorOn(r0.author, asOf).emp);
      else if(a.via==='очередь') notify({assignee:null, queue:{role:a.queueRole, exclude:a.exclude}}, 'повод-появился');

    } else {

      p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; seamCopy(p, e);
      if(p.status==='frozen'){ p.status='appeared'; p.frozenSince=null; log(p,'разморожен',{}); }
    }

  return {new:newKeys, gone:goneKeys, matched:matchedKeys, kindTitle:kindOf(kindId).title};
}

function handleGoneForKind(goneKeys, asOf){
  goneKeys.forEach(key=>{
    const openTasks = state.tasks.filter(t=>t.povodKey===key && !isTerminal(t));
    const rollups = state.tasks.filter(t=>Array.isArray(t.rollupKeys) && coversKey(t,key));
    if(openTasks.length===0 && rollups.length===0){
      const p = povodByKey(key), k = kindOf(p.kind);
      const issued = state.tasks.some(t=>t.povodKey===key || (t.rollupKeys||[]).indexOf(key)!==-1);
      log(p,'закрыт-системой',{reason:k.retiredAt && k.retiredAt<=asOf && issued ? 'вид выведен выпуском' : 'поручения не было'});
      return;
    }
    rollups.forEach(t=>{ // у шага владельца ключ вала несёт свой исход и атрибуцию
      const a = ownerExecOf(t) ? ownerAttrib(t.originKind, povodByKey(key), asOf) : null;
      log(t,'ключ отпал', a ? (a.cancel ? {key, outcome:'снято', reason:a.cancel} : {key, outcome:'исполнено', by:a.by, for:a.for||undefined}) : {key});
      settleRollup(t); });
    openTasks.forEach(t=>{
      const st = lastEv(t);
      if(ownerExecOf(t)){ closeByOwner(t, povodByKey(key), asOf); return; }
      if(st==='заявлено'){
        log(t,'закрыто',{outcome:'исполнено'});
        notify(t,'закрыто');
      } else if(st==='ожидает приёмки'){ // при контролёре нужны обе оси — решает он
        log(t,'повод отпал',{});
        notify(t,'повод-отпал', t.controller);
      } else {
        log(t,'отпало',{});
        notify(t,'повод-отпал');
      }
    });
  });
}

/* исполнение у владельца: повод отпал — задание закрыто с атрибуцией; «отпало — ждёт разбора» не бывает */
function closeByOwner(t, p, asOf){
  const a = t.esc ? escAttrib(p, asOf) : ownerAttrib(t.originKind, p, asOf);
  if(a.cancel){ log(t,'закрыто',{outcome:'снято', reason:a.cancel, by:'владелец'}); notify(t,'закрыто'); return; }
  // за адресата действовал замещающий — по замещению в заданиях или по приказу у владельца («лично»)

  const extra = {outcome: self ? 'исполнено' : 'исполнено · выполнил другой', by:a.by, how:a.how};
  if(self && t.assignee && a.by!==t.assignee) extra.for = t.assignee;

function kindOf(id){ return state.povodKinds.find(k=>k.id===id); }
function kindTake(t){ const k = t.originKind && kindOf(t.originKind); return k ? k.take : 'нужно'; }
function ownerExecOf(t){ const k = t.originKind && kindOf(t.originKind); return !!(k && k.ownerExec) || !!t.esc; }

/* адресат: формула правила → замещение на дату → запасной (руководитель подразделения-владельца

function participantOf(who, t, povod){
  if(!t) return null;

    return povod && povod.traits && povod.traits.ступень==='администратор владельца' ? ownerAdminOf(t) : deptHead(roleOf(t.queue.role).dept);
  if(who==='руководитель исполнителя') return chiefOf(t.assignee);
  if(who==='автор') return t.author;
  if(who==='контролёр') return t.controller;
  if(who==='исполнитель') return t.assignee;
  if(who==='утверждающий продление') return approverOf(t);

}
function fallbackAddressee(rule, asOf){
  const f = rule.addressee, head = deptHead(kindOf(rule.kind).ownerDept);
  if(!head) return {by:f.by, role:f.role||f.who, responsible:null, assignee:ADMIN, via:'администратор', subst:false};
  const acting = actingFor(head, asOf);

function resolveAddressee(rule, povod, asOf){
  if(povod.esc) // эскалация к тому, кто вправе решить: очередь, которую объявил вид просроченного шага
    return {by:'очередь', role:roleTitle(povod.esc.role), queueRole:povod.esc.role, exclude:[], responsible:null, assignee:null, via:'очередь', subst:false};
  const f = rule.addressee;
  if(f.by==='очередь'){ // все носители роли (у отдела роль называет повод); четыре глаза — без автора объекта

    return {by:'очередь', role:roleTitle(role), queueRole:role, exclude, responsible:null, assignee:null, via:'очередь', subst:false};
  }
  if(f.by==='названный'){ // адресата называет повод; кураторство не применяется; без имени — конец цепочки
    if(!povod.named) return {by:'названный', role:f.who, responsible:null, assignee:ADMIN, via:'администратор', subst:false};
    const acting = kindOf(rule.kind).personal ? povod.named : actingFor(povod.named, asOf); // «лично» — без замещения
    return {by:'названный', role:f.who, responsible:povod.named, assignee:acting, via:'названный', subst:acting!==povod.named};
  }

  if(!responsible) return Object.assign(fallbackAddressee(rule, asOf), {curObj:povod.curObj||null});
  const acting = actingFor(responsible, asOf);
  const a = {by:f.by, role:f.role||f.who, curObj:povod.curObj||null, responsible, assignee:acting, via:f.by, subst:acting!==responsible};
  if(f.by==='должность' && (f.unit || povod.unit)) a.unit = f.unit || povod.unit;
  if(hold) a.hold = hold; // ответ кураторства: работник не назван, объект держит заведующий отделом
  return a;
}
function addrText(a){
  if(!a) return '—';
  const who = id=>emp(id) ? emp(id).name : id;
  if(a.via==='администратор') return `${who(a.assignee)} — администратор модуля: ответственный не найден (${a.role})`;
  if(a.via==='очередь') return `очередь роли «${a.role}»`+(a.exclude && a.exclude.length ? `, без автора объекта ${a.exclude.map(who).join(', ')}` : '')+

  return a.subst ? `${base}; действует ${who(a.assignee)} (замещение)` : base;
}
function priorTasksForKey(key){ // закрытые задания по ключу и валы, где ключ отпал
  return state.tasks.filter(t=>
    (t.povodKey===key && isTerminal(t)) ||
    (Array.isArray(t.rollupKeys) && t.rollupKeys.indexOf(key)!==-1 && keyStatus(t,key)!=='вышел' &&
      (isTerminal(t) || keyStatus(t,key)==='отпал')));
}
function computeImportance(action, rule){ return rule.importance || action.importance; }
function pastToNext(d){ return d<state.today ? addWorkdays(state.today, 1) : d; } // срок, привязанный к дате объекта, прошедшей к выдаче
function dueFromRule(rule, base){ return rule.dueUnit==='month' ? addMonths(base, rule.dueN) : addWorkdays(base, rule.dueN || 1); }
function issueRuleTask(rule, povod){ // rule — действующая редакция или снимок выданного (разбор вала, смена закрепления)
  const action = actionOf(povod.esc ? povod.esc.action : rule.action);
  const addr = resolveAddressee(rule, povod, state.today);
  const base = rule.dueBase==='состояние' ? povod.stateDate : state.today; // от даты состояния (уже прижатой к подключению) или от выдачи

function issueRollupTask(rule, keys, addr, per){ // у вала один ответственный — пара «вид × адресат»

    label:`Разобраться с валом: «${kindOf(kindId).title}» — ${keys.length} шт., порог свёртки ${rollupOf(rule)}`,
    assignee:addr.assignee, controller:controllerOf(rule, au.emp), author:au.emp, dueDate:addWorkdays(state.today,1),

  t.rollupKeys = keys;

function settleRollup(t){ // вал закрыт, когда живых ключей нет

  if(t.decide){ // «решить по поводам»: решены все — исполнено со сводкой; все отпали до решения — снято
    const fate = k=>{ const e = t.journal.filter(x=>x.key===k && (x.ev==='ключ вышел' || x.ev==='ключ отпал')).pop(); return e.ev==='ключ отпал' ? 'отпал' : e.причина; };
    const n = c=>t.rollupKeys.filter(k=>fate(k)===c).length;
    log(t,'закрыто', n('отпал')===t.rollupKeys.length ? {outcome:'снято', reason:'все поводы отпали до решения'}
      : {outcome:'исполнено', note:`поручено ${n('поручено')}, не поручать ${n('не поручать')}, отпало ${n('отпал')}`});

  if(ownerExecOf(t) && ends.every(e=>e.ev==='ключ отпал' || (sr && e.причина===sr))){
    const off = ends.filter(e=>e.ev==='ключ вышел' || e.outcome==='снято').length, n = ends.length;
    log(t,'закрыто', off===n ? {outcome:'снято', reason:'все шаги вала сняты'} : {outcome:'исполнено', note:`шагов ${n}: исполнено ${n-off}, снято ${off}`});

  } else if(t.rollupKeys.every(k=>keyStatus(t,k)==='отпал')){ log(t,'закрыто',{outcome:'исполнено'}); notify(t,'закрыто'); }
  else if(lastEv(t)!=='отпало'){ log(t,'отпало',{}); notify(t,'повод-отпал'); }
