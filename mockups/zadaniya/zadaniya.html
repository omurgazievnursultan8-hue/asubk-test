  if(CALENDAR_FIXED.indexOf(iso.slice(5))!==-1 || rec.holidays.indexOf(iso)!==-1) return false;

  const gap = []; if(!from || !to) return '';
  for(let y=+from.slice(0,4); y<=+to.slice(0,4); y++) if(!calendarYearKnown(y)) gap.push(y);
  return gap.length ? `календарь ${gap.join(', ')} года не заведён — рабочие дни по сб/вс` : '';
}

const PROD_FIELDS = ['dueN','controller','importance','author'];
const FIELD_TITLE = {dueN:'срок', controller:'контролёр', importance:'важность', author:'автор'};
const IMPORTANCE = ['высокая','средняя','низкая'];

const byFrom = (a,b)=>startOf(a)<startOf(b) ? -1 : startOf(a)>startOf(b) ? 1 : a.n-b.n;
function editionOn(r, d){ return r.editions.filter(e=>!e.cancelled && startOf(e)<=d).sort(byFrom).pop(); }
function pendingEdition(r){ return r.editions.find(e=>!e.cancelled && !e.release && e.from>state.today) || null; }

function editRule(ruleId, changes, o){
  o = o || {};
  const r = ruleById(ruleId);
  if(!r) throw new Error('правила нет');
  if(!isTasksAdmin(o.by)) throw new Error('правит администратор заданий — остальным реестры на чтение');
  if(!o.basis) throw new Error('нужно основание правки — приказ или служебная записка');
  const from = o.from || state.today;
  if(from < state.today) throw new Error('дата начала — сегодня или будущая: задним числом правило не меняется');
  const cur = editionOn(r, state.today), v = Object.assign({}, cur.values);
  const num = (x, what)=>{ const n = parseInt(x,10); if(!(n>=1) || String(n)!==String(x).trim()) throw new Error(`${what} — целое число больше нуля`); return n; };
  Object.keys(changes).forEach(f=>{
    const x = changes[f];
    if(f==='threshold') throw new Error('порог появления повода — настройка модуля-владельца, не правила');
    if(PROD_FIELDS.indexOf(f)===-1) throw new Error(`«${f}» меняется выпуском`);
    if(f==='dueN'){ if(r.dueUnit==='named' && r.dueN==null) throw new Error('срок этого правила называет владелец — не настраивается');
      v.dueN = r.dueUnit==='beforeDate' && String(x).trim()==='0' ? 0 : num(x, 'срок'); } // «за N к.д. до даты» — и в самый день
    else if(f==='importance'){ if(x && IMPORTANCE.indexOf(x)===-1) throw new Error('важность — высокая, средняя или низкая'); v.importance = x || null; }
    else if(f==='controller'){ if(x && x!=='автор' && !postOf(x)) throw new Error('контролёр — автор правила или должность'); v.controller = x || null; }
    else if(f==='author'){ // должность; у правила с выбором очереди — пара «очередь → должность» на каждую очередь
      const pair = cur.values.author && typeof cur.values.author==='object', ids = x && typeof x==='object' ? Object.values(x) : [x];
      if(!ids.length || ids.some(i=>!postOf(i))) throw new Error('автор правила — должность бизнес-владельца');
      if(ids.some(i=>postOf(i).abolished && postOf(i).abolished.at<=from)) throw new Error('единица упразднена — выберите действующую из дерева на дату');
      if(!pair && typeof x==='object') throw new Error('пара «очередь → должность» — только у правила с выбором очереди');
      if(pair && (typeof x!=='object' || Object.keys(x).sort().join()!==Object.keys(cur.values.author).sort().join()))
        throw new Error('у правила с выбором очереди «Кто поручил» — должность на каждую очередь');
      v.author = pair ? Object.assign({}, x) : x; }
  });
  if(!PROD_FIELDS.some(f=>JSON.stringify(v[f])!==JSON.stringify(cur.values[f]))) throw new Error('значения не изменились');
  const pend = pendingEdition(r);
  if(pend && from===state.today) throw new Error(`ждёт редакция ${pend.n} с ${fmt(pend.from)} — отмените или замените её будущей`);
  if(pend) pend.cancelled = {t:state.today, by:o.by, basis:'заменена редакцией '+(r.editions.length+1)};
  const e = {n:r.editions.length+1, from, by:o.by, basis:o.basis, values:v, was:cur.n};
  r.editions.push(e);
  applyEditions(state.today);
  return e;
}

function repSoonFromOf(due){
  const a = state.owner.rpRemind.filter(r=>!r.cancelled).sort((p, q)=>p.from<q.from ? -1 : p.from>q.from ? 1 : 0);
  for(let i=0; i<a.length; i++){
    const reach = addDays(due, -a[i].v), x = i && reach<a[i].from ? a[i].from : reach;
    if(i===a.length-1 || x<a[i+1].from) return x;
  }
}
function obligationAt(o, d){
  if(!o || !o.ev.length || o.ev[0].t>d) return null;
  const s = {id:o.id, form:o.form, dept:o.dept, deptName:o.deptName, period:o.period, due:o.due, role:o.role, rec:o.rec, recName:recName(o.rec),
    issued:null, others:[], removed:null, last:null};
  for(const e of byDate(o.ev)){ if(e.t>d) continue;
    if(e.issue){ if(e.to!==o.rec) s.others.push(e); else if(!s.issued) s.issued=e; } // выпуск другому получателю срок не закрывает
    if(e.removed && !s.removed) s.removed=e; s.last=e; }
  s.state = s.removed ? 'снято' : s.issued ? (s.issued.t<=o.due ? 'сдано' : 'сдано с опозданием') : d>o.due ? 'просрочено' : 'ожидается';
  const from = s.state==='ожидается' || s.state==='просрочено' ? repSoonFromOf(o.due) : null;
  s.soon = s.state==='ожидается' && from<=d;
  s.soonFrom = s.soon || s.state==='просрочено' ? from : null;
  return s;
}
function repIssue(id, by, to){ // демо отчётности: окончательный выпуск; срок закрывает только выпуск объявленному получателю
  const o = ownerObj('rp', id); if(!o) throw new Error('обязательства нет');
  const s = obligationAt(o, state.today), rec = to || o.rec;
  if(!s || s.issued || s.removed) throw new Error('обязательство уже закрыто');
  const r = o.role && roleOf(o.role);
  if(!r || r.holders.indexOf(by)===-1) throw new Error('окончательно выпускает подразделение, за которым обязательство');
  if(!REP_RECIPIENTS[rec]) throw new Error('получатель выпуска не назван');
  o.ev.push({t:state.today, issue:true, to:rec, by, how:`окончательный выпуск — ${recName(rec)}`});
}

  if(s.pos){ // предложение (любой источник): не позже срока ответа источнику
    if(s.memo && !s.decided && s.open) out.push({ot:'offer', sub:'предложение', key:'записка:'+s.memo.t, what:'предложение · '+s.source, source:s.source, memo:s.memo.t, due:imCommitteeDue(s)});
  } else if(s.apps){ // объект Фонда: заявки на покупку и выкуп, условия продажи
    Object.values(s.apps).filter(a=>a.memo && !a.decision && !a.withdrawn).forEach(a=>
      out.push({ot:'asset', sub:'заявка:'+a.id, key:`заявка:${a.id}·записка:${a.memo.t}`, what:`заявка ${a.id} (${a.type}) · ${a.from}`, memo:a.memo.t, due:due(a.memo.t)}));
    if(s.condMemo && !s.condDecided && !IM_GONE.includes(s.status))
      out.push({ot:'asset', sub:'условия', key:'условия·записка:'+s.condMemo.t, what:'условия продажи', memo:s.condMemo.t, due:due(s.condMemo.t)});
  } else if(s.declared){ // банкротство обязанного лица: ключ «вид · банкротство · записка»
    if(s.memo && !s.decided) out.push({ot:'bankruptcy', sub:'банкротство', key:'записка:'+s.memo.t, what:'залог банкрота · '+s.debtor, memo:s.memo.t, due:due(s.memo.t)});
  }
  return out;
}
function imQuestionDone(e, p){ // гасит решение Комитета по этому вопросу
  const sub = p.sub || 'предложение';
  if(sub.indexOf('заявка:')===0) return e.appDecision===sub.slice(7);
  if(sub==='условия') return !!e.condDecision;
  return !e.draft && !!e.decision;
}
function imQuestionGone(s, p){ // вопрос отпал: заявка или предложение отозваны, объект выбыл
  const sub = p.sub || 'предложение';
  if(sub==='предложение') return s.status==='отозвано источником' ? 'предложение отозвано источником' : null;
  if(sub.indexOf('заявка:')===0){ const a = s.apps[sub.slice(7)]; return a && a.withdrawn ? `заявка ${a.id} отозвана заявителем` : null; }
  if(sub==='условия') return IM_GONE.includes(s.status) ? `объект выбыл: ${s.status}` : null;
  return null;
}

   с охватом «полный остаток» по требованию с основанием п. 41 или служебная записка в отдел по работе с проблемными кредитами (п. 42;
   в словаре взыскания — «Служебная записка в ДПО» с путём «залог») по любому требованию по кредиту */
const VZ_MEASURE_CODE = {'Требование о досрочном исполнении':'досрочное требование', 'Служебная записка в ДПО':'записка в ДПО'};
function zlLapseMeasure(r, e){ const code = e.measure && VZ_MEASURE_CODE[e.measure];
  return code==='досрочное требование' ? e.cover==='полный остаток' && r.ground===VZ_GROUND_P41 : code==='записка в ДПО' && (e.track || r.track)==='залог'; }

function zlLapseHit(s, d){ // мера взыскания по кредиту предмета со дня после срока восполнения
  if(!s || !s.notice) return null;
  const from = s.notice.t; let hit = null; // мера с даты извещения: принятая до конца срока восполнения тоже исполняет п. 41
  (state.owner.vz||[]).filter(r=>r.credit===s.credit).forEach(r=>r.ev.forEach(e=>{
    if(zlLapseMeasure(r, e) && e.t>=from && e.t<=d && (!hit || e.t>=hit.t)) hit = e; }));
  return hit;
}

  if((kindId==='gd-review' || kindId==='lp-review') && s.last && s.last.recalled) return {cancel:'отозвано автором'}; // автор снял с рассмотрения
  if(kindId==='lp-expiring' && OWNER_CFG['lp-expired'].when(s, asOf)) return {cancel:'перешло в истёкший'};
  if(cfg.attrib) return cfg.attrib(s, p, asOf);
  if(cfg.done){
    const e = doneEvent(o, asOf, appearedOn(p), x=>cfg.done(x, p));
    return e ? {by:e.by, for:e.for, how:e.how} : {cancel:(cfg.cancel && cfg.cancel(s, asOf, p)) || s.last.how};
  }
  return {by:s.last.by, how:s.last.how};
}
/* оргструктура: вакансию закрыл кадровик (и.о. или назначение) — «выполнил другой»; подразделение ликвидировано — «снято» */
function orgAttrib(kindId, p, asOf){
  const r = kindId==='pk-org-head-vacant' ? ORG_HEAD_VACANT.find(x=>x.unit===p.objectId) : null;
  if(r && r.liquidated && r.liquidated<=asOf) return {cancel:'подразделение ликвидировано'};
  if(r && r.filled && r.filled.at<=asOf) return {by:r.filled.by, how:r.filled.how};
  return {by:null, how:'строки нет в ответе оргструктуры'};
}
/* задание эскалации к тому, кто вправе решить: отпадает вместе с просроченным шагом — по событию владельца */
function escAttrib(p, asOf){
  const base = taskOf(p.objectId), bp = povodByKey(base.povodKey), cfg = OWNER_CFG[base.originKind];
  const o = ownerObj(bp.src||cfg.src, bp.ownerId||bp.objectId), s = stateAt(bp.src||cfg.src, o, asOf);
  if(!s) return {cancel:goneReason(o, asOf)};
  const e = doneEvent(o, asOf, appearedOn(p), kindOf(base.originKind).escalate.done);
  return e ? {by:e.by, how:e.how} : {cancel:s.last.how};
}

/* действия в карточке у владельца (демо соседа): шаги согласования и два узких действия Согласующего */
const OWNER_STEPS = {
  'отправить на рассмотрение': {from:['Черновик','На доработке'], to:()=>'На рассмотрении', who:'автор'},
  'отозвать':                  {from:['На рассмотрении'], to:()=>'Черновик', who:'автор'},
  'одобрить':                  {from:['На рассмотрении'], to:()=>'Действует', who:'согласующий'},
  'отклонить':                 {from:['На рассмотрении'], to:src=>src==='gd'?'Отклонён':'Отклонена', who:'согласующий'},
  'вернуть на доработку':      {from:['На рассмотрении'], to:()=>'На доработке', who:'согласующий'},
  'закрыть':                   {from:['Действует'], to:src=>src==='gd'?'Закрыт':'Закрыта', who:'согласующий'},
  'вернуть на рассмотрение':   {from:['Закрыт','Закрыта','Отклонён','Отклонена'], to:()=>'На рассмотрении', who:'администратор'},
};
const OWNER_ROLE = {gd:'gd-approver', lp:'lp-approver'};
function holds(roleId, who){ const r=roleOf(roleId); return !!r && r.holders.indexOf(who)!==-1; }
function ownerStep(src, id, by, step){
  const o = ownerObj(src, id), s = objAt(o, state.today), st = OWNER_STEPS[step];
  if(!s || !st) throw new Error('объекта или действия нет');
  if(st.from.indexOf(s.status)===-1) throw new Error(`«${step}» недоступно в статусе «${s.status}»`);
  if(st.who==='автор' && by!==s.author) throw new Error(step==='отозвать' ? 'отзывает автор' : 'отправляет автор');
  if(st.who==='согласующий'){
    if(!holds(OWNER_ROLE[src], by)) throw new Error('это действие Согласующего');
    if(step!=='закрыть' && by===s.author) throw new Error(src==='gd' ? 'своё госрешение автор не рассматривает' : 'свою программу автор не рассматривает');
  }
  if(st.who==='администратор' && by!==ADMIN) throw new Error('возвращает администратор');
  o.ev.push(Object.assign({t:state.today, status:st.to(src), by, how:step}, step==='отозвать' ? {recalled:true, how:'отозвано автором'} : {}));
}
function lpExtend(id, by, newTo, reason){ // «Продлить срок»: только «Дата по», статус не меняется
  const o = ownerObj('lp', id), s = objAt(o, state.today);
  if(!s) throw new Error('программы нет');
  if(!holds('lp-approver', by)) throw new Error('продлевает Согласующий');
  if(s.status!=='Действует') throw new Error('продлить можно только действующую программу');
  if(!newTo || newTo<s.dateFrom || (s.dateTo && newTo<=s.dateTo)) throw new Error('новая «Дата по» должна быть позже прежней');
  if(!reason) throw new Error('нужны причина и реквизиты основания продления');
  o.ev.push({t:state.today, dateTo:newTo, by, how:'срок продлён до '+fmt(newTo), reason});
}
function lpChangeBase(id, by, gdId, reason){ // «Сменить основание»: только ссылка на госрешение
  const o = ownerObj('lp', id), s = objAt(o, state.today), g = ownerAt('gd', gdId, state.today);
  if(!s) throw new Error('программы нет');
  if(!holds('lp-approver', by)) throw new Error('основание меняет Согласующий');
  if(s.status!=='Действует') throw new Error('сменить основание можно только у действующей программы');
  if(!g || g.status!=='Действует') throw new Error('новое основание — только действующее госрешение');
  if(gdId===s.base) throw new Error('это прежнее основание');
  if(s.dateFrom < g.date) throw new Error('«Дата с» программы раньше даты нового решения');
  if(!reason) throw new Error('нужны причина и реквизиты');
  o.ev.push({t:state.today, base:gdId, by, how:'основание сменено на '+gdId, reason});
}
/* действия в карточке заявки (демо соседа): специалист заявки, подтверждение комплекта, отдел, комиссия */
function apActorOk(s, by){ // специалист заявки на дату или его замещающий; без закрепления — автор заявки
  const c = apSpecOn(s, state.today) || s.author;
  return by===c || actingFor(c, state.today)===by;
}
function apStep(id, by, step, arg, reason){
  const o = ownerObj('ap', id), d = state.today, s = objAt(o, d);
  if(!s) throw new Error('заявки нет');
  const st = s.status, draft = AP_DRAFT.includes(st);
  const need = (c, msg)=>{ if(!c) throw new Error(msg); };
  const spec = ()=>need(apActorOk(s, by), 'это действие специалиста заявки');
  const role = r=>need(holds(r, by), `это действие роли «${roleOf(r).name}»`);
  let e;
  if(step==='передать на подтверждение комплекта'){
    spec(); need(draft && !s.gf, 'комплект уже на подтверждении или подтверждён');
    e = {gf:'handed', how:'комплект проверен специалистом, передан на подтверждение комплекта'};
  } else if(step==='подтвердить комплект'){
    role('ap-gf'); need(draft && s.gf==='handed', 'подтверждать нечего');

    need(draft && s.gf==='confirmed' && !s.concl[arg], 'заключение вносится после подтверждения комплекта, одно на отдел');
    e = {concl:arg, how:'внесено заключение: '+AP_DEPTS[arg].name};
  } else if(step==='отправить в комиссию'){
    spec(); need(draft && s.gf==='confirmed' && s.depts.every(k=>s.concl[k]), 'комплект не подтверждён или внесены не все заключения');
    e = {status:'На рассмотрении', how:'отправлено в комиссию'};
  } else if(step==='вынести на заседание' || step==='запросить замену'){
    role('ap-commission'); need(st==='На рассмотрении' && s.phase==='prelim', 'действие предварительного изучения');
    e = step==='вынести на заседание'
      ? {phase:'session', session:addWorkdays(d, 5), deadline:addWorkdays(d, 3), how:'вынесено на заседание комитета'}
      : {status:'Требуется доп. информация', gfReset:true, conclReset:true, how:'запрошена замена документа — возврат на дозаполнение'};
  } else if(step==='проголосовать'){
    need(st==='На рассмотрении' && s.phase==='session', 'голосуют на заседании');
    need(s.com.members.indexOf(by)!==-1, 'голосует член комиссии'); need(!s.votes[by], 'голос уже подан');
    e = {vote:by, how:'проголосовал: '+(arg||'одобрить')};
  } else if(step==='одобрить' || step==='отклонить' || step==='вернуть'){
    need(st==='На рассмотрении' && s.phase==='session', 'решение выносится на заседании'); need(by===s.com.chair, 'решение выносит председатель');
    const n = Object.keys(s.votes).length;
    need(n>=quorumOf(s), `кворум не набран: проголосовало ${n} из ${s.com.members.length}, требуется ${quorumOf(s)}`);
    e = step==='одобрить' ? {status:'Одобрена', how:'одобрено комиссией'} : step==='отклонить' ? {status:'Отклонена', how:'отклонено комиссией'}
      : {status:'Требуется доп. информация', gfReset:true, conclReset:true, how:'возвращено комиссией на дозаполнение'};
  } else if(step==='отклонить за неустранение недостатков'){
    role('ap-commission'); need(st==='Требуется доп. информация', 'так отклоняется заявка, возвращённая на дозаполнение'); need(reason, 'нужна причина');
    e = {status:'Отклонена', how:'отклонено за неустранение недостатков', reason};
  } else if(step==='сменить программу'){
    spec(); need(st!=='На рассмотрении', 'на рассмотрении программу не сменить — сначала возврат комиссией');
    need(draft, 'программа меняется в «Новый» и «Требуется доп. информация»');
    need(arg && arg!==s.program, 'выберите другую программу'); need(programAccepts(arg, d), 'новая программа должна принимать заявки');
    need(reason, 'нужна причина');
    e = {program:arg, how:'программа сменена на '+arg, reason};
  } else if(step==='отозвать'){
    spec(); need(st==='На рассмотрении' || st==='Требуется доп. информация', 'отозвать можно на рассмотрении или на дозаполнении');
    e = {status:'Отозвана', how:'отозвано специалистом'};
  } else if(step==='удалить'){
    spec(); need(st==='Новый', 'удаляется только «Новый»');
    e = {deleted:true, how:'заявка удалена'};
  } else if(step==='сформировать кредит'){
    spec(); need(st==='Одобрена', 'кредит формируется по одобренной заявке');
    need(programAccepts(s.program, d), 'программа не принимает заявки — кредит не формируется');
    e = s.flow==='B' ? {status:'Ожидает решения/программы', how:'кредит сформирован — ждёт привязки решения и программы'}
      : {status:'На оформлении', how:'кредит сформирован, договоры на регистрации'};

    spec(); need(st==='На оформлении', 'договоры регистрируются на оформлении');
    e = {status:'Оформлена', how:'договоры зарегистрированы'};
  } else if(step==='заменить документ'){
    spec(); need(apExpiredDocs(s, d).some(x=>x.name===arg), 'просроченного документа нет');
    e = {renewed:arg, how:`заменён документ «${arg}»`};
  } else throw new Error('такого действия у заявки нет');
  o.ev.push(Object.assign({t:d, by}, e));
}
/* действия в карточке документа (демо соседа): автор, согласующий, подписант, регистратор, получатель,
   исполнитель резолюции, контролёр, архивариус; кто действует за кого — пишет сам документ */
function docStep(id, by, step, arg, reason){
  const o = ownerObj('doc', id), d = state.today, s = docAt(o, d);
  if(!s) throw new Error('документа нет');
  const need = (c, msg)=>{ if(!c) throw new Error(msg); };
  const forWho = who=>who!==by ? {for:who} : {};

  if(step==='на согласование'){

    e = Object.assign(step==='подписать' ? {sign:true, how:by===s.signer ? 'подписал' : 'подписал по приказу о замещении с правом подписи'}
      : {refuse:reason, how:'отказал: '+reason}, forWho(s.signer));
  } else if(step==='зарегистрировать'){
    need(holds('doc-registrar', by), 'это действие роли «Регистратор»'); need(s.stage==='Подпись' && !!s.signed, 'регистрируется подписанный документ');
    const n = (s.kind==='исх' ? 'Исх-' : s.kind==='вх' ? 'Вх-' : 'Пр-') + nextId('');
    e = {register:n, how:'зарегистрирован, № '+n};
  } else if(step==='отметить отправку'){
    need(holds('doc-registrar', by), 'отправку отмечает регистратор'); need(s.kind==='исх' && s.stage==='Зарегистрирован', 'отправляется зарегистрированный исходящий');
    need(arg && s.addressees.includes(arg) && !s.sent[arg], 'адресат не выбран или ему уже отправлено');
    e = {send:arg, how:'отправлено: '+arg};
  } else if(step==='дать резолюцию'){ // arg: {resp, co, due, text, parent}

    if(step==='отозвать резолюцию'){ need(reason, 'нужно основание отзыва'); e = {revoke:r.id, how:'резолюция отозвана автором: '+reason}; }
    else { need(r.co.indexOf(arg.who)!==-1, 'такого соисполнителя у резолюции нет'); e = {coRemove:{res:r.id, who:arg.who}, how:`соисполнитель убран: ${emp(arg.who).name}`}; }
  } else if(step==='заменить участника'){ // arg: {role, from, to, res, issue}
    const a = arg || {}, R = DOC_REPLACE[a.role], r = a.res && s.res[a.res];

    const rr = ruleForKind(R.kind), ap = rr && authorPostOf(rr), kp = ap ? postHolderOn(ap, d) : null; // держатель «Кто поручил» правила шага — право есть всегда

    e = {replace:{role:a.role, from:a.from, to:a.to, res:a.res||null, issue:a.issue||null}, how:`участник заменён: ${a.role} ${emp(a.from).name} → ${emp(a.to).name}: ${reason}`};

    e = Object.assign(step==='исполнено' ? {resDone:arg, text:reason, how:'отмечено «Исполнено»: '+reason}
      : {resRefuse:arg, text:reason, how:'отказано в исполнении: '+reason}, forWho(r.resp));
  } else if(step==='подтвердить' || step==='вернуть'){
    const r = s.res[arg]; need(r && r.state==='control', 'исполнение не ждёт контролёра');
    need(by===r.control || actingFor(r.control, d)===by, 'решает контролёр или его замещающий');
    if(step==='вернуть') need(reason, 'нужен комментарий');

    o.ev.push(CLF(t, by, 'F-'+(101+n), a.kind, a.occurred, {until:a.until || undefined, doc:a.doc || undefined, cond:a.cond || undefined}));
    return 'F-'+(101+n);
  }
  if(step==='не фактор'){ o.ev.push({t, by, notFactor:{cond:a.cond, reason:a.reason.trim()}, how:`условие ${a.cond}: рассмотрено, не фактор — ${a.reason.trim()}`}); return; }
  if(step==='решение') o.ev.push({t, by, decision:{fact:a.fact, doc:a.doc.trim()}, how:`факт ${a.fact}: внесены реквизиты решения комитета — ${a.doc.trim()}`});
  else o.ev.push({t, by, annul:{fact:a.fact, reason:a.reason.trim()}, how:`факт ${a.fact} аннулирован: ${a.reason.trim()}`});
}
/* пачка на подпись — одно действие, подпись пишется в журнал каждого документа отдельно */
function docSignBatch(ids, by){
  const live = ids.filter(id=>{ const s = ownerAt('doc', id, state.today); return s && s.stage==='Подпись' && !s.signed; });
  if(!live.length) throw new Error('в пачке нечего подписывать');
  live.forEach(id=>{ const s = ownerAt('doc', id, state.today);
    if(!(by===s.signer || signerOn(s.signer, state.today)===by)) throw new Error(`${id}: подписывает подписант или замещающий по приказу с правом подписи`); });
  live.forEach(id=>docStep(id, by, 'подписать'));
  return live.length;
}
/* что документооборот читает у заданий по ключу шага: действующий срок, продления и исход */
function stepByKey(key){
  const ts = state.tasks.filter(t=>t.povodKey===key);
  if(!ts.length) return null;
  const t = ts[ts.length-1], o = outcomeOf(t);
  return {task:t.id, initialDue:t.dueDate, setDue:dueOf(t), extensions:extensionsOf(t), outcome:o ? o.outcome : null,
    closed:isTerminal(t) ? stateEntry(t).t : null, rounds:ts.length};
}

function syncCurrent(t){

  Object.defineProperty(t, 'current', {value:Object.freeze({ev, since:e.t, outcome:ev==='закрыто' ? e.outcome||null : null}),

function checkStateField(){

    return !c || c.ev!==ev || c.outcome!==(ev==='закрыто' ? stateEntry(t).outcome||null : null); })
    .map(t=>({task:t.id, поле:t.current ? t.current.ev : null, журнал:lastEv(t)}));

function povodByKey(k){ return state.povods.find(p=>p.key===k); }
/* события, которые состояние не меняют: ход, продление */
const NEUTRAL_EV = ['отметка о ходе','запрошено продление','продление утверждено','продление отклонено',
  'повод отпал']; // «повод отпал» — ось подтверждения у задания, которое ждёт решения контролёра
function stateEntry(t){
  for(let i=t.journal.length-1;i>=0;i--) if(NEUTRAL_EV.indexOf(t.journal[i].ev)===-1) return t.journal[i];
  return t.journal[0];
}
function lastEv(t){ // переадресация и переназначение возвращают задание в «поручено»
  const ev = stateEntry(t).ev;
  return (ev==='переадресовано' || ev==='переназначено' || ev==='возвращено в очередь') ? 'поручено' : ev;
}
function isTerminal(t){ return lastEv(t)==='закрыто'; }
function outcomeOf(t){ if(!isTerminal(t)) return null; const e=stateEntry(t); return {outcome:e.outcome, reason:e.reason||null, by:e.by||null}; }

/* срок: установленный — последний утверждённый; первоначальный — t.dueDate */
function dueOf(t){ let d=t.dueDate; t.journal.forEach(e=>{ if(e.ev==='продление утверждено') d=e.newDue; }); return d; }
function extensionsOf(t){ return t.journal.filter(e=>e.ev==='продление утверждено').length; }
function approverOf(t){ return t.approver || t.controller || t.author; } // утверждающего продление может назвать повод (автор резолюции)
function pendingExtension(t){
  for(let i=t.journal.length-1;i>=0;i--){
    const ev=t.journal[i].ev;
    if(ev==='запрошено продление') return t.journal[i];
    if(ev==='продление утверждено' || ev==='продление отклонено') return null;
  }
  return null;
}

function coversKey(t, key){ return !isTerminal(t) && t.povodKey===key; }

function readOnClose(t){

function checkChannels(x){

  if(x.some(y=>SIGNAL_CHANNELS.indexOf(y)===-1)) throw new Error('способ — всплывающее, SMS или e-mail');

/* настройка обычного уведомления — администратор заданий, с основанием; получателей и выключения нет */
function editNotif(kind, changes, o){
  o = o || {};
  if(NOTIF_KINDS.indexOf(kind)===-1) throw new Error('уведомления вне закрытого списка нет');
  if(!isTasksAdmin(o.by)) throw new Error('настраивает администратор заданий — остальным на чтение');
  if(!o.basis) throw new Error('нужно основание правки — приказ или служебная записка');
  const c = state.notifSettings[kind], was = {};
  Object.keys(changes).forEach(f=>{
    const x = changes[f];
    if(f==='text'){ if(!String(x||'').trim()) throw new Error('текст уведомления не пустой'); }
    else if(f==='channels') checkChannels(x);
    else if(f==='recipients') throw new Error('получатели определены механизмом и не меняются');
    else if(f==='off' || f==='enabled') throw new Error('обычное уведомление выключить нельзя');
    else throw new Error(`«${f}» не настраивается`);
    was[f] = c[f];
  });
  if(!Object.keys(changes).some(f=>JSON.stringify(changes[f])!==JSON.stringify(c[f]))) throw new Error('значения не изменились');
  Object.assign(c, changes);
  c.history.push({t:state.today, by:o.by, basis:o.basis, was});
  return c;
}
function notify(t, kind, to, due, opts){
  if(NOTIF_KINDS.indexOf(kind)===-1) throw new Error('уведомление вне закрытого списка: '+kind);
  const closer = kind==='закрыто' ? (closerOf(t) || stateEntry(t).decidedBy || null) : null; // закрывшему сообщение не идёт, принявший контролёр тоже закрыл
  const send = x=>{ if(closer && x===closer){ if(!t.ownSeries) holdSeq(x, t.originKind, kind); } else pushNotif(kind, t.id, x, due, t.originKind, opts); };
  if(!to && !t.assignee && t.queue){ queueHolders(t).forEach(send); return; } // очередь, которую никто не взял, — всем носителям роли
  send(to || t.assignee || null);
}
/* Номера заданий стенда записаны в контрольном наборе, а счётчик у них общий с сообщениями. Поэтому счётчик идёт как шёл: снятое сообщение
   и сообщение, которое теперь складывается в чужую сводку, номер занимают, новое сообщение — нет (берёт свой, из отдельного ряда) */
function holdSeq(to, originKind, kind){
  const dg = state.digest, k = dg && originKind ? '~'+[to, originKind, kind].join('|') : null;
  if(k && dg[k]) return null;
  if(k) dg[k] = true;
  return state.seq++;
}
function holdNotify(t, kind){
  if(t.ownSeries) return; // своя серия общий счётчик не трогает
  if(!t.assignee && t.queue) queueHolders(t).forEach(h=>holdSeq(h, t.originKind, kind));
  else holdSeq(t.assignee || null, t.originKind, kind);
}
const NOTE_EXTRA = 900000;
/* за один прогон или одно пакетное действие — одна запись на человека и вид уведомления, внутри перечень заданий */
function pushNotif(kind, taskId, to, due, originKind, opts){
  if(kind==='поручено' && !due && taskId) due = dueOf(taskOf(taskId)); // срок назван в «поручено», поэтому в день выдачи «срок близко» не нужен
  const own = !!(taskId && (taskOf(taskId)||{}).ownSeries); // сообщение о задании своей серии общий счётчик не трогает
  const held = own || (opts && opts.noSeq) ? null : holdSeq(to, originKind, kind), dg = state.digest, key = dg ? [to, kind].join('|') : null;
  const item = Object.assign({taskId, due:due||null}, kind==='переадресовано' ? {newAssignee:taskOf(taskId).assignee} : {});
  if(key && dg[key]){
    const n = dg[key];
    if(n.own && !own){ n.id = held===null ? 'N'+(NOTE_EXTRA+state.noteExtra++) : 'N'+held; delete n.own; } // прежнее задание вошло в сводку: сообщение получает номер, который заняло бы само
    n.count++; if(taskId) n.items.push(item);
    if(n.readHow==='задание закрыто' && taskId && !isTerminal(taskOf(taskId))){ n.read = false; n.readAt = null; n.readHow = null; } // в перечень пришло открытое
    return n;
  }
  const cfg = state.notifSettings[kind]; // текст и способ — из настройки на момент отправки
  const n = messageOf({id:own ? 'N'+(NOTE_OWN+state.noteOwn++) : held===null ? 'N'+(NOTE_EXTRA+state.noteExtra++) : 'N'+held, t:state.today, kind, originKind, taskId, to, due:due||null, count:1, items:taskId ? [item] : [], text:cfg.text, channels:cfg.channels.slice()});
  if(own) n.own = true;
  state.notifications.push(n);
  if(key) dg[key] = n;
  popFlush();
  return n;
}
function withDigest(fn){
  if(state.digest) return fn(); // уже внутри прогона или пакетного действия
  state.digest = {};
  try{ return fn(); } finally { state.digest = null; popFlush(); }
}
/* носители роли очереди, кроме исключённых (автор объекта при четырёх глазах) */
function queueHolders(q){ const r = roleOf(q.queue.role); return r ? r.holders.filter(h=>(q.queue.exclude||[]).indexOf(h)===-1 && !goneOn(h, state.today)) : []; }
function inQueue(t){ return !!t.queue && !t.assignee; }
function notifiedOnce(taskId, kind, due){ // «срок близко» / «срок истёк» — однократно на каждый установленный срок
  return state.notifications.some(n=>n.kind===kind && n.items.some(i=>i.taskId===taskId && (due===undefined || i.due===due)));
}

/* ---------- 5. переходы задания ---------- */
/* действует за исполнителя: сам исполнитель или его замещающий на дату (задание не переезжает) */
function actingOn(t, d){ const k = t.originKind && kindOf(t.originKind); return k && k.personal ? t.assignee : actingFor(t.assignee, d); } // «лично» — без замещения
function canActFor(t, by){ return !!by && (by===t.assignee || actingOn(t, state.today)===by); }
function actor(t, by){ return by===t.assignee ? {by} : {by, for:t.assignee}; }
function takeInternal(t, asOf){ log(t,'принято',{t:asOf||state.today, by:t.assignee}); }
function take(taskId, by){ // «Взять в работу»: только это событие защищает от переадресации
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(inQueue(t)){ // в очереди роли «Взять в работу» — закрепление за взявшим
    if(!by || queueHolders(t).indexOf(by)===-1)
      throw new Error((t.queue.exclude||[]).indexOf(by)!==-1 ? 'по своему объекту автор задание не берёт' : 'из очереди берёт носитель роли');
    t.assignee = by; t.queueAssignedBy = null; t.addr = Object.assign({}, t.addr, {assignee:by, responsible:by});
    log(t,'принято',{by, закреплено:roleTitle(t.queue.role)});
    holdAccepted(t, by);
    return t;
  }
  by = by || t.assignee;
  if(lastEv(t)!=='поручено') throw new Error(kindTake(t)==='не нужно' ? 'принятие не нужно — задание уже в работе' : 'взять в работу можно только порученное задание');
  if(!canActFor(t, by)) throw new Error('в работу берёт исполнитель или его замещающий');
  log(t,'принято',actor(t, by));
  holdAccepted(t, by);
  return t;
}
function holdAccepted(t, by){ if(t.ownSeries) return; [t.author, t.controller].filter((x,i,a)=>x && x!==by && a.indexOf(x)===i).forEach(x=>holdSeq(x, t.originKind, 'принято')); } // сообщения «взято в работу» нет, автору делать нечего
function claimInternal(t, asOf, proof, by){
  const extra = Object.assign({claimedAt:asOf||state.today}, by ? actor(t, by) : {});
  if(proof) extra.proof = proof; // ссылка на подтверждение — реквизит сдачи
  if(t.controller) log(t,'ожидает приёмки',extra);
  else log(t,'заявлено',extra);
}
function claim(taskId, proof, by){
  const t = taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  by = by || t.assignee;
  const st = lastEv(t);
  if(ownerExecOf(t)) throw new Error(`работа делается у владельца (${actionOf(t.action).where}) — задание закроется само`);
  if(st==='поручено') throw new Error('сначала «Взять в работу»');
  if(st!=='принято' && st!=='возвращено') throw new Error('заявить можно только задание в работе');
  if(!canActFor(t, by)) throw new Error('заявляет исполнитель или его замещающий');
  const a = t.action ? actionOf(t.action) : null;
  if(a && a.needsProof && !proof) throw new Error('действие требует ссылку на подтверждение');
  claimInternal(t, null, proof||null, by);
  if(t.controller && t.controller!==by) notify(t,'сдано-на-приёмку', t.controller, undefined, {noSeq:true}); // контролёр узнаёт сразу, а не заданием через 3 р.д.
  return t;
}
function rejectInternal(t, note, asOf, by){
  log(t,'отказано',Object.assign({note, t:asOf||state.today}, by ? actor(t, by) : {by:t.assignee}));
}
function reject(taskId, note, by){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(inQueue(t)) throw new Error('задание в очереди никем не взято — отказываться не от чего');
  if(['поручено','принято','возвращено'].indexOf(lastEv(t))===-1) throw new Error('отказаться можно до заявления');
  if(by && !canActFor(t, by)) throw new Error('отказывается исполнитель или его замещающий');
  if(!String(note||'').trim()) throw new Error('нужна причина отказа');
  if(t.queue && !t.queueAssignedBy){ // взятое самим из очереди: отказ возвращает задание в очередь, срок прежний, «отклонено» не уходит
    const from = t.assignee;
    t.assignee = null; t.addr = Object.assign({}, t.addr, {assignee:null, responsible:null});
    log(t,'возвращено в очередь',Object.assign({from, note}, by && by!==from ? {by, for:from} : {by:from}));
    queueHolders(t).filter(h=>h!==from).forEach(h=>pushNotif('поручено', t.id, h, null, t.originKind));
    return t;
  }
  rejectInternal(t, note, null, by);
  return t;
}
/* «Снять» — автор, из любого нетерминального, с основанием; ключ, снятый с поручения, по правилу не переиздаётся, пока жив.
   Шаг процесса не снимается: его судьбу решает владелец */
function releaseTask(taskId, by, reason){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто — снимать нечего');
  const k = t.originKind && kindOf(t.originKind);
  if(t.esc || (k && k.ownerExec && k.genus==='шаг')) throw new Error('снять нельзя: судьбу шага решает владелец — задание закроется отпадением повода');
  if(by!==t.author) throw new Error('снимает автор задания');
  if(!reason) throw new Error('нужно основание снятия');
  log(t,'закрыто',{outcome:'снято', reason, by});
  notify(t,'закрыто');
  const p = t.povodKey && povodByKey(t.povodKey);
  if(p && p.status!=='gone') log(p,'снят без поручения',{task:t.id});
  return t;
}
function povodReleased(p){ // последнее событие жизни ключа — снятие с поручения
  for(let i=p.journal.length-1;i>=0;i--){
    const ev=p.journal[i].ev;
    if(ev==='снят без поручения') return true;
    if(ev==='появился' || ev==='вновь-появился' || ev==='отпал') return false;
  }
  return false;
}
/* «Просрочено задание» по заданию: руководитель, получивший его, переназначает и сам продлевает срок — с основанием, без запроса */
function overdueTaskOf(t){ const key = `pk-overdue|task:${t.id}|`; return state.tasks.find(x=>x.povodKey===key && !isTerminal(x)) || null; }
function overdueChiefOf(t){ const e = overdueTaskOf(t); return e ? e.assignee : null; }
/* руководитель по просрочке — кому выдано задание о просрочке: адресат, его замещающий и вернувшийся руководитель, за которого действовал замещающий */
function isOverdueChief(t, by){
  const e = overdueTaskOf(t), resp = e && e.addr && e.addr.responsible;
  return !!e && !!by && (canActFor(e, by) || by===resp || (!!resp && actingFor(resp, state.today)===by));
}
function closeOverdueByChief(t, by){
  const e = overdueTaskOf(t); if(!e) return;
  log(e,'закрыто',Object.assign({outcome:'исполнено', by, how:'срок продлён руководителем'}, by!==e.assignee ? {for:e.assignee} : {}));
  notify(e,'закрыто');
}
function chiefExtendCheck(t, by, newDue, reason){
  const e = overdueTaskOf(t);
  if(!e || !isOverdueChief(t, by)) throw new Error('без запроса продлевает руководитель, получивший задание о просрочке');
  if(namedDue(t) || t.approver) throw new Error('срок называет владелец — продлевает только утверждающий');
  if(tplDue(t)) throw new Error('срок назвал шаблон владельца — руководитель его не продлевает');
  if(!newDue || newDue<state.today || newDue<=dueOf(t)) throw new Error('новый срок — не раньше сегодняшнего и позже прежнего');
  if(!String(reason||'').trim()) throw new Error('нужно основание продления');
}
function tplDue(t){ return !!(t.dueOwn && t.dueOwn.n); } // срок назвал шаблон соседа — срок владельца
function tplLocked(t){ const r = t.ruleId && ruleAsIssued(t); return tplDue(t) && !(r && r.extendBy); } // утверждающий не объявлен — в заданиях не продлевается
function chiefMayExtend(t, v){ return !isTerminal(t) && isOverdueChief(t, v) && !namedDue(t) && !t.approver && !tplDue(t); }
function extendByChief(taskId, by, newDue, reason){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  chiefExtendCheck(t, by, newDue, reason);
  log(t,'продление утверждено',{by, prevDue:dueOf(t), newDue, reason, без_запроса:true});
  closeOverdueByChief(t, by);
  [t.assignee, t.controller, t.author].filter((x, i, a)=>x && (x===t.assignee || x!==by) && a.indexOf(x)===i)
    .forEach(x=>notify(t,'решение-по-продлению', x)); // автор узнаёт о продлении, отменить его не может
  return t;
}
/* неразобранная очередь: назначают автор, держатель «Кто поручил» на дату и его руководитель (вторая ступень) */
function queueStep2Open(t, d){ const due = dueOf(t); return !!due && due<d && workdaysBetween(due, d)>=zdThr('overdueWd', `pk-overdue|task:${t.id}|никто не взял, 5-й р.д.`, d); }
function queueAssigners(t, d){ const s1 = queueStepOf(t, 1, d), s2 = queueStep2Open(t, d) ? queueStepOf(t, 2, d) : null; // с замещающими на дату
  return [t.author, s1, s1 && actingFor(s1, d), s2, s2 && actingFor(s2, d)].filter((x, i, a)=>x && a.indexOf(x)===i); }
/* отказ назначенного из очереди разбирает назначивший (или его замещающий): назначает другого носителя роли или возвращает в очередь */
function assignerMay(t, v){ return !!t && !!t.queue && !!t.queueAssignedBy && !isTerminal(t) && lastEv(t)==='отказано' && !!v &&
  (v===t.queueAssignedBy || actingFor(t.queueAssignedBy, state.today)===v); }
function returnToQueue(taskId, by, reason){
  const t = taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!assignerMay(t, by)) throw new Error('вернуть в очередь может назначивший после отказа назначенного');
  if(!String(reason||'').trim()) throw new Error('нужно основание');
  const from = t.assignee;
  t.assignee = null; t.queueAssignedBy = null; t.addr = Object.assign({}, t.addr, {assignee:null, responsible:null});
  log(t,'возвращено в очередь',{from, by, note:reason, assigner:true});
  queueHolders(t).filter(h=>h!==from).forEach(h=>pushNotif('поручено', t.id, h, null, t.originKind));
  return t;
}
function reassignTask(taskId, newAssignee, by, reason, newDue){ // решение человека: автор или руководитель исполнителя по цепочке
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто — переназначать нечего');
  if(escalateOf(t) && escalateOf(t).reassign===false) throw new Error('адресата называет владелец — задание не переназначается');
  if(DOC_NAMED.indexOf(t.originKind)!==-1) throw new Error('исполнителя называет документ: «Заменить участника» в карточке документа');
  if(inQueue(t)){
    if(queueAssigners(t, state.today).indexOf(by)===-1) throw new Error('из очереди назначает «Кто поручил», его руководитель — с 5-го р.д. после срока');
    if(!reason) throw new Error('нужно основание назначения');
    if(queueHolders(t).indexOf(newAssignee)===-1) throw new Error('назначить можно только носителя роли');
    t.assignee = newAssignee; t.addr = Object.assign({}, t.addr, {assignee:newAssignee, responsible:newAssignee});
    t.queueAssignedBy = by; // отказ назначенного уйдёт назначившему, а не обратно в очередь
    log(t,'переназначено',{from:null, to:newAssignee, by, reason});
    notify(t,'поручено');
    return t;
  }
  if(by===t.assignee) throw new Error('исполнитель задание не передаёт');
  const asg = assignerMay(t, by);
  if(by!==t.author && !chiefChainIncludes(t.assignee, by) && !isOverdueChief(t, by) && !asg) throw new Error('переназначает автор, руководитель исполнителя по цепочке или назначивший из очереди после отказа');
  if(!reason) throw new Error('нужно основание переназначения');
  if(!emp(newAssignee) || newAssignee===t.assignee) throw new Error('выберите другого исполнителя');
  if(t.queue && queueHolders(t).indexOf(newAssignee)===-1) throw new Error('задание очереди переназначается только носителю роли');
  if(newDue) chiefExtendCheck(t, by, newDue, reason); // новый срок в том же окне — только у руководителя по просрочке
  const from = t.assignee;
  t.assignee = newAssignee;
  if(asg) t.queueAssignedBy = by; // назначил другого — следующий отказ снова к нему
  log(t,'переназначено',{from, to:newAssignee, by, reason});
  if(newDue){ log(t,'продление утверждено',{by, prevDue:dueOf(t), newDue, reason, без_запроса:true}); closeOverdueByChief(t, by);
    if(t.author && t.author!==by) notify(t,'решение-по-продлению', t.author); }
  startWithoutTake(t);
  notify(t,'переадресовано', from);
  notify(t,'поручено');
  return t;
}
function requestExtension(taskId, by, newDue, reason){
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!canActFor(t, by)) throw new Error('продление запрашивает исполнитель или его замещающий');
  if(namedDue(t)) throw new Error('срок называет владелец — переносится в его записи, не здесь');
  if(tplLocked(t)) throw new Error('срок назвал шаблон модуля-источника — продлевает утверждающий, объявленный правилом; его нет — в заданиях срок не продлевается');
  if(pendingExtension(t)) throw new Error('предыдущий запрос продления ещё без решения');
  if(!newDue || newDue<=dueOf(t)) throw new Error('новая дата должна быть позже установленного срока');
  if(!reason) throw new Error('нужно основание продления');
  log(t,'запрошено продление',Object.assign(actor(t, by), {newDue, reason}));
  notify(t,'запрошено-продление', approverOf(t));
  return t;
}
function decideExtension(taskId, by, approve, note){ // решает тот, кто ставил срок: контролёр, если назван, иначе автор
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  const req = pendingExtension(t);
  if(!req) throw new Error('запроса продления нет');
  if(by!==approverOf(t)) throw new Error('решение по продлению принимает '+(t.approver ? 'автор резолюции '+emp(t.approver).name : t.controller?'контролёр':'автор'));
  if(!approve && !String(note||'').trim()) throw new Error('нужна причина отклонения');
  if(approve) log(t,'продление утверждено',{by, prevDue:dueOf(t), newDue:req.newDue});
  else log(t,'продление отклонено',{by, note});
  notify(t,'решение-по-продлению', t.assignee);
  if(t.controller && t.controller!==by) notify(t,'решение-по-продлению', t.controller);
  return t;
}
function addProgress(taskId, by, text, opts){ // отметка о ходе: состояние не меняет, уведомлений не шлёт, не правится
  opts = opts || {};
  const t=taskOf(taskId);
  if(!t || isTerminal(t)) throw new Error('задание закрыто');
  if(!visibleTo(t, by)) throw new Error('отметку оставляет участник задания');
  if(!text) throw new Error('нужен текст отметки');
  const extra = Object.assign(actor(t, by), {text, link:opts.link||null});
  if(opts.fixes!=null){
    const target = t.journal[opts.fixes];
    if(!target || target.ev!=='отметка о ходе') throw new Error('исправлять можно только отметку о ходе');
    extra.fixes = opts.fixes;
  }
  log(t,'отметка о ходе',extra);
  return t;
}
/* ось подтверждения повода: ключ отпал */
function povodGoneFor(t){
  if(!t.povodKey) return true;
  const p = povodByKey(t.povodKey);
  return !p || p.status==='gone';
}
function acceptDecision(taskId, approve, note, by){ // решение контролёра; у задания по правилу «Принять» — только когда повод отпал; вернуть — только с основанием
  const t=taskOf(taskId); if(!t||isTerminal(t)) return;
  if(lastEv(t)!=='ожидает приёмки') return;
  if(by && by!==t.controller) throw new Error('решение принимает контролёр');
  if(approve){
    if(t.kind==='rule' && !povodGoneFor(t)) throw new Error('повод ещё жив — принять нельзя, только вернуть');
    log(t,'закрыто',{outcome:'исполнено', decidedBy:t.controller}); notify(t,'закрыто');
  } else {
    if(!String(note||'').trim()) throw new Error('нужно указать, что доделать');
    log(t,'возвращено',{note, by:t.controller}); notify(t,'возвращено');
  }
}
const CASE_TYPES = ['заёмщик','заявка','кредит','залог','взыскание'];
/* за кого человек действует на дату: замещающий поручает за руководителя */
function principalsOn(by, d){ return ABSENCES.filter(a=>a.sub===by && a.from<=d && d<=a.to).map(a=>a.emp); }
/* кому можно поручить: подчинённые по цепочке — свои и того, за кого действует */
function assignableBy(by, d){
  const out = subordinatesOf(by).map(e=>e.id);
  principalsOn(by, d||state.today).forEach(p=>subordinatesOf(p).forEach(e=>{ if(e.id!==by && out.indexOf(e.id)===-1) out.push(e.id); }));
  return out;
}
/* автор поручения: сам руководитель исполнителя по цепочке или тот, за кого действует замещающий */
function freeAuthor(by, to, d){
  if(chiefChainIncludes(to, by)) return {author:by};
  const p = principalsOn(by, d).find(x=>chiefChainIncludes(to, x));
  if(p) return {author:p, issuedBy:by};
  throw new Error(`${emp(to).name} — не подчинённый автора: поручать можно только вниз по цепочке, просьба в другой отдел идёт через общего руководителя или служебной запиской`);
}
function checkCases(cases){
  if(!Array.isArray(cases)) throw new Error('дело поручения — список: заёмщик, заявка, кредит, залог или взыскание');
  cases.forEach(c=>{
    if(!c || CASE_TYPES.indexOf(c.type)===-1) throw new Error('дело поручения — заёмщик, заявка, кредит, залог или взыскание');
    if(!c.id) throw new Error('у дела поручения нужен номер');
  });
  return cases.filter((c, i)=>cases.findIndex(x=>x.type===c.type && x.id===c.id)===i);
}
function createFreeTask(p){ // свободное поручение: ключа не имеет; контролёр по умолчанию автор; основание и дело необязательны
  if(!p.assignee || !emp(p.assignee)) throw new Error('исполнителя называет автор');
  if(!p.author || !emp(p.author)) throw new Error('у поручения нужен автор');
  if(!String(p.label||'').trim()) throw new Error('у поручения нужна формулировка');
  const who = freeAuthor(p.author, p.assignee, state.today);
  let cases = checkCases(p.cases||[]), controller = p.controller || who.author;
  if(p.basis){ // поручение по обзору: обычное свободное задание — исполнителя называет автор, контролёр — автор
    const s = ownerAt('an', p.basis, state.today);
    if(!s) throw new Error(`обзора ${p.basis} нет`);
    if(!s.approved) throw new Error(`по черновику ${p.basis} поручать нечего — основание поручения утверждённый обзор`);
    if(s.replacedBy) throw new Error(`обзор ${p.basis} заменён ${s.replacedBy} — поручение ставится по действующему`);
    if(p.object && s.worklist.indexOf(p.object)===-1) throw new Error(`объекта ${p.object} в рабочем списке ${p.basis} нет`);
    if(p.controller && p.controller!==p.author && p.controller!==who.author) throw new Error('контролёр поручения по обзору — его автор');
    controller = who.author;
    if(p.object) cases = checkCases(cases.concat({type:'кредит', id:p.object})); // рабочий список обзора — кредиты
  }
  if(!emp(controller)) throw new Error('контролёра нет среди сотрудников');
  if(controller===p.assignee) throw new Error('исполнитель не принимает свою работу: укажите другого контролёра');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(p.dueDate||'')) throw new Error('у поручения нужен срок');
  return mkTask({kind:'free', label:p.label, assignee:p.assignee, controller, author:who.author, issuedBy:who.issuedBy,
    dueDate:p.dueDate, createdAt:state.today, basis:p.basis, object:p.object, cases});
}
/* форма поручения по обзору: подставляет куратора объекта на дату, только если он подчинённый автора, иначе автор выбирает сам; контролёр — автор */
function reviewTaskDraft(no, obj, by){
  const s = ownerAt('an', no, state.today), author = by||state.viewer;
  const cur = obj ? curatorOn('куратор кредита', obj, state.today) : null;
  return {basis:no, object:obj||null, author, controller:author,
    assignee: cur && assignableBy(author).indexOf(cur)!==-1 ? cur : null,
    label: s ? `По обзору ${no}${obj ? ': '+obj : ''} — ${s.verdict}` : ''};
}
/* шов «задания по основанию»: перечень свободных заданий по ссылке на документ; задания по поводу в ответ не входят */
function tasksByBasis(ref, asOf){
  asOf = asOf || state.today;
  return state.tasks.filter(t=>t.kind==='free' && t.basis===ref && t.journal[0].t<=asOf).map(t=>({task:t.id, label:t.label, object:t.object,
    due:dueOf(t), assignee:t.assignee, author:t.author, issued:t.journal[0].t, state:displayState(t)}));
}
/* демо-карточка обзора (у анализа): утверждение — заведующий отделом анализа или руководство */
function anStep(id, by, step){
  const o = ownerObj('an', id), s = reviewAt(o, state.today);
  if(!s) throw new Error('обзора нет');
  if(step!=='утвердить') throw new Error('такого действия у обзора нет');
  if(s.approved) throw new Error(`обзор ${id} уже утверждён`);
  const e = emp(by);
  if(!e || (by!=='E27' && e.dept!=='Руководство')) throw new Error('утверждает заведующий отделом анализа или руководство');
  o.ev.push({t:state.today, approved:true, by, how:`обзор ${id} утверждён`+(o.replaces ? ` взамен ${o.replaces}` : '')});
}
/* ---------- 6. опрос: ожидаемое множество поводов по виду ---------- */
/* пороги самоопроса — записи модуля заданий с датой начала и основанием (state.neighborSet.zd), «решение проекта», пока нет приказа;
   правит администратор заданий по приказу. Повод держит значение дня, когда появился: новое значение — только новым поводам */
const ZD_THR = {
  overdueWd:   {v:5,  text:v=>`${v} р.д. после срока; он же день повторной эскалации неразобранной очереди`},
  awaitWd:     {v:3,  text:v=>`дольше ${v} р.д.`},
  extWd:       {v:1,  text:v=>`дольше ${v} р.д.`},
  silentNights:{v:2,  text:v=>`${v} ночи подряд`},
  returnN:     {v:3,  text:v=>`${v} возвращения ключа`},
  returnWindowD:{v:30, text:v=>`за ${v} к.д.`},
  inactiveD:   {v:3,  text:v=>`дольше ${v} к.д.`},
};
const ESC_REPEAT = 'повторная — руководитель «Кто поручил»'; // признак повода: на 5-й р.д. неразобранную очередь получает руководитель держателя
function liveSince(p){ for(let i=p.journal.length-1;i>=0;i--){ const e=p.journal[i]; if(e.ev==='появился' || e.ev==='вновь-появился') return e.t; } return p.firstSeen; }
function zdThr(f, key, asOf){ const p = key && povodByKey(key); return thrOn('zd.'+f, p && p.status!=='gone' ? liveSince(p) : asOf); }
function editSelfThr(f, x, o){
  o = o || {};
  if(!ZD_THR[f]) throw new Error('такого порога у самоопроса нет');
  if(!isTasksAdmin(o.by)) throw new Error('правит администратор заданий — остальным на чтение');
  const n = parseInt(x.v, 10);
  if(!(n>=1) || String(n)!==String(x.v).trim()) throw new Error('порог — целое число больше нуля');
  if(!(x.basis||'').trim()) throw new Error('основание обязательно — приказ');
  if(!String(x.order||'').trim()) throw new Error('порог меняется по приказу — укажите приказ');
  if(!x.from || x.from<state.today) throw new Error('дата начала не раньше сегодняшней');
  const a = thrVals('zd.'+f);
  if(thrRecOn('zd.'+f, x.from).v===n) throw new Error('значение не изменилось');
  a.push({from:x.from, v:n, basis:x.basis.trim(), order:x.order||null, by:o.by});
  a.sort((p, q)=>p.from<q.from ? -1 : p.from>q.from ? 1 : 0);
  return a;
}

function computeExpectedForKind(kindId, asOf, asIfActive){
  const out = new Map(); // key -> {kind,objectType,objectId,stateDate,approx,traits}
  const pkGate = kindOf(kindId);
  if(!pkGate.activatedAt || pkGate.activatedAt>asOf) return out; // рубильник: вид не введён в действие — поводов не порождает
  if(pkGate.retiredAt && pkGate.retiredAt<=asOf && !asIfActive) return out; // выведен из употребления выпуском
  if(kindId==='pk-overdue'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-overdue') return; // стопор рекурсии, один шаг
      if(isTerminal(t)) return;
      const st = lastEv(t);
      if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
      const due = dueOf(t), esc = escalateOf(t);
      if(esc && esc.to==='уведомление') return; // адресат эскалации — уведомлением при истечении срока, задания нет
      if(esc && esc.to==='очередь'){ // сразу по истечении срока — задание очереди того, кто вправе решить
        if(due >= asOf) return;
        out.set(`pk-overdue|task:${t.id}|${esc.step}`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
          esc:{role:esc.role, action:esc.action}, traits:{давность_раб_дней:workdaysBetween(due, asOf), эскалация:roleTitle(esc.role)}});
        return;
      }
      if(inQueue(t)){ // очередь, которую никто не взял: сразу — держателю «Кто поручил», на 5-й р.д. — его руководителю
        if(due >= asOf) return;
        const wd = workdaysBetween(due, asOf), k2 = `pk-overdue|task:${t.id}|никто не взял, 5-й р.д.`, n2 = zdThr('overdueWd', k2, asOf);
        out.set(`pk-overdue|task:${t.id}|никто не взял`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
          traits:{давность_раб_дней:wd, эскалация:'«Кто поручил»'}});
        if(wd >= n2 && queueStepOf(t, 2, asOf)) out.set(k2, {kind:kindId, objectType:'task', objectId:t.id,
          stateDate:addWorkdays(due, n2), approx:false, traits:{давность_раб_дней:wd, эскалация:ESC_REPEAT}});
        return;
      }
      const key = `pk-overdue|task:${t.id}|`;
      if(due >= asOf || workdaysBetween(due, asOf) < zdThr('overdueWd', key, asOf)) return; // до того — исполнителю «срок истёк»
      if(!delayChief(t.assignee, asOf)) return; // руководителя нет — задания нет, остаётся красная строка
      out.set(key, {kind:kindId, objectType:'task', objectId:t.id, stateDate:due, approx:false,
        traits:{давность_раб_дней: workdaysBetween(due, asOf)}});
    });
  } else if(kindId==='pk-rejected'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-rejected') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='отказано') return;
      const stDate = stateEntry(t).t;
      out.set(`pk-rejected|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:stDate, approx:false, traits:{}});
    });
  } else if(kindId==='pk-await-long'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-await-long') return;
      if(isTerminal(t)) return;
      if(lastEv(t)!=='ожидает приёмки') return;
      const claimedAt = stateEntry(t).claimedAt || stateEntry(t).t;
      const wd = workdaysBetween(claimedAt, asOf);
      if(wd <= zdThr('awaitWd', `pk-await-long|task:${t.id}|`, asOf)) return;
      if(!delayChief(t.controller, asOf)) return; // руководителя решающего нет — задания нет, остаётся красная строка
      out.set(`pk-await-long|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:claimedAt, approx:false, traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-neighbor-silent'){
    // сосед не отвечает две ночи подряд, текущая в счёте; порог один на все источники
    SOURCES.filter(s=>s.id!=='self').forEach(src=>{
      const sil = silenceOf(src.id, asOf);
      if(!sil || sil.nights < zdThr('silentNights', `pk-neighbor-silent|source:${src.id}|`, asOf)) return;
      out.set(`pk-neighbor-silent|source:${src.id}|`, {kind:kindId, objectType:'source', objectId:src.id,
        stateDate:sil.since, approx:true, traits:{ночей_подряд:sil.nights, молчит_с:sil.since}});
    });
  } else if(kindId==='pk-kind-inactive'){
    state.povodKinds.forEach(pk=>{
      if(pk.activatedAt && pk.activatedAt<=asOf) return; // введён — не наш случай
      if(pk.off) return; // выключен администратором с основанием — не «не введён»
      const days = daysBetween(pk.createdAt, asOf);
      if(days < zdThr('inactiveD', `pk-kind-inactive|povodKind:${pk.id}|`, asOf)) return;
      out.set(`pk-kind-inactive|povodKind:${pk.id}|`, {kind:kindId, objectType:'povodKind', objectId:pk.id,
        stateDate:pk.createdAt, approx:false, traits:{дней_с_заведения:days}});
    });
  } else if(kindId==='pk-addr-missing'){
    // задание выдано администратору по концу цепочки запасных
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-addr-missing') return;
      if(isTerminal(t) || !t.addr || t.addr.via!=='администратор') return;
      const issued = t.journal[0].t;
      const objType = t.povodKey && povodByKey(t.povodKey) ? povodByKey(t.povodKey).objectType : '—';
      out.set(`pk-addr-missing|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:issued, approx:false,
        traits:{вид_объекта:objType, роль:t.addr.role}});
    });
  } else if(kindId==='pk-ext-pending'){
    state.tasks.forEach(t=>{
      if(t.originKind==='pk-ext-pending') return;
      if(isTerminal(t)) return;
      const req = pendingExtension(t);
      if(!req) return;
      const wd = workdaysBetween(req.t, asOf);
      if(wd <= zdThr('extWd', `pk-ext-pending|task:${t.id}|`, asOf)) return;
      if(!delayChief(approverOf(t), asOf)) return; // руководителя решающего нет — задания нет, остаётся красная строка
      out.set(`pk-ext-pending|task:${t.id}|`, {kind:kindId, objectType:'task', objectId:t.id, stateDate:req.t, approx:false,
        traits:{давность_раб_дней:wd}});
    });
  } else if(kindId==='pk-returning'){
    // ключ вновь появлялся не реже порога за окно
    state.povods.forEach(p=>{
      if(p.kind==='pk-returning') return;
      const key = `pk-returning|povod:${p.key}|`, from = addDays(asOf, -zdThr('returnWindowD', key, asOf));
      const back = p.journal.filter(e=>e.ev==='вновь-появился' && e.t>from && e.t<=asOf);
      if(back.length < zdThr('returnN', key, asOf)) return;
      out.set(`pk-returning|povod:${p.key}|`, {kind:kindId, objectType:'povod', objectId:p.key, stateDate:back[back.length-1].t, approx:false,
        traits:{повторов:back.length}});
    });
  } else if(ORGSTRUCT_CFG[kindId]){
    // одна ветка на все виды Оргструктуры, различие — в ORGSTRUCT_CFG
    const cfg = ORGSTRUCT_CFG[kindId];
    const rows = orgstructMirrorAt(asOf)[cfg.list] || [];
    rows.filter(r=>!cfg.when || cfg.when(r)).forEach(r=>{
      const objectId = cfg.id(r);
      const stateDate = dateMax(cfg.date(r), pkGate.activatedAt); // клэмп к дате подключения
      const up = cfg.up ? cfg.up(r) : null;
      out.set(`${kindId}|${cfg.objectType}:${objectId}|`, Object.assign({kind:kindId, objectType:cfg.objectType, objectId,
        curObj:cfg.cur(r)||null, stateDate, approx:false, traits:cfg.traits(r)}, up ? {up:up.emp, upUnit:up.unit} : {}, rawOf(cfg.date(r), pkGate.activatedAt)));
    });
  } else if(OWNER_CFG[kindId]){
    // одна ветка на виды с исполнением у владельца: ключ «вид · объект» (у шага на участника — плюс участник), период — если его называет повод;
    // повод называет адресата (автора объекта, члена, председателя) или роль очереди, срок — если его называет владелец
    const cfg = OWNER_CFG[kindId];
    (cfg.srcs || [cfg.src]).forEach(src=>state.owner[src].forEach(o=>{ // вид с несколькими источниками — часть повода называет свой
      const s = stateAt(src, o, asOf);
      if(!s || !cfg.when(s, asOf)) return;
      (cfg.each ? cfg.each(s, asOf) : [{}]).forEach(x=>{
        const rawSince = cfg.since ? cfg.since(s, asOf, x) : (s.statusSince||s.stageSince), stateDate = dateMax(rawSince, pkGate.activatedAt); // клэмп к дате подключения
        const obj = x.obj || o.id; // объект ключа — сам объект владельца или его часть (резолюция, выдача)
        const ot = x.objectType || cfg.objectType;
        out.set(`${kindId}|${ot}:${obj}${x.key ? '·'+x.key : ''}|${x.period||''}`, {kind:kindId, objectType:ot, objectId:obj, ownerId:o.id, src:cfg.srcs ? src : null, authorPost:x.authorPost||null, direct:x.direct||null,
          sub:x.sub||null, named:x.named!==undefined ? x.named : cfg.named ? cfg.named(s, asOf) : (s.author||null), namedRole:x.role && roleOf(x.role) ? x.role : null,
          curObj:typeof cfg.cur==='function' ? cfg.cur(s) : cfg.cur ? o.id : null, due:x.due || (cfg.due ? cfg.due(s) : null), mark:x.mark||null, escWho:cfg.escWho ? cfg.escWho(s) : null,
          approver:x.approver||null, unit:cfg.unit ? cfg.unit(s, asOf, x) : null, dueN:x.dueN||null, dueBasis:x.dueBasis||null,
          stateDate, approx:false, traits:Object.assign(s.status||s.stage ? {статус:s.status||s.stage} : {}, 'author' in s ? {автор:s.author ? emp(s.author).name : 'нет'} : {}, cfg.traits ? cfg.traits(s, asOf, x) : {}),
          rawDate:rawOf(rawSince, pkGate.activatedAt).rawDate||null});
      });
    }));
  } else if(kindId==='pk-stat-neighbor-silent'){
    // ключ шва — от соседа
    const ans = statMirrorAt(asOf);
    (ans.leads||[]).forEach(lead=>{
      const stateDate = dateMax(lead.from, pkGate.activatedAt); // клэмп к дате подключения
      out.set(lead.key, {kind:kindId, objectType:'module', objectId:lead.nb, curObj:lead.nb, stateDate, approx:false, rawDate:rawOf(lead.from, pkGate.activatedAt).rawDate||null,
        traits:{прогонов_подряд:lead.runs, причины:lead.reasons.join(', ')}});
    });
  } else if(kindId==='pk-rep-obligation-overdue'){
    // ключ шва — от соседа; поводом становится только «просрочено»
    reportsMirrorAt(asOf).filter(o=>o.state==='просрочено').forEach(o=>{
      const stateDate = dateMax(o.due, pkGate.activatedAt); // клэмп к дате подключения
      out.set(o.id, {kind:kindId, objectType:'obligation', objectId:o.dept, curObj:o.dept, stateDate, approx:false, rawDate:rawOf(o.due, pkGate.activatedAt).rawDate||null,
        traits:{форма:o.tplName, подразделение:o.deptName, период:o.period, срок:o.due,
          дней_просрочки:daysBetween(o.due, asOf)}});
    });
  }
  return out;
}
function daysBetween(a,b){ return Math.round((utc(b)-utc(a))/86400000); }
/* база срока = max(дата состояния у соседа, дата ввода вида в действие) */
function dateMax(a,b){ return a>b ? a : b; }
/* {since, nights}: подряд идущие даты прогонов с ошибкой, включая идущий; последний прогон даты решает за дату */
function silenceOf(srcId, asOf){
  const byDate = new Map();
  state.pollRuns.filter(r=>r.date<=asOf).forEach(r=>{ const s = r.sources.find(x=>x.src===srcId); if(s) byDate.set(r.date, s.answer==='множество'); });
  if(state.runDown && state.runDown.date===asOf && POLL_SCOPES[state.runDown.scope](SOURCES.find(x=>x.id===srcId)))
    byDate.set(asOf, state.runDown.ids.indexOf(srcId)===-1);
  const dates = Array.from(byDate.keys()).sort();
  let i = dates.length-1;
  if(i<0 || byDate.get(dates[i])) return null;
  while(i>0 && !byDate.get(dates[i-1])) i--;
  return {since:dates[i], nights:dates.length-i};
}

/* ---------- 7. сверка множества: полная, идемпотентная ---------- */
/* что повод несёт от шва кроме признаков: объект кураторства, названный адресат или роль, срок владельца, пометка */
const SEAM_FIELDS = ['curObj','named','namedRole','due','mark','escWho','esc','sub','ownerId','approver','unit','dueN','dueBasis','up','upUnit','src','authorPost','direct','rawDate'];
function seamCopy(p, e){ SEAM_FIELDS.forEach(f=>{ p[f] = e[f]!==undefined ? e[f] : null; }); return p; }
function reconcileKind(kindId, asOf){
  const expected = computeExpectedForKind(kindId, asOf);
  const newKeys=[], goneKeys=[], matchedKeys=[];
  state.povods.filter(p=>p.kind===kindId && p.status!=='gone').forEach(p=>{
    if(!expected.has(p.key)) goneKeys.push(p.key);
  });
  goneKeys.forEach(key=>{
    const p = povodByKey(key);
    p.status='gone'; log(p,'отпал',{});
  });
  expected.forEach((e,key)=>{
    let p = povodByKey(key);
    if(!p || p.status==='gone'){
      if(p){ p.status='appeared'; p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; seamCopy(p, e); log(p,'вновь-появился',{}); }
      else {
        p = seamCopy({key, kind:e.kind, objectType:e.objectType, objectId:e.objectId, stateDate:e.stateDate,
          approx:e.approx, firstSeen:asOf, status:'appeared', frozenSince:null, traits:e.traits, journal:[]}, e);
        log(p,'появился',{});
        state.povods.push(p);
      }
      newKeys.push(key);
    } else {
      matchedKeys.push(key);
      p.stateDate=e.stateDate; p.approx=e.approx; p.traits=e.traits; seamCopy(p, e);
      if(p.status==='frozen'){ p.status='appeared'; p.frozenSince=null; log(p,'разморожен',{}); }
    }
  });
  return {new:newKeys, gone:goneKeys, matched:matchedKeys, kindTitle:kindOf(kindId).title};
}

function handleGoneForKind(goneKeys, asOf){
  goneKeys.forEach(key=>{
    const openTasks = state.tasks.filter(t=>t.povodKey===key && !isTerminal(t));
    if(openTasks.length===0){
      const p = povodByKey(key), k = kindOf(p.kind);
      const issued = state.tasks.some(t=>t.povodKey===key);
      log(p,'закрыт-системой',{reason:k.retiredAt && k.retiredAt<=asOf && issued ? 'вид выведен выпуском' : k.off ? 'вид выключен' : issued ? 'задание уже закрыто' : 'поручения не было'});
      return;
    }
    openTasks.forEach(t=>{
      const st = lastEv(t);
      if(ownerExecOf(t)){ closeByOwner(t, povodByKey(key), asOf); return; }
      if(st==='заявлено'){
        log(t,'закрыто',{outcome:'исполнено'});
        notify(t,'закрыто');
      } else if(st==='ожидает приёмки'){ // при контролёре нужны обе оси — решает он
        log(t,'повод отпал',{});
        notify(t,'повод-отпал', t.controller);
      } else { // повод исчез до заявления — задание закрывается само, вернётся повод — выдаётся снова как повтор
        log(t,'закрыто',{outcome:'отпало'});
        notify(t,'закрыто');
      }
    });
  });
}

/* исполнение у владельца: повод отпал — задание закрыто с атрибуцией, исхода «отпало» не бывает */
function closeByOwner(t, p, asOf){

  // за адресата действовал замещающий — по замещению в заданиях или по приказу у владельца («лично»)
  const self = t.assignee ? (canActFor(t, a.by) || a.for===t.assignee) : queueHolders(t).indexOf(a.by)!==-1;
  const extra = {outcome: self ? 'исполнено' : 'исполнено · выполнил другой', by:a.by, how:a.how};
  if(self && t.assignee && a.by!==t.assignee) extra.for = t.assignee;
  log(t,'закрыто',extra);
  notify(t,'закрыто');
}

/* адресат: формула правила → замещение на дату → запасной адресат (держатель «Кто поручил» правила на дату по оргструктуре)
   → администратор модуля и «адресат не найден», только если и оргструктура никого не дала; результат хранится в задании снимком */
/* неразобранная очередь — проблема распределения: первая ступень — держатель «Кто поручил» на дату, вторая (5-й р.д.) — его руководитель */

  return step===2 ? (h && h!==ADMIN ? chiefOf(h) : null) : h;
}
/* кто разбирает отказ от шага документа — тот, кто вправе заменить участника этой роли («Заменить участника»): автор резолюции,
   автор документа, очередь «Регистратор» или «Архивариус». Назначенное из очереди — назначившему, взятое самим — обратно в очередь */

  const by = DOC_REJECT_BY[t.originKind];
  if(by==='регистратор') return {role:'doc-registrar', label:'регистратор'};
  if(by==='архивариус или регистратор') return {role:'doc-archivist', label:'архивариус'};
  const p = povodByKey(t.povodKey), o = p && ownerObj('doc', p.ownerId||p.objectId), s = o && stateAt('doc', o, state.today);
  if(!s) return null;
  if(by==='автор резолюции'){ const r = s.res && s.res[p.objectId]; return r ? {emp:r.author, label:'автор резолюции'} : null; }
  return s.author ? {emp:s.author, label:'автор документа'} : null;

  if(!t) return null;

    return queueStepOf(t, povod && povod.traits && povod.traits.эскалация===ESC_REPEAT ? 2 : 1, asOf);
  if(who==='руководитель исполнителя') return delayChief(t.assignee, asOf);
  if(who==='автор' && povod && povod.kind==='pk-rejected'){ const dr = docRejectTo(t); if(dr && dr.emp) return dr.emp; }
  if(who==='автор') return (povod && povod.kind==='pk-rejected' && t.queueAssignedBy) || t.author;
  if(who==='руководитель контролёра') return delayChief(t.controller, asOf);

/* задание о промедлении не приходит тому, кто промедлил: его руководитель; если руководителя замещает он сам — следующий по цепочке.

function fallbackAddressee(rule, povod, asOf){ // одна цепочка для всех форм адресата: закрепления нет, носителей нет, названного нет

  const acting = actingFor(h.emp, asOf);

    if(!povod.named) return fallbackAddressee(rule, povod, asOf);
    const acting = actingFor(povod.named, asOf);
    return {by:'названный', role:'руководитель подразделения', responsible:povod.named, assignee:acting, via:'названный', subst:acting!==povod.named};

    const exclude = kindOf(rule.kind).fourEyes && povod.named ? [povod.named] : [];
    const r = roleOf(role);
    if(r && !r.holders.some(h=>exclude.indexOf(h)===-1 && !goneOn(h, asOf))) return Object.assign(fallbackAddressee(rule, povod, asOf), {queueRole:role}); // носителей нет
    return {by:'очередь', role:roleTitle(role), queueRole:role, exclude, excludeWho:exclude.length ? kindOf(rule.kind).fourEyesWho || null : null,
      responsible:null, assignee:null, via:'очередь', subst:false};

    return {by:'названный', role:f.who, responsible:povod.named, assignee:acting, via:'названный', subst:acting!==povod.named};

  else if(f.by==='участник') responsible = participantOf(f.who, povod.objectType==='task' ? taskOf(povod.objectId) : null, povod, asOf);
  else if(f.by==='должность') responsible = f.unit ? deptHead(f.unit) : f.unitFrom ? deptHead(povod.unit) : ADMIN; // руководитель подразделения — правила или названного поводом
  else if(f.by==='оргструктура') responsible = povod.up || null; // ответ оргструктуры: руководитель, к которому передано наверх

  const a = {by:f.by, role:f.role||f.who, curObj:povod.curObj||null, responsible, assignee:acting, via:f.by, subst:acting!==responsible};
  if(povod.kind==='pk-rejected' && f.by==='участник'){ const tt = taskOf(povod.objectId), dr = docRejectTo(tt); // кому вернулся отказ — словами

  if(f.by==='должность' && (f.unit || povod.unit)) a.unit = f.unit || povod.unit;

  return a;

      now = {by:t.addr.by, role:t.addr.role, responsible:none ? null : a.emp, assignee:acting, via:none ? 'администратор' : 'запасной', subst:acting!==a.emp, post:t.authorPost};
    }
    t.assignee = now.assignee; t.addr = now;
    log(t,'переадресовано',{from, to:now.assignee, причина:why});
    startWithoutTake(t);
    notify(t,'переадресовано', from);
    notify(t,'поручено');
  });
}
function zlDescribe(p){ // залог: предмет, кредит, поручительство или договор

  if(p.objectType==='document' || p.objectType==='resolution' || p.objectType==='issue'){

function handleNewForKind(kindId, newKeys, asOf){
  const k = kindOf(kindId);
  if(k.genus==='сигнал'){ sendSignal(k, newKeys, asOf); return; } // без задания, срока и ответа
  const rule = ruleForKind(kindId);
  if(!rule) return; // реестр не сходится — вид не поручает
  newKeys.filter(key=>!state.tasks.some(t=>coversKey(t, key))) // вернувшийся ключ с открытым заданием — второго не выдаём
    .forEach(key=>issueRuleTask(rule, povodByKey(key)));
}
function reissueForFreedPairs(kindId, matchedKeys){
  if(kindOf(kindId).activatedAt===null) return;
  const rule = ruleForKind(kindId);
  if(!rule) return;
  matchedKeys.filter(key=>{
    const p = povodByKey(key);
    if(p.status!=='appeared' || povodReleased(p)) return false; // снятый с поручения не переиздаётся, пока жив
    return !state.tasks.some(t=>coversKey(t, key));
  }).forEach(key=>issueRuleTask(rule, povodByKey(key)));
}

/* ---------- 7а. сигнал: уведомление без задания ---------- */
const SIGNAL_CHANNELS = ['всплывающее','SMS','e-mail'];
/* получатели: роль кураторства по объекту или должность; с замещением. Запасного у сигнала нет: работы нет, спрашивать не с кого */
function signalRecipients(k, p, asOf){
  const out = [];
  state.signals[k.id].recipients.forEach(r=>{
    let who = r.by==='кураторство' ? (p.curObj ? curatorOn(r.role, p.curObj, asOf) : null) : postHolderOn(r.post, asOf);
    if(!who) return;
    who = actingFor(who, asOf);
    if(out.indexOf(who)===-1) out.push(who);
  });
  return out;
}
/* новые поводы прогона: одно уведомление каждому получателю, внутри перечень объектов; живой повод повторно не шлётся */
function sendSignal(k, keys, asOf){
  const c = state.signals[k.id], byTo = new Map();
  if(!c || !keys.length) return;
  keys.forEach(key=>{ const p = povodByKey(key);
    signalRecipients(k, p, asOf).forEach(to=>{ if(!byTo.has(to)) byTo.set(to, []); byTo.get(to).push(p); }); });
  byTo.forEach((ps, to)=>state.notifications.push(messageOf({id:nextId('N'), t:asOf, kind:'сигнал', originKind:k.id, taskId:null, to, due:null,
    count:ps.length, text:c.text, channels:c.channels.slice(), items:ps.map(p=>({key:p.key, text:describePovod(p)}))})));
}
/* настройка сигнала — администратор заданий, с основанием; новое событие — только выпуском */
function editSignal(kindId, changes, o){
  o = o || {};
  const k = kindOf(kindId);
  if(!k || k.genus!=='сигнал') throw new Error('новое событие для сигнала — только выпуском');
  if(!isTasksAdmin(o.by)) throw new Error('настраивает администратор заданий — остальным на чтение');
  if(!o.basis) throw new Error('нужно основание правки — приказ или служебная записка');
  const c = state.signals[kindId], was = {};
  Object.keys(changes).forEach(f=>{
    const x = changes[f];
    if(f==='text'){ if(!String(x||'').trim()) throw new Error('текст сигнала не пустой'); }
    else if(f==='channels') checkChannels(x);
    else if(f==='recipients'){
      if(!Array.isArray(x) || !x.length) throw new Error('нужен хотя бы один получатель');
      x.forEach(r=>{ if(!(r.by==='кураторство' && r.role) && !(r.by==='должность' && postOf(r.post))) throw new Error('получатель — роль кураторства или должность'); });
    } else throw new Error(`«${f}» меняется выпуском`);
    was[f] = c[f];
  });
  if(!Object.keys(changes).some(f=>JSON.stringify(changes[f])!==JSON.stringify(c[f]))) throw new Error('значения не изменились');
  Object.assign(c, changes);
  c.history.push({t:state.today, by:o.by, basis:o.basis, was});
  return c;
}
/* выпуск: вид подсветки становится сигналом или заданием, когда появилось основание; в работающей системе такой кнопки нет.
   Вид, по которому модуль-владелец отвечает отказом, возвращается только вместе с его ответом */
function hlReleaseGate(k){
  if(k.hlAt) throw new Error(`вид вернётся вместе с ответом модуля «${ownerOfKind(k.id)}»: сейчас модуль по нему отвечает отказом`);
}
function releaseSignal(kindId, no, cfg){
  const k = kindOf(kindId);

  k.switches.push({t:state.today, ev:'введён в действие', by:'выпуск '+no, basis:'выпуск '+no});
  return k;
}
