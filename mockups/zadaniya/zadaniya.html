function splitRollup(taskId, by){ // исполнитель разбирает вал на поштучные задания
  const t = taskOf(taskId);
  if(!t || isTerminal(t) || !Array.isArray(t.rollupKeys)) throw new Error('это не открытый вал');
  if(by!==t.assignee) throw new Error('разбирает вал исполнитель');
  if(t.decide) throw new Error('это решение по поводам, а не вал');
  const rule = ruleAsIssued(t); // поштучные — по редакции вала: срок и автор из снимка
  const out = [];
  liveKeys(t).forEach(key=>{ log(t,'ключ вышел',{key, причина:'разбор вала'}); out.push(issueRuleTask(rule, povodByKey(key))); });
  log(t,'закрыто',{outcome:'снято', reason:'вал разобран на поштучные задания'});
  notify(t,'закрыто');
  return out;
}

/* смена закрепления: непринятое («поручено») уходит новому ответственному, принятое остаётся */
function readdressByCuration(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t) || !t.addr || t.addr.by!=='кураторство' || lastEv(t)!=='поручено') return;
    if(t.journal.some(e=>e.ev==='переназначено')) return; // переназначенное человеком не переадресуется
    if(t.decide) return; // «решить» адресовано автору правила, не кураторству
    const rule = ruleAsIssued(t); // формула — на дату события, срок и автор — из снимка выдачи
    if(Array.isArray(t.rollupKeys)){
      liveKeys(t).forEach(key=>{
        const p = povodByKey(key);
        if(!p || p.status!=='appeared') return;
        const now = resolveAddressee(rule, p, asOf);
        if(now.responsible===t.rollupResp[key]) return;
        log(t,'ключ вышел',{key, to:now.assignee, причина:'смена закрепления'});
        issueRuleTask(rule, p);
      });
      settleRollup(t);
      return;
    }
    const p = povodByKey(t.povodKey);
    if(!p || p.status!=='appeared') return;
    const now = resolveAddressee(rule, p, asOf);
    if(now.responsible===t.addr.responsible) return;
    const from = t.assignee;
    t.assignee = now.assignee; t.addr = now;
    log(t,'переадресовано',{from, to:now.assignee, причина:'смена закрепления'});
    notify(t,'переадресовано', from);
    notify(t,'поручено');
  });
}
function zlDescribe(p){ // залог: предмет, кредит, поручительство или договор
  const o = ownerObj('zl', p.ownerId||p.objectId);
  if(!o) return p.objectId;
  if(o.type==='item') return `предмет залога ${o.id} «${o.name}» · кредит ${o.credit}`;
  if(o.type==='credit') return `кредит ${o.id} · ${o.borrower}${p.sub ? ` · предмет ${p.sub}` : ''}`;
  if(o.type==='surety') return `договор поручительства ${o.id} · ${o.guarantor} · кредит ${o.credit}`;
  return `договор залога ${o.id} · ${o.borrower} · кредит ${o.credit}`;
}
function describePovod(p){
  if(p.objectType==='task'){ const t=taskOf(p.objectId); return t ? `«${t.label}» (${p.objectId})` : p.objectId; }
  if(OWNER_CFG[p.kind] && OWNER_CFG[p.kind].src==='zl') return zlDescribe(p);
  if(p.objectType==='povodKind'){ return `вид «${kindOf(p.objectId).title}»`; }
  if(p.objectType==='source'){ const src=SOURCES.find(x=>x.id===p.objectId); return `источник «${src ? src.name : p.objectId}»`; }
  if(p.objectType==='unit'){ return `подразделение «${p.objectId}»`; }
  if(p.objectType==='employee'){ return `сотрудник ${p.objectId}`; }
  if(p.objectType==='territory'){ return `территория подразделения «${p.objectId}»`; }
  if(p.objectType==='module'){ return `сосед-модуль «${p.objectId}» (по данным статистики)`; }
  if(p.objectType==='povod'){ const q=povodByKey(p.objectId); return q ? `повод «${kindOf(q.kind).title}» · ${q.key}` : p.objectId; }
  if(p.objectType==='gosreshenie'){ const o=ownerObj('gd', p.objectId); return `${p.objectId} ${o ? o.title : ''}`.trim(); }
  if(p.objectType==='program'){ const o=ownerObj('lp', p.objectId); return `${p.objectId} ${o ? o.title : ''}`.trim(); }
  if(p.objectType==='application'){ const o=ownerObj('ap', p.objectId);
    const sub = !p.sub ? '' : AP_DEPTS[p.sub] ? ' · '+AP_DEPTS[p.sub].name : emp(p.sub) ? ' · член '+emp(p.sub).name : '';
    return `заявка ${p.objectId} ${o ? o.title : ''}`.trim()+sub; }
  if(p.objectType==='document' || p.objectType==='resolution' || p.objectType==='issue'){
    const o = ownerObj('doc', p.ownerId||p.objectId), s = o && docAt(o, state.today);
    const doc = `документ ${o ? o.id : p.objectId}${s && s.number ? ' ('+s.number+')' : ''} «${o ? o.title : ''}»`;
    const who = p.sub && emp(p.sub) ? emp(p.sub).name : '';
    if(p.objectType==='resolution') return `резолюция ${p.objectId}${who ? ' · '+who : ''} — ${doc}`;
    if(p.objectType==='issue') return `выдача оригинала ${p.objectId}${who ? ' · '+who : ''} — ${doc}`;
    return doc+(p.kind!=='doc-sign' && who ? ' · '+who : ''); }
  if(p.objectType==='offer'){ const o = ownerObj('imo', p.objectId);
    return `предложение имущества ${p.objectId} «${o ? o.title : ''}»${p.sub ? ' · позиция '+p.sub+(o ? ' «'+o.positions.find(x=>x.n===p.sub).what+'»' : '') : ''}`; }
  if(p.objectType==='asset'){ const o = ownerObj('ima', p.objectId); return `объект имущества ${p.objectId} «${o ? o.title : ''}»`; }
  if(p.objectType==='contract'){ const o = ownerObj('ima', p.ownerId);
    return `договор купли-продажи ${p.objectId} · объект ${p.ownerId} «${o ? o.title : ''}» · платёж от ${fmt(p.sub)}`; }
  if(p.objectType==='credit'){ const o = ownerObj('cr', p.objectId); return `кредит ${p.objectId}${o ? ' · '+o.borrower : ''} · платёж ${fmt(p.sub)}`; }
  if(p.objectType==='requirement'){ const o = ownerObj('vz', p.objectId); return `требование ${p.objectId}${o ? ` · ${o.borrower} · кредит ${o.credit}` : ''}`; }
  if(p.objectType==='review'){ const o = ownerObj('an', p.objectId);
    return `обзор ${p.objectId}${o ? ` по шаблону ${o.tpl} за ${perText(o.period)}${wholePortfolio(o) ? '' : ' · '+Object.values(o.cuts).join(', ')}` : ''}`; }
  if(p.objectType==='template'){ const o = ownerObj('ant', p.objectId), [from, to] = String(p.sub||'..').split('..');
    return `шаблон ${p.objectId}${o ? ' «'+o.title+'»' : ''} · период ${perText({from, to})}`; }
  if(p.objectType==='obligation'){ return `«${p.traits.форма}» за ${p.traits.период}, ${p.traits.подразделение} (срок ${fmt(p.traits.срок)})`; }
  return p.objectId;
}

function handleNewForKind(kindId, newKeys, asOf){
  const rule = ruleForKind(kindId);
  if(!rule) return {rollup:false}; // реестр не сходится — вид не поручает
  newKeys = newKeys.filter(key=>!state.tasks.some(t=>coversKey(t, key))); // вернувшийся ключ с открытым заданием — второго не выдаём
  if(newKeys.length===0) return {rollup:false};
  if(rule.mode==='ручной'){ addToDecide(rule, newKeys, asOf); return {rollup:false}; } // решает автор правила, свёртки нет
  return issueForKeys(rule, newKeys, asOf);
}
function issueForKeys(rule, newKeys, asOf){
  const kindId = rule.kind;
  // порог свёртки — по паре «вид × адресат»: ключи сначала раскладываются по ответственным
  const groups = new Map();
  newKeys.forEach(key=>{
    const a = resolveAddressee(rule, povodByKey(key), asOf);
    const g = a.via==='очередь' ? 'q:'+a.queueRole : a.responsible ? 'r:'+a.responsible : 'f:'+a.assignee;
    if(!groups.has(g)) groups.set(g, {keys:[], per:[]});
    groups.get(g).keys.push(key); groups.get(g).per.push(a);
  });
  let rolled = false;
  groups.forEach(g=>{
    if(g.keys.length > rollupOf(rule)){ issueRollupTask(rule, g.keys, g.per[0], g.per); rolled = true; }

    else g.keys.forEach(key=>issueRuleTask(rule, povodByKey(key)));
  });
  return {rollup:rolled};
}
function reissueForFreedPairs(kindId, matchedKeys){
  if(kindOf(kindId).activatedAt===null) return;
  const rule = ruleForKind(kindId);
  if(!rule) return;
  const freed = matchedKeys.filter(key=>{
    const p = povodByKey(key);
    if(p.status!=='appeared' || povodReleased(p)) return false; // снятый с поручения не переиздаётся, пока жив
    return !state.tasks.some(t=>coversKey(t, key)); // повод покрыт поштучным заданием, валом или «решить»
  });
  if(!freed.length) return;
  if(rule.mode==='ручной') addToDecide(rule, freed, state.today);
  else freed.forEach(key=>issueRuleTask(rule, povodByKey(key)));
}

/* ---------- 8. эскалация / срок-близко — периодические проверки ---------- */
function checkDeadlines(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t)) return;
    const st = lastEv(t);
    if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
    const due = dueOf(t);
    if(due>=asOf && daysBetween(asOf,due)<=1 && !notifiedOnce(t.id,'срок-близко',due)){
      notify(t,'срок-близко',null,due);
    }
    if(due<asOf && !notifiedOnce(t.id,'срок-истёк',due)){ // руководителю — не звонок, а задание «Просрочено задание»
      notify(t,'срок-истёк',null,due);
      const esc = escalateOf(t), p = t.povodKey && povodByKey(t.povodKey);
      if(esc && esc.to==='уведомление' && p && p.escWho) notify(t,'эскалация',p.escWho,due); // тому, кто вправе решить
    }
  });
}
/* заявленное без контролёра при живом поводе возвращается только на полном прогоне,
   срез которого позже дня заявления — соседу даётся ночь, чтобы увидеть работу */
function returnClaimed(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t) || t.controller || lastEv(t)!=='заявлено' || t.kind!=='rule') return;
    if(povodGoneFor(t)) return;
    const claimedAt = stateEntry(t).claimedAt || stateEntry(t).t;
    if(claimedAt >= asOf) return;
    log(t,'возвращено',{note:'повод жив на срезе '+fmt(asOf)}); notify(t,'возвращено');
  });
}

/* ---------- 9. прогон опроса ---------- */
function retireKinds(asOf){ // выпуск вывел вид: открытые задания закрываются «снято: вид выведен», история остаётся;
  // закрывается только то, чей повод держался бы и без вывода; отпавший сам — обычным порядком в том же прогоне
  state.povodKinds.filter(k=>k.retiredAt && k.retiredAt<=asOf).forEach(k=>{
    const alive = computeExpectedForKind(k.id, asOf, true);
    state.tasks.filter(t=>t.originKind===k.id && !isTerminal(t) && lastEv(t)!=='отпало' &&
      (t.rollupKeys ? liveKeys(t).some(key=>alive.has(key)) : alive.has(t.povodKey))).forEach(t=>{
      log(t,'закрыто',{outcome:'снято', reason:'вид выведен выпуском'}); notify(t,'закрыто'); });
  });
}
function runPoll(opts){
  opts = opts || {};
  const asOf = state.today;
  applyEditions(asOf); // редакции с датой начала вступают сами
  flushDecide(asOf);
  retireKinds(asOf);
  const run = {id:nextId('PR'), date:asOf, sources:[], complete:true};

  // источники с частым опросом к ночному самоопросу уже сверены — их сделанное закрыло задания раньше; ночные — после
  const self = SOURCES[0], frequent = SOURCES.filter(x=>x!==self && x.pollEveryMin<self.pollEveryMin);
  frequent.concat(self, SOURCES.filter(x=>x!==self && frequent.indexOf(x)===-1)).forEach(src=>{
    const isDown = opts.down!==undefined ? opts.down
      : (opts.downSources ? opts.downSources.indexOf(src.id)!==-1 : !!state.sourceDown[src.id]);
    if(isDown){
      run.sources.push({src:src.id, name:src.name, answer:'таймаут', matched:0, new:0, gone:0, rollup:[]});
      run.complete = false;
      // замораживаются только поводы этого источника
      state.povods.filter(p=>p.status==='appeared' && src.kinds.indexOf(p.kind)!==-1).forEach(p=>{
        p.status='frozen'; p.frozenSince=asOf; log(p,'заморожен',{});
      });
      return;
    }
    let totalNew=0, totalGone=0, totalMatched=0; const rollupKinds=[];
    src.kinds.forEach(kindId=>{
      const {new:nk, gone:gk, matched:mk} = reconcileKind(kindId, asOf);
      handleGoneForKind(gk, asOf);
      const r = handleNewForKind(kindId, nk, asOf);
      reissueForFreedPairs(kindId, mk);
      if(r.rollup) rollupKinds.push(kindId);
      totalNew+=nk.length; totalGone+=gk.length; totalMatched+=mk.length;
    });
    run.sources.push({src:src.id, name:src.name, answer:'множество', matched:totalMatched, new:totalNew, gone:totalGone, rollup:rollupKinds});
  });
  run.sources.sort((a,b)=>SOURCES.findIndex(x=>x.id===a.src)-SOURCES.findIndex(x=>x.id===b.src));
  // сроки — после сверки всех источников (сделанное у владельца закрыло задание раньше, чем истёк срок); только при доступном самоопросе
  if(run.sources[0].answer==='множество') checkDeadlines(asOf);
  if(run.complete) returnClaimed(asOf);
  readdressByCuration(asOf);
  state.pollRuns.push(run);
  return run;
}

/* ---------- 10. видимость ---------- */
function responsibleNow(t){ // ответственный по кураторству на дату
  if(!t.addr || t.addr.by!=='кураторство' || !t.addr.curObj) return null;
  return curatorOn(t.addr.role, t.addr.curObj, state.today);
}
function visibleTo(t, viewerId){
  if(inQueue(t) && queueHolders(t).indexOf(viewerId)!==-1) return true; // очередь, пока не взяли, — носителям роли
  if(viewerId===t.assignee || viewerId===t.controller || viewerId===t.author) return true;
  if(chiefChainIncludes(t.assignee, viewerId)) return true;
  if(actingOn(t, state.today)===viewerId) return true; // замещающий исполнителя на дату
  return responsibleNow(t)===viewerId;
}
/* просрочено: срок прошёл, а ход за исполнителем — как у «срок истёк» и «Просрочено задание»; ожидание приёмки, отказ, отпавшее — нет */
function isOverdue(t, d){ const st = lastEv(t); return !isTerminal(t) && (st==='поручено' || st==='принято' || st==='возвращено') && dueOf(t)<d; }
/* «мои»: ход за мной как исполнителем — я исполнитель или действую за исполнителя на дату; контролёр и утверждающий — нет */
function isMine(t, v, d){ return !!t.assignee && (t.assignee===v || actingOn(t, d||state.today)===v); }
function queueTasks(scope){
  const v = state.viewer;
  return state.tasks.filter(t=>{
    if(scope==='role') return !isTerminal(t) && inQueue(t) && queueHolders(t).indexOf(v)!==-1;
    if(scope==='mine') return !isTerminal(t) && isMine(t, v);
    if(scope==='closed') return isTerminal(t) && !!t.assignee && t.assignee===v;
    if(!isTerminal(t) && inQueue(t) && queueHolders(t).indexOf(v)!==-1) return false; // показано в очереди роли
    if((!isTerminal(t) && isMine(t, v)) || (isTerminal(t) && t.assignee===v)) return false; // показано в «Мои» или «Мои закрытые»
    return visibleTo(t, v);
  }).sort((a,b)=> (isTerminal(a)-isTerminal(b)) || (dueOf(a)<dueOf(b)?-1:1));
}

/* ---------- 10а. сверка реестров ---------- */
function checkRegistry(){
  const errs = [];
  state.povodKinds.forEach(k=>{
    if(!('sumAttr' in k)) errs.push(`«${k.title}»: не объявлен реквизит суммы`);
    if(!k.ownerDept) errs.push(`«${k.title}»: не объявлено подразделение-владелец`);
    if(k.escalate && k.escalate.to==='очередь' && (!roleOf(k.escalate.role) || !actionOf(k.escalate.action)))
      errs.push(`«${k.title}»: адресат эскалации — незаведённая очередь или действие`);
    if(k.escalate && ['уведомление','очередь'].indexOf(k.escalate.to)===-1) errs.push(`«${k.title}»: адресат эскалации не той формы`);
    if(k.periodic && k.periodAbsorb!=='да' && k.periodAbsorb!=='нет') errs.push(`«${k.title}»: периодический вид не объявил поглощение периодом`);
    if(!k.periodic && k.periodAbsorb!=null) errs.push(`«${k.title}»: поглощение периодом у событийного вида`);
    if(k.selfRelease && !k.ownerExec) errs.push(`«${k.title}»: решение адресата без действия — только у вида с исполнением у владельца`);
    if(GENERA.indexOf(k.genus)===-1) errs.push(`«${k.title}»: не объявлен род — шаг, надзор или самоопрос`);
    const n = state.rules.filter(r=>r.kind===k.id).length;
    if(n!==1) errs.push(`«${k.title}»: правил ${n} — у вида ровно одно правило`);
  });
  state.rules.forEach(r=>{
    if(!kindOf(r.kind)){ errs.push(`${r.id}: вид повода «${r.kind}» не заведён`); return; }
    if(!actionOf(r.action)) errs.push(`${r.id}: действие «${r.action}» не заведено`);
    if(!r.addressee){ errs.push(`${r.id}: нет формулы адресата`); return; }
    const k = kindOf(r.kind), by = r.addressee.by;
    if(r.mode==='ручной' && k.genus!=='надзор') errs.push(`${r.id}: ручной режим — только у вида надзора`);
    if(!postOf(r.author)) errs.push(`${r.id}: автор правила — не должность`);
    if(r.controller && r.controller!=='автор' && !postOf(r.controller)) errs.push(`${r.id}: контролёр — не автор и не должность`);
    if('threshold' in r) errs.push(`${r.id}: порог появления повода — настройка соседа, не правила`);
    const form = by==='очередь' ? 'очередь' : by==='названный' ? 'названный' : 'формула';
    if(k.addrForm!==form) errs.push(`${r.id}: адресат правила не той формы, что объявил вид («${k.addrForm}»)`);
    if((k.addrForm==='очередь')!==(k.take==='через очередь')) errs.push(`«${k.title}»: принятие через очередь — только у очереди роли`);
    if(by==='очередь' && !(r.addressee.role ? roleOf(r.addressee.role) : r.addressee.who)) errs.push(`${r.id}: роль очереди не заведена`);
    if(r.dueUnit==='named' && !r.dueFrom) errs.push(`${r.id}: срок называет владелец — не сказано, откуда он берётся`);
    if(r.extendBy && r.dueUnit!=='named') errs.push(`${r.id}: утверждающий продление назван, а срок — правила`);
    if(r.ownDue && r.dueUnit!=='workday') errs.push(`${r.id}: собственный срок повода — в рабочих днях, умолчание — значение правила`);
  });
  return errs;
}

/* ---------- 10б. строки заданий для статистики (сумм не несут) ---------- */
/* исполнитель на дату: текущий, откатанный по событиям после даты (взяли из очереди, переназначили, переадресовали) */
function assigneeOn(t, d){
  let a = t.assignee;
  t.journal.filter(e=>e.t>d).reverse().forEach(e=>{
    if(e.ev==='принято' && e.закреплено) a = null;
    else if(e.ev==='переназначено' || e.ev==='переадресовано') a = e.from || null;
  });
  return a;
}
function taskOn(t, d){
  const o = Object.assign({}, t, {journal:t.journal.filter(e=>e.t<=d), assignee:assigneeOn(t, d)});
  if(t.keyAdded) o.rollupKeys = t.rollupKeys.filter(k=>!(k in t.keyAdded) || t.keyAdded[k]<=d); // «решить» копит ключи со временем
  return o;
}
const TASK_GENUS = t=>t.kind!=='rule' ? 'свободное' : t.decide ? 'решить' : t.rollupKeys ? 'вал' : 'по правилу';
/* одна строка на задание на дату (конец дня): реквизиты и состояние, выведенное заданиями; закрытые остаются строками */
function taskRows(d){
  d = d || state.today;
  return state.tasks.filter(t=>t.journal[0].t<=d).map(t0=>{
    const t = taskOn(t0, d);
    const claimed = t.journal.find(e=>e.ev==='заявлено' || e.ev==='ожидает приёмки');
    const k = t.originKind ? kindOf(t.originKind) : null, term = isTerminal(t), due = dueOf(t);
    const acting = t.assignee && !term ? actingOn(t, d) : null, queued = !term && inQueue(t), unclaimed = !!t.queue && !t.assignee;

      issued:t.journal[0].t, initialDue:t.dueDate, setDue:due,

      outcome: outcomeOf(t) ? outcomeOf(t).outcome : null,
      extensions: extensionsOf(t), repeatOf:t.repeatOf, repeatCount:t.repeatCount,
      sumAttr: k ? k.sumAttr : null,

      doneBy: term ? (stateEntry(t).by || null) : null,
      state: displayState(t), overdue: isOverdue(t, d), overdueWd: isOverdue(t, d) ? workdaysBetween(due, d) : 0,
      actingFor: acting && acting!==t.assignee ? acting : null,
      queueRole: queued ? t.queue.role : null, queueExcept: queued ? (t.queue.exclude||[]).slice() : [],
      genus: TASK_GENUS(t), kindGenus: k ? k.genus : null, importance:t.importance,
      author:t.author, authorPost:t.authorPost||null, controller:t.controller||null,

/* плитка дашборда «Мои задания»: три показателя, которые статистика считает по строкам дня; «я» и «мои роли» — параметры зрителя */
function myTile(v, d){
  const open = taskRows(d).filter(r=>!r.closed);
  const mine = open.filter(r=>r.assignee && (r.assignee===v || r.actingFor===v));
  const queue = open.filter(r=>r.queueRole && roleOf(r.queueRole).holders.indexOf(v)!==-1 && r.queueExcept.indexOf(v)===-1);
  const over = mine.filter(r=>r.overdue).length;
  return {mine:mine.length, overdue:over, queues:queue.length, light:over>0 ? 'красный' : 'норма'};
}

}

function renderTaskActions(t){

  const mine = canActFor(t, v), owned = ownerExecOf(t);

    const r = roleOf(t.queue.role);
    if(queueHolders(t).indexOf(v)!==-1) html += `<div class="btn-row"><button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.take('${id}', ZD.state.viewer))">Взять в работу</button></div>`;
    else if((t.queue.exclude||[]).indexOf(v)!==-1) html += '<div class="banner info">Объект ваш — по нему задание рассматривает другой носитель роли.</div>';
    if(v===t.author || v===deptHead(r.dept) || v===ownerAdminOf(t)){
      html += `<div class="card"><h3>Назначить из очереди</h3><div class="form-row">
        <div class="fld"><label>Носитель роли</label><select id="queueSel">${queueHolders(t).map(h=>`<option value="${h}">${esc(emp(h).name)}</option>`).join('')}</select></div>

        <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reassignTask('${id}', document.getElementById('queueSel').value, ZD.state.viewer, document.getElementById('queueReason').value.trim()))">Назначить</button>
      </div></div>`;
    }
    return html || '<div class="muted small">задание в очереди роли — взять его может носитель роли</div>';
  }
  const selfRel = t.originKind && kindOf(t.originKind).selfRelease;
  if(owned && mine && act.here){
    html += `<div class="banner info">Решение принимается здесь — ${esc(act.where)}. Поручение закроет задание на следующем опросе; кнопки «сдано» здесь нет.</div>`;
    html += renderReviewDecision(t);
  } else if(owned && mine && st!=='поручено'){
    html += `<div class="banner info">Работа делается в карточке у владельца — ${esc(act.where)}. Задание закроется само, когда повод отпадёт; кнопки «сдано» здесь нет.</div>`;
    if(selfRel && !t.rollupKeys) html += `<div class="card"><h3>Решение «${esc(selfRel)}»</h3><div class="form-row">
      <div class="fld"><label>Причина</label><input id="srWhy"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.releaseTask('${id}', ZD.state.viewer, document.getElementById('srWhy').value.trim()))">Закрыть — ${esc(selfRel)}</button>
    </div><div class="small">Пока повод жив, новое задание по нему не выдаётся.</div></div>`;
  }
  if(st==='поручено' && mine){
    html += `<div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.take('${id}', ZD.state.viewer))">Взять в работу</button>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reject('${id}', prompt('Причина отказа:')||'без причины'))">Отказаться</button>
    </div>`;
  }
  if((st==='принято' || st==='возвращено') && mine && !owned){
    const proof = act && act.needsProof ? `prompt('Ссылка на подтверждение:')` : 'null';
    html += `<div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.claim('${id}', ${proof}, ZD.state.viewer))">Заявить исполнение</button>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reject('${id}', prompt('Причина отказа:')||'без причины'))">Отказаться</button>
    </div>`;

  if(t.rollupKeys && v===t.assignee && ['поручено','принято','возвращено'].indexOf(st)!==-1){
    html += `<div class="btn-row"><button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.splitRollup('${id}', ZD.state.viewer))">Разобрать вал на поштучные</button></div>`;
  }
  if(st==='ожидает приёмки' && v===t.controller){
    const gone = povodGoneFor(t), rule = t.kind==='rule';
    html += `${rule ? `<div class="banner ${gone?'ok':'info'}">${gone ? 'Повод отпал — работа подтверждена соседом, решение за контролёром.' : 'Повод ещё жив — принять нельзя, только вернуть.'}</div>` : ''}

      <select id="lapsedReason"><option value="сделано мимо системы">сделано мимо системы</option><option value="условие изменилось">условие изменилось</option><option value="объект выбыл">объект выбыл</option><option value="ошибка данных">ошибка данных</option><option value="иное">иное</option></select>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.disposeLapsed('${id}','отпало', document.getElementById('lapsedReason').value))">Закрыть — отпало (с причиной)</button>

  }
  if(v===t.author && owned && !selfRel){

    html += `<div class="card"><h3>Снять задание</h3><div class="form-row">
      <div class="fld"><label>Основание</label><input id="releaseReason"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.releaseTask('${id}', ZD.state.viewer, document.getElementById('releaseReason').value.trim()))">Снять</button>
    </div>${t.kind==='rule' ? '<div class="small">Пока повод жив, новое задание по нему не выдаётся.</div>' : ''}</div>`;
  }
  // срок: запрос исполнителя, решение утверждающего
  const req = pendingExtension(t);
  if(req){
    html += `<div class="card"><h3>Запрос продления</h3>
      <div class="small">до <b>${fmt(req.newDue)}</b> · основание: ${esc(req.reason)} · решает ${esc(emp(approverOf(t))?.name)}</div>
      ${v===approverOf(t) ? `<div class="btn-row">
        <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.decideExtension('${id}', ZD.state.viewer, true))">Утвердить</button>
        <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.decideExtension('${id}', ZD.state.viewer, false, prompt('Почему отклонено?')||''))">Отклонить</button>
      </div>` : ''}</div>`;
  } else if(mine && !namedDue(t)){
    html += `<div class="card"><h3>Продление срока</h3><div class="form-row">
      <div class="fld"><label>Новый срок</label><input type="date" id="extDue" value="${addWorkdays(dueOf(t),3)}"></div>
      <div class="fld"><label>Основание</label><input id="extReason"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.requestExtension('${id}', ZD.state.viewer, document.getElementById('extDue').value, document.getElementById('extReason').value.trim()))">Запросить продление</button>
    </div></div>`;
  }
  // ход исполнения: любой участник
  if(visibleTo(t, v)){
    const notes = t.journal.map((e,i)=>({e,i})).filter(x=>x.e.ev==='отметка о ходе');
    html += `<div class="card"><h3>Отметка о ходе</h3><div class="form-row">
      <div class="fld"><label>Что сделано</label><input id="prText"></div>
      <div class="fld"><label>Ссылка или вложение</label><input id="prLink"></div>
      ${notes.length ? `<div class="fld"><label>Исправление к</label><select id="prFix"><option value="">—</option>${notes.map(x=>`<option value="${x.i}">${fmt(x.e.t)} · ${esc(x.e.text)}</option>`).join('')}</select></div>` : ''}
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>{ const f=document.getElementById('prFix'); ZD.addProgress('${id}', ZD.state.viewer, document.getElementById('prText').value.trim(), {link:document.getElementById('prLink').value.trim(), fixes: f&&f.value!=='' ? +f.value : null}); })">Отметить</button>
    </div></div>`;
  }
  // переназначение: автор или руководитель исполнителя по цепочке
  if(v!==t.assignee && (v===t.author || chiefChainIncludes(t.assignee, v)) && !(escalateOf(t) && escalateOf(t).reassign===false)){
    html += `<div class="card"><h3>Переназначение</h3><div class="form-row">
      <div class="fld"><label>Новый исполнитель</label><select id="reassignSel">${empOpts}</select></div>
      <div class="fld"><label>Основание</label><input id="reassignReason"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.reassignTask('${id}', document.getElementById('reassignSel').value, ZD.state.viewer, document.getElementById('reassignReason').value.trim()))">Переназначить</button>
    </div></div>`;
  }
  return html || '<div class="muted small">нет доступных действий из этого состояния</div>';
}

  const o = ownerObj(cfg.src, p.objectId), s = objAt(o, state.today), src = cfg.src;
  if(!s) return '';
  const who = id=>id ? esc(emp(id)?.name) : '—';
  const steps = Object.keys(OWNER_STEPS).filter(k=>OWNER_STEPS[k].from.indexOf(s.status)!==-1);
  const btn = k=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.ownerStep('${src}','${o.id}', ZD.state.viewer, '${k}'))">${esc(k[0].toUpperCase()+k.slice(1))}</button>`;

  return `<div class="card"><h3>${src==='gd'?'Карточка госрешения':'Карточка программы'} ${esc(o.id)} <span class="small">у владельца, демо</span></h3>
    <div class="kv">

/* карточка заявки у владельца — демо соседа: действия специалиста, ГФ, отдела и комиссии */
function renderAppCard(p){
  const o = ownerObj('ap', p.objectId), d = state.today, s = objAt(o, d);
  const head = `<h3>Карточка заявки ${esc(o.id)} <span class="small">у владельца, демо</span></h3>`;
  if(!s) return `<div class="card">${head}<div class="small">${esc(goneReason(o, d))} — заявки нет.</div></div>`;
  const who = id=>id ? esc(emp(id)?.name) : '—', st = s.status, draft = AP_DRAFT.includes(st);
  const block = programBlock(s.program, d), spec = apSpecOn(s, d);
  const why = `(document.getElementById('apWhy')||{}).value`;
  const b = (step, arg, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.apStep('${o.id}', ZD.state.viewer, '${step}', ${arg||'null'}, ${why}))">${esc(label||step[0].toUpperCase()+step.slice(1))}</button>`;
  const btns = [];
  if(draft && !s.gf) btns.push(b('передать на подтверждение ГФ'));
  if(draft && s.gf==='handed') btns.push(b('подтвердить комплект'));
  if(draft && s.gf==='confirmed') s.depts.filter(k=>!s.concl[k]).forEach(k=>btns.push(b('внести заключение', `'${k}'`, 'Внести заключение: '+AP_DEPTS[k].name)));
  if(draft) btns.push(b('отправить в комиссию'));
  if(st==='На рассмотрении' && s.phase==='prelim'){ btns.push(b('вынести на заседание')); btns.push(b('запросить замену')); }
  if(st==='На рассмотрении' && s.phase==='session'){ btns.push(b('проголосовать')); ['одобрить','отклонить','вернуть'].forEach(x=>btns.push(b(x))); }
  if(st==='Требуется доп. информация') btns.push(b('отклонить за неустранение недостатков'));
  if(st==='На рассмотрении' || st==='Требуется доп. информация') btns.push(b('отозвать'));
  if(st==='Новый') btns.push(b('удалить'));
  if(st==='Одобрена') btns.push(b('сформировать кредит'));
  if(st==='Ожидает решения/программы') btns.push(b('привязать решение и программу', `document.getElementById('apProg').value`));
  if(st==='На оформлении') btns.push(b('зарегистрировать договоры'));
  apExpiredDocs(s, d).forEach(x=>btns.push(b('заменить документ', `'${esc(x.name)}'`, 'Заменить: '+x.name)));
  const lpOpts = state.owner.lp.map(l=>{ const x=objAt(l, d); return x ? `<option value="${l.id}">${l.id} · ${programAccepts(l.id, d)?'принимает заявки':'не принимает'}</option>` : ''; }).join('');
  const session = st==='На рассмотрении' && s.phase==='session';
  const com = s.com ? `${who(s.com.chair)} (председатель); ${s.com.members.map(m=>who(m)+(session && s.votes[m]?' — голос подан':'')).join(', ')}` : '—';
  return `<div class="card">${head}
    <div class="kv">
      <div class="k">Заявитель</div><div class="v">${esc(o.title)}${s.group?` <span class="pill neutral">групповая, ${s.group} чл.</span>`:''}</div>
      <div class="k">Статус</div><div class="v">${esc(st)} <span class="small">с ${fmt(s.statusSince)}</span>${s.phase?` · ${s.phase==='prelim'?'предварительное изучение':'заседание комитета'}`:''}</div>
      <div class="k">Программа</div><div class="v">${esc(s.program)} ${block?`<span class="pill err">не принимает заявки: ${esc(block.why)}</span>`:'<span class="pill ok">принимает заявки</span>'}</div>
      <div class="k">Специалист заявки на ${fmt(d)}</div><div class="v">${spec?who(spec)+(actingFor(spec, d)!==spec?`; действует ${who(actingFor(spec, d))}`:''):'не закреплён'}</div>
      <div class="k">Комплект</div><div class="v">${s.gf==='confirmed'?'подтверждён ГФ':s.gf==='handed'?'у ГФ на подтверждении':'у специалиста'}</div>
      <div class="k">Заключения отделов</div><div class="v">${s.depts.map(k=>AP_DEPTS[k].name+': '+(s.concl[k]?'внесено':'ждёт')).join('; ')}</div>
      <div class="k">Комиссия</div><div class="v">${com}${session?`<div class="small">крайний срок голосования ${fmt(s.deadline)} · заседание ${fmt(s.session)} · кворум ${quorumOf(s)}</div>`:''}</div>
      ${apExpiredDocs(s, d).length?`<div class="k">Просрочены документы</div><div class="v">${esc(apExpiredDocs(s, d).map(x=>x.name+' (до '+fmt(x.validTo)+')').join('; '))}</div>`:''}
      <div class="k">Последнее действие</div><div class="v">${esc(s.last.how)} · ${who(s.last.by)} · ${fmt(s.last.t)}</div>
    </div>
    ${AP_FINAL.includes(st) ? '' : `<div class="form-row" style="margin-top:12px">
      <div class="fld"><label>Программа</label><select id="apProg">${lpOpts}</select></div>
      <div class="fld"><label>Причина</label><input id="apWhy"></div>
      ${b('сменить программу', `document.getElementById('apProg').value`)}
    </div>`}
    <div class="btn-row">${btns.join('')}</div>
    <div class="small">Сделанное здесь задания увидят на следующем опросе — «Журнал прогонов».</div></div>`;
}

/* карточка документа у владельца — демо соседа: сводка исполнения выводится, действующий срок читается у заданий */
function renderDocCard(id){
  const o = ownerObj('doc', id), d = state.today, s = docAt(o, d);
  const head = `<h3>Карточка документа ${esc(o.id)} <span class="small">у владельца, демо</span></h3>`;
  if(!s) return `<div class="card">${head}<div class="small">${esc(goneReason(o, d))} — документа нет.</div></div>`;
  const who = x=>x ? esc(emp(x)?.name) : '—', st = s.stage;
  const why = `(document.getElementById('docWhy')||{}).value`;
  const b = (step, arg, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.docStep('${o.id}', ZD.state.viewer, '${step}', ${arg||'null'}, ${why}))">${esc(label||step[0].toUpperCase()+step.slice(1))}</button>`;
  const resArg = `{resp:document.getElementById('docResp').value, due:document.getElementById('docDue').value, text:${why}, parent:document.getElementById('docParent').value||null}`;
  const res = Object.values(s.res), btns = [];
  if(st==='Черновик'){ btns.push(b('на согласование', null, s.approvers.length ? 'На согласование' : 'На подпись')); btns.push(b('удалить')); }
  if(st==='Согласование'){ btns.push(b('согласовать')); btns.push(b('отказать')); }
  if(st==='Подпись' && !s.signed){ btns.push(b('подписать')); btns.push(b('отказать')); }
  if(st==='Подпись' && s.signed) btns.push(b('зарегистрировать'));
  if(st==='Зарегистрирован' && s.kind==='исх') s.addressees.forEach((n,i)=>{ if(!s.sent[n]) btns.push(b('отметить отправку',
    `ZD.ownerAt('doc','${o.id}',ZD.state.today).addressees[${i}]`, 'Отправлено: '+n)); });
  if(st==='Зарегистрирован' && s.kind!=='исх') btns.push(b('к сведению'));
  res.filter(r=>r.state==='open').forEach(r=>{ btns.push(b('исполнено', `'${r.id}'`, 'Исполнено: '+r.id)); btns.push(b('отказать в исполнении', `'${r.id}'`, 'Отказать в исполнении: '+r.id)); });
  res.filter(r=>r.state==='control').forEach(r=>{ btns.push(b('подтвердить', `'${r.id}'`, 'Подтвердить: '+r.id)); btns.push(b('вернуть', `'${r.id}'`, 'Вернуть: '+r.id)); });
  if(s.recipients.some(r=>r.mode==='ознакомление') && DOC_LIVE.includes(st)) btns.push(b('ознакомлен'));
  if(st==='Зарегистрирован'){ btns.push(b('сдать в дело')); btns.push(b('аннулировать')); }
  Object.values(s.issues).filter(i=>!i.returned).forEach(i=>btns.push(b('оригинал возвращён', `'${i.id}'`, 'Возвращён оригинал: '+i.id)));
  const acq = s.recipients.filter(r=>r.mode==='ознакомление');
  const resRows = res.map(r=>{ const k = stepByKey(resKey(r, r.resp)), due = k ? k.setDue : r.due, done = r.closedEv && r.closedEv.t;
    return `<tr><td>${esc(r.id)}${r.parent?` <span class="small">ниже ${esc(r.parent)}</span>`:''}</td><td>${who(r.author)}</td><td>${who(r.resp)}${r.co.length?`<div class="small">соисп.: ${r.co.map(who).join(', ')}</div>`:''}</td>
      <td>${fmt(r.due)}</td><td>${fmt(due)}${k && k.extensions?' <span class="small">(продлён)</span>':''}</td>
      <td>${r.state==='closed' ? esc(r.outcome)+' '+fmt(done)+(done ? (done<=due ? ' · в срок' : ' · с опозданием') : '') : r.state==='control' ? 'ждёт контролёра '+who(r.control) : 'в работе'+(r.round>1?' · круг '+r.round:'')}</td></tr>`; }).join('');
  return `<div class="card">${head}
    <div class="kv">
      <div class="k">Документ</div><div class="v">${esc(o.title)} · ${esc(s.kind)}${s.number?' · <b>'+esc(s.number)+'</b>':''}${s.requiresAnswer?' <span class="pill warn">требует ответа</span>':''}</div>
      <div class="k">Этап</div><div class="v">${esc(st)} <span class="small">с ${fmt(s.stageSince)}</span>${st==='Подпись' && s.signed ? ' · <span class="pill ok">подписан</span>' : ''}</div>
      <div class="k">Автор</div><div class="v">${who(s.author)}</div>
      ${s.approvers.length ? `<div class="k">Согласующие · круг ${s.round}</div><div class="v">${s.approvers.map(a=>who(a)+(s.approved[a]?' — согласовал':'')).join('; ')}</div>` : ''}
      ${s.signer ? `<div class="k">Подписант</div><div class="v">${who(s.signer)}${signerOn(s.signer, d)!==s.signer ? ` · подписывает ${who(signerOn(s.signer, d))} по приказу с правом подписи` : ''}</div>` : ''}
      ${s.addressees.length ? `<div class="k">Отправка</div><div class="v">отправлено ${Object.keys(s.sent).length}/${s.addressees.length}</div>` : ''}
      ${s.recipients.filter(r=>r.mode==='исполнение').length ? `<div class="k">На исполнение</div><div class="v">${s.recipients.filter(r=>r.mode==='исполнение').map(r=>who(r.emp)+(s.reviewed[r.emp]?' — рассмотрел':'')).join('; ')}</div>` : ''}
      ${acq.length ? `<div class="k">Ознакомление</div><div class="v">ознакомлены ${acq.filter(r=>s.acq[r.emp]).length}/${acq.length}${acq.some(r=>!s.acq[r.emp]) ? ' · нет: '+acq.filter(r=>!s.acq[r.emp]).map(r=>who(r.emp)).join(', ') : ''}</div>` : ''}
      ${s.control ? `<div class="k">На контроле</div><div class="v">${who(s.control)}</div>` : ''}
      ${Object.values(s.issues).length ? `<div class="k">Выдача оригинала</div><div class="v">${Object.values(s.issues).map(i=>`${esc(i.id)}: ${who(i.to)} до ${fmt(i.until)}${i.returned?' — возвращён '+fmt(i.returned.t):''}`).join('; ')}</div>` : ''}
      <div class="k">Последнее действие</div><div class="v">${esc(s.last.how)} · ${who(s.last.by)}${s.last.for?' за '+who(s.last.for):''} · ${fmt(s.last.t)}</div>
    </div>
    ${res.length ? `<table class="cgrid"><thead><tr><th>Резолюция</th><th>Автор</th><th>Ответственный</th><th>Срок резолюции</th><th>Действующий срок (из заданий)</th><th>Исход</th></tr></thead><tbody>${resRows}</tbody></table>` : ''}
    ${st==='Зарегистрирован' && s.kind!=='исх' ? `<div class="form-row" style="margin-top:12px">
      <div class="fld"><label>Ответственный</label><select id="docResp">${EMP.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
      <div class="fld"><label>Срок</label><input type="date" id="docDue" value="${addWorkdays(d, 10)}"></div>
      <div class="fld"><label>Резолюция выше</label><select id="docParent"><option value="">— верхний уровень</option>${res.filter(r=>r.state==='open').map(r=>`<option value="${r.id}">${r.id}</option>`).join('')}</select></div>
      ${b('дать резолюцию', resArg)}
    </div>` : ''}
    <div class="form-row" style="margin-top:12px"><div class="fld"><label>Комментарий · результат · основание</label><input id="docWhy"></div></div>
    <div class="btn-row">${btns.join('')}</div>
    <div class="small">Сделанное здесь задания увидят на следующем опросе — «Журнал прогонов».</div></div>`;
}
/* карточка имущества у владельца — демо соседа: факты, второй ключ, куратор на дату */
function renderImCard(src, id){

  const cur = curationOn('куратор имущества', o.id, d);
  const arg = `(document.getElementById('imArg')||{}).value`;
  const b = (step, a, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.imStep('${src}','${o.id}', ZD.state.viewer, '${step}', ${a||arg}))">${esc(label||step[0].toUpperCase()+step.slice(1))}</button>`;
  const ns = src==='imo' ? Object.keys(s.pos) : [null]; // у предложения действие — по позиции из поля

  const rows = src==='imo'
    ? `<div class="k">Источник · срок ответа</div><div class="v">${esc(s.source)} · ${fmt(s.deadline)}${s.answer ? ' · ответ '+fmt(s.answer.t) : d>s.deadline && s.open ? ' <span class="pill err">срок истёк, ответа нет</span>' : ''}</div>
       <div class="k">Позиции</div><div class="v">${Object.values(s.pos).map(p=>`${p.n}. ${esc(p.what)} — ${esc(p.outcome||'без итога')}${p.act ? ', акт '+fmt(p.act.t) : p.outcome==='принята' ? ', акта нет' : ''}`).join('<br>')}</div>`
    : `<div class="k">Вид · учётная стоимость</div><div class="v">${esc(s.kind)} · ${s.cost.toLocaleString('ru-RU')}</div>
       <div class="k">Последний осмотр</div><div class="v">${fmt(s.lastInsp)} · порог вида ${IM_SET.inspByKind[s.kind]||IM_SET.inspMonths} мес.</div>
       <div class="k">Попытки продажи</div><div class="v">${s.attempts} (не состоялось ${s.failed})${s.open ? ' · идёт попытка' : ''}</div>
       ${s.topup ? `<div class="k">Доплата отчуждателю</div><div class="v">${s.topup.amount.toLocaleString('ru-RU')} — ${s.topup.paid ? 'исполнена '+fmt(s.topup.paid.t) : '<span class="pill warn">⚑ принятие не завершено</span>'}</div>` : ''}
       ${s.contract ? `<div class="k">Договор ${esc(s.contract.id)}</div><div class="v">${esc(s.contract.buyer)} · ${s.contract.schedule.map(x=>fmt(x)+(s.contract.paid[x] ? ' ✓' : '')).join(', ')}</div>` : ''}
       ${s.enc ? `<div class="k">Обременение</div><div class="v">${esc(s.enc.kind)} до ${fmt(s.enc.to)}</div>` : ''}
       ${s.claim ? `<div class="k">Требование к отчуждателю</div><div class="v">${esc(s.claim.debtor)} · остаток ${s.claim.rest.toLocaleString('ru-RU')}</div>` : ''}`;
  return `<div class="card">${head}
    <div class="kv">
      <div class="k">Наименование</div><div class="v">${esc(o.title)}</div>
      <div class="k">Состояние на ${fmt(d)}</div><div class="v">${esc(s.status)}${s.statusSince ? ` <span class="small">с ${fmt(s.statusSince)}</span>` : ''}</div>
      <div class="k">Куратор имущества на ${fmt(d)}</div><div class="v">${cur ? who(cur.emp)+(cur.hold ? ` <span class="small">${esc(cur.hold)}</span>` : '')+(actingFor(cur.emp, d)!==cur.emp ? `; действует ${who(actingFor(cur.emp, d))}` : '') : 'не закреплён'}</div>
      ${rows}

    <div class="small">Сделанное здесь задания увидят на следующем опросе — «Журнал прогонов». Пороги поводов — настройки модуля имущества.</div></div>`;
}
function renderCrCard(id){ // кредит у владельца: график, кто уведомлён, что внесено
  const o = ownerObj('cr', id), d = state.today, s = creditAt(o, d), who = x=>x ? esc(emp(x)?.name) : '—';
  const head = `<h3>Карточка кредита ${esc(o.id)} <span class="small">у владельца, демо</span></h3>`;
  if(!s) return `<div class="card">${head}<div class="small">кредита на ${fmt(d)} нет</div></div>`;
  const cur = curatorOn('куратор кредита', o.id, d);
  const btn = (step, date, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.crStep('${esc(o.id)}', ZD.state.viewer, '${step}', '${date}'))">${label}</button>`;
  const line = x=>{ const p = s.paid[x.date], n = s.notices[x.date], left = kd(d, x.date);
    const st = p ? `внесён ${fmt(p.t)}` : n ? `заёмщик уведомлён ${fmt(n.t)} · ${who(n.by)}` : left<=0 ? 'срок наступил'

    <div class="section-h">Роли — очереди</div>

    const y = +state.today.slice(0,4);
    body = `<div class="small" style="margin-bottom:8px">Общий справочник системы, только чтение. Постоянные праздники (на любой год): ${CALENDAR_FIXED.map(x=>x.slice(3)+'.'+x.slice(0,2)).join(', ')}.</div>

    <tbody>${[...new Set([...Object.keys(CALENDAR_YEARS).map(Number), y, y+1])].sort().map(k=>{ const r=CALENDAR_YEARS[k];
      return `<tr class="${r?'':'over'}"><td>${k}</td><td>${r?'заведён':'не заведён — рабочие дни по сб/вс с отметкой у срока'}</td><td>${r?r.holidays.map(fmt).join(', '):'—'}</td><td>${r?r.workdays.map(fmt).join(', '):'—'}</td></tr>`; }).join('')}</tbody></table>`;
  }

function setSettingsTab(k){ state.settingsTab=k; render(); }
function toggleRule(id){ state.ruleOpen = state.ruleOpen===id ? null : id; render(); }
function valText(f, x){
  if(f==='author') return postOf(x).title;
  if(f==='controller') return controllerText(x);
  if(f==='importance') return x || 'как у действия';
  if(f==='rollup') return x==null ? 'по умолчанию' : String(x);
  if(f==='dueN') return x==null ? 'называет владелец' : String(x);
  return String(x);
}
function renderRuleHistory(r, admin){ // редакции хранят значения: «было → стало»
  const rows = r.editions.slice().sort(byFrom).map(e=>{
    const prev = e.was ? r.editions.find(x=>x.n===e.was) : null;
    const diff = e.release ? (e.fields ? 'поля выпуска: '+e.fields.join(', ') : 'начальные значения')
      : PROD_FIELDS.filter(f=>prev && e.values[f]!==prev.values[f]).map(f=>`${FIELD_TITLE[f]} ${valText(f, e.values[f])} (было ${valText(f, prev.values[f])})`).join(' · ');
    const st = e.cancelled ? `<span class="pill neutral">отменена ${fmt(e.cancelled.t)}: ${esc(e.cancelled.basis)}</span>` : e===pendingEdition(r) ? '<span class="pill warn">ждёт даты</span>' : e.n===r.edN ? '<span class="pill ok">действует</span>' : '';
    const cancel = admin && e===pendingEdition(r) ? ` <input id="reCancel" placeholder="основание отмены" style="width:140px"> <button class="btn btn-sm btn-secondary" onclick="ZD.ui(()=>ZD.cancelEdition('${r.id}', ${e.n}, ZD.state.viewer, document.getElementById('reCancel').value.trim()))">Отменить</button>` : '';
    return `<tr class="${e.cancelled?'hole':''}"><td>${e.n}</td><td>${fmt(e.from)}</td><td>${esc(emp(e.by)?.name||e.by)}</td><td>${esc(e.basis)}</td><td class="small">${esc(diff)}</td><td>${st}${cancel}</td></tr>`;
  }).join('');
  const k = kindOf(r.kind), opt = (list, cur)=>list.map(([v,l])=>`<option value="${esc(v)}" ${v===(cur==null?'':cur)?'selected':''}>${esc(l)}</option>`).join('');
  const form = !admin ? '' : `<div class="card"><h3>Новая редакция</h3><div class="form-row">
    ${r.dueUnit==='named' ? '' : `<div class="fld"><label>Срок</label><input id="reDueN" type="number" value="${r.dueN}" style="width:70px"></div>`}
    <div class="fld"><label>Контролёр</label><select id="reCtrl">${opt([['','нет — отпадение повода'],['автор','автор правила']].concat(POSTS.map(p=>[p.id, p.title])), r.controller)}</select></div>
    <div class="fld"><label>Важность</label><select id="reImp">${opt([['','как у действия']].concat(IMPORTANCE.map(x=>[x,x])), r.importance)}</select></div>
    <div class="fld"><label>Автор (должность)</label><select id="reAuthor">${opt(POSTS.map(p=>[p.id, p.title]), r.author)}</select></div>
    <div class="fld"><label>Порог свёртки</label><input id="reRollup" type="number" value="${r.rollup==null?'':r.rollup}" placeholder="${ROLLUP_DEFAULT}" style="width:70px"></div>
    ${k.genus==='надзор' ? `<div class="fld"><label>Режим</label><select id="reMode">${opt([['авто','авто'],['ручной','ручной — решает автор']], r.mode)}</select></div>` : ''}
    <div class="fld"><label>Действует с</label><input id="reFrom" type="date" value="${state.today}" min="${state.today}"></div>
    <div class="fld"><label>Основание</label><input id="reBasis" placeholder="приказ, служебная записка"></div>
    <button class="btn btn-primary btn-sm" onclick="ZD.ui(()=>ZD.submitRuleEdit('${r.id}'))">Сохранить редакцией</button>
  </div><div class="small">Адресат, единица срока и действие меняются выпуском.${k.genus!=='надзор' ? ` Режим у вида рода «${esc(k.genus)}» — всегда авто.` : ''}</div></div>`;
  return `<table class="cgrid"><thead><tr><th>Ред.</th><th>Действует с</th><th>Правка</th><th>Основание</th><th>Значения</th><th></th></tr></thead><tbody>${rows}</tbody></table>${form}`;
}
function submitRuleEdit(ruleId){
  const r = ruleById(ruleId), val = id=>{ const x = document.getElementById(id); return x ? x.value.trim() : null; }, ch = {};
  const put = (f, x, same)=>{ if(x!==null && !same) ch[f] = x; };
  put('dueN', val('reDueN'), String(r.dueN)===val('reDueN'));
  put('controller', val('reCtrl'), (r.controller||'')===val('reCtrl'));
  put('importance', val('reImp'), (r.importance||'')===val('reImp'));
  put('author', val('reAuthor'), r.author===val('reAuthor'));
  put('rollup', val('reRollup'), (r.rollup==null ? '' : String(r.rollup))===val('reRollup'));
  put('mode', val('reMode'), r.mode===val('reMode'));
  const e = editRule(ruleId, ch, {by:state.viewer, from:val('reFrom'), basis:val('reBasis')});
  toast(`Редакция ${e.n} ${e.from===state.today ? 'действует' : 'ждёт даты '+fmt(e.from)}`, 'ok');
}

/* ввод вида в действие и рубильник надзора — администратор заданий, с основанием */
function activeOn(k, d){ return !!k.activatedAt && k.activatedAt<=d && !(k.retiredAt && k.retiredAt<=d); }
function activateKind(kindId, by, basis){
  const k = kindOf(kindId);
  if(!isTasksAdmin(by)) throw new Error('вводит в действие администратор заданий');
  if(!basis) throw new Error('нужно основание ввода в действие');
  if(activeOn(k, state.today)) throw new Error('вид уже в действии');
  if(k.retiredAt && k.retiredAt<=state.today) throw new Error('вид выведен выпуском — вернуть его может только выпуск');
  if(k.off && k.genus!=='надзор') throw new Error(`вид рода «${k.genus}» после выключения возвращает только выпуск`);
  k.activatedAt = state.today; k.off = null;
  k.switches.push({t:state.today, ev:'введён в действие', by, basis});
  return k;
}
function deactivateKind(kindId, by, basis){ // поводы вида отпускаются, открытые задания закрываются
  const k = kindOf(kindId);
  if(!isTasksAdmin(by)) throw new Error('выключает администратор заданий');
  if(k.genus!=='надзор') throw new Error(`вид рода «${k.genus}» выключается только выпуском`);
  if(!basis) throw new Error('нужно основание выключения');
  if(!activeOn(k, state.today)) throw new Error('вид не в действии');
  k.activatedAt = null; k.off = {t:state.today, by, basis};
  k.switches.push({t:state.today, ev:'выключен', by, basis});
  state.tasks.filter(t=>t.originKind===kindId && !isTerminal(t)).forEach(t=>{
    log(t,'закрыто',{outcome:'снято', reason:'вид выключен: '+basis, by}); notify(t,'закрыто');
  });
  return k;
}

  const rows = state.pollRuns.slice().reverse().map(r=>`

  <div class="btn-row">

  <table class="cgrid"><thead><tr><th>Источник</th><th>Интервал опроса</th><th>Порог молчания</th><th>Молчит</th></tr></thead>

      return `<tr><td>${esc(s.name)}</td><td>${s.pollEveryMin>=1440?'ночной прогон':s.pollEveryMin+' мин'}</td>
      <td>${silenceThreshold(s)} мин${s.silenceMin==null?' <span class="small">(два интервала, не меньше 30)</span>':''}</td>
      <td>${sil ? `с ${fmt(sil.since)} · ${sil.minutes} мин` : '—'}</td></tr>`; }).join('')}</tbody></table>
  <div class="section-h">Журнал прогонов</div>
  <table class="cgrid"><thead><tr><th>№</th><th>Дата</th><th>Ответ источника</th><th>Новых</th><th>Отпавших</th><th>Совпало</th><th>Полнота</th><th>Порог</th></tr></thead>
    <tbody>${rows}</tbody></table>
  <div class="section-h">Поводы (текущий срез)</div>
  <table class="cgrid"><thead><tr><th>Ключ</th><th>Вид</th><th>Состояние</th><th>Дата состояния</th><th>Признаки</th></tr></thead>
    <tbody>${state.povods.slice().reverse().map(p=>`<tr>
      <td class="mono small">${esc(p.key)}</td><td>${esc(kindOf(p.kind).title)}</td>
      <td><span class="pill ${p.status==='gone'?'neutral':p.status==='frozen'?'warn':'ok'}">${p.status}</span>${p.status!=='gone' && povodReleased(p) ? ' <span class="pill neutral">снят без поручения</span>' : ''}</td>
      <td>${fmt(p.stateDate)}${p.approx?' <span class="small">(приблизительно)</span>':''}</td>
      <td class="small">${esc(JSON.stringify(p.traits||{}))}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">пусто</td></tr>'}</tbody></table>
  `;
}
