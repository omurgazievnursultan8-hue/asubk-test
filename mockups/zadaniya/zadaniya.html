/* подсветка на дату: опрос её не трогает, показ читает ответ соседа; модуль по виду отвечает отказом — числа нет, только где она видна */
function highlightsOn(d){
  return state.povodKinds.filter(k=>k.genus==='подсветка' && !(k.retiredAt && k.retiredAt<=d)).map(k=>{
    if(k.hlAt) return {kind:k.id, title:k.title, owner:ownerOfKind(k.id), count:null, rows:[], at:k.hlAt};
    const rows = Array.from(computeExpectedForKind(k.id, d).entries()).map(([key, e])=>Object.assign({key}, e));
    return {kind:k.id, title:k.title, owner:ownerOfKind(k.id), count:rows.length, rows};
  });
}

/* ---------- 8. эскалация / срок-близко — периодические проверки ---------- */
function checkDeadlines(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t)) return;
    const st = lastEv(t);
    if(st!=='поручено' && st!=='принято' && st!=='возвращено') return;
    const due = dueOf(t);
    const soon = t.id+'|'+due;
    if(due>=asOf && daysBetween(asOf,due)<=1 && !notifiedOnce(t.id,'срок-близко',due) && !state.soonHeld[soon]){
      if(t.journal[0].t===asOf){ state.soonHeld[soon] = true; holdNotify(t, 'срок-близко'); } // в день выдачи не шлётся, и на этот срок больше не шлётся: он назван в «поручено»
      else notify(t,'срок-близко',null,due);
    }
    if(due<asOf && !notifiedOnce(t.id,'срок-истёк',due)){ // руководителю — не звонок, а задание «Просрочено задание»
      notify(t,'срок-истёк',null,due);
      const esc = escalateOf(t), p = t.povodKey && povodByKey(t.povodKey);
      if(esc && esc.to==='уведомление' && p && p.escWho) notify(t,'эскалация',p.escWho,due); // тому, кто вправе решить
    }
  });
}
/* заявленное без контролёра при живом поводе возвращается только на полном прогоне,
   срез которого позже дня заявления — соседу даётся ночь, чтобы увидеть работу */
function returnClaimed(asOf){
  state.tasks.forEach(t=>{
    if(isTerminal(t) || t.controller || lastEv(t)!=='заявлено' || t.kind!=='rule') return;
    if(povodGoneFor(t)) return;
    const claimedAt = stateEntry(t).claimedAt || stateEntry(t).t;
    if(claimedAt >= asOf) return;
    log(t,'возвращено',{note:'повод жив на срезе '+fmt(asOf)}); notify(t,'возвращено');
  });
}

/* ---------- 9. прогон опроса ---------- */
function retireKinds(asOf){ // выпуск вывел вид: открытые задания закрываются «снято: вид выведен», история остаётся;
  // закрывается только то, чей повод держался бы и без вывода; отпавший сам — обычным порядком в том же прогоне
  state.povodKinds.filter(k=>k.retiredAt && k.retiredAt<=asOf).forEach(k=>{
    const alive = computeExpectedForKind(k.id, asOf, true);
    state.tasks.filter(t=>t.originKind===k.id && !isTerminal(t) && alive.has(t.povodKey)).forEach(t=>{
      log(t,'закрыто',{outcome:'снято', reason:'вид выведен выпуском'}); notify(t,'закрыто'); });
  });
}
/* сверка множества одного источника: тот же шаг у ночного прогона и опроса по сохранению */
function reconcileSource(src, asOf){
  const tot = {new:0, gone:0, matched:0};
  src.kinds.forEach(kindId=>{
    const {new:nk, gone:gk, matched:mk} = reconcileKind(kindId, asOf);
    handleGoneForKind(gk, asOf);
    handleNewForKind(kindId, nk, asOf);
    reissueForFreedPairs(kindId, mk);
    tot.new+=nk.length; tot.gone+=gk.length; tot.matched+=mk.length;
  });
  return tot;
}
function runPoll(opts){
  opts = opts || {};
  const asOf = state.today, scope = opts.scope || state.pollScope;
  applyEditions(asOf); // редакции с датой начала вступают сами
  retireKinds(asOf);
  const run = {id:nextId('PR'), date:asOf, scope, sources:[], complete:true, stateDrift:[]};
  const polled = SOURCES.filter(POLL_SCOPES[scope]);
  const isDown = src=>opts.down!==undefined ? opts.down
    : (opts.downSources ? opts.downSources.indexOf(src.id)!==-1 : !!state.sourceDown[src.id]);
  state.runDown = {date:asOf, scope, ids:polled.filter(isDown).map(x=>x.id)}; // самоопрос видит ответ идущего прогона: две ночи — с текущей
  try{ withDigest(()=>{
    // источники с шагами к самоопросу уже сверены — их сделанное закрыло задания раньше; остальные — после
    const self = SOURCES[0], steps = polled.filter(x=>x!==self && x.onSave);
    steps.concat(self, polled.filter(x=>x!==self && steps.indexOf(x)===-1)).forEach(src=>{
      if(isDown(src)){ // ошибка не значит пусто: поводы этого источника не трогаются, прогон неполный
        run.sources.push({src:src.id, name:src.name, answer:'ошибка', matched:0, new:0, gone:0});
        run.complete = false;
        state.povods.filter(p=>p.status==='appeared' && src.kinds.indexOf(p.kind)!==-1).forEach(p=>{
          p.status='frozen'; p.frozenSince=asOf; log(p,'заморожен',{});
        });
        return;
      }
      run.sources.push(Object.assign({src:src.id, name:src.name, answer:'множество'}, reconcileSource(src, asOf)));
    });
    run.sources.sort((a,b)=>SOURCES.findIndex(x=>x.id===a.src)-SOURCES.findIndex(x=>x.id===b.src));
    // сроки — после сверки всех источников (сделанное у владельца закрыло задание раньше, чем истёк срок); только при доступном самоопросе
    if(run.sources[0].answer==='множество') checkDeadlines(asOf);
    if(run.complete) returnClaimed(asOf);
    readdressByCuration(asOf);
    readdressByOwnerRecord(asOf);
    readdressByDeparture(asOf);
  }); } finally { state.runDown = null; }
  run.stateDrift = checkStateField();
  run.stateDrift.forEach(x=>syncCurrent(taskOf(x.task))); // журнал главный: поле пересобирается из него
  state.pollRuns.push(run);
  return run;
}
/* опрос по сохранению: модуль заданий замечает сохранение снаружи, сосед ничего не шлёт. Только сверка множества этого источника;

function pollSource(srcId){

/* ---------- 10. видимость ---------- */
function responsibleNow(t){ // ответственный по кураторству на дату
  if(!t.addr || t.addr.by!=='кураторство' || !t.addr.curObj) return null;
  return curatorOn(t.addr.role, t.addr.curObj, state.today);
}
function visibleTo(t, viewerId){
  if(inQueue(t) && queueHolders(t).indexOf(viewerId)!==-1) return true; // очередь, пока не взяли, — носителям роли
  if(viewerId===t.assignee || viewerId===t.controller || viewerId===t.author) return true;
  if(chiefChainIncludes(t.assignee, viewerId)) return true;
  if(actingOn(t, state.today)===viewerId) return true; // замещающий исполнителя на дату
  if(responsibleNow(t)===viewerId) return true;
  if(isTerminal(t)) return false;
  /* решающие по открытому заданию: утверждающий продление, пока запрос ждёт решения; кто вправе назначить из неразобранной очереди;

  if(pendingExtension(t) && approverOf(t)===viewerId) return true;

}
function overdueChiefSees(t, v){ return !!t.assignee && dueOf(t)<state.today && isOverdueChief(t, v); } // сначала дешёвое: задание о просрочке ищется по всем
/* ход за исполнителем: задание не заявлено, не ждёт приёмки и не отказано */
function moveOnAssignee(t){ const st = lastEv(t); return st==='поручено' || st==='принято' || st==='возвращено'; }
/* просрочено: срок прошёл, а ход за исполнителем — одно правило у счётчика, красной строки, «срок истёк» и «Просрочено задание» */
function isOverdue(t, d){ return moveOnAssignee(t) && dueOf(t)<d; }
/* «моё»: я исполнитель или действую за исполнителя на дату; контролёр и утверждающий — нет */
function isMine(t, v, d){ return !!t.assignee && (t.assignee===v || actingOn(t, d||state.today)===v); }
/* ход за мной: очередь «Мои задания», плитка и счётчик пункта меню */
function moveIsMine(t, v, d){ return moveOnAssignee(t) && isMine(t, v, d); }
/* у кого ход, когда он не за исполнителем: блок «Жду ответа» */
function moveHolder(t){
  const st = lastEv(t);
  if(st==='ожидает приёмки') return {who:t.controller, what:'приёмка'};
  if(st==='отказано'){ const dr = docRejectTo(t); // отказ разбирает назначивший из очереди, у шага документа — кто меняет участника роли, иначе автор
    return {who:t.queue && t.queueAssignedBy ? t.queueAssignedBy : dr ? dr.emp || null : t.author, what:'рассмотрение отказа'}; }
  if(st==='заявлено') return {who:null, what:'ночной опрос подтвердит исполнение'};
  return null;
}
/* что по заданию ждёт решения и чьего: приёмка, запрос продления */
function decisionsOf(t){
  if(isTerminal(t)) return [];
  const out = [], req = pendingExtension(t);
  if(lastEv(t)==='ожидает приёмки'){ const e = stateEntry(t); out.push({type:'приёмка', by:t.controller, since:e.claimedAt||e.t}); }
  if(req) out.push({type:'продление', by:approverOf(t), since:req.t, newDue:req.newDue});
  return out;
}
/* решение просрочено: приёмка дольше 3 р.д., запрос продления без ответа дольше 1 р.д. Отдельное правило, не просрочка исполнения */
function decisionOverdue(t, d, by){
  d = d||state.today;
  return decisionsOf(t).some(x=>(!by || x.by===by) && workdaysBetween(x.since, d) > thrOn(x.type==='приёмка' ? 'zd.awaitWd' : 'zd.extWd', d));
}
/* закрытое: своё — был исполнителем или закрыл сам; очередь без исполнителя закрывает тот, кто сделал работу */
function closerOf(t){ const by = stateEntry(t).by; return emp(by) ? by : null; }
function workerOf(t){ return t.assignee || closerOf(t); }
function closedMine(t, v){ return t.assignee===v || closerOf(t)===v; }
function closedOfSubs(t, v){ const w = workerOf(t); return !!w && chiefChainIncludes(w, v); }
function closedGiven(t, v){ return t.kind==='free' && t.author===v; }
/* отборы вкладки «Закрытые»: чужой отбор виден, только если в нём что-то есть */
function closedFilters(v){
  const all = state.tasks.filter(closedNow);
  return [{id:'mine', title:'Мои', tasks:all.filter(t=>closedMine(t, v))},
    {id:'subs', title:'Подчинённых', tasks:all.filter(t=>closedOfSubs(t, v))},

function closedPick(v){ const f = closedFilters(v); return f.find(x=>x.id===state.closedFilter) || f[0] || {id:'mine', tasks:[]}; }
/* неразобранную очередь назначает автор, держатель «Кто поручил» или его руководитель */
function canAssignQueue(t, v){ return inQueue(t) && queueAssigners(t, state.today).indexOf(v)!==-1; }
/* куда задание идёт у зрителя: одна вкладка на задание. Ход за мной считает плитка и стоит первым, дальше решение, потом основания видимости;
   то, что видно, но ни в одну вкладку не вошло, находится поиском */
function bucketOf(t, v, d){
  d = d||state.today;
  if(closedNow(t)){
    if(closedMine(t, v)) return 'closed';
    return closedOfSubs(t, v) || closedGiven(t, v) ? 'closed-more' : visibleTo(t, v) ? 'other' : null;
  }
  if(moveIsMine(t, v, d)) return 'mine';
  if(inQueue(t) && queueHolders(t).indexOf(v)!==-1) return 'role';
  if(decisionsOf(t).some(x=>x.by===v)) return 'decide';
  if(isMine(t, v, d)) return 'wait';
  if(closedGiven(t, v)) return 'gave';
  if(canAssignQueue(t, v)) return 'unassigned';
  if(t.assignee && (chiefChainIncludes(t.assignee, v) || responsibleNow(t)===v || overdueChiefSees(t, v))) return 'sub';
  return visibleTo(t, v) ? 'other' : null;
}
function bucketsOf(v){
  const out = {mine:[], role:[], wait:[], decide:[], gave:[], unassigned:[], sub:[], closed:[], 'closed-more':[], other:[]};
  state.tasks.forEach(t=>{ const b = bucketOf(t, v); if(b) out[b].push(t); });

}
const closedAt = t=>stateEntry(t).t;
function queueTasks(scope){
  const v = state.viewer, list = state.tasks.filter(t=>bucketOf(t, v)===scope);
  return scope==='closed' ? list.sort((a,b)=>closedAt(a)<closedAt(b) ? 1 : closedAt(a)>closedAt(b) ? -1 : 0) : list.sort((a,b)=>dueOf(a)<dueOf(b) ? -1 : 1);

/* вкладки зрителя: «Моя работа» есть всегда, пустые скрыты. Счётчик «Моей работы» — ход за мной, то же число у плитки и пункта меню */
const Q_TABS = [{id:'work', title:'Моя работа'}, {id:'decide', title:'Ждут моего решения'}, {id:'sub', title:'Подчинённые'}, {id:'gave', title:'Я поручил'}, {id:'closed', title:'Закрытые'}];
function tabsOf(v){

  const n = {work:b.mine.length, decide:b.decide.length, sub:b.sub.length+b.unassigned.length, gave:b.gave.length, closed:closedPick(v).tasks.length};
  const filled = b.mine.length+b.role.length+b.wait.length>0;
  return Q_TABS.map(x=>({id:x.id, title:x.title, n:n[x.id], filled:x.id==='work' ? filled : n[x.id]>0})).filter(x=>x.id==='work' || x.filled);

/* группа в списке: открытые задания одного вида у одного человека (в очереди роли — вида и роли), от двух.
   Своих реквизитов у группы нет: число, просрочки и ближайший срок — свод заданий; срок и журнал у каждого свои */
function groupsOf(tasks){
  const out = [], seen = {};
  tasks.forEach(t=>{
    if(closedNow(t) || t.kind!=='rule' || !t.originKind){ out.push({task:t}); return; }
    const key = t.originKind+'|'+(t.assignee || 'q:'+t.queue.role);
    if(seen[key]) seen[key].tasks.push(t);
    else { seen[key] = {key, kind:t.originKind, tasks:[t]}; out.push(seen[key]); }
  });
  const d = state.today;
  return out.map(x=>{
    if(x.task) return x;
    if(x.tasks.length<2) return {task:x.tasks[0]};
    const t0 = x.tasks[0], dues = x.tasks.map(dueOf).sort();
    return Object.assign(x, {title:whatToDo(t0), count:x.tasks.length, assignee:t0.assignee||null, queueRole:t0.assignee ? null : t0.queue.role,

  });

function whatToDo(t){ return t.kind==='rule' && t.action ? actionOf(t.action).label : t.label; }

const CASE_PAGE = {заёмщик:'borrower/borrower.html', заявка:'loan-application/loan-application.html', кредит:'loan-credit/credit.html', залог:'collateral/zalog.html', взыскание:'collection/collection.html'};

const TYPE_PAGE = {unit:'org-structure/org-structure.html', territory:'org-structure/org-structure.html', employee:'employee/employee.html', obligation:SRC_PAGE.rp};

function canTake(t, v){

/* пакетное действие: каждое задание проверяется своими правилами и пишет событие в свой журнал; отказ по одному не останавливает остальные */
const BATCH_OPS = {
  'взять':t=>(by)=>take(t.id, by),
  'заявить':t=>(by, x)=>claim(t.id, x.proof||null, by),
  'отметка':t=>(by, x)=>addProgress(t.id, by, x.text, {link:x.link||null}),
  'продление':t=>(by, x)=>requestExtension(t.id, by, x.newDue, x.reason),
};
function batchTasks(ids, op, by, arg){
  if(!BATCH_OPS[op]) throw new Error('такого пакетного действия нет');
  if(!ids || !ids.length) throw new Error('выберите задания');
  const res = {op, done:[], refused:[]};
  withDigest(()=>ids.forEach(id=>{
    try{ const t = taskOf(id); if(!t) throw new Error('задания нет'); BATCH_OPS[op](t)(by, arg||{}); res.done.push(id); }
    catch(e){ res.refused.push({id, why:e.message}); }
  }));
  return res;
}
/* тип группы: очередь роли, подпись, работа в самом задании или в карточке дела */
function groupType(g){ return !g.assignee ? 'очередь' : g.kind==='doc-sign' ? 'подпись' : kindOf(g.kind).ownerExec ? 'в деле' : 'в задании'; }
/* что доступно группе: панель по типу. В деле панели нет: в строках ссылки на дела, отметка по одной в карточке */
function groupOps(g, v){
  const type = groupType(g), any = f=>g.tasks.some(f);
  if(type==='очередь') return any(t=>queueHolders(t).indexOf(v)!==-1) ? ['взять'] : [];
  if(type==='подпись') return any(t=>t.assignee===v) ? ['подписать'] : [];
  if(type==='в деле') return [];
  const ops = [];
  if(any(t=>lastEv(t)==='поручено' && canActFor(t, v))) ops.push('взять');
  if(any(t=>['принято','возвращено'].indexOf(lastEv(t))!==-1 && canActFor(t, v))) ops.push('заявить');
  if(any(t=>canActFor(t, v) && !namedDue(t) && !tplLocked(t) && !pendingExtension(t))) ops.push('продление');
  if(any(t=>visibleTo(t, v))) ops.push('отметка');
  return ops;
}

/* ---------- 10а. сверка реестров ---------- */
function checkRegistry(){
  const errs = [];
  state.rules.forEach(r=>{ if(r.author && typeof r.author==='object' && !(r.addressee.by==='очередь' && !r.addressee.role))
    errs.push(`«${kindOf(r.kind).title}»: «Кто поручил» по очередям — у правила, повод которого не называет очередь`); });
  state.povodKinds.forEach(k=>{
    if(!('sumAttr' in k)) errs.push(`«${k.title}»: не объявлен реквизит суммы`);
    if(!k.ownerDept) errs.push(`«${k.title}»: не объявлено подразделение-владелец`);
    if(k.escalate && k.escalate.to==='очередь' && (!roleOf(k.escalate.role) || !actionOf(k.escalate.action)))
      errs.push(`«${k.title}»: адресат эскалации — незаведённая очередь или действие`);
    if(k.escalate && ['уведомление','очередь'].indexOf(k.escalate.to)===-1) errs.push(`«${k.title}»: адресат эскалации не той формы`);
    if(k.periodic && k.periodAbsorb!=='да' && k.periodAbsorb!=='нет') errs.push(`«${k.title}»: периодический вид не объявил поглощение периодом`);
    if(!k.periodic && k.periodAbsorb!=null) errs.push(`«${k.title}»: поглощение периодом у событийного вида`);
    if(GENERA.indexOf(k.genus)===-1) errs.push(`«${k.title}»: не объявлен род — шаг, надзор, самоопрос, сигнал или подсветка`);
    const n = state.rules.filter(r=>r.kind===k.id).length, rules = k.genus==='подсветка' || k.genus==='сигнал' ? 0 : 1;
    if(n!==rules) errs.push(rules ? `«${k.title}»: правил ${n} — у вида ровно одно правило` : `«${k.title}»: правил ${n} — у рода «${k.genus}» правила нет`);
    if(k.genus==='сигнал' && !state.signals[k.id]) errs.push(`«${k.title}»: у сигнала нет настройки`);
    if(k.pollOnSave && !(sourceOfKind(k.id)||{}).onSave) errs.push(`«${k.title}»: опрос по сохранению у вида, источник которого так не опрашивается`);
  });
  state.rules.forEach(r=>{
    if(!kindOf(r.kind)){ errs.push(`${r.id}: вид повода «${r.kind}» не заведён`); return; }
    if(!actionOf(r.action)) errs.push(`${r.id}: действие «${r.action}» не заведено`);
    if(!r.addressee){ errs.push(`${r.id}: нет формулы адресата`); return; }
    const k = kindOf(r.kind), by = r.addressee.by;
    if(!r.author || (typeof r.author==='object' ? Object.values(r.author) : [r.author]).some(a=>!postOf(a))) errs.push(`${r.id}: автор правила — не должность`);
    if(r.controller && r.controller!=='автор' && !postOf(r.controller)) errs.push(`${r.id}: контролёр — не автор и не должность`);
    if('threshold' in r) errs.push(`${r.id}: порог появления повода — настройка модуля-владельца, не правила`);
    const form = by==='очередь' ? 'очередь' : by==='названный' ? 'названный' : 'формула';
    if(k.addrForm!==form) errs.push(`${r.id}: адресат правила не той формы, что объявил вид («${k.addrForm}»)`);
    if(by==='очередь' && !(r.addressee.role ? roleOf(r.addressee.role) : r.addressee.who)) errs.push(`${r.id}: роль очереди не заведена`);
    if(r.dueUnit==='named' && !r.dueFrom) errs.push(`${r.id}: срок называет владелец — не сказано, откуда он берётся`);
    if(r.extendBy && r.dueUnit!=='named') errs.push(`${r.id}: утверждающий продление назван, а срок — правила`);
    if(r.ownDue && r.dueUnit!=='workday') errs.push(`${r.id}: собственный срок повода — в рабочих днях, умолчание — значение правила`);
  });
  return errs;
}

/* исполнитель на дату: текущий, откатанный по событиям после даты (взяли из очереди, переназначили, переадресовали) */
function assigneeOn(t, d){
  let a = t.assignee;

/* одна строка на задание на дату (конец дня): реквизиты и состояние, выведенное заданиями; закрытые остаются строками */
function taskRows(d){
  d = d || state.today;
  return state.tasks.filter(t=>t.journal[0].t<=d).map(t0=>{
    const t = taskOn(t0, d);
    const claimed = t.journal.find(e=>e.ev==='заявлено' || e.ev==='ожидает приёмки');
    const k = t.originKind ? kindOf(t.originKind) : null, term = isTerminal(t), due = dueOf(t);

    return {

      claimed: claimed ? (claimed.claimedAt||claimed.t) : null,
      closed: term ? stateEntry(t).t : null,
      outcome: outcomeOf(t) ? outcomeOf(t).outcome : null,
      extensions: extensionsOf(t), repeatOf:t.repeatOf, repeatCount:t.repeatCount,
      sumAttr: k ? k.sumAttr : null,
      owner: t.originKind ? ownerOfKind(t.originKind) : null, // чей повод — для разреза показателей
      doneBy: term ? (stateEntry(t).by || null) : null,

      actingFor: acting && acting!==t.assignee ? acting : null,

/* плитка дашборда «Мои задания»: три показателя, которые статистика считает по строкам дня; «я» и «мои роли» — параметры зрителя */
function myTile(v, d){
  const open = taskRows(d).filter(r=>!r.closed);
  const mine = open.filter(r=>r.move && r.assignee && (r.assignee===v || r.actingFor===v));
  const queue = open.filter(r=>r.queueRole && roleOf(r.queueRole).holders.indexOf(v)!==-1 && r.queueExcept.indexOf(v)===-1);
  const over = mine.filter(r=>r.overdue).length;
  return {mine:mine.length, overdue:over, queues:queue.length, light:over>0 ? 'красный' : 'норма'};
}

/* Действие выполняется только по кнопке окна. Пустое обязательное поле и отказ движка — ошибка в окне, поля не теряются; отмена ничего не меняет */
let dlg = null;
function openDialog(spec){

function dlgFilled(f){
  if(dlg.miss.indexOf(f)===-1) return;
  const x = dlgFields().find(y=>y.f===f);
  if(!x || dlgEmpty(x)) return;
  dlg.miss = dlg.miss.filter(y=>y!==f);
  const rest = dlgFields().filter(y=>dlg.miss.indexOf(y.f)!==-1).map(y=>y.label);
  dlg.err = rest.length ? 'Заполните: '+rest.join(', ') : '';

  const fld = document.querySelector(`#dlgHost .fld[data-f="${f}"]`), ban = document.querySelector('#dlgHost [data-dlg-err]');

}
function dialogSet(f, v, repaint){
  if(!dlg) return;
  dlg.values[f] = v;
  if(dlg.onSet) dlg.onSet(f, v, dlg.values);

  if(repaint) paintDialog();
}
function dialogCheck(f, v, on){
  if(!dlg) return;
  const cur = dlg.values[f] || [];

function dialogSubmit(){

function basisOptions(){ // основание — утверждённый и не заменённый обзор на дату
  return state.owner.an.map(o=>reviewAt(o, state.today)).filter(r=>r && r.approved && !r.replacedBy);

/* дела для поля «Дело»: демо-данные стенда; в системе — общий поиск по делам */
function caseCatalog(d){
  d = d||state.today;
  const out = [], seen = {}, live = o=>!o.ev || o.ev.some(e=>e.t<=d);
  const put = (type, id, name)=>{ const key = type+'|'+id; if(seen[key]) return; seen[key] = true; out.push({type, id, text:`${type} ${id} · ${name}`}); };
  state.owner.zm.filter(live).forEach(o=>put('заёмщик', o.id, o.name));
  state.owner.ap.filter(live).forEach(o=>put('заявка', o.id, o.title));
  state.owner.cr.concat(state.owner.pl, state.owner.cl).filter(live).forEach(o=>put('кредит', o.id, o.borrower));
  state.owner.zl.filter(live).forEach(o=>put('залог', o.id, o.name));
  state.owner.vz.filter(live).forEach(o=>put('взыскание', o.id, o.borrower));
  return out;
}
const CASE_HITS = 8;
function caseSearch(q, picked){
  const s = String(q||'').trim().toLowerCase();
  if(!s) return [];
  return caseCatalog().filter(c=>c.text.toLowerCase().indexOf(s)!==-1 && !(picked||[]).some(x=>x.type===c.type && x.id===c.id)).slice(0, CASE_HITS);
}

/* ---------- карточка: панель поверх очереди со своим адресом ---------- */
let cardOpenId=null, hlCard=null, ruleCard=null, fold={}, cardShown=null;
const hasUrl = ()=>typeof history!=='undefined' && typeof location!=='undefined';
function taskInUrl(){ const m = hasUrl() && /[?&]task=([^&]+)/.exec(location.search||''); return m ? decodeURIComponent(m[1]) : null; }
function moveUrl(how, id){
  if(!hasUrl()) return;

/* карточку открывает тот, кому задание видно: ни адрес, ни старое уведомление этого не обходят */
function cardVisible(id){

function openCard(id){

}
function closeCard(){

function journalRows(t){

/* кнопки карточки: решение и работа; всё с основанием — окно системы, постоянно раскрытых форм нет */
function taskActions(t, v){
  const out = {btns:[], notes:[]};
  if(isTerminal(t)){ out.notes.push('Задание закрыто, действий нет.'); return out; }
  const id = t.id, st = lastEv(t), act = t.action ? actionOf(t.action) : null, mine = canActFor(t, v), owned = ownerExecOf(t);
  const run = (label, call, main, off)=>out.btns.push({label, call:`ZD.ui(()=>${call})`, main:!!main, off:!!off});
  const ask = (label, op, main)=>out.btns.push({label, call:`ZD.ask('${op}','${id}')`, main:!!main, off:false});
  if(inQueue(t)){
    if(queueHolders(t).indexOf(v)!==-1) run('Взять в работу', `ZD.take('${id}', ZD.state.viewer)`, true);
    else if((t.queue.exclude||[]).indexOf(v)!==-1) out.notes.push(t.addr && t.addr.excludeWho ? 'Основание положили вы: задание исполняет другой носитель роли.' : 'Объект ваш: по нему задание рассматривает другой носитель роли.');
    if(canAssignQueue(t, v)) ask('Назначить', 'assign');
    if(!out.btns.length && !out.notes.length) out.notes.push('Задание в очереди роли: взять его может носитель роли.');
    return out;
  }
  if(owned && mine && st!=='поручено') out.notes.push(`Работа делается в карточке дела${act && act.where ? ' — '+act.where : ''}. Задание закроется само, когда работа там будет сделана.`);
  if(st==='поручено' && mine) run('Взять в работу', `ZD.take('${id}', ZD.state.viewer)`, true);
  if((st==='принято' || st==='возвращено') && mine && !owned){
    if(act && act.needsProof) ask('Заявить исполнение', 'proof', true);
    else run('Заявить исполнение', `ZD.claim('${id}', null, ZD.state.viewer)`, true);
  }
  if(st==='ожидает приёмки' && v===t.controller){
    const rule = t.kind==='rule', gone = povodGoneFor(t);
    if(rule) out.notes.push(gone ? 'Работа подтверждена в деле, решение за контролёром.' : 'В деле работа ещё не подтверждена: принять нельзя, только вернуть.');
    run('Принять', `ZD.acceptDecision('${id}', true, '', ZD.state.viewer)`, true, rule && !gone);
    ask('Вернуть', 'giveBack');
  }
  const req = pendingExtension(t);
  if(req && v===approverOf(t)){
    run('Утвердить продление', `ZD.decideExtension('${id}', ZD.state.viewer, true)`, !out.btns.some(b=>b.main));
    ask('Отклонить продление', 'decline');
  }
  if(req && v!==approverOf(t)) out.notes.push(`Запрос продления до ${fmt(req.newDue)} ждёт решения: ${empName(approverOf(t))}.`);
  if(!req && mine && !namedDue(t) && !tplLocked(t)) ask('Запросить продление', 'extend');
  if(chiefMayExtend(t, v)) ask('Продлить срок', 'chiefExtend');
  if(visibleTo(t, v)) ask('Отметка о ходе', 'progress');
  if(assignerMay(t, v)) ask('Вернуть в очередь', 'toQueue');
  if(v!==t.assignee && (v===t.author || chiefChainIncludes(t.assignee, v) || isOverdueChief(t, v) || assignerMay(t, v)) && !(escalateOf(t) && escalateOf(t).reassign===false)){
    if(DOC_NAMED.indexOf(t.originKind)!==-1) out.notes.push('Сменить исполнителя — в карточке документа: «Заменить участника» (автор документа или резолюции, регистратор, архивариус — по роли; держатель «Кто поручил»).');
    else ask('Переназначить', 'reassign');
  }
  if(mine && ((owned && st==='принято' && (kindOf(t.originKind).addrForm==='формула' || t.queue)) || st==='поручено' || ((st==='принято' || st==='возвращено') && !owned))) ask('Отказаться', 'reject');
  const stepOwned = t.esc || (owned && kindOf(t.originKind).genus==='шаг');
  if(v===t.author && stepOwned) out.notes.push('Снять задание нельзя: шаг убирает модуль дела, задание закроется с его причиной.');
  else if(v===t.author) ask('Снять', 'release');
  if(!out.btns.length && !out.notes.length) out.notes.push('Сейчас действий нет.');
  return out;
}
function renderTaskActions(t){

/* что сделано — решающему: заявление, подтверждение, запрос продления, последняя отметка */
function doneForDecision(t, v){
  const own = decisionsOf(t).filter(x=>x.by===v);

  const notes = t.journal.filter(e=>e.ev==='отметка о ходе'), last = notes[notes.length-1], out = [];

    else { const r = pendingExtension(t); out.push(`<div><b>Запрошено продление</b> до ${fmt(r.newDue)}, ${esc(empName(t.assignee))} · основание: ${esc(r.reason)}</div>`); }
  });
  if(last) out.push(`<div><b>Последняя отметка</b> ${fmt(last.t)}: ${esc(last.text)}</div>`);
  return `<div class="card-done" data-done>${out.join('')}</div>`;

/* карточка объекта у владельца — демо соседа: действия делаются там; у источника с шагами задания видят результат сразу после сохранения */
function escText(x){
  return x.to==='уведомление' ? `срок истёк — исполнителю «срок истёк», уведомление: ${x.who}; эскалации руководителю и переназначения нет`
    : `срок истёк — сразу задание очереди «${roleTitle(x.role)}»: «${actionOf(x.action).label}»; эскалации руководителю нет`;
}
function renderOwnerCard(t, p){
  const cfg0 = OWNER_CFG[p.kind];

  if(cfg.src==='ap') return renderAppCard(p);
  if(cfg.src==='doc') return renderDocCard(p.ownerId||p.objectId);
  if(cfg.src==='imo' || cfg.src==='ima' || cfg.src==='imb') return renderImCard(cfg.src, p.ownerId||p.objectId);
  if(cfg.src==='an' || cfg.src==='ant') return renderAnCard(cfg.src, p.ownerId||p.objectId);
  if(cfg.src==='rp') return renderRepCard(p.ownerId||p.objectId);
  if(cfg.src==='cr') return renderCrCard(p.objectId);
  if(cfg.src==='vz') return renderVzCard(p.objectId);
  if(cfg.src==='zl') return renderZlCard(p.ownerId||p.objectId);
  if(cfg.src==='pl') return renderPlCard(p.ownerId||p.objectId);
  if(cfg.src==='zm') return renderZmCard(p.ownerId||p.objectId);
  if(cfg.src==='rs') return renderRsCard(p.ownerId||p.objectId);
  if(cfg.src==='cl') return renderClCard(p.ownerId||p.objectId);
  const o = ownerObj(cfg.src, p.objectId), s = objAt(o, state.today), src = cfg.src;
  if(!s) return '';
  const who = id=>id ? esc(emp(id)?.name) : '—';
  const steps = Object.keys(OWNER_STEPS).filter(k=>OWNER_STEPS[k].from.indexOf(s.status)!==-1 && (OWNER_STEPS[k].who!=='автор' || state.viewer===s.author));
  const btn = k=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.ownerStep('${src}','${o.id}', ZD.state.viewer, '${k}'))">${esc(k[0].toUpperCase()+k.slice(1))}</button>`;
  const gdOpts = state.owner.gd.map(g=>{ const x=objAt(g, state.today); return x ? `<option value="${g.id}">${g.id} · ${esc(x.status)}</option>` : ''; }).join('');

    <div class="kv">
      <div class="k">Наименование</div><div class="v">${esc(o.title)}</div>
      <div class="k">Статус</div><div class="v">${esc(s.status)} <span class="small">с ${fmt(s.statusSince)}</span></div>
      <div class="k">Автор</div><div class="v">${who(s.author)}</div>
      ${src==='gd' ? `<div class="k">Основной документ</div><div class="v">${s.doc?'приложен':'<span class="pill warn">нет</span>'}</div>`
        : `<div class="k">Основание</div><div class="v">${esc(s.base)} · ${esc((ownerAt('gd', s.base, state.today)||{}).status||'—')}</div>
           <div class="k">Дата с · Дата по</div><div class="v">${fmt(s.dateFrom)} — ${s.dateTo?fmt(s.dateTo):'бессрочно'}</div>`}
      <div class="k">Последнее действие</div><div class="v">${esc(s.last.how)} · ${who(s.last.by)} · ${fmt(s.last.t)}</div>

    ${src==='lp' && s.status==='Действует' ? `<div class="form-row" style="margin-top:12px">
      <div class="fld"><label>Новая «Дата по»</label><input type="date" id="lpTo" value="${addDays(s.dateTo||state.today, 180)}"></div>
      <div class="fld"><label>Причина и реквизиты</label><input id="lpWhy"></div>
      <button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.lpExtend('${o.id}', ZD.state.viewer, document.getElementById('lpTo').value, document.getElementById('lpWhy').value.trim()))">Продлить срок</button>
      <div class="fld"><label>Новое основание</label><select id="lpBase">${gdOpts}</select></div>

    </div>` : ''}

}

/* карточка заявки у владельца — демо соседа: действия специалиста, подтверждающего комплект, отдела и комиссии */
function renderAppCard(p){
  const o = ownerObj('ap', p.objectId), d = state.today, s = objAt(o, d);
  const head = `<h3>Карточка заявки ${esc(o.id)} <span class="small">у владельца, демо</span></h3>`;
  if(!s) return `<div class="card">${head}<div class="small">${esc(goneReason(o, d))} — заявки нет.</div></div>`;
  const who = id=>id ? esc(emp(id)?.name) : '—', st = s.status, draft = AP_DRAFT.includes(st);
  const block = programBlock(s.program, d), spec = apSpecOn(s, d);
  const why = `(document.getElementById('apWhy')||{}).value`;
  const b = (step, arg, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.apStep('${o.id}', ZD.state.viewer, '${step}', ${arg||'null'}, ${why}))">${esc(label||step[0].toUpperCase()+step.slice(1))}</button>`;
  const btns = [];
  if(draft && !s.gf) btns.push(b('передать на подтверждение комплекта'));
  if(draft && s.gf==='handed') btns.push(b('подтвердить комплект'));
  if(draft && s.gf==='confirmed') s.depts.filter(k=>!s.concl[k]).forEach(k=>btns.push(b('внести заключение', `'${k}'`, 'Внести заключение: '+AP_DEPTS[k].name)));
  if(draft) btns.push(b('отправить в комиссию'));
  if(st==='На рассмотрении' && s.phase==='prelim'){ btns.push(b('вынести на заседание')); btns.push(b('запросить замену')); }
  if(st==='На рассмотрении' && s.phase==='session'){ btns.push(b('проголосовать')); ['одобрить','отклонить','вернуть'].forEach(x=>btns.push(b(x))); }
  if(st==='Требуется доп. информация') btns.push(b('отклонить за неустранение недостатков'));
  if(st==='На рассмотрении' || st==='Требуется доп. информация') btns.push(b('отозвать'));
  if(st==='Новый') btns.push(b('удалить'));
  if(st==='Одобрена') btns.push(b('сформировать кредит'));
  if(st==='Ожидает решения/программы') btns.push(b('привязать решение и программу', `document.getElementById('apProg').value`));
  if(st==='На оформлении') btns.push(b('зарегистрировать договоры'));
  apExpiredDocs(s, d).forEach(x=>btns.push(b('заменить документ', `'${esc(x.name)}'`, 'Заменить: '+x.name)));
  const lpOpts = state.owner.lp.map(l=>{ const x=objAt(l, d); return x ? `<option value="${l.id}">${l.id} · ${programAccepts(l.id, d)?'принимает заявки':'не принимает'}</option>` : ''; }).join('');
  const session = st==='На рассмотрении' && s.phase==='session';
  const com = s.com ? `${who(s.com.chair)} (председатель); ${s.com.members.map(m=>who(m)+(session && s.votes[m]?' — голос подан':'')).join(', ')}` : '—';
  return `<div class="card">${head}
    <div class="kv">
      <div class="k">Заявитель</div><div class="v">${esc(o.title)}${s.group?` <span class="pill neutral">групповая, ${s.group} чл.</span>`:''}</div>
      <div class="k">Статус</div><div class="v">${esc(st)} <span class="small">с ${fmt(s.statusSince)}</span>${s.phase?` · ${s.phase==='prelim'?'предварительное изучение':'заседание комитета'}`:''}</div>
      <div class="k">Программа</div><div class="v">${esc(s.program)} ${block?`<span class="pill err">не принимает заявки: ${esc(block.why)}</span>`:'<span class="pill ok">принимает заявки</span>'}</div>
      <div class="k">Специалист заявки на ${fmt(d)}</div><div class="v">${spec?who(spec)+(actingFor(spec, d)!==spec?`; действует ${who(actingFor(spec, d))}`:''):'не закреплён'}</div>
      <div class="k">Комплект</div><div class="v">${s.gf==='confirmed'?'подтверждён':s.gf==='handed'?'на подтверждении':'у специалиста'}</div>
      <div class="k">Заключения отделов</div><div class="v">${s.depts.map(k=>AP_DEPTS[k].name+': '+(s.concl[k]?'внесено':'ждёт')).join('; ')}</div>
      <div class="k">Комиссия</div><div class="v">${com}${session?`<div class="small">крайний срок голосования ${fmt(s.deadline)} · заседание ${fmt(s.session)} · кворум ${quorumOf(s)}</div>`:''}</div>
      ${apExpiredDocs(s, d).length?`<div class="k">Просрочены документы</div><div class="v">${esc(apExpiredDocs(s, d).map(x=>x.name+' (до '+fmt(x.validTo)+')').join('; '))}</div>`:''}
      <div class="k">Последнее действие</div><div class="v">${esc(s.last.how)} · ${who(s.last.by)} · ${fmt(s.last.t)}</div>
    </div>
    ${AP_FINAL.includes(st) ? '' : `<div class="form-row" style="margin-top:12px">
      <div class="fld"><label>Программа</label><select id="apProg">${lpOpts}</select></div>
      <div class="fld"><label>Причина</label><input id="apWhy"></div>
      ${b('сменить программу', `document.getElementById('apProg').value`)}
    </div>`}
    <div class="btn-row">${btns.join('')}</div>
    <div class="small">Сохранённое здесь задания сверяют сразу: сбой опроса сохранение не ломает, ночной прогон — страховка.</div></div>`;
}

/* карточка документа у владельца — демо соседа: сводка исполнения выводится, действующий срок читается у заданий */
function renderDocCard(id){
  const o = ownerObj('doc', id), d = state.today, s = docAt(o, d);
  const head = `<h3>Карточка документа ${esc(o.id)} <span class="small">у владельца, демо</span></h3>`;
  if(!s) return `<div class="card">${head}<div class="small">${esc(goneReason(o, d))} — документа нет.</div></div>`;
  const who = x=>x ? esc(emp(x)?.name) : '—', st = s.stage;
  const why = `(document.getElementById('docWhy')||{}).value`;
  const b = (step, arg, label)=>`<button class="btn btn-secondary btn-sm" onclick="ZD.ui(()=>ZD.docStep('${o.id}', ZD.state.viewer, '${step}', ${arg||'null'}, ${why}))">${esc(label||step[0].toUpperCase()+step.slice(1))}</button>`;
  const resArg = `{resp:document.getElementById('docResp').value, due:document.getElementById('docDue').value, text:${why}, parent:document.getElementById('docParent').value||null}`;
  const res = Object.values(s.res), btns = [];
  res.filter(r=>r.state==='open').forEach(r=>{ btns.push(b('отозвать резолюцию', `'${r.id}'`, 'Отозвать резолюцию: '+r.id));
    r.co.forEach(c=>btns.push(b('убрать соисполнителя', `{res:'${r.id}', who:'${c}'}`, `Убрать соисполнителя: ${emp(c)?.name||c} (${r.id})`))); });
  const parts = docParticipants(s);
  const repArg = `Object.assign({}, ZD.docParticipants(ZD.ownerAt('doc','${o.id}',ZD.state.today))[+document.getElementById('docRepFrom').value], {to:document.getElementById('docRepTo').value})`;
  if(st==='Черновик'){ btns.push(b('на согласование', null, s.approvers.length ? 'На согласование' : 'На подпись')); btns.push(b('удалить')); }
  if(st==='Согласование'){ btns.push(b('согласовать')); btns.push(b('отказать')); }
  if(st==='Подпись' && !s.signed){ btns.push(b('подписать')); btns.push(b('отказать')); }
  if(st==='Подпись' && s.signed) btns.push(b('зарегистрировать'));
  if(st==='Зарегистрирован' && s.kind==='исх') s.addressees.forEach((n,i)=>{ if(!s.sent[n]) btns.push(b('отметить отправку',
    `ZD.ownerAt('doc','${o.id}',ZD.state.today).addressees[${i}]`, 'Отправлено: '+n)); });
  if(st==='Зарегистрирован' && s.kind!=='исх') btns.push(b('к сведению'));
  res.filter(r=>r.state==='open').forEach(r=>{ btns.push(b('исполнено', `'${r.id}'`, 'Исполнено: '+r.id)); btns.push(b('отказать в исполнении', `'${r.id}'`, 'Отказать в исполнении: '+r.id)); });
  res.filter(r=>r.state==='control').forEach(r=>{ btns.push(b('подтвердить', `'${r.id}'`, 'Подтвердить: '+r.id)); btns.push(b('вернуть', `'${r.id}'`, 'Вернуть: '+r.id)); });
  if(s.recipients.some(r=>r.mode==='ознакомление') && DOC_LIVE.includes(st)) btns.push(b('ознакомлен'));
  if(st==='Зарегистрирован'){ btns.push(b('сдать в дело')); btns.push(b('аннулировать')); }
  Object.values(s.issues).filter(i=>!i.returned).forEach(i=>btns.push(b('оригинал возвращён', `'${i.id}'`, 'Возвращён оригинал: '+i.id)));
  const acq = s.recipients.filter(r=>r.mode==='ознакомление');
  const resRows = res.map(r=>{ const k = stepByKey(resKey(r, r.resp)), due = k ? k.setDue : r.due, done = r.closedEv && r.closedEv.t;
    return `<tr><td>${esc(r.id)}${r.parent?` <span class="small">ниже ${esc(r.parent)}</span>`:''}</td><td>${who(r.author)}</td><td>${who(r.resp)}${r.co.length?`<div class="small">соисп.: ${r.co.map(who).join(', ')}</div>`:''}</td>
      <td>${fmt(r.due)}</td><td>${fmt(due)}${k && k.extensions?' <span class="small">(продлён)</span>':''}</td>

  return `<div class="card">${head}
    <div class="kv">

      <div class="k">Этап</div><div class="v">${esc(st)} <span class="small">с ${fmt(s.stageSince)}</span>${st==='Подпись' && s.signed ? ' · <span class="pill ok">подписан</span>' : ''}</div>
      <div class="k">Автор</div><div class="v">${who(s.author)}</div>
      ${s.approvers.length ? `<div class="k">Согласующие · круг ${s.round}</div><div class="v">${s.approvers.map(a=>who(a)+(s.approved[a]?' — согласовал':'')).join('; ')}</div>` : ''}
      ${s.signer ? `<div class="k">Подписант</div><div class="v">${who(s.signer)}${signerOn(s.signer, d)!==s.signer ? ` · подписывает ${who(signerOn(s.signer, d))} по приказу с правом подписи` : ''}</div>` : ''}
      ${s.addressees.length ? `<div class="k">Отправка</div><div class="v">отправлено ${Object.keys(s.sent).length}/${s.addressees.length}</div>` : ''}

      ${acq.length ? `<div class="k">Ознакомление</div><div class="v">ознакомлены ${acq.filter(r=>s.acq[r.emp]).length}/${acq.length}${acq.some(r=>!s.acq[r.emp]) ? ' · нет: '+acq.filter(r=>!s.acq[r.emp]).map(r=>who(r.emp)).join(', ') : ''}</div>` : ''}
      ${s.control ? `<div class="k">На контроле</div><div class="v">${who(s.control)}</div>` : ''}
      ${Object.values(s.issues).length ? `<div class="k">Выдача оригинала</div><div class="v">${Object.values(s.issues).map(i=>`${esc(i.id)}: ${who(i.to)} до ${fmt(i.until)}${i.returned?' — возвращён '+fmt(i.returned.t):''}`).join('; ')}</div>` : ''}
      <div class="k">Последнее действие</div><div class="v">${esc(s.last.how)} · ${who(s.last.by)}${s.last.for?' за '+who(s.last.for):''} · ${fmt(s.last.t)}</div>
    </div>
    ${res.length ? `<table class="cgrid"><thead><tr><th>Резолюция</th><th>Автор</th><th>Ответственный</th><th>Срок резолюции</th><th>Действующий срок (из заданий)</th><th>Исход</th></tr></thead><tbody>${resRows}</tbody></table>` : ''}

/* ввод вида в действие и рубильник надзора и сигнала — администратор заданий, с основанием */
const switchable = k=>k.genus==='надзор' || k.genus==='сигнал';
function activeOn(k, d){ return !!k.activatedAt && k.activatedAt<=d && !(k.retiredAt && k.retiredAt<=d); }
function activateKind(kindId, by, basis){
  const k = kindOf(kindId);
  if(!isTasksAdmin(by)) throw new Error('вводит в действие администратор заданий');
  if(k.genus==='подсветка') throw new Error('подсветка становится заданием или сигналом только выпуском');
  if(!basis) throw new Error('нужно основание ввода в действие');
  if(activeOn(k, state.today)) throw new Error('вид уже в действии');
  if(k.retiredAt && k.retiredAt<=state.today) throw new Error('вид выведен выпуском — вернуть его может только выпуск');
  if(k.off && !switchable(k)) throw new Error(`вид рода «${k.genus}» после выключения возвращает только выпуск`);
  k.activatedAt = state.today; k.off = null;
  k.switches.push({t:state.today, ev:'введён в действие', by, basis});
  return k;
}
function deactivateKind(kindId, by, basis){ // поводы вида отпускаются, открытые задания закрываются
  const k = kindOf(kindId);
  if(!isTasksAdmin(by)) throw new Error('выключает администратор заданий');
  if(!switchable(k)) throw new Error(`вид рода «${k.genus}» выключается только выпуском`);
  if(!basis) throw new Error('нужно основание выключения');
  if(!activeOn(k, state.today)) throw new Error('вид не в действии');
  k.activatedAt = null; k.off = {t:state.today, by, basis};
  k.switches.push({t:state.today, ev:'выключен', by, basis});
  state.tasks.filter(t=>t.originKind===kindId && !isTerminal(t)).forEach(t=>{
    log(t,'закрыто',{outcome:'снято', reason:'вид выключен: '+basis, by}); notify(t,'закрыто');
  });
  return k;
}

const READ_HOW = {'клик':'кликом', 'все':'«Прочитать все»', 'задание закрыто':'задание закрыто'};
/* вкладка очереди, где задание у зрителя; закрытое — ещё и отбор, в котором оно есть */
const TAB_OF_BUCKET = {mine:'work', role:'work', wait:'work', decide:'decide', sub:'sub', unassigned:'sub', gave:'gave', closed:'closed', 'closed-more':'closed'};
function tabForTask(t, v){
  const b = bucketOf(t, v);
  if(b==='closed' || b==='closed-more'){ const f = closedFilters(v).find(x=>x.tasks.indexOf(t)!==-1); if(f) state.closedFilter = f.id; }
  return TAB_OF_BUCKET[b] || 'work';
}
/* одна строка сообщения: задание — на своей вкладке очереди, сигнал — карточка объекта; прав нет — запись остаётся, открывать нечего. Со страницы панель открывается поверх неё: закрытие вернёт к той же строке */
function openNotifItem(n, i){
  const item = n.items[i];
  if(n.kind==='сигнал'){
    if(state.view!=='notifs'){ state.view = 'queue'; state.qTab = 'work'; }
    openHighlight(n.originKind, item.key);
    return true;
  }
  const t = taskOf(item.taskId);
  if(!t || !bucketOf(t, state.viewer)){ toast(`У вас нет доступа к заданию ${item.taskId}`, 'err'); return false; }
  if(state.view!=='notifs'){ state.view = 'queue'; state.qTab = tabForTask(t, state.viewer); }
  openCard(item.taskId);
  return true;
}
/* клик читает сообщение. Одиночное открывает своё сразу, сводка — панель-перечень; у «переадресовано» ссылки нет, клик только читает; открытие панели колокольчика статус не меняет */
let digestCard = null, digestFrom = null;
function notifGo(id, i){
  const n = noteById(id);
  if(!n) return;
  markRead(n, 'клик');
  if(!hasNotifLink(n)){ render(); return; }
  bellOpen = false;
  digestFrom = null;
  if(i===undefined && n.items.length>1){ closeCard(); digestCard = n.id; renderCardDrawer(); render(); return; }
  openNotifItem(n, i||0);
  render();
}
/* строка перечня: своё задание или объект; панель-перечень остаётся открытой, если открыть нельзя */
function notifItem(id, i){
  const n = noteById(id);
  if(n && openNotifItem(n, i)){ digestFrom = id; renderCardDrawer(); render(); }
}
function notifBack(){ const id = digestFrom; closeCard(); digestCard = id; renderCardDrawer(); }
const digestBack = ()=>digestFrom ? '<button class="linky" onclick="ZD.notifBack()">← К перечню</button>' : '';
function renderDigestPanel(id){
  const n = noteById(id);
  if(!n) return '';
  const sig = n.kind==='сигнал';
  const rows = n.items.map((x, i)=>{
    const open = l=>`<button class="linky" onclick="ZD.notifItem('${n.id}', ${i})">${esc(l)}</button>`;
    if(sig) return `<tr data-i="${i}"><td>${open((povodByKey(x.key)||{}).objectId||'открыть')}</td><td>${esc(x.text)}</td></tr>`;
    const t = taskOf(x.taskId);
    return `<tr data-i="${i}"><td>${open(x.taskId)}</td><td>${esc(whatToDo(t))}</td><td>${fmt(dueOf(t))}</td><td>${esc(displayState(t))}</td></tr>`;
  }).join('');
  const head = sig ? '<th>Объект</th><th>Что случилось</th>' : '<th>Задание</th><th>Что сделать</th><th>Срок</th><th>Состояние</th>';
  return `<div class="drawer-mask" onclick="ZD.closeCard()"></div>
    <div class="drawer" data-digest="${n.id}">
      <div class="drawer-h"><h3>${esc(sig ? `${n.text}: ${n.count}` : notifText(n))}</h3><button class="drawer-x" title="Закрыть" onclick="ZD.closeCard()">×</button></div>
      <div class="drawer-b"><table class="cgrid"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}
function notifReadAll(){ state.notifications.filter(n=>n.to===state.viewer).forEach(n=>markRead(n, 'все')); render(); }
function openAllNotif(){ bellOpen = false; state.view = 'notifs'; render(); }
function renderBell(){
  const v = state.viewer, n = unreadOf(v), last = notifsOf(v).slice(0, BELL_LAST);
  const btn = `<button class="bell" title="Уведомления" onclick="ZD.bellToggle()">${BELL_ICON}${n ? `<span class="bell-n">${n}</span>` : ''}</button>`;
  if(!bellOpen) return btn;
  return `${btn}<div class="bell-mask" onclick="ZD.bellToggle(false)"></div>
    <div class="bell-panel" data-bell>
      <div class="bell-h"><b>Уведомления</b>${n ? `<span class="small">непрочитанных ${n}</span><button class="linky" onclick="ZD.notifReadAll()">Прочитать все</button>` : ''}</div>
      <div class="bell-list">${last.map(x=>`<button class="bell-row${x.read ? '' : ' new'}" data-n="${x.id}" onclick="ZD.notifGo('${x.id}')"><span class="dot"></span><span class="txt">${esc(notifText(x))}</span><span class="small bell-when">${fmt(x.t)}${x.readHow==='задание закрыто' ? '<br>задание закрыто' : ''}</span></button>`).join('') || '<div class="small" style="padding:12px 14px">Уведомлений нет</div>'}</div>
      <div class="bell-f"><button class="linky" onclick="ZD.openAllNotif()">Все уведомления</button></div>
    </div>`;
}
function notifLinks(n){
  if(!hasNotifLink(n)) return '';
  const pre = n.kind==='сигнал' ? '<span class="small">без задания</span> ' : '';
  if(n.items.length>1) return `${pre}<button class="linky" onclick="ZD.notifGo('${n.id}')">Перечень (${n.items.length})</button>`;
  const x = n.items[0], label = n.kind==='сигнал' ? (povodByKey(x.key)||{}).objectId||'открыть' : x.taskId;
  return `${pre}<button class="linky" onclick="ZD.notifGo('${n.id}', 0)">${esc(label)}</button>`;
}
/* страница «Все уведомления»: отбор сверху, новые первыми, по 50 на листе; сообщения не удаляются */
const NOTIF_PAGE = 50;
function setNotifFilter(f, v, inputId){ state.nfPage = 1; setFilter(f, v, inputId); }
function setNotifPage(p){ state.nfPage = p; render(); if(typeof document!=='undefined'){ const c = document.querySelector('.content'); if(c) c.scrollTop = 0; } }
function notifsFiltered(v){
  const q = String(state.nfQ||'').trim().toLowerCase();
  const hay = n=>`${notifText(n)} ${n.items.map(i=>i.taskId ? `${i.taskId} ${whatToDo(taskOf(i.taskId))}` : i.text).join(' ')}`.toLowerCase();
  return notifsOf(v).filter(n=>(!state.nfOnly || !n.read) && (!state.nfSrc || n.source===state.nfSrc) && (!state.nfFrom || n.t>=state.nfFrom) && (!state.nfTo || n.t<=state.nfTo) && (!q || hay(n).indexOf(q)!==-1));
}
function renderNotifPage(){
  const v = state.viewer, n = unreadOf(v), all = notifsOf(v), list = notifsFiltered(v);
  const pages = Math.max(1, Math.ceil(list.length/NOTIF_PAGE)), page = Math.min(state.nfPage||1, pages), from = (page-1)*NOTIF_PAGE, rows = list.slice(from, from+NOTIF_PAGE);
  const srcs = [...new Set(all.map(x=>x.source).concat(state.nfSrc ? [state.nfSrc] : []))], date =(f, l)=>`<label>${l} <input class="nf-date" type="date" value="${esc(state[f])}" onchange="ZD.setNotifFilter('${f}', this.value)"></label>`;
  const status = x=>x.read ? `<span class="pill neutral">прочитано</span>${x.readHow ? `<div class="small">${esc(READ_HOW[x.readHow])}</div>` : ''}` : '<span class="pill info">не прочитано</span>';
  const sifted = state.nfOnly || state.nfSrc || state.nfFrom || state.nfTo || String(state.nfQ||'').trim();
  return `<div class="q-tools">
      <label><input type="checkbox"${state.nfOnly ? ' checked' : ''} onchange="ZD.setNotifFilter('nfOnly', this.checked)"> только непрочитанные</label>
      <label>Откуда <select onchange="ZD.setNotifFilter('nfSrc', this.value)"><option value="">все</option>${srcs.map(s=>`<option value="${esc(s)}"${s===state.nfSrc ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
      ${date('nfFrom', 'С')}${date('nfTo', 'по')}
      <input type="search" id="nfQ" placeholder="Поиск по тексту и номеру задания" value="${esc(state.nfQ)}" oninput="ZD.setNotifFilter('nfQ', this.value, 'nfQ')">
      <span class="small push">Всего ${list.length}, непрочитанных ${list.filter(x=>!x.read).length}</span>${n ?'<button class="btn btn-secondary btn-sm" onclick="ZD.notifReadAll()">Прочитать все</button>' : ''}</div>
    <table class="cgrid"><thead><tr><th>Статус</th><th>Дата</th><th>Откуда</th><th>Сообщение</th><th>Ссылка</th></tr></thead>
    <tbody>${rows.map(x=>`<tr class="${x.read ? '' : 'unread'}" data-n="${x.id}"><td>${status(x)}</td><td>${fmt(x.t)}</td><td>${esc(x.source)}</td><td>${esc(notifText(x))}</td><td>${notifLinks(x)}</td></tr>`).join('') || `<tr><td colspan="5" class="muted">${sifted ? 'По этому отбору сообщений нет' : 'Уведомлений нет'}</td></tr>`}</tbody></table>
    ${pages>1 ? `<div class="q-tools pager"><span class="small">${from+1}–${from+rows.length} из ${list.length}</span><button class="btn btn-secondary btn-sm"${page<=1 ? ' disabled' : ''} onclick="ZD.setNotifPage(${page-1})">Назад</button><span class="small">Лист ${page} из ${pages}</span><button class="btn btn-secondary btn-sm"${page>=pages ? ' disabled' : ''} onclick="ZD.setNotifPage(${page+1})">Вперёд</button></div>` : ''}`;
}

/* ---------- окошко: правый нижний угол, на 8 секунд, при каждом сообщении зрителю ---------- */
const POP_MS = 8000, POP_MAX = 3;
let pops = [], popSeen = 0, popMute = false;
/* вошёл в систему: всё накопленное — только счётчик */
function popReset(){ pops = []; if(state) popSeen = state.notifications.length; paintPops(); }
/* прогон и пакетное действие показывают итог, поэтому сводка — одно окошко. Форму окошко не трогает: рисуется отдельно, фокус не берёт */
function popFlush(){
  if(popMute || !state || state.digest) return;
  const fresh = state.notifications.slice(popSeen).filter(n=>n.to===state.viewer && !n.read); // задание закрылось в том же прогоне — сообщение уже прочитано, окошка нет
  popSeen = state.notifications.length;
  if(!fresh.length) return;
  fresh.forEach(n=>{ const p = {id:n.id}; pops.push(p); setTimeout(()=>popDrop(p), POP_MS); });
  paintPops();
  if(typeof document!=='undefined'){ const b = document.getElementById('bell'); if(b) b.innerHTML = renderBell(); }
}
function popDrop(p){ const i = pops.indexOf(p); if(i===-1) return; pops.splice(i, 1); paintPops(); }
function renderPops(){
  const shown = pops.slice(-POP_MAX).reverse(), more = pops.length-shown.length;
  return shown.map(p=>{ const n = noteById(p.id); return n ? `<div class="npop" data-pop="${n.id}"><div class="npop-h"><span class="small">${esc(n.source)} · ${fmt(n.t)}</span><button class="drawer-x" title="Закрыть" onclick="ZD.popClose('${n.id}')">×</button></div><div class="npop-t">${esc(notifText(n))}</div>${hasNotifLink(n) ? `<button class="btn btn-secondary btn-sm" onclick="ZD.popOpen('${n.id}')">Открыть</button>` : ''}</div>` : ''; }).join('') + (more>0 ? `<button class="npop-more linky" onclick="ZD.popMore()">и ещё ${more}</button>` : '');
}
function paintPops(){ if(typeof document==='undefined') return; const h = document.getElementById('notifPops'); if(h) h.innerHTML = renderPops(); }
function popClose(id){ pops = pops.filter(p=>p.id!==id); paintPops(); }
/* «Открыть» — то же, что клик по сообщению. Открытая форма важнее: окошко не уводит с неё */
function popBusy(){ if(!dlg) return false; toast('Сначала завершите или закройте форму'); return true; }
function popOpen(id){ if(popBusy()) return; popClose(id); notifGo(id); }
function popMore(){ if(popBusy()) return; if(cardOpenId || hlCard || ruleCard || digestCard) closeCard(); bellToggle(true); }

function init(){
  if(typeof document==='undefined') return;
  goToDate(STAND_OPEN);
  openFromUrl();
  window.addEventListener('popstate', syncFromUrl);
}
if(typeof document!=='undefined') document.addEventListener('DOMContentLoaded', init);

  setRunsTab, toggleRun, togglePovod, povodRows, povodStats, povodStateOf, deliveryRows, goSettings, renderDelivery, empName, notifLinks,
  queueStep2Open, tplDue, tplLocked, assignerMay, returnToQueue, docRejectTo, resDueFor, issueRuleTask, addWorkdays, workdaysBetween, isWork, calNote, SOURCES, get SILENT_NIGHTS(){ return thrOn('zd.silentNights'); }, POLL_SCOPES, ZD_THR, editSelfThr, zdThr, postHolderAt, authorPostOf, authorTitle, ORG_HEAD_VACANT, isOverdueChief, overdueTaskOf, queueAssigners, orgAttrib, queueStepOf, abolishedOn, extendByChief, overdueChiefOf, chiefMayExtend, fallbackAddressee, authorOn, CURATION,
  SELF_KINDS, NOTIF_KINDS, HIGHLIGHT_KINDS, SIGNAL_KINDS, GENERA,

  renderCard, cardFold, noCasePage, syncFromUrl, openFromUrl, taskActions, journalRows, whyOf, stateWords, JOURNAL_WORDS, closerOf, ownerExecOf, principalsOn, get cardId(){ return cardOpenId; }, get highlightCard(){ return hlCard; },
  get dialog(){ return dlg; }, renderDialog, ask, dialogSet, dialogCheck, dialogSubmit, dialogCancel, dialogCaseQ, dialogCaseAdd, dialogCaseDel, caseCatalog, caseSearch,
  renderBell, bellToggle, notifGo, notifItem, notifBack, notifReadAll, openAllNotif, notifsOf, unreadOf, renderNotifPage, notifText, editNotif, askNotif, NOTIF_SPEC, BELL_LAST,
  renderDigestPanel, get digestCard(){ return digestCard; }, get digestFrom(){ return digestFrom; }, setNotifFilter, setNotifPage, notifsFiltered, NOTIF_PAGE,
