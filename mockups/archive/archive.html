<title>Архив папок · АСУБК</title>
<!--
  АСУБК · модуль «Архив папок» · исполняемый макет TO-BE.
  Источник истины — mockups/archive/ASUBK-arhiv-logika.md (канон), план — ASUBK-arhiv-plan.md,
  язык — CONTEXT.md, раздел «Архив». Модуль отвечает на вопрос «где сейчас физическая папка и у кого»:
  место в архиве Холдинга, кто взял, когда взял, когда вернуть.

  Разделы (меню «Архив папок»): Очередь архивариуса · Папки · Мои папки · Заёмщики без КЗД ·
  Журнал движения · Справочники. Карточка папки — панель справа поверх списка, адрес #/folder/<номер>.

  Слои скрипта: даты → справочники → seed → ДВИЖОК (состояние папки, очередь, бронь, сроки) →
  операции (действия с проверкой прав и правил) → экраны.
  Состояние папки не хранится полем: оно выводится из выдачи, брони и списания.
  Демо-набор собирается теми же действиями движка, что и в работе, — по датам, с ходом часов.

  Дата макета заморожена (TODAY). Часы двигает только смоук (AX.setToday). Рабочие дни — по
  своему списку праздников (CAL_FIXED, CAL_YEAR).
  Задание «Вернуть папку» и уведомления — чужие модули; здесь они только показаны в «Моих папках».

  Вход для смоука — window.AX. Действия принимают явные аргументы и возвращают {ok, why}:
  запрет живёт в движке, кнопка лишь показывает его и причину.
-->

/* =====================================================================

const AX = {};

/* ------------------------------ даты -------------------------------- */
const D        = s => new Date(s + 'T00:00:00Z');
const isoOf    = dt => dt.toISOString().slice(0, 10);
const addDays  = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); };
const days     = (a, b) => Math.round((D(b) - D(a)) / 864e5);

const CAL_FIXED = ['01-01', '01-07', '02-23', '03-08', '03-21', '04-07', '05-01', '05-05', '05-09', '08-31', '11-07', '11-08'];
const CAL_YEAR  = { 2026: ['2026-03-20', '2026-03-23', '2026-05-27', '2026-11-09'], 2027: ['2027-03-22', '2027-05-17'] };
const isWork   = s => { if (CAL_FIXED.includes(s.slice(5))) return false; if ((CAL_YEAR[+s.slice(0, 4)] || []).includes(s)) return false; const w = D(s).getUTCDay(); return w !== 0 && w !== 6; };
const addWork  = (s, n) => { let c = s, k = 0; while (k < n) { c = addDays(c, 1); if (isWork(c)) k++; } return c; };
/* Сколько рабочих дней после a по b включительно (0, если b не позже a). */
const workBetween = (a, b) => { let n = 0, c = a; while (c < b) { c = addDays(c, 1); if (isWork(c)) n++; } return n; };
/* Даты в интерфейсе — ДД.ММ.ГГГГ; внутри — ISO. Возвращает ISO, '' для пустого, null для неверной даты. */
function toIso(s) {
  s = String(s == null ? '' : s).trim(); if (!s) return '';
  let m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s), iso = null;
  if (m) iso = m[3] + '-' + m[2] + '-' + m[1]; else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) iso = s;
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00Z'); return !isNaN(d) && d.toISOString().slice(0, 10) === iso ? iso : null;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ============================ ДВИЖОК =============================== */
/* Состояние папки не хранится: выводится из списания, открытой выдачи (и передачи в ней) и брони. */
const openIssue   = fid => ISSUES.find(i => i.folder === fid && !i.end);
const pendingTr   = iss => iss ? iss.transfers.find(t => t.st === 'pending') || null : null;
const pendingExt  = iss => iss ? EXTS.find(x => x.issue === iss.id && x.st === 'pending') || null : null;
const activeReqs  = fid => REQS.filter(r => r.folder === fid && (r.st === 'queue' || r.st === 'reserved')).sort((a, b) => a.n - b.n);
const reservedReq = fid => REQS.find(r => r.folder === fid && r.st === 'reserved') || null;
const reqOf       = rid => REQS.find(r => r.id === rid);
const posOf       = r => activeReqs(r.folder).indexOf(r) + 1;
function stateOf(fid) {
  const f = folder(fid); if (f.gone) return 'gone';
  const i = openIssue(fid); if (i) return pendingTr(i) ? 'transfer' : 'out';
  return reservedReq(fid) ? 'reserved' : 'archive';
}
const ST = { archive: 'в архиве', reserved: 'забронирована', out: 'на руках', transfer: 'передаётся', gone: 'выбыла' };
const isOver   = fid => { const i = openIssue(fid); return !!i && S.today > i.due; };
const overDays = fid => { const i = openIssue(fid); return i && S.today > i.due ? workBetween(i.due, S.today) : 0; };
const posText  = r => r.st === 'reserved' ? `бронь до ${fmt(r.until)}` : `№ ${posOf(r)} в очереди`;
const REQ_ST = { queue: 'в очереди', reserved: 'забронирован', issued: 'выдан', refused: 'отказан', withdrawn: 'отозван', notTaken: 'не забран', closedTransfer: 'закрыт передачей', closedGone: 'закрыт: папка выбыла' };

/* Событие истории и уведомление (эмуляция модуля «Уведомления»: семь видов). */
function ev(fid, kind, by, data = {}) { const e = Object.assign({ id: nid('e'), folder: fid, kind, by: by || null, d: S.today, n: ++S.n }, data); EVENTS.push(e); return e; }
const NOTE_KIND = { remind: 'Скоро вернуть папку', issued: 'Вам выдана папка', free: 'Папка свободна, заберите до …', closed: 'Запрос закрыт',
  ext: 'Решение по продлению', transfer: 'Передача папки', accepted: 'Папка принята в архив' };
function note(to, kind, fid, text) { if (!to) return; NOTES.push({ id: nid('n'), to, kind, folder: fid, text, d: S.today, n: ++S.n }); }

/* Бронь: папка свободна для первого в очереди → бронь на срок брони + «папка свободна, заберите до …». Ставит система, без одобрения. */
function reserveNext(fid) {
  const f = folder(fid); if (f.gone || openIssue(fid) || reservedReq(fid)) return null;
  const r = activeReqs(fid)[0]; if (!r) return null;
  r.st = 'reserved'; r.until = addWork(S.today, SETTINGS.holdDays.v); r.resAt = S.today;
  ev(fid, 'reserved', null, { req: r.id, who: r.who, until: r.until });
  note(r.who, 'free', fid, `Папка ${fnoT(f)} свободна, заберите до ${fmt(r.until)}`);
  return r;
}
/* Напоминание держателю за N р.д. до срока, один раз на каждый срок. День напоминания считается,
   когда срок назначен (выдача, продление): новое значение настройки на назначенные сроки не влияет. */
const workBefore = (s, n) => { let c = s, k = 0; while (k < n) { c = addDays(c, -1); if (isWork(c)) k++; } return c; };
function remind(i) {
  if (i.end || S.today > i.due || i.reminded === i.due) return;
  if (i.remindFor !== i.due) { i.remindFor = i.due; i.remindAt = workBefore(i.due, SETTINGS.remindDays.v); }
  if (S.today >= i.remindAt && (isWork(S.today) || S.today === i.due)) { i.reminded = i.due; note(i.holder, 'remind', i.folder, `Вернуть папку ${fnoT(folder(i.folder))} до ${fmt(i.due)}`); }
}
/* Ход часов по дням: истёкшие брони → «не забран» и бронь следующему; напоминания. */
function tick() {
  REQS.filter(r => r.st === 'reserved' && r.until < S.today).forEach(r => {
    r.st = 'notTaken'; r.end = S.today; ev(r.folder, 'reqNotTaken', null, { req: r.id, who: r.who, until: r.until });
    note(r.who, 'closed', r.folder, `Запрос закрыт: не забран — бронь до ${fmt(r.until)} истекла · ${fnoT(folder(r.folder))}`);
    reserveNext(r.folder);
  });
  ISSUES.filter(i => !i.end).forEach(remind);
}
function setToday(d) {
  const iso = toIso(d); if (!iso) return no('неверная дата');
  if (iso < S.today) return no('часы назад не идут');
  while (S.today < iso) { S.today = addDays(S.today, 1); tick(); }
  render(); return yes({ today: S.today });
}
const advance = n => setToday(addWork(S.today, n));

/* Задание «Вернуть папку» (эмуляция «Заданий»): держателю на следующий день после срока; при незавершённой передаче
   держатель — передающий; не исполнено ESC_AFTER р.д. или держатель уволен — поднимается к руководителю.
   Закрывается само: возврат, передача (у нового держателя — своё задание), продление, списание. */
function tasks() {
  return ISSUES.filter(i => !i.end && S.today > i.due).map(i => {
    const fired = isFired(i.holder), d = workBetween(i.due, S.today), up = fired || d > ESC_AFTER;
    return { issue: i.id, folder: i.folder, holder: i.holder, since: addDays(i.due, 1), days: d, fired, up, head: emp(i.holder).head };
  });
}
const tasksOf = u => tasks().filter(t => t.holder === u || (t.up && t.head === u));

/* --------------------- проверки прав и состояния --------------------- */
/* Одна проверка на кнопку и на действие: запрет живёт здесь, кнопка лишь показывает его причину. */
/* Уволенному не продлевают: срок держит тот, кто вернёт папку, а его нет. */
const FIRED_EXT = 'держатель уволен — продлевать некому: примите возврат или спишите';
const ARCH_ACTS = ['accept', 'issue', 'unreserve', 'refuse', 'return', 'extend', 'decideExt', 'move', 'nextVol', 'rebind', 'label', 'writeoff', 'restore', 'dict', 'settings'];
function returnWhy(fid) {
  const st = stateOf(fid);
  return st === 'archive' ? 'в архиве — возвращать нечего' : st === 'reserved' ? 'в архиве (забронирована) — возвращать нечего' : st === 'gone' ? 'выбыла — возвращать нечего' : '';
}
function gate(act, fid, u = S.user) {
  if (ARCH_ACTS.includes(act) && !isArch(u)) return no('только архивариус');
  const f = folder(fid); if (!f) return no('папка не найдена');
  const st = stateOf(fid), i = openIssue(fid), t = pendingTr(i), k = kindOf(f.kind);
  switch (act) {
    case 'issue': return st === 'gone' ? no('папка выбыла') : i ? no(`на руках у ${emp(i.holder).gen} — сначала принять возврат`) : yes();
    case 'unreserve': return st === 'reserved' ? yes() : no('брони нет');
    case 'return': { const w = returnWhy(fid); return w ? no(w) : yes(); }
    case 'extend': return !i ? no('папка не на руках — продлевать нечего') : isFired(i.holder) ? no(FIRED_EXT) : pendingExt(i) ? no('на решении просьба держателя — решите её в блоке «Просьба продлить»') : yes();
    case 'move': return st === 'gone' ? no('папка выбыла — перемещать нечего') : yes();
    case 'nextVol': return st === 'gone' ? no('папка выбыла') : k.retired ? no(`вид «${k.name}» выведен из употребления — новые тома не принимаются`) : yes();
    case 'rebind': return st === 'gone' ? no('папка выбыла') : !k.bind ? no(`у вида «${k.name}» нет привязки к заёмщику`) : yes();
    case 'label': return st === 'gone' ? no('папка выбыла — ярлык не нужен') : yes();
    case 'writeoff': return st === 'gone' ? no('папка уже выбыла') : yes();
    case 'restore': return st !== 'gone' ? no('папка не выбыла') : f.gone.reason !== 'утрачена' ? no(`восстановить можно только утраченную; эта ${f.gone.reason}`) : yes();
    case 'request': {
      if (!isActive(u)) return no('запрашивает действующий сотрудник');
      if (st === 'gone') return no('папка выбыла — запросить нельзя');
      const m = activeReqs(fid).find(r => r.who === u); if (m) return no(`у вас уже есть запрос на эту папку (${posText(m)})`);
      if (i && i.holder === u) return no('папка у вас на руках');
      if (t && t.to === u) return no('папку передают вам — подтвердите «Получил»');
      return yes();
    }
    case 'withdraw': return activeReqs(fid).some(r => r.who === u) ? yes() : no('у вас нет запроса на эту папку');
    case 'askExt': return !i ? no('папка не на руках') : i.holder !== u ? no('попросить продление может только держатель') : pendingExt(i) ? no('просьба уже на решении у архивариуса') : yes();
    case 'transfer': return !i ? no('папка не на руках') : i.holder !== u ? no('передать может только держатель') : t ? no('передача уже ждёт «Получил»') : yes();
    case 'cancelTr': return !t ? no('передачи нет') : t.from !== u ? no('отменить может только передающий') : yes();
    case 'got': case 'notGot': return !t ? no('передачи нет') : t.to !== u ? no('подтвердить может только получатель') : yes();
  }
  return no('неизвестное действие');
}

/* ------------------------------ действия ----------------------------- */
/* Принять папку: появляется при приёме на полку, сразу «в архиве». */
function siblings(f) {
  const k = kindOf(f.kind);
  return FOLDERS.filter(x => x !== f && x.kind === f.kind && (k.bind
    ? (f.borrower ? x.borrower === f.borrower : !!(f.unlinked && x.unlinked && x.unlinked.inn === f.unlinked.inn))
    : x.title === f.title && (x.dept || '') === (f.dept || '')));
}
function accept(d, by = S.user) {
  if (!isArch(by)) return no('принимает папки только архивариус');
  const k = kindOf(d.kind); if (!k) return no('выберите вид папки', 'kind');
  if (k.retired) return no(`вид «${k.name}» выведен из употребления`, 'kind');
  const x = { kind: k.id, borrower: null, unlinked: null, title: '', dept: '', vol: null };
  if (k.bind) {
    if (d.borrower && d.borrower !== '_none') { if (!borrower(d.borrower)) return no('заёмщик не найден', 'borrower'); x.borrower = d.borrower; }
    else if (d.borrower === '_none') {
      const name = trim(d.uname), inn = String(d.uinn || '').replace(/\s/g, '');
      if (!name) return no('укажите название заёмщика — его нет в системе', 'uname');
      if (!/^\d{14}$/.test(inn)) return no('ИНН — 14 цифр', 'uinn');
      x.unlinked = { name, inn };
    } else return no(`у вида «${k.name}» нужна привязка: выберите заёмщика или «заёмщика нет в системе»`, 'borrower');
    x.vol = d.vol === '' || d.vol == null ? 1 : +d.vol;
  } else {
    x.title = trim(d.title); if (!x.title) return no('укажите название папки', 'title');
    x.dept = d.dept || ''; x.vol = d.vol === '' || d.vol == null ? null : +d.vol;
  }
  if (x.vol != null && !(Number.isInteger(x.vol) && x.vol >= 1)) return no('том — целое число от 1', 'vol');
  if (k.bind) {
    const dup = FOLDERS.find(f => !f.gone && f.kind === k.id && f.vol === x.vol && (x.borrower ? f.borrower === x.borrower : !!(f.unlinked && f.unlinked.inn === x.unlinked.inn)));
    if (dup) return no(`том ${x.vol} уже в архиве — ${noStr(dup.no)}`, 'vol');
  }
  if (!d.shelf || !shelf(d.shelf)) return no('выберите полку', 'shelf');
  if (!shelfActive(d.shelf)) return no('полка выведена из употребления', 'shelf');
  if (d.from && !isActive(d.from)) return no('сдавший — действующий сотрудник', 'from');
  const no_ = ++S.lastNo;
  const f = Object.assign(x, { id: 'f' + no_, no: no_, content: trim(d.content), shelf: d.shelf, at: S.today, by, from: d.from || null, gone: null });
  FOLDERS.push(f);
  ev(f.id, 'accepted', by, { shelf: f.shelf, from: f.from });
  if (f.from) note(f.from, 'accepted', f.id, `Папка принята в архив, № ${noStr(f.no)} — «${titleOf(f)}»`);
  return yes({ id: f.id, no: noStr(f.no) });
}
/* «Принять следующий том»: вид, заёмщик (или название без привязки), том N+1, та же полка. */
function nextVolume(fid) {
  const f = folder(fid), k = kindOf(f.kind);
  const vols = [f, ...siblings(f)].filter(x => !x.gone).map(x => x.vol || 1);
  return { kind: f.kind, borrower: f.borrower || (f.unlinked ? '_none' : ''), uname: f.unlinked ? f.unlinked.name : '', uinn: f.unlinked ? f.unlinked.inn : '',
    title: k.bind ? '' : f.title, dept: f.dept || '', vol: Math.max(...vols) + 1, shelf: shelfActive(f.shelf) ? f.shelf : '', has: vols.sort((a, b) => a - b) };
}

/* Выдать: только архивариус; свободная папка или бронь за этим получателем; срок и «зачем» обязательны. */
function dueDefault(fid, to) {
  const rr = reservedReq(fid);
  if (rr && rr.who === to && rr.needBy && rr.needBy > S.today) return rr.needBy;
  return addWork(S.today, SETTINGS.issueDays.v);
}
function issueFields(d, dueOptional) {
  if (!d.to) return no('укажите, кому выдаётся', 'to');
  if (!isActive(d.to)) return no('получатель — действующий сотрудник', 'to');
  if (!trim(d.why)) return no('укажите, зачем выдаётся', 'why');
  if (!d.due && !dueOptional) return no('укажите срок возврата', 'due');
  if (d.due && d.due <= S.today) return no('срок возврата — позже сегодняшнего дня', 'due');
  return yes();
}
function issue(fid, d, by = S.user) {
  const g = gate('issue', fid, by); if (!g.ok) return g;
  const c = issueFields(d); if (!c.ok) return c;
  const rr = reservedReq(fid);
  if (rr && rr.who !== d.to) return no(`забронирована за ${emp(rr.who).ins} до ${fmt(rr.until)} — выдать другому нельзя`, 'to');
  const f = folder(fid);
  const iss = { id: nid('i'), folder: fid, holder: d.to, first: d.to, at: S.today, by, due: d.due, why: trim(d.why), req: rr ? rr.id : null, exts: [], transfers: [], end: null, ret: null, reminded: null };
  ISSUES.push(iss);
  if (rr) { rr.st = 'issued'; rr.end = S.today; rr.issue = iss.id; }
  ev(fid, 'issued', by, { issue: iss.id, to: d.to, due: d.due, why: iss.why });
  note(d.to, 'issued', fid, `Вам выдана папка ${fnoT(f)}, вернуть до ${fmt(d.due)}`);
  remind(iss);
  return yes({ issue: iss.id, due: d.due });
}
function batch(ids, fn) {
  const done = [], skipped = [];
  ids.forEach(id => { const r = fn(id); r.ok ? done.push(id) : skipped.push({ id, why: r.why }); });
  return yes({ done, skipped });
}
/* Пачкой — по каждой папке отдельно: своя выдача; занятые не выдаются. Срок не указан — у каждой свой:
   «нужна до» брони получателя, иначе срок по умолчанию (как у выдачи по одной). */
function issueBatch(ids, d, by = S.user) {
  if (!isArch(by)) return no('выдаёт только архивариус');
  const c = issueFields(d, true); if (!c.ok) return c;
  return batch(ids, id => issue(id, Object.assign({}, d, { due: d.due || dueDefault(id, d.to) }), by));
}

/* Запросить: любой сотрудник; «зачем» обязательно, «нужна до» — по желанию; порядок очереди — по времени. */
function requestFields(d) {
  if (!trim(d.why)) return no('укажите, зачем нужна папка', 'why');
  if (d.needBy && d.needBy <= S.today) return no('«нужна до» — позже сегодняшнего дня', 'needBy');
  return yes();
}
function request(fid, d, who = S.user) {
  const g = gate('request', fid, who); if (!g.ok) return g;
  const c = requestFields(d); if (!c.ok) return c;
  const r = { id: nid('r'), folder: fid, who, why: trim(d.why), needBy: d.needBy || null, d: S.today, n: ++S.n, st: 'queue', until: null, end: null };
  REQS.push(r); ev(fid, 'requested', who, { req: r.id, who, why: r.why, needBy: r.needBy });
  reserveNext(fid);
  return yes({ req: r.id, pos: posOf(r), reserved: r.st === 'reserved', until: r.until });
}
/* Что будет с запросом — строка в форме «Запросить». */
function requestPreview(fid, who = S.user) {
  const f = folder(fid), st = stateOf(fid), i = openIssue(fid), q = activeReqs(fid), n = q.length + 1;
  if (st === 'gone') return 'папка выбыла — запросить нельзя';
  if (st === 'archive') return `папка в архиве — забронируем за вами до ${fmt(addWork(S.today, SETTINGS.holdDays.v))}`;
  if (st === 'reserved') { const r = reservedReq(fid); return `забронирована за ${emp(r.who).ins} до ${fmt(r.until)}, вы будете № ${n}`; }
  return `на руках у ${emp(i.holder).gen} до ${fmt(i.due)}, вы будете № ${n}`;
}
function requestBatch(ids, d, who = S.user) {
  const c = requestFields(d); if (!c.ok) return c;
  return batch(ids, id => request(id, d, who));
}
function withdraw(rid, who = S.user) {
  const r = reqOf(rid); if (!r) return no('запрос не найден');
  if (r.who !== who) return no('отозвать может только тот, кто запросил');
  if (r.st !== 'queue' && r.st !== 'reserved') return no('запрос уже закрыт: ' + REQ_ST[r.st]);
  const wasRes = r.st === 'reserved'; r.st = 'withdrawn'; r.end = S.today;
  ev(r.folder, 'reqWithdrawn', who, { req: r.id, who });
  if (wasRes) reserveNext(r.folder);
  return yes();
}
/* Отказать в запросе: архивариус, причина обязательна, в любой момент до выдачи; бронь — следующему. */
function refuse(rid, reason, by = S.user) {
  if (!isArch(by)) return no('отказывает только архивариус');
  const r = reqOf(rid); if (!r) return no('запрос не найден');
  if (r.st !== 'queue' && r.st !== 'reserved') return no('запрос уже закрыт: ' + REQ_ST[r.st]);
  reason = trim(reason); if (!reason) return no('укажите причину отказа', 'reason');
  const wasRes = r.st === 'reserved'; r.st = 'refused'; r.reason = reason; r.end = S.today;
  ev(r.folder, 'reqRefused', by, { req: r.id, who: r.who, reason });
  note(r.who, 'closed', r.folder, `Запрос закрыт: отказ — ${reason} · ${fnoT(folder(r.folder))}`);
  if (wasRes) reserveNext(r.folder);
  return yes();
}

/* Просьба продлить: только держатель; дата позже текущего срока; причина обязательна. Решает архивариус, видя очередь. */
function extFields(i, d) {
  if (!d.date) return no('укажите новый срок', 'date');
  if (d.date <= i.due) return no(`новый срок — позже текущего (${fmt(i.due)})`, 'date');
  if (d.date <= S.today) return no('новый срок — позже сегодняшнего дня', 'date');
  if (!trim(d.reason)) return no('укажите причину', 'reason');
  return yes();
}
function askExtend(fid, d, who = S.user) {
  const g = gate('askExt', fid, who); if (!g.ok) return g;
  const i = openIssue(fid); const c = extFields(i, d); if (!c.ok) return c;
  const x = { id: nid('x'), issue: i.id, folder: fid, who, date: d.date, reason: trim(d.reason), d: S.today, n: ++S.n, st: 'pending' };
  EXTS.push(x); ev(fid, 'extAsk', who, { issue: i.id, date: x.date, reason: x.reason });
  return yes({ ext: x.id });
}
function prolong(i, date, reason, by, via) {
  const old = i.due; i.due = date; i.exts.push({ from: old, to: date, reason, by, d: S.today, via });
  ev(i.folder, 'extended', by, { issue: i.id, from: old, to: date, reason, via, holder: i.holder });
  note(i.holder, 'ext', i.folder, `Решение по продлению: продлено до ${fmt(date)} · ${fnoT(folder(i.folder))}`);
  remind(i);
}
function decideExtend(xid, d, by = S.user) {
  if (!isArch(by)) return no('решает архивариус');
  const x = EXTS.find(e => e.id === xid); if (!x) return no('просьба не найдена');
  if (x.st !== 'pending') return no('просьба уже решена');
  const i = ISSUES.find(e => e.id === x.issue);
  if (d.grant && isFired(i.holder)) return no(FIRED_EXT);
  if (d.grant) { x.st = 'granted'; x.by = by; x.end = S.today; prolong(i, x.date, x.reason, by, 'по просьбе'); return yes(); }
  const reason = trim(d.reason); if (!reason) return no('укажите причину отказа', 'reason');
  x.st = 'refused'; x.by = by; x.end = S.today; x.answer = reason;
  ev(x.folder, 'extRefused', by, { issue: i.id, date: x.date, reason });
  note(i.holder, 'ext', x.folder, `Решение по продлению: отказ — ${reason} · ${fnoT(folder(x.folder))}`);
  return yes();
}
/* Продлить напрямую: архивариус без просьбы (держатель у окна, по телефону). */
function extend(fid, d, by = S.user) {
  const g = gate('extend', fid, by); if (!g.ok) return g;
  const i = openIssue(fid); const c = extFields(i, d); if (!c.ok) return c;
  prolong(i, d.date, trim(d.reason), by, 'напрямую');
  return yes();
}

/* Передать из рук в руки: держатель → любой действующий сотрудник; до «Получил» отвечает передающий; срок не меняется. */
function transfer(fid, d, who = S.user) {
  const g = gate('transfer', fid, who); if (!g.ok) return g;
  if (!d.to) return no('укажите, кому передаёте', 'to');
  if (d.to === who) return no('нельзя передать самому себе', 'to');
  if (!isActive(d.to)) return no('получатель — действующий сотрудник', 'to');
  const i = openIssue(fid), f = folder(fid);
  const t = { id: nid('t'), from: who, to: d.to, d: S.today, n: ++S.n, st: 'pending', end: null };
  i.transfers.push(t); ev(fid, 'transfer', who, { issue: i.id, from: who, to: d.to });
  note(d.to, 'transfer', fid, `${nm(who)} передаёт вам папку ${fnoT(f)}, вернуть до ${fmt(i.due)} — подтвердите «Получил»`);
  return yes({ transfer: t.id });
}
/* Просьба продлить и незавершённая передача закрываются событием в истории и уведомлением. */
function closeExt(i, why) {
  const x = pendingExt(i); if (!x) return;
  x.st = 'closed'; x.end = S.today; x.answer = why;
  ev(i.folder, 'extClosed', null, { issue: i.id, who: x.who, date: x.date, why });
  note(x.who, 'ext', i.folder, `Решение по продлению: просьба закрыта — ${why} · ${fnoT(folder(i.folder))}`);
}
function closeTr(i, why) {
  const t = pendingTr(i); if (!t) return;
  t.st = 'cancelled'; t.end = S.today; t.why = why;
  ev(i.folder, 'transferCancel', null, { issue: i.id, from: t.from, to: t.to, why });
  note(t.to, 'transfer', i.folder, `Передача папки ${fnoT(folder(i.folder))} отменена: ${why}`);
}
/* «Получил»: держателем становится получатель; его запрос на эту папку закрывается передачей;
   просьба продлить прежнего держателя закрывается — новый держатель просит сам. */
function received(fid, who = S.user) {
  const g = gate('got', fid, who); if (!g.ok) return g;
  const i = openIssue(fid), t = pendingTr(i);
  closeExt(i, `папка передана ${emp(who).dat}`);
  t.st = 'got'; t.end = S.today; i.holder = who;
  ev(fid, 'transferGot', who, { issue: i.id, from: t.from, to: who });
  const r = activeReqs(fid).find(x => x.who === who);
  if (r) { r.st = 'closedTransfer'; r.end = S.today; r.issue = i.id; ev(fid, 'reqClosedTransfer', null, { req: r.id, who, issue: i.id }); }
  remind(i);
  return yes({ closedReq: r ? r.id : null });
}
function notReceived(fid, who = S.user) {
  const g = gate('notGot', fid, who); if (!g.ok) return g;
  const i = openIssue(fid), t = pendingTr(i); t.st = 'notgot'; t.end = S.today;
  ev(fid, 'transferNotGot', who, { issue: i.id, from: t.from, to: who });
  note(t.from, 'transfer', fid, `${nm(who)} не получал папку ${fnoT(folder(fid))} — она снова за вами`);
  return yes();
}
function cancelTransfer(fid, who = S.user) {
  const g = gate('cancelTr', fid, who); if (!g.ok) return g;
  const i = openIssue(fid), t = pendingTr(i); t.st = 'cancelled'; t.end = S.today;
  ev(fid, 'transferCancel', who, { issue: i.id, from: who, to: t.to });
  note(t.to, 'transfer', fid, `Передача папки ${fnoT(folder(fid))} отменена: ${nm(who)} передумал(а)`);
  return yes();
}

/* Принять возврат: на постоянное место; есть очередь — бронь первому; примечание — в историю и в «Содержание». */
function returnHint(fid) {
  const f = folder(fid); if (!f) return no('папка не найдена');
  const w = returnWhy(fid); if (w) return no(w);
  const q = activeReqs(fid)[0];
  if (q) return yes({ kind: 'hold', who: q.who, text: `отложить: бронь — ${nm(q.who)} до ${fmtS(addWork(S.today, SETTINGS.holdDays.v))}` });
  return yes({ kind: 'shelf', text: `на полку: ${placeFull(f.shelf)}` });
}
function acceptReturn(fid, d = {}, by = S.user) {
  const g = gate('return', fid, by); if (!g.ok) return g;
  const f = folder(fid), i = openIssue(fid), nt = trim(d.note);
  closeTr(i, 'папку вернули в архив'); closeExt(i, 'папку вернули в архив');
  i.end = S.today; i.closedBy = 'return'; i.ret = { d: S.today, by, note: nt, holder: i.holder };
  if (nt) f.content = (f.content ? f.content + '; ' : '') + `${fmt(S.today)}: ${nt}`;
  ev(fid, 'returned', by, { issue: i.id, from: i.holder, note: nt });
  const r = reserveNext(fid);
  return yes({ hold: r ? r.who : null, until: r ? r.until : null, shelf: f.shelf });
}
function acceptReturnBatch(ids, notes = {}, by = S.user) {
  if (!isArch(by)) return no('возврат принимает только архивариус');
  return batch(ids, id => acceptReturn(id, { note: notes[id] || '' }, by));
}
/* Поле «Возврат»: номера подряд; номер находится без ведущих нулей; папка не на руках — строка с причиной. */
function returnLookup(text) {
  const seen = new Set();
  return String(text || '').split(/[\s,;]+/).filter(Boolean).map(tok => {
    const dg = tok.replace(/\D/g, '');
    if (!dg) return { input: tok, ok: false, why: 'не номер папки' };
    const f = byNo(parseInt(dg, 10)); if (!f) return { input: tok, ok: false, why: 'папка не найдена' };
    if (seen.has(f.id)) return null; seen.add(f.id);
    const h = returnHint(f.id);
    return h.ok ? { input: tok, ok: true, id: f.id, hint: h } : { input: tok, ok: false, id: f.id, why: h.why };
  }).filter(Boolean);
}

/* Переместить: в любом состоянии, кроме «выбыла»; полка — действующая. */
function moveTarget(to) { if (!to || !shelf(to)) return no('выберите полку', 'shelf'); if (!shelfActive(to)) return no('полка выведена из употребления', 'shelf'); return yes(); }
function move(fid, to, by = S.user) {
  const g = gate('move', fid, by); if (!g.ok) return g;
  const c = moveTarget(to); if (!c.ok) return c;
  const f = folder(fid); if (f.shelf === to) return no('папка уже на этой полке', 'shelf');
  const from = f.shelf; f.shelf = to; ev(fid, 'moved', by, { from, to });
  return yes();
}
function moveBatch(ids, to, by = S.user) {
  if (!isArch(by)) return no('перемещает только архивариус');
  const c = moveTarget(to); if (!c.ok) return c;
  return batch(ids, id => move(id, to, by));
}
/* Тот же вид и том у нового заёмщика — привязка запрещена. */
const rebindDup = (f, bid) => FOLDERS.find(x => x !== f && !x.gone && x.kind === f.kind && x.borrower === bid && (x.vol || 1) === (f.vol || 1));
/* Изменить привязку: архивариус, основание обязательно, название пересобирается, прежняя — в истории. */
function rebind(fid, d, by = S.user) {
  const g = gate('rebind', fid, by); if (!g.ok) return g;
  const f = folder(fid);
  if (!d.borrower || !borrower(d.borrower)) return no('выберите заёмщика', 'borrower');
  if (f.borrower === d.borrower) return no('папка уже привязана к этому заёмщику', 'borrower');
  const basis = trim(d.basis); if (!basis) return no('укажите основание', 'basis');
  const dup = rebindDup(f, d.borrower);
  if (dup) return no(`у заёмщика уже есть том ${f.vol || 1} — ${noStr(dup.no)}`, 'borrower');
  const wasTitle = titleOf(f), was = f.borrower ? { borrower: f.borrower } : { unlinked: f.unlinked };
  f.borrower = d.borrower; f.unlinked = null;
  ev(fid, 'rebound', by, { was, wasTitle, to: d.borrower, basis, title: titleOf(f) });
  return yes({ title: titleOf(f), wasTitle });
}
/* Списать: причина и основание обязательны; закрывает выдачу, бронь, задание и очередь («закрыт: папка выбыла»). */
function writeOffFields(d) {
  if (!GONE_REASONS.includes(d.reason)) return no('выберите причину списания', 'reason');
  if (!trim(d.basis)) return no('укажите основание: документ, №, дата', 'basis');
  return yes();
}
function writeOff(fid, d, by = S.user) {
  const g = gate('writeoff', fid, by); if (!g.ok) return g;
  const c = writeOffFields(d); if (!c.ok) return c;
  const f = folder(fid), i = openIssue(fid), basis = trim(d.basis);
  if (i) { closeTr(i, 'папка выбыла'); closeExt(i, 'папка выбыла'); i.end = S.today; i.closedBy = 'writeoff'; i.goneReason = d.reason; }
  f.gone = { reason: d.reason, basis, d: S.today, by, holder: i ? i.holder : null };
  ev(fid, 'writtenOff', by, { reason: d.reason, basis, holder: i ? i.holder : null });
  activeReqs(fid).forEach(r => { r.st = 'closedGone'; r.end = S.today; ev(fid, 'reqClosedGone', null, { req: r.id, who: r.who });
    note(r.who, 'closed', fid, `Запрос закрыт: папка выбыла (${d.reason}) · ${fnoT(f)}`); });
  return yes();
}
function writeOffPreview(ids) {
  const fs = ids.map(folder).filter(f => f && !f.gone);
  return { total: fs.length, gone: ids.length - fs.length, out: fs.filter(f => openIssue(f.id)).length, queued: fs.filter(f => activeReqs(f.id).length).length };
}
function writeOffBatch(ids, d, by = S.user) {
  if (!isArch(by)) return no('списывает только архивариус');
  const c = writeOffFields(d); if (!c.ok) return c;
  return batch(ids, id => writeOff(id, d, by));
}
/* Восстановить: только у «утрачена»; место — прежнее подставлено; основание обязательно. */
function restore(fid, d = {}, by = S.user) {
  const g = gate('restore', fid, by); if (!g.ok) return g;
  const f = folder(fid), to = d.shelf || f.shelf;
  if (!shelfActive(to)) return no('полка выведена из употребления', 'shelf');
  const basis = trim(d.basis); if (!basis) return no('укажите основание', 'basis');
  const was = f.gone; f.gone = null; f.shelf = to;
  ev(fid, 'restored', by, { basis, shelf: to, was });
  return yes();
}

/* --------------------------- справочники ----------------------------- */
/* То, на что ссылается папка (в том числе выбывшая — её история), не удаляется — только выводится из употребления. */
const shelvesUnder = (level, id) => level === 'shelf' ? [id] : level === 'cab' ? SHELVES.filter(s => s.cab === id).map(s => s.id) : SHELVES.filter(s => cab(s.cab).room === id).map(s => s.id);
function placeRefs(level, id) {
  const ids = new Set(shelvesUnder(level, id));
  return FOLDERS.filter(f => ids.has(f.shelf) || EVENTS.some(e => e.folder === f.id && (e.kind === 'moved' && (ids.has(e.from) || ids.has(e.to)) || (e.kind === 'accepted' && ids.has(e.shelf))))).length;
}
const shelfCount = (level, id) => { const ids = new Set(shelvesUnder(level, id)); return FOLDERS.filter(f => !f.gone && ids.has(f.shelf)).length; };
const LEVEL = { room: [ROOMS, 'помещение'], cab: [CABS, 'шкаф'], shelf: [SHELVES, 'полку'] };
const DUP = { room: 'такое помещение уже есть', cab: 'такой шкаф уже есть', shelf: 'такая полка уже есть' };
const AT  = { room: 'в помещении', cab: 'в шкафу', shelf: 'на полке' };
/* Соседи по уровню: помещения, шкафы того же помещения, полки того же шкафа. Название рядом не повторяется. */
const placeSibs = (level, parent) => level === 'room' ? ROOMS : level === 'cab' ? CABS.filter(c => c.room === parent) : SHELVES.filter(s => s.cab === parent);
const placeParent = (level, x) => level === 'cab' ? x.room : level === 'shelf' ? x.cab : null;
function placeNameCheck(level, parent, name, self) {
  name = trim(name); if (!name) return no('укажите название', 'name');
  if (placeSibs(level, parent).some(e => e !== self && e.name === name)) return no(DUP[level], 'name');
  return yes();
}
/* Вывести можно только пустое место: где стоит папка (и та, что на руках, — ей туда возвращаться), сначала «Переместить». */
const outUnder = (level, id) => { const ids = new Set(shelvesUnder(level, id)); return FOLDERS.filter(f => !f.gone && ids.has(f.shelf) && openIssue(f.id)).length; };
function retireWhy(level, id) {
  const n = shelfCount(level, id); if (!n) return '';
  const o = outUnder(level, id);
  return `${AT[level]} ${plural(n, 'стоит', 'стоят', 'стоят')} ${n} ${plural(n, 'папка', 'папки', 'папок')}${o ? n === 1 ? ' (она на руках)' : ` (из них на руках ${o})` : ''} — сначала переместите ${n === 1 ? 'её' : 'их'}`;
}
/* Вернуть в употребление: полку — когда действует её шкаф, шкаф — когда действует помещение. */
function restoreWhy(level, id) {
  const x = LEVEL[level][0].find(e => e.id === id); if (!x) return 'не найдено'; if (!x.retired) return 'уже в употреблении';
  if (level === 'shelf') { const c = cab(x.cab), r = room(c.room); if (r.retired) return `сначала верните в употребление помещение «${r.name}»`; if (c.retired) return `сначала верните в употребление шкаф «${c.name}»`; }
  if (level === 'cab' && room(x.room).retired) return `сначала верните в употребление помещение «${room(x.room).name}»`;
  return '';
}
function addPlace(level, parent, name, by = S.user) {
  if (!isArch(by)) return no('справочник ведёт архивариус');
  name = trim(name); if (!name) return no('укажите название', 'name');
  if (level === 'cab' && !room(parent)) return no('помещение не найдено'); if (level === 'shelf' && !cab(parent)) return no('шкаф не найден');
  const c0 = placeNameCheck(level, parent, name); if (!c0.ok) return c0;
  if (level === 'room') { const r = { id: nid('room'), name, short: name.replace(/^Архив\s*/, '') || name }; ROOMS.push(r); return yes({ id: r.id }); }
  if (level === 'cab') { const c = { id: nid('cab'), room: parent, name }; CABS.push(c); return yes({ id: c.id }); }
  if (level === 'shelf') { const s = { id: nid('sh'), cab: parent, name }; SHELVES.push(s); return yes({ id: s.id }); }
  return no('неизвестный уровень');
}
function renamePlace(level, id, name, by = S.user) {
  if (!isArch(by)) return no('справочник ведёт архивариус');
  const x = LEVEL[level][0].find(e => e.id === id); if (!x) return no('не найдено');
  name = trim(name); if (name === x.name) return no('название не изменилось', 'name');
  const c = placeNameCheck(level, placeParent(level, x), name, x); if (!c.ok) return c;
  x.name = name; return yes();
}
function retirePlace(level, id, by = S.user) {
  if (!isArch(by)) return no('справочник ведёт архивариус');
  const x = LEVEL[level][0].find(e => e.id === id); if (!x) return no('не найдено'); if (x.retired) return no('уже выведено из употребления');
  const w = retireWhy(level, id); if (w) return no(w);
  x.retired = S.today; return yes();
}
function restorePlace(level, id, by = S.user) {
  if (!isArch(by)) return no('справочник ведёт архивариус');
  const w = restoreWhy(level, id); if (w) return no(w);
  LEVEL[level][0].find(e => e.id === id).retired = null; return yes();
}
function deletePlace(level, id, by = S.user) {
  if (!isArch(by)) return no('справочник ведёт архивариус');
  const [list, what] = LEVEL[level]; const x = list.find(e => e.id === id); if (!x) return no('не найдено');
  const n = placeRefs(level, id);
  if (n) return no(`на ${what} ссылаются папки (${n}) — удалить нельзя, только вывести из употребления`);

/* Поиск: номер — с «А-» кириллицей или латиницей, с дефисом, пробелом или без, без ведущих нулей — только точно;

function matchQ(f, q) {

  const n = qNo(q); if (n != null && f.no === n) return true;
  if (/^\d{7,}$/.test(q) && innOf(f).startsWith(q)) return true; /* до 7 цифр ИНН не ищется: «215» — номер, не начало ИНН 215… (АХ-Д27) */

/* Плашки: состояния (в сумме все папки) и признаки «из них». */

/* Реестр: поиск и отборы → плашки-счётчики → строки. Заёмщика даёт поиск (название, ИНН) — отдельного отбора нет.

  const pass = f => {

/* ---------------------------- инварианты ----------------------------- */
/* Самопроверка модели: что должно быть верно всегда, при любом ходе действий. */
function invariants() {
  const bad = [];
  const nos = new Set();
  FOLDERS.forEach(f => {
    const fn = noStr(f.no);
    if (nos.has(f.no)) bad.push(fn + ': номер не уникален'); nos.add(f.no);
    if (!shelf(f.shelf)) bad.push(fn + ': полка не найдена');
    const open = ISSUES.filter(i => i.folder === f.id && !i.end);
    if (open.length > 1) bad.push(fn + ': две открытые выдачи');
    const res = REQS.filter(r => r.folder === f.id && r.st === 'reserved');
    if (res.length > 1) bad.push(fn + ': две брони');
    const act = activeReqs(f.id);
    if (f.gone && (open.length || act.length)) bad.push(fn + ': у выбывшей открыта выдача или очередь');
    if (res.length && open.length) bad.push(fn + ': бронь у папки на руках');
    if (res.length && act[0] !== res[0]) bad.push(fn + ': бронь не у первого в очереди');
    if (!f.gone && !open.length && act.length && !res.length) bad.push(fn + ': папка свободна, очередь есть, а брони нет');
    if (new Set(act.map(r => r.who)).size !== act.length) bad.push(fn + ': два запроса одного сотрудника');
    open.forEach(i => { if (!i.due || !i.why) bad.push(fn + ': выдача без срока или «зачем»'); if (act.some(r => r.who === i.holder)) bad.push(fn + ': держатель в своей очереди'); if (i.transfers.filter(t => t.st === 'pending').length > 1) bad.push(fn + ': две передачи'); });
    const k = kindOf(f.kind);
    if (k.bind && !f.borrower && !f.unlinked) bad.push(fn + ': вид с привязкой без заёмщика');
    if (!k.bind && !f.title) bad.push(fn + ': папка без привязки без названия');
  });
  REQS.forEach(r => { if (r.st === 'reserved' && !r.until) bad.push(r.id + ': бронь без срока'); });
  EXTS.filter(x => x.st === 'pending').forEach(x => { const i = ISSUES.find(e => e.id === x.issue); if (!i || i.end) bad.push(x.id + ': просьба продлить у закрытой выдачи'); else if (x.who !== i.holder) bad.push(x.id + ': просьба продлить не от держателя'); });
  return bad;
}

  dicts: 'Справочники архива', borrower: 'Карточка заёмщика — образец врезки «Где бумага»' };
const LIST_VIEWS = ['queue', 'folders', 'mine', 'nokzd', 'journal', 'dicts'];
const startView = u => isArch(u) ? 'queue' : 'mine';
const viewsOf   = u => isArch(u) ? VIEWS_ARCH : VIEWS_ALL;
const roleOf    = u => (USERS.find(x => x[0] === u) || [u, 'сотрудник'])[1];
const ST_PILL = { archive: 'ok', reserved: 'info', out: 'warn', transfer: 'info', gone: 'neutral' };
const stPill  = fid => { const st = stateOf(fid); return `<span class="pill ${ST_PILL[st]}" data-st="${st}">${ST[st]}</span>`; };
/* № строки — ссылка в карточку. Нажат с клавиатуры (Tab, Enter) — карточка держит курсор, Esc вернёт его на этот №. */
const openBtn = f => `<button class="linky mono" data-open="${f.id}" onclick="event.stopPropagation();AX.openCard('${f.id}', event.detail === 0)">${noStr(f.no)}</button>`;
const btn = (label, call, o = {}) => `<button class="btn ${o.cls || 'btn-secondary'}${o.sm === false ? '' : ' btn-sm'}"${o.tid ? ` data-testid="${o.tid}"` : ''}${o.why ? ` disabled data-why="${esc(o.why)}" title="${esc(o.why)}"` : ''} onclick="event.stopPropagation();${call}">${o.html || esc(label)}</button>`;
const sec = (title, n, right, tid) => `<div class="section-h"${tid ? ` data-testid="${tid}"` : ''}>${esc(title)}${n != null ? ` <span class="c">${n}</span>` : ''}${right ? `<div class="btn-row">${right}</div>` : ''}</div>`;
/* Печать любого списка — предпросмотр листа с таблицей экрана (tid); Excel — файл с колонками как на экране. */
const printXls = (name, n, tid) => btn('', `AX.uiPrintList('${esc(name)}', ${n}, '${tid}')`, { html: ico('print') + ' Печать', tid: 'print-list' }) + btn('', `AX.uiExcel('${esc(name)}', ${n})`, { html: ico('xls') + ' Excel', tid: 'excel' });

function render() {
  if (typeof document === 'undefined') return;
  const u = S.user, vs = viewsOf(u), mc = menuCounts(u);
  if (!vs.some(v => v[0] === S.view) && S.view !== 'borrower') S.view = startView(u);
  /* Счётчик серый; красный — только когда в счёт входит своя просрочка. */
  $('#navItems').innerHTML = vs.map(([v, l]) => { const c = v === 'queue' ? mc.queue : v === 'mine' ? mc.mine : 0, hot = v === 'mine' && mc.mineOver > 0;
    return `<button class="nav-item${S.view === v ? ' active' : ''}" data-v="${v}" data-testid="nav-${v}" onclick="AX.go('${v}')">${l}<span class="cnt${hot ? ' hot' : ''}" data-testid="cnt-${v}">${c || ''}</span></button>`; }).join('');
  $('#user').innerHTML = USERS.map(([id, role]) => `<option value="${id}"${id === u ? ' selected' : ''}>${esc(nm(id))} — ${role}</option>`).join('');
  $('#who').innerHTML = `${esc(nm(u))}<small>${esc(roleOf(u))} · ${esc(emp(u).dept)}</small>`;
  $('#standToday').textContent = fmt(S.today);
  $('#title').textContent = TITLES[S.view];
  const V = { queue: viewQueue, folders: viewFolders, mine: viewMine, nokzd: viewNoKzd, journal: viewJournal, dicts: viewDicts, borrower: viewBorrower };
  $('#panel').innerHTML = V[S.view]();
  $('#panel').dataset.view = S.view;
  if (S.view === 'queue') renderRet();
  renderCard();
  /* При входе в очередь и после возврата курсор — в поле «Возврат». */
  if (S.focusRet) { S.focusRet = false; const el = $('#retInput'); if (el && S.view === 'queue' && !S.form && !S.print && !S.card) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
  /* При входе в «Папки» и после карточки, открытой Enter, — курсор в поиске, набранное выделено. */
  if (S.focusQ) { S.focusQ = false; const el = $('#fq'); if (el && S.view === 'folders' && !S.form && !S.print && !S.card) { el.focus({ preventScroll: true }); el.select(); } }
  /* При входе на «Мои папки» и после закрытой карточки — курсор в «Найти папку». */
  if (S.focusMine) { S.focusMine = false; const el = $('#mineQ'); if (el && S.view === 'mine' && !S.form && !S.print && !S.card) el.focus({ preventScroll: true }); }
  /* При входе в журнал и после карточки — курсор в поиске журнала, набранное выделено. */
  if (S.focusJ) { S.focusJ = false; const el = $('#jq'); if (el && S.view === 'journal' && !S.form && !S.print && !S.card) { el.focus({ preventScroll: true }); el.select(); } }
}

/* --------------------- ЭКРАН: очередь архивариуса -------------------- */
/* Блоки по срочности: к выдаче → продления → у уволенных → ждут привязки (без срока, растёт при запуске).
   Строка открытой в панели папки подсвечена, как в «Папках». */
const qRow = (f, tid) => `<tr class="click${S.card === f.id ? ' cur' : ''}" data-testid="${tid}" onclick="AX.openCard('${f.id}')">`;
function viewQueue() {
  if (!isArch(S.user)) return `<div class="empty">Очередь архивариуса — у роли «Архивариус».</div>`;
  const q = archQueue();
  /* Поле «Возврат»: ввод с клавиатуры — кнопка рядом с полем, Enter принимает. */
  let h = `<div class="retbox" data-testid="ret-box"><div class="row1"><label class="ret-h" for="retInput">Возврат</label>
    <input id="retInput" class="ret-in" data-testid="ret-input" autocomplete="off" placeholder="номера с корешков через пробел: 230 205 214" value="${esc(S.ret.text)}"
      oninput="AX.retInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();AX.uiReturnBatch();}">
    <button class="btn btn-primary" id="retBtn" data-testid="ret-accept" onclick="AX.uiReturnBatch()">Принять возврат</button>
    <span class="small">«231» — это А-000231, можно и с «А-»; Enter — принять</span></div><div id="retRows"></div></div>`;
  if (!q.total) h += `<div class="empty" data-testid="queue-empty">Ничего не ждёт вашего действия.</div>`;
  if (q.give.length) h += sec('К выдаче', q.give.length, btn('', 'AX.uiPrintRound()', { html: ico('print') + ' Печать обхода', tid: 'print-round' }), 'blk-give') +
    `<table class="cgrid" data-testid="tbl-give"><thead><tr><th>Место</th><th>№</th><th>Название</th><th>Для кого</th><th>Бронь до</th><th>Зачем</th><th></th></tr></thead><tbody>${q.give.map(x => { const f = folder(x.id);
      return `${qRow(f, 'give-' + f.no)}<td class="nw mono">${x.place}</td><td class="nw">${openBtn(f)}</td><td>${esc(x.title)}</td><td class="nw">${esc(nm(x.who))} <span class="small">${esc(emp(x.who).dept)}</span></td>
      <td class="nw">${fmt(x.until)}</td><td>${esc(x.why)}</td><td class="nw"><div class="btn-row">${btn('Выдать', `AX.uiIssue('${f.id}')`, { cls: 'btn-primary', tid: 'give-issue-' + f.no })}${btn('Отказать', `AX.uiRefuse('${x.req}')`, { tid: 'give-refuse-' + f.no })}</div></td></tr>`; }).join('')}</tbody></table>`;
  if (q.ext.length) h += sec('Продления', q.ext.length, '', 'blk-ext') +
    `<table class="cgrid" data-testid="tbl-ext"><thead><tr><th>Держатель</th><th>№</th><th>Название</th><th>Срок → просит до</th><th>Причина</th><th>Кто ждёт</th><th></th></tr></thead><tbody>${q.ext.map(x => { const f = folder(x.folder), i = openIssue(f.id), w = activeReqs(f.id);
      return `${qRow(f, 'ext-' + f.no)}<td class="nw">${esc(nm(x.who))}</td><td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td><td class="nw">${fmt(i.due)} → <b>${fmt(x.date)}</b></td><td>${esc(x.reason)}</td>
      <td>${w.length ? `<span class="red">${w.map(r => esc(nm(r.who))).join(', ')}</span>` : '—'}</td><td class="nw"><div class="btn-row">${btn('Продлить', `AX.uiDecide('${x.id}', true)`, { cls: 'btn-primary', tid: 'ext-grant-' + f.no, why: isFired(i.holder) ? FIRED_EXT : '' })}${btn('Отказать', `AX.uiDecide('${x.id}', false)`, { tid: 'ext-refuse-' + f.no })}</div></td></tr>`; }).join('')}</tbody></table>`;
  if (q.fired.length) h += sec('На руках у уволенных', q.fired.length, printXls('На руках у уволенных', q.fired.length, 'tbl-fired'), 'blk-fired') +
    `<table class="cgrid" data-testid="tbl-fired"><thead><tr><th>Держатель</th><th>Уволен с</th><th>№</th><th>Название</th><th>Вернуть до</th><th>Руководитель</th><th></th></tr></thead><tbody>${q.fired.map(i => { const f = folder(i.folder), e = emp(i.holder);
      return `${qRow(f, 'fired-' + f.no)}<td class="nw">${esc(e.name)} <span class="flag">уволен</span></td><td class="nw">${fmt(e.fired)}</td><td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td>
      <td class="nw${S.today > i.due ? ' red' : ''}">${fmt(i.due)}</td><td class="nw">${esc(nm(e.head))}</td><td class="nw"><div class="btn-row">${btn('Принять возврат', `AX.uiReturn('${f.id}')`, { tid: 'fired-return-' + f.no })}${btn('Списать', `AX.uiWriteoff('${f.id}')`, { cls: 'btn-danger', tid: 'fired-writeoff-' + f.no })}</div></td></tr>`; }).join('')}</tbody></table>`;
  if (q.bind.length) h += sec('Ждут привязки', q.bind.length, '', 'blk-bind') +
    `<table class="cgrid" data-testid="tbl-bind"><thead><tr><th>№</th><th>Название (вручную)</th><th>ИНН</th><th>Место</th><th>Заёмщик в системе</th><th></th></tr></thead><tbody>${q.bind.map(({ f, match }) =>
      `${qRow(f, 'bind-' + f.no)}<td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td><td class="mono nw">${f.unlinked.inn}</td><td class="nw mono">${placeShort(f.shelf)}</td>
      <td>${match ? `<span class="hint shelf" data-testid="bind-hint-${f.no}">найден по ИНН: ${esc(match.name)}</span>` : '<span class="muted">заёмщика с этим ИНН в системе нет</span>'}</td>
      <td class="nw">${match ? btn('Привязать', `AX.uiRebind('${f.id}', '${match.id}')`, { cls: 'btn-primary', tid: 'bind-go-' + f.no }) : btn('Привязать…', `AX.uiRebind('${f.id}')`, { tid: 'bind-go-' + f.no })}</td></tr>`).join('')}</tbody></table>`;
  return h;
}
/* Строки возврата — одни для поля «Возврат» и для окна «Принять возврат» пачкой из «Папок» (mode 'b'):
   № · название · держатель (просрочка пометкой) · куда · примечание; папка не на руках — строка с причиной. */
function retRowsHtml(rows, st, mode) {
  if (!rows.length) return '';
  const no = f => mode === 'b' ? `<span class="mono">${noStr(f.no)}</span>` : openBtn(f);
  return `<table class="cgrid" data-testid="ret-rows"><thead><tr><th>№</th><th>Название</th><th>Держатель</th><th>Куда</th><th>Примечание</th></tr></thead><tbody>${rows.map(r => {
    const f = r.id && folder(r.id);
    if (!r.ok) return `<tr data-testid="ret-bad"><td class="nw">${f ? no(f) : `<span class="mono">${esc(r.input)}</span>`}</td><td colspan="4"><span class="why err">${esc(r.why)}</span>${f ? ' · ' + esc(titleOf(f)) : ''}</td></tr>`;
    const i = openIssue(r.id), od = overDays(r.id);
    return `<tr data-testid="ret-row-${f.no}"><td class="nw">${no(f)}</td><td>${esc(titleOf(f))}</td><td class="nw">${esc(nm(i.holder))}${od ? `<div class="small red" data-testid="ret-over-${f.no}">просрочена ${od} р.д.</div>` : ''}</td>
      <td><span class="hint ${r.hint.kind}" data-testid="ret-hint-${f.no}">${esc(r.hint.text)}</span></td>
      <td style="min-width:${mode === 'b' ? 200 : 260}px">${st.open[r.id] || st.notes[r.id] ? `<input class="note-in" data-testid="ret-note-${f.no}" placeholder="вернулось не всё: …" value="${esc(st.notes[r.id] || '')}" oninput="AX.retNote('${r.id}', this.value, '${mode}')">`
        : `<button class="linky" data-testid="ret-addnote-${f.no}" onclick="AX.retOpenNote('${r.id}', '${mode}')">＋ примечание</button>`}</td></tr>`; }).join('')}</tbody></table>`;
}
/* Поле «Возврат»: строки перерисовываются без перерисовки поля ввода. Пусто — итог последнего возврата
   («куда» нужно, пока папки раскладываются), до следующего ввода или ухода из очереди. */
function renderRet() {
  const box = $('#retRows'), b = $('#retBtn'); if (!box) return;
  const rows = returnLookup(S.ret.text), ok = rows.filter(r => r.ok), d = S.ret.done;
  b.textContent = `Принять возврат (${ok.length})`; b.disabled = !ok.length;
  if (rows.length) { box.innerHTML = retRowsHtml(rows, S.ret, 'q'); return; }
  box.innerHTML = d && d.length ? `<div class="ret-done" data-testid="ret-done"><div class="ret-done-h">Принято только что: ${d.length} — разложите по местам</div>
    <table class="cgrid"><thead><tr><th>№</th><th>Название</th><th>Куда</th></tr></thead><tbody>${d.map(x => { const f = folder(x.id);
      return `<tr data-testid="ret-done-${f.no}"><td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td><td><span class="hint ${x.kind}">${esc(x.text)}</span></td></tr>`; }).join('')}</tbody></table></div>` : '';
}

/* --------------------------- ЭКРАН: папки ---------------------------- */
function selF(id, label, opts, w) {
  const v = S.f[id];
  return `<div class="fld${w ? ' ' + w : ''}"><label>${label}</label><select data-testid="f-${id}" onchange="AX.setF('${id}', this.value)"><option value="">все</option>${opts.map(([k, l]) => `<option value="${k}"${k === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
}
/* Место — один отбор: всё помещение, весь шкаф или полка. */
const placeVal = () => S.f.shelf ? 's:' + S.f.shelf : S.f.cab ? 'c:' + S.f.cab : S.f.room ? 'r:' + S.f.room : '';
const placeOpts = () => ROOMS.flatMap(r => [['r:' + r.id, `${r.name} — всё`], ...CABS.filter(c => c.room === r.id).flatMap(c => [['c:' + c.id, `  ${r.short} · ${c.name} — весь`],
  ...SHELVES.filter(s => s.cab === c.id).map(s => ['s:' + s.id, `    ${placeShort(s.id)}`])])]);
function viewFolders() {
  const arch = isArch(S.user);
  const holders = [...new Set(ISSUES.filter(i => !i.end).map(i => i.holder))].sort((a, b) => nm(a).localeCompare(nm(b), 'ru')).map(id => [id, nm(id)]);
  const pv = placeVal();
  /* Поиск, отборы и «Принять папку» — одна строка. Enter — карточка папки с этим номером (или единственной найденной). */
  return `<div class="filters"><div class="fld wq"><label for="fq">Поиск — номер, название, ИНН, содержание</label><input id="fq" data-testid="f-q" autocomplete="off" value="${esc(S.q)}" placeholder="231, «Протоколы», ИНН, «договор залога»" oninput="AX.setQ(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();AX.searchEnter();}"></div>
    ${selF('kind', 'Вид', KINDS.map(k => [k.id, k.name]), 'wk')}<div class="fld wp"><label>Место</label><select data-testid="f-place" onchange="AX.setF('place', this.value)"><option value="">все</option>${placeOpts().map(([k, l]) => `<option value="${k}"${k === pv ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    ${selF('holder', 'Держатель', holders)}${selF('dept', 'Подразделение', DEPTS.map(d => [d, d]), 'wd')}${selF('hdept', 'Подразделение держателя', DEPTS.map(d => [d, d]), 'wh')}
    <div class="grow btn-row">${arch ? btn('Принять папку', 'AX.uiAccept()', { cls: 'btn-primary', sm: false, tid: 'accept' }) : ''}</div></div>
    <div id="fList">${folderList()}</div>`;
}
/* Действия пачкой: на кнопке — сколько из отмеченных действие возьмёт (та же проверка, что у кнопки карточки); ноль — серая с причиной. */
const BATCH = [
  ['request', 'Запросить', 'AX.uiRequestBatch', 'среди отмеченных нет папок, которые вы можете запросить'],
  ['issue', 'Выдать', 'AX.uiIssueBatch', 'среди отмеченных нет свободных: все на руках или выбыли'],
  ['return', 'Принять возврат', 'AX.uiReturnSel', 'среди отмеченных нет папок на руках'],
  ['move', 'Переместить', 'AX.uiMoveBatch', 'все отмеченные выбыли'],
  ['label', 'Печать ярлыков', 'AX.uiLabels', 'все отмеченные выбыли — ярлык не нужен'],
  ['writeoff', 'Списать', 'AX.uiWriteoffBatch', 'все отмеченные уже выбыли'],
];
const batchIds = (act, ids = selIds()) => ids.filter(id => gate(act, id).ok);
function folderList() {
  const arch = isArch(S.user), { rows, counts, hidden } = registry(Object.assign({ q: S.q, chip: S.chip }, S.f));
  /* Отмечены только показанные: смена поиска, отбора или плашки снимает отметку со скрытых строк. */
  const shownIds = new Set(rows.map(f => f.id)); [...S.sel].forEach(id => { if (!shownIds.has(id)) S.sel.delete(id); });
  const n = S.sel.size, allOn = rows.length && rows.every(f => S.sel.has(f.id));
  const tile = c => { const l = CHIPS.find(x => x[0] === c)[1]; return `<button class="tile${S.chip === c ? ' on' : ''}${c === 'over' && counts[c] ? ' hot' : ''}" data-testid="chip-${c}" onclick="AX.setChip('${c}')"><span class="n">${counts[c]}</span><span class="l">${l}</span></button>`; };
  const chips = `<div class="sum" data-testid="chips">${CHIPS.filter(([c]) => !CHIP_SIGNS.includes(c)).map(([c]) => tile(c)).join('')}<span class="sum-sep" data-testid="chips-sep">из них</span>${CHIP_SIGNS.map(tile).join('')}</div>`;
  /* Полоса пачки встаёт на место строки «Показано» той же высоты — таблица не сдвигается; строка и шапка таблицы прилипают при прокрутке. */
  /* Действие получает только подходящие папки; «Принять возврат» — все отмеченные: окно показывает причину у не взятых. */
  const bb = ([act, label, call, why], cls) => { const k = batchIds(act).length;
    return btn('', act === 'return' ? `${call}()` : `${call}(AX.batchIds('${act}'))`, { tid: 'b-' + (act === 'label' ? 'labels' : act), cls, why: k ? '' : why, html: `${esc(label)} <span class="bn" data-testid="bn-${act}">(${k})</span>` }); };
  const head = `<div class="listbar" data-testid="listbar">${n ? `<div class="batch" data-testid="batch">Отмечено <b data-testid="sel-count">${n}</b>${bb(BATCH[0])}${arch ? '<span class="sep"></span>' + BATCH.slice(1).map(b => bb(b, b[0] === 'writeoff' ? 'btn-danger' : '')).join('') : ''}<button class="linky" style="margin-left:auto" onclick="AX.clearSel()">снять отметки</button></div>`
    : `<div class="lb-shown">Показано <span class="c" data-testid="shown">${rows.length}</span>${S.chip === 'gone' ? '' : '<span class="small">выбывшие скрыты — плашка «выбыли»</span>'}<div class="btn-row">${arch && S.f.shelf ? btn('', `AX.uiPrintShelf('${S.f.shelf}')`, { html: ico('print') + ' Печать списка полки', tid: 'print-shelf' }) : ''}${printXls('Папки', rows.length, 'tbl-folders')}</div></div>`}</div>`;
  /* Поиск нашёл скрытое отбором, плашкой или «выбывшие скрыты» — номера ссылками в карточку. */
  const outside = hidden.length ? `<div class="outside" data-testid="outside">Вне отбора найдено ещё ${hidden.length}: ${hidden.slice(0, 8).map(f => `<button class="linky mono" data-testid="out-${f.no}" onclick="AX.openCard('${f.id}')">${noStr(f.no)}</button> <span class="small">(${esc(placeShort(f.shelf))}, ${ST[stateOf(f.id)]})</span>`).join(' · ')}${hidden.length > 8 ? ' …' : ''}
    ${S.chip || Object.values(S.f).some(Boolean) ? ` · <button class="linky" data-testid="reset-f" onclick="AX.resetF()">сбросить отборы</button>` : ''}</div>` : '';
  const body = rows.map(f => { const st = stateOf(f.id), i = openIssue(f.id), r = reservedReq(f.id), t = pendingTr(i), w = activeReqs(f.id).length, ov = isOver(f.id);
    const sub = st === 'reserved' ? `<div class="small">за ${esc(emp(r.who).ins)} до ${fmtS(r.until)}</div>` : st === 'transfer' ? `<div class="small">→ ${esc(nm(t.to))}</div>` : st === 'gone' ? `<div class="small">${esc(f.gone.reason)}</div>` : '';
    const hold = i ? `${esc(nm(i.holder))} <span class="small">· ${esc(emp(i.holder).dept)}</span>${isFired(i.holder) ? ' <span class="flag">уволен</span>' : ''}` : '';
    const due = i ? `<span class="${ov ? 'red' : ''}">${fmt(i.due)}</span>${ov ? `<div class="small red">просрочена ${overDays(f.id)} р.д.</div>` : ''}` : '';
    return `<tr class="click${S.card === f.id ? ' cur' : ''}${S.sel.has(f.id) ? ' sel' : ''}${ov ? ' over' : ''}${f.gone ? ' gone' : ''}" data-testid="row-${f.no}" onclick="AX.openCard('${f.id}')">
      <td class="chk" onclick="event.stopPropagation()"><input type="checkbox" data-testid="sel-${f.no}"${S.sel.has(f.id) ? ' checked' : ''} onchange="AX.toggleSel('${f.id}', this.checked)"></td>
      <td class="mono nw">${noStr(f.no)}</td><td>${esc(titleOf(f))}${f.unlinked ? ' <span class="pill warn">не привязана</span>' : ''}</td><td class="nw">${esc(deptOf(f) || '—')}</td>
      <td class="nw mono">${placeShort(f.shelf)}</td><td class="nw">${stPill(f.id)}${sub}</td><td class="nw">${hold}</td><td class="nw">${due}</td><td class="mono">${w || ''}</td></tr>`; }).join('');
  return chips + head + outside + `<table class="cgrid stick" data-testid="tbl-folders"><thead><tr><th class="chk"><input type="checkbox" data-testid="sel-all"${allOn ? ' checked' : ''} onchange="AX.selAll(this.checked)"></th><th>№</th><th>Название</th><th>Подразделение</th><th>Место</th><th>Состояние</th><th>Держатель</th><th>Вернуть до</th><th>Ждут</th></tr></thead>
    <tbody>${body || `<tr><td colspan="9" class="muted">${hidden.length ? 'В отборе ничего не найдено' : 'Ничего не найдено'}</td></tr>`}</tbody></table>`;
}

/* ------------------------- ЭКРАН: мои папки -------------------------- */
/* Три блока — одна сетка: № · название · дата · две средние колонки · кнопки; колонки одна под другой. */
const MINE_COLS = '<colgroup><col style="width:120px"><col><col style="width:170px"><col style="width:230px"><col style="width:320px"><col style="width:360px"></colgroup>';
/* Срок: сколько рабочих дней осталось; с дня напоминания — жёлтым, после срока — красным. */
function dueCell(i) {
  const ra = i.remindFor === i.due ? i.remindAt : workBefore(i.due, SETTINGS.remindDays.v), over = S.today > i.due;
  const s = over ? `<span class="due-s over">просрочена ${workBetween(i.due, S.today)} р.д.</span>` : S.today === i.due ? '<span class="due-s soon">срок сегодня</span>'
    : `<span class="due-s${S.today >= ra ? ' soon' : ''}">через ${workBetween(S.today, i.due)} р.д.</span>`;
  return `<td class="nw${over ? ' red' : ''}" data-testid="due-${folder(i.folder).no}">${fmt(i.due)}${s}</td>`;
}
/* Кто ждёт папку — кроме вас самих (свой запрос закроется передачей). */
const waitCell = (f, u) => { const w = activeReqs(f.id).filter(r => r.who !== u); return `<td>${w.length ? w.map(r => `ждёт ${esc(nm(r.who))} с ${fmtS(r.d)}`).join('<br>') : '—'}</td>`; };
/* Справа в строке поиска: папки своего подразделения; руководителю — папки на руках у его сотрудников. Число — сколько строк покажут «Папки». */
function mineLinks(u) {
  const d = emp(u).dept;

  if (isHead(u)) { const r = registry({ hdept: d }), o = r.counts.over;
    h += `<span data-testid="mine-staff">На руках у сотрудников ${esc(d)}: <button class="linky" data-testid="mine-staff-all" onclick="AX.openFolders({ hdept: '${esc(d)}' })">${r.rows.length}</button>${o ? ` · <button class="linky red" data-testid="mine-staff-over" onclick="AX.openFolders({ hdept: '${esc(d)}', chip: 'over' })">${plural(o, 'просрочена', 'просрочены', 'просрочено')} ${o}</button>` : ''}</span>`; }

}
function viewMine() {

    <td><span class="pill info">передаёт ${esc(nm(t.from))}</span>${myReq ? '<div class="small" data-testid="in-closes-' + f.no + '">ваш запрос закроется передачей</div>' : ''}</td>

  if (m.hands.length) h += sec('На руках у меня', m.hands.length, '', 'blk-hands') + `<table class="cgrid mine" data-testid="tbl-hands">${MINE_COLS}<thead><tr><th>№</th><th>Название</th><th>Вернуть до</th><th>Кто ждёт</th><th>Отметки</th><th></th></tr></thead><tbody>${m.hands.map(({ f, i, t, x, over }) => {
    const marks = [t ? `<span class="pill info">передаётся → ${esc(nm(t.to))}, ждёт «Получил»</span>` : '', x ? `<span class="pill warn">просьба продлить до ${fmt(x.date)} — на решении</span>` : '',
      over ? `<span class="pill err">задание «Вернуть папку»</span>` : ''].filter(Boolean).join(' ');
    const gT = gate('transfer', f.id, u), gX = gate('askExt', f.id, u);
    return `<tr class="click${over ? ' over' : ''}" data-testid="hand-${f.no}" onclick="AX.openCard('${f.id}')"><td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td>${dueCell(i)}${waitCell(f, u)}<td>${marks || '—'}</td>
      <td class="nw"><div class="btn-row">${t ? btn('Отменить передачу', `AX.uiCancelTr('${f.id}')`, { tid: 'cancel-' + f.no }) : btn('Передать', `AX.uiTransfer('${f.id}')`, { tid: 'transfer-' + f.no, why: gT.ok ? '' : gT.why })}${btn('Попросить продление', `AX.uiAskExt('${f.id}')`, { tid: 'askext-' + f.no, why: gX.ok ? '' : gX.why })}</div></td></tr>`; }).join('')}</tbody></table>`;
  /* Бронь — где забрать: помещение; шкаф и полка — архивариусу, в карточке. */
  if (m.requests.length) h += sec('Мои запросы', m.requests.length, '', 'blk-req') + `<table class="cgrid mine" data-testid="tbl-req">${MINE_COLS}<thead><tr><th>№</th><th>Название</th><th>Нужна до</th><th>Зачем</th><th>Состояние</th><th></th></tr></thead><tbody>${m.requests.map(({ r, f, pos }) => {
    const i = openIssue(f.id);
    const stx = r.st === 'reserved' ? `<span class="pill info">ждёт вас в архиве до ${fmt(r.until)}</span><div class="small">${esc(room(cab(shelf(f.shelf).cab).room).name)}</div>` : `№ ${pos} в очереди${i ? `<div class="small">на руках у ${esc(emp(i.holder).gen)} до ${fmt(i.due)}</div>` : ''}`;
    return `<tr class="click" data-testid="req-${f.no}" onclick="AX.openCard('${f.id}')"><td class="nw">${openBtn(f)}</td><td>${esc(titleOf(f))}</td><td class="nw">${fmt(r.needBy)}</td><td>${esc(r.why)}</td><td>${stx}</td><td>${btn('Отозвать', `AX.uiWithdraw('${f.id}')`, { tid: 'withdraw-' + f.no })}</td></tr>`; }).join('')}</tbody></table>`;
  if (!m.incoming.length && !m.hands.length && !m.requests.length) h += `<div class="mine-none" data-testid="mine-empty">У вас нет папок архива — ни на руках, ни в запросах.</div>`;
  /* Эмуляция соседей: в рабочей системе это модули «Задания» и «Уведомления». */
  const tk = tasksOf(u), nt = NOTES.filter(n => n.to === u).sort((a, b) => b.n - a.n).slice(0, 8);
  if (tk.length || nt.length) h += `<div class="demo-box" style="margin-top:22px" data-testid="emul"><span class="demo-tag">Эмуляция модулей «Задания» и «Уведомления»</span>
    ${tk.length ? `<div class="section-h" style="margin-top:4px">Задания «Вернуть папку» <span class="c">${tk.length}</span></div><table class="cgrid" data-testid="tbl-tasks"><thead><tr><th>Папка</th><th>Держатель</th><th>Срок был</th><th>Просрочка</th><th>Кому</th></tr></thead><tbody>${tk.map(t => { const f = folder(t.folder), i = ISSUES.find(e => e.id === t.issue);
      return `<tr class="click" data-testid="task-${f.no}" onclick="AX.openCard('${f.id}')"><td>${openBtn(f)} ${esc(titleOf(f))}</td><td class="nw">${esc(nm(t.holder))}${t.fired ? ' <span class="flag">уволен</span>' : ''}</td><td class="nw">${fmt(i.due)}</td><td class="nw red">${t.days} р.д.</td>
      <td class="nw">${t.up ? `<span class="pill err" data-testid="task-up-${f.no}">поднято к руководителю: ${esc(nm(t.head))}</span>` : esc(nm(t.holder))}</td></tr>`; }).join('')}</tbody></table>` : ''}
    ${nt.length ? `<div class="section-h">Уведомления <span class="c">последние ${nt.length}</span></div><table class="cgrid" data-testid="tbl-notes"><tbody>${nt.map(n => `<tr class="click" onclick="AX.openCard('${n.folder}')"><td class="nw">${fmt(n.d)}</td><td class="nw"><b>${esc(NOTE_KIND[n.kind])}</b></td><td>${esc(n.text)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`;
  return h;
}

/* ---------------------- ЭКРАН: заёмщики без КЗД ---------------------- */
/* Отборы по роли: «мои заёмщики» — тому, кто ведёт заёмщиков (куратору включён); «Департамент» — всем, руководителю свой.

    <div class="fld wd"><label for="nkDept">Департамент</label><select id="nkDept" data-testid="nk-dept" onchange="AX.setNk('dept', this.value)"><option value="">все</option>${depts.map(d => `<option value="${d}"${d === S.nk.dept ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select></div>

      `<tr data-testid="nk-${x.b.id}"><td><button class="linky" onclick="AX.openBorrower('${x.b.id}')">${esc(x.b.name)}</button>${x.closed ? ' <span class="pill neutral">кредиты закрыты</span>' : ''}

          : btn('Принять папку', `AX.uiAccept({ kind: 'kzd', borrower: '${x.b.id}' })`, { tid: 'nk-accept-' + x.b.id })}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Нет заёмщиков без кредитно-залогового дела</td></tr>'}</tbody></table>`;

/* ------------------------ ЭКРАН: журнал движения ---------------------- */
function evLine(e) {
  const f = folder(e.folder);
  switch (e.kind) {
    case 'accepted': return { whom: e.from ? 'сдал: ' + nm(e.from) : '—', text: 'на полку ' + placeShort(e.shelf) };
    case 'requested': return { whom: '—', text: `запросил(а) ${nm(e.who)}: ${e.why}${e.needBy ? '; нужна до ' + fmt(e.needBy) : ''}` };
    case 'reserved': return { whom: nm(e.who), text: `бронь за ${emp(e.who).ins} до ${fmt(e.until)}` };
    case 'issued': return { whom: nm(e.to), text: `${e.why}; вернуть до ${fmt(e.due)}` };
    case 'transfer': return { whom: `${nm(e.from)} → ${nm(e.to)}`, text: 'передаётся, ждёт «Получил»' };
    case 'transferGot': return { whom: `${nm(e.from)} → ${nm(e.to)}`, text: 'получил' };
    case 'transferNotGot': return { whom: `${nm(e.from)} → ${nm(e.to)}`, text: 'не получал — папка снова у передающего' };
    case 'transferCancel': return { whom: `${nm(e.from)} → ${nm(e.to)}`, text: 'передача отменена' + (e.why ? ': ' + e.why : '') };
    case 'extClosed': return { whom: nm(e.who), text: `просьба продлить до ${fmt(e.date)} закрыта: ${e.why}` };
    case 'extAsk': return { whom: '—', text: `просит продлить до ${fmt(e.date)}: ${e.reason}` };
    case 'extended': return { whom: nm(evHolder(e)), text: `до ${fmt(e.to)} (было ${fmt(e.from)}), ${e.via}: ${e.reason}` };
    case 'extRefused': return { whom: '—', text: `отказ в продлении до ${fmt(e.date)}: ${e.reason}` };
    case 'returned': return { whom: 'от ' + emp(e.from).gen, text: e.note ? 'примечание: ' + e.note : 'на полку ' + placeShort(f.shelf) };
    case 'moved': return { whom: '—', text: `${placeShort(e.from)} → ${placeShort(e.to)}` };
    case 'rebound': return { whom: '—', text: `было «${e.wasTitle}», стало «${e.title}»; основание: ${e.basis}` };
    case 'writtenOff': return { whom: e.holder ? 'последний держатель: ' + nm(e.holder) : '—', text: `${e.reason}; ${e.basis}` };
    case 'restored': return { whom: '—', text: `на полку ${placeShort(e.shelf)}; ${e.basis}` };
    case 'reqRefused': return { whom: nm(e.who), text: 'запрос: отказ — ' + e.reason };
    case 'reqWithdrawn': return { whom: nm(e.who), text: 'запрос отозван' };
    case 'reqNotTaken': return { whom: nm(e.who), text: `запрос: не забран (бронь до ${fmt(e.until)})` };
    case 'reqClosedGone': return { whom: nm(e.who), text: 'запрос закрыт: папка выбыла' };
    case 'reqClosedTransfer': return { whom: nm(e.who), text: 'запрос закрыт передачей' };
  }
  return { whom: '', text: '' };
}
const EV_NAME = { accepted: 'принята', requested: 'запрос', reserved: 'бронь', issued: 'выдана', transfer: 'передача', transferGot: 'передана', transferNotGot: 'передача: не получал', transferCancel: 'передача отменена',
  extAsk: 'просьба продлить', extended: 'продлена', extRefused: 'отказ в продлении', extClosed: 'просьба закрыта', returned: 'возвращена', moved: 'перемещена', rebound: 'смена привязки', writtenOff: 'списана', restored: 'восстановлена',
  reqRefused: 'запрос: отказ', reqWithdrawn: 'запрос отозван', reqNotTaken: 'запрос: не забран', reqClosedGone: 'запрос закрыт', reqClosedTransfer: 'запрос закрыт' };
/* Сотрудник — чьи руки: получил, вернул, «А → Б» при передаче, «сдал …» при приёме, держатель при продлении и списании. */
function jWho(e) {
  const d = id => `${esc(nm(id))} <span class="small">· ${esc((emp(id) || {}).dept || '')}</span>`;
  switch (e.kind) {
    case 'issued': return d(e.to);
    case 'returned': return d(e.from);
    case 'transferGot': return `${esc(nm(e.from))} → ${esc(nm(e.to))}`;
    case 'accepted': return e.from ? 'сдал ' + d(e.from) : '—';
    case 'extended': case 'writtenOff': return evHolder(e) ? d(evHolder(e)) : '—';
  }
  return '—';
}
/* Журнал: поиск первым (номер — сразу карточка), период кнопками, сотрудник, подразделение сотрудника; плашки событий с числом. */

      oninput="AX.setJq(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();AX.journalEnter();}"></div>
    <div class="fld wper"><label>Период</label><div class="seg" data-testid="j-per">${JPER.map(([k, l]) => `<button class="seg-b${j.per === k ? ' on' : ''}" data-testid="j-per-${k}" onclick="AX.setJ('per', '${k}')">${l}</button>`).join('')}</div></div>

/* -------------- образец для модуля «Заёмщик»: врезка «Где бумага» -------------- */
/* Своя папка — от первого лица и без «Запросить»; том — в названии; при очереди — «ждут N»; КЗД выбыла — так и сказано. */
function paperBoxHtml(bid) {
  const p = paperBox(bid), u = S.user;
  const rows = p.rows.map(f => { const st = stateOf(f.id), i = openIssue(f.id), t = pendingTr(i), r = reservedReq(f.id), ov = isOver(f.id);
    const due = i ? `<span class="${ov ? 'red' : ''}">${fmt(i.due)}${ov ? ` — просрочена ${overDays(f.id)} р.д.` : ''}</span>` : '';
    const own = !!i && (i.holder === u || (t && t.to === u));
    const where = st === 'archive' ? esc(placeShort(f.shelf))
      : st === 'reserved' ? (r.who === u ? `за вами до ${fmtS(r.until)} — заберите в архиве` : `за ${esc(emp(r.who).ins)} до ${fmtS(r.until)}`)
      : st === 'gone' ? `${esc(f.gone.reason)} ${fmt(f.gone.d)}`
      : st === 'transfer' ? (t.to === u ? `вам от ${esc(emp(t.from).gen)} — подтвердите «Получил»` : t.from === u ? `вы → ${esc(nm(t.to))}, ждёт «Получил»` : `${esc(nm(t.from))} → ${esc(nm(t.to))}, вернуть до ${due}`)
      : i.holder === u ? `у вас до ${due}` : `у ${esc(emp(i.holder).gen)} до ${due}`;
    const wait = st === 'gone' ? 0 : activeReqs(f.id).filter(x => x.who !== u).length;
    const my = activeReqs(f.id).find(x => x.who === u), g = gate('request', f.id, u);
    const act = own || st === 'gone' ? '' : my ? `<span class="small">${esc(posText(my))}</span> ${btn('Отозвать', `AX.uiWithdraw('${f.id}')`)}` : btn('Запросить', `AX.uiRequest('${f.id}')`, { tid: 'pb-req-' + f.no, why: g.ok ? '' : g.why });
    return `<tr class="${f.gone ? 'gone' : ''}" data-testid="pb-row-${f.no}"><td>${openBtn(f)} ${esc(titleOf(f))}</td><td data-testid="pb-where-${f.no}">${stPill(f.id)} ${where}${wait ? ` <span class="flag amber">ждут ${wait}</span>` : ''}</td><td class="nw">${act}</td></tr>`; }).join('');
  const goneK = p.noKzd ? p.rows.find(f => f.kind === 'kzd' && f.gone) : null;
  const none = !p.noKzd ? '' : goneK ? `Кредитно-залоговое дело выбыло: ${esc(goneK.gone.reason)} ${fmt(goneK.gone.d)} (${noStr(goneK.no)}) — в архиве его нет` : 'Кредитно-залоговое дело в архив не сдано';
  return `<div class="paperbox" data-testid="paperbox"><h3>Где бумага${p.vols >= 2 ? btn(`Запросить все тома (${p.allVols.length})`, `AX.uiRequestBatch(${JSON.stringify(p.allVols).replace(/"/g, "'")})`, { tid: 'pb-all', why: p.allVols.length ? '' : 'все тома уже у вас или запрошены' }) : ''}</h3>
    ${none ? `<div class="banner warn" data-testid="pb-nokzd">${none}</div>` : ''}
    ${p.rows.length ? `<table class="cgrid"><thead><tr><th>Папка</th><th>Где сейчас</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : ''}</div>`;
}

/* ------------------------ КАРТОЧКА ПАПКИ: панель ----------------------- */
function cardButtons(f, u) {
  const st = stateOf(f.id), arch = isArch(u), i = openIssue(f.id), t = pendingTr(i), r = reservedReq(f.id);
  const B = (act, label, call, cls, tid) => { const g = gate(act, f.id, u); return btn(label, call, { cls: cls || 'btn-secondary', sm: false, tid: tid || 'cb-' + act, why: g.ok ? '' : g.why }); };
  const MI = (act, label, call, cls) => { const g = gate(act, f.id, u);
    return `<button class="mi${cls ? ' ' + cls : ''}" data-testid="mi-${act}"${g.ok ? '' : ' disabled'} onclick="AX.closeMenu();${call}">${esc(label)}${g.ok ? '' : `<div class="why">${esc(g.why)}</div>`}</button>`; };
  let h = '';
  if (arch) {
    const more = [];
    if (st === 'archive') h += B('issue', 'Выдать', `AX.uiIssue('${f.id}')`, 'btn-primary') + B('move', 'Переместить', `AX.uiMove('${f.id}')`);
    else if (st === 'reserved') { h += B('issue', 'Выдать ' + emp(r.who).dat, `AX.uiIssue('${f.id}')`, 'btn-primary') + B('unreserve', 'Снять бронь', `AX.uiUnreserve('${f.id}')`); more.push(MI('move', 'Переместить', `AX.uiMove('${f.id}')`)); }
    else if (st === 'out' || st === 'transfer') { h += B('return', 'Принять возврат', `AX.uiReturn('${f.id}')`, 'btn-primary') + B('extend', 'Продлить', `AX.uiExtend('${f.id}')`); more.push(MI('move', 'Переместить', `AX.uiMove('${f.id}')`)); }
    else h += B('restore', 'Восстановить', `AX.uiRestore('${f.id}')`, 'btn-primary');
    /* Свой запрос архивариус делает отсюда: нужен редко — свободную папку он выдаёт себе. */
    const ownReq = st === 'gone' ? '' : activeReqs(f.id).some(x => x.who === u) ? MI('withdraw', 'Отозвать запрос', `AX.uiWithdraw('${f.id}')`) : MI('request', 'Запросить', `AX.uiRequest('${f.id}')`);
    if (st !== 'gone') more.push(MI('nextVol', 'Принять следующий том', `AX.uiNextVol('${f.id}')`), MI('rebind', 'Изменить привязку', `AX.uiRebind('${f.id}')`),
      MI('label', 'Печать ярлыка', `AX.uiLabels(['${f.id}'])`), ownReq, MI('writeoff', 'Списать', `AX.uiWriteoff('${f.id}')`, 'danger'));
    if (more.length) h += `<div class="menu${S.menu ? ' open' : ''}" id="moreMenu"><button class="btn btn-secondary" data-testid="cb-more" onclick="event.stopPropagation();AX.toggleMenu()">Ещё ${ico('down')}</button><div class="menu-pop" data-testid="more-pop">${more.join('')}</div></div>`;
  }
  /* Кнопки сотрудника: запрос, держатель, передающий, получатель. Чужие по роли не показываются. */
  const own = [];
  if (t && t.to === u) own.push(B('got', 'Получил', `AX.uiGot('${f.id}')`, 'btn-primary'), B('notGot', 'Не получал', `AX.uiNotGot('${f.id}')`));
  if (i && i.holder === u) { own.push(t ? B('cancelTr', 'Отменить передачу', `AX.uiCancelTr('${f.id}')`) : B('transfer', 'Передать', `AX.uiTransfer('${f.id}')`)); own.push(B('askExt', 'Попросить продление', `AX.uiAskExt('${f.id}')`)); }
  if (!arch && !(i && (i.holder === u || (t && t.to === u)))) own.push(activeReqs(f.id).some(x => x.who === u) ? B('withdraw', 'Отозвать запрос', `AX.uiWithdraw('${f.id}')`) : B('request', 'Запросить', `AX.uiRequest('${f.id}')`, 'btn-primary'));
  /* Том дела из нескольких томов: «Запросить все тома» — как во врезке «Где бумага», одна форма на все. */
  const vols = allVols(f, u);
  if (!arch && vols.length >= 2) own.push(btn(`Запросить все тома (${vols.length})`, `AX.uiRequestBatch(${JSON.stringify(vols).replace(/"/g, "'")})`, { sm: false, tid: 'cb-allvols' }));
  if (own.length) h += (h ? '<span style="width:12px"></span>' : '') + own.join('');
  return h;
}
/* Тома того же дела (с этим), которые сотрудник может запросить. */
const allVols = (f, u = S.user) => [f, ...siblings(f)].filter(x => !x.gone && (kindOf(f.kind).bind || f.vol)).sort((a, b) => (a.vol || 1) - (b.vol || 1)).filter(x => gate('request', x.id, u).ok).map(x => x.id);

  let h = `<div class="cp-top"><span class="addr" data-testid="cp-addr">#/folder/${f.no}</span><button class="x" data-testid="cp-close" onclick="AX.closeCard()" title="Закрыть (Esc)">×</button></div><div class="cp-body">

    <div class="where ${w.over ? 'over' : w.st}" data-testid="where"><div class="w1">${esc(w.line)}</div>${w.sub ? `<div class="w2">${esc(w.sub)}</div>` : ''}${flags ? `<div class="flags">${flags}</div>` : ''}</div>
