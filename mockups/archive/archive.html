  clearSel() { S.sel.clear(); render(); },
  /* «Найти папку»: «Папки» с этим запросом; набран номер или найдена одна папка — сразу её карточка (как Enter в поиске «Папок»). */
  findFolder(q) {
    q = trim(q); S.view = 'folders'; S.q = q; S.chip = ''; Object.keys(S.f).forEach(k => { S.f[k] = ''; }); S.card = null; S.menu = false;
    const n = qNo(q), f = n != null ? byNo(n) : null, rows = q ? registry({ q }).rows : [], t = f || (rows.length === 1 ? rows[0] : null);
    if (t) return kbCard(t.id);
    S.focusQ = true; setHash(''); render(); return yes({ card: null });
  },
  /* Ссылки «Моих папок»: «Папки» с отбором подразделения или подразделения держателя (и плашкой). */
  openFolders(o = {}) { S.view = 'folders'; S.q = ''; S.chip = o.chip || ''; Object.keys(S.f).forEach(k => { S.f[k] = o[k] || ''; }); S.card = null; S.cardKb = false; S.menu = false; S.focusQ = true; setHash(''); render(); return yes(); },
  /* Журнал: период кнопкой или своими датами (правка даты снимает кнопку), плашка события — одна за раз. */
  setJ(k, v) {
    if (k === 'from' || k === 'to') { const iso = toIso(v); if (iso === null) { toast('Дата в формате ДД.ММ.ГГГГ', 'err'); render(); return no('дата в формате ДД.ММ.ГГГГ'); }
      const [f, t] = jRange(); S.jr.from = f; S.jr.to = t; S.jr[k] = iso; S.jr.per = ''; }
    else if (k === 'per') { S.jr.per = v; S.jr.from = ''; S.jr.to = ''; }
    else if (k === 'kind') S.jr.kind = S.jr.kind === v ? '' : v;
    else S.jr[k] = v;
    render(); return yes();
  },
  setJq(q) { S.jr.q = q; const el = $('#jList'); if (el) el.innerHTML = journalList(); },
  /* Enter в поиске журнала: номер или единственная найденная папка — её карточка (история по выдачам). */
  journalEnter() {
    const q = trim(S.jr.q), n = qNo(q), f = n != null ? byNo(n) : null, fs = q ? FOLDERS.filter(x => matchQ(x, q)) : [];
    const t = f || (fs.length === 1 ? fs[0] : null);
    if (!t) { const r = no(q ? `найдено папок: ${fs.length} — выберите строку` : 'наберите номер, название или ИНН'); toast(r.why, 'err'); return r; }
    return kbCard(t.id);
  },
  journalAll() { S.jr.per = 'all'; S.jr.from = ''; S.jr.to = ''; S.jr.kind = ''; S.jr.emp = ''; S.jr.dept = ''; S.focusJ = true; render(); return yes(); },
  toggleRowMenu(key) { S.rowMenu = S.rowMenu === key ? null : key; render(); },
  closeRowMenu() { S.rowMenu = null; render(); },
  setNk(k, v) { S.nk[k] = v; render(); },
  setTab(t) { S.tab = t; render(); },
  setPb(b) { S.pb = b; render(); },
  openBorrower(b) { S.pb = b; S.view = 'borrower'; S.card = null; render(); },
  retInput(t) { S.ret.text = t; if (trim(t)) S.ret.done = null; renderRet(); },
  retNote(id, t, mode) { (mode === 'b' ? S.retB : S.ret).notes[id] = t; },
  retOpenNote(id, mode) { const st = mode === 'b' ? S.retB : S.ret; st.open[id] = true; if (mode === 'b') renderModal(); else renderRet();
    const f = folder(id), el = document.querySelector(`[data-testid="ret-note-${f.no}"]`); if (el) el.focus(); },
  /* Поле «Возврат»: принять все строки на руках; итог — под полем, курсор остаётся в поле. */
  uiReturnBatch() {
    S.focusRet = true;
    const rows = returnLookup(S.ret.text).filter(r => r.ok); if (!rows.length) return say(no('нет папок к возврату'));
    const r = acceptReturnBatch(rows.map(x => x.id), S.ret.notes);
    if (r.ok) { S.ret = { text: '', notes: {}, open: {}, done: rows.filter(x => r.done.includes(x.id)).map(x => ({ id: x.id, kind: x.hint.kind, text: x.hint.text })) };
      r.msg = `Принято возвратом: ${r.done.length}${r.skipped.length ? ', не принято ' + r.skipped.length : ''}`; }
    return say(r);
  },
  toggleMenu() { S.menu = !S.menu; const m = $('#moreMenu'); if (m) m.classList.toggle('open', S.menu); },
  closeMenu() { S.menu = false; const m = $('#moreMenu'); if (m) m.classList.remove('open'); },
  /* Печать: у ярлыков — следующая свободная позиция листа подставится при следующей печати. */
  printGo() {
    const P = S.print; if (P && P.startErr) return no(P.startErr); let msg = 'Отправлено на печать';
    if (P && P.kind === 'labels') { const n = P.L.length, last = P.start - 1 + n, sh = Math.ceil(last / LABELS_PER_SHEET); S.labelNext = last % LABELS_PER_SHEET + 1;
      msg = `Отправлено на печать: ${n} ${plural(n, 'ярлык', 'ярлыка', 'ярлыков')}, ${sh} ${plural(sh, 'лист', 'листа', 'листов')}; следующий ярлык — с позиции ${S.labelNext}`; }
    toast(msg, 'ok'); closeForm(); return yes({ msg });
  },
  uiExcel(name, n) { const r = yes({ msg: `Выгружен файл «${name} на ${fmt(S.today)}.xlsx» — ${n} ${plural(n, 'строка', 'строки', 'строк')}, колонки как на экране` }); toast(r.msg, 'ok'); return r; },
});

seed();
if (typeof window !== 'undefined') window.AX = AX;
if (typeof document !== 'undefined') {
  fromHash(true); S.focusRet = S.view === 'queue'; S.focusMine = S.view === 'mine'; render();
  window.addEventListener('hashchange', () => { if (fromHash(false)) render(); });
  document.addEventListener('click', e => { if (S.menu && !e.target.closest('.menu')) AX.closeMenu(); if (S.rowMenu && !e.target.closest('.menu')) { S.rowMenu = null; render(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (S.rowMenu) { S.rowMenu = null; render(); } else if (S.menu) AX.closeMenu(); else if (S.form || S.print) closeForm(); else if (S.card) closeCard(); return; }
    /* Карточка держит курсор: Tab ходит по её кнопкам и ссылкам по кругу, под карточку не уходит. */
    const cp = $('#cardpanel');
    if (e.key === 'Tab' && S.card && !S.form && !S.print && cp.contains(document.activeElement)) {
      const all = [...cp.querySelectorAll('button,summary,input,select,textarea,a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
      const els = all.filter(el => !el.classList.contains('x')).concat(all.filter(el => el.classList.contains('x')));  /* «×» — последним: первый Tab встаёт на главную кнопку */
      if (!els.length) return; const k = els.indexOf(document.activeElement);
      e.preventDefault(); els[k < 0 ? (e.shiftKey ? els.length - 1 : 0) : (k + (e.shiftKey ? -1 : 1) + els.length) % els.length].focus(); return;
    }
    const md = $('#modal'); if (!(S.form || S.print)) return;
    /* Окно держит курсор: Tab ходит по его полям и кнопкам по кругу, под окно не уходит. */
    if (e.key === 'Tab') {
      const els = [...md.querySelectorAll('input,select,textarea,button')].filter(el => !el.disabled && el.offsetParent !== null);
      if (!els.length) return; const k = els.indexOf(document.activeElement);
      e.preventDefault(); els[k < 0 ? (e.shiftKey ? els.length - 1 : 0) : (k + (e.shiftKey ? -1 : 1) + els.length) % els.length].focus(); return;
    }
    /* Окно печати: Enter в поле (позиция ярлыка) — «Печать». */
    if (e.key === 'Enter' && S.print && !S.print.noPrint && e.target.tagName !== 'BUTTON') { e.preventDefault(); AX.printGo(); return; }
    /* Enter — главная кнопка окна; в многострочном поле — Ctrl+Enter; на кнопке Enter нажимает её саму. */
    if (e.key === 'Enter' && S.form) {
      const t = e.target; if (t.tagName === 'BUTTON' && md.contains(t)) return; if (t.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
      e.preventDefault(); const b = md.querySelector('[data-primary]'); if (b && !b.disabled) b.click();
    }
  });
}
</script>
