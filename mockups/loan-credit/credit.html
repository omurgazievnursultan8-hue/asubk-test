  CR.openRegisterModal=function(){ const c=modalGuard('register'); if(!c) return; const d=derive(c, cardAsOf);
    const g=gate(c,'register',{});
    const body=`<p class="section-note">Регистрация договора: реквизиты договора и регистрации, собранный обязательный комплект документов программы и пройденная проверка обеспеченности.</p>
      ${g.ok?`<div class="info-plate">${svgInfo()}<div>Все условия выполнены.</div></div>`
            :`<div class="warn-inline">${svgInfo()}<div>${g.reasons.map(esc).join('<br>')}</div></div>`}
      <div class="mform">
        <div class="field req"><span class="flabel">№ регистрации</span><div class="control"><input id="rgNum" value="${esc(c.reg.num||c.num||'')}"></div></div>
        <div class="field req"><span class="flabel">Дата регистрации</span><div class="control"><input id="rgDate" type="date" value="${esc(toISO(c.reg.date||CR.TODAY))}"></div></div>
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Обязательный комплект — программа ${esc(c.origin.programId||'—')}</div>
      <div class="cat-expand">${d.docs.required.map(r=>`<div class="row"><span class="ck">${esc(r.kind)}</span>
        ${r.ok?'<span class="pill low">закрыт</span>':'<span class="pill high">не закрыт</span>'}</div>`).join('')}</div>`;
    CR.openModal('Зарегистрировать договор', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitRegister()">Зарегистрировать</button>`);
  };
  CR.submitRegister=function(){ const c=modalGuard('register'); if(!c) return;
    const r=CR.registerCredit(c,{ regNum:document.getElementById('rgNum').value, regDate:toDMY(document.getElementById('rgDate').value) });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Договор зарегистрирован — ЖЦ «Зарегистрирован»','ok'); rerenderDetail(); };

  /* 13) активация (activateCredit, Г-22) — «Зарегистрирован» → «Действует» */
  CR.openActivateModal=function(){ const c=modalGuard('activate'); if(!c) return; const d=derive(c, cardAsOf);
    const g=gate(c,'activate',{});
    const body=`<p class="section-note">Кредит начинает действовать с первого освоения. С состоянием «Действует» связаны условия освоения и изменения условий только зарегистрированным основанием.</p>
      ${g.ok?`<div class="info-plate">${svgInfo()}<div>Освоено ${money(d.disbursed)} — условие выполнено.</div></div>`
            :`<div class="warn-inline">${svgInfo()}<div>${g.reasons.map(esc).join('<br>')}</div></div>`}`;
    CR.openModal('Перевести в «Действует»', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitActivate()">Перевести</button>`, {cls:'narrow'});
  };
  CR.submitActivate=function(){ const c=modalGuard('activate'); if(!c) return;
    const r=CR.activateCredit(c); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('ЖЦ переведён в «Действует»','ok'); rerenderDetail(); };

  /* 14) закрытие неосвоенного остатка (closeDisbursement, Р-6) */
  CR.openCloseDisbModal=function(){ const c=modalGuard('closeDisbursement'); if(!c) return; const d=derive(c, cardAsOf);
    const body=`<p class="section-note">Действие кредита: неосвоенный остаток закрывается, дальнейшее освоение блокируется, сам кредит продолжает действовать. Отменить нельзя — только новым траншем.</p>
      <div class="mform">
        <div class="field"><span class="flabel">Сумма к закрытию</span><div class="control"><input value="${esc(money(d.undisbursed))}" readonly></div></div>
        <div class="field"><span class="flabel">Документ</span><div class="control"><input id="cdDoc" placeholder="решение / письмо"></div></div>
        <div class="field req col-span"><span class="flabel">Основание</span><textarea id="cdReason" class="note-area" placeholder="истёк срок освоения; заёмщик отказался; ..."></textarea></div>
      </div>`;
    CR.openModal('Закрыть неосвоенный остаток', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitCloseDisb()">Закрыть остаток</button>`);
  };
  CR.submitCloseDisb=function(){ const c=modalGuard('closeDisbursement'); if(!c) return;
    const r=CR.closeDisbursement(c,{ reason:document.getElementById('cdReason').value, doc:document.getElementById('cdDoc').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Неосвоенный остаток закрыт','ok'); rerenderDetail(); };

  /* 15) soft-close транша (closeTranche, Г-17) — удаления нет, есть закрытие с основанием */
  CR.openCloseTrancheModal=function(){ const c=modalGuard('closeTranche'); if(!c) return;
    const sel=c.tranches.find(t=>t.no===detailTrancheNo)||c.tranches[0];
    const body=`<p class="section-note">Транши не удаляются. Закрытый транш выпадает из агрегатов срока и условий, но остаётся в истории со своими освоениями и графиком. Последний активный транш закрыть нельзя.</p>
      <div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="ctNo">${c.tranches.filter(t=>!t.closed).map(t=>`<option value="${t.no}"${sel&&t.no===sel.no?' selected':''}>№${t.no} · сумма ${money(t.amount)} · освоено ${money(disbursedSum(t))}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field"><span class="flabel">Дата закрытия</span><div class="control"><input id="ctDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field req col-span"><span class="flabel">Основание</span><textarea id="ctReason" class="note-area" placeholder="заёмщик отказался от транша; ..."></textarea></div>
      </div>`;
    CR.openModal('Закрыть транш', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitCloseTranche()">Закрыть транш</button>`);
  };
  CR.submitCloseTranche=function(){ const c=modalGuard('closeTranche'); if(!c) return;
    const no=+document.getElementById('ctNo').value;
    const r=CR.closeTranche(c,{ trancheNo:no, date:toDMY(document.getElementById('ctDate').value), reason:document.getElementById('ctReason').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Транш №'+no+' закрыт','ok'); rerenderDetail(); };

  /* 16) перевод долга (transferDebt, Г-16) — owned кредитом, не «в модуле-владельце» */
  CR.openTransferModal=function(){ const c=modalGuard('transferDebt'); if(!c) return;
    const body=`<p class="section-note">Смена заёмщика — действие кредита, только зарегистрированным соглашением. Прежний заёмщик уходит в запись перевода, сам перевод — в append-only журнал.</p>
      <div class="mform">
        <div class="field"><span class="flabel">Текущий заёмщик</span><div class="control"><input value="${esc(c.borrower.name)}" readonly></div></div>
        <div class="field req"><span class="flabel">Новый заёмщик — наименование</span><div class="control"><input id="tdName" placeholder="ОсОО «...»"></div></div>
        <div class="field req"><span class="flabel">Новый заёмщик — ИНН</span><div class="control"><input id="tdInn" placeholder="14 знаков"></div></div>
        <div class="field req"><span class="flabel">№ соглашения</span><div class="control"><input id="tdNum" placeholder="ДС-ПД-..."></div></div>
        <div class="field req"><span class="flabel">Дата соглашения</span><div class="control"><input id="tdDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="tdScan" placeholder="ds-pd.pdf"></div></div>
        <div class="field col-span"><span class="flabel"><label><input type="checkbox" id="tdReg"> Соглашение зарегистрировано</label></span>
          <div class="control"><input value="без отметки о регистрации перевод не оформляется" readonly></div></div>
      </div>`;
    CR.openModal('Перевод долга — смена заёмщика', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitTransfer()">Оформить перевод</button>`);
  };
  CR.submitTransfer=function(){ const c=modalGuard('transferDebt'); if(!c) return;
    const ctx={ newBorrower:{ name:document.getElementById('tdName').value, inn:document.getElementById('tdInn').value },
      agreement:{ num:document.getElementById('tdNum').value, date:toDMY(document.getElementById('tdDate').value),
                  scan:document.getElementById('tdScan').value, registered:document.getElementById('tdReg').checked } };
    const r=CR.transferDebt(c,ctx); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Перевод долга оформлен: '+ctx.newBorrower.name,'ok'); rerenderDetail(); };

  /* 17) документ досье (saveDoc, право editDocs) */
  CR.openDocModal=function(kind){ const c=modalGuard('editDocs'); if(!c) return;
    const cur=(c.docs||[]).find(x=>x.kind===kind)||null;
    const prog=programDocs(c), isReq=prog.req.includes(kind);
    const body=`<p class="section-note">${isReq?'<b>Обязательный</b> документ комплекта программы '+esc(c.origin.programId||'—')+'. ':''}Закрывают требование только состояния «принят» и «не требуется».</p>
      <div class="mform">
        <div class="field"><span class="flabel">Вид</span><div class="control"><input id="dcKind" value="${esc(kind||'')}" ${kind?'readonly':''}></div></div>
        <div class="field"><span class="flabel">Наименование</span><div class="control"><input id="dcName" value="${esc((cur&&cur.name)||kind||'')}"></div></div>
        <div class="field req"><span class="flabel">Состояние</span><div class="control"><select id="dcState">${DOC_STATES.map(s=>`<option${cur&&cur.state===s?' selected':''}>${esc(s)}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field"><span class="flabel">Дата</span><div class="control"><input id="dcDate" type="date" value="${esc(toISO((cur&&cur.date)||CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Файл</span><div class="control"><input id="dcFile" value="${esc((cur&&cur.file)||'')}" placeholder="file.pdf"></div></div>
        <div class="field col-span"><span class="flabel">Примечание</span><div class="control"><input id="dcNote" value="${esc((cur&&cur.note)||'')}"></div></div>
      </div>`;
    CR.openModal(cur?'Изменить документ':'Загрузить документ', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitDoc()">Сохранить</button>`);
  };
  CR.submitDoc=function(){ const c=modalGuard('editDocs'); if(!c) return;
    const r=CR.saveDoc(c,{ kind:document.getElementById('dcKind').value, name:document.getElementById('dcName').value,
      state:document.getElementById('dcState').value, date:toDMY(document.getElementById('dcDate').value),
      file:document.getElementById('dcFile').value, note:document.getElementById('dcNote').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Документ сохранён','ok'); rerenderDetail(); };

  /* 18) примечание (addNote) — кнопка была мертва под всеми ролями */
  CR.openNoteModal=function(){ const c=modalGuard('addNote'); if(!c) return;
    const body=`<p class="section-note">Человеческая заметка куратора или подразделения — редактируемая, в отличие от append-only журнала.</p>
      <div class="mform">
        <div class="field"><span class="flabel">Тип</span><div class="control"><select id="ntType">
          ${['Обычное','Примечание куратора','Примечание (ОПП)','Примечание (залог)','Примечание (ОИП)'].map(t=>`<option>${esc(t)}</option>`).join('')}
        </select><span class="caret">▾</span></div></div>
        <div class="field req col-span"><span class="flabel">Текст</span><textarea id="ntText" class="note-area" placeholder="..."></textarea></div>
      </div>`;
    CR.openModal('Добавить примечание', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitNote()">Сохранить</button>`);
  };
  CR.submitNote=function(){ const c=modalGuard('addNote'); if(!c) return;
    const r=CR.addNote(c,{ type:document.getElementById('ntType').value, text:document.getElementById('ntText').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Примечание добавлено','ok'); rerenderDetail(); };

  /* 19) целевое использование (addTargetUse, Р-15) — право targetUse без единой кнопки */
  CR.openTargetUseModal=function(){ const c=modalGuard('targetUse'); if(!c) return;
    const body=`<p class="section-note">Мера реагирования по нецелевому использованию требует ссылки на решение Комитета: последствие не наступает без документа-основания.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид записи</span><div class="control"><select id="tuKind" onchange="document.getElementById('tuCommWrap').style.display=(this.value==='measure'?'':'none')">
          <option value="doc">Подтверждающий документ</option><option value="check">Проверка</option><option value="measure">Мера реагирования</option>
        </select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="tuDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field col-span"><span class="flabel">Содержание</span><div class="control"><input id="tuTitle" placeholder="счёт-фактура / выездная проверка / требование"></div></div>
        <div class="field"><span class="flabel">Результат</span><div class="control"><input id="tuResult" placeholder="принято / соответствует / направлено"></div></div>
        <div class="field"><span class="flabel">Файл</span><div class="control"><input id="tuFile" placeholder="file.pdf"></div></div>
        <div class="field col-span" id="tuCommWrap" style="display:none"><span class="flabel">Решение Комитета (обязательно для меры)</span><div class="control"><input id="tuComm" placeholder="ККР-... от дд.мм.гггг"></div></div>
      </div>`;
    CR.openModal('Целевое использование', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitTargetUse()">Сохранить</button>`);
  };
  CR.submitTargetUse=function(){ const c=modalGuard('targetUse'); if(!c) return;
    const r=CR.addTargetUse(c,{ kind:document.getElementById('tuKind').value, date:toDMY(document.getElementById('tuDate').value),
      title:document.getElementById('tuTitle').value, result:document.getElementById('tuResult').value,
      file:document.getElementById('tuFile').value, committeeRef:document.getElementById('tuComm').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Запись целевого использования добавлена','ok'); rerenderDetail(); };

  /* 20) расторжение (closeCredit «Расторгнут») — третье основание канона §3 */
  CR.openTerminateModal=function(){ const c=modalGuard('terminate'); if(!c) return; const d=derive(c, cardAsOf);
    const body=`<p class="section-note">Третье основание закрытия. В отличие от «Погашен», нулевой остаток не требуется — но остаток не исчезает: он переходит во взыскание. Реквизиты соглашения или решения обязательны.</p>
      ${d.debtBalance>0?`<div class="warn-inline">${svgInfo()}<div>Остаток на дату среза: <b>${money(d.debtBalance)}</b>. После расторжения он остаётся к взысканию.</div></div>`:''}
      <div class="mform">
        <div class="field req"><span class="flabel">Вид документа</span><div class="control"><input id="tmKind" value="Соглашение о расторжении"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="tmNum" placeholder="СР-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="tmDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Скан</span><div class="control"><input id="tmScan" placeholder="sr.pdf"></div></div>
        <div class="field req col-span"><span class="flabel">Основание</span><textarea id="tmReason" class="note-area" placeholder="существенное нарушение условий; соглашение сторон; ..."></textarea></div>
      </div>`;
    CR.openModal('Расторжение договора', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-tint danger" onclick="CR.submitTerminate()">Расторгнуть</button>`);
  };
  CR.submitTerminate=function(){ const c=modalGuard('terminate'); if(!c) return;
    const doc={ kind:document.getElementById('tmKind').value, num:document.getElementById('tmNum').value,
      date:toDMY(document.getElementById('tmDate').value), scan:document.getElementById('tmScan').value };
    const r=CR.closeCredit(c,{ reason:'Расторгнут', doc, note:document.getElementById('tmReason').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Договор расторгнут','ok'); rerenderDetail(); };

  /* экспорт DOM-обвязки на CR (onclick-строки разметки живут в глобальной области) */
  CR._sel = null;
  CR.renderList = renderList; CR.renderRows = renderRows; CR.renderRole = renderRole;
  CR.onRegionChange = onRegionChange; CR.resetFilters = resetFilters; CR.sortList = sortList;
  CR.gotoPage = gotoPage; CR.setPageSize = setPageSize;
  CR.selectRow = selectRow; CR.openDetail = openDetail; CR.backToList = backToList;
  CR.resetDemo = resetDemo; CR.openCreatePicker = openCreatePicker; CR.pickApplication = pickApplication;

  /* гамбургер сворачивает сайдбар — освобождает ширину под таблицы (реестр/расчёты). */
  window.toggleNav = function(){ document.querySelector('.app').classList.toggle('nav-collapsed'); };

  /* split-меню (печатные формы) закрывается кликом мимо — карточка перерисовывается
     целиком, поэтому слушатель вешается один раз на документ, а не на кнопку. */
  document.addEventListener('click', e => {
    document.querySelectorAll('.split.open').forEach(s => { if (!s.contains(e.target)) s.classList.remove('open'); });
  });

  renderNav();
  renderList();          // реестр §5.1 (Р-19); карточка (8 вкладок) — Task 7
  openFromHash();        // восстановить экран (кредит+вкладка) после F5 — по location.hash
  window.addEventListener('hashchange', openFromHash);
}

</script>
</body>
