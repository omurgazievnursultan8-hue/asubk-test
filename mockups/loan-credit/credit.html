  /* ---- ВКЛАДКА 3: Состав ----
     Предмет вкладки — СОСТАВ КРЕДИТА: реестр траншей как единиц учёта (CONTEXT.md «Транш»)
     и то, как между ними разошлась сумма договора.
     До КВ-33 предметов было два. Экран собирался под канон «Транши — сколько выдали»
     (:6573), а КВ-26 принесла на него движение тела — переносы по ДС и зеркало погашений, —
     которое про выдачу не говорит вовсе: половина вкладки отвечала на вопрос «сколько
     денег ушло заёмщику», половина на «что стало с телом долга». КВ-33 свела их к одному
     предмету, оставив тело здесь как одну из величин единицы.
     КВ-36 ДОВЕЛА РАЗДЕЛЕНИЕ ДО КОНЦА: тело — величина ДОЛГА, а не состава, и уехало на
     «Расчёты» вместе с ИР-3 и зеркальными строками погашений. Здесь остались только свои
     факты кредитного модуля: сколько роздано (Сумма), сколько выдано (Освоено), сколько
     ещё предстоит выдать (Не освоено), откуда единица взялась (Происхождение) и журнал
     двух операций, которые её меняют, — освоения и переноса по ДС. Замков на вкладке нет
     ни одного: чужое живёт на вкладке владельца. */
  function tabTranshi(c,d){
    const sel=scopeTranche(c);
    const cur=c.currency, isFx=cur!=='KGS', fx=FX[cur]||1;              // мультивалюта: ≈KGS только для не-KGS
    /* Колонка «Субъект» — УСЛОВНАЯ (КВ-33). У обычного кредита во всех строках стоит один
       и тот же заёмщик из шапки карточки, и колонка тратит ширину на повтор шапки.
       Различаются субъекты только у группового кредита, где транш несёт члена группы, а не
       заёмщика договора (CONTEXT.md «Транш»). Меряем по ИНН, а не по имени: имя — это
       написание, тождество субъекта несёт ИНН. */
    const multiSubj=new Set(c.tranches.map(t=>t.subject.inn)).size>1;
    const trRows=c.tranches.map(t=>{
      const der=trancheOrigin(t)==='разделение', s=disbursedSum(t);
      /* «Не освоено» вместо «Остатка тела» (КВ-36). Остаток тела — величина ДОЛГА: он
         зависит от погашений, то есть от чужого модуля, и держать его здесь значило
         тащить на вкладку зеркало платежей ради одной колонки. Он переехал в «Расчёты»,
         где развёрнут четырьмя слагаемыми ИР-3. Здесь остаётся вопрос вкладки — сколько
         из розданного по договору ещё не выдано. У производного транша прочерк: осваивать
         его не будут вовсе (ADR-0115), и «не освоено = вся сумма» читалось бы как долг
         по выдаче, которого нет. */
      const undis=der?null:round2((t.amount||0)-s), on=sel&&t.no===sel.no;
      /* Колонка «Курс» снята (КВ-33): курс у кредита один на все транши (FX, :1703), и
         колонка повторяла одно и то же число во всех строках. Число не потеряно — стоит
         в строке-контексте, где живут величины уровня кредита. */
      const fxCells=isFx?`<td style="text-align:right">${money0(toKgs(t.amount,cur))}</td>`:'';
      /* Закрытый транш (Г-17): не удалён, а помечен — с датой и основанием. Прежде
         activeTranche(t) читал t.closed, но выставить его было нечем (КР-3).
         Ярлык переехал к НОМЕРУ транша из снятой колонки «Состояние» (КВ-33): та мешала
         два разных факта — стадию освоения (выводится из «Сумма» и «Освоено», ADR-0001) и
         закрытие. Первое ушло как производное, второе осталось меткой на самом предмете. */
      const closedPill = t.closed
        ? `<br><span class="pill neutral" title="${jsAttr('Закрыт '+(t.closed.date||'')+': '+(t.closed.reason||''))}">Закрыт ${esc(t.closed.date||'')}</span>` : '';
      const inTr=originTransfer(t), parent=inTr?inTr.counterTranche:null;
      /* Пилюля происхождения — «info», НЕ «warn»: класс .warn (:1608) это блочная
         плашка-алерт (display:flex, красный фон), а не вариант пилюли, и «pill warn»
         ловил её вместо цвета. Разделение по ДС — штатный способ рождения транша
         (ADR-0092 §1), красным ему гореть не за что. */
      const orig = der
        ? `<span class="pill info" title="${jsAttr('Транш рождён разделением по '+(originDs(t)||'ДС')+' (ADR-0092 §1): сумма пришла переносом с транша №'+parent+', а не выдачей')}">разделение по ДС</span>`
          + `<br><span style="color:var(--text-muted);font-size:11px">${esc(originDs(t)||'ДС')} · из №${parent}</span>`
        : `<span class="pill neutral" title="${jsAttr('Транш рождён освоением — деньги выданы по этому траншу')}">освоение</span>`;
      /* «Освоено» у производного — ПРОЧЕРК, а не 0: ноль читается как «деньги не
         выдавали», тогда как они выданы на родителе и второй раз выданы не будут (Г-4). */
      const disbCell = der
        ? `<td style="text-align:right;color:var(--text-muted)" title="${jsAttr('Производный транш не осваивается: сумма пришла переносом по '+(originDs(t)||'ДС'))}">—</td>`
        : `<td style="text-align:right">${money(s)}</td>`;
      const undisCell = der
        ? `<td style="text-align:right;color:var(--text-muted)" title="${jsAttr('Производный транш освоению не подлежит (ADR-0115): его сумма пришла переносом по '+(originDs(t)||'ДС')+', выдачи по нему не будет')}">—</td>`
        : `<td style="text-align:right">${money(undis)}</td>`;
      /* «Закрыть транш» — иконка В СТРОКЕ (КВ-33; правило КВ-25/КВ-32: действие живёт у
         своего предмета). Кнопка тулбара имя транша брала из области в шапке и при области
         «по кредиту» гасла с объяснением — у действия, адресующего одну строку, агрегата
         нет. В строке имя есть всегда, и отказ Г-33 («нельзя закрыть последний активный
         транш», :5134) объясняется тултипом самой иконки. У закрытого иконки нет: закрывать
         второй раз нечего, а серый крестик читался бы как «можно, но не вам». */
      const actCell=`<td style="text-align:right">${t.closed?''
        :actIconBtn(c,'closeTranche',{trancheNo:t.no,reason:'—'},'Закрыть транш №'+t.no,`CR.openCloseTrancheModal(${t.no})`,svgClose())}</td>`;
      const subjCell=multiSubj
        ? `<td>${esc(t.subject.name)}<br><span style="color:var(--text-muted);font-size:11px">ИНН ${esc(t.subject.inn)}</span></td>` : '';
      return `<tr style="cursor:pointer${on?';background:var(--asubk-nav-active)':''}${t.closed?';opacity:.6':''}" onclick="CR.setCardScope(${t.no})">
        <td>№${t.no}${closedPill}</td>${subjCell}
        <td>${orig}</td>
        <td style="text-align:right">${money(t.amount)}${isFx?` <span style="color:var(--text-muted);font-size:11px">${esc(cur)}</span>`:''}</td><td>${esc(t.plannedDate)}</td>
        ${disbCell}${undisCell}
        ${fxCells}${actCell}</tr>`;
    });
    const trCols=[{h:'Транш'}].concat(multiSubj?[{h:'Субъект'}]:[])
      .concat([{h:'Происхождение'},{h:'Сумма',r:1},{h:'План. дата'},{h:'Освоено',r:1},
               {h:'Не освоено',r:1,t:'сумма транша − освоено: сколько по нему ещё предстоит выдать. Погашения и переносы сюда не входят — что осталось по долгу, считают «Расчёты»'}])
      .concat(isFx?[{h:'≈KGS суммы',r:1}]:[]).concat([{h:''}]);
    /* Итог освоения складывает ТОЛЬКО траншы происхождением «освоение» (ADR-0115):
       производный выдачей не был, и его сумма в объёме выдачи раздувала бы отчётность
       ровно на величину реструктуризаций. */
    const tot=c.tranches.reduce((a,t)=>{if(trancheOrigin(t)!=='разделение'){
      a.amt+=t.amount||0;a.dis+=disbursedSum(t);a.undis+=round2((t.amount||0)-disbursedSum(t));}
      return a;},{amt:0,dis:0,undis:0});
    /* Имя итога — «Итого», а не «Итого освоено» (КВ-33): строка складывает три разные
       величины, и только одна из них освоение. С КВ-36 все три считаются по ОДНОМУ
       правилу — по траншам происхождением «освоение», — потому что все три отвечают на
       один вопрос: как разошлась сумма договора. Прежняя оговорка «(остаток тела — по
       всем)» ушла вместе с колонкой: тело живёт на «Расчётах». */
    const totRow=c.tranches.length?`<tr style="font-weight:var(--weight-semibold);background:var(--surface-panel)">
      <td colspan="${multiSubj?3:2}">Итого<span style="font-weight:var(--weight-regular);color:var(--text-muted);font-size:11px"> · по траншам происхождением «освоение»</span></td>
      <td style="text-align:right">${money(tot.amt)}</td><td></td>
      <td style="text-align:right">${money(tot.dis)}</td><td style="text-align:right">${money(tot.undis)}</td>
      ${isFx?`<td style="text-align:right">${money0(toKgs(tot.amt,cur))}</td>`:''}<td></td></tr>`:'';
    /* ОСВОЕНИЕ И ПЕРЕНОСЫ (КВ-26, расширено КВ-33, сужено КВ-36) — слитый вид по дате
       СВОИХ фактов кредита: освоения и переносы по ДС в обе стороны. Слитая таблица —
       та же идиома, что вид «по кредиту» на «Графике» (КВ-17).
       КВ-33 сняла с секции два ограничения: освоения перестали быть отдельной таблицей
       (один факт стоял на экране дважды) и секция стала рисоваться всегда, а не только
       при переносах — отсутствие читалось как «движения по траншу не бывает».
       КВ-36 УБРАЛА ОТСЮДА ПОГАШЕНИЯ ТЕЛА. Они приходили зеркалом платежей и стояли здесь
       ради колонки «Остаток тела»; колонка уехала на «Расчёты» — уехала и причина. Правило,
       которое волна закрепляет: вкладка показывает то, чем владеет сама, чужое — на вкладке
       владельца. На «Составе» после этого нет ни одного замка. */
    const movRows=(sel?[sel]:c.tranches).flatMap(t=>[
      /* Реквизиты освоения (ПП · назначение · документ) сведены в «Основание» ОДНОЙ фразой:
         три отдельные колонки, пустые у всех прочих видов движения, стоили экрану больше,
         чем сообщали. Порядок — от того, чем платёж опознаётся, к тому, чем обоснован. */
      ...(t.disbursements||[]).map(x=>({ t, date:x.date, kind:'Освоение', amount:x.amount, sign:'+',
        note:['ПП '+(x.order||'—'), x.purpose, x.doc].filter(Boolean).join(' · ') })),
      ...(t.transfers||[]).map(x=>({ t, date:x.date, kind:x.dir==='out'?'Перенос по ДС':'Принято по ДС',
        amount:x.amount, sign:x.dir==='out'?'−':'+',
        note:(x.basis&&x.basis.ds||'ДС')+' · '+(x.dir==='out'?'на транш №':'с транша №')+x.counterTranche }))
    ]).sort((a,b)=>pd(a.date)-pd(b.date)||a.t.no-b.t.no).map(r=>`<tr>
      <td>${esc(r.date)}</td>${sel?'':`<td>№${r.t.no}</td>`}<td>${esc(r.kind)}</td>
      <td style="text-align:right">${r.sign} ${money(r.amount)}</td>
      ${isFx?`<td style="text-align:right">${money0(toKgs(r.amount,cur))}</td>`:''}
      <td>${esc(r.note)}</td></tr>`);
    const movCols=[{h:'Дата'}].concat(sel?[]:[{h:'Транш'}]).concat([{h:'Движение'},{h:'Сумма',r:1}])
      .concat(isFx?[{h:'≈KGS',r:1}]:[]).concat([{h:'Основание'}]);
    /* СТРОКА-КОНТЕКСТ ВМЕСТО ЧЕТЫРЁХ ПЛИТОК (идиома КВ-27). Из прежней сетки «Одобрено ·
       Сумма договора · Распределено · Доступно» две плитки повторяли шапку карточки
       (:6917 — сумма договора и освоение процентом), «Распределено» повторяло итог-строку
       таблицы прямо под собой, а «Одобрено» на вкладке про состав не работало вовсе:
       сумма договора уже согласована, и сравнивать её с одобренной — вопрос «Договора».
       Уникальным осталось одно «доступно к распределению» — ради одного числа сетка не
       заводится: одна фраза, где число стоит рядом со своим действием.
       Величины считает creditDerived (:4979–4983) — не пересчитываем. */
    const disbClosed=c.closure&&c.closure.disbClosed;
    const ctxParts=[`Распределено <b>${money(d.allocated)}</b> из <b>${money(c.contractAmount)}</b>`];
    /* После закрытия неосвоенного остатка «доступно» не называем: раздавать больше нечего,
       и оставшееся на экране число обещало бы дверь, которую Г-32 уже закрыл. */
    if(!disbClosed) ctxParts.push(d.allocatable>0?`доступно <b>${money(d.allocatable)}</b>`:'договор распределён полностью');
    if(d.derivedCount) ctxParts.push(`+ ${d.derivedCount} производн${d.derivedCount===1?'ый':'ых'} на ${money(d.derivedSum)} (перенос по ДС, в распределение не входят)`);
    if(isFx) ctxParts.push(`курс ${money(fx)} ${esc(cur)}/KGS`);
    /* Прежняя плашка про закрытый остаток (info-plate) свёрнута сюда же: факт уровня
       кредита, и место ему там же, где прочие величины уровня кредита. */
    const ctxNote=`<p class="section-note">${ctxParts.join(' · ')}${
      disbClosed
        ? `<br>Неосвоенный остаток <b>${money(disbClosed.amount)}</b> закрыт <b>${esc(disbClosed.date)}</b> (${esc(disbClosed.reason)}) — дальнейшее освоение по кредиту заблокировано, сам кредит продолжает действовать.`
        : ` <span style="margin-left:4px">${actBtn(c,'closeDisbursement',{reason:'—'},'Закрыть неосвоенный остаток','CR.openCloseDisbModal()')}</span>`}</p>`;
    /* ТУЛБАРА НЕТ (КВ-33). Четыре кнопки в общей полосе адресовали четыре разных предмета —
       кредит, транш и журнал движения, — и различить, что к чему, можно было только по
       подписи; на «Закрыть транш» это стоило десяти строк объяснения, почему кнопка гаснет.
       Каждое действие переехало к своему предмету (правило КВ-25/КВ-32): «Добавить транш» —
       в заголовок реестра, «Внести освоение» — в заголовок движения, «Закрыть транш» —
       иконкой в строку, «Закрыть неосвоенный остаток» — в строку-контекст, к распределению.
       «Внести освоение» транша не именует — его спрашивает модалка своим селектом,
       предвыбранным по actionTranche (тем же, чем мерится гейт кнопки), — поэтому кнопка
       остаётся и при области «по кредиту» и ни о чём не врёт. */
    return `
      <div class="section-h" style="display:flex;align-items:center;justify-content:space-between;gap:12px">Транши (клик — выбор)
        ${roleBtn('addTranche','Добавить транш','CR.openTrancheModal()')}</div>
      ${ctxNote}
      ${cgrid(trCols, trRows.concat(totRow?[totRow]:[]), {empty:'Траншей нет'})}
      ${/* Заголовок называет ОБЛАСТЬ целиком — «по кредиту» / «по траншу №N» (КВ-17), а не
           дописывает «(по кредиту)» скобкой к имени транша: скобка читалась как уточнение
           к траншу, тогда как это другой охват таблицы, со своей колонкой «Транш».
           Имя секции — «Освоение и переносы по ДС» (КВ-36): после ухода погашений «Движение»
           перестало быть движением ТЕЛА (одни приходы да внутренние перекладывания), а
           «Движение» без уточнения читалось как журнал всего кредита — предмет «Расчётов».
           Имя перечисляет два вида строк прямо: третьего в таблице нет. */''}
      <div class="section-h" style="margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px">Освоение и переносы по ${sel?'траншу №'+sel.no:'кредиту'}
        ${actBtn(c,'addDisbursement',{trancheNo:(actionTranche(c)||{}).no,amount:0},'Внести освоение','CR.openDisbModal()','btn btn-primary btn-sm')}</div>
      ${cgrid(movCols, movRows, {empty:'Освоений и переносов нет'})}`;
  }

  /* Основание версии — ОДНО выражение на два места: строку-контекст и грид за раскрытием
     (КВ-27). Разъедься они, у одной версии оказалось бы два разных основания на одном
     экране. ДС даётся пилюлей: это документ, на который можно сослаться, а не пояснение. */
  function schedBasisLabel(s, plain){ const by = (s && s.by) || {};
    /* plain — для ПРОЗЫ (строка-контекст, плашка режима): пилюля в скобках посреди фразы
       читается как чужеродный блок, да и скобки при ней избыточны. В таблице наоборот —
       там пилюля отделяет документ от текстового основания соседней строки. */
    return by.kind === 'ДС'
      ? (plain ? esc(by.ref || 'ДС') : `<span class="pill neutral">${esc(by.ref || 'ДС')}</span>`)
      : esc((by.basis && (by.basis.ref || by.basis.kind)) || by.label || 'Перестроение графика'); }

  /* ---- ВКЛАДКА 4: График (план возврата) ----
     Выделена из «Расчётов» волной 03.08.2026. Предмет вкладки — КОНТРАКТ: чем кредит
     обязан ответить на выданное. Версии и позиции принадлежат ТРАНШУ
     (Р-1: buildSchedule строится на транше), поэтому селектор транша здесь свой,
     но состояние общее с «Траншами» и «Расчётами» (cardScope). Факт начисления
     и погашения остался в «Расчётах» — их предмет иной; прогноз по этому графику
     уехал на свою вкладку «Прогноз» (вторая волна 03.08.2026). */
  function tabGrafik(c,d){
    const sel=scopeTranche(c);                        // null → область «по кредиту» (КВ-17)
    const stPill={'Оплачена':'low','Просрочена':'high','Наступила':'mid','Предстоит':'neutral'};
    const scope = sel ? 'транш №'+sel.no : 'по кредиту';
    /* Слитый вид: те же две таблицы, но по всем траншам, каждая с колонкой «Транш» —
       идиома консолидированного расчёта («Расчёты»), а не вторая трактовка «по кредиту».
       Позиции сортируются по дате: агрегат отвечает на вопрос «что платим следующим»,
       и порядок по траншам этот вопрос ломает.
       «По кредиту» = ВСЕ транши, ЗАКРЫТЫЕ ВКЛЮЧИТЕЛЬНО (КВ-17): закрытый транш хранит
       свой график в истории (Г-17), и «Расчёты» его показывают — фильтр activeTranche
       здесь разводил две вкладки в разные смыслы одного контрола. */
    const srcTranches = sel ? [sel] : c.tranches;
    /* РЕЖИМ ПРОСМОТРА ВЕРСИИ (КВ-28). Грид версий был тупиком: строки перечислены, а
       открыть нельзя. Теперь любая строка открывается в таблице позиций — ради ДС-версии,
       чьи строки ПРИШЛИ из приложения к соглашению (:5318) и никаким пересчётом не
       проверяются; архивная движковая открывается тем же жестом, потому что правило
       «некоторые строки кликаются, некоторые нет» читается как поломка.
       Ключ сбрасывает выбор при смене кредита или транша. Смена ДАТЫ СРЕЗА сбросом не
       является: срез меняет, какая версия действующая, но показанная от этого существовать
       не перестаёт — плашка просто пересчитает, с какой её сравнивать. */
    const verKey = c.id + '|' + (sel ? sel.no : 'credit');
    if (grafikVerKey !== verKey){ grafikVer = null; grafikVerKey = verKey; }
    const pickVer = t => (grafikVer && grafikVer.no === t.no)
      ? (((t.schedules)||[]).find(s => s.ver === grafikVer.ver) || null) : null;
    const actSched  = sel ? scheduleAt(sel, cardAsOf) : null;
    const viewSched = sel ? pickVer(sel) : null;
    /* Просмотр — только когда показанная версия НЕ действующая: выбор, совпавший с
       действующей (срез переехал на неё), никакого предупреждения не заслуживает. */
    const viewing = !!(viewSched && !(actSched && actSched.ver === viewSched.ver));
    const st = sel ? trancheScheduleTotals(sel, cardAsOf, viewing ? viewSched.rows : null)
                   : scheduleTotalsAll(c, cardAsOf);
    /* Версия несёт ПЕРИОД ДЕЙСТВИЯ и ОСНОВАНИЕ (КВ-26, РС-5 п. 3). Флага active нет:
       статус выводится по срезу карточки — «действует» (последняя с validFrom ≤ срез),
       «будущая» (ДС с отложенной датой вступления уже записан, но ещё не действует) и
       «архив». Прежние две пилюли третьего состояния назвать не могли, и версия по
       будущему ДС читалась бы как действующая. */
    const verRows = srcTranches.flatMap(t => { const cur = scheduleAt(t, cardAsOf);
      return ((t.schedules)||[]).slice().sort((a,b)=>b.ver-a.ver).map(s=>{
        const isCur = cur && cur.ver===s.ver, future = pd(schedValidFrom(s)) > pd(cardAsOf);
        const stPillV = isCur ? '<span class="pill low">действует</span>'
                     : future ? '<span class="pill mid">будущая</span>'
                              : '<span class="pill neutral">архив</span>';
        const basis = schedBasisLabel(s);
        const to = validTo(t, s);
        /* Клик открывает версию в таблице позиций; клик по действующей — возврат (КВ-28).
           В области «по кредиту» setGrafikVer сам переводит карточку в транш: показать
           архив одного транша внутри слитой таблицы нельзя — там смешались бы два
           контракта, из которых один недействующий. */
        const isShown = grafikVer && grafikVer.no === t.no && grafikVer.ver === s.ver;
        return `<tr class="${isShown?'diff-changed':(isCur?'diff-changed':'')}" style="cursor:pointer"
          onclick="CR.setGrafikVer(${t.no},${s.ver})"
          title="${jsAttr(isCur ? 'Действующая версия — показана в таблице позиций' : 'Показать позиции версии v'+s.ver)}">
          <td>v${s.ver}${isShown&&!isCur?' <span class="pill mid">показана</span>':''}</td>${sel?'':`<td>№${t.no}</td>`}
          <td>${stPillV}</td><td>${basis}</td><td>${esc(schedValidFrom(s))}</td><td>${to?esc(to):'—'}</td>
          <td>${esc(s.generatedAt||s.generatedFrom)}</td><td style="text-align:right">${s.rows.length}</td></tr>`;
      });
    });
    /* СТРОКА-КОНТЕКСТ И РАСКРЫТИЕ ВЕРСИЙ (КВ-27). Грид версий стоял здесь безусловно, между
       плитками и позициями, и был ТУПИКОМ: строки не кликались, а позиции ниже всегда шли от
       действующей версии — история перечислялась и была недостижима. У обычного кредита он к
       тому же нёс одну строку, повторявшую дату первой позиции под собой.
       Теперь: строка-контекст отвечает одной фразой «что действует и почему», грид уезжает
       за раскрытие. Появляются оба только когда версиям есть что сказать (schedNeedsContext).
       В области «по кредиту» строки-контекста НЕТ: «какая версия действует» — вопрос про
       транш, у слитого вида одного ответа на него не существует, а сводка его подделывала бы.
       Счётчик в заголовке — ВСЕ версии, включая действующую: число обязано совпасть с числом
       строк за раскрытием, иначе его пересчитывают глазами. Слово «прежние» здесь неверно —
       будущая версия не прежняя. */
    const needsCtx = srcTranches.some(t => schedNeedsContext(t, cardAsOf));
    const curVer = actSched;
    const futVer = sel ? schedFuture(sel, cardAsOf) : null;
    /* Хвост «вступает» — единственный факт, меняющий чтение таблицы под строкой: позиции
       показаны по действующей версии, а подписанное соглашение вступит позже. */
    const futTail = futVer
      ? ` · с ${esc(schedValidFrom(futVer))} вступает v${futVer.ver} (${schedBasisLabel(futVer, true)})` : '';
    const ctxLine = !(sel && needsCtx) ? '' : (curVer
      ? `<p class="section-note" style="margin:12px 0 0">Действует v${curVer.ver} · с ${esc(schedValidFrom(curVer))} · ${schedBasisLabel(curVer, true)} · построена ${esc(curVer.generatedAt || curVer.generatedFrom)}${futTail}</p>`
      /* Версия есть, но её дата вступления впереди — действующей на срез НЕТ вовсе.
         Случай производного транша, чей ДС ещё не наступил: молчать нельзя, иначе пустая
         таблица позиций читается как «график не построен». */
      : (futVer ? `<p class="section-note" style="margin:12px 0 0">Действующей версии на ${esc(cardAsOf)} нет${futTail}</p>` : ''));
    const versBlock = !needsCtx ? '' : `${ctxLine}
      <div class="section-h" style="margin-top:${sel ? 14 : 22}px;cursor:pointer" onclick="CR.toggleGrafikVers()"
        title="${grafikVersOpen ? 'Свернуть' : 'Развернуть'} версии графика">${grafikVersOpen ? '▾' : '▸'} Версии графика (${verRows.length})</div>
      ${grafikVersOpen ? cgrid([{h:'Версия'}].concat(sel?[]:[{h:'Транш'}]).concat([{h:'Статус'},{h:'Основание'},{h:'Действует с'},{h:'По'},{h:'Построена'},{h:'Строк',r:1}]), verRows, {empty:'Версий графика нет'}) : ''}`;
    /* Статус позиции — от построенного расчёта (d.ledger.index), а не от засеянных строк.
       В РЕЖИМЕ ПРОСМОТРА статуса нет вовсе (КВ-28): леджер построен по ДЕЙСТВУЮЩЕЙ версии,
       ledgerKey совпадёт номером позиции, а суммы и даты у показанной другие — статус был
       бы не «неизвестен», а ЛОЖЕН. Колонка убирается целиком; прочерк на всю таблицу
       читался бы как «ничего не погашено». */
    const rowsOf = t => { const v = pickVer(t); return v && v.rows ? v.rows : trancheScheduleRows(t); };
    const posSrc = srcTranches.flatMap(t => rowsOf(t).map(r => ({ r, t })))
      .sort((a,b) => pd(a.r.date) - pd(b.r.date) || a.t.no - b.t.no)
      .map(x => ({ ...x, y: pd(x.r.date).getFullYear(),
        s: viewing ? null : scheduleRowStatus(x.r, d.ledger.index.get(ledgerKey(x.t.no, x.r.no)), cardAsOf) }));
    /* ГРУППИРОВКА ПО ГОДАМ (волна 10.08.2026, КВ-19). Год ВЫВОДИТСЯ из даты позиции —
       поля в модели нет и не появляется; порядок уже по дате (в слитом виде — по дате,
       потом по траншу), поэтому годы идут сплошными отрезками и группа получается сама.
       Строка года — НЕ подпись на всю ширину, а обычная строка таблицы: итоги стоят
       ПОД СВОИМИ колонками (ОД под «Основной долг», проценты под «Проценты»,
       к погашению под «Итого»), и год с позицией сравнивается взглядом по вертикали.
       Развёрнут ТОЛЬКО ТЕКУЩИЙ год (тот, куда попала дата среза): вкладка отвечает
       на вопрос «что платим в этом году и что должны за остальные», а шестьдесят строк
       подряд этот ответ топят. Прочие годы стоят одной итоговой строкой и разворачиваются
       по клику — деталь остаётся на расстоянии одного нажатия, а не пролистывания.
       Одногодичный график заголовка не получает: он дословно повторил бы плитки шапки
       (Σ ОД, Σ проценты, итого), а повтор той же цифры в двух местах читается как две
       разные величины; сворачивать там тоже нечего — год ровно один. */
    /* СТАТЬИ СТРОКИ (ADR-0109). Колонки — по составу: та, по которой ничего не
       распределено, не рисуется. Обычный кредит статей не имеет вовсе и обязан
       выглядеть ровно как до волны — иначе вкладка обрастает пустыми колонками
       у всех кредитов ради двух реструктурированных (идиома «Курс/≈KGS»).
       МЕСТО СТАТЕЙ — ПОСЛЕ «Процентов», а не между ними и телом (КВ-38). «Основной
       долг · Проценты» — контрактный взнос периода и пара, которой график назван на
       языке договора (ТЗ-05 §«Таблица графика»); статьи же переносятся реструктуризацией
       и ставки не несут. Вклиниваясь между телом и процентами, они разрывали эту пару
       на двух кредитах из шестидесяти, и одна и та же таблица читалась в двух разных
       порядках. Теперь порядок один для всех: тело → проценты → статьи (если есть) →
       итого. Тот же порядок держат строка года и предпросмотр графика в модалке. */
    const artCols = scheduleArticleCols(posSrc.map(p => p.r));
    /* ИР-2′ показывается там, где применяется, — под ДС-версией. У обычного графика
       переноса не было, и сверять нечего: плашка не рисуется вовсе (Г-25 проверяет
       ту же арифметику ДО записи, здесь она видна глазом после). */
    const ir2 = srcTranches.flatMap(t => ((t.schedules)||[]).filter(s => (s.by||{}).kind==='ДС').map(s => {
      const inTr = (t.transfers||[]).find(x => x.dir==='in' && (x.basis||{}).ds === s.by.ref);
      const moved = inTr ? (inTr.amount||0) : 0;
      const sum = round2((s.rows||[]).reduce((a,r) => a + (r.principal||0) + rowArticlesSum(r), 0));
      return { t, ver:s.ver, ds:s.by.ref||'ДС', moved, sum, ok:Math.abs(sum-moved) < 0.005 };
    }));
    const artCell = (r,a) => `<td style="text-align:right">${(r.articles&&r.articles[a.key])?money(r.articles[a.key]):'—'}</td>`;
    const byYear = new Map();
    posSrc.forEach(p => { const g = byYear.get(p.y) || { count:0, principal:0, interest:0, total:0, art:{}, st:{} };
      g.count++; g.principal += p.r.principal||0; g.interest += p.r.interest||0; g.total += p.r.total||0;
      artCols.forEach(a => { g.art[a.key] = (g.art[a.key]||0) + ((p.r.articles&&p.r.articles[a.key])||0); });
      g.st[p.s] = (g.st[p.s]||0) + 1; byYear.set(p.y, g); });
    const years = [...byYear.keys()];
    const multiYear = years.length > 1;
    const curYear = pd(cardAsOf).getFullYear();
    /* Умолчание: текущий год. Его может не быть в графике вовсе (кредит выдан позже или
       давно закрыт) — тогда открывается БЛИЖАЙШИЙ следующий, а если весь график в
       прошлом — последний. Пустой раскрытия не бывает: свёрнуто всё сразу читалось бы
       как «позиций нет». Стороннее состояние (переключили область, сменили кредит)
       к годам этого графика может не относиться — тогда снова умолчание. */
    const defYear = byYear.has(curYear) ? curYear : (years.find(y => y > curYear) ?? years[years.length-1]);
    /* Ключ набора: кредит + область + сами годы. Свёрнутое состояние принадлежит ЭТОМУ
       графику — сменили кредит, транш или перегенерировали график с другими датами,
       и прежний набор годов к новому отношения не имеет. Через ключ «всё свёрнуто»
       (осознанный выбор пользователя) отличается от «набор устарел». */
    const yearsKey = c.id + '|' + (sel ? sel.no : 'credit') + '|' + years.join(',');
    if (grafikOpenYears === null || grafikYearsKey !== yearsKey){
      grafikOpenYears = new Set(multiYear ? [defYear] : years); grafikYearsKey = yearsKey; }
    const openYears = grafikOpenYears;
    const allOpen = multiYear && years.every(y => openYears.has(y));
    /* Порядок слов статусов фиксирован (прошлое → будущее), а не порядком появления:
       иначе подпись года прыгала бы составом от кредита к кредиту. */
    const stWord = [['Оплачена','погашено'],['Просрочена','просрочено'],['Наступила','наступило'],['Предстоит','предстоит']];
    const yearRow = (y) => { const g = byYear.get(y); const open = openYears.has(y);
      const cnt = stWord.filter(([k]) => g.st[k]).map(([k,w]) => k === 'Просрочена'
        ? `<span style="color:var(--asubk-red)">${w} ${g.st[k]}</span>` : `${w} ${g.st[k]}`).join(' · ');
      return `<tr class="gyear${open?' open':''}" onclick="CR.toggleGrafikYear(${y})" title="${open?'Свернуть':'Развернуть'} ${y} год">
        <td colspan="${sel?2:3}"><span class="gcar">${open?'▾':'▸'}</span><span class="gy">${y}</span>${y===curYear?'<span class="pill neutral">текущий</span>':''}<span class="gcnt">${plur(g.count,'платёж','платежа','платежей')}</span></td>
        <td style="text-align:right"><b>${money(round2(g.principal))}</b></td>
        <td style="text-align:right"><b>${money(round2(g.interest))}</b></td>
        ${artCols.map(a=>`<td style="text-align:right"><b>${g.art[a.key]?money(round2(g.art[a.key])):'—'}</b></td>`).join('')}
        <td style="text-align:right"><b>${money(round2(g.total))}</b></td>
        <td style="text-align:right" class="text-muted">—</td>
        ${viewing?'':`<td class="gyear-s">${cnt}</td>`}</tr>`; };
    const posRows = []; let lastYear = null;
    posSrc.forEach(({r,t,s,y})=>{
      if (multiYear && y !== lastYear) { lastYear = y; posRows.push(yearRow(y)); }
      if (multiYear && !openYears.has(y)) return;                       // год свёрнут — стоит одной итоговой строкой
      /* В слитом виде строки производного транша ПОМЕЧЕНЫ своим ДС: без пометки
         позиции исходного и производного стоят вперемешку по дате, и непонятно,
         какая из них правится каким соглашением (дефект 12). */
      const trCell = sel ? '' : `<td>№${t.no}${trancheOrigin(t)==='разделение'
        ?`<br><span style="color:var(--text-muted);font-size:11px" title="${jsAttr('Позиции этого транша заданы приложением к '+(originDs(t)||'ДС'))}">${esc(originDs(t)||'ДС')}</span>`:''}</td>`;
      /* «Начислено за период» — СПРАВОЧНАЯ колонка и потому стоит ПОСЛЕ «Итого»:
         слева направо читается «что гасим → сколько платим → откуда взялось». Прочерк,
         когда начислено совпало с «Процентами» (обычный период): та же цифра дважды
         читается как две разные величины. Тултип зависит от ЗНАКА расхождения — в
         льготных периодах начислено БОЛЬШЕ платежа (копится), в окне распределения
         МЕНЬШЕ (в платёж вошли отложенные проценты прошлых периодов); один текст на
         оба случая врал бы ровно в половине строк. */
      const accCell = (r.accrued!=null&&Math.abs(r.accrued-r.interest)>0.005)
        ? `<td style="text-align:right" title="${r.accrued>r.interest?'начислено, но в платёж не включено (льгота по %)':'в платёж включены отложенные проценты прошлых периодов'}">${money(r.accrued)}</td>`
        : '<td style="text-align:right">—</td>';
      posRows.push(`<tr><td>№${r.no}</td>${trCell}<td>${esc(r.date)}</td><td style="text-align:right">${money(r.principal)}</td><td style="text-align:right">${money(r.interest)}</td>${artCols.map(a=>artCell(r,a)).join('')}<td style="text-align:right">${money(r.total)}</td>${accCell}${viewing?'':`<td><span class="pill ${stPill[s]||'neutral'}">${esc(s)}</span></td>`}</tr>`);});
    /* Кнопка «Сформировать график» (КВ-29). Была отдельной строкой gtoolbar под заголовком —
       две строки хрома до плиток ради действия, которое жмут 1–3 раза за жизнь кредита.
       Теперь ЕДИНСТВЕННАЯ функция и ОДНО место вывода за раз, выбранное контекстом:
         плашка Д-5   — она прямо просит сформировать заново, кнопка обязана быть в ней;
         пустое состояние таблицы — у транша без позиций построить график и есть работа
                        экрана (единственное место, где кнопка остаётся primary);
         заголовок секции — постоянный дом, идиома файла (:6842 · :7026 · :7058).
       Приоритет, а не сумма: первый снимок волны показал плашку и заголовок в 42 px друг
       от друга — одна и та же кнопка дважды читается как два разных действия. Инвариант
       «на экране ровно одна» проверяется кейсом #138.
       Ярлык общий и НАЗЫВАЕТ ТРАНШ (Р-24, :706) — не сокращается и в области «по кредиту»
       гаснет с причиной. Вес secondary: primary в макете носят частые действия («Внести
       платёж»), перестроение графика к ним не относится. */
    const schedBtn = (cls) => viewing
      ? disabledBtn('Сформировать график','Смотрите версию v'+viewSched.ver+' — вернитесь к действующей',cls)
      : sel ? actBtn(c,'buildSchedule',{tranche:sel},'Сформировать график','CR.openSchedModal()',cls)
            : disabledBtn('Сформировать график','График принадлежит траншу — выберите транш в шапке',cls);
    const d5Flags = retroPendingFlags(c);                              // Д-5: тот же признак, что на «Условиях»
    const btnPlace = d5Flags.length ? 'warn' : (posRows.length ? 'head' : 'empty');
    return `
      ${!d5Flags.length ? '' : `<div class="warn-inline">${svgInfo()}<div>
          Условия изменены задним числом (с ${esc(d5Flags[0].effectiveFrom)}, ${esc(d5Flags[0].basisLabel)}).
          Действующая версия графика построена по прежним условиям — сформируйте заново (Д-5).
          <div style="margin-top:8px">${schedBtn('btn btn-secondary btn-sm')}</div></div></div>`}
      <div class="section-h" style="display:flex;align-items:center;justify-content:space-between;gap:12px">График погашения
        ${btnPlace==='head' ? schedBtn('btn btn-secondary btn-sm') : ''}</div>
      ${!viewing?'':(()=>{ /* Плашка режима стоит НАД плитками: в просмотре по показанной версии
           идут и они (плитки — свод таблицы под ними), значит предупреждение обязано
           накрывать оба. warn-inline, а не info-plate: цифры на экране не действующие —
           это предупреждение, а не справка. */
        const fut = pd(schedValidFrom(viewSched)) > pd(cardAsOf);
        const to = validTo(sel, viewSched);
        const what = fut
          ? `Версия v${viewSched.ver} (${schedBasisLabel(viewSched, true)}) ещё не действует, вступает ${esc(schedValidFrom(viewSched))}.`
          : `Показана архивная версия v${viewSched.ver} (${schedBasisLabel(viewSched, true)}, действовала ${esc(schedValidFrom(viewSched))} — ${to?esc(to):'по сей день'}).`;
        return `<div class="warn-inline" style="margin-top:10px">${svgInfo()}<div>
          ${what} ${actSched?`Действует v${actSched.ver}.`:`Действующей версии на ${esc(cardAsOf)} нет.`}
          Статусы погашения не показаны — они относятся к действующей версии.
          <div style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="CR.clearGrafikVer()">Вернуться к действующей</button></div>
        </div></div>`; })()}
      <div class="phead-dims" style="grid-template-columns:repeat(5,1fr);margin-top:6px">
        <div class="dim"><div class="dl">Платежей в графике</div><div class="dv">${st.count}</div></div>
        <div class="dim"${st.method?` title="метод погашения — ${esc(st.method)}"`:''}><div class="dl">${esc(st.payLabel)}</div><div class="dv">${esc(st.payValue)}</div>${st.payNote?`<div class="src">${esc(st.payNote)}</div>`:''}</div>
        <div class="dim"><div class="dl">Σ основной долг</div><div class="dv">${money(st.principalSum)}</div></div>
        <div class="dim"><div class="dl">Σ проценты</div><div class="dv">${money(st.interestSum)}</div></div>
        <div class="dim"><div class="dl">Итого к погашению</div><div class="dv">${money(st.total)}</div></div>
      </div>
      ${versBlock}
      <div class="section-h" style="margin-top:22px">График — позиции (${esc(scope)})</div>
      ${multiYear?`<div class="gtoolbar" style="margin:0 0 8px">
        <span class="text-muted" style="font:var(--font-label)">Развёрнут ${plur([...openYears].filter(y=>years.includes(y)).length,'год','года','лет')} из ${years.length}</span>
        <span class="spacer"></span>
        <button class="btn btn-secondary btn-sm" onclick="CR.setGrafikYears([${allOpen?'':years.join(',')}])">${allOpen?'Свернуть все годы':'Развернуть все годы'}</button>
      </div>`:''}
      ${cgrid([{h:'№'}].concat(sel?[]:[{h:'Транш'}])
        .concat([{h:'Дата'},{h:'Основной долг',r:1,t:'тело кредита — единственная ставочная колонка: проценты начисляются только на неё (ADR-0109)'},
                 {h:'Проценты',r:1,t:'проценты этого периода в составе взноса — начислены на основной долг слева'}])
        .concat(artCols.map(a=>({h:a.label,r:1,t:'статья строки: переносится по ДС и погашается, но процентов не несёт (ADR-0109)'})))
        .concat([{h:'Итого',r:1},{h:'Начислено за период',r:1,t:'начислено по ставке за этот период; прочерк — совпало с колонкой «Проценты»'}])
        .concat(viewing?[]:[{h:'Статус'}]), posRows, {empty:'Позиций нет — сформируйте график',
          /* Здесь primary — единственное место, где он остался: у транша без графика
             построить его и есть работа экрана. В заголовке и плашке — secondary.
             Пусто, когда кнопку забрала плашка Д-5: инвариант «на экране ровно одна». */
          emptyAct: btnPlace==='empty' ? schedBtn('btn btn-primary btn-sm') : ''})}
      ${ir2.length?`<div class="info-plate" style="margin-top:12px">${svgInfo()}<div>
        <b>ИР-2′ — приём строк из приложения к ДС.</b> Σ колонок строки (основной долг + статьи)
        обязана сойтись с суммой переноса: график не создаёт и не теряет тела.
        ${ir2.map(x=>`<div style="margin-top:4px">${esc(x.ds)}${sel?'':' · транш №'+x.t.no} (v${x.ver}):
          Σ колонок <b>${money(x.sum)}</b> ${x.ok?'=':'≠'} перенос <b>${money(x.moved)}</b>
          ${x.ok?'<span class="pill low">сходится</span>':'<span class="pill high">расхождение '+money(round2(x.sum-x.moved))+'</span>'}</div>`).join('')}
      </div></div>`:''}`;
  }

  /* ---- ВКЛАДКА 5: Прогноз (ADR-0104, ADR-0108, ADR-0119) ----
     Выделен из «Графика» волной 03.08.2026 (вторая). Причина та же, по которой сам
     график был выделен из «Расчётов»: на одной вкладке лежали два разных предмета —
     КОНТРАКТ транша (версии, позиции: что обязаны вернуть) и ОЖИДАНИЕ по нему (что
     соберём на самом деле). Первое хранится и меняется действием, второе выводится при
     каждом рендере и не хранится вовсе.
     ВЫВОД ПЕРЕСОБРАН (КВ-39, ADR-0119). Прежняя раскладка держала ТРИ равноправных ответа
     строкой-контекстом (КВ-34) и таблицу РАСХОЖДЕНИЙ с графиком. Оба приёма сломались об
     ADR-0108: тело позиции контрактно, проценты идут на фактическое непогашенное тело —
     значит при живой просрочке расходятся ВСЕ будущие позиции (на К-4 сорок из сорока), и
     фильтр расхождений перестал отбирать хоть что-нибудь; а главный ответ ADR-0104 «когда
     закроется» на бедствующем кредите отвечает «срок не сдвинут» — график тела не
     растягивается, — то есть молчал ровно там, где его спрашивают.
     Теперь: ГЛАВНЫЙ ОТВЕТ — ОДНА крупная величина, выбранная ЛЕСТНИЦЕЙ состояний (МС →
     будущего нет → есть недобор → недобора нет; побеждает первое совпавшее); строка-контекст
     под ней называет только то, чего главный ответ не назвал.
     В ТАБЛИЦЕ — ТОЛЬКО БУДУЩЕЕ: вкладка отвечает на «что впереди», и непокрытому прошлому
     здесь место числом, а не строками. Построчно оно уже разложено «Расчётами» (:8157,
     «Детальный расчёт»: тело/проценты/пеня начислено-оплачено-просрочено на тот же срез, с
     тем же делением по траншам) — наши строки были его бедной копией. Прогнозу прошлое нужно
     ДВУМЯ ЧИСЛАМИ: недобор (он же стартовое условие базы начисления, ADR-0105) и цена дня —
     оба стоят в шапке, состав недобора — тултипом на нём. Заодно исчезает и причина двойного
     чтения колонки «Прогноз» (ADR-0108 §4): взнос и остаток долга в одной колонке сходились
     только потому, что прошлое лежало в этой же таблице.
     Гранулярность — транш (Р-1), селектор общий с «Траншами»/«Графиком»/«Расчётами»
     (cardScope). Помесячный прогноз по кредиту целиком — во вкладке «План», колонкой рядом
     с планом: там он служит ориентиром при постановке цели.
     ДЕЙСТВИЙ НА ВКЛАДКЕ НЕТ ВОВСЕ: прогноз ничего не назначает (ADR-0104 §5), а
     перестроение графика — операция «Графика», и кнопка у неё на экране ровно одна (КВ-29).
     Две кнопки, что здесь есть, меняют только видимое: окно позиций и раскрытие при МС. */
  function tabPrognoz(c,d){
    const sel=scopeTranche(c);                        // null → область «по кредиту» (КВ-17)
    const scope = sel ? 'транш №'+sel.no : 'по кредиту';
    /* Та же идиома слияния, что на «Графике» и в консолидированном расчёте: строки всех
       траншей в одной таблице, колонка «Транш», сортировка по дате.
       «По кредиту» = ВСЕ транши, ЗАКРЫТЫЕ ВКЛЮЧИТЕЛЬНО (КВ-17), — тем же составом, каким
       читает buildLedger: один контрол не может означать на соседних вкладках разное. */
    const srcTranches = sel ? [sel] : c.tranches;
    const sm  = forecastSummary(c, srcTranches, d.ledger.index, cardAsOf);
    const fr  = sm.rows, fut = sm.fut;
    const earlyDays = (sm.payoff && sm.contractEnd) ? dd(pd(sm.payoff), pd(sm.contractEnd)) : 0;
    const ms = c.mirror && c.mirror.settlement;
    const noGraf = !fr.length;
    /* ВКЛАДКА НЕ ПЕЧАТАЕТ НИ ОДНОЙ ВЕЛИЧИНЫ ИЗ ПРОШЛОГО (ADR-0119 §5). Сняты все три,
       которые её туда тянули: недобор по наступившим позициям, цена дня просрочки и
       «проценты сверх контракта» (Σ Δ живёт в самой таблице, итоговой строкой, — второй раз
       называть её незачем). Просрочка при этом не пропала с экрана: она стоит в плитках
       шапки карточки («Остаток долга» → в т.ч. просрочено, «Ближайший платёж» → красным),
       которые видны на КАЖДОЙ вкладке, и построчно — в «Расчётах».
       sm.tail остаётся здесь ровно как УСЛОВИЕ ВЕТКИ: в состоянии «прошлое не покрыто» дата
       последней позиции перестаёт быть датой нуля, и главным ответом становится не она.
       Знать прошлое, чтобы не соврать о будущем, и показывать прошлое — разные вещи. */
    const uncoveredPast = sm.tail > 0.005;
    /* ОТСЕЧЁННЫЕ ДОСРОЧКОЙ ПОЗИЦИИ — свойство ДАТЫ закрытия, а не отдельный факт: они и есть
       причина, по которой дата уехала влево. Прежде стояли самостоятельным пунктом строки-
       контекста и читались как ещё один ответ вкладки. */
    const payoffT = sm.cutPositions > 0
      ? jsAttr('досрочное погашение гасит хвостовые позиции: база амортизации кончается раньше, и последних '
          + plur(sm.cutPositions,'позиции','позиций','позиций') + ' ждать уже нечего (ADR-0074 §1)')
      : jsAttr('последняя позиция, на которой ещё что-то ждём; даты позиций прогноз не двигает (ADR-0104 §1)');

    /* ЛЕСТНИЦА СОСТОЯНИЙ (ADR-0119 §1): главный ответ — ОДНА величина, и выбирает её первое
       совпавшее условие. Плитками это не выкладывается: сетка уравнивает в весе всё, что в
       ней лежит. Все ступени отвечают ОДНИМ И ТЕМ ЖЕ вопросом — что впереди: ближайший
       ожидаемый взнос, дата закрытия либо прямой ответ «впереди ничего» с причиной. Величина
       у ответа своя на каждой ступени, и выбирается она тем, что в этом состоянии вообще
       можно обещать: дату нуля — только когда прошлое покрыто. */
    let heroV = '', heroL = '', heroBad = false;
    const sub = [];
    /* СОСТОЯНИЕ ПО ДОГОВОРНОМУ ГРАФИКУ СЧИТАЕТСЯ ВСЕГДА, даже когда шапку занимает МС: при
       раскрытии цифр оно уходит в строку-контекст. Иначе кредит с МС и исчерпанным графиком
       (К-3) молчал бы о том, что срок кончился, — ветка МС просто съедала бы эту ступень. */
    if (!fut.length){
      if (d.calcStopped){
        heroV = esc(d.calcUntil); heroL = 'кредит закрыт: ' + esc((c.closure&&c.closure.reason)||'основание не указано');
        sub.push('Расчёт замер на дате закрытия, будущих позиций нет (ADR-0104 §5)');
      } else if (noGraf){
        heroV = 'Графика нет'; heroL = 'прогнозировать нечего';
        sub.push('Ожидание строится по действующему графику — пока его нет, строить не из чего');
        sub.push('график формируется на вкладке <b>«График»</b>');
      } else if (uncoveredPast){
        /* СРОК КОНЧИЛСЯ, А ДОЛГ ОСТАЛСЯ — это ответ о БУДУЩЕМ («ждать больше нечего»), и он
           обязан отличаться от пройденного графика: иначе дефолт выглядит как погашенный
           кредит. Сколько именно осталось — вопрос «Расчётов», и цифры здесь нет. */
        heroV = 'Ожидания нет'; heroL = 'график исчерпан, срок кончился'; heroBad = true;
        sub.push(`Последняя позиция${sm.contractEnd?' <b>'+esc(sm.contractEnd)+'</b>':''} уже позади, а долг не закрыт`);
        sub.push('новых позиций прогноз не выдумывает — новые сроки назначает только перестроение графика по заявлению заёмщика (ADR-0104 §5, ADR-0074 §2)');
      } else {
        heroV = 'График пройден'; heroL = sm.contractEnd ? 'последняя позиция ' + esc(sm.contractEnd) : 'позиций впереди нет';
        sub.push('Ждать больше нечего');
      }
    }
    else if (sm.payoff && uncoveredPast){
      /* ШАПКИ ЗДЕСЬ НЕТ ВОВСЕ — heroV остаётся пустым, и .fc-hero не печатается.
         Дату закрытия называть нечем: нуля на ней не будет (тело контрактно, график тела не
         растягивается, ADR-0108 §1), и сама она равна договорной всегда. А всё остальное,
         что можно поставить в шапку этого состояния, есть ПЕРЕСКАЗ таблицы, стоящей на два
         сантиметра ниже: ближайший ожидаемый взнос — её первая строка, контрактный рядом с
         ним — её колонка «По графику», «дальше ещё N позиций» — её строка итога, «последняя
         ДД.ММ.ГГГГ» — конец графика, который принадлежит вкладке «График».
         Здесь работает то же правило молчания, что и в строке-контексте: молчит не ноль —
         молчит ПОВТОР (ADR-0119 §3). Вкладка отвечает таблицей, и это её нормальный ответ,
         а не отсутствие ответа. Шапка остаётся там, где таблица ответить не может:
         когда будущего нет, когда его ведёт МС и когда даты закрытия нет ни у кого. */
    }
    else if (sm.payoff){
      /* Здесь дата — ответ: прошлое покрыто, и ноль на ней действительно наступит. Эффект
         досрочки виден ровно тут (ADR-0074 §«Последствия»): взнос дешевеет, хвост гаснет,
         дата уезжает влево — три следствия одного правила, названные одной датой. */
      heroV = esc(sm.payoff); heroL = 'ожидаемое закрытие';
      sub.push(earlyDays > 0
        ? `<span title="${payoffT}">раньше договора на ${plur(earlyDays,'день','дня','дней')}</span>`
        : (earlyDays < 0 ? `позже договора на ${plur(-earlyDays,'день','дня','дней')}` : 'даты позиций прогноз не двигает — идём по договорным'));
      /* «По договору» — только когда даты РАЗОШЛИСЬ: при совпадении это та же дата, названная
         дважды подряд, и читается как две разные. */
      if (sm.contractEnd && sm.contractEnd !== sm.payoff) sub.push(`по договору ${esc(sm.contractEnd)}`);
    }
    else if (sm.stuck.length){
      /* Транш с исчерпанным графиком и долгом ответа не даёт, и чужую дату за него не
         выдают (ADR-0104 §5). Позиции впереди при этом есть — у других траншей. */
      heroV = 'Даты закрытия нет'; heroL = `у ${sm.stuck.length>1?'траншей':'транша'} ${sm.stuck.map(n=>'№'+n).join(', ')} график исчерпан`;
      heroBad = true;
      sub.push('Пока сроки по ним не назначены заново, даты по области нет вовсе — чужую выдавать нельзя');
      sub.push('позиции остальных траншей — в таблице ниже');
    }
    else {
      heroV = 'Впереди ничего не ждём'; heroL = 'позиции погашены досрочно';
      if (sm.cutPositions > 0) sub.push(`<span title="${payoffT}">Отсечено ${plur(sm.cutPositions,'позиция','позиции','позиций')}</span>`);
      else sub.push('Ожидаемые взносы по оставшимся позициям — ноль');
    }
    /* МС — ВЕРХНЯЯ СТУПЕНЬ ЛЕСТНИЦЫ, И ОНА ПЕРЕКРЫВАЕТ ШАПКУ ЦЕЛИКОМ: живой график у слоя МС,
       ведёт его взыскание (ADR-0047), и договорное ожидание кредита под этой шапкой не
       исполняется. Показывать его молча нельзя, отнимать тоже (кредит своего графика не
       терял) — оно свёрнуто за кнопку и при раскрытии подписано как договорное. */
    const heroMs = ms
      ? { v:'Ожидание ведёт взыскание', l:'мировое соглашение ' + esc(ms.num) + ' от ' + esc(ms.date),
          sub:[ `Статус <b>${esc(ms.status)}</b>`, `источник ${esc(ms.source||'модуль взыскания')}`,
                'у МС собственный живой график, в кредит он не копируется — кредит знает о нём ровно одно, что оно есть (ADR-0047)' ] }
      : null;
    const hv = heroMs ? heroMs.v : heroV, hl = heroMs ? heroMs.l : heroL, hs = heroMs ? heroMs.sub : sub;
    /* ПУСТОЙ ГЛАВНЫЙ ОТВЕТ НЕ ПЕЧАТАЕТСЯ: у состояния «позиции впереди есть, прошлое не
       покрыто» шапки нет вовсе — её содержимым был бы пересказ таблицы. Носитель без
       величины — заголовок ради заголовка. */
    const hero = (heroMs || heroV)
      ? `<div class="fc-hero"><div class="fv${(!heroMs&&heroBad)?' bad':''}">${hv}${hl?`<span class="fl">${hl}</span>`:''}</div>`
        + (hs.length?`<div class="fs">${hs.join(' · ')}</div>`:'') + `</div>`
      : '';
    const msBtn = ms ? `<div style="margin:10px 0 2px"><button class="btn btn-secondary btn-sm" onclick="CR.setPrognozMs(${prognozMsOpen?'false':'true'})">${prognozMsOpen?'Скрыть цифры по договорному графику':'Показать цифры по договорному графику'}</button></div>` : '';
    if (ms && !prognozMsOpen)
      return `<div class="section-h">Ожидаемые платежи (${esc(scope)}) ${derivedHtml()}</div>${hero}${msBtn}`;

    /* СТРОКА-КОНТЕКСТ (идиома КВ-27, форма КВ-33 :7492) — то, чего главный ответ не назвал,
       и ничего сверх. После КВ-39 в ней осталось ровно два жителя: раскрытие при МС и
       плашка неосвоенного транша. «Проценты сверх контракта» отсюда сняты — это Σ колонки Δ,
       и она стоит итоговой строкой прямо под своими слагаемыми: та же величина, названная
       на том же экране дважды, читается как две. Цена дня просрочки снята вместе с
       гейтом !calcStopped: её база — наступившее прошлое, а не ожидание. */
    const ctx = [];
    /* Раскрытое при МС состояние — та же ступень лестницы, только строкой: величина, её
       подпись и её же оговорки. Второй формулировки для того же состояния не заводим.
       Ступень без величины (таблица отвечает сама) добавляет к строке ровно ничего. */
    if (ms) ctx.push(`Ниже — <b>договорный график кредита</b>, не расписание МС`
      + (heroV ? `: <b>${heroV}</b> — ${heroL}` + (sub.length ? ' · ' + sub.join(' · ') : '') : ''));
    /* Единственная оставшаяся плашка: неосвоенный транш — база брать неоткуда, и прогноз по
       нему построен на ДОГОВОРНОЙ сумме. Молча выдавать такие суммы за ожидание нельзя —
       освоения может не быть вовсе (Г-2 держит транш до выполнения условий). */
    const unfunded = srcTranches.filter(t => !(disbursedSum(t) > 0) && trancheScheduleRows(t).length);
    const plate = unfunded.length
      ? `<br>${unfunded.length>1?'Транши':'Транш'} ${unfunded.map(t=>'№'+t.no).join(', ')} <b>${unfunded.length>1?'не освоены':'не освоен'}</b>: фактической базы ещё нет, и прогноз построен на договорной сумме.`
      : '';
    const ctxNote = (ctx.length||plate) ? `<p class="section-note">${ctx.join(' · ')}${plate}</p>` : '';

    /* ТАБЛИЦА — ТОЛЬКО БУДУЩЕЕ (ADR-0119 §4). Окно — ТРИ БЛИЖАЙШИЕ ДАТЫ целиком: режется по
       дате, а не по числу строк, иначе при слиянии траншей (КВ-17) одна и та же дата попадала
       бы в таблицу наполовину. Флаг окно снимает.
       ПРОШЛОГО ЗДЕСЬ НЕТ ВОВСЕ: построчно оно разложено «Расчётами» подробнее (тело/проценты/
       пеня начислено-оплачено-просрочено), и вторая, беднее, копия тех же строк ничего не
       добавляла — а стоила дорого: ради неё колонка «Прогноз» читалась двояко (взнос впереди,
       остаток долга позади), Δ у наступившей позиции приходилось гасить прочерком, и таблица
       заводила колонку пени, которой у будущего взноса нет по определению (ADR-0087). */
    const futDates = [...new Set(fut.map(r => r.date))];
    const winDates = new Set(prognozShowAll ? futDates : futDates.slice(0, 3));
    const futSet = fut.filter(r => winDates.has(r.date));
    /* НОМЕРА ПОЗИЦИИ ЗДЕСЬ НЕТ. Он принадлежит договорному графику и в таблице «только
       будущее» либо стартует с середины ряда (у K-1 — с №3, наступившие не показаны), либо,
       если перенумеровать её 1…N, заводит ВТОРОЙ номер одной и той же позиции: ближайший
       платёж читался бы «№1» здесь и «№3» на «Графике». Опознаётся позиция датой, а при
       слиянии траншей (КВ-17) — датой и траншем; весь ряд с номерами стоит на «Графике». */
    const lead = sel ? 1 : 2;                          // [Транш ·] Дата
    /* СОСТАВ ОЖИДАНИЯ — ДВЕ СТАТЬИ, НЕ ТРИ (ADR-0119 §4). Взнос печатается слагаемыми:
       основной долг + проценты = итого по прогнозу, и сумма читается слева направо, а не всплывает
       подсказкой. Штрафов среди статей нет и быть не может: пеня — отдельная статья и во
       взнос не входит НИКОГДА (ADR-0087), а её база — уже просроченное прошлое, то есть не
       ожидание; вперёд её и тянули максимум на один шаг, потому что потолок пени в модели
       не применён (ADR-0104 §6). Ноль в статье остаётся НАЗВАННЫМ («в конце срока» даёт
       тело 0,00 во всех позициях, кроме последней): молчит не ноль — молчит повтор. */
    const posRow = r => {
      const rd = r.delta, big = Math.abs(rd) > 0.005;
      return `<tr>${sel?'':`<td>№${r._t.no}</td>`}<td>${esc(r.date)}</td>
        <td style="text-align:right">${money(r.principal)}</td>
        <td style="text-align:right"${Math.abs((r.interest||0)-(r.interestCtr||0))>0.005?` title="${jsAttr('по контракту процентов '+money(r.interestCtr||0)+' — разница на непогашенном теле')}"`:''}>${money(r.interest)}</td>
        <td style="text-align:right"><b>${money(r.forecast)}</b></td>
        <td style="text-align:right">${money(r.scheduled)}</td>
        <td style="text-align:right${big?';color:'+(rd>0?'var(--asubk-red)':'var(--text-muted)'):''}"${big?` title="${jsAttr('проценты на фактическое непогашенное тело: '+money(r.interestCtr||0)+' по контракту → '+money(r.interest||0)+' ожидается; тело позиции контрактное — '+money(r.principal||0))}"`:''}>${big?(rd>0?'+':'')+money(rd):'—'}</td></tr>`; };
    const rws = [];
    if (futSet.length){
      futSet.forEach(r => rws.push(posRow(r)));
      /* ИТОГ — ПО ВСЕМ БУДУЩИМ ПОЗИЦИЯМ, а не по показанным: окно решает, что видно, а не что
         посчитано. Иначе Σ впереди менялась бы от нажатия кнопки, а вкладка «План» брала бы
         снимок другой величины (ADR-0042 §2). Расхождение названо в самой строке.
         Носитель — та же строка-группа, что год «Графика» и квартал «Плана», но не
         сворачивающая (.static) и стоящая ПОСЛЕ строк: группа здесь одна, и сворачивать
         нечего — окно уже свёрнуто по построению. */
      rws.push(`<tr class="gyear static">
        <td colspan="${lead}"><span class="gy">Итого впереди</span><span class="gcnt">${
          prognozShowAll ? plur(fut.length,'позиция','позиции','позиций')
            : `показаны ближайшие ${plur(winDates.size,'дата','даты','дат')} из ${futDates.length} · итог по всем ${fut.length}`}</span></td>
        <td style="text-align:right"><b>${money(sm.futPrincipal)}</b></td>
        <td style="text-align:right" title="${jsAttr('из них сверх контрактных процентов — '+(sm.extraInterest>0?'+':'')+money(sm.extraInterest)+' (цена непогашенного тела, ADR-0105)')}"><b>${money(sm.futInterest)}</b></td>
        <td style="text-align:right" title="${jsAttr('ожидаемые платежи по ВСЕМ '+fut.length+' будущим позициям: тело контрактное, проценты на фактическое непогашенное тело (ADR-0108 §1)'
            + (Math.abs(sm.condEffect) > 0.005 ? '. Условия читаются на дату позиции, и датированные записи после '+cardAsOf+' уже в реестре: их эффект — '+(sm.condEffect>0?'+':'')+money(sm.condEffect)+' (ADR-0104 §4)' : ''))}"><b>${money(sm.futSum)}</b>${Math.abs(sm.condEffect)>0.005?'<span class="gcnt">*</span>':''}</td>
        <td style="text-align:right"><b>${money(sm.futSched)}</b></td>
        <td style="text-align:right${Math.abs(sm.delta)>0.005?';color:var(--asubk-red)':''}"><b>${Math.abs(sm.delta)>0.005?(sm.delta>0?'+':'')+money(sm.delta):'—'}</b></td></tr>`);
    }
    return `
      ${hero}${msBtn}${ctxNote}
      ${/* ЗАГОЛОВОК НА ВКЛАДКЕ ОДИН. Прежде их было два подряд — «Прогноз» (имя вкладки,
            уже стоящее в переключателе) и «Позиции впереди»; первый ничего не возглавлял,
            а после снятия шапки не возглавлял вовсе ничего. Остался тот, что называет
            СОДЕРЖИМОЕ: «Ожидаемые платежи» — по определению будущие, наступившая позиция
            ожидаемой не бывает (ADR-0119 §4), — с областью (КВ-17/КВ-36), знаком
            производной величины, счётчиком и единственным контролом (форма КВ-33 :7505).
            Счётчик — по всем БУДУЩИМ позициям области в обоих состояниях: кнопка меняет,
            что видно, а не что посчитано. */''}
      <div class="section-h" style="${(hero||ctxNote)?'margin-top:22px;':''}display:flex;align-items:center;justify-content:space-between;gap:12px">Ожидаемые платежи (${esc(scope)}) ${derivedHtml()}
        ${fut.length?`<button class="btn btn-secondary btn-sm" onclick="CR.setPrognozAll(${prognozShowAll?'false':'true'})" title="${jsAttr(prognozShowAll?'вернуть окно: три ближайшие даты от '+cardAsOf:'показать все будущие позиции области')}">${prognozShowAll?'Ближайшие 3 даты':'Все позиции ('+fut.length+')'}</button>`:''}</div>
      ${cgrid((sel?[]:[{h:'Транш'}]).concat([
        {h:'Дата'},
        {h:'Основной долг',r:1,t:'тело позиции — КОНТРАКТНОЕ: график есть расписание тела и от факта не растягивается (ADR-0108 §1). Досрочка не уменьшает тело каждой позиции — она гасит хвостовые целиком (ADR-0074 §1)'},

          :(uncoveredPast?'Впереди позиций нет — график исчерпан, новых сроков прогноз не назначает'

  }

      ${/* ПЛАШКА «РАСЧЁТ ПРЕДВАРИТЕЛЬНЫЙ» СНЯТА 16.08.2026 решением владельца. Факт с экрана

      ${/* «НАЧИСЛЕНО» → «К ПОГАШЕНИЮ» (волна 14.08.2026, третий заход). Слово носило на одной

      ${/* ПОРЯДОК: «ОСТАТОК» СРАЗУ ЗА «ПОГАШЕНО» (правка владельца, 14.08.2026). Три первые

           Прежний довод КВ-40 п.5 («красным помечена колонка, двигающая категорию, и после
           снятия „Срочной части“ она встала рядом с остатком») говорил о соседстве, а не о
           стороне: соседство сохранено, сменилась сторона.
           СТРОКИ-ИСКЛЮЧЕНИЯ: их число живёт под «Остатком», поэтому colspan подписи стал 2

        ${debtArticlesOf(d.debt).map(a=>{const x=d.debt[a.key];

        ${(d.debt.interest.frozen>0||d.debt.penalty.frozen>0)?`<tr><td>Приостановлено решением суда</td><td colspan="2" class="text-muted" style="font:var(--font-label)">начислению по договору подлежало, но на присуждённую долю начисление остановлено (проценты ${money(d.debt.interest.frozen)} · пеня ${money(d.debt.penalty.frozen)}) — в остаток не входит</td><td style="text-align:right">${money(round2(d.debt.interest.frozen+d.debt.penalty.frozen))}</td><td></td></tr>`:''}
        ${d.debt.penalty.disputed>0?`<tr><td>Спорная пеня</td><td colspan="2" class="text-muted" style="font:var(--font-label)">пеня за период сторнированного платежа: вычислена, но до решения комиссии в требование не входит и категорию не двигает</td><td style="text-align:right">${money(d.debt.penalty.disputed)}</td><td></td></tr>`:''}

    /* ДЕТАЛЬНЫЙ РАСЧЁТ — ОДИН ЛИСТ, ОСЬ «ПО ДАТАМ» (КВ-64, решение владельца 16.08.2026).

       обязательства — что наступило, что закрыто, что просрочено, — но реестром позиций
       ПОВТОРЯЛ «График»: № · дата · транш · тело · проценты · итого и тот же статус от
       scheduleRowStatus. Два реестра позиций на двух вкладках читаются как две разные

       построчный состав легаси-вида — в печатную форму «Расчёт показателей
       задолженности» (ADR-0128 §4). */
    const sheets = (d.ledger.dateSheet||[]).filter(s => !sel || s.trancheNo===sel.no);
    const cur    = c.currency||'KGS';

    /* КОЛОНКИ — МАТРИЦА «СТАТЬЯ × СОСТОЯНИЕ» (КВ-47). Прежняя лента проигрывала не числом
       колонок, а тем, что предмет — матрица — был развёрнут в строку: имена не держались
       сами («Погашено» трижды, смысл нёс только верхний этаж). Здесь предмет назван прямо:
       верхний этаж — СТАТЬЯ (Основной долг · Проценты · Пеня), нижний — состояние внутри
       неё, и «Погашено» законно повторяется трижды — его различает этаж над ним.
       ГРУППЫ-ЧИПЫ СНЯТЫ: они прятали колонки ровно потому, что шапка не умела их назвать.
       НАКОПЛЕННЫЕ — ПО СОСТАВУ (идиома «Графика со статьями», ADR-0109): пара колонок
       появляется только там, где реструктуризация перенесла в график ранее начисленные
       проценты; иначе они пусты у всех кредитов страны ради нескольких.
       СОБЫТИЕ — РЯДОМ С ДАТОЙ, в одной ячейке и в ОДНУ СТРОКУ (разбор 16.08.2026): своей
       колонкой пилюли переменной ширины растягивали столбец, к числам справа отношения не
       имеющий, а событие и дата — одно и то же («что случилось» и «когда»). Двумя этажами
       ячейка стояла до 16.08.2026 и удваивала высоту КАЖДОЙ строки листа ради строк с
       событием — а их меньшинство; дата защищена white-space:nowrap, переносится пилюля. */
    /* ПО СОСТАВУ — ПРАВИЛО, А НЕ ИСКЛЮЧЕНИЕ (разбор 16.08.2026). «Накопленные» жили так с
       КВ-47, перенос — с КВ-55; теперь тем же способом живут «Освоено», «Принято»,
       «Списано» и «Перенесено»: колонки, у которых по кредиту нет НИ ОДНОГО числа, не
       занимают ширину. Прячем МОЛЧА — отсутствие колонки и значит «показывать нечего»,
       ровно как у накопленных; надпись на этот счёт была бы шумом у 59 кредитов из 60.
       Считаем ПО ВСЕМ ЛИСТАМ вкладки, а не по каждому траншу: иначе у K-7 встанут рядом
       три таблицы с разными шапками, и читатель сравнит несравнимое. Выбран транш — набор
       честно сужается вместе с ним: у производного транша «Освоено» исчезает, и прочерк,
       который прежде надо было объяснять, объяснять больше не приходится.
       «По графику» и «Погашено» в правило НЕ входят — хребет листа: ноль в них значим
       («срок не наступил», «не платили»), а не пуст. */
    const any = (f) => sheets.some(s => s.rows.some(f));
    const hasAcc  = any(r => (r.accDue||0)   > 0.005 || (r.runAcc||0)  > 0.005);
    const hasDisb = any(r => (r.disb||0)     > 0.005 || (r.runDisb||0) > 0.005);
    const hasOff  = any(r => (r.offAmt||0)   > 0.005 || (r.runOff||0)  > 0.005);

       а у последней строки раздела — с датой среза. То есть колонка несла одно число дважды,

       транше, и блок читается притоком → требованием → возвратом → выбытием → итогом; у

    /* КОЛОНКА ОПИСЫВАЕТСЯ ОДИН РАЗ (разбор 16.08.2026). Шапка и клетки строятся из ОДНОГО

       чередом: приостановка процентов её не касается. */
    const accCell = (r) => r.accrued==null
      ? `<span class="text-muted" title="${jsAttr(r.noAccrual==='gap'

    const dueICell = (r) => (r.dueI < -0.005)
