      col('По графику', 'тело, срок которого пришёл по графику в эту дату; не покрытое платежом уходит в «Просрочено»', r => num(r.dueP),
        {sum: r => r.dueP}),
      col('Нарастающим', 'тело, потребованное графиком с начала транша по эту строку включительно', r => state(r.runDue), {run:true, last:true}),
      col('Погашено', 'разнесено в тело платежами этой даты — зеркало модуля платежей', r => num(r.paid.principal),
        {sum: r => r.paid.principal}),
      col('Нарастающим', 'тело, погашенное с начала транша по эту строку включительно', r => state(r.runPaidP), {run:true, last:true}),
      hasOff  && col('Списано', 'тело, снятое с баланса решением о признании долга безнадёжным в эту дату (Р-20). Остаток оно ГАСИТ (КВ-62): «Остаток» рядом на эту сумму падает. Погашением при этом не является — денег заёмщик не вносил, и в «Погашено» слева число не входит; за балансом долг остаётся его долгом. Тело — лишь ОДНА статья решения: проценты и пеню оно списывает тем же документом (КВ-63), свои колонки «Списано» у них в своих блоках', r => num(r.offAmt),
        {sum: r => r.offAmt}),
      hasOff  && col('Нарастающим', 'списано с начала транша по эту строку включительно — решений о списании бывает больше одного', r => state(r.runOff), {run:true, last:true}),
      hasOut  && col('Перенесено', 'тело, ушедшее из транша по допсоглашению (ADR-0092 §2). Списанием это НЕ является и в соседнюю колонку не входит: тело не ушло с баланса, оно живёт в другом транше того же кредита. «Остаток» рядом на эту сумму уменьшается — как и от списания, но уменьшение это встречное: у транша-приёмника ровно столько же прибавилось. Разность с «Принято» слева — вклад переноса в «Остаток» справа',
        r => num(r.movedOut), {sum: r => r.movedOut, tdTitle: r => r.movedOut > 0.005 ? 'в транш №' + r.moveTo + ' по допсоглашению' : ''}),
      hasOut  && col('Нарастающим', 'тело, ушедшее из транша с начала его жизни по эту строку включительно', r => state(r.runOut), {run:true, last:true}),
      /* ЭТА КОЛОНКА — ТЕЛО, А НЕ БАЗА НАЧИСЛЕНИЯ (КВ-61, владелец 16.08.2026: «25 марта 2025
         почему остаток прочерк ?»). Печаталась `base` — база отрезка, — и молчала везде, где
         отрезка нет: у хвоста за последней позицией графика (ADR-0010), у транша, принявшего
         тело переносом до первой своей позиции (КВ-54), у строки среза (КВ-53). Тело при этом
         на месте: у K-6b 25.03.2025 висит 90 000,00, и ПЕНЯ В ТОЙ ЖЕ СТРОКЕ считается ровно с
         них (за день 108,0247 × 282 дн). Прочерк рядом с работающей пенёй читается как «долга
         нет» — колонка врала о состоянии, потому что отвечала за чужой вопрос.
         Теперь число одно и то же с обеих сторон: пока начисление идёт, тело И ЕСТЬ база
         отрезка — тождество сверено на всех 273 строках сида с отрезком (проверка №175), —
         а где начисление встало, молчат «Ставка», «Дней» и «Начислено», и только они.
         СПИСАНИЕ ВХОДИТ ПЯТЫМ СЛАГАЕМЫМ (КВ-62, решение владельца 16.08.2026 «да гасит»):
         прежде решение о списании тело не трогало, и та же строка 15.05.2026 у K-6b
         печатала «Списано 58 000» рядом с «Остаток 58 000». */
      col('Остаток', 'тело, которое числится за траншем на конец строки: освоено + принято − перенесено − погашено − списано. Пока идёт начисление, это же число — база отрезка («Остаток» × «Ставка» × «Дней» = «Начислено»); после последней позиции графика начислять не на чем (ADR-0010) — молчат «Ставка» и «Начислено», а тело остаётся',
        r => state(r.base == null ? endBal(r) : r.base), {last:true}),
      col('Просрочено', 'тело, срок которого наступил и не покрыт — база пени по основному долгу. Минус — обратное: погашено больше, чем график потребовал к этой дате (аванс в счёт будущих взносов)', overdueCell,
        {last:true, end: r => overdueCell(r, endOvdP(r))}),
    ].filter(Boolean);
    const intAll = [
      col('Ставка', 'годовая ставка условий, действующих на начало отрезка (Р-21)', r => r.rate ? esc(r.rate)+' %' : '<span class="text-muted">—</span>'),
      col('Дней', 'дней в отрезке; при методе «30/360» — финансовые 30 × число месяцев', r => esc(r.days),
        {sum: r => r.days, fmt: v => v > 0 ? esc(String(v)) : '<span class="text-muted">—</span>'}),
      col('Начислено', 'база × ставка × дней ÷ день-базы — за этот отрезок', accCell,
        {sum: r => r.accrued || 0, fmt: money}),
      col('Нарастающим', 'начислено с начала транша по эту строку включительно', r => money(r.runInt), {run:true, last:true}),
      hasAcc && col('Накопленные', 'проценты, начисленные ДО реструктуризации: срок им назначил документ, разложив по позициям нового графика (ADR-0093 §1). Ставка на них не идёт — периодом они не порождаются', r => num(r.accDue),
        {sum: r => r.accDue}),
      hasAcc && col('Нарастающим', 'накопленные проценты, наступившие с начала транша', r => state(r.runAcc), {run:true, last:true}),
      /* «ПО ГРАФИКУ» — ТРЕБОВАНИЕ, А НЕ НАЧИСЛЕНИЕ (КВ-65). До этой волны блок процентов
         показывал одно «Начислено» (сумму отрезков), и «Просрочено» справа было числом
         ниоткуда: не с чем сверить. У тела ту же болезнь вылечила КВ-48 колонкой «По
         графику»; здесь ставится её пара. Величина уже есть в модели — `interestDue`
         (ADR-0105), ровно от неё считается база пени по процентам, и ровно она стоит в
         акте сверки. Расхождение с «Начислено» слева — не сбой: график построен по одному
         снимку условий, лист начисляет по отрезкам (Д-5), и разность подписана плашкой
         под таблицей. */
      col('По графику', 'сколько график требует заплатить процентами к этой дате: контрактные проценты позиции плюс отклонение за фактическое тело (ADR-0105). От «Начислено» слева отличается по смыслу: там — сколько набежало отрезком, здесь — сколько к этой дате обязаны внести. Именно эта величина — основание просрочки и база пени по процентам',
        dueICell, {sum: r => r.dueI, fmt: v => v < -0.005 ? `−${money(-v)}` : num(v)}),
      col('Нарастающим', 'потребовано графиком с начала транша по эту строку включительно; разность с «Погашено нарастающим» и есть просроченные проценты плюс наступившее сегодня', r => state(r.runDueI), {run:true, last:true}),
      col('Погашено', 'разнесено в проценты платежами этой даты', r => num(r.paid.interest),
        {sum: r => r.paid.interest}),
      col('Нарастающим', 'разнесено в проценты с начала транша по эту строку включительно', r => state(r.runPaidInt), {run:true, last:true}),
      hasOffI && col('Списано', 'проценты, снятые с баланса решением о признании долга безнадёжным в эту дату (Р-20, КВ-63). Решение списывает ВЕСЬ долг, а не одно тело: «Остаток» справа на эту сумму падает, просрочка процентов вместе с ним. Погашением не является — денег заёмщик не вносил', r => num(r.offInt),
        {sum: r => r.offInt}),
      hasOffI && col('Нарастающим', 'проценты, списанные с начала транша по эту строку включительно', r => state(r.runOffInt), {run:true, last:true}),
      /* МИНУС ЗДЕСЬ — ПЕРЕПЛАТА ПРОЦЕНТОВ (КВ-60), тем же знаком, что переплата тела в
         «Просрочено» (КВ-50). Пока ноль печатался прочерком, отрицательный остаток прятался
         вместе с нулём: у K-6 в проценты разнесено 22 000,00 при начисленных 19 226,28, и
         лист об этом молчал — прочерк читался как «ровно закрыто». */
      col('Остаток', 'начислено нарастающим − погашено нарастающим − списано нарастающим (КВ-63). Минус — погашено больше начисленного к этой дате', r => r.intLeft < -0.005
        ? `<span title="${jsAttr(r.runOffInt > 0.005
            ? 'списано и погашено процентов больше, чем лист начислил к этой дате, на ' + money(-r.intLeft)
              + ' — это НЕ переплата: решение о списании снимает проценты ПО ПОЗИЦИЯМ графика, а лист начисляет их ПО ОТРЕЗКАМ, и обе величины расходятся ровно там, где график построен по одному снимку условий (Д-5). Разность названа сводом раздела ниже'
            : 'погашено процентов больше начисленного к этой дате на ' + money(-r.intLeft)
              + ' — излишек идёт в счёт будущих начислений; переплата кредита деньгами живёт в своде отдельной статьёй')}">−${money(-r.intLeft)}</span>`
        : state(r.intLeft), {last:true}),
      col('Просрочено', 'проценты, срок которых наступил и не покрыт — вторая база пени. Минус — обратное: разнесено в проценты больше, чем график потребовал к этой дате (аванс в счёт будущих начислений)', overdueICell,
        {last:true, end: r => overdueICell(r, endOvdI(r))}),
    ].filter(Boolean);
    const odCols  = odAll.filter(x => calcRunOD  || !x.run);
    const intCols = intAll.filter(x => calcRunInt || !x.run);
    /* У пени нарастающих колонок нет — поэтому нет и третьего переключателя. Отсутствие
       кнопки там само себя объясняет: гасить в этом блоке нечего. */
    const penCols = [
      col('Начислено', 'пеня за отрезок: (просроч. тело × ставка ОД + просроч. проценты × ставка %) ÷ 100 × дней', r => num(r.penalty),
        {sum: r => r.penalty}),
      col('За день', 'цена одного дня просрочки на начало отрезка', r => num(r.penPerDay, 4)),
      col('Ставка', 'ставки пени на начало отрезка: по основному долгу / по процентам, % в день', r => esc(r.penRateMain)+' / '+esc(r.penRateInt)),
      col('Погашено', 'разнесено в пеню платежами этой даты', r => num(r.paid.penalty),
        {sum: r => r.paid.penalty}),
      hasOffP && col('Списано', 'пеня, снятая с баланса решением о признании долга безнадёжным в эту дату (Р-20, КВ-63). Снимается ТРЕБУЕМАЯ часть: приостановленную решением суда и спорную решение не трогает — их и так не требуют. Погашением не является — денег заёмщик не вносил', r => num(r.offPen),
        {sum: r => r.offPen}),
      col('Остаток', 'пеня нарастающим − погашено нарастающим − списано нарастающим (КВ-63)', r => state(r.penLeft), {last:true}),
    ].filter(Boolean);
    const headCells = (cols) => cols.map((cl, i) =>
      `<th${i ? '' : ' class="grp"'} style="text-align:right"${cl.title ? ` title="${jsAttr(cl.title)}"` : ''}>${cl.label}</th>`).join('');
    const bodyCells = (cols, r) => cols.map((cl, i) => {
      const t = cl.tdTitle ? cl.tdTitle(r) : '';
      return `<td${i ? '' : ' class="grp"'} style="text-align:right"${t ? ` title="${jsAttr(t)}"` : ''}>${cl.cell(r)}</td>`;
    }).join('');
    /* ИТОГОВАЯ ЯЧЕЙКА СОБИРАЕТСЯ ТЕМ ЖЕ СПИСКОМ, ЧТО И ШАПКА (КВ-58) — иначе итог поедет
       при первой же колонке «по составу». Поток печатается своим форматом (деньги, дни),
       состояние — вызовом ячейки на выбранной строке: подсказки, знак переплаты (КВ-50) и
       прочерк вместо нуля приходят вместе с ним, без второй реализации. */
    const totCells = (cols, rs) => cols.map((cl, i) => {
      const row = cl.last ? rs[rs.length - 1] : null;
      const v = cl.sum ? cl.fmt(round2(rs.reduce((a, r) => a + (cl.sum(r) || 0), 0)))
              : row ? (cl.end ? cl.end(row) : cl.cell(row)) : '';
      return `<td${i ? '' : ' class="grp"'} style="text-align:right">${v}</td>`;
    }).join('');
    /* ПЕРЕКЛЮЧАТЕЛЬ ЗОВЁТСЯ «ДЕТАЛИ» И СТОИТ У ПРАВОГО КРАЯ ЯЧЕЙКИ (КВ-58, владелец
       16.08.2026). Слово «нарастающим» на кнопке повторяло подпись колонок, которые она
       открывает, и читалось как ещё одна колонка в шапке статьи; «детали» называет действие,
       а не содержимое. Правый край — потому что кнопка не часть имени статьи: имя стоит по
       центру своего блока, управление показом отбито в угол. */
    const runSw = (block, on, n) => n === 0 ? '' : `<button class="runsw" onclick="event.stopPropagation();CR.toggleCalcRun('${block}')"
      title="${jsAttr(on ? 'Скрыть детали статьи — ' + plur(n, 'колонку', 'колонки', 'колонок') + ' «Нарастающим». Разовое число строки останется, а «сколько всего» ответят строка года, «Итого по траншу» и свод выше'
                        : 'Показать детали статьи — ' + plur(n, 'колонку', 'колонки', 'колонок') + ' «Нарастающим»: у каждой суммы появится её итог с начала транша по эту строку включительно')}">${on ? '▾' : '▸'} детали</button>`;
    const odRun  = odAll.filter(x => x.run).length;
    const intRun = intAll.filter(x => x.run).length;
    const dateHead = `<tr>
      <th class="rspan" rowspan="2" style="text-align:left" title="${jsAttr('дата события и начало отрезка; отрезок идёт до даты следующей строки, длина — в колонке «Дней»')}">Дата и событие</th>
      <th class="grp" colspan="${odCols.length}">Основной долг${runSw('od', calcRunOD, odRun)}</th>
      <th class="grp" colspan="${intCols.length}">Проценты${runSw('int', calcRunInt, intRun)}</th>
      <th class="grp" colspan="${penCols.length}">Пеня</th></tr><tr>
      ${headCells(odCols)}${headCells(intCols)}${headCells(penCols)}</tr>`;

    /* ГОДЫ ЛИСТА. Тот же приём, что на «Графике» (КВ-19) и в «Плане» (кварталы): 120–130
       строк сплошной лентой нечитаемы ровно тем же способом, каким были нечитаемы 19
       колонок. Умолчание — год даты среза; нет такого в листе — ближайший позади (расчёт
       остановлен раньше) либо первый. */
    const allYears = [...new Set(sheets.flatMap(s=>s.rows.map(r=>+r.date.slice(6,10))))].sort((a,b)=>a-b);
    const asOfYear = pd(cardAsOf).getFullYear();
    const defYear  = allYears.includes(asOfYear) ? asOfYear
      : (allYears.filter(y=>y<asOfYear).pop() ?? allYears[0]);
    const yKey = c.id+'|'+(sel?sel.no:'credit')+'|'+allYears.join(',');
    if (calcOpenYears === null || calcYearsKey !== yKey){
      calcOpenYears = new Set(allYears.length>1 ? [defYear] : allYears); calcYearsKey = yKey; }
    const openY = calcOpenYears;
    const allYOpen = allYears.length>1 && allYears.every(y=>openY.has(y));

    const dateRowHtml = (r) => {
      const ev = (r.events||[]);
      const evHtml = ev.length
        ? ev.map(e=>`<span class="pill ${evPill(e)}">${esc(e.label)}</span>`).join(' ')
        : '<span class="text-muted">—</span>';
      /* «НЕДОБОР / ДОСРОЧКА» ВТОРЫМ ЭТАЖОМ СНЯТЫ (разбор 16.08.2026). Подпись печатала
         r.dev — отклонение фактического тела от контрактного (ADR-0105) — и стоила второй
         строки в каждой ячейке начисления, а отвечала на вопрос, которого лист не задаёт:
         «сколько бы начислили, если бы платили ровно по графику». Само число живёт в
         модели (r.dev) и никуда не делось: фактическую сторону читатель видит прямо —
         база отрезка в «Остатке», требование графика в «По графику», разность между ними
         в «Просрочено» со знаком (КВ-50). */
      return `<tr>
        <td title="${jsAttr('отрезок ' + r.date + ' — ' + r.to + ' (' + r.days + ' дн.)')}"><span style="white-space:nowrap">${esc(r.date)}</span> ${evHtml}${r.paused?' <span class="pill neutral">начисление приостановлено</span>':''}</td>
        ${bodyCells(odCols, r)}${bodyCells(intCols, r)}${bodyCells(penCols, r)}</tr>`;
    };

    const sheetHtml = (s) => {
      /* Итоговые строки — обычные строки таблицы: каждая колонка называет свой итог ПОД
         СВОЕЙ шапкой (КВ-58). Ни одного colspan'а, кроме нулевого: геометрию больше не
         надо выводить из длин списков, а состав «по составу» и состояние переключателей
         деталей двигают итог сами собой — он собирается тем же массивом описателей. */
      const years = [...new Set(s.rows.map(r=>+r.date.slice(6,10)))].sort((a,b)=>a-b);
      const body = [];
      for (const y of years){
        const rs = s.rows.filter(r=>+r.date.slice(6,10)===y);
        const open = openY.has(y);
        body.push(`<tr class="gyear${open?' open':''}" onclick="CR.toggleCalcYear(${y})" title="${open?'Свернуть':'Развернуть'} ${y} год">
          <td><span class="gcar">${open?'▾':'▸'}</span><span class="gy">${y}</span>${y===asOfYear?'<span class="pill neutral">текущий</span>':''}<span class="gcnt">${plur(rs.length,'отрезок','отрезка','отрезков')}</span></td>
          ${totCells(odCols, rs)}${totCells(intCols, rs)}${totCells(penCols, rs)}</tr>`);
        if (open) rs.forEach(r=>body.push(dateRowHtml(r)));
      }
      /* Правый край листа называется ЗДЕСЬ и только здесь: конец последней строки —
         единственный, который не выводится из даты следующей (её нет). */
      body.push(`<tr class="gtot">
        <td>Итого по траншу №${esc(s.trancheNo)} <span class="text-muted" style="font:var(--font-label)">по ${esc(d.ledger.until)}</span></td>
        ${totCells(odCols, s.rows)}${totCells(intCols, s.rows)}${totCells(penCols, s.rows)}</tr>`);
      /* ПЛАШКА ПОДПИСЫВАЕТ ДВЕ СОСЕДНИЕ КОЛОНКИ (переписана при КВ-65). Пока «По графику» в
         блоке процентов не было, она объясняла расхождение с числом, которого на экране нет,
         — приходилось называть оба слагаемых словами. Теперь обе величины стоят в строке
         «Итого по траншу» рядом: «Начислено» — сумма отрезков, «По графику» — сумма
         требований позиций. Плашка отвечает на единственный вопрос, который эта пара
         поднимает: почему они не равны. Причина прежняя (Д-5) — начисление позиции есть
         контракт + отклонение, а контракт приходит из buildSchedule по ОДНОМУ снимку
         условий: ставка, изменённая допсоглашением, задним числом переписывает и прошлые
         периоды, тогда как отрезок считает по условиям своего начала. Молчать нельзя:
         строка печатает базу, ставку и дни, произведение которых иначе выглядит опиской. */
      const gapNote = Math.abs(s.gap) > 0.02 ? `<div class="warn-inline" style="margin-top:8px">${svgInfo()}<div>

        каждого периода, а по одному их снимку (Д-5). Разница ${money(Math.abs(s.gap))} ${esc(cur)};
        просрочка и пеня считаются от «По графику».
        <div class="gtoolbar" style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="CR.goToSchedule()">Перейти к графику</button></div></div></div>` : '';
      return `${sheets.length>1?`<div class="section-h" style="margin-top:18px">Транш №${esc(s.trancheNo)}</div>`:''}
        <div class="cgrid-wrap"><table class="cgrid tiered"><thead>${dateHead}</thead><tbody>${body.join('')}</tbody></table></div>
        ${gapNote}`;
    };

    const datesView = sheets.length ? `
      ${allYears.length>1?`<div class="gtoolbar" style="margin:0 0 8px">
        <span class="text-muted" style="font:var(--font-label)">Развёрнут${allYOpen?'ы все годы'
          :`о ${plur([...openY].filter(y=>allYears.includes(y)).length,'год','года','лет')} из ${allYears.length}`}</span>
        <span class="spacer"></span>
        <button class="btn btn-secondary btn-sm" onclick="CR.setCalcYears([${allYOpen?'':allYears.join(',')}])">${allYOpen?'Свернуть все годы':'Развернуть все годы'}</button>
      </div>`:''}
      ${sheets.map(sheetHtml).join('')}`
      : `<div class="cgrid-wrap"><table class="cgrid"><tbody><tr><td><div class="cgrid-empty">На дату среза ${esc(cardAsOf)} не наступила ни одна позиция графика — считать нечего</div></td></tr></tbody></table></div>`;

    const res=d.reserveAccrual;

      ${cgrid([{h:'Транш'},{h:'База',r:1},{h:'Ставка, %',r:1},{h:'Дней',r:1},{h:'Сумма',r:1}], res.perTranche.map(p=>`<tr><td>${esc(p.trancheId)}</td><td style="text-align:right">${money(p.base)}</td><td style="text-align:right">${esc(p.rate)}</td><td style="text-align:right">${esc(p.days)}</td><td style="text-align:right">${money(p.amount)}</td></tr>`))}`:'';
    return `
      ${svod}
      ${(()=>{ const rf=retroPendingFlags(c); if(!rf.length) return '';   // Д-5: тот же признак, что на «Условиях»
        return `<div class="warn-inline" style="margin-top:14px">${svgInfo()}<div>

          <div class="gtoolbar" style="margin-top:8px"><button class="btn btn-secondary btn-sm"

      <div class="section-h" style="margin-top:22px">Детальный расчёт ${!sel?'(по кредиту)':'(транш №'+sel.no+')'}</div>
      ${/* ПОДПИСИ У ЛИСТА НЕТ (решение владельца 16.08.2026). Что она несла: (1) «строка —
            критическая дата и период после неё, день не дробится» — читается из самих
            колонок листа (дата · дней · база · ставка · начислено); (2) перечень
            событий-границ — из колонки «Событие»; (3) отсылка к «Условиям» за ставками и
            методом дней — вкладка «Условия» стоит в том же переключателе карточки.
            ПЕРЕКЛЮЧАТЕЛЯ ВИДОВ ТОЖЕ НЕТ (КВ-64): вид один, и панель из одной кнопки,
            которая ничего не переключает, — чистый хром. */''}
      ${datesView}
      ${resBlock}`;
  }

  /* ---- ВКЛАДКА 7: Платежи (зеркало модуля платежей, Р-5) ---- */
  function tabPlatezhi(c,d){

      const mTone={'Подтверждён ЦК':'low','Восстановлен':'low','Ожидает ЦК':'mid','Сторно (таймаут)':'high','Расхождение':'mid'}[p.match]||'neutral';

        <td>№${esc(p.tranche)}</td>

        <td style="text-align:right">${money(pr)}</td><td style="text-align:right">${money(it)}</td><td style="text-align:right">${money(pe)}</td>
        <td>${esc(p.method||'денежными средствами')}</td>
        <td>${esc(p.reg)}</td><td><span class="pill ${mTone}">${esc(p.match)}</span></td><td>${p.frozen?'заморожен':'—'}</td>
        <td>${counts?'<span class="pill low">двигает остаток</span>':'<span class="pill neutral">не двигает</span>'}</td>

      <td style="text-align:right">${money(ptot.principal)}</td><td style="text-align:right">${money(ptot.interest)}</td><td style="text-align:right">${money(ptot.penalty)}</td>
      <td></td><td></td><td></td><td></td><td></td><td></td></tr>`:'';
    const b=d.debt;
    const drow=(name,x)=>`<tr><td>${name}</td><td style="text-align:right">${money(x.accrued)}</td><td style="text-align:right">${money(x.paid)}</td><td style="text-align:right;color:${x.overdue>0?'var(--asubk-red)':'inherit'}">${money(x.overdue)}</td><td style="text-align:right">${money(x.bal)}</td></tr>`;
    /* §10.4 — множественность слоёв при судебном решении. Признак берём из ЗЕРКАЛА
       СУДА (mirror.court), а не регуляркой по строке фазы взыскания: прежняя проверка
       искала «суд|решени» в тексте процесса и не находила его у К-3, K-C13 и K-C14,

    const hasCourt=(c.mirror.court||[]).length>0;
    return `
      <div class="section-h">Платежи ${lockHtml()}</div>
      ${/* Волна 11.08.2026 (третья): «три оси» дословно повторяли три колонки таблицы, а правило
            «двигает ли платёж остаток» разбиралось в абзаце над колонкой «В расчёте», которая

      <p class="section-note">Зеркало модуля платежей${c.mirror.paymentsAsOf?`, снимок <b>${esc(c.mirror.paymentsAsOf)}</b>`:''}.

      ${cgrid([{h:'№'},{h:'Дата'},{h:'Транш'},{h:'Сумма',r:1},{h:'Осн.',r:1},{h:'Проц.',r:1},{h:'Пеня',r:1},{h:'Вид'},{h:'Регистрация'},{h:'Сопоставление'},{h:'Заморозка'},{h:'В расчёте'},{h:'Правка'}], payRows.concat(payTot?[payTot]:[]), {empty:'Платежей нет'})}
      <div class="mirror-src">Источник: модуль платежей. Ручной ввод — вызов формы владельца: ему основанием служит список ЦК, поэтому до сверки он остатки не двигает. Разнесение приходит в валюте кредита; сумма и курс — реквизиты поступления.</div>
      <div class="gtoolbar" style="margin-top:12px">${roleBtn('savePayment','Внести платёж вручную','CR.openPaymentModal()','btn btn-primary btn-sm')}</div>
      ${d.courtLayers.length?`<div class="info-plate">${svgInfo()}<div>По кредиту есть <b>слой долга под решением суда</b>:
        ${d.courtLayers.map(L=>`${esc(L.kind)} от ${esc(L.date)}${L.il?' · '+esc(L.il):''} на <b>${money(L.amount)}</b> — ${esc(L.mode.label)}`).join('<br>')}<br>
        Режим определяется ДАТОЙ решения и прилипает к нему навсегда: у одного кредита бывает несколько решений с разными режимами одновременно.
        Присуждённое покрывает взносы в порядке «самое раннее просроченное → дальше», пока не исчерпается (ADR-0060 §3); на накрытые позиции начисление остановлено.</div></div>`
      :hasCourt?`<div class="info-plate">${svgInfo()}<div>По кредиту есть судебное решение (${esc((c.mirror.court[0]||{}).kind||'')} от ${esc((c.mirror.court[0]||{}).date||'')}) <b>без присуждённой суммы</b> — слоя долга оно не образует, начисление идёт полностью по договору. Последствия банкротства принадлежат взысканию.</div></div>`:''}
      <div class="section-h" style="margin-top:22px">Задолженность по статьям (из детального расчёта на ${esc(cardAsOf)})</div>
      <div class="cgrid-wrap"><table class="cgrid"><thead><tr><th>Статья</th><th style="text-align:right">Начислено</th><th style="text-align:right">Погашено</th><th style="text-align:right">Просрочено</th><th style="text-align:right">Остаток</th></tr></thead><tbody>
        ${debtArticlesOf(b).map(a=>drow(a.label, b[a.key])).join('')}
      </tbody></table></div>
      ${(() => {
        const q = d.queue || { asOf:d.calcUntil, rows:[] };
        const over = round2(q.rows.filter(r => r.urg === 'over').reduce((a,r) => a + r.amount, 0));
        const rows = q.rows.map(r => `<tr${r.future?' style="color:var(--text-muted)"':''}>
          <td>${esc(r.due)}<br>${r.future
              ? '<span class="pill neutral">не наступило</span>'
              : '<span class="pill high">просрочено</span>'}</td>
          <td>${r.layer==='free'
              ? '—'
              : `<span class="pill mid">${esc(r.layer)}</span><br><span class="text-muted" style="font:var(--font-label)">${esc(r.layerLabel)}</span>`}</td>
          <td>${r.tranche==null?'<span class="text-muted">по кредиту</span>':'№'+esc(r.tranche)}</td>
          <td>${esc(r.article)}</td>
          <td style="text-align:right">${money(r.amount)}</td></tr>`);
        const foot = q.rows.length?`<tr style="font-weight:var(--weight-semibold);background:var(--surface-panel)">
          <td colspan="4">Итого просроченного</td><td style="text-align:right">${money(over)}</td></tr>`:'';
        const when = d.calcStopped
          ? `на <b>${esc(q.asOf)}</b> — дату остановки начисления, а не на дату среза ${esc(cardAsOf)}: расчёт закрытого кредита замер`
          : `на <b>${esc(q.asOf)}</b>`;
        /* Подпись «Σ просроченных строк = X — та же величина, что в своде по статьям выше»
           снята волной 11.08.2026 (третья): итоговая строка таблицы называет ту же сумму,
           а свод стоит двумя секциями выше — сверить их можно взглядом. */
        return `
      <div class="section-h" style="margin-top:22px">Очередь погашения <span class="pill info">отдаётся в ПЛАТЕЖИ</span></div>
      <p class="section-note">Непогашенное ${when}. Порядок один — по дате наступления, независимо от того, чей это транш;
        внутри даты — по очерёдности статей. Ненаступившее показано серым хвостом для обзора, но в разнесение платежей
        не попадает — туда идут только наступившие строки (<b>ADR-0057 §1</b>).${d.calcProvisional

  /* ---- ВКЛАДКА 8: План (ADR-0042) ----
     План — единственная ВВОДИМАЯ величина среди трёх ориентиров, и это явное исключение
     из ADR-0001, поэтому подписано прямо на вкладке. Исполнение и прогноз — производные.
     Имя вкладки сокращено до «План» волной 03.08.2026 (вторая): исполнение — не второй
     предмет вкладки, а способ прочитать план, и двойное имя ставило его вровень с планом.
     Прогноз здесь остаётся КОЛОНКОЙ — ориентиром при постановке цели (предзаполнение формы,
     ADR-0042 §2); сам прогноз как предмет живёт на своей вкладке, гранулярностью транша. */
  function tabPlan(c,d){
    /* Охват вкладки — ОДИН год, выбранный селектором (правка 11.08.2026 к КВ-22: разрез
       на весь срок тремя уровнями отменён владельцем — показываем только выбранный год).
       Набор годов берётся из данных (planYearsList), а не из смещения от даты среза:
       это единственное, что от КВ-22 осталось, и именно оно чинило дыру, из-за которой
       последние месяцы срока не открывались никогда. */
    const years = planYearsList(c, cardAsOf);
    const year  = years.includes(planYear) ? planYear : planDefaultYear(years, cardAsOf);
    const pe    = (year === d.planExec.year) ? d.planExec : planExecOf(c, cardAsOf, d.ledger.index, year);
    const cur   = c.currency;
    const pctPill = (p) => p == null ? '<span class="text-muted">—</span>'
      : `<span class="pill ${p >= 100 ? 'low' : p >= 80 ? 'mid' : 'high'}">${p} %</span>`;
    const monthRow = (r) => {
      const open = planOpenMonth === r.month;
      const prow = planRowOf(c, r.month);
      const main = `<tr class="pmonth${r.dropped?' text-muted':''}" style="cursor:${prow?'pointer':'default'}"${prow?` onclick="CR.togglePlanMonth('${jsAttr(r.month)}')"`:''}>
        <td>${esc(r.label)}${r.removed?' <span class="pill neutral">план снят</span>':''}</td>
        <td style="text-align:right">${r.forecast==null?'—':money(r.forecast)}</td>
        <td style="text-align:right">${r.plan==null?'—':`<b>${money(r.plan)}</b>`}</td>
        <td style="text-align:right">${money(r.fact)}</td>
        <td style="text-align:right">${pctPill(r.pct)}</td>
        ${/* Колонка «Правки» держит правки, и только их. «В расчёт не входит» стояло на
              каждом месяце без плана — семь строк из двенадцати у K-1 — и повторяло то,
              что строка уже говорит собой: она приглушена целиком, а в Плане и Исполнении
              прочерки. «Месяц не наступил» остаётся: у такого месяца план ЕСТЬ, и прочерк
              в проценте без подписи читался бы как сбой. */''}
        <td>${r.future && !r.dropped ? '<span style="font:var(--font-label)">месяц не наступил</span>'
          :(r.edits?`правок: ${r.edits}`:'—')}</td></tr>`;
      if (!open || !prow) return main;
      /* prev === null — это восстановление ПОСЛЕ снятия: писать «было 0,00» неверно,
         нуля там не стояло, стояло отсутствие цели. */
      const hist = prow.history.length
        ? prow.history.map(h=>`<div class="hrow"><b>${esc(h.at)}</b> · ${esc(h.by)} · было <b>${h.prev==null?'план снят':money(h.prev)}</b> → стало <b>${prow.amount==null?'снят':money(prow.amount)}</b>${h.note?' · '+esc(h.note):''}</div>`).join('')
        : '<div class="hrow text-muted">Правок не было</div>';
      return main + `<tr><td colspan="6" style="background:var(--surface-panel)">
        <div style="font:var(--font-label);color:var(--text-muted);margin-bottom:6px">Поставил: ${esc(prow.setBy)} · ${esc(prow.setAt)}${prow.seededFrom!=null?` · предзаполнено прогнозом: ${money(prow.seededFrom)}`:''}</div>
        ${hist}
        ${prow.amount!=null?`<div style="margin-top:8px">${actBtn(c,'setPlan',{rows:[{month:prow.month,amount:null}]},'Снять план',`CR.openDropPlanModal('${jsAttr(prow.month)}')`)}</div>`:''}</td></tr>`;
    };
    /* В колонке плана — цель периода целиком, в проценте — только наступившие месяцы;
       чтобы это не читалось как ошибка, ненаступившая часть подписана отдельно. */
    const ahead = (a) => a ? `<div style="font:var(--font-label);color:var(--text-muted)">впереди ${money(a)}</div>` : '';
    /* КВАРТАЛ И МЕСЯЦ В ОДНОЙ ТАБЛИЦЕ (КВ-21). Было две таблицы одного предмета:
       помесячная и отдельной карточкой ниже «Итоги года». Разные наборы колонок под
       одними именами заставляли сверять «1 квартал» с тремя строками выше глазами.
       Теперь квартал — СТРОКА-ГРУППА той же таблицы: её План/Факт/Исполнение стоят под
       своими колонками, месяцы квартала лежат под ней и сворачиваются кликом.
       Строки «За год» в таблице НЕТ: год целиком держат четыре плитки шапки (тот же довод,
       по которому одногодичный «График» не получает строки года).
       Прогноз у квартала — прочерк: он ориентир при постановке цели ПО МЕСЯЦУ (ADR-0042 §2),
       квартальной суммы прогноза модель не считает и придумывать её здесь нечего. */
    /* Умолчание раскрытия — ОДИН квартал (правка 11.08.2026 к КВ-21). «Все четыре раскрыты»
       давали двенадцать строк первым экраном, и год перестал читаться целиком: итоги
       кварталов, ради которых КВ-21 и завёл строку-группу, тонули между месяцами.
       Раскрыт квартал даты среза — тот же приём, которым КВ-19 раскрывает год «Графика», а
       planDefaultYear выбирает год: выбранный год позади среза — последний квартал (там
       кончается история), впереди — первый. Ноль раскрытых умолчанием не бывает: таблица
       из одних итогов читается как «месячных данных нет». */
    const asOfY = pd(cardAsOf).getFullYear();
    const curQ  = (asOfY === pe.year) ? Math.floor(pd(cardAsOf).getMonth()/3) + 1 : null;
    const qKey = c.id + '|' + year;
    if (planOpenQuarters === null || planQuartersKey !== qKey){
      planOpenQuarters = new Set([curQ || (pe.year < asOfY ? 4 : 1)]); planQuartersKey = qKey; }
    const openQ = planOpenQuarters;
    const allQOpen = [1,2,3,4].every(q => openQ.has(q));
    const rows = [];
    pe.quarters.forEach(q => {
      const open = openQ.has(q.q);
      /* Подпись справа отвечает на «по скольким месяцам это посчитано»: план квартала —
         по месяцам с планом, процент — только по наступившим из них. Без неё «—» в
         проценте у квартала с планом читался бы как сбой. */
      const note = q.months
        ? `${q.months} из 3 мес. с планом` + (q.monthsDone < q.months ? ` · наступило ${q.monthsDone}` : '')
        : 'плана на квартал нет';
      rows.push(`<tr class="gyear${open?' open':''}" onclick="CR.togglePlanQuarter(${q.q})" title="${open?'Свернуть':'Развернуть'} ${q.q} квартал">
        <td><span class="gcar">${open?'▾':'▸'}</span><span class="gy">${q.q} квартал</span>${q.q===curQ?'<span class="pill neutral">текущий</span>':''}</td>
        <td style="text-align:right" class="text-muted">—</td>
        <td style="text-align:right">${q.months?`<b>${money(q.plan)}</b>`:'<span class="text-muted">—</span>'}${ahead(q.planAhead)}</td>
        ${/* Квартал без плана не пишет «0,00» ни в план, ни в факт: ноля там не считали —
             в сумму квартала входят только месяцы с планом, а их ноль. Прочерк и подпись
             «плана на квартал нет» говорят это прямо; «0,00» читалось бы как «не собрали». */''}
        <td style="text-align:right">${q.months?`<b>${money(q.fact)}</b>`:'<span class="text-muted">—</span>'}</td>
        <td style="text-align:right">${pctPill(q.pct)}</td>
        <td class="gyear-s">${note}</td></tr>`);
      if (!open) return;                                  // квартал свёрнут — стоит одной итоговой строкой
      pe.rows.slice((q.q-1)*3, q.q*3).forEach(r => rows.push(monthRow(r)));
    });
    const pt = pe.total;
    return `
      <div class="section-h">План и его исполнение ${derivedHtml()}</div>
      ${/* Абзаца-подсказки над таблицей НЕТ (правило волны 11.08.2026: правило живёт там, где его
            нарушают — в форме ввода). Всё, что он говорил, уже сказано ближе к делу: «план —
            вводимая цель, от прогноза после сохранения не зависит (ADR-0042)» и «прогноз —
            стартовое значение формы» стоят в модалке «Поставить план», где план и ставят;
            что прогноз разбирается по позициям транша — говорит вкладка «Прогноз» своим
            заголовком в той же ленте вкладок. Пересказывать это над таблицей, которую читают
            ПОСЛЕ ввода, значило бы дать правило тому, кто уже не может его нарушить. */''}
      ${/* Плитки держат ВЫБРАННЫЙ ГОД целиком — таблица под ними разложена на кварталы и
            месяцы, и годовой строки в ней нет: величина стоит ровно в одном месте. */''}
      <div class="phead-dims" style="grid-template-columns:repeat(4,1fr)">
        ${dimTile(`План за ${pe.year}`, pt.plan?money(pt.plan):'—',
          esc(cur) + (pt.planAhead?` · впереди ${money(pt.planAhead)}`:''))}
        ${dimTile(`Факт за ${pe.year}`, money(pt.fact), 'по месяцам с планом')}
        ${/* Подпись не повторяет факт из соседней плитки: новое здесь только план по
              НАСТУПИВШИМ месяцам (знаменатель процента) и состав факта — единственное,
              чего нигде на экране не видно. */''}
        ${dimTile('Исполнение', pt.pct==null?'—':pt.pct+' %',
          pt.planDone?`план ${money(pt.planDone)} по наступившим месяцам; расходы взыскания в факт не входят`
                     :'наступивших месяцев с планом нет')}
        ${dimTile('Месяцев с планом', `${pt.monthsWithPlan} из 12`, `наступило ${pt.monthsDone}`)}
      </div>
      ${/* Селектор года — охват вкладки. Годы берутся из данных кредита (planYearsList):
            весь срок, все годы с планом и все годы с засчитанным фактом. */''}
      <div class="gtoolbar" style="margin-top:14px">
        <div class="field" style="max-width:200px"><span class="flabel">Год</span><div class="control"><select onchange="CR.setPlanYear(+this.value)">${years.map(y=>`<option value="${y}"${y===pe.year?' selected':''}>${y}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <span class="spacer"></span>
        ${actBtn(c,'setPlan',{rows:[{month:monthKey(cardAsOf),amount:1}]},'Поставить план','CR.openPlanModal()','btn btn-primary btn-sm')}
      </div>
      <div class="gtoolbar" style="margin:10px 0 8px">
        <span class="text-muted" style="font:var(--font-label)">Развёрнут${allQOpen?'ы все четыре квартала'
          :`о ${plur(openQ.size,'квартал','квартала','кварталов')} из 4`}</span>
        <span class="spacer"></span>
        <button class="btn btn-secondary btn-sm" onclick="CR.setPlanQuarters([${allQOpen?'':'1,2,3,4'}])">${allQOpen?'Свернуть все кварталы':'Развернуть все кварталы'}</button>
      </div>
      ${cgrid([{h:'Период'},{h:'Прогноз',r:1},{h:'План',r:1},{h:'Факт',r:1},{h:'Исполнение',r:1},{h:'Правки'}], rows)}`;
  }

  /* ---- ВКЛАДКА 9: Обеспечение (зеркало залогового модуля, Р-7) ---- */
  function tabObespechenie(c,d){
    const cov=d.coverage, light=cov.ok?'var(--asubk-green)':'var(--asubk-red)';
    /* Волна 03.08.2026 (КР-56): оба основания освобождения от порога — owned-поля кредита, живут во вкладке
       «Договор» (Р-8: владение только там). Но ЧИТАЮТ их здесь: порог в плитке подписан
       «по решению КМ» без номера решения, а waiver до этой волны не выводился вообще
       (КР-56) — экран показывал красный статус и молчал о том, почему освоение прошло.
       Ниже — read-only выжимка со ссылкой на владельца; правка остаётся в «Договоре». */
    const km=c.kmDecision, wv=c.pledgeWaiver;
    const waiverActive = !!wv && !cov.ok;             // waiver значим ровно тогда, когда порог не пройден
    const pledgeList=(c.mirror.pledges||[]);
    const pledgeRows=[];
    let sumAppr=0, sumPledge=0;
    /* Ликвидность и запрет на отчуждение — свойства ПРЕДМЕТА (ADR-0011, КР-30):
       ликвидность определяется видом предмета по справочнику, запрет «принадлежит вещи,
       а не договору». Прежде оба поля жили на залоговом договоре, и все его предметы
       наследовали одну ликвидность — это же расходилось с модулем залога. */
    for(const p of pledgeList) for(const it of (p.items||[])){
      sumAppr+=it.appraised||0; sumPledge+=it.pledgeValue||0;
      const liq=itemIsLiquid(it);
      pledgeRows.push(`<tr>
        <td>${esc(p.contractNum)}</td><td>${esc(p.notary||'—')}</td><td>${esc(it.name)}</td><td>${esc(it.kind)}</td>
        <td style="text-align:right">${money(it.appraised)}</td><td style="text-align:right">${money(it.pledgeValue)}</td><td style="text-align:right">${Math.round((it.share==null?1:it.share)*100)}%</td>
        <td title="${jsAttr('Класс ликвидности вида «'+it.kind+'» — справочник модуля залога')}">${liq?'<span class="pill low">ликвид</span>':'<span class="pill mid">неликвид</span>'}${itemIsMovable(it)?' <span class="pill neutral">движимое</span>':''}</td>
        <td>${it.ban?'<span class="pill info">запрет</span>':'—'}</td>
        <td>${(p.otherCredits&&p.otherCredits.length)?esc(p.otherCredits.join(', ')):'—'}</td></tr>`);
    }
    const bg=c.mirror.bankGuarantee, guars=(c.mirror.guarantees||[]);
    const insp=(c.mirror.inspections||[]);
    const inspRows=insp.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.obj)}</td><td>${esc(x.curator)}</td><td><span class="pill ${x.ok?'low':'high'}">${esc(x.res)}</span></td><td>${x.file?esc(x.file):'—'}</td></tr>`);
    const svod = pledgeList.length ? `
      <div class="phead-dims" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        <div class="dim"><div class="dl">Действующих договоров</div><div class="dv">${pledgeList.length} ед.</div></div>
        <div class="dim"><div class="dl">Σ оценочная</div><div class="dv">${money(sumAppr)}</div></div>
        <div class="dim"><div class="dl">Σ залоговая</div><div class="dv">${money(sumPledge)}</div></div>
      </div>` : '';
    return `
      <div class="section-h">Обеспечение ${lockHtml()}</div>
      ${/* Подпись «Зеркало залогового модуля…» снята волной 11.08.2026 (третья): то же самое
            говорят замок у заголовка, строка источника под таблицей и ярлыки кнопок внизу
            («Договор залога заводится в модуле залога»). */''}
      ${svod}
      ${cgrid([{h:'Договор залога'},{h:'Нотариус'},{h:'Предмет'},{h:'Вид'},{h:'Оценочная',r:1},{h:'Залоговая',r:1},{h:'Доля'},{h:'Ликвидность'},{h:'Запрет отчуждения'},{h:'Также обеспечивает'}], pledgeRows, {empty:'Обеспечение не привязано'})}
      <div class="mirror-src">Источник: модуль залога. Данные read-only.</div>
      <div class="section-h" style="margin-top:22px">Обеспеченность ${lockHtml()}</div>
      <p class="section-note">Индекс НОРМИРОВАН на порог: 100 % = порог выполнен, при любом пороге.
        У залоговой стоимости и у банковской гарантии пороги РАЗНЫЕ, поэтому индекс — сумма двух
        нормированных слагаемых.</p>
      <div class="phead-dims" style="grid-template-columns:repeat(${cov.liqApplies?5:4},1fr)">
        <div class="dim"><div class="dl">Индекс обеспеченности</div><div class="dv"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span>${cov.index==null?'—':Math.round(cov.index*100)+'%'}</div>
          ${cov.idxGuar?`<div class="src">залог ${Math.round(cov.idxPledge*100)}% + гарантия ${Math.round(cov.idxGuar*100)}%</div>`
                       :(cov.ratio!=null?`<div class="src">отношение залоговой к базе ${Math.round(cov.ratio*100)}%</div>`:'')}</div>
        <div class="dim"><div class="dl">Порог</div><div class="dv">${cov.req==null?'—':cov.req+'%'}</div>${cov.reqFromKm?`<div class="src">по решению КМ${km&&km.num?' '+esc(km.num):''}${km&&km.date?' от '+esc(km.date):''}</div>`:''}${cov.gReq?`<div class="src">гарантия — ${cov.gReq}%${cov.gReq>100?' (иная валюта)':''}</div>`:''}</div>
        ${cov.liqApplies?`<div class="dim"><div class="dl">Доля ликвида</div><div class="dv" style="color:${cov.liqOk?'inherit':'var(--danger,#b3261e)'}">${Math.round(cov.liqShare*100)}%</div><div class="src">минимум ${cov.liqMin}% суммы под риском</div></div>`:''}
        <div class="dim"><div class="dl">Сумма под риском</div><div class="dv">${money(d.atRisk)}</div><div class="src">остаток ОД ${money(d.debt.principal.bal)} + не освоено ${money(Math.max(0,d.undisbursed))}</div></div>
        <div class="dim"><div class="dl">Статус</div><div class="dv" style="color:${light}">${!cov.applicable?'неприменима':cov.ok?'достаточно':(cov.covOk===false?'недостаточно':'состав не соответствует')}</div>${
          /* Волна 03.08.2026: статус остаётся красным — обеспеченности действительно нет. Waiver
             не делает её достаточной, он снимает БЛОКИРОВКУ Г-6/Г-7; подкрашивать плитку
             зелёным значило бы врать о составе обеспечения. */
          waiverActive?'<div class="src">гейт снят waiver’ом комиссии — освоение и регистрация возможны</div>':''}</div>
      </div>
      <div class="mirror-src">${esc(cov.source)}${cov.mirror?` · залоговая ${money(cov.mirror.pledgeValue)} (ликвид ${money(cov.mirror.liquidValue)} · неликвид ${money(cov.mirror.illiquidValue)})${cov.mirror.bankGuarantee?` + банковская гарантия ${money(cov.mirror.bankGuarantee)} при своём пороге ${cov.mirror.guaranteeReq}%`:''} · снимок ${esc(cov.mirror.asOf)}`:''}</div>
      ${(km||wv)?`<div class="section-h" style="margin-top:22px">Основания освобождения от порога</div>
        ${/* Подпись «здесь только читаются — правка во вкладке „Договор“» снята: ровно это
              написано на кнопке под секцией, и она туда же ведёт. */''}
        ${km?`<div class="f2">${fld('Решение КМ', esc(km.kind||'Решение КМ')+' '+esc(km.num||'')+(km.date?' от '+esc(km.date):''))}${fld('Порог по решению', km.coverPct==null?null:(esc(km.coverPct)+' %'+(+km.coverPct===0?' — полное освобождение от порога':'')))}${fld('Скан', km.scan?esc(km.scan):null)}</div>`:''}
        ${wv?`<div class="f2"${km?' style="margin-top:10px"':''}>${fld('Waiver комиссии по залогу',
            'выдан '+esc(wv.when)+(waiverActive?' <span class="pill info">применён</span>':' <span class="pill neutral">не требуется — порог пройден</span>'))}${fld('Обоснование', esc(wv.reason), {span:true, wrap:true})}</div>`:''}
        <div class="gtoolbar" style="margin-top:6px"><button class="btn btn-secondary btn-sm" onclick="CR.openTab('Договор')">Изменить во вкладке «Договор»</button></div>`:''}
      ${bg?`<div class="section-h" style="margin-top:22px">Банковская гарантия (в индексе, со своим порогом)</div>
        <div class="f2">${fld('Банк',esc(bg.bank))}${fld('Сумма',money(bg.amount))}${fld('Валюта гарантии',esc(bg.currency||c.currency||'KGS'))}${fld('Действует до',esc(bg.till))}</div>
        <div class="mirror-src">Порог гарантии ${cov.mirror&&cov.mirror.guaranteeReq?cov.mirror.guaranteeReq:100} % — ${(bg.currency||c.currency||'KGS')===(c.currency||'KGS')?'валюта гарантии совпадает с валютой кредита':'валюта гарантии отличается от валюты кредита, порог с курсовым запасом'}.${cov.mirror&&cov.mirror.guaranteeExpired?' Срок гарантии истёк — в индекс не входит.':''}</div>`:''}
      ${guars.length?`<div class="info-plate">${svgInfo()}<div>Поручительство (${guars.map(g=>esc(g.party)).join(', ')}) — параллельный слой обеспечения. В индекс обеспеченности НЕ входит: у поручительства нет предмета, а значит и залоговой стоимости.</div></div>`:''}
      <div class="section-h" style="margin-top:22px">Обследования предметов залога ${lockHtml()}</div>
      ${cgrid([{h:'Дата'},{h:'Договор / предмет'},{h:'Куратор'},{h:'Результат'},{h:'Вложение'}], inspRows, {empty:'Обследований не проводилось'})}
      <div class="mirror-src">Источник: модуль залога. Акты обследования read-only — заводятся в модуле залога.</div>
      <div class="gtoolbar" style="margin-top:16px">
        ${roleBtn('linkPledge','Привязать существующий','CR.openPledgePicker()','btn btn-primary btn-sm')}
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор залога заводится в модуле залога — вне объёма макета')">+ Договор залога</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор поручительства заводится в модуле залога — вне объёма макета')">+ Договор поручительства</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля залога — вне объёма макета')">Открыть в модуле залога</button>
      </div>`;
  }

  /* ---- ВКЛАДКА 10: Проблемные ---- */
  function tabProblemnye(c,d){
    /* КР-6 · вкладка БОЛЬШЕ НЕ СЧИТАЕТ категорию сама. Прежде она пересчитывала worst-of
       своими двумя строками и не применяла послабление: у K-C16 (220 дн.) и K-C19 (210 дн.)
       шапка показывала «средний», а вкладка — «по просрочке: высокий» при итоге
       «худшая: средний». Экран противоречил сам себе. Теперь обе читают d.riskBasis —
       единственный источник (ADR-0012), и вкладка только разбирает его вывод. */
    const rb=d.riskBasis;
    const rs=c.mirror.restructuring||{count:0,active:null};
    /* Взыскание — таблица ТРЕБОВАНИЙ (ADR-0002): строка = процесс × кредит × обязанное
       лицо. Прежняя таблица показывала процессы и не знала обязанного лица вовсе, а фазу
       держала полем — что запретил ADR-0003 (фаза есть свёртка журнала мер). */
    const claimRows=(c.mirror.claims||[]).map(x=>`<tr>
      <td>${esc(x.claimId)}</td>
      <td>${esc(x.obligor.name)}<br><span style="color:var(--text-muted);font-size:11px">${esc(x.obligor.role)} · ИНН ${esc(x.obligor.inn)}</span></td>
      <td>${esc(x.scope)}</td><td>${esc(x.phase)}</td><td>${esc(x.stage)}</td><td>${esc(x.unit)}</td>
      <td style="text-align:right">${money(x.amount)}</td><td>${esc(x.since)}</td>
      <td class="text-muted" style="font:var(--font-label)">${x.lastMeasure?esc(x.lastMeasure):'—'}</td>
      <td><a class="rowlink" onclick="CR.toast('Процесс ${jsAttr(x.processId)} — открывается в модуле взыскания')">${esc(x.processId)}</a></td></tr>`);
    const hasBankruptcy=d.stateFlags.some(o=>o.kind==='bankruptcy');
    const courtRows=(c.mirror.court||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.org)}</td><td><span class="pill ${x.ok?'low':'mid'}">${esc(x.res)}</span></td><td>${x.file?esc(x.file):'—'}</td></tr>`);
    const factRows=(c.factors||[]).map(f=>{const act=rb.factors.includes(f);
      return `<tr${act?'':' style="opacity:.55"'}><td>${esc(f.kind)}</td><td><b class="cat-${catClsOf(f.level)}">${esc(f.level)}</b></td>

  function docState(s){
    const map={'принят':'low','не требуется':'neutral','на проверке':'info','загружен':'info','требуется':'mid','отклонён':'high','просрочен':'high'};
    return `<span class="pill ${map[s]||'neutral'}">${esc(s||'—')}</span>`;
  }
  function noteTypePill(t){
    const map={'Обычное':'neutral','Примечание куратора':'info','Примечание (ОПП)':'mid','Примечание (залог)':'low','Примечание (ОИП)':'neutral'};
    return `<span class="pill ${map[t]||'neutral'}">${esc(t||'Обычное')}</span>`;
  }
  function tabDosye(c,d){

    const prog=programDocs(c);
    const reqRows=d.docs.required.map(r=>{
      const x=r.doc;
      /* Примечание документа снято из колонки (пустая в подавляющем большинстве строк) —
         живёт в модалке, на вкладке доступно наведением на наименование. */
      return `<tr><td>${esc(r.kind)} <span class="pill mid">обязателен</span></td><td${x&&x.note?` title="${esc(x.note)}"`:''}>${x?esc(x.name):'—'}</td>

        <td>${x&&x.file?esc(x.file):'—'}</td>

    const extraRows=d.docs.extra.map(x=>`<tr><td>${esc(x.kind)}${prog.opt.includes(x.kind)?' <span class="pill neutral">опционален</span>':''}</td><td${x.note?` title="${esc(x.note)}"`:''}>${esc(x.name)}</td>
        <td>${docState(x.state)}</td><td>${esc(x.date)}</td>
        <td>${x.file?esc(x.file):'—'}</td>
        <td>${roleBtn('editDocs','Изменить',`CR.openDocModal('${jsAttr(x.kind)}')`,'btn btn-secondary btn-sm')}</td></tr>`);

    const curRows=(c.mirror.curatorship||[]).map(x=>`<tr><td>${esc(x.unit)}</td><td>${esc(x.employee)}</td><td>${esc(x.role)}</td><td>${esc(x.from)}</td><td>${esc(x.to||'—')}</td></tr>`);

    /* Порядок записей одного дня задаётся счётчиком seq (КР-17): даты в макете без
       времени, и две записи одного дня были неотличимы по порядку. Сортируем по seq
       убыванием — свежие сверху; записи без seq (архивные) уходят в конец. */
    const auditRows=(c.audit||[]).slice().sort((a,b)=>(b.seq||0)-(a.seq||0))
      .map(a=>`<div class="hrow"><div class="hwhen">${esc(a.when)} · ${esc(a.who)}</div><div class="hwhat">${esc(a.what)}</div></div>`);
    return `
      <div class="section-h">Документы кредита ${d.docs.complete?'<span class="pill low">комплект собран</span>':''}</div>
