                   : -periodInterest(t, cnd, a, b, -dev, mppP, dOver));
      extra = round2(extra + e);
      if (i === 0) dev0 = dev;
      const paused = ((t.accrualHold) || []).some(h => h && h.from &&
        pd(h.from) <= b && (!h.to || pd(h.to) >= b));
      /* база ОТРЕЗКА — фактическое непогашенное тело: то, на что реально бегут
         проценты, и то, что колонка «База» обязана показать (ADR-0128 §3) */
      const sbase = round2(Math.max(0, full - ctrPaid + dev));
      segs.push({ from:fd(a), to:fd(b), days, dev, extra:e, paused,
                  rate:cnd.rate || 0, dayMethod:cnd.dayMethod || null, base:sbase,
                  /* начисление САМОГО отрезка = база × ставка × дней. Считается заново,
                     а не делится из позиции: ADR-0128 §3 требует, чтобы произведение
                     трёх видимых колонок сходилось с четвёртой глазом. */
                  accrued:periodInterest(t, cnd, a, b, sbase, mppP, dOver) });
    }
    /* СКЛЕЙКИ БОЛЬШЕ НЕТ (ADR-0129 §1). Она сливала соседние отрезки с одинаковыми базой,
       ставкой, день-базой и паузой — чтобы запись условий, поменявшая только пеню, не
       рвала процентный отрезок надвое. С общей сеткой это стало вредно: отрезок обязан
       совпадать с отрезком пени, а лист «По датам» ставит строку на КАЖДУЮ критическую
       дату и называет её событие. Слитый отрезок унёс бы строку события вместе с собой.
       Суммы от склейки не зависели и не зависят: начисление аддитивно по отрезкам. */
    /* ОСВОЕНО ЗА ПЕРИОД — деньги, ушедшие ЗАЁМЩИКУ (ADR-0128 «Последствия»). Первая
       позиция забирает всё освоенное до неё: её период открывает само освоение, и
       нижней границей брать его же значило бы потерять его целиком. */
    const dTo = disbursedTo(t, r.date);
    out.set(r.no, { dev:dev0, extra, segments:segs,
                    disbursed:round2(dTo - prevDisb),
                    accrued:round2(base + extra),
                    due:round2((r.interest || 0) + extra) });
    prevDisb = dTo;
    ctrPaid  = round2(ctrPaid + (r.principal || 0));
    prev     = end;
  }
  return out;
}

/* ПРОГНОЗ транша (ADR-0104, разбор 10.08.2026) — ожидание по контрактному графику.
   Даты позиций не двигаются и ВЗНОС остаётся контрактным; двигается ГРАНИЦА закрытия.
     • Прошлое (дата ≤ горизонта) — непокрытый остаток позиции, и он ОСТАЁТСЯ НА МЕСТЕ.
       Срок по нему наступил; перенос в ближайшую будущую позицию (как было раньше)
       назначал просрочке срок, которого никто не назначал, и вдобавок считал
       просроченное тело дважды — раз в перестройке будущего, раз хвостом.
     • Будущее — контрактный взнос против ФАКТИЧЕСКОЙ базы. База = освоено − погашено
       платежами − просроченное тело: последнее будущими взносами не гасится, оно уже
       показано прошлыми строками. Проценты — ядром periodInterest на условиях НА ДАТУ
       ПОЗИЦИИ (не на дату среза): датированная запись об изменении ставки лежит в
       реестре с основанием, игнорировать её — не осторожность, а игнор факта.
     • Контрактно ТЕЛО позиции — у всех методов, кроме «в конце срока» (ADR-0108):
       график гасит своё тело в свой срок, а проценты идут на фактическую базу, и на их
       разницу с контрактными расходится ожидаемый ВЗНОС. Досрочка гасит базу быстрее —
       позиции в хвосте обнуляются, срок сокращается (ADR-0074 §1); у «в конце срока»
       срок не сокращается вовсе, уменьшается баллон. Пересобирать аннуитет на
       оставшийся срок нельзя: это сделка «уменьшить взнос» (ADR-0074 §2), она требует
       заявления и перестроения графика — а после перестроения прогнозу пересчитывать
       уже нечего, он равен графику.
   Горизонт обрезан остановкой начисления: у закрытого кредита будущего нет.
   Прогноз ничего не хранит и на график/начисление/гейты не влияет (И-18 — про план,
   но прогноз тем более: он производная).
   opts.atCut — сравнительный прогон на условиях ДАТЫ СРЕЗА: разница с обычным прогоном
   и есть вклад уже зарегистрированных будущих записей условий (плитка вкладки).
   ledgerIndex — Map из buildLedger(c, asOf).index; может быть null (тогда прошлое
   считается непогашенным целиком). */
function trancheForecastRows(c, t, ledgerIndex, asOf, opts){
  const rows = trancheScheduleRows(t);
  if (!rows.length) return [];
  const lim  = pd(asOf || TODAY);
  const stop = (c && c.closure && c.closure.date && pd(c.closure.date) < lim)
    ? pd(c.closure.date) : null;
  const past = rows.filter(r => pd(r.date) <= (stop || lim));
  const fut  = stop ? [] : rows.filter(r => pd(r.date) > lim);
  const out  = [];
  let overdueP = 0;                                   // просроченное ТЕЛО — будущими взносами не гасится
  for (const r of past){
    const e = ledgerIndex ? ledgerIndex.get(ledgerKey(t.no, r.no)) : null;
    const uncovered = e
      ? round2((e.principalOverdue || 0) + (e.interestOverdue || 0) + (e.penaltyBal || 0))
      : round2(r.total || 0);
    overdueP = round2(overdueP + (e ? (e.principalOverdue || 0) : (r.principal || 0)));
    /* ПРОШЛОЕ СЧИТАЕТСЯ, НО НАРУЖУ НЕ ВЫХОДИТ (ADR-0119 §4). Наступившие позиции нужны
       модели: они дают базу амортизации (просроченное тело будущими взносами не гасится) и
       признак «непокрыто» для выбора формулировок. Вкладка о них не говорит ни строкой, ни
       числом — построчно они живут в «Расчётах», числом в шапке карточки. Состав
       (principalOverdue · interestOverdue · penalty) наружу больше не выносится: потребителя
       нет, а поле без потребителя — приглашение показать прошлое ещё раз. */
    out.push({ no:r.no, date:r.date, scheduled:round2(r.total || 0), forecast:uncovered,
               delta:round2(uncovered - (r.total || 0)), past:true });
  }
  const atCut = !!(opts && opts.atCut);
  /* ДВЕ БАЗЫ, А НЕ ОДНА (ADR-0105). Просроченное тело вычитается из базы АМОРТИЗАЦИИ —
     будущими взносами оно не гасится, оно уже показано своими позициями (ADR-0104 §2), —
     но НЕ из базы НАЧИСЛЕНИЯ: непогашенное тело у заёмщика на руках, и проценты по
     договору идут на него. Пока база была одна, обе роли несла она: на просроченном
     кредите база прогноза совпадала с контрактной до копейки, и вкладка отвечала «ждём
     ровно график» при 88 тыс. недобора. Взнос остаётся контрактным (ADR-0104 §1) —
     дорожает СОСТАВ: процентов больше, тела меньше, остаток гаснет медленнее. */
  /* перенос по ДС вычитается и здесь (КВ-54): ожидание считается на фактическом теле, а
     тело, ушедшее в другой транш, ждут по ЕГО графику — иначе прогноз кредита складывал
     бы одну и ту же сумму дважды */
  let accrBal  = round2(Math.max(0, (disbursedSum(t) || t.amount || 0)
                                    - paidPrincipalOfTranche(c, t, asOf)
                                    + movedNetAt(t, asOf)));
  let bal      = round2(Math.max(0, accrBal - overdueP));   // база АМОРТИЗАЦИИ
  /* начало первого будущего периода — дата предыдущей позиции, а до первой позиции —
     дата освоения: периоды начисления идут встык, как в графике */
  const disb = (t.disbursements || []).slice().sort((a, b) => pd(a.date) - pd(b.date))[0];
  const firstFut = rows.length - fut.length;          // позиции упорядочены по датам: будущее — хвост
  let prev = firstFut > 0 ? pd(rows[firstFut - 1].date) : (disb ? pd(disb.date) : pd(rows[0].date));
  const last = fut.length - 1;
  fut.forEach((r, k) => {
    const cnd = conditionsAt(t, atCut ? fd(lim) : r.date);
    const mpp = freqMonths(cnd.freq) || 1;
    const interest = periodInterest(t, cnd, prev, pd(r.date), accrBal, mpp);
    prev = pd(r.date);
    const method = cnd.method || 'аннуитет';
    let principal;
    if (bal <= 0.005) principal = 0;                                       // тело кончилось — позиции не станет
    else if (method === 'в конце срока') principal = (k === last ? bal : 0);
    /* КОНТРАКТНО — ТЕЛО ПОЗИЦИИ, У ВСЕХ МЕТОДОВ (ADR-0108). У аннуитета контрактным
       считался ПЛАТЁЖ, и проценты сверх контракта вытесняли из него тело: взнос равен
       графику до копейки, а тело гасится медленнее и копится баллоном в последнюю
       позицию. График остаётся расписанием ТЕЛА: каждая позиция гасит своё, а
       подорожавшие проценты поднимают ожидаемый платёж — просрочка стоит денег в тот
       же срок, а не переносом долга на конец. */
    else principal = Math.min(bal, round2(r.principal || 0));
    if (k === last) principal = bal;                                       // остаток гасит последняя позиция
    bal     = round2(bal - principal);
    accrBal = round2(Math.max(0, accrBal - principal));   // просроченный хвост остаётся в базе начисления
    const f = round2(principal + interest);
    /* principal/interest/balAfter выносятся наружу: по ним состав прогноза проверяется
       на РАВЕНСТВО (Σ = база + проценты), а граница закрытия читается как первый ноль.
       interestCtr — контрактные проценты той же позиции: их разница с interest и есть
       цена недобора тела, и ровно на неё расходится взнос (ADR-0108). */
    out.push({ no:r.no, date:r.date, scheduled:round2(r.total || 0), forecast:f,
               principal, interest, interestCtr:round2(r.interest || 0), balAfter:bal,
               accrAfter:accrBal, delta:round2(f - (r.total || 0)), past:false });
  });
  return out;
}

/* Прогноз кредита по месяцам — сумма прогноза ВСЕХ позиций всех траншей, сгруппированная
   по месяцу даты позиции. Прежде прошлое исключалось, чтобы не считать просрочку дважды:
   непокрытый остаток сидел и в своей строке, и хвостом в ближайшей будущей. Хвост больше
   никуда не течёт, двойного счёта нет по построению — и исключение снято вместе с ним.
   Месяц отвечает на один вопрос: «сколько по нему ещё ждём» — у прошедшего это недобор
   на дату среза, у будущего ожидаемый платёж. Раньше у всех прошедших месяцев стоял ноль,
   и колонка «Прогноз» во вкладке «План» читалась как «в те месяцы ничего не ждали».
   Позиция с нулём месяцу не принадлежит: закрытая (и отсечённая досрочкой) ожидания не
   даёт, а нулевой ключ предзаполнил бы форму плана нулём, который отбивает Г-30.
   Этим предзаполняется форма заведения плана (ADR-0042 §2): стартовое значение формы,
   не связь — после сохранения план от прогноза не зависит. */
function forecastByMonth(c, ledgerIndex, asOf){
  const m = new Map();
  for (const t of (c.tranches || [])){
    for (const r of trancheForecastRows(c, t, ledgerIndex, asOf)){
      if (r.forecast <= 0.005) continue;
      const mk = monthKey(r.date);
      m.set(mk, round2((m.get(mk) || 0) + r.forecast));
    }
  }
  return m;
}

/* СВОД ПРОГНОЗА по области (транш или кредит целиком) — три ответа вкладки:
   когда закроется, сколько непокрыто, что добавили будущие записи условий.
   payoff — дата последней позиции, на которой ещё что-то ждём: у аннуитета досрочка
   приближает её, у «в конце срока» не двигает. Договорная дата берётся из ГРАФИКА
   (последняя позиция области), а не из срока условий: сравнивать надо с тем же
   расписанием, иначе сравниваются две разные величины.
   Непокрытый хвост payoff не отменяет, но делает его неполным ответом — «закроется»
   означает «взносы кончатся», а хвост остаётся долгом; вкладка об этом говорит прямо. */
function forecastSummary(c, tranches, ledgerIndex, asOf){
  const src = (tranches || []).filter(Boolean);
  const rows = [], perTranche = [];
  let cutSum = 0;
  for (const t of src){
    const fr = trancheForecastRows(c, t, ledgerIndex, asOf);
    for (const r of fr) rows.push({ ...r, _t:t });
    const futT = fr.filter(r => !r.past);
    const live = futT.filter(r => r.forecast > 0.005);
    const sched = trancheScheduleRows(t);
    perTranche.push({ no:t.no,
      payoff:   live.length ? live[live.length - 1].date : null,
      contract: sched.length ? sched[sched.length - 1].date : null,
      scheduled: sched.length > 0,                     // есть ли вообще расписание
      owed:     round2(fr.filter(r => r.past).reduce((a, r) => a + r.forecast, 0)),
      cut:      futT.length - live.length });          // позиций отсечено досрочкой
    for (const r of trancheForecastRows(c, t, ledgerIndex, asOf, { atCut:true }))
      if (!r.past) cutSum += r.forecast;
  }
  rows.sort((a, b) => pd(a.date) - pd(b.date) || a._t.no - b._t.no);
  const fut = rows.filter(r => !r.past), past = rows.filter(r => r.past);
  const futSum = round2(fut.reduce((a, r) => a + r.forecast, 0));
  const futSched = round2(fut.reduce((a, r) => a + r.scheduled, 0));
  /* Голосуют за дату закрытия области только транши С ГРАФИКОМ: неосвоенному траншу без
     единой позиции закрывать нечего, и вето он ставить не вправе — о нём говорит своя
     плашка. Транш, у которого график исчерпан, а долг остался, ответа не даёт: пока его
     сроки не назначены заново, даты по области нет вовсе — чужую не выдаём. */
  const voters    = perTranche.filter(x => x.scheduled);
  const withPayoff = voters.filter(x => x.payoff);
  const stuck      = voters.filter(x => !x.payoff && x.owed > 0.005);
  /* ЦЕНА НЕДОБОРА ТЕЛА (ADR-0105) — Σ (проценты ожидания − проценты контракта) по
     будущим позициям, она же Σ всех Δ: тело позиции контрактно, и расходится взнос ровно
     на проценты (ADR-0108). Плитка называет итог одной величиной — по строкам он
     размазан мелкими надбавками, и главный эффект просрочки читался бы не сразу. */
  const extraInterest = round2(fut.reduce((a, r) => a + ((r.interest || 0) - (r.interestCtr || 0)), 0));
  /* СОСТАВ ОЖИДАНИЯ ПО СТАТЬЯМ — две, а не три: тело и проценты. Пени во взносе нет ни в
     одной позиции (ADR-0087: отдельная статья, в платёж не входит), а её база — уже
     наступившее прошлое. Σ тела + Σ процентов = futSum ровно: взнос каждой позиции и есть
     round2(principal + interest), оба слагаемых уже округлены. */
  const futPrincipal = round2(fut.reduce((a, r) => a + (r.principal || 0), 0));
  const futInterest  = round2(fut.reduce((a, r) => a + (r.interest || 0), 0));
  return { rows, fut, past,
    tail: round2(past.reduce((a, r) => a + r.forecast, 0)),
    futSum, futSched, futPrincipal, futInterest, delta: round2(futSum - futSched), extraInterest,
    condEffect: round2(futSum - round2(cutSum)),
    payoff: (withPayoff.length && !stuck.length)
      ? withPayoff.map(x => x.payoff).sort((a, b) => pd(a) - pd(b)).pop() : null,
    stuck: stuck.map(x => x.no),                       // траншей с исчерпанным графиком и долгом
    contractEnd: perTranche.map(x => x.contract).filter(Boolean)
      .sort((a, b) => pd(a) - pd(b)).pop() || null,
    cutPositions: perTranche.reduce((a, x) => a + x.cut, 0),
    perTranche };
}

/* ИСПОЛНЕНИЕ ПЛАНА (CONTEXT.md) = факт месяца / план месяца.
   ФАКТ месяца — сумма разнесённого по платежам, которые ЗАСЧИТЫВАЮТСЯ (paymentCounts,
   две оси Р-27) и чья ДАТА ФАКТИЧЕСКОГО ПОСТУПЛЕНИЯ попала в месяц. Входят все четыре
   статьи долга кредита. Расходы по обращению взыскания не входят и войти не могут по
   построению: они приходят отдельным зеркалом mirror.collectionCosts, а не платежами.
   МЕСЯЦ БЕЗ ПЛАНА ВЫПАДАЕТ ЦЕЛИКОМ — из своей строки, из суммы квартала и из суммы года.
   Факт такого месяца показывается справочно: он есть, но сравнивать его не с чем.
   Платежи ПОСЛЕ даты среза не считаются: дата среза одна на карточку (И-13).
   Величина только для показа: ни в гейт, ни в производную долга, ни в категорию риска,
   ни в подгруппу заёмщика не входит (И-18). */
function planExecOf(c, asOf, ledgerIndex, year){
  asOf = asOf || TODAY;
  const lim = pd(asOf);
  const y   = year || pd(asOf).getFullYear();
  const idx = ledgerIndex || buildLedger(c, asOf).index;
  const fc  = forecastByMonth(c, idx, asOf);
  const factByMonth = new Map();
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!p || !p.date || !paymentCounts(p)) continue;
    if (pd(p.date) > lim) continue;
    const mk = monthKey(p.date);
    factByMonth.set(mk, round2((factByMonth.get(mk) || 0) + paymentAllocated(p)));
  }
  const curMk = monthKey(asOf);
  const rows = [];
  for (let m = 1; m <= 12; m++){
    const mk  = y + '-' + String(m).padStart(2, '0');
    const pr  = planRowOf(c, mk);
    const plan = pr && pr.amount != null ? pr.amount : null;
    const fact = round2(factByMonth.get(mk) || 0);
    /* МЕСЯЦ ПОСЛЕ МЕСЯЦА СРЕЗА ещё не наступил: факт по нему нулевой не потому, что
       ничего не собрали, а потому, что срок не подошёл. Процент по нему не считается —
       иначе будущее давало бы «0 % исполнения» и тянуло вниз квартал, год и плитку
       шапки. Та же подмена, от которой спека отдельно предостерегает для плитки. */
    const future = mk > curMk;
    rows.push({ month:mk, label:monthLabel(mk),
      forecast: fc.has(mk) ? fc.get(mk) : null,
      plan, fact,
      pct: (plan > 0 && !future) ? Math.round(fact / plan * 100) : null,
      edits: pr ? pr.history.length : 0,
      dropped: plan == null,                       // в расчёт исполнения не входит
      future,                                      // месяц ещё не наступил
      removed: !!(pr && pr.amount == null) });     // план СНЯТ (строка есть, цели нет)
  }
  /* plan — вся цель периода (её показывает плитка «План за год»); planDone — только
     наступившие месяцы, и именно по ним считается процент. Разводить их обязательно:
     иначе «План за год» пришлось бы урезать до прошлого, а это уже не годовой план. */
  const agg = (list) => {
    const kept = list.filter(r => !r.dropped);
    const done = kept.filter(r => !r.future);
    const plan     = round2(kept.reduce((a, r) => a + r.plan, 0));
    const planDone = round2(done.reduce((a, r) => a + r.plan, 0));
    const fact     = round2(done.reduce((a, r) => a + r.fact, 0));
    return { plan, planDone, planAhead: round2(plan - planDone), fact,
      pct: planDone > 0 ? Math.round(fact / planDone * 100) : null,
      months:kept.length, monthsDone:done.length };
  };
  /* months/monthsDone у квартала — не украшение: строка квартала стоит в одной таблице
     с месяцами (КВ-21) и обязана назвать, по скольким месяцам она посчитана. Без этого
     «1 квартал · 0 %» неотличимо от «плана на квартал не ставили». */
  const quarters = [1,2,3,4].map(q => {
    const a = agg(rows.slice((q - 1) * 3, q * 3));
    return { q, plan:a.plan, planDone:a.planDone, planAhead:a.planAhead, fact:a.fact, pct:a.pct,
      months:a.months, monthsDone:a.monthsDone };
  });
  const ya = agg(rows);
  const cur   = rows.find(r => r.month === curMk);
  return { year:y, rows, quarters,
    total:{ plan:ya.plan, planDone:ya.planDone, planAhead:ya.planAhead, fact:ya.fact, pct:ya.pct,
      monthsWithPlan:ya.months, monthsDone:ya.monthsDone, monthsTotal:12 },
    current: (cur && !cur.dropped) ? { month:cur.month, plan:cur.plan, fact:cur.fact, pct:cur.pct } : null };
}

/* НАБОР ГОДОВ СЕЛЕКТОРА «Плана». Вкладка показывает ОДИН календарный год — выбранный
   селектором, и годовой итог держат плитки шапки над таблицей.

   Прежняя формула селектора («год выдачи … max(год среза, год выдачи) + 1») врала: у
   кредита, выданного в мае 2026 на 24 месяца, срок кончается в мае 2028, а селектор
   предлагал 2026–2027 — поставить план на последние месяцы срока через вкладку было
   нельзя. Набор строится по данным, а не по смещению от даты среза: от месяца выдачи до
   последнего месяца, о котором вкладке есть что сказать, — последняя позиция графика
   ЛЮБОГО транша, последний месяц с планом, последний месяц с засчитанным платежом.
   План ставится модалкой на произвольный месяц и графиком не ограничен: год с целью за
   пределами расписания обязан быть в списке, иначе введённая цель пропадает с экрана.
   Годы идут сплошным рядом — дыра в середине читалась бы как «год потеряли», а пустой
   год честно скажет «плана на год нет» своими прочерками. */
function planYearsList(c, asOf){
  asOf = asOf || TODAY;
  const lim = pd(asOf);
  const mks = [monthKey(c.date || asOf)];
  for (const t of (c.tranches || []))
    for (const r of trancheScheduleRows(t)) if (r && r.date) mks.push(monthKey(r.date));
  for (const p of (c.plan || [])) if (/^\d{4}-\d{2}$/.test(String(p && p.month))) mks.push(p.month);
  for (const p of ((c.mirror && c.mirror.payments) || []))
    if (p && p.date && paymentCounts(p) && pd(p.date) <= lim) mks.push(monthKey(p.date));
  const y0 = +mks.reduce((a, mk) => mk < a ? mk : a).slice(0, 4);
  const y1 = +mks.reduce((a, mk) => mk > a ? mk : a).slice(0, 4);
  const out = [];
  for (let y = y0; y <= y1; y++) out.push(y);
  return out;
}
/* Год по умолчанию: тот, в который попала дата среза; нет такого в наборе (кредит закрыт
   в прошлом или выдан вперёд) — ближайший следующий; весь срок позади — последний. */
function planDefaultYear(years, asOf){
  const cy = pd(asOf || TODAY).getFullYear();
  if (!years.length) return cy;
  return years.includes(cy) ? cy : (years.find(y => y > cy) ?? years[years.length - 1]);
}
/* Диапазон месяцев года для модалки постановки плана: январь…декабрь, обрезанный СНИЗУ
   месяцем договора. Обрезка не косметика: Г-30 отбивает месяц раньше месяца договора, и
   год выдачи без неё пришёл бы строками, которые заведомо нельзя поставить (у кредита от
   14.08 это семь мёртвых строк из двенадцати). Сверху не обрезаем осознанно: план
   ставится модалкой на произвольный месяц и графиком не ограничен (см. planYearsList) —
   декабрь остаётся декабрём и за пределами срока. */
function planYearRange(credit, y){
  const from = y + '-01', to = y + '-12';
  const cm = credit && credit.date ? monthKey(credit.date) : null;
  return { from: (cm && cm > from && cm <= to) ? cm : from, to };
}
/* Год модалки ВЫВОДИТСЯ из пары полей, а не хранится рядом с ними. Хранимый год пережил
   бы ручную правку месяцев и показывал бы год, которого в полях уже нет; null — «период
   произвольный», и селектор обязан сказать это прямо. */
function planYearOfRange(credit, from, to){
  if (!/^\d{4}-\d{2}$/.test(String(from)) || !/^\d{4}-\d{2}$/.test(String(to))) return null;
  const y = +String(to).slice(0, 4);
  const r = planYearRange(credit, y);
  return (r.from === from && r.to === to) ? y : null;
}

/* ключ позиции детального расчёта: транш + номер платежа */
function ledgerKey(trancheNo, no){ return 'T' + trancheNo + '#' + no; }

/* статус позиции графика на дату среза. Чистая функция от строки графика и её записи
   в детальном расчёте (entry может отсутствовать — тогда позиция ещё не наступила).
   Оплачена · Просрочена · Наступила (срок прошёл, погашения нет) · Предстоит */
function scheduleRowStatus(row, entry, asOf){
  if (pd(row.date) > pd(asOf || TODAY)) return 'Предстоит';
  if (!entry) return 'Наступила';
  if (entry.overdueTotal > 0.005) return 'Просрочена';
  return 'Оплачена';
}

/* ближайший НЕоплаченный платёж по всем траншам (шаг 11 — плитка шапки). Просроченная
   позиция тоже «ближайшая»: она первая по дате и требует действия раньше предстоящей. */
function nextPaymentOf(c, ledgerIndex, asOf){
  let best = null;
  for (const t of c.tranches){
    for (const r of trancheScheduleRows(t)){
      const st = scheduleRowStatus(r, ledgerIndex.get(ledgerKey(t.no, r.no)), asOf);
      if (st === 'Оплачена') continue;
      const ts = pd(r.date);
      if (!best || ts < best.ts) best = { ts, date:r.date, total:r.total, status:st, tranche:t.no };
    }
  }
  return best;
}

/* статус регистрации договора (шаг 11) — производный, отдельного поля нет: комплект
   реквизитов регистрации (№ + дата + скан) сверяется с гейтом Г-7 и ЖЦ. */
function regStatusOf(c){
  const r = c.reg || {};
  const full = !!(r.num && r.date && r.scan);
  if (c.lifecycle === 'Проект') return full ? { text:'готов к регистрации', tone:'info' }
                                            : { text:'черновик', tone:'neutral' };
  return full ? { text:'зарегистрирован', tone:'low' } : { text:'реквизиты неполны', tone:'high' };
}

/* ---- 3.2 Помощники derive (все чистые) ---- */

/* ---- ДЕТАЛЬНЫЙ РАСЧЁТ (ADR-0010) ----
   Строится, а не читается. Поля `ledger` в модели нет: начисленное выводится из активной
   версии графика транша и условий на дату, погашенное приходит зеркалом модуля платежей.

   Прежняя реализация складывала ОДНУ засеянную строку на транш (`latestLedger`) и
   называла это долгом. Отсюда К-1 с освоением 100 000 и остатком ноль, платёж
   «Подтверждён ЦК», не двигающий ничего, и дни просрочки, равные нулю по построению
   при 24 позициях графика (КР-7…КР-9). Это легаси-дефект E2E-09, воспроизведённый
   в модуле-владельце.

   paidPool — то, что модуль платежей засчитал на дату среза, в разрезе статей. */

/* ЗАЧИТЫВАЕТСЯ ЛИ ПЛАТЁЖ В ПОГАШЕНИЕ — правило владельца, и оно читает ДВЕ оси, а не одну.
   Прежняя редакция сверяла только сопоставление (`match === 'Подтверждён ЦК'`) и тем самым
   отбирала у шлюза его главное свойство: «платёж по шлюзу действует сразу, датой операции —
   уменьшает долг и останавливает начисление; не подтвердит ЦК — сторно с пересчётом»
   (спека платежей §4). Ждать подтверждения обязан ручной ввод и импорт, а не шлюз: у шлюза
   деньги УЖЕ ушли, и «окно ожидания зачисления» открыто именно для них (КР-44). */
function paymentCounts(p){
  if (!p) return false;
  switch (p.match){
    case 'Подтверждён ЦК': return true;
    case 'Восстановлен':   return true;   // позднее подтверждение ЦК — обратный каскад, долг падает
    case 'Сторно (таймаут)': return false; // сторно ≠ удаление: платёж виден, денег не несёт
    case 'Расхождение':    return true;   // запись ЦК есть, расходятся реквизиты (ОВ-ПЛ-1)
    case 'Ожидает ЦК':     return p.reg === 'Шлюз';
    default: return false;
  }
}

/* Валюта поступления — реквизит ПЛАТЕЖА, разнесение — всегда в валюте кредита: статьи
   долга выражены в ней, и пересчёт делает владелец, когда раскладывает сумму. Отсюда
   инвариант И-16: Σ layers = amount при совпадении валют и amount × rate при расхождении. */
function paymentCurrency(p, c){ return (p && p.currency) || (c && c.currency) || 'KGS'; }
function paymentAllocated(p){
  const L = (p && p.layers) || {};
  return round2((L.principal||0) + (L.interest||0) + (L.penalty||0) + (L.fees||0));
}

function paidPool(c, asOf){
  const lim = pd(asOf || TODAY);
  const pool = { principal:0, interest:0, penalty:0, fees:0 };
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p)) continue;
    if (p.date && pd(p.date) > lim) continue;
    const L = p.layers || {};
    pool.principal += L.principal || 0; pool.interest += L.interest || 0;
    pool.penalty   += L.penalty   || 0; pool.fees     += L.fees     || 0;
  }
  for (const k in pool) pool[k] = round2(pool[k]);
  return pool;
}

/* ---- СПОРНАЯ ПЕНЯ (спека платежей §4.4) ----
   Сторно задним числом ретроспективно проваливает заёмщика в просрочку, но неподтверждение
   могло быть сбоем шлюза, банка или ЦК. Пеня периода «дата операции → дата отмены»
   ВЫЧИСЛЯЕТСЯ, но помечается спорной: не входит в требование, не двигает категорию риска,
   не блокирует гейт «Погашен». Считать сразу дешевле, чем строить цепочку начислений
   второй раз, если комиссия решит начислить.

   Разделение труда то же, что у обеспеченности: ПЕРИОД и статус приходят зеркалом
   (событие сторно — у платежей), СУММУ выводит кредит, потому что пеню считает он
   (ADR-0010). Сумма в зеркале — снимок владельца для его экрана, кредит её не читает. */
function disputeWindows(c){
  const out = [];
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    const d = p.dispute;
    if (d && d.from && d.status === 'Ожидает решения комиссии') out.push({ from:d.from, to:d.to || null, pay:p.num });
  }
  return out;
}
/* дни отрезка [from,to], попавшие в окно спора */
function daysInWindows(fromDt, toDt, wins){
  let n = 0;
  for (const w of wins){
    const a = Math.max(fromDt, pd(w.from));
    const b = Math.min(toDt, w.to ? pd(w.to) : toDt);
    if (b > a) n += dd(a, b);
  }
  return n;
}

/* ---- СЛОЙ ДОЛГА ПО РЕШЕНИЮ СУДА (спека платежей §6) ----
   Приостановка начисления по решению суда — свойство ЧАСТИ долга («на сумму решения»), а
   не флаг на кредите: у одного кредита бывает несколько решений с РАЗНЫМИ режимами
   одновременно, и это норма. Режим определяется ДАТОЙ решения и прилипает к нему навсегда —
   поэтому таблица с датами вступления, а не константа в расчёте: появится новая норма,
   добавится строка.

   Граница с платежами по ADR-0010: НАЧИСЛЕНИЕ — у кредита (сырьё его), РАЗНЕСЕНИЕ платежа
   по слоям — у платежей (там матрица разнесения и привязка к исполнительному листу), а состав
   слоя и очередь погашения — у кредита (ADR-0060 §3/§4). */
const ACCRUAL_MODES = [
  { from:'05.09.2025', interest:false, penalty:false,
    label:'проценты и пеня приостановлены на сумму решения (норма с 05.09.2025)' },
  { from:null,          interest:true,  penalty:false,
    label:'проценты идут, пеня приостановлена на сумму решения (норма до 05.09.2025)' }
];
function accrualModeOf(decisionDate){
  for (const m of ACCRUAL_MODES) if (!m.from || pd(decisionDate) >= pd(m.from)) return m;
  return ACCRUAL_MODES[ACCRUAL_MODES.length - 1];
}
/* Слои кредита на дату: решения суда из зеркала, несущие ПРИСУЖДЁННУЮ СУММУ. Решение без
   суммы (определение о возбуждении дела о банкротстве) слоя не образует — присуждать там
   нечего; последствия банкротства принадлежат взысканию (КР-33). */
function courtLayersOf(c, asOf){
  const lim = pd(asOf || TODAY);
  return ((c.mirror && c.mirror.court) || [])
    .filter(x => x && x.date && (x.amount || 0) > 0 && pd(x.date) <= lim)
    .map(x => ({ date:x.date, kind:x.kind, il:x.il || null, amount:x.amount || 0, mode:accrualModeOf(x.date) }))
    .sort((a,b) => pd(a.date) - pd(b.date))
    /* ИДЕНТИЧНОСТЬ СЛОЯ (ADR-0060 §3). Пока слой был долей от тела, имени ему не
       требовалось; теперь строка очереди обязана назвать СВОЙ слой, а строк много.
       Нумерация по возрастанию даты акта устойчива: срез отсекает решения позже даты,
       то есть всегда хвост отсортированного списка, и L-1 остаётся L-1 на любую дату.
       Подпись отдаётся готовой — справочника слоёв (`c.layers`, как в payments.html)
       у кредита в модели нет, разворачивать id некому. */
    .map((x, i) => Object.assign(x, { id:'L-' + (i + 1),
      label:'Слой решения от ' + x.date + (x.il ? ' · ' + x.il : '') }));
}

/* ЛЕСТНИЦА (ADR-0060 §3) — непогашенные позиции графика с остатками ОД и процентов в
   порядке «самое раннее просроченное → дальше». Это первый проход buildLedger, вынутый
   и обеднённый: ни пени, ни слоёв здесь нет, потому что ею пользуются ДО того, как слой
   известен. Проценты берутся ДО заморозки (interestDue): заморозка — ровно то, что
   лестница и определяет.
     Хвост НЕ обрезается датой, в отличие от buildLedger. Присуждённое дотягивается и до
   ненаступивших взносов — суд присуждает по требованию о ДОСРОЧНОМ возврате (у К-3 оно
   прямо в модели, targetUse.measures), и «дальше» в ADR-0060 §3 тем и кончается. Порядок
   от этого не меняется: обход идёт по дате наступления, и наступившее стоит впереди по
   построению. Обрезка же давала бы пустую лестницу всякий раз, когда акт датирован
   раньше первой позиции графика, — слой оказался бы пуст при непустой присуждённой
   сумме. */
function ladderAt(c, date){
  const lim = pd(date || TODAY);
  const rows = [];
  for (const t of c.tranches){
    const acc = trancheAccrual(c, t, fd(lim));      // то же начисление, что у расчёта (ADR-0105)
    for (const r of trancheScheduleRows(t))
      rows.push({ key:ledgerKey(t.no, r.no), trancheNo:t.no, no:r.no, date:r.date,
        principalDue:r.principal || 0,
        interestDue:((acc.get(r.no) || {}).due != null ? acc.get(r.no).due : (r.interest || 0)),
        overdue:pd(r.date) <= lim });
  }
  rows.sort((a,b) => pd(a.date) - pd(b.date) || a.trancheNo - b.trancheNo || a.no - b.no);
  const pool = paidPool(c, fd(lim));
  let pP = pool.principal, pI = pool.interest;
  for (const r of rows){
    const pPaid = round2(Math.min(pP, r.principalDue)); pP = round2(pP - pPaid);
    const iPaid = round2(Math.min(pI, r.interestDue));  pI = round2(pI - iPaid);
    r.principalBal = round2(r.principalDue - pPaid);
    r.interestBal  = round2(r.interestDue  - iPaid);
  }
  return rows.filter(r => r.principalBal + r.interestBal > 0.005);
}

/* СОСТАВ СЛОЯ ПО ТРАНШАМ — производная НА ДАТУ АКТА, не поле (ADR-0060 §3). Каждое
   решение прогоняет лестницу на СВОЮ дату и метит позиции, пока присуждённое не
   исчерпается. asOf отсекает решения ПОЗЖЕ даты среза — те же, что отсекает
   courtLayersOf; сам обход от даты среза не зависит.
     Позиция достаётся ПЕРВОМУ по дате решению, которое до неё дотянулось, и принадлежит
   ровно одному слою: иначе её начисление подчинялось бы двум режимам сразу. Помеченную
   позицию следующий слой пропускает, НЕ расходуя на неё присуждённое, — второй акт
   присуждает свой долг, обычно более поздний, и должен дотянуться дальше первого, а не
   упереться в его хвост.
     Довод в пользу общей лестницы — симметрия (ADR-0060 §4): слой поглощает долг в том
   же порядке, в каком платёж его гасит. Две лестницы в одном модуле разъедутся молча. */
function layersByLadder(c, asOf){
  const map = new Map();
  for (const L of courtLayersOf(c, asOf)){
    let left = L.amount;
    for (const p of ladderAt(c, L.date)){
      if (left <= 0.005) break;
      if (map.has(p.key)) continue;
      map.set(p.key, L.id);
      left = round2(left - p.principalBal - p.interestBal);
    }
  }
  return map;
}

/* buildLedger(credit, asOf) — позиции графика, НАСТУПИВШИЕ на дату среза, с разнесением
   подтверждённых погашений по очереди «раньше наступило — раньше гасится» и начислением
   пени на непокрытый остаток за дни просрочки. Возврат: {rows, index, pool, fees}. */
function buildLedger(c, asOf){
  /* Закрытый кредит начисление ОСТАНАВЛИВАЕТ: расчёт замирает на дате закрытия.
     Иначе списанный кредит с остатком продолжал бы копить пеню годами — у К-6б это
     давало 1032 дня просрочки и пеню, превышающую половину тела долга. */
  let lim = pd(asOf || TODAY);
  if (c.closure && c.closure.reason && c.closure.date && pd(c.closure.date) < lim) lim = pd(c.closure.date);
  const rows = [];
  const grid = calcGrid(c, fd(lim));                      // критические даты — одни на весь расчёт (ADR-0129 §1)
  const segsByTranche = new Map();                        // сквозная лента отрезков транша — для вида «По датам»
  for (const t of c.tranches){
    const cnd = conditionsAt(t, asOf || TODAY);           // Р-21: ставки пени — условия на дату
    const acc = trancheAccrual(c, t, fd(lim), grid);      // начисление на ФАКТИЧЕСКОЕ тело (ADR-0105)
    segsByTranche.set(t.no, []);
    for (const r of trancheScheduleRows(t)){
      if (pd(r.date) > lim) continue;                     // не наступила — это график, не расчёт
      const a = acc.get(r.no) || {};
      rows.push({ key:ledgerKey(t.no, r.no), trancheNo:t.no, no:r.no, date:r.date,
        principalDue:r.principal || 0,
        interestDue:(a.due != null ? a.due : (r.interest || 0)),
        interestAccrued:(a.accrued != null ? a.accrued
                                           : ((r.accrued == null ? r.interest : r.accrued) || 0)),
        /* контрактная часть и надбавка выносятся наружу: экран обязан назвать, ПОЧЕМУ
           начислено больше строки графика, иначе цифра выглядит опиской (ADR-0105) */
        interestCtr:(r.accrued == null ? r.interest : r.accrued) || 0,
        interestExtra:a.extra || 0, principalDev:a.dev || 0,
        /* отрезки начисления (ADR-0128 §1) — экран раскрывает ими строку: база и ставка
           живут у отрезка, у позиции их нет, потому что внутри периода их может быть две */
        interestSegments:a.segments || null,
        /* «Освоено» — деньги к ЗАЁМЩИКУ. Имя из глоссария; «Получено» отдано деньгам ОТ
           заёмщика ошибочно и переименовано в «Всего погашено» (ADR-0128 «Последствия»). */
        disbursed:a.disbursed || 0,
        /* НАКОПЛЕННОЕ (ADR-0093 §1) — начислено в прошлом, срок назначен документом.
           Приходит статьями строки графика (ADR-0109), а не начислением: ставка на него
           не идёт, и период его не порождает. */
        accInterestDue:(r.articles && r.articles.accInterest) || 0,
        accPenaltyDue: (r.articles && r.articles.accPenalty)  || 0,
        penaltyMain:cnd.penaltyMain || 0, penaltyInt:cnd.penaltyInt || 0 });
      /* ЛЕНТА ОТРЕЗКОВ ТРАНША (ADR-0129 §1) — отрезки наступивших позиций, склеенные
         встык: у позиции они кончаются её датой, а следующая начинается с неё же.
         Хвост после последней наступившей позиции процентов не несёт (ADR-0010:
         начисленное выводится из графика), но пеню по нему лист покажет. */
      for (const s of (a.segments || [])) segsByTranche.get(t.no).push(
        Object.assign({ posNo:r.no, posDate:r.date }, s));
    }
  }
  rows.sort((a,b) => pd(a.date) - pd(b.date) || a.trancheNo - b.trancheNo || a.no - b.no);

  /* СЛОЙ СТРОКИ. Присуждённое покрывает взносы лестницей на дату акта (ADR-0060 §3):
     у строки ровно один слой, и режим начисления берётся у НЕГО. Прежняя пропорция к
     телу (допущение Д-8) отвергнута тем же ADR: просрочка накапливается неравномерно,
     у старого транша её больше, и доля всегда занижала его долю. Непомеченная строка —
     свободный слой: начисление по договору, ничего не приостановлено. */
  const layers    = courtLayersOf(c, fd(lim));
  const byLadder  = layersByLadder(c, fd(lim));
  const layerById = new Map(layers.map(L => [L.id, L]));
  const layerOf   = (r) => layerById.get(byLadder.get(r.key)) || null;
  const wins = disputeWindows(c);

  const pool = paidPool(c, fd(lim));                    // тот же горизонт, что и у начисления
  let pP = pool.principal, pI = pool.interest, pPen = pool.penalty;
  /* СПИСАННОЕ ТЕЛО — ВТОРОЙ ГАСИТЕЛЬ ПОЗИЦИЙ (КВ-62). Пул платежей общий на кредит
     (ADR-0060 §4), а решение о списании выносится ПО ТРАНШАМ (writeOffTranches), поэтому
     и запас здесь свой на каждый транш. Гасит той же очередью наступления: сперва деньги,
     затем списание — иначе списание съело бы позицию, которую заёмщик уже оплатил, и
     переплата превратилась бы в просрочку соседней позиции. */
  const offLeft = new Map((c.tranches || []).map(t => [t.no, writtenOffAt(t, fd(lim))]));
  const writtenOff = round2([...offLeft.values()].reduce((a, v) => a + v, 0));
  /* ...и такой же запас на КАЖДУЮ статью долга (КВ-63): решение списывает весь долг, а
     гасится каждая статья своим полем позиции — «Погашено» по-прежнему только деньги. */
  const offLeftI = new Map((c.tranches || []).map(t => [t.no, writtenOffArtAt(t, 'interest', fd(lim))]));
  const offLeftP = new Map((c.tranches || []).map(t => [t.no, writtenOffArtAt(t, 'penalty',  fd(lim))]));
  const offArt = (key) => round2((c.tranches || [])
    .reduce((a, t) => a + writtenOffArtAt(t, key, fd(lim)), 0));
  const writtenOffArt = { principal: writtenOff, interest: offArt('interest'),
    penalty: offArt('penalty'), accInterest: offArt('accInterest'),
    accPenalty: offArt('accPenalty'), fees: offArt('fees') };
  /* первый проход: гасим ОД и проценты по очереди наступления */
  for (const r of rows){
    /* проценты: у строки под решением суда статья приостановлена ЦЕЛИКОМ — слой несёт
       позицию, а не долю позиции. layerId остаётся на строке: очередь и экран обязаны
       назвать слой, а второй раз выводить его было бы второй реализацией правила. */
    const CL = layerOf(r);
    r.layerId = CL ? CL.id : null;
    r.interestFrozen  = (CL && !CL.mode.interest) ? round2(r.interestDue || 0) : 0;
    r.interestCharged = round2((r.interestDue || 0) - r.interestFrozen);
    r.principalPaid = round2(Math.min(pP, r.principalDue));    pP = round2(pP - r.principalPaid);
    r.interestPaid  = round2(Math.min(pI, r.interestCharged)); pI = round2(pI - r.interestPaid);
    /* СПИСАНО ПО ЭТОЙ ПОЗИЦИИ (КВ-62) — отдельным полем, а не прибавкой к principalPaid:
       «Погашено» означает деньги от заёмщика, и список тела в него входить не должен ни в
       листе, ни в своде. Тело позиции гаснет, требование снимается — просрочка ниже
       считается от остатка ПОСЛЕ списания. */
    const wLeft = offLeft.get(r.trancheNo) || 0;
    r.principalWritten = round2(Math.min(wLeft, round2(r.principalDue - r.principalPaid)));
    offLeft.set(r.trancheNo, round2(wLeft - r.principalWritten));
    /* проценты — той же очередью и тем же правилом (КВ-63). Приостановленное решением суда
       списанию не подлежит: interestCharged его уже не содержит, и требовать нечего. */
    const wI = offLeftI.get(r.trancheNo) || 0;
    r.interestWritten = round2(Math.min(wI, round2(r.interestCharged - r.interestPaid)));
    offLeftI.set(r.trancheNo, round2(wI - r.interestWritten));
    r.principalBal  = round2(r.principalDue  - r.principalPaid - r.principalWritten);
    r.interestBal   = round2(r.interestCharged - r.interestPaid - r.interestWritten);
    r.days          = Math.max(0, dd(pd(r.date), lim));
    const unpaid    = r.principalBal + r.interestBal;
    r.principalOverdue = unpaid > 0.005 ? r.principalBal : 0;
    r.interestOverdue  = unpaid > 0.005 ? r.interestBal  : 0;
    /* Пеня здесь БОЛЬШЕ НЕ СЧИТАЕТСЯ — она интегрируется по отрезкам ниже (ADR-0129 §2).
       Прежде строка стояла тут же: остаток НА ДАТУ СРЕЗА × ставка × все дни просрочки.
       База при этом бралась конечная, то есть платёж середины просрочки задним числом
       удешевлял и те дни, что были до него. Ровно этот изъян ADR-0128 снял у процентов;
       здесь он снимается у пени, и тем же способом — общей сеткой критических дат. */
    r.penaltyAccrued = 0; r.penaltyFrozen = 0; r.penaltyDisputed = 0;
  }

  /* ПЕНЯ ПО ОТРЕЗКАМ (ADR-0129 §2). Идём по сетке; на каждом отрезке база берётся НА ЕГО
     НАЧАЛО, а не на дату среза. База — непокрытый остаток позиции ДО заморозки процентов:
     статья под решением приостановлена целиком, и база из interestOverdue обнулилась бы
     вместе с ней, а у К-3 пеня начисляется ТОЛЬКО на проценты (penaltyMain:0) — исчезла бы
     и пеня за дни ДО решения, которую решение не отменяет.
     При паузе начисления процентов пеня не затрагивается (Р-17): holds здесь не участвуют.
     perTranchePen копит то же самое в разрезе «транш × отрезок» — из него лист «По датам»
     берёт свою колонку, и второго правила для листа не заводится. */
  const penMarks = grid.filter(d => d < lim).concat([lim]);
  const perTranchePen = new Map();
  for (let i = 0; i < penMarks.length - 1; i++){
    const a = penMarks[i], b = penMarks[i + 1];
    const days = Math.max(0, dd(a, b));
    if (!days) continue;
    const poolA = paidPool(c, fd(a));            // зеркало платежей НА НАЧАЛО отрезка
    let pPa = poolA.principal, pIa = poolA.interest;
    /* списанное НА НАЧАЛО ОТРЕЗКА (КВ-62) — тем же способом, что и пул платежей: база пени
       обязана знать про решение, принятое до отрезка, и не знать про принятое после. Пеня,
       набежавшая ДО списания, решением не отменяется — она начислена по договору. */
    const woA = new Map((c.tranches || []).map(t => [t.no, writtenOffAt(t, fd(a))]));
    const woI = new Map((c.tranches || []).map(t => [t.no, writtenOffArtAt(t, 'interest', fd(a))]));
    const wDays = daysInWindows(a, b, wins);     // дни отрезка внутри окна спора
    for (const r of rows){
      if (pd(r.date) > a) continue;              // позиция не наступила — просрочки нет
      /* разнесение той же очередью, что и на дату среза (ADR-0060 §4): раньше наступило —
         раньше гасится. Деньги, пришедшие досрочно, ждут в пуле и закрывают позицию в день
         её наступления — тот же результат, что даёт разнесение пула на срез. */
      const pPaidA = round2(Math.min(pPa, r.principalDue));    pPa = round2(pPa - pPaidA);
      const iPaidA = round2(Math.min(pIa, r.interestCharged)); pIa = round2(pIa - iPaidA);
      const wA     = round2(Math.min(woA.get(r.trancheNo) || 0, round2(r.principalDue - pPaidA)));
      woA.set(r.trancheNo, round2((woA.get(r.trancheNo) || 0) - wA));
      const wIA    = round2(Math.min(woI.get(r.trancheNo) || 0,
                                     Math.max(0, round2((r.interestDue || 0) - iPaidA))));
      woI.set(r.trancheNo, round2((woI.get(r.trancheNo) || 0) - wIA));
      if (!(r.penaltyMain || r.penaltyInt)) continue;
      const pBal  = round2(r.principalDue - pPaidA - wA);
      const iBase = Math.max(0, round2((r.interestDue || 0) - iPaidA - wIA));
      if (pBal + iBase <= 0.005) continue;
      const perDay = pBal * (r.penaltyMain / 100) + iBase * (r.penaltyInt / 100);
      const amt = perDay * days;
      r.penaltyAccrued = round2(r.penaltyAccrued + amt);
      /* пеня позиции под решением приостановлена ОБОИМИ режимами, но только за дни ПОСЛЕ
         решения: до него пеня шла по договору, и решение её не отменяет. Дата решения —
         критическая, поэтому отрезок её не перешагивает и делить дни внутри не нужно. */
      const CLr = layerOf(r);
      if (CLr && !CLr.mode.penalty && a >= pd(CLr.date)) r.penaltyFrozen = round2(r.penaltyFrozen + amt);
      if (wDays) r.penaltyDisputed = round2(r.penaltyDisputed + perDay * wDays);
      const k = r.trancheNo + '|' + fd(a);
      const cell = perTranchePen.get(k) || { penalty:0, basePrincipal:0, baseInterest:0, perDay:0 };
      cell.penalty       = round2(cell.penalty + amt);
      cell.basePrincipal = round2(cell.basePrincipal + pBal);
      cell.baseInterest  = round2(cell.baseInterest + iBase);
      /* цена дня НЕ округляется до копейки: на малых базах копеечное округление даёт до
         15 % ошибки, а лист обещает, что «пеня за день × дней = пеня» сходится глазом.
         Округляет ПОКАЗ — четырьмя знаками, как ставку, а не как деньги. */
      cell.perDay        = cell.perDay + perDay;
      perTranchePen.set(k, cell);
    }
  }
  for (const r of rows){
    r.penaltyCharged   = round2(Math.max(0, r.penaltyAccrued - r.penaltyFrozen));
    /* к взысканию — то, что можно требовать сегодня: без приостановленного и без спорного */
    r.penaltyClaimable = round2(Math.max(0, r.penaltyCharged - r.penaltyDisputed));
    /* пеня ЗА ДЕНЬ ВПЕРЁД — единственная величина пени, которую прогноз имеет право
       называть: цена одного дня бездействия. Считается по базе НА ДАТУ СРЕЗА (день вперёд
       начнётся с неё), поэтому стоит отдельно от интеграла. Слой, приостановивший пеню,
       даёт ноль. Длинного горизонта у неё нет намеренно: penaltyMaxPct в макете не
       применяется (шаг 4), и на месяцы такая цифра росла бы без потолка. */
    const CLf   = layerOf(r);
    const iBase = Math.max(0, round2((r.interestDue || 0) - r.interestPaid - (r.interestWritten || 0)));
    const perDayNow = (r.principalBal + iBase > 0.005)
      ? r.principalBal * (r.penaltyMain / 100) + iBase * (r.penaltyInt / 100) : 0;
    r.penaltyPerDayFwd = round2((CLf && !CLf.mode.penalty) ? 0 : perDayNow);
  }
  /* второй проход: пеня гасится после основного долга и процентов */
  for (const r of rows){
    r.penaltyPaid = round2(Math.min(pPen, r.penaltyClaimable)); pPen = round2(pPen - r.penaltyPaid);
    /* СПИСАНИЕ ПЕНИ (КВ-63) — здесь, а не в первом проходе: пеня к этому месту только что
       стала известна (интеграл по отрезкам выше), и гасить её раньше было бы нечего.
       Списывается ТРЕБУЕМАЯ часть (penaltyClaimable): приостановленное решением суда и
       спорное решением о безнадёжности не снимаются — их и так не требуют. */
    const wP = offLeftP.get(r.trancheNo) || 0;
    r.penaltyWritten = round2(Math.min(wP, round2(r.penaltyClaimable - r.penaltyPaid)));
    offLeftP.set(r.trancheNo, round2(wP - r.penaltyWritten));
    r.penaltyBal  = round2(r.penaltyClaimable - r.penaltyPaid - r.penaltyWritten);
    r.received    = round2(r.principalPaid + r.interestPaid + r.penaltyPaid);
    r.totalPaid   = r.received;
    r.overdueTotal = round2(r.principalOverdue + r.interestOverdue + r.penaltyBal);
  }
  /* сборы и комиссии — ЧЕТВЁРТАЯ статья (ADR-0010): начисляются событием, не графиком */
  const feeRows = (c.fees || []).filter(f => f && f.date && pd(f.date) <= lim);
  let pF = pool.fees, wF = writtenOffArt.fees;
  for (const f of feeRows){
    f._paid = round2(Math.min(pF, f.amount || 0)); pF = round2(pF - f._paid);
    /* сбор гасится и списанием (КВ-63): решение о безнадёжности снимает весь долг, а сбор —
       такая же его статья, как проценты. Разреза по траншам у сборов нет — запас на кредит
       один, и расходуется он в порядке дат, той же очередью, что и деньги. */
    f._written = round2(Math.min(wF, round2((f.amount || 0) - f._paid))); wF = round2(wF - f._written);
    f._bal  = round2((f.amount || 0) - f._paid - f._written);
  }
  const index = new Map(rows.map(r => [r.key, r]));
  /* until — дата, ДО которой реально считали. У закрытого кредита она раньше даты среза,
     и это нужно подписывать: иначе «963 дня просрочки» у списанного кредита читается как
     «просрочка растёт сегодня», хотя расчёт остановлен в день закрытия.

     snapshot / provisional — дата снимка зеркала платежей и признак того, что начисление
     ушло дальше неё. Начисленное кредит выводит на любую дату, погашенное знает только до
     снимка; за хвост между ними пеня и дни просрочки посчитаны по платежам, которых
     владелец ещё не прислал. Величина от этого не становится неверной, но перестаёт быть
     окончательной, и это обязано быть подписано (КР-51). */
  const snap = (c.mirror && c.mirror.paymentsAsOf) || null;
  /* ИТОГ НАКОПЛЕННОГО. Наступившее лежит в rows, СРОЧНОЕ — в ненаступивших позициях, а их
     леджер не держит: он по определению «наступившее» (ADR-0057). Считаем полный итог
     здесь, где график ещё под рукой, иначе debtOf показал бы накопленное без срочной
     части и свод разошёлся бы с графиком. */
  const artTotal = { accInterest:0, accPenalty:0 };
  for (const t of c.tranches) for (const r of trancheScheduleRows(t)){
    const a = r.articles; if (!a) continue;
    artTotal.accInterest = round2(artTotal.accInterest + (a.accInterest || 0));
    artTotal.accPenalty  = round2(artTotal.accPenalty  + (a.accPenalty  || 0));
  }
  /* ЛИСТ «ПО ДАТАМ» (ADR-0129) — раздел на транш, строка на критическую дату: событие и
     период ПОСЛЕ него. Проценты берутся отрезком начисления, пеня — интегралом выше; обе
     величины посчитаны на ОДНОЙ сетке, поэтому лист сходится со сводом по построению,
     а не по совпадению.
     Лестница базы: база строки = база предыдущей + освоенное этой − погашенное телом.
     Отдельной колонки «остаток тела на конец» нет намеренно — это буквально база следующей
     строки, то есть одно число в двух местах (разбор 15.08.2026, вопрос 6). */
  const dateSheet = (c.tranches || []).map(t => {
    const segs   = segsByTranche.get(t.no) || [];
    const byFrom = new Map(segs.map(s => [s.from, s]));
    const pays   = ((c.mirror && c.mirror.payments) || [])
      .filter(p => paymentCounts(p) && (p.tranche | 0) === t.no);
    const out = [];
    let runInt = 0, runPen = 0;
    /* НАКОПЛЕННОЕ (ADR-0093 §1, статья графика accInterest — SCHED_ARTICLES). Проценты,
       начисленные ДО реструктуризации: ставка на них не идёт и период их не порождает,
       срок им назначает документ, раскладывая по позициям нового графика. Поэтому в лист
       они приходят не из отрезка, а из строки графика своей даты. */
    const accByDate = new Map();
    for (const r of rows){
      if (r.trancheNo !== t.no || !(r.accInterestDue > 0.005)) continue;
      accByDate.set(r.date, round2((accByDate.get(r.date) || 0) + r.accInterestDue));
    }
    /* ТЕЛО ПО ГРАФИКУ (КВ-48). «Просрочено» без него — число ниоткуда: видно, что не
       покрыто, и не видно, ЧТО наступило. Берётся из леджера (наступившие позиции,
       ADR-0057), а не из графика: лист печатает расчёт, а не план. Позиция, датированная
       ровно СРЕЗОМ, строки листа не имеет (срез — правый край, а не критическая дата) —
       её тело в лист не попадает, ровно как и её событие «срок по графику». */
    const dueByDate = new Map();
    for (const r of rows){
      if (r.trancheNo !== t.no || !(r.principalDue > 0.005)) continue;
      dueByDate.set(r.date, round2((dueByDate.get(r.date) || 0) + r.principalDue));
    }
    /* ПРОЦЕНТЫ ПО ГРАФИКУ (КВ-65). Тем же приёмом, что тело: требование позиции берётся из
       леджера (наступившие позиции), а не из графика. Величина — `interestDue` (ADR-0105):
       контрактные проценты позиции ПЛЮС отклонение за фактическое тело; ровно её кредит
       требует к дате и ровно от неё считается база пени по процентам (penBaseI).
       Начисленное отрезком — величина ДРУГАЯ и стоит в листе своей колонкой: она отвечает
       на «сколько набежало», требование — на «сколько к этой дате обязаны заплатить».
       ФИЛЬТР ПО МОДУЛЮ, а не по знаку: отклонение двузнаково, и у транша, отдавшего тело
       по ДС, требование позиции уходит в минус (K-7 т1 01.06.2026: 1 223,01 − 1 659,71 =
       −436,70). Положительный фильтр терял такую позицию молча, и сумма колонки переставала
       сходиться с расчётом по позициям. */
    const dueIByDate = new Map();
    for (const r of rows){
      if (r.trancheNo !== t.no || !(Math.abs(r.interestDue || 0) > 0.005)) continue;
      dueIByDate.set(r.date, round2((dueIByDate.get(r.date) || 0) + r.interestDue));
    }
    let runAcc = 0, runPaidInt = 0, runPaidPen = 0, runDue = 0, runPaidP = 0, runDisb = 0, runOff = 0;
    let runDueI = 0;                    // проценты, потребованные графиком нарастающим (КВ-65)
    let runOffInt = 0, runOffPen = 0;   // списано по процентам и пене нарастающим (КВ-63)
    let runOut = 0, runIn = 0;   // перенос нарастающим (КВ-56)
    for (let i = 0; i < penMarks.length - 1; i++){
      const a = penMarks[i], b = penMarks[i + 1];
      const ds  = fd(a);
      const seg = byFrom.get(ds) || null;
      const pen = perTranchePen.get(t.no + '|' + ds) || null;
      /* ДВИЖЕНИЕ ТЕЛА БЕЗ НАЧИСЛЕНИЯ (КВ-53) — третий повод для строки рядом с отрезком и
         пенёй. Транш-ПРИЁМНИК получает тело переносом в дату ДС, а первая его позиция
         наступает позже (K-7 т2: принято 01.05.2026, график с 15.06.2026): отрезка под
         датой переноса нет, и строка молча пропадала — тело у транша появлялось «ниоткуда»
         на первой же строке графика. Дата, в которую тело двинулось, обязана быть в листе,
         даже когда начислять на этом отрезке не на что. */
      const moved = (t.transfers || []).some(x => fd(pd(x.date)) === ds)
                 || writeOffsOf(t).some(w => fd(pd(w.date)) === ds);
      if (!seg && !pen && !moved) continue;     // на этом отрезке с траншем не происходит ничего
      const ev  = calcEventsAt(c, t, ds);
      /* «Погашено в периоде» — платежи, ДАТИРОВАННЫЕ границей отрезка: деньги приходят в
         критическую дату, она их и показывает. Разнесение по статьям — зеркало платежей. */
      const day = pays.filter(p => fd(pd(p.date)) === ds);
      const pay = day.reduce((s, p) => { const L = p.layers || {};
        s.principal = round2(s.principal + (L.principal || 0));
        s.interest  = round2(s.interest  + (L.interest  || 0));
        s.penalty   = round2(s.penalty   + (L.penalty   || 0)); return s; },
        { principal:0, interest:0, penalty:0 });
      /* ВЫРОЖДЕННЫЙ ОТРЕЗОК: позиция графика наступает раньше первого освоения (в сиде
         таких траншей 11) — контрактного периода под ней нет, trancheAccrual даёт нулевые
         дни. Дней у СТРОКИ при этом ровно столько, сколько их между критическими датами:
         пеня по ним бежит. Поэтому «Дней» берётся у отрезка календарно, а база, ставка и
         начисление молчат прочерком — печатать их значило бы объявить основание для
         начисления, которого нет. */
      const gap  = !!seg && seg.days === 0;
      const base = (seg && !gap) ? seg.base : null;
      runInt = round2(runInt + (seg ? (seg.accrued || 0) : 0));
      runPen = round2(runPen + (pen ? (pen.penalty  || 0) : 0));
      /* Нарастающие и остатки — внутри ТРАНША: лестница базы сходится только в нём, и
         остаток статьи, посчитанный поперёк траншей, не сойдётся ни с одной строкой.
         Остаток = начислено нарастающим − погашено нарастающим: платёж гасит статью
         целиком, очередь принадлежит модулю платежей (ADR-0060 §4), а лист лишь печатает
         итог разнесения, а не повторяет его правило. */
      const accDue = accByDate.get(ds) || 0;
      const dueP   = dueByDate.get(ds) || 0;
      const dueI   = dueIByDate.get(ds) || 0;
      runAcc     = round2(runAcc + accDue);
      runPaidInt = round2(runPaidInt + pay.interest);
      runPaidPen = round2(runPaidPen + pay.penalty);
      /* НАРАСТАЮЩИЕ ПО ТЕЛУ (КВ-49). Разовое число строки отвечает на «что случилось в эту
         дату», нарастающее — на «где мы к этой дате»: сколько тела график успел потребовать
         и сколько заёмщик успел вернуть. Их разность — просроченное тело плюс наступившее
         сегодня; сверять два столбца глазом дешевле, чем складывать 130 строк. */
      runDue     = round2(runDue + dueP);
      runPaidP   = round2(runPaidP + pay.principal);
      /* НАРАСТАЮЩИЕ ПО ПРОЦЕНТАМ (КВ-65). Пара к «По графику» по тому же доводу, что у тела:
         разность «потребовано графиком − погашено» и есть просроченные проценты плюс
         наступившее сегодня, а складывать 130 строк глазом дороже, чем сверить два столбца. */
      runDueI    = round2(runDueI + dueI);
      /* ОСВОЕНО НАРАСТАЮЩИМ (КВ-51). У транша с одним освоением колонка повторяет разовое
         число, у многотраншевых договоров — единственное место, где видно, на какой сумме
         кредит жил в этом отрезке: «Остаток» уже вычел погашенное, а «Освоено» помнит
         только свою дату. */
      const disb = round2(ev.filter(e => e.kind === 'disb').reduce((s, e) => s + (e.amount || 0), 0));
      runDisb    = round2(runDisb + disb);
      /* СПИСАНО и СПИСАНО НАРАСТАЮЩИМ (КВ-53). Тело, признанное безнадёжным решением, —
         третий способ уменьшить долг после денег и переноса, и единственный, которого лист
         не показывал вовсе. Нарастающее нужно ровно затем же, зачем «Погашено нарастающим»:
         решений о списании на кредите бывает больше одного (частичное списание — штатный
         исход), и «сколько всего списано к этой дате» иначе складывается глазами.
         ПЕРЕНОС в это число НЕ входит: тело не исчезло, оно живёт в другом транше — у него
         своя пара колонок по составу («Перенесено · Принято», КВ-55). Гасят «Остаток» теперь
         оба (КВ-62), но перенос — встречно, а списание уносит тело с баланса насовсем. */
      const offDay   = writeOffsOf(t).filter(w => fd(pd(w.date)) === ds);
      const offAmt   = round2(offDay.reduce((s, w) => s + (w.amount || 0), 0));
      /* СПИСАНО ПО ПРОЦЕНТАМ И ПЕНЕ (КВ-63) — своя колонка в СВОЁМ блоке, а не приписка к
         телу. Без неё «Остаток» процентов падал бы до нуля молча: строка печатала бы
         «Начислено 18 024,64 · Погашено 4 000,00 · Остаток 0,00», и арифметика блока не
         сходилась бы ни глазом, ни на бумаге. Правило показа то же, что у тела. */
      const offInt   = round2(offDay.reduce((s, w) => s + (((w.articles||{}).interest)||0), 0));
      const offPen   = round2(offDay.reduce((s, w) => s + (((w.articles||{}).penalty )||0), 0));
      runOff     = round2(runOff + offAmt);
      runOffInt  = round2(runOffInt + offInt);
      runOffPen  = round2(runOffPen + offPen);
      const movedOut = round2((t.transfers || []).filter(x => x.dir === 'out' && fd(pd(x.date)) === ds)
                        .reduce((s, x) => s + (x.amount || 0), 0));
      const movedIn  = round2((t.transfers || []).filter(x => x.dir === 'in'  && fd(pd(x.date)) === ds)
                        .reduce((s, x) => s + (x.amount || 0), 0));
      const moveTo   = (t.transfers || []).filter(x => fd(pd(x.date)) === ds).map(x => x.counterTranche).join(', ');
      /* ПЕРЕНЕСЕНО И ПРИНЯТО НАРАСТАЮЩИМ (КВ-56). Разовое число отвечает на «что случилось
         в эту дату», нарастающее — на «сколько тела транш отдал и принял ВСЕГО к ней».
         Считаются они врозь, а не одним нетто: транш-источник, отдавший тело двумя ДС и
         принявший часть обратно третьим, при нетто выглядел бы отдавшим меньше, чем отдал.
         Разность нарастающих — вклад переноса в «Остаток» этой строки, и сойтись она
         обязана с ИР-3: `trancheBalanceAt` несёт ровно `− transferredOut + transferredIn`. */
      runOut = round2(runOut + movedOut);
      runIn  = round2(runIn  + movedIn);

         допсоглашение задним числом переписывало ставку во всех прошлых строках, хотя
         начислено по ним было по старой. */
      const pcnd = conditionsAt(t, ds);
      out.push({ date:ds, to:fd(b), days: Math.max(0, dd(a, b)),
        events:ev, move:round2(ev.reduce((s, e) => s + (e.amount || 0), 0)),
        /* ДВА ФАКТА, А НЕ ОДНО НЕТТО (КВ-48). Прежде колонка печатала «изменение базы» =
           освоение − погашенное тело: погашение стояло в ней ВТОРОЙ раз (рядом своя
           колонка), а освоение и платёж одного дня схлопывались в одно число и оба
           переставали быть видны. Освоение — факт, погашение — факт; «изменение» между
           ними выводится, а не хранится: база строки минус база предыдущей. */
        disb, runDisb, dueP, runDue, runPaidP, offAmt, runOff,
        offInt, runOffInt, offPen, runOffPen,
        movedOut, runOut, movedIn, runIn, moveTo,
        base, rate: (seg && !gap) ? seg.rate : null, paused: !!(seg && seg.paused),
        accrued: (seg && !gap) ? seg.accrued : null, dev: (seg && !gap) ? seg.dev : null,
        noAccrual: !seg ? (moved && !runDisb ? 'pre' : 'tail') : (gap ? 'gap' : null),
        posNo: seg ? seg.posNo : null,
        penalty: pen ? pen.penalty : 0, penBaseP: pen ? pen.basePrincipal : 0,
        penBaseI: pen ? pen.baseInterest : 0, penPerDay: pen ? pen.perDay : 0,
        penRateMain: pcnd.penaltyMain || 0, penRateInt: pcnd.penaltyInt || 0,
        accDue, runAcc, dueI, runDueI, runPaidInt, runPaidPen,
        intLeft: round2(runInt - runPaidInt - runOffInt), penLeft: round2(runPen - runPaidPen - runOffPen),
        /* Остатка тела отдельным полем в строке НЕТ: он и есть «База» этой же строки, а звать
           одно число двумя именами в соседних колонках — ровно то, что волна вычищает.
           Итоговой строке этого мало (у строки среза базы нет вовсе) — она считает остаток
           из нарастающих сама, endBal (КВ-59). После КВ-54 тождество не на слово: база = освоено −
           погашено − неосвоенное ± перенос − списано (sbase в trancheAccrual, КВ-62) и сходится с ИР-3 до
           копейки на всех 60 кредитах сида — сверяет проверка №174. */
        paid:pay, runInt, runPen });
    }
    /* СТРОКА САМОГО СРЕЗА (КВ-53). Сетка отрезков кончается срезом как ПРАВЫМ КРАЕМ:
       penMarks берёт даты строго левее среза и приклеивает срез концом последнего
       отрезка. Значит всё, что случилось РОВНО в дату среза, строки не имело вовсе —
       и это не мелочь: у закрытых кредитов дата решения о списании совпадает со срезом
       по построению (срез закрытого кредита — дата закрытия), поэтому все три списания
       сида были невидимы; тем же способом пропадали 24 платежа сида, датированных срезом.
       Строка добавляется только когда в эту дату ЕСТЬ что показать, и несёт нулевую
       длину: отрезка за срезом нет, поэтому база, ставка и начисление молчат прочерком —
       строка отвечает на «что случилось в срез», а не «сколько набежало после». Для ИТОГОВОЙ
       строки она при этом несёт состояние отдельными полями endOvdP/endOvdI (КВ-59): итог
       года обязан назвать долг ПОСЛЕ платежа этой даты, а сама строка о нём молчит. */
    const dsLim = fd(lim);
    const evLim = calcEventsAt(c, t, dsLim);
    const payLim = pays.filter(p => fd(pd(p.date)) === dsLim).reduce((s, p) => { const L = p.layers || {};
      s.principal = round2(s.principal + (L.principal || 0));
      s.interest  = round2(s.interest  + (L.interest  || 0));
      s.penalty   = round2(s.penalty   + (L.penalty   || 0)); return s; },
      { principal:0, interest:0, penalty:0 });
    const offDayLim = writeOffsOf(t).filter(w => fd(pd(w.date)) === dsLim);
    const offLim = round2(offDayLim.reduce((s, w) => s + (w.amount || 0), 0));
    const offILim = round2(offDayLim.reduce((s, w) => s + (((w.articles||{}).interest)||0), 0));
    const offPLim = round2(offDayLim.reduce((s, w) => s + (((w.articles||{}).penalty )||0), 0));
    const dueLim = dueByDate.get(dsLim) || 0, accLim = accByDate.get(dsLim) || 0;
    const dueILim = dueIByDate.get(dsLim) || 0;      // требование по процентам в срез (КВ-65)
    if (evLim.length || offLim + offILim + offPLim > 0.005 || dueLim > 0.005 || accLim > 0.005
        || Math.abs(dueILim) > 0.005
        || payLim.principal + payLim.interest + payLim.penalty > 0.005){
      const outLim = round2((t.transfers || []).filter(x => x.dir === 'out' && fd(pd(x.date)) === dsLim)
                       .reduce((s, x) => s + (x.amount || 0), 0));
      const inLim  = round2((t.transfers || []).filter(x => x.dir === 'in'  && fd(pd(x.date)) === dsLim)
                       .reduce((s, x) => s + (x.amount || 0), 0));
      const dLim   = round2(evLim.filter(e => e.kind === 'disb').reduce((s, e) => s + (e.amount || 0), 0));
      const cLim   = conditionsAt(t, dsLim);
      /* ПРОСРОЧКА НА СРЕЗ — ОТДЕЛЬНЫМИ ПОЛЯМИ endOvdP/endOvdI, НЕ БАЗАМИ ПЕНИ (КВ-59).
         В САМОЙ строке эти числа не печатаются: отрезка за срезом нет, и колонки «Просрочено»
         в ней молчат прочерком — так и должно быть, строка отвечает за отрезок. Но ИТОГ года
         и транша обязан назвать состояние на конец периода, а последняя строка периода — как
         раз эта: иначе итог показывает долг ДО платежа, датированного срезом (у закрытого
         кредита последний платёж стоит ровно в нём). Считается тем же правилом, что и база
         пени на отрезке: непокрытый остаток наступивших позиций транша, проценты — ДО
         заморозки. Разностью нарастающих это не заменить: платежи разносятся пулом по ВСЕМУ
         кредиту в порядке наступления позиций (ADR-0060 §4), и у многотраншевого K-7
         «потребовано траншем − погашено траншем» расходится с разнесением на 6 733,12. */
      let ovdPLim = 0, ovdILim = 0;
      for (const r of rows){
        if (r.trancheNo !== t.no || pd(r.date) > lim) continue;
        if (!(r.penaltyMain || r.penaltyInt)) continue;
        /* списанное вычтено (КВ-62): у закрытого кредита решение датировано ровно срезом,
           и итог года обязан назвать долг ПОСЛЕ него — иначе строка среза печатает
           «Списано 58 000», а «Просрочено» в итоге года остаётся теми же 58 000. */
        const pBal  = round2(r.principalDue - r.principalPaid - (r.principalWritten || 0));
        const iBase = Math.max(0, round2((r.interestDue || 0) - r.interestPaid - (r.interestWritten || 0)));
        if (pBal + iBase <= 0.005) continue;
        ovdPLim = round2(ovdPLim + pBal); ovdILim = round2(ovdILim + iBase);
      }
      runOut = round2(runOut + outLim);       runIn = round2(runIn + inLim);
      runDisb = round2(runDisb + dLim);      runOff     = round2(runOff + offLim);
      runOffInt = round2(runOffInt + offILim); runOffPen = round2(runOffPen + offPLim);
      runDue  = round2(runDue + dueLim);     runPaidP   = round2(runPaidP + payLim.principal);
      runAcc  = round2(runAcc + accLim);     runPaidInt = round2(runPaidInt + payLim.interest);
      runDueI = round2(runDueI + dueILim);
                                             runPaidPen = round2(runPaidPen + payLim.penalty);
      out.push({ date:dsLim, to:dsLim, days:0, events:evLim,
        move:round2(evLim.reduce((s, e) => s + (e.amount || 0), 0)),
        disb:dLim, runDisb, dueP:dueLim, runDue, runPaidP,
        offAmt:offLim, runOff, offInt:offILim, runOffInt, offPen:offPLim, runOffPen,
        movedOut:outLim, runOut, movedIn:inLim, runIn,
        moveTo:(t.transfers || []).filter(x => fd(pd(x.date)) === dsLim).map(x => x.counterTranche).join(', '),
        base:null, rate:null, paused:false, accrued:null, dev:null, noAccrual:'edge', posNo:null,
        penalty:0, penBaseP:0, penBaseI:0, penPerDay:0, endOvdP:ovdPLim, endOvdI:ovdILim,
        penRateMain:cLim.penaltyMain || 0, penRateInt:cLim.penaltyInt || 0,
        accDue:accLim, runAcc, dueI:dueILim, runDueI, runPaidInt, runPaidPen,
        intLeft:round2(runInt - runPaidInt - runOffInt), penLeft:round2(runPen - runPaidPen - runOffPen),
        paid:payLim, runInt, runPen });
    }
    /* Свод раздела — им лист сверяется со сводом по статьям вкладки. Начислено по отрезкам
       и начислено по позициям расходятся ровно там, где график построен по одному снимку
       условий (Д-5); экран обязан назвать это расхождение, а не спрятать. */
    const ledInt = round2(rows.filter(r => r.trancheNo === t.no)
      .reduce((s, r) => s + (r.interestAccrued || 0), 0));
    /* СУММА КОЛОНКИ «ПО ГРАФИКУ» — ОТДЕЛЬНОЙ ВЕЛИЧИНОЙ (КВ-65), а не пересказом ledInt.
       На сиде они равны, но равенство это СВОЙСТВО СИДА, а не тождество: ledInt складывает
       interestAccrued (база + отклонение), колонка — interestDue (контракт + отклонение),
       и база расходится с контрактом на графиках с льготным периодом и распределением
       отложенных процентов. Плашка ниже подписывает то, что стоит в колонке, поэтому берёт
       это число; расхождение обеих величин стережёт проверка №176. */
    return { trancheNo:t.no, rows:out, sumInterest:runInt, sumPenalty:runPen, sumDueI:runDueI,
             ledgerInterest:ledInt, gap:round2(runInt - ledInt) };
  }).filter(s => s.rows.length);

  return { rows, index, pool, feeRows, layers, byLadder, disputes:wins, artTotal, dateSheet,
           writtenOff, writtenOffArt,                    // снято с баланса решением: тело (КВ-62) и все шесть статей (КВ-63)
           until: fd(lim), stopped: fd(lim) !== (asOf || TODAY),
           snapshot: snap, provisional: !!(snap && pd(snap) < lim), provisionalFrom: snap };
}

/* debtOf — шесть статей долга кредита (ADR-0093 §1; седьмая, расходы по обращению
   взыскания, принадлежит взысканию — ADR-0043), каждая в пяти величинах:
     accrued  — начислено к дате среза (по наступившим позициям графика);
     paid     — погашено (зеркало платежей);
     overdue  — ПРОСРОЧЕННАЯ часть: наступило и не погашено;
     term     — СРОЧНАЯ часть: ещё не наступила по сроку («Срочная часть» CONTEXT.md);
     bal      — остаток статьи = срочная + просроченная.
   Для основного долга остаток НЕ равен сумме непокрытых позиций: это освоенное минус
   погашенное, то есть тело кредита целиком. Смешение двух величин и есть причина, по
   которой прежняя модель показывала «остаток 0» у кредита с освоением 100 000 (КР-7).
   Пятая статья, расходы по обращению взыскания, — собственность взыскания: приходит
   зеркалом (mirror.collectionCosts) и в этот агрегат не входит. */
function debtOf(led, disbursed){
  const zero = () => ({ accrued:0, paid:0, overdue:0, term:0, bal:0 });
  const d = { principal:zero(), interest:zero(), penalty:zero(), fees:zero(),
              accInterest:zero(), accPenalty:zero() };
  /* приостановленное решением суда и спорное — НАЧИСЛЕНО, но не требуется: в остаток,
     просрочку и гейт «Погашен» не входят и показываются отдельно */
  d.interest.frozen = 0; d.penalty.frozen = 0; d.penalty.disputed = 0;
  for (const r of led.rows){
    d.principal.accrued += r.principalDue;  d.principal.paid += r.principalPaid;
    d.principal.overdue += r.principalOverdue;
    d.interest.accrued  += r.interestCharged; d.interest.paid += r.interestPaid;
    d.interest.overdue  += r.interestOverdue; d.interest.frozen += r.interestFrozen || 0;
    d.penalty.accrued   += r.penaltyClaimable; d.penalty.paid  += r.penaltyPaid;
    d.penalty.overdue   += r.penaltyBal;
    d.penalty.frozen    += r.penaltyFrozen   || 0;
    d.penalty.disputed  += r.penaltyDisputed || 0;
    d.accInterest.accrued += r.accInterestDue || 0;
    d.accPenalty.accrued  += r.accPenaltyDue  || 0;
  }
  for (const f of led.feeRows){
    d.fees.accrued += f.amount || 0; d.fees.paid += f._paid || 0;
    d.fees.overdue += f._bal || 0;
  }
  /* Погашено по статье — это ВЕСЬ подтверждённый пул, а не только разнесённое по
     наступившим позициям: платёж сверх графика гасит тело досрочно, и остаток обязан
     это увидеть. По позициям разнесение нужно для другого — определить, что просрочено. */
  d.principal.paid = round2(Math.min(led.pool.principal, disbursed || 0));
  d.interest.paid  = round2(Math.min(led.pool.interest, d.interest.accrued));
  d.penalty.paid   = round2(Math.min(led.pool.penalty,  d.penalty.accrued));
  d.fees.paid      = round2(Math.min(led.pool.fees,     d.fees.accrued));
  /* НАКОПЛЕННОЕ ПОГАШЕННОЕ. Слоя под него у зеркала платежей пока нет: очередь получает
     семь статей отдельной правкой на стороне платежей (ADR-0093 «Последствия»). Пул
     читается по имени статьи заранее — придёт слой, кредит подхватит его без правки;
     до тех пор погашено 0, и это не занижение, а факт: в эти статьи никто не разносил. */
  d.accInterest.paid = round2(Math.min(led.pool.accInterest || 0, d.accInterest.accrued));
  d.accPenalty.paid  = round2(Math.min(led.pool.accPenalty  || 0, d.accPenalty.accrued));
  /* ПЕРЕПЛАТА. Срез `Math.min` не даёт отрицательного остатка — но раньше он же молча
     съедал разницу: у шести кредитов зеркало разносило в проценты больше, чем кредит
     начислил, и до 66 935 сомов исчезали между двумя строками (КР-48). Излишек — не
     погрешность, а величина со своей судьбой: по §7.2 спеки платежей он идёт ОБРАТНОЙ
     очередью (ОД → проценты → штрафы → возврат заёмщику), и правило это принадлежит
     платежам. Кредит его не разносит — он обязан его ПОКАЗАТЬ, иначе расхождение с
     владельцем выглядит как сойдясь. */
  d.overpay = { principal: round2(Math.max(0, led.pool.principal - (disbursed || 0))),
                interest:  round2(Math.max(0, led.pool.interest  - d.interest.accrued)),
                penalty:   round2(Math.max(0, led.pool.penalty   - d.penalty.accrued)),
                fees:      round2(Math.max(0, led.pool.fees      - d.fees.accrued)) };
  d.overpay.total = round2(d.overpay.principal + d.overpay.interest + d.overpay.penalty + d.overpay.fees);
  /* тело кредита: освоено − погашено − СПИСАНО (КВ-62). Списанное стоит рядом с погашенным,
     но НЕ внутри него: «Погашено» отвечает за деньги заёмщика, а решение о признании долга
     безнадёжным денег не приносит. Величина не теряется — свод печатает её отдельной
     строкой «Списано за баланс», по образцу приостановленного судом и спорной пени.
     Срочная часть — то, что ещё не наступило по графику. */
  const W = led.writtenOffArt || { principal: led.writtenOff || 0 };
  d.principal.written = round2(W.principal || 0);
  d.principal.bal  = round2(Math.max(0, (disbursed || 0) - d.principal.paid - d.principal.written));
  d.principal.term = round2(Math.max(0, d.principal.bal - d.principal.overdue));
  for (const k of ['interest','penalty','fees']){
    /* списанное — третье вычитаемое рядом с погашенным (КВ-63). Просрочка сюда уже пришла
       уменьшенной: позиции гасились списанием в buildLedger, сборы — своим _written. */
    d[k].written = round2(W[k] || 0);
    d[k].bal  = round2(Math.max(0, d[k].accrued - d[k].paid - d[k].written));   // проценты/пеня/сборы начисляются, а не выдаются
    d[k].term = round2(Math.max(0, d[k].bal - d[k].overdue));
  }
  /* Накопленное просрочено ровно тем же признаком, что и всё остальное: срок наступил и
     не погашено (ADR-0093 §3 — два уровня перемножаются, а не подменяют друг друга).
     Срочная часть — ненаступившие взносы, назначенные документом: полный итог минус
     наступившее. Остаток = срочное + просроченное, как у любой статьи. */
  for (const k of ['accInterest','accPenalty']){
    const total = round2(((led.artTotal || {})[k]) || d[k].accrued);
    d[k].overdue = round2(Math.max(0, d[k].accrued - d[k].paid));
    d[k].term    = round2(Math.max(0, total - d[k].accrued));
    /* СПИСАНИЕ СНИМАЕТ СПЕРВА ПРОСРОЧЕННОЕ, ПОТОМ СРОЧНОЕ (КВ-63). Порядок не косметика:
       решение о безнадёжности выносят из-за того, что срок прошёл и не заплатили, — и
       снимать оно обязано в первую очередь ровно эту часть. Обратный порядок оставил бы
       у безнадёжного кредита просроченное накопленное при погашенном срочном. */
    d[k].written = round2(W[k] || 0);
    let w = d[k].written;
    const cut = Math.min(w, d[k].overdue);
    d[k].overdue = round2(d[k].overdue - cut); w = round2(w - cut);
    d[k].term    = round2(Math.max(0, d[k].term - w));
    d[k].bal     = round2(d[k].term + d[k].overdue);
  }
  for (const k of ['principal','interest','penalty','fees','accInterest','accPenalty'])
    for (const v of ['accrued','paid','overdue','term','bal','frozen','disputed','written'])
      if (d[k][v] != null) d[k][v] = round2(d[k][v]);
  /* ИТОГ РЕШЕНИЯ — одно число на все шесть статей (КВ-63): свод печатает его одной строкой
     «Списано за баланс», как и полагается величине, названной ОДНИМ документом. */
  d.written = { total: round2(['principal','interest','penalty','accInterest','accPenalty','fees']
    .reduce((a, k) => a + (d[k].written || 0), 0)) };
  for (const k of ['principal','interest','penalty','accInterest','accPenalty','fees'])
    d.written[k] = d[k].written || 0;
  return d;
}
/* ШЕСТЬ СТАТЕЙ ДОЛГА (ADR-0093 §1). Порядок здесь — ПОКАЗА, а не погашения: накопленная
   статья стоит сразу за своей текущей, потому что читают их парой («проценты — и сколько
   из них уже с новым сроком»). Очередь погашения своя и обратная (ADR-0093 §2), её держит
   buildQueue; сводить два порядка в один список значило бы дать одному списку две роли.
   `acc:true` помечает накопленные: экран прячет их, пока они нулевые — у кредита без
   реструктуризации и льготного периода их нет, и он обязан выглядеть как прежде. */
/* РАЗБОР СТРОКИ «СПИСАНО ЗА БАЛАНС» ПО СТАТЬЯМ (КВ-63). Строка свода печатает ОДНО число —
   решение одно, и сумма у него одна, — но собрано оно из шести статей, и без разбора
   читатель не сойдётся с блоком долга выше: там проценты и пеня стоят нулями, а откуда
   взялась сумма в строке-исключении, не сказано. Перечисляем только ненулевые: у кредита
   без пени слова «пеня 0,00» — шум. Подпись, а не колонки: строка-исключение по образцу
   «Приостановлено решением суда» несёт объяснение в colspan'е. */
function writtenParts(debt){
  const W = debt.written || {};
  return DEBT_ARTICLES.filter(a => (W[a.key] || 0) > 0.005)
    .map(a => a.label.toLowerCase() + ' ' + money(W[a.key])).join(' · ');
}
const DEBT_ARTICLES = [
  { key:'principal',   label:'Основной долг' },
  { key:'interest',    label:'Проценты' },
  { key:'accInterest', label:'Накопленные проценты', acc:true },
  { key:'penalty',     label:'Пеня' },
  { key:'accPenalty',  label:'Накопленная пеня',     acc:true },
  { key:'fees',        label:'Сборы и комиссии', opt:true }
];
/* Статьи, которые экран РИСУЕТ: накопленные и сборы — только когда они есть.
   СБОРЫ ПРЯЧУТСЯ ПРИ НУЛЕ (решение владельца 17.08.2026) по тому же доводу, что и
   накопленные: комиссия — статья НЕОБЯЗАТЕЛЬНАЯ, её назначает договор, и у кредита без
   неё строка «Сборы и комиссии 0,00 · 0,00 · 0,00 · 0,00» не сообщает ничего, кроме
   собственного отсутствия. На сиде её печатали 59 кредитов из 60 (сборы есть только у
   K-1 — 1 000,00). Тело, проценты и пеня прячутся НЕ БУДУТ ни при каком нуле: они
   назначены каждому кредиту, и ноль по ним — величина, а не пустое место.
   Мера «есть» у двух видов разная, потому что разное ведёт себя при погашении:
   накопленные меряются остатком с погашенным (наступившее сверх начисленного у них
   живёт в term и статьёй ещё не стало), сборы — всей строкой, включая списанное:
   уплаченная целиком комиссия остаётся фактом кредита, и «К погашению 1 000 · Погашено
   1 000 · Остаток 0» обязано остаться на экране. */
function debtArticlesOf(debt){
  const art = k => (debt && debt[k]) || {};
  const sum = (k, fs) => fs.reduce((a, f) => a + (art(k)[f] || 0), 0);
  return DEBT_ARTICLES.filter(a =>
    a.acc ? sum(a.key, ['bal','paid']) > 0.005 :
    a.opt ? sum(a.key, ['accrued','paid','bal','written']) > 0.005 : true);
}
