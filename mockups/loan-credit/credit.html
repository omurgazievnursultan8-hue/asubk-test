      ${d.docs.complete ? ''
        : `<div class="warn-inline">${svgInfo()}<div>Комплект НЕ собран${d.docs.missing.length?`: ${d.docs.missing.map(esc).join(' · ')}`:''}${d.docs.blocked.length?` · отклонены либо просрочены: ${d.docs.blocked.map(x=>esc(x.kind)).join(' · ')}`:''}. Регистрация договора заблокирована.</div></div>`}
      ${cgrid([{h:'Вид'},{h:'Наименование'},{h:'Состояние'},{h:'Дата'},{h:'Файл'},{h:''}], docRows, {empty:'Документов нет'})}

      <div class="section-h" style="margin-top:22px">Регистрация договора — файл и пометка</div>
      <div class="f2">
        ${fld('Скан договора', c.reg.scan?esc(c.reg.scan):null)}
        ${fld('Комментарий регистрации', c.reg.comment?esc(c.reg.comment):null, {span:true})}
      </div>

      <div class="section-h" style="margin-top:22px">Целевое использование</div>
      ${cgrid([{h:'Вид'},{h:'Дата'},{h:'Содержание'},{h:'Результат'},{h:'Файл'}],
        [].concat(
          (tu.docs||[]).map(x=>`<tr><td>Документ</td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.result||'')}</td><td>${x.file?esc(x.file):'—'}</td></tr>`),
          (tu.checks||[]).map(x=>`<tr><td>Проверка</td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${/отклонен|нецелев/i.test(x.result||'')?`<b style="color:var(--asubk-red)">${esc(x.result)}</b>`:esc(x.result||'')}</td><td>${x.file?esc(x.file):'—'}</td></tr>`),
          /* Решение Комитета живёт в «Содержании» строки-меры: отдельная колонка стояла
             пустой у документов и проверок — «—» в двух третях таблицы. */
          (tu.measures||[]).map(x=>`<tr><td>Мера</td><td>${esc(x.date)}</td><td>${esc(x.title)}${x.committeeRef?` · <b>${esc(x.committeeRef)}</b>`:''}</td><td>${esc(x.result||'')}</td><td>${x.file?esc(x.file):'—'}</td></tr>`)
        ), {empty:'Записей нет'})}
      <div class="gtoolbar">${roleBtn('targetUse','+ Запись целевого использования','CR.openTargetUseModal()')}</div>

      <div class="section-h" style="margin-top:22px">Кураторство ${lockHtml()}</div>
      ${cgrid([{h:'Подразделение'},{h:'Сотрудник'},{h:'Роль'},{h:'С'},{h:'По'}], curRows, {empty:'Назначений нет'})}
      <div class="mirror-src">Источник: модуль сотрудников · журнал назначений кураторства. Зеркало — только чтение.</div>

      <div class="section-h" style="margin-top:22px">Примечания</div>
      <div class="gtoolbar">
        <div class="field" style="max-width:240px"><span class="flabel">Тип</span><div class="control"><select onchange="CR.filterNotes(this.value)"><option value="">Все</option><option>Обычное</option><option>Примечание куратора</option><option>Примечание (ОПП)</option><option>Примечание (залог)</option><option>Примечание (ОИП)</option></select></div></div>
        ${roleBtn('addNote','+ Примечание','CR.openNoteModal()','btn btn-secondary btn-sm')}
      </div>
      <div class="hist" id="cr-notes">${noteRows.length?noteRows.join(''):'<div class="hrow"><div class="hwhat">Примечаний нет</div></div>'}</div>

      <div class="section-h" style="margin-top:22px">Журнал изменений</div>
      <div class="gtoolbar"><div class="field" style="max-width:360px"><span class="flabel">Фильтр</span><div class="control"><input placeholder="поиск по журналу" oninput="CR.filterAudit(this.value)"></div></div></div>
      <div class="hist" id="cr-audit">${auditRows.length?auditRows.join(''):'<div class="hrow"><div class="hwhat">Записей журнала нет</div></div>'}</div>`;
  }

  /* ---- диспетчер вкладок + рендер карточки ---- */
  function renderTab(name, c){
    const d = derive(c, cardAsOf);            // одна дата среза на карточку (КВ-10)
    switch(name){
      case 'Договор': return tabDogovor(c, d);
      case 'Условия': return tabUsloviya(c, d);
      case 'Состав': return tabTranshi(c, d);   // имя функции оставлено (КВ-35): переименован ЯРЛЫК, не предмет
      case 'График': return tabGrafik(c, d);
      case 'Прогноз': return tabPrognoz(c, d);
      case 'Расчёты': return tabRaschety(c, d);
      case 'Платежи': return tabPlatezhi(c, d);
      case 'План': return tabPlan(c, d);
      case 'Обеспечение': return tabObespechenie(c, d);
      case 'Проблемные': return tabProblemnye(c, d);
      case 'Досье': return tabDosye(c, d);
      default: return tabDogovor(c, d);
    }
  }
  function renderDetail(c){
    const host=document.getElementById('cr-card-body'); if(!host) return;
    const d=derive(c, cardAsOf);                                    // СВЕЖИЙ расчёт на каждый рендер (Р-11)
    host.innerHTML = `<div class="panel-wrap" style="padding-bottom:0">${headerHtml(c,d)}</div>`
      + tabbarHtml()
      + `<div class="panel-wrap">${renderTab(detailTab,c)}</div>`;
  }
  function rerenderDetail(){ const c=currentCredit(); if(c) renderDetail(c); }
  function openTab(name){ detailTab=name; rerenderDetail(); syncHash(); }

  /* ---- обвязка действий карточки (onclick-строки живут в глобальной области → CR.*) ---- */
  CR.renderDetail=renderDetail; CR.renderTab=renderTab; CR.openTab=openTab; CR.rerenderDetail=rerenderDetail;
  /* КВ-17: единственная точка смены области. 'credit' приходит строкой из <select>,
     номер транша — строкой или числом, поэтому нормализуем здесь, а не у вызывающих. */
  CR.setCardScope=function(v){ cardScope = (v==='credit' ? 'credit' : +v); rerenderDetail(); };
  CR.setCondFilter=function(v){ condBasisFilter=v; rerenderDetail(); };
  CR.toggleCondGroup=function(ref){ condOpenGroup = (condOpenGroup===ref?null:ref); condOpenTranche = null; rerenderDetail(); };
  CR.setCondTranche=function(n){ condOpenTranche = +n; rerenderDetail(); };
  CR.setDogovorExtraTab=function(id){ dogovorExtraTab = id; rerenderDetail(); };
  CR.toggleCondMatrix=function(){ condMatrixOpen=!condMatrixOpen; rerenderDetail(); };
  CR.setCondMatrixTranche=function(n){ condMatrixTranche=+n; rerenderDetail(); };
  CR.toggleCondTemplate=function(){ condTemplateOpen=!condTemplateOpen; rerenderDetail(); };
  CR.toggleGrafikVers=function(){ grafikVersOpen=!grafikVersOpen; rerenderDetail(); };
  /* Раскрытие отрезков одной позиции «Расчётов» (ADR-0128 §1). Набор, а не одна открытая
     строка: два соседних периода сравнивают развёрнутыми, иначе раскрытие второго гасило
     бы первый ровно в момент сравнения. */
  /* CR.setCalcView СНЯТ (КВ-64): у «Детального расчёта» один вид — лист по критическим
     датам, — и переключать нечего. Состояния на сессию у вкладки больше нет. */
  CR.toggleCalcYear=function(y){ y=+y; if(!calcOpenYears) calcOpenYears=new Set();
    if (calcOpenYears.has(y)) calcOpenYears.delete(y); else calcOpenYears.add(y);
    rerenderDetail(); };
  CR.setCalcYears=function(list){ calcOpenYears=new Set((list||[]).map(Number)); rerenderDetail(); };
  /* Нарастающие итоги блока: 'od' — основной долг, 'int' — проценты. Пени в списке нет —
     нарастающих колонок у неё не бывает. */
  CR.toggleCalcRun=function(block){ if (block==='int') calcRunInt = !calcRunInt; else calcRunOD = !calcRunOD;
    rerenderDetail(); };
  /* Выбор версии для просмотра (КВ-28). Версия — понятие ТРАНША, поэтому в области «по
     кредиту» клик ПЕРЕВОДИТ карточку в этот транш: показать архив одного транша внутри
     слитой таблицы нельзя, там смешались бы два контракта. Побочный эффект честен —
     cardScope общий с «Траншами» и «Расчётами», и они должны знать, что пользователь
     перешёл к траншу. Ключ выставляется здесь же: иначе сверка ключа в tabGrafik увидела
     бы смену области и сбросила только что сделанный выбор.
     Клик по ДЕЙСТВУЮЩЕЙ версии — возврат: самый нужный жест в режиме просмотра, отнимать
     его ради экономии одного клика неверно. */
  CR.setGrafikVer=function(no, ver){ no=+no; ver=+ver;
    const c=currentCredit(); if(!c) return;
    const t=(c.tranches||[]).find(x=>x.no===no); if(!t) return;
    if (c.tranches.length > 1) cardScope = no;
    const cur = scheduleAt(t, cardAsOf);
    grafikVer = (cur && cur.ver === ver) ? null : { no, ver };
    grafikVerKey = c.id + '|' + no;
    rerenderDetail(); };
  CR.clearGrafikVer=function(){ grafikVer=null; rerenderDetail(); };
  CR.goToSchedule=function(){ detailTab='График'; rerenderDetail(); };   // Д-5: перегенерация живёт на «Графике» (волна 03.08.2026)
  /* §0.3 «не молча»: маска дд.мм.гггг пропускала 99.99.9999 и молча подменяла дату
     срезом «сегодня». Круговая проверка fd(pd(s))===s ловит и маску, и несуществующий
     день (31.02.2026 → 03.03.2026 ≠ ввод), отказ объявляется тостом. */
  CR.setCardAsOf=function(v){ const s=String(v||'').trim();
    if (s && fd(pd(s))!==s){ toast('Дата «'+s+'» не существует — срез оставлен на '+cardAsOf,'warn'); rerenderDetail(); return; }
    cardAsOf = s || TODAY; rerenderDetail(); };
  CR.scrollToDivergence=function(){ const el=document.getElementById('condDivergence');
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); };
  CR.togglePlanMonth=function(mk){ planOpenMonth = (planOpenMonth===mk?null:mk); rerenderDetail(); };
  /* Смена года — смена охвата вкладки. Раскрытие кварталов не переносим: planQuartersKey
     держит год, и новый год открывается умолчанием (один квартал — среза, первый или
     последний, см. tabPlan). Журнал правок месяца тоже не трогаем — строка чужого года
     просто не выводится. */
  CR.setPlanYear=function(y){ planYear = +y; rerenderDetail(); };
  /* Кварталы «Плана»: пустой набор — законное «свернуть все», а не сброс. Умолчание
     возвращает только смена кредита или года (planQuartersKey, см. tabPlan). */
  CR.togglePlanQuarter=function(q){ q=+q; if(!planOpenQuarters) planOpenQuarters=new Set();
    if(planOpenQuarters.has(q)) planOpenQuarters.delete(q); else planOpenQuarters.add(q);
    rerenderDetail(); };
  CR.setPlanQuarters=function(list){ planOpenQuarters=new Set((list||[]).map(Number)); rerenderDetail(); };
  /* Годы «Графика». Пустой набор — законное состояние («свернуть все»), а не сброс:
     умолчание возвращает только смена набора годов (см. grafikYearsKey в tabGrafik). */
  CR.toggleGrafikYear=function(y){ y=+y; if(!grafikOpenYears) grafikOpenYears=new Set();
    if(grafikOpenYears.has(y)) grafikOpenYears.delete(y); else grafikOpenYears.add(y); rerenderDetail(); };
  CR.setGrafikYears=function(list){ grafikOpenYears=new Set((list||[]).map(Number)); rerenderDetail(); };
  CR.setPrognozAll=function(v){ prognozShowAll = !!v && v!=='false'; rerenderDetail(); };
  CR.setPrognozMs=function(v){ prognozMsOpen = !!v && v!=='false'; rerenderDetail(); };
  /* Применение ДС (КВ-26). Кнопка знает только НОМЕР документа — приложение берётся из
     зеркала реструктуризации, а не из формы: строки пришли из подписанного соглашения,
     и правкой в кредите они быть не могут (ADR-0096 §3). Вся работа — в двери
     restructureApplied: здесь только адресация документа и показ причин отказа. */
  CR.applyDsByNum=function(num){ const c=currentCredit();
    if(!c) return { ok:false, reasons:['Кредит не открыт'] };
    const ds=((c.mirror&&c.mirror.restructuring&&c.mirror.restructuring.ds)||[]).find(x=>x.num===num);
    if(!ds){ CR.toast('Приложение к '+num+' не пришло из реструктуризации — применять нечего','warn');
      return { ok:false, reasons:['Приложения к ДС нет в зеркале'] }; }
    const r=restructureApplied(c, ds);
    if(!r.ok){ CR.toast((r.reasons||[]).join(' · '),'warn'); return r; }
    CR.toast(num+' применено: транш №'+r.tranche.no+' на '+money(r.tranche.amount));
    rerenderDetail(); return r; };
  /* CR.stubAction удалён: канон §0.1 запрещает заглушки, а она обслуживала три кнопки
     owned-действий кредита — перевод долга, закрытие неосвоенного остатка, примечание —
     и в двух случаях тост ещё и врал про «модуль-владелец» (КР-2). Все три оживлены. */
  CR.filterAudit=function(q){ q=(q||'').toLowerCase(); const host=document.getElementById('cr-audit'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(q)?'':'none'; }); };
  CR.filterNotes=function(t){ t=(t||'').toLowerCase(); const host=document.getElementById('cr-notes'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = (!t || el.textContent.toLowerCase().includes(t))?'':'none'; }); };
  /* ============================================================
     МОДАЛКИ (Task 8) — единый openModal/closeModal, каждая: role+terminal guard → форма →
     мутация CR.* (внутри её gate() ре-валидируется) → при провале modalErr (§0.3, не молча),
     при успехе closeModal + toast + rerenderDetail (derive пересчитывается заново, Р-11).
     modalGuard: Наблюдатель и терминальный кредит НЕ могут ОТКРЫТЬ ни одну модалку.
     ============================================================ */
  function modalGuard(action){
    const c = currentCredit(); if (!c) return null;
    if (isTerminal(c)){ toast(terminalReason(c), 'warn'); return null; }
    if (action && !canRole(currentRole, action)){ toast('Роль «'+currentRole+'» не имеет права на это действие', 'warn'); return null; }
    return c;
  }

  /* 1) tranche (addTranche, Г-3) */
  CR.openTrancheModal=function(){ const c=modalGuard('addTranche'); if(!c) return; const d=derive(c);
    const body=`<p class="section-note">Условия транша наследуются от базовых условий кредита. Σ траншей ≤ суммы договора. Доступно к распределению: <b>${money(d.allocatable)}</b>.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Сумма транша</span><div class="control"><input id="trAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Плановая дата освоения</span><div class="control"><input id="trDate" type="date"></div></div>
        <div class="field"><span class="flabel">Субъект — наименование</span><div class="control"><input id="trSubjName" value="${esc(c.borrower.name)}"></div></div>
        <div class="field"><span class="flabel">Субъект — ИНН</span><div class="control"><input id="trSubjInn" value="${esc(c.borrower.inn)}"></div></div>
      </div>`;
    CR.openModal('Добавить транш', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitTranche()">Добавить транш</button>`);
  };
  CR.submitTranche=function(){ const c=modalGuard('addTranche'); if(!c) return;
    const amount=+document.getElementById('trAmount').value||0;
    const plannedDate=toDMY(document.getElementById('trDate').value);
    const subject={ name:document.getElementById('trSubjName').value, inn:document.getElementById('trSubjInn').value };
    const r=CR.addTranche(c,{amount,plannedDate,subject}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Транш добавлен: '+money(amount),'ok'); rerenderDetail(); };

  /* 2) disbursement (addDisbursement, Г-4·Г-5·Г-6) — апгрейд инлайн-формы до модалки */
  CR.openDisbModal=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const body=`<p class="section-note">Освоение — действие кредита, на транше. Проверяется: сумма не превышает остаток транша · жизненный цикл кредита · покрытие/КМ/waiver.</p>
      <div class="mform">
        ${/* Предвыбор — actionTranche: тот же транш, по которому мерился гейт кнопки на
              «Траншах», иначе кнопка разрешала бы то, чего форма не даст отправить (КВ-17). */''}
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="disbTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===(actionTranche(c)||{}).no?' selected':''}>№${t.no} · сумма ${money(t.amount)} · освоено ${money(disbursedSum(t))}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма освоения</span><div class="control"><input id="disbAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Дата освоения</span><div class="control"><input id="disbDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Плат. поручение</span><div class="control"><input id="disbOrder" placeholder="ПП-..."></div></div>
        <div class="field col-span"><span class="flabel">Назначение</span><div class="control"><input id="disbPurpose" placeholder="Оплата ..."></div></div>
      </div>`;
    CR.openModal('Внести освоение', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitDisb()">Сохранить освоение</button>`);
  };
  CR.submitDisb=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const no=+document.getElementById('disbTranche').value;
    const amount=+document.getElementById('disbAmount').value||0;
    const date=toDMY(document.getElementById('disbDate').value)||CR.TODAY;
    const order=document.getElementById('disbOrder').value, purpose=document.getElementById('disbPurpose').value;
    const r=CR.addDisbursement(c,{trancheNo:no,amount,order,purpose,date}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); cardScope=no; toast('Освоение внесено: '+money(amount),'ok'); rerenderDetail(); };

  /* 3) schedule-params (generateSchedule, Г-8) — апгрейд: параметры → предпросмотр (1·2·посл.) → новая версия */
  CR.openSchedModal=function(previewFrom){ const c=modalGuard('buildSchedule'); if(!c) return;
    const sel=scopeTranche(c)||c.tranches[0]; const cnd=CR.conditionsAt(sel,CR.TODAY);
    previewFrom=toDMY(previewFrom);
    const from=(previewFrom!=null?previewFrom:((sel.disbursements[0]&&sel.disbursements[0].date)||''));
    let preview;
    if(from && sel.disbursements.length){
      /* Предпросмотр строится ТОЙ ЖЕ базой, что и сама версия (ADR-0130 §1): остаток тела
         на дату старта. Иначе окно обещало бы одни суммы, а кнопка записывала другие. */
      const pBase=CR.trancheBalanceAt(c, sel, from);
      const rows=CR.buildSchedule(sel, from, pBase>0.005?{base:pBase}:null).rows;
      const show=[rows[0], rows[1], rows[rows.length-1]].filter(Boolean);
      preview=`<div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр (платёж 1 · 2 · последний)</div>
        ${/* Шапка и порядок колонок — те же, что в таблице «График — позиции» (волна 13.08.2026):
             предпросмотр показывает те же строки того же графика, и «ОД · %» против
             «Основной долг · Проценты» читалось как другая таблица. */''}
        ${cgrid([{h:'№'},{h:'Дата'},{h:'Основной долг',r:1},{h:'Проценты',r:1},{h:'Итого',r:1}], show.map(r=>`<tr><td>№${r.no}</td><td>${esc(r.date)}</td><td style="text-align:right">${money(r.principal)}</td><td style="text-align:right">${money(r.interest)}</td><td style="text-align:right">${money(r.total)}</td></tr>`))}`;
    } else { preview=`<div class="warn-inline">${svgInfo()}<div>График строится только от фактической даты освоения транша. У выбранного транша нет освоения либо не задана дата.</div></div>`; }
    const body=`<div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="schedTranche" onchange="CR.setCardScope(+this.value);CR.openSchedModal()">${c.tranches.map(t=>`<option value="${t.no}"${t.no===sel.no?' selected':''}>Транш №${t.no}${t.disbursements.length?'':' (не освоен)'}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Дата освоения (старт графика)</span><div class="control"><input id="schedFrom" type="date" value="${esc(toISO(from))}"></div></div>
        <div class="field"><span class="flabel">Периодичность</span><div class="control"><input value="${esc(cnd.freq||'ежемесячно')}" readonly></div></div>
        <div class="field"><span class="flabel">Метод погашения</span><div class="control"><input value="${esc(cnd.method||'аннуитет')}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по ОД, мес.</span><div class="control"><input value="${esc(cnd.graceMain||0)}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по %, мес.</span><div class="control"><input value="${esc(cnd.graceInterest||0)}" readonly></div></div>
      </div>
      <p class="section-note" style="margin-top:8px">Периодичность/метод/льготы наследуются из условий транша (правка — только зарегистрированным основанием). Прежняя версия уходит в архив, не удаляется.</p>
      <div class="gtoolbar"><button class="btn btn-secondary btn-sm" onclick="CR.openSchedModal(document.getElementById('schedFrom').value)">Обновить предпросмотр</button></div>
      ${preview}`;
    CR.openModal('Сформировать график', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitSched()">Сформировать (новая версия)</button>`);
  };
  CR.submitSched=function(){ const c=modalGuard('buildSchedule'); if(!c) return;
    const no=+document.getElementById('schedTranche').value, from=toDMY(document.getElementById('schedFrom').value);
    const r=CR.generateSchedule(c,no,{from}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); cardScope=no; toast('График сформирован: версия v'+(r.ver||'?'),'ok'); rerenderDetail(); };

  /* 4) конструктор условий (addConditionRecords, Р-21 · Г-10 · Г-18…Г-20):
     основание → дата вступления → транши → параметры → предпросмотр «было → станет». */
  /* condEffDate() — дата вступления из формы, с защитой от непарсимой строки:
     «было» и предзаполнение должны читаться на эту дату (не на CR.TODAY), но
     не падать, пока пользователь дописывает дд.мм.гггг. */
  function condEffDate(){
    const el=document.getElementById('cbEff'); const s=toDMY(el?el.value:'');
    return /^\d{2}\.\d{2}\.\d{4}$/.test(s) ? s : CR.TODAY;
  }
  /* group (КВ-25) — из какой карточки нажат карандаш: 'rates' | 'repay' | не задан
     (все шестнадцать). Фильтруем список параметров, а не блокируем чужие: карандаш
     обещает «правлю вот это», и модалка обязана обещание держать — иначе карандаш
     у «Погашения» показал бы и ставку. */
  CR.openCondModal=function(group){ const c=modalGuard('addConditionRecords'); if(!c) return;
    const groupKeys = group==='rates' ? CR.COND_CARD_RATES
                    : group==='repay' ? CR.COND_CARD_REPAY : null;
    const params = groupKeys ? CR.PARAMS.filter(p=>groupKeys.includes(p.key)) : CR.PARAMS;
    const groupTitle = group==='rates' ? 'Изменение условий — ставки'
                     : group==='repay' ? 'Изменение условий — погашение'
                     : 'Изменение условий';
    const body=`<p class="section-note">Условия меняются только зарегистрированным основанием.
        Решение суда и постановление правительства здесь не заводятся — выбираются из существующих.
        Задним числом возможны только они, и с обязательным примечанием.</p>
      <div class="mform">
        <div class="field req col-span"><span class="flabel">Тип основания</span>
          <div class="control"><select id="cbKind" onchange="CR.condBasisChanged()">
            <option value="agreement">Доп. соглашение</option>
            <option value="court">Решение суда</option>
            <option value="govAct">Постановление правительства</option>
          </select><span class="caret">▾</span></div></div>
        <div id="cbAgrFields" class="col-span"><div class="mform">
          <div class="field req"><span class="flabel">Номер ДС</span><div class="control"><input id="cbNum" placeholder="ДС-..."></div></div>
          <div class="field req"><span class="flabel">Дата ДС</span><div class="control"><input id="cbDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
          <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="cbScan" placeholder="файл.pdf"></div></div>
        </div></div>
        <div id="cbRefField" class="field req col-span" style="display:none"><span class="flabel">Документ-основание</span>
          <div class="control"><select id="cbRef"></select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Вступает в силу</span><div class="control"><input id="cbEff" type="date" value="${esc(toISO(CR.TODAY))}" onchange="CR.condRecalcDefaults();CR.condPreview()"></div></div>
        <div class="field col-span"><span class="flabel">Примечание (обязательно при дате в прошлом)</span><div class="control"><input id="cbNote" placeholder="что пересчитывается"></div></div>
        <div class="field col-span"><span class="flabel">Транши</span><div class="control">
          ${c.tranches.map(t=>`<label style="margin-right:14px"><input type="checkbox" class="cbTr" value="${t.no}" checked onchange="CR.condPreview()"> №${t.no}</label>`).join('')}
        </div></div>
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Условия</div>
      <div class="mform">
        ${params.map(p=>{
          const t0=c.tranches[0], cur=t0?CR.conditionsAt(t0,CR.TODAY)[p.key]:'';
          const input = p.kind==='enum'
            ? `<select id="cbV_${p.key}" onchange="CR.condPreview()">${p.options.map(o=>`<option${String(o)===String(cur)?' selected':''}>${esc(o)}</option>`).join('')}</select><span class="caret">▾</span>`
            : p.kind==='months'
            /* Шаг 18: hidden-инпут cbV_ хранит «1,4,7» — общий код (condRecalcDefaults/
               condPreview/submitCond) уже читает el.value как готовое значение записи,
               спецкод нужен только для чекбоксов ↔ hidden input. */
            ? (()=>{ const cur0=String(cur||'').split(',').map(s=>s.trim()).filter(Boolean);
                const boxes=Array.from({length:12},(_,i)=>i+1).map(m=>
                  `<label style="margin-right:8px;font-weight:normal"><input type="checkbox" class="cbMonth_${p.key}" value="${m}" ${cur0.includes(String(m))?'checked':''} onchange="CR.condMonthsChanged('${p.key}')"> ${m}</label>`).join('');
                return `<input type="hidden" id="cbV_${p.key}" value="${esc(cur0.join(','))}">${boxes}`; })()
            : `<input id="cbV_${p.key}" type="number" step="0.01" value="${esc(cur)}" oninput="CR.condPreview()">`;
          return `<div class="field"><span class="flabel"><label><input type="checkbox" class="cbP" value="${p.key}" onchange="CR.condPreview()"> ${esc(p.label)}</label></span>
            <div class="control">${input}</div></div>`;
        }).join('')}
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр (было → станет)</div>
      <div id="cbPreview" class="cat-expand"></div>`;
    CR.openModal(groupTitle, body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button>
       <button class="btn btn-primary" onclick="CR.submitCond()">Оформить</button>`);
    CR.condBasisChanged();
  };
  /* «Документ-основание» (Д-4): список зависит от типа основания — суд и ПП
     не смешиваются в одном select (иначе решение суда может сослаться на
     постановление правительства и наоборот). Значение — courtRef(x): один и тот же
     хелпер и здесь, и при сидировании К-3, поэтому одно решение = одна группа журнала. */
  function condRefOptions(c, kind){
    if (kind==='court') return (c.mirror.court||[]).map(x=>{
      const v=courtRef(x); return { value:v, label:'⚖ '+v }; });
    if (kind==='govAct') return c.origin.govDecisionId
      ? [{ value:c.origin.govDecisionId, label:'ПП '+c.origin.govDecisionId }] : [];
    return [];
  }
  CR.condBasisChanged=function(){ const c=currentCredit(); if(!c) return;
    const k=document.getElementById('cbKind').value;
    document.getElementById('cbAgrFields').style.display = k==='agreement'?'':'none';
    document.getElementById('cbRefField').style.display  = k==='agreement'?'none':'';
    if (k!=='agreement'){
      const sel=document.getElementById('cbRef');
      const opts=condRefOptions(c,k);
      const emptyMsg = k==='court' ? 'Нет решений суда — основание недоступно' : 'Нет постановления правительства — основание недоступно';
      sel.innerHTML = opts.length
        ? opts.map(o=>`<option value="${jsAttr(o.value)}">${esc(o.label)}</option>`).join('')
        : `<option value="">${esc(emptyMsg)}</option>`;
      sel.disabled = opts.length===0;
    }
    CR.condRecalcDefaults(); CR.condPreview(); };
  /* Предзаполнение и «было» обязаны читаться на дату вступления (cbEff), не
     на CR.TODAY — иначе для ретроспективной записи предпросмотр лжёт о том,
     что действовало на дату, которую сам же документ меняет задним числом. */
  CR.condMonthsChanged=function(key){                    // Шаг 18: чекбоксы месяцев → hidden cbV_
    const vals=[...document.querySelectorAll('.cbMonth_'+key+':checked')].map(x=>+x.value).sort((a,b)=>a-b);
    document.getElementById('cbV_'+key).value = vals.join(',');
    CR.condPreview(); };
  CR.condRecalcDefaults=function(){ const c=currentCredit(); if(!c) return;
    const eff=condEffDate(), t0=c.tranches[0]; if(!t0) return;
    CR.PARAMS.forEach(p=>{
      const el=document.getElementById('cbV_'+p.key); if(!el) return;
      const cur=CR.conditionsAt(t0,eff)[p.key];
      el.value = (cur===undefined?'':cur);
      if (p.kind==='months'){                             // resync чекбоксов на пересчёт по дате
        const vals=String(el.value||'').split(',').map(s=>s.trim()).filter(Boolean);
        document.querySelectorAll('.cbMonth_'+p.key).forEach(cb=>{ cb.checked=vals.includes(cb.value); });
      }
    }); };
  CR.condPreview=function(){ const box=document.getElementById('cbPreview'); if(!box) return;
    const c=currentCredit(); if(!c) return;
    const eff=condEffDate();
    const nos=[...document.querySelectorAll('.cbTr:checked')].map(x=>+x.value);
    const keys=[...document.querySelectorAll('.cbP:checked')].map(x=>x.value);
    const rows=[];
    for (const k of keys) for (const no of nos){
      const t=c.tranches.find(x=>x.no===no); if(!t) continue;
      const el=document.getElementById('cbV_'+k); if(!el) continue;
      const from=CR.conditionsAt(t,eff)[k];
      const to=el.value;
      rows.push(`<div class="row"><span class="ck">№${no} · ${esc(CR.paramLabel(k))}</span>
        <span class="diff"><span class="diff-old">${esc(from===undefined?'—':from)}</span> → <span class="diff-new">${esc(to)}</span></span>
        <span class="src">с ${esc(eff)}</span></div>`);
    }
    box.innerHTML = rows.length?rows.join(''):`<div class="row" style="color:var(--text-placeholder)">Условия не выбраны</div>`; };
  CR.submitCond=function(){ const c=modalGuard('addConditionRecords'); if(!c) return;
    const kind=document.getElementById('cbKind').value;
    const eff=toDMY(document.getElementById('cbEff').value), note=document.getElementById('cbNote').value;
    const nos=[...document.querySelectorAll('.cbTr:checked')].map(x=>+x.value);
    const keys=[...document.querySelectorAll('.cbP:checked')].map(x=>x.value);
    let basis;
    if (kind==='agreement'){
      const num=document.getElementById('cbNum').value, date=toDMY(document.getElementById('cbDate').value);
      basis={ kind, num, date, scan:document.getElementById('cbScan').value,
              ref:num, label:'Доп. соглашение '+num };
    } else {
      const sel=document.getElementById('cbRef');
      const ref=sel&&sel.value?sel.value:'';
      basis={ kind, ref, date:'',
              label:(kind==='court'?courtBasisLabel(ref):'Постановление правительства '+ref) };
    }
    const records=keys.map(k=>{ const p=CR.PARAMS.find(x=>x.key===k);
      const el=document.getElementById('cbV_'+k);
      return { param:k, value:(p.kind==='num'?+el.value:el.value),
               effectiveFrom:eff, trancheNos:nos, note }; });
    const r=CR.addConditionRecords(c,{basis,records});
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Записей условий добавлено: '+r.value.added,'ok'); rerenderDetail(); };

  /* 5) manual-payment (addPayment, Г-11, Р-5) — «форма модуля платежей», статус «Ожидает ЦК» */
  CR.openPaymentModal=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const body=`<div class="info-plate">${svgInfo()}<div>Форма модуля платежей. Ручной ввод повисает «Ожидает ЦК» и НЕ двигает остатки/долг — подтверждённые остатки двигает только ЦК своим потоком.</div></div>
      <div class="mform">
        <div class="field"><span class="flabel">Кредит</span><div class="control"><input value="№ ${esc(c.num)} · ${esc(c.borrower.name)}" readonly></div></div>
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="payTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===(scopeTranche(c)||c.tranches[0]||{}).no?' selected':''}>№${t.no} · ${esc(t.subject.name)}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма платежа</span><div class="control"><input id="payAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field req"><span class="flabel">Дата платежа</span><div class="control"><input id="payDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
      </div>`;
    CR.openModal('Ручной ввод платежа — форма модуля платежей', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitPayment()">Отправить в модуль платежей</button>`);
  };
  CR.submitPayment=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const trancheNo=+document.getElementById('payTranche').value;
    const amount=+document.getElementById('payAmount').value||0;
    const date=toDMY(document.getElementById('payDate').value);
    const r=CR.addPayment(c,{amount,date,trancheNo}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    /* КВ-17: платёж — тоже действие на транше, как освоение и график; область карточки
       обязана встать на транш, на который он введён, теми же правилами, что и у соседей
       (submitDisb/submitSched выше). До этой правки не ставила — единственная асимметрия
       из трёх модалок. */
    CR.closeModal(); cardScope=trancheNo; toast('Платёж отправлен — статус «Ожидает ЦК»','ok'); rerenderDetail(); };

  /* 6) KM-decision (setKmDecision, Р-8) — разблокирует освоение с провалом покрытия (К-5) */
  CR.openKmModal=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const body=`<p class="section-note">Реквизиты решения Кабинета Министров. Поле кредита; его же читает модуль залога.
        Решение освобождает не от обеспечения вообще, а от <b>общего порога</b>, устанавливая свой: порог <b>0 %</b> — полное освобождение.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид решения</span><div class="control"><input id="kmKind" value="Решение КМ"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="kmNum" placeholder="КМ-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="kmDate" type="date"></div></div>
        <div class="field req"><span class="flabel">Порог обеспечения по решению, %</span><div class="control"><input id="kmPct" type="number" min="0" step="1" value="${esc((c.kmDecision&&c.kmDecision.coverPct!=null)?c.kmDecision.coverPct:80)}"></div></div>
        <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="kmScan" placeholder="reshenie-km.pdf"></div></div>
      </div>`;
    CR.openModal('Решение КМ — порог обеспечения', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitKm()">Сохранить решение</button>`);
  };
  CR.submitKm=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const kind=document.getElementById('kmKind').value, num=document.getElementById('kmNum').value;
    const date=toDMY(document.getElementById('kmDate').value), scan=document.getElementById('kmScan').value;
    const coverPct=document.getElementById('kmPct').value;
    if(!num||!date){ CR.modalErr(['Номер и дата решения обязательны']); return; }
    if(coverPct===''||+coverPct<0){ CR.modalErr(['Порог по решению обязателен (0 % — полное освобождение)']); return; }
    const r=CR.setKmDecision(c,{kind,num,date,scan,coverPct}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Решение КМ сохранено — порог обеспечения '+coverPct+' %','ok'); rerenderDetail(); };

  /* 9) link-pledge picker (linkPledge, Г-13) — только договоры того же ИНН + «Действует» */
  CR.openPledgePicker=function(){ const c=modalGuard('linkPledge'); if(!c) return;
    const linked=new Set((c.mirror.pledges||[]).map(p=>p.contractNum));
    const avail=(CR.db.pledgesRegistry||[]).filter(p=>p.active && p.pledgorInn===c.borrower.inn && !linked.has(p.contractNum)); // Г-13
    const body=`<p class="section-note">Показаны только действующие залоговые договоры того же ИНН заёмщика (${esc(c.borrower.inn)}), ещё не привязанные. Создать залоговый договор из кредита нельзя — только в модуле залога.</p>
      ${avail.length?`<div class="cpick">${avail.map(p=>{ const v=(p.items||[]).reduce((a,it)=>a+(it.pledgeValue||0)*(it.share==null?1:it.share),0);
        return `<div class="cpick-row" onclick="CR.pickPledge('${jsAttr(p.contractNum)}')">
          <div class="cpick-main"><span class="cpick-num">${esc(p.contractNum)}</span>
            <span class="cpick-sub"> · ${esc(p.pledgor)} · ${esc((p.items[0]||{}).name||'')}</span></div>
          <div class="cpick-claim">залог ${money(v)}</div></div>`; }).join('')}</div>`
        :`<div class="cgrid-empty">Нет доступных договоров того же ИНН для привязки</div>`}`;
    CR.openModal('Привязать залоговый договор', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Закрыть</button>`, {cls:'narrow'});
  };
  CR.pickPledge=function(num){ const c=modalGuard('linkPledge'); if(!c) return;
    const reg=(CR.db.pledgesRegistry||[]).find(p=>p.contractNum===num); if(!reg){ CR.modalErr(['Договор не найден']); return; }
    const pledge=Object.assign({ liquid:true, ban:false, date:CR.TODAY, otherCredits:[] }, reg);
    const r=CR.linkPledge(c,pledge); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Залоговый договор '+num+' привязан','ok'); rerenderDetail(); };

  /* 10г) классификация (editClassification, КВ-30 · упрощена КВ-32) — одна дверь:
     карандаш и прямая правка, как у реквизитов договора. Вид/линия/источник — <select>
     по набору кредитной программы: набор задан программой, кредит из него выбирает
     (И-11 — здесь набор не правится), поэтому свободный ввод отдал бы пользователю
     значение, которое гейт всё равно отобьёт. «Цель» — <input>: классификатора целей
     у модуля нет. */
  function clsOptions(set,p,cur){
    if(!p.dict) return '';
    const list=(set[p.dict]||[]).slice();
    /* Действующее значение вне набора (наследие КР-59 или смена программы) не прячем:
       иначе форма показала бы чужое значение как выбранное или молча подменила его.
       Отбивать будет гейт — с названием набора (§0.3). */
    if(cur && !list.includes(cur)) list.unshift(cur);
    return `<option value=""></option>`+list.map(v=>`<option value="${jsAttr(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  }
  function clsFields(c,idPrefix){
    const set=programClassification(c), cur=c;
    return CLASSIFICATION_PARAMS.map(p=>{
      const id=idPrefix+p.key.charAt(0).toUpperCase()+p.key.slice(1);
      const ctl=p.dict
        ? `<select id="${id}">${clsOptions(set,p,cur[p.key])}</select>`
        : `<input id="${id}" value="${jsAttr(cur[p.key]||'')}">`;
      return `<div class="field${p.dict?' req':''}${p.dict?'':' col-span'}"><span class="flabel">${esc(p.label)}</span><div class="control">${ctl}</div></div>`;
    }).join('');
  }
  function clsRead(idPrefix){
    const v={}; CLASSIFICATION_PARAMS.forEach(p=>{
      const el=document.getElementById(idPrefix+p.key.charAt(0).toUpperCase()+p.key.slice(1));
      v[p.key]=el?el.value:''; });
    return v;
  }
  CR.openClassificationModal=function(){ const c=modalGuard('editClassification'); if(!c) return;
    const body=`<p class="section-note">Вид, линия и источник выбираются из набора кредитной программы ${esc(c.origin.programId||'—')} — сам набор задаёт программа и здесь не расширяется. Цель формулирует договор.</p>
      <div class="mform">${clsFields(c,'kl')}</div>`;
    CR.openModal('Изменить классификацию', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitClassification()">Сохранить</button>`);
  };
  CR.submitClassification=function(){ const c=modalGuard('editClassification'); if(!c) return;
    const values=clsRead('kl');
    const g=gate(c,'editClassification',{values}); if(!g.ok){ CR.modalErr(g.reasons); return; }   // ре-валидация Г-34 перед мутацией
    const r=CR.editClassification(c,{values}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Классификация обновлена','ok'); rerenderDetail(); };

        <div class="field"><span class="flabel">По (дата окончания)</span><div class="control"><input id="haTo" type="date"></div></div>

  /* 20) расторжение (closeCredit «Расторгнут») — третье основание канона §3 */
  CR.openTerminateModal=function(){ const c=modalGuard('terminate'); if(!c) return; const d=derive(c, cardAsOf);
    const body=`<p class="section-note">Третье основание закрытия. В отличие от «Погашен», нулевой остаток не требуется — но остаток не исчезает: он переходит во взыскание. Реквизиты соглашения или решения обязательны.</p>
      ${d.debtBalance>0?`<div class="warn-inline">${svgInfo()}<div>Остаток на дату среза: <b>${money(d.debtBalance)}</b>. После расторжения он остаётся к взысканию.</div></div>`:''}
      <div class="mform">
        <div class="field req"><span class="flabel">Вид документа</span><div class="control"><input id="tmKind" value="Соглашение о расторжении"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="tmNum" placeholder="СР-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="tmDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Скан</span><div class="control"><input id="tmScan" placeholder="sr.pdf"></div></div>
        <div class="field req col-span"><span class="flabel">Основание</span><textarea id="tmReason" class="note-area" placeholder="существенное нарушение условий; соглашение сторон; ..."></textarea></div>
      </div>`;
    CR.openModal('Расторжение договора', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-tint danger" onclick="CR.submitTerminate()">Расторгнуть</button>`);
  };
  CR.submitTerminate=function(){ const c=modalGuard('terminate'); if(!c) return;
    const doc={ kind:document.getElementById('tmKind').value, num:document.getElementById('tmNum').value,
      date:toDMY(document.getElementById('tmDate').value), scan:document.getElementById('tmScan').value };
    const r=CR.closeCredit(c,{ reason:'Расторгнут', doc, note:document.getElementById('tmReason').value });
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Договор расторгнут','ok'); rerenderDetail(); };

  /* 21) plan (setPlan, Г-30, ADR-0042) — заведение ПАЧКОЙ за период, каждая строка
     предзаполнена прогнозом месяца. Предзаполнение — стартовое значение формы, не связь:
     сохранённый план от прогноза не зависит. Месяцы, где план уже стоит, приходят со
     СВОИМ значением и помечены «будет правка» с прежней суммой — правка задним числом
     не должна выглядеть заведением с нуля. */
  CR.openPlanModal=function(){ const c=modalGuard('setPlan'); if(!c) return;
    const d=derive(c, cardAsOf);
    /* Умолчание — ГОД даты среза целиком, а не окно в шесть месяцев от неё (КВ-24):
       горизонт планирования у куратора годовой (вкладка разрезана по годам, плитки
       считают год), и селектор при открытии обязан стоять на осмысленном значении, а не
       в положении «произвольный период». */
    const {from, to}=planYearRange(c, planDefaultYear(planYearsList(c, cardAsOf), cardAsOf));
    CR.openModal('Поставить план', CR.planFormHtml(c, d, from, to),
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitPlan()">Сохранить план</button>`);
  };
  /* тело формы вынесено: пересобирается при смене периода без переоткрытия модалки */
  CR.planFormHtml=function(c, d, from, to){
    const fc=forecastByMonth(c, d.ledger.index, cardAsOf);
    const mks=monthRange(from, to);
    const years=planYearsList(c, cardAsOf), cur=planYearOfRange(c, from, to);
    /* Галка ставится ТОЛЬКО там, где строка осмысленна. Прогноз — future-only и
       группируется по датам позиций графика: месяца без позиции в нём просто нет, и
       предзаполнить такую строку нечем. Ставить ей галку с нулём значило бы отправлять
       форму, которую Г-30 отобьёт («план должен быть больше нуля»), — а один нулевой
       месяц валит всю пачку. Замер до правки: 58 демо-кредитов из 59. */
    const rows=mks.map(mk=>{ const ex=planRowOf(c,mk);
      const seed = ex && ex.amount!=null ? ex.amount : (fc.has(mk)?fc.get(mk):0);
      return `<tr>
        <td><label><input type="checkbox" class="plan-on" data-m="${jsAttr(mk)}"${seed>0?' checked':''}> ${esc(monthLabel(mk))}</label></td>
        <td style="text-align:right">${fc.has(mk)?money(fc.get(mk)):'—'}</td>
        <td style="text-align:right"><input type="number" min="0" step="0.01" class="plan-amt" data-m="${jsAttr(mk)}" data-seed="${fc.has(mk)?fc.get(mk):''}" value="${seed||''}" style="width:130px;text-align:right"></td>
        <td>${ex&&ex.amount!=null?`<span class="pill mid">будет правка</span> было ${money(ex.amount)}`:(ex?'<span class="pill neutral">план был снят</span>':'—')}</td></tr>`;});
    return `<p class="section-note">План — цель на месяц, которую ставим сами. Строки предзаполнены <b>прогнозом</b>:
        это стартовое значение формы, не связь — после сохранения план от прогноза не зависит (ADR-0042).
        Снять галку — месяц не трогаем; месяц без прогноза приходит без галки, ставить нечего.
        Обнулить план месяца нельзя: чтобы отказаться от цели, снимите план кнопкой в раскрытой строке месяца.</p>
      ${/* Год — УСКОРИТЕЛЬ над полями месяцев, не замена им: план на два месяца (обычная
           правка после ДС) задаётся месяцами, как и раньше. Набор годов — planYearsList,
           тот же, что у селектора вкладки: два набора в одном экране разошлись бы при
           первой правке одного из них. «Произвольный период» показывается только когда
           он и есть текущее состояние, и выбрать его нельзя — пункт-пустышка в меню. */''}
      <div class="mform" style="grid-template-columns:1fr 1fr 1fr">
        <div class="field"><span class="flabel">Год</span><div class="control"><select id="planYearSel" onchange="CR.setPlanFormYear(this.value)">
          ${cur==null?'<option value="" disabled selected>Произвольный период</option>':''}
          ${years.map(y=>`<option value="${y}"${y===cur?' selected':''}>${y}</option>`).join('')}
        </select><span class="caret">▾</span></div></div>
        <div class="field"><span class="flabel">С месяца</span><div class="control"><input type="month" id="planFrom" value="${esc(from)}" onchange="CR.reloadPlanForm()"></div></div>
        <div class="field"><span class="flabel">По месяц</span><div class="control"><input type="month" id="planTo" value="${esc(to)}" onchange="CR.reloadPlanForm()"></div></div>
      </div>
      <div id="planFormRows">${cgrid([{h:'Месяц'},{h:'Прогноз',r:1},{h:'План',r:1},{h:'Состояние'}], rows, {empty:'Период пуст — «по месяц» раньше «с месяца»'})}</div>
      <div class="field col-span"><span class="flabel">Примечание к правке</span><div class="control"><input id="planNote" placeholder="например: уточнено после ДС-2"></div></div>`;
  };
  /* Селектор года правит ПОЛЯ, а не отдельное состояние: дальше форма пересобирается тем
     же путём, что и при ручной правке месяца, и разойтись селектору с полями негде. */
  CR.setPlanFormYear=function(y){ const c=currentCredit(); if(!c||y==='') return;
    const r=planYearRange(c, +y);
    const f=document.getElementById('planFrom'), t=document.getElementById('planTo');
    if(!f||!t) return;
    f.value=r.from; t.value=r.to; CR.reloadPlanForm(); };
  CR.reloadPlanForm=function(){ const c=currentCredit(); if(!c) return;
    const from=document.getElementById('planFrom').value, to=document.getElementById('planTo').value;
    const host=document.getElementById('modalHost'); if(!host) return;
    const body=host.querySelector('.modal-b'); if(!body) return;      // тело модалки — .modal-b (см. CR.openModal)
    body.innerHTML=`<div id="modalErr"></div>`+CR.planFormHtml(c, derive(c, cardAsOf), from, to);
  };
  /* СНЯТИЕ ПЛАНА — отдельное действие, а не «поставить ноль» (И-14): строка остаётся,
     прежнее значение уходит в history, месяц выпадает из расчёта. Раньше и отказ гейта,
     и подпись модалки отсылали к снятию, а сделать его руками было нельзя вовсе. */
  CR.openDropPlanModal=function(mk){ const c=modalGuard('setPlan'); if(!c) return;
    const prow=planRowOf(c,mk); if(!prow||prow.amount==null) return;
    CR.openModal('Снять план',
      `<p class="section-note">Снятие — не удаление: строка месяца останется, прежнее значение уйдёт в журнал правок,
         а месяц перестанет входить в расчёт исполнения (квартал и год пересчитаются без него).</p>
       <div class="mform">
         <div class="field"><span class="flabel">Месяц</span><div class="control"><input value="${jsAttr(monthLabel(mk))}" disabled></div></div>
         <div class="field"><span class="flabel">Текущий план</span><div class="control"><input value="${jsAttr(money(prow.amount))}" disabled></div></div>
         <div class="field col-span"><span class="flabel">Причина снятия</span><div class="control"><input id="dropPlanNote" placeholder="например: заёмщик в реструктуризации"></div></div>
       </div>`,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitDropPlan('${jsAttr(mk)}')">Снять план</button>`);
  };
  CR.submitDropPlan=function(mk){ const c=modalGuard('setPlan'); if(!c) return;
    const note=(document.getElementById('dropPlanNote')||{}).value||'';
    const r=CR.setPlan(c,{rows:[{month:mk, amount:null}], note}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('План на '+monthLabel(mk)+' снят','ok'); rerenderDetail(); };
  CR.submitPlan=function(){ const c=modalGuard('setPlan'); if(!c) return;
    /* строки ищем в теле модалки, а не по всему документу: класс .plan-amt живёт только
       здесь, но полагаться на это — та самая хрупкость, из-за которой нужна дедупликация */
    const host=document.getElementById('modalHost');
    const scope=(host&&host.querySelector('.modal-b'))||document;
    const rows=[...scope.querySelectorAll('.plan-amt')].map(inp=>{
      const mk=inp.getAttribute('data-m');
      const on=scope.querySelector('.plan-on[data-m="'+mk+'"]');
      if(!on||!on.checked) return null;
      const seed=inp.getAttribute('data-seed');
      return { month:mk, amount:+inp.value||0, seededFrom: seed===''?null:+seed };
    }).filter(Boolean);
    const note=(document.getElementById('planNote')||{}).value||'';
    const r=CR.setPlan(c,{rows,note}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('План сохранён: месяцев '+rows.length,'ok'); rerenderDetail(); };

  /* экспорт DOM-обвязки на CR (onclick-строки разметки живут в глобальной области) */
  CR._sel = null;
  CR.renderList = renderList; CR.renderRows = renderRows; CR.renderRole = renderRole;
  CR.onRegionChange = onRegionChange; CR.resetFilters = resetFilters; CR.sortList = sortList;
  CR.toggleFilters = toggleFilters; CR.clearFilter = clearFilter;
  CR.gotoPage = gotoPage; CR.setPageSize = setPageSize;
  CR.selectRow = selectRow; CR.openDetail = openDetail; CR.backToList = backToList;
  CR.resetDemo = resetDemo; CR.openCreatePicker = openCreatePicker; CR.pickApplication = pickApplication;
  /* Демонабор: от него осталась только шпаргалка (КВ-52). setDemoScope/demoCredits/
     DEMO_CORE сняты — реестр ходит по всему сиду, и скриптам-шотам больше не нужно
     расширять набор перед поиском («Кара-Балта» = K-C11 виден сразу). */
  CR.openDemoSheet = openDemoSheet; CR.openDemoCredit = openDemoCredit;

  /* гамбургер сворачивает сайдбар — освобождает ширину под таблицы (реестр/расчёты). */
  window.toggleNav = function(){ document.querySelector('.app').classList.toggle('nav-collapsed'); };

  /* split-меню (печатные формы) закрывается кликом мимо — карточка перерисовывается
     целиком, поэтому слушатель вешается один раз на документ, а не на кнопку. */
  document.addEventListener('click', e => {
    document.querySelectorAll('.split.open').forEach(s => { if (!s.contains(e.target)) s.classList.remove('open'); });
  });

  renderNav();
  renderList();          // реестр §5.1 (Р-19); карточка (11 вкладок) — Task 7
  openFromHash();        // восстановить экран (кредит+вкладка) после F5 — по location.hash
  window.addEventListener('hashchange', openFromHash);
}

</script>
</body>
</html>
