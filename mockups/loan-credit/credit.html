  /* смена области — пересобрать список районов (каскад), сбросив несовместимый выбор */
  function onRegionChange(){
    const reg = document.getElementById('fRegion').value;
    const dSel = document.getElementById('fDistrict');
    const prev = dSel.value;
    dSel.innerHTML = optList(districtsOf(reg));
    dSel.value = [...dSel.options].some(o=>o.value===prev) ? prev : '';
    renderRows();
  }
  function resetFilters(){
    ['fQ','fNum','fRegion','fDistrict','fProgram','fCurator','fCategory','fPayGroup',
     'fLifecycle','fDisb','fProblem','fOdMin','fOdMax'].forEach(id=>{
      const e = document.getElementById(id); if (e) e.value = '';
    });
    const dSel = document.getElementById('fDistrict'); if (dSel) dSel.innerHTML = optList(districtsOf(''));
    paging.page = 1;
    renderRows();
  }

  /* считать значения фильтров из контролов в состояние filters */
  function readFilters(){
    const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
    filters.q = g('fQ').trim().toLowerCase(); filters.num = g('fNum').trim().toLowerCase();
    filters.region = g('fRegion'); filters.district = g('fDistrict');
    filters.program = g('fProgram'); filters.curator = g('fCurator'); filters.category = g('fCategory');
    filters.payGroup = g('fPayGroup');
    filters.lifecycle = g('fLifecycle'); filters.disbState = g('fDisb'); filters.problem = g('fProblem');
    filters.odMin = g('fOdMin'); filters.odMax = g('fOdMax');
  }
  /* сколько условий реально сужают выборку — для бейджа на свёрнутой шапке фильтра */
  function activeFilterCount(){
    return Object.keys(filters).filter(k => filters[k] !== '' && filters[k] != null).length;
  }
  /* AND-комбинация фильтров; пустой фильтр = нет ограничения */
  function passFilters(c, d){
    const f = filters;
    if (f.q){                                       // поиск идёт и по наименованию, и по ИНН
      const hay = (c.borrower.name + ' ' + c.borrower.inn).toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    if (f.num && !String(c.num).toLowerCase().includes(f.num)) return false;
    if (f.region   && c.borrower.region !== f.region)     return false;
    if (f.district && c.borrower.district !== f.district)  return false;
    if (f.program   && c.origin.programId !== f.program)   return false;
    if (f.curator   && curatorOf(c) !== f.curator)         return false;
    if (f.category  && d.riskCategory !== f.category)       return false;
    if (f.payGroup  && d.payGroup !== f.payGroup)           return false;
    if (f.lifecycle && c.lifecycle !== f.lifecycle)         return false;
    if (f.disbState && d.disbState !== f.disbState)         return false;
    if (f.odMin !== '' && d.overdueDays < +f.odMin)         return false;
    if (f.odMax !== '' && d.overdueDays > +f.odMax)         return false;
    if (f.problem === 'collection'    && !d.overlays.some(o=>o.kind==='collection'))    return false;
    if (f.problem === 'restructuring' && !d.overlays.some(o=>o.kind==='restructuring')) return false;
    return true;
  }
  /* одна строка реестра — все ячейки из credit + derive() */
  function rowHtml(c, d){
    const hasColl = d.overlays.some(o=>o.kind==='collection');
    const hasOd   = d.overlays.some(o=>o.kind==='overdue');
    const tint = hasColl ? ' ov-collection' : hasOd ? ' ov-overdue' : '';   // взыскание перекрывает просрочку
    const sel  = (c.id===selectedId) ? ' sel' : '';
    const term = (c.lifecycle==='Закрыт') ? ' terminal' : '';
    const catCls = d.riskCategory==='высокий' ? 'high' : d.riskCategory==='средний' ? 'mid' : 'low';
    /* Т·N / Р·N — сколько траншей и реструктуризаций «спрятано» в карточке.
       Строк реестра они не порождают: реестр — про кредит, не про его части.
       Т·N ставится только от двух траншей: один транш есть почти у всех, бейдж на
       каждой строке — шум, а не информация. */
    const nT = (c.tranches || []).length;
    const nR = (c.mirror && c.mirror.restructuring && c.mirror.restructuring.count) || 0;
    const marks = (nT > 1 ? `<span class="mk" title="траншей: ${nT}">Т·${nT}</span>` : '')
                + (nR ? `<span class="mk mk-r" title="реструктуризаций: ${nR}">Р·${nR}</span>` : '');
    /* просрочка: дни + просроченная сумма, приведённая к KGS (как и остаток) */
    const odCell = d.overdueDays > 0
      ? `<td class="overdue">${d.overdueDays} дн.<br><span class="sub">${money0(d.overdueAmountKgs)}</span></td>`
      : `<td><span class="sub">0 дн.</span></td>`;
    const amtSub = c.currency !== 'KGS'
      ? `<br><span class="sub">≈ ${money0(toKgs(c.contractAmount, c.currency))} KGS</span>` : '';
    return `<tr data-id="${esc(c.id)}" class="${(tint+sel+term).trim()}" onclick="CR.selectRow('${esc(c.id)}')" ondblclick="CR.openDetail('${esc(c.id)}')">
      <td style="white-space:nowrap">${esc(c.num)}${marks}</td>
      <td>${esc(c.date)}</td>
      <td>${esc(c.borrower.name)}<br><span class="sub">ИНН ${esc(c.borrower.inn)} · ${esc(c.borrower.district)}</span></td>
      <td>${esc(c.origin.programId)}</td>
      <td style="text-align:right">${money(c.contractAmount)}${amtSub}</td>
      <td>${esc(c.currency)}</td>
      <td style="text-align:right">${money(d.debtBalanceKgs)}</td>
      ${odCell}
      <td><span class="pill ${catCls}">${esc(d.riskCategory)}</span></td>
      <td title="${esc(PAY_GROUPS[d.payGroup] || '')}">${esc(d.payGroup)}</td>
      <td>${esc(c.lifecycle)}</td>
      <td>${esc(curatorOf(c))}</td>
    </tr>`;
  }
  /* сортировка реестра по клику на шапку (как в live vaadin-grid).
     Аксессор на пару [c, d]; для даты ключ приводится к yyyymmdd. */
  let listSort = { key:null, dir:1 };
  const LIST_SORTERS = {
    num:      ([c])=>c.num,
    date:     ([c])=>String(c.date||'').split('.').reverse().join(''),
    borrower: ([c])=>c.borrower.name,
    program:  ([c])=>c.origin.programId,
    amount:   ([c])=>c.contractAmount,
    currency: ([c])=>c.currency,
    balance:  ([,d])=>d.debtBalanceKgs,
    overdue:  ([,d])=>d.overdueDays,
    category: ([,d])=>({'низкий':0,'средний':1,'высокий':2}[d.riskCategory] ?? -1),
    group:    ([,d])=>d.payGroup,
    lifecycle:([c])=>c.lifecycle,
    curator:  ([c])=>curatorOf(c),
  };
  function sortList(key){
    if (!LIST_SORTERS[key]) return;
    if (listSort.key === key) listSort.dir = -listSort.dir;
    else { listSort.key = key; listSort.dir = 1; }
    paging.page = 1;
    renderRows();
  }
  /* отразить состояние сортировки на стрелках шапки */
  function syncSortHeader(){
    document.querySelectorAll('#view-list table.grid thead th').forEach(th=>{
      const k = th.getAttribute('data-k');
      const on = k === listSort.key;
      th.classList.toggle('sorted', on);
      const up = th.querySelector('.arrows .up'), dn = th.querySelector('.arrows .dn');
      if (up && dn){
        up.classList.toggle('on', on && listSort.dir === 1);
        dn.classList.toggle('on', on && listSort.dir === -1);
      }
    });
  }

  /* перерисовать только строки (фильтры/выбор меняются часто, оболочка — нет) */
  function renderRows(){
    readFilters();
    const body = document.getElementById('regBody'); if (!body) return;
    const hits = [];
    for (const c of CR.db.credits){
      const d = derive(c);
      if (!passFilters(c, d)) continue;
      hits.push([c, d]);
    }
    /* сортировка — до пагинации */
    if (listSort.key){
      const get = LIST_SORTERS[listSort.key];
      hits.sort((A, B) => {
        const x = get(A), y = get(B);
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * listSort.dir;
        return String(x ?? '').localeCompare(String(y ?? ''), 'ru', { numeric:true }) * listSort.dir;
      });
    }
    syncSortHeader();
    /* пагинация — после фильтрации; страница зажимается, если выборка усохла */
    const pages = Math.max(1, Math.ceil(hits.length / paging.size));
    if (paging.page > pages) paging.page = pages;
    const from = (paging.page - 1) * paging.size;
    const page = hits.slice(from, from + paging.size);

    body.innerHTML = page.length ? page.map(([c,d])=>rowHtml(c,d)).join('')
      : `<tr><td colspan="12" style="text-align:center;color:var(--text-placeholder);padding:20px">Ничего не найдено по фильтрам</td></tr>`;
    const cnt = document.getElementById('regCount');
    if (cnt) cnt.textContent = hits.length + ' из ' + CR.db.credits.length;
    const badge = document.getElementById('fBadge');
    if (badge){ const n = activeFilterCount(); badge.textContent = n ? 'условий: ' + n : ''; badge.hidden = !n; }
    renderPager(hits.length, pages, from, page.length);
  }
  /* пейджер: «показано X–Y из Z», стрелки и размер страницы */
  function renderPager(total, pages, from, shown){
    const el = document.getElementById('regPager'); if (!el) return;
    const p = paging.page;
    const btn = (label, to, dis) => `<span class="pg${dis?' dis':''}"${dis?'':` onclick="CR.gotoPage(${to})"`}>${label}</span>`;
    const nums = [];
    for (let i = 1; i <= pages; i++)
      nums.push(i === p ? `<span class="pg active">${i}</span>` : btn(i, i, false));
    el.innerHTML = `
      <span class="pinfo">${total ? `Показано ${from+1}–${from+shown} из ${total}` : 'Нет записей'}</span>
      <span class="pages">
        ${btn('«',1,p===1)}${btn('‹',p-1,p===1)}${nums.join('')}${btn('›',p+1,p===pages)}${btn('»',pages,p===pages)}
      </span>
      <span class="psize">На странице:
        <select onchange="CR.setPageSize(this.value)">
          ${[10,20,50,100].map(n=>`<option value="${n}"${n===paging.size?' selected':''}>${n}</option>`).join('')}
        </select>
      </span>`;
  }
  function gotoPage(n){ paging.page = Math.max(1, n); renderRows(); }
  function setPageSize(n){ paging.size = +n; paging.page = 1; renderRows(); }

  /* одиночный клик — выбор строки (включает Просмотр/Изменить) */
  function selectRow(id){
    selectedId = id; CR._sel = id;
    const body = document.getElementById('regBody');
    if (body) [...body.children].forEach(tr => tr.classList && tr.classList.toggle('sel', tr.dataset.id===id));
    renderRole();
  }
  /* двойной клик / Просмотр / Изменить — карточка кредита (§5.2 шапка + §5.3 8 вкладок, Task 7) */
  function openDetail(id){
    const c = CR.db.credits.find(x=>x.id===id); if (!c) return;
    selectedId = id; CR._sel = id; detailId = id;
    detailTab = 'Договор';
    detailTrancheNo = (c.tranches[0] && c.tranches[0].no) || 1;
    calcConsolidated = false;
    document.getElementById('view-list').style.display = 'none';
    const dv = document.getElementById('view-detail');
    dv.style.display = 'flex';
    dv.innerHTML = `<div id="cr-card-body"></div>`;
    renderDetail(c);
    const crumb = document.getElementById('crumb'); if (crumb) crumb.textContent = '/ Договор № ' + c.num;
  }
  function backToList(){
    const dv = document.getElementById('view-detail'); if (dv){ dv.style.display='none'; dv.innerHTML=''; }
    const lv = document.getElementById('view-list'); if (lv) lv.style.display='flex';
    const crumb = document.getElementById('crumb'); if (crumb) crumb.textContent = '';
  }
  /* сброс демо-данных: свежий seedDb() + полная перерисовка (§демо-ограничения) */
  function resetDemo(){
    CR.db = seedDb(); selectedId = null; CR._sel = null;
    backToList(); renderList();
    toast('Демо-данные сброшены', 'ok');
  }
  /* гейтинг действий по роли: Наблюдатель — read-only (createCredit/editConditions off) */
  function renderRole(){
    const canCreate = canRole(currentRole, 'createCredit');
    const canEdit   = canRole(currentRole, 'editConditions');
    const bC = document.getElementById('btnCreate');
    const bV = document.getElementById('btnView');
    const bE = document.getElementById('btnEdit');
    if (bC){ bC.disabled = !canCreate; bC.title = canCreate ? '' : 'Роль «'+currentRole+'» не имеет права создавать кредит'; }
    if (bV){ bV.disabled = !selectedId; bV.title = selectedId ? '' : 'Выберите кредит в реестре'; }
    if (bE){ const ok = !!selectedId && canEdit;
      bE.disabled = !ok;
      bE.title = !selectedId ? 'Выберите кредит в реестре'
        : !canEdit ? 'Роль «'+currentRole+'» не имеет права изменять кредит' : ''; }
  }

  /* «Создать кредит» — picker одобренных заявок без кредита (Г-2) */
  function openCreatePicker(){
    if (!canRole(currentRole, 'createCredit')){ toast('Роль «'+currentRole+'» не может создавать кредит', 'warn'); return; }
    const apps = CR.db.applications.filter(a => a.approved===true && !a.creditId);   // Г-2: только одобренные без кредита
    const host = document.getElementById('modalHost'); if (!host) return;
    host.innerHTML = `<div class="modal narrow">
      <div class="modal-h"><span class="mt">Создать кредит из заявки</span>
        <button class="modal-x" onclick="CR.closeModal()" aria-label="Закрыть">✕</button></div>
      <div class="modal-b">
        <p class="section-note">Показаны только одобренные заявки без привязанного кредита (гейт Г-2). Отклонённые и уже связанные не выводятся.</p>
        ${apps.length ? `<div class="cpick">${apps.map(a=>`
          <div class="cpick-row" onclick="CR.pickApplication('${esc(a.id)}')">
            <div class="cpick-main"><span class="cpick-num">${esc(a.id)}</span>
              <span class="cpick-sub"> · ${esc(a.borrower.name)} · ИНН ${esc(a.borrower.inn)}</span></div>
            <div class="cpick-claim">${money(a.approvedAmount)}</div></div>`).join('')}</div>`
          : `<div class="cgrid-empty">Нет одобренных заявок без кредита</div>`}
      </div>
      <div class="modal-f"><button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button></div>
    </div>`;
    host.classList.add('open');
  }
  function pickApplication(id){
    const app = CR.db.applications.find(a => a.id===id);
    const g = gate(null, 'createCredit', { application: app });   // подтверждаем Г-2 перед созданием
    if (!g.ok){ toast(g.reasons.join('; '), 'err'); return; }
    CR.closeModal();
    toast('Заявка ' + id + ' выбрана — черновик кредита (форма создания — Task 7)', 'ok');
  }

  /* ============================================================
     КАРТОЧКА КРЕДИТА — §5.2 шапка + §5.3 8 вкладок (Task 7).
     Всё из derive()/gate()/canRole() в рантайме (Р-11 — кэш запрещён). Зеркала
     (Р-5…Р-10, Р-16) — read-only с замком и подписью источника. Любая мутация
     идёт через CR.* и завершается rerenderDetail() → derive() пересчитывается заново.
     ============================================================ */
  let detailId = null, detailTab = 'Договор', detailTrancheNo = 1;
  let calcConsolidated = false;
  const DTABS =['Договор','Условия','Транши и освоение','Расчёты','Платежи','Обеспечение','Проблемные','Досье'];

  function currentCredit(){ return CR.db.credits.find(x => x.id === detailId); }
  function jsAttr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function svgInfo(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'; }
  function lockHtml(){ return '<span class="lock"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>зеркало</span>'; }
  function catClsOf(cat){ return cat==='высокий'?'high':cat==='средний'?'mid':'low'; }
  function pctDisb(c,d){ return c.contractAmount>0 ? Math.round(d.disbursed/c.contractAmount*100) : 0; }
  function trancheState(t){ const s=disbursedSum(t), a=t.amount||0; return s===0?'Не освоен':s<a?'Частично освоен':'Полностью освоен'; }

  /* read-only поле (label + значение в grey-боксе); val вставляется как HTML (caller экранирует текст) */
  function fld(label,val,o){ o=o||{};
    const v=(val==null||val==='') ? '<span class="ph" style="color:var(--text-placeholder)">—</span>' : val;
    return `<div class="field${o.span?' col-span':''}"><span class="flabel">${esc(label)}${o.lock?' '+lockHtml():''}</span>`
      + `<div class="lookup"><span class="val">${v}</span></div>`
      + (o.src?`<div class="mirror-src">Источник: ${esc(o.src)}</div>`:'') + `</div>`;
  }
  /* грид-коллекция внутри вкладки */
  function cgrid(cols, rows, o){ o=o||{};
    return `<div class="cgrid-wrap"><table class="cgrid"><thead><tr>${cols.map(c=>`<th${c.r?' style="text-align:right"':''}>${esc(c.h)}</th>`).join('')}</tr></thead>`
      + `<tbody>${rows.length?rows.join(''):`<tr><td colspan="${cols.length}"><div class="cgrid-empty">${esc(o.empty||'Нет записей')}</div></td></tr>`}</tbody></table></div>`;
  }
  /* Терминал (Р-20): «Закрыт»/списан — карточка только для чтения под ЛЮБОЙ ролью (К-6).
     UI-слой поверх gate(): логику gate() не трогаем (её проверяет smoke), но кнопки
     мутаций на закрытом кредите гасим с пояснением (§0.3 — не молчаливый отказ). */
  function isTerminal(c){ return !!(c && (c.lifecycle==='Закрыт' || c.closure)); }
  function disabledBtn(label, reason, cls){ cls=cls||'btn btn-secondary btn-sm';
    return `<button class="${cls}" style="opacity:.45;cursor:not-allowed" title="${jsAttr(reason)}" onclick="CR.toast('${jsAttr(reason)}','warn')">${esc(label)}</button>`;
  }
  function terminalReason(c){ return 'Кредит в терминальном состоянии («'+esc((c.closure&&c.closure.reason)||c.lifecycle)+'») — действия недоступны (Р-20)'; }

  /* Кнопка действия с реальным гейтом (§6.3): !gate.ok||!role → визуально disabled + tooltip + toast-on-click. */
  function actBtn(credit, action, ctx, label, onclick, cls){ cls=cls||'btn btn-secondary btn-sm';
    if(isTerminal(credit)) return disabledBtn(label, terminalReason(credit), cls);
    const r=canRole(currentRole,action);
    const g=credit?gate(credit,action,ctx||{}):{ok:true,reasons:[]};
    const reasons=[]; if(!r) reasons.push('Роль «'+currentRole+'» не имеет права на это действие'); if(!g.ok) g.reasons.forEach(x=>reasons.push(x));
    if(r&&g.ok) return `<button class="${cls}" onclick="${onclick}">${esc(label)}</button>`;
    return `<button class="${cls}" style="opacity:.45;cursor:not-allowed" title="${jsAttr(reasons.join('; '))}" onclick="CR.toast('${jsAttr(reasons.join(' · '))}','warn')">${esc(label)}</button>`;
  }
  /* Кнопка, чей реальный гейт зависит от полей формы (Task 8): гейтим по роли, содержимое — форма/стаб. */
  function roleBtn(action,label,onclick,cls){ cls=cls||'btn btn-secondary btn-sm';
    const _c=currentCredit();
    if(isTerminal(_c)) return disabledBtn(label, terminalReason(_c), cls);
    if(canRole(currentRole,action)) return `<button class="${cls}" onclick="${onclick}">${esc(label)}</button>`;
    const msg='Роль «'+currentRole+'» не имеет права на это действие';
    return `<button class="${cls}" style="opacity:.45;cursor:not-allowed" title="${jsAttr(msg)}" onclick="CR.toast('${jsAttr(msg)}','warn')">${esc(label)}</button>`;
  }

  /* ---- §5.2 ШАПКА (одна несворачиваемая сводка) ----
     Формат плитки перенесён из loan-credit.html: «значение + ОСНОВАНИЕ» (третья строка).
     Голая цифра в шапке порождает спор «почему столько / почему высокий», и ответ
     приходится искать по вкладкам; основание отвечает на месте.
     ID записи в шапке не показываем — реквизит заёмщика (ИНН) информативнее. */

  /* Метка производной величины. Не lockHtml(): тот про ЗЕРКАЛО (данные чужого модуля),
     а здесь значение считает сам модуль кредитов на лету (Р-11). */
  function derivedHtml(){ return '<span class="lock" title="вычисляется на лету, не хранится">выводится</span>'; }
  function asOfHtml(){ return `<span class="lock" title="расчёт по леджеру на дату">на ${TODAY}</span>`; }

  /* Плитка шапки: заголовок · значение · основание. label/value/basis — уже HTML. */
  function dimTile(label, value, basis){
    return `<div class="dim"><div class="dl">${label}</div><div class="dv">${value}</div>`
      + (basis ? `<div class="src">${basis}</div>` : '') + `</div>`;
  }

  /* Плитка «Остаток долга»: разбивка по трём слоям + приведение к сому + дата расчёта.
     Дата подписана «расчёт по леджеру», а НЕ «снапшот батч-калькулятора», как в легаси:
     в новой модели остаток выводится из леджера в момент рендера (Р-11) — легаси-дефект
     E2E-09 (остаток отвязан от платежей) здесь и закрывается, подпись не должна врать. */
  function tileDebt(c,d){
    const cur = c.currency, fx = FX[cur] || 1;
    const val = `${money(d.debtBalance)} <span style="font-size:13px;color:var(--text-muted);font-weight:400">${esc(cur)}</span>`;
    if (d.disbursed === 0)
      return dimTile(`Остаток долга ${asOfHtml()}`, val,
        `освоение не начато — задолженности нет<br>сумма договора <b>${money(c.contractAmount)} ${esc(cur)}</b>`);
    const parts = [];
    if (cur !== 'KGS') parts.push(`≈ <b>${money0(d.debtBalanceKgs)} KGS</b> по курсу НБКР <b>${money(fx)}</b> на ${TODAY}`);
    parts.push(`осн. <b>${money(d.debt.principal.bal)}</b> · проц. <b>${money(d.debt.interest.bal)}</b> · штрафы <b>${money(d.debt.penalty.bal)}</b>`);
    if (d.overdueAmount > 0)
      parts.push(`в т.ч. просрочено <b style="color:var(--asubk-red)">${money(d.overdueAmount)}</b> · ${d.overdueDays} дн.`);
    return dimTile(`Остаток долга ${asOfHtml()}`, val, parts.join('<br>'));
  }

  /* Плитка «Оверлеи» (Р-3): не третья ось категории, а активные слои с их источником и
     дедлайном — из плитки видно, что именно сейчас искажает картину и до какого числа. */
  function tileOverlays(c,d){
    const list = d.overlays.filter(o => o.kind !== 'overdue');   // просрочка ушла в пилюлю статуса
    if (!list.length)
      return dimTile('Оверлеи', '<span style="font-size:14px;color:var(--text-muted);font-weight:400">Нет активных слоёв</span>',
        'категория считается напрямую по дням просрочки и группе заёмщика');
    /* Значением плитки идёт САМЫЙ ТЯЖЁЛЫЙ слой словами, а не те же пилюли, что в строке
       имени: пилюли уже названы выше, плитка нужна ради источника и дедлайна. */
    const rank = { danger:2, warn:1, info:0 };
    const top  = list.slice().sort((a,b) => (rank[b.tone]||0) - (rank[a.tone]||0))[0];
    const r = c.mirror && c.mirror.restructuring && c.mirror.restructuring.active;
    const lines = [];
    if (d.riskBasis.suppressed && r)
      lines.push(`подавление 181-го дня — источник <b>${esc(r.id)}</b> (${esc(r.stage)})`
        + (r.deadline ? ` · дедлайн <b>${esc(r.deadline)}</b>` : '')
        + (r.pause && r.pause.days ? ` · пауза ${r.pause.days} дн.` : '')
        + `<br>по отказу или истечении — пересчёт по фактическим дням просрочки`);
    else if (r)
      lines.push(`реструктуризация <b>${esc(r.id)}</b> — ${esc(r.stage)}`
        + (r.deadline ? ` · дедлайн <b>${esc(r.deadline)}</b>` : ''));
    for (const col of (c.mirror && c.mirror.collection || []))
      lines.push(`взыскание <b>${esc(col.processId)}</b> · ${esc(col.contour)} · ${esc(col.phase)}`);
    if ((c.accrualHold || []).some(holdIsActive))
      lines.push('начисление приостановлено — проценты за интервал не начисляются');
    const val = `<span style="font-size:15px">${esc(top.text)}</span>`
      + (list.length > 1 ? ` <span style="color:var(--text-muted);font-weight:400;font-size:13px">· ещё ${list.length-1}</span>` : '');
    return `<div class="dim wide"><div class="dl">Оверлеи ${derivedHtml()}</div>`
      + `<div class="dv">${val}</div><div class="src">${lines.join('<br>')}</div></div>`;
  }

  /* Плитка «Ближайший платёж» (шаг 11): самый частый вопрос куратора — когда и сколько.
     Раньше ответ лежал в «Расчёты → График — позиции», три клика вглубь. Значение —
     сумма позиции, основание — дата, статус и транш. Просроченная позиция подсвечена:
     она первая по дате и требует действия раньше предстоящей. */
  function tileNextPay(c,d){
    const np = d.nextPayment;
    if (!np)
      return dimTile(`Ближайший платёж ${derivedHtml()}`,
        '<span style="font-size:14px;color:var(--text-muted);font-weight:400">Нет позиций</span>',
        (d.disbursed === 0 ? 'график строится от фактической даты освоения (Г-8)'
                           : 'все позиции графика погашены')
        + (d.fullRepayDate ? `<br>полное погашение до <b>${esc(d.fullRepayDate)}</b> (Р-13)` : ''));
    const late = np.status === 'Просрочена';
    const tone = { 'Просрочена':'high', 'Наступила':'mid', 'Предстоит':'neutral' }[np.status] || 'neutral';
    const val = `${money(np.total)}`
      + (late ? ' <span style="font-size:13px;font-weight:400;color:var(--asubk-red)">просрочен</span>' : '');
    return dimTile(`Ближайший платёж ${derivedHtml()}`, val,
      `срок <b>${esc(np.date)}</b> · транш <b>№${esc(np.tranche)}</b> · <span class="pill ${tone}">${esc(np.status)}</span>`
      + (d.fullRepayDate ? `<br>полное погашение до <b>${esc(d.fullRepayDate)}</b> (Р-13)` : '')
      + `<br>позиция графика — вкладка «Расчёты»`);
  }

  /* Печатные формы (перенос из loan-credit): в новом макете печати не было вовсе,
     а это единственное место, откуда куратор забирает документ по конкретному кредиту. */
  const PRINT_FORMS = [
    ['Акт сверки', 'на дату расчёта'], ['Претензия', 'на дату расчёта'],
    ['Реестр погашений', 'на дату расчёта'], ['Уведомление', 'должнику'],
    ['График погашения', 'PDF / Excel'], ['Акт обследования залога', 'форма'],
    ['Извещение об утрате залога', 'форма №5'],
  ];
  function printMenuHtml(){
    return `<div class="split">
      <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">Печатные формы ▾</button>
      <div class="split-menu" style="left:auto;right:0;min-width:265px">
        ${PRINT_FORMS.map(([n,s]) => `<button onclick="CR.toast('${jsAttr(n)} — формирование вне объёма макета')">${esc(n)}<span style="float:right;color:var(--text-placeholder);font-size:11px;margin-left:12px">${esc(s)}</span></button>`).join('')}
      </div>
    </div>`;
  }

  function headerHtml(c,d){
    const light  = d.coverage.ok ? 'var(--asubk-green)' : 'var(--asubk-red)';
    const catSrc = (c.mirror&&c.mirror.borrowerRisk&&c.mirror.borrowerRisk.categorySource) || 'ночной расчёт';
    const rb     = d.riskBasis;

    /* Дни просрочки — в пилюле ЖЦ (перенос из loan-credit): статус и его глубина —
       одна мысль. Одноимённый оверлей из строки имени при этом убран, чтобы не дублировать. */
    const lcPill = d.overdueDays > 0
      ? `<span class="pill high">${esc(c.lifecycle)} · просрочка ${d.overdueDays} дн.</span>`
      : `<span class="pill info">${esc(c.lifecycle)}</span>`;
    /* Шаг 11: пилюли оверлеев из строки имени УБРАНЫ — те же слои показывала плитка
       «Оверлеи», причём с источником и дедлайном. Одно представление на сущность. */

    const catBasis = `дни просрочки ${rb.eff}${rb.suppressed ? ' <b>(подавление 181-го дня)</b>' : ''} → <b>${esc(rb.byDays)}</b>`
      + `<br>группа заёмщика ${rb.group ? '<b>'+esc(rb.group)+'</b>' : '—'} → <b>${esc(rb.byGroup)}</b> · worst-of → <b>${esc(d.riskCategory)}</b>`
      + `<br>${esc(catSrc)} (Р-10)`;

    return `<div class="phead">
      <div class="phead-top">
        <div>
          <div class="phead-name">
            <span class="nm">Кредит № ${esc(c.num)}</span>
            ${lcPill}
            <span class="pill neutral">${esc(d.disbState)}</span>
          </div>
          <div class="phead-sub">от <b>${esc(c.date)}</b>
            · Заёмщик <a onclick="CR.toast('Переход в карточку заёмщика — вне объёма макета')">${esc(c.borrower.name)}</a>
            · Куратор ${lockHtml()} <b>${esc(curatorOf(c))}</b></div>
        </div>
        <div class="phead-acts">
          ${roleBtn('saveContractAmount','Изменить сумму договора','CR.openContractAmountModal()')}
          ${printMenuHtml()}
        </div>
      </div>
      <div class="phead-dims">
        ${dimTile('Сумма договора', money(c.contractAmount) + ` <span style="font-size:13px;color:var(--text-muted);font-weight:400">${esc(c.currency)}</span>`,
          `освоено <b>${money(d.disbursed)}</b> (${pctDisb(c,d)}%) · не освоено <b>${money(d.undisbursed)}</b>`
          + `<br>одобрено по заявке <b>${money(c.approvedAmount)}</b> (Г-1: договор ≤ одобрено)`
          + (c.currency !== 'KGS' ? `<br>≈ <b>${money0(toKgs(c.contractAmount, c.currency))} KGS</b>` : ''))}
        ${tileDebt(c,d)}
        ${tileNextPay(c,d)}
        ${dimTile(`Категория риска ${lockHtml()}`, `<span class="cat-${catClsOf(d.riskCategory)}">${esc(d.riskCategory)}</span>`, catBasis)}
        ${dimTile(`Покрытие ${lockHtml()}`,
          `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span>${Math.round(d.coverage.index*100)}% <span style="color:var(--text-muted);font-weight:400">/ порог ${d.coverage.req}%</span>`,
          esc(d.coverage.source))}
        ${tileOverlays(c,d)}
      </div>
    </div>`;
  }
  function tabbarHtml(){
    return `<div class="detail-tabbar-wrap"><div class="detail-tabbar">${DTABS.map(t=>`<button class="dtab${t===detailTab?' active':''}" onclick="CR.openTab('${jsAttr(t)}')">${esc(t)}</button>`).join('')}</div></div>`;
  }

  /* ---- ВКЛАДКА 1: Договор ---- */
  function tabDogovor(c,d){
    const o=c.origin;
    const link=(id,msg)=>id?`<a class="rowlink" onclick="CR.toast('${jsAttr(msg)}')">${esc(id)}</a>`:null;
    const subjRows=(c.subject||[]).map(s=>`<tr><td>${esc(s.kind)}</td><td>${esc(s.name)}</td><td style="text-align:right">${esc(s.qty)}</td><td style="text-align:right">${money(s.cost)}</td></tr>`);
    const km=c.kmDecision;
    /* Шаг 11: бейдж статуса регистрации рядом с № — производный (regStatusOf), поля в
       модели нет; раньше статус читался только косвенно, по заполненности реквизитов. */
    const rst=d.regStatus;
    const regNum=`${c.reg.num?esc(c.reg.num):'—'} <span class="pill ${rst.tone}">${esc(rst.text)}</span>`;
    /* Шаг 13: вкладка перестроена на карточки в две колонки — каждая смысловая группа
       отделена рамкой, вместо сплошной ленты заголовков и полей. Порядок обхода:
       слева паспорт договора и классификация, справа происхождение и решение КМ;
       таблица предмета кредита — на всю ширину (4 колонки не помещаются в половину). */
    return `
      <div class="pcards">
        <div class="pcard">
          <div class="section-h">Реквизиты договора</div>
          <p class="section-note">Скан договора и комментарий регистрации — во вкладке «Досье» (шаг 11: файлы и текстовые пометки живут в одном месте).</p>
          <div class="f2">
            ${fld('№ договора', esc(c.num))}
            ${fld('Дата договора', esc(c.date))}
            ${fld('№ регистрации', regNum)}
            ${fld('Дата регистрации', c.reg.date?esc(c.reg.date):null)}
            ${fld('Валюта', esc(c.currency))}
          </div>
        </div>

        <div class="pcard">
          <div class="section-h">Классификация</div>
          <p class="section-note">Суммы и правка суммы договора — в шапке карточки (шаг 11); здесь не дублируются. Вид и линия возвращены сюда (шаг 12): это справочные атрибуты, их читают один раз при открытии карточки, а не мониторят.</p>
          <div class="f2">
            ${fld('Вид кредита', esc(c.kind))}
            ${fld('Кредитная линия', esc(c.line))}
            ${fld('Цель', esc(c.purpose))}
            ${fld('Источник финансирования', esc(c.fundingSource))}
          </div>
        </div>

        <div class="pcard">
          <div class="section-h">Происхождение (Р-18)</div>
          <p class="section-note">Обязательная неизменяемая цепочка: заявка → комиссия → программа → решение правительства. Все ссылки read-only.</p>
          <div class="f2">
            ${fld('Заявка', link(o.applicationId,'Переход в заявку — вне объёма макета'))}
            ${fld('Комиссия', link(o.commissionId,'Переход в комиссию — вне объёма макета'))}
            ${fld('Программа', link(o.programId,'Переход в программу — вне объёма макета'))}
            ${fld('Решение правительства', link(o.govDecisionId,'Переход в ПП — вне объёма макета'))}
          </div>
        </div>

        <div class="pcard">
          <div class="section-h">Освобождение от залога — решение КМ (Р-8)</div>
          ${km?`<div class="f2">${fld('Вид решения', esc(km.kind))}${fld('Номер', esc(km.num))}${fld('Дата', esc(km.date))}${fld('Скан', esc(km.scan))}</div>`
            :`<p class="section-note">Решение КМ не зафиксировано. Это owned-поле кредита (не зеркало): разблокирует освоение по Г-6 при провале покрытия.</p>`}
          <div class="gtoolbar">${roleBtn('setKmDecision','Указать решение КМ','CR.openKmModal()')}${roleBtn('waiver','Waiver залоговой комиссии','CR.openWaiverModal()')}</div>
        </div>

        <div class="pcard wide">
          <div class="section-h">Предмет кредита</div>
          ${cgrid([{h:'Вид'},{h:'Наименование'},{h:'Кол-во',r:1},{h:'Стоимость',r:1}], subjRows, {empty:'Предмет не задан'})}
        </div>
      </div>`;
  }

  /* ---- ВКЛАДКА 2: Условия ---- */
  function tabUsloviya(c,d){
    const b=c.baseConditions, dt=c.debtTransfer;
    const locked = !gate(c,'editConditions',{}).ok;                 // Г-9: не «Проект» → правки только доп. соглашением
    const g9='Изменение условий — только доп. соглашением (Г-9)';
    /* Шаг 14: пилюля у поля говорила «зеркало» — неверно, условия owned кредитом,
       а закрыты гейтом Г-9. Своя пилюля «доп. соглашение» с тем же title. */
    const lockG9='<span class="lock"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>доп. согл.</span>';
    const bf=(label,val)=>`<div class="field"><span class="flabel">${esc(label)}${locked?' '+lockG9:''}</span><div class="lookup"${locked?` title="${jsAttr(g9)}"`:''}><span class="val">${val}</span></div></div>`;
    const dev=(t,key)=>{ const bv=b[key], tv=t.conditions[key]; return String(bv)===String(tv)?esc(tv):`<span class="diff"><span class="diff-old">${esc(bv)}</span> → <span class="diff-new">${esc(tv)}</span></span>`; };
    const trRows=c.tranches.map(t=>`<tr><td>№${t.no}</td><td>${dev(t,'rate')}</td><td>${dev(t,'term')}</td><td>${dev(t,'method')}</td><td>${dev(t,'freq')}</td><td>${dev(t,'reserveRate')}</td></tr>`);
    const agRows=(c.agreements||[]).map(a=>{
      const keys=[...new Set([...Object.keys(a.before||{}),...Object.keys(a.after||{})])];
      const diff=keys.map(k=>`${esc(k)}: <span class="diff"><span class="diff-old">${esc((a.before||{})[k])}</span> → <span class="diff-new">${esc((a.after||{})[k])}</span></span>`).join(' · ');
      return `<tr class="${a.active?'diff-changed':''}"><td>${esc(a.num)}</td><td>${esc(a.date)}</td><td>${esc(a.source)}</td><td>${diff}</td><td>${a.active?'<span class="pill low">активна</span>':'<span class="pill neutral">архив</span>'}</td></tr>`;
    });
    /* Шаг 14: сплошная лента из 14 полей заменена карточками .pcards, как в «Договоре»
       (шаг 13). Поля сгруппированы по смыслу: стоимость денег · погашение · санкции ·
       режим начисления. «Плавающая» схлопнута в «Ставку» (одно значение вместо да/нет
       рядом с числом); «Метод дней» и «Очередь погашения» уехали в «Расчёты» — это
       параметры движка, их читают вместе с цифрами, которые они объясняют;
       «Макс. пеня» удалена — cap в расчёте пени не применяется, поле врало (шаг 4).
       Дата полного погашения убрана из info-plate Р-13: она уже в основании плитки
       «Ближайший платёж» в шапке (шаг 12), в плите остался только агрегат срока. */
    const rateVal = esc(b.rate) + (b.floating
      ? ` <span style="color:var(--text-muted);font-weight:400">· плавающая: ${esc(b.floatType||'—')} + маржа ${esc(b.margin)}%</span>`
      : '');
    const holdRows=(c.accrualHold||[]).map(h=>`<tr><td>${esc(h.from)}</td><td>${esc(h.to||'…')}</td><td>${esc(h.reason)}</td><td>${esc(h.doc)}</td></tr>`);
    return `
      ${locked?`<div class="info-plate" style="margin-bottom:14px">${svgInfo()}<div>Условия зафиксированы: ЖЦ «${esc(c.lifecycle)}». Прямое редактирование недоступно (Г-9) — только доп. соглашением.</div></div>`:''}
      <div class="pcards">
        <div class="pcard">
          <div class="section-h">Ставки</div>
          <p class="section-note">Базовый комплект кредита (Р-2): транш наследует эти значения и может от них отклониться — дифф ниже.
            Потолок неустойки не задаётся: правила-cap в расчётном слое нет, ввод такого правила — отдельное решение (шаг 4).</p>
          <div class="f2">
            ${bf('Ставка, %', rateVal)}
            ${bf('Ставка резерва, %', esc(b.reserveRate))}
            ${bf('Пеня по ОД, %/дн', esc(b.penaltyMain))}
            ${bf('Пеня по %, %/дн', esc(b.penaltyInt))}
          </div>
        </div>

        <div class="pcard">
          <div class="section-h">Погашение</div>
          <p class="section-note">Метод дней и очередь погашения — в «Расчётах» (шаг 14): это параметры движка, их читают вместе с цифрами детального расчёта.</p>
          <div class="f2">
            ${bf('Срок-шаблон, мес.', esc(b.term))}
            ${bf('Периодичность', esc(b.freq))}
            ${bf('Метод погашения', esc(b.method))}
            ${bf('Льгота по ОД, мес.', esc(b.graceMain))}
            ${bf('Льгота по %, мес.', esc(b.graceInterest))}
            ${bf('Отсрочка начисления, мес.', esc(b.graceAccrual))}
          </div>
          <div class="info-plate" style="margin-top:12px">${svgInfo()}<div>Срок на кредите — производный агрегат (Р-13): максимум срока по действующим траншам = <b>${esc(d.termAgg)} мес.</b> Поле выше — только шаблон для наследования; единственный источник срока — условия транша.</div></div>
        </div>

        <div class="pcard">
          <div class="section-h">Режим начисления (Р-17)</div>
          <p class="section-note">Шаг 14: блок переехал сюда из «Расчётов» — приостановка меняет режим исполнения условий, а не отображение цифр. В «Расчётах» он лежал в самом низу самой длинной вкладки.</p>
          ${cgrid([{h:'С'},{h:'По'},{h:'Основание'},{h:'Документ'}], holdRows, {empty:'Активных приостановок нет'})}
          <div class="gtoolbar">${roleBtn('holdAccrual','Приостановить начисление','CR.openHoldModal()')}</div>
        </div>

        <div class="pcard wide">
          <div class="section-h">Условия траншей — отклонение от базы</div>
          ${cgrid([{h:'Транш'},{h:'Ставка'},{h:'Срок'},{h:'Метод'},{h:'Периодичность'},{h:'Резерв, %'}], trRows, {empty:'Траншей нет'})}
        </div>

        <div class="pcard wide">
          <div class="section-h">Доп. соглашения (Р-4)</div>
          <p class="section-note">Единственный способ изменить условия после регистрации (Г-9). Предыдущая активная версия архивируется, не удаляется.</p>
          ${cgrid([{h:'Номер'},{h:'Дата'},{h:'Источник'},{h:'Изменение'},{h:'Статус'}], agRows, {empty:'Соглашений нет'})}
          <div class="gtoolbar">${roleBtn('addAgreement','Оформить доп. соглашение','CR.openAgrModal()','btn btn-primary btn-sm')}</div>
        </div>

        <div class="pcard wide">

          ${dt?`<div class="f2">${fld('Новый заёмщик', esc(dt.newBorrower&&dt.newBorrower.name))}${fld('Соглашение', esc(dt.agreement&&dt.agreement.num))}${fld('Дата', esc(dt.date))}</div>`
            :`<p class="section-note" style="margin-bottom:0">Перевода долга не было. Смена заёмщика — owned-действие кредита, только зарегистрированным соглашением (Г-16).</p>`}
          <div class="gtoolbar">${roleBtn('transferDebt','Оформить перевод долга',"CR.stubAction('Перевод долга')")}</div>
        </div>
      </div>`;
  }

  /* ---- ВКЛАДКА 3: Транши и освоение ---- */
  function tabTranshi(c,d){

      return `<tr style="cursor:pointer${on?';background:var(--asubk-nav-active)':''}" onclick="CR.selectDetailTranche(${t.no})">

        <td style="text-align:right">${money(s)}</td><td style="text-align:right">${money(rest)}</td>
        ${fxCells}<td>${esc(trancheState(t))}</td></tr>`;

    const trCols=[{h:'Транш'},{h:'Субъект'},{h:'Сумма',r:1},{h:'План. дата'},{h:'Освоено',r:1},{h:'Остаток',r:1}]
      .concat(isFx?[{h:'Курс',r:1},{h:'≈KGS суммы',r:1}]:[]).concat([{h:'Состояние'}]);
    const tot=c.tranches.reduce((a,t)=>{const s=disbursedSum(t);a.amt+=t.amount||0;a.dis+=s;a.rest+=(t.amount||0)-s;return a;},{amt:0,dis:0,rest:0});
    const totRow=c.tranches.length?`<tr style="font-weight:var(--weight-semibold);background:var(--surface-panel)">

      <td style="text-align:right">${money(tot.dis)}</td><td style="text-align:right">${money(tot.rest)}</td>
      ${isFx?`<td></td><td style="text-align:right">${money0(toKgs(tot.amt,cur))}</td>`:''}<td></td></tr>`:'';
    const dbCols=[{h:'Дата'},{h:'Сумма',r:1}].concat(isFx?[{h:'≈KGS',r:1}]:[]).concat([{h:'Плат. поручение'},{h:'Назначение'},{h:'Документ'}]);
    const dbRows=((sel&&sel.disbursements)||[]).map(x=>`<tr><td>${esc(x.date)}</td><td style="text-align:right">${money(x.amount)}</td>${isFx?`<td style="text-align:right">${money0(toKgs(x.amount,cur))}</td>`:''}<td>${esc(x.order)}</td><td>${esc(x.purpose)}</td><td>${esc(x.doc)}</td></tr>`);
    return `

      <div class="phead-dims" style="grid-template-columns:repeat(4,1fr)">
        <div class="dim"><div class="dl">Одобрено</div><div class="dv">${money(c.approvedAmount)}</div></div>
        <div class="dim"><div class="dl">Сумма договора</div><div class="dv">${money(c.contractAmount)}</div></div>
        <div class="dim"><div class="dl">Распределено по траншам</div><div class="dv">${money(d.allocated)}</div></div>
        <div class="dim"><div class="dl">Доступно к распределению</div><div class="dv">${money(d.allocatable)}</div></div>
      </div>
      <div class="section-h" style="margin-top:22px">Транши (клик — выбор)</div>
      ${cgrid(trCols, trRows.concat(totRow?[totRow]:[]), {empty:'Траншей нет'})}
      <div class="gtoolbar" style="margin-top:12px">
        ${roleBtn('addTranche','Добавить транш','CR.openTrancheModal()')}

        ${roleBtn('addDisbursement','Закрыть неосвоенный остаток',"CR.stubAction('Закрытие неосвоенного остатка')")}
      </div>
      <div class="section-h" style="margin-top:22px">Освоение транша №${sel?sel.no:'—'}</div>
      ${cgrid(dbCols, dbRows, {empty:'Освоений нет'})}`;
  }

      <td style="text-align:right">${esc(l.days)}</td>

  /* ---- ВКЛАДКА 5: Платежи (зеркало модуля платежей, Р-5) ---- */
  function tabPlatezhi(c,d){
    const pays=(c.mirror.payments||[]);
    const ptot={amount:0,principal:0,interest:0,penalty:0};
    const payRows=pays.map(p=>{
      const ed=CR.paymentEditable(c,p);
      const L=p.layers||{}, pr=L.principal||0, it=L.interest||0, pe=L.penalty||0;
      ptot.amount+=p.amount||0; ptot.principal+=pr; ptot.interest+=it; ptot.penalty+=pe;
      return `<tr>
        <td>${esc(p.num)}</td><td>${esc(p.date)}</td><td>№${esc(p.tranche)}</td><td style="text-align:right">${money(p.amount)}</td>
        <td style="text-align:right">${money(pr)}</td><td style="text-align:right">${money(it)}</td><td style="text-align:right">${money(pe)}</td>
        <td>${esc(p.method||'денежными средствами')}</td>

  /* ---- ВКЛАДКА 6: Обеспечение (зеркало залогового модуля, Р-7) ---- */
  function tabObespechenie(c,d){
    const cov=d.coverage, light=cov.ok?'var(--asubk-green)':'var(--asubk-red)';
    const pledgeList=(c.mirror.pledges||[]);
    const pledgeRows=[];
    let sumAppr=0, sumPledge=0;
    for(const p of pledgeList) for(const it of (p.items||[])){
      sumAppr+=it.appraised||0; sumPledge+=it.pledgeValue||0;
      pledgeRows.push(`<tr>
        <td>${esc(p.contractNum)}</td><td>${esc(p.notary||'—')}</td><td>${esc(it.name)}</td><td>${esc(it.kind)}</td>
        <td style="text-align:right">${money(it.appraised)}</td><td style="text-align:right">${money(it.pledgeValue)}</td><td style="text-align:right">${Math.round((it.share==null?1:it.share)*100)}%</td>
        <td>${p.liquid?'<span class="pill low">ликвид</span>':'<span class="pill mid">неликвид</span>'}</td>
        <td>${p.ban?'<span class="pill info">запрет</span>':'—'}</td>
        <td>${(p.otherCredits&&p.otherCredits.length)?esc(p.otherCredits.join(', ')):'—'}</td></tr>`);
    }
    const bg=c.mirror.bankGuarantee, guars=(c.mirror.guarantees||[]);
    const insp=(c.mirror.inspections||[]);
    const inspRows=insp.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.obj)}</td><td>${esc(x.curator)}</td><td><span class="pill ${x.ok?'low':'high'}">${esc(x.res)}</span></td><td>${x.file?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td></tr>`);
    const svod = pledgeList.length ? `
      <div class="phead-dims" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        <div class="dim"><div class="dl">Действующих договоров</div><div class="dv">${pledgeList.length} ед.</div></div>
        <div class="dim"><div class="dl">Σ оценочная</div><div class="dv">${money(sumAppr)}</div></div>
        <div class="dim"><div class="dl">Σ залоговая</div><div class="dv">${money(sumPledge)}</div></div>
      </div>` : '';
    return `
      <div class="section-h">Обеспечение ${lockHtml()}</div>
      <p class="section-note">Зеркало залогового модуля. Залоговые договоры создаются только в модуле залога (Р-7) — здесь доступна привязка существующего.</p>
      ${svod}
      ${cgrid([{h:'Договор залога'},{h:'Нотариус'},{h:'Предмет'},{h:'Вид'},{h:'Оценочная',r:1},{h:'Залоговая',r:1},{h:'Доля'},{h:'Ликвидность'},{h:'Запрет отчуждения'},{h:'Также обеспечивает'}], pledgeRows, {empty:'Обеспечение не привязано'})}
      <div class="mirror-src">Источник: модуль залога (Р-7). Данные read-only.</div>
      <div class="section-h" style="margin-top:22px">Покрытие</div>
      <div class="phead-dims" style="grid-template-columns:repeat(4,1fr)">
        <div class="dim"><div class="dl">Индекс покрытия</div><div class="dv"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span>${Math.round(cov.index*100)}%</div></div>
        <div class="dim"><div class="dl">Порог</div><div class="dv">${cov.req}%</div></div>
        <div class="dim"><div class="dl">Доля ликвида</div><div class="dv">${Math.round(cov.liquidShare*100)}%</div></div>
        <div class="dim"><div class="dl">Статус</div><div class="dv" style="color:${light}">${cov.ok?'достаточно':'недостаточно'}</div></div>
      </div>
      <div class="mirror-src">База покрытия: ${esc(cov.source)}. Банковская гарантия входит в индекс, поручительство — нет.</div>
      ${bg?`<div class="section-h" style="margin-top:22px">Банковская гарантия (в индексе)</div><div class="f2">${fld('Банк',esc(bg.bank))}${fld('Сумма',money(bg.amount))}${fld('Действует до',esc(bg.till))}</div>`:''}
      ${guars.length?`<div class="info-plate">${svgInfo()}<div>Поручительство (${guars.map(g=>esc(g.party)).join(', ')}) — параллельный слой обеспечения, в индекс покрытия НЕ входит (открытый вопрос §10.2).</div></div>`:''}
      <div class="section-h" style="margin-top:22px">Обследования предметов залога ${lockHtml()}</div>
      ${cgrid([{h:'Дата'},{h:'Договор / предмет'},{h:'Куратор'},{h:'Результат'},{h:'Вложение'}], inspRows, {empty:'Обследований не проводилось'})}

      <div class="gtoolbar" style="margin-top:16px">
        ${roleBtn('linkPledge','Привязать существующий','CR.openPledgePicker()','btn btn-primary btn-sm')}
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор залога заводится в модуле залога (Р-7) — вне объёма макета')">+ Договор залога</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор поручительства заводится в модуле залога (Р-7) — вне объёма макета')">+ Договор поручительства</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля залога — вне объёма макета')">Открыть в модуле залога</button>
      </div>`;
  }

    const courtRows=(c.mirror.court||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.org)}</td><td><span class="pill ${x.ok?'low':'mid'}">${esc(x.res)}</span></td><td>${x.file?`<a class="lnk" onclick="CR.toast('Просмотр документа — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td></tr>`);

        <div class="row"><span class="ck">По группе заёмщика (${esc(grp||'—')}):</span> <b class="cat-${catClsOf(byGroup)}">${byGroup}</b></div>
        <div class="row"><span class="ck">Итоговая (худшая):</span> <b class="cat-${catClsOf(d.riskCategory)}">${d.riskCategory}</b></div>
      </div>
      ${d.overlays.some(o=>o.kind==='suppress181')?`<div class="info-plate">${svgInfo()}<div>Подавление 181-го дня активно: дни просрочки для категории ограничены 180 (активная реструктуризация / пауза начисления).</div></div>`:''}

      <div class="section-h" style="margin-top:22px">Группа платёжеспособности ${derivedHtml()}</div>
      <p class="section-note">Шаг 11: плитка переехала сюда из шапки — та же ось риска, что и категория выше, читается вместе с ней и с процедурой взыскания ниже.</p>
      <div class="cat-expand">
        <div class="row"><span class="ck">Группа:</span> <b>${esc(d.payGroup)}</b></div>
        <div class="row"><span class="ck">Основание:</span> ${esc(PAY_GROUPS[d.payGroup]||'—')}</div>
        ${(c.mirror.collection||[])[0]?`<div class="row"><span class="ck">Процедура взыскания:</span> <b>${esc((c.mirror.collection||[])[0].processId)}</b></div>`:''}
      </div>

      <div class="section-h" style="margin-top:22px">Реструктуризация ${lockHtml()}</div>
      ${rs.active?`<div class="f2">${fld('Стадия',esc(rs.active.stage))}${fld('Дедлайн',esc(rs.active.deadline))}${rs.active.amount?fld('Сумма реструктуризации',money(rs.active.amount)+(rs.active.currency&&rs.active.currency!=='KGS'?' '+esc(rs.active.currency):'')):''}${fld('Всего заявок',esc(rs.count))}</div>
        <p class="section-note">Влияние на категорию: ${rs.active.overlay181?'<b>оверлей подавления 181-го дня</b> — до утверждения категория не растёт.':'оверлей снят — категория считается по факту.'}</p>`
        :`<p class="section-note">Активной реструктуризации нет. Всего заявок: ${rs.count}.</p>`}

      <div class="gtoolbar" style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля реструктуризации — вне объёма макета')">Открыть в модуле реструктуризации</button></div>

      <div class="section-h" style="margin-top:22px">Взыскание ${lockHtml()}</div>

      <div class="section-h" style="margin-top:22px">Банкротство и судебные решения ${lockHtml()}</div>

      <div class="gtoolbar" style="margin-top:16px">
        ${actBtn(c,'repay',{},'Погасить (закрыть)','CR.openRepayModal()','btn btn-tint btn-sm')}
        ${roleBtn('writeOff','Списать','CR.openWriteOffModal()','btn btn-tint danger btn-sm')}
      </div>`;
  }

  /* ---- ВКЛАДКА 8: Досье ---- */
  function docState(s){
    const map={'принят':'low','не требуется':'neutral','на проверке':'info','загружен':'info','требуется':'mid','отклонён':'high','просрочен':'high'};
    return `<span class="pill ${map[s]||'neutral'}">${esc(s||'—')}</span>`;
  }
  function noteTypePill(t){
    const map={'Обычное':'neutral','Примечание куратора':'info','Примечание (ОПП)':'mid','Примечание (залог)':'low','Примечание (ОИП)':'neutral'};
    return `<span class="pill ${map[t]||'neutral'}">${esc(t||'Обычное')}</span>`;
  }

    const curRows=(c.mirror.curatorship||[]).map(x=>`<tr><td>${esc(x.unit)}</td><td>${esc(x.employee)}</td><td>${esc(x.role)}</td><td>${esc(x.from)}</td><td>${esc(x.to||'—')}</td></tr>`);
    const tu=c.targetUse||{};
    const notes=(c.notes||[]);
    const noteRows=notes.map(n=>`<div class="hrow"><div class="hwhen">${noteTypePill(n.type)} · ${esc(n.author)}</div><div class="hwhat">${esc(n.text)}</div></div>`);
    const auditRows=(c.audit||[]).slice().reverse().map(a=>`<div class="hrow"><div class="hwhen">${esc(a.when)} · ${esc(a.who)}</div><div class="hwhat">${esc(a.what)}</div></div>`);
    return `
      <div class="section-h">Документы кредита</div>
      <p class="section-note">Жизненный цикл документа: требуется → загружен → на проверке → принят / отклонён / не требуется / просрочен.</p>
      ${cgrid([{h:'Вид'},{h:'Наименование'},{h:'Состояние'},{h:'Дата'},{h:'Файл'}], docRows, {empty:'Документов нет'})}

      <div class="section-h" style="margin-top:22px">Регистрация договора — файл и пометка</div>
      <p class="section-note">Шаг 11: скан и комментарий переехали сюда из вкладки «Договор» — там остались только реквизиты регистрации (№, дата, бейдж статуса).</p>
      <div class="f2">
        ${fld('Скан договора', c.reg.scan?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(c.reg.scan)}</a>`:null)}
        ${fld('Комментарий регистрации', c.reg.comment?esc(c.reg.comment):null, {span:true})}

      <div class="section-h" style="margin-top:22px">Целевое использование (Р-15)</div>

        ${fld('Подтверждающих документов', esc((tu.docs||[]).length))}

      <div class="section-h" style="margin-top:22px">Кураторство ${lockHtml()}</div>
      <p class="section-note">Шаг 11: журнал назначений переехал сюда из вкладки «Договор» — это история, а не реквизит договора. Текущий куратор — строкой в шапке карточки.</p>
      ${cgrid([{h:'Подразделение'},{h:'Сотрудник'},{h:'Роль'},{h:'С'},{h:'По'}], curRows, {empty:'Назначений нет'})}

      <div class="section-h" style="margin-top:22px">Примечания</div>

        <div class="field" style="max-width:240px"><span class="flabel">Тип</span><div class="control"><select onchange="CR.filterNotes(this.value)"><option value="">Все</option><option>Обычное</option><option>Примечание куратора</option><option>Примечание (ОПП)</option><option>Примечание (залог)</option><option>Примечание (ОИП)</option></select></div></div>

  /* ---- диспетчер вкладок + рендер карточки ---- */
  function renderTab(name, c){
    switch(name){
      case 'Договор': return tabDogovor(c, derive(c));
      case 'Условия': return tabUsloviya(c, derive(c));
      case 'Транши и освоение': return tabTranshi(c, derive(c));
      case 'Расчёты': return tabRaschety(c, derive(c));
      case 'Платежи': return tabPlatezhi(c, derive(c));
      case 'Обеспечение': return tabObespechenie(c, derive(c));
      case 'Проблемные': return tabProblemnye(c, derive(c));
      case 'Досье': return tabDosye(c, derive(c));
      default: return tabDogovor(c, derive(c));
    }
  }
  function renderDetail(c){
    const host=document.getElementById('cr-card-body'); if(!host) return;
    const d=derive(c);                                              // СВЕЖИЙ расчёт на каждый рендер (Р-11)
    host.innerHTML = `<div class="panel-wrap" style="padding-bottom:0">${headerHtml(c,d)}</div>`
      + tabbarHtml()
      + `<div class="panel-wrap"><div class="panel-card">${renderTab(detailTab,c)}</div></div>`;
  }
  function rerenderDetail(){ const c=currentCredit(); if(c) renderDetail(c); }
  function openTab(name){ detailTab=name; rerenderDetail(); }

  /* ---- обвязка действий карточки (onclick-строки живут в глобальной области → CR.*) ---- */
  CR.renderDetail=renderDetail; CR.renderTab=renderTab; CR.openTab=openTab; CR.rerenderDetail=rerenderDetail;
  CR.selectDetailTranche=function(no){ detailTrancheNo=no; rerenderDetail(); };
  CR.setCalcMode=function(v){ calcConsolidated=!!v; rerenderDetail(); };
  CR.stubAction=function(name){ toast('Действие «'+name+'» — открывается в модуле-владельце (вне интерактивного демо)'); };
  CR.filterAudit=function(q){ q=(q||'').toLowerCase(); const host=document.getElementById('cr-audit'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(q)?'':'none'; }); };
  CR.filterNotes=function(t){ t=(t||'').toLowerCase(); const host=document.getElementById('cr-notes'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = (!t || el.textContent.toLowerCase().includes(t))?'':'none'; }); };
  /* ============================================================
     МОДАЛКИ (Task 8) — единый openModal/closeModal, каждая: role+terminal guard → форма →
     мутация CR.* (внутри её gate() ре-валидируется) → при провале modalErr (§0.3, не молча),
     при успехе closeModal + toast + rerenderDetail (derive пересчитывается заново, Р-11).
     modalGuard: Наблюдатель и терминальный кредит НЕ могут ОТКРЫТЬ ни одну модалку.
     ============================================================ */
  function modalGuard(action){
    const c = currentCredit(); if (!c) return null;
    if (isTerminal(c)){ toast(terminalReason(c), 'warn'); return null; }
    if (action && !canRole(currentRole, action)){ toast('Роль «'+currentRole+'» не имеет права на это действие', 'warn'); return null; }
    return c;
  }

  /* 1) tranche (addTranche, Г-3) */
  CR.openTrancheModal=function(){ const c=modalGuard('addTranche'); if(!c) return; const d=derive(c);
    const body=`<p class="section-note">Условия транша наследуются от базовых условий кредита (Р-2). Σ траншей ≤ суммы договора (Г-3). Доступно к распределению: <b>${money(d.allocatable)}</b>.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Сумма транша</span><div class="control"><input id="trAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Плановая дата освоения</span><div class="control"><input id="trDate" placeholder="дд.мм.гггг"></div></div>
        <div class="field"><span class="flabel">Субъект — наименование</span><div class="control"><input id="trSubjName" value="${esc(c.borrower.name)}"></div></div>
        <div class="field"><span class="flabel">Субъект — ИНН</span><div class="control"><input id="trSubjInn" value="${esc(c.borrower.inn)}"></div></div>
      </div>`;
    CR.openModal('Добавить транш (Г-3)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitTranche()">Добавить транш</button>`);
  };
  CR.submitTranche=function(){ const c=modalGuard('addTranche'); if(!c) return;
    const amount=+document.getElementById('trAmount').value||0;
    const plannedDate=document.getElementById('trDate').value;
    const subject={ name:document.getElementById('trSubjName').value, inn:document.getElementById('trSubjInn').value };
    const r=CR.addTranche(c,{amount,plannedDate,subject}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Транш добавлен: '+money(amount),'ok'); rerenderDetail(); };

  /* 2) disbursement (addDisbursement, Г-4·Г-5·Г-6) — апгрейд инлайн-формы до модалки */
  CR.openDisbModal=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const body=`<p class="section-note">Освоение — owned кредитом, на транше (Р-6). Гейты Г-4 (Σ ≤ сумма транша) · Г-5 (ЖЦ) · Г-6 (покрытие/КМ/waiver).</p>
      <div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="disbTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===detailTrancheNo?' selected':''}>№${t.no} · сумма ${money(t.amount)} · освоено ${money(disbursedSum(t))}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма освоения</span><div class="control"><input id="disbAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Дата освоения</span><div class="control"><input id="disbDate" value="${esc(CR.TODAY)}"></div></div>
        <div class="field"><span class="flabel">Плат. поручение</span><div class="control"><input id="disbOrder" placeholder="ПП-..."></div></div>
        <div class="field col-span"><span class="flabel">Назначение</span><div class="control"><input id="disbPurpose" placeholder="Оплата ..."></div></div>
      </div>`;
    CR.openModal('Внести освоение (Г-4 · Г-5 · Г-6)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitDisb()">Сохранить освоение</button>`);
  };
  CR.submitDisb=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const no=+document.getElementById('disbTranche').value;
    const amount=+document.getElementById('disbAmount').value||0;
    const date=document.getElementById('disbDate').value||CR.TODAY;
    const order=document.getElementById('disbOrder').value, purpose=document.getElementById('disbPurpose').value;
    const r=CR.addDisbursement(c,{trancheNo:no,amount,order,purpose,date}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); detailTrancheNo=no; toast('Освоение внесено: '+money(amount),'ok'); rerenderDetail(); };

  /* 3) schedule-params (generateSchedule, Г-8) — апгрейд: параметры → предпросмотр (1·2·посл.) → новая версия */
  CR.openSchedModal=function(previewFrom){ const c=modalGuard('buildSchedule'); if(!c) return;
    const sel=c.tranches.find(t=>t.no===detailTrancheNo)||c.tranches[0]; const cnd=sel.conditions||{};
    const from=(previewFrom!=null?previewFrom:((sel.disbursements[0]&&sel.disbursements[0].date)||''));
    let preview;
    if(from && sel.disbursements.length){ const rows=CR.buildSchedule(sel, from).rows;
      const show=[rows[0], rows[1], rows[rows.length-1]].filter(Boolean);
      preview=`<div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр (платёж 1 · 2 · последний)</div>
        ${cgrid([{h:'№'},{h:'Дата'},{h:'Платёж',r:1},{h:'ОД',r:1},{h:'%',r:1}], show.map(r=>`<tr><td>№${r.no}</td><td>${esc(r.date)}</td><td style="text-align:right">${money(r.total)}</td><td style="text-align:right">${money(r.principal)}</td><td style="text-align:right">${money(r.interest)}</td></tr>`))}`;
    } else { preview=`<div class="warn-inline">${svgInfo()}<div>График строится только от фактической даты освоения транша (Г-8). У выбранного транша нет освоения либо не задана дата.</div></div>`; }
    const body=`<div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="schedTranche" onchange="CR.selectDetailTranche(+this.value);CR.openSchedModal()">${c.tranches.map(t=>`<option value="${t.no}"${t.no===sel.no?' selected':''}>Транш №${t.no}${t.disbursements.length?'':' (не освоен)'}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Дата освоения (старт графика)</span><div class="control"><input id="schedFrom" value="${esc(from)}" placeholder="дд.мм.гггг"></div></div>
        <div class="field"><span class="flabel">Периодичность</span><div class="control"><input value="${esc(cnd.freq||'ежемесячно')}" readonly></div></div>
        <div class="field"><span class="flabel">Метод погашения</span><div class="control"><input value="${esc(cnd.method||'аннуитет')}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по ОД, мес.</span><div class="control"><input value="${esc(cnd.graceMain||0)}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по %, мес.</span><div class="control"><input value="${esc(cnd.graceInterest||0)}" readonly></div></div>
      </div>
      <p class="section-note" style="margin-top:8px">Периодичность/метод/льготы наследуются из условий транша (правка — только доп. соглашением, Г-9). Предыдущая активная версия архивируется, не удаляется (Р-4).</p>
      <div class="gtoolbar"><button class="btn btn-secondary btn-sm" onclick="CR.openSchedModal(document.getElementById('schedFrom').value)">Обновить предпросмотр</button></div>
      ${preview}`;
    CR.openModal('Сформировать график (Г-8)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitSched()">Сформировать (новая версия)</button>`);
  };
  CR.submitSched=function(){ const c=modalGuard('buildSchedule'); if(!c) return;
    const no=+document.getElementById('schedTranche').value, from=document.getElementById('schedFrom').value;
    const r=CR.generateSchedule(c,no,{from}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); detailTrancheNo=no; toast('График сформирован: версия v'+(r.ver||'?'),'ok'); rerenderDetail(); };

  /* 4) agreement/ДС (addAgreement, Г-10) — конструктор: поля → значения → diff-предпросмотр → реквизиты → активация */
  CR.openAgrModal=function(){ const c=modalGuard('addAgreement'); if(!c) return; const b=c.baseConditions;
    const body=`<p class="section-note">Изменение условий после регистрации — только доп. соглашением (Р-4). Активируется при наличии номера и даты (Г-10). Предыдущая версия архивируется.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Номер ДС</span><div class="control"><input id="agrNum" placeholder="ДС-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="agrDate" placeholder="дд.мм.гггг"></div></div>
        <div class="field col-span"><span class="flabel">Основание</span><div class="control"><input id="agrSource" value="кредит" placeholder="основание ДС"></div></div>
        <div class="field"><span class="flabel">Ставка: было</span><div class="control"><input id="agrBeforeRate" type="number" value="${esc(b.rate)}" readonly></div></div>
        <div class="field"><span class="flabel">Ставка: стало</span><div class="control"><input id="agrAfterRate" type="number" value="${esc(b.rate)}" oninput="CR.agrDiff()"></div></div>
        <div class="field"><span class="flabel">Срок: было</span><div class="control"><input id="agrBeforeTerm" type="number" value="${esc(b.term)}" readonly></div></div>
        <div class="field"><span class="flabel">Срок: стало</span><div class="control"><input id="agrAfterTerm" type="number" value="${esc(b.term)}" oninput="CR.agrDiff()"></div></div>
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр изменений (было → стало)</div>
      <div id="agrDiff" class="cat-expand"></div>`;
    CR.openModal('Конструктор доп. соглашения (Р-4 · Г-10)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitAgr()">Оформить и активировать</button>`);
    CR.agrDiff();
  };
  CR.agrDiff=function(){ const box=document.getElementById('agrDiff'); if(!box) return;
    const br=+document.getElementById('agrBeforeRate').value, ar=+document.getElementById('agrAfterRate').value;
    const bt=+document.getElementById('agrBeforeTerm').value, at=+document.getElementById('agrAfterTerm').value;
    const rows=[];
    if(br!==ar) rows.push(`<div class="row"><span class="ck">Ставка, %</span> <span class="diff"><span class="diff-old">${esc(br)}</span> → <span class="diff-new">${esc(ar)}</span></span></div>`);
    if(bt!==at) rows.push(`<div class="row"><span class="ck">Срок, мес.</span> <span class="diff"><span class="diff-old">${esc(bt)}</span> → <span class="diff-new">${esc(at)}</span></span></div>`);
    box.innerHTML = rows.length?rows.join(''):`<div class="row" style="color:var(--text-placeholder)">Изменений не выбрано</div>`; };
  CR.submitAgr=function(){ const c=modalGuard('addAgreement'); if(!c) return;
    const num=document.getElementById('agrNum').value, date=document.getElementById('agrDate').value;
    const source=document.getElementById('agrSource').value||'кредит';
    const before={rate:+document.getElementById('agrBeforeRate').value, term:+document.getElementById('agrBeforeTerm').value};
    const after={rate:+document.getElementById('agrAfterRate').value, term:+document.getElementById('agrAfterTerm').value};
    const r=CR.addAgreement(c,{num,date,source,before,after}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Доп. соглашение '+num+' оформлено','ok'); rerenderDetail(); };

  /* 5) manual-payment (addPayment, Г-11, Р-5) — «форма модуля платежей», статус «Ожидает ЦК» */
  CR.openPaymentModal=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const body=`<div class="info-plate">${svgInfo()}<div>Форма модуля платежей (Р-5). Ручной ввод повисает «Ожидает ЦК» и НЕ двигает остатки/долг — подтверждённые остатки двигает только ЦК своим потоком.</div></div>
      <div class="mform">
        <div class="field"><span class="flabel">Кредит</span><div class="control"><input value="№ ${esc(c.num)} · ${esc(c.borrower.name)}" readonly></div></div>
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="payTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===detailTrancheNo?' selected':''}>№${t.no} · ${esc(t.subject.name)}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма платежа</span><div class="control"><input id="payAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field req"><span class="flabel">Дата платежа</span><div class="control"><input id="payDate" value="${esc(CR.TODAY)}" placeholder="дд.мм.гггг"></div></div>
      </div>`;
    CR.openModal('Ручной ввод платежа — форма модуля платежей', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitPayment()">Отправить в модуль платежей</button>`);
  };
  CR.submitPayment=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const trancheNo=+document.getElementById('payTranche').value;
    const amount=+document.getElementById('payAmount').value||0;
    const date=document.getElementById('payDate').value;
    const r=CR.addPayment(c,{amount,date,trancheNo}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Платёж отправлен — статус «Ожидает ЦК»','ok'); rerenderDetail(); };

  /* 6) KM-decision (setKmDecision, Р-8) — разблокирует освоение с провалом покрытия (К-5) */
  CR.openKmModal=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const body=`<p class="section-note">Реквизиты решения КМ об освобождении от залога (Р-8, П1 §2.6). Owned-поле кредита — разблокирует освоение при провале покрытия (Г-6).</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид решения</span><div class="control"><input id="kmKind" value="Решение КМ"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="kmNum" placeholder="КМ-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="kmDate" placeholder="дд.мм.гггг"></div></div>
        <div class="field"><span class="flabel">Скан</span><div class="control"><input id="kmScan" placeholder="reshenie-km.pdf"></div></div>
      </div>`;
    CR.openModal('Решение КМ об освобождении от залога (Р-8)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitKm()">Сохранить решение</button>`);
  };
  CR.submitKm=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const kind=document.getElementById('kmKind').value, num=document.getElementById('kmNum').value;
    const date=document.getElementById('kmDate').value, scan=document.getElementById('kmScan').value;
    if(!num||!date){ CR.modalErr(['Номер и дата решения обязательны']); return; }
    const r=CR.setKmDecision(c,{kind,num,date,scan}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Решение КМ сохранено — освоение разблокировано','ok'); rerenderDetail(); };

  /* 7) waiver (saveWaiver) — альтернатива КМ; роль «Начальник отдела», обоснование ОБЯЗАТЕЛЬНО (К-5) */
  CR.openWaiverModal=function(){ const c=modalGuard('waiver'); if(!c) return;
    const body=`<p class="section-note">Waiver залоговой комиссии (альтернатива решению КМ) — разблокирует освоение при провале покрытия (Г-6). Доступно роли «Начальник отдела». Обоснование обязательно.</p>
      <div class="mform">
        <div class="field req col-span"><span class="flabel">Обоснование (протокол комиссии по залогу)</span><textarea id="waiverReason" class="note-area" placeholder="Основание waiver..."></textarea></div>
      </div>`;
    CR.openModal('Waiver залоговой комиссии (Г-6)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitWaiver()">Сохранить waiver</button>`);
  };
  CR.submitWaiver=function(){ const c=modalGuard('waiver'); if(!c) return;
    const reason=document.getElementById('waiverReason').value;
    const r=CR.saveWaiver(c,{reason}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Waiver сохранён — освоение разблокировано','ok'); rerenderDetail(); };

  /* 8) write-off (closeCredit «Списан», Г-12) — реквизиты решения обязательны */
  CR.openWriteOffModal=function(){ const c=modalGuard('writeOff'); if(!c) return; const d=derive(c);
    const bal=round2(d.debt.principal.bal+d.debt.interest.bal+d.debt.penalty.bal);
    const body=`<p class="section-note">Списание — терминал с обязательными реквизитами решения (Р-20, Г-12). Без физического удаления.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид решения</span><div class="control"><input id="woKind" value="Решение Правления"></div></div>
        <div class="field req"><span class="flabel">Номер решения</span><div class="control"><input id="woNum" placeholder="РП-..."></div></div>
        <div class="field req"><span class="flabel">Дата решения</span><div class="control"><input id="woDate" placeholder="дд.мм.гггг"></div></div>
        <div class="field"><span class="flabel">Сумма списания</span><div class="control"><input id="woAmount" type="number" value="${esc(bal)}"></div></div>
        <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="woScan" placeholder="reshenie.pdf"></div></div>
      </div>`;
    CR.openModal('Списание кредита (Г-12)', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-tint danger" onclick="CR.submitWriteOff()">Списать</button>`);
  };
  CR.submitWriteOff=function(){ const c=modalGuard('writeOff'); if(!c) return;
