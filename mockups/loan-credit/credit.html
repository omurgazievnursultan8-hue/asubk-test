    const amount   = s.a;
    const contract = s.cl ? Math.round(amount*0.8) : amount;             // cl: сумма договора < одобренной
    const life = s.life || 'Действует';
    const rate = s.rate || 10, term = s.term || 24;
    const dd0  = '15.02.2026';
    const disbMode = life==='Проект' ? 'none' : (s.disb || 'full');      // Проект не осваивается (Г-5)
    const disbAmt  = disbMode==='full' ? contract : disbMode==='partial' ? Math.round(contract*0.6) : 0;

    /* Пауза начисления стоит ВЫШЕ графика, потому что график её обязан знать: движок
       не начисляет за позицию, чья дата попала в окно паузы (`periodInterest`), и сид,
       посчитавший ту позицию как обычную, разъезжается с листом (КР-63, K-C18/K-C19). */
    const accrualHold = s.hold
      ? [{ from:'01.06.2026', to:'01.09.2026',
          reason: s.hold===181 ? 'Приостановление на период рассмотрения реструктуризации' : 'Форс-мажор (стихийное бедствие)',
          doc:'prikaz-hold-'+num+'.pdf', by:s.c }]
      : [];

    /* ГРАФИК И ПОГАШЕНИЯ вместо засеянного ledger (ADR-0010). Просрочка выводится из
       позиции графика, погашение — из подтверждённых платежей; ни одна величина долга
       больше не задаётся напрямую. */
    let schedules = [], payments = [], paymentsAsOf = null, seedClose = null;
    if (life === 'Закрыт'){
      schedules = [ seedSchedule(dd0, 400, contract, rate, term, Math.min(term, 6), dd0) ];   // освоение в dd0 — КР-63
      const closureReason = s.closure || 'Погашен';
      /* «Погашен» гасится полностью; «Списан» — частично: деньгами закрыта доля, остальное
         снимает с баланса решение (КВ-62), и подгруппа честно говорит «безнадёжные долги».
         Сумма процентов НЕ выдумывается процентом от договора: 12 % от суммы договора
         разносилось в статью, где начислено втрое меньше, и разницу молча съедал
         `Math.min` в debtOf — до 66 935 сомов на кредит (КР-48). Платёж досчитывается
         вторым проходом из ПОСТРОЕННОГО расчёта, как и у платящих по графику. */
      seedClose = closureReason === 'Списан' ? { date:'10.06.2026', share:0.35 }
                                             : { date:'20.06.2026', share:1 };
      paymentsAsOf = seedClose.date;
    } else if (disbAmt > 0){
      /* с просрочкой — сеем версию графика, первая позиция которой отстоит на s.od дней;
         без просрочки — график не сеем вовсе (движок построит от даты освоения), а
         погашения досчитываются вторым проходом seedSettlePayments: считать их здесь
         нельзя, записей условий у транша ещё нет. */
      if (s.od > 0){ schedules = [ seedSchedule(dd0, s.od, disbAmt, rate, term, 5, dd0, accrualHold) ]; paymentsAsOf = TODAY; }   // освоение в dd0, пауза известна — КР-63
    }

    /* обеспечение: залоги / банковская гарантия (в индексе) / поручительство (вне индекса) */
    const pledges=[], guarantees=[]; let bankGuarantee=null;
    switch(s.cov){
      case 'under':  pledges.push(pl('ЗД-'+num, s.n, 'Автотранспорт', 'Транспортное средство', Math.round(contract*1.0), Math.round(contract*0.84))); break;      // движимый неликвид ⇒ порог 150 %
      /* смешанный состав: недвижимость (ликвид) + сельхозтехника (движимый неликвид) ⇒
         порог 150 %, обе подпроверки §2.4 выполнены — ликвид покрывает ≥ 80 % долга. */
      case 'mixed':  pledges.push(pl('ЗД-'+num+'a', s.n, 'Производственный корпус', 'Недвижимое имущество', Math.round(contract*1.1), Math.round(contract*0.90)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Спецтехника (б/у)', 'Сельхозтехника',      Math.round(contract*0.9), Math.round(contract*0.72))); break;
      /* КР-39: индекс выполнен, а СОСТАВ не тот — весь залог движимый неликвид, доля
         ликвида 0 % при минимуме 80 %. Единственный случай в наборе, где гейт Г-6
         блокирует по второй подпроверке, а не по индексу. */
      case 'illiq':  pledges.push(pl('ЗД-'+num+'a', s.n, 'Серверное оборудование', 'Оборудование',   Math.round(contract*1.3), Math.round(contract*1.10)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Инженерные системы (б/у)', 'Оборудование', Math.round(contract*0.7), Math.round(contract*0.55))); break;
      case 'liq150': pledges.push(pl('ЗД-'+num+'a', s.n, 'Складское помещение','Недвижимое имущество',Math.round(contract*1.6), Math.round(contract*1.35)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Оборудование (б/у)', 'Оборудование',        Math.round(contract*0.35),Math.round(contract*0.28))); break; // ликвид + движимый неликвид ⇒ 150 %
      /* Гарантия всегда в сомах: у кредита в KGS порог гарантии 100 %, у кредита в иной
         валюте — 120 % (курсовой запас, Прил.1 §2.3). Одна строка даёт обе ветки. */
      case 'bank':   bankGuarantee = { bank:'ОАО «Айыл Банк»', amount:Math.round(contract*1.3), currency:'KGS',
                                       till:'10.02.2027', num:'БГ-'+num, date:'10.02.2026' }; break;
      case 'poruch': guarantees.push({ contractNum:'ПОР-'+num, party:'ОсОО «Гарант-'+num+'»', amount:Math.round(contract*1.5), date:'10.02.2026' }); break; // в индекс НЕ входит (ADR-0011)
      case 'none':   break;
      default:       pledges.push(pl('ЗД-'+num, s.n, 'Административное здание', 'Недвижимое имущество', Math.round(contract*1.7), Math.round(contract*1.4)));       // ок, ≥120 %
    }

    /* ТРЕБОВАНИЯ взыскания (ADR-0002) + судебные решения. Фаза и стадия приходят
       свёрнутыми из журнала мер (ADR-0003) — кредит их не хранит и не выводит. */
    const claims=[], court=[]; let claimsAsOf = null, collectionCosts = 0;
    if (s.coll){
      const M = { claim:   ['Досудебная','Претензия направлена','направлена претензия должнику', 0],
                  court:   ['Судебная','Иск подан','подан иск в суд', 3200],
                  ispolnit:['Исполнительная','ИЛ у судоисполнителя','ИЛ передан судоисполнителю', 5400],
                  bankrot: ['Банкротство','Дело возбуждено','возбуждено дело о банкротстве', 12000] }[s.coll];
      collectionCosts = M[3];
      claims.push(seedClaim({ claimId:'ТРБ-'+num, processId:'ВЗ-'+num,
        obligor:{ inn, name:s.n, role:'заёмщик' }, phase:M[0], stage:M[1],
        amount:Math.round(amount*0.08), since:'01.05.2026', lastMeasure:'01.05.2026 — '+M[2], costs:M[3] }));
      /* поручитель — ВТОРОЕ обязанное лицо по тому же процессу: своё требование,
         своя стадия. Именно этой размерности не было в прежней модели (КР-31). */
      if (s.cov === 'poruch')
        claims.push(seedClaim({ claimId:'ТРБ-'+num+'-П', processId:'ВЗ-'+num,
          obligor:{ inn:'9'+inn.slice(1), name:'ОсОО «Гарант-'+num+'»', role:'поручитель' },
          scope:'Солидарное требование по договору поручительства ПОР-'+num,
          phase:'Досудебная', stage:'Требование направлено', amount:Math.round(amount*0.08),
          since:'05.05.2026', lastMeasure:'05.05.2026 — направлено требование поручителю', costs:0 }));
      claimsAsOf = '20.07.2026';
      /* Присуждена ПРОСРОЧЕННАЯ часть, не весь долг: иски подают и на неё, и на всю сумму
         (§6 спеки платежей). Отсюда доля тела под решением меньше единицы, и начисление
         останавливается частично — ровно то, что не выражается флагом на кредите. */
      if (s.coll==='court' || s.coll==='ispolnit')
        court.push({ date:'20.05.2026', kind:'Судебный приказ', org:'Районный суд', res:'Выдан', ok:true,
                     amount:Math.round(amount*0.08), il:'ИЛ-'+num, file:'prikaz-'+num+'.pdf' });
      /* K-C12 (num='C211') получает ВТОРОЙ акт — единственный многослойный случай в
         демонаборе, нужен для проверки пропуска уже помеченных позиций лестницей
         (credit-check.mjs #98, ADR-0060 §3). */
      if (num==='C211')
        court.push({ date:'25.06.2026', kind:'Судебный приказ', org:'Районный суд', res:'Выдан', ok:true,
                     amount:35000, il:'ИЛ-C211/2', file:'prikaz-C211-2.pdf' });
      /* Определение о возбуждении дела о банкротстве СЛОЯ НЕ ОБРАЗУЕТ: присуждать нечего,
         суммы в нём нет. Последствия банкротства принадлежат взысканию (КР-33). */
      if (s.coll==='bankrot')
        court.push({ date:'25.05.2026', kind:'Определение о банкротстве', org:'Межрайонный суд', res:'Возбуждено', ok:false, file:'bankrot-'+num+'.pdf' });
    }

    /* реструктуризация — признак состояния; послабление (подавление 181-го дня) —
       ОТДЕЛЬНАЯ запись со сроком и основанием (ADR-0012), а не флаг внутри неё */
    const restructuring = s.restr
      ? { count:1, active:{ id:'РС-'+num, stage:s.restr.stage, deadline:'12.09.2026', amount:Math.round(amount*1.05),
          currency:ccy, pause: s.restr.pause?{days:s.restr.pause}:undefined } }
      : { count:0, active:null };
    const relief = (s.restr && s.restr.o181) || s.hold === 181
      ? [{ kind:'suppress181', from:'01.05.2026', deadline:'12.09.2026',
           basis: s.restr ? ('Заявка на реструктуризацию РС-'+num+' на рассмотрении')
                          : 'Решение о приостановлении принудительных мер',
           doc:'relief-181-'+num+'.pdf' }]
      : [];
    /* фактор категории вместо прежней «группы риска» A/B/C/D (ADR-0012) */
    const factors = (s.cat === 'B' || s.cat === 'C' || s.cat === 'D')
      ? [{ kind: s.cat === 'B' ? 'Снижение выручки' : s.cat === 'C' ? 'Утрата платёжеспособности' : 'Признание задолженности безнадёжной',
           level: s.cat === 'B' ? 'средний' : 'высокий', from:'01.03.2026', to:null,
           committeeRef:'ККР-'+num+' от 25.02.2026', note:'По итогам мониторинга' }]
      : [];

    const t1disb = s.tr2 ? (disbAmt>0?[{date:dd0,amount:Math.round(contract*0.6),order:'ПП-'+num,purpose:s.pu,doc:'akt-'+num+'.pdf'}]:[]) : disbmts();
    function disbmts(){ return disbAmt>0 ? [{ date:dd0, amount:disbAmt, order:'ПП-'+num, purpose:s.pu, doc:'akt-'+num+'.pdf' }] : []; }
    const tranches = [ mkTranche({ id:'K-C'+(i+1)+'-T1', no:1, subject:{ inn, name:s.n },
      amount: s.tr2?Math.round(contract*0.6):contract, plannedDate:'12.02.2026',
      disbursements:t1disb, schedules, accrualHold }) ];
    if (s.tr2) tranches.push(mkTranche({ id:'K-C'+(i+1)+'-T2', no:2, subject:{ inn, name:s.n },
      amount:Math.round(contract*0.4), plannedDate:'01.10.2026', disbursements:[], accrualHold }));

    return mkCredit({
      id:'K-C'+(i+1), num, date:'05.02.2026',
      reg:{ num, date:'07.02.2026', scan:'dog-'+num+'.pdf', comment:'' },
      origin:{ applicationId:'ЗАЯ-'+num, applicationDate:'29.01.2026', commissionId:'КОМ-'+num, programId:s.p, govDecisionId:'ПП-470' },
      borrower:{ inn, name:s.n, type:'ЮЛ', region:s.r, district:s.d },
      approvedAmount: s.cl?amount:contract, contractAmount:contract, currency:ccy,
      /* КР-59: как и у фона — из набора программы s.p. Прежняя линия читалась
         «Единовременный/Возобновляемая» по числу траншей: АРР/ФРР это доноры, а не
         однократность выдачи, и число траншей о линии ничего не говорит. */
      kind:pickCls(s.p,'kind',i), line:pickCls(s.p,'line',i),
      purpose:s.pu, fundingSource:pickCls(s.p,'fundingSource',i),
      accounts:{ repayAcct:'12800000000'+(20000+i), repayAcctKind:'Расчётный', payCode:'PC-'+num },
      /* coverPct — порог обеспеченности, установленный решением КМ (ADR-0011, Прил.1 §2.6):
         решение не отменяет обеспечение, а назначает свой порог. Это поле читает и
         модуль залога — до волны его в модели кредита не было вовсе (КР-35). */
      kmDecision: s.km ? { kind:'Решение КМ', num:'КМ-'+num, date:'08.02.2026', scan:'km-'+num+'.pdf',
                           /* залога нет вовсе → решение освобождает от порога целиком (0 %);
                              залог есть, но не дотягивает → порог понижен до 80 % */
                           coverPct: (pledges.length || bankGuarantee) ? 80 : 0,
                           reason:'Порог обеспечения установлен решением КМ (Прил.1 §2.6)' } : null,
      lifecycle:life,
      closure: life==='Закрыт'
        ? { reason:s.closure||'Погашен', date:'20.06.2026',
            doc: (s.closure==='Списан')
              ? { kind:'Решение Правления', num:'РП-'+num, date:'18.06.2026', scan:'rp-'+num+'.pdf' }
              : { kind:'Акт сверки',       num:'АС-'+num, date:'20.06.2026', scan:'as-'+num+'.pdf' } }
        : null,
      baseConditions: condDefaults({ rate, term,
        floatMeta: s.float ? { rate:{ benchmark:'учётная ставка НБКР', margin:3 } } : {},
        reserveRate:s.reserve?2:0 }),
      accrualHold, relief, factors,
      /* служебная пометка сидирования: «этот кредит платит по графику» — обработается
         вторым проходом (seedSettlePayments) и будет удалена из модели */
      _seedSettle: (life === 'Действует' && disbAmt > 0 && !(s.od > 0)) ? TODAY : null,
      _seedClose: seedClose,                       // закрытый кредит: платёж из построенного расчёта
      /* обязательный комплект программы (Г-7). Один сценарий на десять получает
         документ в НЕзакрывающем состоянии — иначе состояния «на проверке»,
         «отклонён», «просрочен» не встречались бы в демо ни разу (КР-22). */
      docs: programDocs({ origin:{ programId:s.p } }).req.map((kind, j) => ({
        kind, name:kind + ' · ' + num,
        state: (i % 10 === 3 && j === 1) ? 'на проверке' : (i % 10 === 7 && j === 1) ? 'отклонён' : 'принят',
        date:'06.02.2026', file:'doc-'+num+'-'+(j+1)+'.pdf',
        note: (i % 10 === 7 && j === 1) ? 'Отклонён: не читается печать' : '' })),
      /* целевое использование (Р-15): у освоенных кредитов есть подтверждающие
         документы и проверки; при нецелевом — мера со ссылкой на решение Комитета.
         Прежде вкладка показывала «Документов 0 · Проверок 0 · Мер 0» на всех 59 (КР-20). */
      targetUse: disbAmt > 0 ? {
        docs:[{ date:'20.02.2026', title:'Счёт-фактура и акт приёма-передачи', result:'принято', file:'tu-'+num+'.pdf' }],
        checks:[{ date:'15.04.2026', title:'Выездная проверка целевого использования',
                  result: s.od > 120 ? 'выявлено отклонение' : 'соответствует', file:'check-'+num+'.pdf' }],
        measures: s.od > 120 ? [{ date:'05.05.2026', title:'Требование о досрочном возврате',
                  result:'направлено', committeeRef:'ККР-'+num+' от 30.04.2026' }] : [],
        committeeDecision: s.od > 120 ? { num:'ККР-'+num, date:'30.04.2026' } : null
      } : { docs:[], checks:[], measures:[], committeeDecision:null },
      tranches,
      mirror: emptyMirror({
        curatorship:[{ unit: s.coll?'Отдел проблемных кредитов':'Отдел кредитования', employee:s.c, role:'ведущий',
          from:'07.02.2026', to: life==='Закрыт'?'20.06.2026':null }],
        pledges, guarantees, bankGuarantee, court, restructuring,
        coverage: seedCoverageMirror(pledges, bankGuarantee, '18.07.2026', ccy),
        payments, paymentsAsOf, claims, claimsAsOf, collectionCosts,
        borrower:(() => { const sg = seedSubgroup(life, s.closure, s.od || 0, (claims[0]||{}).stage);
          return { subgroup:sg, subgroupLabel:SUBGROUP_LABEL[sg], asOf:'20.07.2026' }; })()
      })
    });
  }

  /* Таблица сценариев. Ключи: n имя · r/d область/район · p программа · c куратор ·
     pu цель · cur валюта(KGS) · a сумма · life ЖЦ(Действует) · rate/term · disb full|partial|none ·
     od дни просрочки · cat A|B|C|D · cov ok|under|mixed|liq150|bank|poruch|none · coll claim|court|
     ispolnit|bankrot · restr{stage,o181,pause} · reserve · hold(true|181) · km · float · tr2 ·
     closure Погашен|Списан · cl (договор<одобренной). */
  const A='Асанов А. К.', K='Ким Л. С.', O='Осмонов Б. Т.', J='Джумалиева Г. К.', T='Турсунова А. Б.', M='Мамытов Э. С.';
  const scen = [
    /* — здоровые действующие, валюты/регионы/программы/покрытие — */
    { n:'ОсОО «Кемин-Цемент»',       r:'Чуйская',          d:'Кеминский',       p:'ПРГ-1', c:A, pu:'Модернизация цеха',        a:850000 },
    { n:'ОсОО «Ош-Мрамор»',          r:'Ошская',           d:'Араванский',      p:'ПРГ-2', c:K, pu:'Закуп сырья',              a:320000, cur:'USD' },
    { n:'ОсОО «Каракол-Турбаза»',    r:'Иссык-Кульская',   d:'Ак-Суйский',      p:'ПРГ-3', c:O, pu:'Строительство гостиницы',  a:1200000, cov:'liq150' },
    { n:'ОсОО «Талас-Фасоль»',       r:'Таласская',        d:'Манасский',       p:'ПРГ-4', c:J, pu:'Экспорт фасоли',           a:260000, cur:'RUB', disb:'partial' },
    { n:'ОсОО «Баткен-Абрикос»',     r:'Баткенская',       d:'Баткенский',      p:'ПРГ-5', c:T, pu:'Переработка сухофруктов',  a:180000, cur:'EUR' },
    { n:'ОсОО «Бишкек-Мебель»',      r:'г. Бишкек',        d:'Октябрьский',     p:'ПРГ-6', c:M, pu:'Закуп оборудования',       a:540000, cov:'bank' },
    { n:'ОсОО «Джалал-Абад-Хлопок»', r:'Джалал-Абадская',  d:'Ноокенский',      p:'ПРГ-7', c:A, pu:'Пополнение оборотных',     a:410000 },
    { n:'ОсОО «Нарын-Шерсть»',       r:'Нарынская',        d:'Джумгальский',    p:'ПРГ-8', c:K, pu:'Заготовка шерсти',         a:150000, cov:'poruch', km:true },
    /* — просрочка по нарастающей + взыскание всех контуров — */
    { n:'ОсОО «Сокулук-Птица»',      r:'Чуйская',          d:'Сокулукский',     p:'ПРГ-1', c:O, pu:'Закуп кормов',             a:230000, od:12,  cat:'A' },
    { n:'ОсОО «Узген-Рис»',          r:'Ошская',           d:'Узгенский',       p:'ПРГ-2', c:J, pu:'Закуп риса',               a:300000, cur:'USD', od:45, cat:'A', coll:'claim' },
    { n:'ОсОО «Кара-Балта-Спирт»',   r:'Чуйская',          d:'Жайылский',       p:'ПРГ-3', c:T, pu:'Линия розлива',            a:620000, od:95,  cat:'B', coll:'claim', cov:'mixed' },

  /* ВТОРОЙ ПРОХОД СИДИРОВАНИЯ: кредиты, которые «платят по графику», получают платежи,
     ЗАКРЫВАЮЩИЕ наступившие позиции. Раньше здоровье кредита объявлялось строкой ledger
     с нулевой просрочкой; теперь оно должно быть заработано погашениями — иначе движок
     честно покажет просрочку с первой же позиции. Считать это в mkScen нельзя: график
     строится от записей условий, а они появляются строкой выше. */
  for (const c of credits){
    const close = c._seedClose; delete c._seedClose;
    if (close){
      /* ЗАКРЫТЫЙ КРЕДИТ: платёж гасит то, что ПОСЧИТАНО на дату закрытия, а не долю от
         суммы договора. Иначе «Погашен» с ненулевым остатком либо, наоборот, переплата,
         спрятанная срезом (КР-48). Доля < 1 — списание: остаток обязан остаться. */
      const led = buildLedger(c, close.date);
      const disb = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
      const dbt = debtOf(led, disb);
      /* ПЕНЯ ТЕПЕРЬ КЛАДЁТСЯ (ADR-0129 §2). Прежняя редакция её не клала с доводом «она
         считается на непокрытый остаток и исчезает от самого этого платежа» — это было
         верно, пока пеня считалась одним произведением на базе ДАТЫ СРЕЗА. С интегралом
         по отрезкам она не исчезает: дни между сроком и платежом уже прошли, и пеня за
         них начислена. Не положить её значит закрыть кредит с висящей пенёй. */
      const L = { principal: round2(disb * close.share),
                  interest:  round2(dbt.interest.accrued * close.share),
                  penalty:   round2(dbt.penalty.accrued  * close.share),
                  fees:      round2(dbt.fees.accrued     * close.share) };
      if (L.principal + L.interest + L.fees > 0){
        c.mirror.payments.push(seedPayment(1, close.date, (c.tranches[0]||{}).no || 1, L));
        c.mirror.paymentsAsOf = close.date;
      }
    }
    if (!c._seedSettle){ delete c._seedSettle; continue; }
    const upTo = c._seedSettle; delete c._seedSettle;
    const led = buildLedger(c, upTo);
    let principal = 0, interest = 0, penalty = 0;
    /* ПЕНЯ ВХОДИТ В ПЛАТЁЖ (ADR-0129 §2). Платёж датирован срезом, а позиции наступали
       раньше — значит дни просрочки уже прошли и пеня за них начислена. Прежде она была
       нулевой (база бралась на дату среза, после разнесения — ноль), и «платит по
       графику» держалось на этом. Теперь заплатить нужно и её, иначе у здорового
       кредита висит хвост, которого не имел в виду ни один сценарий сида. */
    for (const r of led.rows){ principal += r.principalDue; interest += r.interestCharged;
                               penalty += r.penaltyClaimable; }
    if (principal + interest <= 0) continue;
    c.mirror.payments.push(seedPayment(1, upTo, (c.tranches[0]||{}).no || 1,
      { principal: round2(principal), interest: round2(interest), penalty: round2(penalty) }));
    c.mirror.paymentsAsOf = upTo;
  }

  /* КР-22 · waiver залоговой комиссии — ВТОРОЙ разблок Г-6 (канон К-5, смоук №8).

  /* КР-3 · soft-close транша (Г-17): состояние, которого модель не умела показать —

     что заёмщик от него отказался; агрегаты срока и условий его больше не видят. */
  /* Берём «Узген-Строй», а НЕ первый двухтраншевый кредит: первый занят демонстрацией
     Д-7 (расхождение условий по траншам), а закрытый транш выпадает из агрегата

  const kSoft = credits.find(c => /Узген-Строй/.test(c.borrower.name));
  if (kSoft && kSoft.tranches[1])
    kSoft.tranches[1].closed = { date:'01.07.2026', reason:'Заёмщик отказался от второго транша (письмо от 25.06.2026)', by:'Кредитный специалист' };

  const kDisbClosed = credits.find(c => /Талас-Фасоль/.test(c.borrower.name));
  if (kDisbClosed) kDisbClosed.closure = { disbClosed: { date:'01.07.2026',
    amount: kDisbClosed.contractAmount - kDisbClosed.tranches.reduce((a,t) => a + disbursedSum(t), 0),
    reason:'Истёк срок освоения по договору; заёмщик остаток не выбрал',

  /* КР-20 · целевое использование: вкладка показывала «Документов 0 · Проверок 0 ·
     Мер 0 · Решение Комитета —» на всех 59 кредитах. Освоенные деньги без единого
     подтверждающего документа — состояние, которого в реальной работе не бывает. */
  for (const c of credits){
    if ((c.targetUse.docs || []).length) continue;
    const disb = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
    if (disb <= 0) continue;                                  // не освоен — подтверждать нечего
    const dt = (c.tranches[0].disbursements[0] || {}).date || c.date;
    c.targetUse.docs.push({ date:dt, title:'Платёжное поручение и акт приёма-передачи', result:'принято', file:'tu-'+c.id+'.pdf' });
    c.targetUse.checks.push({ date:fd(addM(pd(dt), 2)), title:'Камеральная проверка целевого использования',
                              result:'соответствует', file:'check-'+c.id+'.pdf' });

  /* КР-21 · журнал аудита: у 59 кредитов из 59 он был пуст до первого клика — засеянные
     доп. соглашения, записи условий и освоения следа не оставляли. Восстанавливаем
     минимальный след по тому, что в модели уже есть; порядок задаётся счётчиком. */
  for (const c of credits){
    const at = (what, when) => c.audit.push(Object.freeze({ seq:++_auditSeq, when, who:'Кредитный специалист', what, before:null, after:null }));
    at('createCredit: кредит создан из заявки ' + (c.origin.applicationId || '—'), c.date);
    if (c.lifecycle !== 'Проект') at('registerCredit: ЖЦ «Проект» → «Зарегистрирован»', c.reg.date || c.date);
    if (c.lifecycle === 'Действует') at('activateCredit: ЖЦ «Зарегистрирован» → «Действует»', c.reg.date || c.date);
    for (const t of c.tranches){
      for (const dsb of (t.disbursements || []))
        at('addDisbursement: транш №' + t.no + ' · ' + money(dsb.amount) + ' (' + (dsb.order || '') + ')', dsb.date);
      for (const sch of (t.schedules || []))
        at('generateSchedule: транш №' + t.no + ' · версия v' + sch.ver + ' от ' + sch.generatedFrom, sch.generatedAt || sch.generatedFrom);
    }
    for (const a of (c.agreements || [])) at('addAgreement: ' + a.num + ' (' + (a.source || 'кредит') + ')', a.date);
    if (c.closure && c.closure.reason) at('closeCredit: ' + c.closure.reason, c.closure.date);
  }

  /* ПЛАНЫ (ADR-0042) — сеются точечно, чтобы демо показывало все четыре состояния строки:
     обычный план · план с правкой · план снятый · месяц без плана (выпадает из расчёта).
     Фоновые K-B* / K-C* не трогаем: план — ручная работа куратора, а не свойство кредита. */
  (() => {
    const c1 = credits.find(x => x.id === 'K-1');
    if (c1) c1.plan = [
      { month:'2026-05', amount:26000, setBy:'Куратор', setAt:'12.05.2026', seededFrom:25800, history:[] },
      { month:'2026-06', amount:30000, setBy:'Куратор', setAt:'12.05.2026', seededFrom:26100,
        history:[{ at:'12.06.2026', by:'Куратор', prev:26000, note:'уточнено после доп. соглашения' }] },
      { month:'2026-07', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      { month:'2026-08', amount:null,  setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400,
        history:[{ at:'20.07.2026', by:'Начальник отдела', prev:28000, note:'план снят: заёмщик в реструктуризации' }] },
      /* 2026-09 — плана нет: месяц выпадает из расчёта целиком (и из квартала, и из года) */
      { month:'2026-10', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      { month:'2026-11', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      /* БУДУЩИЙ ГОД (КВ-22): цель поставлена, месяцы не наступили — год в разрезе стоит
         с планом, прочерком в исполнении и подписью «наступило 0». Без такой строки
         разрез по годам показывал бы только прошлое и настоящее. */
      { month:'2027-02', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      { month:'2027-03', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
    ];
    const c2 = credits.find(x => x.id === 'K-2');
    if (c2) c2.plan = [
      { month:'2026-07', amount:40000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:39200, history:[] },
      { month:'2026-08', amount:40000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:39200, history:[] },
    ];
    const c3 = credits.find(x => x.id === 'K-3');
    if (c3) c3.plan = [
      { month:'2026-07', amount:15000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:15000, history:[] },
    ];
    /* МНОГОЛЕТНИЙ РАЗРЕЗ (КВ-22) на K-6: выдан 15.01.2024, закрыт «Погашен» 20.06.2026 —
       три календарных года в одной карточке. Тело этот заёмщик держал у себя весь срок и
       погасил одним платежом в конце (142 000 в июне 2026), поэтому 2024 и 2025 честно
       стоят с целью и нулевым сбором, а 2026 — со 101 %: ровно те три состояния года,
       которых разрез требует, чтобы его можно было рецензировать.
       Кредит закрыт, и гейт Г-30 «Поставить план» на нём не пустит — это верно: план
       здесь исторический, новую цель на закрытый кредит не ставят. */
    const c6 = credits.find(x => x.id === 'K-6');
    if (c6) c6.plan = [
      { month:'2024-06', amount:6000, setBy:'Куратор', setAt:'20.05.2024', seededFrom:5800, history:[] },
      { month:'2024-12', amount:6000, setBy:'Куратор', setAt:'20.11.2024', seededFrom:5800, history:[] },
      { month:'2025-06', amount:8000, setBy:'Куратор', setAt:'20.05.2025', seededFrom:7900,
        history:[{ at:'01.06.2025', by:'Начальник отдела', prev:6000, note:'ужесточено: тело не гасится второй год' }] },
      { month:'2025-12', amount:8000, setBy:'Куратор', setAt:'20.11.2025', seededFrom:7900, history:[] },
      { month:'2026-06', amount:140000, setBy:'Куратор', setAt:'20.05.2026', seededFrom:139500,
        history:[{ at:'25.05.2026', by:'Куратор', prev:8000, note:'заёмщик заявил полное погашение' }] },
    ];
  })();

  /* КВ-53 · ЗАПИСИ О СПИСАНИИ у закрытых «Списан». Решение в сиде было, суммы по траншам —
     нет: закрытие писало основание на кредит, и лист «По датам» о списании не знал. Проход
     идёт ПОСЛЕДНИМ намеренно — списывается непогашенное тело на дату решения, а платежи
     закрытым кредитам досчитывает второй проход выше; посчитай мы раньше, списали бы то,
     что заёмщик успел вернуть. Через ту же функцию, что и рабочий closeCredit. */
  for (const c of credits){
    if (!c.closure || c.closure.reason !== 'Списан') continue;
    if ((c.tranches || []).some(t => (t.writeOffs || []).length)) continue;
    writeOffTranches(c, { date: c.closure.date, doc: c.closure.doc || null,
                          amount: (c.closure.doc || {}).amount });
  }

  return { credits, applications, pledgesRegistry };
}

/* ============================================================
   3. ЧИСТЫЙ ЛОГИЧЕСКИЙ СЛОЙ — derive / buildSchedule (Task 2).
   Все функции чистые (не трогают document); ничего из §4 не хранится в модели —
   derive пересчитывается при каждой перерисовке, кэш запрещён (Р-11).
   gate / canRole / мутации добавляются в следующих задачах.
   ============================================================ */

/* округление до копеек (детерминированное упрощение, не банковский движок) */
function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
/* Σ освоений транша (Р-6) */
function disbursedSum(t){ return (t.disbursements || []).reduce((x,d) => x + (d.amount||0), 0); }
/* Освоено К ДАТЕ. График амортизирует disbursedSum от даты ПЕРВОГО освоения (buildSchedule),
   то есть считает тело выданным целиком с первого дня. Пока освоение одно, разницы нет;
   при втором освоении середины срока контракт начисляет на деньги, которых у заёмщика ещё
   нет. Разницу забирает отклонение отрезка (ADR-0128 §2, освоение — граница). */
function disbursedTo(t, at){
  const lim = pd(at || TODAY);
  return round2((t.disbursements || [])
    .reduce((x, d) => x + ((d.date && pd(d.date) <= lim) ? (d.amount || 0) : 0), 0));
}

/* ---- ПЕРЕНОС ТЕЛА МЕЖДУ ТРАНШАМИ (ADR-0092 §2, КВ-26) ----
   t.transfers[] — ЕДИНСТВЕННОЕ новое хранилище волны; всё остальное (происхождение
   транша, остаток тела, состав статейных колонок) считается от него. Запись:
     { date, dir:'out'|'in', amount, counterTranche, basis:{ds,date}, parts:[…] }
   ДВЕ записи на одну операцию — у отдающего и у принимающего, — а не одна общая: транш
   обязан читаться сам по себе, карточка и ИР-3 не должны ходить по соседям, чтобы узнать
   свой остаток. Перенос ДАТИРОВАН и несёт основание: без даты остаток тела не имеет
   среза, без основания операция необратима и необъяснима. */
function transfersOf(t, d){
  const lim = d ? pd(d) : null;
  return (t.transfers || []).filter(x => !lim || pd(x.date) <= lim);
}
function transferredOut(t, d){ return round2(transfersOf(t,d).filter(x => x.dir==='out').reduce((a,x) => a + (x.amount||0), 0)); }
function transferredIn (t, d){ return round2(transfersOf(t,d).filter(x => x.dir==='in' ).reduce((a,x) => a + (x.amount||0), 0)); }

/* ПЕРЕНОС ПРОТИВ КОНТРАКТА (КВ-54). База начисления — фактическое непогашенное тело, и
   перенос по ДС двигает именно его: у отдающего транша тело уходит, у принимающего
   появляется. Контрактная база (`full` в trancheAccrual) при этом НЕ движется — график
   амортизирует ту сумму, на которую подписан, — поэтому перенос входит в расчёт
   ОТКЛОНЕНИЕМ, третьим слагаемым рядом с недобором и неосвоенным (ADR-0105).
   У производного транша освоений нет вовсе: контрактная база берётся из t.amount и УЖЕ
   равна принятому переносу (ADR-0092 §1). Принятое считается только СВЕРХ неё, иначе тело
   удвоилось бы; зато ДО даты приёма отклонение отрицательно и ровно обнуляет базу —
   транша с телом ещё нет, начислять не на что. */
function movedNetAt(t, d){
  const ctrIn = disbursedSum(t) ? 0 : Math.min(transferredIn(t), t.amount || 0);
  return round2(transferredIn(t, d) - ctrIn - transferredOut(t, d));
}

/* ---- СПИСАНИЕ ДОЛГА (Р-20, Г-12, КВ-53) ----
   t.writeOffs[] — хранилище рядом с t.transfers[]:
     { date, amount, articles:{interest, penalty, accInterest, accPenalty, fees}, basis }.
   `amount` — ТЕЛО (имя историческое, менять его значило бы переписать все три вызова ради
   симметрии), `articles` — остальные пять статей долга.
   Заводится по той же причине, по какой заведён перенос: до этой правки списание жило
   ОДНИМ полем `closure.reason='Списан'` на кредите — без суммы, без транша и без даты в
   расчёте. Лист «По датам» такое показать не может в принципе: у него строка на дату и
   раздел на транш, а списание не имело ни того, ни другого.

   СПИСАНИЕ ГАСИТ ОСТАТОК (КВ-62, решение владельца 16.08.2026 — «да гасит»; отменяет
   правило КР-12, по которому оно не гасило ничего). Довод против прежнего правила пришёл
   с листа: у K-6b 15.05.2026 списаны все 58 000, а «Остаток» рядом и итог года печатали
   те же 58 000 — кредит закрыт, начисление остановлено, требовать нечего, и число
   продолжало числиться долгом. Решение о списании — то же движение тела, что перенос и
   платёж: тело уходит С БАЛАНСА кредита. Поэтому «списано» входит ЧЕТВЁРТЫМ вычитаемым
   всюду, где считается тело:
     · trancheBalanceAt (ИР-3) — остаток транша;
     · sbase в trancheAccrual — база отрезка: гасить тело и продолжать на него начислять
       нельзя (у K-6b начисление и так стоит — списание совпадает с закрытием, — но
       правило не должно держаться на этом совпадении);
     · principalBal позиций в buildLedger — а через них ПРОСРОЧКА: списанное не требуют;
     · debt.principal.bal в своде.
   ЧИСЛО ПРИ ЭТОМ НЕ ПРОПАДАЕТ. Списанное — не погашенное: денег заёмщик не принёс, и
   колонка «Погашено» его не получает ни в листе, ни в своде. Оно живёт своей парой
   колонок листа («Списано · Нарастающим») и отдельной строкой свода «Списано за баланс»,
   рядом с «Приостановлено решением суда» и «Спорной пенёй» — тем же приёмом: величина
   названа, в остаток не входит. За балансом долг остаётся долгом заёмщика, и подгруппа
   по-прежнему говорит «безнадёжные долги» — это учёт заёмщика, а не остаток кредита.

   РЕШЕНИЕ СПИСЫВАЕТ ВЕСЬ ДОЛГ, А НЕ ОДНО ТЕЛО (КВ-63, владелец 16.08.2026 — «решение
   списывает весь долг»). КВ-62 сняла с баланса тело и на этом остановилась, и результат
   читался как незавершённое действие: у K-6b тело 0,00, а рядом в том же своде проценты
   14 024,68 и пеня 80 329,51 — на кредите, признанном безнадёжным и закрытом. Долг
   безнадёжен ЦЕЛИКОМ: признание относится к требованию, а не к одной его статье, и
   оставлять проценты с пенёй висеть после решения — значит требовать то, чего решение
   как раз и лишило. Поэтому решение несёт ШЕСТЬ величин по числу статей долга (см.
   DEBT_ARTICLES): тело в `amount`, пять остальных в `articles`. Каждая гасит остаток
   СВОЕЙ статьи тем же приёмом, что тело: отдельное поле позиции (interestWritten,
   penaltyWritten, f._written) рядом с «погашено», вычитание в debtOf, своя колонка листа
   в своём блоке. Сумма всех шести — одна строка свода «Списано за баланс».
   ЧАСТИЧНОЕ РЕШЕНИЕ (ctx.amount) масштабирует ВСЕ статьи одной долей: решение на половину
   тела — это решение на половину долга, а списать всю пеню и половину тела оно не может,
   не назвав, почему статьи разошлись. */
function writeOffsOf(t, d){
  const lim = d ? pd(d) : null;
  return (t.writeOffs || []).filter(x => !lim || pd(x.date) <= lim);
}
function writtenOffAt(t, d){ return round2(writeOffsOf(t,d).reduce((a,x) => a + (x.amount||0), 0)); }
/* списано по НЕТЕЛЕСНОЙ статье (КВ-63). Отдельной функцией, а не полем на транше: решений
   бывает больше одного, и «сколько списано к дате» обязано считаться так же, как у тела. */
function writtenOffArtAt(t, key, d){
  return round2(writeOffsOf(t,d).reduce((a,x) => a + (((x.articles||{})[key])||0), 0));
}

/* Разнесение решения о списании ПО ТРАНШАМ. Решение выносится на кредит одной суммой —
   расчёт же ведётся по траншам, и без разнесения лист не знает, чью строку двигать.
   Правило: пропорционально непогашенному телу транша на дату решения, остаток копеек —
   последнему; сумма не названа в решении ⇒ списывается весь непогашенный долг (КВ-63).

   ДВА РОДА СТАТЕЙ РАЗНОСЯТСЯ ПО-РАЗНОМУ, и это не мелочь показа. Проценты и пеня у
   позиции СВОИ — у леджера они уже лежат в разрезе транша, и делить их пропорцией значило
   бы выдумать разнесение поверх готового: транш, чьи проценты давно погашены, получил бы
   чужую долю. Накопленные и сборы — величины КРЕДИТА (сбор берётся за договор, накопленное
   назначает документ), разреза по траншам у них нет вовсе, и им пропорция — единственный
   способ попасть в транш. Отсюда: interest/penalty берутся у транша, accInterest/accPenalty/
   fees делятся долей тела. Транш попадает в разнесение, если непокрыто ХОТЬ ЧТО-ТО: тело
   могло быть погашено полностью, а пеня на нём — нет, и списывать её всё равно надо. */
function writeOffTranches(credit, ctx){
  const date = ctx.date || TODAY, basis = ctx.doc || null;
  /* непокрытые проценты и пеня В РАЗРЕЗЕ ТРАНША — из тех же позиций леджера, из которых
     их складывает свод: списание обязано снять ровно предъявляемую величину. */
  const led0 = buildLedger(credit, date);
  const perT = new Map((credit.tranches || []).map(t => [t.no, { interest:0, penalty:0 }]));
  for (const r of led0.rows){
    const cell = perT.get(r.trancheNo); if (!cell) continue;
    cell.interest = round2(cell.interest + Math.max(0, round2(r.interestCharged  - r.interestPaid)));
    cell.penalty  = round2(cell.penalty  + Math.max(0, round2(r.penaltyClaimable - r.penaltyPaid)));
  }
  const open = (credit.tranches || []).map(t => {
    const a = perT.get(t.no) || { interest:0, penalty:0 };
    return { t, bal: trancheBalanceAt(credit, t, date), interest:a.interest, penalty:a.penalty };
  }).filter(x => x.bal > 0.005 || x.interest > 0.005 || x.penalty > 0.005);
  if (!open.length) return [];
  const sum   = round2(open.reduce((a, x) => a + x.bal, 0));
  /* ПОТОЛОК — ТЕЛО ПО СВОДУ, а не сумма остатков траншей. Когда это писалось (КВ-53),
     величины расходились законно: остаток транша считал погашенным только разнесённое
     леджером по НАСТУПИВШИМ позициям, свод — весь подтверждённый пул, и у K-C34 разница
     доходила до 23 833,32 — списав по траншам, решение списало бы больше, чем кредит
     должен. КВ-54 свёл обе стороны на платежах (см. trancheBalanceAt), и на сегодняшнем
     сиде потолок не срабатывает ни разу. Он остаётся СТРАХОВКОЙ: свод — единственное
     число, которое кредит предъявляет наружу, и списать больше него нельзя ни при какой
     будущей расстыковке. Доли берём у траншей, величину — у свода. */
  const dd    = debtOf(led0, (credit.tranches || []).reduce((a, t) => a + disbursedSum(t), 0));
  const total = round2(Math.min(sum, dd.principal.bal));
  const want  = (ctx.amount > 0.005 && ctx.amount < total) ? round2(ctx.amount) : total;
  /* ДОЛЯ ЧАСТИЧНОГО РЕШЕНИЯ (КВ-63) — одна на все шесть статей: решение на половину тела
     есть решение на половину долга. Названо решение целиком ⇒ доля 1. */
  const part  = total > 0.005 ? want / total : 1;
  /* делёж величины КРЕДИТА по траншам долей тела; копейки остатка — последнему. Тела нет
     ни у кого (списывают одну пеню) — делим поровну: пропорции взять неоткуда. */
  const split = (v) => {
    let left = round2(v); const outv = [];
    open.forEach((x, i) => {
      const share = (i === open.length - 1) ? round2(Math.max(0, left))
                  : round2(v * (sum > 0.005 ? x.bal / sum : 1 / open.length));
      left = round2(left - share); outv.push(share);
    });
    return outv;
  };
  const shP  = split(want);
  const shAI = split(round2(dd.accInterest.bal * part));
  const shAP = split(round2(dd.accPenalty.bal  * part));
  const shF  = split(round2(dd.fees.bal        * part));
  const made = [];
  open.forEach((x, i) => {
    const amount = shP[i];
    const articles = { interest: round2(x.interest * part), penalty: round2(x.penalty * part),
                       accInterest: shAI[i], accPenalty: shAP[i], fees: shF[i] };
    const all = amount + articles.interest + articles.penalty
              + articles.accInterest + articles.accPenalty + articles.fees;
    if (all <= 0.005) return;
    (x.t.writeOffs || (x.t.writeOffs = [])).push({ date, amount, articles, basis });
    made.push({ trancheNo: x.t.no, amount, articles });
  });
  return made;
}

/* Происхождение транша ВЫВОДИТСЯ (Р-11 / ADR-0001): есть входящий перенос ⇒ транш рождён
   разделением по ДС, иначе — освоением (ADR-0092 §1). Поля на транше нет намеренно: оно
   завело бы второй источник истины рядом с самим переносом и разъехалось бы с ним при
   первой же правке. */
function trancheOrigin(t){ return (t.transfers || []).some(x => x.dir==='in') ? 'разделение' : 'освоение'; }
function originTransfer(t){ return (t.transfers || []).find(x => x.dir==='in') || null; }
function originDs(t){ const x = originTransfer(t); return (x && x.basis && x.basis.ds) || null; }

/* ИР-3 (ADR-0092 §2): остаток тела транша = освоено − погашено − перенесено + принято
   − СПИСАНО (пятое слагаемое, КВ-62). Именно слагаемые, а не «сумма транша минус
   погашенное»: после разделения по ДС сумма транша и его тело — разные величины, и у
   производного транша освоений нет вовсе. Списание встало сюда решением владельца
   16.08.2026 (см. блок «СПИСАНИЕ ТЕЛА» выше): решение о признании долга безнадёжным
   снимает тело с баланса кредита, а не оставляет его висеть.

   ПОГАШЕННОЕ — ПО ПЛАТЕЖАМ, А НЕ ПО ЛЕДЖЕРУ (КВ-54). Прежде слагаемое сворачивалось из
   r.principalPaid, то есть считало погашенным ТОЛЬКО разнесённое по наступившим позициям:
   досрочная переплата в разнесение не попадает вовсе (см. paidPrincipalOfTranche), и
   остаток транша расходился со сводом ровно на неё — у K-C34 на 23 833,32. Пока график
   транша был длинным, расхождение прятала длина: к срезу успевало наступить больше
   позиций, чем заёмщик оплатил. Перестроение графика по ДС (restructureSource) хвост
   обрезает — и на опустошённом переносом транше леджерная версия оставляла ФАНТОМНЫЙ
   остаток из ниоткуда (у K-7 т1 ≈ 4 950 при нуле по своду), то есть ровно легаси-дефект
   E2E-13/14 с копейкой-сиротой. Платёж — факт, разнесение — его прочтение; тело гасят
   деньги. Побочно ИР-3 перестал звать buildLedger: рекурсии «остаток → леджер → график»
   больше нет, и лист может показывать остаток напрямую. */
function trancheBalanceAt(credit, t, d){
  return round2(Math.max(0, disbursedSum(t) - paidPrincipalOfTranche(credit, t, d)
                - transferredOut(t, d) + transferredIn(t, d) - writtenOffAt(t, d)));
}
/* активен ли интервал приостановки начисления на дату среза (Р-17) */
function holdIsActive(h, asOf){
  if (!h || !h.from) return false;
  const lim = pd(asOf || TODAY);
  if (pd(h.from) > lim) return false;
  return !h.to || pd(h.to) >= lim;
}
/* ---- ПОСЛАБЛЕНИЯ (ADR-0012) ----
   Послабление — запись со сроком и основанием, СНИМАЮЩАЯ последствие просрочки.
   Прежняя реализация опознавала подавление 181-го дня регуляркой /181/ по свободному
   тексту основания приостановки начисления (КР-15): «Постановление 181-ФЗ» включало бы
   послабление ложно. И срока у него не было — булев флаг вместо записи, тогда как
   CONTEXT.md требует, чтобы послабление «действовало в свой срок». */
function reliefActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.relief || []).filter(r => r && r.from && pd(r.from) <= lim
    && (!r.deadline || pd(r.deadline) >= lim));
}
function relief181(c, asOf){ return reliefActive(c, asOf).find(r => r.kind === 'suppress181') || null; }

/* ---- ФАКТОРЫ КАТЕГОРИИ (ADR-0012) ----
   Второй вход worst-of вместо несуществовавшей «группы риска A/B/C/D». Фактор без
   ссылки на решение комитета НЕ действует (инвариант И-1 модуля заёмщика): категорию
   нельзя «настроить» — за каждым ужесточением стоит документ. */
function factorsActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.factors || []).filter(f => f && f.committeeRef && f.from && pd(f.from) <= lim
    && (!f.to || pd(f.to) >= lim));
}

/* ---- 3.1 buildSchedule(tranche, fromDate) — амортизация от фактической даты освоения ----
   Возврат: {rows:[{no,date,total,principal,interest,accrued}]}, где accrued — НАЧИСЛЕННЫЕ
   за период проценты (могут отличаться от interest в льготе по процентам).

   ТРИ ЛЬГОТЫ — три разных механизма (КР-13; до этой волны graceAccrual не читался
   движком вовсе, а graceInterest выполнял его работу):
     graceMain     — основной долг не гасится, проценты платятся;
     graceAccrual  — проценты НЕ НАЧИСЛЯЮТСЯ вовсе (отсрочка начисления);
     graceInterest — проценты начисляются, но НЕ ПЛАТЯТСЯ; накопленное раскладывается
                     равными долями по оставшимся периодам.
   Льготы заданы в МЕСЯЦАХ, а период платежа может быть длиннее месяца — переводим
   в периоды с округлением вверх (льгота не должна «съедаться» длинным периодом).

   ПЕРИОДИЧНОСТЬ (freq) тоже начинает работать (КР-13): число платежей = срок / длина
   периода, ставка за период = годовая × месяцев в периоде / 12. Прежний движок всегда
   строил помесячно, и правка «ежеквартально» не меняла ничего.

   Приостановка начисления (t.accrualHold — зеркало credit.accrualHold: holdAccrual
   пишет интервал в кредит и зеркалит на каждый транш, т.к. сюда приходит только транш)
   обнуляет начисление процентов за период; пеня при паузе не затрагивается. */
const FREQ_MONTHS = { 'ежемесячно':1, 'ежеквартально':3, 'раз в полгода':6, 'ежегодно':12 };
function freqMonths(f){ return FREQ_MONTHS[f] || 1; }

/* ============================================================
   ПЛАН КРЕДИТА (ADR-0042) — единственная ВВОДИМАЯ величина среди трёх ориентиров.
   График — контракт транша. Прогноз — текущее ожидание, выводится. План — что сами
   себе поставили целью на месяц: хранится, потому что относится к ПРОШЛОМУ решению,
   а не к текущему состоянию долга. Если бы план пересчитывался вслед за прогнозом,
   % исполнения плавал бы от досрочного погашения по чужому траншу того же кредита,
   хотя ни план, ни факт в этом месяце не менялись. Неподвижность и есть его смысл.
   Три сущности друг на друга НЕ ссылаются (ADR-0042 §4).
   Месяц везде — строка 'YYYY-MM': сравнивается лексикографически, без Date.
   ============================================================ */
const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь',
                   'июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function monthKey(dateStr){                       // '14.08.2026' -> '2026-08'
  const d = pd(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthLabel(mk){                          // '2026-08' -> 'август 2026'
  const [y, m] = String(mk || '').split('-');
  return (MONTHS_RU[(+m) - 1] || '—') + ' ' + y;
}
function monthAdd(mk, k){
  const [y, m] = String(mk).split('-').map(Number);
  const t = (y * 12 + (m - 1)) + (k | 0);
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
function monthRange(fromMk, toMk){
  const out = [];
  if (!/^\d{4}-\d{2}$/.test(String(fromMk)) || !/^\d{4}-\d{2}$/.test(String(toMk))) return out;
  for (let mk = fromMk; mk <= toMk; mk = monthAdd(mk, 1)){ out.push(mk); if (out.length > 240) break; }
  return out;
}

/* Строка плана месяца. amount === null — план СНЯТ (И-14: снятие не удаление,
   строка остаётся видимой, прежнее значение уходит в history). */
function planRowOf(credit, mk){
  return ((credit && credit.plan) || []).find(p => p.month === mk) || null;
}
function planAmountOf(credit, mk){
  const r = planRowOf(credit, mk);
  return r && r.amount != null ? r.amount : null;
}

/* freq==='по конкретным месяцам' (Шаг 18, Q6): payMonths хранится и версионируется
   как условие, но график по нему НЕ строится — движок падает на freqMonths()||1
   (помесячно). Это не пропуск: сама программа (renderTab6, R19) при этом режиме
   принудительно переключает метод погашения на «Индивидуальный» — то есть график
   для него не формула, а ручной ввод, и donor-модель не даёт, от чего вести расчёт
   при неравных промежутках между месяцами. Решать наравне с производственным
   календарём (открытый вопрос §10.5), не изобретая формулу молча. */
/* НАЧИСЛЕНИЕ ЗА ОДИН ПЕРИОД — единственная реализация правила (решение 5 разбора
   «Прогноза», 10.08.2026). Знает ровно три вещи, которые обязаны знать оба потребителя:
   день-базу (dayMethod), паузу начисления (accrualHold, Р-17) и ставку на дату.
   Зовут двое: buildSchedule строит КОНТРАКТ, trancheForecastRows — ОЖИДАНИЕ по нему.
   Пока реализаций было две, прогноз не знал ни пауз, ни день-базы и считал плоским
   rate/12·mpp: на кредите с приостановкой начисления он обещал проценты, которых
   движок не начислит, — и расходился с «Расчётами» ровно там, где на него смотрят. */
/* daysOverride — число дней, назначенное СНАРУЖИ (ADR-0128 §1): отрезок знает свою долю
   периода, а движок её вывести не может. Нужен из-за финансового числителя: при '30/…'
   период стоит ровно 30×mpp дней независимо от календаря, и три отрезка, каждый
   посчитавший себе 30×mpp, дали бы тройное начисление. Вызовам без него ничего не
   меняет — buildSchedule и прогноз считают периодом, как считали. */
function periodInterest(tranche, cnd, prevDate, date, bal, mpp, daysOverride){
  const paused = ((tranche && tranche.accrualHold) || []).some(h => h && h.from &&
    pd(h.from) <= date && (!h.to || pd(h.to) >= date));
  if (paused || !((cnd.rate || 0) > 0) || bal <= 0.005) return 0;
  const db = dayBasis(cnd.dayMethod, date);
  const days = daysOverride != null ? daysOverride
             : (db.numFin ? 30 * mpp : Math.max(0, dd(prevDate, date)));
  return round2(bal * (cnd.rate || 0) / 100 * days / db.base);
}

/* СТАТЬИ СТРОКИ ГРАФИКА (ADR-0109, КВ-26). Реструктуризация раскладывает по графику не
   только тело: накопленные проценты, накопленную пеню и распределённое. Ставка при этом
   начисляется ТОЛЬКО по основному долгу — поэтому статьи держатся отдельным вложенным
   объектом, а не подмешиваются в r.principal (он авторитетен для леджера и прогноза).
   Порядок реестра = очередь погашения: что гасится раньше, стоит левее. */
const SCHED_ARTICLES = [
  { key:'accInterest', label:'Накопленные проценты' },
  { key:'accPenalty',  label:'Накопленная пеня' },
  { key:'other',       label:'Прочее' }
];
function rowArticlesSum(r){
  const a = r && r.articles; if (!a) return 0;
  return round2(SCHED_ARTICLES.reduce((s,x) => s + (a[x.key] || 0), 0));
}
/* Состав НЕПУСТЫХ статейных колонок. Пустая не рисуется — та же идиома, что «Курс / ≈KGS»
   у валютных: обычный кредит обязан выглядеть ровно как до волны. */
function scheduleArticleCols(rows){
  return SCHED_ARTICLES.filter(x => (rows||[]).some(r => r.articles && (r.articles[x.key]||0) > 0.005));
}
/* Раскладка безставочной части по позициям интервала [from..to] равными долями; остаток
   от округления — в последнюю позицию интервала, иначе Σ колонок разъедется с суммой
   переноса и плашка ИР-2′ соврёт (ИР-2′ мерится в копейку, порог 0,005). */
function spreadArticles(rows, parts){
  (parts || []).forEach(p => {
    const seg = (rows||[]).filter(r => r.no >= (p.from||1) && r.no <= (p.to || rows.length));
    if (!seg.length) return;
    const per = round2((p.amount || 0) / seg.length);
    let acc = 0;
    seg.forEach((r,i) => {
      const v = i === seg.length-1 ? round2((p.amount||0) - acc) : per;
      acc = round2(acc + v);
      r.articles = r.articles || {};
      r.articles[p.key] = round2((r.articles[p.key] || 0) + v);
      r.total = round2((r.total || 0) + v);      // «Платёж» = то, что человек платит в эту дату
    });
  });
  return rows;
}

/* ГРАНИЦЫ ОТРЕЗКОВ ВНУТРИ ПЕРИОДА ГРАФИКА (ADR-0130 §2) — даты вступления записей
   условий, попавшие СТРОГО внутрь периода. Платежей и освоений здесь нет намеренно:
   график — контракт, он их не знает; их берёт на себя отклонение отрезка (trancheAccrual),
   и общая сетка расчёта (ADR-0129 §1) от этого не рвётся. */
function condMarksIn(tranche, from, to){
  const set = new Set();
  for (const r of ((tranche && tranche.conditionRecords) || [])){
    if (!r.effectiveFrom) continue;
    const d = pd(r.effectiveFrom);
    if (d > from && d < to) set.add(+d);
  }
  return [...set].sort((a, b) => a - b).map(ms => new Date(ms));
}
/* НАЧИСЛЕНИЕ ЗА ПЕРИОД ПОЗИЦИИ — ПО ОТРЕЗКАМ УСЛОВИЙ (ADR-0130 §2). Дни до даты вступления
   считаются по прежнему комплекту, дни после — по новому, внутри одной позиции. Ровно так
   считает лист «По датам» (ADR-0128 §1), поэтому свод и лист сходятся по построению.
   Финансовый числитель ('30/…') делится по календарной доле отрезка — как в trancheAccrual:
   иначе каждый отрезок засчитал бы себе целый период.
   floor — нижняя граница условий (дата первой записи): левее неё комплекта нет вовсе, и
   conditionsAt вернул бы пустой (ставка 0). */
function periodInterestByCond(tranche, prevDate, date, bal, mpp, floor){
  const marks = [prevDate, ...condMarksIn(tranche, prevDate, date), date];
  const perDays = Math.max(0, dd(prevDate, date));
  let sum = 0;
  for (let k = 0; k < marks.length - 1; k++){
    const a = marks[k], b = marks[k + 1];
    const at  = (floor && a < floor) ? floor : a;
    const cnd = conditionsAt(tranche, fd(at));
    const days = Math.max(0, dd(a, b));
    const dOver = dayBasis(cnd.dayMethod, b).numFin
      ? (perDays > 0 ? 30 * mpp * days / perDays : 0) : days;
    sum = round2(sum + periodInterest(tranche, cnd, a, b, bal, mpp, dOver));
  }
  return round2(sum);
}

function buildSchedule(tranche, fromDate, opts){
  /* УСЛОВИЯ — НА НАЧАЛО ВЕРСИИ, А НЕ НА ДАТУ СРЕЗА (КР-62, ADR-0130 §1). Снимок
     conditionsAt(tranche, TODAY) красил сегодняшним комплектом ВЕСЬ срок: доп. соглашение
     применялось задним числом (против Г-19 — раньше даты заключения оно не действует), а
     от решения суда, которое задним числом действовать МОЖЕТ, не отличалось никак.
     Носитель ретро-правки — версия графика (КВ-26): ДС открывает новую версию с даты
     вступления, суд/постановление — версию, перестроенную с начала срока. Здесь остаётся
     правило: конструктивные величины (срок, периодичность, метод, льготы, день платежа,
     ставка аннуитета) берутся на дату, ОТ КОТОРОЙ строится версия.
     Нижняя граница — дата первой записи условий: в сиде есть графики, начинающиеся раньше
     первичного комплекта (K-C14), и conditionsAt отдал бы им пустой комплект — одну
     позицию и нулевую ставку. Та же нижняя граница, что у отрезков (trancheAccrual). */
  const firstCr = ((tranche && tranche.conditionRecords) || []).reduce((m, r) =>
    (r.effectiveFrom && (!m || pd(r.effectiveFrom) < pd(m)) ? r.effectiveFrom : m), null);
  const floor = firstCr ? pd(firstCr) : null;
  const at0   = (floor && pd(fromDate) < floor) ? floor : pd(fromDate);
  const c = conditionsAt(tranche, fd(at0));      // Р-21: условия транша — производное от записей
  /* БАЗА ВЕРСИИ (ADR-0130 §1). По умолчанию — освоенный ОД: так строится ПЕРВАЯ версия, от
     даты освоения. Перестроение середины срока обязано вести амортизацию от ОСТАТКА тела, а
     не от всей выданной суммы, иначе новая версия заново гасит уже погашенное. Остаток
     считает вызывающий (generateSchedule знает кредит и платежи) и передаёт сюда opts.base:
     сам транш вывести его не может — погашенное живёт в леджере кредита, и обращение к нему
     отсюда замкнуло бы buildLedger → trancheScheduleRows → buildSchedule в кольцо. */
  const P = (opts && opts.base != null) ? opts.base
          : (disbursedSum(tranche) || tranche.amount || 0);
  const mpp = freqMonths(c.freq);                                // месяцев в периоде платежа
  const termM = Math.max(1, c.term | 0);                         // срок, мес.
  const n = Math.max(1, Math.ceil(termM / mpp));                 // число ПЛАТЕЖЕЙ
  const i = (c.rate || 0) / 100 / 12 * mpp;                      // ставка за период
  const method = c.method || 'аннуитет';
  const gMainP = Math.ceil(Math.max(0, c.graceMain | 0) / mpp);       // льгота по ОД, периодов
  const gAccrP = Math.ceil(Math.max(0, c.graceAccrual | 0) / mpp);    // отсрочка начисления, периодов
  const gIntP  = Math.ceil(Math.max(0, c.graceInterest | 0) / mpp);   // льгота по %, периодов
  /* Шаг 18 (Q5): окно распределения отсроченных % — по умолчанию (0/0, как у всех
     59 демо-кредитов до этого шага) поведение не меняется — распределяем по ВСЕМ
     периодам после льготы, как раньше. Заданное окно [from,to] сужает распределение;
     непопавшее в окно копится и — как и раньше — гасится последним платежом (ниже). */
  const gIntDistFrom = (c.graceIntDistFrom | 0) > 0 ? (c.graceIntDistFrom | 0) : (gIntP + 1);
  const gIntDistTo   = (c.graceIntDistTo   | 0) > 0 ? (c.graceIntDistTo   | 0) : n;
  const start = pd(fromDate);
  /* Шаг 18 (Q1/Q2): день платежа (payDay) и привязка последнего платежа
     (lastPaymentAnchor) — по умолчанию (payDay=0, anchor='по дате выдачи') поведение
     совпадает с прежним: день — из даты освоения, даты — n периодов от неё же.
     «По дате 1-го платежа» считает от даты 1-го платежа (firstPay), а не от даты
     выдачи (Q2, разбор в шапке файла — из сверки с loan-program.html renderTab6). */
  const payDay = (c.payDay | 0) >= 1 && (c.payDay | 0) <= 31 ? (c.payDay | 0) : null;
  const anchorFirst = c.lastPaymentAnchor === 'по дате 1-го платежа';
  const firstPay = addM(start, mpp, payDay);
  const principalPeriods = Math.max(1, n - gMainP);              // периодов гашения ОД после льготы
  const annuity = (i > 0)
    ? P * i / (1 - Math.pow(1 + i, -principalPeriods))
    : P / principalPeriods;
  const diffPrincipal = P / principalPeriods;
  const rows = [];
  let bal = P, deferred = 0, deferredPer = 0;                    // deferred — отложенные проценты (graceInterest)
  let prevDate = start;
  for (let k = 1; k <= n; k++){
    const date = anchorFirst
      ? (k === 1 ? firstPay : addM(firstPay, (k - 1) * mpp, payDay))
      : addM(start, k * mpp, payDay);
    /* Шаг 19: реальные начисленные % считаются по дням (dayMethod), а не по номинальной
       ставке периода `i`. `i` остаётся структурной — ею размечается величина взноса
       (аннуитет/дифф.), как и раньше: платёж не «плавает» от длины месяца. Расхождение
       между `i`-долей и реальным `accrued` — обычная практика факт/365-аннуитета:
       тело взноса фиксировано формулой, начисленные % — по факту дней.
       День-база и пауза начисления ушли в periodInterest — общее ядро с прогнозом.
       ADR-0130 §2: период, разрезанный датой вступления записи условий, считается ПО
       ОТРЕЗКАМ — дни до неё по прежней ставке, дни после по новой. Одна позиция при этом
       остаётся одной позицией: дробится начисление, а не график. */
    const accrued = (k <= gAccrP) ? 0 : periodInterestByCond(tranche, prevDate, date, bal, mpp, floor);
    prevDate = date;
    let interest;
    if (k <= gIntP){ deferred = round2(deferred + accrued); interest = 0; }   // начислено, но не платится
    else if (k >= gIntDistFrom && k <= gIntDistTo){
      if (deferredPer === 0 && deferred > 0) deferredPer = round2(deferred / Math.max(1, gIntDistTo - gIntDistFrom + 1));
      const add = Math.min(deferredPer, deferred);
      deferred = round2(deferred - add);
      interest = round2(accrued + add);
    }
    else interest = accrued;                                          // вне окна распределения: копится, не гасится этим платежом
    let principal;
    if (k <= gMainP) principal = 0;                                          // льгота по ОД: только проценты
    else if (method === 'в конце срока') principal = (k === n ? round2(bal) : 0);
    else if (method === 'равными долями' || method === 'дифференцированный') principal = round2(diffPrincipal);
    else principal = round2(annuity - bal * i);                              // аннуитет: ОД = платёж − проценты
    if (k === n){
      principal = round2(bal);                                               // последний период гасит остаток
      if (deferred > 0){ interest = round2(interest + deferred); deferred = 0; }   // и остаток отложенных %
    }
    principal = Math.max(0, Math.min(principal, bal));
    bal = round2(bal - principal);
    rows.push({ no:k, date:fd(date), total:round2(principal + interest), principal, interest, accrued });
  }
  /* Безставочные статьи транша (ADR-0109, КВ-26) раскладываются ЗАНОВО при каждом
     построении: движок амортизирует только тело, и без этой строки статьи, пришедшие
     приложением к ДС, исчезали бы по нажатию «Сформировать график». База (articleBase)
     принадлежит траншу и пишется дверью restructureApplied — она же единственный, кто
     её заводит; перестроение её только читает. */
  if (tranche && (tranche.articleBase || []).length) spreadArticles(rows, tranche.articleBase);
  return { rows };
}

/* ---- ДЕЙСТВУЮЩАЯ ВЕРСИЯ ГРАФИКА (КВ-26) ----
   Флага active больше нет: он разъезжался с ДС, у которого дата вступления в будущем —
   версия уже записана, но действовать ещё не должна, а флаг этого различить не мог.
   Идиома та же, что conditionsAt / subjectAt / derive: спрашиваем СРЕЗ, а не флаг.
   validFrom — начало действия версии; generatedFrom («от какой даты строим») и
   generatedAt («когда построена», гасит плашку Д-5) остаются раздельными: путать
   начало действия с датой построения нельзя. */
function schedValidFrom(s){ return s.validFrom || s.generatedFrom; }
function scheduleAt(t, d){
  const lim = pd(d || TODAY);
  const list = (t.schedules || []).filter(s => pd(schedValidFrom(s)) <= lim)
    .sort((a,b) => pd(schedValidFrom(a)) - pd(schedValidFrom(b)) || (a.ver||0) - (b.ver||0));
  return list.length ? list[list.length-1] : null;
}
/* Конец действия версии — день ДО начала следующей; null = «по сей день». */
function validTo(t, ver){
  const key = s => pd(schedValidFrom(s));
  const nx = (t.schedules || []).filter(s => key(s) > key(ver)).sort((a,b) => key(a) - key(b))[0];
  if (!nx) return null;
  const d = new Date(key(nx)); d.setDate(d.getDate() - 1);
  return fd(d);
}
/* Ближайшая ещё не вступившая версия (КВ-27): ДС подписан с отложенной датой, версия
   записана, но действует прежняя — и таблица позиций показывает НЕ то, что в соглашении.
   Единственный факт, который меняет чтение вкладки, поэтому выводится отдельно. */
function schedFuture(t, asOf){
  const lim = pd(asOf || TODAY);
  return (t.schedules || []).filter(s => pd(schedValidFrom(s)) > lim)
    .sort((a,b) => pd(schedValidFrom(a)) - pd(schedValidFrom(b)))[0] || null;
}
/* ВЕРСИЯМ ЕСТЬ ЧТО СКАЗАТЬ? (КВ-27) Грид версий стоял на «Графике» безусловно и у обычного
   кредита нёс ровно одну строку — «v1, построена в день освоения, основание „перестроение“»,
   то есть повторял дату первой позиции таблицы под собой и больше ничего. Правило волны:
   элемент появляется, когда несёт факт. Это грамматика самой вкладки — так же ведут себя
   панель годов (multiYear), плашка ИР-2′ и статейные колонки (ADR-0109).
   Факт есть, если: версий больше одной (было перестроение) · версия рождена ДС (её строки
   ПРИШЛИ из приложения, а не посчитаны движком) · записана будущая (на экране график не по
   подписанному соглашению) · версия построена не в день начала действия (тогда «построена»
   — самостоятельная величина, по ней гаснет Д-5).
   Отвергнуто: рисовать всегда — воспроизводит ровно тот дефект, который волна лечит. */
function schedNeedsContext(t, asOf){
  const list = (t && t.schedules) || [];
  if (list.length > 1) return true;
  if (list.some(s => (s.by || {}).kind === 'ДС')) return true;
  if (schedFuture(t, asOf)) return true;
  return list.some(s => s.generatedAt && s.generatedAt !== schedValidFrom(s));
}

/* строки действующей версии графика транша; если версии нет, но точка отсчёта есть —
   строим на лету (для scheduleTotals/fullRepayDate) */
function trancheScheduleRows(t){
  const active = scheduleAt(t, TODAY);
  if (active && active.rows && active.rows.length) return active.rows;
  const disb = (t.disbursements || []).slice().sort((a,b) => pd(a.date) - pd(b.date))[0];
  /* У производного транша освоений нет — точка отсчёта берётся от даты вступления ДС
     (ADR-0092 §1), иначе «Расчёты» показывали бы ему пустой график навсегда. */
  const inTr = originTransfer(t);
  const from = disb ? disb.date : (inTr ? inTr.date : null);
  return from ? buildSchedule(t, from).rows : [];
}

/* фактически погашенное ТЕЛО транша — по ПЛАТЕЖАМ, а не по позициям графика.
   buildLedger разносит деньги только по НАСТУПИВШИМ позициям (фильтр `> lim` в нём), и
   досрочная переплата в его index не попадает вовсе: прогноз, бравший базу из index,
   досрочного погашения НЕ ВИДЕЛ — ровно того события, ради которого вкладка заведена.
   Транш берётся с платежа (ADR-0060 §2: транш называет строка разнесения); платёж без
   транша к телу транша не относится (Д-12). */
function paidPrincipalOfTranche(c, t, asOf){
  const lim = pd(asOf || TODAY);
  let s = 0;
  for (const p of ((c && c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p)) continue;
    if (p.date && pd(p.date) > lim) continue;
    if ((p.tranche | 0) !== t.no) continue;
    s += (p.layers && p.layers.principal) || 0;
  }
  return round2(Math.min(s, disbursedSum(t) || t.amount || 0));
}

/* НАЧИСЛЕНИЕ НА ФАКТИЧЕСКОЕ ТЕЛО (ADR-0105) — поправка, общая графику, расчёту и прогнозу.
   График начисляет на СВОЮ базу: он считает, что к позиции k тело погашено ровно на
   Σ контрактных долей до неё. Когда заёмщик недобрал, тело у него на руках, и проценты
   по договору бегут на него; когда внёс досрочно — база меньше контрактной. Прежняя
   модель ни того, ни другого не знала: buildLedger брал interestDue прямо из строки
   графика, а прогноз вычитал просроченное тело из базы НАЧИСЛЕНИЯ вместе с базой
   амортизации — и повторял график строка в строку ровно на просроченном кредите.

   Величина отклонения на начало периода: dev = (контрактно погашено к периоду) −
   (погашено платежами). dev > 0 — недобор, dev < 0 — досрочка. periodInterest линеен
   по базе (bal · ставка · дни / база), поэтому начисление на фактический остаток
   раскладывается ТОЧНО: %(факт) = %(контракт) + %(dev). Отсюда правка аддитивна —
   льготы, отсрочка и распределение отложенных процентов остаются в buildSchedule и не
   переписываются. Где контракт не начислял (отсрочка начисления, пауза Р-17, нулевая
   ставка) — не начисляет и на отклонение: периода начисления там нет вовсе.

   Горизонт правила — график: после последней позиции начислять не на чем (ADR-0010,
   начисленное выводится из графика). Непокрытый хвост за границей графика процентами
   больше не обрастает — новые сроки назначает только перестроение (ADR-0104 §5).
   Платежи после даты среза в базу не входят: срез не знает будущего. */

/* КРИТИЧЕСКИЕ ДАТЫ КРЕДИТА (ADR-0129 §1) — даты, на которых расчёт меняется. Правило
   выводимое, перечня видов нет (ADR-0128 §2), и новый вид события получает дату сам:
     • освоение — тело выросло (disbursedTo);
     • засчитанный платёж — упало тело своего транша и база пени всего кредита
       (очередь погашения общая, ADR-0060 §4);
     • запись условий с датой вступления — сменилась ставка, день-база или ставка пени (Р-21);
     • начало и конец приостановки — periodInterest проверяет паузу по КОНЦУ отрезка,
       поэтому днём границы берётся from−1 (день начала паузы уходит уже в паузу) и сам
       to (день снятия — последний оплаченный паузой);
     • наступление позиции графика — просроченного стало больше, база пени выросла;
     • решение суда — с его даты пеня на присуждённое не бежит (ADR-0060 §3);
     • границы окна спора — пеня внутри окна вычислена, но в требование не входит;
     • 1 января — сменился делитель года (365/366) и годовой итог листа (КВ-45, ниже).

   СЕТКА ОДНА НА ВЕСЬ РАСЧЁТ (ADR-0129 §1). Прежде границы считались по каждой позиции
   отдельно и только по событиям СВОЕГО транша: процентам этого хватало, пене — нет.
   Общая сетка нужна затем, чтобы проценты и пеня считались на одних и тех же отрезках:
   иначе свод и лист «По датам» печатали бы два разных числа одной величины. */
function calcGrid(c, asOf){
  const lim = pd(asOf || TODAY);
  const set = new Set();
  const add = (ds, shift) => {
    if (!ds) return;
    const d = new Date(pd(ds));                      // копия: pd() на Date идемпотентна
    if (shift) d.setDate(d.getDate() + shift);
    if (d <= lim) set.add(+d);
  };
  for (const t of (c.tranches || [])){
    for (const x of (t.disbursements || [])) add(x.date);
    for (const r of (t.conditionRecords || [])) add(r.effectiveFrom);
    for (const h of (t.accrualHold || [])){ add(h.from, -1); add(h.to); }
    /* Перенос и списание — критические даты наравне с освоением (КВ-53): в обоих телo
       транша меняется без единого платежа, и строки под эту дату у листа не было. У K-7
       обе даты попадали в сетку случайно — записью условий того же ДС; у транша-приёмника
       и у списания совпадения нет, и событие оставалось за пределами расчёта. */
    for (const x of (t.transfers || [])) add(x.date);
    for (const w of (t.writeOffs  || [])) add(w.date);
    for (const r of trancheScheduleRows(t)) add(r.date);
  }
  for (const p of ((c && c.mirror && c.mirror.payments) || []))
    if (paymentCounts(p)) add(p.date);
  for (const L of courtLayersOf(c, fd(lim))) add(L.date);
  for (const w of disputeWindows(c)){ add(w.from); add(w.to); }
  /* ГРАНИЦА ГОДА — 1 ЯНВАРЯ (КВ-45). Единственная критическая дата, которую кредит не
     порождает событием: её ставит календарь. Причин две, и хватило бы каждой.
     (1) ДЕЛИТЕЛЬ. При базе «факт» число дней в году берётся по году КОНЦА отрезка
     (periodInterest: dayBasis(cnd.dayMethod, date)). Отрезок, перешагнувший Новый год,
     считался весь по делителю следующего года — декабрьские дни високосного соседа
     делились на 366, и наоборот. Граница разводит их по своим годам.
     (2) ГОДОВОЙ ИТОГ. Лист «По датам» группирует строки по году даты строки: без
     границы отрезок 20.12→20.01 целиком ложился в декабрь, и январские проценты
     попадали в итог прошлого года — а годовой итог читают как «начислено за год».
     Правило действует при ЛЮБОМ методе дней: 30/360 от делителя не страдает, но сетка
     обязана быть одна на весь расчёт (§1 ADR-0129), иначе проценты и пеня разъедутся.
     Отрезка нулевой длины не возникает: дата уже критическая — Set её схлопнет.
     Ниже первой даты кредита границы не ставим (firstY + 1): до неё считать нечего. */
  if (set.size){
    const firstY = new Date(Math.min(...set)).getFullYear();
    for (let y = firstY + 1; y <= lim.getFullYear(); y++) add(new Date(y, 0, 1));
  }
  return [...set].sort((a, b) => a - b).map(ms => new Date(ms));
}

/* Границы отрезка внутри периода позиции — та же сетка, обрезанная периодом. Концы
   периода не повторяются: их ставит сама позиция. */
function segmentBounds(grid, from, to){
  return (grid || []).filter(d => d > from && d < to);
}

/* СОБЫТИЯ КРИТИЧЕСКОЙ ДАТЫ (ADR-0129 §1) — чем эта дата открыла отрезок. Событий на одну
   дату бывает несколько (платёж в день наступления позиции), отрезок при этом ОДИН, и
   строка листа называет все перечислением: дробить её по событиям значило бы завести
   отрезки нулевой длины.
   Первичный комплект условий событием НЕ считается: он датирован договором и ничего не
   меняет — им расчёт начинается. Платёж по ЧУЖОМУ траншу событие даёт, но без движения:
   тело этого транша он не двигает, а базу пени — двигает, очередь общая (ADR-0060 §4). */
function calcEventsAt(c, t, ds){
  const out  = [];
  const same = (x) => !!x && fd(pd(x)) === ds;
  for (const x of (t.disbursements || [])) if (same(x.date))
    out.push({ kind:'disb', label:'освоение', amount:round2(x.amount || 0) });
  /* «СРОК ПО ГРАФИКУ», не «позиция» (КВ-46). «Позиция» — жаргон модели: в шапках экрана
     его нет ни на «Графике», ни в реестре («№ · Дата · Тело по графику»). Слово «платёж» в
     ярлык не берётся намеренно — в этой же колонке им зовутся ДЕНЬГИ от заёмщика (kind
     'pay'), и план с фактом слились бы первым словом. */
  for (const r of trancheScheduleRows(t)) if (same(r.date))
    out.push({ kind:'pos', label:'срок по графику №' + r.no, amount:0 });
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p) || !same(p.date)) continue;
    const own = (p.tranche | 0) === t.no, L = p.layers || {};
    out.push({ kind:'pay', amount: own ? -round2(L.principal || 0) : 0,
      label:'платёж' + (p.num ? ' №' + p.num : '') + (own ? '' : ' по траншу №' + (p.tranche | 0)) });
  }
  const prim = (t.conditionRecords || []).find(r => (r.basis || {}).kind === 'application');
  const primFrom = prim ? fd(pd(prim.effectiveFrom)) : null;
  const chg = (t.conditionRecords || []).filter(r => same(r.effectiveFrom) && ds !== primFrom);
  if (chg.length) out.push({ kind:'cond', amount:0, label:'условия: ' +
    [...new Set(chg.map(r => (PARAMS.find(p => p.key === r.param) || {}).label || r.param))].join(', ') });
  for (const h of (t.accrualHold || [])){
    if (h.from){ const d = new Date(pd(h.from)); d.setDate(d.getDate() - 1);
      if (fd(d) === ds) out.push({ kind:'hold', amount:0, label:'приостановка начисления с ' + h.from }); }
    if (same(h.to)) out.push({ kind:'hold', amount:0, label:'конец приостановки' });
  }
  for (const L of courtLayersOf(c, ds)) if (same(L.date))
    out.push({ kind:'court', amount:0, label:'решение суда' + (L.il ? ' · ' + L.il : '') });
  /* ПЕРЕНОС И СПИСАНИЕ (КВ-53) — два движения тела БЕЗ денег, и до этой правки лист молчал
     о них обоих. У K-7 строка 01.05.2026 стояла с пустым списком событий, хотя в эту дату
     из транша ушло 200 000: читатель видел дату, у которой ничего не случилось.
     Знак — по направлению: тело ушло ⇒ минус, пришло ⇒ плюс. Ярлык называет ВСТРЕЧНЫЙ
     транш и основание: перенос не имеет смысла без второй половины операции. */
  for (const x of (t.transfers || [])) if (same(x.date))
    out.push({ kind:'move', amount: (x.dir === 'out' ? -1 : 1) * round2(x.amount || 0),
      label:(x.dir === 'out' ? 'перенос в транш №' : 'принято из транша №') + x.counterTranche
            + ((x.basis || {}).ds ? ' по ' + x.basis.ds : '') });
  for (const w of (t.writeOffs || [])) if (same(w.date))
    out.push({ kind:'off', amount: 0,
      label:'списание' + ((w.basis || {}).num ? ' · ' + w.basis.kind + ' ' + w.basis.num : '') });
  /* Граница года (КВ-45). Событие есть всегда, когда дата критическая: строка листа обязана
     назвать, ПОЧЕМУ отрезок разорван — иначе читатель ищет несуществующее движение.
     Ярлык называет делитель, который с этой даты действует: при базе «факт» он и есть
     причина разрыва (365 ↔ 366), при 360 и 365 — просто подтверждает неизменность.
     Событие последнее в списке: на 1 января бывает и платёж, и позиция графика. */
  if (ds.slice(0, 6) === '01.01.')
    out.push({ kind:'year', amount:0,
      label:'граница года · день-база ' + dayBasis(conditionsAt(t, ds).dayMethod, pd(ds)).base });
  return out;
}

function trancheAccrual(c, t, asOf, grid){
  const out  = new Map();
  const rows = trancheScheduleRows(t);
  if (!rows.length) return out;
  const lim  = pd(asOf || TODAY);
  /* сетка критических дат — одна на кредит; передаётся снаружи, когда вызывающий уже
     её построил (buildLedger строит одну на все транши) */
  const gr   = grid || calcGrid(c, fd(lim));
  const disb = (t.disbursements || []).slice().sort((a, b) => pd(a.date) - pd(b.date))[0];
  const full = disbursedSum(t) || t.amount || 0;     // база, которую амортизирует контракт
  /* НИЖНЯЯ ГРАНИЦА УСЛОВИЙ. conditionsAt до первой записи возвращает пустой комплект —
     ставка 0. Позиция этим не страдала: её дата всегда позже первичного комплекта. У
     отрезка начало периода может лежать РАНЬШЕ даты договора (K-C14: график с 21.01.2026,
     первичный комплект с 05.02.2026), и отрезок молча получал нулевую ставку. Условия
     берём на начало отрезка, но не раньше первичного комплекта: до него договора нет,
     а начисление уже идёт — по тому же комплекту, что и весь период (ADR-0128 §1). */
  const cnd0 = (t.conditionRecords || []).reduce((m, r) =>
    (r.effectiveFrom && (!m || pd(r.effectiveFrom) < pd(m)) ? r.effectiveFrom : m), null);
  /* НАЧАЛО ПЕРВОГО ПЕРИОДА (КВ-54). У обычного транша это дата освоения: деньги ушли
     заёмщику, с них и бегут проценты. У производного освоения нет — тело пришло ПЕРЕНОСОМ
     по ДС, и дата приёма для него ровно то же событие. Прежде начало брали у первой
     позиции, а она наступает позже вступления ДС (K-7 т2: принято 01.05.2026, график с
     15.06.2026): период получался нулевой длины, отрезка под ним не было, и 45 дней между
     приходом тела и первой позицией не начислял НИКТО — при том что у соседа-донора те же
     дни продолжали начисляться на уже ушедшее тело. */
  const inTr   = originTransfer(t);
  const start0 = [disb ? pd(disb.date) : null, inTr ? pd(inTr.date) : null]
    .filter(Boolean).sort((a, b) => a - b)[0];
  let prev     = start0 || pd(rows[0].date);
  let ctrPaid  = 0;                                  // тело, погашенное ПО ГРАФИКУ к началу периода
  let prevDisb = 0;                                  // освоено к концу ПРЕДЫДУЩЕЙ позиции
  for (const r of rows){
    const base = (r.accrued == null ? r.interest : r.accrued) || 0;
    const end  = pd(r.date);
    const mppP = freqMonths(conditionsAt(t, r.date).freq) || 1;   // длина ПЕРИОДА — у позиции
    const perDays = Math.max(0, dd(prev, end));
    /* ОТРЕЗКИ. Контрактная часть остаётся у позиции целиком — она и есть контракт; по
       отрезкам считается только ОТКЛОНЕНИЕ. periodInterest линеен по базе, поэтому
       %(факт) = %(контракт) + Σ %(dev отрезка), и правка остаётся аддитивной: льготы,
       отсрочка и распределение отложенных процентов живут в buildSchedule нетронутыми. */
    const marks = [prev, ...segmentBounds(gr, prev, end), end];
    const segs  = [];
    let extra = 0, dev0 = 0;
    for (let i = 0; i < marks.length - 1; i++){
      const a = marks[i], b = marks[i + 1];
      const at0 = a < lim ? a : lim;                 // срез не знает будущего
      const at  = (cnd0 && at0 < pd(cnd0)) ? pd(cnd0) : at0;
      const cnd = conditionsAt(t, fd(at));           // условия НА НАЧАЛО ОТРЕЗКА (ADR-0128 §1)
      /* отклонение = фактическое непогашенное тело − контрактное. Слагаемых два:
         переплата/недобор тела и НЕОСВОЕННОЕ — контракт уже начисляет, а денег у заёмщика
         ещё нет. Второе считается только ОТ ДАТЫ ПЕРВОГО ОСВОЕНИЯ: график амортизирует
         тело именно от неё (buildSchedule), и зона левее датой договора не описана —
         отклонения там нет, есть несогласованный график. Иначе кредит с позициями раньше
         освоения (в сиде таких 11) получал бы отрицательное начисление.
         У производного транша освоений НЕТ вовсе — тело пришло переносом по ДС
         (ADR-0092 §1, ADR-0115), и `full` берётся из t.amount. Считать его неосвоенным
         значило бы обнулить ему базу навсегда. */
      const undisb = (disb && at0 >= pd(disb.date))
        ? round2(Math.max(0, full - disbursedTo(t, fd(at0)))) : 0;
      /* ТРЕТЬЕ СЛАГАЕМОЕ — ПЕРЕНОС ПО ДС (КВ-54, movedNetAt). Без него база отрезка знала
         только деньги: донор продолжал начислять на ушедшее тело (K-7 т1 — 9 % на 360 000
         после 01.05.2026), приёмник начислял на него же свои 5 %, и заёмщик платил за одни
         и те же дни дважды. Лист при этом печатал «Остаток» 360 000 против нуля по ИР-3 —
         то есть противоречил и карточке, и своду. */
      /* ЧЕТВЁРТОЕ СЛАГАЕМОЕ — СПИСАНИЕ (КВ-62). По той же причине, что и перенос: тело
         ушло с баланса, и начислять на него больше нельзя. У сегодняшнего сида списание
         совпадает с закрытием, а закрытие останавливает расчёт (buildLedger, lim), — то
         есть отрезка после него не бывает и слагаемое ни разу не срабатывает. Стоит оно
         здесь затем, чтобы правило не держалось на этом совпадении: частичное списание
         действующего кредита — штатный исход, и после него база обязана упасть. */
      const dev    = round2(ctrPaid - paidPrincipalOfTranche(c, t, fd(at0)) - undisb
                            + movedNetAt(t, fd(at0)) - writtenOffAt(t, fd(at0)));
      const days   = perDays > 0 ? Math.max(0, dd(a, b)) : 0;
      /* финансовый числитель ('30/…'): период стоит 30×mpp дней вне календаря — делим
         эту фиксированную длину по календарной доле отрезка, иначе каждый отрезок
         засчитал бы себе целый период */
      const dOver = dayBasis(cnd.dayMethod, b).numFin
        ? (perDays > 0 ? 30 * mppP * days / perDays : 0) : days;
      const e = (base === 0 || Math.abs(dev) <= 0.005) ? 0
        : (dev > 0 ?  periodInterest(t, cnd, a, b,  dev, mppP, dOver)
