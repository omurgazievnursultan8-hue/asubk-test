        ${(()=>{
          if (condScope!=='credit' || c.tranches.length<=1) return '';
          const rows=divergenceRows(c,cardAsOf);
          if (!rows.length) return '';
          // TODO при появлении закрытых траншей: колонки строятся по ВСЕМ траншам
          // (c.tranches), а значения приходят из divergenceRows/creditConditionsAt,
          // которые считают только активные (activeTranche) — у закрытого транша
          // колонка будет, а значения в ней не будет. Сейчас ни один транш демо
          // не несёт closed, поэтому расхождение не проявляется.
          const cols=[{h:'Параметр'}].concat(c.tranches.map(t=>({h:'Транш №'+t.no})))
                                     .concat([{h:'Основание расхождения'}]);
          const trs=rows.map(r=>{
            const cells=c.tranches.map(t=>{ const cell=r.cells.find(x=>x.trancheNo===t.no);
              return `<td>${esc(cell?cell.value:'—')}</td>`; }).join('');
            const refs=[...new Set(c.tranches.map(t=>{ const rec=(t.conditionRecords||[])
              .filter(x=>x.param===r.param && x.effectiveFrom && pd(x.effectiveFrom)<=pd(cardAsOf))
              .sort(crOrder).pop();
              return rec?(rec.basis.ref||''):''; }).filter(Boolean))];
            return `<tr><td>${esc(paramLabel(r.param))}</td>${cells}<td>${esc(refs.join(' · '))}</td></tr>`; });
          return `<div class="pcard wide" id="condDivergence">
            <div class="section-h">Расхождения по траншам (на ${esc(cardAsOf)})</div>
            <p class="section-note">Условия принадлежат траншу. Здесь только параметры,
              по которым транши разошлись на дату среза; согласованные значения — в карточках выше.</p>
            ${cgrid(cols, trs)}
          </div>`;
        })()}

        <div class="pcard wide">
          <div class="section-h">Журнал изменений условий</div>
          <p class="section-note">Каждая строка — документ-основание; «Изменено» и «было → стало» —
            производные от записей условий. Записи не удаляются: отмена — новая запись.</p>
          <div class="gtoolbar">
            ${['all','agreement','court','govAct','application'].map(k=>{
              const lbl = k==='all'?'все':BASIS_KINDS[k].label;
              return `<span class="pill ${condBasisFilter===k?'low':'neutral'}" style="cursor:pointer"
                onclick="CR.setCondFilter('${k}')">${esc(lbl)}</span>`; }).join(' ')}
          </div>
          ${(()=>{ const gs=basisGroups(c).filter(g=>condBasisFilter==='all'||g.kind===condBasisFilter);
            const trs=[];
            for (const g of gs){
              const ic=BASIS_KINDS[g.kind]||{};
              const uniq=[...new Set(g.items.map(i=>i.param))];
              const changed=uniq.slice(0,3).map(paramLabel).join(' · ')+(uniq.length>3?' …':'');
              trs.push(`<tr style="cursor:pointer" onclick="CR.toggleCondGroup('${jsAttr(g.key)}')">
                <td>${esc(ic.icon||'')} ${esc(g.ref)}</td><td>${esc(g.docDate||'—')}</td>
                <td>${esc(g.effectiveFrom)}${g.retro?' <span class="pill high">задним числом</span>':''}</td>
                <td>${esc(changed)}</td><td>${g.trancheNos.map(n=>'№'+n).join(', ')}</td>
                <td>${condOpenGroup===g.key?'▾':'▸'}</td></tr>`);
              if (condOpenGroup===g.key) trs.push(`<tr><td colspan="6" style="background:var(--surface-panel)">
                ${cgrid([{h:'Параметр'},{h:'Было'},{h:'Стало'},{h:'Вступает'},{h:'Транш'},{h:'Примечание'}],
                  g.items.map(i=>`<tr><td>${esc(paramLabel(i.param))}</td>
                    <td><span class="diff-old">${esc(i.from===undefined?'—':i.from)}</span></td>
                    <td><span class="diff-new">${esc(i.to)}</span></td>
                    <td>${esc(i.effectiveFrom)}</td><td>№${i.trancheNo}</td><td>${esc(i.note||'')}</td></tr>`))}
                </td></tr>`);
            }
            return cgrid([{h:'Документ'},{h:'Дата док.'},{h:'Вступает'},{h:'Изменено'},{h:'Транши'},{h:''}],
                         trs, {empty:'Изменений условий не было'});
          })()}
          ${(()=>{ const usedRefs=new Set();
            c.tranches.forEach(t=>(t.conditionRecords||[]).forEach(r=>{ if(r.basis&&r.basis.ref) usedRefs.add(r.basis.ref); }));
            const orphan=(c.agreements||[]).filter(a=>!usedRefs.has(a.num));
            if(!orphan.length) return '';                     // Шаг 17: хвост пуст у большинства — не рендерим пустую подсекцию
            const trs=orphan.map(a=>`<tr><td>ДС ${esc(a.num)}</td><td>${esc(a.date)}</td><td>${esc(a.source||'—')}</td>
              <td>${a.scan?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(a.scan)}</a>`:'—'}</td></tr>`);
            return `<div class="section-h" style="margin-top:16px;font-size:13px">Документы без изменения условий</div>
              <p class="section-note">Зарегистрированы, но ни одна запись условий на них не ссылается —
                без записи условий документ не попадает в разбор выше.</p>
              ${cgrid([{h:'Документ'},{h:'Дата'},{h:'Источник'},{h:'Скан'}], trs, {empty:'Таких документов нет'})}`;
          })()}
        </div>

        <div class="pcard wide">
          <div class="section-h" style="cursor:pointer" onclick="CR.toggleCondMatrix()">
            ${condMatrixOpen?'▾':'▸'} Сводная матрица условий (параметр × дата вступления)</div>
          ${condMatrixOpen?(()=>{
            const recs=c.tranches.flatMap(t=>(t.conditionRecords||[]).map(r=>({t,r})));
            const dates=[...new Set(recs.map(x=>x.r.effectiveFrom))].sort((a,b)=>pd(a)-pd(b));
            const cols=[{h:'Параметр'}].concat(dates.map(d=>({h:d})));
            const trs=PARAMS.map(p=>{
              const cells=dates.map(d=>{ const hit=recs.filter(x=>x.r.param===p.key && x.r.effectiveFrom===d);
                if(!hit.length) return '<td style="color:var(--text-placeholder)">·</td>';
                const vals=[...new Set(hit.map(x=>String(x.r.value)))].join(' / ');
                return `<td>${esc(vals)}<br><span class="src">${esc(hit[0].r.basis.ref||'')}</span></td>`; }).join('');
              return `<tr><td>${esc(p.label)}</td>${cells}</tr>`; });
            return `<p class="section-note">У каждого условия своя дата вступления
              и своё основание. Пустая ячейка — в эту дату параметр не менялся.</p>
              ${cgrid(cols, trs, {empty:'Записей нет'})}`;
          })():''}
        </div>

        <div class="pcard wide">
          <div class="section-h" style="cursor:pointer" onclick="CR.toggleCondTemplate()">
            ${condTemplateOpen?'▾':'▸'} Шаблон наследования (что унаследует новый транш)</div>
          ${condTemplateOpen?`<p class="section-note">Не действующие условия: значения,
            копируемые в записи при создании нового транша. Действующие — в карточках выше.
            Правка шаблона возможна только в ЖЦ «Проект».</p>
            <div class="f2">${PARAMS.map(p=>fld(p.label, esc(b[p.key]))).join('')}</div>`:''}
        </div>
      </div>`;
  }

  /* ---- ВКЛАДКА 3: Транши и освоение ---- */
  function tabTranshi(c,d){
    const sel=c.tranches.find(t=>t.no===detailTrancheNo)||c.tranches[0];
    const cur=c.currency, isFx=cur!=='KGS', fx=FX[cur]||1;              // мультивалюта: курс/≈KGS только для не-KGS
    const trRows=c.tranches.map(t=>{
      const s=disbursedSum(t), rest=(t.amount||0)-s, on=sel&&t.no===sel.no;
      const fxCells=isFx?`<td style="text-align:right">${money(fx)}</td><td style="text-align:right">${money0(toKgs(t.amount,cur))}</td>`:'';
      /* Закрытый транш (Г-17): не удалён, а помечен — с датой и основанием. Прежде
         activeTranche(t) читал t.closed, но выставить его было нечем (КР-3). */
      const st = t.closed
        ? `<span class="pill neutral" title="${jsAttr('Закрыт '+(t.closed.date||'')+': '+(t.closed.reason||''))}">Закрыт ${esc(t.closed.date||'')}</span>`
        : esc(trancheState(t));
      return `<tr style="cursor:pointer${on?';background:var(--asubk-nav-active)':''}${t.closed?';opacity:.6':''}" onclick="CR.selectDetailTranche(${t.no})">
        <td>№${t.no}</td><td>${esc(t.subject.name)}<br><span style="color:var(--text-muted);font-size:11px">ИНН ${esc(t.subject.inn)}</span></td>
        <td style="text-align:right">${money(t.amount)}${isFx?` <span style="color:var(--text-muted);font-size:11px">${esc(cur)}</span>`:''}</td><td>${esc(t.plannedDate)}</td>
        <td style="text-align:right">${money(s)}</td><td style="text-align:right">${money(rest)}</td>
        ${fxCells}<td>${st}</td></tr>`;
    });
    const trCols=[{h:'Транш'},{h:'Субъект'},{h:'Сумма',r:1},{h:'План. дата'},{h:'Освоено',r:1},{h:'Остаток',r:1}]
      .concat(isFx?[{h:'Курс',r:1},{h:'≈KGS суммы',r:1}]:[]).concat([{h:'Состояние'}]);
    const tot=c.tranches.reduce((a,t)=>{const s=disbursedSum(t);a.amt+=t.amount||0;a.dis+=s;a.rest+=(t.amount||0)-s;return a;},{amt:0,dis:0,rest:0});
    const totRow=c.tranches.length?`<tr style="font-weight:var(--weight-semibold);background:var(--surface-panel)">
      <td colspan="2">Итого освоено</td><td style="text-align:right">${money(tot.amt)}</td><td></td>
      <td style="text-align:right">${money(tot.dis)}</td><td style="text-align:right">${money(tot.rest)}</td>
      ${isFx?`<td></td><td style="text-align:right">${money0(toKgs(tot.amt,cur))}</td>`:''}<td></td></tr>`:'';
    const dbCols=[{h:'Дата'},{h:'Сумма',r:1}].concat(isFx?[{h:'≈KGS',r:1}]:[]).concat([{h:'Плат. поручение'},{h:'Назначение'},{h:'Документ'}]);
    const dbRows=((sel&&sel.disbursements)||[]).map(x=>`<tr><td>${esc(x.date)}</td><td style="text-align:right">${money(x.amount)}</td>${isFx?`<td style="text-align:right">${money0(toKgs(x.amount,cur))}</td>`:''}<td>${esc(x.order)}</td><td>${esc(x.purpose)}</td><td>${esc(x.doc)}</td></tr>`);
    return `
      <div class="section-h">Распределение суммы договора</div>
      <div class="phead-dims" style="grid-template-columns:repeat(4,1fr)">
        <div class="dim"><div class="dl">Одобрено</div><div class="dv">${money(c.approvedAmount)}</div></div>
        <div class="dim"><div class="dl">Сумма договора</div><div class="dv">${money(c.contractAmount)}</div></div>
        <div class="dim"><div class="dl">Распределено по траншам</div><div class="dv">${money(d.allocated)}</div></div>
        <div class="dim"><div class="dl">Доступно к распределению</div><div class="dv">${money(d.allocatable)}</div></div>
      </div>
      <div class="section-h" style="margin-top:22px">Транши (клик — выбор)</div>
      ${cgrid(trCols, trRows.concat(totRow?[totRow]:[]), {empty:'Траншей нет'})}
      ${c.closure&&c.closure.disbClosed?`<div class="info-plate" style="margin-top:12px">${svgInfo()}<div>
        Неосвоенный остаток <b>${money(c.closure.disbClosed.amount)}</b> закрыт <b>${esc(c.closure.disbClosed.date)}</b>
        (${esc(c.closure.disbClosed.reason)}). Дальнейшее освоение по кредиту заблокировано;
        сам кредит продолжает действовать.</div></div>`:''}
      <div class="gtoolbar" style="margin-top:12px">
        ${roleBtn('addTranche','Добавить транш','CR.openTrancheModal()')}
        ${actBtn(c,'addDisbursement',{trancheNo:detailTrancheNo,amount:0},'Внести освоение','CR.openDisbModal()','btn btn-primary btn-sm')}
        ${actBtn(c,'closeDisbursement',{reason:'—'},'Закрыть неосвоенный остаток','CR.openCloseDisbModal()')}
        ${actBtn(c,'closeTranche',{trancheNo:detailTrancheNo,reason:'—'},'Закрыть транш №'+(sel?sel.no:'—'),'CR.openCloseTrancheModal()')}
      </div>
      <div class="section-h" style="margin-top:22px">Освоение транша №${sel?sel.no:'—'}</div>
      ${cgrid(dbCols, dbRows, {empty:'Освоений нет'})}`;
  }

  /* ---- ВКЛАДКА 4: Расчёты ---- */

    const svod=`
      <div class="section-h">Свод на ${esc(d.calcUntil)}${d.calcStopped?' — расчёт остановлен':''}</div>
      ${d.calcStopped?`<div class="info-plate">${svgInfo()}<div>Кредит закрыт <b>${esc(d.calcUntil)}</b> (${esc((c.closure&&c.closure.reason)||'')}): начисление остановлено, все величины застыли на этой дате и от даты среза ${esc(cardAsOf)} больше не зависят.</div></div>`:''}
      <p class="section-note">Начисленное ВЫВОДИТСЯ из активной версии графика, условий на дату среза и интервалов
        приостановки; погашенное приходит зеркалом модуля платежей${(c.mirror.paymentsAsOf)?` (снимок ${esc(c.mirror.paymentsAsOf)})`:' (платежей нет)'}.

      ${cgrid([{h:'Транш'},{h:'База',r:1},{h:'Ставка, %',r:1},{h:'Дней',r:1},{h:'Сумма',r:1}], res.perTranche.map(p=>`<tr><td>${esc(p.trancheId)}</td><td style="text-align:right">${money(p.base)}</td><td style="text-align:right">${esc(p.rate)}</td><td style="text-align:right">${esc(p.days)}</td><td style="text-align:right">${money(p.amount)}</td></tr>`))}`:'';

    return `

        return `<div class="warn-inline" style="margin-top:14px">${svgInfo()}<div>

  /* ---- ВКЛАДКА 5: Платежи (зеркало модуля платежей, Р-5) ---- */
  function tabPlatezhi(c,d){
    const pays=(c.mirror.payments||[]);
    const ptot={amount:0,principal:0,interest:0,penalty:0};
    const payRows=pays.map(p=>{
      const ed=CR.paymentEditable(c,p);
      const L=p.layers||{}, pr=L.principal||0, it=L.interest||0, pe=L.penalty||0;
      const counts=CR.paymentCounts(p);
      const cur=CR.paymentCurrency(p,c), fx=cur!==(c.currency||'KGS');
      ptot.amount+=p.amount||0; ptot.principal+=pr; ptot.interest+=it; ptot.penalty+=pe;
      const mTone={'Подтверждён ЦК':'low','Восстановлен':'low','Ожидает ЦК':'mid','Сторно (таймаут)':'high','Расхождение':'mid'}[p.match]||'neutral';
      return `<tr>
        <td>${esc(p.num)}</td>
        <td>${esc(p.date)}${p.bindDate&&p.bindDate!==p.date?`<br><span class="text-muted" style="font:var(--font-label)">привязан ${esc(p.bindDate)}</span>`:''}</td>
        <td>№${esc(p.tranche)}</td>
        <td style="text-align:right">${money(p.amount)}${fx?`<br><span class="text-muted" style="font:var(--font-label)">${esc(cur)} · курс ${esc(p.rate)}</span>`:''}</td>
        <td style="text-align:right">${money(pr)}</td><td style="text-align:right">${money(it)}</td><td style="text-align:right">${money(pe)}</td>
        <td>${esc(p.method||'денежными средствами')}</td>
        <td>${esc(p.reg)}</td><td><span class="pill ${mTone}">${esc(p.match)}</span></td><td>${p.frozen?'заморожен':'—'}</td>
        <td>${counts?'<span class="pill low">двигает остаток</span>':'<span class="pill neutral">не двигает</span>'}</td>
        <td>${ed?'<span class="pill info">правка возможна</span>':'<span class="pill neutral">read-only ЦК</span>'}</td></tr>`
        + (p.dispute?`<tr><td></td><td colspan="12" style="background:var(--surface-panel)">
             <span class="pill ${p.dispute.status==='Ожидает решения комиссии'?'mid':'low'}">спорная пеня</span>
             период ${esc(p.dispute.from)} — ${esc(p.dispute.to||'по сегодня')} · ${esc(p.dispute.status)}${p.dispute.outcome?' · '+esc(p.dispute.outcome):''}.
             Сумму считает кредит (пеню начисляет он) — на дату среза <b>${money(d.debt.penalty.disputed)}</b>;
             в требование не входит, категорию не двигает, гейт «Погашен» не блокирует.</td></tr>`:'');
    });
    const payTot=pays.length?`<tr style="font-weight:var(--weight-semibold);background:var(--surface-panel)">
      <td colspan="3">Итого</td><td style="text-align:right">${money(ptot.amount)}</td>
      <td style="text-align:right">${money(ptot.principal)}</td><td style="text-align:right">${money(ptot.interest)}</td><td style="text-align:right">${money(ptot.penalty)}</td>
      <td></td><td></td><td></td><td></td><td></td><td></td></tr>`:'';
    const b=d.debt;
    const drow=(name,x)=>`<tr><td>${name}</td><td style="text-align:right">${money(x.accrued)}</td><td style="text-align:right">${money(x.paid)}</td><td style="text-align:right;color:${x.overdue>0?'var(--asubk-red)':'inherit'}">${money(x.overdue)}</td><td style="text-align:right">${money(x.bal)}</td></tr>`;
    /* §10.4 — множественность очередей при судебном решении. Признак берём из ЗЕРКАЛА
       СУДА (mirror.court), а не регуляркой по строке фазы взыскания: прежняя проверка
       искала «суд|решени» в тексте процесса и не находила его у К-3, K-C13 и K-C14,
       у которых судебное решение как раз есть (КР-10). */
    const hasCourt=(c.mirror.court||[]).length>0;
    return `
      <div class="section-h">Платежи ${lockHtml()}</div>
      <p class="section-note">Зеркало модуля платежей${c.mirror.paymentsAsOf?`, снимок <b>${esc(c.mirror.paymentsAsOf)}</b>`:''}. Три оси на платёж: регистрация · сопоставление · заморозка.
        Разнесение по статьям приходит вместе с подтверждением и здесь не правится: матрица очередей принадлежит платежам.
        <b>Двигает ли платёж остаток — читается по ДВУМ осям, а не по одной:</b> подтверждённый и восстановленный двигают;
        сторнированный не двигает, но остаётся виден; ожидающий — только если пришёл через <b>шлюз</b> (деньги уже ушли).</p>
      ${cgrid([{h:'№'},{h:'Дата'},{h:'Транш'},{h:'Сумма',r:1},{h:'Осн.',r:1},{h:'Проц.',r:1},{h:'Пеня',r:1},{h:'Вид'},{h:'Регистрация'},{h:'Сопоставление'},{h:'Заморозка'},{h:'В расчёте'},{h:'Правка'}], payRows.concat(payTot?[payTot]:[]), {empty:'Платежей нет'})}
      <div class="mirror-src">Источник: модуль платежей. Ручной ввод — вызов формы владельца: ему основанием служит список ЦК, поэтому до сверки он остатки не двигает. Разнесение приходит в валюте кредита; сумма и курс — реквизиты поступления.</div>
      <div class="gtoolbar" style="margin-top:12px">${roleBtn('savePayment','Внести платёж вручную','CR.openPaymentModal()','btn btn-primary btn-sm')}</div>
      ${d.courtLayers.length?`<div class="info-plate">${svgInfo()}<div>По кредиту есть <b>слой долга под решением суда</b>:
        ${d.courtLayers.map(L=>`${esc(L.kind)} от ${esc(L.date)}${L.il?' · '+esc(L.il):''} на <b>${money(L.amount)}</b> — ${esc(L.mode.label)}`).join('<br>')}<br>
        Режим определяется ДАТОЙ решения и прилипает к нему навсегда: у одного кредита бывает несколько решений с разными режимами одновременно.
        Начисление на присуждённую долю кредит останавливает сам (сырьё — его), а разнесение платежа по слоям принимает готовым: очередь и привязка к исполнительному листу живут в модуле платежей.</div></div>`

      <div class="f2">

  /* ---- ВКЛАДКА 6: Обеспечение (зеркало залогового модуля, Р-7) ---- */
  function tabObespechenie(c,d){
    const cov=d.coverage, light=cov.ok?'var(--asubk-green)':'var(--asubk-red)';
    const pledgeList=(c.mirror.pledges||[]);
    const pledgeRows=[];
    let sumAppr=0, sumPledge=0;
    /* Ликвидность и запрет на отчуждение — свойства ПРЕДМЕТА (ADR-0011, КР-30):
       ликвидность определяется видом предмета по справочнику, запрет «принадлежит вещи,
       а не договору». Прежде оба поля жили на залоговом договоре, и все его предметы
       наследовали одну ликвидность — это же расходилось с модулем залога. */
    for(const p of pledgeList) for(const it of (p.items||[])){
      sumAppr+=it.appraised||0; sumPledge+=it.pledgeValue||0;
      const liq=itemIsLiquid(it);
      pledgeRows.push(`<tr>
        <td>${esc(p.contractNum)}</td><td>${esc(p.notary||'—')}</td><td>${esc(it.name)}</td><td>${esc(it.kind)}</td>
        <td style="text-align:right">${money(it.appraised)}</td><td style="text-align:right">${money(it.pledgeValue)}</td><td style="text-align:right">${Math.round((it.share==null?1:it.share)*100)}%</td>
        <td title="${jsAttr('Класс ликвидности вида «'+it.kind+'» — справочник модуля залога')}">${liq?'<span class="pill low">ликвид</span>':'<span class="pill mid">неликвид</span>'}${itemIsMovable(it)?' <span class="pill neutral">движимое</span>':''}</td>
        <td>${it.ban?'<span class="pill info">запрет</span>':'—'}</td>
        <td>${(p.otherCredits&&p.otherCredits.length)?esc(p.otherCredits.join(', ')):'—'}</td></tr>`);
    }
    const bg=c.mirror.bankGuarantee, guars=(c.mirror.guarantees||[]);
    const insp=(c.mirror.inspections||[]);
    const inspRows=insp.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.obj)}</td><td>${esc(x.curator)}</td><td><span class="pill ${x.ok?'low':'high'}">${esc(x.res)}</span></td><td>${x.file?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td></tr>`);
    const svod = pledgeList.length ? `
      <div class="phead-dims" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        <div class="dim"><div class="dl">Действующих договоров</div><div class="dv">${pledgeList.length} ед.</div></div>
        <div class="dim"><div class="dl">Σ оценочная</div><div class="dv">${money(sumAppr)}</div></div>
        <div class="dim"><div class="dl">Σ залоговая</div><div class="dv">${money(sumPledge)}</div></div>
      </div>` : '';
    return `
      <div class="section-h">Обеспечение ${lockHtml()}</div>
      <p class="section-note">Зеркало залогового модуля. Залоговые договоры создаются только в модуле залога — здесь доступна привязка существующего.</p>
      ${svod}
      ${cgrid([{h:'Договор залога'},{h:'Нотариус'},{h:'Предмет'},{h:'Вид'},{h:'Оценочная',r:1},{h:'Залоговая',r:1},{h:'Доля'},{h:'Ликвидность'},{h:'Запрет отчуждения'},{h:'Также обеспечивает'}], pledgeRows, {empty:'Обеспечение не привязано'})}
      <div class="mirror-src">Источник: модуль залога. Данные read-only.</div>
      <div class="section-h" style="margin-top:22px">Обеспеченность ${lockHtml()}</div>
      <p class="section-note">Индекс НОРМИРОВАН на порог: 100 % = порог выполнен, при любом пороге.
        Числитель и пороги считает модуль залога — там живёт правило; кредит владеет
        базой (сумма под риском) и порогом по решению КМ. У залоговой стоимости и у банковской
        гарантии пороги РАЗНЫЕ, поэтому индекс — сумма двух нормированных слагаемых.</p>
      <div class="phead-dims" style="grid-template-columns:repeat(${cov.liqApplies?5:4},1fr)">
        <div class="dim"><div class="dl">Индекс обеспеченности</div><div class="dv"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span>${cov.index==null?'—':Math.round(cov.index*100)+'%'}</div>
          ${cov.idxGuar?`<div class="src">залог ${Math.round(cov.idxPledge*100)}% + гарантия ${Math.round(cov.idxGuar*100)}%</div>`
                       :(cov.ratio!=null?`<div class="src">отношение залоговой к базе ${Math.round(cov.ratio*100)}%</div>`:'')}</div>
        <div class="dim"><div class="dl">Порог</div><div class="dv">${cov.req==null?'—':cov.req+'%'}</div>${cov.reqFromKm?'<div class="src">по решению КМ</div>':''}${cov.gReq?`<div class="src">гарантия — ${cov.gReq}%${cov.gReq>100?' (иная валюта)':''}</div>`:''}</div>
        ${cov.liqApplies?`<div class="dim"><div class="dl">Доля ликвида</div><div class="dv" style="color:${cov.liqOk?'inherit':'var(--danger,#b3261e)'}">${Math.round(cov.liqShare*100)}%</div><div class="src">минимум ${cov.liqMin}% суммы под риском</div></div>`:''}
        <div class="dim"><div class="dl">Сумма под риском</div><div class="dv">${money(d.atRisk)}</div><div class="src">остаток ОД ${money(d.debt.principal.bal)} + не освоено ${money(Math.max(0,d.undisbursed))}</div></div>
        <div class="dim"><div class="dl">Статус</div><div class="dv" style="color:${light}">${!cov.applicable?'неприменима':cov.ok?'достаточно':(cov.covOk===false?'недостаточно':'состав не соответствует')}</div></div>
      </div>
      <div class="mirror-src">${esc(cov.source)}${cov.mirror?` · залоговая ${money(cov.mirror.pledgeValue)} (ликвид ${money(cov.mirror.liquidValue)} · неликвид ${money(cov.mirror.illiquidValue)})${cov.mirror.bankGuarantee?` + банковская гарантия ${money(cov.mirror.bankGuarantee)} при своём пороге ${cov.mirror.guaranteeReq}%`:''} · снимок ${esc(cov.mirror.asOf)}`:''}</div>
      ${bg?`<div class="section-h" style="margin-top:22px">Банковская гарантия (в индексе, со своим порогом)</div>
        <div class="f2">${fld('Банк',esc(bg.bank))}${fld('Сумма',money(bg.amount))}${fld('Валюта гарантии',esc(bg.currency||c.currency||'KGS'))}${fld('Действует до',esc(bg.till))}</div>
        <div class="mirror-src">Порог гарантии ${cov.mirror&&cov.mirror.guaranteeReq?cov.mirror.guaranteeReq:100} % — ${(bg.currency||c.currency||'KGS')===(c.currency||'KGS')?'валюта гарантии совпадает с валютой кредита':'валюта гарантии отличается от валюты кредита, порог с курсовым запасом'}.${cov.mirror&&cov.mirror.guaranteeExpired?' Срок гарантии истёк — в индекс не входит.':''}</div>`:''}
      ${guars.length?`<div class="info-plate">${svgInfo()}<div>Поручительство (${guars.map(g=>esc(g.party)).join(', ')}) — параллельный слой обеспечения. В индекс обеспеченности НЕ входит: у поручительства нет предмета, а значит и залоговой стоимости. Это обеспечительный договор, и при взыскании поручитель становится отдельным обязанным лицом — со своим требованием.</div></div>`:''}
      <div class="section-h" style="margin-top:22px">Обследования предметов залога ${lockHtml()}</div>
      ${cgrid([{h:'Дата'},{h:'Договор / предмет'},{h:'Куратор'},{h:'Результат'},{h:'Вложение'}], inspRows, {empty:'Обследований не проводилось'})}
      <div class="mirror-src">Источник: модуль залога. Акты обследования read-only — заводятся в модуле залога.</div>
      <div class="gtoolbar" style="margin-top:16px">
        ${roleBtn('linkPledge','Привязать существующий','CR.openPledgePicker()','btn btn-primary btn-sm')}
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор залога заводится в модуле залога — вне объёма макета')">+ Договор залога</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Договор поручительства заводится в модуле залога — вне объёма макета')">+ Договор поручительства</button>
        <button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля залога — вне объёма макета')">Открыть в модуле залога</button>
      </div>`;
  }

  /* ---- ВКЛАДКА 7: Проблемные ---- */
  function tabProblemnye(c,d){
    /* КР-6 · вкладка БОЛЬШЕ НЕ СЧИТАЕТ категорию сама. Прежде она пересчитывала worst-of
       своими двумя строками и не применяла послабление: у K-C16 (220 дн.) и K-C19 (210 дн.)
       шапка показывала «средний», а вкладка — «по просрочке: высокий» при итоге
       «худшая: средний». Экран противоречил сам себе. Теперь обе читают d.riskBasis —
       единственный источник (ADR-0012), и вкладка только разбирает его вывод. */
    const rb=d.riskBasis;
    const rs=c.mirror.restructuring||{count:0,active:null};
    /* Взыскание — таблица ТРЕБОВАНИЙ (ADR-0002): строка = процесс × кредит × обязанное
       лицо. Прежняя таблица показывала процессы и не знала обязанного лица вовсе, а фазу
       держала полем — что запретил ADR-0003 (фаза есть свёртка журнала мер). */
    const claimRows=(c.mirror.claims||[]).map(x=>`<tr>
      <td>${esc(x.claimId)}</td>
      <td>${esc(x.obligor.name)}<br><span style="color:var(--text-muted);font-size:11px">${esc(x.obligor.role)} · ИНН ${esc(x.obligor.inn)}</span></td>
      <td>${esc(x.scope)}</td><td>${esc(x.phase)}</td><td>${esc(x.stage)}</td><td>${esc(x.unit)}</td>
      <td style="text-align:right">${money(x.amount)}</td><td>${esc(x.since)}</td>
      <td class="text-muted" style="font:var(--font-label)">${x.lastMeasure?esc(x.lastMeasure):'—'}</td>
      <td><a class="rowlink" onclick="CR.toast('Процесс ${jsAttr(x.processId)} — открывается в модуле взыскания')">${esc(x.processId)}</a></td></tr>`);
    const hasBankruptcy=d.stateFlags.some(o=>o.kind==='bankruptcy');
    const courtRows=(c.mirror.court||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.kind)}</td><td>${esc(x.org)}</td><td><span class="pill ${x.ok?'low':'mid'}">${esc(x.res)}</span></td><td>${x.file?`<a class="lnk" onclick="CR.toast('Просмотр документа — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td></tr>`);
    const factRows=(c.factors||[]).map(f=>{const act=rb.factors.includes(f);
      return `<tr${act?'':' style="opacity:.55"'}><td>${esc(f.kind)}</td><td><b class="cat-${catClsOf(f.level)}">${esc(f.level)}</b></td>
      <td>${esc(f.from)}</td><td>${esc(f.to||'—')}</td><td>${esc(f.committeeRef||'')}</td>
      <td>${act?'<span class="pill low">действует</span>':'<span class="pill neutral">не действует</span>'}</td>
      <td class="text-muted" style="font:var(--font-label)">${esc(f.note||'')}</td></tr>`;});
    return `
      <div class="section-h">Категория риска — худшее из двух ${derivedHtml()}</div>
      <p class="section-note">Категория живёт на кредите и считается им: одна функция, один результат.
        Эта вкладка разбирает вывод, а не повторяет расчёт — иначе шапка и вкладка расходятся, как было до волны.</p>
      <div class="cat-expand">
        <div class="row"><span class="ck">По просрочке (${rb.eff} дн.${rb.relief?`, фактически ${rb.raw}`:''}):</span> <b class="cat-${catClsOf(rb.byDays)}">${rb.byDays}</b></div>
        <div class="row"><span class="ck">По факторам (${rb.factors.length} действ.):</span> <b class="cat-${catClsOf(rb.byFactors)}">${rb.byFactors}</b></div>
        <div class="row"><span class="ck">Итоговая (худшая):</span> <b class="cat-${catClsOf(d.riskCategory)}">${d.riskCategory}</b></div>
      </div>
      ${rb.relief?`<div class="info-plate">${svgInfo()}<div>Действует <b>послабление</b>: ${esc(rb.relief.basis||'подавление 181-го дня')}.
        Дни просрочки для категории ограничены 180 (фактически ${rb.raw}). Срок послабления — до <b>${esc(rb.relief.deadline||'—')}</b>;
        по истечении или отказе категория считается по фактическим дням без пересчёта задним числом.</div></div>`:''}

      <div class="section-h" style="margin-top:22px">Факторы категории</div>
      <p class="section-note">Второй вход worst-of. Фактор действует только со ссылкой на решение комитета:
        категорию нельзя «настроить» — за каждым ужесточением стоит документ. Строки без решения или вне интервала показаны бледными.</p>
      ${cgrid([{h:'Фактор'},{h:'Уровень'},{h:'С'},{h:'По'},{h:'Решение комитета'},{h:'Состояние'},{h:'Примечание'}], factRows, {empty:'Факторов не зарегистрировано'})}

      <div class="section-h" style="margin-top:22px">Подгруппа заёмщика ${lockHtml()}</div>
      <p class="section-note">Классификатор работы с долгом ведёт карточка заёмщика и считает по ВСЕМ его кредитам.
        Кредит показывает значение зеркалом — он не может знать, что происходит с соседними кредитами того же заёмщика.</p>
      <div class="cat-expand">
        <div class="row"><span class="ck">Группа:</span> <b>${esc(d.group||'—')}</b></div>
        <div class="row"><span class="ck">Подгруппа:</span> <b>${esc(d.subgroup||'—')}</b> — ${esc(d.subgroupLabel||'нет данных')}</div>
        <div class="row"><span class="ck">Снимок:</span> ${esc((c.mirror.borrower||{}).asOf||'—')} · источник: карточка заёмщика</div>
      </div>

      <div class="section-h" style="margin-top:22px">Реструктуризация ${lockHtml()}</div>
      ${rs.active?`<div class="f2">${fld('Стадия',esc(rs.active.stage))}${fld('Дедлайн',esc(rs.active.deadline))}${rs.active.amount?fld('Сумма реструктуризации',money(rs.active.amount)+(rs.active.currency&&rs.active.currency!=='KGS'?' '+esc(rs.active.currency):'')):''}${fld('Всего заявок',esc(rs.count))}</div>
        <p class="section-note">Реструктуризация — <b>признак состояния</b>, а не послабление: сама по себе она ничего не снимает.
          Последствие снимает отдельная запись послабления${rb.relief?` — она действует, см. блок категории выше`:` — сейчас такой записи нет, категория считается по фактическим дням`}.</p>`
        :`<p class="section-note">Активной реструктуризации нет. Всего заявок: ${rs.count}.</p>`}
      <div class="mirror-src">Источник: модуль реструктуризации. Read-only — из кредита не заводится.</div>
      <div class="gtoolbar" style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля реструктуризации — вне объёма макета')">Открыть в модуле реструктуризации</button></div>

      <div class="section-h" style="margin-top:22px">Требования взыскания ${lockHtml()}</div>
      <p class="section-note">Единица работы взыскания — <b>требование</b>: процесс × кредит × обязанное лицо.
        По одному процессу требований бывает несколько — к заёмщику, поручителю, залогодателю, — и у каждого своя стадия.
        Фаза приходит свёрнутой из журнала мер, кредит её не хранит.</p>
      ${cgrid([{h:'Требование'},{h:'Обязанное лицо'},{h:'Охват'},{h:'Фаза'},{h:'Стадия'},{h:'Ведущее подразделение'},{h:'Сумма',r:1},{h:'С даты'},{h:'Последняя мера'},{h:'Процесс'}], claimRows, {empty:'Требований взыскания нет'})}
      <div class="mirror-src">Источник: модуль взыскания${c.mirror.claimsAsOf?`, снимок ${esc(c.mirror.claimsAsOf)}`:''}. Read-only.${d.collectionCosts>0?` Расходы по обращению взыскания: <b>${money(d.collectionCosts)}</b> — пятая статья долга, собственность взыскания; в остаток кредита и в гейт «Погашен» не входит.`:''}</div>
      <div class="gtoolbar" style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="CR.toast('Открытие модуля взыскания — вне объёма макета')">Открыть в модуле взыскания</button></div>

      <div class="section-h" style="margin-top:22px">Банкротство и судебные решения ${lockHtml()}</div>
      <p class="section-note">${hasBankruptcy?'Признаки банкротства зафиксированы (зеркало модуля взыскания).':'Процедур банкротства нет.'}</p>
      ${cgrid([{h:'Дата'},{h:'Вид'},{h:'Орган / суд'},{h:'Результат'},{h:'Документ'}], courtRows, {empty:'Судебных решений и процедур банкротства нет'})}
      <div class="mirror-src">Источник: модуль взыскания. Read-only.</div>

      <div class="section-h" style="margin-top:22px">Закрытие кредита</div>
      <p class="section-note">Три основания: «Погашен» при нулевом остатке по четырём статьям и без действующих требований ·
        «Списан» с реквизитами решения · «Расторгнут» соглашением или решением.
        Признание задолженности безнадёжной оформляется как списание с соответствующим решением; завершение процедуры
        банкротства приходит из взыскания — кредит закрывается по его результату, а не объявляет банкротство сам.</p>
      <div class="gtoolbar" style="margin-top:10px">
        ${actBtn(c,'repay',{},'Погасить (закрыть)','CR.openRepayModal()','btn btn-tint btn-sm')}
        ${roleBtn('writeOff','Списать','CR.openWriteOffModal()','btn btn-tint danger btn-sm')}
        ${actBtn(c,'terminate',{doc:{},reason:'—'},'Расторгнуть','CR.openTerminateModal()','btn btn-tint danger btn-sm')}
      </div>`;
  }

  /* ---- ВКЛАДКА 8: Досье ---- */
  function docState(s){
    const map={'принят':'low','не требуется':'neutral','на проверке':'info','загружен':'info','требуется':'mid','отклонён':'high','просрочен':'high'};
    return `<span class="pill ${map[s]||'neutral'}">${esc(s||'—')}</span>`;
  }
  function noteTypePill(t){
    const map={'Обычное':'neutral','Примечание куратора':'info','Примечание (ОПП)':'mid','Примечание (залог)':'low','Примечание (ОИП)':'neutral'};
    return `<span class="pill ${map[t]||'neutral'}">${esc(t||'Обычное')}</span>`;
  }
  function tabDosye(c,d){
    /* Обязательный комплект ведёт кредитная программа (Г-7, КР-11): раньше реестра
       обязательных видов не было вовсе, и `.every()` на пустом массиве документов
       возвращал true — гейт не мог сработать у 57 кредитов из 59. */
    const prog=programDocs(c);
    const reqRows=d.docs.required.map(r=>{
      const x=r.doc;
      return `<tr><td>${esc(r.kind)} <span class="pill mid">обязателен</span></td><td>${x?esc(x.name):'—'}</td>
        <td>${x?docState(x.state):'<span class="pill high">не загружен</span>'}</td><td>${x?esc(x.date):'—'}</td>
        <td>${x&&x.file?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td>
        <td>${x&&x.note?esc(x.note):''}</td>
        <td>${roleBtn('editDocs', x?'Изменить':'Загрузить', `CR.openDocModal('${jsAttr(r.kind)}')`,'btn btn-secondary btn-sm')}</td></tr>`;});
    const extraRows=d.docs.extra.map(x=>`<tr><td>${esc(x.kind)}${prog.opt.includes(x.kind)?' <span class="pill neutral">опционален</span>':''}</td><td>${esc(x.name)}</td>
        <td>${docState(x.state)}</td><td>${esc(x.date)}</td>
        <td>${x.file?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(x.file)}</a>`:'—'}</td>
        <td>${esc(x.note||'')}</td>
        <td>${roleBtn('editDocs','Изменить',`CR.openDocModal('${jsAttr(x.kind)}')`,'btn btn-secondary btn-sm')}</td></tr>`);
    const docRows=reqRows.concat(extraRows);
    const curRows=(c.mirror.curatorship||[]).map(x=>`<tr><td>${esc(x.unit)}</td><td>${esc(x.employee)}</td><td>${esc(x.role)}</td><td>${esc(x.from)}</td><td>${esc(x.to||'—')}</td></tr>`);
    const tu=c.targetUse||{};
    const notes=(c.notes||[]);
    const noteRows=notes.map(n=>`<div class="hrow"><div class="hwhen">${noteTypePill(n.type)} · ${esc(n.author)}</div><div class="hwhat">${esc(n.text)}</div></div>`);
    /* Порядок записей одного дня задаётся счётчиком seq (КР-17): даты в макете без
       времени, и две записи одного дня были неотличимы по порядку. Сортируем по seq
       убыванием — свежие сверху; записи без seq (архивные) уходят в конец. */
    const auditRows=(c.audit||[]).slice().sort((a,b)=>(b.seq||0)-(a.seq||0))
      .map(a=>`<div class="hrow"><div class="hwhen">${esc(a.when)}${a.seq?` <span class="src">#${a.seq}</span>`:''} · ${esc(a.who)}</div><div class="hwhat">${esc(a.what)}</div></div>`);
    return `
      <div class="section-h">Документы кредита</div>
      <p class="section-note">Обязательный комплект задаёт кредитная программа <b>${esc(c.origin.programId||'—')}</b> (зеркало: ${prog.req.map(esc).join(' · ')}${prog.opt.length?`; опционально: ${prog.opt.map(esc).join(' · ')}`:''}).
        Жизненный цикл документа: требуется → загружен → на проверке → принят / отклонён / не требуется / просрочен.
        Закрывают требование только состояния «принят» и «не требуется».</p>
      ${d.docs.complete
        ? `<div class="info-plate">${svgInfo()}<div>Обязательный комплект собран.</div></div>`
        : `<div class="warn-inline">${svgInfo()}<div>Комплект НЕ собран${d.docs.missing.length?`: ${d.docs.missing.map(esc).join(' · ')}`:''}${d.docs.blocked.length?` · отклонены либо просрочены: ${d.docs.blocked.map(x=>esc(x.kind)).join(' · ')}`:''}. Регистрация договора заблокирована.</div></div>`}
      ${cgrid([{h:'Вид'},{h:'Наименование'},{h:'Состояние'},{h:'Дата'},{h:'Файл'},{h:'Примечание'},{h:''}], docRows, {empty:'Документов нет'})}

      <div class="section-h" style="margin-top:22px">Регистрация договора — файл и пометка</div>
      <div class="f2">
        ${fld('Скан договора', c.reg.scan?`<a class="lnk" onclick="CR.toast('Просмотр вложения — вне объёма макета');return false">${esc(c.reg.scan)}</a>`:null)}
        ${fld('Комментарий регистрации', c.reg.comment?esc(c.reg.comment):null, {span:true})}
      </div>

      <div class="section-h" style="margin-top:22px">Целевое использование</div>
      <p class="section-note">Мера реагирования по нецелевому использованию заводится только со ссылкой на решение Комитета —
        то же правило, что у факторов категории: последствие не наступает без документа-основания.</p>
      ${cgrid([{h:'Вид'},{h:'Дата'},{h:'Содержание'},{h:'Результат'},{h:'Решение Комитета'},{h:'Файл'}],
        [].concat(
          (tu.docs||[]).map(x=>`<tr><td>Документ</td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.result||'')}</td><td>—</td><td>${x.file?esc(x.file):'—'}</td></tr>`),
          (tu.checks||[]).map(x=>`<tr><td>Проверка</td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${/отклонен|нецелев/i.test(x.result||'')?`<b style="color:var(--asubk-red)">${esc(x.result)}</b>`:esc(x.result||'')}</td><td>—</td><td>${x.file?esc(x.file):'—'}</td></tr>`),
          (tu.measures||[]).map(x=>`<tr><td>Мера</td><td>${esc(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.result||'')}</td><td><b>${esc(x.committeeRef||'')}</b></td><td>${x.file?esc(x.file):'—'}</td></tr>`)
        ), {empty:'Записей нет — освоения по кредиту не было либо документы не приложены'})}
      <div class="gtoolbar">${roleBtn('targetUse','+ Запись целевого использования','CR.openTargetUseModal()')}</div>

      <div class="section-h" style="margin-top:22px">Кураторство ${lockHtml()}</div>
      <p class="section-note">Текущий куратор — строкой в шапке карточки.</p>
      ${cgrid([{h:'Подразделение'},{h:'Сотрудник'},{h:'Роль'},{h:'С'},{h:'По'}], curRows, {empty:'Назначений нет'})}
      <div class="mirror-src">Источник: модуль сотрудников · журнал назначений кураторства. Зеркало — только чтение.</div>

      <div class="section-h" style="margin-top:22px">Примечания</div>
      <p class="section-note">Человеческие заметки куратора и подразделений (редактируемые) — в отличие от системного append-only журнала ниже.</p>
      <div class="gtoolbar">
        <div class="field" style="max-width:240px"><span class="flabel">Тип</span><div class="control"><select onchange="CR.filterNotes(this.value)"><option value="">Все</option><option>Обычное</option><option>Примечание куратора</option><option>Примечание (ОПП)</option><option>Примечание (залог)</option><option>Примечание (ОИП)</option></select></div></div>
        ${roleBtn('addNote','+ Примечание','CR.openNoteModal()','btn btn-secondary btn-sm')}
      </div>
      <div class="hist" id="cr-notes">${noteRows.length?noteRows.join(''):'<div class="hrow"><div class="hwhat">Примечаний нет</div></div>'}</div>

      <div class="section-h" style="margin-top:22px">Журнал (append-only)</div>
      <div class="gtoolbar"><div class="field" style="max-width:360px"><span class="flabel">Фильтр по типу</span><div class="control"><input placeholder="например: addDisbursement" oninput="CR.filterAudit(this.value)"></div></div></div>
      <div class="hist" id="cr-audit">${auditRows.length?auditRows.join(''):'<div class="hrow"><div class="hwhat">Записей журнала нет</div></div>'}</div>`;
  }

  /* ---- диспетчер вкладок + рендер карточки ---- */
  function renderTab(name, c){
    const d = derive(c, cardAsOf);            // одна дата среза на карточку (КВ-10)
    switch(name){
      case 'Договор': return tabDogovor(c, d);
      case 'Условия': return tabUsloviya(c, d);
      case 'Транши и освоение': return tabTranshi(c, d);
      case 'Расчёты': return tabRaschety(c, d);
      case 'Платежи': return tabPlatezhi(c, d);
      case 'Обеспечение': return tabObespechenie(c, d);
      case 'Проблемные': return tabProblemnye(c, d);
      case 'Досье': return tabDosye(c, d);
      default: return tabDogovor(c, d);
    }
  }
  function renderDetail(c){
    const host=document.getElementById('cr-card-body'); if(!host) return;
    const d=derive(c, cardAsOf);                                    // СВЕЖИЙ расчёт на каждый рендер (Р-11)
    host.innerHTML = `<div class="panel-wrap" style="padding-bottom:0">${headerHtml(c,d)}</div>`
      + tabbarHtml()
      + `<div class="panel-wrap">${renderTab(detailTab,c)}</div>`;
  }
  function rerenderDetail(){ const c=currentCredit(); if(c) renderDetail(c); }
  function openTab(name){ detailTab=name; rerenderDetail(); syncHash(); }

  /* ---- обвязка действий карточки (onclick-строки живут в глобальной области → CR.*) ---- */
  CR.renderDetail=renderDetail; CR.renderTab=renderTab; CR.openTab=openTab; CR.rerenderDetail=rerenderDetail;
  CR.selectDetailTranche=function(no){ detailTrancheNo=no; rerenderDetail(); };
  CR.setCondScope=function(v){ condScope = (v==='credit'?'credit':+v); rerenderDetail(); };
  CR.setCondFilter=function(v){ condBasisFilter=v; rerenderDetail(); };
  CR.toggleCondGroup=function(ref){ condOpenGroup = (condOpenGroup===ref?null:ref); rerenderDetail(); };
  CR.toggleCondMatrix=function(){ condMatrixOpen=!condMatrixOpen; rerenderDetail(); };
  CR.toggleCondTemplate=function(){ condTemplateOpen=!condTemplateOpen; rerenderDetail(); };
  CR.goToCalc=function(){ detailTab='Расчёты'; rerenderDetail(); };
  /* §0.3 «не молча»: маска дд.мм.гггг пропускала 99.99.9999 и молча подменяла дату
     срезом «сегодня». Круговая проверка fd(pd(s))===s ловит и маску, и несуществующий
     день (31.02.2026 → 03.03.2026 ≠ ввод), отказ объявляется тостом. */
  CR.setCardAsOf=function(v){ const s=String(v||'').trim();
    if (s && fd(pd(s))!==s){ toast('Дата «'+s+'» не существует — срез оставлен на '+cardAsOf,'warn'); rerenderDetail(); return; }
    cardAsOf = s || TODAY; rerenderDetail(); };
  CR.scrollToDivergence=function(){ const el=document.getElementById('condDivergence');
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); };
  CR.setCalcMode=function(v){ calcConsolidated=!!v; rerenderDetail(); };
  /* CR.stubAction удалён: канон §0.1 запрещает заглушки, а она обслуживала три кнопки
     owned-действий кредита — перевод долга, закрытие неосвоенного остатка, примечание —
     и в двух случаях тост ещё и врал про «модуль-владелец» (КР-2). Все три оживлены. */
  CR.filterAudit=function(q){ q=(q||'').toLowerCase(); const host=document.getElementById('cr-audit'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = el.textContent.toLowerCase().includes(q)?'':'none'; }); };
  CR.filterNotes=function(t){ t=(t||'').toLowerCase(); const host=document.getElementById('cr-notes'); if(!host) return;
    [...host.querySelectorAll('.hrow')].forEach(el=>{ el.style.display = (!t || el.textContent.toLowerCase().includes(t))?'':'none'; }); };
  /* ============================================================
     МОДАЛКИ (Task 8) — единый openModal/closeModal, каждая: role+terminal guard → форма →
     мутация CR.* (внутри её gate() ре-валидируется) → при провале modalErr (§0.3, не молча),
     при успехе closeModal + toast + rerenderDetail (derive пересчитывается заново, Р-11).
     modalGuard: Наблюдатель и терминальный кредит НЕ могут ОТКРЫТЬ ни одну модалку.
     ============================================================ */
  function modalGuard(action){
    const c = currentCredit(); if (!c) return null;
    if (isTerminal(c)){ toast(terminalReason(c), 'warn'); return null; }
    if (action && !canRole(currentRole, action)){ toast('Роль «'+currentRole+'» не имеет права на это действие', 'warn'); return null; }
    return c;
  }

  /* 1) tranche (addTranche, Г-3) */
  CR.openTrancheModal=function(){ const c=modalGuard('addTranche'); if(!c) return; const d=derive(c);
    const body=`<p class="section-note">Условия транша наследуются от базовых условий кредита. Σ траншей ≤ суммы договора. Доступно к распределению: <b>${money(d.allocatable)}</b>.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Сумма транша</span><div class="control"><input id="trAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Плановая дата освоения</span><div class="control"><input id="trDate" type="date"></div></div>
        <div class="field"><span class="flabel">Субъект — наименование</span><div class="control"><input id="trSubjName" value="${esc(c.borrower.name)}"></div></div>
        <div class="field"><span class="flabel">Субъект — ИНН</span><div class="control"><input id="trSubjInn" value="${esc(c.borrower.inn)}"></div></div>
      </div>`;
    CR.openModal('Добавить транш', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitTranche()">Добавить транш</button>`);
  };
  CR.submitTranche=function(){ const c=modalGuard('addTranche'); if(!c) return;
    const amount=+document.getElementById('trAmount').value||0;
    const plannedDate=toDMY(document.getElementById('trDate').value);
    const subject={ name:document.getElementById('trSubjName').value, inn:document.getElementById('trSubjInn').value };
    const r=CR.addTranche(c,{amount,plannedDate,subject}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Транш добавлен: '+money(amount),'ok'); rerenderDetail(); };

  /* 2) disbursement (addDisbursement, Г-4·Г-5·Г-6) — апгрейд инлайн-формы до модалки */
  CR.openDisbModal=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const body=`<p class="section-note">Освоение — действие кредита, на транше. Проверяется: сумма не превышает остаток транша · жизненный цикл кредита · покрытие/КМ/waiver.</p>
      <div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="disbTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===detailTrancheNo?' selected':''}>№${t.no} · сумма ${money(t.amount)} · освоено ${money(disbursedSum(t))}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма освоения</span><div class="control"><input id="disbAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field"><span class="flabel">Дата освоения</span><div class="control"><input id="disbDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Плат. поручение</span><div class="control"><input id="disbOrder" placeholder="ПП-..."></div></div>
        <div class="field col-span"><span class="flabel">Назначение</span><div class="control"><input id="disbPurpose" placeholder="Оплата ..."></div></div>
      </div>`;
    CR.openModal('Внести освоение', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitDisb()">Сохранить освоение</button>`);
  };
  CR.submitDisb=function(){ const c=modalGuard('addDisbursement'); if(!c) return;
    const no=+document.getElementById('disbTranche').value;
    const amount=+document.getElementById('disbAmount').value||0;
    const date=toDMY(document.getElementById('disbDate').value)||CR.TODAY;
    const order=document.getElementById('disbOrder').value, purpose=document.getElementById('disbPurpose').value;
    const r=CR.addDisbursement(c,{trancheNo:no,amount,order,purpose,date}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); detailTrancheNo=no; toast('Освоение внесено: '+money(amount),'ok'); rerenderDetail(); };

  /* 3) schedule-params (generateSchedule, Г-8) — апгрейд: параметры → предпросмотр (1·2·посл.) → новая версия */
  CR.openSchedModal=function(previewFrom){ const c=modalGuard('buildSchedule'); if(!c) return;
    const sel=c.tranches.find(t=>t.no===detailTrancheNo)||c.tranches[0]; const cnd=CR.conditionsAt(sel,CR.TODAY);
    previewFrom=toDMY(previewFrom);
    const from=(previewFrom!=null?previewFrom:((sel.disbursements[0]&&sel.disbursements[0].date)||''));
    let preview;
    if(from && sel.disbursements.length){ const rows=CR.buildSchedule(sel, from).rows;
      const show=[rows[0], rows[1], rows[rows.length-1]].filter(Boolean);
      preview=`<div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр (платёж 1 · 2 · последний)</div>
        ${cgrid([{h:'№'},{h:'Дата'},{h:'Платёж',r:1},{h:'ОД',r:1},{h:'%',r:1}], show.map(r=>`<tr><td>№${r.no}</td><td>${esc(r.date)}</td><td style="text-align:right">${money(r.total)}</td><td style="text-align:right">${money(r.principal)}</td><td style="text-align:right">${money(r.interest)}</td></tr>`))}`;
    } else { preview=`<div class="warn-inline">${svgInfo()}<div>График строится только от фактической даты освоения транша. У выбранного транша нет освоения либо не задана дата.</div></div>`; }
    const body=`<div class="mform">
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="schedTranche" onchange="CR.selectDetailTranche(+this.value);CR.openSchedModal()">${c.tranches.map(t=>`<option value="${t.no}"${t.no===sel.no?' selected':''}>Транш №${t.no}${t.disbursements.length?'':' (не освоен)'}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Дата освоения (старт графика)</span><div class="control"><input id="schedFrom" type="date" value="${esc(toISO(from))}"></div></div>
        <div class="field"><span class="flabel">Периодичность</span><div class="control"><input value="${esc(cnd.freq||'ежемесячно')}" readonly></div></div>
        <div class="field"><span class="flabel">Метод погашения</span><div class="control"><input value="${esc(cnd.method||'аннуитет')}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по ОД, мес.</span><div class="control"><input value="${esc(cnd.graceMain||0)}" readonly></div></div>
        <div class="field"><span class="flabel">Льгота по %, мес.</span><div class="control"><input value="${esc(cnd.graceInterest||0)}" readonly></div></div>
      </div>
      <p class="section-note" style="margin-top:8px">Периодичность/метод/льготы наследуются из условий транша (правка — только зарегистрированным основанием). Предыдущая активная версия архивируется, не удаляется.</p>
      <div class="gtoolbar"><button class="btn btn-secondary btn-sm" onclick="CR.openSchedModal(document.getElementById('schedFrom').value)">Обновить предпросмотр</button></div>
      ${preview}`;
    CR.openModal('Сформировать график', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitSched()">Сформировать (новая версия)</button>`);
  };
  CR.submitSched=function(){ const c=modalGuard('buildSchedule'); if(!c) return;
    const no=+document.getElementById('schedTranche').value, from=toDMY(document.getElementById('schedFrom').value);
    const r=CR.generateSchedule(c,no,{from}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); detailTrancheNo=no; toast('График сформирован: версия v'+(r.ver||'?'),'ok'); rerenderDetail(); };

  /* 4) конструктор условий (addConditionRecords, Р-21 · Г-10 · Г-18…Г-20):
     основание → дата вступления → транши → параметры → предпросмотр «было → станет». */
  /* condEffDate() — дата вступления из формы, с защитой от непарсимой строки:
     «было» и предзаполнение должны читаться на эту дату (не на CR.TODAY), но
     не падать, пока пользователь дописывает дд.мм.гггг. */
  function condEffDate(){
    const el=document.getElementById('cbEff'); const s=toDMY(el?el.value:'');
    return /^\d{2}\.\d{2}\.\d{4}$/.test(s) ? s : CR.TODAY;
  }
  CR.openCondModal=function(){ const c=modalGuard('addConditionRecords'); if(!c) return;
    const body=`<p class="section-note">Условия меняются только зарегистрированным основанием.
        Решение суда и постановление правительства здесь не заводятся — выбираются из существующих.
        Задним числом возможны только они, и с обязательным примечанием.</p>
      <div class="mform">
        <div class="field req col-span"><span class="flabel">Тип основания</span>
          <div class="control"><select id="cbKind" onchange="CR.condBasisChanged()">
            <option value="agreement">Доп. соглашение</option>
            <option value="court">Решение суда</option>
            <option value="govAct">Постановление правительства</option>
          </select><span class="caret">▾</span></div></div>
        <div id="cbAgrFields" class="col-span"><div class="mform">
          <div class="field req"><span class="flabel">Номер ДС</span><div class="control"><input id="cbNum" placeholder="ДС-..."></div></div>
          <div class="field req"><span class="flabel">Дата ДС</span><div class="control"><input id="cbDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
          <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="cbScan" placeholder="файл.pdf"></div></div>
        </div></div>
        <div id="cbRefField" class="field req col-span" style="display:none"><span class="flabel">Документ-основание</span>
          <div class="control"><select id="cbRef"></select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Вступает в силу</span><div class="control"><input id="cbEff" type="date" value="${esc(toISO(CR.TODAY))}" onchange="CR.condRecalcDefaults();CR.condPreview()"></div></div>
        <div class="field col-span"><span class="flabel">Примечание (обязательно при дате в прошлом)</span><div class="control"><input id="cbNote" placeholder="что пересчитывается"></div></div>
        <div class="field col-span"><span class="flabel">Транши</span><div class="control">
          ${c.tranches.map(t=>`<label style="margin-right:14px"><input type="checkbox" class="cbTr" value="${t.no}" checked onchange="CR.condPreview()"> №${t.no}</label>`).join('')}
        </div></div>
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Условия</div>
      <div class="mform">
        ${CR.PARAMS.map(p=>{
          const t0=c.tranches[0], cur=t0?CR.conditionsAt(t0,CR.TODAY)[p.key]:'';
          const input = p.kind==='enum'
            ? `<select id="cbV_${p.key}" onchange="CR.condPreview()">${p.options.map(o=>`<option${String(o)===String(cur)?' selected':''}>${esc(o)}</option>`).join('')}</select><span class="caret">▾</span>`
            : p.kind==='months'
            /* Шаг 18: hidden-инпут cbV_ хранит «1,4,7» — общий код (condRecalcDefaults/
               condPreview/submitCond) уже читает el.value как готовое значение записи,
               спецкод нужен только для чекбоксов ↔ hidden input. */
            ? (()=>{ const cur0=String(cur||'').split(',').map(s=>s.trim()).filter(Boolean);
                const boxes=Array.from({length:12},(_,i)=>i+1).map(m=>
                  `<label style="margin-right:8px;font-weight:normal"><input type="checkbox" class="cbMonth_${p.key}" value="${m}" ${cur0.includes(String(m))?'checked':''} onchange="CR.condMonthsChanged('${p.key}')"> ${m}</label>`).join('');
                return `<input type="hidden" id="cbV_${p.key}" value="${esc(cur0.join(','))}">${boxes}`; })()
            : `<input id="cbV_${p.key}" type="number" step="0.01" value="${esc(cur)}" oninput="CR.condPreview()">`;
          return `<div class="field"><span class="flabel"><label><input type="checkbox" class="cbP" value="${p.key}" onchange="CR.condPreview()"> ${esc(p.label)}</label></span>
            <div class="control">${input}</div></div>`;
        }).join('')}
      </div>
      <div class="section-h" style="margin-top:14px;font-size:15px">Предпросмотр (было → станет)</div>
      <div id="cbPreview" class="cat-expand"></div>`;
    CR.openModal('Изменение условий', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button>
       <button class="btn btn-primary" onclick="CR.submitCond()">Оформить</button>`);
    CR.condBasisChanged();
  };
  /* «Документ-основание» (Д-4): список зависит от типа основания — суд и ПП
     не смешиваются в одном select (иначе решение суда может сослаться на
     постановление правительства и наоборот). Значение — courtRef(x): один и тот же
     хелпер и здесь, и при сидировании К-3, поэтому одно решение = одна группа журнала. */
  function condRefOptions(c, kind){
    if (kind==='court') return (c.mirror.court||[]).map(x=>{
      const v=courtRef(x); return { value:v, label:'⚖ '+v }; });
    if (kind==='govAct') return c.origin.govDecisionId
      ? [{ value:c.origin.govDecisionId, label:'ПП '+c.origin.govDecisionId }] : [];
    return [];
  }
  CR.condBasisChanged=function(){ const c=currentCredit(); if(!c) return;
    const k=document.getElementById('cbKind').value;
    document.getElementById('cbAgrFields').style.display = k==='agreement'?'':'none';
    document.getElementById('cbRefField').style.display  = k==='agreement'?'none':'';
    if (k!=='agreement'){
      const sel=document.getElementById('cbRef');
      const opts=condRefOptions(c,k);
      const emptyMsg = k==='court' ? 'Нет решений суда — основание недоступно' : 'Нет постановления правительства — основание недоступно';
      sel.innerHTML = opts.length
        ? opts.map(o=>`<option value="${jsAttr(o.value)}">${esc(o.label)}</option>`).join('')
        : `<option value="">${esc(emptyMsg)}</option>`;
      sel.disabled = opts.length===0;
    }
    CR.condRecalcDefaults(); CR.condPreview(); };
  /* Предзаполнение и «было» обязаны читаться на дату вступления (cbEff), не
     на CR.TODAY — иначе для ретроспективной записи предпросмотр лжёт о том,
     что действовало на дату, которую сам же документ меняет задним числом. */
  CR.condMonthsChanged=function(key){                    // Шаг 18: чекбоксы месяцев → hidden cbV_
    const vals=[...document.querySelectorAll('.cbMonth_'+key+':checked')].map(x=>+x.value).sort((a,b)=>a-b);
    document.getElementById('cbV_'+key).value = vals.join(',');
    CR.condPreview(); };
  CR.condRecalcDefaults=function(){ const c=currentCredit(); if(!c) return;
    const eff=condEffDate(), t0=c.tranches[0]; if(!t0) return;
    CR.PARAMS.forEach(p=>{
      const el=document.getElementById('cbV_'+p.key); if(!el) return;
      const cur=CR.conditionsAt(t0,eff)[p.key];
      el.value = (cur===undefined?'':cur);
      if (p.kind==='months'){                             // resync чекбоксов на пересчёт по дате
        const vals=String(el.value||'').split(',').map(s=>s.trim()).filter(Boolean);
        document.querySelectorAll('.cbMonth_'+p.key).forEach(cb=>{ cb.checked=vals.includes(cb.value); });
      }
    }); };
  CR.condPreview=function(){ const box=document.getElementById('cbPreview'); if(!box) return;
    const c=currentCredit(); if(!c) return;
    const eff=condEffDate();
    const nos=[...document.querySelectorAll('.cbTr:checked')].map(x=>+x.value);
    const keys=[...document.querySelectorAll('.cbP:checked')].map(x=>x.value);
    const rows=[];
    for (const k of keys) for (const no of nos){
      const t=c.tranches.find(x=>x.no===no); if(!t) continue;
      const from=CR.conditionsAt(t,eff)[k];
      const to=document.getElementById('cbV_'+k).value;
      rows.push(`<div class="row"><span class="ck">№${no} · ${esc(CR.paramLabel(k))}</span>
        <span class="diff"><span class="diff-old">${esc(from===undefined?'—':from)}</span> → <span class="diff-new">${esc(to)}</span></span>
        <span class="src">с ${esc(eff)}</span></div>`);
    }
    box.innerHTML = rows.length?rows.join(''):`<div class="row" style="color:var(--text-placeholder)">Условия не выбраны</div>`; };
  CR.submitCond=function(){ const c=modalGuard('addConditionRecords'); if(!c) return;
    const kind=document.getElementById('cbKind').value;
    const eff=toDMY(document.getElementById('cbEff').value), note=document.getElementById('cbNote').value;
    const nos=[...document.querySelectorAll('.cbTr:checked')].map(x=>+x.value);
    const keys=[...document.querySelectorAll('.cbP:checked')].map(x=>x.value);
    let basis;
    if (kind==='agreement'){
      const num=document.getElementById('cbNum').value, date=toDMY(document.getElementById('cbDate').value);
      basis={ kind, num, date, scan:document.getElementById('cbScan').value,
              ref:num, label:'Доп. соглашение '+num };
    } else {
      const sel=document.getElementById('cbRef');
      const ref=sel&&sel.value?sel.value:'';
      basis={ kind, ref, date:'',
              label:(kind==='court'?courtBasisLabel(ref):'Постановление правительства '+ref) };
    }
    const records=keys.map(k=>{ const p=CR.PARAMS.find(x=>x.key===k);
      const el=document.getElementById('cbV_'+k);
      return { param:k, value:(p.kind==='num'?+el.value:el.value),
               effectiveFrom:eff, trancheNos:nos, note }; });
    const r=CR.addConditionRecords(c,{basis,records});
    if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Записей условий добавлено: '+r.value.added,'ok'); rerenderDetail(); };

  /* 5) manual-payment (addPayment, Г-11, Р-5) — «форма модуля платежей», статус «Ожидает ЦК» */
  CR.openPaymentModal=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const body=`<div class="info-plate">${svgInfo()}<div>Форма модуля платежей. Ручной ввод повисает «Ожидает ЦК» и НЕ двигает остатки/долг — подтверждённые остатки двигает только ЦК своим потоком.</div></div>
      <div class="mform">
        <div class="field"><span class="flabel">Кредит</span><div class="control"><input value="№ ${esc(c.num)} · ${esc(c.borrower.name)}" readonly></div></div>
        <div class="field"><span class="flabel">Транш</span><div class="control"><select id="payTranche">${c.tranches.map(t=>`<option value="${t.no}"${t.no===detailTrancheNo?' selected':''}>№${t.no} · ${esc(t.subject.name)}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="field req"><span class="flabel">Сумма платежа</span><div class="control"><input id="payAmount" type="number" min="0" placeholder="0"></div></div>
        <div class="field req"><span class="flabel">Дата платежа</span><div class="control"><input id="payDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
      </div>`;
    CR.openModal('Ручной ввод платежа — форма модуля платежей', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitPayment()">Отправить в модуль платежей</button>`);
  };
  CR.submitPayment=function(){ const c=modalGuard('savePayment'); if(!c) return;
    const trancheNo=+document.getElementById('payTranche').value;
    const amount=+document.getElementById('payAmount').value||0;
    const date=toDMY(document.getElementById('payDate').value);
    const r=CR.addPayment(c,{amount,date,trancheNo}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Платёж отправлен — статус «Ожидает ЦК»','ok'); rerenderDetail(); };

  /* 6) KM-decision (setKmDecision, Р-8) — разблокирует освоение с провалом покрытия (К-5) */
  CR.openKmModal=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const body=`<p class="section-note">Реквизиты решения Кабинета Министров. Поле кредита; его же читает модуль залога.
        Решение освобождает не от обеспечения вообще, а от <b>общего порога</b>, устанавливая свой: порог <b>0 %</b> — полное освобождение.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид решения</span><div class="control"><input id="kmKind" value="Решение КМ"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="kmNum" placeholder="КМ-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="kmDate" type="date"></div></div>
        <div class="field req"><span class="flabel">Порог обеспечения по решению, %</span><div class="control"><input id="kmPct" type="number" min="0" step="1" value="${esc((c.kmDecision&&c.kmDecision.coverPct!=null)?c.kmDecision.coverPct:80)}"></div></div>
        <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="kmScan" placeholder="reshenie-km.pdf"></div></div>
      </div>`;
    CR.openModal('Решение КМ — порог обеспечения', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitKm()">Сохранить решение</button>`);
  };
  CR.submitKm=function(){ const c=modalGuard('setKmDecision'); if(!c) return;
    const kind=document.getElementById('kmKind').value, num=document.getElementById('kmNum').value;
    const date=toDMY(document.getElementById('kmDate').value), scan=document.getElementById('kmScan').value;
    const coverPct=document.getElementById('kmPct').value;
    if(!num||!date){ CR.modalErr(['Номер и дата решения обязательны']); return; }
    if(coverPct===''||+coverPct<0){ CR.modalErr(['Порог по решению обязателен (0 % — полное освобождение)']); return; }
    const r=CR.setKmDecision(c,{kind,num,date,scan,coverPct}); if(r&&r.ok===false){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Решение КМ сохранено — порог обеспечения '+coverPct+' %','ok'); rerenderDetail(); };

  /* 7) waiver (saveWaiver) — альтернатива КМ; роль «Начальник отдела», обоснование ОБЯЗАТЕЛЬНО (К-5) */
  CR.openWaiverModal=function(){ const c=modalGuard('waiver'); if(!c) return;
    const body=`<p class="section-note">Waiver залоговой комиссии (альтернатива решению КМ) — разблокирует освоение при провале покрытия. Доступно роли «Начальник отдела». Обоснование обязательно.</p>
      <div class="mform">
        <div class="field req col-span"><span class="flabel">Обоснование (протокол комиссии по залогу)</span><textarea id="waiverReason" class="note-area" placeholder="Основание waiver..."></textarea></div>
      </div>`;
    CR.openModal('Waiver залоговой комиссии', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitWaiver()">Сохранить waiver</button>`);
  };
  CR.submitWaiver=function(){ const c=modalGuard('waiver'); if(!c) return;
    const reason=document.getElementById('waiverReason').value;
    const r=CR.saveWaiver(c,{reason}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Waiver сохранён — освоение разблокировано','ok'); rerenderDetail(); };

  /* 8) write-off (closeCredit «Списан», Г-12) — реквизиты решения обязательны */
  CR.openWriteOffModal=function(){ const c=modalGuard('writeOff'); if(!c) return; const d=derive(c);
    const bal=round2(d.debt.principal.bal+d.debt.interest.bal+d.debt.penalty.bal);
    const body=`<p class="section-note">Списание — терминал с обязательными реквизитами решения. Без физического удаления.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид решения</span><div class="control"><input id="woKind" value="Решение Правления"></div></div>
        <div class="field req"><span class="flabel">Номер решения</span><div class="control"><input id="woNum" placeholder="РП-..."></div></div>
        <div class="field req"><span class="flabel">Дата решения</span><div class="control"><input id="woDate" type="date"></div></div>
        <div class="field"><span class="flabel">Сумма списания</span><div class="control"><input id="woAmount" type="number" value="${esc(bal)}"></div></div>
        <div class="field col-span"><span class="flabel">Скан</span><div class="control"><input id="woScan" placeholder="reshenie.pdf"></div></div>
      </div>`;
    CR.openModal('Списание кредита', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-tint danger" onclick="CR.submitWriteOff()">Списать</button>`);
  };
  CR.submitWriteOff=function(){ const c=modalGuard('writeOff'); if(!c) return;
    const doc={ kind:document.getElementById('woKind').value, num:document.getElementById('woNum').value,
      date:toDMY(document.getElementById('woDate').value), scan:document.getElementById('woScan').value,
      amount:+document.getElementById('woAmount').value||0 };
    const r=CR.closeCredit(c,{reason:'Списан',doc}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Кредит списан (решение '+doc.num+')','ok'); rerenderDetail(); };

  /* закрытие «Погашен» (closeCredit, Г-14) — доступно только при нулевом остатке и без взыскания (К-3 — заблокировано) */
  CR.openRepayModal=function(){ const c=modalGuard('repay'); if(!c) return;
    const body=`<p class="section-note">Закрытие «Погашен» — терминал при нулевом остатке по всем слоям и отсутствии активного взыскания. Реквизиты акта сверки.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">Вид документа</span><div class="control"><input id="rpKind" value="Акт сверки"></div></div>
        <div class="field req"><span class="flabel">Номер</span><div class="control"><input id="rpNum" placeholder="АС-..."></div></div>
        <div class="field req"><span class="flabel">Дата</span><div class="control"><input id="rpDate" type="date" value="${esc(toISO(CR.TODAY))}"></div></div>
        <div class="field"><span class="flabel">Скан</span><div class="control"><input id="rpScan" placeholder="akt-sverki.pdf"></div></div>
      </div>`;
    CR.openModal('Закрытие кредита «Погашен»', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-success" onclick="CR.submitRepay()">Закрыть как «Погашен»</button>`);
  };
  CR.submitRepay=function(){ const c=modalGuard('repay'); if(!c) return;
    const doc={ kind:document.getElementById('rpKind').value, num:document.getElementById('rpNum').value,
      date:toDMY(document.getElementById('rpDate').value), scan:document.getElementById('rpScan').value };
    const r=CR.closeCredit(c,{reason:'Погашен',doc}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Кредит закрыт: погашен','ok'); rerenderDetail(); };

  /* 9) link-pledge picker (linkPledge, Г-13) — только договоры того же ИНН + «Действует» */
  CR.openPledgePicker=function(){ const c=modalGuard('linkPledge'); if(!c) return;
    const linked=new Set((c.mirror.pledges||[]).map(p=>p.contractNum));
    const avail=(CR.db.pledgesRegistry||[]).filter(p=>p.active && p.pledgorInn===c.borrower.inn && !linked.has(p.contractNum)); // Г-13
    const body=`<p class="section-note">Показаны только действующие залоговые договоры того же ИНН заёмщика (${esc(c.borrower.inn)}), ещё не привязанные. Создать залоговый договор из кредита нельзя — только в модуле залога.</p>
      ${avail.length?`<div class="cpick">${avail.map(p=>{ const v=(p.items||[]).reduce((a,it)=>a+(it.pledgeValue||0)*(it.share==null?1:it.share),0);
        return `<div class="cpick-row" onclick="CR.pickPledge('${jsAttr(p.contractNum)}')">
          <div class="cpick-main"><span class="cpick-num">${esc(p.contractNum)}</span>
            <span class="cpick-sub"> · ${esc(p.pledgor)} · ${esc((p.items[0]||{}).name||'')}</span></div>
          <div class="cpick-claim">залог ${money(v)}</div></div>`; }).join('')}</div>`
        :`<div class="cgrid-empty">Нет доступных договоров того же ИНН для привязки</div>`}`;
    CR.openModal('Привязать залоговый договор', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Закрыть</button>`, {cls:'narrow'});
  };
  CR.pickPledge=function(num){ const c=modalGuard('linkPledge'); if(!c) return;
    const reg=(CR.db.pledgesRegistry||[]).find(p=>p.contractNum===num); if(!reg){ CR.modalErr(['Договор не найден']); return; }
    const pledge=Object.assign({ liquid:true, ban:false, date:CR.TODAY, otherCredits:[] }, reg);
    const r=CR.linkPledge(c,pledge); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Залоговый договор '+num+' привязан','ok'); rerenderDetail(); };

  /* 10) contract-amount (saveContractAmount, Г-1 · Р-12) — сумма договора owned кредитом, ≤ одобренной */
  CR.openContractAmountModal=function(){ const c=modalGuard('saveContractAmount'); if(!c) return;
    const body=`<p class="section-note">Сумма договора принадлежит кредиту, зажата проверкой: не может превышать одобренную по заявке (${money(c.approvedAmount)}).</p>
      <div class="mform">
        <div class="field"><span class="flabel">Одобрено (заявка)</span><div class="control"><input value="${esc(money(c.approvedAmount))}" readonly></div></div>
        <div class="field req"><span class="flabel">Сумма договора</span><div class="control"><input id="caAmount" type="number" min="0" value="${esc(c.contractAmount)}"></div></div>
      </div>`;
    CR.openModal('Изменить сумму договора', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitContractAmount()">Сохранить сумму</button>`);
  };
  CR.submitContractAmount=function(){ const c=modalGuard('saveContractAmount'); if(!c) return;
    const value=+document.getElementById('caAmount').value||0;
    const g=gate(c,'saveContractAmount',{value}); if(!g.ok){ CR.modalErr(g.reasons); return; }   // ре-валидация Г-1 перед мутацией
    const r=CR.saveContractAmount(c,value); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Сумма договора обновлена: '+money(value),'ok'); rerenderDetail(); };

  /* 10б) реквизиты договора (editContractRequisites) — № и дата договора, роль «Начальник отдела» */
  CR.openContractRequisitesModal=function(){ const c=modalGuard('editContractRequisites'); if(!c) return;
    const body=`<p class="section-note">№ и дата договора — паспортные поля, правка доступна только роли «Начальник отдела».</p>
      <div class="mform">
        <div class="field req"><span class="flabel">№ договора</span><div class="control"><input id="crNum" value="${esc(c.num)}"></div></div>
        <div class="field req"><span class="flabel">Дата договора</span><div class="control"><input id="crDate" type="date" value="${esc(toISO(c.date))}"></div></div>
      </div>`;
    CR.openModal('Изменить реквизиты договора', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitContractRequisites()">Сохранить</button>`);
  };
  CR.submitContractRequisites=function(){ const c=modalGuard('editContractRequisites'); if(!c) return;
    const num=document.getElementById('crNum').value, date=toDMY(document.getElementById('crDate').value);
    const g=gate(c,'editContractRequisites',{num,date}); if(!g.ok){ CR.modalErr(g.reasons); return; }
    const r=CR.editContractRequisites(c,{num,date}); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Реквизиты договора обновлены','ok'); rerenderDetail(); };

  /* 11) hold-accrual (holdAccrual, Р-17 · Г-15) — приостановление начисления процентов, роль «Начальник отдела»/«Куратор» */
  CR.openHoldModal=function(){ const c=modalGuard('holdAccrual'); if(!c) return;
    const body=`<p class="section-note">Приостановление начисления процентов — управляющее действие кредита. Требует основание, документ и дату начала. Пеня при паузе продолжает начисляться. Новый интервал добавляется к действующим приостановкам — записи не удаляются.</p>
      <div class="mform">
        <div class="field req"><span class="flabel">С (дата начала)</span><div class="control"><input id="haFrom" type="date"></div></div>
        <div class="field"><span class="flabel">По (дата окончания)</span><div class="control"><input id="haTo" type="date"></div></div>
        <div class="field req col-span"><span class="flabel">Основание</span><div class="control"><input id="haReason" placeholder="форс-мажор, ..."></div></div>
        <div class="field req col-span"><span class="flabel">Документ</span><div class="control"><input id="haDoc" placeholder="приказ №..."></div></div>
      </div>`;
    CR.openModal('Приостановить начисление', body,
      `<button class="btn btn-secondary" onclick="CR.closeModal()">Отмена</button><button class="btn btn-primary" onclick="CR.submitHold()">Приостановить</button>`);
  };
  CR.submitHold=function(){ const c=modalGuard('holdAccrual'); if(!c) return;
    const from=toDMY(document.getElementById('haFrom').value), to=toDMY(document.getElementById('haTo').value);
    const reason=document.getElementById('haReason').value, doc=document.getElementById('haDoc').value;
    const ctx={ from, to:to||null, reason, doc, by:currentRole };
    const g=gate(c,'holdAccrual',ctx); if(!g.ok){ CR.modalErr(g.reasons); return; }             // ре-валидация Г-15 перед мутацией
    const r=CR.holdAccrual(c,ctx); if(!r.ok){ CR.modalErr(r.reasons); return; }
    CR.closeModal(); toast('Начисление приостановлено: '+from+'–'+(to||'…'),'ok'); rerenderDetail(); };

  /* ============================================================
     МОДАЛКИ ОЖИВЛЁННЫХ МЕХАНИЗМОВ (КВ-11). Три из них закрывают кнопки-заглушки
     (КР-2), остальные дают вход гейтам, которые были написаны и недостижимы (КР-1,
     КР-3, КР-4, КР-5). Схема та же: modalGuard → форма → мутация CR.* → gate внутри.
     ============================================================ */

  /* 12) регистрация договора (registerCredit, Г-7) — переход ЖЦ «Проект» → «Зарегистрирован» */
