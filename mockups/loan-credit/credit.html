  const pledgesRegistry = [

  /* ============================================================
     РАСШИРЕННЫЙ ДЕМОНАБОР K-C1…K-C44 (44 кредита) — покрытие ВСЕХ веток логики для
     ручного тестирования. Каждая строка `scen` — сценарий; builder mkScen(s,i) строит
     валидную модель (леджер из od, залоги/поручительство/банк-гарантия из cov, взыскание
     из coll, реструктуризация/пауза/резерв/KM/плавающая/мульти-транш из флагов). ID, ИНН
     ('3…'), номера (C2xx) уникальны и не пересекаются с K-1…K-6b и фоном K-B*. Разнесено
     по 9 областям · 8 программам (ПРГ-1…8) · 6 кураторам · 4 валютам — чтобы задействовать
     каскад Область→Район и все фильтры реестра. Категория worst-of складывается из cat
     (A/B/C/D → низкий/средний/высокий) и дней просрочки (od). */
  /* Залоговый договор для сценария. kind — ВИД предмета из справочника ITEM_KINDS
     (ADR-0011): ликвидность и подвижность берутся из него, а не задаются на договоре.
     Запрет на отчуждение тоже переехал на предмет — «принадлежит вещи, а не договору». */
  const pl = (cn, name, item, kind, appr, pv) => ({ contractNum:cn, date:'10.02.2026', pledgor:name,
    notary:'Нотариус (реестр залога)',
    items:[{ name:item, kind, appraised:appr, pledgeValue:pv, share:1, ban:true }],
    otherCredits:[] });

  function mkScen(s, i){
    const num  = 'C'+(200+i);
    const inn  = '3'+String(1010200000000 + i*137).slice(0,13);          // 14 знаков, уникален
    const ccy  = s.cur || 'KGS';
    const amount   = s.a;
    const contract = s.cl ? Math.round(amount*0.8) : amount;             // cl: сумма договора < одобренной
    const life = s.life || 'Действует';
    const rate = s.rate || 10, term = s.term || 24;
    const dd0  = '15.02.2026';
    const disbMode = life==='Проект' ? 'none' : (s.disb || 'full');      // Проект не осваивается (Г-5)
    const disbAmt  = disbMode==='full' ? contract : disbMode==='partial' ? Math.round(contract*0.6) : 0;

    /* ГРАФИК И ПОГАШЕНИЯ вместо засеянного ledger (ADR-0010). Просрочка выводится из
       позиции графика, погашение — из подтверждённых платежей; ни одна величина долга
       больше не задаётся напрямую. */
    let schedules = [], payments = [], paymentsAsOf = null, seedClose = null;
    if (life === 'Закрыт'){
      schedules = [ seedSchedule(dd0, 400, contract, rate, term, Math.min(term, 6)) ];
      const closureReason = s.closure || 'Погашен';
      /* «Погашен» гасится полностью; «Списан» — частично, поэтому у списанного остаётся
         ненулевой остаток, и подгруппа честно говорит «безнадёжные долги» (КР-12).
         Сумма процентов НЕ выдумывается процентом от договора: 12 % от суммы договора
         разносилось в статью, где начислено втрое меньше, и разницу молча съедал
         `Math.min` в debtOf — до 66 935 сомов на кредит (КР-48). Платёж досчитывается
         вторым проходом из ПОСТРОЕННОГО расчёта, как и у платящих по графику. */
      seedClose = closureReason === 'Списан' ? { date:'10.06.2026', share:0.35 }
                                             : { date:'20.06.2026', share:1 };
      paymentsAsOf = seedClose.date;
    } else if (disbAmt > 0){
      /* с просрочкой — сеем версию графика, первая позиция которой отстоит на s.od дней;
         без просрочки — график не сеем вовсе (движок построит от даты освоения), а
         погашения досчитываются вторым проходом seedSettlePayments: считать их здесь
         нельзя, записей условий у транша ещё нет. */
      if (s.od > 0){ schedules = [ seedSchedule(dd0, s.od, disbAmt, rate, term, 5) ]; paymentsAsOf = TODAY; }
    }

    /* обеспечение: залоги / банковская гарантия (в индексе) / поручительство (вне индекса) */
    const pledges=[], guarantees=[]; let bankGuarantee=null;
    switch(s.cov){
      case 'under':  pledges.push(pl('ЗД-'+num, s.n, 'Автотранспорт', 'Транспортное средство', Math.round(contract*1.0), Math.round(contract*0.84))); break;      // движимый неликвид ⇒ порог 150 %
      /* смешанный состав: недвижимость (ликвид) + сельхозтехника (движимый неликвид) ⇒
         порог 150 %, обе подпроверки §2.4 выполнены — ликвид покрывает ≥ 80 % долга. */
      case 'mixed':  pledges.push(pl('ЗД-'+num+'a', s.n, 'Производственный корпус', 'Недвижимое имущество', Math.round(contract*1.1), Math.round(contract*0.90)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Спецтехника (б/у)', 'Сельхозтехника',      Math.round(contract*0.9), Math.round(contract*0.72))); break;
      /* КР-39: индекс выполнен, а СОСТАВ не тот — весь залог движимый неликвид, доля
         ликвида 0 % при минимуме 80 %. Единственный случай в наборе, где гейт Г-6
         блокирует по второй подпроверке, а не по индексу. */
      case 'illiq':  pledges.push(pl('ЗД-'+num+'a', s.n, 'Серверное оборудование', 'Оборудование',   Math.round(contract*1.3), Math.round(contract*1.10)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Инженерные системы (б/у)', 'Оборудование', Math.round(contract*0.7), Math.round(contract*0.55))); break;
      case 'liq150': pledges.push(pl('ЗД-'+num+'a', s.n, 'Складское помещение','Недвижимое имущество',Math.round(contract*1.6), Math.round(contract*1.35)));
                     pledges.push(pl('ЗД-'+num+'b', s.n, 'Оборудование (б/у)', 'Оборудование',        Math.round(contract*0.35),Math.round(contract*0.28))); break; // ликвид + движимый неликвид ⇒ 150 %
      /* Гарантия всегда в сомах: у кредита в KGS порог гарантии 100 %, у кредита в иной
         валюте — 120 % (курсовой запас, Прил.1 §2.3). Одна строка даёт обе ветки. */
      case 'bank':   bankGuarantee = { bank:'ОАО «Айыл Банк»', amount:Math.round(contract*1.3), currency:'KGS',
                                       till:'10.02.2027', num:'БГ-'+num, date:'10.02.2026' }; break;
      case 'poruch': guarantees.push({ contractNum:'ПОР-'+num, party:'ОсОО «Гарант-'+num+'»', amount:Math.round(contract*1.5), date:'10.02.2026' }); break; // в индекс НЕ входит (ADR-0011)
      case 'none':   break;
      default:       pledges.push(pl('ЗД-'+num, s.n, 'Административное здание', 'Недвижимое имущество', Math.round(contract*1.7), Math.round(contract*1.4)));       // ок, ≥120 %
    }

    /* ТРЕБОВАНИЯ взыскания (ADR-0002) + судебные решения. Фаза и стадия приходят
       свёрнутыми из журнала мер (ADR-0003) — кредит их не хранит и не выводит. */
    const claims=[], court=[]; let claimsAsOf = null, collectionCosts = 0;
    if (s.coll){
      const M = { claim:   ['Досудебная','Претензия направлена','направлена претензия должнику', 0],
                  court:   ['Судебная','Иск подан','подан иск в суд', 3200],
                  ispolnit:['Исполнительная','ИЛ у судоисполнителя','ИЛ передан судоисполнителю', 5400],
                  bankrot: ['Банкротство','Дело возбуждено','возбуждено дело о банкротстве', 12000] }[s.coll];
      collectionCosts = M[3];
      claims.push(seedClaim({ claimId:'ТРБ-'+num, processId:'ВЗ-'+num,
        obligor:{ inn, name:s.n, role:'заёмщик' }, phase:M[0], stage:M[1],
        amount:Math.round(amount*0.08), since:'01.05.2026', lastMeasure:'01.05.2026 — '+M[2], costs:M[3] }));
      /* поручитель — ВТОРОЕ обязанное лицо по тому же процессу: своё требование,
         своя стадия. Именно этой размерности не было в прежней модели (КР-31). */
      if (s.cov === 'poruch')
        claims.push(seedClaim({ claimId:'ТРБ-'+num+'-П', processId:'ВЗ-'+num,
          obligor:{ inn:'9'+inn.slice(1), name:'ОсОО «Гарант-'+num+'»', role:'поручитель' },
          scope:'Солидарное требование по договору поручительства ПОР-'+num,
          phase:'Досудебная', stage:'Требование направлено', amount:Math.round(amount*0.08),
          since:'05.05.2026', lastMeasure:'05.05.2026 — направлено требование поручителю', costs:0 }));
      claimsAsOf = '20.07.2026';
      /* Присуждена ПРОСРОЧЕННАЯ часть, не весь долг: иски подают и на неё, и на всю сумму
         (§6 спеки платежей). Отсюда доля тела под решением меньше единицы, и начисление
         останавливается частично — ровно то, что не выражается флагом на кредите. */
      if (s.coll==='court' || s.coll==='ispolnit')
        court.push({ date:'20.05.2026', kind:'Судебный приказ', org:'Районный суд', res:'Выдан', ok:true,
                     amount:Math.round(amount*0.08), il:'ИЛ-'+num, file:'prikaz-'+num+'.pdf' });
      /* K-C12 (num='C211') получает ВТОРОЙ акт — единственный многослойный случай в
         демонаборе, нужен для проверки пропуска уже помеченных позиций лестницей
         (credit-check.mjs #98, ADR-0060 §3). */
      if (num==='C211')
        court.push({ date:'25.06.2026', kind:'Судебный приказ', org:'Районный суд', res:'Выдан', ok:true,
                     amount:35000, il:'ИЛ-C211/2', file:'prikaz-C211-2.pdf' });
      /* Определение о возбуждении дела о банкротстве СЛОЯ НЕ ОБРАЗУЕТ: присуждать нечего,
         суммы в нём нет. Последствия банкротства принадлежат взысканию (КР-33). */
      if (s.coll==='bankrot')
        court.push({ date:'25.05.2026', kind:'Определение о банкротстве', org:'Межрайонный суд', res:'Возбуждено', ok:false, file:'bankrot-'+num+'.pdf' });
    }

    /* реструктуризация — признак состояния; послабление (подавление 181-го дня) —
       ОТДЕЛЬНАЯ запись со сроком и основанием (ADR-0012), а не флаг внутри неё */
    const restructuring = s.restr
      ? { count:1, active:{ id:'РС-'+num, stage:s.restr.stage, deadline:'12.09.2026', amount:Math.round(amount*1.05),
          currency:ccy, pause: s.restr.pause?{days:s.restr.pause}:undefined } }
      : { count:0, active:null };
    const relief = (s.restr && s.restr.o181) || s.hold === 181
      ? [{ kind:'suppress181', from:'01.05.2026', deadline:'12.09.2026',
           basis: s.restr ? ('Заявка на реструктуризацию РС-'+num+' на рассмотрении')
                          : 'Решение о приостановлении принудительных мер',
           doc:'relief-181-'+num+'.pdf' }]
      : [];
    const accrualHold = s.hold
      ? [{ from:'01.06.2026', to:'01.09.2026',
          reason: s.hold===181 ? 'Приостановление на период рассмотрения реструктуризации' : 'Форс-мажор (стихийное бедствие)',
          doc:'prikaz-hold-'+num+'.pdf', by:s.c }]
      : [];
    /* фактор категории вместо прежней «группы риска» A/B/C/D (ADR-0012) */
    const factors = (s.cat === 'B' || s.cat === 'C' || s.cat === 'D')
      ? [{ kind: s.cat === 'B' ? 'Снижение выручки' : s.cat === 'C' ? 'Утрата платёжеспособности' : 'Признание задолженности безнадёжной',
           level: s.cat === 'B' ? 'средний' : 'высокий', from:'01.03.2026', to:null,
           committeeRef:'ККР-'+num+' от 25.02.2026', note:'По итогам мониторинга' }]
      : [];

    const t1disb = s.tr2 ? (disbAmt>0?[{date:dd0,amount:Math.round(contract*0.6),order:'ПП-'+num,purpose:s.pu,doc:'akt-'+num+'.pdf'}]:[]) : disbmts();
    function disbmts(){ return disbAmt>0 ? [{ date:dd0, amount:disbAmt, order:'ПП-'+num, purpose:s.pu, doc:'akt-'+num+'.pdf' }] : []; }
    const tranches = [ mkTranche({ id:'K-C'+(i+1)+'-T1', no:1, subject:{ inn, name:s.n },
      amount: s.tr2?Math.round(contract*0.6):contract, plannedDate:'12.02.2026',
      disbursements:t1disb, schedules, accrualHold }) ];
    if (s.tr2) tranches.push(mkTranche({ id:'K-C'+(i+1)+'-T2', no:2, subject:{ inn, name:s.n },
      amount:Math.round(contract*0.4), plannedDate:'01.10.2026', disbursements:[], accrualHold }));

    return mkCredit({
      id:'K-C'+(i+1), num, date:'05.02.2026',
      reg:{ num, date:'07.02.2026', scan:'dog-'+num+'.pdf', comment:'' },
      origin:{ applicationId:'ЗАЯ-'+num, applicationDate:'29.01.2026', commissionId:'КОМ-'+num, programId:s.p, govDecisionId:'ПП-470' },
      borrower:{ inn, name:s.n, type:'ЮЛ', region:s.r, district:s.d },
      approvedAmount: s.cl?amount:contract, contractAmount:contract, currency:ccy,
      /* КР-59: как и у фона — из набора программы s.p. Прежняя линия читалась
         «Единовременный/Возобновляемая» по числу траншей: АРР/ФРР это доноры, а не
         однократность выдачи, и число траншей о линии ничего не говорит. */
      kind:pickCls(s.p,'kind',i), line:pickCls(s.p,'line',i),
      purpose:s.pu, fundingSource:pickCls(s.p,'fundingSource',i),
      accounts:{ repayAcct:'12800000000'+(20000+i), repayAcctKind:'Расчётный', payCode:'PC-'+num },
      /* coverPct — порог обеспеченности, установленный решением КМ (ADR-0011, Прил.1 §2.6):
         решение не отменяет обеспечение, а назначает свой порог. Это поле читает и
         модуль залога — до волны его в модели кредита не было вовсе (КР-35). */
      kmDecision: s.km ? { kind:'Решение КМ', num:'КМ-'+num, date:'08.02.2026', scan:'km-'+num+'.pdf',
                           /* залога нет вовсе → решение освобождает от порога целиком (0 %);
                              залог есть, но не дотягивает → порог понижен до 80 % */
                           coverPct: (pledges.length || bankGuarantee) ? 80 : 0,
                           reason:'Порог обеспечения установлен решением КМ (Прил.1 §2.6)' } : null,
      lifecycle:life,
      closure: life==='Закрыт'
        ? { reason:s.closure||'Погашен', date:'20.06.2026',
            doc: (s.closure==='Списан')
              ? { kind:'Решение Правления', num:'РП-'+num, date:'18.06.2026', scan:'rp-'+num+'.pdf' }
              : { kind:'Акт сверки',       num:'АС-'+num, date:'20.06.2026', scan:'as-'+num+'.pdf' } }
        : null,
      baseConditions: condDefaults({ rate, term,
        floatMeta: s.float ? { rate:{ benchmark:'учётная ставка НБКР', margin:3 } } : {},
        reserveRate:s.reserve?2:0 }),
      accrualHold, relief, factors,
      /* служебная пометка сидирования: «этот кредит платит по графику» — обработается
         вторым проходом (seedSettlePayments) и будет удалена из модели */
      _seedSettle: (life === 'Действует' && disbAmt > 0 && !(s.od > 0)) ? TODAY : null,
      _seedClose: seedClose,                       // закрытый кредит: платёж из построенного расчёта
      /* обязательный комплект программы (Г-7). Один сценарий на десять получает
         документ в НЕзакрывающем состоянии — иначе состояния «на проверке»,
         «отклонён», «просрочен» не встречались бы в демо ни разу (КР-22). */
      docs: programDocs({ origin:{ programId:s.p } }).req.map((kind, j) => ({

     ЗАКРЫВАЮЩИЕ наступившие позиции. Раньше здоровье кредита объявлялось строкой ledger
     с нулевой просрочкой; теперь оно должно быть заработано погашениями — иначе движок
     честно покажет просрочку с первой же позиции. Считать это в mkScen нельзя: график
     строится от записей условий, а они появляются строкой выше. */
  for (const c of credits){
    const close = c._seedClose; delete c._seedClose;
    if (close){
      /* ЗАКРЫТЫЙ КРЕДИТ: платёж гасит то, что ПОСЧИТАНО на дату закрытия, а не долю от
         суммы договора. Иначе «Погашен» с ненулевым остатком либо, наоборот, переплата,
         спрятанная срезом (КР-48). Доля < 1 — списание: остаток обязан остаться. */
      const led = buildLedger(c, close.date);
      const disb = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
      const dbt = debtOf(led, disb);
      /* Пеня в закрывающий платёж НЕ кладётся: она считается на НЕПОКРЫТЫЙ остаток, то
         есть исчезает от самого этого платежа. Положить её — значит разнести деньги в
         статью, которой после разнесения не существует, и получить переплату из воздуха.
         Сборы так себя не ведут: это реестр начислений, от платежей независимый. */
      const L = { principal: round2(disb * close.share),
                  interest:  round2(dbt.interest.accrued * close.share),
                  fees:      round2(dbt.fees.accrued     * close.share) };
      if (L.principal + L.interest + L.fees > 0){
        c.mirror.payments.push(seedPayment(1, close.date, (c.tranches[0]||{}).no || 1, L));
        c.mirror.paymentsAsOf = close.date;
      }
    }
    if (!c._seedSettle){ delete c._seedSettle; continue; }
    const upTo = c._seedSettle; delete c._seedSettle;
    const led = buildLedger(c, upTo);
    let principal = 0, interest = 0;
    for (const r of led.rows){ principal += r.principalDue; interest += r.interestCharged; }
    if (principal + interest <= 0) continue;
    c.mirror.payments.push(seedPayment(1, upTo, (c.tranches[0]||{}).no || 1,
      { principal: round2(principal), interest: round2(interest) }));
    c.mirror.paymentsAsOf = upTo;
  }

  /* КР-22 · waiver залоговой комиссии — ВТОРОЙ разблок Г-6 (канон К-5, смоук №8).

  const kWaiver = credits.find(c => /Первомай-Фарм/.test(c.borrower.name));

  /* КР-3 · soft-close транша (Г-17): состояние, которого модель не умела показать —

  /* Берём «Узген-Строй», а НЕ первый двухтраншевый кредит: первый занят демонстрацией

  const kDisbClosed = credits.find(c => /Талас-Фасоль/.test(c.borrower.name));

  /* КР-20 · целевое использование: вкладка показывала «Документов 0 · Проверок 0 ·
     Мер 0 · Решение Комитета —» на всех 59 кредитах. Освоенные деньги без единого
     подтверждающего документа — состояние, которого в реальной работе не бывает. */
  for (const c of credits){
    if ((c.targetUse.docs || []).length) continue;
    const disb = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
    if (disb <= 0) continue;                                  // не освоен — подтверждать нечего
    const dt = (c.tranches[0].disbursements[0] || {}).date || c.date;
    c.targetUse.docs.push({ date:dt, title:'Платёжное поручение и акт приёма-передачи', result:'принято', file:'tu-'+c.id+'.pdf' });
    c.targetUse.checks.push({ date:fd(addM(pd(dt), 2)), title:'Камеральная проверка целевого использования',
                              result:'соответствует', file:'check-'+c.id+'.pdf' });

  /* КР-21 · журнал аудита: у 59 кредитов из 59 он был пуст до первого клика — засеянные

     минимальный след по тому, что в модели уже есть; порядок задаётся счётчиком. */
  for (const c of credits){
    const at = (what, when) => c.audit.push(Object.freeze({ seq:++_auditSeq, when, who:'Кредитный специалист', what, before:null, after:null }));
    at('createCredit: кредит создан из заявки ' + (c.origin.applicationId || '—'), c.date);
    if (c.lifecycle !== 'Проект') at('registerCredit: ЖЦ «Проект» → «Зарегистрирован»', c.reg.date || c.date);
    if (c.lifecycle === 'Действует') at('activateCredit: ЖЦ «Зарегистрирован» → «Действует»', c.reg.date || c.date);

    }
    for (const a of (c.agreements || [])) at('addAgreement: ' + a.num + ' (' + (a.source || 'кредит') + ')', a.date);

  /* ПЛАНЫ (ADR-0042) — сеются точечно, чтобы демо показывало все четыре состояния строки:
     обычный план · план с правкой · план снятый · месяц без плана (выпадает из расчёта).

  (() => {
    const c1 = credits.find(x => x.id === 'K-1');
    if (c1) c1.plan = [

      { month:'2026-06', amount:30000, setBy:'Куратор', setAt:'12.05.2026', seededFrom:26100,
        history:[{ at:'12.06.2026', by:'Куратор', prev:26000, note:'уточнено после доп. соглашения' }] },

        history:[{ at:'20.07.2026', by:'Начальник отдела', prev:28000, note:'план снят: заёмщик в реструктуризации' }] },
      /* 2026-09 — плана нет: месяц выпадает из расчёта целиком (и из квартала, и из года) */
      { month:'2026-10', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      { month:'2026-11', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      /* БУДУЩИЙ ГОД (КВ-22): цель поставлена, месяцы не наступили — год в разрезе стоит
         с планом, прочерком в исполнении и подписью «наступило 0». Без такой строки
         разрез по годам показывал бы только прошлое и настоящее. */
      { month:'2027-02', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
      { month:'2027-03', amount:28000, setBy:'Куратор', setAt:'30.06.2026', seededFrom:27400, history:[] },
    ];
    const c2 = credits.find(x => x.id === 'K-2');
    if (c2) c2.plan = [
      { month:'2026-07', amount:40000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:39200, history:[] },
      { month:'2026-08', amount:40000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:39200, history:[] },
    ];
    const c3 = credits.find(x => x.id === 'K-3');
    if (c3) c3.plan = [
      { month:'2026-07', amount:15000, setBy:'Куратор', setAt:'01.07.2026', seededFrom:15000, history:[] },

    /* МНОГОЛЕТНИЙ РАЗРЕЗ (КВ-22) на K-6: выдан 15.01.2024, закрыт «Погашен» 20.06.2026 —

       стоят с целью и нулевым сбором, а 2026 — со 101 %: ровно те три состояния года,
       которых разрез требует, чтобы его можно было рецензировать.
       Кредит закрыт, и гейт Г-30 «Поставить план» на нём не пустит — это верно: план
       здесь исторический, новую цель на закрытый кредит не ставят. */
    const c6 = credits.find(x => x.id === 'K-6');
    if (c6) c6.plan = [
      { month:'2024-06', amount:6000, setBy:'Куратор', setAt:'20.05.2024', seededFrom:5800, history:[] },

      { month:'2025-06', amount:8000, setBy:'Куратор', setAt:'20.05.2025', seededFrom:7900,
        history:[{ at:'01.06.2025', by:'Начальник отдела', prev:6000, note:'ужесточено: тело не гасится второй год' }] },
      { month:'2025-12', amount:8000, setBy:'Куратор', setAt:'20.11.2025', seededFrom:7900, history:[] },
      { month:'2026-06', amount:140000, setBy:'Куратор', setAt:'20.05.2026', seededFrom:139500,
        history:[{ at:'25.05.2026', by:'Куратор', prev:8000, note:'заёмщик заявил полное погашение' }] },

  return { credits, applications, pledgesRegistry };
}

/* ============================================================
   3. ЧИСТЫЙ ЛОГИЧЕСКИЙ СЛОЙ — derive / buildSchedule (Task 2).
   Все функции чистые (не трогают document); ничего из §4 не хранится в модели —
   derive пересчитывается при каждой перерисовке, кэш запрещён (Р-11).
   gate / canRole / мутации добавляются в следующих задачах.
   ============================================================ */

/* округление до копеек (детерминированное упрощение, не банковский движок) */
function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
/* Σ освоений транша (Р-6) */
function disbursedSum(t){ return (t.disbursements || []).reduce((x,d) => x + (d.amount||0), 0); }

/* ---- ПЕРЕНОС ТЕЛА МЕЖДУ ТРАНШАМИ (ADR-0092 §2, КВ-26) ----
   t.transfers[] — ЕДИНСТВЕННОЕ новое хранилище волны; всё остальное (происхождение
   транша, остаток тела, состав статейных колонок) считается от него. Запись:
     { date, dir:'out'|'in', amount, counterTranche, basis:{ds,date}, parts:[…] }
   ДВЕ записи на одну операцию — у отдающего и у принимающего, — а не одна общая: транш
   обязан читаться сам по себе, карточка и ИР-3 не должны ходить по соседям, чтобы узнать
   свой остаток. Перенос ДАТИРОВАН и несёт основание: без даты остаток тела не имеет
   среза, без основания операция необратима и необъяснима. */
function transfersOf(t, d){
  const lim = d ? pd(d) : null;
  return (t.transfers || []).filter(x => !lim || pd(x.date) <= lim);
}
function transferredOut(t, d){ return round2(transfersOf(t,d).filter(x => x.dir==='out').reduce((a,x) => a + (x.amount||0), 0)); }
function transferredIn (t, d){ return round2(transfersOf(t,d).filter(x => x.dir==='in' ).reduce((a,x) => a + (x.amount||0), 0)); }

/* Происхождение транша ВЫВОДИТСЯ (Р-11 / ADR-0001): есть входящий перенос ⇒ транш рождён
   разделением по ДС, иначе — освоением (ADR-0092 §1). Поля на транше нет намеренно: оно
   завело бы второй источник истины рядом с самим переносом и разъехалось бы с ним при
   первой же правке. */
function trancheOrigin(t){ return (t.transfers || []).some(x => x.dir==='in') ? 'разделение' : 'освоение'; }
function originTransfer(t){ return (t.transfers || []).find(x => x.dir==='in') || null; }
function originDs(t){ const x = originTransfer(t); return (x && x.basis && x.basis.ds) || null; }

/* Погашенное ТЕЛО транша на дату — сворачивается из ЛЕДЖЕРА (r.principalPaid). Своего
   хранилища у погашения нет и не заводится: платежи приходят зеркалом (ADR-0010), и
   вторая копия разошлась бы с ним молча. */
function repaidPrincipalOf(credit, t, d){
  const led = buildLedger(credit, d);
  return round2((led.rows || []).filter(r => r.trancheNo === t.no)
    .reduce((a,r) => a + (r.principalPaid || 0), 0));
}

/* ИР-3 (ADR-0092 §2): остаток тела транша = освоено − погашено − перенесено + принято.
   Именно ЧЕТЫРЕ слагаемых, а не «сумма транша минус погашенное»: после разделения по ДС
   сумма транша и его тело — разные величины, и у производного транша освоений нет вовсе. */
function trancheBalanceAt(credit, t, d){
  return round2(disbursedSum(t) - repaidPrincipalOf(credit, t, d)
                - transferredOut(t, d) + transferredIn(t, d));
}
/* активен ли интервал приостановки начисления на дату среза (Р-17) */
function holdIsActive(h, asOf){
  if (!h || !h.from) return false;
  const lim = pd(asOf || TODAY);
  if (pd(h.from) > lim) return false;
  return !h.to || pd(h.to) >= lim;
}
/* ---- ПОСЛАБЛЕНИЯ (ADR-0012) ----
   Послабление — запись со сроком и основанием, СНИМАЮЩАЯ последствие просрочки.
   Прежняя реализация опознавала подавление 181-го дня регуляркой /181/ по свободному
   тексту основания приостановки начисления (КР-15): «Постановление 181-ФЗ» включало бы
   послабление ложно. И срока у него не было — булев флаг вместо записи, тогда как
   CONTEXT.md требует, чтобы послабление «действовало в свой срок». */
function reliefActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.relief || []).filter(r => r && r.from && pd(r.from) <= lim
    && (!r.deadline || pd(r.deadline) >= lim));
}
function relief181(c, asOf){ return reliefActive(c, asOf).find(r => r.kind === 'suppress181') || null; }

/* ---- ФАКТОРЫ КАТЕГОРИИ (ADR-0012) ----
   Второй вход worst-of вместо несуществовавшей «группы риска A/B/C/D». Фактор без
   ссылки на решение комитета НЕ действует (инвариант И-1 модуля заёмщика): категорию
   нельзя «настроить» — за каждым ужесточением стоит документ. */
function factorsActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.factors || []).filter(f => f && f.committeeRef && f.from && pd(f.from) <= lim
    && (!f.to || pd(f.to) >= lim));
}

/* ---- 3.1 buildSchedule(tranche, fromDate) — амортизация от фактической даты освоения ----
   Возврат: {rows:[{no,date,total,principal,interest,accrued}]}, где accrued — НАЧИСЛЕННЫЕ
   за период проценты (могут отличаться от interest в льготе по процентам).

   ТРИ ЛЬГОТЫ — три разных механизма (КР-13; до этой волны graceAccrual не читался
   движком вовсе, а graceInterest выполнял его работу):
     graceMain     — основной долг не гасится, проценты платятся;
     graceAccrual  — проценты НЕ НАЧИСЛЯЮТСЯ вовсе (отсрочка начисления);
     graceInterest — проценты начисляются, но НЕ ПЛАТЯТСЯ; накопленное раскладывается
                     равными долями по оставшимся периодам.
   Льготы заданы в МЕСЯЦАХ, а период платежа может быть длиннее месяца — переводим
   в периоды с округлением вверх (льгота не должна «съедаться» длинным периодом).

   ПЕРИОДИЧНОСТЬ (freq) тоже начинает работать (КР-13): число платежей = срок / длина
   периода, ставка за период = годовая × месяцев в периоде / 12. Прежний движок всегда
   строил помесячно, и правка «ежеквартально» не меняла ничего.

   Приостановка начисления (t.accrualHold — зеркало credit.accrualHold: holdAccrual
   пишет интервал в кредит и зеркалит на каждый транш, т.к. сюда приходит только транш)
   обнуляет начисление процентов за период; пеня при паузе не затрагивается. */
const FREQ_MONTHS = { 'ежемесячно':1, 'ежеквартально':3, 'раз в полгода':6, 'ежегодно':12 };
function freqMonths(f){ return FREQ_MONTHS[f] || 1; }

/* ============================================================
   ПЛАН КРЕДИТА (ADR-0042) — единственная ВВОДИМАЯ величина среди трёх ориентиров.
   График — контракт транша. Прогноз — текущее ожидание, выводится. План — что сами
   себе поставили целью на месяц: хранится, потому что относится к ПРОШЛОМУ решению,
   а не к текущему состоянию долга. Если бы план пересчитывался вслед за прогнозом,
   % исполнения плавал бы от досрочного погашения по чужому траншу того же кредита,
   хотя ни план, ни факт в этом месяце не менялись. Неподвижность и есть его смысл.
   Три сущности друг на друга НЕ ссылаются (ADR-0042 §4).
   Месяц везде — строка 'YYYY-MM': сравнивается лексикографически, без Date.
   ============================================================ */
const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь',
                   'июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function monthKey(dateStr){                       // '14.08.2026' -> '2026-08'
  const d = pd(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthLabel(mk){                          // '2026-08' -> 'август 2026'
  const [y, m] = String(mk || '').split('-');
  return (MONTHS_RU[(+m) - 1] || '—') + ' ' + y;
}
function monthAdd(mk, k){
  const [y, m] = String(mk).split('-').map(Number);
  const t = (y * 12 + (m - 1)) + (k | 0);
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
function monthRange(fromMk, toMk){
  const out = [];
  if (!/^\d{4}-\d{2}$/.test(String(fromMk)) || !/^\d{4}-\d{2}$/.test(String(toMk))) return out;
  for (let mk = fromMk; mk <= toMk; mk = monthAdd(mk, 1)){ out.push(mk); if (out.length > 240) break; }
  return out;
}

/* Строка плана месяца. amount === null — план СНЯТ (И-14: снятие не удаление,
   строка остаётся видимой, прежнее значение уходит в history). */
function planRowOf(credit, mk){
  return ((credit && credit.plan) || []).find(p => p.month === mk) || null;
}
function planAmountOf(credit, mk){
  const r = planRowOf(credit, mk);
  return r && r.amount != null ? r.amount : null;
}

/* freq==='по конкретным месяцам' (Шаг 18, Q6): payMonths хранится и версионируется
   как условие, но график по нему НЕ строится — движок падает на freqMonths()||1
   (помесячно). Это не пропуск: сама программа (renderTab6, R19) при этом режиме
   принудительно переключает метод погашения на «Индивидуальный» — то есть график
   для него не формула, а ручной ввод, и donor-модель не даёт, от чего вести расчёт
   при неравных промежутках между месяцами. Решать наравне с производственным
   календарём (открытый вопрос §10.5), не изобретая формулу молча. */
/* НАЧИСЛЕНИЕ ЗА ОДИН ПЕРИОД — единственная реализация правила (решение 5 разбора
   «Прогноза», 10.08.2026). Знает ровно три вещи, которые обязаны знать оба потребителя:
   день-базу (dayMethod), паузу начисления (accrualHold, Р-17) и ставку на дату.
   Зовут двое: buildSchedule строит КОНТРАКТ, trancheForecastRows — ОЖИДАНИЕ по нему.
   Пока реализаций было две, прогноз не знал ни пауз, ни день-базы и считал плоским
   rate/12·mpp: на кредите с приостановкой начисления он обещал проценты, которых
   движок не начислит, — и расходился с «Расчётами» ровно там, где на него смотрят. */
function periodInterest(tranche, cnd, prevDate, date, bal, mpp){
  const paused = ((tranche && tranche.accrualHold) || []).some(h => h && h.from &&
    pd(h.from) <= date && (!h.to || pd(h.to) >= date));
  if (paused || !((cnd.rate || 0) > 0) || bal <= 0.005) return 0;
  const db = dayBasis(cnd.dayMethod, date);
  const days = db.numFin ? 30 * mpp : Math.max(0, dd(prevDate, date));
  return round2(bal * (cnd.rate || 0) / 100 * days / db.base);
}

/* СТАТЬИ СТРОКИ ГРАФИКА (ADR-0109, КВ-26). Реструктуризация раскладывает по графику не
   только тело: накопленные проценты, накопленную пеню и распределённое. Ставка при этом
   начисляется ТОЛЬКО по основному долгу — поэтому статьи держатся отдельным вложенным
   объектом, а не подмешиваются в r.principal (он авторитетен для леджера и прогноза).
   Порядок реестра = очередь погашения: что гасится раньше, стоит левее. */
const SCHED_ARTICLES = [
  { key:'accInterest', label:'Накопл. проценты' },
  { key:'accPenalty',  label:'Накопл. пеня' },
  { key:'other',       label:'Прочие' }
];
function rowArticlesSum(r){
  const a = r && r.articles; if (!a) return 0;
  return round2(SCHED_ARTICLES.reduce((s,x) => s + (a[x.key] || 0), 0));
}
/* Состав НЕПУСТЫХ статейных колонок. Пустая не рисуется — та же идиома, что «Курс / ≈KGS»
   у валютных: обычный кредит обязан выглядеть ровно как до волны. */
function scheduleArticleCols(rows){
  return SCHED_ARTICLES.filter(x => (rows||[]).some(r => r.articles && (r.articles[x.key]||0) > 0.005));
}
/* Раскладка безставочной части по позициям интервала [from..to] равными долями; остаток
   от округления — в последнюю позицию интервала, иначе Σ колонок разъедется с суммой
   переноса и плашка ИР-2′ соврёт (ИР-2′ мерится в копейку, порог 0,005). */
function spreadArticles(rows, parts){
  (parts || []).forEach(p => {
    const seg = (rows||[]).filter(r => r.no >= (p.from||1) && r.no <= (p.to || rows.length));
    if (!seg.length) return;
    const per = round2((p.amount || 0) / seg.length);
    let acc = 0;
    seg.forEach((r,i) => {
      const v = i === seg.length-1 ? round2((p.amount||0) - acc) : per;
      acc = round2(acc + v);
      r.articles = r.articles || {};
      r.articles[p.key] = round2((r.articles[p.key] || 0) + v);
      r.total = round2((r.total || 0) + v);      // «Платёж» = то, что человек платит в эту дату
    });
  });
  return rows;
}

function buildSchedule(tranche, fromDate){
  const c = conditionsAt(tranche, TODAY);        // Р-21: условия транша — производное от записей
  const P = disbursedSum(tranche) || tranche.amount || 0;        // амортизируем освоенный ОД
  const mpp = freqMonths(c.freq);                                // месяцев в периоде платежа
  const termM = Math.max(1, c.term | 0);                         // срок, мес.
  const n = Math.max(1, Math.ceil(termM / mpp));                 // число ПЛАТЕЖЕЙ
  const i = (c.rate || 0) / 100 / 12 * mpp;                      // ставка за период
  const method = c.method || 'аннуитет';
  const gMainP = Math.ceil(Math.max(0, c.graceMain | 0) / mpp);       // льгота по ОД, периодов
  const gAccrP = Math.ceil(Math.max(0, c.graceAccrual | 0) / mpp);    // отсрочка начисления, периодов
  const gIntP  = Math.ceil(Math.max(0, c.graceInterest | 0) / mpp);   // льгота по %, периодов
  /* Шаг 18 (Q5): окно распределения отсроченных % — по умолчанию (0/0, как у всех
     59 демо-кредитов до этого шага) поведение не меняется — распределяем по ВСЕМ
     периодам после льготы, как раньше. Заданное окно [from,to] сужает распределение;
     непопавшее в окно копится и — как и раньше — гасится последним платежом (ниже). */
  const gIntDistFrom = (c.graceIntDistFrom | 0) > 0 ? (c.graceIntDistFrom | 0) : (gIntP + 1);
  const gIntDistTo   = (c.graceIntDistTo   | 0) > 0 ? (c.graceIntDistTo   | 0) : n;
  const start = pd(fromDate);
  /* Шаг 18 (Q1/Q2): день платежа (payDay) и привязка последнего платежа
     (lastPaymentAnchor) — по умолчанию (payDay=0, anchor='по дате выдачи') поведение
     совпадает с прежним: день — из даты освоения, даты — n периодов от неё же.
     «По дате 1-го платежа» считает от даты 1-го платежа (firstPay), а не от даты
     выдачи (Q2, разбор в шапке файла — из сверки с loan-program.html renderTab6). */
  const payDay = (c.payDay | 0) >= 1 && (c.payDay | 0) <= 31 ? (c.payDay | 0) : null;
  const anchorFirst = c.lastPaymentAnchor === 'по дате 1-го платежа';
  const firstPay = addM(start, mpp, payDay);
  const principalPeriods = Math.max(1, n - gMainP);              // периодов гашения ОД после льготы
  const annuity = (i > 0)
    ? P * i / (1 - Math.pow(1 + i, -principalPeriods))
    : P / principalPeriods;
  const diffPrincipal = P / principalPeriods;
  const rows = [];
  let bal = P, deferred = 0, deferredPer = 0;                    // deferred — отложенные проценты (graceInterest)
  let prevDate = start;
  for (let k = 1; k <= n; k++){
    const date = anchorFirst
      ? (k === 1 ? firstPay : addM(firstPay, (k - 1) * mpp, payDay))
      : addM(start, k * mpp, payDay);
    /* Шаг 19: реальные начисленные % считаются по дням (dayMethod), а не по номинальной
       ставке периода `i`. `i` остаётся структурной — ею размечается величина взноса
       (аннуитет/дифф.), как и раньше: платёж не «плавает» от длины месяца. Расхождение
       между `i`-долей и реальным `accrued` — обычная практика факт/365-аннуитета:
       тело взноса фиксировано формулой, начисленные % — по факту дней.
       День-база и пауза начисления ушли в periodInterest — общее ядро с прогнозом. */
    const accrued = (k <= gAccrP) ? 0 : periodInterest(tranche, c, prevDate, date, bal, mpp);
    prevDate = date;
    let interest;
    if (k <= gIntP){ deferred = round2(deferred + accrued); interest = 0; }   // начислено, но не платится
    else if (k >= gIntDistFrom && k <= gIntDistTo){
      if (deferredPer === 0 && deferred > 0) deferredPer = round2(deferred / Math.max(1, gIntDistTo - gIntDistFrom + 1));
      const add = Math.min(deferredPer, deferred);
      deferred = round2(deferred - add);
      interest = round2(accrued + add);
    }
    else interest = accrued;                                          // вне окна распределения: копится, не гасится этим платежом
    let principal;
    if (k <= gMainP) principal = 0;                                          // льгота по ОД: только проценты
    else if (method === 'в конце срока') principal = (k === n ? round2(bal) : 0);
    else if (method === 'равными долями' || method === 'дифференцированный') principal = round2(diffPrincipal);
    else principal = round2(annuity - bal * i);                              // аннуитет: ОД = платёж − проценты
    if (k === n){
      principal = round2(bal);                                               // последний период гасит остаток
      if (deferred > 0){ interest = round2(interest + deferred); deferred = 0; }   // и остаток отложенных %
    }
    principal = Math.max(0, Math.min(principal, bal));
    bal = round2(bal - principal);
    rows.push({ no:k, date:fd(date), total:round2(principal + interest), principal, interest, accrued });
  }
  /* Безставочные статьи транша (ADR-0109, КВ-26) раскладываются ЗАНОВО при каждом
     построении: движок амортизирует только тело, и без этой строки статьи, пришедшие
     приложением к ДС, исчезали бы по нажатию «Сформировать график». База (articleBase)
     принадлежит траншу и пишется дверью restructureApplied — она же единственный, кто
     её заводит; перестроение её только читает. */
  if (tranche && (tranche.articleBase || []).length) spreadArticles(rows, tranche.articleBase);
  return { rows };
}

/* ---- ДЕЙСТВУЮЩАЯ ВЕРСИЯ ГРАФИКА (КВ-26) ----
   Флага active больше нет: он разъезжался с ДС, у которого дата вступления в будущем —
   версия уже записана, но действовать ещё не должна, а флаг этого различить не мог.
   Идиома та же, что conditionsAt / subjectAt / derive: спрашиваем СРЕЗ, а не флаг.
   validFrom — начало действия версии; generatedFrom («от какой даты строим») и
   generatedAt («когда построена», гасит плашку Д-5) остаются раздельными: путать
   начало действия с датой построения нельзя. */
function schedValidFrom(s){ return s.validFrom || s.generatedFrom; }
function scheduleAt(t, d){
  const lim = pd(d || TODAY);
  const list = (t.schedules || []).filter(s => pd(schedValidFrom(s)) <= lim)
    .sort((a,b) => pd(schedValidFrom(a)) - pd(schedValidFrom(b)) || (a.ver||0) - (b.ver||0));
  return list.length ? list[list.length-1] : null;
}
/* Конец действия версии — день ДО начала следующей; null = «по сей день». */
function validTo(t, ver){
  const key = s => pd(schedValidFrom(s));
  const nx = (t.schedules || []).filter(s => key(s) > key(ver)).sort((a,b) => key(a) - key(b))[0];
  if (!nx) return null;
  const d = new Date(key(nx)); d.setDate(d.getDate() - 1);
  return fd(d);
}
/* Ближайшая ещё не вступившая версия (КВ-27): ДС подписан с отложенной датой, версия
   записана, но действует прежняя — и таблица позиций показывает НЕ то, что в соглашении.
   Единственный факт, который меняет чтение вкладки, поэтому выводится отдельно. */
function schedFuture(t, asOf){
  const lim = pd(asOf || TODAY);
  return (t.schedules || []).filter(s => pd(schedValidFrom(s)) > lim)
    .sort((a,b) => pd(schedValidFrom(a)) - pd(schedValidFrom(b)))[0] || null;
}
/* ВЕРСИЯМ ЕСТЬ ЧТО СКАЗАТЬ? (КВ-27) Грид версий стоял на «Графике» безусловно и у обычного
   кредита нёс ровно одну строку — «v1, построена в день освоения, основание „перестроение“»,
   то есть повторял дату первой позиции таблицы под собой и больше ничего. Правило волны:
   элемент появляется, когда несёт факт. Это грамматика самой вкладки — так же ведут себя
   панель годов (multiYear), плашка ИР-2′ и статейные колонки (ADR-0109).
   Факт есть, если: версий больше одной (было перестроение) · версия рождена ДС (её строки
   ПРИШЛИ из приложения, а не посчитаны движком) · записана будущая (на экране график не по
   подписанному соглашению) · версия построена не в день начала действия (тогда «построена»
   — самостоятельная величина, по ней гаснет Д-5).
   Отвергнуто: рисовать всегда — воспроизводит ровно тот дефект, который волна лечит. */
function schedNeedsContext(t, asOf){
  const list = (t && t.schedules) || [];
  if (list.length > 1) return true;
  if (list.some(s => (s.by || {}).kind === 'ДС')) return true;
  if (schedFuture(t, asOf)) return true;
  return list.some(s => s.generatedAt && s.generatedAt !== schedValidFrom(s));
}

/* строки действующей версии графика транша; если версии нет, но точка отсчёта есть —
   строим на лету (для scheduleTotals/fullRepayDate) */
function trancheScheduleRows(t){
  const active = scheduleAt(t, TODAY);
  if (active && active.rows && active.rows.length) return active.rows;
  const disb = (t.disbursements || []).slice().sort((a,b) => pd(a.date) - pd(b.date))[0];
  /* У производного транша освоений нет — точка отсчёта берётся от даты вступления ДС
     (ADR-0092 §1), иначе «Расчёты» показывали бы ему пустой график навсегда. */
  const inTr = originTransfer(t);
  const from = disb ? disb.date : (inTr ? inTr.date : null);
  return from ? buildSchedule(t, from).rows : [];
}

/* фактически погашенное ТЕЛО транша — по ПЛАТЕЖАМ, а не по позициям графика.
   buildLedger разносит деньги только по НАСТУПИВШИМ позициям (фильтр `> lim` в нём), и
   досрочная переплата в его index не попадает вовсе: прогноз, бравший базу из index,
   досрочного погашения НЕ ВИДЕЛ — ровно того события, ради которого вкладка заведена.
   Транш берётся с платежа (ADR-0060 §2: транш называет строка разнесения); платёж без
   транша к телу транша не относится (Д-12). */
function paidPrincipalOfTranche(c, t, asOf){
  const lim = pd(asOf || TODAY);
  let s = 0;
  for (const p of ((c && c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p)) continue;
    if (p.date && pd(p.date) > lim) continue;
    if ((p.tranche | 0) !== t.no) continue;
    s += (p.layers && p.layers.principal) || 0;
  }
  return round2(Math.min(s, disbursedSum(t) || t.amount || 0));
}

/* НАЧИСЛЕНИЕ НА ФАКТИЧЕСКОЕ ТЕЛО (ADR-0105) — поправка, общая графику, расчёту и прогнозу.
   График начисляет на СВОЮ базу: он считает, что к позиции k тело погашено ровно на
   Σ контрактных долей до неё. Когда заёмщик недобрал, тело у него на руках, и проценты
   по договору бегут на него; когда внёс досрочно — база меньше контрактной. Прежняя
   модель ни того, ни другого не знала: buildLedger брал interestDue прямо из строки
   графика, а прогноз вычитал просроченное тело из базы НАЧИСЛЕНИЯ вместе с базой
   амортизации — и повторял график строка в строку ровно на просроченном кредите.

   Величина отклонения на начало периода: dev = (контрактно погашено к периоду) −
   (погашено платежами). dev > 0 — недобор, dev < 0 — досрочка. periodInterest линеен
   по базе (bal · ставка · дни / база), поэтому начисление на фактический остаток
   раскладывается ТОЧНО: %(факт) = %(контракт) + %(dev). Отсюда правка аддитивна —
   льготы, отсрочка и распределение отложенных процентов остаются в buildSchedule и не
   переписываются. Где контракт не начислял (отсрочка начисления, пауза Р-17, нулевая
   ставка) — не начисляет и на отклонение: периода начисления там нет вовсе.

   Горизонт правила — график: после последней позиции начислять не на чем (ADR-0010,
   начисленное выводится из графика). Непокрытый хвост за границей графика процентами
   больше не обрастает — новые сроки назначает только перестроение (ADR-0104 §5).
   Платежи после даты среза в базу не входят: срез не знает будущего. */
function trancheAccrual(c, t, asOf){
  const out  = new Map();
  const rows = trancheScheduleRows(t);
  if (!rows.length) return out;
  const lim  = pd(asOf || TODAY);
  const disb = (t.disbursements || []).slice().sort((a, b) => pd(a.date) - pd(b.date))[0];
  let prev    = disb ? pd(disb.date) : pd(rows[0].date);
  let ctrPaid = 0;                                   // тело, погашенное ПО ГРАФИКУ к началу периода
  for (const r of rows){
    const base = (r.accrued == null ? r.interest : r.accrued) || 0;
    const cnd  = conditionsAt(t, r.date);            // условия НА ДАТУ ПОЗИЦИИ (ADR-0104 §4)
    const mpp  = freqMonths(cnd.freq) || 1;
    const dev  = round2(ctrPaid - paidPrincipalOfTranche(c, t, fd(prev < lim ? prev : lim)));
    const extra = (base === 0 || Math.abs(dev) <= 0.005) ? 0
      : (dev > 0 ?  periodInterest(t, cnd, prev, pd(r.date),  dev, mpp)
                 : -periodInterest(t, cnd, prev, pd(r.date), -dev, mpp));
    out.set(r.no, { dev, extra, accrued:round2(base + extra),
                    due:round2((r.interest || 0) + extra) });
    ctrPaid = round2(ctrPaid + (r.principal || 0));
    prev    = pd(r.date);
  }
  return out;
}

/* ПРОГНОЗ транша (ADR-0104, разбор 10.08.2026) — ожидание по контрактному графику.
   Даты позиций не двигаются и ВЗНОС остаётся контрактным; двигается ГРАНИЦА закрытия.
     • Прошлое (дата ≤ горизонта) — непокрытый остаток позиции, и он ОСТАЁТСЯ НА МЕСТЕ.
       Срок по нему наступил; перенос в ближайшую будущую позицию (как было раньше)
       назначал просрочке срок, которого никто не назначал, и вдобавок считал
       просроченное тело дважды — раз в перестройке будущего, раз хвостом.
     • Будущее — контрактный взнос против ФАКТИЧЕСКОЙ базы. База = освоено − погашено
       платежами − просроченное тело: последнее будущими взносами не гасится, оно уже
       показано прошлыми строками. Проценты — ядром periodInterest на условиях НА ДАТУ
       ПОЗИЦИИ (не на дату среза): датированная запись об изменении ставки лежит в
       реестре с основанием, игнорировать её — не осторожность, а игнор факта.
     • Контрактно ТЕЛО позиции — у всех методов, кроме «в конце срока» (ADR-0108):
       график гасит своё тело в свой срок, а проценты идут на фактическую базу, и на их
       разницу с контрактными расходится ожидаемый ВЗНОС. Досрочка гасит базу быстрее —
       позиции в хвосте обнуляются, срок сокращается (ADR-0074 §1); у «в конце срока»
       срок не сокращается вовсе, уменьшается баллон. Пересобирать аннуитет на
       оставшийся срок нельзя: это сделка «уменьшить взнос» (ADR-0074 §2), она требует
       заявления и перестроения графика — а после перестроения прогнозу пересчитывать
       уже нечего, он равен графику.
   Горизонт обрезан остановкой начисления: у закрытого кредита будущего нет.
   Прогноз ничего не хранит и на график/начисление/гейты не влияет (И-18 — про план,
   но прогноз тем более: он производная).
   opts.atCut — сравнительный прогон на условиях ДАТЫ СРЕЗА: разница с обычным прогоном
   и есть вклад уже зарегистрированных будущих записей условий (плитка вкладки).
   ledgerIndex — Map из buildLedger(c, asOf).index; может быть null (тогда прошлое
   считается непогашенным целиком). */
function trancheForecastRows(c, t, ledgerIndex, asOf, opts){
  const rows = trancheScheduleRows(t);
  if (!rows.length) return [];
  const lim  = pd(asOf || TODAY);
  const stop = (c && c.closure && c.closure.date && pd(c.closure.date) < lim)
    ? pd(c.closure.date) : null;
  const past = rows.filter(r => pd(r.date) <= (stop || lim));
  const fut  = stop ? [] : rows.filter(r => pd(r.date) > lim);
  const out  = [];
  let overdueP = 0;                                   // просроченное ТЕЛО — будущими взносами не гасится
  for (const r of past){
    const e = ledgerIndex ? ledgerIndex.get(ledgerKey(t.no, r.no)) : null;
    const uncovered = e
      ? round2((e.principalOverdue || 0) + (e.interestOverdue || 0) + (e.penaltyBal || 0))
      : round2(r.total || 0);
    overdueP = round2(overdueP + (e ? (e.principalOverdue || 0) : (r.principal || 0)));
    out.push({ no:r.no, date:r.date, scheduled:round2(r.total || 0), forecast:uncovered,
               delta:round2(uncovered - (r.total || 0)), past:true });
  }
  const atCut = !!(opts && opts.atCut);
  /* ДВЕ БАЗЫ, А НЕ ОДНА (ADR-0105). Просроченное тело вычитается из базы АМОРТИЗАЦИИ —
     будущими взносами оно не гасится, оно уже показано своими позициями (ADR-0104 §2), —
     но НЕ из базы НАЧИСЛЕНИЯ: непогашенное тело у заёмщика на руках, и проценты по
     договору идут на него. Пока база была одна, обе роли несла она: на просроченном
     кредите база прогноза совпадала с контрактной до копейки, и вкладка отвечала «ждём
     ровно график» при 88 тыс. недобора. Взнос остаётся контрактным (ADR-0104 §1) —
     дорожает СОСТАВ: процентов больше, тела меньше, остаток гаснет медленнее. */
  let accrBal  = round2(Math.max(0, (disbursedSum(t) || t.amount || 0)
                                    - paidPrincipalOfTranche(c, t, asOf)));
  let bal      = round2(Math.max(0, accrBal - overdueP));   // база АМОРТИЗАЦИИ
  /* начало первого будущего периода — дата предыдущей позиции, а до первой позиции —
     дата освоения: периоды начисления идут встык, как в графике */
  const disb = (t.disbursements || []).slice().sort((a, b) => pd(a.date) - pd(b.date))[0];
  const firstFut = rows.length - fut.length;          // позиции упорядочены по датам: будущее — хвост
  let prev = firstFut > 0 ? pd(rows[firstFut - 1].date) : (disb ? pd(disb.date) : pd(rows[0].date));
  const last = fut.length - 1;
  fut.forEach((r, k) => {
    const cnd = conditionsAt(t, atCut ? fd(lim) : r.date);
    const mpp = freqMonths(cnd.freq) || 1;
    const interest = periodInterest(t, cnd, prev, pd(r.date), accrBal, mpp);
    prev = pd(r.date);
    const method = cnd.method || 'аннуитет';
    let principal;
    if (bal <= 0.005) principal = 0;                                       // тело кончилось — позиции не станет
    else if (method === 'в конце срока') principal = (k === last ? bal : 0);
    /* КОНТРАКТНО — ТЕЛО ПОЗИЦИИ, У ВСЕХ МЕТОДОВ (ADR-0108). У аннуитета контрактным
       считался ПЛАТЁЖ, и проценты сверх контракта вытесняли из него тело: взнос равен
       графику до копейки, а тело гасится медленнее и копится баллоном в последнюю
       позицию. График остаётся расписанием ТЕЛА: каждая позиция гасит своё, а
       подорожавшие проценты поднимают ожидаемый платёж — просрочка стоит денег в тот
       же срок, а не переносом долга на конец. */
    else principal = Math.min(bal, round2(r.principal || 0));
    if (k === last) principal = bal;                                       // остаток гасит последняя позиция
    bal     = round2(bal - principal);
    accrBal = round2(Math.max(0, accrBal - principal));   // просроченный хвост остаётся в базе начисления
    const f = round2(principal + interest);
    /* principal/interest/balAfter выносятся наружу: по ним состав прогноза проверяется
       на РАВЕНСТВО (Σ = база + проценты), а граница закрытия читается как первый ноль.
       interestCtr — контрактные проценты той же позиции: их разница с interest и есть
       цена недобора тела, и ровно на неё расходится взнос (ADR-0108). */
    out.push({ no:r.no, date:r.date, scheduled:round2(r.total || 0), forecast:f,
               principal, interest, interestCtr:round2(r.interest || 0), balAfter:bal,
               accrAfter:accrBal, delta:round2(f - (r.total || 0)), past:false });
  });
  return out;
}

/* Прогноз кредита по месяцам — сумма прогноза ВСЕХ позиций всех траншей, сгруппированная
   по месяцу даты позиции. Прежде прошлое исключалось, чтобы не считать просрочку дважды:
   непокрытый остаток сидел и в своей строке, и хвостом в ближайшей будущей. Хвост больше
   никуда не течёт, двойного счёта нет по построению — и исключение снято вместе с ним.
   Месяц отвечает на один вопрос: «сколько по нему ещё ждём» — у прошедшего это недобор
   на дату среза, у будущего ожидаемый платёж. Раньше у всех прошедших месяцев стоял ноль,
   и колонка «Прогноз» во вкладке «План» читалась как «в те месяцы ничего не ждали».
   Позиция с нулём месяцу не принадлежит: закрытая (и отсечённая досрочкой) ожидания не
   даёт, а нулевой ключ предзаполнил бы форму плана нулём, который отбивает Г-30.
   Этим предзаполняется форма заведения плана (ADR-0042 §2): стартовое значение формы,
   не связь — после сохранения план от прогноза не зависит. */
function forecastByMonth(c, ledgerIndex, asOf){
  const m = new Map();
  for (const t of (c.tranches || [])){
    for (const r of trancheForecastRows(c, t, ledgerIndex, asOf)){
      if (r.forecast <= 0.005) continue;
      const mk = monthKey(r.date);
      m.set(mk, round2((m.get(mk) || 0) + r.forecast));
    }
  }
  return m;
}

/* СВОД ПРОГНОЗА по области (транш или кредит целиком) — три ответа вкладки:
   когда закроется, сколько непокрыто, что добавили будущие записи условий.
   payoff — дата последней позиции, на которой ещё что-то ждём: у аннуитета досрочка
   приближает её, у «в конце срока» не двигает. Договорная дата берётся из ГРАФИКА
   (последняя позиция области), а не из срока условий: сравнивать надо с тем же
   расписанием, иначе сравниваются две разные величины.
   Непокрытый хвост payoff не отменяет, но делает его неполным ответом — «закроется»
   означает «взносы кончатся», а хвост остаётся долгом; вкладка об этом говорит прямо. */
function forecastSummary(c, tranches, ledgerIndex, asOf){
  const src = (tranches || []).filter(Boolean);
  const rows = [], perTranche = [];
  let cutSum = 0;
  for (const t of src){
    const fr = trancheForecastRows(c, t, ledgerIndex, asOf);
    for (const r of fr) rows.push({ ...r, _t:t });
    const futT = fr.filter(r => !r.past);
    const live = futT.filter(r => r.forecast > 0.005);
    const sched = trancheScheduleRows(t);
    perTranche.push({ no:t.no,
      payoff:   live.length ? live[live.length - 1].date : null,
      contract: sched.length ? sched[sched.length - 1].date : null,
      scheduled: sched.length > 0,                     // есть ли вообще расписание
      owed:     round2(fr.filter(r => r.past).reduce((a, r) => a + r.forecast, 0)),
      cut:      futT.length - live.length });          // позиций отсечено досрочкой
    for (const r of trancheForecastRows(c, t, ledgerIndex, asOf, { atCut:true }))
      if (!r.past) cutSum += r.forecast;
  }
  rows.sort((a, b) => pd(a.date) - pd(b.date) || a._t.no - b._t.no);
  const fut = rows.filter(r => !r.past), past = rows.filter(r => r.past);
  const futSum = round2(fut.reduce((a, r) => a + r.forecast, 0));
  const futSched = round2(fut.reduce((a, r) => a + r.scheduled, 0));
  /* Голосуют за дату закрытия области только транши С ГРАФИКОМ: неосвоенному траншу без
     единой позиции закрывать нечего, и вето он ставить не вправе — о нём говорит своя
     плашка. Транш, у которого график исчерпан, а долг остался, ответа не даёт: пока его
     сроки не назначены заново, даты по области нет вовсе — чужую не выдаём. */
  const voters    = perTranche.filter(x => x.scheduled);
  const withPayoff = voters.filter(x => x.payoff);
  const stuck      = voters.filter(x => !x.payoff && x.owed > 0.005);
  /* ЦЕНА НЕДОБОРА ТЕЛА (ADR-0105) — Σ (проценты ожидания − проценты контракта) по
     будущим позициям, она же Σ всех Δ: тело позиции контрактно, и расходится взнос ровно
     на проценты (ADR-0108). Плитка называет итог одной величиной — по строкам он
     размазан мелкими надбавками, и главный эффект просрочки читался бы не сразу. */
  const extraInterest = round2(fut.reduce((a, r) => a + ((r.interest || 0) - (r.interestCtr || 0)), 0));
  return { rows, fut, past,
    tail: round2(past.reduce((a, r) => a + r.forecast, 0)),
    futSum, futSched, delta: round2(futSum - futSched), extraInterest,
    condEffect: round2(futSum - round2(cutSum)),
    payoff: (withPayoff.length && !stuck.length)
      ? withPayoff.map(x => x.payoff).sort((a, b) => pd(a) - pd(b)).pop() : null,
    stuck: stuck.map(x => x.no),                       // траншей с исчерпанным графиком и долгом
    contractEnd: perTranche.map(x => x.contract).filter(Boolean)
      .sort((a, b) => pd(a) - pd(b)).pop() || null,
    cutPositions: perTranche.reduce((a, x) => a + x.cut, 0),
    perTranche };
}

/* ИСПОЛНЕНИЕ ПЛАНА (CONTEXT.md) = факт месяца / план месяца.
   ФАКТ месяца — сумма разнесённого по платежам, которые ЗАСЧИТЫВАЮТСЯ (paymentCounts,
   две оси Р-27) и чья ДАТА ФАКТИЧЕСКОГО ПОСТУПЛЕНИЯ попала в месяц. Входят все четыре
   статьи долга кредита. Расходы по обращению взыскания не входят и войти не могут по
   построению: они приходят отдельным зеркалом mirror.collectionCosts, а не платежами.
   МЕСЯЦ БЕЗ ПЛАНА ВЫПАДАЕТ ЦЕЛИКОМ — из своей строки, из суммы квартала и из суммы года.
   Факт такого месяца показывается справочно: он есть, но сравнивать его не с чем.
   Платежи ПОСЛЕ даты среза не считаются: дата среза одна на карточку (И-13).
   Величина только для показа: ни в гейт, ни в производную долга, ни в категорию риска,
   ни в подгруппу заёмщика не входит (И-18). */
function planExecOf(c, asOf, ledgerIndex, year){
  asOf = asOf || TODAY;
  const lim = pd(asOf);
  const y   = year || pd(asOf).getFullYear();
  const idx = ledgerIndex || buildLedger(c, asOf).index;
  const fc  = forecastByMonth(c, idx, asOf);
  const factByMonth = new Map();
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!p || !p.date || !paymentCounts(p)) continue;
    if (pd(p.date) > lim) continue;
    const mk = monthKey(p.date);
    factByMonth.set(mk, round2((factByMonth.get(mk) || 0) + paymentAllocated(p)));
  }
  const curMk = monthKey(asOf);
  const rows = [];
  for (let m = 1; m <= 12; m++){
    const mk  = y + '-' + String(m).padStart(2, '0');
    const pr  = planRowOf(c, mk);
    const plan = pr && pr.amount != null ? pr.amount : null;
    const fact = round2(factByMonth.get(mk) || 0);
    /* МЕСЯЦ ПОСЛЕ МЕСЯЦА СРЕЗА ещё не наступил: факт по нему нулевой не потому, что
       ничего не собрали, а потому, что срок не подошёл. Процент по нему не считается —
       иначе будущее давало бы «0 % исполнения» и тянуло вниз квартал, год и плитку
       шапки. Та же подмена, от которой спека отдельно предостерегает для плитки. */
    const future = mk > curMk;
    rows.push({ month:mk, label:monthLabel(mk),
      forecast: fc.has(mk) ? fc.get(mk) : null,
      plan, fact,
      pct: (plan > 0 && !future) ? Math.round(fact / plan * 100) : null,
      edits: pr ? pr.history.length : 0,
      dropped: plan == null,                       // в расчёт исполнения не входит
      future,                                      // месяц ещё не наступил
      removed: !!(pr && pr.amount == null) });     // план СНЯТ (строка есть, цели нет)
  }
  /* plan — вся цель периода (её показывает плитка «План за год»); planDone — только
     наступившие месяцы, и именно по ним считается процент. Разводить их обязательно:
     иначе «План за год» пришлось бы урезать до прошлого, а это уже не годовой план. */
  const agg = (list) => {
    const kept = list.filter(r => !r.dropped);
    const done = kept.filter(r => !r.future);
    const plan     = round2(kept.reduce((a, r) => a + r.plan, 0));
    const planDone = round2(done.reduce((a, r) => a + r.plan, 0));
    const fact     = round2(done.reduce((a, r) => a + r.fact, 0));
    return { plan, planDone, planAhead: round2(plan - planDone), fact,
      pct: planDone > 0 ? Math.round(fact / planDone * 100) : null,
      months:kept.length, monthsDone:done.length };
  };
  /* months/monthsDone у квартала — не украшение: строка квартала стоит в одной таблице
     с месяцами (КВ-21) и обязана назвать, по скольким месяцам она посчитана. Без этого
     «1 квартал · 0 %» неотличимо от «плана на квартал не ставили». */
  const quarters = [1,2,3,4].map(q => {
    const a = agg(rows.slice((q - 1) * 3, q * 3));
    return { q, plan:a.plan, planDone:a.planDone, planAhead:a.planAhead, fact:a.fact, pct:a.pct,
      months:a.months, monthsDone:a.monthsDone };
  });
  const ya = agg(rows);
  const cur   = rows.find(r => r.month === curMk);
  return { year:y, rows, quarters,
    total:{ plan:ya.plan, planDone:ya.planDone, planAhead:ya.planAhead, fact:ya.fact, pct:ya.pct,
      monthsWithPlan:ya.months, monthsDone:ya.monthsDone, monthsTotal:12 },
    current: (cur && !cur.dropped) ? { month:cur.month, plan:cur.plan, fact:cur.fact, pct:cur.pct } : null };
}

/* НАБОР ГОДОВ СЕЛЕКТОРА «Плана». Вкладка показывает ОДИН календарный год — выбранный
   селектором, и годовой итог держат плитки шапки над таблицей.

   Прежняя формула селектора («год выдачи … max(год среза, год выдачи) + 1») врала: у
   кредита, выданного в мае 2026 на 24 месяца, срок кончается в мае 2028, а селектор
   предлагал 2026–2027 — поставить план на последние месяцы срока через вкладку было
   нельзя. Набор строится по данным, а не по смещению от даты среза: от месяца выдачи до
   последнего месяца, о котором вкладке есть что сказать, — последняя позиция графика
   ЛЮБОГО транша, последний месяц с планом, последний месяц с засчитанным платежом.
   План ставится модалкой на произвольный месяц и графиком не ограничен: год с целью за
   пределами расписания обязан быть в списке, иначе введённая цель пропадает с экрана.
   Годы идут сплошным рядом — дыра в середине читалась бы как «год потеряли», а пустой
   год честно скажет «плана на год нет» своими прочерками. */
function planYearsList(c, asOf){
  asOf = asOf || TODAY;
  const lim = pd(asOf);
  const mks = [monthKey(c.date || asOf)];
  for (const t of (c.tranches || []))
    for (const r of trancheScheduleRows(t)) if (r && r.date) mks.push(monthKey(r.date));
  for (const p of (c.plan || [])) if (/^\d{4}-\d{2}$/.test(String(p && p.month))) mks.push(p.month);
  for (const p of ((c.mirror && c.mirror.payments) || []))
    if (p && p.date && paymentCounts(p) && pd(p.date) <= lim) mks.push(monthKey(p.date));
  const y0 = +mks.reduce((a, mk) => mk < a ? mk : a).slice(0, 4);
  const y1 = +mks.reduce((a, mk) => mk > a ? mk : a).slice(0, 4);
  const out = [];
  for (let y = y0; y <= y1; y++) out.push(y);
  return out;
}
/* Год по умолчанию: тот, в который попала дата среза; нет такого в наборе (кредит закрыт
   в прошлом или выдан вперёд) — ближайший следующий; весь срок позади — последний. */
function planDefaultYear(years, asOf){
  const cy = pd(asOf || TODAY).getFullYear();
  if (!years.length) return cy;
  return years.includes(cy) ? cy : (years.find(y => y > cy) ?? years[years.length - 1]);
}
/* Диапазон месяцев года для модалки постановки плана: январь…декабрь, обрезанный СНИЗУ
   месяцем договора. Обрезка не косметика: Г-30 отбивает месяц раньше месяца договора, и
   год выдачи без неё пришёл бы строками, которые заведомо нельзя поставить (у кредита от
   14.08 это семь мёртвых строк из двенадцати). Сверху не обрезаем осознанно: план
   ставится модалкой на произвольный месяц и графиком не ограничен (см. planYearsList) —
   декабрь остаётся декабрём и за пределами срока. */
function planYearRange(credit, y){
  const from = y + '-01', to = y + '-12';
  const cm = credit && credit.date ? monthKey(credit.date) : null;
  return { from: (cm && cm > from && cm <= to) ? cm : from, to };
}
/* Год модалки ВЫВОДИТСЯ из пары полей, а не хранится рядом с ними. Хранимый год пережил
   бы ручную правку месяцев и показывал бы год, которого в полях уже нет; null — «период
   произвольный», и селектор обязан сказать это прямо. */
function planYearOfRange(credit, from, to){
  if (!/^\d{4}-\d{2}$/.test(String(from)) || !/^\d{4}-\d{2}$/.test(String(to))) return null;
  const y = +String(to).slice(0, 4);
  const r = planYearRange(credit, y);
  return (r.from === from && r.to === to) ? y : null;
}

/* ключ позиции детального расчёта: транш + номер платежа */
function ledgerKey(trancheNo, no){ return 'T' + trancheNo + '#' + no; }

/* статус позиции графика на дату среза. Чистая функция от строки графика и её записи
   в детальном расчёте (entry может отсутствовать — тогда позиция ещё не наступила).
   Оплачена · Просрочена · Наступила (срок прошёл, погашения нет) · Предстоит */
function scheduleRowStatus(row, entry, asOf){
  if (pd(row.date) > pd(asOf || TODAY)) return 'Предстоит';
  if (!entry) return 'Наступила';
  if (entry.overdueTotal > 0.005) return 'Просрочена';
  return 'Оплачена';
}

/* ближайший НЕоплаченный платёж по всем траншам (шаг 11 — плитка шапки). Просроченная
   позиция тоже «ближайшая»: она первая по дате и требует действия раньше предстоящей. */
function nextPaymentOf(c, ledgerIndex, asOf){
  let best = null;
  for (const t of c.tranches){
    for (const r of trancheScheduleRows(t)){
      const st = scheduleRowStatus(r, ledgerIndex.get(ledgerKey(t.no, r.no)), asOf);
      if (st === 'Оплачена') continue;
      const ts = pd(r.date);
      if (!best || ts < best.ts) best = { ts, date:r.date, total:r.total, status:st, tranche:t.no };
    }
  }
  return best;
}

/* статус регистрации договора (шаг 11) — производный, отдельного поля нет: комплект
   реквизитов регистрации (№ + дата + скан) сверяется с гейтом Г-7 и ЖЦ. */
function regStatusOf(c){
  const r = c.reg || {};
  const full = !!(r.num && r.date && r.scan);
  if (c.lifecycle === 'Проект') return full ? { text:'готов к регистрации', tone:'info' }
                                            : { text:'черновик', tone:'neutral' };
  return full ? { text:'зарегистрирован', tone:'low' } : { text:'реквизиты неполны', tone:'high' };
}

/* ---- 3.2 Помощники derive (все чистые) ---- */

/* ---- ДЕТАЛЬНЫЙ РАСЧЁТ (ADR-0010) ----
   Строится, а не читается. Поля `ledger` в модели нет: начисленное выводится из активной
   версии графика транша и условий на дату, погашенное приходит зеркалом модуля платежей.

   Прежняя реализация складывала ОДНУ засеянную строку на транш (`latestLedger`) и
   называла это долгом. Отсюда К-1 с освоением 100 000 и остатком ноль, платёж
   «Подтверждён ЦК», не двигающий ничего, и дни просрочки, равные нулю по построению
   при 24 позициях графика (КР-7…КР-9). Это легаси-дефект E2E-09, воспроизведённый
   в модуле-владельце.

   paidPool — то, что модуль платежей засчитал на дату среза, в разрезе статей. */

/* ЗАЧИТЫВАЕТСЯ ЛИ ПЛАТЁЖ В ПОГАШЕНИЕ — правило владельца, и оно читает ДВЕ оси, а не одну.
   Прежняя редакция сверяла только сопоставление (`match === 'Подтверждён ЦК'`) и тем самым
   отбирала у шлюза его главное свойство: «платёж по шлюзу действует сразу, датой операции —
   уменьшает долг и останавливает начисление; не подтвердит ЦК — сторно с пересчётом»
   (спека платежей §4). Ждать подтверждения обязан ручной ввод и импорт, а не шлюз: у шлюза
   деньги УЖЕ ушли, и «окно ожидания зачисления» открыто именно для них (КР-44). */
function paymentCounts(p){
  if (!p) return false;
  switch (p.match){
    case 'Подтверждён ЦК': return true;
    case 'Восстановлен':   return true;   // позднее подтверждение ЦК — обратный каскад, долг падает
    case 'Сторно (таймаут)': return false; // сторно ≠ удаление: платёж виден, денег не несёт
    case 'Расхождение':    return true;   // запись ЦК есть, расходятся реквизиты (ОВ-ПЛ-1)
    case 'Ожидает ЦК':     return p.reg === 'Шлюз';
    default: return false;
  }
}

/* Валюта поступления — реквизит ПЛАТЕЖА, разнесение — всегда в валюте кредита: статьи
   долга выражены в ней, и пересчёт делает владелец, когда раскладывает сумму. Отсюда
   инвариант И-16: Σ layers = amount при совпадении валют и amount × rate при расхождении. */
function paymentCurrency(p, c){ return (p && p.currency) || (c && c.currency) || 'KGS'; }
function paymentAllocated(p){
  const L = (p && p.layers) || {};
  return round2((L.principal||0) + (L.interest||0) + (L.penalty||0) + (L.fees||0));
}

function paidPool(c, asOf){
  const lim = pd(asOf || TODAY);
  const pool = { principal:0, interest:0, penalty:0, fees:0 };
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p)) continue;
    if (p.date && pd(p.date) > lim) continue;
    const L = p.layers || {};
    pool.principal += L.principal || 0; pool.interest += L.interest || 0;
    pool.penalty   += L.penalty   || 0; pool.fees     += L.fees     || 0;
  }
  for (const k in pool) pool[k] = round2(pool[k]);
  return pool;
}

/* ---- СПОРНАЯ ПЕНЯ (спека платежей §4.4) ----
   Сторно задним числом ретроспективно проваливает заёмщика в просрочку, но неподтверждение
   могло быть сбоем шлюза, банка или ЦК. Пеня периода «дата операции → дата отмены»
   ВЫЧИСЛЯЕТСЯ, но помечается спорной: не входит в требование, не двигает категорию риска,
   не блокирует гейт «Погашен». Считать сразу дешевле, чем строить цепочку начислений
   второй раз, если комиссия решит начислить.

   Разделение труда то же, что у обеспеченности: ПЕРИОД и статус приходят зеркалом
   (событие сторно — у платежей), СУММУ выводит кредит, потому что пеню считает он
   (ADR-0010). Сумма в зеркале — снимок владельца для его экрана, кредит её не читает. */
function disputeWindows(c){
  const out = [];
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    const d = p.dispute;
    if (d && d.from && d.status === 'Ожидает решения комиссии') out.push({ from:d.from, to:d.to || null, pay:p.num });
  }
  return out;
}
/* дни отрезка [from,to], попавшие в окно спора */
function daysInWindows(fromDt, toDt, wins){
  let n = 0;
  for (const w of wins){
    const a = Math.max(fromDt, pd(w.from));
    const b = Math.min(toDt, w.to ? pd(w.to) : toDt);
    if (b > a) n += dd(a, b);
  }
  return n;
}

/* ---- СЛОЙ ДОЛГА ПО РЕШЕНИЮ СУДА (спека платежей §6) ----
   Приостановка начисления по решению суда — свойство ЧАСТИ долга («на сумму решения»), а
   не флаг на кредите: у одного кредита бывает несколько решений с РАЗНЫМИ режимами
   одновременно, и это норма. Режим определяется ДАТОЙ решения и прилипает к нему навсегда —
   поэтому таблица с датами вступления, а не константа в расчёте: появится новая норма,
   добавится строка.

   Граница с платежами по ADR-0010: НАЧИСЛЕНИЕ — у кредита (сырьё его), РАЗНЕСЕНИЕ платежа
   по слоям — у платежей (там матрица разнесения и привязка к исполнительному листу), а состав
   слоя и очередь погашения — у кредита (ADR-0060 §3/§4). */
const ACCRUAL_MODES = [
  { from:'05.09.2025', interest:false, penalty:false,
    label:'проценты и пеня приостановлены на сумму решения (норма с 05.09.2025)' },
  { from:null,          interest:true,  penalty:false,
    label:'проценты идут, пеня приостановлена на сумму решения (норма до 05.09.2025)' }
];
function accrualModeOf(decisionDate){
  for (const m of ACCRUAL_MODES) if (!m.from || pd(decisionDate) >= pd(m.from)) return m;
  return ACCRUAL_MODES[ACCRUAL_MODES.length - 1];
}
/* Слои кредита на дату: решения суда из зеркала, несущие ПРИСУЖДЁННУЮ СУММУ. Решение без
   суммы (определение о возбуждении дела о банкротстве) слоя не образует — присуждать там
   нечего; последствия банкротства принадлежат взысканию (КР-33). */
function courtLayersOf(c, asOf){
  const lim = pd(asOf || TODAY);
  return ((c.mirror && c.mirror.court) || [])
    .filter(x => x && x.date && (x.amount || 0) > 0 && pd(x.date) <= lim)
    .map(x => ({ date:x.date, kind:x.kind, il:x.il || null, amount:x.amount || 0, mode:accrualModeOf(x.date) }))
    .sort((a,b) => pd(a.date) - pd(b.date))
    /* ИДЕНТИЧНОСТЬ СЛОЯ (ADR-0060 §3). Пока слой был долей от тела, имени ему не
       требовалось; теперь строка очереди обязана назвать СВОЙ слой, а строк много.
       Нумерация по возрастанию даты акта устойчива: срез отсекает решения позже даты,
       то есть всегда хвост отсортированного списка, и L-1 остаётся L-1 на любую дату.
       Подпись отдаётся готовой — справочника слоёв (`c.layers`, как в payments.html)
       у кредита в модели нет, разворачивать id некому. */
    .map((x, i) => Object.assign(x, { id:'L-' + (i + 1),
      label:'Слой решения от ' + x.date + (x.il ? ' · ' + x.il : '') }));
}

/* ЛЕСТНИЦА (ADR-0060 §3) — непогашенные позиции графика с остатками ОД и процентов в
   порядке «самое раннее просроченное → дальше». Это первый проход buildLedger, вынутый
   и обеднённый: ни пени, ни слоёв здесь нет, потому что ею пользуются ДО того, как слой
   известен. Проценты берутся ДО заморозки (interestDue): заморозка — ровно то, что
   лестница и определяет.
     Хвост НЕ обрезается датой, в отличие от buildLedger. Присуждённое дотягивается и до
   ненаступивших взносов — суд присуждает по требованию о ДОСРОЧНОМ возврате (у К-3 оно
   прямо в модели, targetUse.measures), и «дальше» в ADR-0060 §3 тем и кончается. Порядок
   от этого не меняется: обход идёт по дате наступления, и наступившее стоит впереди по
   построению. Обрезка же давала бы пустую лестницу всякий раз, когда акт датирован
   раньше первой позиции графика, — слой оказался бы пуст при непустой присуждённой
   сумме. */
function ladderAt(c, date){
  const lim = pd(date || TODAY);
  const rows = [];
  for (const t of c.tranches){
    const acc = trancheAccrual(c, t, fd(lim));      // то же начисление, что у расчёта (ADR-0105)
    for (const r of trancheScheduleRows(t))
      rows.push({ key:ledgerKey(t.no, r.no), trancheNo:t.no, no:r.no, date:r.date,
        principalDue:r.principal || 0,
        interestDue:((acc.get(r.no) || {}).due != null ? acc.get(r.no).due : (r.interest || 0)),
        overdue:pd(r.date) <= lim });
  }
  rows.sort((a,b) => pd(a.date) - pd(b.date) || a.trancheNo - b.trancheNo || a.no - b.no);
  const pool = paidPool(c, fd(lim));
  let pP = pool.principal, pI = pool.interest;
  for (const r of rows){
    const pPaid = round2(Math.min(pP, r.principalDue)); pP = round2(pP - pPaid);
    const iPaid = round2(Math.min(pI, r.interestDue));  pI = round2(pI - iPaid);
    r.principalBal = round2(r.principalDue - pPaid);
    r.interestBal  = round2(r.interestDue  - iPaid);
  }
  return rows.filter(r => r.principalBal + r.interestBal > 0.005);
}

/* СОСТАВ СЛОЯ ПО ТРАНШАМ — производная НА ДАТУ АКТА, не поле (ADR-0060 §3). Каждое
   решение прогоняет лестницу на СВОЮ дату и метит позиции, пока присуждённое не
   исчерпается. asOf отсекает решения ПОЗЖЕ даты среза — те же, что отсекает
   courtLayersOf; сам обход от даты среза не зависит.
     Позиция достаётся ПЕРВОМУ по дате решению, которое до неё дотянулось, и принадлежит
   ровно одному слою: иначе её начисление подчинялось бы двум режимам сразу. Помеченную
   позицию следующий слой пропускает, НЕ расходуя на неё присуждённое, — второй акт
   присуждает свой долг, обычно более поздний, и должен дотянуться дальше первого, а не
   упереться в его хвост.
     Довод в пользу общей лестницы — симметрия (ADR-0060 §4): слой поглощает долг в том
   же порядке, в каком платёж его гасит. Две лестницы в одном модуле разъедутся молча. */
function layersByLadder(c, asOf){
  const map = new Map();
  for (const L of courtLayersOf(c, asOf)){
    let left = L.amount;
    for (const p of ladderAt(c, L.date)){
      if (left <= 0.005) break;
      if (map.has(p.key)) continue;
      map.set(p.key, L.id);
      left = round2(left - p.principalBal - p.interestBal);
    }
  }
  return map;
}

/* buildLedger(credit, asOf) — позиции графика, НАСТУПИВШИЕ на дату среза, с разнесением
   подтверждённых погашений по очереди «раньше наступило — раньше гасится» и начислением
   пени на непокрытый остаток за дни просрочки. Возврат: {rows, index, pool, fees}. */
function buildLedger(c, asOf){
  /* Закрытый кредит начисление ОСТАНАВЛИВАЕТ: расчёт замирает на дате закрытия.
     Иначе списанный кредит с остатком продолжал бы копить пеню годами — у К-6б это
     давало 1032 дня просрочки и пеню, превышающую половину тела долга. */
  let lim = pd(asOf || TODAY);
  if (c.closure && c.closure.reason && c.closure.date && pd(c.closure.date) < lim) lim = pd(c.closure.date);
  const rows = [];
  for (const t of c.tranches){
    const cnd = conditionsAt(t, asOf || TODAY);           // Р-21: ставки пени — условия на дату
    const acc = trancheAccrual(c, t, fd(lim));            // начисление на ФАКТИЧЕСКОЕ тело (ADR-0105)
    for (const r of trancheScheduleRows(t)){
      if (pd(r.date) > lim) continue;                     // не наступила — это график, не расчёт
      const a = acc.get(r.no) || {};
      rows.push({ key:ledgerKey(t.no, r.no), trancheNo:t.no, no:r.no, date:r.date,
        principalDue:r.principal || 0,
        interestDue:(a.due != null ? a.due : (r.interest || 0)),
        interestAccrued:(a.accrued != null ? a.accrued
                                           : ((r.accrued == null ? r.interest : r.accrued) || 0)),
        /* контрактная часть и надбавка выносятся наружу: экран обязан назвать, ПОЧЕМУ
           начислено больше строки графика, иначе цифра выглядит опиской (ADR-0105) */
        interestCtr:(r.accrued == null ? r.interest : r.accrued) || 0,
        interestExtra:a.extra || 0, principalDev:a.dev || 0,
        penaltyMain:cnd.penaltyMain || 0, penaltyInt:cnd.penaltyInt || 0 });
    }
  }
  rows.sort((a,b) => pd(a.date) - pd(b.date) || a.trancheNo - b.trancheNo || a.no - b.no);

  /* СЛОЙ СТРОКИ. Присуждённое покрывает взносы лестницей на дату акта (ADR-0060 §3):
     у строки ровно один слой, и режим начисления берётся у НЕГО. Прежняя пропорция к
     телу (допущение Д-8) отвергнута тем же ADR: просрочка накапливается неравномерно,
     у старого транша её больше, и доля всегда занижала его долю. Непомеченная строка —
     свободный слой: начисление по договору, ничего не приостановлено. */
  const layers    = courtLayersOf(c, fd(lim));
  const byLadder  = layersByLadder(c, fd(lim));
  const layerById = new Map(layers.map(L => [L.id, L]));
  const layerOf   = (r) => layerById.get(byLadder.get(r.key)) || null;
  const wins = disputeWindows(c);

  const pool = paidPool(c, fd(lim));                    // тот же горизонт, что и у начисления
  let pP = pool.principal, pI = pool.interest, pPen = pool.penalty;
  /* первый проход: гасим ОД и проценты по очереди наступления */
  for (const r of rows){
    /* проценты: у строки под решением суда статья приостановлена ЦЕЛИКОМ — слой несёт
       позицию, а не долю позиции. layerId остаётся на строке: очередь и экран обязаны
       назвать слой, а второй раз выводить его было бы второй реализацией правила. */
    const CL = layerOf(r);
    r.layerId = CL ? CL.id : null;
    r.interestFrozen  = (CL && !CL.mode.interest) ? round2(r.interestDue || 0) : 0;
    r.interestCharged = round2((r.interestDue || 0) - r.interestFrozen);
    r.principalPaid = round2(Math.min(pP, r.principalDue));    pP = round2(pP - r.principalPaid);
    r.interestPaid  = round2(Math.min(pI, r.interestCharged)); pI = round2(pI - r.interestPaid);
    r.principalBal  = round2(r.principalDue  - r.principalPaid);
    r.interestBal   = round2(r.interestCharged - r.interestPaid);
    r.days          = Math.max(0, dd(pd(r.date), lim));
    const unpaid    = r.principalBal + r.interestBal;
    r.principalOverdue = unpaid > 0.005 ? r.principalBal : 0;
    r.interestOverdue  = unpaid > 0.005 ? r.interestBal  : 0;
    /* пеня — на непокрытый остаток за дни просрочки; при паузе начисления процентов
       пеня не затрагивается (Р-17), поэтому holds здесь не участвуют.
       База берётся ДО заморозки процентов. Пока слой был долей, вопроса не возникало:
       доля морозила часть процентов, база оставалась. Теперь статья под решением
       приостановлена ЦЕЛИКОМ, и база из interestOverdue обнулилась бы вместе с ней — а
       у К-3 пеня начисляется ТОЛЬКО на проценты (penaltyMain:0). Исчезла бы не только
       приостановленная пеня, но и пеня за дни ДО решения, которую решение не отменяет
       (об этом же говорит комментарий ниже). Отсюда interestBase. */
    const interestBase = Math.max(0, round2((r.interestDue || 0) - r.interestPaid));
