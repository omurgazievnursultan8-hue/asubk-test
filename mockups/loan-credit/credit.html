   новая запись с прежним значением (Г-21). ДС при первом упоминании попадает
   в реестр документов credit.agreements. */
function addConditionRecords(credit, ctx){
  const g = gate(credit, 'addConditionRecords', ctx);            // Г-10 · Г-18 · Г-19 · Г-20 · Г-22
  if (!g.ok) return g;
  const bs = ctx.basis;
  const basis = { kind:bs.kind, ref:bs.ref || bs.num || '', date:bs.date || '',
                  label:bs.label || (BASIS_KINDS[bs.kind].label + ' ' + (bs.ref || bs.num || '')) };
  if (bs.kind === 'agreement' && !credit.agreements.some(a => a.num === bs.num))
    credit.agreements.push({ num:bs.num, date:bs.date, source:bs.source || 'кредит', scan:bs.scan || '' });
  let added = 0;
  for (const rec of ctx.records){
    for (const no of rec.trancheNos){
      const t = credit.tranches.find(x => x.no === no);          // гейт уже проверил, что номер резолвится
      const row = mkConditionRecord({ param:rec.param, value:rec.value,
        effectiveFrom:rec.effectiveFrom, basis, note:rec.note || '' });
      t.conditionRecords.push(row);
      pushAudit(credit, 'conditionRecord', null, row);
      added++;
    }
  }
  return { ok:true, value:{ added } };
}

/* editSubject(credit, ctx) — КР-55: правка предмета кредита НАПРЯМУЮ, только пока
   ЖЦ «Проект» (Г-9-режим, как editConditions). После регистрации эта дверь закрыта
   гейтом — единственный путь дальше addSubjectRecords. */
function editSubject(credit, ctx){
  const g = gate(credit, 'editSubject', ctx);
  if (!g.ok) return g;
  if (ctx.mode==='add'){
    const item = mkSubjectItem(ctx.item);
    credit.subject.push(item);
    pushAudit(credit, 'editSubject: add', null, item);
    return { ok:true, value:item };
  }
  const before = credit.subject.slice();
  credit.subject = credit.subject.filter(it => it.id !== ctx.itemId);
  pushAudit(credit, 'editSubject: remove', before, credit.subject.slice());
  return { ok:true, value:{ removed: ctx.itemId } };
}

/* addSubjectRecords(credit, ctx) — КР-55: единственный способ изменить предмет
   кредита после регистрации. Одно действие = одно доп. соглашение = N записей
   (add/remove по позициям). Записи не удаляются и не «архивируются» (Г-21-паттерн);
   действующий состав — производная subjectAt. ДС при первом упоминании попадает
   в реестр документов credit.agreements (как в addConditionRecords). */
function addSubjectRecords(credit, ctx){
  const g = gate(credit, 'addSubjectRecords', ctx);
  if (!g.ok) return g;
  const bs = ctx.basis;
  const basis = { kind:'agreement', ref:bs.num, date:bs.date, label:'Доп. соглашение ' + bs.num };
  if (!credit.agreements.some(a => a.num === bs.num))
    credit.agreements.push({ num:bs.num, date:bs.date, source:'кредит', scan:bs.scan || '' });
  let added = 0;
  for (const rec of ctx.records){
    const row = rec.mode==='add'
      ? (()=>{ const item = mkSubjectItem(rec.item); return mkSubjectRecord({ action:'add',
          itemId:item.id, item, effectiveFrom:ctx.effectiveFrom, basis, note:ctx.note || '' }); })()
      : mkSubjectRecord({ action:'remove', itemId:rec.itemId, item:null,
          effectiveFrom:ctx.effectiveFrom, basis, note:ctx.note || '' });
    credit.subjectRecords.push(row);
    pushAudit(credit, 'subjectRecord: ' + row.action, null, row);
    added++;
  }
  return { ok:true, value:{ added } };
}

/* editClassification(credit, ctx) — правка классификации НАПРЯМУЮ, в любом ЖЦ (Г-34).
   Волна КВ-32 сняла второй режим — «изменение по документу» и «корректировку»: для
   паспортного разряда договора обе двери оказались лишними, а вопрос «что произошло»
   задавался пользователю там, где ответ ничего не менял. История правок остаётся в
   журнале (before/after), как у editContractRequisites. Пишет один pushAudit на всё
   действие: классификация читается как один разряд, четыре записи в журнале — шум. */
function editClassification(credit, ctx){
  const g = gate(credit, 'editClassification', ctx);
  if (!g.ok) return g;
  const before = { kind:credit.kind, line:credit.line, purpose:credit.purpose, fundingSource:credit.fundingSource };
  for (const p of CLASSIFICATION_PARAMS)
    if (ctx.values[p.key] != null) credit[p.key] = String(ctx.values[p.key]).trim();
  const after = { kind:credit.kind, line:credit.line, purpose:credit.purpose, fundingSource:credit.fundingSource };
  pushAudit(credit, 'editClassification', before, after);
  return { ok:true, value:after };
}

/* closeCredit(credit, {reason,doc}) — терминалы Р-20: обязательные реквизиты, без физ.
   удаления. ТРИ основания, как объявляет канон §3: «Погашен» (Г-14=repay) · «Списан»
   (Г-12=writeOff) · «Расторгнут» (terminate). Третьего в файле не было вовсе — ни в
   коде, ни в тексте (КР-5), хотя расторжение договора это штатный, а не редкий исход.

   Терминальный исход шире закрытия кредита (КР-33): CONTEXT.md называет ещё «признана
   безнадёжной» и «завершена процедура банкротства». Первое оформляется здесь как
   «Списан» с соответствующим решением; второе принадлежит взысканию и приходит оттуда —
   кредит закрывается по его результату, а не объявляет банкротство сам. */
const CLOSURE_REASONS = { 'Погашен':'repay', 'Списан':'writeOff', 'Расторгнут':'terminate' };
function closeCredit(credit, ctx){
  const action = CLOSURE_REASONS[ctx.reason];
  if (!action) return { ok:false, reasons:['Неизвестное основание закрытия — только «'
    + Object.keys(CLOSURE_REASONS).join('», «') + '»'] };
  const g = gate(credit, action, { doc: ctx.doc, reason: ctx.reason === 'Расторгнут' ? ctx.note : ctx.reason });
  if (!g.ok) return g;
  const before = credit.closure;
  const after = Object.assign({}, before || {},
    { reason: ctx.reason, date: TODAY, doc: ctx.doc || null, note: ctx.note || '' });
  credit.closure = after;
  credit.lifecycle = 'Закрыт';
  pushAudit(credit, 'closeCredit: ' + ctx.reason, before, after);
  /* СПИСАНИЕ ПИШЕТ ЗАПИСИ ПО ТРАНШАМ (КВ-53). Прежде терминал «Списан» менял на кредите
     ровно два поля — основание и ЖЦ, — и расчёт о событии не узнавал: ни даты, ни суммы,
     ни транша. Решение выносится на кредит, а тело живёт в траншах, поэтому разнесение
     происходит здесь, у самой двери, и той же функцией, какой сидируются закрытые
     кредиты, — иначе демо и рабочий путь разошлись бы первой же правкой. */
  if (ctx.reason === 'Списан'){
    const made = writeOffTranches(credit, { date: after.date, doc: ctx.doc || null,
                                            amount: (ctx.doc || {}).amount });
    for (const m of made)
      pushAudit(credit, 'writeOff: транш №' + m.trancheNo + ' · ' + money(m.amount), null, m);
  }
  return g;
}

/* linkPledge(credit, pledge) — Г-13: привязка ТОЛЬКО существующего залогового
   договора того же ИНН заёмщика (Р-7 — «Создать залоговый договор» из кредита нет). */
function linkPledge(credit, pledge){
  const g = gate(credit, 'linkPledge', { pledge });                      // Г-13
  if (!g.ok) return g;
  const before = credit.mirror.pledges.length;
  credit.mirror.pledges.push(pledge);
  pushAudit(credit, 'linkPledge', before, pledge);
  return g;
}

/* zeroOutForTest(credit) — ТЕСТ-ХЕЛПЕР (не бизнес-функция, не в export UI-путях):
   гасит долг до нуля, чтобы проверить позитивную ветку Г-14 (closeCredit «Погашен»).
   Прежняя версия обнуляла поля засеянного ledger; поля больше нет (ADR-0010), и
   обнулять нечего — долг выводится. Поэтому хелпер идёт ЧЕРЕЗ ТУ ЖЕ ДВЕРЬ, что и
   настоящее погашение: добавляет в зеркало платежей подтверждённый ЦК платёж на всю
   сумму по статьям. Это не обход расчёта, а его вход — и заодно проверка, что вход
   действительно двигает остаток (чего прежняя модель не умела, КР-7). */
function zeroOutForTest(credit){
  const d = derive(credit);
  const layers = { principal:d.debt.principal.bal, interest:d.debt.interest.bal,
                   penalty:d.debt.penalty.bal,     fees:d.debt.fees.bal };
  const amount = round2(layers.principal + layers.interest + layers.penalty + layers.fees);
  credit.mirror.payments.push({ num:(credit.mirror.payments.length || 0) + 1, date:TODAY,
    bindDate:null, amount, currency:credit.currency || 'KGS', rate:null, dispute:null,
    tranche:(credit.tranches[0] || {}).no || 1, reg:'Импорт ЦК', match:'Подтверждён ЦК',
    frozen:true, method:'денежными средствами', layers });
  credit.mirror.paymentsAsOf = TODAY;
}

/* ---- 7. DOM: рендер и обвязка (только в браузере) ---- */
if (typeof document !== 'undefined') {
  CR.db = seedDb();                                  // живой изменяемый экземпляр

      { label:'Программы и решения', items:[{ label:'Решение правительства' }, { label:'Кредитные программы' }] },

    ]},

          `<a class="nav-item${it.active ? ' active' : ''}${s.headerless ? ' headerless' : ''}"
             onclick="${it.active ? 'CR.backToList()' : `CR.toast('Раздел «'+this.textContent.trim()+'» — вне объёма макета')`}">${it.label}</a>`).join('');
        if (s.headerless) return items;
        return `<div class="nav-sub open"><button class="nav-toggle" onclick="this.parentElement.classList.toggle('open')">
            <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            <span class="lbl">${s.label}</span></button><div class="nav-children">${items}</div></div>`;

      + `<div class="row"><span class="ck">Факторы (${rb.factors.length})${rb.factors.length ? ': ' + rb.factors.map(f => esc(f.kind) + ' · ' + esc(f.committeeRef)).join(' · ') : ' — нет действующих'}</span> <b class="cat-${catClsOf(rb.byFactors)}">${esc(rb.byFactors)}</b></div>`

  CR.openCoverageInfo = function(){

    if (cov.applicable)
      lines.push(`Сумма под риском = остаток ОД <b>${money(d.debt.principal.bal)}</b> + не освоено <b>${money(Math.max(0,d.undisbursed))}</b>`);

  /* ============================================================
     Р-19 РЕЕСТР КРЕДИТОВ — DOM render layer (Task 6).
     Реестр показывает КРЕДИТ (кредитные колонки §5.1), не заявку. Все ячейки —
     из derive() в рантайме (Р-11, кэш запрещён). Фильтры комбинируются по AND.
     ============================================================ */
  let selectedId = null;
  const LIFECYCLES = ['Проект','Зарегистрирован','Действует','Закрыт'];
  const PROBLEM_LABEL = { collection:'Активное взыскание', restructuring:'Активная реструктуризация' };
  /* Реестр открывается без предвыбранного ЖЦ — видны все договоры, включая проектные
     и закрытые. Молчаливый дефолт «Действует» прятал часть выдачи, поэтому снят. */
  const filters = { q:'', dateFrom:'', dateTo:'', region:'', district:'', program:'', curator:'',
                    category:'', subgroup:'', lifecycle:'', problem:'', odMin:'', odMax:'' };
  const paging = { page:1, size:10 };

  /* ============================================================
     ДЕМОНАБОР — СЛУЖЕБНАЯ ВЕЩЬ МАКЕТА, В ПРОДУКТ НЕ ИДЁТ (разбор 15.08.2026).
     Сид держит 60 кредитов: 8 опорных цепочек (K-1…K-7, K-6b), 8 фоновых платёжных
     (K-B1…K-B8: платёж в иной валюте, сторно по таймауту, восстановление ЦК) и
     44 сценарных (K-C1…K-C44) — по одному на ветку логики.

     ПОКАЗ БОЛЬШЕ НЕ РЕЖЕТСЯ (КВ-52, решение владельца 16.08.2026). Переключатель
     «Опорные / Весь демонабор» снят вместе со всей своей машинерией: он пересобирал
     ОБОЛОЧКУ реестра (списки «Область / Район», «Программа», «Куратор» строятся из
     данных), переносил заполненные фильтры и на каждом промахе выборки делал второй
     проход по всему сиду с derive() — страница от этого тормозила. Реестр снова ходит
     по `CR.db.credits`, как до КВ-44; длину гасит пагинация (10 строк на страницу).

     Сид при этом по-прежнему не избыточен и не режется: 44 сценария дают 39
     неповторяющихся отпечатков ветвления (ЖЦ · освоение · просрочка · категория ·
     взыскание · покрытие · реструктуризация · пауза · резерв · KM · плавающая ·
     мульти-транш · договор<одобренной · закрытие · валюта) — чистых дублей всего
     пять, а ID позиционный (`'K-C'+(i+1)`, номер `C(200+i)`, ИНН от i), и вынутый из
     середины сценарий сдвинул бы все последующие, на которые стоят смоук, ADR и шоты.
     От набора осталась ШПАРГАЛКА: она отвечает на вопрос показа «где кредит с
     банкротством / паузой / чужой валютой» и ничего не пересчитывает до клика.
     ============================================================ */
  /* «Что демонстрирует» — не подпись из сида, а СОСТОЯНИЕ кредита на срезе: ярлыки
     берутся у stateFlags (те же слова, что куратор видит в карточке) и дополняются
     тем, что во флаги не попадает, — ЖЦ, освоение, валюта, число траншей, покрытие
     ниже порога, неустойка за неосвоение. Размечать сид отдельным полем отвергнуто:
     подпись, живущая рядом с данными, врёт при первой же правке данных. */
  function demoNoteOf(c, d){
    const out = [];
    if (c.lifecycle !== 'Действует')
      out.push(c.lifecycle + (c.closure && c.closure.reason ? ' · ' + c.closure.reason : ''));
    if (d.disbState !== 'Полностью освоен') out.push(d.disbState.toLowerCase());
    if ((c.tranches || []).length > 1) out.push('траншей ' + c.tranches.length);
    if (c.currency !== 'KGS') out.push('валюта ' + c.currency);
    out.push(...d.stateFlags.map(f => f.text));
    /* Признак берётся у гейта (`ok`), а не пересчитывается из ratio: порог бывает
       нулевым по решению КМ, а к индексу примешана доля ликвида — своя арифметика тут
       разошлась бы с плашкой карточки. */
    const cov = d.coverage;
    if (cov && cov.applicable && cov.ok === false)
      out.push('обеспеченность ниже порога' + (cov.index != null ? ' · индекс ' + Math.round(cov.index * 100) + ' %' : ''));
    if (d.reserveAccrual && d.reserveAccrual.applies) out.push('неустойка за неосвоение');
    return out.length ? out.join(' · ') : 'ровный действующий кредит без особенностей';
  }
  /* ШПАРГАЛКА НАБОРА. При показе она отвечает на вопрос, ради которого набор и держат:
     «где кредит с банкротством / паузой / чужой валютой». Три раздела — по происхождению
     кредита в сиде, потому что вопрос демонстратора обычно звучит как «покажи сценарный
     на взыскание», а не «покажи K-C14». */
  function openDemoSheet(){
    const CORE = ['K-1','K-2','K-3','K-4','K-5','K-6','K-6b','K-7'];
    const parts = [
      { label:'Опорные цепочки — сквозные истории макета', test:c => CORE.includes(c.id) },
      { label:'Фоновые — случаи модуля платежей',          test:c => /^K-B/.test(c.id) },
      { label:'Сценарные — по ветке логики на кредит',      test:c => /^K-C/.test(c.id) },
    ];
    const rest = CR.db.credits.filter(c => !parts.some(p => p.test(c)));
    if (rest.length) parts.push({ label:'Прочие', test:c => rest.includes(c) });
    const html = parts.map(p => {
      const list = CR.db.credits.filter(p.test);
      if (!list.length) return '';
      const rows = list.map(c => {
        const d = derive(c);
        return `<tr onclick="CR.openDemoCredit('${jsAttr(c.id)}')" title="Открыть карточку">
          <td class="ds-id">${esc(c.id)} · № ${esc(c.num)}</td>
          <td class="ds-name">${esc(c.borrower.name)}</td>
          <td class="ds-what">${esc(demoNoteOf(c, d))}</td></tr>`;
      }).join('');
      return `<h4>${esc(p.label)} · ${list.length}</h4><table><tbody>${rows}</tbody></table>`;
    }).join('');
    CR.openModal('Шпаргалка демонабора — что демонстрирует каждый кредит',
      `<div class="demo-sheet">${html}</div>`,
      '<button class="btn btn-secondary" onclick="CR.closeModal()">Закрыть</button>');
  }
  /* Открытие из шпаргалки: реестр показывает весь сид, поэтому расширять нечего —
     закрыть модалку и открыть карточку. */
  function openDemoCredit(id){
    CR.closeModal();
    openDetail(id);
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
  /* Модель хранит даты как дд.мм.гггг (pd() их так парсит); <input type="date"> отдаёт
     и принимает только ISO гггг-мм-дд. toISO/toDMY — мост на границе рендер/чтение формы.
     Обе идемпотентны на «не своём» формате (проходят вход насквозь/пусто), чтобы не падать
     на пустом/уже-конвертированном значении. */
  function toISO(s){ if(!s || !/^\d{2}\.\d{2}\.\d{4}$/.test(s)) return ''; const [d,mo,y]=s.split('.'); return `${y}-${mo}-${d}`; }
  function toDMY(s){ if(!s) return s; if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const [y,mo,d]=s.split('-'); return `${d}.${mo}.${y}`; }
  function uniq(arr){ return [...new Set(arr)].filter(x=>x && x!=='—').sort((a,b)=>String(a).localeCompare(String(b),'ru')); }
  function optList(vals, sel){ return ['<option value="">— все —</option>']
    .concat(vals.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`)).join(''); }
  /* активный куратор кредита (зеркало журнала кураторства Р-9): to==null, иначе последняя запись */
  function curatorOf(c){
    const cs = (c.mirror && c.mirror.curatorship) || [];
    const act = cs.find(x=>!x.to) || cs[cs.length-1];
    return act ? act.employee : '—';
  }

  /* справочник Область → Районы строится из данных, а не хардкодом:
     список районов всегда согласован с тем, что реально есть в реестре. */
  function regionsOf(){ return uniq(CR.db.credits.map(c=>c.borrower.region)); }
  function districtsOf(region){
    return uniq(CR.db.credits.filter(c=>!region || c.borrower.region===region).map(c=>c.borrower.district));
  }

  /* ---- рендер полной оболочки реестра (тулбар + фильтры + сетка) ---- */
  function renderList(){
    const host = document.getElementById('view-list'); if (!host) return;
    const programs = uniq(CR.db.credits.map(c=>c.origin.programId));
    const curators = uniq(CR.db.credits.map(curatorOf));
    /* Фильтр по ПОДГРУППЕ заёмщика — зеркало (ADR-0012). Прежний фильтр назывался
       «Группа платёжеспособности» и работал по шести значениям, которые кредит выводил
       сам; теперь значения приходят из карточки заёмщика, их одиннадцать. */
    const sgOpts = Object.keys(SUBGROUP_LABEL).map(k=>`<option value="${k}">${k} · ${esc(SUBGROUP_LABEL[k])}</option>`).join('');
    /* сортируемая шапка грида (как в реестре заявок): ярлык + глиф ↕, у активной ↑/↓ */
    const th = (k, l, a) => `<th data-k="${k}"${a?` style="text-align:${a}"`:''} onclick="CR.sortList('${k}')">`
      + `${l} <span class="sort">↕</span></th>`;
    host.innerHTML = `
      <!-- ЯРУС 1 — быстрая строка. Всегда видна: поиск по заёмщику — самое частое действие
           в реестре, за кликом «развернуть фильтры» ему не место. Поиск, ЖЦ и куратор —
           три условия, которые задают все пять ролей, остальное живёт в ярусе 2. -->
      <div class="tb-quick">
        <div class="field q-search"><span class="flabel">Поиск</span><div class="control"><input id="fQ" type="search" placeholder="Заёмщик, ИНН или № договора" oninput="CR.renderRows()"></div></div>
        <div class="field q-lifecycle"><span class="flabel">ЖЦ договора</span><div class="control"><select id="fLifecycle" onchange="CR.renderRows()">${optList(LIFECYCLES, filters.lifecycle)}</select><span class="caret">▾</span></div></div>
        <div class="field q-curator"><span class="flabel">Куратор</span><div class="control"><select id="fCurator" onchange="CR.renderRows()">${optList(curators)}</select><span class="caret">▾</span></div></div>
        <button class="btn btn-secondary btn-sm q-more" id="btnFilters" onclick="CR.toggleFilters()">⚙ Фильтры<span class="fbadge" id="fBadge" hidden></span></button>
        <button class="btn btn-primary btn-sm" id="btnCreate" onclick="CR.openCreatePicker()">Создать кредит</button>
      </div>
      <!-- ЯРУС 2 — три равные колонки. Строка 1 «привязка» (где · по какой программе ·
           когда), строка 2 «риск» (просрочка · подгруппа · категория), строка 3 —
           проблемность и сброс. Фильтр «Состояние освоения» снят: освоение читается
           в карточке, в реестре по нему не выбирают. -->
      <div class="filter-body" id="filterBody">
        <!-- Каскад Область→Район — одно измерение выборки, поэтому одно поле с двумя
             селектами: в сетке из двух ячеек пара разъезжалась при переносе строки. -->
        <div class="field"><span class="flabel">Область / Район</span><div class="range-pair">
          <div class="control"><select id="fRegion" onchange="CR.onRegionChange()">${optList(regionsOf())}</select><span class="caret">▾</span></div>
          <div class="control"><select id="fDistrict" onchange="CR.renderRows()">${optList(districtsOf(''))}</select><span class="caret">▾</span></div>
        </div></div>
        <div class="field"><span class="flabel">Программа</span><div class="control"><select id="fProgram" onchange="CR.renderRows()">${optList(programs)}</select><span class="caret">▾</span></div></div>
        <!-- Дата ушла из колонки «Договор» во вторую строку ячейки и потеряла сортировку —
             диапазон здесь возвращает её как измерение выборки (иначе «свежие кредиты» не найти). -->
        <div class="field"><span class="flabel">Дата договора</span><div class="range-pair"><input id="fDateFrom" type="date" onchange="CR.renderRows()"><span>—</span><input id="fDateTo" type="date" onchange="CR.renderRows()"></div></div>
        <div class="field"><span class="flabel">Просрочка, дн</span><div class="range-pair"><input id="fOdMin" type="number" min="0" placeholder="от" oninput="CR.renderRows()"><span>—</span><input id="fOdMax" type="number" min="0" placeholder="до" oninput="CR.renderRows()"></div></div>
        <div class="field"><span class="flabel">Подгруппа заёмщика</span><div class="control"><select id="fSubgroup" onchange="CR.renderRows()"><option value="">— все —</option>${sgOpts}</select><span class="caret">▾</span></div></div>
        <div class="field"><span class="flabel">Категория риска</span><div class="control"><select id="fCategory" onchange="CR.renderRows()">${optList(['низкий','средний','высокий'])}</select><span class="caret">▾</span></div></div>
        <div class="field"><span class="flabel">Проблемность</span><div class="control"><select id="fProblem" onchange="CR.renderRows()"><option value="">— все —</option>${Object.keys(PROBLEM_LABEL).map(k=>`<option value="${k}">${esc(PROBLEM_LABEL[k])}</option>`).join('')}</select><span class="caret">▾</span></div></div>
        <div class="filter-actions"><button class="btn btn-secondary btn-sm" onclick="CR.resetFilters()">Сбросить фильтры</button></div>
      </div>
      <!-- Чипы активных условий: что именно сужает выдачу — видно и при свёрнутой
           панели, каждое условие снимается одним кликом по ×. -->
      <div class="filter-chips" id="fChips"></div>
      <div class="grid-wrap">
        <!-- Восемь колонок вместо двенадцати. Слитые пары — «главная строка + .sub»,
             тот же приём, каким Заёмщик уже носит ИНН и район:
               Договор       = № (+Т·N/Р·N) над датой
               Программа     = программа над куратором
               Сумма/Остаток/Просрочка = число над валютой кредита, без приведения к сомам
               Классификация = категория (owned) над подгруппой (зеркало, под замком)
             Утраченные сортировки покрыты фильтрами: куратор — fCurator, подгруппа —
             fSubgroup, дата — новый диапазон; по валюте сортировать было нечего. -->
        <table class="grid"><colgroup>
          <col style="width:112px"><col style="width:250px"><col style="width:130px">
          <col style="width:152px"><col style="width:134px"><col style="width:128px">
          <col style="width:152px"><col style="width:126px">
        </colgroup><thead><tr>
          ${th('num','Договор')}${th('borrower','Заёмщик')}${th('program','Программа')}
          ${th('amount','Сумма договора','right')}${th('balance','Остаток','right')}${th('overdue','Просрочка','right')}
          ${th('category','Классификация')}${th('lifecycle','ЖЦ договора')}
        </tr></thead><tbody id="regBody"></tbody></table>
      </div>
      <div class="pager" id="regPager"></div>`;
    renderRows();
    renderRole();
  }

  /* смена области — пересобрать список районов (каскад), сбросив несовместимый выбор */
  function onRegionChange(){
    const reg = document.getElementById('fRegion').value;
    const dSel = document.getElementById('fDistrict');
    const prev = dSel.value;
    dSel.innerHTML = optList(districtsOf(reg));
    dSel.value = [...dSel.options].some(o=>o.value===prev) ? prev : '';
    renderRows();
  }
  /* раскрыть/свернуть ярус 2 */
  function toggleFilters(){
    const b = document.getElementById('filterBody'); if (b) b.classList.toggle('open');
  }
  function resetFilters(){
    FILTER_IDS.forEach(id=>{ const e = document.getElementById(id); if (e) e.value = ''; });
    const dSel = document.getElementById('fDistrict'); if (dSel) dSel.innerHTML = optList(districtsOf(''));
    paging.page = 1;
    renderRows();
  }

  /* УСЛОВИЯ фильтра — единая таблица для трёх потребителей: счётчика на бейдже, чипов и
     сброса одного условия. Условие ≠ поле: пара «от—до» и каскад «область→район» — это
     одно условие на двух контролах (иначе бейдж врёт: заполненный диапазон дат давал 2). */
  const CONDS = [
    { key:'q',         ids:['fQ'],                  label:'Поиск',          val:f=>f.q },
    { key:'lifecycle', ids:['fLifecycle'],          label:'ЖЦ',             val:f=>f.lifecycle },
    { key:'curator',   ids:['fCurator'],            label:'Куратор',        val:f=>f.curator },
    { key:'overdue',   ids:['fOdMin','fOdMax'],     label:'Просрочка',
      val:f=> (f.odMin==='' && f.odMax==='') ? '' : `${f.odMin||0}—${f.odMax||'∞'} дн.` },
    { key:'problem',   ids:['fProblem'],            label:'Проблемность',   val:f=>PROBLEM_LABEL[f.problem] || '' },
    { key:'category',  ids:['fCategory'],           label:'Категория риска',val:f=>f.category },
    { key:'program',   ids:['fProgram'],            label:'Программа',      val:f=>f.program },
    { key:'subgroup',  ids:['fSubgroup'],           label:'Подгруппа',      val:f=>f.subgroup },
    { key:'place',     ids:['fRegion','fDistrict'], label:'Регион',
      val:f=>[f.region, f.district].filter(Boolean).join(' · ') },
    { key:'date',      ids:['fDateFrom','fDateTo'], label:'Дата договора',
      val:f=> (!f.dateFrom && !f.dateTo) ? '' : `${toDMY(f.dateFrom) || '…'}—${toDMY(f.dateTo) || '…'}` },
  ];
  const FILTER_IDS = CONDS.flatMap(c=>c.ids);

  /* считать значения фильтров из контролов в состояние filters */
  function readFilters(){
    const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
    filters.q = g('fQ').trim().toLowerCase();
    filters.dateFrom = g('fDateFrom'); filters.dateTo = g('fDateTo');
    filters.region = g('fRegion'); filters.district = g('fDistrict');
    filters.program = g('fProgram'); filters.curator = g('fCurator'); filters.category = g('fCategory');
    filters.subgroup = g('fSubgroup');
    filters.lifecycle = g('fLifecycle'); filters.problem = g('fProblem');
    filters.odMin = g('fOdMin'); filters.odMax = g('fOdMax');
  }
  /* активные условия — [{cond, text}]; пустой текст = условие не задано */
  function activeConds(){
    return CONDS.map(c=>({ cond:c, text:c.val(filters) })).filter(x=>x.text);
  }
  /* сколько условий реально сужают выборку — для бейджа на кнопке «⚙ Фильтры» */
  function activeFilterCount(){ return activeConds().length; }
  /* чипы активных условий; × снимает условие целиком (обе границы диапазона, оба селекта каскада) */
  function renderChips(){
    const host = document.getElementById('fChips'); if (!host) return;
    host.innerHTML = activeConds().map(({cond, text}) =>
      `<span class="fchip">${esc(cond.label)}: ${esc(text)}`
      + `<button title="Снять условие" onclick="CR.clearFilter('${cond.key}')">×</button></span>`).join('');
  }
  function clearFilter(key){
    const cond = CONDS.find(c=>c.key===key); if (!cond) return;
    cond.ids.forEach(id=>{ const e = document.getElementById(id); if (e) e.value = ''; });
    if (key === 'place'){                          // каскад снят целиком — вернуть полный список районов
      const dSel = document.getElementById('fDistrict'); if (dSel) dSel.innerHTML = optList(districtsOf(''));
    }
    paging.page = 1;
    renderRows();
  }
  /* AND-комбинация фильтров; пустой фильтр = нет ограничения */
  function passFilters(c, d){
    const f = filters;
    /* Одно поле на три токена: наименование, ИНН, номер договора. Ложное совпадение
       («56» найдёт и договор 56, и ИНН с 56 внутри) снимается сортировкой в renderRows —
       точное совпадение по номеру поднимается в начало выдачи. */
    if (f.q){
      const hay = (c.borrower.name + ' ' + c.borrower.inn + ' ' + c.num).toLowerCase();
      if (!hay.includes(f.q)) return false;
    }
    /* дата модели — дд.мм.гггг, контрол отдаёт ISO; сравниваем в ISO, где лексикографический
       порядок совпадает с хронологическим. Незаполненная граница диапазон не сужает. */
    if (f.dateFrom || f.dateTo){
      const iso = toISO(c.date);
      if (f.dateFrom && (!iso || iso < f.dateFrom)) return false;
      if (f.dateTo   && (!iso || iso > f.dateTo))   return false;
    }
    if (f.region   && c.borrower.region !== f.region)     return false;
    if (f.district && c.borrower.district !== f.district)  return false;
    if (f.program   && c.origin.programId !== f.program)   return false;
    if (f.curator   && curatorOf(c) !== f.curator)         return false;
    if (f.category  && d.riskCategory !== f.category)       return false;
    if (f.subgroup  && d.subgroup !== f.subgroup)           return false;
    if (f.lifecycle && c.lifecycle !== f.lifecycle)         return false;
    if (f.odMin !== '' && d.overdueDays < +f.odMin)         return false;
    if (f.odMax !== '' && d.overdueDays > +f.odMax)         return false;
    if (f.problem === 'collection'    && !d.stateFlags.some(o=>o.kind==='collection'))    return false;
    if (f.problem === 'restructuring' && !d.stateFlags.some(o=>o.kind==='restructuring')) return false;
    return true;
  }
  /* одна строка реестра — все ячейки из credit + derive() */
  function rowHtml(c, d){
    const sel  = (c.id===selectedId) ? ' sel' : '';
    const term = (c.lifecycle==='Закрыт') ? ' terminal' : '';
    const catCls = d.riskCategory==='высокий' ? 'high' : d.riskCategory==='средний' ? 'mid' : 'low';
    /* Т·N / Р·N — сколько траншей и реструктуризаций «спрятано» в карточке.
       Строк реестра они не порождают: реестр — про кредит, не про его части.
       Т·N ставится только от двух траншей: один транш есть почти у всех, бейдж на
       каждой строке — шум, а не информация. */
    const nT = (c.tranches || []).length;
    const nR = (c.mirror && c.mirror.restructuring && c.mirror.restructuring.count) || 0;
    const marks = (nT > 1 ? `<span class="mk" title="траншей: ${nT}">Т·${nT}</span>` : '')
                + (nR ? `<span class="mk mk-r" title="реструктуризаций: ${nR}">Р·${nR}</span>` : '');
    /* Просрочка той же формы, что и деньги рядом: сумма первой строкой (правое
       выравнивание, табличные цифры), дни и валюта — второй. Дни остаются красными:
       это сигнал тревоги, из второй строки он читается не хуже.
       Нулевая просрочка — одна строка «0 дн.»: колонка нулей с валютой это шум. */
    const odCell = d.overdueDays > 0
      ? `<td class="od num"${d.calcStopped?` title="${jsAttr('Кредит закрыт '+d.calcUntil+' — начисление остановлено, величина застыла на этой дате')}"`:''}>${money0(d.overdueAmount)}<span class="sub"><span class="days">${d.overdueDays} дн.</span> · ${esc(c.currency)}</span></td>`
      : `<td class="od num"><span class="zero">0 дн.</span></td>`;
    /* Все три денежные колонки — в валюте кредита, без приведения к сомам: реестр
       показывает то, что записано в договоре. Валюта — второй строкой ячейки. */
    const ccy = c.currency;
    return `<tr data-id="${esc(c.id)}" class="${(sel+term).trim()}" onclick="CR.selectRow('${esc(c.id)}')" ondblclick="CR.openDetail('${esc(c.id)}')">
      <td>${esc(c.num)}${marks}<span class="sub">${esc(c.date)}</span></td>
      <td title="${esc(c.borrower.name)}"><span class="cell-name">${esc(c.borrower.name)}</span><span class="sub">ИНН ${esc(c.borrower.inn)} · ${esc(c.borrower.district)}</span></td>
      <td title="${esc(c.origin.programId)} · ${esc(curatorOf(c))}">${esc(c.origin.programId)}<span class="sub">${esc(curatorOf(c))}</span></td>
      <td class="num">${money(c.contractAmount)}<span class="sub">${esc(ccy)}</span></td>
      <td class="num bal">${money(d.debtBalance)}<span class="sub">${esc(ccy)}</span></td>
      ${odCell}
      <td><span class="pill ${catCls}">${esc(d.riskCategory)}</span><span class="sub inline" title="${esc([d.subgroupLabel, 'зеркало карточки заёмщика'].filter(Boolean).join(' · '))}">${esc(d.subgroup || '—')}</span></td>
      <td>${esc(c.lifecycle)}</td>
    </tr>`;
  }
  /* сортировка реестра по клику на шапку (как в live vaadin-grid).
     Аксессор на пару [c, d]; для даты ключ приводится к yyyymmdd. */
  let listSort = { key:null, dir:1 };
  const LIST_SORTERS = {
    num:      ([c])=>c.num,
    borrower: ([c])=>c.borrower.name,
    program:  ([c])=>c.origin.programId,
    /* Сортируем по той же цифре, что видно в ячейке (валюта кредита), а не по
       KGS-эквиваленту: иначе 320 000 USD встают выше 540 000 KGS и порядок читается
       как поломка. Плата за это — колонка со смешанными валютами сортируется
       арифметически, а не по стоимости; развязывается фильтром по валюте. */
    amount:   ([c])=>c.contractAmount,
    balance:  ([,d])=>d.debtBalance,
    overdue:  ([,d])=>d.overdueDays,
    category: ([,d])=>({'низкий':0,'средний':1,'высокий':2}[d.riskCategory] ?? -1),
    lifecycle:([c])=>c.lifecycle,
  };
  function sortList(key){
    if (!LIST_SORTERS[key]) return;
    if (listSort.key === key) listSort.dir = -listSort.dir;
    else { listSort.key = key; listSort.dir = 1; }
    paging.page = 1;
    renderRows();
  }
  /* отразить состояние сортировки на стрелках шапки */
  function syncSortHeader(){
    document.querySelectorAll('#view-list table.grid thead th').forEach(th=>{
      const k = th.getAttribute('data-k');
      const on = k === listSort.key;
      th.classList.toggle('sorted', on);
      const sp = th.querySelector('.sort');
      if (sp) sp.textContent = on ? (listSort.dir === 1 ? '↑' : '↓') : '↕';
    });
  }

  /* перерисовать только строки (фильтры/выбор меняются часто, оболочка — нет) */
  function renderRows(){
    readFilters();
    const body = document.getElementById('regBody'); if (!body) return;
    const hits = [];
    for (const c of CR.db.credits){
      const d = derive(c);
      if (!passFilters(c, d)) continue;
      hits.push([c, d]);
    }
    /* сортировка — до пагинации */
    if (listSort.key){
      const get = LIST_SORTERS[listSort.key];
      hits.sort((A, B) => {
        const x = get(A), y = get(B);
        if (typeof x === 'number' && typeof y === 'number') return (x - y) * listSort.dir;
        return String(x ?? '').localeCompare(String(y ?? ''), 'ru', { numeric:true }) * listSort.dir;
      });
    }
    syncSortHeader();
    /* Объединённый поиск: точное совпадение по номеру договора — первым. Sort стабилен,
       поэтому порядок остальных строк (свой или заданный шапкой) не рушится. */
    if (filters.q){
      const exact = ([c]) => String(c.num).toLowerCase() === filters.q;
      hits.sort((A, B) => (exact(B) ? 1 : 0) - (exact(A) ? 1 : 0));
    }
    /* пагинация — после фильтрации; страница зажимается, если выборка усохла */
    const pages = Math.max(1, Math.ceil(hits.length / paging.size));
    if (paging.page > pages) paging.page = pages;
    const from = (paging.page - 1) * paging.size;
    const page = hits.slice(from, from + paging.size);

    /* Промах выборки больше не перепроверяется по полному сиду (КВ-52): реестр и есть
       полный сид, «нет такого кредита» однозначно. Второй проход с derive() по 60
       кредитам на каждый пустой ввод в поиске был из тех, что тормозили страницу. */
    body.innerHTML = page.length ? page.map(([c,d])=>rowHtml(c,d)).join('')
      : `<tr><td colspan="8" style="text-align:center;color:var(--text-placeholder);padding:20px">Ничего не найдено по фильтрам</td></tr>`;
    const badge = document.getElementById('fBadge');
    if (badge){ const n = activeFilterCount(); badge.textContent = n ? '·' + n : ''; badge.hidden = !n; }
    renderChips();
    renderPager(hits.length, pages, from, page.length);
  }
  /* пейджер: «показано X–Y из Z», стрелки и размер страницы */
  function renderPager(total, pages, from, shown){
    const el = document.getElementById('regPager'); if (!el) return;
    const p = paging.page;
    const btn = (label, to, dis) => `<span class="pg${dis?' dis':''}"${dis?'':` onclick="CR.gotoPage(${to})"`}>${label}</span>`;
    const nums = [];
    for (let i = 1; i <= pages; i++)
      nums.push(i === p ? `<span class="pg active">${i}</span>` : btn(i, i, false));
    el.innerHTML = `
      <span class="pinfo">${total ? `Показано ${from+1}–${from+shown} из ${total}` : 'Нет записей'}</span>
      <span class="pages">
        ${btn('«',1,p===1)}${btn('‹',p-1,p===1)}${nums.join('')}${btn('›',p+1,p===pages)}${btn('»',pages,p===pages)}
      </span>
      <span class="psize">На странице:
        <select onchange="CR.setPageSize(this.value)">
          ${[10,20,50,100].map(n=>`<option value="${n}"${n===paging.size?' selected':''}>${n}</option>`).join('')}
        </select>
      </span>`;
  }
  function gotoPage(n){ paging.page = Math.max(1, n); renderRows(); }
  function setPageSize(n){ paging.size = +n; paging.page = 1; renderRows(); }

  /* одиночный клик — выбор строки (включает Просмотр/Изменить) */
  function selectRow(id){
    selectedId = id; CR._sel = id;
    const body = document.getElementById('regBody');
    if (body) [...body.children].forEach(tr => tr.classList && tr.classList.toggle('sel', tr.dataset.id===id));
    renderRole();
  }
  /* двойной клик / Просмотр / Изменить — карточка кредита (§5.2 шапка + §5.3 11 вкладок, Task 7) */
  function openDetail(id, tab){
    const c = CR.db.credits.find(x=>x.id===id); if (!c) return;
    selectedId = id; CR._sel = id; detailId = id;
    detailTab = tab && DTABS.includes(tab) ? tab : 'Договор';
    cardScope = 'credit'; cardAsOf = TODAY; condBasisFilter = 'all'; condOpenGroup = null; condOpenTranche = null; condMatrixTranche = null;
    dogovorExtraTab = 'subject';
    planOpenMonth = null;                                       // состояние вкладки «План» — своё на каждую карточку
    planYear = null; planOpenQuarters = null;                   // «План»: год и раскрытие кварталов — умолчание на каждую карточку
    grafikOpenYears = null;                                     // годы «Графика»: null → умолчание (текущий год)
    prognozShowAll = false; prognozMsOpen = false;              // «Прогноз»: окно в 3 даты, цифры при МС свёрнуты
    document.getElementById('view-list').style.display = 'none';
    /* Набор сужает реестр, а карточка открывается по любому кредиту сида — на карточке
       переключатель ни на что не влияет и только зовёт нажать. Прячем вместе с реестром. */
    const dw = document.getElementById('demoWrap'); if (dw) dw.style.display = 'none';
    const dv = document.getElementById('view-detail');
    dv.style.display = 'flex';
    dv.innerHTML = `<div id="cr-card-body"></div>`;
    renderDetail(c);
    const crumb = document.getElementById('crumb'); if (crumb) crumb.textContent = '/ Договор № ' + c.num;
    syncHash();
  }
  function backToList(){
    const dv = document.getElementById('view-detail'); if (dv){ dv.style.display='none'; dv.innerHTML=''; }
    const lv = document.getElementById('view-list'); if (lv) lv.style.display='flex';
    const dw = document.getElementById('demoWrap'); if (dw) dw.style.display = '';
    const crumb = document.getElementById('crumb'); if (crumb) crumb.textContent = '';
    detailId = null;
    syncHash();
  }
  /* Роутинг по location.hash (#K-1/Условия) — переживает F5 без localStorage/sessionStorage
     (демо-ограничение §0: состояние данных остаётся в памяти, здесь хранится только адрес
     экрана). suppressHash нужен, чтобы popstate/чтение хэша при загрузке не переоткрывало
     то же самое циклом. */
  let suppressHash = false;
  function syncHash(){
    if (suppressHash) return;
    const h = detailId ? '#' + encodeURIComponent(detailId) + '/' + encodeURIComponent(detailTab) : '';
    if (('#'+location.hash.replace(/^#/,'')) !== ('#'+h.replace(/^#/,''))) history.replaceState(null,'',location.pathname+location.search+h);
  }
  function openFromHash(){
    const h = location.hash.replace(/^#/,'');
    if (!h) return;
    const [id, tab] = h.split('/').map(decodeURIComponent);
    suppressHash = true;
    if (id && CR.db.credits.some(x=>x.id===id)) openDetail(id, tab); else backToList();
    suppressHash = false;
  }
  /* сброс демо-данных: свежий seedDb() + полная перерисовка (§демо-ограничения).
     Кнопки в реестре больше нет — вызов остался в CR для консоли демо-стенда. */
  function resetDemo(){
    CR.db = seedDb(); selectedId = null; CR._sel = null;
    backToList(); renderList();
    toast('Демо-данные сброшены', 'ok');
  }
  /* гейтинг действий по роли: Наблюдатель — read-only (createCredit off). Кнопок
     «Просмотр»/«Изменить» больше нет — карточка открывается двойным кликом по строке,
     право на правку гейтится внутри карточки. */
  function renderRole(){
    const canCreate = canRole(currentRole, 'createCredit');
    const bC = document.getElementById('btnCreate');
    if (bC){ bC.disabled = !canCreate; bC.title = canCreate ? '' : 'Роль «'+currentRole+'» не имеет права создавать кредит'; }
  }

  /* «Создать кредит» — picker одобренных заявок без кредита (Г-2) */
  function openCreatePicker(){
    if (!canRole(currentRole, 'createCredit')){ toast('Роль «'+currentRole+'» не может создавать кредит', 'warn'); return; }
    const apps = CR.db.applications.filter(a => a.approved===true && !a.creditId);   // Г-2: только одобренные без кредита
    const host = document.getElementById('modalHost'); if (!host) return;
    host.innerHTML = `<div class="modal narrow">
      <div class="modal-h"><span class="mt">Создать кредит из заявки</span>
        <button class="modal-x" onclick="CR.closeModal()" aria-label="Закрыть">✕</button></div>
      <div class="modal-b">
        <p class="section-note">Показаны только одобренные заявки без привязанного кредита. Отклонённые и уже связанные не выводятся.</p>
        ${apps.length ? `<div class="cpick">${apps.map(a=>`
          <div class="cpick-row" onclick="CR.pickApplication('${esc(a.id)}')">
            <div class="cpick-main"><span class="cpick-num">${esc(a.id)}</span>
              <span class="cpick-sub"> · ${esc(a.borrower.name)} · ИНН ${esc(a.borrower.inn)}</span></div>
            <div class="cpick-claim">${money(a.approvedAmount)}</div></div>`).join('')}</div>`

    if(isTerminal(credit)) return off(terminalReason(credit));
    const r=canRole(currentRole,action);
    const g=credit?gate(credit,action,ctx||{}):{ok:true,reasons:[]};
    const reasons=[]; if(!r) reasons.push('Роль «'+currentRole+'» не имеет права на это действие'); if(!g.ok) g.reasons.forEach(x=>reasons.push(x));
    if(r&&g.ok) return `<button class="${cls}" title="${jsAttr(title)}" onclick="event.stopPropagation();${onclick}">${icon}</button>`;
    return off(reasons.join('; '));
  }

  /* Карандаш «изменить условия» в заголовке карточки (КВ-25). Не roleIconBtn: тот знает
     терминал и роль, а у записи условия причин отказа три — третья это ЖЦ. Погашенное
     состояние обязательно (§0.3): при ЖЦ «Проект» пользователь должен прочитать, что
     условия там правятся напрямую (Г-22), а не обнаружить пустой заголовок.
     Берёт c параметром (не currentCredit()): оба вызова уже держат c в замыкании
     tabUsloviya, а лишний дубль через глобальный detailId — единственная причина, по
     которой у этого хелпера мог бы разойтись кредит с тем, что реально рисует вкладка. */
  function condIconBtn(c, title, onclick){
    const off=(msg)=>`<button class="icon-btn" style="opacity:.45;cursor:not-allowed" title="${jsAttr(msg)}" onclick="CR.toast('${jsAttr(msg)}','warn')">${svgPencil()}</button>`;
    if(isTerminal(c)) return off(terminalReason(c));
    if(!canRole(currentRole,'addConditionRecords')) return off('Роль «'+currentRole+'» не имеет права на это действие');
    if(!c || !['Зарегистрирован','Действует'].includes(c.lifecycle))
      return off('Условия меняются только при ЖЦ «Зарегистрирован» или «Действует» — при «Проект» они правятся напрямую (Г-22)');
    return `<button class="icon-btn" title="${jsAttr(title)}" onclick="${onclick}">${svgPencil()}</button>`;
  }

  /* ---- §5.2 ШАПКА (одна несворачиваемая сводка) ----
     Формат плитки перенесён из loan-credit.html: «значение + ОСНОВАНИЕ» (третья строка).
     Голая цифра в шапке порождает спор «почему столько / почему высокий», и ответ
     приходится искать по вкладкам; основание отвечает на месте.
     ID записи в шапке не показываем — реквизит заёмщика (ИНН) информативнее. */

  /* Метка производной величины. Не lockHtml(): тот про ЗЕРКАЛО (данные чужого модуля),
     а здесь значение считает сам модуль кредитов на лету (Р-11). */
  function derivedHtml(){ return '<span class="lock" title="вычисляется на лету, не хранится">выводится</span>'; }
  function asOfHtml(d){
    if (d && d.calcStopped)
      return `<span class="lock" title="кредит закрыт — начисление остановлено, величины застыли на дате закрытия">на ${esc(d.calcUntil)} · расчёт остановлен</span> ${infoBtn("CR.openDebtInfo()",'По статьям и дата расчёта')}`;
    return `<span class="lock" title="расчёт строится на дату среза карточки">на ${cardAsOf}</span> ${infoBtn("CR.openDebtInfo()",'По статьям и дата расчёта')}`; }
  /* Дата снимка ЗЕРКАЛА. Деньги и метрики, пришедшие из чужих модулей, не подчиняются
     дате среза карточки (КВ-10): у них своя дата, и она обязана быть подписана — иначе
     на одном экране соседствуют две реальности, и различить их нечем. */
  function snapHtml(date, what){
    return `<span class="lock" title="${jsAttr((what||'зеркало') + ' — снимок другого модуля')}">снимок ${esc(date || '—')}</span>`;
  }

  /* Плитка шапки: заголовок · значение · основание. label/value/basis — уже HTML. */
  function dimTile(label, value, basis){
    return `<div class="dim"><div class="dl">${label}</div><div class="dv">${value}</div>`
      + (basis ? `<div class="src">${basis}</div>` : '') + `</div>`;
  }

  /* Плитка «Остаток долга»: ЧЕТЫРЕ статьи кредита (ADR-0010) + приведение к сому.
     Начисленное выводится из графика и условий на дату среза; погашенное приходит
     зеркалом платежей и подписано СВОЕЙ датой снимка — две даты на одной плитке, потому
     что это две разные величины. Пятая статья, расходы взыскания, показана отдельной
     строкой и в остаток кредита не входит: она принадлежит взысканию (ADR-0004). */
  function tileDebt(c,d){
    const cur = c.currency;
    const val = `${money(d.debtBalance)} <span style="font-size:13px;color:var(--text-muted);font-weight:400">${esc(cur)}</span>`;
    if (d.disbursed === 0)
      return dimTile(`Остаток долга ${asOfHtml(d)}`, val,
        `освоение не начато — задолженности нет<br>сумма договора <b>${money(c.contractAmount)} ${esc(cur)}</b>`);
    const parts = [];
    if (cur !== 'KGS') parts.push(`≈ <b>${money0(d.debtBalanceKgs)} KGS</b>`);
    if (d.overdueAmount > 0)
      parts.push(`в т.ч. просрочено <b style="color:var(--asubk-red)">${money(d.overdueAmount)}</b>`
        + `<br>${d.overdueDays} дн.` + (d.overdueSince ? ` с <b>${esc(d.overdueSince)}</b>` : ''));
    /* приостановленное решением суда НАЧИСЛЕНО, но в остаток не входит: иначе куратор
       требует то, чего требовать нельзя, и разница молча живёт между экранами. Расходы
       взыскания, спорная пеня и «погашено» отсюда убраны (не удвоенная информация —
       живут в «Признаках состояния», вкладке «Взыскание» и вкладке «Платежи»). */
    if (d.debt.interest.frozen > 0 || d.debt.penalty.frozen > 0)
      parts.push(`приостановлено решением суда <b>${money(round2(d.debt.interest.frozen + d.debt.penalty.frozen))}</b> — начислено, но не требуется`);
    if (d.overpay.total > 0)
      parts.push(`переплата <b>${money(d.overpay.total)}</b> ${lockHtml()} — обратная очередь и возврат заёмщику принадлежат платежам`);
    return dimTile(`Остаток долга ${asOfHtml(d)}`, val, parts.join('<br>'));
  }

  /* Плитка «Послабления» (ADR-0012 · КВ-13). ТОЛЬКО то, что СНИМАЕТ последствие: запись
     со сроком и основанием. Прежняя плитка называлась «Оверлеи» — слово, запрещённое
     CONTEXT.md в статье «Послабление», — и складывала в одну кучу подавление 181-го дня
     с просрочкой, взысканием и паузой начисления, которые ничего не снимают (КР-26). */
  function tileRelief(c,d){
    const list = d.relief;
    if (!list.length) return '';
    const lines = list.map(r => {
      const label = r.kind === 'suppress181' ? 'подавление 181-го дня' : esc(r.kind);
      return `${label} — <b>${esc(r.basis || '')}</b><br>действует ${esc(r.from)} — <b>${esc(r.deadline || 'без срока')}</b>`
        + (r.kind === 'suppress181' ? `<br>дни просрочки для категории ограничены 180 (факт ${d.riskBasis.raw})` : '');
    });
    return `<div class="dim"><div class="dl">Послабления ${infoBtn('CR.openDerivedInfo()','Как считается')}</div>`
      + `<div class="dv"><span style="font-size:15px">${list.length === 1 ? 'Действует 1' : 'Действует ' + list.length}</span></div>`
      + `<div class="src">${lines.join('<br>')}</div></div>`;
  }

  /* Плитка «Признаки состояния» — то, что описывает положение дел и ничего не снимает:
     просрочка, реструктуризация, взыскание, банкротство, пауза начисления. */
  function tileFlags(c,d){
    const list = d.stateFlags.filter(o => o.kind !== 'overdue');   // просрочка ушла в пилюлю статуса
    if (!list.length) return '';
    const rank = { danger:2, warn:1, info:0 };
    const top  = list.slice().sort((a,b) => (rank[b.tone]||0) - (rank[a.tone]||0))[0];
    const r = c.mirror && c.mirror.restructuring && c.mirror.restructuring.active;
    const lines = [];
    if (r) lines.push(`реструктуризация <b>${esc(r.id)}</b> — ${esc(r.stage)}`
        + (r.deadline ? ` · дедлайн <b>${esc(r.deadline)}</b>` : '')
        + (r.pause && r.pause.days ? ` · пауза ${r.pause.days} дн.` : ''));
    for (const cl of (c.mirror && c.mirror.claims || []))
      lines.push(`требование <b>${esc(cl.claimId)}</b> · ${esc(cl.obligor.role)} · ${esc(cl.stage)} ${lockHtml()}`);
    if ((c.accrualHold || []).some(h => holdIsActive(h, cardAsOf)))
      lines.push('начисление приостановлено — проценты за интервал не начисляются');
    /* приостановка по решению суда — ДРУГОЙ признак: не период, а часть долга, и режим
       у каждого решения свой (спека платежей §6.2) */
    for (const L of d.courtLayers)
      lines.push(`решение суда <b>${esc(L.date)}</b>${L.il?' · '+esc(L.il):''} на <b>${money(L.amount)}</b> ${lockHtml()} — ${esc(L.mode.label)}`);
    if (d.debt.penalty.disputed > 0)
      lines.push(`спорная пеня <b>${money(d.debt.penalty.disputed)}</b> за ${d.overdue.disputedDays} дн. — ждёт решения комиссии, категорию не двигает`);
    const val = `<span style="font-size:15px">${esc(top.text)}</span>`
      + (list.length > 1 ? ` <span style="color:var(--text-muted);font-weight:400;font-size:13px">· ещё ${list.length-1}</span>` : '');
    return `<div class="dim wide"><div class="dl">Признаки состояния ${infoBtn('CR.openDerivedInfo()','Как считается')}</div>`
      + `<div class="dv">${val}</div><div class="src">${lines.join('<br>')}</div></div>`;
  }

  /* Плитка «Ближайший платёж» (шаг 11): самый частый вопрос куратора — когда и сколько.
     Раньше ответ лежал в «График → позиции», три клика вглубь. Значение —
     сумма позиции, основание — дата, статус и транш. Просроченная позиция подсвечена:
     она первая по дате и требует действия раньше предстоящей. */
  function tileNextPay(c,d){
    const np = d.nextPayment;
    if (!np)
      return dimTile(`Ближайший платёж ${infoBtn('CR.openDerivedInfo()','Как считается')}`,
        '<span style="font-size:14px;color:var(--text-muted);font-weight:400">Нет позиций</span>',
        (d.disbursed === 0 ? 'график строится от фактической даты освоения'
                           : 'все позиции графика погашены')
        + (d.fullRepayDate ? `<br>срок возврата <b style="font-weight:var(--weight-bold)">${esc(d.fullRepayDate)}</b>` : ''));
    const late = np.status === 'Просрочена';
    const tone = { 'Наступила':'mid', 'Предстоит':'neutral' }[np.status] || 'neutral';
    const cur = ` <span style="font-size:13px;color:var(--text-muted);font-weight:400">${esc(c.currency)}</span>`;
    const val = (late ? `<span style="color:var(--asubk-red)">${money(np.total)}</span>` : money(np.total)) + cur;
    return dimTile(`Ближайший платёж ${infoBtn('CR.openDerivedInfo()','Как считается')}`, val,
      `дата платежа <b style="font-weight:var(--weight-bold)">${esc(np.date)}</b>`
      + (late ? '' : ` · <span class="pill ${tone}">${esc(np.status)}</span>`)
      + (d.fullRepayDate ? `<br>срок возврата <b style="font-weight:var(--weight-bold)">${esc(d.fullRepayDate)}</b>` : ''));
  }

  /* Плитка «Исполнение плана» (ADR-0042). Плана на месяц среза нет → так и написано.
     НЕ ноль: ноль означал бы «ничего не собрали», а не «цели не ставили» — разные вещи,
     и в шапке их путать дороже всего. */
  function tilePlanExec(c,d){
    const pe=d.planExec, cur=pe.current;
    if(!cur) return dimTile(`Исполнение плана ${derivedHtml()}`, '<span style="color:var(--text-muted)">—</span>',
      `план на ${esc(monthLabel(monthKey(cardAsOf)))} не поставлен`);
    return dimTile(`Исполнение плана ${derivedHtml()}`,
      `${cur.pct} %`,
      `${esc(monthLabel(cur.month))}: факт <b>${money(cur.fact)}</b> / план <b>${money(cur.plan)}</b>`
      + (pe.total.pct!=null?`<br>за ${pe.year} — <b>${pe.total.pct} %</b>`:''));
  }

  /* Печатные формы (перенос из loan-credit): в новом макете печати не было вовсе,
     а это единственное место, откуда куратор забирает документ по конкретному кредиту. */
  const PRINT_FORMS = [
    ['Акт сверки', 'на дату расчёта'], ['Претензия', 'на дату расчёта'],
    /* ADR-0128 §4: полнота легаси (нарастающие итоги по статьям, разделы по траншам) живёт
       в ВЫГРУЖАЕМОЙ форме, а не на экране. На экране срез двигается — нужную дату куратор
       ставит сам; на бумаге он неподвижен, и нарастающие там единственный способ прочитать
       состояние на промежуточную дату. */
    ['Расчёт показателей задолженности', 'на дату расчёта'],
    ['Реестр погашений', 'на дату расчёта'], ['Уведомление', 'должнику'],
    ['График погашения', 'PDF / Excel'], ['Акт обследования залога', 'форма'],
    ['Извещение об утрате залога', 'форма №5'],
  ];
  function printMenuHtml(){
    return `<div class="split">
      <button class="icon-btn" title="Печатные формы" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">${svgPrinter()}</button>
      <div class="split-menu" style="left:auto;right:0;min-width:265px">
        ${PRINT_FORMS.map(([n,s]) => `<button onclick="CR.toast('${jsAttr(n)} — формирование вне объёма макета')">${esc(n)}<span style="float:right;color:var(--text-placeholder);font-size:11px;margin-left:12px">${esc(s)}</span></button>`).join('')}
      </div>
    </div>`;
  }

  /* Плитка «Обеспеченность» (ADR-0007/0009). Показывает НОРМИРОВАННЫЙ индекс: 100 % =
     порог выполнен, при любом пороге. Прежняя плитка называлась «Покрытие» (слово
     запрещено CONTEXT.md) и показывала сырое отношение к сумме договора с порогом
     рядом отдельным числом — форму, от которой ADR-0007 отказался (КР-24, КР-25). */
  function tileCoverage(c,d){
    const cov = d.coverage;
    if (!cov.applicable)
      return dimTile(`Обеспеченность ${infoBtn('CR.openCoverageInfo()','Основание')}`,
        '<span style="font-size:14px;color:var(--text-muted);font-weight:400">неприменима</span>',
        esc(cov.source));
    const light = cov.ok ? 'var(--asubk-green)' : 'var(--asubk-red)';
    const val = cov.index == null
      ? `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span><span style="font-size:15px">${cov.req === 0 ? 'освобождён' : 'не подтверждена'}</span>`
      : `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${light};margin-right:6px"></span>${Math.round(cov.index*100)}%`;
    const lines = [esc(cov.source)];
    if (cov.index != null)
      lines.push(`залоговая <b>${money(cov.numerator)}</b> к сумме под риском <b>${money(cov.base)}</b> = ${Math.round(cov.ratio*100)} % при пороге <b>${cov.req} %</b>`);
    lines.push(`сумма под риском = остаток ОД <b>${money(d.debt.principal.bal)}</b> + не освоено <b>${money(Math.max(0,d.undisbursed))}</b>`);
    if (cov.mirror) lines.push(`числитель — ${snapHtml(cov.mirror.asOf, 'модуль залога')}`);
    return dimTile(`Обеспеченность ${infoBtn('CR.openCoverageInfo()','Основание')}`, val);
  }

  function headerHtml(c,d){
    /* Дни просрочки — в пилюле ЖЦ (перенос из loan-credit): статус и его глубина —
       одна мысль. Одноимённый признак из строки имени при этом убран, чтобы не дублировать. */
    const lcPill = d.overdueDays > 0
      ? `<span class="pill high"${d.calcStopped?` title="${jsAttr('Начисление остановлено '+d.calcUntil)}"`:''}>${esc(c.lifecycle)} · просрочка ${d.overdueDays} дн.${d.calcStopped?' на '+esc(d.calcUntil):''}</span>`
      : `<span class="pill info">${esc(c.lifecycle)}</span>`;

    /* ЕДИНЫЙ ПЕРЕКЛЮЧАТЕЛЬ ОБЛАСТИ (КВ-17) — в шапке, перед датой среза: сначала
       «что смотрим», потом «на когда». Прежде область набиралась пятью контролами
       внутри вкладок (селекты на Условиях/Графике/Прогнозе/Расчётах, клик по строке
       на Траншах) и двумя разными словами — «агрегат» и «консолидировано».
       Кредит с одним траншем контрол не получает: «по кредиту» и «Транш №1» там
       неразличимы, и выбор был бы ложным. */
    const scopeInert = !SCOPED_TABS.includes(detailTab);
    const scopeBox = c.tranches.length > 1 ? `<div style="display:flex;align-items:center;gap:6px">
        <span class="flabel">Область</span>
        <div class="control" style="width:170px"${scopeInert?` title="${jsAttr('Вкладка «'+detailTab+'» — всегда по кредиту целиком')}"`:''}>
          <select onchange="CR.setCardScope(this.value)"${scopeInert?' disabled':''}>
            <option value="credit"${cardScope==='credit'?' selected':''}>По кредиту</option>
            ${c.tranches.map(t=>`<option value="${t.no}"${cardScope===t.no?' selected':''}>Транш №${t.no}${t.closed?' · закрыт':''}</option>`).join('')}
          </select><span class="caret">▾</span></div>
      </div>` : '';

    /* ЕДИНАЯ дата среза карточки (КВ-10) — в шапке, рядом с действиями: она управляет
       всем, что ниже. Раньше жила на одной вкладке «Условия» и остальным не управляла. */
    const isoAsOf = cardAsOf.split('.').reverse().join('-');
    const asOfBox = `<div style="display:flex;align-items:center;gap:6px"><span class="flabel">По состоянию на</span>
        <div class="control" style="width:132px"><input type="date" class="asof-date" value="${esc(isoAsOf)}" onchange="CR.setCardAsOf(this.value.split('-').reverse().join('.'))"></div></div>`
      + (cardAsOf !== TODAY ? `<button class="btn btn-secondary btn-sm" onclick="CR.setCardAsOf('${TODAY}')">⟲ сегодня</button>` : '');

    /* Переход ЖЦ (Г-7/Г-22) — кнопка, которой не существовало: гейт был написан, право
       стояло у двух ролей, а вызвать его было неоткуда (КР-1). */
    const lcBtn = c.lifecycle === 'Проект'
        ? actBtn(c,'register',{},'Зарегистрировать','CR.openRegisterModal()','btn btn-primary btn-sm')
      : c.lifecycle === 'Зарегистрирован'
        ? actBtn(c,'activate',{},'Перевести в «Действует»','CR.openActivateModal()','btn btn-primary btn-sm')
        : '';

    return `<div class="phead">
      <div class="phead-top">
        <div>
          <div class="phead-name">
            <span class="nm">Кредит № ${esc(c.num)} от ${esc(c.date)}</span>
            ${lcPill}
            <span style="font:var(--font-label);color:var(--text-muted)">Куратор: <a onclick="CR.toast('Переход в карточку куратора — вне объёма макета')">${esc(curatorOf(c))}</a></span>
          </div>
          <div class="phead-sub"><a onclick="CR.toast('Переход в карточку заёмщика — вне объёма макета')">${esc(c.borrower.name)}</a>
            ${d.subgroup ? ` · <span class="pill low" title="${jsAttr('Подгруппа заёмщика: ' + (d.subgroupLabel||''))}">${esc(d.subgroup)} ${esc(d.subgroupLabel||'')}</span>` : ''}</div>
        </div>
        <div class="phead-acts">
          ${scopeBox}
          ${asOfBox}
          ${lcBtn}
          ${printMenuHtml()}

     разворот показывает транш из шапки, а не первый попавшийся. Это навигация ВНУТРИ

      .concat(g.trancheNos.length>1?[]:[{h:'Транш'}]).concat([{h:'Примечание'}]);
    if (g.trancheNos.length <= 1) return cgrid(cols, g.items.map(row));
    const scoped = scopeTranche(c);
    const sel = g.trancheNos.includes(condOpenTranche) ? condOpenTranche
              : (scoped && g.trancheNos.includes(scoped.no) ? scoped.no : g.trancheNos[0]);

      const cnt = g.items.filter(i=>i.trancheNo===n).length;

  function tabUsloviya(c,d){

       рядом с числом); «Метод дней» и «Очерёдность» уехали в «Расчёты» — это

       «Ближайший платёж» в шапке (шаг 12), в плите остался только агрегат срока. */
    const holdRows=(c.accrualHold||[]).map(h=>`<tr><td>${esc(h.from)}</td><td>${esc(h.to||'…')}</td><td>${esc(h.reason)}</td><td>${esc(h.doc)}</td></tr>`);

       расхождения по траншам (Д-7). Основание берём из записи, которая

    const recFor=(t,param)=>((t.conditionRecords||[])
      .filter(r=>r.param===param && r.effectiveFrom && pd(r.effectiveFrom)<=pd(cardAsOf))

    const srcLine=(t,param)=>{ const r=recFor(t,param);

        return `<div class="val">${esc(v===undefined?'—':v)}</div>${srcLine(st,param)}`;

      const agg=creditConditionsAt(c,cardAsOf)[param]||{};

        const list=agg.values.map(v=>esc(v.value)).join(' / ');

          title="Значения различаются по траншам — см. «Расхождения по траншам»">⚠ расх.</span></div>
          <span class="src">${agg.values.map(v=>'№'+v.trancheNo+': '+esc(v.value)).join(' · ')}</span>`;

      const actives=c.tranches.filter(activeTranche);
      const t0=actives[0]||c.tranches[0];
      const refs=[...new Set(actives.map(t=>{ const r=recFor(t,param); return r?(r.basis.ref||''):''; }).filter(Boolean))];
      const basisLine = refs.length>1 ? '<span class="src">несколько оснований</span>' : (t0?srcLine(t0,param):'');
      return `<div class="val">${esc(agg.value===undefined?'—':agg.value)}</div>${basisLine}`;

    const cf=(param)=>`<div class="field"><span class="flabel">${esc(paramLabel(param))}${locked?' '+lockG9:''}</span>

    const paramVal=(param)=>{

               у каждого свой бенчмарк (сверка с loan-program.html: у ставки, резерва

               условия — сам факт плавающести не версионируется, версионируется цифра. -->
          ${['rate','reserveRate','penaltyMain','penaltyInt'].filter(k=>b.floatMeta&&b.floatMeta[k]).map(k=>
            `<p class="section-note" style="margin-bottom:0">${esc(paramLabel(k))} — плавающая: ${esc(b.floatMeta[k].benchmark||'—')} + маржа ${esc(b.floatMeta[k].margin)}%.</p>`
          ).join('')}
        </div>

          <!-- Карточка с действием (holdAccrual — единственный вход в модалку) остаётся
               видимой всегда, даже без единой записи (grill 2026-07-31): скрыть значило бы

        ${(()=>{

          const cols=[{h:'Параметр'}].concat(c.tranches.map(t=>({h:'Транш №'+t.no})))

          return `<div class="pcard wide" id="condDivergence">

        <div class="pcard wide">
          <div class="section-h">Журнал изменений условий</div>
          <div class="gtoolbar">
            ${['all','agreement','court','govAct','application'].map(k=>{

          ${(()=>{ const gs=basisGroups(c).filter(g=>condBasisFilter==='all'||g.kind===condBasisFilter);

            for (const g of gs){

              trs.push(`<tr style="cursor:pointer" onclick="CR.toggleCondGroup('${jsAttr(g.key)}')">

            return cgrid([{h:'Документ'},{h:'Дата док.'},{h:'Вступает'},{h:'Изменено'},{h:'Транши'},{h:''}],
                         trs, {empty:'Изменений условий не было'});
          })()}
          ${(()=>{ const usedRefs=new Set();
            c.tranches.forEach(t=>(t.conditionRecords||[]).forEach(r=>{ if(r.basis&&r.basis.ref) usedRefs.add(r.basis.ref); }));
            const orphan=(c.agreements||[]).filter(a=>!usedRefs.has(a.num));
            if(!orphan.length) return '';                     // Шаг 17: хвост пуст у большинства — не рендерим пустую подсекцию
            /* ПЯТАЯ ЯЧЕЙКА — «Применить ДС» (КВ-26, ADR-0096). Дверь одна, и нажимает её
               человек: ДС пришло зеркалом реструктуризации (Р-16), но применение — это

               Применение выносит ДС из хвоста в основной журнал (на него сошлются записи
               условий производного транша) — шаг виден глазом, а не только в аудите. */
            const dsOf = num => ((c.mirror&&c.mirror.restructuring&&c.mirror.restructuring.ds)||[])
              .find(x => x.num === num) || null;
            const trs=orphan.map(a=>{ const ds=a.source==='реструктуризация'?dsOf(a.num):null;
              const rows=(ds&&ds.rows)||[];
              const moved=ds?round2((ds.parts||[]).reduce((s,p)=>s+(p.amount||0),0)):0;
              const cell = !rows.length ? '<span class="text-muted">—</span>'
                : `<div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">приложение: ${plur(rows.length,'позиция','позиции','позиций')}
                     на ${money(moved)} с транша №${ds.sourceTranche}, с ${esc(ds.effectiveFrom)}</div>`
                  + actBtn(c,'applyDs',{ds},'Применить ДС',`CR.applyDsByNum('${jsAttr(a.num)}')`,'btn btn-primary btn-sm');
              return `<tr><td>ДС ${esc(a.num)}</td><td>${esc(a.date)}</td><td>${esc(a.source||'—')}</td>
                <td>${a.scan?esc(a.scan):'—'}</td><td>${cell}</td></tr>`; });
            return `<div class="section-h" style="margin-top:16px;font-size:13px">Документы без изменения условий</div>
              <p class="section-note">Зарегистрированы, но ни одна запись условий на них не ссылается.</p>
              ${cgrid([{h:'Документ'},{h:'Дата'},{h:'Источник'},{h:'Скан'},{h:'Применение'}], trs, {empty:'Таких документов нет'})}`;
          })()}
        </div>

        <div class="pcard wide">
          <div class="section-h" style="cursor:pointer" onclick="CR.toggleCondMatrix()">
            ${condMatrixOpen?'▾':'▸'} Сводная матрица условий (параметр × дата вступления)</div>
          ${condMatrixOpen?(()=>{
            /* Раскладка 03.08.2026: одна таблица на всю ширину распадалась на «параметр
               и лес точек». Делим на две зоны — левая «Ставки и льготы», правая
               «Погашение» (те же смысловые группы, что у карточек условий выше), у каждой
               свой набор дат: колонка появляется, только если в эту дату менялся параметр
               ЭТОЙ зоны. Транши разводим вкладками, как в журнале изменений: склейка
               «7 / 9» в одной ячейке не говорила, чьё какое. */
            const multi=c.tranches.length>1;
            /* Стартовая вкладка — от области карточки (КВ-17), как и в журнале выше:
               контрол в шапке объявлен КАРТОЧНЫМ, значит собственного стартового транша
               у вкладки быть не может. Явный выбор пользователя (condMatrixTranche)
               область перебивает — это навигация внутри вкладки, не вторая область. */
            const mxScoped=scopeTranche(c);
            const selNo=multi?(c.tranches.some(t=>t.no===condMatrixTranche)?condMatrixTranche
                              :(mxScoped?mxScoped.no:c.tranches[0].no)):null;
            const src=multi?c.tranches.filter(t=>t.no===selNo):c.tranches;
            const recs=src.flatMap(t=>(t.conditionRecords||[]).map(r=>({t,r})));
            const zone=(title,keys)=>{
              const zr=recs.filter(x=>keys.includes(x.r.param));
              const dates=[...new Set(zr.map(x=>x.r.effectiveFrom))].sort((a,b)=>pd(a)-pd(b));
              const cols=[{h:'Параметр'}].concat(dates.map(d=>({h:d})));
              const trs=PARAMS.filter(p=>keys.includes(p.key)).map(p=>{
                const cells=dates.map(d=>{ const hit=zr.filter(x=>x.r.param===p.key && x.r.effectiveFrom===d);
                  if(!hit.length) return '<td style="color:var(--text-placeholder)">·</td>';
                  const vals=[...new Set(hit.map(x=>String(x.r.value)))].join(' / ');
                  return `<td>${esc(vals)}<br><span class="src">${esc(hit[0].r.basis.ref||'')}</span></td>`; }).join('');
                return `<tr><td>${esc(p.label)}</td>${cells}</tr>`; });
              return `<div><div class="section-h" style="font-size:13px;margin-bottom:6px">${esc(title)}</div>
                ${dates.length?cgrid(cols, trs, {empty:'Записей нет'})
                             :`<p class="section-note" style="margin:0">Ни один параметр этой зоны не менялся${multi?' по траншу №'+selNo:''}.</p>`}</div>`;
            };
            const bar=multi?`<div class="subtabs">${c.tranches.map(t=>{
              const cnt=(t.conditionRecords||[]).length;
              return `<button class="subtab${t.no===selNo?' active':''}" onclick="CR.setCondMatrixTranche(${t.no})">Транш №${t.no}<span class="cnt">(${cnt})</span></button>`;
            }).join('')}</div>`:'';
            return `<p class="section-note">Пустая ячейка — в эту дату параметр не менялся.</p>
              ${bar}
              <div class="mx2">${zone('Ставки и льготы', MATRIX_ZONE_RATES)}${zone('Погашение', MATRIX_ZONE_REPAY)}</div>`;
          })():''}
        </div>

        <div class="pcard wide">
          <div class="section-h" style="cursor:pointer" onclick="CR.toggleCondTemplate()">
            ${condTemplateOpen?'▾':'▸'} Шаблон наследования (что унаследует новый транш)</div>
          ${condTemplateOpen?`<p class="section-note">Не действующие условия — правка возможна только в ЖЦ «Проект».</p>
            <div class="f2">${PARAMS.map(p=>fld(p.label, esc(b[p.key]))).join('')}</div>`:''}
        </div>
      </div>`;
