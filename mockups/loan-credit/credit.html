        at('generateSchedule: транш №' + t.no + ' · версия v' + sch.ver + ' от ' + sch.generatedFrom, sch.generatedAt || sch.generatedFrom);
    }
    for (const a of (c.agreements || [])) at('addAgreement: ' + a.num + ' (' + (a.source || 'кредит') + ')', a.date);
    if (c.closure && c.closure.reason) at('closeCredit: ' + c.closure.reason, c.closure.date);
  }

  return { credits, applications, pledgesRegistry };
}

/* ============================================================
   3. ЧИСТЫЙ ЛОГИЧЕСКИЙ СЛОЙ — derive / buildSchedule (Task 2).
   Все функции чистые (не трогают document); ничего из §4 не хранится в модели —
   derive пересчитывается при каждой перерисовке, кэш запрещён (Р-11).
   gate / canRole / мутации добавляются в следующих задачах.
   ============================================================ */

/* округление до копеек (детерминированное упрощение, не банковский движок) */
function round2(x){ return Math.round((x + Number.EPSILON) * 100) / 100; }
/* Σ освоений транша (Р-6) */
function disbursedSum(t){ return (t.disbursements || []).reduce((x,d) => x + (d.amount||0), 0); }
/* активен ли интервал приостановки начисления на дату среза (Р-17) */
function holdIsActive(h, asOf){
  if (!h || !h.from) return false;
  const lim = pd(asOf || TODAY);
  if (pd(h.from) > lim) return false;
  return !h.to || pd(h.to) >= lim;
}
/* ---- ПОСЛАБЛЕНИЯ (ADR-0012) ----
   Послабление — запись со сроком и основанием, СНИМАЮЩАЯ последствие просрочки.
   Прежняя реализация опознавала подавление 181-го дня регуляркой /181/ по свободному
   тексту основания приостановки начисления (КР-15): «Постановление 181-ФЗ» включало бы
   послабление ложно. И срока у него не было — булев флаг вместо записи, тогда как
   CONTEXT.md требует, чтобы послабление «действовало в свой срок». */
function reliefActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.relief || []).filter(r => r && r.from && pd(r.from) <= lim
    && (!r.deadline || pd(r.deadline) >= lim));
}
function relief181(c, asOf){ return reliefActive(c, asOf).find(r => r.kind === 'suppress181') || null; }

/* ---- ФАКТОРЫ КАТЕГОРИИ (ADR-0012) ----
   Второй вход worst-of вместо несуществовавшей «группы риска A/B/C/D». Фактор без
   ссылки на решение комитета НЕ действует (инвариант И-1 модуля заёмщика): категорию
   нельзя «настроить» — за каждым ужесточением стоит документ. */
function factorsActive(c, asOf){
  const lim = pd(asOf || TODAY);
  return (c.factors || []).filter(f => f && f.committeeRef && f.from && pd(f.from) <= lim
    && (!f.to || pd(f.to) >= lim));
}

/* ---- 3.1 buildSchedule(tranche, fromDate) — амортизация от фактической даты освоения ----
   Возврат: {rows:[{no,date,total,principal,interest,accrued}]}, где accrued — НАЧИСЛЕННЫЕ
   за период проценты (могут отличаться от interest в льготе по процентам).

   ТРИ ЛЬГОТЫ — три разных механизма (КР-13; до этой волны graceAccrual не читался
   движком вовсе, а graceInterest выполнял его работу):
     graceMain     — основной долг не гасится, проценты платятся;
     graceAccrual  — проценты НЕ НАЧИСЛЯЮТСЯ вовсе (отсрочка начисления);
     graceInterest — проценты начисляются, но НЕ ПЛАТЯТСЯ; накопленное раскладывается
                     равными долями по оставшимся периодам.
   Льготы заданы в МЕСЯЦАХ, а период платежа может быть длиннее месяца — переводим
   в периоды с округлением вверх (льгота не должна «съедаться» длинным периодом).

   ПЕРИОДИЧНОСТЬ (freq) тоже начинает работать (КР-13): число платежей = срок / длина
   периода, ставка за период = годовая × месяцев в периоде / 12. Прежний движок всегда
   строил помесячно, и правка «ежеквартально» не меняла ничего.

   Приостановка начисления (t.accrualHold — зеркало credit.accrualHold: holdAccrual
   пишет интервал в кредит и зеркалит на каждый транш, т.к. сюда приходит только транш)
   обнуляет начисление процентов за период; пеня при паузе не затрагивается. */
const FREQ_MONTHS = { 'ежемесячно':1, 'ежеквартально':3, 'раз в полгода':6, 'ежегодно':12 };
function freqMonths(f){ return FREQ_MONTHS[f] || 1; }

/* ============================================================
   ПЛАН КРЕДИТА (ADR-0042) — единственная ВВОДИМАЯ величина среди трёх ориентиров.
   График — контракт транша. Прогноз — текущее ожидание, выводится. План — что сами
   себе поставили целью на месяц: хранится, потому что относится к ПРОШЛОМУ решению,
   а не к текущему состоянию долга. Если бы план пересчитывался вслед за прогнозом,
   % исполнения плавал бы от досрочного погашения по чужому траншу того же кредита,
   хотя ни план, ни факт в этом месяце не менялись. Неподвижность и есть его смысл.
   Три сущности друг на друга НЕ ссылаются (ADR-0042 §4).
   Месяц везде — строка 'YYYY-MM': сравнивается лексикографически, без Date.
   ============================================================ */
const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь',
                   'июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function monthKey(dateStr){                       // '14.08.2026' -> '2026-08'
  const d = pd(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function monthLabel(mk){                          // '2026-08' -> 'август 2026'
  const [y, m] = String(mk || '').split('-');
  return (MONTHS_RU[(+m) - 1] || '—') + ' ' + y;
}
function monthAdd(mk, k){
  const [y, m] = String(mk).split('-').map(Number);
  const t = (y * 12 + (m - 1)) + (k | 0);
  return Math.floor(t / 12) + '-' + String((t % 12) + 1).padStart(2, '0');
}
function monthRange(fromMk, toMk){
  const out = [];
  if (!/^\d{4}-\d{2}$/.test(String(fromMk)) || !/^\d{4}-\d{2}$/.test(String(toMk))) return out;
  for (let mk = fromMk; mk <= toMk; mk = monthAdd(mk, 1)){ out.push(mk); if (out.length > 240) break; }
  return out;
}

/* Строка плана месяца. amount === null — план СНЯТ (И-14: снятие не удаление,
   строка остаётся видимой, прежнее значение уходит в history). */
function planRowOf(credit, mk){
  return ((credit && credit.plan) || []).find(p => p.month === mk) || null;
}
function planAmountOf(credit, mk){
  const r = planRowOf(credit, mk);
  return r && r.amount != null ? r.amount : null;
}

/* freq==='по конкретным месяцам' (Шаг 18, Q6): payMonths хранится и версионируется
   как условие, но график по нему НЕ строится — движок падает на freqMonths()||1
   (помесячно). Это не пропуск: сама программа (renderTab6, R19) при этом режиме
   принудительно переключает метод погашения на «Индивидуальный» — то есть график
   для него не формула, а ручной ввод, и donor-модель не даёт, от чего вести расчёт
   при неравных промежутках между месяцами. Решать наравне с производственным
   календарём (открытый вопрос §10.5), не изобретая формулу молча. */
function buildSchedule(tranche, fromDate){
  const c = conditionsAt(tranche, TODAY);        // Р-21: условия транша — производное от записей
  const dayMethod = c.dayMethod;                 // Шаг 20: dayMethod теперь в PARAMS — уже в c
  const P = disbursedSum(tranche) || tranche.amount || 0;        // амортизируем освоенный ОД
  const mpp = freqMonths(c.freq);                                // месяцев в периоде платежа
  const termM = Math.max(1, c.term | 0);                         // срок, мес.
  const n = Math.max(1, Math.ceil(termM / mpp));                 // число ПЛАТЕЖЕЙ
  const i = (c.rate || 0) / 100 / 12 * mpp;                      // ставка за период
  const method = c.method || 'аннуитет';
  const gMainP = Math.ceil(Math.max(0, c.graceMain | 0) / mpp);       // льгота по ОД, периодов
  const gAccrP = Math.ceil(Math.max(0, c.graceAccrual | 0) / mpp);    // отсрочка начисления, периодов
  const gIntP  = Math.ceil(Math.max(0, c.graceInterest | 0) / mpp);   // льгота по %, периодов
  /* Шаг 18 (Q5): окно распределения отсроченных % — по умолчанию (0/0, как у всех
     59 демо-кредитов до этого шага) поведение не меняется — распределяем по ВСЕМ
     периодам после льготы, как раньше. Заданное окно [from,to] сужает распределение;
     непопавшее в окно копится и — как и раньше — гасится последним платежом (ниже). */
  const gIntDistFrom = (c.graceIntDistFrom | 0) > 0 ? (c.graceIntDistFrom | 0) : (gIntP + 1);
  const gIntDistTo   = (c.graceIntDistTo   | 0) > 0 ? (c.graceIntDistTo   | 0) : n;
  const holds = tranche.accrualHold || [];
  const within = (dt) => holds.some(h => h && h.from &&
    pd(h.from) <= dt && (!h.to || pd(h.to) >= dt));
  const start = pd(fromDate);
  /* Шаг 18 (Q1/Q2): день платежа (payDay) и привязка последнего платежа
     (lastPaymentAnchor) — по умолчанию (payDay=0, anchor='по дате выдачи') поведение
     совпадает с прежним: день — из даты освоения, даты — n периодов от неё же.
     «По дате 1-го платежа» считает от даты 1-го платежа (firstPay), а не от даты
     выдачи (Q2, разбор в шапке файла — из сверки с loan-program.html renderTab6). */
  const payDay = (c.payDay | 0) >= 1 && (c.payDay | 0) <= 31 ? (c.payDay | 0) : null;
  const anchorFirst = c.lastPaymentAnchor === 'по дате 1-го платежа';
  const firstPay = addM(start, mpp, payDay);
  const principalPeriods = Math.max(1, n - gMainP);              // периодов гашения ОД после льготы
  const annuity = (i > 0)
    ? P * i / (1 - Math.pow(1 + i, -principalPeriods))
    : P / principalPeriods;
  const diffPrincipal = P / principalPeriods;
  const rows = [];
  let bal = P, deferred = 0, deferredPer = 0;                    // deferred — отложенные проценты (graceInterest)
  let prevDate = start;
  for (let k = 1; k <= n; k++){
    const date = anchorFirst
      ? (k === 1 ? firstPay : addM(firstPay, (k - 1) * mpp, payDay))
      : addM(start, k * mpp, payDay);
    const noAccrual = within(date) || (k <= gAccrP) || i === 0;  // graceAccrual / пауза: не начисляем
    /* Шаг 19: реальные начисленные % считаются по дням (dayMethod), а не по номинальной
       ставке периода `i`. `i` остаётся структурной — ею размечается величина взноса
       (аннуитет/дифф.), как и раньше: платёж не «плавает» от длины месяца. Расхождение
       между `i`-долей и реальным `accrued` — обычная практика факт/365-аннуитета:
       тело взноса фиксировано формулой, начисленные % — по факту дней. */
    const db = dayBasis(dayMethod, date);
    const periodDays = db.numFin ? 30 * mpp : Math.max(0, dd(prevDate, date));
    const accrued = noAccrual ? 0 : round2(bal * (c.rate || 0) / 100 * periodDays / db.base);
    prevDate = date;
    let interest;
    if (k <= gIntP){ deferred = round2(deferred + accrued); interest = 0; }   // начислено, но не платится
    else if (k >= gIntDistFrom && k <= gIntDistTo){
      if (deferredPer === 0 && deferred > 0) deferredPer = round2(deferred / Math.max(1, gIntDistTo - gIntDistFrom + 1));
      const add = Math.min(deferredPer, deferred);
      deferred = round2(deferred - add);
      interest = round2(accrued + add);
    }
    else interest = accrued;                                          // вне окна распределения: копится, не гасится этим платежом
    let principal;
    if (k <= gMainP) principal = 0;                                          // льгота по ОД: только проценты
    else if (method === 'в конце срока') principal = (k === n ? round2(bal) : 0);
    else if (method === 'равными долями' || method === 'дифференцированный') principal = round2(diffPrincipal);
    else principal = round2(annuity - bal * i);                              // аннуитет: ОД = платёж − проценты
    if (k === n){
      principal = round2(bal);                                               // последний период гасит остаток
      if (deferred > 0){ interest = round2(interest + deferred); deferred = 0; }   // и остаток отложенных %
    }
    principal = Math.max(0, Math.min(principal, bal));
    bal = round2(bal - principal);
    rows.push({ no:k, date:fd(date), total:round2(principal + interest), principal, interest, accrued });
  }
  return { rows };
}

/* строки активной версии графика транша; если версии нет, но транш освоен —
   строим на лету от первой даты освоения (для scheduleTotals/fullRepayDate) */
function trancheScheduleRows(t){
  const active = (t.schedules || []).find(s => s.active);
  if (active && active.rows && active.rows.length) return active.rows;
  const disb = (t.disbursements || []).slice().sort((a,b) => pd(a.date) - pd(b.date))[0];
  return disb ? buildSchedule(t, disb.date).rows : [];
}

/* ключ позиции детального расчёта: транш + номер платежа */
function ledgerKey(trancheNo, no){ return 'T' + trancheNo + '#' + no; }

/* статус позиции графика на дату среза. Чистая функция от строки графика и её записи
   в детальном расчёте (entry может отсутствовать — тогда позиция ещё не наступила).
   Оплачена · Просрочена · Наступила (срок прошёл, погашения нет) · Предстоит */
function scheduleRowStatus(row, entry, asOf){
  if (pd(row.date) > pd(asOf || TODAY)) return 'Предстоит';
  if (!entry) return 'Наступила';
  if (entry.overdueTotal > 0.005) return 'Просрочена';
  return 'Оплачена';
}

/* ближайший НЕоплаченный платёж по всем траншам (шаг 11 — плитка шапки). Просроченная
   позиция тоже «ближайшая»: она первая по дате и требует действия раньше предстоящей. */
function nextPaymentOf(c, ledgerIndex, asOf){
  let best = null;
  for (const t of c.tranches){
    for (const r of trancheScheduleRows(t)){
      const st = scheduleRowStatus(r, ledgerIndex.get(ledgerKey(t.no, r.no)), asOf);
      if (st === 'Оплачена') continue;
      const ts = pd(r.date);
      if (!best || ts < best.ts) best = { ts, date:r.date, total:r.total, status:st, tranche:t.no };
    }
  }
  return best;
}

/* статус регистрации договора (шаг 11) — производный, отдельного поля нет: комплект
   реквизитов регистрации (№ + дата + скан) сверяется с гейтом Г-7 и ЖЦ. */
function regStatusOf(c){
  const r = c.reg || {};
  const full = !!(r.num && r.date && r.scan);
  if (c.lifecycle === 'Проект') return full ? { text:'готов к регистрации', tone:'info' }
                                            : { text:'черновик', tone:'neutral' };
  return full ? { text:'зарегистрирован', tone:'low' } : { text:'реквизиты неполны', tone:'high' };
}

/* ---- 3.2 Помощники derive (все чистые) ---- */

/* ---- ДЕТАЛЬНЫЙ РАСЧЁТ (ADR-0010) ----
   Строится, а не читается. Поля `ledger` в модели нет: начисленное выводится из активной
   версии графика транша и условий на дату, погашенное приходит зеркалом модуля платежей.

   Прежняя реализация складывала ОДНУ засеянную строку на транш (`latestLedger`) и
   называла это долгом. Отсюда К-1 с освоением 100 000 и остатком ноль, платёж
   «Подтверждён ЦК», не двигающий ничего, и дни просрочки, равные нулю по построению
   при 24 позициях графика (КР-7…КР-9). Это легаси-дефект E2E-09, воспроизведённый
   в модуле-владельце.

   paidPool — то, что модуль платежей засчитал на дату среза, в разрезе статей. */

/* ЗАЧИТЫВАЕТСЯ ЛИ ПЛАТЁЖ В ПОГАШЕНИЕ — правило владельца, и оно читает ДВЕ оси, а не одну.
   Прежняя редакция сверяла только сопоставление (`match === 'Подтверждён ЦК'`) и тем самым
   отбирала у шлюза его главное свойство: «платёж по шлюзу действует сразу, датой операции —
   уменьшает долг и останавливает начисление; не подтвердит ЦК — сторно с пересчётом»
   (спека платежей §4). Ждать подтверждения обязан ручной ввод и импорт, а не шлюз: у шлюза
   деньги УЖЕ ушли, и «окно ожидания зачисления» открыто именно для них (КР-44). */
function paymentCounts(p){
  if (!p) return false;
  switch (p.match){
    case 'Подтверждён ЦК': return true;
    case 'Восстановлен':   return true;   // позднее подтверждение ЦК — обратный каскад, долг падает
    case 'Сторно (таймаут)': return false; // сторно ≠ удаление: платёж виден, денег не несёт
    case 'Расхождение':    return true;   // запись ЦК есть, расходятся реквизиты (ОВ-ПЛ-1)
    case 'Ожидает ЦК':     return p.reg === 'Шлюз';
    default: return false;
  }
}

/* Валюта поступления — реквизит ПЛАТЕЖА, разнесение — всегда в валюте кредита: статьи
   долга выражены в ней, и пересчёт делает владелец, когда раскладывает сумму. Отсюда
   инвариант И-16: Σ layers = amount при совпадении валют и amount × rate при расхождении. */
function paymentCurrency(p, c){ return (p && p.currency) || (c && c.currency) || 'KGS'; }
function paymentAllocated(p){
  const L = (p && p.layers) || {};
  return round2((L.principal||0) + (L.interest||0) + (L.penalty||0) + (L.fees||0));
}

function paidPool(c, asOf){
  const lim = pd(asOf || TODAY);
  const pool = { principal:0, interest:0, penalty:0, fees:0 };
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    if (!paymentCounts(p)) continue;
    if (p.date && pd(p.date) > lim) continue;
    const L = p.layers || {};
    pool.principal += L.principal || 0; pool.interest += L.interest || 0;
    pool.penalty   += L.penalty   || 0; pool.fees     += L.fees     || 0;
  }
  for (const k in pool) pool[k] = round2(pool[k]);
  return pool;
}

/* ---- СПОРНАЯ ПЕНЯ (спека платежей §4.4) ----
   Сторно задним числом ретроспективно проваливает заёмщика в просрочку, но неподтверждение
   могло быть сбоем шлюза, банка или ЦК. Пеня периода «дата операции → дата отмены»
   ВЫЧИСЛЯЕТСЯ, но помечается спорной: не входит в требование, не двигает категорию риска,
   не блокирует гейт «Погашен». Считать сразу дешевле, чем строить цепочку начислений
   второй раз, если комиссия решит начислить.

   Разделение труда то же, что у обеспеченности: ПЕРИОД и статус приходят зеркалом
   (событие сторно — у платежей), СУММУ выводит кредит, потому что пеню считает он
   (ADR-0010). Сумма в зеркале — снимок владельца для его экрана, кредит её не читает. */
function disputeWindows(c){
  const out = [];
  for (const p of ((c.mirror && c.mirror.payments) || [])){
    const d = p.dispute;
    if (d && d.from && d.status === 'Ожидает решения комиссии') out.push({ from:d.from, to:d.to || null, pay:p.num });
  }
  return out;
}
/* дни отрезка [from,to], попавшие в окно спора */
function daysInWindows(fromDt, toDt, wins){
  let n = 0;
  for (const w of wins){
    const a = Math.max(fromDt, pd(w.from));
    const b = Math.min(toDt, w.to ? pd(w.to) : toDt);
    if (b > a) n += dd(a, b);
  }
  return n;
}

/* ---- СЛОЙ ДОЛГА ПО РЕШЕНИЮ СУДА (спека платежей §6) ----
   Приостановка начисления по решению суда — свойство ЧАСТИ долга («на сумму решения»), а
   не флаг на кредите: у одного кредита бывает несколько решений с РАЗНЫМИ режимами
   одновременно, и это норма. Режим определяется ДАТОЙ решения и прилипает к нему навсегда —
   поэтому таблица с датами вступления, а не константа в расчёте: появится новая норма,
   добавится строка.

   Граница с платежами по ADR-0010: НАЧИСЛЕНИЕ — у кредита (сырьё его), РАЗНЕСЕНИЕ платежа
   по слоям — у платежей (там матрица очередей и привязка к исполнительному листу). */
const ACCRUAL_MODES = [
  { from:'05.09.2025', interest:false, penalty:false,
    label:'проценты и пеня приостановлены на сумму решения (норма с 05.09.2025)' },
  { from:null,          interest:true,  penalty:false,
    label:'проценты идут, пеня приостановлена на сумму решения (норма до 05.09.2025)' }
];
function accrualModeOf(decisionDate){
  for (const m of ACCRUAL_MODES) if (!m.from || pd(decisionDate) >= pd(m.from)) return m;
  return ACCRUAL_MODES[ACCRUAL_MODES.length - 1];
}
/* Слои кредита на дату: решения суда из зеркала, несущие ПРИСУЖДЁННУЮ СУММУ. Решение без
   суммы (определение о возбуждении дела о банкротстве) слоя не образует — присуждать там
   нечего; последствия банкротства принадлежат взысканию (КР-33). */
function courtLayersOf(c, asOf){
  const lim = pd(asOf || TODAY);
  return ((c.mirror && c.mirror.court) || [])
    .filter(x => x && x.date && (x.amount || 0) > 0 && pd(x.date) <= lim)
    .map(x => ({ date:x.date, kind:x.kind, il:x.il || null, amount:x.amount || 0, mode:accrualModeOf(x.date) }))
    .sort((a,b) => pd(a.date) - pd(b.date));
}

/* buildLedger(credit, asOf) — позиции графика, НАСТУПИВШИЕ на дату среза, с разнесением
   подтверждённых погашений по очереди «раньше наступило — раньше гасится» и начислением
   пени на непокрытый остаток за дни просрочки. Возврат: {rows, index, pool, fees}. */
function buildLedger(c, asOf){
  /* Закрытый кредит начисление ОСТАНАВЛИВАЕТ: расчёт замирает на дате закрытия.
     Иначе списанный кредит с остатком продолжал бы копить пеню годами — у К-6б это
     давало 1032 дня просрочки и пеню, превышающую половину тела долга. */
  let lim = pd(asOf || TODAY);
  if (c.closure && c.closure.reason && c.closure.date && pd(c.closure.date) < lim) lim = pd(c.closure.date);
  const rows = [];
  for (const t of c.tranches){
    const cnd = conditionsAt(t, asOf || TODAY);           // Р-21: ставки пени — условия на дату
    for (const r of trancheScheduleRows(t)){
      if (pd(r.date) > lim) continue;                     // не наступила — это график, не расчёт
      rows.push({ key:ledgerKey(t.no, r.no), trancheNo:t.no, no:r.no, date:r.date,
        principalDue:r.principal || 0, interestDue:r.interest || 0,
        interestAccrued:(r.accrued == null ? r.interest : r.accrued) || 0,
        penaltyMain:cnd.penaltyMain || 0, penaltyInt:cnd.penaltyInt || 0 });
    }
  }
  rows.sort((a,b) => pd(a.date) - pd(b.date) || a.trancheNo - b.trancheNo || a.no - b.no);

  /* ДОЛЯ ДОЛГА ПОД РЕШЕНИЕМ СУДА. Слои несут присуждённые суммы; начисление на них
     приостановлено по режиму СВОЕГО решения. Кредит не ведёт слои отдельными остатками —
     сырья для этого у него нет (разнесение платежа по слоям принадлежит платежам), поэтому
     доля берётся пропорционально телу: Σ присуждённого к освоенному, не более единицы.
     Допущение Д-8: настоящий учёт ведётся по слоям в модуле-владельце. */
  const layers = courtLayersOf(c, fd(lim));
  const body = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
  const frozenShareAt = (dt) => {
    if (!layers.length || body <= 0) return { i:0, p:0 };
    let awardedI = 0, awardedP = 0;
    for (const L of layers){
      if (pd(L.date) > dt) continue;
      if (!L.mode.interest) awardedI += L.amount;
      if (!L.mode.penalty)  awardedP += L.amount;
    }
    return { i:Math.min(1, awardedI / body), p:Math.min(1, awardedP / body) };
  };
  const firstLayer = layers.length ? pd(layers[0].date) : null;
  const wins = disputeWindows(c);

  const pool = paidPool(c, fd(lim));                    // тот же горизонт, что и у начисления
  let pP = pool.principal, pI = pool.interest, pPen = pool.penalty;
  /* первый проход: гасим ОД и проценты по очереди наступления */
  for (const r of rows){
    /* проценты: часть, приходящаяся на присуждённую долю, приостановлена решением суда */
    const fs = frozenShareAt(pd(r.date));
    r.interestFrozen  = round2((r.interestDue || 0) * fs.i);
    r.interestCharged = round2((r.interestDue || 0) - r.interestFrozen);
    r.principalPaid = round2(Math.min(pP, r.principalDue));    pP = round2(pP - r.principalPaid);
    r.interestPaid  = round2(Math.min(pI, r.interestCharged)); pI = round2(pI - r.interestPaid);
    r.principalBal  = round2(r.principalDue  - r.principalPaid);
    r.interestBal   = round2(r.interestCharged - r.interestPaid);
    r.days          = Math.max(0, dd(pd(r.date), lim));
    const unpaid    = r.principalBal + r.interestBal;
    r.principalOverdue = unpaid > 0.005 ? r.principalBal : 0;
    r.interestOverdue  = unpaid > 0.005 ? r.interestBal  : 0;
    /* пеня — на непокрытый остаток за дни просрочки; при паузе начисления процентов
       пеня не затрагивается (Р-17), поэтому holds здесь не участвуют */
    const perDay = r.principalOverdue * (r.penaltyMain/100) + r.interestOverdue * (r.penaltyInt/100);
    r.penaltyAccrued = round2(perDay * r.days);
    /* пеня на присуждённую долю приостановлена ОБОИМИ режимами — но только за дни ПОСЛЕ
       решения: до него пеня начислялась по договору и решением не отменяется. Доля берётся
       на дату среза, а дни — от ПЕРВОГО решения: при нескольких решениях с разными датами
       это огрубление в пользу заёмщика и часть допущения Д-8 (точный учёт — по слоям, у
       владельца разнесения). */
    const daysAfterCourt = firstLayer ? Math.max(0, dd(Math.max(pd(r.date), firstLayer), lim)) : 0;
    r.penaltyFrozen  = round2(perDay * daysAfterCourt * frozenShareAt(lim).p);
    /* спорная пеня: дни отрезка просрочки, попавшие в окно сторно, ждущее комиссии */
    r.penaltyDisputed = round2(perDay * daysInWindows(pd(r.date), lim, wins));
    r.penaltyCharged  = round2(Math.max(0, r.penaltyAccrued - r.penaltyFrozen));
    /* к взысканию — то, что можно требовать сегодня: без приостановленного и без спорного */
    r.penaltyClaimable = round2(Math.max(0, r.penaltyCharged - r.penaltyDisputed));
  }
  /* второй проход: пеня гасится после основного долга и процентов */
  for (const r of rows){
    r.penaltyPaid = round2(Math.min(pPen, r.penaltyClaimable)); pPen = round2(pPen - r.penaltyPaid);
    r.penaltyBal  = round2(r.penaltyClaimable - r.penaltyPaid);
    r.received    = round2(r.principalPaid + r.interestPaid + r.penaltyPaid);
    r.totalPaid   = r.received;
    r.overdueTotal = round2(r.principalOverdue + r.interestOverdue + r.penaltyBal);
  }
  /* сборы и комиссии — ЧЕТВЁРТАЯ статья (ADR-0010): начисляются событием, не графиком */
  const feeRows = (c.fees || []).filter(f => f && f.date && pd(f.date) <= lim);
  let pF = pool.fees;
  for (const f of feeRows){
    f._paid = round2(Math.min(pF, f.amount || 0)); pF = round2(pF - f._paid);
    f._bal  = round2((f.amount || 0) - f._paid);
  }
  const index = new Map(rows.map(r => [r.key, r]));
  /* until — дата, ДО которой реально считали. У закрытого кредита она раньше даты среза,
     и это нужно подписывать: иначе «963 дня просрочки» у списанного кредита читается как
     «просрочка растёт сегодня», хотя расчёт остановлен в день закрытия.

     snapshot / provisional — дата снимка зеркала платежей и признак того, что начисление
     ушло дальше неё. Начисленное кредит выводит на любую дату, погашенное знает только до
     снимка; за хвост между ними пеня и дни просрочки посчитаны по платежам, которых
     владелец ещё не прислал. Величина от этого не становится неверной, но перестаёт быть
     окончательной, и это обязано быть подписано (КР-51). */
  const snap = (c.mirror && c.mirror.paymentsAsOf) || null;
  return { rows, index, pool, feeRows, layers, disputes:wins,
           until: fd(lim), stopped: fd(lim) !== (asOf || TODAY),
           snapshot: snap, provisional: !!(snap && pd(snap) < lim), provisionalFrom: snap };
}

/* debtOf — четыре статьи долга кредита (ADR-0004/ADR-0010), каждая в пяти величинах:
     accrued  — начислено к дате среза (по наступившим позициям графика);
     paid     — погашено (зеркало платежей);
     overdue  — ПРОСРОЧЕННАЯ часть: наступило и не погашено;
     term     — СРОЧНАЯ часть: ещё не наступила по сроку («Срочная часть» CONTEXT.md);
     bal      — остаток статьи = срочная + просроченная.
   Для основного долга остаток НЕ равен сумме непокрытых позиций: это освоенное минус
   погашенное, то есть тело кредита целиком. Смешение двух величин и есть причина, по
   которой прежняя модель показывала «остаток 0» у кредита с освоением 100 000 (КР-7).
   Пятая статья, расходы по обращению взыскания, — собственность взыскания: приходит
   зеркалом (mirror.collectionCosts) и в этот агрегат не входит. */
function debtOf(led, disbursed){
  const zero = () => ({ accrued:0, paid:0, overdue:0, term:0, bal:0 });
  const d = { principal:zero(), interest:zero(), penalty:zero(), fees:zero() };
  /* приостановленное решением суда и спорное — НАЧИСЛЕНО, но не требуется: в остаток,
     просрочку и гейт «Погашен» не входят и показываются отдельно */
  d.interest.frozen = 0; d.penalty.frozen = 0; d.penalty.disputed = 0;
  for (const r of led.rows){
    d.principal.accrued += r.principalDue;  d.principal.paid += r.principalPaid;
    d.principal.overdue += r.principalOverdue;
    d.interest.accrued  += r.interestCharged; d.interest.paid += r.interestPaid;
    d.interest.overdue  += r.interestOverdue; d.interest.frozen += r.interestFrozen || 0;
    d.penalty.accrued   += r.penaltyClaimable; d.penalty.paid  += r.penaltyPaid;
    d.penalty.overdue   += r.penaltyBal;
    d.penalty.frozen    += r.penaltyFrozen   || 0;
    d.penalty.disputed  += r.penaltyDisputed || 0;
  }
  for (const f of led.feeRows){
    d.fees.accrued += f.amount || 0; d.fees.paid += f._paid || 0;
    d.fees.overdue += f._bal || 0;
  }
  /* Погашено по статье — это ВЕСЬ подтверждённый пул, а не только разнесённое по
     наступившим позициям: платёж сверх графика гасит тело досрочно, и остаток обязан
     это увидеть. По позициям разнесение нужно для другого — определить, что просрочено. */
  d.principal.paid = round2(Math.min(led.pool.principal, disbursed || 0));
  d.interest.paid  = round2(Math.min(led.pool.interest, d.interest.accrued));
  d.penalty.paid   = round2(Math.min(led.pool.penalty,  d.penalty.accrued));
  d.fees.paid      = round2(Math.min(led.pool.fees,     d.fees.accrued));
  /* ПЕРЕПЛАТА. Срез `Math.min` не даёт отрицательного остатка — но раньше он же молча
     съедал разницу: у шести кредитов зеркало разносило в проценты больше, чем кредит
     начислил, и до 66 935 сомов исчезали между двумя строками (КР-48). Излишек — не
     погрешность, а величина со своей судьбой: по §7.2 спеки платежей он идёт ОБРАТНОЙ
     очередью (ОД → проценты → штрафы → возврат заёмщику), и правило это принадлежит
     платежам. Кредит его не разносит — он обязан его ПОКАЗАТЬ, иначе расхождение с
     владельцем выглядит как сойдясь. */
  d.overpay = { principal: round2(Math.max(0, led.pool.principal - (disbursed || 0))),
                interest:  round2(Math.max(0, led.pool.interest  - d.interest.accrued)),
                penalty:   round2(Math.max(0, led.pool.penalty   - d.penalty.accrued)),
                fees:      round2(Math.max(0, led.pool.fees      - d.fees.accrued)) };
  d.overpay.total = round2(d.overpay.principal + d.overpay.interest + d.overpay.penalty + d.overpay.fees);
  /* тело кредита: освоено − погашено. Срочная часть — то, что ещё не наступило по графику. */
  d.principal.bal  = round2(Math.max(0, (disbursed || 0) - d.principal.paid));
  d.principal.term = round2(Math.max(0, d.principal.bal - d.principal.overdue));
  for (const k of ['interest','penalty','fees']){
    d[k].bal  = round2(Math.max(0, d[k].accrued - d[k].paid));   // проценты/пеня/сборы начисляются, а не выдаются
    d[k].term = round2(Math.max(0, d[k].bal - d[k].overdue));
  }
  for (const k of ['principal','interest','penalty','fees'])
    for (const v of ['accrued','paid','overdue','term','bal','frozen','disputed'])
      if (d[k][v] != null) d[k][v] = round2(d[k][v]);
  return d;
}
const DEBT_ARTICLES = [
  { key:'principal', label:'Основной долг' }, { key:'interest', label:'Проценты' },
  { key:'penalty',   label:'Пеня' },          { key:'fees',     label:'Сборы и комиссии' }
];

/* дни просрочки и дата выхода на просрочку — производные от расчёта (ADR-0010):
   день, с которого есть неисполненное обязательство по графику. Отдельного поля нет.

   disputedDays — дни, попавшие в окно сторнированного платежа, ждущего комиссии. Сторно
   задним числом проваливает заёмщика в просрочку, а причиной мог быть сбой шлюза или ЦК;
   §4.4 спеки платежей поэтому запрещает спорному периоду двигать категорию риска. Дни
   остаются видимыми (просрочка есть — деньги не дошли), но в вход категории не идут. */
function overdueOf(led){
  let since = null, days = 0, disputedDays = 0;
  const lim = pd(led.until);
  for (const r of led.rows){
    if (r.overdueTotal <= 0.005) continue;
    if (!since || pd(r.date) < pd(since)){
      since = r.date; days = r.days;
      disputedDays = Math.min(days, daysInWindows(pd(r.date), lim, led.disputes || []));
    }
  }
  return { since, days, disputedDays, effectiveDays: Math.max(0, days - disputedDays) };
}

/* ---- ОБЕСПЕЧЕННОСТЬ (ADR-0011) ----
   Кредит правил обеспеченности НЕ ИМЕЕТ. Суммы (залоговая стоимость по классам
   ликвидности вида предмета, ликвидная часть, банковская гарантия) и ПОРОГИ (по составу,
   по гарантии, минимальная доля ликвида) приходят зеркалом из модуля залога — там живёт
   правило. Кредит владеет базой (сумма под риском — его собственная величина) и порогом
   по решению КМ (owned-поле kmDecision.coverPct, Прил.1 §2.6), и СОБИРАЕТ из них вердикт.

   Почему сборка здесь, а не у владельца. База принадлежит кредиту и дрейфует от платежей
   в третьем модуле; владелец правила может отдать только СНИМОК базы, и любое отношение,
   посчитанное на его стороне, устаревает раньше, чем доедет. Поэтому зеркало несёт
   величины и нормативы, а делит на живую базу кредит. Цена решения — формула сборки
   обязана совпадать с формулой владельца буква в букву; расхождение здесь неотличимо от
   расхождения данных (КР-38/КР-39: у гарантии был отобран её собственный порог, а вторая
   подпроверка §2.4 не собиралась вовсе — залог блокировал, кредит выдавал).

   Прежний computeCoverage был второй реализацией чужого правила: раскладывал предметы
   по ликвидности ДОГОВОРА, не знал coverPct и имел ветку «доля ликвида ≥80 %», которая
   возвращала те же 150 %, что и ветка «иначе» (КР-30, КР-35…КР-37). */
function atRiskAmountOf(c, debt, disbursed){
  return round2(Math.max(0, (debt.principal.bal || 0) + ((c.contractAmount || 0) - disbursed)));
}
function coverageOf(c, atRisk){
  const m = (c.mirror && c.mirror.coverage) || null;
  /* coverPct === 0 — законное значение: решение КМ может освободить от порога целиком
     (Прил.1 §2.6). Проверяем на null, а не на «истинность»: `km || reqBase` молча
     подменял бы нулевой порог общим. */
  const km = (c.kmDecision && c.kmDecision.coverPct != null) ? +c.kmDecision.coverPct : null;
  if (!(atRisk > 0))
    return { applicable:false, mirror:m, ok:true, req:km,
             source:'Сумма под риском нулевая — обеспеченность неприменима' };
  if (km === 0)
    return { applicable:true, mirror:m, ok:true, index:null, req:0, base:atRisk,
             reqFromKm:true, numerator: m ? round2((m.pledgeValue||0) + (m.bankGuarantee||0)) : 0,
             source:'Освобождение от порога обеспечения по решению КМ ' + (c.kmDecision.num || '') + ' (Прил.1 §2.6)' };
  if (!m)
    return { applicable:true, mirror:null, ok:false, index:null, req:km || null,
             source:'Модуль залога не подтвердил обеспеченность' };
  const numerator = round2((m.pledgeValue || 0) + (m.bankGuarantee || 0));
  const req = km || m.reqBase || 120;
  const ratio = round2(numerator / atRisk);
  /* ИНДЕКС — СУММА ДВУХ НОРМИРОВАННЫХ СЛАГАЕМЫХ, а не одна дробь: у залоговой стоимости
     свой порог (по составу либо по решению КМ), у банковской гарантии — свой (Прил.1 §2.3).
     Решение КМ перекрывает залоговый порог и НЕ трогает гарантийный: §2.6 говорит о
     требовании к обеспечению кредита, а норматив гарантии — о возвратности самой гарантии. */
  const idxPledge = (m.pledgeValue || 0) / (atRisk * (req / 100));
  const gReq  = (m.bankGuarantee || 0) > 0 ? (m.guaranteeReq || 100) : null;
  const idxGuar = gReq ? (m.bankGuarantee || 0) / (atRisk * (gReq / 100)) : 0;
  const index = round2(idxPledge + idxGuar);                 // 1,00 = порог выполнен (ADR-0007)
  /* ДОЛЯ ЛИКВИДА — вторая подпроверка того же гейта (Прил.1 §2.4): при пороге 150 %
     ликвидная часть залога должна покрывать ≥ 80 % ОБЯЗАТЕЛЬСТВА. База та же, что у
     индекса, — иначе две подпроверки одного гейта считаются от разных величин и
     расходятся по построению. Порог по решению КМ подменяет состав, поэтому подпроверка
     вместе с ним отключается: КМ назначил своё требование взамен §2.4. */
  const liqMin = m.liquidShareMin == null ? 80 : m.liquidShareMin;
  const liqApplies = req === 150 && m.liquidValue != null;
  const liqShare = liqApplies ? round2((m.liquidValue || 0) / atRisk) : null;
  const liqOk = liqApplies ? liqShare >= liqMin / 100 - 1e-9 : true;
  return { applicable:true, mirror:m, numerator, base:atRisk, ratio, req, index,
           idxPledge:round2(idxPledge), idxGuar:round2(idxGuar), gReq,
           ok: index >= 1 && liqOk, covOk: index >= 1,
           liqApplies, liqShare, liqOk, liqMin,
           reqFromKm: !!km, asOf: m.asOf,
           source: km ? ('Порог ' + km + ' % по решению КМ ' + (c.kmDecision.num || '') + ' (Прил.1 §2.6)')
                      : (m.source || '') };
}

/* ---- КАТЕГОРИЯ РИСКА (ADR-0012) ----
   Собственность кредита и производная кредита: worst-of «дни просрочки после применения
   послабления» × «уровни действующих факторов с решением комитета». Прежняя реализация
   объявляла её зеркалом ночного пересчёта и брала вторым входом «группу риска A/B/C/D»,
   которой нет ни в CONTEXT.md, ни в модуле заёмщика. */
const CAT_ORDER = ['низкий','средний','высокий'];
function daysToCat(d){ return d >= 181 ? 'высокий' : d >= 1 ? 'средний' : 'низкий'; }
function worstCat(a,b){ return CAT_ORDER[Math.max(CAT_ORDER.indexOf(a), CAT_ORDER.indexOf(b))]; }
function riskBasisOf(c, overdueDays, asOf, disputedDays){
  const rel = relief181(c, asOf);
  /* спорный период вычитается ДО послабления: это не послабление, а отсутствие вины —
     дни есть, но вменять их заёмщику нельзя, пока не решит комиссия (§4.4) */
  const net = Math.max(0, overdueDays - (disputedDays || 0));
  const eff = rel ? Math.min(net, 180) : net;                        // послабление снимает последствие
  const factors = factorsActive(c, asOf);
  const byFactors = factors.reduce((a,f) => worstCat(a, f.level || 'низкий'), 'низкий');
  const byDays = daysToCat(eff);
  return { eff, raw:overdueDays, disputed:(disputedDays || 0), net, relief:rel, byDays, factors, byFactors,
           category: worstCat(byDays, byFactors) };
}

/* ---- ПРИЗНАКИ СОСТОЯНИЯ КРЕДИТА (КВ-13) ----
   НЕ послабления: просрочка, взыскание, банкротство и пауза начисления ничего не
   снимают. Прежде и то и другое лежало в одной коллекции «оверлеев» — слове, которое
   CONTEXT.md запрещает в статье «Послабление» (КР-26). */
function buildStateFlags(c, overdueDays, asOf){
  const fl = [];
  if (overdueDays > 0) fl.push({ kind:'overdue', tone:'warn', text:`Просрочка ${overdueDays} дн.` });
  const r = c.mirror && c.mirror.restructuring && c.mirror.restructuring.active;
  if (r) fl.push({ kind:'restructuring', tone:'info', text:`Реструктуризация (${r.stage})` });
  for (const cl of ((c.mirror && c.mirror.claims) || [])){
    fl.push({ kind:'collection', tone:'danger', text:`Взыскание · ${cl.stage || cl.phase || '—'}` });
    if (/банкрот/i.test((cl.stage || '') + (cl.phase || '')))
      fl.push({ kind:'bankruptcy', tone:'danger', text:'Банкротство' });
  }
  if ((c.accrualHold || []).some(h => holdIsActive(h, asOf)))
    fl.push({ kind:'accrual-hold', tone:'info', text:'Начисление приостановлено' });
  /* приостановка по решению суда — ДРУГОЙ признак: она свойство части долга, а не периода,
     и режим у каждого решения свой (спека платежей §6.2) */
  for (const L of courtLayersOf(c, asOf))
    fl.push({ kind:'court-layer', tone:'info',
              text:`Решение суда от ${L.date} на ${money(L.amount)} — ${L.mode.label}` });
  if (disputeWindows(c).length)
    fl.push({ kind:'dispute', tone:'warn', text:'Спорная пеня на решении комиссии' });
  return fl;
}

/* дата последнего платежа активной версии графика (max по траншам) */
function maxFullRepayDate(c){
  let best = null;
  for (const t of c.tranches){
    const rows = trancheScheduleRows(t); if (!rows.length) continue;
    const dt = pd(rows[rows.length - 1].date);
    if (!best || dt > best) best = dt;
  }
  return best ? fd(best) : null;
}

/* неустойка за неполное освоение: недоосвоенный остаток транша × reserveRate за
   период от плановой даты. При reserveRate = 0 → {applies:false} (не 24 строки нулей). */
function computeReserve(c, asOf){
  const per = []; let totalBase = 0, totalAmount = 0, rate = 0;
  for (const t of c.tranches){
    const cnd = conditionsAt(t, asOf || TODAY);                       // Р-21
    const rr = cnd.reserveRate || 0;
    if (rr <= 0) continue;
    const base = (t.amount || 0) - disbursedSum(t);
    if (base <= 0 || !t.plannedDate) continue;
    const days = Math.max(0, dd(pd(t.plannedDate), pd(asOf || TODAY)));
    if (days <= 0) continue;
    /* Шаг 19/20: делитель раньше был захардкожен на 365 — теперь читает dayMethod
       того же комплекта условий (тот же параметр, что и график), а не своё
       отдельное допущение. */
    const amount = round2(base * (rr / 100) * (days / dayBasis(cnd.dayMethod, pd(asOf || TODAY)).base));
    rate = rr; totalBase += base; totalAmount += amount;
    per.push({ trancheId:t.id, base, rate:rr, days, amount });
  }
  if (!per.length) return { applies:false };
  return { applies:true, rate, totalBase, totalAmount:round2(totalAmount), perTranche:per };
}

/* итоги активной версии графика (консолидировано по траншам).
   regularPay — типовой платёж ПОЛНОГО периода: медиана по позициям, где гасится
   основной долг. Прежняя реализация брала первую строку каждого транша (КР-16), а при
   льготе по ОД первая строка несёт только проценты — «регулярный платёж» выходил
   занижен ровно там, где на него смотрят внимательнее всего. */
function computeScheduleTotals(c){
  let count = 0, principalSum = 0, interestSum = 0, total = 0;
  const regular = [];
  for (const t of c.tranches){
    const rows = trancheScheduleRows(t); if (!rows.length) continue;
    count += rows.length;
    for (const r of rows){ principalSum += r.principal; interestSum += r.interest; total += r.total; }
    const paying = rows.filter(r => (r.principal || 0) > 0);
    if (paying.length){
      const sorted = paying.map(r => r.total).sort((a,b) => a - b);
      regular.push(sorted[Math.floor(sorted.length / 2)]);      // медиана — устойчива к последнему платежу
    }
  }
  const regularPay = regular.reduce((a,x) => a + x, 0);
  return { count, principalSum:round2(principalSum), interestSum:round2(interestSum),
           regularPay:round2(regularPay), total:round2(total) };
}

/* активен ли транш (не soft-closed) — для агрегатов срока (Р-13) */
function activeTranche(t){ return !t.closed; }

/* ---- 3.3 derive(credit, asOf) — ВСЕ производные §4. Ничего не хранится в модели.
   asOf — ЕДИНАЯ дата среза карточки (КВ-10): одна на карточку целиком, ей подчиняются
   все выводимые величины. Деньги, пришедшие зеркалом (погашения, обеспеченность),
   ей не подчиняются — у них своя дата снимка, и она подписывается явно. ---- */
function derive(c, asOf){
  asOf = asOf || TODAY;
  const disbursed   = c.tranches.reduce((a,t) => a + disbursedSum(t), 0);
  const allocated   = c.tranches.reduce((a,t) => a + (t.amount || 0), 0);
  const undisbursed = c.contractAmount - disbursed;
  const allocatable = c.contractAmount - allocated;
  const disbState =
      (allocated === 0 && disbursed === 0) ? 'Не освоен'
    : (c.closure && undisbursed > 0 && c.closure.disbClosed) ? 'Освоение закрыто'
    : (disbursed === 0) ? 'Не освоен'
    : (disbursed < c.contractAmount) ? 'Частично освоен'
    : 'Полностью освоен';
  const ledger        = buildLedger(c, asOf);
  const debt          = debtOf(ledger, disbursed);
  const overdue       = overdueOf(ledger);
  const overdueDays   = overdue.days;
  const debtBalance   = round2(DEBT_ARTICLES.reduce((a,x) => a + debt[x.key].bal, 0));
  const overdueAmount = round2(DEBT_ARTICLES.reduce((a,x) => a + debt[x.key].overdue, 0));
  const atRisk        = atRiskAmountOf(c, debt, disbursed);          // сумма под риском (ADR-0011)
  const coverage      = coverageOf(c, atRisk);
  const riskBasis     = riskBasisOf(c, overdueDays, asOf, overdue.disputedDays);
  const riskCategory  = riskBasis.category;                          // единственный источник (ADR-0012)
  const stateFlags    = buildStateFlags(c, overdueDays, asOf);
  const relief        = reliefActive(c, asOf);
  const fullRepayDate = maxFullRepayDate(c);
  const termAgg       = Math.max(0, ...c.tranches.filter(activeTranche)
                            .map(t => conditionsAt(t, asOf).term || 0));   // Р-13 поверх Р-21
  const reserveAccrual = computeReserve(c, asOf);
  const scheduleTotals = computeScheduleTotals(c);
  const nextPayment    = nextPaymentOf(c, ledger.index, asOf);
  const regStatus      = regStatusOf(c);
  const docs           = docsStatusOf(c);
  /* подгруппа — ЗЕРКАЛО карточки заёмщика (ADR-0012), не расчёт кредита; группа —
     первая цифра подгруппы, как в модуле-владельце. */
  const mb = (c.mirror && c.mirror.borrower) || {};
  const subgroup = mb.subgroup || null;
  const debtBalanceKgs   = round2(toKgs(debtBalance, c.currency));
  const overdueAmountKgs = round2(toKgs(overdueAmount, c.currency));
  const collectionCosts  = round2((c.mirror && c.mirror.collectionCosts) || 0);   // 5-я статья, зеркало
  return { asOf, calcUntil:ledger.until, calcStopped:ledger.stopped,
           disbursed, undisbursed, allocated, allocatable, disbState,
           ledger, debt, overdue, overdueDays, overdueSince:overdue.since,
           atRisk, coverage, riskCategory, riskBasis, relief, stateFlags,
           fullRepayDate, termAgg, reserveAccrual, scheduleTotals, nextPayment, regStatus, docs,
           debtBalance, overdueAmount, debtBalanceKgs, overdueAmountKgs, collectionCosts,
           overpay:debt.overpay, courtLayers:ledger.layers, disputes:ledger.disputes,
           calcProvisional:ledger.provisional, paymentsAsOf:ledger.snapshot,
           subgroup, subgroupLabel:mb.subgroupLabel || null,
           group: subgroup ? String(subgroup)[0] : null };
}

/* ---- 3.4 Документы: обязательный комплект (Г-7, КР-11).
   Список обязательных ВИДОВ ведёт кредитная программа (PROGRAM_DOCS — зеркало
   loan-program.docCredReq). Прежняя проверка `(docs||[]).every(принят)` на пустом
   массиве давала true, поэтому у 57 кредитов из 59 гейт не мог сработать: он проверял
   «все имеющиеся приняты», а не «обязательный комплект собран». */
function docsStatusOf(credit){
  const req = programDocs(credit).req;
  const have = credit.docs || [];
  const rows = req.map(kind => {
    const doc = have.find(x => x.kind === kind) || null;
    return { kind, doc, ok: !!doc && DOC_STATES_CLOSING.includes(doc.state) };
  });
  const extra = have.filter(x => !req.includes(x.kind));
  const blocked = have.filter(x => x.state === 'отклонён' || x.state === 'просрочен');
  return { required:rows, missing:rows.filter(r => !r.ok).map(r => r.kind),
           extra, blocked, complete: rows.every(r => r.ok) && blocked.length === 0 };
}
function requiredDocsComplete(credit){ return docsStatusOf(credit).complete; }

/* ============================================================
   4. gate(credit, action, ctx) — единая точка блокировок Г-1…Г-16 (Task 3).
   Чистая функция: только чтение credit/ctx через derive(), никаких побочных
   эффектов. Г-10 — внутри addAgreement (Task 5). Г-17 — структурный запрет
   (нет кнопок «Удалить»), в gate() не участвует.
   ============================================================ */
function gate(credit, action, ctx = {}){
  const r = []; const d = credit ? derive(credit) : null;
  switch(action){
    case 'saveContractAmount':
      if (ctx.value > credit.approvedAmount) r.push('Сумма договора не может превышать одобренную ('+money(credit.approvedAmount)+')'); // Г-1
      break;
    case 'editContractRequisites':
      if (!ctx.num || !String(ctx.num).trim()) r.push('№ договора обязателен');
      if (!ctx.date) r.push('Дата договора обязательна');
      break;
    case 'createCredit':
      if (!ctx.application || ctx.application.approved!==true) r.push('Кредит создаётся только из одобренной заявки'); // Г-2
      else if (ctx.application.creditId) r.push('У заявки уже есть кредит');
      break;
    case 'addTranche':
      if (ctx.amount > d.allocatable) r.push('Σ сумм траншей не может превышать сумму договора (доступно '+money(d.allocatable)+')'); // Г-3
      break;
    case 'addDisbursement': {
      const t = credit.tranches.find(x=>x.no===ctx.trancheNo);
      if (!t) r.push('Транш не найден');                                // защита от неизвестного trancheNo (иначе gate проходит, а мутация падает на push в undefined)
      const already = t ? disbursedSum(t) : 0;
      if (t && t.closed) r.push('Транш закрыт ' + (t.closed.date || '') + ' — освоение по нему невозможно (Г-17)');
      if (t && ctx.amount + already > t.amount) r.push('Σ освоений транша не может превышать сумму транша'); // Г-4
      if (!['Зарегистрирован','Действует'].includes(credit.lifecycle)) r.push('Освоение возможно только при ЖЦ «Зарегистрирован» или «Действует»'); // Г-5
      if (credit.closure && credit.closure.disbClosed) r.push('Неосвоенный остаток закрыт ' + credit.closure.disbClosed.date + ' — освоение невозможно (Р-6)');
      /* Г-6 — обеспеченность (ADR-0011): индекс нормирован на порог, 1,00 = порог выполнен.
         Решение КМ больше не «отключает гейт»: оно устанавливает СВОЙ порог (coverPct),
         который уже учтён в coverage.req. Единственное исключение — waiver комиссии.
         У гейта ДВЕ подпроверки (Прил.1 §2.3–2.4) — индекс и доля ликвида, — и причину
         отказа надо называть ту, что сработала: иначе куратор доливает залог там, где
         нужно менять его состав. */
      if (!d.coverage.ok && !(credit.mirror && credit.mirror.pledgeWaiver))
        r.push(!d.coverage.mirror
          ? 'Обеспеченность не подтверждена модулем залога — нужен порог по решению КМ (Р-8) или waiver комиссии по залогу'
          : (d.coverage.covOk === false
             ? ('Обеспеченность ниже порога: индекс ' + Math.round((d.coverage.index || 0) * 100) + ' % при пороге 100 % (' + d.coverage.req + ' % к сумме под риском ' + money(d.coverage.base) + '). Нужен порог по решению КМ (Р-8) или waiver комиссии по залогу')
             : ('Доля ликвидного залога ' + Math.round((d.coverage.liqShare || 0) * 100) + ' % при минимуме ' + d.coverage.liqMin + ' % суммы под риском — в составе движимый неликвид (Прил.1 §2.4). Индекс при этом выполнен: нужен ликвидный предмет в составе, порог по решению КМ (Р-8) или waiver комиссии по залогу'))); // Г-6
      /* Шаг 18 (Q3): период между освоением и первым платежом — не условие транша
         (не переговорная величина), а лимит-коридор из программы (programDisbWindow,
         зеркало-заглушка). Первый платёж выводится из действующих условий на дату
         освоения — тех же payDay/freq, что использует buildSchedule. */
      if (t && ctx.date){
        const win = programDisbWindow(credit);
        const cnd = conditionsAt(t, ctx.date);
        const payDayW = (cnd.payDay | 0) >= 1 && (cnd.payDay | 0) <= 31 ? (cnd.payDay | 0) : null;
        const gap = dd(pd(ctx.date), addM(pd(ctx.date), freqMonths(cnd.freq), payDayW));
        if (gap < win.min) r.push('Промежуток до первого платежа ' + gap + ' дн. меньше минимума ' + win.min + ' дн. по программе (период между освоением и первым платежом)');
        if (gap > win.max) r.push('Промежуток до первого платежа ' + gap + ' дн. больше максимума ' + win.max + ' дн. по программе (период между освоением и первым платежом)');
      }
      break;
    }
    case 'closeDisbursement':                                            // Р-6: закрытие неосвоенного остатка
      if (d.undisbursed <= 0) r.push('Неосвоенного остатка нет — закрывать нечего');
      if (credit.closure && credit.closure.disbClosed) r.push('Неосвоенный остаток уже закрыт ' + credit.closure.disbClosed.date);
      if (!ctx.reason || !String(ctx.reason).trim()) r.push('Закрытие неосвоенного остатка требует основания');
      if (!['Зарегистрирован','Действует'].includes(credit.lifecycle)) r.push('Действие доступно при ЖЦ «Зарегистрирован» или «Действует»');
      break;
    case 'closeTranche': {                                               // Г-17: только soft-close с основанием
      const t = credit.tranches.find(x => x.no === ctx.trancheNo);
      if (!t) r.push('Транш не найден');
      else {
        if (t.closed) r.push('Транш уже закрыт ' + (t.closed.date || ''));
        if (disbursedSum(t) < (t.amount || 0) - 0.005 && !ctx.reason)
          r.push('Транш освоен не полностью — закрытие требует основания');
      }
      if (!ctx.reason || !String(ctx.reason).trim()) r.push('Закрытие транша требует основания (Г-17: удаления нет, только soft-close)');
      if (credit.tranches.filter(activeTranche).length <= 1) r.push('Нельзя закрыть последний активный транш кредита');
      break;
    }
    case 'waiver':                                                       // второй разблок Г-6 — waiver залоговой комиссии (Task 5)
      if (!ctx.reason || !String(ctx.reason).trim()) r.push('Waiver требует обоснования (протокол комиссии по залогу)');
      break;
    case 'addAgreement':                                                                    // Г-10
      if (!ctx.num || !ctx.date) r.push('Доп. соглашение требует номер и дату (Г-10)');
      break;
    case 'addConditionRecords': {                                          // Г-10 · Г-18 · Г-19 · Г-20 · Г-22
      if (!['Зарегистрирован','Действует'].includes(credit.lifecycle))
        r.push('Условия меняются только при ЖЦ «Зарегистрирован» или «Действует» (Г-22); в «Проекте» условия правятся напрямую, без доп. соглашения'); // Г-22
      const bs = ctx.basis || {}, meta = BASIS_KINDS[bs.kind];
      if (!meta) r.push('Основание обязательно: доп. соглашение · решение суда · постановление правительства');
      if (bs.kind === 'agreement' && (!bs.num || !bs.date))
        r.push('Доп. соглашение требует номер и дату (Г-10)');
      if (meta && !meta.owned && !bs.ref)
        r.push('Решение суда и постановление правительства указываются ссылкой на существующий документ (Г-10)');
      if (!ctx.records || !ctx.records.length) r.push('Не выбрано ни одного условия');
      for (const rec of (ctx.records || [])){
        if (!PARAM_KEYS.includes(rec.param)) r.push('Неизвестный параметр условия: ' + rec.param);
        if (!rec.trancheNos || !rec.trancheNos.length)
          r.push('Не выбран ни один транш для условия «' + paramLabel(rec.param) + '»');
        else for (const no of rec.trancheNos)
          if (!credit.tranches.some(t => t.no === no)) r.push('Транш №' + no + ' не найден');
        if (!rec.effectiveFrom){ r.push('Дата вступления в силу обязательна («' + paramLabel(rec.param) + '»)'); continue; }
        if (credit.date && pd(rec.effectiveFrom) < pd(credit.date))
          r.push('Дата вступления не может быть раньше даты договора ' + credit.date + ' (Г-18)');      // Г-18
        if (pd(rec.effectiveFrom) < pd(TODAY)){
          if (!meta || !meta.retro)
            r.push('Задним числом условия меняют только решение суда и постановление правительства (Г-19)'); // Г-19
          if (!rec.note || !String(rec.note).trim())
            r.push('Ретроспективное условие требует примечания: что пересчитывается (Г-20)');                // Г-20
        }
      }
      break;
    }
    case 'register': {                                                                     // Г-7
      if (credit.lifecycle !== 'Проект') r.push('Регистрация возможна только из ЖЦ «Проект» (сейчас «' + credit.lifecycle + '»)');
      if (!credit.num || !credit.date || !credit.reg.scan) r.push('Нужны номер, дата и скан договора');
      if (!credit.reg.num || !credit.reg.date) r.push('Нужны номер и дата регистрации');
      if (!d.docs.complete)
        r.push('Не собран обязательный комплект документов' +
          (d.docs.missing.length ? ': ' + d.docs.missing.join(' · ') : '') +
          (d.docs.blocked.length ? ' · отклонены/просрочены: ' + d.docs.blocked.map(x => x.kind).join(' · ') : ''));
      if (!d.coverage.ok && !(credit.mirror && credit.mirror.pledgeWaiver))
        r.push('Не пройден гейт обеспеченности (или исключение Г-6)');
      break;
    }
    case 'activate':                                                                       // Г-22: «Зарегистрирован» → «Действует»
      if (credit.lifecycle !== 'Зарегистрирован') r.push('Перевод в «Действует» возможен только из ЖЦ «Зарегистрирован» (сейчас «' + credit.lifecycle + '»)');
      if (d.disbursed <= 0) r.push('Кредит начинает действовать с первого освоения — освоений нет (Г-8/Г-22)');
      break;
    case 'buildSchedule':
      if (!ctx.tranche || ctx.tranche.disbursements.length===0) r.push('График строится только от фактической даты освоения транша'); // Г-8
      break;
    case 'editConditions':
      if (credit.lifecycle!=='Проект')
        r.push('Изменение условий — только зарегистрированным основанием: доп. соглашение · решение суда · постановление правительства'); // Г-9
      break;
    case 'savePayment':                                                                    // Г-11
      if (!(ctx.amount>0)) r.push('Сумма платежа должна быть > 0');
      if (ctx.dateAfterToday) r.push('Дата платежа не может быть в будущем');
      if (!ctx.trancheNo) r.push('Транш обязателен');
      break;
    case 'writeOff':
      if (!ctx.doc || !ctx.doc.kind || !ctx.doc.num || !ctx.doc.date) r.push('Списание — только с реквизитами решения (вид · номер · дата)'); // Г-12
      break;
    case 'linkPledge':
      if (!ctx.pledge || ctx.pledge.pledgorInn !== credit.borrower.inn) r.push('Привязка — только договоры того же ИНН заёмщика'); // Г-13
      break;
    case 'repay':                                                                          // Г-14
      /* Четыре статьи кредита (ADR-0010). Пятая — расходы по обращению взыскания —
         в проверку НЕ входит: кредит не может зависеть от чужих расходов в вопросе,
         погашен ли он (ADR-0004). Ненулевые расходы показываются отдельной строкой. */
      { const b = d.debt; const nonzero = DEBT_ARTICLES.filter(x => b[x.key].bal > 0.005);
        if (nonzero.length) r.push('«Погашен» — только при нулевом остатке по всем статьям; не закрыты: '
          + nonzero.map(x => x.label + ' ' + money(b[x.key].bal)).join(' · '));
        if ((credit.mirror.claims||[]).length) r.push('Есть действующие требования взыскания'); }
      break;
    case 'terminate':                                                                      // канон §3: третье основание закрытия
      if (!ctx.doc || !ctx.doc.kind || !ctx.doc.num || !ctx.doc.date)
        r.push('Расторжение — только с реквизитами соглашения или решения (вид · номер · дата)');
      if (!ctx.reason || !String(ctx.reason).trim()) r.push('Расторжение требует основания');
      if ((credit.mirror.claims||[]).length) r.push('Есть действующие требования взыскания — расторжение через взыскание');
      break;
    case 'holdAccrual':
      if (!ctx.reason || !ctx.doc || !ctx.from) r.push('Приостановление — только с основанием, документом и датой начала'); // Г-15
      break;
    case 'transferDebt':                                                                   // Г-16
      if (!ctx.agreement || !ctx.agreement.num || !ctx.agreement.date || !ctx.agreement.registered)
        r.push('Заёмщик не меняется без ЗАРЕГИСТРИРОВАННОГО соглашения: нужны номер, дата и отметка о регистрации');
      if (!ctx.newBorrower || !ctx.newBorrower.inn || !ctx.newBorrower.name)
        r.push('Нужен новый заёмщик: ИНН и наименование');
      if (ctx.newBorrower && ctx.newBorrower.inn === credit.borrower.inn)
        r.push('Новый заёмщик совпадает с текущим');
      if (!['Зарегистрирован','Действует'].includes(credit.lifecycle))
        r.push('Перевод долга возможен при ЖЦ «Зарегистрирован» или «Действует»');
      break;
    case 'editDocs':                                                                       // досье: загрузка и смена состояния
      if (!ctx.kind || !String(ctx.kind).trim()) r.push('Вид документа обязателен');
      if (ctx.state && !DOC_STATES.includes(ctx.state)) r.push('Недопустимое состояние документа: ' + ctx.state);
      break;
    case 'addNote':
      if (!ctx.text || !String(ctx.text).trim()) r.push('Пустое примечание не сохраняется');
      break;
    case 'targetUse':                                                                      // Р-15: целевое использование
      if (!ctx.kind) r.push('Вид записи обязателен: документ · проверка · мера');
      if (!ctx.date) r.push('Дата обязательна');
      if (ctx.kind === 'measure' && !ctx.committeeRef)
        r.push('Мера реагирования по нецелевому использованию — только со ссылкой на решение Комитета (Р-15)');
      break;
  }
  return { ok: r.length===0, reasons: r };
}

/* ---- 4.1 canRole(role, action) — матрица прав по ролям (§7). ---- */
const ROLE_ACTIONS = {
  'Кредитный специалист': new Set(['createCredit','saveContractAmount','register','activate','addTranche','addDisbursement','closeDisbursement','closeTranche','buildSchedule','addAgreement','addConditionRecords','editConditions','editDocs','addNote']),
  'Куратор': new Set(['targetUse','inspection','holdAccrual','transferDebt','linkPledge','addNote']),
  'Бухгалтер': new Set(['savePayment','addNote']),
  'Начальник отдела': new Set(['createCredit','saveContractAmount','editContractRequisites','register','activate','addTranche','addDisbursement','closeDisbursement','closeTranche','buildSchedule','addAgreement','addConditionRecords','editConditions','editDocs','addNote','targetUse','inspection','holdAccrual','transferDebt','linkPledge','savePayment','waiver','setKmDecision','writeOff','repay','terminate']),
  'Наблюдатель': new Set(),
};
function canRole(role, action){ return (ROLE_ACTIONS[role]||new Set()).has(action); }

/* ============================================================
   5. МУТАЦИИ — операции, меняющие состояние credit/tranche (Task 4+).
   Каждая мутация: gate() → если заблокирован, возвращает {ok:false,reasons} и НЕ
   трогает модель → если ok, применяет изменение → append-only запись в credit.audit
   (никаких физических удалений/перезаписей — Р-4/Г-17). Функции чистые относительно
   document (работают только с переданными объектами).
   ============================================================ */

/* версии графика транша (Р-4, Г-8): предыдущая активная версия ДЕМОТИРУЕТСЯ
   (active:false) и остаётся в массиве как архив — не перезаписывается и не удаляется.
   Возврат: при блоке — {ok:false,reasons:[...]} гейта; при успехе — новая версия
   {ver,active,generatedFrom,rows}. */
function generateSchedule(credit, trancheNo, params){
  const t = credit.tranches.find(x => x.no === trancheNo);
  const g = gate(credit, 'buildSchedule', { tranche: t });               // Г-8
  if (!g.ok) return g;
  const built = buildSchedule(t, params.from);
  t.schedules = t.schedules || [];
  const prevActive = t.schedules.find(s => s.active);
  if (prevActive) prevActive.active = false;                             // архив, не удаление (Р-4)
  const ver = t.schedules.reduce((m,s) => Math.max(m, s.ver || 0), 0) + 1;
  /* generatedAt — КОГДА версия построена (в отличие от generatedFrom — «от какой даты
     строим»). Нужен Д-5: плашка «график построен по прежним условиям» гаснет, когда
     активная версия свежее ретро-записи (см. retroPendingFlags). */
  const version = { ver, active:true, generatedFrom: params.from, generatedAt: TODAY,
                    generatedSeq: _crSeq, rows: built.rows };
  t.schedules.push(version);
  pushAudit(credit, `Сформирован график погашения v${ver} по траншу №${trancheNo} от ${params.from}`,
    prevActive || null, version);
  return version;
}

/* приостановка начисления процентов (Р-17, Г-15). Интервал живёт на credit.accrualHold
   (его читают derive/buildOverlays/риск-подавление 181-го дня — не трогать это поле) И
   зеркалируется на accrualHold КАЖДОГО транша кредита, потому что buildSchedule(tranche,
   fromDate) получает только транш, без ссылки на кредит. Пеня при паузе продолжает
   начисляться (within() внутри buildSchedule обнуляет только interest). */
function holdAccrual(credit, ctx){
  const g = gate(credit, 'holdAccrual', ctx);                            // Г-15
  if (!g.ok) return g;
  const hold = { from: ctx.from, to: ctx.to || null, reason: ctx.reason, doc: ctx.doc, by: ctx.by || '' };
  credit.accrualHold.push(hold);
  for (const t of credit.tranches){ t.accrualHold = t.accrualHold || []; t.accrualHold.push(hold); }
  pushAudit(credit, `Приостановлено начисление процентов ${ctx.from}–${ctx.to || '…'} (${ctx.reason})`,
    null, hold);
  return g;
}

/* Текущая роль пользователя — источник audit.who. Живёт как обычная переменная
   области видимости <script>, а НЕ на window.CR/document, чтобы быть доступной
   и в браузере, и в смоук-песочнице node:vm (там window — вложенный объект
   sandbox, а не globalThis, поэтому даже window.CR.* небезопасно читать из
   верхнеуровневого/чистого кода — см. переключение роли ниже, оно живёт
   только в DOM-блоке и на bare-CR вне браузера не полагается). */
let currentRole = 'Кредитный специалист';

/* Единая точка записи в append-only журнал (§0.5, Г-17): запись ЗАМОРОЖЕНА —
   Object.freeze — и никогда не редактируется/не удаляется. Нет CR.deleteAudit.
   seq — сквозной счётчик (КР-17): даты в макете без времени, и две записи одного дня
   были неотличимы по порядку. Для версий графика счётчик уже вводился (generatedSeq);
   журналу он нужен по той же причине — иначе «что было раньше» не восстановить.
   who — роль, а не сотрудник: сотрудников в макете нет (модуль сотрудников, Р-9), и
   подставлять туда имя было бы выдумкой; в системе здесь будет учётная запись. */
let _auditSeq = 0;
function pushAudit(credit, what, before, after){
  const entry = Object.freeze({ seq: ++_auditSeq, when: TODAY, who: currentRole, what, before, after });
  credit.audit.push(entry);
  return entry;
}

/* saveContractAmount(credit, value) — Г-1: сумма договора ≤ одобренной (Р-12). */
function saveContractAmount(credit, value){
  const g = gate(credit, 'saveContractAmount', { value });               // Г-1
  if (!g.ok) return g;
  const before = credit.contractAmount;
  credit.contractAmount = value;
  pushAudit(credit, 'saveContractAmount', before, value);
  return g;
}

/* editContractRequisites(credit, {num,date}) — правка № и даты договора; доступно
   только роли «Начальник отдела» (ROLE_ACTIONS), т.к. это паспортные поля договора,
   не оперативные. */
function editContractRequisites(credit, ctx){
  const g = gate(credit, 'editContractRequisites', ctx);
  if (!g.ok) return g;
  const before = { num: credit.num, date: credit.date };
  credit.num = ctx.num;
  credit.date = ctx.date;
  pushAudit(credit, 'editContractRequisites', before, ctx);
  return g;
}

/* addTranche(credit, {amount,plannedDate,subject}) — Г-3: Σ траншей ≤ суммы договора.
   Условия транша наследуются от базовых условий кредита: baseConditions — шаблон
   наследования, копируется в первичные записи транша (Р-21/Д-3, mkPrimaryRecords). */
function addTranche(credit, ctx){
  const g = gate(credit, 'addTranche', { amount: ctx.amount });          // Г-3
  if (!g.ok) return g;
  const no = credit.tranches.reduce((m,t) => Math.max(m, t.no || 0), 0) + 1;
  const t = mkTranche({
    id: credit.id + '-T' + no, no,
    subject: ctx.subject || { inn: credit.borrower.inn, name: credit.borrower.name },
    amount: ctx.amount, plannedDate: ctx.plannedDate || ''
  });
  t.conditionRecords = mkPrimaryRecords(credit);
  credit.tranches.push(t);
  pushAudit(credit, 'addTranche', null, t);
  return g;
}

/* addDisbursement(credit, {trancheNo,amount,order,purpose,doc}) — Г-4 (сумма транша) ·
   Г-5 (ЖЦ) · Г-6 (покрытие/КМ/waiver), все три проверяет единый gate('addDisbursement'). */
function addDisbursement(credit, ctx){
  const g = gate(credit, 'addDisbursement', { trancheNo: ctx.trancheNo, amount: ctx.amount, date: ctx.date }); // Г-4/Г-5/Г-6
  if (!g.ok) return g;
  const t = credit.tranches.find(x => x.no === ctx.trancheNo);
  const before = (t.disbursements || []).slice();
  const rec = { date: ctx.date || TODAY, amount: ctx.amount, order: ctx.order || '', purpose: ctx.purpose || '', doc: ctx.doc || '' };
  t.disbursements.push(rec);
  pushAudit(credit, 'addDisbursement', before, rec);
  return g;
}

/* ---- ПЕРЕХОД ЖИЗНЕННОГО ЦИКЛА (КВ-11, КР-1) ----
   До этой волны lifecycle менялся ровно в одном месте — closeCredit → «Закрыт».
   gate('register') был написан, право `register` стояло у двух ролей, но кнопки не
   существовало и мутации тоже: четыре кредита демо были заперты в «Проекте», семь —
   в «Зарегистрирован» без выхода в «Действует». Гейт, который нечем вызвать, не гейт.

   Порядок: Проект --register--> Зарегистрирован --activate--> Действует --close--> Закрыт.
   Обратного хода нет: ошибочная регистрация исправляется не откатом ЖЦ, а расторжением. */
function registerCredit(credit, ctx){
  const g = gate(credit, 'register', ctx || {});                        // Г-7
  if (!g.ok) return g;
  const before = credit.lifecycle;
  credit.lifecycle = 'Зарегистрирован';
  if (ctx && ctx.regNum)  credit.reg.num  = ctx.regNum;
  if (ctx && ctx.regDate) credit.reg.date = ctx.regDate;
  pushAudit(credit, 'registerCredit: ЖЦ «' + before + '» → «Зарегистрирован»', before, credit.lifecycle);
  return g;
}
/* activate — Г-22: кредит начинает действовать с первого освоения. Не декоративный
   переход: с «Действует» связаны Г-5 (освоение), Г-9/Г-22 (изменение условий). */
function activateCredit(credit){
  const g = gate(credit, 'activate', {});
  if (!g.ok) return g;
  const before = credit.lifecycle;
  credit.lifecycle = 'Действует';
  pushAudit(credit, 'activateCredit: ЖЦ «' + before + '» → «Действует»', before, credit.lifecycle);
  return g;
}

/* closeDisbursement — Р-6: закрытие неосвоенного остатка. Owned кредитом; до этой волны
   кнопка была заглушкой, из-за чего состояние disbState «Освоение закрыто» было
   недостижимо, а closure.disbClosed не писал никто (КР-2). */
function closeDisbursement(credit, ctx){
  const g = gate(credit, 'closeDisbursement', ctx || {});
  if (!g.ok) return g;
  const d = derive(credit);
  const rec = { date: TODAY, amount: round2(d.undisbursed), reason: ctx.reason, doc: ctx.doc || '', by: currentRole };
  /* closure несёт и терминал кредита, и закрытие освоения — это разные вещи: кредит
     продолжает действовать, закрыт только неосвоенный остаток. Поэтому пишем в
     подполе, а не в closure целиком (иначе isTerminal счёл бы кредит закрытым). */
  credit.closure = Object.assign({}, credit.closure || {}, { disbClosed: rec });
  pushAudit(credit, 'closeDisbursement: закрыт неосвоенный остаток ' + money(rec.amount), null, rec);
  return g;
}

/* closeTranche — Г-17: soft-close с основанием. Физического удаления траншей нет и не
   будет; закрытый транш выпадает из агрегатов срока и условий (activeTranche), но
   остаётся в истории вместе со своими освоениями и графиком. */
function closeTranche(credit, ctx){
  const g = gate(credit, 'closeTranche', ctx || {});
  if (!g.ok) return g;
  const t = credit.tranches.find(x => x.no === ctx.trancheNo);
  const rec = { date: ctx.date || TODAY, reason: ctx.reason, by: currentRole };
  t.closed = rec;
  pushAudit(credit, 'closeTranche: транш №' + t.no + ' закрыт (' + ctx.reason + ')', null, rec);
  return g;
}

/* transferDebt — Г-16: смена заёмщика зарегистрированным соглашением. Owned действие
   кредита; прежняя кнопка была заглушкой и тост уверял, что действие «открывается в
   модуле-владельце» — владелец и есть кредит (КР-2). Перевод не переписывает историю:
   прежний заёмщик уходит в запись перевода, а сама запись — в append-only журнал. */
function transferDebt(credit, ctx){
  const g = gate(credit, 'transferDebt', ctx || {});                    // Г-16
  if (!g.ok) return g;
  const from = Object.assign({}, credit.borrower);
  const rec = { date: ctx.date || TODAY, from, newBorrower: ctx.newBorrower,
                agreement: ctx.agreement, by: currentRole };
  credit.debtTransfer = rec;
  credit.borrower = Object.assign({}, credit.borrower, ctx.newBorrower);
  if (!credit.agreements.some(a => a.num === ctx.agreement.num))
    credit.agreements.push({ num:ctx.agreement.num, date:ctx.agreement.date,
                             source:'перевод долга', scan:ctx.agreement.scan || '' });
  pushAudit(credit, 'transferDebt: заёмщик «' + from.name + '» → «' + ctx.newBorrower.name
    + '» по соглашению ' + ctx.agreement.num, from, rec);
  return g;
}

/* saveDoc — досье: загрузка документа и смена его состояния (право editDocs, которое
   стояло в матрице ролей, но не спрашивалось ни одной кнопкой — КР-4). Документ того же
   вида не дублируется: повторное сохранение обновляет состояние и файл. */
function saveDoc(credit, ctx){
  const g = gate(credit, 'editDocs', ctx || {});
  if (!g.ok) return g;
  const before = (credit.docs || []).find(x => x.kind === ctx.kind) || null;
  const after = { kind: ctx.kind, name: ctx.name || ctx.kind, state: ctx.state || 'загружен',
                  date: ctx.date || TODAY, file: ctx.file || '', note: ctx.note || '' };
  if (before) Object.assign(before, after); else credit.docs.push(after);
  pushAudit(credit, 'saveDoc: «' + after.kind + '» — состояние «' + after.state + '»', before && Object.assign({}, before), after);
  return g;
}

/* addNote — человеческое примечание. Кнопка вызывала roleBtn('addNote'), но действия
   addNote в матрице ролей не было вовсе, поэтому она была мертва под ВСЕМИ ролями,
   включая «Начальника отдела» (КР-2). Примечания редактируемы — в отличие от журнала. */
function addNote(credit, ctx){
  const g = gate(credit, 'addNote', ctx || {});
  if (!g.ok) return g;
  const rec = { type: ctx.type || 'Обычное', author: (ctx.author || currentRole) + ' · ' + TODAY, text: ctx.text };
  credit.notes.push(rec);
  pushAudit(credit, 'addNote: ' + rec.type, null, rec);
  return g;
}

/* addTargetUse — целевое использование (Р-15): подтверждающие документы, проверки и меры
   реагирования. Мера требует ссылки на решение Комитета — то же правило, что у факторов
   категории (ADR-0012): последствие не наступает без документа-основания. */
function addTargetUse(credit, ctx){
  const g = gate(credit, 'targetUse', ctx || {});
  if (!g.ok) return g;
  credit.targetUse = credit.targetUse || { docs:[], checks:[], measures:[], committeeDecision:null };
  const rec = { date: ctx.date, title: ctx.title || '', result: ctx.result || '',
                file: ctx.file || '', committeeRef: ctx.committeeRef || '', by: currentRole };
  const bucket = ctx.kind === 'check' ? 'checks' : ctx.kind === 'measure' ? 'measures' : 'docs';
  credit.targetUse[bucket].push(rec);
  if (ctx.kind === 'measure' && ctx.committeeRef)
    credit.targetUse.committeeDecision = { num: ctx.committeeRef, date: ctx.date };
  pushAudit(credit, 'addTargetUse: ' + bucket + ' — ' + (ctx.title || ctx.kind), null, rec);
  return g;
}

/* setKmDecision(credit, {kind,num,date,scan}) — реквизиты решения КМ об освобождении
   от залога (Р-8, П1 §2.6). Собственного блокирующего гейта нет: сама фиксация — это
   разблокирующее событие для Г-6/Г-7 (gate('addDisbursement'|'register') читает
   credit.kmDecision напрямую). */
function setKmDecision(credit, ctx){
  const g = gate(credit, 'setKmDecision', ctx);
  if (!g.ok) return g;
  const before = credit.kmDecision;
  /* coverPct — порог обеспеченности по решению (ADR-0011): решение освобождает не от
     обеспечения, а от ОБЩЕГО порога, устанавливая свой. Это поле читает и модуль залога. */
  const after = { kind: ctx.kind, num: ctx.num, date: ctx.date, scan: ctx.scan,
                  coverPct: (ctx.coverPct == null || ctx.coverPct === '') ? null : +ctx.coverPct };
  credit.kmDecision = after;
  pushAudit(credit, 'setKmDecision', before, after);
  return g;
}

/* saveWaiver(credit, {reason}) — второй разблок Г-6/Г-7: waiver залоговой комиссии
   (альтернатива решению КМ). Пустое обоснование не сохраняется (case 'waiver' в gate). */
function saveWaiver(credit, ctx){
  const g = gate(credit, 'waiver', ctx);
  if (!g.ok) return g;
  const before = credit.mirror.pledgeWaiver || null;
  const after = { reason: ctx.reason, when: TODAY };
  credit.mirror.pledgeWaiver = after;
  pushAudit(credit, 'saveWaiver', before, after);
  return g;
}

/* addPayment(credit, {amount,date,trancheNo}) — Г-11 (savePayment). Р-5: ручной ввод —
   это ВЫЗОВ ФОРМЫ МОДУЛЯ-ВЛАДЕЛЬЦА: платёж повисает «Ожидает ЦК» и остатки не двигает.
   Ждёт подтверждения именно РУЧНОЙ ВВОД: основанием ему служит список ЦК, и до сверки
   денег могло не быть вовсе. Платёж по шлюзу ведёт себя наоборот — деньги уже ушли, и он
   двигает долг сразу (paymentCounts). Разнесение по статьям приходит с подтверждением —
   кредит его не выдумывает (матрица очередей у платежей). */
function addPayment(credit, ctx){
  const dateAfterToday = ctx.date ? pd(ctx.date) > pd(TODAY) : false;
  const g = gate(credit, 'savePayment', { amount: ctx.amount, dateAfterToday, trancheNo: ctx.trancheNo }); // Г-11
  if (!g.ok) return g;
  const num = (credit.mirror.payments.length || 0) + 1;
  const rec = { num, date: ctx.date, bindDate: TODAY, amount: ctx.amount, tranche: ctx.trancheNo,
    currency: credit.currency || 'KGS', rate: null, dispute: null,
    reg:'Ручной ввод', match:'Ожидает ЦК', frozen:false, method: ctx.method || 'денежными средствами', layers:{} };
  credit.mirror.payments.push(rec);
  pushAudit(credit, 'addPayment', null, rec);
  return g;
}

/* paymentEditable(credit, payment) — чистый предикат (Р-5): платёж, за которым стоит
   подтверждение ЦК, из кредита не правится ни при какой роли. Восстановленный платёж —
   тоже подтверждённый, просто позже; сторнированный правке не подлежит по другой причине
   (его лечат не правкой, а новым платежом — §8.3 спеки платежей). */
function paymentEditable(credit, p){
  const m = p && p.match;
  return !(m === 'Подтверждён ЦК' || m === 'Восстановлен' || m === 'Сторно (таймаут)');
}

/* addAgreement(credit, {num,date,source,scan}) — Г-10: регистрирует ДОКУМЕНТ-ДС.
   Значения условий документом больше не переносятся: их несут записи (Р-21),
   которые пишет addConditionRecords. Историю версий заменяет журнал basisGroups.
   UI-точки входа у функции НЕТ и она сознательно не вызывается из addConditionRecords
   (тот регистрирует ДС инлайном вместе с записями — одно действие = один документ).
   Остаётся спецификационной точкой входа «зарегистрировать ДС, не меняя условий»
   (её продукт — строка хвоста журнала «Документы без изменения условий», в демо
   сидируется К-4/ДС-РС-1005) и покрыта смоуком #13. */
function addAgreement(credit, ctx){
  const g = gate(credit, 'addAgreement', ctx);                          // Г-10
  if (!g.ok) return g;
  const doc = { num:ctx.num, date:ctx.date, source:ctx.source || 'кредит', scan:ctx.scan || '' };
  credit.agreements.push(doc);
  pushAudit(credit, 'addAgreement', null, doc);
  return { ok:true, value:doc };
}

/* addConditionRecords(credit, ctx) — Р-21: единственный способ изменить условия
   после регистрации. Одно действие = один документ-основание = N×M записей
   (N траншей × M параметров). Записи не удаляются и не «архивируются»: отмена —
   новая запись с прежним значением (Г-21). ДС при первом упоминании попадает
   в реестр документов credit.agreements. */
function addConditionRecords(credit, ctx){
  const g = gate(credit, 'addConditionRecords', ctx);            // Г-10 · Г-18 · Г-19 · Г-20 · Г-22
  if (!g.ok) return g;
  const bs = ctx.basis;
  const basis = { kind:bs.kind, ref:bs.ref || bs.num || '', date:bs.date || '',
                  label:bs.label || (BASIS_KINDS[bs.kind].label + ' ' + (bs.ref || bs.num || '')) };
  if (bs.kind === 'agreement' && !credit.agreements.some(a => a.num === bs.num))
    credit.agreements.push({ num:bs.num, date:bs.date, source:bs.source || 'кредит', scan:bs.scan || '' });
  let added = 0;
  for (const rec of ctx.records){
    for (const no of rec.trancheNos){
      const t = credit.tranches.find(x => x.no === no);          // гейт уже проверил, что номер резолвится
      const row = mkConditionRecord({ param:rec.param, value:rec.value,
        effectiveFrom:rec.effectiveFrom, basis, note:rec.note || '' });
      t.conditionRecords.push(row);
      pushAudit(credit, 'conditionRecord', null, row);
      added++;
    }
  }
  return { ok:true, value:{ added } };
}
