     Причина. У пятилетнего графика в таблице до 60 позиций подряд, и годовая нагрузка
       читалась только сложением строк глазами: плитки шапки дают итог по ВСЕМУ графику,
       строка — по ОДНОЙ дате, а между ними ничего не было. Из 59 демо-кредитов 29 —
       многолетние (24 из них на три года), то есть случай не краевой.
     СДЕЛАНО: в таблице «График — позиции» перед первой позицией каждого года стоит
       СТРОКА ГОДА — обычная строка таблицы, а не подпись на всю ширину: итоги стоят
       ПОД СВОИМИ колонками (Σ ОД под «Осн. сумма», Σ проценты под «Проценты в платеже»,
       Σ к погашению под «Платёж»), поэтому год и позиция сравниваются взглядом по
       вертикали, без чтения слитной подписи. В первой ячейке — год, пилюля «текущий»
       и число платежей, в колонке статуса — состав года (погашено · просрочено ·
       наступило · предстоит), просроченное красным. Год ВЫВОДИТСЯ из даты позиции —
       поля в модели нет; позиции и так отсортированы по дате (в слитом виде — по дате,
       затем по траншу), поэтому годы идут сплошными отрезками и группа получается сама.
       Работает в обеих областях: «по кредиту» группирует слитую таблицу всех траншей.
     РАЗВЁРНУТ ТОЛЬКО ТЕКУЩИЙ ГОД (тот, куда попала дата среза), прочие стоят одной
       итоговой строкой и раскрываются кликом по строке года; в тулбаре — «Развернуть
       все годы»/«Свернуть все годы». Вкладка отвечает на вопрос «что платим в этом году
       и сколько должны за остальные», и шестьдесят строк подряд этот ответ топят, а
       деталь остаётся на расстоянии одного нажатия. Состояние — grafikOpenYears (Set) +
       grafikYearsKey (кредит|область|годы): пустой набор это законное «свернуть всё»,
       умолчание возвращает только СМЕНА набора годов. Текущего года в графике может не
       быть вовсе (кредит выдан позже или давно закрыт) — тогда раскрывается ближайший
       следующий, а если весь график в прошлом — последний: свёрнутое целиком читалось бы
       как «позиций нет».
     ОДНОЛЕТНИЙ ГРАФИК строк года не получает вовсе — они дословно повторили бы плитки
       шапки (Σ ОД, Σ проценты, итого), а одна и та же цифра в двух местах читается как
       две разные величины; и сворачивать там нечего — год ровно один.
     НЕ ДЕЛАЛОСЬ: «Прогноз» и детальный расчёт «Расчётов» не тронуты — там предмет иной
       (ожидание и факт против контракта), и группировка по годам им не заказывалась.

       начисление раскладывается точно: %(факт) = %(контракт) + %(отклонение тела на начало

        вопрос «двигает ли он остаток» решается ДВУМЯ: подтверждённый и восстановленный
        двигают, сторнированный не двигает и остаётся виден (сторно ≠ удаление),
        ожидающий двигает ТОЛЬКО из шлюза — деньги уже ушли, и §4 спеки платежей
        засчитывает их датой операции. Прежняя редакция читала одну ось и отбирала у
        шлюза его главное свойство.
        СПОРНАЯ ПЕНЯ: после сторно пеня периода вычисляется, но в требование не входит,
        категорию не двигает и гейт «Погашен» не блокирует, пока не решит комиссия.
        Период приходит зеркалом (событие — у платежей), сумму выводит кредит (пеню
        считает он) — то же разделение, что у обеспеченности.
        ПЕРЕПЛАТА не съедается срезом: излишек над начисленным показывается статьёй.
        Обратная очередь (ОД → проценты → штрафы → возврат заёмщику) — правило платежей.
   Р-28 СЛОЙ ДОЛГА ПОД РЕШЕНИЕМ СУДА (27.07.2026, этап 4, КР-47, ADR-0013).
        Приостановка начисления по решению суда — свойство ЧАСТИ долга («на сумму
        решения»), а не флаг на кредите: у одного кредита бывает несколько решений с
        РАЗНЫМИ режимами одновременно, и это норма. Режим определяется ДАТОЙ решения и
        прилипает к нему навсегда (таблица ACCRUAL_MODES с датами вступления: до
        05.09.2025 — проценты идут, пеня стоит; с 05.09.2025 — стоят оба). Начисление
        по слоям — у кредита (сырьё его), разнесение платежа по слоям — у платежей.
        Решение без присуждённой суммы (определение о банкротстве) слоя не образует.
   Р-29 ПЛАН · ПРОГНОЗ · ИСПОЛНЕНИЕ ПЛАНА (01.08.2026, ADR-0042, CONTEXT.md).
        Три ориентира на будущее, и они НЕ ссылаются друг на друга. График — контракт
        транша. Прогноз — ожидание ПО ЭТОМУ КОНТРАКТУ (ADR-0104): даты позиций и гасимое
        в них ТЕЛО договорные, а сумма взноса считается от ФАКТИЧЕСКОГО остатка ОД —
        проценты идут на непогашенное тело (ADR-0105/0108), поэтому просрочка поднимает
        взнос, а досрочка удешевляет его и сокращает срок; живёт на вкладке «Прогноз». План — цель
        на месяц по кредиту целиком: ЕДИНСТВЕННАЯ вводимая величина среди трёх и явное
        исключение из ADR-0001. Заводится не с нуля — предзаполняется прогнозом, но
        после сохранения от него не зависит: иначе % исполнения плавал бы от досрочного
        погашения по чужому траншу, хотя ни план, ни факт месяца не менялись. Правка —
        только вручную, задним числом тоже, и всегда со следом (кто, когда, прежнее
        значение). Снятие плана — не удаление (И-14): amount:null, строка остаётся.
        Исполнение = факт месяца / план месяца, все четыре статьи долга, расходы
        взыскания не входят; месяц без плана выпадает целиком — из строки, из квартала
        и из года.

   Р-31 ОЧЕРЕДЬ ПОГАШЕНИЯ ПУБЛИКУЕТСЯ КРЕДИТОМ (10.08.2026, КВ-18, ADR-0060 §3/§4).
        Лестница «самое раннее просроченное → дальше» нужна двоим: платежам — разносить
        деньги, кредиту — выводить состав слоя под решением суда. Одно правило с двумя
        владельцами и есть дефект, ради которого писан ADR-0001, поэтому лестница в
        макете одна (ladderAt) и у неё два потребителя: layersByLadder метит позиции
        присуждённым на дату акта, buildQueue упорядочивает перечень непогашенного.
        Кредит ОТДАЁТ очередь (транш · слой · статья · дата наступления · сумма) —
        d.queue из derive(), секция на вкладке «Платежи»; платежи льют деньги по
        готовому списку сверху вниз и своей лестницы не строят. Зеркало ADR-0010
        становится двусторонним без кольца: величины разные — кредит отдаёт ЧТО
        ПОДЛЕЖИТ ГАШЕНИЮ, платежи возвращают ЧЕМ ПОГАШЕНО. Очередь производная: строится
        на дату, не хранится. Пропорция (Д-8) снята — см. ДЕМО-ОГРАНИЧЕНИЯ.
        ТЕРМИНЫ РАЗВЕДЕНЫ (CONTEXT.md): «очерёдность» — правило старшинства статей
        (параметр bc.queue на «Расчётах»), «очередь погашения» — перечень на дату.

  ДЕМО-ОГРАНИЧЕНИЯ
   • «Сегодня» демо зафиксировано (TODAY = 23.07.2026) — просрочка/дедлайны считаются от него.
   • Состояние в памяти (JS-объекты); localStorage/sessionStorage не используются.
     «Сбросить демо-данные» возвращает исходное через seedDb().
   • Расчёт графика/детального расчёта — детерминированное упрощение, не банковский движок.
   • Зеркала (кураторство, залог, платежи, взыскание, реструктуризация, категория) —
     read-only панели на демо-данных, навигация внутристраничная.
   • Д-8 СНЯТО волной 10.08.2026 (ADR-0060 §3). Доля долга под решением суда бралась
     пропорционально телу — «верный порядок величины при неверной копейке». ADR-0060 §3
     эту пропорцию отверг: просрочка накапливается неравномерно, у старого транша её
     больше, и доля всегда занижала его долю. Состав слоя выводится ЛЕСТНИЦЕЙ на дату
     акта: присуждённое покрывает взносы траншей в порядке «самое раннее просроченное →
     дальше», пока не исчерпается. Одна позиция принадлежит ровно одному слою.
   • Д-10 (10.08.2026). Комиссии живут на кредите (c.fees), транша у них в модели нет —
     в очереди погашения они публикуются строкой «по кредиту». ADR-0060 §2 требует
     называть транш у строки РАЗНЕСЕНИЯ, а не публикации; выдумывать транш комиссии
     макет не станет.
   • Д-11 (10.08.2026). Слой клеймит позицию ЦЕЛИКОМ, даже если присуждённого хватило
     только на её часть: `map.set(p.key, L.id)` в layersByLadder не хранит остаток
     покрытия внутри позиции — частичного покрытия позиции как понятия у модели нет.
   • Д-9 (01.08.2026, уточнено 10.08.2026 — ADR-0104). Прогноз — детерминированное
     упрощение, ровно как и график: производственный календарь не применяется (тот же
     открытый вопрос, что у графика). Прогноз показывает ПОРЯДОК ожидаемых сумм, а не
     банковскую копейку. Аннуитет он не пересобирает ВОВСЕ — и это уже не упрощение, а
     правило: пересборка есть сделка «уменьшить взнос» (ADR-0074 §2), а не вывод экрана.

  ОТКРЫТЫЕ ВОПРОСЫ (канон §10 — вынесены, не изобретаются молча)
   1. Групповой (зонтичный) кредит: как просрочка члена группы влияет на кредит/категорию.
      Макет: транш несёт субъекта, агрегация просрочки по max — помечено как допущение.
   2. ЗАКРЫТ волной 27.07.2026 (КВ-6, ADR-0011): поручительство в индекс обеспеченности
      НЕ входит — у него нет предмета, а значит и залоговой стоимости. Остаётся
      параллельным слоем обеспечения и обеспечительным договором (ADR-0005); при
      взыскании поручитель — отдельное обязанное лицо со своим требованием.
   3. Лимит повторов реструктуризации. Макет: счётчик растёт неограниченно.
   4. ЗАКРЫТ волной 27.07.2026 (КВ-3, ADR-0010) и ПЕРЕИГРАН волной 10.08.2026
      (КВ-18, ADR-0060 §4). Прежняя редакция отдавала платежам и очередь, и разнесение
      целиком. ADR-0060 §4 разделил: ОЧЕРЕДЬ ПОГАШЕНИЯ (упорядоченный перечень
      непогашенного на дату) публикует КРЕДИТ — сырьё, взносы и режимы у него, у платежей
      нет ни одной из этих величин; платежи льют деньги по готовому списку сверху вниз.
      За платежами остаются МАТРИЦА РАЗНЕСЕНИЯ и привязка к исполнительному листу.
      Признак «есть судебное решение» кредит по-прежнему берёт из зеркала суда, а не
      регуляркой по строке фазы.
   5. Источник производственного календаря для дат платежей в нерабочие дни.
      ПОВЫШЕН В ПРИОРИТЕТЕ волной 27.07.2026: КВ-16 снял зажим дня платежа к 28-му, и
      график теперь честно ставит 30-е и 31-е числа. Переноса с выходного макет НЕ
      делает — без выбранного источника календаря это была бы выдумка.
   6. Приоритет источников при одной дате вступления: ПП/суд против ДС.
      Макет: побеждает позже созданная запись — помечено как допущение.
   7. Новый транш, созданный после ретро-изменения: наследует шаблон кредита или
      действующий комплект соседних траншей. Макет: шаблон.
   8. Скан основания для суда/ПП: нужна ли копия файла в «Досье» кредита.
      Макет: только ссылка на документ-владелец.
   9. Доля ликвидного залога — «≥ 80 %» ОТ ЧЕГО (Прил.1 §2.4, тот же вопрос ОВ-ЗР-1 в
      модуле залога). Макет и модуль-владелец меряют от суммы под риском, то есть от
      ОБЯЗАТЕЛЬСТВА: тогда доля растёт по мере погашения, ровно как индекс. Если норма
      имеет в виду долю в СОСТАВЕ обеспечения, правило меняется качественно, и меняется
      оно у владельца — кредит собирает вердикт по его формуле и правку переживёт без
      изменений. Текста Прил.1 §2.4 в репозитории нет, только пересказы. К заказчику.
  10. Платёж со статусом «Расхождение» (реквизиты у нас и в реестре ЦК не совпали):
      двигает ли он остаток и по КАКОЙ сумме — по нашей или по сумме ЦК. Макет
      засчитывает по нашей: запись в реестре ЦК есть, значит деньги были, а §3 спеки
      платежей велит расхождение КОРРЕКТИРОВАТЬ, а не отбрасывать. Обратное чтение
      («не считаем, пока не сверено») задним числом проваливает заёмщика в просрочку
      из-за канцелярской разницы — ровно того, чего избегает механика спорной пени.
  11. Останавливает ли начисление ОПРЕДЕЛЕНИЕ О БАНКРОТСТВЕ. Слоя оно не образует —
      присуждённой суммы в нём нет, — и макет продолжает начислять по договору.
      У K-C14 это 79 147 сомов пени на кредите с возбуждённым делом. Режимы §6.1 спеки
      платежей описывают решения о ВЗЫСКАНИИ; про банкротство норма молчит. К заказчику,
      с оговоркой: последствия банкротства принадлежат взысканию (КР-33).

  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:320px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
a{ color:inherit; }
.app{ display:flex; height:100vh; width:100%; }

/* ---- sidebar ---- */
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.app.nav-collapsed .sidebar{ display:none; }
.brand{ padding:18px 16px 14px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.nav{ flex:1; overflow-y:auto; padding-bottom:8px; }
.nav-toggle{ display:flex; align-items:center; gap:8px; width:100%; appearance:none;
  border:none; background:transparent; color:rgba(24,39,57,0.82); cursor:pointer; text-align:left; }
.nav-group > .nav-toggle{ padding:9px 16px; font:var(--weight-semibold) 15px/1.3 var(--asubk-font); }
.nav-sub > .nav-toggle{ padding:8px 16px 8px 32px; font:var(--weight-semibold) 14px/1.3 var(--asubk-font); }
.nav-toggle:hover{ background:rgba(24,39,57,0.04); }
.nav-toggle .chev{ display:inline-flex; align-items:center; color:rgba(24,39,57,0.5);
  transition:transform 120ms ease; flex:none; }
.nav-group.open > .nav-toggle .chev, .nav-sub.open > .nav-toggle .chev{ transform:rotate(90deg); }
.nav-toggle .lbl{ flex:1; }
.nav-children{ display:none; }
.nav-group.open > .nav-children, .nav-sub.open > .nav-children{ display:block; }
.nav-item{ display:block; padding:7px 16px 7px 52px; text-decoration:none; color:rgba(27,43,65,0.69);
  font:var(--weight-regular) var(--text-base)/1.625 var(--asubk-font); cursor:pointer; }
.nav-item.headerless{ padding-left:40px; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); }
.nav-item.stub{ color:var(--text-placeholder); font-style:italic; }
.sidebar-foot{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; color:var(--text-muted); }
.sidebar-foot span{ font:var(--weight-regular) 14px/1.2 var(--asubk-font); }
.icon-btn{ border:none; background:rgba(24,39,57,0.05); color:var(--text-link); cursor:pointer;
  padding:7px; border-radius:4px; display:flex; }

/* ---- main ---- */
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ height:var(--header-h); flex:none; background:var(--surface-page);
  border-bottom:1px solid var(--border-default); display:flex; align-items:center; gap:14px; padding:0 20px; }
.topbar .menu{ color:var(--text-muted); display:flex; cursor:pointer; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .role-wrap{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.topbar .role-wrap label{ font:var(--font-label); color:var(--text-muted); }
.topbar .role-wrap select{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:0 26px 0 10px;
  appearance:none; cursor:pointer; }
.topbar .role-wrap .rsel{ position:relative; display:flex; align-items:center; }
.topbar .role-wrap .rsel .caret{ position:absolute; right:8px; pointer-events:none; color:var(--text-muted); display:flex; }

.content{ flex:1; overflow:auto; display:flex; flex-direction:column; min-width:0; }
.view{ display:none; flex-direction:column; min-height:0; }

/* ---- buttons ---- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  height:var(--control-h); padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) var(--text-base)/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn svg{ flex:none; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--action-primary-hover); }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-success{ background:var(--action-success); color:#fff; }
.btn-success:hover:not(:disabled){ background:var(--asubk-green-hover); }
.btn-sm{ height:32px; padding:0 10px; font-size:var(--text-sm); }
.btn-tint{ background:var(--asubk-disabled-fill); color:var(--text-link); border:none;
  font-weight:var(--weight-medium); }
.btn-tint:hover:not(:disabled){ background:rgba(25,59,103,0.10); color:var(--action-primary-hover); }
.btn-tint:disabled{ opacity:1; color:var(--text-disabled); cursor:not-allowed; }
.btn-tint.danger{ color:var(--action-danger); }
.btn-tint.danger:hover:not(:disabled){ background:var(--status-error-bg); }

.split{ position:relative; display:inline-flex; }
.split > .btn{ border-radius:0; }
.split > .btn:first-child{ border-top-left-radius:var(--radius-md); border-bottom-left-radius:var(--radius-md); }
.split > .btn.caret{ padding:0 7px; border-top-right-radius:var(--radius-md); border-bottom-right-radius:var(--radius-md);
  border-left:1px solid rgba(255,255,255,0.35); }
.split-menu{ display:none; position:absolute; top:calc(100% + 4px); left:0; min-width:210px; z-index:30;
  background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--radius-md);
  box-shadow:0 10px 30px rgba(16,28,46,0.18); padding:4px; }
.split.open .split-menu{ display:block; }
.split-menu button{ display:block; width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:8px 10px; border-radius:var(--radius-sm); font:var(--font-label); color:var(--text-body); }
.split-menu button:hover{ background:var(--surface-hover); }
.gear-btn{ width:var(--control-h); height:var(--control-h); border:none;
  background:var(--asubk-tint-fill); border-radius:var(--radius-md); color:var(--text-link); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; }
.gear-btn:hover{ background:rgba(25,59,103,0.10); }

/* ---- list: quick row + tiles ---- */
/* Ярус 1 фильтра — единственная строка над реестром: поиск + ЖЦ + куратор слева,
   «⚙ Фильтры» и «Создать кредит» прижаты вправо. Всегда видна: это то, чем пользуются
   каждый вход в реестр, прятать за кликом нечего. Ширины — по содержимому контрола,
   а не поровну (спека 03.08.2026); поиск фиксирован, свободное место уходит в разрыв
   перед кнопками. */
.tb-quick{ display:flex; align-items:flex-end; gap:10px; padding:8px 20px 10px; flex-wrap:wrap; }
.tb-quick .field{ min-width:0; }
.tb-quick .q-search{ width:340px; }
.tb-quick .q-lifecycle{ width:168px; }
.tb-quick .q-curator{ width:200px; }
.tb-quick .q-more{ margin-left:auto; }
.add-cond{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer;
  color:var(--text-link); font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); padding:0 4px; }
.add-cond:hover{ text-decoration:underline; }
.rowtools{ display:flex; align-items:center; gap:10px; padding:0 20px 8px; flex-wrap:wrap; }
.rowtools .spacer{ flex:1; }
.retro-toggle{ display:inline-flex; align-items:center; gap:6px; font:var(--font-label); color:var(--text-muted); cursor:pointer; }
.pager{ display:flex; align-items:center; gap:6px; color:var(--text-muted);
  font:var(--weight-regular) var(--text-base)/1 var(--asubk-font); }
.pager button{ min-width:30px; height:30px; border:1px solid var(--border-default); background:var(--surface-card);
  border-radius:var(--radius-sm); cursor:pointer; color:var(--text-body); }
.pager button:disabled{ opacity:.4; cursor:not-allowed; }

/* Плитки-фильтры над списком (паттерн P3-R32 из commission.html): сумма плиток = «Всего». */
.tiles{ display:flex; gap:10px; padding:4px 20px 12px; flex-wrap:wrap; }
.tile{ flex:1; min-width:150px; border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:10px 14px; cursor:pointer; background:var(--surface-card); transition:border-color 120ms, background 120ms; }
.tile:hover{ background:var(--surface-hover); }
.tile.active{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); }
.tile .tv{ font:var(--weight-bold) 22px/1.1 var(--asubk-font); color:var(--text-heading); }
.tile .tl{ font:var(--font-label); color:var(--text-muted); margin-top:2px; }
.tile.warn .tv{ color:var(--asubk-amber); }
.tile.err  .tv{ color:var(--asubk-red); }
/* Ярус 2 — панель редких условий, свёрнута по умолчанию, раскрывается кнопкой «⚙ Фильтры».
   Три равные колонки: строка «привязка» (область/район · программа · дата) над строкой
   «риск» (просрочка · подгруппа · категория) и «проблемность» с кнопкой сброса. */
.filter-body{ display:none; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 16px; padding:6px 20px 14px; }
.filter-body.open{ display:grid; }
.filter-body .field{ min-width:0; }
.range-pair{ display:flex; align-items:center; gap:8px; }
.range-pair .control{ flex:1; min-width:0; }
.range-pair input{ width:100%; height:var(--control-h); border-radius:var(--radius-md); background:var(--surface-input);
  color:var(--text-body); font:var(--font-body); font-weight:var(--weight-medium); border:1px solid transparent;
  outline:none; padding:0 var(--space-2); transition:box-shadow 120ms ease, border-color 120ms ease; }
.range-pair input:focus{ border-color:var(--border-focus); box-shadow:0 0 0 3px var(--asubk-blue-tint); }
.filter-actions{ grid-column:2 / -1; display:flex; justify-content:flex-end; gap:10px; align-items:flex-end; }
.filter-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 10px; }
.filter-chips:empty{ display:none; }
.fchip{ display:inline-flex; align-items:center; gap:4px; background:var(--asubk-blue-tint); color:var(--asubk-blue);
  border-radius:var(--radius-pill); padding:3px 4px 3px 10px; font:var(--font-label); }
.fchip button{ border:none; background:none; cursor:pointer; color:inherit; font-size:15px; line-height:1; padding:0 4px; border-radius:var(--radius-pill); }
.fchip button:hover{ background:rgba(255,255,255,0.5); }

/* ---- grid (list) ---- */
/* Визуальная система взята с живого грида заявок (vaadin-grid на fkftest, скрин
   2026-08-03) — два реестра стоят рядом в одном конвейере и обязаны читаться как один
   продукт. Отсюда: тёмная полужирная шапка 14px в предложном падеже (не капитель),
   ↕ у КАЖДОЙ колонки всегда на виду, вертикальная линия между ВСЕМИ колонками,
   фиксированные ширины колонок и обрезка длинного значения в «…».
   Ширины заданы через <colgroup> и подобраны так, чтобы обрезка была страховкой,
   а не нормой: «ОсОО "Кара-Балта-Металл"» помещается целиком. Полное значение
   остаётся в title ячейки.
   Своё, чего у живого грида нет: вторая строка ячейки (§Р-19, слияние 12 колонок в 8)
   и правое выравнивание денег табличными цифрами — в реестре разряды обязаны стоять
   в столбик, иначе суммы не сравнить глазом. */
.grid-wrap{ padding:0 20px 20px; overflow:auto; }
table.grid{ width:100%; min-width:1194px; table-layout:fixed;
  border-collapse:separate; border-spacing:0; font:var(--font-label); }
table.grid thead th{ position:sticky; top:0; z-index:2; background:var(--asubk-gray-300);
  text-align:left; padding:7px 12px; vertical-align:middle;
  border-bottom:1px solid var(--border-strong);
  font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  cursor:pointer; user-select:none; }
table.grid thead th .sort{ margin-left:4px; font-size:11px; color:var(--text-placeholder); }
table.grid thead th.sorted{ color:var(--asubk-blue); }
table.grid thead th.sorted .sort{ color:var(--asubk-blue); }
table.grid tbody td{ padding:5px 12px; border-bottom:1px solid var(--border-default);
  color:var(--text-body); vertical-align:top;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
table.grid tbody tr{ cursor:pointer; }
/* зебра — чётные строки очень светлой заливкой, чтобы взгляд не съезжал по строке */
table.grid tbody tr:nth-child(even) td{ background:var(--asubk-gray-50); }
/* ховер должен перебивать зебру — поэтому темнее и ниже по каскаду */
table.grid tbody tr:hover td{ background:var(--asubk-gray-150); }
table.grid tbody tr.sel td{ background:var(--asubk-nav-active); }
.grid tbody tr.terminal td{ color:var(--text-muted); }
.grid tbody tr.terminal td:first-child{ font-style:italic; }
/* денежная ячейка */
.grid td.num{ text-align:right; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
.grid td.bal{ font-weight:var(--weight-medium); color:var(--text-heading); }
.grid td.od .days{ color:var(--asubk-red); font-weight:var(--weight-semibold); }
.grid td.od .zero{ color:var(--text-placeholder); }
/* главная строка ячейки-имени — как .cell-name у заявок */
.grid td .cell-name{ font-weight:var(--weight-medium); color:var(--text-heading); }
/* вторая строка в ячейке: дата, ИНН/район, куратор, эквивалент, подгруппа */
.grid td .sub{ display:block; margin-top:1px; color:var(--text-muted);
  font-weight:var(--weight-regular); font-size:12px; line-height:1.25;
  font-variant-numeric:tabular-nums;
  overflow:hidden; text-overflow:ellipsis; }
/* тот же приглушённый вид, но в строку с основным значением, а не под ним */
.grid td .sub.inline{ display:inline; margin-top:0; margin-left:6px; }
/* Т·N / Р·N — метки состава кредита у номера договора */
.mk{ display:inline-block; margin-left:6px; padding:1px 6px; border-radius:var(--radius-sm);
  background:var(--asubk-tint-fill); color:var(--text-muted);
  font:var(--weight-medium) 11px/1.5 var(--asubk-font); vertical-align:middle; }
.mk-r{ background:var(--status-info-bg); color:var(--asubk-blue); }

/* поля «от/до» — тот же аутлайн-вид, что у остальных полей фильтра (как в live) */
.range-pair input{ background:var(--surface-card); border:1px solid var(--border-strong); }
.range-pair input:focus{ border-color:var(--border-focus); box-shadow:0 0 0 3px var(--asubk-blue-tint); }

/* бейдж числа активных условий на кнопке «⚙ Фильтры» (считает условия, не поля) */
.fbadge{ margin-left:6px; padding:1px 7px; border-radius:var(--radius-pill);
  background:var(--status-info-bg); color:var(--asubk-blue);
  font:var(--weight-medium) 12px/1.6 var(--asubk-font); }

/* пейджер под гридом */
.pager{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:0 20px 20px;
  font:var(--font-label); color:var(--text-muted); }
.pager .pages{ display:flex; align-items:center; gap:4px; }
.pager .pg{ min-width:28px; height:28px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--surface-card);
  color:var(--text-body); cursor:pointer; user-select:none; }
.pager .pg:hover{ background:var(--surface-hover); }
.pager .pg.active{ background:var(--action-primary); border-color:var(--action-primary); color:#fff; cursor:default; }
.pager .pg.dis{ color:var(--text-disabled); cursor:default; background:var(--asubk-disabled-fill); }
.pager .psize select{ height:28px; min-width:72px; margin-left:6px; border:1px solid var(--border-default);
  border-radius:var(--radius-md); background:var(--surface-card); color:var(--text-body); font:var(--font-label); }
.pager .pinfo{ margin-right:auto; }

/* status pills */
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.low{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.mid{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.pill.high{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.cat-low{ color:var(--asubk-green); } .cat-mid{ color:var(--asubk-amber); } .cat-high{ color:var(--asubk-red); }

/* ---- detail ---- */
.detail-tabbar-wrap{ position:relative; border-bottom:1px solid var(--border-default);
  background:var(--surface-page); flex:none; }
.detail-tabbar{ display:flex; overflow-x:auto; padding:6px 44px 0 20px; scrollbar-width:none; }
.detail-tabbar::-webkit-scrollbar{ display:none; }
.dtab{ flex:none; border:none; background:transparent; padding:11px 15px;
  font:var(--weight-medium) var(--text-base)/1 var(--asubk-font); color:var(--text-muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap; }
.dtab:hover{ color:var(--text-body); }
.dtab.active{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.tabbar-chevron{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px; height:28px;
  background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--radius-md);
  display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer; }
.tabbar-chevron:hover{ background:var(--surface-hover); }
/* subtabs — вкладки ВНУТРИ карточки (журнал условий: разбор по траншам).
   Мельче .dtab, живут в развороте строки, не в шапке детали. */
.subtabs{ display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--border-default); margin:2px 0 10px; }
.subtab{ flex:none; border:none; background:transparent; padding:7px 12px; cursor:pointer;
  font:var(--weight-medium) var(--text-sm)/1 var(--asubk-font); color:var(--text-muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.subtab:hover{ color:var(--text-body); }
.subtab.active{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.subtab .cnt{ color:var(--text-placeholder); font-weight:var(--weight-regular); margin-left:4px; }
/* mx2 — две зоны сводной матрицы внутри одной карточки (левая/правая) */
.mx2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
@media (max-width:1180px){ .mx2{ grid-template-columns:1fr; } }
.panel-wrap{ padding:18px 24px 8px; }
.detail-panel{ display:none; }
.detail-panel.active{ display:block; }

/* ---- process header (indicator panel) — ПЯТЬ плиток ---- */
.phead{ padding:0; margin-bottom:18px; }
.phead-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.phead-name{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.phead-name .nm{ font:var(--weight-semibold) 18px/1.2 var(--asubk-font); color:var(--text-heading); }
.phead-name a{ font:var(--font-label); color:var(--text-link); text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
.phead-name a:hover{ text-decoration:underline; }
.phead-sub{ font:var(--font-label); color:var(--text-muted); margin-top:3px; }
.phead-sub b{ color:var(--text-body); font-weight:var(--weight-medium); }
.phead-owner{ font:var(--font-label); color:var(--text-muted); white-space:nowrap; }
.phead-banner{ display:flex; align-items:flex-start; gap:10px; border-radius:var(--radius-md);
  padding:9px 14px; margin-bottom:12px; font:var(--font-label); }
.phead-banner.warn{ background:var(--status-warning-bg); color:var(--asubk-amber); }
.phead-banner.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.phead-banner.danger{ background:var(--status-error-bg); color:var(--asubk-red); }
.phead-banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.phead-banner svg{ flex:none; margin-top:1px; }
.ms-card{ border:1px solid var(--border-default); border-radius:var(--radius-md); padding:14px 16px; margin-top:12px; background:#fff; }
.ms-card-h{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.ms-card-h .mt{ font-weight:600; }
.ms-meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:6px 18px; margin-bottom:6px; font-size:13px; }
.ms-meta b{ color:var(--text-muted); font-weight:500; }
.ms-acts{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.phead-banner .b-act{ margin-left:auto; }
/* auto-fit, а не фиксированные 5 колонок: плиток стало 7, и на узком экране они должны
   перетекать, а не сжиматься до нечитаемого основания под значением. */
.phead-dims{ display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:12px; align-items:stretch; }
.phead-acts{ display:flex; align-items:flex-start; gap:8px; flex:none; }
.dim{ background:var(--surface-panel); border-radius:var(--radius-md); padding:10px 14px; }
.dim.clickable{ cursor:pointer; } .dim.clickable:hover{ background:var(--surface-hover); }
.dim .dl{ font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-muted); margin-bottom:5px;
  display:flex; align-items:center; gap:4px; justify-content:space-between; }
.dim .dv{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); }
/* .src — не подпись-сноска, а ОСНОВАНИЕ значения: читается, поэтому цвет muted, а не
   placeholder, и высота строки крупнее — в нём до трёх строк с числами. */
.dim .src{ font:var(--weight-regular) 11.5px/1.45 var(--asubk-font); color:var(--text-muted); margin-top:5px; }
.dim .src b{ color:var(--text-body); font-weight:var(--weight-medium); }
/* .src вне .dim (карточки «Условий», Д-6/Д-7) — тот же смысл, компактнее под полем. */
.src{ display:block; color:var(--text-muted); font-size:11px; margin-top:2px; }
.dim .dl .lock{ vertical-align:middle; }
.dim .dl .icon-btn{ padding:3px; margin-left:4px; vertical-align:middle; }
/* «Оверлеи» шире прочих: в основании до трёх слоёв с источником и дедлайном. */
.dim.wide{ grid-column:span 2; }
@media(max-width:760px){ .dim.wide{ grid-column:span 1; } }
.dim .cnt{ font-weight:var(--weight-bold); } .dim .cnt.over{ color:var(--asubk-red); }
/* Раскрытие входов worst-of (паттерн borrower.html) */
.cat-expand{ margin-top:10px; border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:12px 16px; background:var(--surface-panel); font:var(--font-label); }
.cat-expand .row{ padding:4px 0; border-bottom:1px solid var(--asubk-grid-line); }
.cat-expand .row:last-child{ border-bottom:none; font-weight:var(--weight-semibold); }
.cat-expand .ck{ color:var(--text-muted); }
.win{ background:var(--status-error-bg); padding:0 4px; border-radius:3px; }

/* two-column form */
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:16px 40px; align-items:start; max-width:1500px; }
/* .f4 — та же сетка на четыре колонки, для полей внутри .pcard.wide (03.08.2026):
   в карточке на всю ширину две колонки растягивают каждое поле вдвое шире нужного,
   и четыре коротких значения читаются как две далеко разнесённые пары. */
.f4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px 40px; align-items:start; }
@media (max-width:1100px){ .f4{ grid-template-columns:1fr 1fr; } }
.field{ display:flex; flex-direction:column; gap:6px; }
.field .flabel{ font:var(--font-label); color:var(--text-muted); }
.field.col-span{ grid-column:1 / -1; }
.control{ position:relative; display:flex; align-items:center; }
.control input, .control select, .note-area{ width:100%; height:var(--control-h); border-radius:var(--radius-md);
  background:var(--surface-card); color:var(--text-body); font:var(--font-body); font-weight:var(--weight-medium);
  border:1px solid var(--border-strong); outline:none; padding:0 var(--space-2);
  transition:box-shadow 120ms ease, border-color 120ms ease; }
.control select{ cursor:pointer; appearance:none; padding-right:30px; }
.control input:focus, .control select:focus, .note-area:focus{ border-color:var(--border-focus); box-shadow:0 0 0 3px var(--asubk-blue-tint); }
.control input[readonly], .ro input, .ro .note-area{ background:var(--surface-input); color:var(--text-muted); border:1px solid transparent; cursor:default; }
.control input.asof-date{ height:32px; padding:0 8px; font-size:13px; font-weight:var(--weight-regular); background:var(--surface-page); }
.control input.asof-date::-webkit-calendar-picker-indicator{ cursor:pointer; opacity:.5; padding:0; margin-left:4px; }
.control input.asof-date::-webkit-calendar-picker-indicator:hover{ opacity:.9; }
.control input[readonly]:focus{ border-color:transparent; box-shadow:none; }
.grey input, .grey select{ background:var(--surface-input); border-color:transparent; }
.control .cal, .control .caret{ position:absolute; right:9px; pointer-events:none; color:var(--text-muted); display:flex; }
.note-area{ height:auto; min-height:80px; padding:10px 12px; resize:vertical; line-height:1.5; }
.lookup{ display:flex; align-items:center; height:var(--control-h); background:var(--surface-input);
  border-radius:var(--radius-md); border:1px solid transparent; padding-left:var(--space-2); }
.lookup .val{ flex:1; font:var(--font-body); font-weight:var(--weight-medium); color:var(--text-body);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lookup .val.ph{ color:var(--text-placeholder); }
/* .cond-lookup — вариант «лукапа» для карточек «Условия» (Д-6/Д-7): значение + основание
   под ним могут занять больше одной строки (расхождение по траншам, длинные ссылки на
   документ) — обычный .lookup рассчитан на одну строку фиксированной высоты и обрезает
   контент по ширине; здесь высота растёт по контенту. */
.cond-lookup{ height:auto; min-height:var(--control-h); flex-direction:column; align-items:flex-start;
  padding:8px var(--space-2); gap:2px; }
.cond-lookup .val{ white-space:normal; overflow:visible; text-overflow:clip; }
/* .lookup-wrap — тот же приём для полей со СВОБОДНЫМ ТЕКСТОМ (обоснование waiver,
   волна 03.08.2026, КР-56): базовый .lookup режет значение в одну строку многоточием, а обоснование
   и есть содержание поля — обрезанное, оно не сообщает ничего. Высота по контенту. */
.lookup-wrap{ height:auto; min-height:var(--control-h); align-items:flex-start; padding:8px var(--space-2); }
.lookup-wrap .val{ white-space:normal; overflow:visible; text-overflow:clip; }
.lookup button{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:var(--control-h);
  border:none; background:transparent; color:var(--text-link); cursor:pointer; }
.lookup .pick{ font-weight:var(--weight-bold); letter-spacing:1px; }

.section-h{ font:var(--weight-semibold) 18px/1.2 var(--asubk-font); color:var(--text-heading); margin:0 0 6px; }
.section-note{ font:var(--font-label); color:var(--text-muted); margin:0 0 14px; max-width:960px; }
.gtoolbar{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
.gtoolbar .spacer{ flex:1; }

/* Карточки-панели внутри вкладки (шаг 13): каждая смысловая группа полей — своя карточка,
   раскладка в две колонки. align-items:start — карточки не растягиваются под соседа по ряду. */
.pcards{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; max-width:1500px; }
.pcard{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  background:var(--surface-card); padding:16px 18px; }
.pcard.wide{ grid-column:1 / -1; }
/* Стопка карточек, занимающая одну колонку сетки (волна 03.08.2026): нужна, когда
   в колонке должно стоять несколько карточек подряд, а не по одной в ряд —
   иначе row-flow сетки разложил бы их по соседним колонкам. */
.pcol{ display:grid; gap:16px; align-content:start; }
.pcard > .section-h{ margin:0 0 4px; }
.pcard > .section-note{ margin:0 0 12px; max-width:none; }
.pcard .f2, .pcard .f4{ gap:14px 24px; max-width:none; }
.pcard > .gtoolbar{ margin:12px 0 0; }
/* Раскрытие worst-of внутри карточки («Проблемные», волна 11.08.2026) теряет собственную
   рамку и фон: рамку уже даёт .pcard, вложенная вторая читается как лишний уровень.
   Разделители строк остаются — они и несут структуру «вход · вход · итог». */
.pcard > .cat-expand{ margin-top:0; border:none; border-radius:0; padding:0; background:transparent; }
.pcard > .mirror-src{ margin-top:10px; }
@media (max-width:1100px){ .pcards{ grid-template-columns:1fr; } }

/* collection grid (внутри вкладок) */
.cgrid-wrap{ border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:auto; min-height:80px; }
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label); white-space:nowrap; }
table.cgrid thead th{ position:sticky; top:0; text-align:left; padding:10px 12px; background:var(--surface-card);
  border-bottom:1px solid var(--border-default); font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font);
  color:var(--text-heading); cursor:pointer; user-select:none; }
table.cgrid tbody td{ padding:9px 12px; border-bottom:1px solid var(--border-default); color:var(--text-body); vertical-align:top; }
table.cgrid tbody tr:hover{ background:var(--surface-hover); }
table.cgrid tbody tr.total td{ font-weight:var(--weight-bold); color:var(--text-heading);
  background:var(--surface-hover); border-top:1px solid var(--border-strong); }
table.cgrid tbody tr.giveback td{ color:var(--asubk-green); font-weight:var(--weight-medium); }
/* Строка года в позициях графика: итог года стоит ПОД СВОИМИ колонками (ОД, проценты,
   платёж), поэтому это обычная строка таблицы, а не подпись на всю ширину. Кликается —
   разворачивает/сворачивает год, отсюда cursor и подсветка на hover. */
table.cgrid tbody tr.gyear td{ background:var(--surface-panel); padding:9px 12px;
  border-top:1px solid var(--border-strong); color:var(--text-heading); }
table.cgrid tbody tr.gyear{ cursor:pointer; }
table.cgrid tbody tr.gyear:hover td{ background:var(--surface-hover); }
table.cgrid tbody tr.gyear .gcar{ display:inline-block; width:14px; color:var(--text-muted); }
table.cgrid tbody tr.gyear .gy{ font:var(--weight-bold) var(--text-base)/1.2 var(--asubk-font);
  color:var(--text-heading); margin-right:8px; }
table.cgrid tbody tr.gyear .gcnt{ color:var(--text-muted); margin-left:8px; }
table.cgrid tbody tr.gyear td.gyear-s{ color:var(--text-muted); font-size:11px; }
/* Два вложенных уровня группировки во «Плане» (КВ-22): год держит кварталы, квартал —
   свои месяцы. Уровни различаются ОТСТУПОМ и весом подписи, а не цветом: три фона подряд
   в одной таблице спорят между собой, а лесенка читается сразу. Отступ живёт на первой
   ячейке, потому что вложенность здесь — свойство периода, а не всей строки. */
/* Месяц лежит под своим кварталом (КВ-21) — отступ показывает вложенность там, где у
   квартала стоит каретка. Класс .pmonth нужен и разметке: по нему прогон отличает строки
   месяцев от строк-групп. */
table.cgrid tbody tr.pmonth td:first-child{ padding-left:26px; }
/* Сторнированная мера — запись остаётся, зачёркнута с пометкой основания (И-3). */
table.cgrid tbody tr.storno td{ color:var(--text-placeholder); text-decoration:line-through; }
table.cgrid tbody tr.storno td.storno-reason{ text-decoration:none; color:var(--asubk-red); }
.cgrid-empty{ display:flex; align-items:center; justify-content:center; min-height:120px;
  color:var(--text-placeholder); font:var(--font-label); }
.rowlink{ color:var(--text-link); cursor:pointer; }
.rowlink:hover{ text-decoration:underline; }
.text-muted{ color:var(--text-muted); }
/* у td внутри cgrid есть СОБСТВЕННОЕ объявление color, а прямое объявление всегда бьёт
   наследование — поэтому класс на <tr> без этого правила ничего не красит */
table.cgrid tbody tr.text-muted td{ color:var(--text-muted); }

/* timeline (контур текущей фазы) */
.timeline{ display:flex; flex-wrap:wrap; gap:0; margin:2px 0 20px; align-items:center; }
.tl-step{ display:flex; align-items:center; gap:8px; padding:6px 0; }
.tl-dot{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font:var(--weight-bold) 12px/1 var(--asubk-font); flex:none; }
.tl-dot.done{ background:var(--asubk-green); color:#fff; }
.tl-dot.cur{ background:var(--asubk-blue); color:#fff; }
.tl-dot.todo{ background:var(--surface-input); color:var(--text-placeholder); }
.tl-dot.cond{ background:var(--surface-input); color:var(--asubk-amber); border:1px dashed var(--asubk-amber); }
.tl-lbl{ font:var(--font-label); color:var(--text-body); }
.tl-lbl.todo{ color:var(--text-placeholder); }
.tl-lbl.cond{ color:var(--asubk-amber); }
.tl-arrow{ color:var(--text-placeholder); margin:0 12px; display:flex; }
.tl-contour{ font:var(--font-label); color:var(--text-muted); margin-bottom:6px; }

/* deadlines block */
table.dl-grid{ width:100%; border-collapse:collapse; font:var(--font-label); }
table.dl-grid th{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border-default);
  font:var(--weight-semibold) var(--text-sm)/1.3 var(--asubk-font); color:var(--text-heading); }
table.dl-grid td{ padding:8px 10px; border-bottom:1px solid var(--asubk-grid-line); }
table.dl-grid tr.overdue td{ color:var(--asubk-red); }
table.dl-grid tr.overdue td:last-child{ font-weight:var(--weight-semibold); }

/* history */
.hist{ border-left:2px solid var(--border-strong); margin-left:6px; padding-left:0; }
.hrow{ position:relative; padding:10px 0 10px 22px; border-bottom:1px solid var(--asubk-grid-line); }
.hrow::before{ content:""; position:absolute; left:-5px; top:16px; width:8px; height:8px; border-radius:50%; background:var(--asubk-blue); }
.hrow.storno::before{ background:var(--asubk-red); }
.hrow .hwhen{ font:var(--weight-medium) 13px/1.3 var(--asubk-font); color:var(--text-muted); }
.hrow .hwhat{ font:var(--font-label); color:var(--text-body); margin-top:2px; }
.hrow .hwho{ font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-top:2px; }

/* checklist (структурный чек-лист передачи, В-10) */
.chk{ display:flex; flex-direction:column; gap:2px; }
.chk-row{ display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center;
  padding:8px 10px; border-bottom:1px solid var(--asubk-grid-line); font:var(--font-label); }
.chk-row .chk-form{ color:var(--text-muted); font-size:12px; white-space:nowrap; }
.chk-flag{ font-size:12px; white-space:nowrap; }
.chk-flag.ok{ color:var(--asubk-green); } .chk-flag.no{ color:var(--asubk-red); }

/* Выборка кредитов (модалка согласования). Отдельный класс — НЕ внутри .control,
   иначе глобальное .control input{width:100%;height:36px} растягивает чекбоксы. */
.cpick{ display:flex; flex-direction:column; border:1px solid var(--border-default); border-radius:var(--radius-md); overflow:hidden; }
.cpick input[type=checkbox]{ width:16px; height:16px; flex:none; margin:0; accent-color:var(--asubk-blue); cursor:pointer; }
.cpick-all{ display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:12px; color:var(--text-muted);
  background:var(--surface-input); border-bottom:1px solid var(--border-default); cursor:pointer; }
.cpick-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; font-size:13px; cursor:pointer; }
.cpick-row + .cpick-row{ border-top:1px solid var(--asubk-grid-line); }
.cpick-row:hover{ background:var(--asubk-blue-tint); }
.cpick-main{ flex:1; min-width:0; line-height:1.35; }
.cpick-num{ font-weight:600; } .cpick-sub{ color:var(--text-muted); }
.cpick-claim{ color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

/* footer */
.footer{ position:sticky; bottom:0; background:var(--surface-page); border-top:1px solid var(--border-default);
  padding:14px 20px; display:flex; align-items:center; gap:12px; }

/* modals */
.overlay{ position:fixed; inset:0; background:rgba(16,28,46,0.42); display:none; align-items:center;
  justify-content:center; z-index:60; padding:24px; }
.overlay.open{ display:flex; }
.modal{ background:var(--surface-card); border-radius:var(--radius-lg); width:min(1040px,100%); max-height:88vh;
  display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(16,28,46,0.4); }
.modal.form{ width:min(760px,100%); }
.modal.narrow{ width:min(560px,100%); }
.modal-h{ padding:18px 24px 12px; display:flex; align-items:center; gap:10px; }
.modal-h .mt{ font:var(--weight-bold) 20px/1.2 var(--asubk-font); color:var(--text-heading); flex:1; }
.modal-x{ border:none; background:transparent; cursor:pointer; color:var(--text-muted); display:flex; padding:4px; }
.modal-x:hover{ color:var(--text-body); }
.modal-b{ padding:0 24px 8px; overflow:auto; flex:1; }
.modal-f{ padding:14px 24px 20px; display:flex; gap:12px; justify-content:flex-end; }
.mform{ display:grid; grid-template-columns:1fr 1fr; gap:16px 40px; align-items:start; padding-top:8px; }
.mform .field.col-span{ grid-column:1 / -1; }
.mform .field.req .flabel::after{ content:" •"; color:var(--action-danger); }
.mform .control input, .mform .control select, .mform .note-area{ background:var(--surface-input); border-color:transparent; }
.warn-inline{ display:flex; gap:8px; align-items:flex-start; background:var(--status-warning-bg);
  color:var(--asubk-amber); border-radius:var(--radius-md); padding:10px 12px; font:var(--font-label); margin-top:6px; }
/* Гейт — жёсткая блокировка с причиной (§6.3, паттерн sendGateReason). */
.gate-inline{ display:flex; gap:8px; align-items:flex-start; background:var(--status-error-bg);
  color:var(--asubk-red); border-radius:var(--radius-md); padding:10px 12px; font:var(--font-label); margin-top:6px; }
.gate-inline svg{ flex:none; margin-top:2px; }
.cgrid tbody tr.mrow-undelivered{ background:var(--status-warning-bg); }
.overlap-note{ display:flex; gap:8px; align-items:flex-start; background:var(--status-warning-bg);
  color:var(--asubk-amber); border-radius:var(--radius-md); padding:10px 12px; margin:0 0 14px; font:var(--font-label); }
.overlap-note svg{ flex:none; margin-top:2px; }
.overlap-note .rowlink{ color:var(--text-link); font-weight:600; }

/* toast */
.toast-wrap{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:80; }
.toast{ min-width:260px; max-width:460px; padding:12px 14px; border-radius:var(--radius-md);
  background:var(--asubk-ink); color:#fff; font:var(--font-label); box-shadow:0 10px 30px rgba(16,28,46,0.3);
  display:flex; gap:10px; align-items:flex-start; }
.toast.ok{ background:var(--asubk-green); }
.toast.warn{ background:var(--asubk-amber); }
.toast.err{ background:var(--asubk-red); }

/* settings screen tabs */

<script>
/* ============================================================
   МОДУЛЬ «КРЕДИТЫ» — TO-BE, единый файл. Весь логический слой чистый и
   экспортируется на window.CR (§0.2–0.6 канона). DOM-инициализация — только
   за if (typeof document !== 'undefined'). Порядок разделов:
     1) утилиты  2) seedDb  3) derive/gate/canRole/buildSchedule (Task 2+)
     4) gate/canRole (Task 3+)   5) мутации (Task 4+)   6) экспорт window.CR
     7) DOM render + wiring
   ============================================================ */

/* ---- 1. Утилиты (переиспользуются везде) ---- */
const TODAY = '23.07.2026';                       // «сегодня» демо зафиксировано
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const money = n => nf2.format(n || 0);
const money0 = n => nf0.format(Math.round(n || 0));
/* Русское склонение при числе: «1 платёж · 2 платежа · 5 платежей». Нужно там, где
   число выводится не в колонке, а в подписи (заголовок года на «Графике»). */
const plur = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many); };
/* Курсы к сому на TODAY. Справочник, не модель кредита: кредит хранит свою валюту,
   приведение к KGS — производная (реестр сравнивает и суммирует строки в одной валюте). */
const FX = { KGS:1, USD:87.45, EUR:95.30, RUB:1.02 };
const toKgs = (v, cur) => (v || 0) * (FX[cur] || 1);
const pd = s => { if (s instanceof Date) return s; const [d,mo,y] = String(s).split('.').map(Number); return new Date(y, mo-1, d); };  // идемпотентна: Date на входе возвращается как есть
const fd = d => String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
/* Сдвиг на k месяцев с сохранением ДНЯ ПЛАТЕЖА (КР-14). Прежняя реализация зажимала
   день до 28-го — освоение 31.05 давало все платежи 28-го числа, то есть договорная
   дата платежа подменялась удобной для арифметики. Здесь день берётся из исходной
   даты и схлопывается к последнему дню месяца только там, где его физически нет
   (31.05 → 30.06 → 31.07): каждый шаг считается от старта, поэтому день не «стекает».
   Перенос платежа с нерабочего дня НЕ делается — нужен производственный календарь,
   источник которого не выбран (открытый вопрос §10.5).
   fixedDay (Шаг 18, payDay): если условие «День платежа» задано, день берётся из
   него, а не из исходной даты d — короткий месяц по-прежнему схлопывает к последнему
   дню (то же правило программы: «1–31; короткий месяц = последний день»). */
const addM = (d,k,fixedDay) => { const day = fixedDay || d.getDate();
  const x = new Date(d.getFullYear(), d.getMonth()+k, 1);
  const last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate();
  x.setDate(Math.min(day, last)); return x; };
const addD = (dt, n) => { const x = new Date(dt.getTime()); x.setDate(x.getDate() + n); return x; };
const dd = (a,b) => Math.round((b-a)/86400000);
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;

/* Шаг 19: «Метод дней» (baseConditions.dayMethod, «числитель/знаменатель» —
   R19 loan-program.html, поле §10.5) — прежде хранился, но нигде не читался
   (проценты в графике считались помесячно, без дней вообще). Формат: 'числ/база'.
   Числитель: 'факт' — реальные календарные дни периода; '30' — финансовый месяц
   (30×мес. в периоде). База: '365' | '360' | 'факт' — фактических дней в году
   даты начисления (365/366). Разбор терпим к регистру и пробелам; нераспознанное
   схлопывается к дефолту факт/365 (совпадает со значением на всех демо-кредитах). */
function dayBasis(dayMethod, atDate){
  const [numRaw, baseRaw] = String(dayMethod || 'факт/365').split('/');
  const num = String(numRaw || '').trim().toLowerCase();
  const base = String(baseRaw || '').trim().toLowerCase();
  return {
    numFin: num === '30',                                            // финансовый числитель (30×мес)
    base: base === '360' ? 360 : (base === 'факт' || base === 'фактическая')
      ? (isLeap((atDate || new Date()).getFullYear()) ? 366 : 365) : 365,
  };
}
function toast(msg, kind){
  if (typeof document === 'undefined') return;    // smoke-песочница без DOM
  const wrap = document.getElementById('toastWrap'); if (!wrap) return;
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

/* ---- вспомогательные фабрики модели (возвращают СВЕЖИЕ объекты) ---- */
function isObj(x){ return x && typeof x === 'object' && !Array.isArray(x); }
function deepMerge(base, over){                    // массивы/скаляры заменяются целиком
  for (const k in over){
    if (isObj(base[k]) && isObj(over[k])) deepMerge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}
function condDefaults(over){                        // базовый комплект условий (Р-2); плоский объект
  return Object.assign({
    rate:10, floatMeta:{}, term:24, freq:'ежемесячно', method:'аннуитет',
    payDay:0, lastPaymentAnchor:'по дате выдачи', payMonths:'',
    graceMain:0, graceAccrual:0, graceInterest:0, graceIntDistFrom:0, graceIntDistTo:0,
    /* queue — ОЧЕРЁДНОСТЬ: правило старшинства статей из договора. Не путать с очередью
       погашения — перечнем непогашенного на дату, который кредит публикует в d.queue
       (ADR-0060 §4, CONTEXT.md:241). */
    penaltyMain:0.1, penaltyInt:0.1, penaltyMaxPct:20, queue:'по договору', dayMethod:'факт/365',
    reserveRate:0
  }, over || {});
}
/* ---- Р-21: реестр параметров-условий. Меняться основанием может только то,
   что здесь перечислено. queue — параметр расчётного движка («Расчёты», шаг 14,
   решение не пересмотрено), судом и ПП не меняется; penaltyMaxPct мёртв (шаг 4).
   Шаг 18 (сверка с mockups/loan-program/loan-program.html «Платежи и расчёты» /
   «Льготный период»): добавлены payDay · lastPaymentAnchor · payMonths ·
   graceIntDistFrom/To — разбор в шапке файла.
   Шаг 20: dayMethod вернулся сюда из «Расчётов» (шаг 14 счёл его параметром
   движка, не переговорным условием; пользователь при ревизии дневного расчёта
   счёл иначе — это ставка/база начисления %, редактируется тем же основанием,
   что и сама ставка). ---- */
const PARAMS = [
  { key:'rate',          label:'Ставка, %',                 kind:'num' },
  { key:'reserveRate',   label:'Ставка резерва, %',         kind:'num' },
  { key:'penaltyMain',   label:'Пеня по ОД, %/дн',          kind:'num' },
  { key:'penaltyInt',    label:'Пеня по %, %/дн',           kind:'num' },
  { key:'term',          label:'Срок, мес.',                kind:'num' },
  { key:'payDay',        label:'День платежа, число месяца', kind:'num' },
  { key:'lastPaymentAnchor', label:'Привязка последнего платежа', kind:'enum',
    options:['по дате выдачи','по дате 1-го платежа'] },
  { key:'freq',          label:'Периодичность',             kind:'enum',
    options:['ежемесячно','ежеквартально','раз в полгода','ежегодно','по конкретным месяцам'] },
  { key:'payMonths',     label:'Конкретные месяцы платежей', kind:'months' },
  { key:'method',        label:'Метод погашения',           kind:'enum',
    options:['аннуитет','равными долями','в конце срока'] },
  { key:'graceMain',     label:'Льгота по ОД, мес.',        kind:'num' },
  { key:'graceInterest', label:'Льгота по %, мес.',         kind:'num' },
  { key:'graceIntDistFrom', label:'Распредел. отсроч. % — период с №', kind:'num' },
  { key:'graceIntDistTo',   label:'Распредел. отсроч. % — период по №', kind:'num' },
  { key:'graceAccrual',  label:'Отсрочка начисления, мес.', kind:'num' },
  { key:'dayMethod',     label:'Метод дней',                kind:'enum',
    /* Шаг 20: числитель×база — полный перекрёстный список из loan-program.html
       (dayCountNum × dayCountBase, R19), свёрнутый в одну строку 'числ/база'. */
    options:['факт/365','факт/360','факт/факт','30/365','30/360','30/факт'] }
];
const PARAM_KEYS = PARAMS.map(p => p.key);
/* Зоны сводной матрицы условий: те же смысловые группы, что у карточек условий
   («Ставки» + «Льготные периоды» слева, «Погашение» справа). Ключи, не попавшие
   в RATES, уходят в REPAY автоматически — новый параметр не потеряется. */
const MATRIX_ZONE_RATES = ['rate','reserveRate','penaltyMain','penaltyInt',
  'graceMain','graceInterest','graceIntDistFrom','graceIntDistTo','graceAccrual'];
const MATRIX_ZONE_REPAY = PARAM_KEYS.filter(k => !MATRIX_ZONE_RATES.includes(k));

/* Группы карандашей вкладки «Условия» (КВ-25): ровно то, что рисует карточка.
   НЕ MATRIX_ZONE_*: там льготы отнесены к «Ставкам» — это раскладка сводной матрицы
   в две колонки, а карточка «Ставки» льгот не показывает вовсе, и переиспользование
   зон сделало бы фильтр модалки враньём. REPAY считается вычитанием, чтобы новый
   параметр не остался без двери: ленты с общей кнопкой больше нет, и ключ, не попавший
   в группу, стал бы нередактируемым молча. */
const COND_CARD_RATES = ['rate','reserveRate','penaltyMain','penaltyInt'];
const COND_CARD_REPAY = PARAM_KEYS.filter(k => !COND_CARD_RATES.includes(k));

const paramLabel = k => (PARAMS.find(p => p.key === k) || {}).label || k;

/* Типы основания. owned=false → документ живёт в другом модуле, кредит только
   ссылается (Д-4, паттерн Р-7/Р-16). retro=true → допустима дата вступления
   в прошлом (Г-19): внешний акт задним числом штатен, сделка сторон — нет. */
const BASIS_KINDS = {
  application:{ label:'Заявка / комиссия',           icon:'▪',  owned:true,  retro:false },
  agreement:  { label:'Доп. соглашение',             icon:'ДС', owned:true,  retro:false },
  court:      { label:'Решение суда',                icon:'⚖',  owned:false, retro:true  },
  govAct:     { label:'Постановление правительства', icon:'ПП', owned:false, retro:true  }
};
/* ---- Обязательный комплект документов кредита (Г-7, КР-11) ----
   Зеркало кредитной программы: список видов ведётся там (`docCredReq`/`docCredOpt` в
   mockups/loan-program/loan-program.html), кредит его читает по origin.programId и не
   правит. До этой волны реестра обязательных видов не было вовсе, и Г-7 проверял
   «все ИМЕЮЩИЕСЯ документы приняты» — на пустом массиве `.every()` даёт true, поэтому
   у 57 кредитов из 59 гейт не мог сработать в принципе.
   PROGRAM_DOCS_DEFAULT — комплект по умолчанию для программы, которой нет в справочнике:
   лучше требовать базовый минимум, чем не требовать ничего. */
const PROGRAM_DOCS = {
  'ПРГ-1':{ req:['Кредитный договор','Решение комиссии','Финансовая отчётность'], opt:['Справка о доходах'] },
  'ПРГ-2':{ req:['Кредитный договор','Решение комиссии'],                          opt:['Бизнес-план'] },
  'ПРГ-3':{ req:['Кредитный договор','Решение комиссии','Бизнес-план'],            opt:[] },
  'ПРГ-4':{ req:['Кредитный договор','Решение комиссии','Финансовая отчётность'],  opt:['Бизнес-план'] },
  'ПРГ-5':{ req:['Кредитный договор','Решение комиссии'],                          opt:['Финансовая отчётность'] },
  'ПРГ-6':{ req:['Кредитный договор','Решение комиссии','Бизнес-план'],            opt:['Справка о доходах'] },
  'ПРГ-7':{ req:['Кредитный договор','Решение комиссии','Финансовая отчётность'],  opt:['Бизнес-план'] },
  'ПРГ-8':{ req:['Кредитный договор','Решение комиссии'],                          opt:[] }
};
const PROGRAM_DOCS_DEFAULT = { req:['Кредитный договор','Решение комиссии'], opt:[] };
function programDocs(credit){
  return PROGRAM_DOCS[(credit && credit.origin && credit.origin.programId) || ''] || PROGRAM_DOCS_DEFAULT;
}
/* ---- Период между освоением и первым платежом (Шаг 18, Q3) — зеркало кредитной
   программы (`minDays`/`maxDays` в renderTab6 loan-program.html), тем же паттерном,
   что PROGRAM_DOCS. НЕ условие транша (не переговорная величина, а лимит-коридор) —
   валидация в gate('addDisbursement'), а не запись в conditionRecords. Значения —
   заглушка-плейсхолдер (широкий коридор, реальные цифры за владельцем программы),
   как PROGRAM_DOCS_DEFAULT — лучше не блокировать демо, чем выдумать точную цифру. */
const PROGRAM_DISB_WINDOW_DEFAULT = { min:1, max:120 };

/* courtRef / courtBasisLabel — ЕДИНСТВЕННЫЙ способ сослаться на решение из mirror.court.
   У зеркала суда нет собственного номера (date/kind/org/res/ok/file — Р-16), поэтому

   для ОДНОГО решения две несводимые группы журнала (ключ группы = basis.ref + kind). */
function courtRef(x){
  if (!x) return '';
  return x.num || ((x.kind || 'Решение суда') + ' от ' + (x.date || '—'));
}
function courtBasisLabel(ref){ return 'Решение суда · ' + ref; }

let _crSeq = 0;
/* CONDITION RECORD (Р-21) — запись «параметр × значение × дата вступления × основание».
   Лежит на ТРАНШЕ (Д-3): поля scope нет, транш и есть область действия. */
function mkConditionRecord(over){
  return Object.assign({
    id:'CR-' + (++_crSeq), param:'', value:null, effectiveFrom:'',
    basis:{ kind:'application', ref:'', label:'', date:'' },
    note:'', createdAt:TODAY, createdBy:currentRole
  }, over || {});
}
/* Порядок применения записей: по дате вступления; при равной дате — позже
   созданная; при равном createdAt — больший id (детерминизм сортировки). */
function crOrder(a, b){
  const d = pd(a.effectiveFrom) - pd(b.effectiveFrom);
  if (d) return d;
  const c = pd(a.createdAt) - pd(b.createdAt);
  if (c) return c;
  return String(a.id).localeCompare(String(b.id), undefined, { numeric:true });
}
/* conditionsAt(tranche, date) — действующий комплект транша на дату (Р-11, рантайм). */
function conditionsAt(tranche, date){
  const lim = pd(date || TODAY), out = {};
  ((tranche && tranche.conditionRecords) || [])
    .filter(r => r.effectiveFrom && pd(r.effectiveFrom) <= lim)
    .sort(crOrder)
    .forEach(r => { out[r.param] = r.value; });     // позже по порядку перекрывает раннее
  return out;
}
/* Первичный комплект (basis.kind='application'): условия, пришедшие из заявки.
   effectiveFrom = дата договора; ref = протокол комиссии из origin (Р-18). Общий хелпер —
   используется и при сидировании (seedPrimaryRecords), и при добавлении транша в кредит,
   уже прошедший регистрацию (addTranche, Р-21/Д-3: baseConditions — шаблон наследования). */
function mkPrimaryRecords(credit){
  const src = credit.baseConditions || condDefaults();
  /* basis.date — дата САМОГО документа-основания (протокола комиссии) из credit.docs,
     а не дата договора: подстановка credit.date давала одному документу две разные
     даты на двух вкладках карточки («Досье» vs журнал условий). Нет протокола в
     досье — оставляем пусто, журнал покажет «—», но не соврёт. */
  const kom = (credit.docs || []).find(x => x.kind === 'Решение комиссии');
  return PARAM_KEYS.map(k => mkConditionRecord({
    param:k, value:src[k], effectiveFrom:credit.date,
    basis:{ kind:'application',
            ref:credit.origin.commissionId || credit.origin.applicationId || '',
            label:'Заявка ' + (credit.origin.applicationId || '—') + ' · комиссия ' +
                  (credit.origin.commissionId || '—'), date:(kom && kom.date) || '' },
    note:'Первичный комплект условий из заявки', createdAt:credit.date
  }));
}
/* Первичный комплект ДОБАВЛЯЕТСЯ, а не затирает уже записанное (КВ-26): К-7 применяет
   свои ДС дверью restructureApplied прямо в сиде, и записи условий производных траншей
   существуют раньше этого прохода. Присваивание стирало их молча — производный транш
   выходил из сида на первичных условиях, будто ДС не было. Порядок в массиве значения
   не имеет: применение сортирует crOrder по дате вступления. */
function seedPrimaryRecords(credit){
  for (const t of credit.tranches) t.conditionRecords = mkPrimaryRecords(credit).concat(t.conditionRecords || []);
}
/* creditConditionsAt — Д-7: на уровне кредита условия суть агрегат по активным
   траншам. Согласны → {value}; разошлись → {divergent:true, values:[...]}.
   Тот же приём, что Р-13 для срока: кредит ничем не владеет, только сводит. */
/* ВНИМАНИЕ: согласие траншей сверяется по String(value) — для чисел и enum'ов демо
   этого достаточно, но 7 и '7' здесь равны. При типизированных значениях сверку
   придётся вести по типу, а не по строковому представлению. */
function creditConditionsAt(credit, date){
  const ts = credit.tranches.filter(activeTranche);
  const out = {};
  for (const k of PARAM_KEYS){
    const vals = ts.map(t => ({ trancheNo:t.no, value:conditionsAt(t, date)[k] }));
    const uniq = [...new Set(vals.map(v => String(v.value)))];
    out[k] = uniq.length <= 1 ? { value: vals.length ? vals[0].value : undefined }
                              : { divergent:true, values:vals };
  }
  return out;
}
/* divergenceRows — строки таблицы «Расхождения по траншам»: только параметры,
   по которым транши разошлись на указанную дату. */
function divergenceRows(credit, date){
  const agg = creditConditionsAt(credit, date);
  return PARAM_KEYS.filter(k => agg[k] && agg[k].divergent)
                   .map(k => ({ param:k, cells:agg[k].values }));
}
/* basisGroups — журнал изменений условий (Д-2/Д-6): записи всех траншей,
   сгруппированные по документу-основанию. «Что изменил документ» — производное:
   from = значение параметра на день ДО вступления, to = значение записи.
   Сортировка по дате вступления, новые сверху. */
function basisGroups(credit){
  const map = new Map();
  for (const t of credit.tranches){
    for (const r of (t.conditionRecords || [])){
      const key = (r.basis.ref || r.basis.label || r.basis.kind) + '@' + r.basis.kind;
      if (!map.has(key)) map.set(key, {
        key, ref:r.basis.ref || '—', kind:r.basis.kind,
        label:r.basis.label || BASIS_KINDS[r.basis.kind].label,
        docDate:r.basis.date || '', effectiveFrom:r.effectiveFrom, retro:false,
        trancheNos:[], items:[]
      });
      const g = map.get(key);
      const dayBefore = fd(addD(pd(r.effectiveFrom), -1));
      g.items.push({ param:r.param, from:conditionsAt(t, dayBefore)[r.param], to:r.value,
                     effectiveFrom:r.effectiveFrom, trancheNo:t.no, note:r.note });
      if (!g.trancheNos.includes(t.no)) g.trancheNos.push(t.no);
      if (pd(r.effectiveFrom) < pd(g.effectiveFrom)) g.effectiveFrom = r.effectiveFrom;
      // g.retro здесь — «факт задним числом» у ЭТОЙ группы журнала; не путать
      // с BASIS_KINDS[kind].retro — «разрешено ли задним числом» у вида
      // основания (Г-19). Разный смысл, случайное совпадение имени поля.
      if (r.effectiveFrom && r.createdAt && pd(r.effectiveFrom) < pd(r.createdAt)) g.retro = true;
    }
  }
  const out = [...map.values()];
  out.forEach(g => { g.trancheNos.sort((a,b) => a-b);
    g.items.sort((a,b) => PARAM_KEYS.indexOf(a.param)-PARAM_KEYS.indexOf(b.param) || a.trancheNo-b.trancheNo); });
  return out.sort((a,b) => pd(b.effectiveFrom) - pd(a.effectiveFrom));
}
/* retroFlags — Д-5: записи, вступившие в силу раньше дня своего создания.
   Автопересчёта нет: флаги питают красную плашку «требуется перегенерация
   графика» на вкладке «Условия» и близнецов на «Графике» и «Расчётах». */
function retroFlags(credit){
  const out = [];
  for (const t of credit.tranches) for (const r of (t.conditionRecords || [])){
    if (r.effectiveFrom && r.createdAt && pd(r.effectiveFrom) < pd(r.createdAt))
      out.push({ record:r, trancheNo:t.no, param:r.param,
                 effectiveFrom:r.effectiveFrom, basisLabel:r.basis.label || r.basis.ref });
  }
  return out;
}
/* retroPendingFlags — Д-5, ПОГАШЕНИЕ предупреждения: из retroFlags остаются только
   записи, которых активный график транша ещё не видел, то есть createdAt записи
   позже generatedAt действующей версии. Перегенерация графика (generateSchedule
   штампует generatedAt = TODAY) гасит плашку; новая ретро-запись зажигает её снова.
   Версия без generatedAt (сид/архив) считается построенной ДО записи — плашка горит.
   Транш без графика нечем перегенерировать — предупреждение остаётся.
   Даты в макете без времени, поэтому В ОДИН ДЕНЬ порядок разрешается счётчиком записей
   (_crSeq в id 'CR-n', снимок generatedSeq на версии графика): запись, созданная после
   перегенерации того же дня, снова зажигает предупреждение. */
function crSeqOf(r){ const n = +String((r && r.id) || '').split('-')[1]; return isFinite(n) ? n : 0; }
function retroPendingFlags(credit){
  return retroFlags(credit).filter(f => {
    const t = credit.tranches.find(x => x.no === f.trancheNo);
    const act = t ? scheduleAt(t, TODAY) : null;
    if (!act || !act.generatedAt) return true;
    const d = pd(f.record.createdAt) - pd(act.generatedAt);
    if (d) return d > 0;
    return crSeqOf(f.record) > (act.generatedSeq || 0);
  });
}
let _subjItemSeq = 0;
/* SUBJECT ITEM — строка предмета кредита {id,kind,name,qty,cost}. kind — свободный
   текст (КР-55): в отличие от предмета залога вид предмета кредита не читает ни один
   расчёт (coverage/индекс), справочник с дисконтом тут не нужен. */
function mkSubjectItem(over){
  return Object.assign({ id:'SI-' + (++_subjItemSeq), kind:'', name:'', qty:1, cost:0 }, over || {});
}
let _subjSeq = 0;
/* SUBJECT RECORD (КР-55, Р-21-паттерн) — предмет кредита append-only ПОСЛЕ регистрации.
   До регистрации предмет — обычный мутируемый массив credit.subject[] (editSubject,
   Г-9-режим «Проект», без записей). После — только через записи: action 'add' кладёт
   item под itemId, 'remove' снимает; старые записи не перезаписываются и не удаляются
   (Г-21), действующий состав — производная (subjectAt). Основание — доп. соглашение,
   в отличие от «Условий» без ветки «решение суда/постановление правительства»: смена
   предмета кредита такими основаниями по канону не оформляется. */
function mkSubjectRecord(over){
  return Object.assign({
    id:'SR-' + (++_subjSeq), action:'add', itemId:'', item:null,
    effectiveFrom:'', basis:{ kind:'agreement', ref:'', label:'', date:'' },
    note:'', createdAt:TODAY, createdBy:currentRole
  }, over || {});
}
/* subjectAt(credit, date) — действующий предмет кредита на дату (КВ-10-паттерн среза):
   база credit.subject + записи с effectiveFrom ≤ date в crOrder (та же сортировка,
   что и conditionsAt — она не завязана на «условия», годится и здесь). */
function subjectAt(credit, date){
  const lim = pd(date || TODAY);
  const out = new Map((credit.subject || []).map(it => [it.id, it]));
  (credit.subjectRecords || [])
    .filter(r => r.effectiveFrom && pd(r.effectiveFrom) <= lim)
    .sort(crOrder)
    .forEach(r => { if (r.action === 'remove') out.delete(r.itemId); else out.set(r.itemId, r.item); });
  return [...out.values()];
}
/* ОСИ ПЛАТЕЖА — словари МОДУЛЯ-ВЛАДЕЛЬЦА (спека платежей, швы №1/№2). Три оси
   независимы и в один `status` не схлопываются: платёж по шлюзу «Ожидает ЦК» уже
   двигает долг, а платёж «Сторно» виден, но денег не несёт. Прежняя редакция знала
   два значения оси сопоставления из пяти и писала в ось РЕГИСТРАЦИИ слово «ЦК» —
   словарь чужой оси (КР-45, КР-50). */
const PAY_REG   = ['Ручной ввод','Шлюз','Импорт ЦК'];
const PAY_MATCH = ['Ожидает ЦК','Подтверждён ЦК','Сторно (таймаут)','Восстановлен','Расхождение'];

/* ---- 2. seedDb() — 6 демо-цепочек К-1…К-6 + фон (§8). Свежие объекты на каждый вызов. ----

   ГЕНЕРАТОРЫ ЗЕРКАЛ. Зеркало по определению приходит из чужого модуля; в автономном
   макете его приходится сочинять. Функции ниже — ИМИТАТОРЫ соседних модулей, а не
   вторая реализация правил: они живут в сидировании, из derive/gate не вызываются
   и при подключении настоящих модулей выбрасываются целиком.                        */

/* Имитатор модуля залога: считает то, что кредит обязан получать готовым (ADR-0011) —
   залоговую стоимость по классам ликвидности ВИДА предмета, порог по составу и СВОЙ порог
   банковской гарантии. Зеркало несёт СУММЫ И ПОРОГИ, но не отношения: делить на базу —
   дело кредита, потому что база (сумма под риском) принадлежит кредиту и дрейфует от
   платежей. Владелец правила может отдать только снимок базы, поэтому отношение,
   посчитанное на его стороне, устаревает раньше, чем доедет (ЗР-1/ЗР-3 волны залога). */
function seedCoverageMirror(pledges, bankGuarantee, asOf, creditCurrency){
  let liquidValue = 0, illiquidValue = 0, hasMovableIlliquid = false, any = false;
  for (const p of (pledges || [])) for (const it of (p.items || [])){
    const v = (it.pledgeValue || 0) * (it.share == null ? 1 : it.share);
    any = true;
    if (itemIsLiquid(it)) liquidValue += v;
    else { illiquidValue += v; if (itemIsMovable(it)) hasMovableIlliquid = true; }
  }
  /* Истёкшая гарантия обеспечением не является и в индекс не входит (правило залога). */
  const expired = bankGuarantee && bankGuarantee.till ? pd(bankGuarantee.till) < pd(TODAY) : false;
  const bank = (bankGuarantee && !expired) ? (bankGuarantee.amount || 0) : 0;
  if (!any && !bankGuarantee) return null;              // залог ничего не подтверждал — зеркала нет
  const pledgeValue = round2(liquidValue + illiquidValue);
  const reqBase = hasMovableIlliquid ? 150 : 120;
  /* У ГАРАНТИИ СВОЙ ПОРОГ (ADR-0011, Прил.1 §2.3): 100 % в валюте кредита, 120 % в иной —
     курсовой запас. Прежняя редакция считала её «ликвидным составом с дисконтом 0 %» и
     тем самым подтягивала к ней залоговый порог: гарантия на весь долг при составе 150 %
     зачлась бы за 2/3 (КР-38). Дисконт снижает стоимость вещи, порог задаёт, сколько
     стоимости нужно; это разные величины, и у гарантии свой. */
  const gCur = bankGuarantee ? (bankGuarantee.currency || creditCurrency || 'KGS') : null;
  const guaranteeReq = bankGuarantee ? ((gCur === (creditCurrency || 'KGS')) ? 100 : 120) : null;
  return { pledgeValue, liquidValue:round2(liquidValue), illiquidValue:round2(illiquidValue),
           bankGuarantee:bank, guaranteeReq, guaranteeCurrency:gCur,
           guaranteeExpired:!!expired, guaranteeTill: bankGuarantee ? (bankGuarantee.till || null) : null,
           reqBase, liquidShareMin:80,
           source: hasMovableIlliquid ? 'Движимый неликвидный залог в составе ⇒ порог 150 % (Прил.1 §2.4)'
                                      : 'Ликвидный залог ⇒ порог 120 % (Прил.1 §2.3)',
           asOf: asOf || TODAY, module:'Залоговое обеспечение' };
}

/* Имитатор модуля платежей: раскладывает погашенное по статьям (ADR-0010 — разнесение
   принадлежит платежам, кредит его не выводит). Оси — словари ВЛАДЕЛЬЦА (PAY_REG/PAY_MATCH).
   `date` — дата фактического поступления денег; `bindDate` — дата привязки к кредиту,
   она бывает много позже (опознанное невыясненное поступление), и расчёт идёт от первой. */
function seedPayment(num, date, tranche, layers, over){
  const amount = round2((layers.principal||0) + (layers.interest||0) + (layers.penalty||0) + (layers.fees||0));
  return Object.assign({ num, date, bindDate:null, tranche, amount, currency:null, rate:null,
    reg:'Импорт ЦК', match:'Подтверждён ЦК', dispute:null,
    frozen:true, method:'денежными средствами', layers }, over || {});
}

/* Имитатор модуля взыскания: строка-ТРЕБОВАНИЕ (ADR-0002) = процесс × кредит ×
   обязанное лицо. Фаза здесь — свёртка журнала мер (ADR-0003), а не хранимое поле
   кредита: приходит уже вычисленной вместе с последней мерой. */
function seedClaim(o){
  return { claimId:o.claimId, processId:o.processId, obligor:o.obligor, scope:o.scope || 'Просроченная задолженность',
           phase:o.phase, stage:o.stage, unit:o.unit || 'Отдел по работе с проблемными активами',
           amount:o.amount || 0, since:o.since, lastMeasure:o.lastMeasure || '', costs:o.costs || 0 };
}

/* Версия графика, первая позиция которой отстоит от «сегодня» ровно на `days` дней:
   так демо-просрочка ВЫВОДИТСЯ из графика, а не задаётся полем. Прежний сид писал
   `days:95` прямо в строку ledger, и число ни от чего не зависело (КР-9). */
function seedSchedule(fromDate, days, principalTotal, rate, term, count){
  const first = addD(pd(TODAY), -Math.max(0, days || 0));
  const n = count || 4;
  const per = round2(principalTotal / Math.max(1, term));
  const rows = [];
  for (let k = 0; k < n; k++){
    const interest = round2((principalTotal - per * k) * (rate/100/12));
    rows.push({ no:k+1, date:fd(addM(first, k)), principal:per, interest, total:round2(per + interest) });
  }
  return { ver:1, validFrom:fromDate, by:{ kind:'engine', label:'Первичный график' },
           generatedFrom:fromDate, generatedAt:fromDate, generatedSeq:0, rows };
}
/* Подгруппа заёмщика по состоянию демо-кредита — имитатор `subgroupOf` карточки
   заёмщика (ADR-0012: считает ВЛАДЕЛЕЦ, кредит только показывает). */
function seedSubgroup(life, closureReason, overdueDays, claimStage){
  if (life === 'Закрыт') return closureReason === 'Списан' ? '4' : '5';
  if (/банкрот/i.test(claimStage || '')) return '3.1';
  if (/исполнит/i.test(claimStage || '')) return '2.2';
  if (/суд|иск|приказ/i.test(claimStage || '')) return '2.1';
  return (overdueDays > 0) ? '1.2' : '1.1';
}

        payments: bgPayments,

  /* --- Заявки: одобренная без кредита (Г-2 picker) + неодобренная --- */
  const applications = [
