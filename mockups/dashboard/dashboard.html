/* ================= Состояние стенда ================= */
let S;
function seed(){
  REPORTS.splice(0, REPORTS.length, ...JSON.parse(REPORTS_SEED));   // правки отчётов и созданные на ходу не переходят между прогонами
  JSON.parse(USERS_SEED).forEach(([id, roles])=>{ const u = USERS.find(x=>x.id===id); if(u) u.roles = roles.slice(); });   // снятые на стенде роли возвращаются
  TILES.splice(0, TILES.length, ...JSON.parse(TILES_SEED));
  Object.keys(STAND).forEach(k=>{ delete STAND[k]; }); Object.assign(STAND, JSON.parse(STAND_SEED));
  // panels — фильтр вкладки до конца сеанса (ключ «человек|вкладка»); lastTab — последняя открытая вкладка человека и collapsed —
  // свёрнутые секции («человек|вкладка|секция») помнятся между входами. Вход на стенде — смена пользователя; seed() — новый стенд.
  // asked — сколько раз плитка спросила у статистики основу (главное число, сдвиг, второе): свёрнутая секция не спрашивает
  S = { userId:'u1', tab:null, panels:{}, lastTab:{}, collapsed:{}, asked:{}, arrange:false, declared:JSON.parse(JSON.stringify(DECLARED_SEED)),
    overlays:{}, screens:{}, signals:[], sigN:0, notifs:[], journal:[], usage:{}, proposals:[], cache:new Map(), last:new Map(), clock:0, cacheHits:0, cacheMiss:0, seen:{}, exportLog:[], viewMem:{}, open:{},
    ms:0, warm:null, dawn:null,
    roleNews:{}, newMark:{}, newsFlash:null, layoutDraft:null, catQ:'', catOnly:false,
    pult:{ q:'', role:'all', state:'active', sort:{ k:'opens', dir:-1 }, open:{} }, kept:{},
    who:null, card:null, listCols:{}, workLists:[], link:null, cmp:null };
  // who — открытая панель «Кто в этом числе» (плитка, узел, путь, поиск, порядок, доля); card — карточка из списка с шагами; listCols —
  // «Колонки ▾» человека по типу объекта («человек|объект»); workLists — рабочие списки, заведённые в отчётности; link — открыто по ссылке;
  // cmp — переключатель экрана «Сравнить»: ключ базы сравнения или null («как задано»), едет в ссылке, из меню — снова null
  // roleNews — разовая плашка «Раскладка роли обновлена …» у держателя («человек|роль»), newMark — плитки с меткой «новая»; layoutDraft —
  // правка раскладки роли в редакторе до «Сохранить»; catQ, catOnly — поиск и «только доступные мне» каталога
  // S.panel — фильтр текущей вкладки, который сужает числа: значения вне охвата смотрящего в нём не участвуют; S.panelRaw — фильтр, как он
  // записан у вкладки (фишки, «Сохранить в экран», окно фильтра). Запись нормализует: значения поля — список, пустые поля выброшены
  Object.defineProperty(S, 'panel', { get:()=>{ const t = peekTab(); return panelSplit(user(), t.kind==='role' ? t.id : null, panelOfTab()).in; },
    set:v=>{ S.panels[tabKey()] = normPanel(v); }, enumerable:false, configurable:true });
  Object.defineProperty(S, 'panelRaw', { get:()=>panelOfTab(), enumerable:false, configurable:true });
  S.overlays['u2|cur'] = { order:[], hidden:[], added:['p-u2-agro'] };
  // область задана фильтром экрана, поэтому в паре Карты её нет: «программа × срок»
  S.screens.u1 = [{ id:'sc1', name:'Совещание по Ошу', items:['lead-od','lead-bal'], filter:{ region:['Ошская'] },
    pinned:{ 'lead-od':{ kind:'map', sel:{ dims:['program', 'bucket'] } } } },
    { id:'sc2', name:'Закрытые программы', items:['p-u1-rem'], filter:{}, pinned:{} }];
  syncObligTasks();   // задания по обязательствам — от настройки отчётности «напоминать за N к.д.» (стенд возвращает её к 7)
  return S;
}
function user(){ return USERS.find(u=>u.id===S.userId); }
function journal(action, detail, who){ S.journal.unshift({ at:TODAY.label, who: who || S.userId, action, detail }); }

/* ================= Раскладка: объявленная + личная перекладка ================= */
function tileAnswers(t){ // в раскладку попадает только плитка, которая отвечает (автопроверка); черновик каталога «ждёт отчёта» — не попадает
  if(!t) return false; if(t.state==='draft') return false;
  return reportAnswers(t);
}
function reportAnswers(t){ // отчёт плитки отвечает: модуль отчётности готов, объекты её чисел объявлены
  if(t.kind!=='link' && !STAND.reportsReady) return false;     // плитка — ссылка на отчёт: без модуля отчётности ей не на что ссылаться
  const q = questionOf(t); if(!q) return true;                 // отчёт не найден — плитка встаёт сломанной и называет причину
  return q.inds.every(i=>objReady(IND[i].obj) && !IND[i].refuses);
}
// автопроверка пройдена — или не пройден только предпросмотр оттого, что отчёт ещё не отвечает: плитка ждёт отчёта, а не сломана
function passes(ac, d){ return ac.ok || (!reportAnswers(d) && ac.checks.filter(c=>!c.ok).every(c=>c.text.startsWith('предпросмотр'))); }
// запуск роли — по отвечающим плиткам, а не по датам волн: предусловие — модуль отчётности и отчёты каталога; дальше роль получает свою
// объявленную раскладку, когда отвечает не меньше половины её плиток (плитки «ждёт меня» — ссылки на очереди модулей — не в счёте); до того —
// минимальная. { ok, n, of, why }: why — 'none' (своей раскладки нет), 'reports' (отчётность не готова), 'tiles' (отвечает меньше половины)
function roleLaunch(roleId){
  const L = S.declared[roleId]; if(!L) return { ok:false, n:0, of:0, why:'none' };
  const ts = L.filter(k=>!k.startsWith('s:')).map(tileById).filter(t=>t && t.kind!=='link' && t.state!=='withdrawn'), n = ts.filter(tileAnswers).length, of = ts.length;   // снятая у роли исчезает — не в счёте
  if(!STAND.reportsReady) return { ok:false, n, of, why:'reports' };

  return L.filter((k,i)=>!k.startsWith('s:') || (i+1<L.length && !L[i+1].startsWith('s:')));   // секция без отвечающих плиток не показывается

function overlay(uid, roleId){ const k = uid+'|'+roleId; return S.overlays[k] || (S.overlays[k] = { order:[], hidden:[], added:[] }); }
function composeLayout(uid, roleId){
  const D = declaredItems(roleId).filter(k=>!(tileById(k)||{}).state || tileById(k).state!=='withdrawn' || false);

  const pool = new Set([...D, ...ov.added]);

  [...D, ...ov.added].forEach(k=>{ if(!out.includes(k)) out.push(k); });   // новое у роли — в конец личной раскладки
  out = out.filter(k=>!ov.hidden.includes(k));

    if(t && t.state==='withdrawn') return ov.added.includes(k) ? 'x:'+k : null;   // у роли исчезает, в личной — заглушка
    return k; }).filter(Boolean);
}
function personalized(uid, roleId){ const ov = S.overlays[uid+'|'+roleId]; return !!ov && (ov.order.length || ov.hidden.length || ov.added.length); }
function arrangeMove(roleId, key, dir){ const u = user(); const ov = overlay(u.id, roleId);

function arrangeHide(roleId, key){ const ov = overlay(user().id, roleId); if(ov.added.includes(key)) ov.added = ov.added.filter(k=>k!==key); else ov.hidden.push(key); }

/* ================= Каталог: что видно и почему нельзя ================= */
function canSee(t, u){ // круг отчёта, затем право на вопрос у статистики

}
/* ---------- Каталог — витрина: секции по объекту, в строке — значения параметров и живое число ---------- */
// секция — объект вопроса плитки; объекты одного модуля-владельца — одной секцией (взыскание: требование, мера, дело; заявки: заявка,
// запись комиссии, заключение); эпизод просрочки — просрочка кредита, он в секции «Кредит»
const CAT_SECTIONS = [['Кредит', ['loan','spell']], ['Заёмщик', ['borrower']], ['Взыскание', ['claim','measure','case']], ['Имущество', ['asset']],

  ['Кредитная программа', ['program']], ['Обязательства', ['oblig']], ['Задания', ['task']]];
function catSection(t){ const q = questionOf(t), o = q && q.inds.length ? IND[q.inds[0]].obj : null, s = CAT_SECTIONS.find(([, os])=>os.includes(o)); return s ? s[0] : 'Прочее'; }
// значения параметров плитки словами — то, чем различаются плитки с одним именем: «куратор: я», «за прошлый месяц», «на конец прошлого
// месяца»; у ссылочной — очередь модуля-владельца
function paramChips(t){

  const r = reportById(t.report); if(!r) return [];
  const p = t.params || {}, out = [];
  Object.keys(r.params).forEach(n=>{

    else if(n==='period'){ const v = p.period || 'curMonth'; out.push(v==='ytd' ? 'с начала года' : 'за '+(PERIODS[v] || { label:String(v) }).label); }

// живое главное число строки — тот же вопрос, что у плитки, в охвате смотрящего (роль вкладки, куда добавят; у своего экрана — все роли),
// без фильтра вкладки; сдвиг, второе число и светофор каталогу не нужны
function catNum(t, u, roleId){ return cachedBy(cacheKey(t, u, roleId, {}, 'cat'), mainQ(t) || {}, ()=>{

// охват смотрящего по относительному параметру плитки пуст («куратор: я» у Руководства, а сам он не куратор): подсказка «у вас пусто»
// вместо нуля. Пустой охват — законный ответ, плитку можно поставить; ноль при непустом охвате («куратор: я», а просрочки нет) — число
const OBJ_MANY = { loan:'кредиты', borrower:'клиентов', program:'программы', claim:'требования', measure:'меры взыскания', case:'дела взыскания',

  receipt:'поступлений', payment:'платежей', coll:'предметов залога', rsapp:'обращений о реструктуризации', spell:'эпизодов просрочки', app:'заявок',
  comm:'записей комиссии', concl:'заключений', asset:'объектов имущества', oblig:'обязательств', task:'заданий' };
// условие признака словами: «Программа = Ремесленники», «Куратор = я»

const noneWhat = n=>{ const x = noneCond(n); return (OBJ_GEN[n.obj] || 'объектов')+' под «'+x.name+' = '+x.val+'»'; };
// признак ответа «нет объектов» по параметру словами: у относительного значения — «у вас пусто» с прежней подсказкой, у постоянного — «нет объектов»

// only — «только доступные мне» (есть или можно добавить); q — поиск по названию, показателю, объекту, параметрам, отчёту и очереди
function catalogView(u, opts){

  const rows = catalogFor(u).map(({ t, why, ready })=>{ const q = questionOf(t) || { inds:[] }, I = q.inds.length ? IND[q.inds[0]] : null, src = srcOf(t);

    // на вкладке роли плитка смотрит правами этой роли: не открыто ей — «Нельзя» с причиной, а не «Добавить» с «нет доступа» на плитке
    if(res && res.state==='noaccess' && status==='add'){ status = 'no'; why = 'Нельзя на вкладке «'+roleName(roleId)+'»: '+String(res.msg || '').replace(/^Нельзя: /, '').replace(/\.$/, '').replace('вашей роли', 'этой роли'); res = null; }
    const text = [t.title, catSection(t), ...q.inds.map(i=>IND[i].name), I ? OBJECTS[I.obj].name : '', ...paramChips(t), src ? (src.title || src.name || '') : ''].join(' · ').toLowerCase();
    const nn = res && LIVE.includes(res.state) ? noneOf(res.none) : null, empty = nn ? nn.msg : null;   // признак «нет объектов» — «у вас пусто» / «нет объектов», не ноль
    return { t, why, ready, status, section:catSection(t), params:paramChips(t), res, num:empty ? null : catNumText(t, res), empty, emptyLabel:nn ? nn.label : null,
      owner: t.kind!=='link' && !STAND.reportsReady ? 'Отчётность' : I ? OBJECTS[I.obj].owner : '—', text }; })   // без отчётности плитка ждёт её, а не объект
    .filter(x=>(!qs || x.text.includes(qs)) && (!opts.only || x.status==='has' || x.status==='add'));
  // строки «у вас пусто» и «нет объектов» — в конце своей секции, прочие — как были
  const sections = CAT_SECTIONS.map(([name])=>name).concat(['Прочее']).map(name=>({ name, rows:[...rows.filter(x=>x.section===name && !x.empty), ...rows.filter(x=>x.section===name && x.empty)] })).filter(s=>s.rows.length);

/* ================= Доступные отчёты ================= */
// отчёт открыт кругом отчётности (все · подразделения · только автор) и правом роли на его объект
// круг: все · только автор · названные подразделения; вложенные подразделения круг не включает — их называют отдельно
function circleOpen(r, u){ const c = (r && r.circle) || {}; return !!(c.all || (c.owner && c.owner===u.id) || (c.depts && c.depts.includes(u.dept))); }
// отчёт плитки не открыт смотрящему: причина, которую плитка пишет вместо числа; ссылочная плитка отчёта не имеет
function circleWhy(t, u){ const r = t && t.kind!=='link' && t.report && reportById(t.report); if(!r || circleOpen(r, u)) return null;
  return 'Нельзя: отчёт «'+r.title+'» не открыт вашему подразделению'+((r.circle||{}).owner ? ' — это личный отчёт '+userName(r.circle.owner) : ''); }
function reportText(r){ return [r.title, OBJECTS[r.obj].name, ...r.cols.map(i=>IND[i].name), ...r.dims.map(d=>DIMS[d].name)].join(' · ').toLowerCase(); }
function reportsFor(u, query){ const qs = String(query||'').trim().toLowerCase();
  return REPORTS.filter(r=>r.state==='active' && circleOpen(r, u) && u.roles.some(x=>hasRight(x, r.obj)) && (!qs || reportText(r).includes(qs)))
    .map(r=>({ r, feeds: TILES.filter(x=>x.report===r.id).length })); }
function timedReport(r){ return !!(r && (r.params.date || r.params.period)); }

/* ================= Отчёт плитки: что за отчёт, с какими значениями, что отвечает ================= */
const SHELF_LABEL = { catalog:'Общий отчёт каталога', personal:'Личный', official:'Официальный' };
// значение параметра по-человечески: «я», «все», «сегодня + 3 дн.», дата и период словами
function paramText(r, n, v){
  if(n==='date') return (DATE_MODES[v || 'today'] || {}).label || String(v);
  if(n==='period') return (PERIODS[v || 'curMonth'] || {}).label || String(v);
  if(v===undefined || v===null || v==='*') return 'все';
  const rel = paramLabel(v); return rel ? rel.replace(/[«»]/g, '') : String(v);
}
// значения параметров плитки на отчёте словами: [{ name, value }]
function paramList(r, p){
  const out = Object.keys(r.params).map(n=>({ name:r.params[n].name, value:paramText(r, n, p[n]) }));
  if(r.asOf) out.push({ name:'Дата', value:DATE_MODES[r.asOf].label+' (зашита в отчёт)' });
  return out;
}
function changedText(c){ return c ? 'отчёт изменён '+c.at+(c.who ? ' ('+userName(c.who).split(' ')[0]+')' : '')+(c.what ? ': '+c.what : '') : ''; }
// отметка «отчёт изменён» живёт, пока смотрящий не открыл текущую версию отчёта
function reportChangedFor(t, uid){ const r = t && t.report && reportById(t.report); if(!r || !r.changed) return null;
  return S.seen[uid+'|'+r.id]===r.version ? null : r.changed; }
// отчёты ведёт модуль «Отчётность»; макет имитирует его правки, чтобы показать, как они доходят до плиток
const tilesWord = n=>n+' '+(n%10===1 && n%100!==11 ? 'плитка' : n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20) ? 'плитки' : 'плиток');
function tilesOfReport(reportId){ return TILES.filter(t=>t.kind!=='link' && t.report===reportId && t.state!=='withdrawn' && t.state!=='accepted'); }
function reportEdit(id, change, who){
  const r = reportById(id); if(!r) return { error:'Отчёта нет в каталоге' }; const c = change || {}; let what;
  if(who && !canEditReport(r, who)) return { error:'Отчёт «'+r.title+'» правят владелец и соавторы: '+[r.owner, ...reportCoauthors(r)].map(userName).join(', ') };
  if(c.filter){ r.filter = cp(c.filter); what = 'фильтр'; }
  else if(c.removeCol){
    if(!r.cols.includes(c.removeCol)) return { error:'В отчёте «'+r.title+'» нет такой колонки' };
    if(r.cols.length<2) return { error:'Последнюю колонку не снять: в отчёте должна остаться хотя бы одна' };
    r.cols = r.cols.filter(i=>i!==c.removeCol); what = 'колонки'; }
  else if(c.removeParam){
    if(!r.params[c.removeParam]) return { error:'В отчёте «'+r.title+'» нет такого параметра' };
    (r.gone = r.gone || {})[c.removeParam] = r.params[c.removeParam].name; delete r.params[c.removeParam]; what = 'параметры'; }
  else if(c.state==='archived'){ r.state = 'archived'; what = 'отправлен в архив'; }
  else return { error:'Такой правки отчёт не знает' };

/* ================= Конструктор отчётности: черновик отчёта (вопрос) ================= */

// относительное значение («я», «моё подразделение», «сегодня + N») в отчёте не хранится: условие становится параметром отчёта, значение уходит плитке

// «похожий уже есть»: открытый смотрящему отчёт того же объекта, с теми же разрезами и постоянным фильтром, колонки которого покрывают черновик;

// плитка на собранном отчёте: значения «я», дата или период — из черновика; главное — число полосы (доля, % от итога группы) или первый показатель,

/* ================= Сборка плитки на отчёте и автопроверка ================= */
// черновик плитки: отчёт, значения его параметров, главное и второе число, сдвиг, светофор, умолчания пяти видов; своего вопроса нет

}

// пункты круга при публикации: роли, в чьих объявленных раскладках плитка стоит или встанет (forRoles), и их держатели; новая плитка вне раскладок — круг называется

const numShape = x => !x ? null : x.share ? (x.col || x.pct || x.of ? null : 'share') : x.pct ? (x.of ? null : 'pct') : x.col ? (x.of ? null : 'col') : x.of ? 'of' : null;
// пункты чисел: второе — того же объекта на ту же дату и не повторяет главное
function numChecks(d, r){ const m = d.main, s = d.second, out = [], cols = r.cols || r.inds, obj = objOf(r), where = r.module ? 'очереди «'+r.name+'»' : 'отчёта «'+r.title+'»';
  out.push({ ok: !!numShape(m) && numShape(m)!=='of', text:'главное число: колонка отчёта, доля двух колонок или % от итога группы' });

// «📌 на дашборд» из отчёта или вида: плитка встаёт сразу, с умолчаниями, в конец открытой вкладки главной; из окна отчёта плитки — с её
// значениями параметров. Форма — «Настроить» на самой плитке
// «📌» проверяет отчётность: бланк, отчёт не виден смотрящему, нет числовой колонки — отказ; ответ отчёта и остальную пригодность

function pinCheck(r, u){

function pinNow(reportId, fromTile){ const d = pinFromReport(reportId); if(!d) return { error:'Отчёт не найден' };

// «Отклонить» — с причиной; автор получает её уведомлением, плитка остаётся личной, предложить можно снова
function rejectProposal(id, reason){ const t = tileById(id), u = user(), p = proposalOf(id), why = String(reason || '').trim();
  if(!isAdmin(u)) return { error:'Отклоняет администратор дашборда' };
  if(!t || !p) return { error:'Предложения нет в очереди' };
  if(!why) return { error:'Причина обязательна: её получит автор' };
  t.proposed = false;
  Object.assign(p, { state:'rejected', reason:why, by:u.id, answeredAt:TODAY.label });
  const dup = dupOf(t).find(x=>why.includes(x.title));
  notify(t.owner, 'Предложение «'+t.title+'» отклонено: '+why+' ('+u.name+')', Object.assign({ kind:'proposal', tile:id }, dup ? { find:dup.title } : {}));
  journal('отклонил предложение', '«'+t.title+'» от '+userName(t.owner)+' · причина: '+why);
  return { ok:true, reason:why }; }
function publishDraft(id){ const t = tileById(id); if(!t || t.state!=='draft') return false;
  const ac = autocheck(t); if(!ac.ok) return { error:reportBroken(t) || 'Автопроверка не пройдена', checks:ac.checks }; t.state='published'; delete t.forRoles; journal('опубликовал плитку', t.title); return true; }
function whereUsed(id){
  const roles = Object.keys(S.declared).filter(r=>S.declared[r].includes(id));
  const personal = Object.keys(S.overlays).filter(k=>S.overlays[k].added.includes(id)).length;
  const scr = Object.values(S.screens).reduce((a,l)=>a+l.filter(s=>s.items.includes(id)).length, 0);
  return { roles, personal, screens:scr };
}
/* ---------- Неиспользуемые — подсказкой, снятие — руками, с заменой ---------- */
// «открывали за 90 дней» — обезличенный счётчик стенда: из ключа плитки (у плиток раскладок ролей — сотни, у остальных — от нуля до
// сорока; собранные на ходу — с нуля) плюс открытия в этом сеансе: полоса открылась или клик по числу, а не перерисовка главной
function opens90(t){ if(!t) return 0; const h = hash(t.id+'|o90'), inRoles = Object.values(DECLARED_SEED).some(L=>L.includes(t.id));
  const seedN = !TILES_SEED_IDS.has(t.id) ? 0 : inRoles ? 40 + h%360 : h%4===0 ? 0 : 1 + h%40;
  return seedN + ((S.usage[t.id] || {}).opens || 0); }
function daysSince(dmy){ const m = /^(\d\d)\.(\d\d)\.(\d{4})/.exec(dmy || ''), [y, mo, d] = TODAY.iso.split('-').map(Number); if(!m) return 0;
  return Math.round((Date.UTC(y, mo - 1, d) - Date.UTC(+m[3], +m[2] - 1, +m[1])) / 864e5); }
// кандидат на снятие — дело администратора, не автоснятие: в каталоге не меньше 90 дней, за 90 дней ни одного открытия, ни в одной
// раскладке роли; «Оставить» начинает отсчёт 90 дней заново
function withdrawCandidate(t){ return !!t && t.state==='published' && t.owner==='catalog' && daysSince(t.created)>=90 && opens90(t)===0 && !whereUsed(t.id).roles.length
  && (!S.kept[t.id] || daysSince(S.kept[t.id])>=90); }
// снятие называет, где плитка стоит; из раскладок ролей она уходит сразу (у держателей — «−1» в плашке), в личных раскладках и своих
// экранах остаётся заглушка «снята, замена: … · Заменить · Убрать» — живёт, пока человек её не уберёт; замена необязательна
function withdraw(id, repl){ const t = tileById(id); if(!t || !isAdmin(user())) return false; const w = whereUsed(id);
  const R = repl ? tileById(repl) : null;
  if(repl && (!R || R.state!=='published' || R.owner!=='catalog' || R.id===id)) return { error:'Замена — другая опубликованная плитка каталога' };
  t.state = 'withdrawn'; if(R) t.replacement = R.id; else delete t.replacement;
  w.roles.forEach(rid=>applyDeclared(rid, S.declared[rid].filter(k=>k!==id)));
  journal('снял плитку', t.title+' · роли: '+(w.roles.map(roleName).join(', ')||'—')+' · личных: '+w.personal+' · своих экранов: '+w.screens+' · замена: '+(R ? '«'+R.title+'»' : 'нет'));
  return Object.assign(w, { replacement: R ? R.id : null }); }
// «Заменить» на заглушке: замена встаёт на место снятой — в личной раскладке вкладки или в своём экране; уже стоит — заглушка просто уходит
function swapGone(id){ const t = tileById(id), R = t && t.replacement && tileById(t.replacement), u = user(), tab = curTab();
  if(!t || t.state!=='withdrawn') return { error:'Плитка не снята' };
  if(!R || R.state!=='published') return { error:'Замены нет — плитку можно только убрать' };
  if(tab.kind==='screen'){ const sc = screenById(tab.id); if(!sc || !sc.items.includes(id)) return { error:'Заглушки нет на этом экране' };
    sc.items = sc.items.includes(R.id) ? sc.items.filter(k=>k!==id) : sc.items.map(k=>k===id ? R.id : k); }
  else { const ov = overlay(u.id, tab.id); if(!ov.added.includes(id)) return { error:'Заглушки нет на этой вкладке' };
    const has = composeLayout(u.id, tab.id).includes(R.id);
    ov.added = has ? ov.added.filter(k=>k!==id) : ov.added.map(k=>k===id ? R.id : k);
    ov.order = has ? ov.order.filter(k=>k!==id) : ov.order.map(k=>k===id ? R.id : k); }
  return { ok:true, tile:R.id }; }
/* ---------- Раскладка роли: правка сразу, с отметкой у держателей ---------- */
function roleHolders(roleId){ return USERS.filter(u=>u.roles.includes(roleId)); }
const tileKeys = L=>L.filter(k=>!k.startsWith('s:'));
// разница двух раскладок: плитки «+» и «−»; перестановка, новая или убранная секция — «порядок»
function layoutDiff(before, after){ const add = tileKeys(after).filter(k=>!before.includes(k)), rem = tileKeys(before).filter(k=>!after.includes(k));
  const moved = before.filter(k=>after.includes(k)).join()!==after.filter(k=>before.includes(k)).join() || after.some(k=>k.startsWith('s:') && !before.includes(k)) || before.some(k=>k.startsWith('s:') && !after.includes(k));
  return { add, rem, moved }; }
function newsText(N){ return [N.add.length ? '+'+N.add.length : '', N.rem.length ? '−'+N.rem.length : '', N.moved ? 'порядок' : ''].filter(Boolean).join(', '); }
// новая раскладка роли — сразу у всех держателей; у каждого правки копятся в разовую плашку до «Показать» или «✕», новые плитки — «новая»
function applyDeclared(roleId, L2){ const L = S.declared[roleId], ch = layoutDiff(L.slice(), L2); L.splice(0, L.length, ...L2);
  const hs = roleHolders(roleId); if(ch.add.length || ch.rem.length || ch.moved) hs.forEach(h=>roleNewsAdd(h.id, roleId, ch));
  return Object.assign(ch, { holders:hs.map(h=>h.id) }); }
function roleNewsAdd(uid, roleId, ch){ const k = uid+'|'+roleId, N = S.roleNews[k] || { at:'', add:[], rem:[], moved:false };
  ch.add.forEach(x=>{ if(N.rem.includes(x)) N.rem = N.rem.filter(y=>y!==x); else if(!N.add.includes(x)) N.add.push(x); });
  ch.rem.forEach(x=>{ if(N.add.includes(x)) N.add = N.add.filter(y=>y!==x); else if(!N.rem.includes(x)) N.rem.push(x); });
  N.moved = N.moved || ch.moved; N.at = TODAY.label.slice(0, 5);
  if(N.add.length || N.rem.length || N.moved) S.roleNews[k] = N; else delete S.roleNews[k];
  const M = new Set(S.newMark[k] || []); ch.add.forEach(x=>M.add(x)); ch.rem.forEach(x=>M.delete(x)); S.newMark[k] = [...M]; }
function isNewTile(uid, roleId, id){ return !!roleId && (S.newMark[uid+'|'+roleId] || []).includes(id); }
// «новая» снимается при первом открытии полосы плитки — на любой вкладке человека
function unmarkNew(uid, id){ Object.keys(S.newMark).forEach(k=>{ if(k.startsWith(uid+'|')) S.newMark[k] = S.newMark[k].filter(x=>x!==id); }); }
// «новая» — до первого открытия полосы плитки или до закрытия плашки. «Показать»: плашка закрывается (метки — с ней), новые подсвечены
// рамкой, снятые названы строкой над сеткой — до ухода с вкладки
function roleNewsShow(uid, roleId){ const k = uid+'|'+roleId, N = S.roleNews[k]; if(!N) return null; delete S.roleNews[k]; delete S.newMark[k];
  S.newsFlash = { k, add:N.add.slice(), rem:N.rem.slice() }; return N; }
// «✕»: плашка закрыта, метки «новая» сняты
function roleNewsClose(uid, roleId){ const k = uid+'|'+roleId, had = !!S.roleNews[k]; delete S.roleNews[k]; delete S.newMark[k];
  if(S.newsFlash && S.newsFlash.k===k) S.newsFlash = null; return had; }
// круг отчёта новой плитки роли покрывает всех её держателей
function declGap(roleId, key){ const t = tileById(key), r = t && t.kind!=='link' && t.report && reportById(t.report), gaps = r ? circleGaps(r, [roleId]) : [];
  return gaps.length ? { error:'Не поставлено: '+gaps.map(gapText).join('; '), checks:gaps.map(g=>({ ok:false, text:gapText(g) })) } : null; }
function declaredEdit(roleId, op, key, arg){ if(!isAdmin(user())) return false; const L = S.declared[roleId]; if(!L) return false;
  const L2 = L.slice(), i = L2.indexOf(key);
  if(op==='add' && !L2.includes(key)){ const g = declGap(roleId, key); if(g) return g; L2.push(key); }
  if(op==='remove' && i>=0) L2.splice(i,1);
  if(op==='move' && i>=0){ const j = i+arg; if(j>=0 && j<L2.length){ [L2[i],L2[j]]=[L2[j],L2[i]]; } }
  const ch = applyDeclared(roleId, L2);

// правка в редакторе раскладок — черновиком на странице; «Сохранить» применяет её сразу, до этого видно, скольких держателей она затронет
function declaredSave(roleId, items){ if(!isAdmin(user())) return { error:'Раскладки ролей правит администратор дашборда' }; const L = S.declared[roleId];

  return Object.assign({ ok:true }, ch); }

/* ================= Выгрузка со штампом ================= */
// вид словами — для штампа и журнала: какой вид, по каким разрезам и колонкам
function viewText(res){ const nm = d=>'«'+(DIMS[d] ? DIMS[d].name : d)+'»', s = res.sel || {};
  switch(res.kind){
    case 'slice': return 'Разрез по '+nm(s.dim)+(res.plan && res.mode!=='change' ? ', план-факт' : res.funnel && res.mode!=='change' ? ', воронкой' : '');
    case 'table': return 'Таблица по '+nm(s.dim)+': '+((res.table && res.table.cols) || []).map(c=>c.name).join(' · ');
    case 'map': return res.axes==='trans' ? 'Карта, переходы по '+nm(s.tdim)+': на дату базы × сегодня' : 'Карта '+nm((s.dims || [])[0])+' × '+nm((s.dims || [])[1]);
    case 'series': return 'Ряд за '+s.points+' мес., '+(s.of==='second' ? 'второе' : 'главное')+' число'+(s.by ? ', по разрезу '+nm(s.by) : '');
    case 'cohort': return 'Когорты по '+(s.per==='m' ? 'месяцам' : 'кварталам')+' '+((res.cohort || {}).name || 'начала');
    case 'move': { const m = res.move; return m ? 'Движение с '+startLabel(m.B)+' по '+(m.D ? dayLabel(m.D) : m.M===0 ? 'сегодня' : monthEndLabel(m.M)) : 'Движение, '+(s.month===0 ? 'текущий' : 'прошлый')+' месяц'; }
  }

// штамп по правилам отчётности: плитка, отчёт и его версия, значения параметров словами, паспорт, охват, «не официальный документ», кто и когда;
// у выгрузки из полосы — ещё вид, путь крошек и пометка «разрез на время просмотра»
function stampOf(tile, res){
  const u = user(); const r = tile.kind!=='link' && tile.report && reportById(tile.report);
  const ps = r ? paramList(r, tile.params || {}).map(x=>x.name+' — '+x.value) : [];
  const vw = !!res.kind && (VIEW_KINDS.includes(res.kind) || res.kind==='cohort') && !!res.sel;
  return [ 'Плитка: '+tile.title,
    ...(r ? ['Отчёт: «'+r.title+'», версия '+r.version+', владелец '+userName(r.owner)] : []),
    ...(ps.length ? ['Значения параметров: '+ps.join('; ')] : []),
    ...(vw ? ['Вид: '+viewText(res), ...(res.path && res.path.length ? ['Путь: '+pathText(res.path)] : []), ...(res.temp ? ['Разрез на время просмотра'] : [])] : []),
    'Паспорт: '+(res.passport ? (vw ? res.passport.replace(' · разрез на время просмотра', '') : res.passport) : '—'),
    ...(S.cmp && mainQ(tile) && qKind(mainQ(tile))==='stock' ? ['Сравнение: '+STOCK_BASES[S.cmp].label+(res.shift && res.shift.at ? ' ('+res.shift.at+')' : res.baseAt ? ' ('+res.baseAt+')' : res.move ? ' (на '+startLabel(res.move.B)+')' : '')+' — переключатель экрана'] : []),
    'Охват: '+(res.visible!==undefined ? 'видно '+nbsp(res.visible) : '—')+(res.panelApplied && res.panelApplied.length ? ' · фильтр: '+res.panelText : ' · фильтр панели: нет'),
    'НЕ ЯВЛЯЕТСЯ ОФИЦИАЛЬНЫМ ДОКУМЕНТОМ. Документ с номером и подписью выпускает модуль «Отчётность».',
    'Выгрузил: '+u.name+', '+TODAY.label ];

// kind: 'pdf' | 'xlsx'; strip — открытая полоса { kind, sel, path }: выгружается её вид с путём, без неё — основа плитки
function exportTile(tileId, kind, roleId, strip = null){
  const t = tileById(tileId), u = user();

    tb.rows.forEach(r=>rows.push([r.label, ...r.cells.map((c, i)=>fv(c, tb.cols[i].unit))])); rows.push(['итог', ...tot.map((c, i)=>fv(c, tb.cols[i].unit))]); }
  if(res.heat){ const h = res.heat; rows.push(['', ...h.cols.map(c=>dimLabel(h.d2, c))]);
    h.rows.forEach((a, i)=>rows.push([dimLabel(h.d1, a), ...h.cells[i].map(c=>fv(c, res.unit))])); rows.push(['итог', fv(tot.v, res.unit)]); }
  (res.series ? res.series.points : []).forEach(p=>rows.push([p.label, ...p.vals.map(v=>fv(v, res.unit))]));
  if(res.move) rows.push(['начало', fv(res.move.start, res.unit)], ['конец', fv(res.move.end, res.unit)]);

    tr.vals.forEach((v, i)=>rows.push([lb(v), ...tr.cells[i].map(c=>fv(c.base, res.unit)), fv(tr.gone[i].base, res.unit), fv(tr.rowTot[i].value, res.unit)]));
    rows.push(['новые', ...tr.neu.map(c=>fv(c.now, res.unit)), '', '']); rows.push(['итог сегодня', ...tr.colTot.map(c=>fv(c.value, res.unit)), '', fv(tr.now, res.unit)]); }

    view: strip ? { kind:res.kind, sel:JSON.parse(JSON.stringify(res.sel)), temp:!!res.temp } : null, path });   // журнал выгрузок отчётности: что выгружено — основа или вид, и по какому пути
  journal('выгрузил '+(kind==='pdf'?'PDF':'Excel'), t.title+(strip ? ' · '+viewText(res)+(path.length ? ' · путь: '+pathText(path) : '') : '')+' · '+(res.passport||''));
  return { stamp, rows, csv, kind, view:strip ? res.kind : null };
}

/* ================= Сигналы отчётности по порогам светофора ================= */
function tlLimits(t){ return t ? [t.red, t.yellow].filter(Array.isArray) : []; }    // green:true/false — не порог
function tlCond(unit, x){ return x[0]+' '+(unit==='pct' ? String(x[1]).replace('.',',')+' %' : fmtVal(x[1], unit)); }
function condHit(op, lim, v){ return v!==null && v!==undefined && (op==='>' ? v > lim : v < lim); }
function signalsOf(uid, tileId){ return S.signals.filter(s=>s.owner===uid && s.tile===tileId); }
function signalToggle(tileId, roleId){ // 🔔: по сигналу на каждый порог; создание не уведомляет — сигнал срабатывает на переходе
  const u = user(); const t = tileById(tileId); const mine = signalsOf(u.id, tileId);
  if(mine.length){ S.signals = S.signals.filter(s=>!mine.includes(s)); return false; }   // снять можно всегда, даже у сломанной плитки
  if(t && t.kind==='link') return { error:'У плитки очереди нет отчёта — сигнал ставится на отчёт' };
  const why = t && reportBroken(t); if(why) return { error:why };                  // у сломанной плитки порогам не с чем сравнивать
  const m = t; const lims = tlLimits(m && m.tl); if(!lims.length) return { error:'У плитки нет порогов светофора' };
  const r = ask(t, u, roleId, {}); const val = (r.state==='ok' || r.state==='zero') ? tlValue(m, r) : null; const unit = tlUnit(t);   // число, на котором висит светофор
  return lims.map(x=>{ const s = { id:'sg'+(++S.sigN), owner:u.id, roleId, tile:tileId, version:t.version, report:t.report || null, params:JSON.parse(JSON.stringify(t.params || {})),
      op:x[0], v:x[1], label:tlCond(unit, x), state:condHit(x[0], x[1], val), last:val }; S.signals.push(s); return s; });
}
function signalRemove(id){ const n = S.signals.length; S.signals = S.signals.filter(s=>!(s.id===id && s.owner===S.userId)); return S.signals.length < n; }
function nightCheck(){ // раз в день после ночного снимка; уведомление — только на переходе в условие, на возврат в норму тихо
  if(STAND.nightRunFailed) return { skipped:'ночной снимок не прошёл — сигналы не проверялись' };
  const fired = [], dropped = [];
  // плитку сняли, удалили или изменили после постановки — сигналы на ней снимаются, владелец получает одну строку на плитку
  S.signals = S.signals.filter(s=>{ const t = tileById(s.tile); const gone = !t || t.state==='withdrawn'; if(!gone && t.version===s.version) return true;
    if(!dropped.some(n=>n.to===s.owner && n.tile===s.tile)){ const n = { to:s.owner, tile:s.tile, signal:s.id, at:TODAY.label, read:false, dropped:true,
        text:'Сигнал снят: плитка «'+(t ? t.title : s.tile)+'» '+(gone ? 'снята' : 'изменена') };
      dropped.push(n); S.notifs.unshift(n); }
    return false; });
  fired.dropped = dropped;
  fired.published = publishWaiting();
  S.signals.forEach(s=>{ const u = USERS.find(x=>x.id===s.owner); const t = tileById(s.tile); if(!u || !t) return;
    const r = ask(t, u, s.roleId, {}); if(r.state!=='ok' && r.state!=='zero') return;
    const v = tlValue(t, r), unit = tlOn(t)==='second' ? (r.second || {}).unit : r.unit;
    const now = condHit(s.op, s.v, v);
    if(now && !s.state){ const n = { to:s.owner, tile:s.tile, signal:s.id, at:TODAY.label, read:false,
        text:t.title+' '+s.label+' — '+fmtVal(v, unit)+(s.last!==null && s.last!==undefined ? ' (было '+fmtVal(s.last, unit)+')' : '') };
      S.notifs.unshift(n); fired.push(n); }
    s.state = now; s.last = v; });
  return fired;
}

/* ================= Кэш: ключ «вопрос + охват» ================= */
function scopeKey(t, u, roleId){ const q = questionOf(t) || { filter:[], inds:[] };   // «я» в значении параметра — ключ личный
  const personal = (q.filter||[]).some(c=>typeof c.v==='string' && c.v.startsWith('@')) || q.inds.some(i=>OBJECTS[IND[i].obj].vis==='self');
  const rs = viewerRoles(u, roleId).slice().sort().join(',');
  return personal ? 'user:'+u.id+':'+rs : 'roles:'+rs+':'+u.dept;
}
// отчёт и его версия — правка отчёта обесценивает ответ сразу; значения параметров лежат в плитке, её версия — в ключе
// у вида в ключе ещё вид, выбор и путь; у мини-ряда — свой ключ; черновик меняется без версии — в ключе и его числа, светофор и умолчания
// в ключе — стенд, который меняет ответ (очередь и медленная отчётность меняют только «когда», а не «что»), и версия данных — отдельной частью:
// последний ответ плитки (очередь при перегрузе) ищется без неё
const STAND_WHEN = ['overload', 'slow', 'fresh', 'dataAt'];
const standKey = ()=>JSON.stringify(STAND, (k, v)=>STAND_WHEN.includes(k) ? undefined : v);
const lastKey = k=>k.replace(/§v\d+(?=§|$)/, '');
function cacheKey(t, u, roleId, panel, extra){ const r = t.kind!=='link' && t.report && reportById(t.report);
  return [t.id, t.version, t.report || '', r ? r.version+':'+r.state : 'нет отчёта', JSON.stringify(t.params || {}), JSON.stringify([t.main, t.second, t.shift, S && S.cmp && t.id ? S.cmp : null, t.tl, t.views]),
    scopeKey(t,u,roleId), circleWhy(t,u) ? 'круг закрыт' : '', JSON.stringify(normPanel(panel)), standKey(), 'v'+STAND.fresh]
    .concat(extra ? [extra] : []).join('§'); }
// перегруз отчётности (стенд): вопрос ждёт в очереди сам, «Повторить» нет. Плитке — её последний ответ из кэша (хоть ночной прогрев) со своей датой и
// «⚠ устарело · на 14:02, сейчас считается»; нет его — «в очереди». Полоса (view) прошлых чисел не показывает — только «в очереди». Флаг сняли —
// ответ приходит, замена сама. Свежий ответ кэша (в пределах срока жизни) отдаётся как обычно: спрашивать незачем
const QUEUE_TIP = 'Отчётность перегружена: вопрос ждёт в очереди, ответ заменит число сам — нажимать ничего не нужно';
let calcAtNow = null;                                          // время расчёта у ночного прогрева — время прогона, а не показа
function cachedBy(k, q, fn, view){
  const live = q.period ? PERIODS[q.period].partial : (q.date||'today')==='today';
  const hit = S.cache.get(k); const ttl = live ? 1 : 1e9;      // «сегодня» — не дольше минуты; закрытый день — до следующего прогона
  if(hit && S.clock - hit.at < ttl){ S.cacheHits++; return hit.res; }
  if(STAND.overload){ const last = !view && S.last.get(lastKey(k)); return last ? queuedLast(last) : { state:'queued', msg:'В очереди: отчётность перегружена' }; }
  S.cacheMiss++; const res = fn(), at = calcAtNow || nowTime(); S.cache.set(k, { at:S.clock, res, calcAt:at }); S.last.set(lastKey(k), { res, calcAt:at }); return res;
}
// последний ответ при перегрузе: число со своей датой, жёлтая рамка и метка «⚠ устарело · на 14:15, сейчас считается»
function queuedLast(last){ const r = last.res, at = last.calcAt; if(!r || typeof r!=='object' || !LIVE.includes(r.state)) return r;
  const tip = QUEUE_TIP+'. Сейчас показан последний ответ — на '+at+'.';
  return Object.assign({}, r, { staleState:true, queuedAt:at, stale:'отчётность перегружена — последний ответ на '+at+', новый в очереди',
    marks:[{ kind:'warn', text:'⚠ устарело · на '+at+', сейчас считается', tip }, ...(r.marks || []).filter(x=>!/^⚠ устарело/.test(x.text))] }); }
/* ---------- Ночной прогрев и утренний пик ---------- */
// вопрос к отчётности — отчёт (у ссылочной — очередь модуля) + значения параметров + дата + охват (ключ общего кэша): у плиток на одном отчёте с теми же
// значениями и у держателей с одним охватом ответ один. Части ответа плитки: главное число на её дату (второе — тот же отчёт и дата) и база сдвига —
// на свою, закрытую дату. live — «сегодня» (день или период не закрыт)
function tileAsks(t, u, roleId){ const q = !reportBroken(t) && mainQ(t); if(!q) return [];
  const src = srcOf(t), key = (t.report || t.queue)+'|'+JSON.stringify(t.params || {})+'|'+scopeKey(t, u, roleId), at = q.period || q.date || 'today';
  const out = [{ key:key+'|'+at, live:liveOf(q) }], rule = shiftRule(t, src, q);
  // у остатка — все пять баз сравнения (переключатель экрана мгновенный); базы с одной датой — один вопрос
  if(rule.key==='period') out.push({ key:key+'|база '+at, live:false });
  else if(rule.key){ const pt = (DATE_MODES[q.date || 'today'] || DATE_MODES.today).point;
    [...new Set(CMP_ORDER.map(k=>baseMonth(k, pt)))].forEach(bm=>out.push({ key:key+'|база на '+startLabel(bm), live:false })); }
  return out; }
// раскладки ролей в охвате каждого держателя: вопросы на закрытые даты (их прогревают ночью) и «сегодня» (их считают утром); держатели — у кого
// роль со своей раскладкой; tiles — плитки, чьё главное число на закрытую дату (ответ плитки целиком — в кэше)
function warmPlan(){ const closed = new Set(), today = new Set(), holders = new Set(), tiles = [];
  USERS.forEach(u=>u.roles.forEach(r=>{ if(!roleHasLayout(r)) return; holders.add(u.id);
    declaredItems(r).forEach(k=>{ const t = !k.startsWith('s:') && tileById(k); if(!t || t.state==='withdrawn' || !tileAnswers(t)) return;
      const as = tileAsks(t, u, r); as.forEach(a=>(a.live ? today : closed).add(a.key)); if(as.length && !as[0].live) tiles.push([t, u, r]); }); }));
  return { closed:closed.size, today:today.size, holders:holders.size, tiles }; }
// после ночного прогона дашборд сам спрашивает числа на закрытые даты (все базы сравнения, вчера, прошлый месяц) для плиток объявленных раскладок ролей
// в охвате каждого держателя и держит их в кэше до следующего прогона. Личные плитки, свои экраны и полоса — по требованию
function prewarm(){
  if(STAND.nightRunFailed) return { skipped:'ночной прогон не прошёл — закрытые даты не прогреты' };
  const P = warmPlan(), ov = STAND.overload; STAND.overload = false; calcAtNow = WARM_AT;   // ночью очереди нет
  try { P.tiles.forEach(([t, u, r])=>cachedAsk(t, u, r, {})); } finally { calcAtNow = null; STAND.overload = ov; }
  return S.warm = { n:P.closed, m:P.holders, at:WARM_AT }; }
const WARM_AT = '02:40';
// утро: держатели открывают свои раскладки — к отчётности уходят вопросы, которых нет в кэше. С прогревом — только «сегодня», без него — и закрытые даты
function morningLoad(){ const P = warmPlan();
  return S.dawn = { requests:P.today + (S.warm ? 0 : P.closed), today:P.today, closed:P.closed, warm:!!S.warm, holders:P.holders }; }
function cachedAsk(t, u, roleId, panel){ return cachedBy(cacheKey(t, u, roleId, panel), questionOf(t) || {}, ()=>ask(t, u, roleId, panel)); }
function cachedBase(t, u, roleId, panel, path){
  if(!(path && path.length)) return cachedAsk(t, u, roleId, panel);
  return cachedBy(cacheKey(t, u, roleId, panel, 'base§'+JSON.stringify(path || [])), mainQ(t) || {}, ()=>baseOf(t, u, roleId, panel, path)); }
function cachedMini(t, u, roleId, panel){ return cachedBy(cacheKey(t, u, roleId, panel, 'mini'), mainQ(t) || {}, ()=>miniOf(t, u, roleId, panel), true); }
function cachedView(t, kind, sel, path, u, roleId, panel){ const s = viewSel(t, kind, sel, u, path, panel, roleId);
  return cachedBy(cacheKey(t, u, roleId, panel, 'view§'+kind+'§'+JSON.stringify(s)+'§'+modeOf(sel)+'§'+JSON.stringify(path || [])), mainQ(t) || {}, ()=>viewOf(t, kind, sel, path, u, roleId, panel), true); }

/* ================= Пять видов в полосе ================= */
const VIEW_KINDS = ['series','slice','map','move','table'];
// разрезы полосы: объявленные отчётом (у ссылочной — очередью) сверху, ниже остальные разрезы объекта «на время просмотра»;
// зафиксированные панелью или путём — не предлагаются
function dimsFor(t, path, panel){
  const src = srcOf(t); if(!src) return [];
  const obj = objOf(src), fixed = new Set((path || []).map(x=>x.dim));
  // разрез закреплён панелью, только когда в поле одно значение; отмечено несколько — разрез по нему показывает их по отдельности
  Object.keys(PANEL).forEach(k=>{ if(panelVals(panel, k).length===1 && panelApplies(obj, k)) fixed.add(panelDim(obj, k)); });
  const rest = src.module ? [] : (OBJ_DIMS[obj] || []).filter(d=>!src.dims.includes(d));
  return [...src.dims.map(d=>({ dim:d, temp:false })), ...rest.map(d=>({ dim:d, temp:true }))].filter(x=>!fixed.has(x.dim))
    .map(x=>Object.assign(x, { name:DIMS[x.dim].name, ordered:!!DIMS[x.dim].ordered }));
}
// «доля» в Таблице — вычисляемая колонка, показателя не заводит: числитель к знаменателю по строке, в итоге — второе число плитки;
// у плитки с долей (второе число, а нет его — главное) она предлагается среди колонок и считается в четыре
const SHARE_COL = 'share';
function shareOf(t){ const s = t && (t.second && t.second.share ? t.second : t.main && t.main.share ? t.main : null);
  return s ? { inds:s.share.slice(), name:'доля'+(s.label ? ' '+s.label : '') } : null; }
// колонки Таблицы: того же рода, что главное; объявленные отчётом сверху, затем «доля», ниже остальные показатели объекта
function colsFor(t){
  const m = t, src = srcOf(t); if(!src) return [];
  const stock = IND[numSpec(m, 'main', src).inds[0]].kind==='stock';
  const same = i=>IND[i] && (IND[i].kind==='stock')===stock && !STAND.withdrawn[i] && !IND[i].refuses;
  const own = (src.cols || src.inds).filter(same);
  const rest = src.module ? [] : Object.values(IND).filter(x=>x.obj===objOf(src) && !own.includes(x.id) && same(x.id)).map(x=>x.id);
  const sh = shareOf(m), share = sh && sh.inds.every(i=>same(i) && (src.cols || src.inds).includes(i)) ? [{ id:SHARE_COL, temp:false, name:sh.name, unit:'pct', share:true }] : [];
  const col = temp=>i=>({ id:i, temp, name:IND[i].name, unit:IND[i].unit });
  return [...own.map(col(false)), ...share, ...rest.map(col(true))];
}
// плитка пуста по закону на свою дату — причина ответа; «крупнейшие» ранжируют по её числу, и у такой плитки их нет
const lawOf = (t, u, roleId, panel, path)=>{ const b = u && cachedBase(t, u, roleId, panel || {}, path || []); return b && b.state==='mine0' ? b.msg : null; };
// выбор вида: выбор человека ?? его память ?? умолчание автора ?? первые разрезы отчёта
function viewSel(t, kind, sel, u, path, panel, roleId){
  const m = t, src = srcOf(t); sel = sel || {}; if(!src) return {};
  const mem = ((S.viewMem || {})[(u && u.id)+'|'+t.id] || {})[kind] || {}, def = (m.views || {})[kind] || {};
  const free = dimsFor(t, path, panel).map(x=>x.dim);   // разрез, зафиксированный панелью или путём, не берётся и из выбора
  const big = bigOK(t) && !lawOf(t, u, roleId===undefined ? curRole() : roleId, panel, path), okDim = d=>free.includes(d) || (d==='big' && big);   // «крупнейшие» — в выборе разреза у плитки-суммы
  const dimOf = k=>[sel[k], mem[k], def[k]].find(okDim) || free[0] || null;
  const bn = ()=>[sel.bn, mem.bn, def.bn].map(Number).find(n=>[5, 10, 20].includes(n)) || 10;   // сколько крупнейших — своей строкой
  const withBn = o=>[o.dim, o.by, ...(o.dims || [])].includes('big') ? Object.assign(o, { bn:bn() }) : o;
  if(kind==='cohort') return { per:[sel.per, mem.per, def.per].find(x=>x==='q' || x==='m') || 'q' };
  if(kind==='series'){ const pts = [sel.points, mem.points, def.points].find(n=>[6,12,24].includes(n)) || 12;
    const of = [sel.of, mem.of, def.of].find(x=>x==='main' || x==='second') || 'main', o = { points:pts, of: of==='second' && secondHist(t) ? 'second' : 'main' };
    // Ряд по разрезу: «итог | по разрезу ▾»; без выбора — итог
    const by = ['by' in sel ? sel.by : 'by' in mem ? mem.by : def.by].find(okDim);
    return by ? withBn(Object.assign(o, { by, top:[sel.top, mem.top, def.top].find(n=>n>0) || 3 })) : o; }
  if(kind==='slice') return withBn({ dim:dimOf('dim'), top:[sel.top, mem.top, def.top].find(n=>n>0) || 3 });
  if(kind==='map'){ const want = (sel.dims || mem.dims || def.dims || []).filter(okDim);
    const o = { dims:[...new Set([...want, ...free])].slice(0, 2) };
    // оси Карты: два разреза или Переходы — тот же разрез на дату базы × сегодня (разрез со значением на дату базы)
    if([sel.axes, mem.axes, def.axes].find(x=>x==='trans' || x==='two')==='trans'){ const obj = objOf(src), hs = free.filter(d=>dimHist(obj, d));
      if(hs.length) Object.assign(o, { axes:'trans', tdim:[sel.tdim, mem.tdim, def.tdim, o.dims[0]].find(d=>hs.includes(d)) || hs[0] }); }
    return withBn(o); }
  if(kind==='move'){ const dt = mvDateOf(t); return { month: dt && dt.only!==undefined ? dt.only : [sel.month, mem.month, def.month].find(n=>n===0 || n===-1) || 0 }; }
  const cs = colsFor(t).map(x=>x.id), pick = a=>(a || []).filter(i=>cs.includes(i)), main = mainCol(t, cs);
  let cols = [sel.cols, mem.cols, def.cols].map(pick).find(a=>a.length) || pick(numSpec(m, 'main', src).inds);
  if(main) cols = [main, ...cols.filter(c=>c!==main)];      // первая колонка — показатель плитки: по ней порядок строк
  if(!cols.length) cols = cs.slice(0, 1);
  return withBn({ dim:dimOf('dim'), cols:cols.slice(0, 4) });
}
// колонка Таблицы, которая и есть главное число плитки: показатель, а у доли — «доля», если это доля плитки
function mainCol(t, cs){ const src = srcOf(t), sp = src && numSpec(t, 'main', src); if(!sp) return null;
  if(sp.share){ const sh = shareOf(t); return sh && sh.inds.join('|')===sp.share.join('|') && cs.includes(SHARE_COL) ? SHARE_COL : null; }
  return cs.includes(sp.inds[0]) ? sp.inds[0] : null; }
// «Сумма | Изменение» — один на полосу: выбор лежит в выборе полосы (sel.mode), новое открытие — «Сумма»
function modeOf(sel){ return sel && sel.mode==='change' ? 'change' : 'sum'; }
// «Изменение» погашено с причиной, когда у плитки нет базы сдвига: без истории, без даты, неполный период;
// у потока за текущий месяц — «неполный месяц не с чем сравнить»; одна причина на всю полосу — база у плитки одна
function changeOff(t, u, roleId, panel, path){
  const b = cachedBase(t, u, roleId, panel || {}, path); if(!LIVE.includes(b.state)) return b.msg || 'плитка не отвечает';
  const sh = b.shift; if(!sh) return 'у плитки нет базы сравнения'; if(!sh.none) return null;   // база до запуска — строки переноса: «Изменение» есть
  const q = mainQ(t, path); return sh.none===PARTIAL && qKind(q)==='flow' && (q.period || 'curMonth')==='curMonth' ? OPEN_MONTH : sh.none; }
// Движение кончается датой плитки: сегодня — текущий или прошлый месяц; конец прошлого месяца — только прошлый (конец Движения — главное
// число); дата не сегодня и не конец месяца (последний закрытый день) — вид погашен: Движение идёт от конца месяца до конца следующего
const MV_PREV_ONLY = 'текущий месяц кончается сегодня, а дата плитки — конец прошлого месяца: Движение — только прошлый месяц';
// окно Движения по переключателю экрана (§5.12): от базы сравнения до даты плитки при любой её дате; «как задано» — null (месяц, правило ниже)
function mvWindowOf(t){ const q = S.cmp && mainQ(t); if(!q || qKind(q)!=='stock') return null; const pt = (DATE_MODES[q.date || 'today'] || DATE_MODES.today).point;
  return { mvMonth:pt.m, mvFrom:baseMonth(shiftKeyOf(t), pt), mvEndDay:pt.day || undefined }; }
// окно Движения, начатое до запуска, отвечается строками переноса; чего перенос не дал — вид погашен с причиной из ответа

      if(x){ const hh = x.dir==='flat' ? 0 : Math.max(2, Math.round(Math.abs(d) * kd)), neg = d<0;
        sl += (hh ? `<span class="sr-b ${x.cls}${neg ? ' dn' : ''}${lt ? ' lt' : ''}" style="bottom:${neg ? zero - hh : zero}px;height:${hh}px"></span>` : '')
          +`<span class="sr-v ${x.cls}" style="bottom:${neg ? zero - hh - 18 : zero + hh + 3}px">${dtxt}</span>`; }
      else if(none) sl += `<span class="sr-nb" style="bottom:${zero + 4}px"${tipAttr('Без сдвига: '+p.none)}>без сдвига</span>`;
      else if(p.down || p.downD) sl += `<span class="sr-nb" style="bottom:${zero + 4}px"${tipAttr(p.down || 'Нет разницы: '+p.downD)}>—</span>`; }
    // нет ответа на эту дату: точка «—», разница у неё и у следующей — «—», причина — подсказкой
    const under = p.down && chg ? `<span class="sr-d none"${tipAttr(p.down)}>—</span>` : chg ? `<span class="sr-d sum">${serNum(sc, v)}</span>`
      : p.down || p.downD ? `<span class="sr-d none"${tipAttr(p.down || 'Нет разницы: '+p.downD)}>—</span>`
      : none ? `<span class="sr-d ${none.cls}"${tipAttr('Без сдвига: '+p.none)}>${esc(none.text)}</span>`
      : x ? `<span class="sr-d ${x.cls}${p.legacyD ? ' lgd' : ''}"${p.legacyD ? tipAttr('Редакции формы разные: до запуска — из легаси') : ''}>${dtxt}</span>` : `<span class="sr-d">&nbsp;</span>`;
    const tip = [mon+' '+my.y+' · '+(p.down ? p.down : fmtVal(v, unit)), p.legacy ? 'из легаси: строки переноса, до запуска системы' : p.closed ? 'месяц закрыт' : p.open && p.openLabel ? 'не закрыт · '+(s.flow ? 'за ' : '')+p.openLabel : 'месяц не закрыт',
      p.legacyD ? 'разница к '+bn+': редакции формы разные — до запуска из легаси' : '', p.noneObj || '',
      x ? x.tip : none ? 'Без сдвига: '+p.none+(p.plan ? ' · '+none.text : '') : '', bs && bs.m===p.m ? 'База сдвига плитки — '+bs.label+': конец этого месяца, '+bs.at : '', p.down || p.legacy ? '' : 'Клик — кто в этом числе'].filter(Boolean).join('\n');
    const ls = p.cnt===undefined || p.cnt===null ? '' : `<span class="sr-q"><button class="ls${p.cnt ? '' : ' zero'}${whoOn(t.id, { m:p.m }) ? ' who-on' : ''}" data-tip="Кто в этом числе: ${nbsp(p.cnt)} стр. · ${mon} ${my.y}" onclick="event.stopPropagation();${month(p.m)}">☰ ${nbsp(p.cnt)}</button></span>`;
    return `<div class="sr-c${p.open ? ' cur' : ''}${bs && bs.m===p.m ? ' base' : ''}${p.legacy ? ' lg' : ''}" data-m="${p.m}"${tipAttr(tip)}><div class="sr-sl">${p.down ? '' : `<button type="button" class="sr-hit" aria-label="${esc('Кто в этом числе: '+mon+' '+my.y)}" onclick="event.stopPropagation();${month(p.m)}"></button>`}${sl}</div><div class="sr-m">${lab}${under}${ls}</div></div>`; }).join('');
  const mean = s.flow ? 'за месяц' : unit==='sum' ? 'остаток на конец месяца' : 'на конец месяца';
  const lead = chg ? (unit==='pct' ? 'п.п.' : sc.name)+' · изменение к прошлому месяцу' : sc.name+' · '+mean;
  const tail = (chg ? '; под месяцем — '+(unit==='pct' ? '%, ' : '')+mean : unit==='pct' ? '; разница под месяцем — в п.п.' : '');
  const plan = pts.some(p=>p.none && p.plan);
  return `<div class="sr-cap"><b>${esc(lead)}</b>${esc(tail)}</div>`+scrollBox(`<div class="sr sr-n${n} ${chg ? 'chg' : 'sum'}${plan ? ' sr-pl' : ''}" style="--n:${n}"><div class="sr-grid">${cols}</div></div>`, 'ряд');
}

// Карта: названия 220 px, ячейки делят остаток поровну; справа итог строки, снизу итог столбца, в углу общий. В ячейке одно число — то, что нарисовано цветом.
// «Сумма»: значение, цвет — величина. «Изменение» (res.mode): разница к базе, красный — хуже, зелёный — лучше по направлению показателя (как стрелка сдвига плитки),
// насыщенность — по модулю; у показателя без направления — синий по модулю, знак — в стрелке. В итогах под числом мелко второе: в «Сумме» — разница цветом по направлению,
// в «Изменении» — сумма. Единица одна на всю Карту — в строке над таблицей, числа без единицы (serScale/serNum, не выше «млн»). «☰ N» — в углу ячейки и итога при наведении
// (на касании — под числом); клик по ячейке — глубже или список. Ячейка без вклада — «—»
function hmBody(res, q, ops, go){
  const h = res.heat, unit = res.unit, tot = res.total || {}, has = v=>v!==null && v!==undefined;
  if(!h.rows.length || !h.cols.length) return '<div class="state-msg">В карте нет строк</div>';
  const diff = !!res.baseLabel && !!h.deltas && tot.delta!==undefined, chg = diff && res.mode==='change', lab = res.baseLabel || '';
  const I = IND[q.inds[0]] || {}, dirOk = I.dir==='up_good' || I.dir==='up_bad', pp = unit==='pct';
  const nums = [].concat(h.cells.flat(), h.rowTot.map(x=>x.value), h.colTot.map(x=>x.value), [tot.v]);
  if(diff) nums.push(...h.deltas.flat(), ...h.rowTot.map(x=>x.delta), ...h.colTot.map(x=>x.delta), tot.delta);
  const sc = serScale(res, nums), maxV = Math.max(1e-9, ...h.cells.flat()), maxD = Math.max(1e-9, ...(diff ? h.deltas.flat().filter(has).map(Math.abs) : []));
  const sCls = v=>{ const k = (v || 0) / maxV; return k<=0 ? 'hm-e' : k<.15 ? 'hm-s1' : k<.3 ? 'hm-s2' : k<.5 ? 'hm-s3' : k<.7 ? 'hm-s4' : k<.85 ? 'hm-s5' : 'hm-s6'; };
  const dx = d=>has(d) ? rzDelta(q, res, d) : null;   // направление и цвет — те же, что у разницы Разреза и сдвига плитки
  const dTxt = (x, d)=>!x ? '—' : x.dir==='flat' ? '0' : (x.dir==='up' ? '▲ ' : '▼ ')+serNum(sc, Math.abs(d));
  const dCls = (x, d)=>{ if(!x || x.dir==='flat') return 'hm-z'; const k = Math.abs(d) / maxD, lv = k>=.6 ? 3 : k>=.3 ? 2 : 1;
    return (dirOk ? (x.tone==='bad' ? 'hm-r' : 'hm-g') : 'hm-n')+lv; };
  const dTip = n=>{ if(!diff || !has(n.delta)) return ''; const x = rzDelta(q, res, n.delta), p = rzPct(n.pct);
    return 'Изменение '+x.text+(p ? ' ('+p+')' : '')+' '+lab+(has(n.base) ? ' · было '+fmtVal(n.base, unit) : ''); };
  const tip = (name, n)=>tipAttr([name+': '+fmtVal(n.value, unit), dTip(n), ...mvTipLines(n.moves, unit)].filter(Boolean).join('\n'));   // у итогов строк и столбцов — «пришли из / ушли в»
  const cell = (i, j)=>({ value:h.cells[i][j], base:diff ? h.bases[i][j] : null, delta:diff ? h.deltas[i][j] : null, pct:diff ? h.pcts[i][j] : null, cnt:h.cnt ? h.cnt[i][j] : undefined });
  const corner = html=>html ? `<span class="hm-q">${html}</span>` : '', lsOf = (d, v, n)=>ops && n ? corner(ops.ls(d, v, null, null, n)) : '';   // «☰ 0» в углу не нужен: пустому нечего показывать
  // итог: главное число и мелко второе — в «Сумме» разница, в «Изменении» сумма
  const totTd = (n, cls, name, extra)=>{ const x = dx(n.delta), sum = has(n.value) ? serNum(sc, n.value) : '—';
    const main = chg ? `<span class="${x ? x.tone : 'flat'}">${dTxt(x, n.delta)}</span>` : sum;
    const sub = chg ? `<span class="s2">${sum}</span>` : res.pendBase ? '<span class="s2 pend">…</span>' : diff && x ? `<span class="s2 ${x.tone}">${dTxt(x, n.delta)}</span>` : '';
    return `<td class="${cls}"${res.pendBase ? '' : tip(name, n)}>${main}${sub}${extra}</td>`; };
  const dn = h.down || {};   // строка без ответа: «—» в клетках и в итоге строки, причина — подсказкой; не кликается
  const rows = h.rows.map((r, i)=>{ const rn = String(dimLabel(h.d1, r));
    if(dn[i]) return `<tr><td class="rl"${tipAttr(dn[i])}>${esc(rn)}${DN_TAG}</td>${h.cols.map(()=>`<td class="dn"${tipAttr(dn[i])}>—</td>`).join('')}<td class="t dn"${tipAttr(dn[i])}>—</td></tr>`;
    const tds = h.cols.map((c, j)=>{ const n = cell(i, j), cn = dimLabel(h.d2, c), x = chg ? dx(n.delta) : null,
      empty = !n.value && !n.cnt && (!chg || !n.base), cls = empty ? 'hm-e' : chg ? dCls(x, n.delta) : sCls(n.value), txt = empty ? '—' : chg ? dTxt(x, n.delta) : serNum(sc, n.value);
      return `<td class="c ${cls}"${empty ? tipAttr(rn+' × '+cn+': нет объектов') : tip(rn+' × '+cn, n)} onclick="event.stopPropagation();${go(h.d1, r, h.d2, c)}">${txt}${ops && n.cnt ? corner(ops.ls(h.d1, r, h.d2, c, n.cnt)) : ''}</td>`; }).join('');
    return `<tr><td class="rl"${rn.length>26 ? tipAttr(rn) : ''}>${esc(rn)}</td>${tds}${totTd(h.rowTot[i], 't', rn, lsOf(h.d1, r, h.rowTot[i].cnt))}</tr>`; }).join('');
  const head = `<tr><th class="l"${tipAttr('Строки — '+DIMS[h.d1].name+', столбцы — '+DIMS[h.d2].name)}>${esc(DIMS[h.d1].name+' \\ '+DIMS[h.d2].name)}</th>${h.cols.map(c=>`<th>${esc(dimLabel(h.d2, c))}</th>`).join('')}<th>итог</th></tr>`;
  const foot = `<tr class="tr"><td class="rl">итог</td>${h.colTot.map((x, j)=>totTd(x, '', dimLabel(h.d2, h.cols[j]), lsOf(h.d2, h.cols[j], x.cnt))).join('')}${totTd(Object.assign({}, tot, { value:tot.v }), 't', 'Итог', ops && res.cnt ? corner(ops.all(res.cnt)) : '')}</tr>`;
  const asOf = String(res.passport || '').split(' · ')[0].replace(/^сегодня, /, '');
  const lead = chg ? (pp ? 'п.п.' : sc.name)+' · изменение '+lab : sc.name+(asOf ? ' · '+asOf : '');
  const tail = chg ? '; '+(dirOk ? 'красный — хуже, зелёный — лучше' : 'цвет — размер изменения')+'; в итогах под разницей — сумма'
    : '; цвет — величина'+(diff ? '; в итогах под суммой — разница '+lab+(pp ? ', п.п.' : '') : '');
  return `<div class="sr-cap"><b>${esc(lead)}</b>${esc(tail)}</div>`
    + scrollBox(`<table class="heat"><colgroup><col class="hm-lab">${h.cols.map(()=>'<col>').join('')}<col class="hm-tc"></colgroup>${head}${rows}${foot}</table>`, 'карта');
}

// «⋯» экрана: перекладка, «Вернуть как объявлено», выгрузка; у своего экрана — переименовать и удалить. На телефоне — только выгрузка

// меню у кнопки «⋯»: справа под ней, в пределах окна; Escape и клик мимо закрывают, фокус возвращается на «⋯»

// поля окна фильтра: значения — в охвате смотрящего (на вкладке роли — её охват, на своём экране — всех ролей человека), отмеченные —
// фильтр вкладки; значение вне охвата в списке не стоит — оно названо под полем и переживает «Применить»
function filterFields(u, roleId, panel){ const P = normPanel(panel), sp = panelSplit(u, roleId, P);
  return Object.keys(PANEL).map(k=>({ k, name:PANEL[k], opts:panelScope(u, roleId, k), checked:sp.in[k] || [], out:sp.out[k] || [] })); }
// окно фильтра на странице: три поля, в поле — несколько значений; «Применить» ставит фильтр вкладке

    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>el.classList.remove('drag-over'));

if(HAS_DOM){ document.addEventListener('mousemove', e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); const tip = $('tip');
  if(el){ tip.textContent = el.dataset.tip; tip.style.display='block'; tip.style.left = Math.min(e.clientX+12, window.innerWidth-290)+'px'; tip.style.top = (e.clientY+14)+'px'; } else tip.style.display='none'; });
  // без наведения (телефон, касание) подсказка — по касанию: у элемента с подсказкой встаёт под ним, касание в другом месте её снимает
  document.addEventListener('click', e=>{ if(!window.matchMedia('(max-width:600px), (hover:none)').matches) return;

    if(el){ const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.style.display='block'; tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth-290))+'px'; tip.style.top = (r.bottom+6)+'px'; } else tip.style.display='none'; }, true);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });
  // окно сузилось или расширилось: ряды сетки сменились, полосы встают на новые места
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(()=>{ if(view==='home' && Object.keys(S.open).length && gridCols()!==lastCols) render(); else markScroll(); }, 120); }); }

      : 'Отчёт «'+r.report.title+'»: версия '+r.report.version+', плиток на нём '+r.tiles.length)); render(); return r; },
  standWithdraw:(i,v)=>{ if(v) STAND.withdrawn[i]='11.10'; else delete STAND.withdrawn[i]; S.cache.clear(); render(); },
  // сборка плитки на отчёте и черновик отчёта (ниже) — заглушка конструктора отчётности для «📌» и смоука; в интерфейсе дашборда их нет
  newDraft:(reportId)=>{ draft = blankDraft(reportId); render(); return draft; },
  pin:(reportId, fromTile)=>{ const r = pinNow(reportId, fromTile);
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast('📌 не поставлена: '+(f ? f.text : r.error)); render(); return r; }
    view = 'home'; render(); toast('Плитка «'+r.tile.title+'» на главной, в конце вкладки «'+r.tab.name+'». Настроить — «⋯» на плитке'); return r; },
  // «Настроить»: ящик с формой плитки; правка — черновиком, «Сохранить» — новая версия
  configure:(id)=>{ const t = tileById(id); if(narrow()){ toast('Настроить плитку можно на компьютере'); return null; } if(!canConfigure(t, user())){ toast('Эту плитку вам не настроить'); return null; }
    draft = Object.assign(cleanTile(t)); sheet = { kind:'cfg', tile:id }; render(); return draft; },
  cfgSave:()=>{ const sh = sheet && sheet.kind==='cfg' ? sheet : null, t = sh && tileById(sh.tile); if(!t || !draft || !canConfigure(t, user())) return null;
    const patch = cleanTile(draft); delete patch.report; const r = editTile(t.id, patch);
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast(r.error+(f ? ': '+f.text : '')); render(); return r; }
    draft = null; closeOverlay(); render(); toast('Плитка «'+t.title+'» сохранена — версия '+t.version); return r; },
  // «Опубликовать в каталог» у администратора: ящик с ролями и автопроверкой
  publishAsk:(id)=>{ const t = tileById(id); if(narrow()){ toast('Опубликовать в каталог можно на компьютере'); return null; } if(!t || t.owner!==user().id || !isAdmin(user())){ toast('Публикует администратор дашборда свою плитку'); return null; }
    sheet = { kind:'pub', tile:id, roles:[] }; render(); return publishCheck(id, []); },
  pubRole:(role, on)=>{ if(!sheet || sheet.kind!=='pub') return; const set = new Set(sheet.roles); if(on) set.add(role); else set.delete(role); sheet.roles = [...set]; render(); },
  publishOwn:(id, roles)=>{ const rs = roles || (sheet && sheet.kind==='pub' && sheet.tile===id ? sheet.roles : []), r = publishOwn(id, rs);
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast(r.error+(f ? ': '+f.text : '')); render(); return r; }
    closeOverlay(); render(); toast(r.waits ? 'В каталоге черновиком «ждёт отчёта» — выйдет сам, когда отчёт ответит' : 'Опубликована в каталог: у вас плитка заменена каталожной'); return r; },
  // «взять его» у похожего отчёта — в отчётности; здесь — черновик плитки на нём с тем, что задано в черновике отчёта
  rTake:(id)=>{ const d = rdraft && takeSimilar(rdraft, id); if(!d){ toast('Отчёт не подходит черновику'); return null; } draft = d; return d; },
  dParam:(n,v)=>{ const d = tileDraft(); const r = reportById(d.report);
    if(!r || !r.params[n]){ render(); return toast(n==='date' || n==='period' ? 'Отчёт не объявил дату — плитка её не перекраивает' : 'Отчёт не объявил параметр «'+n+'»'); }
    if((n==='date' && !DATE_MODES[v]) || (n==='period' && !PERIODS[v])){ render(); return toast('Такой даты нет'); }
    d.params[n] = v; fitShift(d); render(); },
  // главное и второе число: колонка, доля, «из N», % от итога группы; из строки формы — по её элементу
  dMain:(...a)=>{ const d = tileDraft(), r = reportById(d.report); if(a[0] && a[0].closest) a = rowArgs(a[0]);
    const x = numFrom(r, ...a); if(!x || x.error || x.of){ render(); return toast(x && x.error || 'Главное число — колонка, доля или % от итога группы'); }
    d.main = x; fitShift(d); render(); return d.main; },
  dSecond:(...a)=>{ const d = tileDraft(), r = reportById(d.report); if(a[0] && a[0].closest) a = rowArgs(a[0]);
    if(a[0]==='label'){ if(d.second){ const v = String(a[1] || '').trim(); if(v) d.second.label = v; else delete d.second.label; } render(); return d.second; }
    if(a[0]==='none'){ d.second = null; render(); return null; }
    const x = numFrom(r, ...a); if(!x || x.error){ render(); return toast(x ? x.error : 'Такого второго числа нет'); }
    const m0 = d.main && numSpec(d, 'main', r), ids = numSpec({ second:x }, 'second', r).inds;
    if(m0 && ids.some(i=>isStock(i)!==isStock(m0.inds[0]))){ render(); return toast('Остаток и поток в одной плитке не складываются: у плитки одна дата или один период'); }
    const nm = i=>IND[i].name; x.label = x.share ? 'от «'+nm(x.share[1])+'»' : x.pct ? 'от итога группы' : nm(x.col || x.of).toLowerCase();
    d.second = x; render(); return d.second; },
  dShift:(id)=>{ const d = tileDraft(), sh = shiftsFor(d), b = sh.find(x=>x.id===id);
    if(!b || !b.ok){ render(); return toast(b ? b.why : sh[0].why || 'Такой базы сдвига нет'); }
    d.shift = id; render(); return d.shift; },
  dView:(kind,key,v)=>{ const d = tileDraft(); if(!VIEW_KINDS.includes(kind)){ render(); return toast('Такого вида нет'); }
    if(['points','top','month'].includes(key)) v = Number(v);
    d.views = Object.assign({}, d.views, { [kind]:Object.assign({}, (d.views || {})[kind], { [key]:Array.isArray(v) ? v.slice() : v }) }); render(); return d.views[kind]; },
  dTl:(k,op,val)=>{ const d = tileDraft();
    if(k==='on'){ if(op==='none'){ d.tl = null; render(); return null; }
      if(op==='second' && !d.second){ render(); return toast('Второго числа у плитки нет'); }
      d.tl = Object.assign({ green:true }, d.tl, { on:op }); render(); return d.tl; }
    d.tl = d.tl || { green:true, on:'main' }; const cur = d.tl[k] || [k==='red'?'>':(d.tl.red?d.tl.red[0]:'>'), 0];
    if(op) cur[0]=op; if(val!==null && val!==undefined){ if(val===''){ delete d.tl[k]; if(!d.tl.red && !d.tl.yellow) d.tl=null; render(); return; } cur[1]=Number(val); }
    d.tl[k]=cur; render(); return d.tl; },
  dTitle:(v)=>{ tileDraft().title=v; render(); },
  dRoles:(role, on)=>{ const d = tileDraft(); const set = new Set(d.forRoles || []); if(on) set.add(role); else set.delete(role); d.forRoles = [...set]; render(); },
  saveDraft:(mode)=>{ const r = saveTile(tileDraft(), mode); if(r.error){ toast(r.error); return r; }
    if(mode==='personal' && S.tab){ if(S.tab.kind==='screen') screenAdd(S.tab.id, r.tile.id); else arrangeAdd(S.tab.id, r.tile.id); }
    toast(mode==='personal'?'Личная плитка добавлена в конец вкладки':mode==='draft'?'Черновик сохранён':'Плитка опубликована в каталог'); draft=null; view = mode==='personal'?'home':'registry'; render(); return r; },
  // черновик отчёта: вопрос собирает только конструктор отчётности
  newReportDraft:()=>{ rdraft = blankReportDraft(); condDraft = { f:'', op:'', v:null }; render(); return rdraft; },
  // «📌 сохранить отчётом» из полосы: черновик из вида полосы уходит в конструктор отчётности — он открывается в модуле «Отчётность»
  saveAsReport:(k)=>{ const rd = stripReportDraft(k); if(rd.error){ toast(rd.error); return rd; }
    rdraft = rd; condDraft = { f:'', op:'', v:null }; toast('Конструктор отчётности открыт в модуле «Отчётность»: «'+rd.title+'». Сохраните отчёт и поставьте «📌»'); return rdraft; },
  rSet:(k,v)=>{ if(!['obj','share','date','period','title'].includes(k)){ render(); return toast('Отчёт задаёт объект, показатели, разрезы, фильтр и дату — показ задаёт плитка'); }
    if(k==='obj'){ const first = Object.values(IND).find(x=>x.obj===v && !x.refuses); rdraft = Object.assign(blankReportDraft(), { obj:v, inds:[first.id] }); rdraft.filter = defaultFilterOf(rdraft); condDraft = { f:'', op:'', v:null }; }
    else { const rd = reportDraft(); if(k==='share') rd.share = v ? rd.inds.slice(0,2) : null; else rd[k]=v; }
    render(); return rdraft; },
  rInd:(id,on)=>{ const rd = reportDraft(); const wasDefault = sameJson(rd.filter, defaultFilterOf(rd));
    if(on){ const sameKind = (IND[id].kind==='stock') === (IND[rd.inds[0]].kind==='stock');
      if(sameKind && rd.inds.length>=4){ render(); return toast('Не больше четырёх показателей'); }
      if(!sameKind && rd.inds.length>1){ render(); return toast('Остаток и поток в одном отчёте не складываются: у отчёта одна дата или один период — сначала снимите прежние показатели'); }
      if(sameKind) rd.inds.push(id); else rd.inds = [id];            // единственный показатель другого рода — отчёт меняет род
    } else if(rd.inds.length>1) rd.inds = rd.inds.filter(x=>x!==id);
    if(wasDefault) rd.filter = defaultFilterOf(rd);                 // фильтр, который пользователь правил, не трогаем
    if(rd.share && rd.inds.length!==2) rd.share=null; render(); },
  rDim:(d,on)=>{ const rd = reportDraft(); rd.dims = on ? [...rd.dims, d].slice(-2) : rd.dims.filter(x=>x!==d); render(); },
  rFilter:(f,v)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter(c=>!(c.f===f && paramLabel(c.v))); if(v) rd.filter.push({ f, op:String(v).startsWith('@today+') ? 'le' : 'eq', v }); render(); },
  rCond:(target,k,v)=>{ const rd = reportDraft(); if(condDraft.target!==target) condDraft = { target, f:'', op:'', v:null };
    if(k==='f'){ const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===v); condDraft = { target, f:v, op: F ? (F.dim ? 'eq' : 'gt') : '', v:null }; }
    else if(k==='op'){ condDraft.op = v; if(v!=='in' && v!=='nin' && Array.isArray(condDraft.v)) condDraft.v = condDraft.v[0] || null; }
    else condDraft.v = v; render(); },
  rCondAdd:(target)=>{ const rd = reportDraft(); const c = condDraft; if(c.target!==target || !c.f || !c.op) return toast('Выберите поле, сравнение и значение');
    const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===c.f); let v = c.v;
    if(F.dim){ v = [].concat(v===null||v===undefined ? [] : v).filter(x=>x!==''); if(!v.length) return toast('Выберите значение'); if(c.op==='eq'||c.op==='ne') v = v[0]; }
    else { if(v===null || v==='' || isNaN(Number(v))) return toast('Введите число'); v = Number(v); }
    const cond = { f:c.f, op:c.op, v };
    rd.filter = [...rd.filter, cond];   // условия складываются по «и»: можно задать полосу «> 30 и ≤ 90»
    condDraft = { f:'', op:'', v:null }; render(); return cond; },
  rCondDel:(target,i)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter((_,j)=>j!==i); render(); },
  rTitle:(text)=>api.rSet('title', text),
  rSaveAndPlace:()=>{ const r = saveAndPlace(reportDraft(), curRole());
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast(r.error+(f ? ': '+f.text : '')); render(); return r; }
    toast('Личный отчёт «'+r.report.title+'» собран в отчётности, «📌» — плитка в конце вкладки'); rdraft = null; draft = null; condDraft = { f:'', op:'', v:null }; view = 'home'; render(); return r; },
  // администратор
  // снятие — окно на странице: где стоит и необязательная замена
  withdrawAsk:(id)=>openWithdraw(id),
  // пульт «Плитки дашборда»: поиск перерисовывает только каталог — фокус остаётся в поле; секции раскрываются щелчком по строке
  pultFind:(q)=>{ S.pult.q = String(q || ''); S.pult.open = {}; const v = pultView();
    if(HAS_DOM && $('pl-cat') && view==='registry'){ $('pl-cat').innerHTML = pultCatalogHTML(v); $('pl-n').textContent = v.n+' из '+v.of; } else render(); return v; },
  pultRole:(r)=>{ S.pult.role = r; pultRender('#pl-role'); return pultView(); }, pultState:(k)=>{ S.pult.state = PULT_STATES[k] ? k : 'active'; pultRender('#pl-state'); return pultView(); },
  pultSort:(k)=>{ const s = S.pult.sort; S.pult.sort = s.k===k ? { k, dir:-s.dir } : { k, dir:k==='opens' ? -1 : 1 }; pultRender('[data-sort="'+k+'"]'); return S.pult.sort; },
  pultSec:(name)=>{ const s = pultView().sections.find(x=>x.name===name); if(s) S.pult.open[name] = !s.open; pultRender('[data-sec="'+name+'"]'); return S.pult.open[name]; },
  pultMenu:(ev, id)=>openPultMenu(ev, id),
  keep:(id)=>{ const r = keepCandidate(id); toast(r.error || 'Оставлена: снова кандидат, если 90 дней её никто не откроет'); pultRender('#pl-deals, #pl-q'); return r; },
  // очередь предложений: «Принять» — копия личного отчёта в общий, каталожная плитка вместо личной у автора; «Отклонить» — окно с причиной
  accept:(id)=>{ const r = acceptProposal(id); toast(r.error ? r.error+(r.checks ? ': '+((r.checks.find(c=>!c.ok) || {}).text || '') : '') : 'Принято: «'+r.tile.title+'» в каталоге, автору — уведомление'); render(); return r; },
  rejectAsk:(id)=>openReject(id),
  // редактор раскладки роли: правка черновиком на странице, «Сохранить» — сразу у держателей; до сохранения видно, скольких затронет
  layoutRole:(r)=>{ S.layoutRole = r; S.layoutDraft = null; render(); },
  ldMove:(k, d)=>{ const L = ldItems(), i = L.indexOf(k), j = i + d; if(i>=0 && j>=0 && j<L.length){ [L[i], L[j]] = [L[j], L[i]]; } render(); return L; },
  ldRemove:(k)=>{ const L = ldItems(), i = L.indexOf(k); if(i>=0) L.splice(i, 1); render(); return L; },
  ldAdd:(id)=>{ const L = ldItems(); if(!id || L.includes(id)){ render(); return L; } const g = declGap(S.layoutRole || 'lead', id); if(g){ toast(g.error); render(); return g; } L.push(id); render(); return L; },
  ldSave:()=>{ const D = S.layoutDraft; if(!D) return null; const r = declaredSave(D.role, D.items); if(r.error){ toast(r.error); render(); return r; }
    S.layoutDraft = null; toast('Раскладка «'+roleName(D.role)+'» сохранена: '+(newsText(r) || 'без изменений')+' · держателей роли: '+r.holders.length+' — у них плашка «Раскладка роли обновлена»'); render(); return r; },
  ldCancel:()=>{ S.layoutDraft = null; render(); }, toast,
};
seed();
if(HAS_DOM){ document.addEventListener('DOMContentLoaded', ()=>{ if(location.hash==='#stand'){ view = 'stand'; render(); } else if(/^#st=/.test(location.hash)) openLink(location.hash); else render(); });
  // Esc закрывает панель списка, когда поверх нет окна или меню; «Назад» браузера из карточки — к дашборду на то же место
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.who && view==='home' && !$('overlay').innerHTML){ e.preventDefault(); closeWho(); } });
  // «Вперёд» после «Назад» — снова карточка того же объекта из того же списка
  window.addEventListener('popstate', ()=>{ if(view==='card'){ cardBack(); return; } if(location.hash==='#stand'){ view = 'stand'; render(); return; } if(!/^#st=/.test(location.hash)) return;
    let st = null; try { st = JSON.parse(decodeURIComponent(location.hash.slice(4))); } catch(e){}
    if(st && st.card && S.who){ const m = whoModel(), i = m && !m.refused ? m.shown.findIndex(x=>x.id===st.card) : -1; if(i>=0) openCard(i, true); }
    else if(!S.who && !Object.keys(S.open).length) openLink(location.hash); });
  // тихое обновление: раз в 5 минут, только пока вкладка видна; плитки на закрытую дату остаются в кэше
  setInterval(()=>{ if(document.visibilityState==='visible' && view==='home'){ tick(5); render(); } }, 5*60*1000); }
return api;
})();
</script>
</body>
</html>
