// «☰ N» у узла: столько же строк, сколько в списке «кто в этом числе» — строки числа вида с непустым значением; m — конец месяца Движения
function countNodes(res, mq, u, dim, m){

// выбор в открытой полосе: допустимое пишется в o.sel, недопустимое — отказ с причиной
function setViewSel(t, o, key, value, panel){
  const m = t, src = srcOf(t), free = dimsFor(t, o.path, panel || S.panel).map(x=>x.dim), fail = error=>({ error }); if(!src) return fail('Плитка не отвечает');
  const nm = d=>'«'+(DIMS[d] ? DIMS[d].name : d)+'»', known = d=>!!DIMS[d] && (src.dims.includes(d) || (!src.module && (OBJ_DIMS[objOf(src)] || []).includes(d)));
  const why = d=>o.path.some(x=>x.dim===d) ? 'Разрез '+nm(d)+' уже в пути — вернитесь по крошкам' : !known(d) ? 'У объекта нет разреза '+nm(d) : 'Разрез '+nm(d)+' зафиксирован фильтром панели';
  if(key==='dim'){ if(!free.includes(value)) return fail(why(value)); o.sel.dim = value; }

    if(a===b){ if(a!==was[0]) b = was[0]; else a = was[1]; }                  // тот же разрез в обоих — меняем местами
    const bad = [a, b].find(d=>!free.includes(d)); if(bad || free.length<2) return fail(bad ? why(bad) : 'Для Карты нужны два свободных разреза');

  else if(key==='of'){ if(value!=='main' && value!=='second') return fail('Ряд — главное или второе число'); if(value==='second' && !m.second) return fail('У плитки нет второго числа');
    if(value==='second' && !secondHist(t)) return fail('Ряд по второму числу недоступен: '+NO_HIST); o.sel.of = value; }
  else if(key==='month'){ if(+value!==0 && +value!==-1) return fail('Движение — текущий или прошлый месяц'); o.sel.month = +value; }
  else if(key==='top'){ const n = Math.round(+value); if(!(n>=1 && n<=20)) return fail('Топ — от 1 до 20 строк'); o.sel.top = n; }
  else if(key==='cols'){ const ids = [...new Set([].concat(value || []))], all = colsFor(t).map(x=>x.id);
    if(!ids.length) return fail('В Таблице нужна хотя бы одна колонка');
    const alien = ids.find(i=>!all.includes(i));
    if(alien===SHARE_COL) return fail('У плитки нет доли: колонка «доля» есть у плиток с долей двух показателей');
    if(alien) return fail(IND[alien] && IND[alien].obj===objOf(src) && !IND[alien].refuses && !STAND.withdrawn[alien] ? 'Остаток и поток в одной таблице не складываются: у таблицы одна дата или один период'
      : 'Показателя «'+(IND[alien] ? IND[alien].name : alien)+'» нет у объекта');

// клик по узлу: путь + узел, следующий разрез — первый свободный; вид, погашенный на новом уровне, меняется на первый доступный
function goDeeper(t, o, steps){
  const free = dimsFor(t, o.path, S.panel).map(x=>x.dim), bad = steps.find((x, i)=>!free.includes(x.dim) || steps.findIndex(y=>y.dim===x.dim)!==i);
  if(bad) return { error:'Разрез «'+(DIMS[bad.dim] ? DIMS[bad.dim].name : bad.dim)+'» уже в пути или недоступен' };
  o.path = o.path.concat(steps.map(x=>({ dim:x.dim, v:x.v })));
  const left = dimsFor(t, o.path, S.panel).map(x=>x.dim); o.sel = Object.assign({}, o.sel, { dim:left[0], dims:left.slice(0, 2) });
  const ok = viewsFor(t, user(), curRole(), o.path, S.panel).filter(v=>v.ok).map(v=>v.kind);
  if(!ok.includes(o.kind) && ok.length) o.kind = ['slice', 'table', 'series', 'move', 'map'].find(k=>ok.includes(k));
  return { ok:true, path:o.path.slice(), next:left[0] || null };
}
// крошка n: путь до n-го шага; снятые разрезы снова свободны и предлагаются первыми
function goCrumb(o, n){
  n = Math.max(0, Math.min(o.path.length, Math.round(+n) || 0)); const gone = o.path.slice(n);
  if(gone.length){ o.path = o.path.slice(0, n); o.sel = Object.assign({}, o.sel, { dim:gone[0].dim, dims:gone.slice(0, 2).map(x=>x.dim) }); }

// выражение: main | second | second.num | second.den | shift | tl | series(N[,main|second]) | slice(d) | map(d1,d2) | move(M) | table(d;c1,c2…)
// [.total] и сегменты пути >разрез=значение
function atOf(id, spec, uid, roleId, panel){
  const t = tileArg(id), u = userArg(uid); const [head, ...segs] = String(spec).split('>');
  const path = segs.map(x=>{ const i = x.indexOf('='); return { dim:x.slice(0, i).trim(), v:x.slice(i + 1).trim() }; });
  let h = head.trim(), total = false; if(/\.total$/.test(h)){ total = true; h = h.slice(0, -6); }
  if(['main','second','second.num','second.den','shift','tl'].includes(h)){ const b = cachedBase(t, u, roleId, panel, path);
    if(!LIVE.includes(b.state)) return 'state:'+b.state;
    if(h==='main') return b.value; if(h==='tl') return b.tl || null;
    if(h==='shift') return !b.shift ? null : b.shift.none ? 'none' : b.shift.delta;
    const s = b.second; const v = !s ? null : h==='second' ? s.value : h==='second.num' ? s.num : s.den; return v===undefined ? null : v; }
  const view = (kind, sel)=>cachedView(t, kind, sel, path, u, roleId, panel); const st = r=>'state:'+r.state; let x;
  if((x = h.match(/^series\((\d+)(?:,(main|second))?\)$/))){ const r = view('series', { points:+x[1], of:x[2] || 'main' }); return r.series ? r.series.points.map(p=>p.vals) : st(r); }
  if((x = h.match(/^slice\(([^)]+)\)$/))){ const r = view('slice', { dim:x[1].trim() }); return !r.nodes ? st(r) : total ? r.total.v : r.nodes.map(n=>[n.v, n.value]); }
  if((x = h.match(/^map\(([^,]+),([^)]+)\)$/))){ const r = view('map', { dims:[x[1].trim(), x[2].trim()] }); return !r.heat ? st(r) : total ? r.total.v : r.heat.cells; }
  if((x = h.match(/^move\((-?\d+)\)$/))){ const r = view('move', { month:+x[1] }); const mv = r.move;
    return !mv ? st(r) : { start:mv.start, end:mv.end, inc:mv.inc, dec:mv.dec, other:mv.other }; }

      return `<div class="bars ${ops?'ls4':''}">${shown.map(n=>row(n)).join('')}${rest.length?row({ label:'ещё '+rest.length, value:restSum }, true):''}</div>
        <div class="total-row">итог ${fmtVal(res.total.v, unit)} — узлом, не суммой строк</div>`; }
    case 'steps': {
      const max = Math.max(...res.nodes.map(n=>n.value||0), 1);
      return `<div class="steps">${res.nodes.map(n=>`<div class="step" data-tip="${esc(n.label)}: ${esc(fmtVal(n.value, unit))}" onclick="event.stopPropagation();${go(q.dims[0], n.v)}">

      const d = m.end - m.start; const dcls = d===0 ? '' : ((d>0) !== inv ? 'style="color:var(--asubk-green)"' : 'style="color:var(--asubk-red)"');

      return `<div class="mv"><span class="head">${fmtVal(m.end,u)}</span><span class="muted">${m.M ? 'на конец '+monthEndLabel(m.M)+' · ' : ''}на начало ${monthEndLabel(m.M-1)}: ${fmtVal(m.start,u)}</span><span ${dcls}>${fmtDelta(d,u)}</span>
        <span>+ увеличение</span><span class="muted">${parts(m.inc)}</span><span class="n">+${fmtVal(m.ti,u)}</span>
        <span>− уменьшение</span><span class="muted">${parts(m.dec)}</span><span class="n">−${fmtVal(m.td,u)}</span>
        <span>прочее</span><span class="muted">${m.otherName && m.otherName!=='прочее' ? esc(m.otherName) : ''}</span><span class="n">${m.other>=0?'+':'−'}${fmtVal(Math.abs(m.other),u)}</span>
        <span class="flows">${m.converges?'✓ сходится: конец = начало + обороты':'✗ не сходится на '+fmtVal(Math.abs(m.end-m.start-m.ti+m.td-m.other),u)}</span></div>`; }
    case 'heat': { const h = res.heat; const max = Math.max(...h.cells.flat(), 1);
      const shade = v=> { const k = v/max; return k===0 ? 'var(--asubk-gray-100)' : k<0.15 ? 'var(--seq-100)' : k<0.3 ? 'var(--seq-200)' : k<0.5 ? 'var(--seq-300)' : k<0.7 ? 'var(--seq-400)' : k<0.85 ? 'var(--seq-500)' : 'var(--seq-700)'; };

        ${h.rows.map((r,i)=>`<tr><td class="rl">${esc(dimLabel(h.d1,r))}</td>${h.cols.map((c,j)=>`<td class="c" style="background:${shade(h.cells[i][j])};color:${ink(h.cells[i][j])}" data-tip="${esc(dimLabel(h.d1,r))} × ${esc(c)}: ${esc(fmtVal(h.cells[i][j], unit))}" onclick="event.stopPropagation();${go(h.d1, r, h.d2, c)}">${unit==='sum' ? (h.cells[i][j]/1e6).toFixed(1).replace('.',',') : fmtVal(h.cells[i][j], unit)}${ls(h.d1, r, h.d2, c, h.cnt && h.cnt[i][j])}</td>`).join('')}</tr>`).join('')}</table>`, 'карта') + `

// широкая таблица прокручивается вбок: тень у правого края и подсказка, пока не долистали (класс ставит markScroll после отрисовки)
const scrollBox = (html, what)=>`<div class="hscroll"><div class="hs-in" onscroll="DB.scrollEnd(this)">${html}</div></div><div class="hs-hint">↔ ${what} прокручивается</div>`;
// название в две строки: обрезанному — полное в подсказке
function markClamp(){ if(HAS_DOM) document.querySelectorAll('.t-title .tt').forEach(e=>{ if(e.scrollHeight > e.clientHeight + 1) e.dataset.tip = e.dataset.full; else delete e.dataset.tip; }); }
function markScroll(){ markClamp(); if(HAS_DOM) document.querySelectorAll('.hscroll').forEach(b=>{ const i = b.firstElementChild; b.classList.toggle('over', i.scrollWidth > i.clientWidth + 1); scrollEnd(i); }); }
function scrollEnd(i){ i.parentNode.classList.toggle('end', i.scrollLeft + i.clientWidth >= i.scrollWidth - 2); }
function seriesSVG(t, res, mini, ops){
  const s = res.series; const W = mini ? 240 : 520, H = mini ? 34 : 100, pad = mini ? 8 : 22; const n = s.points.length; const lines = s.lines.length;
  const all = s.points.flatMap(p=>p.vals).filter(v=>v!==null); const max = Math.max(...all, 1);
  const bot = mini ? H-1 : H-2, hh = mini ? H-5 : H-10;
  const x = i=> pad + i*(W-2*pad)/Math.max(1,n-1); const y = v=> bot - (v/max)*hh;
  const colors = ['var(--series-1)','var(--series-2)','var(--series-3)'];
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px">`;
  svg += `<line x1="${pad}" x2="${W-pad}" y1="${bot}" y2="${bot}" stroke="rgba(26,57,96,.18)"/>`;
  if(lines===1){ const bw = (W-2*pad)/n*0.62;
    s.points.forEach((p,i)=>{ const v = p.vals[0]||0; const h = (v/max)*hh;
      const fill = mini ? (i===n-1 ? colors[0] : 'var(--seq-300)') : p.closed ? colors[0] : 'var(--seq-200)';   // в мини-ряду подсвечена последняя точка
      svg += `<rect x="${x(i)-bw/2}" y="${bot-h}" width="${bw}" height="${Math.max(1,h)}" rx="${mini?1.5:3}" fill="${fill}" data-tip="${esc(p.label)}: ${esc(fmtVal(v, res.unit))} · ${p.closed?'месяц закрыт':'не закрыт'}" ${mini ? '' : `onclick="event.stopPropagation();${ops ? ops.month(p.m) : `DB.whoMonth('${t.id}',${p.m})`}" style="cursor:pointer"`}/>`; }); }
  else s.lines.forEach((L,li)=>{ svg += `<polyline fill="none" stroke="${colors[li]}" stroke-width="2" points="${s.points.map((p,i)=>x(i)+','+y(p.vals[li]||0)).join(' ')}"/>`;
    s.points.forEach((p,i)=>{ svg += `<circle cx="${x(i)}" cy="${y(p.vals[li]||0)}" r="4" fill="${p.closed?colors[li]:'#fff'}" stroke="${colors[li]}" stroke-width="2" data-tip="${esc(L.name)} · ${esc(p.label)}: ${esc(fmtVal(p.vals[li], res.unit))}" onclick="event.stopPropagation();${ops ? ops.month(p.m, li) : `DB.whoMonth('${t.id}',${p.m},${li})`}" style="cursor:pointer"/>`; }); });
  if(mini) return svg + '</svg>';
  // подписи — HTML над и под рисунком: столбцы тянутся по ширине, буквы — нет
  const ax = s.points.map((p, i)=>i===0 || i===n-1 || i===Math.floor(n/2) ? `<span style="left:${(x(i)/W*100).toFixed(2)}%">${esc(p.label)}</span>` : '').join('');
  const last = s.points[n-1].vals[0], flow = !!(t && t.inds && IND[t.inds[0]] && qKind(t)==='flow');
  const cap = `<div class="ser-cap">${esc(fmtVal(last, res.unit))} — последняя точка = ${flow ? 'последний месяц периода' : 'дата среза'}</div>`;
  const legend = lines>1 ? `<div class="legend">${s.lines.map((L,i)=>`<span><span class="dot" style="background:${colors[i]}"></span> ${esc(L.name)}</span>`).join('')}</div>` : '';
  return cap + svg + `</svg><div class="ser-ax">${ax}</div>` + legend + `<div class="legend"><span><span class="dot" style="background:var(--series-1)"></span> месяц закрыт</span><span><span class="dot" style="background:var(--seq-200)"></span> не закрыт</span></div>`;
}

function wireDnD(){ if(!HAS_DOM || !S.arrange) return; let dragKey = null;
  document.querySelectorAll('#grid [draggable=true]').forEach(el=>{
    el.addEventListener('dragstart', e=>{ dragKey = el.dataset.key; e.dataTransfer.effectAllowed='move'; });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{ e.preventDefault(); el.classList.remove('drag-over'); if(dragKey && dragKey!==el.dataset.key){ api.drop(dragKey, el.dataset.key); } }); }); }
if(HAS_DOM){ document.addEventListener('mousemove', e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); const tip = $('tip');
  if(el){ tip.textContent = el.dataset.tip; tip.style.display='block'; tip.style.left = Math.min(e.clientX+12, window.innerWidth-290)+'px'; tip.style.top = (e.clientY+14)+'px'; } else tip.style.display='none'; });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });
  // окно сузилось или расширилось: ряды сетки сменились, полосы встают на новые места
  window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(()=>{ if(view==='home' && Object.keys(S.open).length && gridCols()!==lastCols) render(); else markScroll(); }, 120); }); }

function openTileView(id, kind){ const t = tileArg(id); if(!VIEW_KINDS.includes(kind)) return null; countClick(id); const o = openStrip(id, kind); view = 'home'; render();
  if(HAS_DOM){ const el = document.querySelector('[data-strip="'+id+'"]'); if(el) el.scrollIntoView({ block:'nearest' }); else toast('Плитки «'+t.title+'» нет на этом экране'); }
  return o; }

// строка числа в форме: вид — data-k, колонки и разрез — её списки, ячейки — отмеченные
function rowArgs(el){ const row = el.closest('.nrow');
  return [row.dataset.k, ...Array.from(row.querySelectorAll('select')).map(x=>x.value), Array.from(row.querySelectorAll('input[type=checkbox]:checked')).map(x=>x.value)]; }
function numFrom(r, kind, a, b, c){ const col = i=>r.cols.includes(i), no = i=>({ error:'Колонки «'+(IND[i] ? IND[i].name : i)+'» в отчёте нет' });
  if(kind==='col' || kind==='of') return col(a) ? { [kind]:a } : no(a);
  if(kind==='share') return !col(a) ? no(a) : !col(b) ? no(b) : { share:[a, b] };
  if(kind==='pct'){ if(!col(a)) return no(a); if(!r.dims.includes(b)) return { error:'«% от итога группы» — только по разрезу отчёта' };
    const vs = valuesOf(b, DATA[r.obj]); return { col:a, pct:{ dim:b, cells:[].concat(c || []).filter(v=>vs.includes(v)) } }; }
  return null; }

    d.second = x; render(); return d.second; },
  dShift:(id)=>{ const d = tileDraft(), sh = shiftsFor(d), b = sh.find(x=>x.id===id);
    if(!b || !b.ok){ render(); return toast(b ? b.why : sh[0].why || 'Такой базы сдвига нет'); }
    d.shift = id; render(); return d.shift; },
  dView:(kind,key,v)=>{ const d = tileDraft(); if(!VIEW_KINDS.includes(kind)){ render(); return toast('Такого вида нет'); }
    if(['points','top','month'].includes(key)) v = Number(v);
    d.views = Object.assign({}, d.views, { [kind]:Object.assign({}, (d.views || {})[kind], { [key]:Array.isArray(v) ? v.slice() : v }) }); render(); return d.views[kind]; },
  dTl:(k,op,val)=>{ const d = tileDraft();
    if(k==='on'){ if(op==='none'){ d.tl = null; render(); return null; }
      if(op==='second' && !d.second){ render(); return toast('Второго числа у плитки нет'); }
      d.tl = Object.assign({ green:true }, d.tl, { on:op }); render(); return d.tl; }
    d.tl = d.tl || { green:true, on:'main' }; const cur = d.tl[k] || [k==='red'?'>':(d.tl.red?d.tl.red[0]:'>'), 0];
    if(op) cur[0]=op; if(val!==null && val!==undefined){ if(val===''){ delete d.tl[k]; if(!d.tl.red && !d.tl.yellow) d.tl=null; render(); return; } cur[1]=Number(val); }
    d.tl[k]=cur; render(); return d.tl; },
  dTitle:(v)=>{ tileDraft().title=v; render(); },
  dRoles:(role, on)=>{ const d = tileDraft(); const set = new Set(d.forRoles || []); if(on) set.add(role); else set.delete(role); d.forRoles = [...set]; render(); },
  saveDraft:(mode)=>{ const r = saveTile(tileDraft(), mode); if(r.error){ toast(r.error); return r; }
    if(mode==='personal' && S.tab){ if(S.tab.kind==='screen') screenAdd(S.tab.id, r.tile.id); else arrangeAdd(S.tab.id, r.tile.id); }
    toast(mode==='personal'?'Личная плитка добавлена в конец вкладки':mode==='draft'?'Черновик сохранён':'Плитка опубликована в каталог'); draft=null; view = mode==='personal'?'home':'registry'; render(); return r; },
  // черновик отчёта: вопрос собирает только конструктор отчётности
  newReportDraft:()=>{ rdraft = blankReportDraft(); condDraft = { f:'', op:'', v:null }; render(); return rdraft; },
  // «Собрать новый отчёт»: ящик конструктора отчётности поверх страницы; прежний черновик сохраняется, пока его не сохранили или не начали заново
  // «📌 сохранить отчётом» из полосы: ящик конструктора отчётности поверх главной, черновик — из вида полосы
  saveAsReport:(k)=>{ const rd = stripReportDraft(k); if(rd.error){ toast(rd.error); return rd; }
    rdraft = rd; condDraft = { f:'', op:'', v:null }; rcOpen = true; render(); return rdraft; },
  openRC:()=>{ if(!rdraft){ rdraft = blankReportDraft(); condDraft = { f:'', op:'', v:null }; } view = 'builder'; rcOpen = true; render(); return rdraft; },
  rSet:(k,v)=>{ if(!['obj','share','date','period','title'].includes(k)){ render(); return toast('Отчёт задаёт объект, показатели, разрезы, фильтр и дату — показ задаёт плитка'); }
    if(k==='obj'){ const first = Object.values(IND).find(x=>x.obj===v && !x.refuses); rdraft = Object.assign(blankReportDraft(), { obj:v, inds:[first.id] }); rdraft.filter = defaultFilterOf(rdraft); condDraft = { f:'', op:'', v:null }; }
    else { const rd = reportDraft(); if(k==='share') rd.share = v ? rd.inds.slice(0,2) : null; else rd[k]=v; }
    render(); return rdraft; },
  rInd:(id,on)=>{ const rd = reportDraft(); const wasDefault = sameJson(rd.filter, defaultFilterOf(rd));
    if(on){ const sameKind = (IND[id].kind==='stock') === (IND[rd.inds[0]].kind==='stock');
      if(sameKind && rd.inds.length>=4){ render(); return toast('Не больше четырёх показателей'); }
      if(!sameKind && rd.inds.length>1){ render(); return toast('Остаток и поток в одном отчёте не складываются: у отчёта одна дата или один период — сначала снимите прежние показатели'); }
      if(sameKind) rd.inds.push(id); else rd.inds = [id];            // единственный показатель другого рода — отчёт меняет род
    } else if(rd.inds.length>1) rd.inds = rd.inds.filter(x=>x!==id);
    if(wasDefault) rd.filter = defaultFilterOf(rd);                 // фильтр, который пользователь правил, не трогаем
    if(rd.share && rd.inds.length!==2) rd.share=null; render(); },
  rDim:(d,on)=>{ const rd = reportDraft(); rd.dims = on ? [...rd.dims, d].slice(-2) : rd.dims.filter(x=>x!==d); render(); },
  rFilter:(f,v)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter(c=>!(c.f===f && paramLabel(c.v))); if(v) rd.filter.push({ f, op:String(v).startsWith('@today+') ? 'le' : 'eq', v }); render(); },
  rCond:(target,k,v)=>{ const rd = reportDraft(); if(condDraft.target!==target) condDraft = { target, f:'', op:'', v:null };
    if(k==='f'){ const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===v); condDraft = { target, f:v, op: F ? (F.dim ? 'eq' : 'gt') : '', v:null }; }
    else if(k==='op'){ condDraft.op = v; if(v!=='in' && v!=='nin' && Array.isArray(condDraft.v)) condDraft.v = condDraft.v[0] || null; }
    else condDraft.v = v; render(); },
  rCondAdd:(target)=>{ const rd = reportDraft(); const c = condDraft; if(c.target!==target || !c.f || !c.op) return toast('Выберите поле, сравнение и значение');
    const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===c.f); let v = c.v;
    if(F.dim){ v = [].concat(v===null||v===undefined ? [] : v).filter(x=>x!==''); if(!v.length) return toast('Выберите значение'); if(c.op==='eq'||c.op==='ne') v = v[0]; }
    else { if(v===null || v==='' || isNaN(Number(v))) return toast('Введите число'); v = Number(v); }
    const cond = { f:c.f, op:c.op, v };
    rd.filter = [...rd.filter, cond];   // условия складываются по «и»: можно задать полосу «> 30 и ≤ 90»
    condDraft = { f:'', op:'', v:null }; render(); return cond; },
  rCondDel:(target,i)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter((_,j)=>j!==i); render(); },
  rTitle:(text)=>api.rSet('title', text),
  rSaveAndPlace:()=>{ const r = saveAndPlace(reportDraft(), curRole());
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast(r.error+(f ? ': '+f.text : '')); render(); return r; }
    toast('Личный отчёт «'+r.report.title+'» собран, плитка на нём добавлена в конец вкладки'); rdraft = null; draft = null; condDraft = { f:'', op:'', v:null }; view = 'home'; render(); return r; },
  // администратор
  withdrawAsk:(id)=>{ const t = tileById(id); const w = whereUsed(id);
    drawer('Снять плитку «'+esc(t.title)+'»', `<p>Плитка уйдёт из каталога и из раскладок ролей. В личных раскладках останется заглушка «снята администратором».</p>
      <div class="kv"><div class="k">Раскладки ролей</div><div>${w.roles.map(roleName).join(', ')||'—'}</div><div class="k">Личных раскладок</div><div>${w.personal}</div><div class="k">Своих экранов</div><div>${w.screens}</div></div>
      <button class="btn danger" onclick="DB.withdrawDo('${id}')">Снять</button>`); },
  withdrawDo:(id)=>{ withdraw(id); closeOverlay(); render(); toast('Плитка снята'); },
  moveToCatalog:(id)=>{ const r = moveToCatalog(id); render(); toast(r && r.error ? r.error : r ? 'Перенесена в каталог' : 'Переносит только администратор дашборда'); return r; }, publishDraft:(id)=>{ const r = publishDraft(id); if(r&&r.error) toast(r.error); render(); },
  layoutRole:(r)=>{ S.layoutRole=r; render(); }, declMove:(r,k,d)=>{ declaredEdit(r,'move',k,d); render(); }, declRemove:(r,k)=>{ declaredEdit(r,'remove',k); render(); },
  declAdd:(r,k)=>{ const x = declaredEdit(r,'add',k); if(x && x.error) toast(x.error); render(); }, toast,
};
seed();
if(HAS_DOM){ document.addEventListener('DOMContentLoaded', render);
  // тихое обновление: раз в 5 минут, только пока вкладка видна; плитки на закрытую дату остаются в кэше
  setInterval(()=>{ if(document.visibilityState==='visible' && view==='home'){ tick(5); render(); } }, 5*60*1000); }
return api;
})();
</script>
</body>
</html>
