<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд · АСУБК</title>
<!--
  АСУБК · модуль «Дашборд» · макет.
  Логика и решения — ASUBK-dashbord-logika.md, история — ASUBK-status-razrabotki.md.
  Движок window.DB проверяется смоуком: node scripts/inspect/dashboard-check.mjs
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-80:rgba(24,39,57,0.80); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE; --asubk-canvas:#F1F3F6;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-blue-ring:rgba(0,106,245,0.55); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#9A6B00; --asubk-amber-tint:rgba(184,134,11,0.12); --asubk-amber-line:var(--st-warn);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-secondary:var(--asubk-ink-80); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-canvas); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-white);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50); --surface-sunk:var(--asubk-gray-150);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* формы: скругления, тени */
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:14px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(24,39,57,.05);
  --shadow-lift:0 14px 34px -14px rgba(24,39,57,.22), 0 2px 6px rgba(24,39,57,.05);
  --scrim:rgba(24,39,57,.32);
  --header-h:56px; --sidebar-w:260px;
  /* графики: серии — проверенный порядок (валидатор dataviz, light), шкала — одна синяя */
  --series-1:#256abf; --series-2:#d97a1f; --series-3:#7a5bc4;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;
  /* светофор плитки: мягкая плашка под числом, текст плотнее фона */
  --tl-red-bg:#FCE6E6; --tl-yellow-bg:rgba(250,178,25,.20); --tl-green-bg:rgba(21,132,67,.12);
  --tl-red-ink:#B42323; --tl-yellow-ink:#7A5400; --tl-green-ink:#126B37;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:400 14px/1.45 var(--asubk-font); color:var(--text-body); background:var(--surface-page); -webkit-font-smoothing:antialiased; }
button,select,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--asubk-blue); outline-offset:2px; border-radius:4px; }
.vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.muted{ color:var(--text-muted); } .small{ font-size:13px; } .mono{ font-variant-numeric:tabular-nums; font-size:12.5px; }

/* ---------- Рамка: меню слева, шапка, страница ---------- */
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; display:flex; flex-direction:column; background:var(--surface-sidebar); border-right:1px solid var(--border-default); }
.brand{ display:flex; align-items:center; gap:10px; min-height:var(--header-h); padding:8px 16px; border-bottom:1px solid var(--border-default); }
.brand .mark{ width:28px; height:28px; border-radius:var(--r-md); background:var(--asubk-ink); color:var(--asubk-white); display:grid; place-items:center; flex:none; }
.brand .bt{ min-width:0; } .brand b{ display:block; font-size:15px; font-weight:700; line-height:1.2; letter-spacing:.02em; color:var(--text-heading); }
.brand small{ display:block; font-size:12px; line-height:1.35; color:var(--text-muted); }
.nav{ flex:1; overflow-y:auto; padding:10px 8px; }
.nav-sec{ padding:8px 10px 6px; font-size:11.5px; font-weight:600; line-height:1.3; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; width:100%; min-height:36px; padding:6px 10px; border:none; border-radius:var(--r-md); background:none; color:var(--text-secondary); font-size:14px; font-weight:500; text-align:left; }
.nav-item:hover{ background:var(--surface-sunk); color:var(--text-heading); }
.nav-item.active{ background:var(--asubk-nav-active); color:var(--text-heading); font-weight:600; }
.nav-item .cnt{ margin-left:auto; display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:var(--radius-pill); background:var(--surface-sunk); color:var(--text-muted); font-size:11.5px; font-weight:600; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar{ flex:none; min-height:var(--header-h); display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; padding:8px 24px; background:var(--surface-card); border-bottom:1px solid var(--border-default); }
.crumb-title{ font-size:16px; font-weight:600; line-height:1.2; letter-spacing:-.005em; color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
#clock{ margin-right:4px; color:var(--text-muted); font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.tbtn{ display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 11px; border-radius:var(--r-md); border:1px solid transparent; background:none; color:var(--text-secondary); font-size:13.5px; font-weight:500; white-space:nowrap; }
.tbtn:hover{ background:var(--surface-sunk); color:var(--text-heading); }
.tbtn svg{ color:var(--text-muted); flex:none; }
.notif-dot{ display:inline-grid; place-items:center; min-width:18px; height:18px; padding:0 5px; border-radius:var(--radius-pill); background:var(--asubk-red); color:var(--asubk-white); font-size:11px; font-weight:600; }
.whob{ display:flex; align-items:center; gap:8px; height:36px; padding:0 8px 0 4px; border:1px solid var(--border-default); border-radius:var(--radius-pill); background:var(--surface-card); }
.whob:hover{ border-color:var(--border-strong); }
.whob:focus-within{ outline:2px solid var(--asubk-blue); outline-offset:2px; }
.ava{ width:28px; height:28px; border-radius:50%; background:var(--surface-sunk); color:var(--text-secondary); display:grid; place-items:center; font-size:11.5px; font-weight:600; flex:none; }
.whob select{ height:auto; border:0; padding:0; background:none; color:var(--text-heading); font-size:13.5px; font-weight:500; max-width:360px; field-sizing:content; cursor:pointer; }
.whob select:focus-visible{ outline:none; }
.content{ flex:1; min-width:0; overflow:auto; background:var(--surface-page); }
.wrap{ padding:18px 24px 64px; }
.view{ display:none; } .view.active{ display:block; }
.h2{ margin:22px 0 10px; font-size:16px; font-weight:600; line-height:1.25; letter-spacing:-.005em; color:var(--text-heading); }

/* ---------- Поля и кнопки ---------- */
select,input[type=text],input[type=number]{ height:32px; border-radius:var(--r-md); border:1px solid var(--border-strong); background:var(--surface-card); color:var(--text-heading); font-size:13.5px; padding:0 8px; }
select:hover,input[type=text]:hover,input[type=number]:hover{ border-color:var(--text-placeholder); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 12px; border-radius:var(--r-md); border:1px solid var(--border-strong); background:var(--surface-card);
  color:var(--text-heading); font-size:13px; font-weight:500; white-space:nowrap; }
.btn:hover{ border-color:var(--text-placeholder); background:var(--surface-hover); }
.btn.primary{ background:var(--asubk-blue); border-color:var(--asubk-blue); color:var(--asubk-white); }
.btn.primary:hover{ background:var(--asubk-blue-hover); border-color:var(--asubk-blue-hover); }
.btn.danger{ color:var(--asubk-red); } .btn.danger:hover{ border-color:var(--asubk-red); }
.btn.sm{ height:28px; padding:0 10px; font-size:12.5px; }
.btn:disabled,.btn[aria-disabled="true"]{ color:var(--text-disabled); border-color:var(--border-default); background:var(--surface-card); cursor:not-allowed; }
.linky{ border:0; background:none; padding:0; color:var(--text-link); font-weight:500; text-align:left; }
.linky:hover{ text-decoration:underline; text-underline-offset:3px; }
.banner{ border-radius:10px; padding:10px 14px; margin:0 0 12px; font-size:13.5px; line-height:1.5; }
.banner.info{ background:var(--asubk-blue-tint); color:var(--text-heading); } .banner.warn{ background:var(--asubk-amber-tint); color:var(--asubk-amber); }
.banner.err{ background:var(--asubk-red-tint); color:var(--asubk-red-hover); }

/* ---------- Главная: верх — один ряд (вкладки, охват, «Фильтр», «⋯»), фишки фильтра; секции ---------- */
.top{ margin-bottom:14px; }
.topline{ position:relative; display:flex; align-items:center; gap:8px 16px; min-height:44px; box-shadow:inset 0 -1px 0 var(--border-default); }
/* ряд вкладок не влез (узкий компьютер, пять своих экранов) — прокручивается с видимой тонкой полосой, вкладки не сжимаются */
.tabs{ display:flex; align-self:flex-end; gap:2px; flex:0 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }
.tab{ position:relative; flex:none; display:inline-flex; align-items:center; gap:7px; height:44px; padding:0 14px; border:0; background:none; color:var(--text-muted); font-size:14px; font-weight:500; white-space:nowrap; }
.tab:hover{ color:var(--text-heading); }
.tab:focus-visible{ outline-offset:-2px; }
.tab.active{ color:var(--text-heading); font-weight:600; }
.tab.active::after{ content:""; position:absolute; left:10px; right:10px; bottom:0; height:2px; border-radius:2px; background:var(--asubk-blue); }
.tab.own::before{ content:""; width:13px; height:9px; border:1.5px solid currentColor; border-radius:2.5px; opacity:.55; flex:none; }
.tab.add{ color:var(--text-link); }
.scr-pick{ display:none; }
/* справа: подпись охвата, «Фильтр», «⋯»; на узком окне первой ужимается подпись (многоточие, полный текст — подсказкой), потом ряд вкладок прокручивается */
.topline > .scope{ margin-left:auto; flex:0 1000 auto; min-width:96px; max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); font-size:13px; }
.top-r{ flex:none; display:flex; align-items:center; gap:8px; }
.top-r .btn{ flex:none; }
.top-r .btn svg{ width:15px; height:15px; flex:none; }
.top-r .fbtn svg{ color:var(--text-muted); }
.top-r .fbtn.on{ background:var(--asubk-blue-tint); border-color:var(--asubk-blue-ring); color:var(--asubk-link); } .top-r .fbtn.on svg{ color:inherit; }
.top-r .fbtn[aria-disabled="true"] svg{ color:var(--text-disabled); }
.top-r .more{ width:32px; padding:0; }
.cmp{ flex:none; display:flex; align-items:center; gap:8px; }
.cmp-l{ font-size:13px; color:var(--text-muted); }
.cmp .seg button{ height:auto; min-height:34px; padding:2px 10px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; }
.cmp .seg button small{ font-size:10.5px; font-weight:400; color:var(--text-muted); }
.cmp-pick{ display:none; }
@media (max-width:1600px){ .cmp{ display:none; } .cmp-pick{ display:flex; align-items:center; gap:6px; height:32px; padding:0 2px 0 10px; border:1px solid var(--border-strong); border-radius:var(--r-md); background:var(--surface-card); font-size:13px; color:var(--text-muted); }
  .cmp-pick select{ height:30px; border:0; background:none; color:var(--text-heading); font-weight:600; max-width:200px; } }
.scope-m{ display:none; }
.arrange-bar{ position:absolute; inset:0; z-index:5; display:flex; align-items:center; gap:6px 12px; padding:0 4px 0 14px; border-radius:var(--r-lg);
  background:linear-gradient(var(--asubk-blue-tint), var(--asubk-blue-tint)), var(--surface-card); box-shadow:0 0 0 1px var(--asubk-blue-ring); font-size:13.5px; color:var(--text-heading); }
.arrange-bar .ab-h{ color:var(--text-muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.arrange-bar .ab-r{ margin-left:auto; display:flex; gap:8px; flex:none; }
.fchips{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding-top:8px; font-size:13px; }
.fchip{ display:inline-flex; align-items:center; gap:2px; min-height:26px; max-width:100%; padding:2px 3px 2px 10px; border-radius:var(--radius-pill); background:var(--asubk-blue-tint);
  box-shadow:inset 0 0 0 1px rgba(0,106,245,.28); color:var(--asubk-link); font-size:12.5px; font-weight:500; line-height:1.35; }
.fchip-x{ flex:none; width:20px; height:20px; display:grid; place-items:center; border:0; border-radius:50%; background:none; color:inherit; padding:0; }
.fchip-x:hover{ background:rgba(0,106,245,.14); } .fchip-x svg{ width:10px; height:10px; }
.fchip.off{ background:var(--surface-sunk); box-shadow:inset 0 0 0 1px var(--border-default); color:var(--text-muted); cursor:help; } .fchip.off .fchip-x:hover{ background:rgba(28,55,90,.10); }
.fchg{ display:inline-flex; flex-wrap:wrap; align-items:center; gap:2px 6px; } .fchg .sep{ color:var(--text-disabled); }
/* строка поиска в каталоге и у отчётов */
.filterbar{ display:flex; gap:8px 14px; align-items:center; flex-wrap:wrap; padding:9px 12px; margin-bottom:18px; background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--r-lg);
  font-size:13px; color:var(--text-muted); }
.chip{ display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:var(--radius-pill); background:var(--surface-sunk); color:var(--text-secondary); font-size:12.5px; font-weight:500; }
/* окно фильтра и «+ экран»: на странице, в пределах окна */
.ask-l{ display:block; margin:0 0 6px; font-size:13px; color:var(--text-muted); }
.ask-c{ margin:12px 0 0; padding:0; border:0; display:grid; gap:6px; }
.ask-o{ display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border:1px solid var(--border-default); border-radius:var(--r-md); cursor:pointer; }
.ask-o:has(input:checked){ border-color:var(--asubk-blue-ring); background:var(--asubk-blue-tint); }
.ask .ask-o input{ width:15px; height:15px; margin:2px 0 0; padding:0; accent-color:var(--asubk-blue); flex:none; }
.ask-o b{ display:block; font-weight:500; color:var(--text-heading); overflow-wrap:anywhere; } .ask-o small{ display:block; margin-top:1px; font-size:12px; color:var(--text-muted); }
.ask.fwin{ top:50%; transform:translate(-50%, -50%); width:min(720px, calc(100vw - 32px)); max-height:calc(100vh - 32px); display:flex; flex-direction:column; }
.fw-n{ margin:-4px 0 12px; font-size:13px; color:var(--text-muted); }
.fw-b{ display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1fr); gap:10px 18px; min-height:0; overflow:auto; }
.fw-f{ margin:0; padding:0; border:0; min-width:0; } .fw-f legend{ padding:0 0 6px; font-size:13px; font-weight:600; color:var(--text-heading); }
.fw-l{ display:flex; flex-direction:column; } .fw-l .opt{ margin:0; padding:3px 0; font-size:13.5px; } .fw-o{ padding:3px 0; font-size:12.5px; line-height:1.4; color:var(--text-muted); }
.fwin .ask-b{ align-items:center; } .fwin .fw-clr{ margin-right:auto; font-size:13px; }
.menu button:disabled{ color:var(--text-disabled); cursor:not-allowed; background:none; }

/* сетка плиток: 4 колонки → 2 → 1 */
.grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; align-items:stretch; }
.section-row{ grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-top:12px; padding-bottom:6px; border-bottom:1px solid var(--border-default);
  font-size:15px; font-weight:600; letter-spacing:-.005em; color:var(--text-heading); }
.section-row:first-child{ margin-top:0; }
.section-row .linky{ width:22px; height:22px; display:inline-grid; place-items:center; border-radius:var(--r-sm); color:var(--text-muted); font-size:12px; }
.section-row .linky:hover{ background:var(--surface-sunk); text-decoration:none; }
.section-row button{ font-size:13px; }
.section-row .sec-n{ margin-left:2px; font-size:13px; font-weight:400; color:var(--text-muted); }
.section-row .sec-dot{ width:8px; height:8px; border-radius:50%; background:var(--st-crit); flex:none; cursor:help; }

/* ячейка «+ плитка» в конце сетки — вход в каталог для этой вкладки */
.add-cell{ display:flex; align-items:center; justify-content:center; min-height:96px; padding:14px 16px; border:1.5px dashed var(--border-strong); border-radius:var(--r-lg);
  background:transparent; color:var(--text-muted); font:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:border-color .12s, color .12s, background .12s; }
.add-cell:hover{ border-color:var(--asubk-blue); color:var(--asubk-blue); background:var(--surface-card); }
.add-cell:focus-visible{ outline:2px solid var(--asubk-blue); outline-offset:2px; }

/* ---------- Плитка 1×1 ---------- */
.tile{ position:relative; display:flex; flex-direction:column; gap:4px; min-width:0; background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--r-lg);
  padding:14px 16px 15px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .12s, box-shadow .12s; }
.tile:hover{ border-color:var(--border-strong); }
.tile.stale{ border-color:var(--asubk-amber-line); box-shadow:0 0 0 1px var(--asubk-amber-line); }
.tile.err{ border-style:dashed; border-color:var(--border-strong); box-shadow:none; }
/* строка 1: название и уточнение, метки отличий, колокольчик сигнала */
.tile .t-head{ display:flex; align-items:flex-start; }
.tile .t-name{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:6px; row-gap:4px; }
.tile .t-title{ font-size:13.5px; line-height:1.35; font-weight:500; color:var(--text-secondary); min-width:0; }
.tile .t-qual{ font-size:12.5px; font-weight:400; color:var(--text-muted); }
.tile .t-name .chip{ height:20px; font-size:11.5px; padding:0 7px; }
.tile .kind-link{ display:block; flex-basis:100%; margin-bottom:1px; font-size:12px; font-weight:500; color:var(--text-link); }
.tile .kind-link::first-letter{ text-transform:uppercase; }
.pill{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 7px; border-radius:var(--radius-pill); font-size:11.5px; font-weight:500; white-space:nowrap; cursor:help; }
.pill.info{ background:var(--surface-sunk); color:var(--text-secondary); } .pill.warn{ background:var(--asubk-amber-tint); color:var(--asubk-amber); }
.tile .ic{ display:inline-flex; align-items:center; align-self:center; color:var(--asubk-blue); cursor:help; } .tile .ic svg{ width:13px; height:13px; display:block; }
/* «☰» и «⋯»: одноцветные, при наведении, поверх правого края шапки — название не сдвигают */
.tile .t-tools{ position:absolute; top:9px; right:9px; display:flex; gap:2px; background:var(--surface-card); box-shadow:-10px 0 10px var(--surface-card);
  border-radius:var(--r-md); color:var(--text-muted); opacity:0; transition:opacity .12s; }
.tile:hover .t-tools,.tile .t-tools:focus-within{ opacity:1; }
.tile .t-tools button{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; padding:0; background:none; border:none; border-radius:7px; color:inherit; }
.tile .t-tools button:hover,.tile .t-tools button:focus-visible{ background:var(--surface-sunk); color:var(--text-heading); }
.tile .t-tools svg{ width:16px; height:16px; display:block; }
/* строка 2: главное число и сдвиг; строка 3: второе число */
.tile .t-row{ display:flex; flex-wrap:wrap; align-items:baseline; column-gap:10px; row-gap:2px; margin-top:8px; }
.tile .big{ font-size:30px; line-height:1.08; font-weight:600; letter-spacing:-.022em; color:var(--text-heading); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tile .big .u{ font-size:15px; font-weight:500; letter-spacing:0; color:var(--text-muted); margin-left:4px; }
.tile:hover .big{ text-decoration:underline dotted var(--text-placeholder); text-decoration-thickness:1.5px; text-underline-offset:6px; }
.tile .note,.tile .shift{ font-size:13px; color:var(--text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
.tile .note{ color:var(--text-muted); }
.tile .shift .a,.strip .shift .a{ font-size:10.5px; margin-right:1px; }
.tile .shift.up-bad .a,.tile .shift.down-bad .a,.strip .shift.up-bad .a,.strip .shift.down-bad .a{ color:var(--asubk-red); }
.tile .shift.up-good .a,.tile .shift.down-good .a,.strip .shift.up-good .a,.strip .shift.down-good .a{ color:var(--asubk-green); }

.tile .second .num-link:hover b{ color:var(--asubk-link); text-decoration:underline; } .tile .second .num-link:focus-visible{ outline:2px solid var(--asubk-blue); outline-offset:2px; }
.tile .thr{ font-size:12px; font-weight:400; color:var(--text-muted); white-space:nowrap; }
/* светофор: мягкая плашка под оцениваемым числом, рядом — граница, давшая цвет */
.chipv{ border-radius:7px; padding:1px 6px; cursor:help; }
.big .chipv{ display:inline-block; padding:0 7px 1px; margin-left:-7px; border-radius:var(--r-md); }
.chipv.red{ background:var(--tl-red-bg); color:var(--tl-red-ink); } .chipv.yellow{ background:var(--tl-yellow-bg); color:var(--tl-yellow-ink); } .chipv.green{ background:var(--tl-green-bg); color:var(--tl-green-ink); }
.big .chipv .u{ color:inherit; opacity:.75; } .second b .chipv{ font-weight:600; }
.tile .t-body{ display:flex; flex-direction:column; gap:4px; padding-top:6px; min-width:0; }
.tile.open{ border-color:var(--asubk-blue-ring); } .tile.open:not(.stale){ box-shadow:0 0 0 1px var(--asubk-blue-ring), var(--shadow); }
.tile .passport{ font-size:12px; line-height:1.4; color:var(--text-muted); border-top:1px solid var(--asubk-grid-line); padding-top:6px; margin-top:4px; font-variant-numeric:tabular-nums; white-space:normal; }
.tile .state-msg{ font-size:13px; line-height:1.45; color:var(--text-secondary); }
.tile .state-msg b{ color:var(--text-heading); font-weight:600; }

/* в очереди (отчётность перегружена): в сером скелете — место в очереди; кнопки «Повторить» нет — ответ заменит сам */
.tile.skel .sk-q{ display:flex; align-items:center; justify-content:center; min-height:52px; font-size:12.5px; color:var(--text-muted); cursor:help; }
/* у вас пусто: охват по параметру плитки пуст — серым на месте числа, причина — подсказкой */
.tile .mine0{ font-size:17px; line-height:32px; font-weight:500; color:var(--text-muted); cursor:help; text-decoration:underline dotted var(--text-placeholder); text-underline-offset:5px; }
@media (prefers-reduced-motion:no-preference){ .tile.skel .t-body{ animation:pulse 1.1s ease-in-out infinite alternate; } .strip .sk{ animation:pulse 1.1s ease-in-out infinite alternate; } }
@keyframes pulse{ from{ opacity:1; } to{ opacity:.45; } }
.tile.arrange{ cursor:grab; outline:1.5px dashed var(--border-strong); outline-offset:-1px; box-shadow:none; }
.tile.drag-over,.section-row.drag-over{ outline:2px solid var(--asubk-blue); }
.arr-tools{ display:flex; gap:4px; margin-top:6px; }
.req{ color:var(--asubk-amber); font-size:12px; cursor:help; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.tile .t-link{ background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left; overflow-wrap:anywhere; max-width:100%; }
.tile .t-title .tt{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tile .t-link:hover,.tile .t-link:focus-visible{ color:var(--text-link); text-decoration:underline; text-underline-offset:3px; }
.tile .t-link .ar{ display:none; font-size:12px; } .tile .t-link:hover .ar,.tile .t-link:focus-visible .ar{ display:inline; }

/* ---------- Полоса: на всю ширину ряда под плитками ----------
   белая, серая рамка и стрелка к своей плитке (синяя рамка — только у открытой плитки);
   высота по содержимому до 520 px, длиннее — прокрутка внутри тела, строка сверху стоит */
.strip{ grid-column:1/-1; min-width:0; position:relative; display:flex; flex-direction:column; max-height:520px; background:var(--surface-card); border:1px solid var(--border-strong); border-radius:var(--r-xl); padding:8px 18px 0; box-shadow:var(--shadow-lift); }
.strip-arrow{ position:absolute; top:-7px; width:13px; height:13px; margin-left:-6.5px; background:var(--surface-card); border-left:1px solid var(--border-strong); border-top:1px solid var(--border-strong); transform:rotate(45deg); border-top-left-radius:3px; }
/* единственная строка над графиком: путь · число узла · сдвиг · метки · разрез ··· паспорт · пять видов · ☰ N · список · ⋯ · ✕; не влезло — fitStrips прячет по очереди */
.strip-line{ flex:none; display:flex; flex-wrap:nowrap; align-items:center; gap:8px 12px; min-height:44px; padding:2px 0 8px; overflow:hidden; white-space:nowrap; font-size:14px; color:var(--text-heading); }

.strip-line.wrap{ flex-wrap:wrap; row-gap:6px; overflow:visible; }
.sl-path{ display:inline-flex; align-items:baseline; gap:6px; font-size:14px; } .sl-path b{ font-weight:600; } .sl-path .sep{ color:var(--text-placeholder); }
.sl-path .linky{ font-size:14px; white-space:nowrap; } .sl-mids{ display:inline-flex; align-items:baseline; gap:6px; } .sl-dots{ display:inline-flex; align-items:baseline; gap:6px; color:var(--text-muted); cursor:help; }
.sl-num{ font-size:21px; line-height:1; font-weight:600; letter-spacing:-.018em; color:var(--text-heading); font-variant-numeric:tabular-nums; cursor:help; }
.sl-num .u{ font-size:13px; font-weight:500; letter-spacing:0; color:var(--text-muted); margin-left:3px; }
.sl-num.mine0{ font-size:15px; font-weight:500; letter-spacing:0; color:var(--text-muted); text-decoration:underline dotted var(--text-placeholder); text-underline-offset:4px; }
.sl-shift .shift{ font-size:13px; color:var(--text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
.sl-dims{ display:inline-flex; align-items:center; gap:6px; margin:0; } .sl-dims .x{ color:var(--text-placeholder); }
.strip-line select,.ctl select{ height:30px; max-width:220px; font-size:13px; font-weight:500; field-sizing:content; }
.sl-pass{ font-size:12px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.sl-cnt,.sl-icon{ display:inline-flex; align-items:center; justify-content:center; gap:5px; height:32px; border-radius:var(--r-md); font-size:13px; font-weight:500; font-variant-numeric:tabular-nums; }
.sl-cnt{ padding:0 10px; white-space:nowrap; border:1px solid var(--border-strong); background:var(--surface-card); color:var(--text-heading); } .sl-cnt:hover{ border-color:var(--text-placeholder); background:var(--surface-hover); }
.sl-cnt svg{ color:var(--text-muted); }
.sl-icon{ width:32px; padding:0; border:1px solid transparent; background:none; color:var(--text-muted); } .sl-icon:hover{ background:var(--surface-sunk); color:var(--text-heading); }
.sl-cnt svg,.sl-icon svg{ width:16px; height:16px; display:block; }
.strip-line .sl-list{ height:32px; }
/* снимок полосы: пришли данные новее — плашка в строке; «Обновить» берёт новые, путь и вид остаются */
.sl-fresh{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 4px 0 10px; border-radius:var(--radius-pill); background:var(--asubk-blue-tint); box-shadow:inset 0 0 0 1px rgba(0,106,245,.28); color:var(--text-heading); font-size:12.5px; font-weight:500; }
.sl-fresh .linky{ height:22px; padding:0 8px; border-radius:var(--radius-pill); font-size:12.5px; } .sl-fresh .linky:hover{ background:rgba(0,106,245,.12); text-decoration:none; }
/* загрузка и очередь: скелет — та же разметка вида без чисел (серые плашки той же длины), высота полосы не прыгает; состояние — плашкой поверх скелета */
.sk-w{ position:relative; }
.sk .sk-t{ color:transparent; background:var(--surface-sunk); border-radius:4px; }
.sk .rz-f,.sk .sr-b,.sk .rz-z,.sk .sr-zero,.sk .pf-pl,.sk .pf-mk,.sk .fn-s,.sk .sb-b{ background:var(--surface-sunk); box-shadow:none; } .sk .chipv{ background:none; } .sk .heat td.c,.sk .heat td.t,.sk .tb td.key{ background:var(--surface-panel); } .sk .rz-r,.sk .heat td.c,.sk .tb tr.rowlink{ cursor:default; }
.sk-st{ position:absolute; top:24px; left:50%; transform:translateX(-50%); z-index:2; display:inline-flex; align-items:center; gap:6px; max-width:calc(100% - 16px); padding:5px 12px; border-radius:var(--radius-pill); background:var(--surface-card);
  border:1px solid var(--border-default); box-shadow:var(--shadow-lift); font-size:12.5px; color:var(--text-secondary); white-space:nowrap; }
.sk-st.long{ border-color:var(--asubk-amber-line); }
/* часть, которая не ответила: «—» на её месте, причина — подсказкой; ноль и прошлое значение не подставляются */
.rz-r.dn{ cursor:default; } .rz-r.dn:hover{ background:none; } .rz-r.dn .rz-nm{ color:var(--text-secondary); } .rz-v.dn,.rz-d.dn{ color:var(--text-muted); font-weight:400; cursor:help; }
.rz-d.pend,.tb .pend,.heat .pend{ color:var(--text-placeholder); }
.tb td.dn,.tb th.dn{ color:var(--text-muted); cursor:help; } .heat td.dn{ background:var(--surface-panel); color:var(--text-muted); cursor:help; }
.seg button.pend{ color:var(--text-muted); }
.dn-tag{ margin-left:6px; font-size:11.5px; font-weight:400; color:var(--text-muted); white-space:nowrap; } .tb th .dn-tag{ display:block; margin:1px 0 0; }
/* тело: прокручивается внутри полосы; сверху его — «Сумма | Изменение» и настройки вида; одна тонкая линия отделяет строку от графика */
.strip-b{ flex:1 1 auto; min-height:0; overflow:auto; border-top:1px solid var(--border-default); padding:0 0 16px; }
.strip-tools{ position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; padding:12px 0; background:var(--surface-card); font-size:12.5px; color:var(--text-muted); }
.strip-tools .strip-mode{ display:inline-flex; align-items:center; gap:10px; }
.ctl{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; font-size:13px; color:var(--text-secondary); } .ctl .opt{ margin:0; gap:8px; max-width:100%; min-width:0; }
.ctl .opt select{ min-width:0; flex:1 1 auto; } .ctl .cols{ flex-wrap:wrap; gap:4px 14px; } .ctl .opt.off{ color:var(--text-placeholder); }
/* переключатель: серая дорожка, выбранное — белая пилюля */
.seg{ display:inline-flex; padding:3px; gap:2px; border-radius:10px; background:var(--surface-sunk); }
.seg button{ height:26px; padding:0 11px; border:0; border-radius:7px; background:none; color:var(--text-secondary); font-size:13px; font-weight:500; white-space:nowrap; }
.seg button:hover{ color:var(--text-heading); }
.seg button.on{ background:var(--surface-card); color:var(--text-heading); box-shadow:0 1px 2px rgba(24,39,57,.12), 0 0 0 1px var(--border-default); }
.seg button.off{ color:var(--text-placeholder); cursor:not-allowed; }
.strip-line .seg button{ height:28px; padding:0 12px; }
.ls{ background:none; border:none; padding:2px 4px; border-radius:5px; color:var(--text-link); font-size:12px; font-weight:500; line-height:1.2; white-space:nowrap; font-variant-numeric:tabular-nums; }
.ls:hover{ background:var(--asubk-blue-tint); } .ls.zero{ opacity:.5; }

/* Разрез: строки «название · сумма · к базе · ☰ N · полоса»; сумма сразу за названием, полоса — остаток ширины (экраны от 1920, не растягивается);
   «Изменение» — разница первым числом, сумма вторым, полоса от общей линии нуля: рост вправо, падение влево */
.rz{ --rz-cols:220px 96px 104px 60px minmax(0,1fr); display:flex; flex-direction:column; gap:2px; font-size:13px; font-variant-numeric:tabular-nums; }
.rz.c4{ --rz-cols:220px 96px 60px minmax(0,1fr); }
.rz-hd,.rz-r{ display:grid; grid-template-columns:var(--rz-cols); gap:14px; align-items:center; padding:5px 8px; border-radius:var(--r-md); }
.rz-hd{ padding-top:0; padding-bottom:4px; font-size:11.5px; color:var(--text-muted); } .rz-hd span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .rz-hd span:nth-child(2),.rz-hd span:nth-child(3){ text-align:right; }
.rz-r{ cursor:pointer; min-height:32px; } .rz-r:hover{ background:var(--surface-hover); } .rz-r:hover .rz-nm{ color:var(--text-link); }
.rz-nm{ min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-heading); }
.rz-v,.rz-d{ text-align:right; white-space:nowrap; } .rz-v{ color:var(--text-heading); font-weight:600; } .rz.chg .rz-v{ font-weight:400; color:var(--text-secondary); } .rz.chg .rz-d{ font-weight:600; }
.rz-d{ color:var(--text-secondary); } .rz-d.bad{ color:var(--asubk-red); } .rz-d.good{ color:var(--asubk-green); } .rz-d.flat{ color:var(--text-muted); }
.rz-c .ls{ padding:2px 4px; font-size:12.5px; line-height:1; } .rz-c .ls.quiet{ color:var(--text-muted); } .rz-c .st{ color:var(--text-muted); font-size:12.5px; white-space:nowrap; cursor:help; }
.rz-t{ position:relative; height:12px; min-width:0; } .rz-f{ position:absolute; top:0; bottom:0; left:0; background:var(--series-1); border-radius:0 4px 4px 0; }
.rz-f.neg{ border-radius:4px 0 0 4px; } .rz-f.bad{ background:var(--asubk-red); } .rz-f.good{ background:var(--asubk-green); }
.rz-z{ position:absolute; top:-7px; bottom:-7px; width:1px; background:var(--border-strong); }
.rz-more{ cursor:default; } .rz-more:hover{ background:none; } .rz-more:hover .rz-nm{ color:var(--text-muted); } .rz-more .rz-nm,.rz-more .rz-v{ color:var(--text-muted); font-weight:400; }
.rz-more .rz-f{ background:var(--seq-200); } .rz-more .rz-f.bad,.rz-more .rz-f.good{ opacity:.45; }
.rz-tot{ cursor:default; border-top:1px solid var(--border-default); border-radius:0; margin-top:4px; padding-top:8px; color:var(--text-muted); } .rz-tot:hover{ background:none; } .rz-tot:hover .rz-nm{ color:var(--text-muted); }
.rz-tot .rz-nm{ color:var(--text-muted); } .rz-tot .rz-v{ color:var(--text-heading); font-weight:600; } .rz.chg .rz-tot .rz-d{ font-weight:500; }
/* Движение: те же колонки, что у Разреза, название шире (260 px); начало и конец — серые строки без полос, потоки — полосы от общей линии нуля, «прочее» серым */
.rz.mv-w{ --rz-cols:260px 104px 60px minmax(0,1fr); }
.mv-cap{ font-size:12.5px; color:var(--text-muted); margin:4px 0 10px; } .mv-cap b{ font-weight:600; color:var(--text-heading); }
.mv-sg{ display:inline-block; width:14px; color:var(--text-muted); }
.mv-w .rz-v.bad{ color:var(--asubk-red); } .mv-w .rz-v.good{ color:var(--asubk-green); } .mv-w .rz-v.neu{ color:var(--text-muted); }
.mv-w .rz-f.neu{ background:var(--asubk-ink-45); }
.mv-w .mv-e{ cursor:default; background:var(--surface-panel); } .mv-w .mv-e:hover{ background:var(--surface-panel); } .mv-w .mv-e:hover .rz-nm{ color:var(--text-heading); } .mv-w .mv-e .rz-v{ font-weight:600; }
/* цепочка не уходит под прокрутку полосы: прилипает к низу видимой части (bottom — минус нижний отступ .strip-b), на белом поверх строк */
.mv-chain{ position:sticky; bottom:-16px; z-index:1; display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 -16px; padding:8px 0 16px; border-top:1px solid var(--asubk-grid-line); background:var(--surface-card); font-size:12px; line-height:1.4; color:var(--text-muted); cursor:help; font-variant-numeric:tabular-nums; }
.mv-w .rz-nm .pill{ margin-left:8px; vertical-align:1px; }
/* «пришли из … / ушли в …» под строкой узла Разреза в «Изменении»: серая мелкая подстрока под суммой, «☰» — список перехода */
.rz-r.has-mv{ row-gap:1px; }
.rz-mv{ grid-column:2/-1; display:flex; flex-wrap:wrap; align-items:center; gap:0 6px; min-width:0; font-size:12px; line-height:1.35; color:var(--text-muted); }
.rz-mvp{ display:inline-flex; align-items:center; gap:2px; white-space:nowrap; } .rz-mv .ls{ font-size:12px; padding:1px 3px; } .rz-mvs{ font-variant-numeric:tabular-nums; } .rz-mvd{ color:var(--text-placeholder); }
.total-row{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--asubk-grid-line); margin-top:3px; padding-top:2px; }
svg.chart text{ font:11px var(--asubk-font); fill:var(--text-muted); }
/* Ряд: столбцы по числу точек (6/12/24) — HTML, не растянутый рисунок; сумма над каждым, под месяцем — разница (в «Изменении» — сумма), «☰ N» — при наведении;
   высота графика одна в обоих положениях «Сумма | Изменение»; у́же 52 px на точку не жмётся — прокрутка */
.sr-cap{ font-size:12.5px; line-height:1.4; color:var(--text-muted); margin:4px 0 10px; } .sr-cap b{ font-weight:600; color:var(--text-heading); }
.sr{ min-width:calc(var(--n) * 52px); }
.sr-grid{ display:grid; grid-template-columns:repeat(var(--n), minmax(0, 1fr)); }
.sr-c{ position:relative; display:flex; flex-direction:column; min-width:0; text-align:center; }
.sr-sl{ position:relative; height:150px; border-radius:var(--r-sm) var(--r-sm) 0 0; }
.sr.sum .sr-sl{ border-bottom:1px solid var(--border-strong); }
.sr-c:hover .sr-sl{ background:var(--asubk-blue-tint); }
.sr-c.base .sr-sl{ box-shadow:inset 0 -2px 0 var(--asubk-blue); }
.sr-c.base .sr-mo{ color:var(--asubk-link); font-weight:600; }
/* точка до запуска системы — из легаси (строки переноса): столбец со штриховкой; у первой своей точки разница — с пометкой «редакции формы разные» */
.sr .sr-c.lg .sr-b{ background:repeating-linear-gradient(135deg, var(--seq-300) 0 4px, var(--seq-100) 4px 8px); }
.sr-c.lg .sr-mo{ color:var(--text-muted); } .sr-d.lgd{ text-decoration:underline dotted var(--text-placeholder); text-underline-offset:3px; cursor:help; }
.sr-hit{ position:absolute; inset:0; z-index:1; width:100%; height:100%; padding:0; border:none; border-radius:inherit; background:none; cursor:pointer; } .sr-hit:focus-visible{ outline:2px solid var(--asubk-blue); outline-offset:-2px; }
.sr-b{ position:absolute; left:50%; bottom:0; width:46%; max-width:72px; transform:translateX(-50%); background:var(--series-1); border-radius:4px 4px 0 0; pointer-events:none; }

/* Карта: названия 220 px, ячейки делят остаток поровну, 13 px; справа итог строки, снизу итог столбца, в углу общий; под числом итога мелко второе;
   в ячейке одно число — то, что нарисовано цветом. «☰ N» — в углу ячейки при наведении (на касании — под числом). Уже 620 px — прокрутка внутри блока (scrollBox) */
.heat{ border-collapse:separate; border-spacing:3px; width:100%; min-width:620px; table-layout:fixed; font-size:13px; font-variant-numeric:tabular-nums;

.heat td{ position:relative; height:42px; padding:0 6px; text-align:center; border-radius:7px; }

.heat td.c{ cursor:pointer; } .heat td.c:hover{ box-shadow:inset 0 0 0 2px var(--text-heading); }

.heat .s2{ display:block; margin-top:1px; font-size:11.5px; font-weight:400; color:var(--text-muted); }
.heat .bad{ color:var(--asubk-red); } .heat .good{ color:var(--asubk-green); } .heat .flat{ color:var(--text-muted); }
.hm-e{ background:var(--surface-panel); color:var(--text-placeholder); } .hm-z{ background:var(--hm-z, #eef1f5); color:var(--text-muted); }
.hm-s1{ background:var(--seq-100); color:var(--asubk-ink); } .hm-s2{ background:var(--seq-200); color:var(--asubk-ink); } .hm-s3{ background:var(--seq-300); color:var(--asubk-ink); }
.hm-s4{ background:var(--seq-400); color:#fff; } .hm-s5{ background:var(--seq-500); color:#fff; } .hm-s6{ background:var(--seq-700); color:#fff; }
.hm-r1{ background:var(--hm-r1); color:#7a1d1d; } .hm-r2{ background:var(--hm-r2); color:#5c1111; } .hm-r3{ background:var(--hm-r3); color:#fff; }
.hm-g1{ background:var(--hm-g1); color:#14532d; } .hm-g2{ background:var(--hm-g2); color:#14532d; } .hm-g3{ background:var(--hm-g3); color:#fff; }

.heat.co col.co-vc{ width:110px; } .heat.co th.co-vh{ text-align:right; } .heat.co td.co-v{ text-align:right; color:var(--text-secondary); white-space:nowrap; cursor:help; }
.heat.co td.co-y{ background:none; } .heat td.c.lt{ background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.42) 0 4px, transparent 4px 9px); }
/* Переходы: та же Карта — колонка «ушли», строка «новые», справа итог на дату базы, снизу — сегодня */
.heat.tr-m col.tr-g{ width:96px; }
.hm-x1{ background:#eef1f5; color:var(--asubk-ink); } .hm-x2{ background:#d9dfe7; color:var(--asubk-ink); } .hm-x3{ background:#a9b4c2; color:var(--asubk-ink); }
/* план-факт: серая полоса — план, синяя — факт поверх, тёмная черта — план; справа — к плану */
.rz.pf{ --rz-cols:220px 170px 76px 60px minmax(0,1fr) 104px; }
.pf-p{ text-align:right; white-space:nowrap; font-weight:600; color:var(--text-heading); } .pf-p .chipv{ padding:1px 6px; border-radius:5px; }
.pf-n{ text-align:right; white-space:nowrap; color:var(--text-muted); } .pf-n.bad{ color:var(--asubk-red); } .pf-n.good{ color:var(--asubk-green); }
.pf-t .pf-pl{ position:absolute; top:0; bottom:0; left:0; background:var(--surface-sunk); border-radius:0 4px 4px 0; } .pf-t .rz-f{ top:2px; bottom:2px; }
.pf-mk{ position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--asubk-ink); border-radius:1px; }
/* воронка: полоса «дошли до этапа» — дальше прошли синим, в работе серым, выбыли светло-красным; слева переход, справа выбывшие с причиной */
.rz.fn{ --rz-cols:220px 80px 64px 60px minmax(0,1fr) 260px; }
.fn-c{ text-align:right; white-space:nowrap; color:var(--text-secondary); } .fn-n{ display:flex; flex-wrap:wrap; gap:0 8px; white-space:nowrap; font-size:12.5px; }
.fn-n .ls.bad{ color:var(--asubk-red); } .fn-n .ls.quiet{ color:var(--text-muted); }
.fn-t .fn-b{ position:absolute; top:0; bottom:0; left:0; display:flex; border-radius:0 4px 4px 0; overflow:hidden; }
.fn-s{ display:block; height:100%; } .fn-s.go{ background:var(--series-1); } .fn-s.work{ background:var(--asubk-ink-45); } .fn-s.loss{ background:var(--tl-red-bg); box-shadow:inset 0 0 0 1px rgba(224,58,58,.35); }
/* «крупнейшие»: рядом с суммой — накопленная доля */

.rz-k{ text-align:right; white-space:nowrap; color:var(--text-muted); }
/* Ряд по разрезу: строка — название · число · мини-столбцы всех точек на одной шкале · изменение за период · «☰ N» */
.sb{ display:flex; flex-direction:column; gap:2px; font-size:13px; font-variant-numeric:tabular-nums; }
.sb-r{ display:grid; grid-template-columns:220px 96px minmax(0,1fr) 110px 60px; gap:14px; align-items:center; padding:4px 8px; border-radius:var(--r-md); cursor:pointer; min-height:44px; }
.sb-r:hover{ background:var(--surface-hover); } .sb-r:hover .rz-nm{ color:var(--text-link); }
.sb-hd,.sb-more,.sb-tot{ cursor:default; } .sb-hd:hover,.sb-more:hover,.sb-tot:hover{ background:none; } .sb-more:hover .rz-nm,.sb-tot:hover .rz-nm{ color:var(--text-muted); }
.sb-hd{ min-height:0; padding-top:0; padding-bottom:2px; font-size:11.5px; color:var(--text-muted); } .sb-hd span:nth-child(2),.sb-hd span:nth-child(4){ text-align:right; }
.sb-more .rz-nm,.sb-more .rz-v{ color:var(--text-muted); font-weight:400; } .sb-more .sb-b{ background:var(--seq-200); }
.sb-tot{ border-top:1px solid var(--border-default); border-radius:0; margin-top:4px; } .sb-tot .rz-nm{ color:var(--text-muted); }
.sb-ps{ position:relative; display:flex; align-items:flex-end; gap:2px; height:36px; min-width:0; }
.sb-p{ position:relative; flex:1 1 0; min-width:0; height:100%; } .sb-b{ position:absolute; left:0; right:0; bottom:0; background:var(--series-1); border-radius:2px 2px 0 0; }
.sb-ps:not(.chg) .sb-p.lt .sb-b{ background:var(--seq-200); }
.sb-ps.chg{ background:linear-gradient(var(--border-strong), var(--border-strong)) 0 50% / 100% 1px no-repeat; } .sb-ps.chg .sb-b{ bottom:50%; } .sb-ps.chg .sb-b.dn{ bottom:auto; top:50%; border-radius:0 0 2px 2px; }
.sb-b.bad{ background:var(--asubk-red); } .sb-b.good{ background:var(--asubk-green); } .sb-b.flat{ background:var(--seq-300); } .sb-ps.chg .sb-p.lt .sb-b{ opacity:.5; }
.tbl{ border-collapse:collapse; width:100%; font-size:13px; }
.hscroll{ position:relative; } .hs-in{ overflow-x:auto; } .hs-hint{ display:none; font-size:11.5px; color:var(--text-muted); margin-top:4px; } .hscroll.over + .hs-hint{ display:block; }
.hscroll.over::after{ content:''; position:absolute; top:0; right:0; bottom:0; width:36px; pointer-events:none; background:linear-gradient(to right, rgba(255,255,255,0), var(--surface-card)); } .hscroll.over.end::after{ display:none; }
.tbl th,.tbl td{ padding:6px 8px; border-bottom:1px solid var(--border-default); text-align:right; font-variant-numeric:tabular-nums; }
.tbl th:first-child,.tbl td:first-child{ text-align:left; } .tbl th{ color:var(--text-muted); font-weight:500; }

/* Таблица полосы: названия 220 px, числа — колонками по 170 px, «☰ N» — последней; ширина считается по числу колонок и не растягивается — справа пусто (экраны от 1920).
   Первая колонка — показатель плитки: заголовок темнее, ячейки на мягком синем, маркер порядка; итог — строкой снизу, под основным числом мелко второе. Уже 600 px — колонки у́же, прокрутка внутри блока (scrollBox) */

.tb{ --tb-nm:220px; --tb-n:170px; --tb-ls:70px; table-layout:fixed; border-collapse:collapse; width:calc(var(--tb-nm) + var(--tb-k) * var(--tb-n) + var(--tb-ls)); font-size:13px; font-variant-numeric:tabular-nums; }
.tb col.tb-cn{ width:var(--tb-nm); } .tb col.tb-cv{ width:var(--tb-n); } .tb col.tb-cl{ width:var(--tb-ls); }

.tb th:first-child,.tb td:first-child{ text-align:left; }
.tb th{ padding-top:0; padding-bottom:6px; vertical-align:bottom; font-size:12px; font-weight:500; line-height:1.3; color:var(--text-muted); }
.tb th.key{ color:var(--text-heading); } .tb-ord{ margin-left:4px; font-weight:400; color:var(--text-muted); cursor:help; }
.tb td{ color:var(--text-heading); } .tb td:first-child{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tb td.d{ font-size:12.5px; }
.tb td.key{ background:var(--asubk-blue-tint); }
.tb .bad{ color:var(--asubk-red); } .tb .good{ color:var(--asubk-green); } .tb .flat{ color:var(--text-muted); }
.tb td .s2{ display:block; margin-top:1px; font-size:11.5px; font-weight:400; color:var(--text-muted); } .tb td .s2.bad{ color:var(--asubk-red); } .tb td .s2.good{ color:var(--asubk-green); } .tb td .s2.flat{ color:var(--text-muted); }
.tb tr.rowlink{ cursor:pointer; } .tb tr.rowlink:hover td{ background:var(--surface-hover); } .tb tr.rowlink:hover td:first-child{ color:var(--text-link); }

/* ---------- Меню, подсказка, ящик, окно ввода, тост ---------- */

.grid.pv{ grid-template-columns:repeat(2,minmax(0,1fr)); }

/* ---------- Каталог — витрина: секции по объекту, строка — название, значения параметров, живое число, действие ---------- */
.cat-lead{ margin:0 0 12px; }
.cat-bar input[type=text]{ flex:1 1 260px; min-width:0; }
/* переключатель «только доступные мне»: пилюля-дорожка с белым бегунком */
.sw{ display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-secondary); cursor:pointer; white-space:nowrap; }
.sw input{ appearance:none; -webkit-appearance:none; position:relative; flex:none; width:32px; height:18px; margin:0; border-radius:var(--radius-pill); background:var(--surface-sunk); box-shadow:inset 0 0 0 1px var(--border-strong); cursor:pointer; }
.sw input::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--surface-card); box-shadow:0 1px 2px rgba(24,39,57,.25); }
.sw input:checked{ background:var(--asubk-blue); box-shadow:none; } .sw input:checked::after{ left:16px; }
@media (prefers-reduced-motion:no-preference){ .sw input,.sw input::after{ transition:background .12s, left .12s; } }
.cat-n{ margin-left:auto; color:var(--text-muted); font-size:13px; white-space:nowrap; }
.cat-sec{ margin:0 0 18px; }
.cat-h{ display:flex; align-items:baseline; gap:8px; margin:0 0 8px; font-size:15px; font-weight:600; letter-spacing:-.005em; color:var(--text-heading); }
.cat-c{ font-size:13px; font-weight:400; color:var(--text-muted); }
.cat-list{ background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.cat-row{ display:grid; grid-template-columns:minmax(0,1fr) 150px 250px; gap:4px 20px; align-items:center; min-height:56px; padding:9px 16px; border-bottom:1px solid var(--asubk-grid-line); }
.cat-row:last-child{ border-bottom:0; } .cat-row:hover{ background:var(--surface-hover); }
.cat-m{ min-width:0; } .cat-t{ font-weight:500; color:var(--text-heading); overflow-wrap:anywhere; }
.cat-m .chip,.cat-m .pill{ height:20px; margin-left:4px; padding:0 7px; font-size:11.5px; vertical-align:1px; }
.cat-p{ margin-top:2px; font-size:12.5px; line-height:1.4; color:var(--text-muted); }
.cat-v{ justify-self:end; font-size:18px; line-height:1.2; font-weight:600; letter-spacing:-.01em; color:var(--text-heading); font-variant-numeric:tabular-nums; white-space:nowrap; cursor:help; }
.cat-v .u{ margin-left:3px; font-size:12.5px; font-weight:500; letter-spacing:0; color:var(--text-muted); }
.cat-v .st{ font-size:12.5px; font-weight:400; letter-spacing:0; color:var(--text-muted); }
.cat-a{ min-width:0; font-size:12.5px; line-height:1.4; } .cat-has{ color:var(--text-muted); }
.cat-empty{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; padding:16px; margin-bottom:18px; background:var(--surface-card); border:1px dashed var(--border-strong); border-radius:var(--r-lg); font-size:14px; }
.cat-empty .sep{ color:var(--text-disabled); }
/* ---------- Реестр плиток: очередь предложений, кандидат на снятие; заглушка снятой; правка раскладки роли ---------- */
.prop{ display:grid; grid-template-columns:minmax(240px,300px) minmax(0,1fr); gap:14px 20px; padding:14px 16px; margin-bottom:12px; background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--r-lg); box-shadow:var(--shadow); }
.prop-cap{ margin-bottom:6px; font-size:12px; color:var(--text-muted); } .prop-pv{ min-width:0; max-width:360px; } .prop-pv .tile{ cursor:default; }
.prop-h{ margin-bottom:2px; font-size:14px; } .prop-c{ margin:10px 0 8px; } .prop-c li{ margin:2px 0; font-size:13px; }
.prop-dup{ margin:0 0 4px; } .prop-a{ display:flex; gap:8px; margin-top:10px; }
.pill.cand{ background:var(--asubk-amber-tint); color:var(--asubk-amber); } .pill.new{ background:var(--asubk-blue-tint); color:var(--asubk-link); }
/* пульт «Плитки дашборда»: одна колонка — дела, фильтры, каталог секциями */
.pult{ display:flex; flex-direction:column; gap:16px; }
.pl-card{ background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
.pl-h{ display:flex; align-items:baseline; gap:10px; padding:14px 18px 10px; } .pl-h .h2{ margin:0; } .pl-h .h2[data-tip]{ cursor:help; text-decoration:underline dotted var(--text-placeholder); text-underline-offset:4px; }
.pl-card .prop{ margin:0; padding:14px 18px; border:0; border-top:1px solid var(--asubk-grid-line); border-radius:0; box-shadow:none; }
.deal{ display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 18px; border-top:1px solid var(--asubk-grid-line); font-size:13.5px; }
.deal .what b{ color:var(--text-heading); } .deal .sub{ margin-top:2px; font-size:12.5px; color:var(--text-muted); }
.deal-acts{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.ic{ width:22px; height:22px; display:grid; place-items:center; border-radius:var(--r-sm); font-size:13px; font-weight:700; }
.ic.crit{ background:var(--tl-red-bg); color:var(--tl-red-ink); } .ic.warn{ background:var(--tl-yellow-bg); color:var(--tl-yellow-ink); }
.ic.idle{ background:var(--surface-sunk); color:var(--text-muted); } .ic.okc{ background:var(--tl-green-bg); color:var(--tl-green-ink); }
.deal-l summary{ cursor:pointer; } .deal-l .dl-r{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0; border-top:1px solid var(--asubk-grid-line); color:var(--text-body); }
.pl-ok{ display:grid; grid-template-columns:22px minmax(0,1fr); gap:10px; align-items:center; padding:12px 18px; font-size:13.5px; } .pl-ok b{ color:var(--text-heading); }
.pl-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; } .pl-tools input[type=search]{ flex:0 1 420px; height:36px; }
.pl-tools label{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text-secondary); } .pl-tools select{ height:36px; }
.pl-n{ margin-left:auto; font-size:13px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.pl-sec{ display:grid; grid-template-columns:18px minmax(0,1fr) 100px 230px; gap:10px; align-items:center; width:100%; padding:11px 18px; border:0; border-top:1px solid var(--asubk-grid-line); border-radius:0;
  background:none; color:var(--text-body); font-size:14px; font-weight:400; text-align:left; cursor:pointer; }
.pl-sec:hover{ background:var(--surface-hover); } .pl-sec:disabled{ cursor:default; background:none; color:var(--text-disabled); } .pl-sec:disabled .nm{ color:var(--text-disabled); }
.pl-sec .chev{ color:var(--text-muted); transition:transform .15s; } .pl-sec[aria-expanded="true"] .chev{ transform:rotate(90deg); }
.pl-sec .nm{ font-weight:600; color:var(--text-heading); } .pl-sec .ct{ font-variant-numeric:tabular-nums; } .pl-sec .op{ text-align:right; font-size:13px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.flag{ margin-left:8px; padding:1px 8px; border-radius:var(--radius-pill); font-size:12px; font-weight:500; } .flag.crit{ background:var(--tl-red-bg); color:var(--tl-red-ink); } .flag.idle{ background:var(--surface-sunk); color:var(--text-secondary); }
.pl-t{ width:100%; border-collapse:collapse; table-layout:fixed; font-size:13.5px; }
.pl-t th{ padding:8px 12px; background:var(--surface-hover); border-top:1px solid var(--asubk-grid-line); border-bottom:1px solid var(--asubk-grid-line); text-align:left; font-size:12.5px; font-weight:500; color:var(--text-muted); }
.pl-t th button{ padding:0; border:0; background:none; font:inherit; color:inherit; cursor:pointer; } .pl-t th button:hover{ color:var(--text-heading); } .pl-t th[aria-sort] button{ color:var(--text-heading); }
.pl-t td{ padding:9px 12px; border-bottom:1px solid var(--asubk-grid-line); vertical-align:top; line-height:1.35; overflow-wrap:anywhere; }
.pl-t .n{ text-align:right; font-variant-numeric:tabular-nums; } .pl-t .p{ margin-top:2px; font-size:12.5px; color:var(--text-muted); } .pl-t .bad{ margin-top:2px; font-size:12.5px; }
.pl-more{ width:28px; height:28px; display:inline-grid; place-items:center; padding:0; border:1px solid transparent; border-radius:var(--r-md); background:none; color:var(--text-muted); }
.pl-more:hover{ background:var(--surface-sunk); color:var(--text-heading); } .pl-more svg{ width:16px; height:16px; }
@media (prefers-reduced-motion:reduce){ .pl-sec .chev{ transition:none; } }
.tile.flash{ border-color:var(--asubk-blue-ring); box-shadow:0 0 0 2px var(--asubk-blue-ring), var(--shadow); }
.tile.gone{ cursor:default; background:var(--surface-panel); border-style:dashed; box-shadow:none; }
.gone-act{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.news{ position:relative; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; padding-right:44px; }
.news-x{ position:absolute; top:6px; right:6px; width:28px; height:28px; display:grid; place-items:center; padding:0; border:0; border-radius:var(--r-sm); background:none; color:var(--text-muted); }
.news-x:hover{ background:rgba(0,106,245,.12); color:var(--text-heading); } .news-x svg{ width:12px; height:12px; }
.news-note{ margin:0 0 12px; font-size:13px; color:var(--text-muted); }
.ld-bar{ position:sticky; top:0; z-index:3; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:10px 14px; margin:0 0 12px; border-radius:var(--r-lg);
  background:linear-gradient(var(--asubk-blue-tint), var(--asubk-blue-tint)), var(--surface-card); box-shadow:0 0 0 1px var(--asubk-blue-ring); font-size:13.5px; color:var(--text-heading); }
.ld-bar .ld-r{ margin-left:auto; display:flex; gap:8px; }
.ask.wwin,.ask.rwin{ width:min(560px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; top:50%; transform:translate(-50%, -50%); }
.ask select{ width:100%; max-width:100%; } .ask .kv{ grid-template-columns:170px minmax(0,1fr); margin:10px 0 12px; }
.rw-s{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chip-b{ min-height:26px; padding:2px 10px; border:1px solid var(--border-default); border-radius:var(--radius-pill); background:var(--surface-sunk); color:var(--text-secondary); font-size:12.5px; text-align:left; }
.chip-b:hover{ border-color:var(--border-strong); color:var(--text-heading); }
/* телефон: каталог — просмотр и «Добавить»; реестр плиток, «Настроить» и «Опубликовать в каталог» — только на компьютере */
.phone-only{ display:none; }
.nav-m{ display:none; } .nav-m select{ height:32px; max-width:min(260px, 64vw); padding:0 6px; border-color:transparent; background:none; font-size:16px; font-weight:600; color:var(--text-heading); field-sizing:content; }
.nav-m select:hover{ border-color:var(--border-strong); background:var(--surface-card); }
.prop-c summary{ cursor:pointer; font-size:13px; font-weight:500; } .prop-c .checks{ margin:6px 0 0; }

/* ---------- Панель «Кто в этом числе»: немодальная, справа, без затемнения — сдвигает дашборд; сетка — в две колонки; на телефоне — экран целиком ---------- */
:root{ --who-w:clamp(560px,50vw,960px); }
.who-p{ flex:none; width:var(--who-w); height:100vh; display:flex; flex-direction:column; min-width:0; background:var(--surface-card); border-left:1px solid var(--border-default); box-shadow:var(--shadow); container:who / inline-size; }
.who-p[hidden]{ display:none; }
.with-who .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
/* панель открыта — меню слева уходит в список разделов шапки, как на узком окне: дашборду остаётся место для полосы */
.with-who .sidebar,.with-who .crumb-title{ display:none; } .with-who .nav-m{ display:block; }
.wp-h{ flex:none; display:flex; align-items:flex-start; gap:6px; padding:14px 14px 8px 18px; }
.wp-tt{ flex:1 1 auto; min-width:0; }
.wp-h h3{ margin:0 0 2px; font-size:15px; line-height:1.3; font-weight:600; color:var(--text-heading); }
.wp-path{ font-size:13px; line-height:1.4; color:var(--text-secondary); overflow-wrap:anywhere; } .wp-path b{ color:var(--text-heading); font-weight:600; } .wp-path .sep{ margin:0 5px; color:var(--text-placeholder); }
.wp-conv{ flex:none; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 12px; padding:0 18px 8px; font-size:13px; line-height:1.4; }
.wp-conv b{ font-weight:600; color:var(--text-heading); font-variant-numeric:tabular-nums; } .wp-meta{ color:var(--text-muted); font-size:12px; font-variant-numeric:tabular-nums; }
.wp-seen{ flex:none; margin:0 18px 8px; padding:7px 12px; font-size:12.5px; }
.wp-tools,.wp-exits{ flex:none; display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:0 18px 8px; }
.wp-q{ flex:1 1 180px; min-width:0; height:30px; }
.wp-cols{ position:relative; } .wp-cols summary{ list-style:none; } .wp-cols summary::-webkit-details-marker{ display:none; }
.wp-colm{ position:absolute; z-index:5; right:0; top:34px; width:260px; padding:8px 10px; background:var(--surface-card); border:1px solid var(--border-strong); border-radius:var(--r-lg); box-shadow:var(--shadow-lift); }
.wp-colm .opt{ display:flex; margin:3px 0; } .wp-colm .hint{ margin-top:6px; font-size:12px; color:var(--text-muted); }
.wp-share button{ white-space:nowrap; }
.wp-sort{ display:none; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); } .wp-sort select{ height:30px; max-width:220px; }
/* узкая панель: колонки объекта — строкой под подписью, справа — значение и доля; порядок по любой колонке — списком «Порядок» */
@container who (max-width:900px){ .wl th.wl-c,.wl td.wl-c{ display:none; } .wl td.wl-l{ white-space:normal; min-width:0; } .wl .wl-sub{ display:block; } .wp-tools .wp-sort{ display:inline-flex; } }
.wp-shown{ flex:none; padding:0 18px 6px; font-size:12.5px; color:var(--text-secondary); font-variant-numeric:tabular-nums; }
.wp-b{ flex:1 1 auto; min-height:0; overflow:auto; border-top:1px solid var(--border-default); padding:0 0 24px; }
.wp-b > p{ margin:12px 18px; font-size:13px; } .wp-b > .wp-exits{ padding-top:4px; }
.wl{ border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums; }
.wl th,.wl td{ padding:6px 8px; border-bottom:1px solid var(--border-default); text-align:left; vertical-align:top; white-space:nowrap; }
.wl th{ position:sticky; top:0; z-index:1; background:var(--surface-card); font-weight:500; color:var(--text-muted); }
.wl th:first-child,.wl td:first-child{ padding-left:18px; } .wl th:last-child,.wl td:last-child{ padding-right:18px; }
.wl th.n,.wl td.n{ text-align:right; } .wl th.on{ color:var(--text-heading); }
.wl-s{ border:0; background:none; padding:0; color:inherit; font:inherit; } .wl-s:hover{ color:var(--text-heading); text-decoration:underline; text-underline-offset:3px; }
.wl td.wl-l .linky{ font-weight:500; } .wl-sub{ display:none; margin-top:2px; font-size:11.5px; color:var(--text-muted); white-space:normal; }
.wl tbody tr:hover td{ background:var(--surface-hover); }
.wl td.wl-p{ min-width:96px; }
.wl-bar{ display:block; position:relative; height:4px; margin-top:4px; border-radius:2px; background:var(--surface-sunk); overflow:hidden; }
.wl-bar i{ position:absolute; left:0; top:0; bottom:0; background:var(--series-1); border-radius:2px; }
.wl-bar.two::before{ content:''; position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background:var(--border-strong); }
.wl-bar.two i.pos{ left:50%; } .wl-bar.two i.neg{ left:auto; right:50%; }
.wl-bar.two i.bad{ background:var(--st-crit); } .wl-bar.two i.good{ background:var(--st-good); } .wl-bar.two i.neu{ background:var(--series-1); }
.wl tr.wl-cut td{ padding:3px 18px; font-size:11.5px; color:var(--text-muted); background:var(--surface-hover); border-bottom:1px dashed var(--border-strong); }
/* строка полосы, чей список открыт в панели */
.ls.who-on,.sl-cnt[data-on]{ background:var(--asubk-blue-tint); color:var(--asubk-blue); border-radius:var(--r-sm); }
.rz-r:has(.who-on),.tb tr:has(.who-on) td,.heat td:has(.who-on){ background:var(--asubk-blue-tint); }
.sl-link{ color:var(--text-secondary); }
/* карточка модуля-владельца на месте дашборда: плашка — контекст провала и шаги по списку */
.og-plate{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; margin:0 0 14px; padding:9px 14px; border-radius:10px; background:var(--asubk-blue-tint); font-size:13.5px; line-height:1.45; color:var(--text-heading); }
.og-plate .sep{ color:var(--text-placeholder); } .og-t{ font-variant-numeric:tabular-nums; }
.og-steps{ display:inline-flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; white-space:nowrap; } .og-steps .sl-icon[disabled]{ opacity:.35; cursor:default; }
.card-h{ margin:0 0 12px; } .card-h .h2{ margin:0 0 2px; }
@media (max-width:1100px){ .who-p{ position:fixed; inset:0; z-index:39; width:100vw; height:100vh; border-left:0; } .with-who .content{ overflow:hidden; } }
@media (max-width:600px){ .wp-h{ padding:12px 10px 6px 16px; } .wp-conv,.wp-tools,.wp-exits,.wp-shown{ padding-left:16px; padding-right:16px; } .wp-seen{ margin:0 16px 8px; }
  .wl th:first-child,.wl td:first-child{ padding-left:16px; } .wp-exits .btn{ flex:1 1 auto; } .og-plate{ padding:8px 12px; } }

/* ---------- Ширины ---------- */
@media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } .sidebar{ display:none; } #clock{ display:none; } .cols2{ grid-template-columns:minmax(0,1fr); } .pv-side{ position:static; max-height:none; overflow:visible; }
  .crumb-title{ display:none; } .nav-m{ display:block; } .cat-row{ grid-template-columns:minmax(0,1fr) 130px 200px; gap:4px 14px; } .prop{ grid-template-columns:minmax(0,1fr); } }
@media (max-width:600px){
  .topbar{ padding:8px 16px; gap:8px; } .topbar .right{ margin-left:0; min-width:0; } .tbtn .lbl{ display:none; } .whob{ min-width:0; } .whob select{ max-width:220px; }
  .wrap{ padding:12px 16px 40px; }
  /* верх на телефоне: список «Экран: …», «Фильтр» и «⋯»; охват — строкой под списком; фишки переносятся */
  .topline{ box-shadow:none; min-height:0; gap:8px; } .tabs{ display:none; } .topline > .scope{ display:none; }
  .scr-pick{ display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:0; height:36px; padding:0 2px 0 10px; border:1px solid var(--border-strong); border-radius:var(--r-md); background:var(--surface-card); font-size:13.5px; color:var(--text-muted); }
  .scr-pick:focus-within{ outline:2px solid var(--asubk-blue); outline-offset:2px; }
  .scr-pick select{ flex:1 1 auto; min-width:0; max-width:none; height:34px; padding:0 4px 0 0; border:0; background:none; color:var(--text-heading); font-weight:600; }
  .scr-pick select:focus-visible{ outline:none; }
  .topline{ flex-wrap:wrap; }
.top-r{ flex:1 1 100%; min-width:0; }
.cmp-pick{ flex:1 1 auto; min-width:0; height:36px; }
.cmp-pick select{ flex:1 1 auto; min-width:0; max-width:none; }
.top-r .btn{ height:36px; min-height:36px; } .top-r .more{ width:36px; }
  .scope-m{ display:block; margin-top:6px; font-size:12.5px; color:var(--text-muted); }
  .fw-b{ grid-template-columns:minmax(0,1fr); } .fwin .ask-b{ flex-wrap:wrap; }
  .desk-only{ display:none !important; } .phone-only{ display:block; } .cat-empty .phone-only{ display:inline; }
  .cat-row{ grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; padding:10px 12px; } .cat-m{ grid-column:1/-1; } .cat-v{ justify-self:start; } .cat-a{ justify-self:end; text-align:right; }
  .drawer.cat-d{ width:100vw; border-left:0; } .add-cell{ min-height:64px; }
  .cat-n{ margin-left:0; } .ask .kv{ grid-template-columns:1fr; } .ld-bar .ld-r{ margin-left:0; }
  .strip{ padding:6px 12px 0; }
  /* строка полосы на телефоне переносится; пять видов — одной прокручиваемой строкой внутри; паспорт и «Работать со списком» уходят в «⋯» */
  .strip-line{ flex-wrap:wrap; overflow:visible; white-space:normal; } .strip-line .sl-sp,.strip-line .sl-pass,.strip-line .sl-list{ display:none; }

/* ================= Стенд: настройки «соседей» ================= */
// down — модули-владельцы, ещё не объявившие объекты статистике (готовность соседей; волны — только прогноз порядка); reportsReady — модуль
// отчётности и отчёты каталога: предусловие всего дашборда. partDown — статистика ответила на вид полосы не целиком (часть — «—»); baseDown —
// нет ответа на дату базы; fresh, dataAt — версия данных (сколько раз «пришли новые данные») и её время; overload — отчётность перегружена
// (вопросы ждут в очереди); slow — медленная отчётность (части полосы приходят с задержкой); dayEnd — ответ «сегодня» на конец закрытого дня
// (снимок полосы и списка, открытых по ссылке другого дня); linkNextDay — ссылку открыли на следующий день: стенд живёт одним днём, поэтому
// ссылка считается скопированной вчера (10.10) в то же время
const STAND = { down:{}, reportsReady:true, spells:true, statDown:false, nightRunFailed:false, queueLag:0, nightOnly:{}, overdueUp:false, noAnswer:false, bigOther:false, withdrawn:{}, closedThrough:-2, N:150,
  partDown:false, baseDown:false, launch:null, legacyNoFlows:false, fresh:0, dataAt:null, overload:false, slow:false, noFlows:{}, dayEnd:null, linkNextDay:false, nearDays:7 };
const STAND_SEED = JSON.stringify(STAND);
// время данных стенда: «сегодня» заморожено, пришедшие новые данные сдвигают время расчёта на 5 минут
// dayEnd — ответ на конец закрытого дня (ссылка, открытая на другой день): время данных — «конец 10.10»
const dayLabel = d=>String(d).padStart(2, '0')+'.'+TODAY.iso.slice(5, 7);
const nowTime = ()=>STAND.dayEnd ? 'конец '+dayLabel(STAND.dayEnd) : STAND.dataAt || TODAY.time;
const todayIs = ()=>STAND.dayEnd ? 'на '+nowTime() : 'сегодня', todayTo = ()=>STAND.dayEnd ? dayLabel(STAND.dayEnd) : 'сегодня';   // «сегодня» в подписях видов
const REPORTS_WAIT = 'модуль отчётности и отчёты каталога ещё не готовы — плитка дашборда ссылается на отчёт';
const timePlus = min=>{ const [h, m] = TODAY.time.split(':').map(Number), t = h*60 + m + min; return String(Math.floor(t/60)).padStart(2, '0')+':'+String(t%60).padStart(2, '0'); };

/* ================= Даты, периоды, базы сдвига ================= */
const DATE_MODES = {
  today:      { label:'сегодня', point:{ m:0, today:true } },
  closedDay:  { label:'последний закрытый день', point:{ m:0, day:10 } },
  prevMonthEnd:{ label:'конец прошлого месяца', point:{ m:-1 } },
};
const PERIODS = {
  today:      { label:'сегодня', rel:'сегодня ± 0', months:[0], partial:true, today:true },
  curMonth:   { label:'текущий месяц', rel:'текущий месяц', months:[0], partial:true },
  prevMonth:  { label:'прошлый месяц', rel:'прошлый месяц', months:[-1], base:[-2] },
  curQuarter: { label:'текущий квартал', rel:'текущий квартал', months:[0], partial:true },
  prevQuarter:{ label:'прошлый квартал', rel:'прошлый квартал', months:[-3,-2,-1], base:[-6,-5,-4] },
  ytd:        { label:'с начала года', rel:'текущий год', months:[-9,-8,-7,-6,-5,-4,-3,-2,-1,0], partial:true },
  prevYear:   { label:'прошлый год', rel:'прошлый год', months:[-21,-20,-19,-18,-17,-16,-15,-14,-13,-12,-11,-10], base:[-33,-32,-31,-30,-29,-28,-27,-26,-25,-24,-23,-22] },
};
// закрытый набор относительных значений отчётности: период плитки хранится значением набора (rel), подпись (label) — показ дашборда
const REL_SET = ['сегодня ± 0','текущий месяц','текущий квартал','текущий год','прошлый месяц','прошлый квартал','прошлый год'];
// плитка хранит базу значением второй семьи набора отчётности (rel: «начало года», «год назад»), подставляет его отчётность; подпись
// «за год» — показ дашборда. Стенд стоит за отчётностью: at — подставленное значение
// базы сравнения остатка: начало месяца, квартала, полугодия, года, в котором лежит дата плитки, и «за 12 месяцев» — последний конец
// месяца не позже, чем за год до неё; at(pt) — месяц строки базы (её конец), от даты плитки: у «сегодня» 11.10 — 30.09 · 30.09 · 30.06 ·
// 31.12.2025 · 30.09.2025, у плитки на 30.09 — 31.08 · 30.06 · 30.06 · 31.12.2025 · 30.09.2025. Ключ «за месяц» — prevMonthEnd (прежнее имя)
const STOCK_BASES = {
  prevMonthEnd:{ label:'за месяц', rel:'начало месяца', at:pt=>pt.m - 1 },
  quarterStart:{ label:'за квартал', rel:'начало квартала', at:pt=>pt.m - monthOf(pt.m).mi%3 - 1 },
  halfStart:   { label:'за полугодие', rel:'начало полугодия', at:pt=>pt.m - monthOf(pt.m).mi%6 - 1 },
  yearStart:   { label:'за год', rel:'начало года', at:pt=>pt.m - monthOf(pt.m).mi - 1 },
  yearAgo:     { label:'за 12 месяцев', rel:'год назад', at:pt=>pt.m - (pt.m<0 && !pt.day ? 12 : 13) },
};
// месяц строки базы у даты плитки; ключ вне списка — «за месяц»
const baseMonth = (key, pt)=>(STOCK_BASES[key] || STOCK_BASES.prevMonthEnd).at(pt);
function monthClosed(m){ return m <= STAND.closedThrough; }

/* ================= Значение строки в вопросе ================= */
function exists(row, m){ return (row.from===undefined || row.from<=m); }
function flows(row, m){ return exists(row, m) && (row.to===undefined || m<=row.to); }   // потоки закрытого договора кончаются месяцем закрытия
const LOAN_AT_FIELDS = { overdue:true, risk:true, balance:true };
// «пришли новые данные» (стенд): за каждые 5 минут у каждого девятого кредита в просрочке поступила оплата — 15 % просроченного; дни просрочки
// те же (самый старый неоплаченный платёж остался), остаток меньше на ту же сумму. Меняется только сегодняшнее значение: история та же
function freshPaid(row){ if(!STAND.fresh || !isLoanRow(row) || !(row.overdue>0) || !row.balance) return 0; let od = row.overdue;
  for(let k=1; k<=STAND.fresh; k++) if(hash(row.id+'|fr'+k)%9===0) od *= 0.85;
  return Math.round(row.overdue - od); }
function scen(row, field){ const up = (STAND.overdueUp && (field==='overdue' || field==='risk')) ? 1.18 : 1;
  if(!STAND.fresh || (field!=='overdue' && field!=='balance')) return up; const paid = freshPaid(row); if(!paid) return up;
  return field==='overdue' ? up*(row.overdue - paid)/row.overdue : (row.balance - paid)/row.balance; }
function stockAt(row, I, pt){
  if(STAND.dayEnd && pt.m===0 && !pt.day) pt = { m:0, day:STAND.dayEnd };   // ответ на конец закрытого дня — его строка, а не сегодняшняя
  if(I.currentOnly && !(pt.m===0)) return null;            // состояние без истории: только «сейчас»
  if(!exists(row, pt.m)) return null;
  if(!pt.day && noAnswerAt(row, pt.m)) return null;           // источник не ответил по строке на эту дату — пусто, а не ноль
  if(I.hist && !pt.day && pt.m<0){ const v = I.hist(row, pt.m); return v===undefined ? null : v; }   // строка объекта на ту дату (залог, поступление)
  if(I.stateAt && !pt.day && pt.m<0){ if(!I.stateAt(row, pt.m)) return null; }   // состояние на ту дату (дело, заявка) — из снимка, а не сегодняшнее
  else if(I.where && !I.where(row)) return null;
  if(I.agg==='count') return 1;
  let v = row[I.field] || 0;
  if(pt.m===0 && !pt.day){ const f = scen(row, I.field); return STAND.fresh && f!==1 ? Math.round(v*f) : v*f; }   // новые данные — в целых сомах
  if(!pt.day && LOAN_AT_FIELDS[I.field] && isLoanRow(row)) return loanAt(row, pt.m)[I.field];   // кредит на конец прошлого месяца — его строка на ту дату
  const k = pt.day ? 'd'+pt.day : 'm'+pt.m; const amp = pt.day ? 0.004 : 0.03*Math.min(1,(Math.abs(pt.m)+1)/4);
  const trend = pt.day ? 1 : 1 + pt.m*(I.field==='overdue'||I.field==='risk' ? 0.03 : I.field==='balance' ? 0.004 : I.field==='amount' ? 0.08 : 0.002); // портфель и просрочка растут
  return Math.round(v*trend*jitter(row, k+I.field, amp));
}
function monthFlow(row, field, m){ return flows(row, m) ? (row[field]||0)*jitter(row, 'f'+m+field, 0.12) : 0; }
function flowIn(row, I, period){
  if(I.where && !I.where(row)) return null;
  const P = PERIODS[period], D = STAND.dayEnd || TODAY.day; let s = 0, any = false;   // D — последний день текущего месяца в ответе
  for(const m of P.months){
    if(I.kind==='event'){
      const at = I.atField ? row[I.atField] : row.at; if(at!==m) continue;
      const day = (I.dayField ? row[I.dayField] : row.day) || (1 + hash(row.id)%28);
      if(m===0 && (P.today ? day!==(P.day || D) : day>D)) continue;   // day — один день текущего месяца (вчера у отказа ночного источника)
      any = true; s += I.agg==='count' ? 1 : (row[I.field]||0);
    } else {
      if(!flows(row, m)) continue;
      let v = monthFlow(row, I.field, m); if(m===0) v = P.today ? v/TODAY.daysInMonth : v*D/TODAY.daysInMonth;
      if(v){ any = true; s += v; }
    }
  }
  return any ? (I.agg==='count' ? s : Math.round(s)) : null;
}
function ctxMonth(ctx){ return ctx.point ? ctx.point.m : PERIODS[ctx.period].months[PERIODS[ctx.period].months.length-1]; }
function valueOf(row, I, ctx){
  if(ctx.tf && ctx.tf.length){ const m = ctxMonth(ctx);
    if(!ctx.tf.every(c=>testCond(row, c, null, m))) return null; }   // «действующий» — на дату среза, а не сегодня
  return ctx.period ? flowIn(row, I, ctx.period) : stockAt(row, I, ctx.point); }
// вклад строки в число: пусто — строки в числе нет; у суммы и наибольшего ноль вклада не даёт, у счёта единица есть всегда
function contributes(I, v){ return v!==null && (I.agg==='count' || v!==0); }
function aggregate(rows, I, ctx){
  let acc = I.agg==='max' ? null : 0, n = 0;
  for(const r of rows){ const v = valueOf(r, I, ctx); if(v===null) continue; n++;
    if(I.agg==='max') acc = acc===null ? v : Math.max(acc, v); else acc += v; }

/* ---------- Очереди модулей: вопрос ссылочной плитки объявляет модуль-владелец ---------- */
// «Ждёт меня»: плитка ссылается на очередь, а не на отчёт; «мои» — относительное значение внутри объявления очереди.
const QUEUES = [];
function QD(id, o){ QUEUES.push(Object.assign({ id, dims:[], filter:[] }, o)); }
function queueById(id){ return QUEUES.find(x=>x.id===id); }
function queueOf(t){ const d = typeof t.queue==='string' ? queueById(t.queue) : t.queue; return d ? { module:d.module, name:d.name } : null; }
