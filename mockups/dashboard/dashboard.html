<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд · АСУБК</title>
<!--
  АСУБК · модуль «Дашборд» · макет.
  Логика и решения — ASUBK-dashbord-logika.md, история — ASUBK-status-razrabotki.md.
  Движок window.DB проверяется смоуком: node scripts/inspect/dashboard-check.mjs
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#9A6B00; --asubk-amber-tint:rgba(184,134,11,0.12);
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --header-h:56px; --sidebar-w:260px;
  /* графики: серии — проверенный порядок (валидатор dataviz, light), шкала — одна синяя */
  --series-1:#256abf; --series-2:#d97a1f; --series-3:#7a5bc4;
  --seq-100:#cde2fb; --seq-200:#9ec5f4; --seq-300:#6da7ec; --seq-400:#3987e5; --seq-500:#256abf; --seq-600:#184f95; --seq-700:#0d366b;
  --st-good:#0ca30c; --st-warn:#fab219; --st-crit:#d03b3b;
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:400 15px/1.45 var(--asubk-font); color:var(--text-body); background:var(--surface-page); }
button{ font:inherit; }
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar); display:flex; flex-direction:column;
  border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:600 17px/1.2 var(--asubk-font); color:var(--text-heading); letter-spacing:.04em; }
.brand small{ display:block; font:400 12px/1.4 var(--asubk-font); color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:600 12px/1.3 var(--asubk-font); color:var(--text-placeholder); text-transform:uppercase; letter-spacing:.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; width:100%; color:rgba(27,43,65,.72);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,.96); font-weight:500; }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; }
#user-sel{ max-width:100%; }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default); display:flex; align-items:center;
  gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:600 18px/1.2 var(--asubk-font); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.muted{ color:var(--text-muted); } .small{ font-size:13px; } .mono{ font-family:var(--mono); font-size:12px; }
select,input[type=text],input[type=number]{ height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  background:var(--surface-card); color:var(--text-body); font:400 14px/1.3 var(--asubk-font); padding:0 8px; }
.btn{ height:32px; padding:0 12px; border-radius:var(--radius-md); border:1px solid var(--border-strong); background:var(--surface-card);
  color:var(--text-body); cursor:pointer; font-size:14px; white-space:nowrap; }
.btn:hover{ background:var(--surface-hover); }
.btn.primary{ background:var(--asubk-blue); border-color:var(--asubk-blue); color:#fff; }
.btn.primary:hover{ background:var(--asubk-blue-hover); }
.btn.danger{ color:var(--asubk-red); } .btn.sm{ height:26px; padding:0 8px; font-size:13px; }
.btn:disabled{ color:var(--text-disabled); cursor:not-allowed; background:var(--surface-card); }
.linky{ background:none; border:none; color:var(--text-link); cursor:pointer; padding:0; text-align:left; }
.linky:hover{ text-decoration:underline; }
.content{ flex:1; overflow:auto; }
.wrap{ padding:16px 24px 60px; }
.view{ display:none; } .view.active{ display:block; }
.h2{ font:600 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:20px 0 8px; }
.banner{ border-radius:var(--radius-md); padding:9px 13px; margin:0 0 12px; font-size:14px; }
.banner.info{ background:var(--asubk-blue-tint); } .banner.warn{ background:var(--asubk-amber-tint); color:var(--asubk-amber); }
.banner.err{ background:var(--asubk-red-tint); color:var(--asubk-red-hover); }
/* вкладки ролей и своих экранов */
.tabs{ display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--border-default); margin-bottom:10px; }
.tab{ padding:8px 14px; border:none; background:none; cursor:pointer; color:var(--text-muted); border-bottom:2px solid transparent; }
.tab.active{ color:var(--text-heading); border-bottom-color:var(--asubk-blue); font-weight:500; }
.tab.own{ font-style:italic; } .tab .sep{ color:var(--text-disabled); }
.scope-line{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; font-size:14px; }
.scope-line .right{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.filterbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 10px; background:var(--surface-panel);
  border-radius:var(--radius-md); margin-bottom:12px; font-size:14px; }
.filterbar.on{ outline:2px solid var(--asubk-blue-tint); }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:var(--radius-pill); background:var(--surface-panel);
  border:1px solid var(--border-default); font-size:13px; }
/* сетка плиток: 4 колонки → 2 → 1 */
.grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:stretch; }
.section-row{ grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-top:8px; font:600 14px/1.2 var(--asubk-font);
  color:var(--text-heading); border-bottom:1px solid var(--border-default); padding-bottom:4px; }
.section-row button{ font-size:13px; }
.tile{ position:relative; background:var(--surface-card); border:1px solid var(--border-default); border-radius:var(--radius-lg);
  padding:10px 12px 8px; display:flex; flex-direction:column; min-height:150px; cursor:pointer; }
.tile:hover{ border-color:var(--border-strong); }
.tile.w2{ grid-column:span 2; } .tile.h2{ grid-row:span 2; min-height:312px; }
.tile.stale{ border:2px solid var(--st-warn); } .tile.err{ border-style:dashed; }
.tile.tl-red{ box-shadow:inset 4px 0 0 var(--st-crit); } .tile.tl-yellow{ box-shadow:inset 4px 0 0 var(--st-warn); }
.tile.tl-green{ box-shadow:inset 4px 0 0 var(--st-good); }
.tile .t-head{ display:flex; align-items:flex-start; gap:6px; }
.tile .t-title{ font:500 14px/1.3 var(--asubk-font); color:var(--text-heading); flex:1; }
.tile .t-tools{ display:flex; gap:2px; opacity:.55; } .tile:hover .t-tools{ opacity:1; }
.tile .t-tools button{ background:none; border:none; cursor:pointer; padding:0 4px; font-size:14px; color:var(--text-muted); }
.tile .t-tools button.on{ color:var(--asubk-blue); }
.tile .t-body{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:6px 0; min-height:0; min-width:0; overflow-x:auto; }
.tile{ min-width:0; }
.tile .big{ font:600 28px/1.1 var(--asubk-font); color:var(--text-heading); }
.tile .big small{ font:400 14px/1.2 var(--asubk-font); color:var(--text-muted); margin-left:4px; }
.tile .sub{ font-size:13px; color:var(--text-muted); margin-top:3px; }
.tile .shift.up-good,.tile .shift.down-good{ color:var(--asubk-green); } .tile .shift.up-bad,.tile .shift.down-bad{ color:var(--asubk-red); }
.tile .shift.flat{ color:var(--text-muted); }
.tile .tl-note{ font-size:12px; margin-top:3px; display:flex; align-items:center; gap:5px; }
.tile .passport{ font:400 11.5px/1.35 var(--mono); color:var(--text-muted); border-top:1px solid var(--asubk-grid-line); padding-top:5px; margin-top:4px; }
.tile .kind-link{ font-size:11px; color:var(--asubk-blue); text-transform:uppercase; letter-spacing:.04em; }
.tile .state-msg{ font-size:13px; color:var(--text-muted); }
.tile .state-msg b{ color:var(--text-heading); font-weight:500; }
.tile.skel .t-body{ background:linear-gradient(90deg,var(--asubk-gray-150),var(--asubk-gray-100),var(--asubk-gray-150)); border-radius:6px; margin:8px 0; }
.tile.arrange{ cursor:grab; outline:1px dashed var(--border-strong); }
.tile.drag-over{ outline:2px solid var(--asubk-blue); }
.arr-tools{ display:flex; gap:4px; margin-top:4px; }
.req{ color:var(--asubk-amber); font-size:12px; cursor:help; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
/* графики */
.bars{ display:flex; flex-direction:column; gap:3px; font-size:12.5px; }
.bar-row{ display:grid; grid-template-columns:minmax(70px,38%) 1fr auto; gap:6px; align-items:center; }
.bar-row .lab{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-body); }
.bar-row .track{ height:10px; } .bar-row .fill{ height:10px; background:var(--series-1); border-radius:0 4px 4px 0; }
.bar-row .val{ color:var(--text-body); font-variant-numeric:tabular-nums; }
.bar-row.more .fill{ background:var(--seq-200); } .bar-row:hover .lab{ text-decoration:underline; }
.total-row{ font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--asubk-grid-line); margin-top:3px; padding-top:2px; }
.steps{ display:flex; align-items:flex-end; gap:6px; height:86px; }
.step{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:12px; }
.step .col{ width:100%; background:var(--series-1); border-radius:4px 4px 0 0; min-height:2px; }
.step .v{ font-variant-numeric:tabular-nums; } .step .k{ color:var(--text-muted); white-space:nowrap; font-size:11px; }
.step:hover .col{ background:var(--seq-600); }
svg.chart text{ font:11px var(--asubk-font); fill:rgba(24,39,57,.65); }
.legend{ display:flex; gap:12px; font-size:12px; color:var(--text-muted); flex-wrap:wrap; }
.mv{ display:grid; grid-template-columns:auto 1fr auto; gap:2px 10px; font-size:12.5px; align-items:baseline; }
.mv .n{ font-variant-numeric:tabular-nums; text-align:right; }
.cond-box{ margin-top:6px; } .cond-box .chip.cond{ display:inline-block; margin:2px 4px 2px 0; } .cond-add{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; align-items:flex-start; }
.t-qual{ font-size:11.5px; font-weight:400; color:var(--text-muted); margin-top:2px; }
.t-chg{ font-size:11.5px; font-weight:400; color:var(--asubk-amber); margin-top:2px; }
.tile .t-link{ background:none; border:none; padding:0; font:inherit; color:inherit; text-align:left; cursor:pointer; overflow-wrap:anywhere; }
.tile .t-link:hover{ color:var(--text-link); text-decoration:underline; } .tile .t-link .ar{ font-size:12px; color:var(--text-muted); }
.mv .head{ font-weight:600; color:var(--text-heading); }
.mv .flows{ grid-column:1/-1; color:var(--text-muted); font-size:12px; }
.heat{ border-collapse:separate; border-spacing:2px; font-size:11.5px; width:100%; }
.heat td,.heat th{ padding:3px 4px; text-align:center; font-weight:400; }
.heat th{ color:var(--text-muted); } .heat td.rl{ text-align:left; white-space:nowrap; color:var(--text-body); }
.heat td.c{ border-radius:3px; cursor:pointer; font-variant-numeric:tabular-nums; }
.tbl{ border-collapse:collapse; width:100%; font-size:12.5px; }
.tbl th,.tbl td{ padding:4px 6px; border-bottom:1px solid var(--asubk-grid-line); text-align:right; font-variant-numeric:tabular-nums; }
.tbl th:first-child,.tbl td:first-child{ text-align:left; } .tbl th{ color:var(--text-muted); font-weight:500; }
.tbl tr.rowlink:hover td{ background:var(--surface-hover); cursor:pointer; }
/* меню, подсказка, ящик, диалог */
.menu{ position:fixed; z-index:60; background:var(--surface-card); border:1px solid var(--border-strong); border-radius:var(--radius-md);
  box-shadow:0 8px 24px rgba(24,39,57,.18); min-width:230px; padding:4px 0; }
.menu button{ display:block; width:100%; text-align:left; background:none; border:none; padding:7px 14px; cursor:pointer; font-size:14px; }
.menu button:hover{ background:var(--surface-hover); } .menu .hint{ padding:2px 14px 6px; font-size:12px; color:var(--text-muted); }
.tip{ position:fixed; z-index:70; pointer-events:none; background:var(--asubk-ink); color:#fff; border-radius:4px; padding:5px 8px; font-size:12px;
  max-width:280px; display:none; line-height:1.35; }
.drawer-mask{ position:fixed; inset:0; background:rgba(24,39,57,.28); z-index:40; }
.drawer{ position:fixed; top:0; right:0; height:100vh; width:min(820px,94vw); z-index:41; background:var(--surface-page);
  border-left:1px solid var(--border-default); box-shadow:-10px 0 30px rgba(24,39,57,.18); display:flex; flex-direction:column; }
.drawer.wide{ width:min(1100px,96vw); }
.drawer-h{ flex:none; display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border-default); }
.drawer-h h3{ margin:0; font:600 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.drawer-x{ margin-left:auto; background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-muted); }
.drawer-b{ flex:1; overflow:auto; padding:16px 20px 40px; }
.kv{ display:grid; grid-template-columns:200px 1fr; gap:4px 12px; font-size:14px; margin-bottom:12px; }
.kv .k{ color:var(--text-muted); }
.list{ border-collapse:collapse; width:100%; font-size:13.5px; }
.list th,.list td{ border-bottom:1px solid var(--asubk-grid-line); padding:6px 8px; text-align:left; vertical-align:top; }
.list th{ color:var(--text-muted); font-weight:500; background:var(--surface-panel); position:sticky; top:0; }
.list td.n{ text-align:right; font-variant-numeric:tabular-nums; }
.stamp{ border:1px solid var(--border-strong); border-radius:var(--radius-md); padding:10px 12px; font:12px/1.5 var(--mono); background:var(--surface-panel); }
.stamp b{ color:var(--asubk-red-hover); }
.form-step{ border:1px solid var(--border-default); border-radius:var(--radius-lg); padding:10px 12px; margin-bottom:10px; }
.form-step h4{ margin:0 0 8px; font:600 14px/1.2 var(--asubk-font); }
.opt{ display:inline-flex; align-items:center; gap:5px; margin:2px 12px 2px 0; font-size:14px; }
.opt.off{ color:var(--text-disabled); }
.why{ font-size:12px; color:var(--text-muted); margin-left:20px; }
.checks{ list-style:none; padding-left:0; } .checks li{ margin:2px 0; font-size:14px; } .ok{ color:var(--asubk-green); } .bad{ color:var(--asubk-red); }
.cols2{ display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:16px; }
.rep-list{ max-height:340px; overflow:auto; border:1px solid var(--border-default); border-radius:var(--radius-md); }
.rep-row{ display:block; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--asubk-grid-line); padding:7px 10px; cursor:pointer; color:inherit; overflow-wrap:anywhere; }
.rep-row:last-child{ border-bottom:none; } .rep-row:hover{ background:var(--surface-hover); }
.rep-row.sel{ background:var(--asubk-blue-tint); box-shadow:inset 3px 0 0 var(--asubk-blue); cursor:default; }
.rep-row .muted{ display:block; }
.pick{ max-height:96px; overflow:auto; border:1px solid var(--asubk-grid-line); border-radius:var(--radius-md); padding:2px 6px; margin-top:3px; }
.pctbox{ margin-top:8px; }
.pv-side{ min-width:0; position:sticky; top:8px; align-self:start; max-height:calc(100vh - 90px); overflow:auto; }
.grid.pv{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--asubk-ink); color:#fff; padding:9px 16px;
  border-radius:var(--radius-md); z-index:80; font-size:14px; }
.notif-dot{ background:var(--asubk-red); color:#fff; border-radius:var(--radius-pill); font-size:11px; padding:0 6px; margin-left:4px; }
@media (max-width:1000px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } .sidebar{ display:none; } .cols2{ grid-template-columns:minmax(0,1fr); } .pv-side{ position:static; max-height:none; overflow:visible; } }
@media (max-width:600px){ .grid,.grid.pv{ grid-template-columns:minmax(0,1fr); } .topbar{ padding:8px 16px; } .topbar .right{ margin-left:0; min-width:0; } .topbar .right label{ width:100%; } #user-sel{ width:100%; } .steps{ gap:2px; } .step{ min-width:0; } .step .k{ white-space:normal; text-align:center; overflow-wrap:anywhere; font-size:10px; letter-spacing:-.03em; } .tile.w2{ grid-column:span 1; } .wrap{ padding:12px 16px 40px; }
  .arrange-only{ display:none !important; } .kv{ grid-template-columns:1fr; }
  .list{ display:block; overflow-x:auto; } .btn{ white-space:normal; height:auto; min-height:32px; } select{ max-width:100%; } }
@media print{ .sidebar,.topbar,.scope-line .right,.filterbar,.t-tools{ display:none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">АСУБК<small>Фонд кредитования · кредитный модуль</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb-title" id="crumb">Главная</div>
      <div class="right">
        <span class="muted small" id="clock"></span>
        <button class="btn" id="btn-refresh" onclick="DB.refresh()">Обновить</button>
        <button class="btn" onclick="DB.openNotifs()">Уведомления<span id="notif-cnt"></span></button>
        <label class="small muted">Пользователь стенда
          <select id="user-sel" onchange="DB.switchUser(this.value)"></select></label>
      </div>
    </header>
    <div class="content" id="content">
      <div class="wrap">
        <section class="view" id="v-home"></section>
        <section class="view" id="v-catalog"></section>
        <section class="view" id="v-builder"></section>
        <section class="view" id="v-registry"></section>
        <section class="view" id="v-layouts"></section>
        <section class="view" id="v-journal"></section>
        <section class="view" id="v-stand"></section>
      </div>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div class="tip" id="tip"></div>
<script>
window.DB = (function(){
'use strict';
/* ================= Календарь стенда ================= */
// «Сегодня» заморожено: 11.10.2026 14:15. Месяц m — смещение от текущего (0 = октябрь 2026).
const TODAY = { iso:'2026-10-11', day:11, daysInMonth:31, time:'14:15', label:'11.10.2026 14:15' };
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DAYS_IN = [31,28,31,30,31,30,31,31,30,31,30,31];
function monthOf(m){ const abs = 2026*12 + 9 + m; return { y:Math.floor(abs/12), mi:abs%12 }; }
function monthName(m){ const x = monthOf(m); return MONTHS[x.mi]; }
function monthEndLabel(m){ const x = monthOf(m); return String(DAYS_IN[x.mi]).padStart(2,'0')+'.'+String(x.mi+1).padStart(2,'0')+(x.y!==2026?'.'+x.y:''); }
function monthShort(m){ const x = monthOf(m); return MON_SHORT[x.mi]+(x.mi===0||m===-23?' '+String(x.y).slice(2):''); }

/* ================= Детерминированный генератор ================= */
function rng(seed){ let a = seed>>>0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function hash(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function jitter(id, key, amp){ return 1 + ((hash(id+'|'+key)%10000)/10000 - 0.5)*2*amp; }
function pick(r, arr){ return arr[Math.floor(r()*arr.length)]; }
function pickW(r, pairs){ const s = pairs.reduce((a,p)=>a+p[1],0); let x = r()*s; for(const p of pairs){ if((x-=p[1])<0) return p[0]; } return pairs[pairs.length-1][0]; }

// Закрытые договоры и погасившие клиенты: строка статистики живёт всегда, «действующие» задаёт фильтр вопроса.

    b.pers = 'действует';

/* ================= Стенд: настройки «соседей» ================= */
const STAND = { wave:3, spells:false, clientFlows:false, statDown:false, nightRunFailed:false, queueLag:0, nightOnly:{}, overdueUp:false, withdrawn:{}, closedThrough:-2, N:150 };
const STAND_SEED = JSON.stringify(STAND);

/* ================= Даты, периоды, базы сдвига ================= */
const DATE_MODES = {
  today:      { label:'сегодня', point:{ m:0, today:true } },
  closedDay:  { label:'последний закрытый день', point:{ m:0, day:10 } },
  prevMonthEnd:{ label:'конец прошлого месяца', point:{ m:-1 } },
};
const PERIODS = {
  today:      { label:'сегодня', months:[0], partial:true, today:true },
  curMonth:   { label:'текущий месяц', months:[0], partial:true },
  prevMonth:  { label:'прошлый месяц', months:[-1], base:[-2] },
  curQuarter: { label:'текущий квартал', months:[0], partial:true },
  prevQuarter:{ label:'прошлый квартал', months:[-3,-2,-1], base:[-6,-5,-4] },
  ytd:        { label:'с начала года', months:[-9,-8,-7,-6,-5,-4,-3,-2,-1,0], partial:true },
  prevYear:   { label:'прошлый год', months:[-21,-20,-19,-18,-17,-16,-15,-14,-13,-12,-11,-10], base:[-33,-32,-31,-30,-29,-28,-27,-26,-25,-24,-23,-22] },
};
const STOCK_BASES = {
  prevMonthEnd:{ label:'к концу прошлого месяца', short:m=>'к '+monthEndLabel(-1), point:{ m:-1 } },
  yearStart:   { label:'к началу года', short:()=> 'к началу года', point:{ m:-10 } },
  yearAgo:     { label:'к концу того же месяца прошлого года', short:()=> 'к '+monthEndLabel(-12), point:{ m:-12 } },
};
function monthClosed(m){ return m <= STAND.closedThrough; }

/* ================= Значение строки в вопросе ================= */
function exists(row, m){ return (row.from===undefined || row.from<=m); }
function flows(row, m){ return exists(row, m) && (row.to===undefined || m<=row.to); }   // потоки закрытого договора кончаются месяцем закрытия
function scen(row, field){ return (STAND.overdueUp && (field==='overdue' || field==='risk')) ? 1.18 : 1; }
function stockAt(row, I, pt){
  if(I.currentOnly && !(pt.m===0)) return null;            // состояние без истории: только «сейчас»
  if(!exists(row, pt.m)) return null;
  if(I.where && !I.where(row)) return null;
  if(I.agg==='count') return 1;
  let v = row[I.field] || 0;
  if(pt.m===0 && !pt.day) return v*scen(row, I.field);
  const k = pt.day ? 'd'+pt.day : 'm'+pt.m; const amp = pt.day ? 0.004 : 0.03*Math.min(1,(Math.abs(pt.m)+1)/4);
  const trend = pt.day ? 1 : 1 + pt.m*(I.field==='overdue'||I.field==='risk' ? 0.03 : I.field==='balance' ? 0.004 : I.field==='amount' ? 0.08 : 0.002); // портфель и просрочка растут
  return Math.round(v*trend*jitter(row.id, k+I.field, amp));
}
function monthFlow(row, field, m){ return flows(row, m) ? (row[field]||0)*jitter(row.id, 'f'+m+field, 0.12) : 0; }
function flowIn(row, I, period){
  if(I.where && !I.where(row)) return null;
  const P = PERIODS[period]; let s = 0, any = false;
  for(const m of P.months){
    if(I.kind==='event'){
      const at = I.atField ? row[I.atField] : row.at; if(at!==m) continue;
      const day = (I.dayField ? row[I.dayField] : row.day) || (1 + hash(row.id)%28);
      if(m===0 && (P.today ? day!==TODAY.day : day>TODAY.day)) continue;
      any = true; s += I.agg==='count' ? 1 : (row[I.field]||0);
    } else {
      if(!flows(row, m)) continue;
      let v = monthFlow(row, I.field, m); if(m===0) v = P.today ? v/TODAY.daysInMonth : v*TODAY.day/TODAY.daysInMonth;
      if(v){ any = true; s += v; }
    }
  }
  return any ? (I.agg==='count' ? s : Math.round(s)) : null;
}
function valueOf(row, I, ctx){
  if(ctx.tf && ctx.tf.length){ const m = ctx.point ? ctx.point.m : PERIODS[ctx.period].months[PERIODS[ctx.period].months.length-1];
    if(!ctx.tf.every(c=>testCond(row, c, null, m))) return null; }   // «действующий» — на дату среза, а не сегодня
  return ctx.period ? flowIn(row, I, ctx.period) : stockAt(row, I, ctx.point); }
function aggregate(rows, I, ctx){
  let acc = I.agg==='max' ? null : 0, n = 0;
  for(const r of rows){ const v = valueOf(r, I, ctx); if(v===null) continue; n++;
    if(I.agg==='max') acc = acc===null ? v : Math.max(acc, v); else acc += v; }
  return { value: acc===null ? null : acc, n };
}
function ctxOf(q){ const I = IND[q.inds[0]]; const tf = timeConds(q.filter);
  return (I.kind==='stock') ? { point: DATE_MODES[q.date||'today'].point, tf } : { period: q.period || 'curMonth', tf }; }

/* ================= Охват (область видимости) и права ================= */
const ROLE_SCOPE_OVERRIDE = { prob:{ loan:'all', payment:'all', coll:'all', borrower:'viaClaim' }, zal:{ loan:'dept' }, spec:{ program:'all', comm:'all' }, cur:{ payment:'dept' } };
function scopeOf(roleId, obj){ const R = ROLES.find(x=>x.id===roleId); const o = ROLE_SCOPE_OVERRIDE[roleId] || {}; return o[obj] || R.scope; }
function hasRight(roleId, obj){ return (RIGHTS[roleId]||[]).includes(obj); }
function visibleFor(user, roleId, obj){
  const O = OBJECTS[obj]; const rows = DATA[obj];
  if(O.vis==='self') return rows.filter(r=>r.assignee===user.id);
  if(O.vis==='open') return rows;
  if(O.vis==='via'){ const ok = new Set(visibleFor(user, roleId, O.via).map(r=>r.id));   // видимость через строки другого объекта
    return rows.filter(r=>[].concat(r[O.viaKey]).some(id=>ok.has(id))); }
  const sc = scopeOf(roleId, obj);
  if(sc==='all') return rows;
  if(sc==='none') return [];
  if(sc==='member') return rows.filter(r=>(r.members||[]).includes(user.id));
  if(sc==='viaClaim'){ const ls = new Set(visibleFor(user, roleId, 'claim').map(c=>c.loan));   // клиент, по кредиту которого требование ведёт моё подразделение
    const bs = new Set(DATA.loan.filter(l=>ls.has(l.id)).map(l=>l.borrower)); return rows.filter(r=>bs.has(r.id)); }
  if(sc==='deptTree'){ const t = subtree(user.dept); return rows.filter(r=>t.includes(r.dept)); }
  return rows.filter(r=>r.dept===user.dept);
}
// роли, через которые человек смотрит плитку: на вкладке роли — эта роль, на своём экране — все его роли
function viewerRoles(user, roleId){ return roleId ? [roleId] : user.roles; }
function rowsFor(user, roleId, obj){
  const rs = viewerRoles(user, roleId).filter(r=>hasRight(r, obj));
  if(!rs.length) return null;                                // нет права ни у одной роли — «нет доступа»
  if(rs.length===1) return visibleFor(user, rs[0], obj);
  const seen = new Set(), out = [];
  rs.forEach(r=>visibleFor(user, r, obj).forEach(x=>{ if(!seen.has(x.id)){ seen.add(x.id); out.push(x); } }));
  return out;
}

/* ================= Фильтр вопроса и относительные параметры ================= */
// Условие: { f, op:'eq'|'ne'|'gt'|'lt'|'le'|'in'|'true'|'false', v }. Относительные: @me, @myDept, @myDeptTree, @today+N.
function resolveParam(v, user){
  if(v==='@me') return user.id;
  if(v==='@myDept') return user.dept;
  if(v==='@myDeptTree') return subtree(user.dept);
  if(typeof v==='string' && v.startsWith('@today+')) return Number(v.slice(7));
  return v;
}
function paramLabel(v){ return v==='@me' ? '«я»' : v==='@myDept' ? '«моё подразделение»' : v==='@myDeptTree' ? '«моё подразделение и ниже»'
  : (typeof v==='string' && v.startsWith('@today+')) ? '«сегодня + '+v.slice(7)+' дн.»' : null; }
// Сравнение разреза (= ≠ ∈ ∉) или числа строки (> ≥ < ≤) с константой. Разрез с историей (состояние портфеля, договора)
// сравнивается на месяц m: на дату среза плитки, в сдвиге — на дату базы.
function isTimeCond(c){ const D = DIMS[c.f]; return !!(D && D.at); }
function timeConds(filter){ return (filter||[]).filter(isTimeCond); }
function testCond(row, c, user, m){
  const v = user ? resolveParam(c.v, user) : c.v; const D = DIMS[c.f];
  const x = D && D.at ? D.at(row, m===undefined ? 0 : m) : D ? dimValue(c.f, row) : row[c.f];
  if((c.op==='gt'||c.op==='lt'||c.op==='le'||c.op==='ge') && (x===null || x===undefined)) return false;
  switch(c.op){
    case 'eq': return Array.isArray(v) ? v.includes(x) : x===v;
    case 'ne': return x!==v;  case 'gt': return x>v;  case 'lt': return x<v;  case 'le': return x<=v;  case 'ge': return x>=v;
    case 'in': return (Array.isArray(v)?v:[v]).includes(x);
    case 'nin': return !(Array.isArray(v)?v:[v]).includes(x);
    case 'true': return !!x;  case 'false': return !x;
  }
  return true;
}
// m не задан — условия с историей не режут здесь, их проверяет значение строки на дату (valueOf); m задан — режут на этот месяц
function applyFilter(rows, filter, user, m){ return (filter||[]).filter(c=>m!==undefined || !isTimeCond(c)).reduce((rs,c)=>rs.filter(r=>testCond(r,c,user,m)), rows); }
function panelDim(obj, key){ return (PANEL_DIM[obj]||{})[key] || key; }
const PANEL_SELF = { program:'program' };                 // строка объекта и есть значение поля панели
function panelApplies(obj, key){ return PANEL_SELF[obj]===key || (OBJ_DIMS[obj]||[]).includes(panelDim(obj, key)); }
function applyPanel(rows, obj, panel){
  const applied = [], skipped = [];
  for(const k of Object.keys(PANEL)){ const v = panel && panel[k]; if(!v) continue;
    if(panelApplies(obj, k)){ rows = rows.filter(r=>PANEL_SELF[obj]===k ? r.id===v : r[k]===v); applied.push(k); } else skipped.push(k); }
  return { rows, applied, skipped };
}
function panelLabel(panel, keys, obj){ return keys.map(k=>(k==='dept'?deptName(panel[k]):k==='program'?progName(panel[k]):panel[k])
  + ((PANEL_NOTE[obj]||{})[k] ? ' · '+PANEL_NOTE[obj][k] : '')).join(', '); }
function fieldName(f){ const D = DIMS[f]; return D ? D.name : ((Object.values(FIELDS).find(F=>F[f])||{})[f] || f); }
function condText(c){ const D = DIMS[c.f]; const name = fieldName(c.f);
  const rel = paramLabel(c.v); const val = rel || (Array.isArray(c.v) ? c.v.map(x=>D?dimLabel(c.f,x):x).join(', ') : D ? dimLabel(c.f, c.v) : (typeof c.v==='number' ? nbsp(c.v) : c.v));
  return name+' '+(OPS[c.op]||c.op)+' '+val; }
// подпись вопроса на плитке: «действующие», «клиенты, где вы ведущий куратор»
function qualOf(t){ const q = questionOf(t); if(!q) return ''; const I = IND[q.inds[0]]; const out = [];
  (q.filter||[]).forEach(c=>{ if(c.f==='pstate' && c.op==='eq') out.push(c.v==='действующий' ? 'действующие' : c.v===PAID_ALL ? 'погасившие весь портфель' : 'без договоров');
    if(c.f==='lact' && c.op==='eq') out.push(c.v==='действующий' ? 'действующие' : 'закрытые');
    if(c.f==='pgstate' && c.op==='eq') out.push(c.v==='действует' ? 'действующие' : 'закрытые');
    if(c.f==='curator' && c.v==='@me' && I.obj==='borrower') out.push('клиенты, где вы ведущий куратор'); });
  return out.join(' · '); }

/* ================= Формат числа ================= */
function nbsp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtSum(v){ const a = Math.abs(v); const s = v<0?'−':'';
  if(a>=1e9) return s+(a/1e9).toFixed(2).replace('.',',')+' млрд';
  if(a>=1e6) return s+(a>=1e8 ? Math.round(a/1e6) : (a/1e6).toFixed(1).replace('.',','))+' млн';
  if(a>=1e3) return s+Math.round(a/1e3)+' тыс.';
  return s+Math.round(a); }
function fmtVal(v, unit){ if(v===null||v===undefined) return '—'; if(unit==='sum') return fmtSum(v); if(unit==='days') return nbsp(Math.round(v))+' дн.';
  if(unit==='pct') return (Math.round(v*10)/10).toString().replace('.',',')+' %'; return nbsp(Math.round(v)); }
function fmtDelta(d, unit){ if(unit==='pct') return (d>0?'▲ ':d<0?'▼ ':'')+(Math.abs(Math.round(d*10)/10)).toString().replace('.',',')+' п.п.';
  return (d>0?'▲ ':d<0?'▼ ':'')+fmtVal(Math.abs(d), unit); }

/* ================= Паспорт ================= */
function staleOf(q){
  const I = IND[q.inds[0]]; const ctx = ctxOf(q);
  const live = ctx.period ? PERIODS[ctx.period].partial : (ctx.point.m===0 && !ctx.point.day);
  if(live && STAND.nightOnly[I.obj]) return 'источник «'+OBJECTS[I.obj].owner+'» обновляется только ночью — число на конец вчерашнего дня';
  if(live && STAND.queueLag>15) return 'очередь пересчёта статистики отстала на '+STAND.queueLag+' мин';
  if(!live && STAND.nightRunFailed) return 'ночной прогон 11.10 не прошёл — последний закрытый день 09.10';
  return null;
}
function passportOf(q, visible, opts){
  const I = IND[q.inds[0]]; const ctx = ctxOf(q); const parts = [];
  const lag = STAND.queueLag>15 ? ' (очередь '+STAND.queueLag+' мин)' : '';
  if(q.format==='series'){ const n = q.points||12; let closed = 0; for(let m=-n+1;m<=0;m++) if(monthClosed(m)) closed++;
    parts.push(closed===n ? n+' мес. · закрыто' : 'смешанно: '+closed+' из '+n+' мес. закрыто'); }
  else if(ctx.period){ const P = PERIODS[ctx.period];
    if(ctx.period==='today') parts.push('сегодня, на '+TODAY.time+lag+' · день не закрыт');
    else if(ctx.period==='curMonth') parts.push('01.10 → '+TODAY.time+' · идёт '+TODAY.day+'-й день · не закрыт');
    else if(ctx.period==='prevMonth') parts.push(monthName(-1)+' · '+(monthClosed(-1)?'месяц закрыт':'месяц не закрыт'));
    else if(ctx.period==='ytd') parts.push('01.01 → '+TODAY.time+' · не закрыт');
    else { const cl = P.months.filter(monthClosed).length; parts.push(P.label+' · '+(cl===P.months.length?'закрыт':'смешанно: '+cl+' из '+P.months.length+' мес. закрыто')); } }
  else { const pt = ctx.point;
    if(pt.m===0 && !pt.day) parts.push((STAND.nightOnly[I.obj] ? 'на 10.10 (вчера) · только ночью' : 'на '+TODAY.time+lag+' · день не закрыт'));
    else if(pt.day) parts.push(STAND.nightRunFailed ? 'на 09.10 (2 дня назад) · день закрыт' : 'на 10.10 (вчера) · день закрыт');
    else parts.push('на '+monthEndLabel(pt.m)+' · '+(monthClosed(pt.m)?'месяц закрыт':'месяц не закрыт')); }
  if(opts && opts.fx) parts.push('сом, курс '+(ctx.point && !ctx.point.m ? '11.10' : '30.09'));
  parts.push('видно '+nbsp(visible));
  if(opts && opts.panelApplied && opts.panelApplied.length) parts.push('фильтр: '+opts.panelText);
  if(opts && opts.panelSkipped && opts.panelSkipped.length) parts.push('без фильтра');
  return parts.join(' · ');
}

/* ================= Ответ плитке: statSlice / statSeries ================= */
// Плитка спрашивает статистику при каждом показе. Чисел плитка не хранит.
// Вопрос плитки на отчёте собирается из отчёта, значений его параметров и выбора из ответа — в прежнюю форму вопроса.
// Ссылочная плитка берёт вопрос из очереди модуля-владельца. Плитка без отчёта и без очереди вопроса не имеет — она сломана.
function questionOf(t){
  if(!t) return null;
  if(t.kind==='link' && typeof t.queue==='string'){ const d = queueById(t.queue); if(!d) return null;
    const q = Object.assign({}, t, { queue:{ module:d.module, name:d.name } });
    q.inds = d.inds.slice(); q.dims = d.dims.slice(); q.filter = JSON.parse(JSON.stringify(d.filter)); return q; }
  if(!t.report) return null;
  const r = reportById(t.report); if(!r) return null;
  const p = t.params || {}, k = t.pick || {};
  const q = Object.assign({}, t, { reportId:r.id });

// «Работать со списком» — реестр модуля-владельца с фильтром плитки, на сегодня
function registryList(tile, user, roleId, panel){
  const q = questionOf(tile), why = reportBroken(tile); if(!q || why) return { registry:'—', owner:'—', today:0, slice:0, msg:why };
  const I = IND[q.inds[0]]; const lock = circleWhy(tile, user);
  if(lock) return { registry:OBJECTS[I.obj].registry, owner:OBJECTS[I.obj].owner, today:0, slice:0, msg:lock };
  const base = rowsFor(user, roleId, I.obj) || [];
  const rows = applyPanel(applyFilter(numRows(q, base, user), q.filter, user, 0), I.obj, panel).rows.filter(r=>stockAt(r, Object.assign({}, I, { agg:'count', currentOnly:false }), { m:0 })!==null || I.kind!=='stock');
  const sr = statRows(tile, user, roleId, panel);
  return { registry:OBJECTS[I.obj].registry, owner:OBJECTS[I.obj].owner, today:rows.length, slice: sr.refused ? sr.count : sr.list.length };
}

  S.screens.u1 = [{ id:'sc1', name:'Совещание по Ошу', items:['lead-odsh','lead-bal','lead-bucket','cat-byprog'], filter:{ region:'Ошская' } }];
  return S;
}
function user(){ return USERS.find(u=>u.id===S.userId); }
function journal(action, detail, who){ S.journal.unshift({ at:TODAY.label, who: who || S.userId, action, detail }); }

/* ================= Раскладка: объявленная + личная перекладка ================= */
function tileAnswers(t){ // в раскладку попадает только плитка, которая отвечает (автопроверка)
  if(!t) return false; if(t.state==='draft') return false;
  const q = questionOf(t); if(!q) return true;                 // отчёт не найден — плитка встаёт сломанной и называет причину
  if(q.format==='move' && IND[q.inds[0]].flowsGate && !STAND[IND[q.inds[0]].flowsGate]) return false;   // потоков ещё нет — черновик
  return q.inds.every(i=>objReady(IND[i].obj) && !IND[i].refuses);
}
function roleHasLayout(roleId){ return !!S.declared[roleId] && (ROLE_CORE_WAVE[roleId]||9) <= STAND.wave; }
function declaredItems(roleId){
  if(!roleHasLayout(roleId)) return MINIMAL.filter(k=>tileAnswers(tileById(k)));
  const L = S.declared[roleId].filter(k=>k.startsWith('s:') || tileAnswers(tileById(k)) || (tileById(k)||{}).state==='withdrawn');
  return L.filter((k,i)=>!k.startsWith('s:') || (i+1<L.length && !L[i+1].startsWith('s:')));   // секция без отвечающих плиток не показывается
}
function overlay(uid, roleId){ const k = uid+'|'+roleId; return S.overlays[k] || (S.overlays[k] = { order:[], hidden:[], added:[] }); }
function composeLayout(uid, roleId){
  const D = declaredItems(roleId).filter(k=>!(tileById(k)||{}).state || tileById(k).state!=='withdrawn' || false);
  const ov = S.overlays[uid+'|'+roleId] || { order:[], hidden:[], added:[] };
  const pool = new Set([...D, ...ov.added]);
  let out = ov.order.filter(k=>pool.has(k));
  [...D, ...ov.added].forEach(k=>{ if(!out.includes(k)) out.push(k); });   // новое у роли — в конец личной раскладки
  out = out.filter(k=>!ov.hidden.includes(k));
  return out.map(k=>{ const t = tileById(k);
    if(t && t.state==='withdrawn') return ov.added.includes(k) ? 'x:'+k : null;   // у роли исчезает, в личной — заглушка
    return k; }).filter(Boolean);
}
function personalized(uid, roleId){ const ov = S.overlays[uid+'|'+roleId]; return !!ov && (ov.order.length || ov.hidden.length || ov.added.length); }
function arrangeMove(roleId, key, dir){ const u = user(); const ov = overlay(u.id, roleId);
  const cur = composeLayout(u.id, roleId); const i = cur.indexOf(key), j = i+dir; if(i<0 || j<0 || j>=cur.length) return false;
  [cur[i], cur[j]] = [cur[j], cur[i]]; ov.order = cur; return true; }
function arrangeDrop(roleId, key, beforeKey){ const u = user(); const ov = overlay(u.id, roleId);
  const cur = composeLayout(u.id, roleId).filter(k=>k!==key); const j = beforeKey ? cur.indexOf(beforeKey) : cur.length; cur.splice(j<0?cur.length:j, 0, key); ov.order = cur; return true; }
function arrangeHide(roleId, key){ const ov = overlay(user().id, roleId); if(ov.added.includes(key)) ov.added = ov.added.filter(k=>k!==key); else ov.hidden.push(key); }
function arrangeUnhide(roleId, key){ const ov = overlay(user().id, roleId); ov.hidden = ov.hidden.filter(k=>k!==key); }
function arrangeAdd(roleId, tileId){ const ov = overlay(user().id, roleId); if(composeLayout(user().id, roleId).includes(tileId)) return false;
  ov.hidden = ov.hidden.filter(k=>k!==tileId); if(!declaredItems(roleId).includes(tileId)) ov.added.push(tileId); return true; }
function arrangeSection(roleId, name){ const key = 's:'+name; const ov = overlay(user().id, roleId); ov.added.push(key); return key; }
function resetDeclared(roleId){ delete S.overlays[user().id+'|'+roleId]; journal('вернул как объявлено', roleName(roleId)); }
function roleName(id){ return (ROLES.find(r=>r.id===id)||{}).name || id; }

/* ================= Свои экраны (до 5) ================= */
function screens(uid){ return S.screens[uid] || (S.screens[uid] = []); }
function createScreen(name){ const list = screens(user().id); if(list.length>=5) return { error:'Своих экранов не больше пяти' };
  const sc = { id:'sc'+(Date.now?Date.now():1)+list.length, name: name || 'Мой экран '+(list.length+1), items:[], filter:null }; list.push(sc); return sc; }
function screenById(id){ return screens(user().id).find(s=>s.id===id); }
function screenAdd(id, tileId){ const sc = screenById(id); if(sc && !sc.items.includes(tileId)) sc.items.push(tileId); }
function screenRemove(id, key){ const sc = screenById(id); if(sc) sc.items = sc.items.filter(k=>k!==key); }
function screenSaveFilter(id){ const sc = screenById(id); if(sc) sc.filter = Object.keys(S.panel).some(k=>S.panel[k]) ? Object.assign({}, S.panel) : null; }

/* ================= Каталог: что видно и почему нельзя ================= */
function canSee(t, u){ // круг отчёта, затем право на вопрос у статистики
  const q = questionOf(t); if(!q) return null;
  const lock = circleWhy(t, u); if(lock) return lock;

  const bad = objs.find(o=>!u.roles.some(r=>hasRight(r, o)));
  return bad ? 'Нельзя: объект «'+OBJECTS[bad].name+'» не открыт вашей роли' : null;
}

/* ================= Доступные отчёты ================= */
// отчёт открыт кругом отчётности (все · подразделения · только автор) и правом роли на его объект
// круг: все · только автор · названные подразделения; вложенные подразделения круг не включает — их называют отдельно
function circleOpen(r, u){ const c = (r && r.circle) || {}; return !!(c.all || (c.owner && c.owner===u.id) || (c.depts && c.depts.includes(u.dept))); }
// отчёт плитки не открыт смотрящему: причина, которую плитка пишет вместо числа; ссылочная плитка отчёта не имеет
function circleWhy(t, u){ const r = t && t.kind!=='link' && t.report && reportById(t.report); if(!r || circleOpen(r, u)) return null;
  return 'Нельзя: отчёт «'+r.title+'» не открыт вашему подразделению'+((r.circle||{}).owner ? ' — это личный отчёт '+userName(r.circle.owner) : ''); }
function reportText(r){ return [r.title, OBJECTS[r.obj].name, ...r.cols.map(i=>IND[i].name), ...r.dims.map(d=>DIMS[d].name)].join(' · ').toLowerCase(); }
function reportsFor(u, query){ const qs = String(query||'').trim().toLowerCase();
  return REPORTS.filter(r=>r.state==='active' && circleOpen(r, u) && u.roles.some(x=>hasRight(x, r.obj)) && (!qs || reportText(r).includes(qs)))
    .map(r=>({ r, feeds: TILES.filter(x=>x.report===r.id).length })); }
function timedReport(r){ return !!(r && (r.params.date || r.params.period)); }

/* ================= Отчёт плитки: что за отчёт, с какими значениями, что отвечает ================= */
const SHELF_LABEL = { catalog:'Общий отчёт каталога', personal:'Личный', official:'Официальный' };
// значение параметра по-человечески: «я», «все», «сегодня + 3 дн.», дата и период словами
function paramText(r, n, v){
  if(n==='date') return (DATE_MODES[v || 'today'] || {}).label || String(v);
  if(n==='period') return (PERIODS[v || 'curMonth'] || {}).label || String(v);
  if(v===undefined || v===null || v==='*') return 'все';
  const rel = paramLabel(v); return rel ? rel.replace(/[«»]/g, '') : String(v);
}
// значения параметров плитки на отчёте словами: [{ name, value }]
function paramList(r, p){
  const out = Object.keys(r.params).map(n=>({ name:r.params[n].name, value:paramText(r, n, p[n]) }));
  if(r.asOf) out.push({ name:'Дата', value:DATE_MODES[r.asOf].label+' (зашита в отчёт)' });
  return out;
}
function changedText(c){ return c ? 'отчёт изменён '+c.at+(c.who ? ' ('+userName(c.who).split(' ')[0]+')' : '')+(c.what ? ': '+c.what : '') : ''; }
// отметка «отчёт изменён» живёт, пока смотрящий не открыл текущую версию отчёта
function reportChangedFor(t, uid){ const r = t && t.report && reportById(t.report); if(!r || !r.changed) return null;
  return S.seen[uid+'|'+r.id]===r.version ? null : r.changed; }
// отчёты ведёт модуль «Отчётность»; макет имитирует его правки, чтобы показать, как они доходят до плиток
const tilesWord = n=>n+' '+(n%10===1 && n%100!==11 ? 'плитка' : n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20) ? 'плитки' : 'плиток');
function tilesOfReport(reportId){ return TILES.filter(t=>t.kind!=='link' && t.report===reportId && t.state!=='withdrawn'); }
function reportEdit(id, change, who){
  const r = reportById(id); if(!r) return { error:'Отчёта нет в каталоге' }; const c = change || {}; let what;
  if(c.filter){ r.filter = cp(c.filter); what = 'фильтр'; }
  else if(c.removeCol){
    if(!r.cols.includes(c.removeCol)) return { error:'В отчёте «'+r.title+'» нет такой колонки' };
    if(r.cols.length<2) return { error:'Последнюю колонку не снять: в отчёте должна остаться хотя бы одна' };
    r.cols = r.cols.filter(i=>i!==c.removeCol); what = 'колонки'; }
  else if(c.removeParam){
    if(!r.params[c.removeParam]) return { error:'В отчёте «'+r.title+'» нет такого параметра' };
    (r.gone = r.gone || {})[c.removeParam] = r.params[c.removeParam].name; delete r.params[c.removeParam]; what = 'параметры'; }
  else if(c.state==='archived'){ r.state = 'archived'; what = 'отправлен в архив'; }
  else return { error:'Такой правки отчёт не знает' };
  r.version++; r.changed = { at:TODAY.label.slice(0, 5), who: who || r.owner, what };
  const hit = tilesOfReport(id); journal('правка отчёта', '«'+r.title+'» → в. '+r.version+' · '+what+' · плиток на отчёте: '+hit.length, r.changed.who);
  return { ok:true, report:r, tiles:hit };
}
// отчёт с плитками не удаляется — только в архив
function reportDelete(id){
  const r = reportById(id); if(!r) return { error:'Отчёта нет в каталоге' }; const n = tilesOfReport(id).length;
  if(n) return { refused:true, msg:'У отчёта '+tilesWord(n)+' — его можно только отправить в архив' };
  REPORTS.splice(REPORTS.indexOf(r), 1); journal('удалил отчёт', '«'+r.title+'»', r.owner); return { ok:true };
}
// стенд «Отчётность»: четыре правки отчётов каталога и возврат; seed() возвращает каталог целиком
function standReport(kind){
  const own = id=>(reportById(id) || {}).owner;
  if(kind==='filter') return reportEdit('r-bucket', { filter:[{ f:'overdueDays', op:'gt', v:30 }] }, own('r-bucket'));
  if(kind==='col') return reportEdit('r-portfolio', { removeCol:'loan.risk' }, own('r-portfolio'));
  if(kind==='archive') return reportEdit('r-claims', { state:'archived' }, own('r-claims'));
  if(kind==='delete') return reportDelete('r-claims');
  if(kind==='reset'){ const base = JSON.parse(REPORTS_SEED), ids = new Set(base.map(r=>r.id));
    REPORTS.splice(0, REPORTS.length, ...base, ...REPORTS.filter(r=>!ids.has(r.id)));      // собранные на ходу личные отчёты остаются
    Object.keys(S.seen).forEach(k=>{ if(ids.has(k.split('|')[1])) delete S.seen[k]; }); S.cache.clear(); return { ok:true }; }
  return { error:'Такой правки на стенде нет' };
}
// открытие отчёта плитки: отчёт, его фильтр, значения параметров плитки, фильтр панели и собственный ответ отчёта; ссылочная плитка отчёта не имеет
function reportView(tileId, u, roleId, panel){
  const t = typeof tileId==='string' ? tileById(tileId) : tileId; const r = t && t.kind!=='link' && t.report && reportById(t.report); if(!r) return null;
  const lock = circleWhy(t, u); if(lock) return { tile:t.id, noaccess:true, msg:lock };   // замок отчётности дашборд не снимает
  const p = t.params || {}; const dims = r.dims.length;
  const tile = { id:t.id, report:r.id, params:p, pick:{ cols:r.cols.slice(), level:Math.min(1, dims) }, format: dims ? 'table' : 'number' };
  const ans = answer(questionOf(tile), u, roleId, panel);
  const params = paramList(r, p);
  const panelText = ans.panelApplied && ans.panelApplied.length ? 'фильтр: '+ans.panelText : 'без фильтра';
  S.seen[u.id+'|'+r.id] = r.version;
  return { tile:t.id,
    report:{ id:r.id, title:r.title, state:r.state, shelf:r.shelf, shelfName:SHELF_LABEL[r.shelf] || r.shelf, ownerName:userName(r.owner), version:r.version, changed:r.changed, changedText:changedText(r.changed) },
    desc:OBJECTS[r.obj].name+' · '+r.cols.map(i=>IND[i].name).join(', ')+(dims ? ' · по '+r.dims.map(d=>DIMS[d].name).join(' × ') : ''),
    cols:r.cols.map(i=>({ id:i, name:IND[i].name, unit:IND[i].unit })),
    filterText:r.filter.map(condText), params, panelText, answer:ans };
}

/* ================= Конструктор отчётности: черновик отчёта (вопрос) ================= */
// выбран кредит, заёмщик или программа — конструктор сам ставит «действующие» остаткам и счёту, потокам — нет; фильтр снимается или меняется
const DEFAULT_FILTER = { loan:()=>[Object.assign({}, ACT_L)], borrower:()=>[Object.assign({}, ACT_B)], program:()=>[Object.assign({}, ACT_P)] };
function defaultFilterOf(rd){ const mk = DEFAULT_FILTER[IND[rd.inds[0]].obj]; return mk && IND[rd.inds[0]].kind==='stock' ? mk() : []; }
const sameJson = (a, b) => JSON.stringify(a)===JSON.stringify(b);
function blankReportDraft(){ return { id:null, title:'', obj:'loan', inds:['loan.count'], dims:[], filter:DEFAULT_FILTER.loan(), date:'today', period:'curMonth', format:'number', shift:null, share:null, tl:null, kind:'overview', queue:null, points:12, top:3 }; }
function qKind(q){ return IND[q.inds[0]].kind==='stock' ? 'stock' : 'flow'; }
const NO_DATE = 'отчёт не объявил дату — ряд и сдвиг недоступны';
const PCT_ROWS = '«% от итога группы» считается по разрезу, которого нет в строках — выберите итог или другой разрез';
// правила показа — на собранном вопросе: число разрезов (уровень строк), порядок разреза, род колонок, дата отчёта
function formatsOfQ(q, r){
  const I = IND[q.inds[0]]; const dims = q.dims || []; const n = dims.length;
  const partial = qKind(q)==='flow' && PERIODS[q.period || 'curMonth'].partial; const timed = !r || timedReport(r);
  return Object.keys(FORMAT_NAMES).map(f=>{
    let why = null;
    if(f==='number' && n) why = 'у числа разрезов нет — возьмите итог отчёта';
    if(f==='shift' && n) why = 'у числа разрезов нет';
    if(f==='shift' && partial) why = 'неполный период не с чем честно сравнить';
    if(f==='slice' && n!==1) why = 'нужен ровно один разрез';
    if(f==='steps' && (n!==1 || !DIMS[dims[0]].ordered)) why = n!==1 ? 'нужен ровно один разрез' : 'у разреза «'+DIMS[dims[0]].name+'» нет объявленного порядка значений';
    if(f==='heat' && n!==2) why = r && r.dims.length<2 ? 'нужны два разреза — в отчёте «'+r.title+'» их '+r.dims.length : 'нужны два разреза';
    if(f==='table' && n!==1) why = 'нужен ровно один разрез строк';
    if(f==='series' && n) why = 'ряд — без разрезов';
    if(f==='move') why = !I.flows || qKind(q)!=='stock' ? 'у показателя не объявлены потоки' : n ? 'у движения разрезов нет' : null;
    if((f==='shift' || f==='series') && !timed) why = NO_DATE;
    if(f==='move' && !timed) why = why || 'отчёт не объявил дату — движение недоступно';
    if(f!=='table' && f!=='series' && f!=='number' && q.inds.length>1 && !q.share) why = why || 'несколько показателей — только число, ряд или таблица';
    if(f==='table' && q.share) why = why || 'таблица показывает колонки как есть — доля в ней не считается';
    if((q.numFilter || []).some(c=>dims.includes(c.f))) why = PCT_ROWS;   // ячейки доли — по разрезу строк: в каждой строке 0 % или 100 %
    return { f, ok:!why, why };
  });
}
// общие пункты автопроверки собранного вопроса: один объект, один род, реестр, формат, предпросмотр без отказа
function checkQuestion(q, r){
  if(!q || !q.inds.length || !q.inds.every(i=>IND[i])) return { checks:[{ ok:false, text:'нет колонок' }], preview:{ state:'broken', msg:'Нет вопроса' } };
  const out = []; const objs = [...new Set(q.inds.map(i=>IND[i].obj))];
  out.push({ ok: objs.length===1, text:'один объект: '+objs.map(o=>OBJECTS[o].name).join(', ') });
  out.push({ ok: new Set(q.inds.map(i=>IND[i].kind==='stock' ? 'stock' : 'flow')).size===1, text:'показатели одного рода: у плитки одна дата или один период' });
  out.push({ ok: q.inds.every(i=>!STAND.withdrawn[i]), text:'показатели есть в реестре статистики' });
  const fm = formatsOfQ(q, r).find(x=>x.f===q.format); out.push({ ok: !!fm && fm.ok, text:'формат «'+FORMAT_NAMES[q.format]+'» допустим'+(fm && !fm.ok?': '+fm.why:'') });
  const pv = fm && fm.ok ? answer(Object.assign({}, q, { id:'preview', version:1 }), user(), null, {}) : { tileId:'preview', format:q.format, state:'broken', msg:'Формат «'+FORMAT_NAMES[q.format]+'» недопустим: '+(fm ? fm.why : 'нет такого формата') };
  out.push({ ok: pv.state!=='refusal' && pv.state!=='error' && pv.state!=='broken', text:'предпросмотр без отказа'+(pv.state==='refusal' || pv.state==='broken' ? ': '+pv.msg : '') });
  return { checks:out, preview:pv };
}
function checkReportDraft(rd){ const c = checkQuestion(rd); const checks = c.checks.slice();
  checks.push({ ok: rd.inds.length>=1 && rd.inds.length<=4, text:'показателей от 1 до 4' });
  if(rd.share) checks.push({ ok: rd.share.length===2 && rd.share[0]!==rd.share[1] && rd.share.every(i=>IND[i] && IND[i].obj===IND[rd.inds[0]].obj), text:'доля — два показателя одного объекта' });
  checks.push({ ok: c.preview.state!=='noaccess', text:'объект открыт вашей роли' });
  checks.push({ ok: !!(rd.title||'').trim(), text:'есть подпись' });
  return { checks, ok: checks.every(x=>x.ok), preview:c.preview };
}
// относительное значение («я», «моё подразделение», «сегодня + N») в отчёте не хранится: условие становится параметром отчёта, значение уходит плитке
function splitRelative(rd){
  const params = {}, values = {}, filter = [];
  rd.filter.forEach(c=>{ if(!paramLabel(c.v)){ filter.push(cp(c)); return; }
    let n = c.f; for(let i=2; params[n]; i++) n = c.f+i;
    params[n] = { dim:c.f, op:c.op, name:fieldName(c.f) }; values[n] = c.v; });
  Object.assign(params, IND[rd.inds[0]].kind==='stock' ? { date:{ name:'Дата' } } : { period:{ name:'Период' } });
  return { filter, params, values };
}
// личный отчёт на полке автора: круг — он один; показатели, разрезы и постоянный фильтр — из черновика
function buildReport(rd){
  const u = user(); const { filter, params } = splitRelative(rd); const title = String(rd.title||'').trim(); const id = 'r-p-'+u.id+'-'+(++reportSeq);
  R(id, { title, shelf:'personal', owner:u.id, circle:{ owner:u.id }, obj:IND[rd.inds[0]].obj, cols:rd.inds.slice(), dims:rd.dims.slice(), filter, params });
  journal('собрал личный отчёт', title); return reportById(id);
}
// «похожий уже есть»: открытый смотрящему отчёт того же объекта, с теми же разрезами и постоянным фильтром, колонки которого покрывают черновик;
// каждое «я» / «моё подразделение» / «сегодня + N» черновика — параметр отчёта, дата — того же рода (зашитая — та же)
const condKey = c => c.f+'|'+c.op+'|'+JSON.stringify(c.v);
function relValues(rd, r){ const used = new Set(), values = {};
  for(const c of rd.filter.filter(x=>paramLabel(x.v))){ const n = Object.keys(r.params).find(k=>!used.has(k) && r.params[k].dim===c.f && (r.params[k].op || 'eq')===c.op);
    if(!n) return null; used.add(n); values[n] = c.v; }
  return values; }
function timedLike(rd, r){ return qKind(rd)==='stock' ? !!r.params.date || (!!r.asOf && r.asOf===rd.date) : !!r.params.period; }
function similarReport(rd, u){
  const fk = f => f.map(condKey).sort().join('\n'), want = fk(rd.filter.filter(c=>!paramLabel(c.v))), obj = IND[rd.inds[0]].obj;
  return reportsFor(u || user()).filter(x=>x.r.obj===obj && x.r.dims.join()===rd.dims.join() && fk(x.r.filter)===want && rd.inds.every(i=>x.r.cols.includes(i))
      && relValues(rd, x.r) && timedLike(rd, x.r))
    .sort((a,b)=>a.r.cols.length-b.r.cols.length)[0] || null;
}
// плитка на отчёте, собранном из черновика отчёта: значения относительных условий, дата или период, колонки, уровень строк и показ — из черновика
function tileOnReport(rd, report, values){
  const d = blankDraft(report.id); const lv = rd.dims.length;
  Object.assign(d.params, values, report.params.date ? { date:rd.date } : report.params.period ? { period:rd.period } : {});
  d.pick = { cols:rd.inds.slice(), level:lv }; if(lv && rd.top) d.pick.top = rd.top; if(rd.share) d.pick.share = rd.share.slice();
  Object.assign(d, { title:String(rd.title||'').trim() || report.title, format:rd.format, shift:rd.shift||null, points:rd.points||12, tl:rd.tl ? cp(rd.tl) : null });
  fitFormat(d);
  if(d.format==='shift'){ const sh = shiftsFor(d), b = sh.find(x=>x.ok && x.id===(d.shift || 'prevMonthEnd')) || sh.find(x=>x.ok);   // база сдвига — первая допустимая
    d.shift = b && b.id!=='auto' ? b.id : null; }
  return d;
}
// «взять его»: плитка на найденном отчёте с тем, что задано в черновике, — «я», дата, колонки, показ
function takeSimilar(rd, reportId){ const r = reportById(reportId), values = r && relValues(rd, r);
  return r && values && timedLike(rd, r) ? tileOnReport(rd, r, values) : null; }
// «Сохранить и поставить»: автопроверка, личный отчёт, личная плитка на нём, плитка в конец текущей вкладки
function saveAndPlace(rd, roleId){
  const c = checkReportDraft(rd); if(!c.ok) return { error:'Автопроверка не пройдена', checks:c.checks };
  const report = buildReport(rd); const res = saveTile(tileOnReport(rd, report, splitRelative(rd).values), 'personal');
  if(res.error){ REPORTS.splice(REPORTS.indexOf(report), 1); S.journal.shift(); return res; }
  const tab = curTab(); if(tab.kind==='screen') screenAdd(tab.id, res.tile.id); else arrangeAdd(roleId || tab.id, res.tile.id);
  return { report, tile:res.tile };
}

/* ================= Сборка плитки на отчёте и автопроверка ================= */
// черновик плитки: отчёт, значения его параметров, выбор из ответа, способ показа; своего вопроса нет
function blankDraft(reportId){ const r = reportById(reportId) || (reportId ? null : REPORTS[0]); const params = {};
  if(r) Object.keys(r.params).forEach(n=>{ params[n] = n==='date' ? 'today' : n==='period' ? 'curMonth' : '*'; });
  return { report: r ? r.id : reportId, params, pick:{ cols: r ? [r.cols[0]] : [], level:0 }, format:'number', shift:null, points:12, tl:null, title:'', kind:'overview' }; }
function pinFromReport(reportId){ const r = reportById(reportId); return r ? Object.assign(blankDraft(r.id), { title:r.title }) : null; }   // «📌 на дашборд»
function formatsFor(d){ const q = questionOf(d); if(!q || !q.inds.length) return Object.keys(FORMAT_NAMES).map(f=>({ f, ok:false, why:'отчёт не найден' }));
  return formatsOfQ(q, reportById(d.report)); }
function shiftsFor(d){ const q = questionOf(d); const r = reportById(d && d.report);
  if(!q || !q.inds.length) return [{ id:null, ok:false, why:'отчёт не найден' }];
  if(!timedReport(r)) return [{ id:null, ok:false, why:NO_DATE }];
  if(qKind(q)==='flow'){ const P = PERIODS[q.period]; return P.partial ? [{ id:null, ok:false, why:'неполный период не с чем честно сравнить' }] : [{ id:'auto', ok:true, label:'к предыдущему такому же периоду' }]; }
  return Object.keys(STOCK_BASES).map(k=>{ const same = q.date==='prevMonthEnd' && k==='prevMonthEnd';
    return { id:k, ok:!same, label:STOCK_BASES[k].label, why: same ? 'база совпадает с датой плитки' : null }; });
}
// держатели ролей, которым круг отчёта не открыт: по роли — сколько человек и в каких подразделениях
function circleGaps(r, roleIds){ const out = [];
  roleIds.forEach(role=>{ const by = {};
    USERS.filter(u=>u.roles.includes(role) && !circleOpen(r, u)).forEach(u=>{ by[u.dept] = (by[u.dept]||0) + 1; });
    const ds = Object.keys(by); if(ds.length) out.push({ role, n:ds.reduce((a,k)=>a+by[k], 0), depts:ds.map(k=>({ dept:k, n:by[k] })) }); });
  return out; }
function gapText(g){ return 'круг отчёта не покрывает '+g.n+' '+(g.n%10===1 && g.n%100!==11 ? 'держателя' : 'держателей')+' роли «'+roleName(g.role)+'»: '
  +g.depts.map(x=>deptName(x.dept)+(g.depts.length>1 ? ' ('+x.n+')' : '')).join(', '); }
function circleWord(r){ const c = r.circle || {};
  return c.all ? 'все' : c.owner ? 'только автор' : c.depts ? 'подразделений: '+c.depts.length : 'не задан'; }
// пункты круга при публикации: роли, в чьих объявленных раскладках плитка стоит или встанет (forRoles), и их держатели; новая плитка вне раскладок — круг называется
function circleCheck(d){
  const r = reportById(d && d.report); if(!r) return [];
  const roles = [...new Set([...(d.id ? whereUsed(d.id).roles : []), ...(d.forRoles || [])])].filter(x=>S.declared[x]);
  const gaps = circleGaps(r, roles);
  if(gaps.length) return gaps.map(g=>({ ok:false, text:gapText(g) }));
  return [{ ok:true, text: roles.length ? 'круг отчёта открыт всем держателям ролей: '+roles.map(roleName).join(', ') : 'круг отчёта: '+circleWord(r) }];
}
// значения плитки из закрытых списков: дата, период, база сдвига, точки ряда, месяц движения
function badValue(d){ const p = d.params || {};
  if(p.date!==undefined && !DATE_MODES[p.date]) return 'такой даты нет: «'+p.date+'»';
  if(p.period!==undefined && !PERIODS[p.period]) return 'такого периода нет: «'+p.period+'»';
  if(d.shift!=null && !STOCK_BASES[d.shift]) return 'такой базы сдвига нет: «'+d.shift+'»';
  if(d.points!=null && ![6,12,24].includes(d.points)) return 'точек в ряду — 6, 12 или 24';
  if(d.mvMonth!=null && ![0,-1].includes(d.mvMonth)) return 'месяц движения — текущий или прошлый';
  return null; }
function autocheck(d){
  const r = reportById(d && d.report); const k = (d && d.pick) || {};
  const checks = [{ ok: !!r && r.state==='active', text: r ? 'отчёт «'+r.title+'» действует' : 'отчёт не найден' }];
  if(!r) return { checks, ok:false, preview:{ state:'broken', msg:'Плитка не ссылается на отчёт' } };
  const bv = badValue(d); if(bv){ checks.push({ ok:false, text:bv }); return { checks, ok:false, preview:{ state:'broken', msg:bv } }; }
  checks.push({ ok: circleOpen(r, user()), text: circleOpen(r, user()) ? 'отчёт «'+r.title+'» открыт вам' : 'отчёт «'+r.title+'» не открыт вам' });
  const cols = pickCols(k, r);
  checks.push({ ok: cols.length>=1 && cols.length<=4, text:'колонок от 1 до 4' });
  checks.push({ ok: cols.every(i=>r.cols.includes(i)), text:'колонки из отчёта «'+r.title+'»' });
  checks.push({ ok: !k.dims && (k.level||0)<=r.dims.length, text:'уровень строк есть в отчёте: разрезов '+r.dims.length });
  if(k.share) checks.push({ ok: k.share.length===2 && k.share[0]!==k.share[1] && k.share.every(i=>r.cols.includes(i)), text:'доля — две колонки отчёта' });
  if(k.pct){ const vals = r.dims.includes(k.pct.dim) ? valuesOf(k.pct.dim, DATA[r.obj]) : [];
    checks.push({ ok: vals.length>0 && k.pct.cells.length>0 && k.pct.cells.every(c=>vals.includes(c)), text:'«% от итога группы» — разрез отчёта и его значения' });
    const D = DIMS[k.pct.dim]; if(D && D.at) checks.push({ ok:false, text:'у разреза «'+D.name+'» значение меняется со временем — «% от итога группы» по нему не считается; возьмите разрез без истории' }); }
  const c = checkQuestion(questionOf(d), r); checks.push(...c.checks);
  if(d.format==='shift'){ const sh = shiftsFor(d); const b = sh.find(x=>x.id===(sh[0] && sh[0].id==='auto' ? 'auto' : d.shift || 'prevMonthEnd')) || sh[0];
    checks.push({ ok: !!b && b.ok, text:'база сдвига из закрытого списка'+(b && !b.ok && b.why ? ': '+b.why : '') }); }
  checks.push({ ok: !!(d.title||'').trim(), text:'есть подпись' });
  checks.push(...circleCheck(d));
  const why = reportBroken(d); if(why && checks.every(x=>x.ok)) checks.push({ ok:false, text:why });   // сломанное, что не назвали пункты выше
  return { checks, ok: checks.every(x=>x.ok), preview:c.preview };
}
function cleanPick(k){ k = k || {}; const o = {}; if(k.cols && k.cols.length) o.cols = k.cols.slice(); o.level = k.level || 0;
  if(k.top!==undefined) o.top = k.top; if(k.share) o.share = k.share.slice(); if(k.pct) o.pct = { dim:k.pct.dim, cells:k.pct.cells.slice() }; return o; }
function saveTile(d, mode){ // mode: 'personal' | 'draft' | 'publish'
  const u = user(); const ac = autocheck(d);
  if(mode==='personal'){ const lock = circleWhy(d, u) || (!reportsFor(u).some(x=>x.r.id===d.report) ? 'Нельзя: отчёт не открыт вашей роли' : null);   // личная плитка — только на открытый вам отчёт
    if(lock) return { error:lock, checks:ac.checks }; }
  if(mode!=='draft' && !ac.ok) return { error:'Автопроверка не пройдена', checks:ac.checks };
  if(mode!=='personal' && !isAdmin(u)) return { error:'Публикует только администратор дашборда' };
  const id = (mode==='personal'?'p-':'n-')+u.id+'-'+(++tileSeq);
  const nt = { id, kind:'overview', report:d.report, params:cp(d.params||{}), pick:cleanPick(d.pick), format:d.format, shift:d.shift||null, points:d.points||12,
    tl: d.tl ? cp(d.tl) : null, title:d.title, owner: mode==='personal' ? u.id : 'catalog', state: mode==='personal' ? 'personal' : mode==='draft' ? 'draft' : 'published', version:1, created:'11.10.2026' };
  if(d.mvMonth!==undefined) nt.mvMonth = d.mvMonth;
  if(mode!=='personal' && d.forRoles && d.forRoles.length) nt.forRoles = d.forRoles.slice();     // для каких ролей плитку готовят: круг проверяется по ним
  TILES.push(nt);
  journal(mode==='personal'?'собрал личную плитку':mode==='draft'?'сохранил черновик':'опубликовал плитку', nt.title);
  return { tile:nt };
}
const TILE_EDIT = ['params','pick','format','shift','points','mvMonth','tl','title'];
function editTile(id, patch){ // правка значений параметров, выбора и показа — новая версия у всех; другой отчёт — новая плитка
  const x = tileById(id); if(!x) return { error:'нет плитки' };
  if(patch.report!==undefined && patch.report!==x.report) return { error:'Другой отчёт — это новая плитка' };
  const bad = Object.keys(patch).filter(k=>k!=='report' && !TILE_EDIT.includes(k));
  if(bad.length) return { error:'У плитки своего вопроса нет — показатели, разрезы и фильтр правятся в отчёте' };
  const nx = Object.assign({}, x); TILE_EDIT.filter(k=>k in patch).forEach(k=>{ const v = patch[k]; nx[k] = k==='pick' ? cleanPick(v) : v===undefined || v===null ? v : cp(v); });
  const why = reportBroken(nx), ac = nx.kind==='link' ? { ok:true, checks:[] } : autocheck(nx);   // правка проходит ту же автопроверку, что и сборка
  if(why || !ac.ok) return { error: why || 'Автопроверка не пройдена', checks:ac.checks };
  TILE_EDIT.filter(k=>k in patch).forEach(k=>{ x[k] = nx[k]; });
  x.version++; journal('изменил плитку (версия '+x.version+')', x.title); return { tile:x };
}
function isAdmin(u){ return u.roles.some(r=>(ROLES.find(x=>x.id===r)||{}).admin); }
function propose(id){ const t = tileById(id); if(!t || t.owner!==user().id) return false; t.proposed = true;
  S.proposals.push({ tile:id, from:user().id, at:TODAY.label }); journal('предложил плитку в каталог', t.title); return true; }
// в каталог — только плитка на отчёте, открытом не одному автору; автопроверка — как у публикации
function moveToCatalog(id){ const t = tileById(id); if(!t || !isAdmin(user())) return false;
  const r = t.kind!=='link' && reportById(t.report);
  if(r && (r.shelf==='personal' || (r.circle || {}).owner)) return { error:'Не перенесено: отчёт «'+r.title+'» личный — сначала откройте его кругу в отчётности' };
  const ac = t.kind==='link' ? { ok:true } : autocheck(t); if(!ac.ok) return { error:'Автопроверка не пройдена', checks:ac.checks };

function publishDraft(id){ const t = tileById(id); if(!t || t.state!=='draft') return false;
  const ac = autocheck(t); if(!ac.ok) return { error:reportBroken(t) || 'Автопроверка не пройдена', checks:ac.checks }; t.state='published'; delete t.forRoles; journal('опубликовал плитку', t.title); return true; }
function whereUsed(id){
  const roles = Object.keys(S.declared).filter(r=>S.declared[r].includes(id));
  const personal = Object.keys(S.overlays).filter(k=>S.overlays[k].added.includes(id)).length;
  const scr = Object.values(S.screens).reduce((a,l)=>a+l.filter(s=>s.items.includes(id)).length, 0);

}
function withdraw(id){ const t = tileById(id); if(!t || !isAdmin(user())) return false; const w = whereUsed(id);
  t.state = 'withdrawn'; journal('снял плитку', t.title+' · роли: '+(w.roles.map(roleName).join(', ')||'—')+' · личных: '+w.personal+' · своих экранов: '+w.screens); return w; }
function declaredEdit(roleId, op, key, arg){ if(!isAdmin(user())) return false; const L = S.declared[roleId]; if(!L) return false;
  const i = L.indexOf(key);
  if(op==='add' && !L.includes(key)){ const t = tileById(key), r = t && t.kind!=='link' && t.report && reportById(t.report);   // круг отчёта покрывает всех держателей роли
    const gaps = r ? circleGaps(r, [roleId]) : []; if(gaps.length) return { error:'Не поставлено: '+gaps.map(gapText).join('; '), checks:gaps.map(g=>({ ok:false, text:gapText(g) })) };

/* ================= Выгрузка со штампом ================= */
// штамп по правилам отчётности: плитка, отчёт и его версия, значения параметров словами, паспорт, охват, «не официальный документ», кто и когда
function stampOf(tile, res){
  const u = user(); const r = tile.kind!=='link' && tile.report && reportById(tile.report);
  const ps = r ? paramList(r, tile.params || {}).map(x=>x.name+' — '+x.value) : [];
  return [ 'Плитка: '+tile.title,
    ...(r ? ['Отчёт: «'+r.title+'», версия '+r.version+', владелец '+userName(r.owner)] : []),
    ...(ps.length ? ['Значения параметров: '+ps.join('; ')] : []),
    'Паспорт: '+(res.passport || '—'),
    'Охват: '+(res.visible!==undefined ? 'видно '+nbsp(res.visible) : '—')+(res.panelApplied && res.panelApplied.length ? ' · фильтр: '+res.panelText : ' · фильтр панели: нет'),
    'НЕ ЯВЛЯЕТСЯ ОФИЦИАЛЬНЫМ ДОКУМЕНТОМ. Документ с номером и подписью выпускает модуль «Отчётность».',
    'Выгрузил: '+u.name+', '+TODAY.label ];
}
function exportTile(tileId, kind, roleId){ // kind: 'pdf' | 'xlsx'
  const t = tileById(tileId); const res = cachedAsk(t, user(), roleId, S.panel);
  if(res.state==='broken' || res.state==='noaccess') return { refused:true, msg:res.msg };      // отчётность не выгружает то, чего не показывает
  const stamp = stampOf(t, res); const rows = [];
  if(res.value!==undefined && res.value!==null) rows.push([t.title, fmtVal(res.value, res.unit)]);
  (res.nodes||[]).forEach(n=>rows.push([n.label, fmtVal(n.value, res.unit)]));
  (res.table ? res.table.rows : []).forEach(r=>rows.push([r.label, ...r.cells.map((c,i)=>fmtVal(c, res.table.cols[i].unit))]));
  (res.series ? res.series.points : []).forEach(p=>rows.push([p.label, ...p.vals.map(v=>fmtVal(v, res.unit))]));
  if(res.move) rows.push(['начало', fmtVal(res.move.start,'sum')], ['конец', fmtVal(res.move.end,'sum')]);
  const csv = [...stamp.map(s=>'# '+s), ...rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'))].join('\n');

/* ================= Сигналы отчётности по порогам светофора ================= */
function tlLimits(q){ const t = q && q.tl; return t ? [t.red, t.yellow].filter(Array.isArray) : []; }    // green:true/false — не порог
function tlCond(q, x){ return x[0]+' '+(q.share ? String(x[1]).replace('.',',')+' %' : fmtVal(x[1], IND[q.inds[0]].unit)); }
function condHit(op, lim, v){ return v!==null && v!==undefined && (op==='>' ? v > lim : v < lim); }
function signalsOf(uid, tileId){ return S.signals.filter(s=>s.owner===uid && s.tile===tileId); }
function signalToggle(tileId, roleId){ // 🔔: по сигналу на каждый порог; создание не уведомляет — сигнал срабатывает на переходе
  const u = user(); const t = tileById(tileId); const mine = signalsOf(u.id, tileId);
  if(mine.length){ S.signals = S.signals.filter(s=>!mine.includes(s)); return false; }   // снять можно всегда, даже у сломанной плитки
  if(t && t.kind==='link') return { error:'У плитки очереди нет отчёта — сигнал ставится на отчёт' };
  const why = t && reportBroken(t); if(why) return { error:why };                  // у сломанной плитки порогам не с чем сравнивать
  const q = t && questionOf(t); const lims = tlLimits(q); if(!lims.length) return { error:'У плитки нет порогов светофора' };
  const r = ask(t, u, roleId, {}); const val = (r.state==='ok' || r.state==='zero') ? r.value : null;
  return lims.map(x=>{ const s = { id:'sg'+(++S.sigN), owner:u.id, roleId, tile:tileId, version:t.version, report:t.report || null, params:JSON.parse(JSON.stringify(t.params || {})),
      op:x[0], v:x[1], label:tlCond(q, x), state:condHit(x[0], x[1], val), last:val }; S.signals.push(s); return s; });
}
function signalRemove(id){ const n = S.signals.length; S.signals = S.signals.filter(s=>!(s.id===id && s.owner===S.userId)); return S.signals.length < n; }
function nightCheck(){ // раз в день после ночного снимка; уведомление — только на переходе в условие, на возврат в норму тихо
  if(STAND.nightRunFailed) return { skipped:'ночной снимок не прошёл — сигналы не проверялись' };
  const fired = [], dropped = [];
  // плитку сняли, удалили или изменили после постановки — сигналы на ней снимаются, владелец получает одну строку на плитку
  S.signals = S.signals.filter(s=>{ const t = tileById(s.tile); const gone = !t || t.state==='withdrawn'; if(!gone && t.version===s.version) return true;
    if(!dropped.some(n=>n.to===s.owner && n.tile===s.tile)){ const n = { to:s.owner, tile:s.tile, signal:s.id, at:TODAY.label, read:false, dropped:true,
        text:'Сигнал снят: плитка «'+(t ? t.title : s.tile)+'» '+(gone ? 'снята' : 'изменена') };
      dropped.push(n); S.notifs.unshift(n); }
    return false; });
  fired.dropped = dropped;
  S.signals.forEach(s=>{ const u = USERS.find(x=>x.id===s.owner); const t = tileById(s.tile); if(!u || !t) return;
    const r = ask(t, u, s.roleId, {}); if(r.state!=='ok' && r.state!=='zero') return;
    const now = condHit(s.op, s.v, r.value);
    if(now && !s.state){ const n = { to:s.owner, tile:s.tile, signal:s.id, at:TODAY.label, read:false,
        text:t.title+' '+s.label+' — '+fmtVal(r.value, r.unit)+(s.last!==null && s.last!==undefined ? ' (было '+fmtVal(s.last, r.unit)+')' : '') };
      S.notifs.unshift(n); fired.push(n); }
    s.state = now; s.last = r.value; });
  return fired;
}

function scopeKey(t, u, roleId){ const q = questionOf(t) || { filter:[], inds:[] };   // «я» в значении параметра — ключ личный
  const personal = (q.filter||[]).some(c=>typeof c.v==='string' && c.v.startsWith('@')) || q.inds.some(i=>OBJECTS[IND[i].obj].vis==='self');
  const rs = viewerRoles(u, roleId).slice().sort().join(',');
  return personal ? 'user:'+u.id+':'+rs : 'roles:'+rs+':'+u.dept;
}
// отчёт и его версия — правка отчёта обесценивает ответ сразу; значения параметров лежат в плитке, её версия — в ключе
function cacheKey(t, u, roleId, panel){ const r = t.kind!=='link' && t.report && reportById(t.report);
  return [t.id, t.version, t.report || '', r ? r.version+':'+r.state : 'нет отчёта', JSON.stringify(t.params || {}), scopeKey(t,u,roleId), circleWhy(t,u) ? 'круг закрыт' : '', JSON.stringify(panel||{}), JSON.stringify(STAND)].join('§'); }
function cachedAsk(t, u, roleId, panel){
  const q = questionOf(t) || {}; const k = cacheKey(t, u, roleId, panel); const live = q.period ? PERIODS[q.period].partial : (q.date||'today')==='today';
  const hit = S.cache.get(k); const ttl = live ? 1 : 1e9;      // «сегодня» — не дольше минуты; закрытый день — до следующего прогона
  if(hit && S.clock - hit.at < ttl){ S.cacheHits++; return hit.res; }
  S.cacheMiss++; const res = ask(t, u, roleId, panel); S.cache.set(k, { at:S.clock, res, calcAt:TODAY.time }); return res;
}
function tick(min){ S.clock += (min||1); }

function seriesSVG(t, res){
  const s = res.series; const W = 520, H = 120, pad = 22; const n = s.points.length; const lines = s.lines.length;
  const all = s.points.flatMap(p=>p.vals).filter(v=>v!==null); const max = Math.max(...all, 1);
  const x = i=> pad + i*(W-2*pad)/Math.max(1,n-1); const y = v=> H-18 - (v/max)*(H-34);
  const colors = ['var(--series-1)','var(--series-2)','var(--series-3)'];
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${t.format==='series'?120:120}px">`;
  svg += `<line x1="${pad}" x2="${W-pad}" y1="${H-18}" y2="${H-18}" stroke="rgba(26,57,96,.18)"/>`;
  if(lines===1){ const bw = (W-2*pad)/n*0.62;
    s.points.forEach((p,i)=>{ const v = p.vals[0]||0; const h = (v/max)*(H-34);
      svg += `<rect x="${x(i)-bw/2}" y="${H-18-h}" width="${bw}" height="${Math.max(1,h)}" rx="3" fill="${p.closed?colors[0]:'var(--seq-200)'}" data-tip="${esc(p.label)}: ${esc(fmtVal(v, res.unit))} · ${p.closed?'месяц закрыт':'не закрыт'}" onclick="event.stopPropagation();DB.whoMonth('${t.id}',${p.m})" style="cursor:pointer"/>`; }); }
  else s.lines.forEach((L,li)=>{ svg += `<polyline fill="none" stroke="${colors[li]}" stroke-width="2" points="${s.points.map((p,i)=>x(i)+','+y(p.vals[li]||0)).join(' ')}"/>`;
    s.points.forEach((p,i)=>{ svg += `<circle cx="${x(i)}" cy="${y(p.vals[li]||0)}" r="4" fill="${p.closed?colors[li]:'#fff'}" stroke="${colors[li]}" stroke-width="2" data-tip="${esc(L.name)} · ${esc(p.label)}: ${esc(fmtVal(p.vals[li], res.unit))}" onclick="event.stopPropagation();DB.whoMonth('${t.id}',${p.m},${li})" style="cursor:pointer"/>`; }); });
  s.points.forEach((p,i)=>{ if(i===0 || i===n-1 || i===Math.floor(n/2)) svg += `<text x="${x(i)}" y="${H-4}" text-anchor="middle">${esc(p.label)}</text>`; });
  const last = s.points[n-1].vals[0];
  svg += `<text x="${W-pad}" y="12" text-anchor="end">${esc(fmtVal(last, res.unit))} — последняя точка = дата среза</text></svg>`;
  const legend = lines>1 ? `<div class="legend">${s.lines.map((L,i)=>`<span><span class="dot" style="background:${colors[i]}"></span> ${esc(L.name)}</span>`).join('')}</div>` : '';
  return svg + legend + `<div class="legend"><span><span class="dot" style="background:var(--series-1)"></span> месяц закрыт</span><span><span class="dot" style="background:var(--seq-200)"></span> не закрыт</span></div>`;
}
