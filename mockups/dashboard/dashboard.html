<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд · АСУБК</title>
<!--
  АСУБК · модуль «Дашборд» · макет.
  Логика и решения — ASUBK-dashbord-logika.md, чек-лист и дефекты — ASUBK-status-razrabotki.md.
  Движок window.DB (учебная статистика + плитки + раскладки) проверяется смоуком:
    node scripts/inspect/dashboard-check.mjs
  Все числа — демо: макет сам изображает статистику (statSlice / statSeries / statRows) на
  сгенерированных строках, чтобы фильтр, клик и выгрузка сходились с числом на плитке.
  «Сегодня» заморожено константой: пятница 09.10.2026, 14:15.
-->
<style>
:root{
  --asubk-blue:#006AF5; --asubk-blue-hover:#0058CC; --asubk-link:#005FDB;
  --asubk-green:#158443; --asubk-green-hover:#106A36; --asubk-red:#E03A3A; --asubk-red-hover:#C42E2E;
  --asubk-ink:#192434; --asubk-ink-90:rgba(24,39,57,0.94); --asubk-ink-65:rgba(24,39,57,0.65);
  --asubk-ink-45:rgba(24,39,57,0.45); --asubk-ink-26:rgba(28,52,84,0.26);
  --asubk-white:#FFFFFF; --asubk-gray-50:#F8F9FB; --asubk-gray-100:#F5F7FA;
  --asubk-gray-150:#EFF1F4; --asubk-gray-200:#E4E8EE;
  --asubk-border-base:rgba(28,55,90,0.16); --asubk-border-strong:rgba(28,55,90,0.30);
  --asubk-grid-line:rgba(26,57,96,0.10); --asubk-tint-fill:rgba(25,59,103,0.05);
  --asubk-blue-tint:rgba(0,106,245,0.08); --asubk-nav-active:rgba(51,139,255,0.13);
  --asubk-red-tint:#FCE6E6; --asubk-green-tint:rgba(21,132,67,0.10);
  --asubk-amber:#B8860B; --asubk-amber-tint:rgba(184,134,11,0.12);
  --series-1:#006AF5; --series-2:#E03A3A; --series-3:#158443; --series-4:#8A5CF6;
  --text-body:var(--asubk-ink-90); --text-heading:var(--asubk-ink); --text-muted:var(--asubk-ink-65);
  --text-placeholder:var(--asubk-ink-45); --text-disabled:var(--asubk-ink-26); --text-link:var(--asubk-link);
  --surface-page:var(--asubk-white); --surface-panel:var(--asubk-gray-100); --surface-sidebar:var(--asubk-gray-150);
  --surface-card:var(--asubk-white); --surface-hover:var(--asubk-gray-50);
  --border-default:var(--asubk-border-base); --border-strong:var(--asubk-border-strong); --border-focus:var(--asubk-blue);
  --action-primary:var(--asubk-blue); --action-success:var(--asubk-green); --action-danger:var(--asubk-red);
  --status-success-bg:var(--asubk-green-tint); --status-info-bg:var(--asubk-blue-tint);
  --status-warning-bg:var(--asubk-amber-tint); --status-error-bg:var(--asubk-red-tint);
  --asubk-font:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",Helvetica,Arial,sans-serif;
  --text-xs:12px; --text-sm:14px; --text-base:16px; --text-lg:18px;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600;
  --leading-tight:1.2; --leading-snug:1.35; --leading-normal:1.5;
  --font-body:var(--weight-regular) var(--text-base)/var(--leading-normal) var(--asubk-font);
  --font-label:var(--weight-regular) var(--text-sm)/var(--leading-snug) var(--asubk-font);
  --font-page-title:var(--weight-semibold) var(--text-lg)/var(--leading-tight) var(--asubk-font);
  --radius-sm:3.5px; --radius-md:4px; --radius-lg:8px; --radius-pill:999px;
  --control-h:36px; --header-h:56px; --sidebar-w:270px;
  --tile-row:156px;
  --shadow-focus:0 0 0 2px rgba(0,106,245,0.35);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font:var(--font-body); color:var(--text-body); background:var(--surface-page); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:rgba(28,55,90,0.22); border-radius:6px; }
button:focus-visible, select:focus-visible, input:focus-visible, .tile:focus-visible{ outline:none; box-shadow:var(--shadow-focus); }
.app{ display:flex; height:100vh; width:100%; }
.sidebar{ width:var(--sidebar-w); flex:none; background:var(--surface-sidebar);
  display:flex; flex-direction:column; border-right:1px solid var(--border-default); }
.brand{ padding:18px 16px 4px; font:var(--weight-semibold) 17px/1.2 var(--asubk-font);
  color:var(--text-heading); letter-spacing:0.04em; }
.brand small{ display:block; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); letter-spacing:0; margin-top:4px; }
.who{ margin:10px 12px 0; padding:10px 12px; border:1px solid var(--border-default); border-radius:var(--radius-md);
  background:var(--surface-card); }
.who label{ display:block; font:var(--weight-regular) 12px/1.3 var(--asubk-font); color:var(--text-placeholder); margin-bottom:4px; }
.who select{ width:100%; height:32px; border-radius:var(--radius-md); border:1px solid var(--border-strong);
  font:var(--font-label); padding:0 6px; background:var(--surface-card); color:var(--text-body); }
.who .roles{ margin-top:6px; font:var(--weight-regular) 12px/1.45 var(--asubk-font); color:var(--text-muted); }
.nav{ flex:1; overflow-y:auto; padding:12px 0 8px; }
.nav-sec{ padding:9px 16px 4px; font:var(--weight-semibold) 12px/1.3 var(--asubk-font);
  color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.05em; }
.nav-item{ display:flex; align-items:center; gap:9px; padding:8px 16px; text-decoration:none; width:100%;
  color:rgba(27,43,65,0.72); font:var(--weight-regular) 15px/1.4 var(--asubk-font);
  cursor:pointer; background:none; border:none; text-align:left; }
.nav-item:hover{ background:rgba(24,39,57,0.05); }
.nav-item.active{ background:var(--asubk-nav-active); color:rgba(24,39,57,0.96); font-weight:var(--weight-medium); }
.nav-item .cnt{ margin-left:auto; color:var(--text-placeholder); font-size:12px; }
.nav-item[hidden]{ display:none; }
.demo{ border-top:1px solid var(--border-default); padding:10px 14px 14px; font:var(--weight-regular) 12px/1.4 var(--asubk-font);
  color:var(--text-muted); }
.demo b{ display:block; color:var(--text-placeholder); text-transform:uppercase; letter-spacing:.05em; font-size:11px; margin-bottom:6px; }
.demo label{ display:flex; align-items:center; gap:6px; margin:4px 0; cursor:pointer; }
.demo select{ height:28px; font:var(--weight-regular) 12px/1 var(--asubk-font); border:1px solid var(--border-strong);
  border-radius:var(--radius-md); background:var(--surface-card); width:100%; margin-bottom:4px; }
.main{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--surface-page); }
.topbar{ min-height:var(--header-h); flex:none; border-bottom:1px solid var(--border-default);
  display:flex; align-items:center; gap:14px; padding:8px 20px; flex-wrap:wrap; }
.crumb-title{ font:var(--font-page-title); color:var(--text-heading); }
.topbar .right{ margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.content{ flex:1; overflow:auto; }
.panel-wrap{ padding:16px 24px 60px; max-width:1320px; }
.section-h{ font:var(--weight-semibold) 16px/1.2 var(--asubk-font); color:var(--text-heading); margin:24px 0 6px; }
.section-h:first-child{ margin-top:0; }
.muted{ color:var(--text-muted); }
.mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; }
.small{ font:var(--weight-regular) 12.5px/1.45 var(--asubk-font); color:var(--text-muted); }
.small b{ color:var(--text-body); font-weight:var(--weight-medium); }
.linky{ background:none; border:none; padding:0; cursor:pointer; color:var(--text-link);
  font:var(--font-label); text-decoration:underline; }
.card{ border:1px solid var(--border-default); border-radius:var(--radius-md);
  padding:16px 18px; margin-bottom:14px; background:var(--surface-card); }
.card > h3{ margin:0 0 10px; font:var(--weight-semibold) 15px/1.25 var(--asubk-font); color:var(--text-heading); }
.banner{ border-radius:var(--radius-md); padding:10px 14px; margin-bottom:12px; font:var(--font-label); }
.banner.warn{ background:var(--status-warning-bg); color:#7a5a07; }
.banner.info{ background:var(--status-info-bg); color:#0b4fae; }
.banner.danger{ background:var(--status-error-bg); color:#a32323; }
.banner.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.banner b{ font-weight:var(--weight-semibold); }
.pill{ display:inline-block; padding:2px 9px; border-radius:var(--radius-pill);
  font:var(--weight-medium) 12px/1.5 var(--asubk-font); white-space:nowrap; }
.pill.ok{ background:var(--status-success-bg); color:var(--asubk-green); }
.pill.warn{ background:var(--status-warning-bg); color:#7a5a07; }
.pill.err{ background:var(--status-error-bg); color:var(--asubk-red); }
.pill.info{ background:var(--status-info-bg); color:var(--asubk-blue); }
.pill.neutral{ background:var(--asubk-tint-fill); color:var(--text-muted); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:var(--control-h);
  padding:0 14px; border:1px solid transparent; border-radius:var(--radius-md);
  font:var(--weight-semibold) 14px/1 var(--asubk-font); cursor:pointer; white-space:nowrap; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--action-primary); color:#fff; }
.btn-primary:hover:not(:disabled){ background:var(--asubk-blue-hover); }
.btn-danger{ background:var(--action-danger); color:#fff; }
.btn-secondary{ background:var(--surface-card); color:var(--text-body); border-color:var(--border-default); }
.btn-secondary:hover:not(:disabled){ background:var(--surface-hover); }
.btn-secondary.on{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); color:var(--asubk-blue); }
.btn-sm{ height:30px; padding:0 10px; font-size:13px; font-weight:var(--weight-medium); }
.btn-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
.fld{ display:flex; flex-direction:column; gap:5px; }
.fld > label{ font:var(--font-label); color:var(--text-muted); }
.fld select, .fld input{ border-radius:var(--radius-md); border:1px solid var(--border-strong); height:var(--control-h);
  background:var(--surface-card); color:var(--text-body); font:var(--font-label); padding:6px 10px; min-width:180px; }
.form-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
table.cgrid{ width:100%; border-collapse:collapse; font:var(--font-label);
  border:1px solid var(--border-default); background:var(--surface-card); }
table.cgrid thead th{ text-align:left; padding:9px 12px; background:var(--surface-panel);
  border-bottom:1px solid var(--asubk-grid-line); font:var(--weight-semibold) 13.5px/1.35 var(--asubk-font);
  color:var(--text-heading); white-space:nowrap; }
table.cgrid tbody td{ padding:8px 12px; border-bottom:1px solid var(--asubk-grid-line); vertical-align:top; }
table.cgrid tbody tr:last-child td{ border-bottom:none; }
table.cgrid tbody tr.click{ cursor:pointer; } table.cgrid tbody tr.click:hover td{ background:var(--surface-hover); }
table.cgrid tbody tr.off td{ color:var(--text-placeholder); }
table.cgrid td.num, table.cgrid th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ---------- вкладки раскладок и панель фильтров ---------- */
.screens{ display:flex; gap:4px; flex-wrap:wrap; align-items:flex-end; border-bottom:1px solid var(--border-default); margin-bottom:12px; }
.screens button{ background:none; border:none; padding:8px 13px; cursor:pointer; font:var(--font-label);
  color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.screens button.on{ color:var(--asubk-blue); border-bottom-color:var(--asubk-blue); font-weight:var(--weight-semibold); }
.screens .sep{ width:1px; height:20px; background:var(--border-default); margin:0 6px 8px; }
.screens .kind{ font:var(--weight-regular) 11px/1 var(--asubk-font); color:var(--text-placeholder); margin-left:4px; }
.fbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:8px 12px; margin-bottom:12px;
  background:var(--surface-panel); border-radius:var(--radius-md); font:var(--font-label); }
.fbar label{ color:var(--text-muted); display:flex; align-items:center; gap:6px; }
.fbar select{ height:30px; border-radius:var(--radius-md); border:1px solid var(--border-strong); background:var(--surface-card);
  font:var(--font-label); padding:0 8px; max-width:220px; }
.fbar select.set{ border-color:var(--asubk-blue); background:var(--asubk-blue-tint); }
.fbar .note{ margin-left:auto; color:var(--text-placeholder); font-size:12.5px; }
.saved-filter{ display:flex; align-items:center; gap:10px; margin:-4px 0 12px; font:var(--weight-semibold) 15px/1.3 var(--asubk-font); }
.refresh-note{ font:var(--weight-regular) 12.5px/1.3 var(--asubk-font); color:var(--text-placeholder); }

/* ---------- секции и сетка ---------- */
.dsec{ margin:6px 0 18px; }
.dsec-h{ display:flex; align-items:center; gap:8px; margin:0 0 8px; font:var(--weight-semibold) 13px/1.3 var(--asubk-font);
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.dsec-h .tog{ background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:12px; padding:2px 4px; }
.dsec-h .line{ flex:1; height:1px; background:var(--border-default); }
.dsec-h input{ font:var(--weight-semibold) 13px/1.3 var(--asubk-font); text-transform:uppercase; border:1px dashed var(--border-strong);
  border-radius:var(--radius-sm); padding:2px 6px; color:var(--text-body); background:var(--surface-card); }
.grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); grid-auto-rows:var(--tile-row); gap:12px; grid-auto-flow:row dense; }
.s-1x1{ grid-column:span 1; grid-row:span 1; }
.s-2x1{ grid-column:span 2; grid-row:span 1; }
.s-2x2{ grid-column:span 2; grid-row:span 2; }
@media (max-width:1100px){ .grid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:640px){
  .grid{ grid-template-columns:minmax(0,1fr); grid-auto-rows:auto; }
  .s-1x1,.s-2x1,.s-2x2{ grid-column:span 1; grid-row:auto; min-height:var(--tile-row); }
  .sidebar{ display:none; } .panel-wrap{ padding:12px 16px 40px; }
}
.phone .grid{ grid-template-columns:minmax(0,1fr); grid-auto-rows:auto; }
.phone .s-1x1,.phone .s-2x1,.phone .s-2x2{ grid-column:span 1; grid-row:auto; min-height:var(--tile-row); }
.phone-frame{ width:390px; margin:0 auto; border:10px solid #1f2937; border-radius:30px; padding:14px 12px; background:#fff;
  max-height:none; }

/* ---------- плитка ---------- */
.tile{ position:relative; display:flex; flex-direction:column; min-width:0; min-height:0;
  border:1px solid var(--border-default); border-radius:var(--radius-lg); background:var(--surface-card);
  padding:10px 12px 8px; overflow:hidden; }
.tile:hover{ border-color:var(--border-strong); }
.tile.l-green{ box-shadow:inset 4px 0 0 var(--asubk-green); }
.tile.l-yellow{ box-shadow:inset 4px 0 0 #E0A800; }
.tile.l-red{ box-shadow:inset 4px 0 0 var(--asubk-red); }
.tile.st-stale{ border:2px solid #E0A800; }
.tile.st-broken, .tile.st-noaccess, .tile.st-error, .tile.st-refuse{ background:var(--surface-panel); }
.tile.dragging{ opacity:.4; } .tile.drop{ outline:2px dashed var(--asubk-blue); outline-offset:2px; }
.t-head{ display:flex; align-items:flex-start; gap:6px; min-height:22px; }
.t-title{ flex:1; min-width:0; font:var(--weight-semibold) 13.5px/1.3 var(--asubk-font); color:var(--text-heading);
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.t-tag{ flex:none; font:var(--weight-medium) 10.5px/1.6 var(--asubk-font); padding:0 6px; border-radius:var(--radius-pill);
  background:var(--asubk-blue-tint); color:var(--asubk-blue); white-space:nowrap; }
.t-tag.mine{ background:rgba(138,92,246,.12); color:#6d3fd8; }
.t-btn{ flex:none; background:none; border:none; cursor:pointer; color:var(--text-placeholder); font-size:15px; line-height:1;
  padding:2px 4px; border-radius:var(--radius-sm); }
.t-btn:hover{ background:var(--asubk-tint-fill); color:var(--text-body); }
.t-btn.on{ color:var(--asubk-blue); }
.t-body{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; cursor:pointer; position:relative; }
.t-pass{ flex:none; font:var(--weight-regular) 11.5px/1.35 var(--asubk-font); color:var(--text-placeholder);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t-pass .f{ color:var(--asubk-blue); } .t-pass .nf{ color:var(--text-placeholder); font-style:italic; }
.t-light{ font:var(--weight-regular) 11px/1.3 var(--asubk-font); color:var(--text-placeholder); }
.big{ font:var(--weight-semibold) 30px/1.1 var(--asubk-font); color:var(--text-heading); font-variant-numeric:tabular-nums; white-space:nowrap; }
.big .u{ font:var(--weight-regular) 13px/1 var(--asubk-font); color:var(--text-muted); margin-left:4px; }
.big.mid{ font-size:24px; }
.sub{ font:var(--weight-regular) 12.5px/1.35 var(--asubk-font); color:var(--text-muted); margin-top:3px; }
.shift{ display:inline-flex; align-items:center; gap:4px; font:var(--weight-medium) 12.5px/1.3 var(--asubk-font); margin-top:4px; }
.shift.good{ color:var(--asubk-green); } .shift.bad{ color:var(--asubk-red); } .shift.flat{ color:var(--text-muted); }
.shift .b{ color:var(--text-placeholder); font-weight:var(--weight-regular); }
.prog{ height:8px; border-radius:4px; background:var(--asubk-gray-200); margin-top:8px; position:relative; overflow:hidden; }
.prog i{ position:absolute; left:0; top:0; bottom:0; background:var(--asubk-blue); border-radius:4px; }
.prog b{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--asubk-ink-45); }
.bars{ display:flex; flex-direction:column; gap:3px; font:var(--weight-regular) 12px/1.25 var(--asubk-font); }
.bar-row{ display:grid; grid-template-columns:minmax(70px,38%) 1fr auto; gap:6px; align-items:center; cursor:pointer;
  border-radius:3px; padding:0 2px; }
.bar-row:hover{ background:var(--asubk-tint-fill); }
.bar-row .lb{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-body); }
.bar-row .tr{ height:10px; background:var(--asubk-gray-150); border-radius:2px; position:relative; }
.bar-row .tr i{ position:absolute; left:0; top:0; bottom:0; background:var(--series-1); border-radius:2px; }
.bar-row .vl{ font-variant-numeric:tabular-nums; color:var(--text-muted); white-space:nowrap; }
.bar-row.total .lb, .bar-row.total .vl{ font-weight:var(--weight-semibold); color:var(--text-heading); }
.bar-row.more{ color:var(--text-placeholder); grid-template-columns:1fr; font-style:italic; }
.steps{ display:flex; align-items:flex-end; gap:6px; height:100%; padding-top:4px; }
.step{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; cursor:pointer; min-width:0; height:100%; }
.step i{ display:block; background:var(--series-1); border-radius:3px 3px 0 0; min-height:2px; }
.step .v{ font:var(--weight-medium) 11.5px/1.2 var(--asubk-font); text-align:center; color:var(--text-body); white-space:nowrap; overflow:hidden; }
.step .l{ font:var(--weight-regular) 11px/1.2 var(--asubk-font); text-align:center; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.step:hover i{ filter:brightness(.9); }
.flow-head{ font:var(--weight-regular) 13px/1.3 var(--asubk-font); margin-bottom:6px; cursor:pointer; }
.flow-head b{ font-size:17px; font-weight:var(--weight-semibold); color:var(--text-heading); }
.flow2{ display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; font:var(--weight-regular) 12px/1.3 var(--asubk-font); }
.fi{ display:flex; justify-content:space-between; gap:6px; border-bottom:1px dotted var(--asubk-grid-line); white-space:nowrap; }
.fi span:first-child{ overflow:hidden; text-overflow:ellipsis; }
.fi span:last-child{ font-variant-numeric:tabular-nums; }
.fi.in span:last-child{ color:var(--asubk-green); } .fi.out span:last-child{ color:var(--asubk-red); } .fi.oth{ color:var(--text-muted); font-style:italic; }
.fi[data-node]{ cursor:pointer; } .fi[data-node]:hover{ background:var(--asubk-tint-fill); }

<script>
/* =====================================================================
   DB — движок модуля «Дашборд» (макет).
   Слой 1 — учебная статистика: строки объектов, реестр показателей и
   разрезов, ответы statSlice / statSeries / statRows. В системе это
   модуль статистики; макет изображает его, чтобы числа сходились.
   Слой 2 — плитки (вопросы), каталог, раскладки, экраны, журнал.
   Слой 3 — показ (render*), только при наличии document.
   Плитка хранит вопрос, а не числа: число каждый раз спрашивается.
   ===================================================================== */
window.DB = (function(){

/* ---------- 0. время: «сегодня» заморожено ---------- */
const DAY = 864e5;
function dn(y,m,d){ return Math.round(Date.UTC(y,m-1,d)/DAY); }
function dparts(n){ const d=new Date(n*DAY); return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; }
function ds(n, full){ const [y,m,d]=dparts(n); return String(d).padStart(2,'0')+'.'+String(m).padStart(2,'0')+(full===false?'':'.'+y); }
function dsShort(n){ return ds(n,false); }
function mIdx(n){ const [y,m]=dparts(n); return y*12+m-1; }
function mStart(mi){ return dn(Math.floor(mi/12), mi%12+1, 1); }
function mEnd(mi){ return mStart(mi+1)-1; }
const MON = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_DAT = ['январю','февралю','марту','апрелю','маю','июню','июлю','августу','сентябрю','октябрю','ноябрю','декабрю'];
const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const T = dn(2026,10,9);          // пятница, 09.10.2026
const CM = mIdx(T);               // текущий месяц
const DOM = dparts(T)[2];         // идёт 9-й день
const CLOSED = T-1;               // последний закрытый день
const clock = { min: 14*60+15 };  // 14:15
function hhmm(min){ return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function monLabel(mi){ return MON[mi%12]+(Math.floor(mi/12)!==Math.floor(CM/12)?' '+Math.floor(mi/12):''); }

/* Периоды потоков — только календарные + «сегодня». */
const PERIODS = {
  today:{ name:'сегодня' },
  m:    { name:'текущий месяц' },
  pm:   { name:'прошлый месяц' },
  q:    { name:'текущий квартал' },
  pq:   { name:'прошлый квартал' },
  ytd:  { name:'с начала года' },
  py:   { name:'прошлый год' },
};
const QN = ['I','II','III','IV'];
function resolvePeriod(p){
  const y = Math.floor(CM/12), qi = Math.floor((CM%12)/3), qs = y*12+qi*3;
  switch(p){
    case 'today': return { id:p, from:T, to:T, complete:false, label:'сегодня, '+dsShort(T) };
    case 'm':  return { id:p, from:mStart(CM), to:T, complete:false, label:'за '+MON[CM%12]+' · идёт '+DOM+'-й день', partial:DOM };
    case 'pm': return { id:p, from:mStart(CM-1), to:mEnd(CM-1), complete:true, label:'за '+monLabel(CM-1),
                        prev:{ from:mStart(CM-2), to:mEnd(CM-2), label:'к '+MON_DAT[(CM-2)%12] } };
    case 'q':  return { id:p, from:mStart(qs), to:T, complete:false, label:'за '+QN[qi]+' кв. · идёт '+(T-mStart(qs)+1)+'-й день' };
    case 'pq': { const ps=qs-3, pqi=(qi+3)%4;
      return { id:p, from:mStart(ps), to:mEnd(ps+2), complete:true, label:'за '+QN[pqi]+' кв.',
               prev:{ from:mStart(ps-3), to:mEnd(ps-1), label:'к '+QN[(pqi+3)%4]+' кв.' } }; }
    case 'ytd': return { id:p, from:dn(y,1,1), to:T, complete:false, label:'с начала года',
               sameSpan:{ from:dn(y-1,1,1), to:dn(y-1,10,DOM), label:'к 01.01–'+dsShort(dn(y-1,10,DOM))+'.'+(y-1) } };
    case 'py': return { id:p, from:dn(y-1,1,1), to:dn(y-1,12,31), complete:true, label:'за '+(y-1)+' год',
               prev:{ from:dn(y-2,1,1), to:dn(y-2,12,31), label:'к '+(y-2)+' году' } };
  }
  return null;
}

/* ---------- 1. детерминированный генератор ---------- */
function rng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
const R = rng(20261009);
function pick(arr){ return arr[Math.floor(R()*arr.length)]; }
function wpick(arr, w){ let s=0; const x=R()*w.reduce((a,b)=>a+b,0); for(let i=0;i<arr.length;i++){ s+=w[i]; if(x<s) return arr[i]; } return arr[arr.length-1]; }
function rint(a,b){ return a+Math.floor(R()*(b-a+1)); }
function hash(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }

/* ---------- 2. справочники: области, подразделения, люди ---------- */
const REGIONS = ['Бишкек','Чуйская','Ошская','Джалал-Абадская','Иссык-Кульская','Нарынская','Таласская','Баткенская'];
const REG_W   = [18,17,17,15,10,8,7,8];
const RP_CODE = ['bish','chu','osh','ja','ik','nar','tal','bat'];
const UNITS = [
  {id:'go',  name:'Головной офис', parent:null},
  {id:'dk',  name:'Департамент кредитования', parent:'go'},
  ...RP_CODE.map((c,i)=>({id:'rp-'+c, name:'РП '+['Бишкек','Чуй','Ош','Джалал-Абад','Иссык-Куль','Нарын','Талас','Баткен'][i], parent:'dk', region:REGIONS[i]})),
  {id:'opk', name:'Отдел проблемных кредитов', parent:'go'},
  {id:'opk-n', name:'Сектор взыскания «Север»', parent:'opk'},
  {id:'opk-s', name:'Сектор взыскания «Юг»', parent:'opk'},
  {id:'opk-c', name:'Сектор судебной работы', parent:'opk'},
  {id:'buh', name:'Бухгалтерия', parent:'go'},
  {id:'zal', name:'Залоговый отдел', parent:'go'},
  {id:'yur', name:'Юридический отдел', parent:'go'},
  {id:'sb',  name:'Служба безопасности', parent:'go'},
  {id:'eko', name:'Экономический отдел', parent:'go'},
  {id:'otc', name:'Отдел отчётности', parent:'go'},
  {id:'an',  name:'Отдел анализа', parent:'go'},
];
function unit(id){ return UNITS.find(u=>u.id===id); }
function unitName(id){ const u=unit(id); return u?u.name:id; }
function unitDown(id){ const out=[id]; for(let i=0;i<out.length;i++) UNITS.forEach(u=>{ if(u.parent===out[i]) out.push(u.id); }); return out; }
const SURN = ['Абдыкалыков','Асанов','Бакиров','Жумабеков','Исаков','Кадыров','Мамбетов','Осмонов','Сатыбалдиев','Токтосунов','Турдубаев','Шаршеев','Эсенгулов','Юсупов','Алымбеков','Дуйшеев','Каримов','Мырзаев','Нурматов','Орозбаев'];
const INIT = ['А.','Б.','Ж.','К.','М.','Н.','Р.','С.','Т.','Э.'];
function person(){ return pick(SURN)+' '+pick(INIT)+pick(INIT); }

const ROLES = {
  ruk:{ name:'Руководство',          scope:'весь портфель',                          wave:1 },
  cur:{ name:'Куратор кредита',      scope:'куратор — я',                            wave:1 },
  prob:{ name:'Проблемные кредиты',  scope:'моё подразделение и ниже',               wave:1 },
  buh:{ name:'Бухгалтерия',          scope:'весь портфель',                          wave:1 },
  zal:{ name:'Залог',                scope:'весь портфель обеспечения',              wave:1 },
  spec:{ name:'Кредитный специалист',scope:'специалист — я',                         wave:2 },
  kom:{ name:'Комиссия',             scope:'комиссии, в которые я вхожу',            wave:2 },
  go:{ name:'Головной офис',         scope:'моё подразделение и ниже',               wave:2 },
  otd:{ name:'Отдел · заключения',   scope:'заявки, назначенные моему отделу',       wave:2 },
  otc:{ name:'Отчётность',           scope:'обязательства моего подразделения',      wave:3 },
  an:{ name:'Аналитик',              scope:'весь портфель',                          wave:1 },
  sys:{ name:'Системный администратор', scope:'—',                                   wave:null },
  dadm:{ name:'Администратор дашборда', scope:'—', noTab:true },
};
const OBJ_ALL = ['loan','borrower','payment','collateral','claim','measure','program','application','comrec','conclusion','task','obligation'];
/* Права — у данных: какие объекты статистики открыты роли. Плитка видна тому, кто вправе спросить её вопрос. */
const OPEN = {
  ruk:OBJ_ALL, an:OBJ_ALL,
  cur:['loan','borrower','collateral','claim','program','payment','task'],
  prob:['loan','borrower','claim','measure','collateral','task'],
  buh:['payment','loan','program','task'],
  zal:['collateral','loan','task'],
  spec:['application','conclusion','comrec','program','borrower','task'],
  kom:['comrec','application','task'],
  go:['application','comrec','task'],
  otd:['conclusion','application','task'],
  otc:['obligation','task'],

/* ---------- 5. ответы статистики ---------- */
function sumBy(arr, fn){ let s=0; for(const x of arr) s+=fn(x)||0; return s; }
function phi(m, at){ // история остатков: детерминированный дрейф (в системе — строки дней статистики)
  if(!m.g || m.unit==='шт' || m.agg==='max') return 1;
  const k = (T-at)/30.4; if(k<=0) return 1;
  return Math.max(0.2, 1 - m.g*k + 0.018*Math.sin(k*1.3 + (hash(m.obj+m.id)%7)));
}
function personaById(id){ return PERSONAS.find(p=>p.id===id); }
function rightsOf(p){ const s=new Set(); p.roles.forEach(r=>(OPEN[r]||[]).forEach(o=>s.add(o))); return s; }
function metricOpen(p, m){ if(!rightsOf(p).has(m.obj)) return false; if(m.closedFor && p.roles.every(r=>m.closedFor.includes(r) || !(OPEN[r]||[]).includes(m.obj))) return false; return true; }
function resolveRel(v, p){
  if(v==='@me') return p.emp;
  if(v==='@unit') return p.unit;
  if(v==='@unitDown') return unitDown(p.unit);
  return v;
}
const REL_LABEL = { '@me':'я', '@unit':'моё подразделение', '@unitDown':'моё подразделение и ниже' };
function filterLabel(o, fl){
  const f = o.fields[fl.f]; const nm = f?f.name:fl.f;
  if(fl.v && typeof fl.v==='object' && 'today' in fl.v){ const n=fl.v.today; const tx='сегодня'+(n?(n>0?' + ':' − ')+Math.abs(n)+' дн.':'');
    return nm+' '+({le:'≤',lt:'<',ge:'≥'}[fl.op])+' '+tx; }
  const val = REL_LABEL[fl.v] || (f && f.label ? f.label(fl.v) : fl.v);
  return nm+({eq:': ',ne:' ≠ ',has:' ∋ ',in:': '}[fl.op]||': ')+val;
}
function passFilter(o, r, fl, p){
  const f = o.fields[fl.f]; if(!f) return true;
  const x = f.val(r);
  if(f.date){ const lim = T + ((fl.v&&fl.v.today)||0); if(x==null) return false;
    return fl.op==='le'? x<=lim : fl.op==='lt'? x<lim : x>=lim; }
  const v = resolveRel(fl.v, p);
  if(fl.op==='has') return Array.isArray(x) && x.includes(v);
  if(Array.isArray(v)) return v.includes(x);
  if(fl.op==='ne') return x!==v;
  return x===v;
}
/* Охват: область видимости спрашивающего режет сверху; фильтр и параметры только сужают. */
function scopeRows(o, p){
  const rows = o.rows(); if(!o.unitOf) return rows;
  const allowed = new Set(unitDown(p.scope));
  return rows.filter(r=>allowed.has(o.unitOf(r)));
}
function panelApply(o, rows, panel){
  const applied=[], skipped=[];
  ['region','unit','program'].forEach(k=>{ if(!panel || !panel[k]) return;
    const fld = Object.values(o.fields).find(f=>f.panel===k);
    let ok = !!fld;
    if(!fld && o.via==='loan') ok = true; // программа отвечает по своим кредитам
    if(!ok){ skipped.push(k); return; }
    applied.push(k);
    if(fld){ const want = k==='unit' ? new Set(unitDown(panel[k])) : null;
      rows = rows.filter(r=> want ? want.has(fld.val(r)) : fld.val(r)===panel[k]); } });
  return { rows, applied, skipped };
}
function makeCx(p, panel){ let cache=null; return { p, panel,
  loans(){ if(!cache){ cache = panelApply(OBJ.loan, scopeRows(OBJ.loan,p), panel).rows; } return cache; } }; }
function aliveAt(o, r, at){ if(o.created(r)>at) return false; return o.alive ? o.alive(r, at) : true; }
function aggStock(m, rows, at, cx){
  const o = OBJ[m.obj]; let s=0, any=false, mx=0;
  for(const r of rows){ if(!aliveAt(o,r,at)) continue; const v=m.v(r,at,cx); if(v==null) continue; any=true;
    if(m.agg==='max'){ if(v>mx) mx=v; } else s+=v; }
  if(m.nullable && !any) return null;
  return m.agg==='max' ? mx : s*phi(m,at);
}
function aggFlow(m, rows, a, b){ let s=0; for(const r of rows) s+=m.fv(r,a,b); return s; }
function contributes(m, r, at, per, cx){
  const o = OBJ[m.obj];
  if(m.kind==='flow') return per ? m.fv(r, per.from, per.to) : 0;
  if(!aliveAt(o,r,at)) return 0; return m.v(r,at,cx)||0;
}

const NB = ' ';
function grp(s){ return s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
function fmtInt(n){ if(n==null) return '—'; const neg=n<0; const s=grp(String(Math.round(Math.abs(n)))); return (neg?'−':'')+s; }
function fmtDec(n, d){ if(n==null) return '—'; const neg=n<0; let [a,b]=Math.abs(n).toFixed(d).split('.'); return (neg?'−':'')+grp(a)+(b?','+b:''); }
function moneyParts(v){ if(v==null) return ['—','']; const a=Math.abs(v);
  if(a>=1e6) return [fmtDec(v/1e6, a>=1e8?0:1), 'млн сом']; if(a>=1e3) return [fmtDec(v/1e3, a>=1e5?0:1), 'тыс. сом']; return [fmtInt(v), 'сом']; }
function moneyIn(v, ref){ const a=Math.abs(ref||0); if(v==null) return '—';
  if(a>=1e6) return fmtDec(v/1e6, a>=1e8?0:1); if(a>=1e3) return fmtDec(v/1e3, a>=1e5?0:1); return fmtInt(v); }
function fmtMoney(v){ const [a,b]=moneyParts(v); return b?a+NB+b:a; }
function fmtVal(m, v){ if(v==null) return '—'; if(m.money) return fmtMoney(v); if(m.unit==='дн.') return fmtInt(v)+NB+'дн.'; return fmtInt(v); }
function valParts(m, v){ if(v==null) return ['—','']; if(m.money) return moneyParts(v); if(m.unit==='дн.') return [fmtInt(v),'дн.']; return [fmtInt(v), '']; }
function fmtPct(x, d){ return x==null||!isFinite(x) ? '—' : fmtDec(x, d==null?1:d)+NB+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 9. вопрос плитки → ответ статистики ---------- */
const ROWS_LIMIT = 400;
const state = {
  persona:'u-ruk', view:'home', tab:null, panel:{region:'',unit:'',program:''}, wave:3, fail:false, phone:false,
  editing:false, overlays:{}, screens:[], subs:[], notes:[], journal:[], views:{}, calcAt:{}, loading:{},
  draft:null, expand:null, catTab:'pub',
};
function P(){ return personaById(state.persona); }
function tileMetrics(t){ const o=OBJ[t.obj]; return t.m.map(id=>o && o.metrics[id]); }
function usesStale(t, o, flt){ return !!(o.stale && (t.m.some(id=>o.stale.fields.includes(id)) || flt.some(fl=>o.stale.fields.includes(fl.f)))); }
function dateAt(t){ return t.date==='closed' ? CLOSED : t.date==='monthEnd' ? mEnd(CM-1) : T; }
function shiftBase(id){
  const y=Math.floor(CM/12);
  if(id==='pme') return { at:mEnd(CM-1), label:'к '+dsShort(mEnd(CM-1)) };
  if(id==='ys')  return { at:dn(y-1,12,31), label:'к началу года' };
  if(id==='ly')  return { at:mEnd(CM-12), label:'к '+ds(mEnd(CM-12)) };
  return null;
}
const SHIFT_STOCK = [['pme','к концу прошлого месяца'],['ys','к началу года'],['ly','к концу того же месяца прошлого года']];
function shiftOptions(t){
  const ms = tileMetrics(t).filter(Boolean); if(!ms.length) return [];
  const flow = ms.some(m=>m.kind==='flow');
  if(!flow) return SHIFT_STOCK.map(([id,l])=>({id, label:l, ok:true}));
  const per = t.per ? resolvePeriod(t.per) : null;
  if(!per) return [{id:'prev', label:'к предыдущему периоду', ok:false, why:'не выбран период'}];
  if(per.id==='ytd') return [{id:'ytdPrev', label:'к тому же отрезку прошлого года', ok:true}];
  if(per.complete) return [{id:'prev', label:{pm:'м/м — к предыдущему месяцу', pq:'кв/кв — к предыдущему кварталу', py:'г/г — к предыдущему году'}[per.id], ok:true}];
  return [{id:'prev', label:'к предыдущему периоду', ok:false, why:'неполный период не с чем честно сравнить'+(per.id==='m'?' — сравните с планом месяца':'')}];
}
function lightOf(L, v){ if(!L || v==null) return null;
  if(L.bad==='high'){ if(v>L.r) return 'red'; if(L.y!=null && v>L.y) return 'yellow'; return 'green'; }
  if(v<L.r) return 'red'; if(L.y!=null && v<L.y) return 'yellow'; return 'green'; }
function lightText(L, share){ if(!L) return ''; const u = share?' %':''; const op = L.bad==='high'?'>':'<';
  return 'светофор: '+op+' '+fmtDec(L.r, L.r%1?1:0)+u+' — красный'+(L.y!=null?' · '+op+' '+fmtDec(L.y, L.y%1?1:0)+u+' — жёлтый':''); }

function ask(t, p, panel, ov){
  ov = ov || {};
  const o = OBJ[t.obj]; const out = { t, o, p, state:'ok' };
  if(!o){ out.state='broken'; out.why='объект выведен из реестра'; return out; }
  const ms = tileMetrics(t);
  const wd = ms.find(m=>!m || m.withdrawn);
  if(wd){ out.state='broken'; out.why='показатель «'+(wd?wd.name:'?')+'» выведен из реестра'+(wd&&wd.withdrawn?' '+wd.withdrawn:''); return out; }
  if(t.state==='off'){ out.state='off'; out.why='снята администратором '+(t.offD?ds(t.offD):''); return out; }
  if(o.wave > state.wave){ out.state='refuse'; out.why='не отвечается: объект «'+o.name+'» ещё не объявлен в статистике'; out.owner=o.owner; return out; }
  const closed = ms.find(m=>!metricOpen(p,m));
  if(closed){ out.state='noaccess'; out.why='показатель «'+closed.name+'» не открыт вашей роли'; return out; }
  if(state.fail){ out.state='error'; out.why='статистика не ответила'; return out; }
  const pa = panelApply(o, scopeRows(o,p), panel);
  const flt = t.f.concat(ov.f||[]);
  const rows = pa.rows.filter(r=>flt.every(fl=>passFilter(o,r,fl,p)));
  let at = dateAt(t);
  if(usesStale(t,o,flt)){ at = Math.min(at, o.stale.asOf); out.stale = o.stale; }
  const per = t.per ? resolvePeriod(t.per) : null;
  const pe = per ? Object.assign({}, per, { to:Math.min(per.to, at) }) : null;
  const cx = makeCx(p, panel);
  Object.assign(out, { ms, rows, at, per, pe, cx, flt });
  out.visible = pa.rows.filter(r=>aliveAt(o,r,at)).length;
  out.panelApplied = pa.applied; out.panelSkipped = pa.skipped;
  const val = (m, rs)=> m.kind==='flow' ? (pe ? aggFlow(m, rs, pe.from, pe.to) : null) : aggStock(m, rs, at, cx);
  out.val = val;
  out.vals = ms.map(m=>val(m, rows));
  if(t.show.share){ const [a,b]=out.vals; out.share = { num:a, den:b, pct: b ? a/b*100 : null }; }
  // сдвиг — из закрытого списка баз
  if(t.show.shift){
    const opt = shiftOptions(t).find(x=>x.id===t.show.shift);
    if(opt && opt.ok){
      let baseVals, label;
      if(ms[0].kind==='flow'){ const pr = per.prev || per.sameSpan; baseVals = ms.map(m=>aggFlow(m, rows, pr.from, pr.to)); label = pr.label; }
      else { const b = shiftBase(t.show.shift); baseVals = ms.map(m=>aggStock(m, rows, b.at, cx)); label = b.label; }
      const cur = t.show.share ? out.share.pct : out.vals[0];
      const base = t.show.share ? (baseVals[1]? baseVals[0]/baseVals[1]*100 : null) : baseVals[0];
      const delta = cur!=null && base!=null ? cur-base : null;
      const dir = ms[0].dir;
      out.shift = { base, delta, label, pp:!!t.show.share, rel: !t.show.share && base ? delta/base*100 : null,
        good: delta==null||Math.abs(delta)<1e-9 ? null : dir==='good' ? delta>0 : dir==='bad' ? delta<0 : null };
    } else if(opt) out.shiftOff = opt.why;
  }
  // смешанно: незафиксированные месяцы у потока
  if(o.fixedThrough!=null && ms.some(m=>m.kind==='flow') && pe && mIdx(pe.to)>o.fixedThrough) out.unfixed = true;
  if(t.light){ out.color = lightOf(t.light, t.light.on==='share' ? (out.share&&out.share.pct) : out.vals[0]); }
  const dims = ov.dims || t.dims;
  if(['slice','steps','table'].includes(t.fmt) || ov.dims){ out.nodes = groupNodes(o, rows, dims[0], ms, val, flt); out.dim = o.fields[dims[0]]; }
  if(t.fmt==='heat'){ out.heat = heatNodes(o, rows, dims[0], dims[1], ms[0], val); out.dim=o.fields[dims[0]]; out.dim2=o.fields[dims[1]]; }
  if(t.fmt==='series') out.series = seriesOf(t, o, rows, ms, cx, ov.pts);
  if(t.fmt==='flow') out.move = moveOf(t, o, rows, ms[0], pe, at, cx);
  return out;
}
function keysOf(f, r){ const x=f.val(r); return Array.isArray(x)?x:[x]; }
function groupNodes(o, rows, dimId, ms, val, flt){
  const f = o.fields[dimId]; if(!f) return [];
  const map = new Map();
  const own = (flt||[]).filter(fl=>fl.f===dimId); // корзина, исключённая фильтром вопроса, не рисуется
  if(f.ordered) f.ordered.filter(k=>own.every(fl=>fl.op==='ne'?k!==fl.v: fl.op==='eq'?k===fl.v: true)).forEach(k=>map.set(k, []));
  rows.forEach(r=>keysOf(f,r).forEach(k=>{ if(k==null) return; if(!map.has(k)) map.set(k, []); map.get(k).push(r); }));
  let nodes = [...map.entries()].map(([k, rs])=>({ key:k, label:f.label?f.label(k):k, vals:ms.map(m=>val(m, rs)), n:rs.length }));
  if(!f.ordered) nodes.sort((a,b)=>(b.vals[0]||0)-(a.vals[0]||0)); // у упорядоченного разреза порядок объявлен
  return nodes;
}
function heatNodes(o, rows, d1, d2, m, val){
  const f1=o.fields[d1], f2=o.fields[d2];
  const rk = f1.ordered || (f1.values ? f1.values.slice() : [...new Set(rows.map(f1.val))]);
  const ck = f2.ordered || (f2.values ? f2.values.slice() : [...new Set(rows.map(f2.val))]);
  const cells = {}; let max = 0;
  rk.forEach(a=>ck.forEach(b=>{ const rs = rows.filter(r=>f1.val(r)===a && f2.val(r)===b); const v = val(m, rs); cells[a+'|'+b]=v; if(v>max) max=v; }));
  const rowsK = rk.filter(a=>ck.some(b=>cells[a+'|'+b])), colsK = ck.filter(b=>rk.some(a=>cells[a+'|'+b]));
  return { rows:rowsK, cols:colsK, cells, max, f1, f2 };
}
function seriesOf(t, o, rows, ms, cx, ptsOv){
  const n = ptsOv || t.show.pts || 12;
  const pts = [];
  for(let i=n-1;i>=0;i--){ const mi = CM-i;
    const last = mi===CM; const at = last ? T : mEnd(mi); const from = mStart(mi);
    const vals = ms.map(m=> m.kind==='flow' ? aggFlow(m, rows, from, at) : aggStock(m, rows, at, cx));
    const fixed = o.fixedThrough==null || ms.every(m=>m.kind!=='flow') ? true : mi<=o.fixedThrough;
    pts.push({ mi, at, from, label:MON_S[mi%12], last, vals, fixed,
      share: t.show.share ? (vals[1] ? vals[0]/vals[1]*100 : null) : null }); }
  return { pts, fixedN: pts.filter(x=>x.fixed).length };
}
function moveOf(t, o, rows, m, pe, at, cx){
  if(!pe) return null;
  const mv = MOVES[m.move]; if(!mv) return null;
  const start = aggStock(m, rows, pe.from-1, cx), end = aggStock(m, rows, at, cx);
  const days = pe.to-pe.from+1;
  const items = mv.flows.map(([label, dir, src])=>{
    let v = typeof src==='string' ? aggFlow(o.metrics[src], rows, pe.from, pe.to) : (start||0)*src*days/30.4;
    return { label, dir, metric: typeof src==='string'?src:null, v: dir==='out' ? -Math.abs(v) : Math.abs(v) }; });
  const other = end - start - sumBy(items, x=>x.v);
  return { start, end, items, other, fromLabel:dsShort(pe.from-1), toLabel:dsShort(at), ok: Math.abs(start + sumBy(items,x=>x.v) + other - end) < 1 };
}

/* «Кто в этом числе» — строки объектов на дату среза: полный список или отказ. */
function nodeFilter(ans, node){
  const o = ans.o, extra = [];
  if(node && node.dim) extra.push(r=>keysOf(o.fields[node.dim], r).includes(node.key));
  if(node && node.dim2) extra.push(r=>keysOf(o.fields[node.dim2], r).includes(node.key2));
  return r=>extra.every(fn=>fn(r));
}
function statRows(ans, node){
  if(ans.state!=='ok') return { refused:true, why:ans.why };
  const o = ans.o; let ms = ans.ms; let at = ans.at, pe = ans.pe;
  if(node && node.metric) ms = [o.metrics[node.metric]];
  if(node && node.mi!=null){ at = node.mi===CM ? Math.min(T, ans.at) : mEnd(node.mi); pe = { from:mStart(node.mi), to:at }; }
  const nf = nodeFilter(ans, node);
  const list = [];
  ans.rows.forEach(r=>{ if(!nf(r)) return; const vs = ms.map(m=>contributes(m, r, at, pe, ans.cx)); if(vs.some(v=>v)) list.push({ r, vs }); });
  list.sort((a,b)=>(b.vs[0]||0)-(a.vs[0]||0) || (b.vs[1]||0)-(a.vs[1]||0));
  const res = { n:list.length, ms, at, pe, cols:o.cols, list };
  if(list.length > ROWS_LIMIT){ res.refused = true; res.why = fmtInt(list.length)+' строк — сузьте разрезом или возьмите выгрузкой'; res.tooMany = true; }
  return res;
}
/* «Работать со списком» — живой реестр модуля-владельца с фильтром плитки, на сегодня. */
function registry(ans, node){
  if(ans.state!=='ok') return null;
  const o = ans.o, p = ans.p;
  const pa = panelApply(o, scopeRows(o,p), state.panel);
  const nf = nodeFilter(ans, node);
  const live = pa.rows.filter(r=>ans.flt.every(fl=>passFilter(o,r,fl,p)) && nf(r));
  const now = live.filter(r=>ans.ms.some(m=>contributes(m, r, T, ans.per, ans.cx)));
  const sr = statRows(ans, node);
  return { now, srez: sr.n, o };
}

/* ---------- 10. раскладки, перекладка, свои экраны ---------- */
function answering(t){ const o=OBJ[t.obj]; return !!o && o.wave<=state.wave && t.state==='pub' && !tileMetrics(t).some(m=>!m||m.withdrawn); }
function hasLayout(role){ const r=ROLES[role]; return !!LAYOUTS[role] && r.wave!=null && r.wave<=state.wave; }
function declaredFor(role){
  const src = hasLayout(role) ? LAYOUTS[role] : MINIMAL;
  return src.map(s=>({ name:s.name, collapsed:false, items:s.tiles.filter(id=>{ const t=tileById(id); return t && answering(t); }).map(id=>({id})) }))
            .filter(s=>s.items.length || !s.name);
}
function tabsOf(p){
  const tabs = p.roles.filter(r=>!ROLES[r].noTab).map(r=>({ key:'role:'+r, name:ROLES[r].name, role:r, kind:hasLayout(r)?'':'минимальная' }));
  state.screens.filter(s=>s.owner===p.id).forEach(s=>tabs.push({ key:'scr:'+s.id, name:s.name, screen:s, kind:'свой экран' }));
  return tabs;
}
function ovKey(p, tab){ return p.id+'|'+tab; }
function flatIds(secs){ return secs.flatMap(s=>s.items.map(i=>i.id)); }
function viewSections(p, tabKey){
  if(tabKey.startsWith('scr:')){ const s = state.screens.find(x=>'scr:'+x.id===tabKey); return s ? s.sections : []; }
  const role = tabKey.slice(5); const decl = declaredFor(role);
  const ov = state.overlays[ovKey(p, tabKey)];
  if(!ov) return decl;
  // слить: новая плитка роли — в конец, удалённая из объявления — исчезает
  const declIds = flatIds(decl), base = new Set(ov.base);
  const secs = ov.sections.map(s=>({ name:s.name, collapsed:s.collapsed, items:s.items.filter(i=>i.added || declIds.includes(i.id)) }));
  const have = new Set(flatIds(secs));
  const fresh = declIds.filter(id=>!base.has(id) && !have.has(id));
  if(fresh.length){ if(!secs.length) secs.push({name:'', items:[]}); fresh.forEach(id=>secs[secs.length-1].items.push({id, fresh:true})); }
  return secs;
}
function editable(p, tabKey){
  if(tabKey.startsWith('scr:')) return state.screens.find(x=>'scr:'+x.id===tabKey).sections;
  const k = ovKey(p, tabKey);
  if(!state.overlays[k]){ const decl = declaredFor(tabKey.slice(5)); state.overlays[k] = { base:flatIds(decl), sections:JSON.parse(JSON.stringify(decl)) }; }
  else { const cur = viewSections(p, tabKey); state.overlays[k].sections = JSON.parse(JSON.stringify(cur)); state.overlays[k].base = flatIds(declaredFor(tabKey.slice(5))); }
  return state.overlays[k].sections;
}
function locate(secs, id){ for(let si=0; si<secs.length; si++){ const ii = secs[si].items.findIndex(i=>i.id===id); if(ii>=0) return [si, ii]; } return null; }
const LAY = {
  move(id, d){ const secs=editable(P(), state.tab); const at=locate(secs,id); if(!at) return; const [si,ii]=at; const arr=secs[si].items;
    const j=ii+d; if(j>=0 && j<arr.length){ [arr[ii],arr[j]]=[arr[j],arr[ii]]; }
    else if(j<0 && si>0){ secs[si-1].items.push(arr.splice(ii,1)[0]); }
    else if(j>=arr.length && si<secs.length-1){ secs[si+1].items.unshift(arr.splice(ii,1)[0]); } },
  drop(src, target){ if(src===target) return; const secs=editable(P(), state.tab); const a=locate(secs,src); if(!a) return; const it=secs[a[0]].items.splice(a[1],1)[0];
    if(target.startsWith('sec:')){ secs[+target.slice(4)].items.push(it); return; }
    const b=locate(secs,target); if(!b){ secs[a[0]].items.splice(a[1],0,it); return; } secs[b[0]].items.splice(b[1],0,it); },
  hide(id){ const secs=editable(P(), state.tab); const at=locate(secs,id); if(!at) return; const it=secs[at[0]].items[at[1]];
    if(it.added && state.tab.startsWith('role:')){ secs[at[0]].items.splice(at[1],1); return; }
    if(state.tab.startsWith('scr:')){ secs[at[0]].items.splice(at[1],1); return; }
    it.hidden=!it.hidden; },
  add(id){ const secs=editable(P(), state.tab); if(locate(secs,id)) return false; if(!secs.length) secs.push({name:'',items:[]}); secs[secs.length-1].items.push({id, added:true}); return true; },
  addSection(name){ const secs=editable(P(), state.tab); secs.push({ name:name||'Новая секция', collapsed:false, items:[] }); },
  renameSection(si, name){ const secs=editable(P(), state.tab); if(secs[si]) secs[si].name=name; },
  removeSection(si){ const secs=editable(P(), state.tab); if(!secs[si]) return; const items=secs[si].items; secs.splice(si,1); if(secs.length) secs[Math.max(0,si-1)].items.push(...items); else secs.push({name:'',items}); },
  collapse(si){ const secs=editable(P(), state.tab); if(secs[si]) secs[si].collapsed=!secs[si].collapsed; },
  reset(){ delete state.overlays[ovKey(P(), state.tab)]; },
};
function newScreen(p, name, withFilter){
  if(state.screens.filter(s=>s.owner===p.id).length>=5) throw new Error('Своих экранов — не больше пяти');
  const s = { id:'s'+(state.screens.length+1)+'-'+(hash(p.id+name)%1000), owner:p.id, name:name||'Мой экран',
    filter: withFilter ? Object.assign({}, state.panel) : null, sections:[{ name:'', collapsed:false, items:[] }] };
  state.screens.push(s); return s;
}
function placesOf(t){ // где стоит плитка: роли, личные раскладки, свои экраны
  const roles = Object.keys(LAYOUTS).filter(r=>LAYOUTS[r].some(s=>s.tiles.includes(t.id)));
  const pers = Object.values(state.overlays).filter(ov=>ov.sections.some(s=>s.items.some(i=>i.id===t.id && i.added))).length;
  const scr = state.screens.filter(s=>s.sections.some(x=>x.items.some(i=>i.id===t.id))).length;
  return { roles, pers, scr };
}

/* ---------- 11. журнал, подписки ---------- */
function stamp(){ return dsShort(T)+' '+hhmm(clock.min); }
function log(what, named){ state.journal.unshift({ when:stamp(), who: named===false ? null : P().name, what }); }
function viewInc(id){ state.views[id] = (state.views[id]||0)+1; }
function subColor(s){ const p=personaById(s.p), t=tileById(s.t); const a=ask(t, p, null); return a.state==='ok' ? a.color : null; }
function recheckSubs(reason){
  state.subs.forEach(s=>{ const c = subColor(s); if(c && c!==s.color){
    state.notes.unshift({ p:s.p, when:stamp(), t:s.t, from:s.color, to:c, why:reason }); s.color=c; } });
}

/* =====================================================================
   12. показ плитки
   ===================================================================== */
const SIZE = f=>'s-'+(FORMATS[f]?FORMATS[f].size:'1x1');
function nodeAttr(t, node){ return ' data-t="'+esc(t.id)+'" data-node="'+esc(JSON.stringify(node))+'"'; }
function tipAttr(s){ return ' data-tip="'+esc(s)+'"'; }
function passport(ans){
  const t = ans.t, parts = [];
  if(ans.stale) parts.push('<span style="color:#7a5a07">на '+dsShort(ans.at)+' · '+esc(ans.stale.why)+'</span>');
  else if(t.date==='closed') parts.push('на '+dsShort(CLOSED)+' · день закрыт');
  else if(t.date==='monthEnd') parts.push('на '+dsShort(mEnd(CM-1))+' · месяц закрыт');
  else parts.push('на '+hhmm(state.calcAt[t.id]!=null ? state.calcAt[t.id] : clock.min)+' · день не закрыт');
  if(ans.per) parts.push(esc(ans.per.label));
  if(ans.series && ans.series.fixedN < ans.series.pts.length) parts.push(ans.series.fixedN+' из '+ans.series.pts.length+' зафикс.');
  else if(ans.unfixed) parts.push('период не зафиксирован');
  parts.push('видно '+fmtInt(ans.visible));
  const pnl = state.panel;
  if(ans.panelApplied && ans.panelApplied.length) parts.push('<span class="f">фильтр: '+esc(ans.panelApplied.map(k=>k==='unit'?unitName(pnl[k]):pnl[k]).join(', '))+'</span>');

function passportText(ans){ return passport(ans).replace(/<[^>]+>/g,''); }
function shiftHTML(sh){

function bodyNum(ans){

function bodySlice(ans, full){

function bodyFlow(ans){

function bodyHeat(ans, full){

function bodyTable(ans){

const SER_COL = ['var(--series-1)','var(--series-2)','var(--series-3)'];
function bodySeries(ans, full){

  const W=520, H=full?220:92, L=4, Rr=4, Tp=6, B=16;
  const all = lines.flat().filter(v=>v!=null); const max = Math.max(1e-9, ...all), min = share ? Math.min(...all)*0.9 : 0;
  const x = i=>L + (W-L-Rr)*(pts.length===1?0.5:i/(pts.length-1));
  const y = v=>Tp + (H-Tp-B)*(1-(v-min)/(max-min||1));
  const bars = t.show.style==='bars' && lines.length===1;
  let svg = '<svg class="ser" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  svg += '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="rgba(26,57,96,.18)"/>';
  if(bars){ const bw = (W-L-Rr)/pts.length*0.66;
    pts.forEach((p,i)=>{ const v=lines[0][i]||0; const cx=L+(W-L-Rr)*(i+0.5)/pts.length;
      svg += '<rect x="'+(cx-bw/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+Math.max(0,(H-B)-y(v))+'" rx="2" fill="'+SER_COL[0]+'" opacity="'+(p.fixed?(p.last?0.55:1):0.3)+'"/>'; }); }
  else lines.forEach((ln,li)=>{ let d=''; ln.forEach((v,i)=>{ if(v==null) return; d += (d?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); });
    svg += '<path d="'+d+'" fill="none" stroke="'+SER_COL[li]+'" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    ln.forEach((v,i)=>{ if(v==null) return; svg += '<circle class="pt" cx="'+x(i)+'" cy="'+y(v)+'" r="2.6" fill="'+(pts[i].fixed?SER_COL[li]:'#fff')+'" stroke="'+SER_COL[li]+'" vector-effect="non-scaling-stroke"/>'; }); });
  const step = pts.length>12 ? 3 : pts.length>6 ? 2 : 1;
  pts.forEach((p,i)=>{ const cx = bars ? L+(W-L-Rr)*(i+0.5)/pts.length : x(i); const w=(W-L-Rr)/pts.length;
    const tip = (p.last? MON[p.mi%12]+' · по '+dsShort(p.at) : MON[p.mi%12]+' '+Math.floor(p.mi/12)+' · на '+dsShort(p.at)) + (p.fixed?'':' · не зафиксирован')+'\n'+
      (share ? fmtPct(p.share)+' · '+fmtInt(p.vals[0])+' из '+fmtInt(p.vals[1]) : ms.map((m,k)=>m.name+': '+fmtVal(m,p.vals[k])).join('\n'));
    svg += '<rect class="hit" x="'+(cx-w/2)+'" y="0" width="'+w+'" height="'+H+'"'+nodeAttr(t,{mi:p.mi})+tipAttr(tip)+'/>';
    if(i%step===(pts.length-1)%step) svg += '<text x="'+cx+'" y="'+(H-3)+'" text-anchor="middle">'+p.label+'</text>'; });
  svg += '</svg>';
  const leg = '<div class="legend">'+(share?'<span><i style="background:'+SER_COL[0]+'"></i>'+esc(ms[0].name)+' / '+esc(ms[1].name.toLowerCase())+', %</span>':ms.map((m,i)=>'<span><i style="background:'+SER_COL[i]+'"></i>'+esc(m.name)+'</span>').join(''))+
    '<span style="margin-left:auto">'+(share?fmtPct(pts[pts.length-1].share):fmtVal(ms[0], pts[pts.length-1].vals[0]))+' сейчас</span></div>';

}
function stateBody(ans){

function tileBody(ans, full){

  let tools = '';
  if(o.edit) tools = '<div class="edit-tools"><button class="t-btn" onclick="DB.lay(\'move\',\''+t.id+'\',-1)" aria-label="Раньше">←</button><button class="t-btn" onclick="DB.lay(\'move\',\''+t.id+'\',1)" aria-label="Позже">→</button><button class="t-btn" onclick="DB.lay(\'hide\',\''+t.id+'\')"'+tipAttr(o.hidden?'Показать':'Скрыть у себя')+'>'+(o.hidden?'👁':'✕')+'</button></div>';

  }
  if(state.editing) h += '<div class="banner info"><b>Перекладка.</b> Перетащите плитку мышью или стрелками ← →; ✕ — скрыть у себя. Размер задаёт формат. '+
    (tab.role?'Перекладка хранится отдельно от объявленной раскладки роли. ':'')+
    '<div class="btn-row" style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="DB.addDlg()">＋ Плитка из каталога</button><button class="btn btn-secondary btn-sm" onclick="DB.lay(\'addSection\')">＋ Секция</button>'+
    (tab.role?'<button class="btn btn-secondary btn-sm" onclick="DB.lay(\'reset\')">Вернуть как объявлено</button>':'')+'<button class="btn btn-primary btn-sm" onclick="DB.toggleEdit()">Готово</button></div></div>';

  secs.forEach((s, si)=>{
    const items = s.items.filter(i=>state.editing || !i.hidden);
    if(!items.length && !state.editing && s.name) return;
    h += '<div class="dsec" data-sec="'+si+'">';
    if(s.name || state.editing){
      h += '<div class="dsec-h"'+(state.editing?' data-drop="sec:'+si+'"':'')+'>';
      if(state.editing) h += '<input value="'+esc(s.name)+'" placeholder="без названия" onchange="DB.lay(\'renameSection\','+si+',this.value)"><button class="tog" onclick="DB.lay(\'removeSection\','+si+')"'+tipAttr('Убрать секцию; плитки уйдут в предыдущую')+'>✕</button>';
      else h += '<button class="tog" onclick="DB.lay(\'collapse\','+si+')" aria-label="Свернуть">'+(s.collapsed?'▸':'▾')+'</button>'+esc(s.name);
      h += '<span class="line"></span>'+(s.collapsed&&!state.editing?'<span class="small">'+items.length+' плит.</span>':'')+'</div>';
    }
    if(s.collapsed && !state.editing){ h += '</div>'; return; }
    h += '<div class="grid">';
    items.forEach(it=>{ const t = tileById(it.id); if(!t) return; any = true;
      const ans = ask(t, p, panel);
      h += tileHTML(t, ans, { edit:state.editing, hidden:it.hidden, fresh:it.fresh }); });
    if(!items.length || (state.editing && si===secs.length-1)){ slot = true; h += '<button class="addslot s-1x1" onclick="DB.addDlg()">＋ добавить из каталога</button>'; }
    h += '</div></div>';
  });
  if(!slot && (!secs.length || !any)) h += '<div class="grid"><button class="addslot s-1x1" onclick="DB.addDlg()">＋ добавить из каталога</button></div>';
  if(state.phone) h = '<div class="banner info" style="max-width:390px;margin:0 auto 10px">Телефон: сетка складывается в одну колонку, только просмотр — перекладки нет.</div><div class="phone-frame">'+h+'</div>';
  return h;
}

function nodeLabel(ans, node){
  if(!node) return '';
  const parts=[];
  if(node.dim){ const f=ans.o.fields[node.dim]; parts.push(f.name+': '+(f.label?f.label(node.key):node.key)); }
  if(node.dim2){ const f=ans.o.fields[node.dim2]; parts.push(f.name+': '+(f.label?f.label(node.key2):node.key2)); }
  if(node.mi!=null) parts.push(MON[node.mi%12]+' '+Math.floor(node.mi/12));
  if(node.metric) parts.push('оборот «'+ans.o.metrics[node.metric].name+'»');
  return parts.join(' · ');
}
function rowsTable(ans, res, max){
  const cols = res.cols, ms = res.ms; const list = res.list.slice(0, max||res.list.length);

  return h+'</tbody></table>';
}

/* ---------- конструктор плитки ---------- */
const QUEUES = {}; // очереди, которые объявили модули-владельцы
TILES.filter(t=>t.kind==='ref').forEach(t=>{ (QUEUES[t.obj] = QUEUES[t.obj] || []); if(!QUEUES[t.obj].includes(t.ref)) QUEUES[t.obj].push(t.ref); });
function blankDraft(){ return { editingId:null, title:'', obj:'loan', m:['ovd'], dims:[], f:[], date:'today', per:null, fmt:'num', show:{}, light:null, kind:'ov', ref:null }; }
function draftTile(){ const d = state.draft; return Object.assign({ id:'__draft', src:'own', state:'pub', ver:1 }, JSON.parse(JSON.stringify(d)), { title:d.title||'Без подписи' }); }
function formatAvail(d){
  const o=OBJ[d.obj]; const ms=d.m.map(id=>o.metrics[id]).filter(Boolean); const n=ms.length; const share=!!d.show.share;
  const flow = ms.some(m=>m.kind==='flow'), mixed = flow && ms.some(m=>m.kind!=='flow');
  const d0 = d.dims[0] && o.fields[d.dims[0]], d1 = d.dims[1] && o.fields[d.dims[1]];
  const none = !n ? 'выберите показатель' : null;
  const needPer = flow && !d.per ? 'выберите период — среди показателей есть поток' : null;
  const out = {};
  out.num = none || needPer;
  const sh = shiftOptions(d);
  out.numShift = none || needPer || (n>1 && !share ? 'сдвиг считается у одного показателя или у доли' : null) || (sh.some(x=>x.ok) ? null : (sh[0]||{}).why || 'нет базы сдвига');
  out.series = none || (n>3 ? 'в ряду — не больше трёх линий' : null) || (mixed ? 'в одном ряду не смешиваются остатки и потоки' : null);
  out.slice = none || (!d0 ? 'нужен разрез' : null) || (n>1 ? 'в разрезе — один показатель; для нескольких — «Таблица»' : null) || needPer;
  out.steps = none || (!d0 ? 'нужен разрез' : null) || (d0 && !d0.ordered ? 'у разреза «'+d0.name+'» нет объявленного порядка значений' : null) || (n>1 ? 'в ступенях — один показатель' : null) || needPer;
  out.flow = none || (n!==1 ? 'движение — у одного показателя' : null) || (!ms[0].move ? 'показатель «'+ms[0].name+'» не объявил обороты' : null) || (!d.per ? 'выберите период оборотов' : null) || (d.per==='today' ? 'обороты за день статистика не объявила' : null);
  out.heat = none || (!d0 || !d1 ? 'нужны два разреза' : null) || (n!==1 ? 'в тепловой карте — один показатель' : null) || needPer;
  out.table = none || (!d0 ? 'нужен разрез' : null) || needPer;
  if(share){ ['slice','steps','flow','heat','table'].forEach(k=>{ if(!out[k]) out[k]='доля показывается числом, сдвигом или рядом'; }); }
  return out;
}
function autocheck(d){
  const o=OBJ[d.obj]; const ms=d.m.map(id=>o.metrics[id]);
  const fa = formatAvail(d)[d.fmt];
  const a = ask(draftTile(), personaById('u-an'), null);
  return [
    ['Показатели есть в реестре статистики', ms.length>0 && ms.every(m=>m && !m.withdrawn)],
    ['Формат допустим для вопроса', !fa, fa],
    ['Предпросмотр отвечает без отказа', a.state==='ok', a.why],
    ['Ссылки уходят в обратный индекс статистики: '+ms.filter(Boolean).map(m=>o.name+' · '+m.name).join(', '), ms.length>0],
  ];
}
function opt(on, label, act, why, extra){ return '<button class="opt'+(on?' on':'')+'"'+(why?' disabled':'')+' onclick="'+act+'"'+(why?tipAttr(why):'')+'>'+label+(extra||'')+(why?'<span class="why">'+esc(why)+'</span>':'')+'</button>'; }

  if(isAdmin(p)) h += '<button class="btn btn-secondary"'+(canSave?'':' disabled')+' onclick="DB.save(\'draft\')">В каталог черновиком</button><button class="btn btn-secondary"'+(canSave?'':' disabled')+' onclick="DB.save(\'pub\')">Опубликовать в каталог</button>';

  h += '</div></div>';
  return h;
}
function saveDraft(mode){
  const d = state.draft, p = P();
  if(!d.title.trim()) throw new Error('Дайте плитке подпись');
  const fa = formatAvail(d)[d.fmt]; if(fa) throw new Error('Формат недоступен: '+fa);
  const q = { title:d.title.trim(), obj:d.obj, m:d.m.slice(), dims:d.dims.filter(Boolean), f:JSON.parse(JSON.stringify(d.f)), date:d.date, per:d.per||null,
    fmt:d.fmt, show:JSON.parse(JSON.stringify(d.show)), light:d.light?Object.assign({},d.light):null, kind:d.kind, ref:d.kind==='ref'?(d.ref||(QUEUES[d.obj]||[])[0]):undefined };
  if(d.editingId){ const t = tileById(d.editingId);
    if(t.obj===q.obj && t.m.join()===q.m.join()){ Object.assign(t, q); t.ver++; log('Версия '+t.ver+' «'+t.title+'»'+(t.src==='cat'?' — меняется у всех':''));
      state.draft = blankDraft(); toast('Сохранена версия '+t.ver+' «'+t.title+'»','ok'); return t; }
  }
  const src = mode==='own' ? 'own' : 'cat';
  const t = tile(Object.assign(q, { id:(src==='own'?'own-':'cat-')+(TILES.length+1), src, owner:src==='own'?p.id:undefined, author:p.name, created:T, state: src==='own'?'pub':'draft' }));
  if(mode==='pub'){ const bad = autocheckTile(t).filter(c=>!c[1]);
    if(bad.length){ log('Черновик «'+t.title+'»: автопроверка не прошла — '+bad.map(c=>c[0]).join('; ')); toast('Осталась черновиком: '+bad[0][0].toLowerCase(),'err'); }
    else { t.state='pub'; log('Опубликована «'+t.title+'»'); toast('Опубликована в каталог: «'+t.title+'»','ok'); } }
  else if(mode==='draft'){ log('Черновик «'+t.title+'» сохранён'); toast('Черновик в каталоге: «'+t.title+'»','ok'); }
  else { log('Личная плитка «'+t.title+'» собрана'); const tab = tabsOf(p).find(x=>x.role) ; if(tab){ const keep=state.tab; state.tab=tab.key; LAY.add(t.id); state.tab=keep; }
    toast('Личная плитка поставлена в конец вашей раскладки «'+(tab?tab.name:'')+'»','ok'); }
  state.draft = blankDraft(); return t;
}

/* обработчики делегированием: главный клик, клик по узлу, подсказка, перетаскивание */
function onClick(e){
  const nodeEl = e.target.closest('[data-node]');
  if(nodeEl && !e.target.closest('.menu') && !state.editing){
    const tid = nodeEl.dataset.t; const node = JSON.parse(nodeEl.dataset.node||'{}');
    if(tid==='__draft') return;
    e.stopPropagation(); hideTip();
    const t = tileById(tid); if(!t) return;
    if(t.kind==='ref' && !Object.keys(node).length) workDrawer(tid, null, true); else whoDrawer(tid, node);
    return;
  }
  const main = e.target.closest('[data-main]');
  if(main && !state.editing){ const tid = main.dataset.main; if(tid==='__draft') return; const t=tileById(tid); if(!t) return;
    const ans = ask(t, P(), effPanel()); if(ans.state!=='ok' || ans.visible===0) return;
    hideTip(); if(t.kind==='ref') workDrawer(tid, null, true); else whoDrawer(tid, {}); }
}
function hideTip(){ const tip=$('tip'); if(tip) tip.style.display='none'; }
function onOver(e){
  const el = e.target.closest('[data-tip]'); const tip = $('tip');
  if(!el){ tip.style.display='none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display='block';
  const x = Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8), y = Math.min(e.clientY+14, innerHeight-tip.offsetHeight-8);
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
let dragSrc = null;
function onDragStart(e){ const el=e.target.closest('.tile[data-tile]'); if(!el||!state.editing) return; dragSrc = el.dataset.tile; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', dragSrc); }catch(_){} }
function onDragOver(e){ if(!dragSrc) return; const el = e.target.closest('.tile[data-tile], [data-drop]'); if(!el) return; e.preventDefault();
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')); el.classList.add('drop'); }
function onDrop(e){ if(!dragSrc) return; e.preventDefault(); const el = e.target.closest('.tile[data-tile], [data-drop]');
  const target = el ? (el.dataset.tile || el.dataset.drop) : null; const src = dragSrc; dragSrc = null;
  if(target){ LAY.drop(src, target); rerender(); } }
function onDragEnd(){ dragSrc=null; document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')); }
function onKey(e){
  if(e.key==='Escape'){ closeOverlay(); return; }
  const el = e.target.closest && e.target.closest('.tile[data-tile]');
  if(!el) return;
  if(state.editing && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); const id=el.dataset.tile; LAY.move(id, e.key==='ArrowLeft'?-1:1); rerender();
    const again = document.querySelector('.tile[data-tile="'+id+'"]'); if(again) again.focus(); }
  else if(!state.editing && e.key==='Enter'){ const t=tileById(el.dataset.tile); if(t){ if(t.kind==='ref') workDrawer(t.id,null,true); else whoDrawer(t.id,{}); } }
}

/* тихое обновление: раз в 5 минут, только плитки «сегодня» и только пока вкладка видна */
function todayTilesOnScreen(){ const p=P(); if(!state.tab) return []; return flatIds(viewSections(p, state.tab)).map(tileById).filter(t=>t && t.date==='today'); }
function refresh(quiet){
  const ids = todayTilesOnScreen().map(t=>t.id);
  if(quiet){ ids.forEach(id=>state.calcAt[id]=clock.min); rerender(); return ids.length; }
  ids.forEach(id=>state.loading[id]=true); rerender();
  setTimeout(()=>{ ids.forEach(id=>{ delete state.loading[id]; state.calcAt[id]=clock.min; }); rerender(); }, 650);
  return ids.length;
}

    else if(op==='rename'){ L[si].name = ti; log('Раскладка роли «'+ROLES[r].name+'»: секция переименована в «'+ti+'»'); }
    else if(op==='delSec'){ const moved=L[si].tiles; L.splice(si,1); if(L.length) L[Math.max(0,si-1)].tiles.push(...moved); log('Раскладка роли «'+ROLES[r].name+'»: убрана секция'); }
    else if(op==='addSec'){ L.push(S('Новая секция',[])); }
    else if(op==='up' && ti>0){ const a=L[si].tiles; [a[ti-1],a[ti]]=[a[ti],a[ti-1]]; }
    else if(op==='down'){ const a=L[si].tiles; if(ti<a.length-1) [a[ti+1],a[ti]]=[a[ti],a[ti+1]]; }
    else if(op==='del'){ const id=L[si].tiles.splice(ti,1)[0]; log('Раскладка роли «'+ROLES[r].name+'»: убрана «'+tileById(id).title+'» — исчезнет и из личных перекладок'); }
    else if(op==='add' && ti){ L[si].tiles.push(ti); log('Раскладка роли «'+ROLES[r].name+'»: добавлена «'+tileById(ti).title+'» — встанет в конец личных перекладок'); }
    rerender(); },
};
function init(){
  document.addEventListener('click', onClick, true);
  document.addEventListener('mouseover', onOver); document.addEventListener('mousemove', e=>{ if($('tip').style.display==='block') onOver(e); });
  document.addEventListener('dragstart', onDragStart); document.addEventListener('dragover', onDragOver);
  document.addEventListener('drop', onDrop); document.addEventListener('dragend', onDragEnd);
  document.addEventListener('keydown', onKey);
  setInterval(()=>{ if(document.visibilityState==='visible' && state.view==='home'){ refresh(true); } }, 5*60*1000);
  if(innerWidth<640) state.phone = true;
  rerender();
}
if(typeof document!=='undefined') document.addEventListener('DOMContentLoaded', init);
return api;
})();
</script>
