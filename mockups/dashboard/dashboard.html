  resetDeclaredFor:(roleId)=>resetDeclared(roleId), blankDraft, blankReportDraft, reportsFor, pinFromReport, rcheck:checkReportDraft, publishDraftId:publishDraft, declaredEdit, stampOf, tlText, monthClosed,
  // UI
  go:(v)=>{ view=v; if(v!=='catalog') catalogTarget=null; render(); },
  setTab:(kind,id)=>{ S.tab={ kind, id }; view='home'; S.panelTouched=false; if(kind==='role') S.panel={}; render(); },
  switchUser:(id)=>{ S.userId=id; S.tab=null; S.panel={}; S.arrange=false; draft=null; rdraft=null; if(['registry','layouts','journal'].includes(view) && !isAdmin(user())) view='home'; render(); },
  refresh:()=>{ S.cache.clear(); loading=true; render(); setTimeout(()=>{ loading=false; render(); toast('Числа запрошены у статистики заново'); }, 350); },
  setPanel:(k,v)=>{ S.panel[k]=v||undefined; S.panelTouched=true; render(); }, clearPanel:()=>{ S.panel={}; S.panelTouched=true; render(); },
  toggleArrange:()=>{ S.arrange=!S.arrange; render(); },
  move:(key,dir)=>{ if(S.tab.kind==='screen'){ const sc = screenById(S.tab.id); const i = sc.items.indexOf(key), j=i+dir; if(j>=0&&j<sc.items.length){ [sc.items[i],sc.items[j]]=[sc.items[j],sc.items[i]]; } }
    else arrangeMove(curRole(), key, dir); render(); },
  drop:(key,before)=>{ if(S.tab.kind==='screen'){ const sc = screenById(S.tab.id); sc.items = sc.items.filter(k=>k!==key); sc.items.splice(sc.items.indexOf(before),0,key); } else arrangeDrop(curRole(), key, before); render(); },
  hide:(key)=>{ if(S.tab.kind==='screen') screenRemove(S.tab.id, key); else arrangeHide(curRole(), key); render(); },
  unhide:(key)=>{ arrangeUnhide(curRole(), key); render(); }, screenRemove:(key)=>{ screenRemove(S.tab.id, key); render(); },
  toggleSection:(k)=>{ S.collapsed = S.collapsed||{}; S.collapsed[k]=!S.collapsed[k]; render(); },
  addSectionPrompt:()=>{ const n = HAS_DOM ? prompt('Название секции') : 'Секция'; if(!n) return; if(S.tab.kind==='screen') screenById(S.tab.id).items.push('s:'+n); else arrangeSection(curRole(), n); render(); },
  resetDeclared:()=>{ resetDeclared(curRole()); render(); toast('Личная перекладка стёрта целиком'); },
  newScreen:()=>{ const n = HAS_DOM ? prompt('Название своего экрана', 'Мой экран') : 'Мой экран'; if(n===null) return; const r = createScreen(n);
    if(r.error) return toast(r.error); S.tab = { kind:'screen', id:r.id }; S.panel={}; render(); },
  renameScreen:()=>{ const sc = screenById(S.tab.id); const n = prompt('Новое название', sc.name); if(n){ sc.name=n; render(); } },
  deleteScreen:()=>{ deleteScreen(S.tab.id); S.tab=null; S.panel={}; render(); },
  saveScreenFilter:()=>{ screenSaveFilter(S.tab.id); render(); toast('Фильтр сохранён в экран'); },
  openCatalogFor:()=>{ catalogTarget = S.tab; view='catalog'; render(); },
  addFromCatalog:(id)=>{ const tg = catalogTarget || S.tab; if(!tg) return; if(tg.kind==='screen') screenAdd(tg.id, id); else arrangeAdd(tg.id, id); render(); toast('Добавлено в конец раскладки'); },
  catSearch:(q)=>{ S.catQ=q; renderCatalog(); }, catFormat:(f)=>{ S.catF=f; renderCatalog(); },
  primary:(id)=>primaryClick(id), menu:(e,id)=>openMenu(e,id), close:closeOverlay,
  who:(id,d,v,d2,v2)=>{ countClick(id); return openWho(id, d ? { d, v, d2, v2 } : null); },
  whoMonth:(id,m,line)=>{ countClick(id); return openWho(id, line ? { m, line } : { m }); },
  openReport, drill, reportView, reportChangedFor, rowLabel,
  registry:(id)=>openRegistry(id), queue:(id)=>openQueue(id), expand:(id)=>openExpand(id), expandDim:(d)=>{ expandState.dim=d; openExpand(expandState.tile); },
  openExport, downloadCSV,
  exportScreen:()=>{ const u = user(); const items = (S.tab.kind==='screen' ? screenById(S.tab.id).items : composeLayout(u.id, curRole())).filter(k=>tileById(k));
    journal('выгрузил PDF экрана', (S.tab.kind==='screen'?screenById(S.tab.id).name:roleName(curRole()))+' · плиток: '+items.length);
    drawer('Выгрузка экрана — PDF со штампом', `<div class="stamp">Экран: ${esc(S.tab.kind==='screen'?screenById(S.tab.id).name:roleName(curRole()))}<br>Сформировано ${esc(TODAY.label)} · у каждой плитки — свой паспорт<br><b>НЕ ЯВЛЯЕТСЯ ОФИЦИАЛЬНЫМ ДОКУМЕНТОМ. Документ с номером и подписью выпускает модуль «Отчётность».</b><br>Выгрузил: ${esc(u.name)}</div>
      <p><button class="btn primary" onclick="window.print()">Печать в PDF</button></p>`); },
  signal:(id, roleId)=>{ const r = signalToggle(id, roleId || (S.tab ? curRole() : null));
    toast(r.error ? r.error : r ? 'Сигналы поставлены: '+r.map(s=>s.label).join(', ')+' — проверка раз в день после ночного снимка' : 'Сигналы сняты'); render(); return r; }, propose:(id)=>{ const r = propose(id); toast('Предложено администратору дашборда'); render(); return r; },
  openNotifs, signalOff:(id)=>{ const r = signalRemove(id); toast(r ? 'Сигнал снят' : 'Сигнала нет'); openNotifs(); return r; },
  nightCheckRun:()=>{ const f = nightCheck(); toast(f.skipped ? f.skipped : (f.length ? 'Сигналов сработало: '+f.length : 'Сигналы проверены — новых нет')+(f.dropped && f.dropped.length ? ' · снято на изменённых плитках: '+f.dropped.length : '')); render(); return f; },
  tick:(m)=>{ tick(m); render(); toast('Прошло '+m+' мин'); },
  stand:(k,v)=>{ STAND[k]=v; S.cache.clear(); render(); }, standNightOnly:(o,v)=>{ if(v) STAND.nightOnly[o]=true; else delete STAND.nightOnly[o]; S.cache.clear(); render(); },
  standCircle:(on)=>{ const ok = standCircle(on); render(); return ok; },
  standReport:(k)=>{ const r = standReport(k); toast(r.error || r.msg || (k==='reset' ? 'Отчёты возвращены как в каталоге' : k==='delete' ? 'Отчёт удалён'
      : 'Отчёт «'+r.report.title+'»: версия '+r.report.version+', плиток на нём '+r.tiles.length)); render(); return r; },
  standWithdraw:(i,v)=>{ if(v) STAND.withdrawn[i]='11.10'; else delete STAND.withdrawn[i]; S.cache.clear(); render(); },
  // сборка плитки на отчёте
  newDraft:(reportId)=>{ draft = blankDraft(reportId); render(); return draft; },
  pin:(reportId)=>{ const d = pinFromReport(reportId); if(!d){ toast('Отчёт не найден'); return null; } draft = d; view = 'builder'; render(); return d; },
  repSearch:(q)=>{ S.repQ = q; render(); },
  dReport:(id)=>{ if(!reportById(id)){ render(); return toast('Отчёт не найден'); } draft = blankDraft(id); render(); },
  rTake:(id)=>{ const d = rdraft && takeSimilar(rdraft, id); if(!d){ render(); toast('Отчёт не подходит черновику'); return null; } draft = d; view = 'builder'; render(); return d; },
  dParam:(n,v)=>{ const d = tileDraft(); const r = reportById(d.report);
    if(!r || !r.params[n]){ render(); return toast(n==='date' || n==='period' ? 'Отчёт не объявил дату — плитка её не перекраивает' : 'Отчёт не объявил параметр «'+n+'»'); }
    if((n==='date' && !DATE_MODES[v]) || (n==='period' && !PERIODS[v])){ render(); return toast('Такой даты нет'); }
    d.params[n] = v; fitFormat(d); render(); },
  dCol:(id,on)=>{ const d = tileDraft(); const r = reportById(d.report); const k = d.pick; k.cols = pickCols(k, r).slice();
    if(on){ if(k.cols.includes(id)) return render();
      if(!r.cols.includes(id)){ render(); return toast('Колонки «'+(IND[id] ? IND[id].name : id)+'» в отчёте нет'); }
      if(k.cols.length>=4){ render(); return toast('Не больше четырёх колонок'); }
      if((IND[id].kind==='stock') !== (IND[k.cols[0]].kind==='stock')){ render(); return toast('Остаток и поток в одной плитке не складываются: у плитки одна дата или один период'); }
      k.cols.push(id); delete k.pct; }
    else if(k.cols.length>1) k.cols = k.cols.filter(x=>x!==id);
    if(k.share && !(k.cols.length===2 && k.share.every(i=>k.cols.includes(i)))) delete k.share;
    fitFormat(d); render(); },
  dLevel:(n)=>{ const d = tileDraft(); const r = reportById(d.report); n = Number(n) || 0;
    if(n<0 || n>2 || n>r.dims.length){ render(); return toast('В отчёте «'+r.title+'» разрезов: '+r.dims.length+' — такого уровня строк нет'); }
    d.pick.level = n; fitFormat(d); render(); },
  dTop:(n)=>{ tileDraft().pick.top = Math.max(1, Math.round(Number(n) || 3)); render(); },
  dShare:(on)=>{ const d = tileDraft(); const k = d.pick; const cols = pickCols(k, reportById(d.report));
    if(on){ if(cols.length!==2){ render(); return toast('Доля — две колонки отчёта: первая из второй'); } k.share = cols.slice(0, 2); delete k.pct; } else delete k.share;
    fitFormat(d); render(); },
  dPct:(dim,cells)=>{ const d = tileDraft(); const r = reportById(d.report); const k = d.pick;
    if(!dim || !cells || !cells.length){ delete k.pct; fitFormat(d); render(); return; }
    if(!r.dims.includes(dim)){ render(); return toast('«% от итога группы» — только по разрезу отчёта'); }
    k.pct = { dim, cells:cells.slice() }; delete k.share; k.cols = [pickCols(k, r)[0]]; fitFormat(d); render(); },
  dSet:(key,v)=>{ const d = tileDraft(); if(key==='date' || key==='period') return api.dParam(key, v);
    if(key==='format'){ const fm = formatsFor(d).find(x=>x.f===v); if(!fm || !fm.ok){ render(); return toast(fm ? fm.why : 'Такого формата нет'); } d.format = v; }
    else if(key==='shift') d.shift = !v || v==='auto' ? null : v;
    else if(key==='points') d.points = Number(v) || 12;
    else if(key==='mvMonth') d.mvMonth = Number(v) || 0;
    else { render(); return toast('Плитка задаёт значения параметров, выбор из ответа и показ — вопрос правится в отчёте'); }
    fitFormat(d); render(); },
  dTl:(k,op,val)=>{ const d = tileDraft(); d.tl = d.tl || {}; const cur = d.tl[k] || [k==='red'?'>':(d.tl.red?d.tl.red[0]:'>'), 0];
    if(op) cur[0]=op; if(val!==null && val!==undefined){ if(val==='') { delete d.tl[k]; if(!d.tl.red&&!d.tl.yellow) d.tl=null; render(); return; } cur[1]=Number(val); }
    d.tl[k]=cur; render(); },
  dTitle:(v)=>{ tileDraft().title=v; render(); },
  dRoles:(role, on)=>{ const d = tileDraft(); const set = new Set(d.forRoles || []); if(on) set.add(role); else set.delete(role); d.forRoles = [...set]; render(); },
  saveDraft:(mode)=>{ const r = saveTile(tileDraft(), mode); if(r.error){ toast(r.error); return r; }
    if(mode==='personal' && S.tab){ if(S.tab.kind==='screen') screenAdd(S.tab.id, r.tile.id); else arrangeAdd(S.tab.id, r.tile.id); }
    toast(mode==='personal'?'Личная плитка добавлена в конец вкладки':mode==='draft'?'Черновик сохранён':'Плитка опубликована в каталог'); draft=null; view = mode==='personal'?'home':'registry'; render(); return r; },
  // черновик отчёта: вопрос собирает только конструктор отчётности
  newReportDraft:()=>{ rdraft = blankReportDraft(); condDraft = { f:'', op:'', v:null }; render(); return rdraft; },
  // «Собрать новый отчёт»: ящик конструктора отчётности поверх страницы; прежний черновик сохраняется, пока его не сохранили или не начали заново
  openRC:()=>{ if(!rdraft){ rdraft = blankReportDraft(); condDraft = { f:'', op:'', v:null }; } view = 'builder'; rcOpen = true; render(); return rdraft; },
  rSet:(k,v)=>{ if(k==='obj'){ const first = Object.values(IND).find(x=>x.obj===v && !x.refuses); rdraft = Object.assign(blankReportDraft(), { obj:v, inds:[first.id] }); rdraft.filter = defaultFilterOf(rdraft); condDraft = { f:'', op:'', v:null }; }
    else { const rd = reportDraft(); if(k==='share') rd.share = v ? rd.inds.slice(0,2) : null; else if(k==='shift') rd.shift = v==='auto'?null:v; else rd[k]=v; }
    const fs = formatsOfQ(rdraft); const fm = fs.find(x=>x.f===rdraft.format); if(!fm || !fm.ok){ const ok = fs.find(x=>x.ok); rdraft.format = ok ? ok.f : 'number'; } render(); },
  rInd:(id,on)=>{ const rd = reportDraft(); const wasDefault = sameJson(rd.filter, defaultFilterOf(rd));
    if(on){ const sameKind = (IND[id].kind==='stock') === (IND[rd.inds[0]].kind==='stock');
      if(sameKind && rd.inds.length>=4){ render(); return toast('Не больше четырёх показателей'); }
      if(!sameKind && rd.inds.length>1){ render(); return toast('Остаток и поток в одном отчёте не складываются: у отчёта одна дата или один период — сначала снимите прежние показатели'); }
      if(sameKind) rd.inds.push(id); else rd.inds = [id];            // единственный показатель другого рода — отчёт меняет род
    } else if(rd.inds.length>1) rd.inds = rd.inds.filter(x=>x!==id);
    if(wasDefault) rd.filter = defaultFilterOf(rd);                 // фильтр, который пользователь правил, не трогаем
    if(rd.share && rd.inds.length!==2) rd.share=null; api.rSet('format', rd.format); },
  rDim:(d,on)=>{ const rd = reportDraft(); rd.dims = on ? [...rd.dims, d].slice(-2) : rd.dims.filter(x=>x!==d); api.rSet('format', rd.format); },
  rFilter:(f,v)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter(c=>!(c.f===f && paramLabel(c.v))); if(v) rd.filter.push({ f, op:String(v).startsWith('@today+') ? 'le' : 'eq', v }); render(); },
  rCond:(target,k,v)=>{ const rd = reportDraft(); if(condDraft.target!==target) condDraft = { target, f:'', op:'', v:null };
    if(k==='f'){ const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===v); condDraft = { target, f:v, op: F ? (F.dim ? 'eq' : 'gt') : '', v:null }; }
    else if(k==='op'){ condDraft.op = v; if(v!=='in' && v!=='nin' && Array.isArray(condDraft.v)) condDraft.v = condDraft.v[0] || null; }
    else condDraft.v = v; render(); },
  rCondAdd:(target)=>{ const rd = reportDraft(); const c = condDraft; if(c.target!==target || !c.f || !c.op) return toast('Выберите поле, сравнение и значение');
    const F = condFields(IND[rd.inds[0]].obj).find(x=>x.k===c.f); let v = c.v;
    if(F.dim){ v = [].concat(v===null||v===undefined ? [] : v).filter(x=>x!==''); if(!v.length) return toast('Выберите значение'); if(c.op==='eq'||c.op==='ne') v = v[0]; }
    else { if(v===null || v==='' || isNaN(Number(v))) return toast('Введите число'); v = Number(v); }
    const cond = { f:c.f, op:c.op, v };
    rd.filter = [...rd.filter, cond];   // условия складываются по «и»: можно задать полосу «> 30 и ≤ 90»
    condDraft = { f:'', op:'', v:null }; render(); return cond; },
  rCondDel:(target,i)=>{ const rd = reportDraft(); rd.filter = rd.filter.filter((_,j)=>j!==i); render(); },
  rTitle:(text)=>api.rSet('title', text),
  rSaveAndPlace:()=>{ const r = saveAndPlace(reportDraft(), curRole());
    if(r.error){ const f = (r.checks || []).find(c=>!c.ok); toast(r.error+(f ? ': '+f.text : '')); render(); return r; }
    toast('Личный отчёт «'+r.report.title+'» собран, плитка на нём добавлена в конец вкладки'); rdraft = null; draft = null; condDraft = { f:'', op:'', v:null }; view = 'home'; render(); return r; },
  // администратор
  withdrawAsk:(id)=>{ const t = tileById(id); const w = whereUsed(id);
    drawer('Снять плитку «'+esc(t.title)+'»', `<p>Плитка уйдёт из каталога и из раскладок ролей. В личных раскладках останется заглушка «снята администратором».</p>
      <div class="kv"><div class="k">Раскладки ролей</div><div>${w.roles.map(roleName).join(', ')||'—'}</div><div class="k">Личных раскладок</div><div>${w.personal}</div><div class="k">Своих экранов</div><div>${w.screens}</div></div>
      <button class="btn danger" onclick="DB.withdrawDo('${id}')">Снять</button>`); },
  withdrawDo:(id)=>{ withdraw(id); closeOverlay(); render(); toast('Плитка снята'); },
  moveToCatalog:(id)=>{ const r = moveToCatalog(id); render(); toast(r && r.error ? r.error : r ? 'Перенесена в каталог' : 'Переносит только администратор дашборда'); return r; }, publishDraft:(id)=>{ const r = publishDraft(id); if(r&&r.error) toast(r.error); render(); },
  layoutRole:(r)=>{ S.layoutRole=r; render(); }, declMove:(r,k,d)=>{ declaredEdit(r,'move',k,d); render(); }, declRemove:(r,k)=>{ declaredEdit(r,'remove',k); render(); },
  declAdd:(r,k)=>{ const x = declaredEdit(r,'add',k); if(x && x.error) toast(x.error); render(); }, toast,
};
seed();
if(HAS_DOM){ document.addEventListener('DOMContentLoaded', render);
  // тихое обновление: раз в 5 минут, только пока вкладка видна; плитки на закрытую дату остаются в кэше
  setInterval(()=>{ if(document.visibilityState==='visible' && view==='home'){ tick(5); render(); } }, 5*60*1000); }
return api;
})();
</script>
